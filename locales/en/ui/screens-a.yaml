sa.prologue.title: Prologue
sa.prologue.lead: First, remember where you stood when the incident was reported.
sa.prologue.explain: What you write here and your prediction will appear again at the end of the play. They are there so you can compare your first view with what you think after experiencing the incident yourself. Both are optional.
