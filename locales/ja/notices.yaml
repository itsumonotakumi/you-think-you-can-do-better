# 固定の注記（設計書 9章）。シナリオ側の文章で上書きできない。
criminal: サイバー攻撃で悪いのは、攻撃した犯罪者です。被害に遭った企業や人を責めるためのツールではありません。
fiction: この物語はフィクションです。実在の団体・人物とは関係ありません。
score: このシミュレーターで高得点が取れても、現実の対応が正しいとは限りません。採点は学ぶための目安です。
purpose: インシデントレスポンスについて学び、興味を持ち、事件のときの批判と対応を理解できるようになるためのツールです。実在の企業を批判するものではありません。
voices: ゲーム内の批判は、事件のときに現実に起きがちな反応を再現したもので、制作者の見解ではありません。
replay: 繰り返しで点が上がるのは当然です。現実の事件に2回目はありません。
