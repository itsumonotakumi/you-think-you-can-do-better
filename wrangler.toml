# Cloudflare Pages + D1（ランキング API #7）
# フロントは GitHub Pages 版と共通の dist をそのまま置く。
name = "yattemite"
pages_build_output_dir = "dist"
compatibility_date = "2026-11-01"

# D1 の database_id は `npx wrangler d1 create yattemite-ranking` の出力で置き換える
[[d1_databases]]
binding = "DB"
database_name = "yattemite-ranking"
database_id = "922e0961-aabe-469e-b7e4-f96699bb97f7"

[vars]
# 既定は Turnstile 必須。秘密鍵が無ければ 503 で書き込みを止める。
# 検証の省略はローカル開発だけ（.dev.vars に ALLOW_NO_TURNSTILE="true" を置く。ここには書かない）。
REQUIRE_TURNSTILE = "true"
# siteverify が返す hostname の許可リスト（カンマ区切り）
ALLOWED_HOSTS = "yattemite.pages.dev,localhost"
# 1日の登録件数上限（無料枠の安全装置）。超えたら 503
DAILY_WRITE_LIMIT = "20000"
# 同じ IP ハッシュが 1 日に登録できる件数
MAX_REGISTRATIONS_PER_IP = "20"

# 秘密鍵は wrangler secret put で設定する（このファイルには書かない）
#   TURNSTILE_SECRET  Turnstile のシークレットキー（未設定なら書き込みは 503）
#   IP_HASH_SECRET    IP の HMAC 用の鍵（未設定なら書き込みは 503）
