        explain: { ja: '件数を待つ間に、速報の期限が過ぎます。1,200人分の個人データは、確定前でも報告の対象です。', en: '' }
        minutes: 240
        category: hurt
        points: -150
        refs: [ppc-report-prelim]
        gauges: { flame: 12, trust: -12 }
        items:
          - { id: e05-a1, points: -12, axis: time, refs: [ppc-report-prelim] }
          - { id: e05-a2, points: -8, axis: record, refs: [ppc-report-scope] }
      - id: e05-c
        text: { ja: '委員会に電話で相談し、報告の要否を確認してから決める。', en: '' }
        explain: { ja: '相談は無駄ではありませんが、確認を待つ間に期限は近づきます。相談と並行して、分かっている範囲を出すべきです。', en: '' }
        minutes: 90
        category: maintain
        points: 20
        refs: [ppc-report-prelim]
        gauges: { trust: 3 }
        coward: true
        items:
