        explain: { ja: '証拠を残したうえで、事業者に削除と学習の停止を求めています。書面なら、依頼した事実と回答を後から示せます。', en: '' }
        minutes: 180
        category: recover
        points: 120
        refs: [jpcert-handling, no10-ppc-genai]
        gauges: { damage: -8, trust: 8, stamina: -10 }
        setFlags: { deletionRequested: true, evidenceKept: true }
        items:
          - { id: e06-c1, points: 10, axis: record, refs: [jpcert-handling] }
          - { id: e06-c2, points: 8, axis: content, refs: [no10-ppc-genai] }
      - id: e06-c
        text: { ja: '事業者に電話で削除を頼み、依頼した記録は一切残さない。', en: '' }
