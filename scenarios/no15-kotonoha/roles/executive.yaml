        text: { ja: '顧客への個別説明だけで済ませ、公表はしない。', en: '' }
        explain: { ja: '報道が出た後に黙ると、隠していると受け取られます。顧客以外の人には、説明の機会がありません。', en: '' }
        minutes: 90
        category: hurt
        points: -140
        refs: [meti-disclosure-guidance]
        gauges: { flame: 15, trust: -12 }
        coward: true
        setFlags: { noDisclosure: true }
        items:
          - { id: e07-a1, points: -12, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: e07-a2, points: -8, axis: care, refs: [ppc-notify-person] }
      - id: e07-b
        text: { ja: '顧客への通知とニュースリリースを出し、事実を公表する。', en: '' }
        explain: { ja: '顧客への通知と公表を揃えています。何が起きたかを自分たちの言葉で説明でき、憶測を減らせます。', en: '' }
