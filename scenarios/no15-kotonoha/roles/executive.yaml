# No.15 シラカバソフトウェア / 経営者ロール
# 判断ポイント15、細目は choices[].items と drafts の合計で80以上。
estimateMinutes: 30
intro: { ja: 'あなたはシラカバソフトウェアの社長。別件の障害調査の途中で、社員が顧客の設計情報と個人情報を外部の生成AIに入力していたことが分かった。便利さを止めるのか、使い方を直すのか。判断が始まる。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-prelim
    ref: ppc-report-prelim
    label: { ja: '個人情報保護委員会への速報', en: '' }
    points: -150
    doneFlag: prelimFiled
  - id: dl-final
    ref: ppc-report-final
    label: { ja: '個人情報保護委員会への確報', en: '' }
    points: -150
    doneFlag: finalFiled
events:
  - id: ev-news
    at: { day: 1, minutes: 1200 }
    voices: [v-ev-news]
    gauges: { flame: 5 }
    sound: { se: [notify_news] }
    caption: { ja: '業界紙の速報が、顧客の設計情報が外部AIに入力されていたと報じた。', en: '' }
  - id: ev-client
    at: { day: 3, minutes: 600 }
    voices: [v-ev-client]
    gauges: { flame: 5 }
    sound: { se: [phone_ring] }
    caption: { ja: '顧客の情報システム部から、こちらの情報は大丈夫かという電話が入った。', en: '' }
points:
  - id: p01-call
    at: { day: 0, minutes: 615 }
    phase: detect
    sound: { se: [phone_ring] }
    text: { ja: '午前10時15分。開発本部長の更科が社長室に入ってきた。別件で調べていた物流システムの不具合を追ううちに、担当者が顧客の設計情報を外部の生成AIに入力していたことが分かったという。', en: '' }
    voices: [v01-law, v01-ok]
    notable:
      - { id: note-scope, text: { ja: '入力が確認できたのは、設計情報12件、ソースコード5件、テスト用の個人情報1,200人分。', en: '' } }
    lesson: { ja: '第一報では、事実の確認と手を止める判断を同時に行います。利用の停止、影響範囲の調査、対策本部の設置をその場で決めます。報告を待つ間に、入力は続くからです。手を止める判断を先にします。', en: '' }
    choices:
      - id: e01-a
        text: { ja: '利用を止めさせ、影響範囲の調査と対策本部の設置を指示する。', en: '' }
        explain: { ja: '止めることと調べることを同時に決めています。入力が続く間に情報は増えるため、初動で手を止める判断が被害を抑えます。', en: '' }
        minutes: 60
        category: recover
        points: 130
        refs: [no10-ai-guideline, cissp-cbk-secops]
        gauges: { damage: -10, trust: 8, stamina: -10 }
        setFlags: { stoppedUse: true, taskForce: true }
        items:
          - { id: e01-c1, points: 10, axis: order, refs: [cissp-cbk-secops] }
          - { id: e01-c2, points: 8, axis: content, refs: [no10-ai-guideline] }
      - id: e01-b
        text: { ja: '詳しい報告が揃うまで、明日の経営会議で議論することにする。', en: '' }
        explain: { ja: '一晩置く間に、入力は続き範囲も広がります。判断を会議に任せると、初動の責任も曖昧になります。', en: '' }
        minutes: 240
        category: hurt
        points: -120
        refs: [cissp-cbk-secops]
        gauges: { damage: 12, trust: -8 }
        coward: true
        delayed:
          - { afterPhases: 1, points: -40, gauges: { damage: 10 }, reason: { ja: '止めなかった一晩で、別の案件でも顧客情報の入力が見つかった。', en: '' } }
        items:
          - { id: e01-a1, points: -10, axis: content, refs: [cissp-cbk-secops] }
          - { id: e01-a2, points: -8, axis: time, refs: [jpcert-handling] }
      - id: e01-c
        text: { ja: '自分で開発部へ行き、入力した本人から直接事情を聞く。', en: '' }
        explain: { ja: '本人の話を聞くこと自体は悪くありませんが、社長が現場に入ると調査の指揮が止まります。まず体制を決めるべき場面です。', en: '' }
        minutes: 90
        category: hurt
        points: -60
        refs: [meti-csm-guideline]
        gauges: { stamina: -10, trust: 3 }
        items:
          - { id: e01-b1, points: -8, axis: order, refs: [meti-csm-guideline] }
          - { id: e01-b2, points: -5, axis: record, refs: [jpcert-handling] }

  - id: p02-ban
    at: { day: 0, minutes: 960 }
    phase: contain
    sound: { se: [notify_chat] }
    text: { ja: '夕方、全社への通達をどうするか。現場からは「明日の納品に間に合わなくなる」と声が上がっている。私用のアカウントで使っている社員もいるらしい。', en: '' }
    voices: [v02-popular, v02-ok]
    lesson: { ja: '禁止だけを出すと、利用はやめずに隠れます。会社が管理する環境を用意し、入力してよい情報を決めるのが基本です。禁止と放任のどちらも、現場の判断を放置します。安全に使える道を、先に用意します。', en: '' }
    choices:
      - id: e02-a
        text: { ja: '全社に外部AIの利用禁止を通達し、私用端末の利用も禁じる。', en: '' }
        explain: { ja: '禁止は速く見えますが、隠れ利用を増やします。現場は納期のために、見つからない方法を選び始めます。', en: '' }
        minutes: 60
        category: hurt
        points: -120
        refs: [no10-ipa-genai]
        gauges: { flame: 8, trust: -8 }
        setFlags: { bannedAll: true }
        delayed:
          - { afterPhases: 1, points: -50, gauges: { damage: 8, trust: -8 }, reason: { ja: '禁止の翌週、私用端末で顧客のコードを入力した社員が見つかった。', en: '' } }
        items:
          - { id: e02-a1, points: -10, axis: content, refs: [no10-ipa-genai] }
          - { id: e02-a2, points: -8, axis: order, refs: [no10-ai-guideline] }
      - id: e02-b
        text: { ja: '禁止はせず、会社の管理する環境だけを使わせ、入力できる情報を決める。', en: '' }
        explain: { ja: '禁止一辺倒ではなく、使える道を用意しています。入力の区分を決めることで、現場は迷わず仕事を続けられます。', en: '' }
        minutes: 120
        category: recover
        points: 130
        refs: [no10-ipa-genai, no10-ai-guideline]
        gauges: { damage: -8, trust: 8, stamina: -10 }
        setFlags: { safeEnv: true, stoppedUse: true }
        items:
          - { id: e02-c1, points: 10, axis: content, refs: [no10-ipa-genai] }
          - { id: e02-c2, points: 8, axis: order, refs: [no10-ai-guideline] }
      - id: e02-c
        text: { ja: '「機密情報は入力しない」と通達し、あとは現場の判断に任せる。', en: '' }
        explain: { ja: '何が機密かの判断を現場に戻しています。基準がなければ、便利さの前に対応は変わらず、同じ入力が続きます。', en: '' }
        minutes: 45
        category: maintain
        points: 20
        refs: [no10-ipa-genai]
        gauges: { trust: 2 }
        setFlags: { vagueRule: true }
        items:
          - { id: e02-b1, points: -5, axis: content, refs: [no10-ipa-genai] }
          - { id: e02-b2, points: 5, axis: order, refs: [no10-ai-guideline] }

  - id: p03-customer
    at: { day: 1, minutes: 540 }
    phase: notify
    sound: { se: [phone_ring] }
    text: { ja: '朝、顧客への連絡をどうするか。営業本部長は「まだ範囲が確定していない」と言い、法務は「契約上の責任を先に確認したい」と言う。', en: '' }
    voices: [v03-coward, v03-ok]
    notable:
      - { id: note-customer, text: { ja: '顧客への説明は、影響の大きい5社から順に訪問で行った。', en: '' } }
    lesson: { ja: '顧客には、範囲の確定を待たずに第一報を出します。担当役員が訪問し、出た情報と再発防止を文書で示します。黙っている間にも、顧客のシステムは動いています。第一報は、待たずに出します。', en: '' }
    choices:
      - id: e03-a
        text: { ja: '担当役員と開発本部長が訪問し、出た情報と再発防止を文書で説明する。', en: '' }
        explain: { ja: '範囲が確定する前でも、分かっている事実と今後の進め方を伝えられます。訪問と文書は、顧客が社内で説明する材料になります。', en: '' }
        minutes: 180
        category: recover
        points: 120
        refs: [meti-disclosure-guidance, ppc-notify-person]
        gauges: { damage: -8, trust: 10, stamina: -10 }
        setFlags: { customerTold: true }
        items:
          - { id: e03-c1, points: 10, axis: order, refs: [meti-disclosure-guidance] }
          - { id: e03-c2, points: 8, axis: care, refs: [ppc-notify-person] }
      - id: e03-b
        text: { ja: 'メールで一斉に通知し、問い合わせがあれば個別に応じる。', en: '' }
        explain: { ja: '連絡の手間は減りますが、影響の大きい顧客ほど、メールだけでは説明になりません。問い合わせが来るまで、相手は動けません。', en: '' }
        minutes: 90
        category: hurt
        points: -100
        refs: [meti-disclosure-guidance]
        gauges: { flame: 8, trust: -8 }
        delayed:
          - { afterPhases: 1, points: -40, gauges: { trust: -8 }, reason: { ja: '大口顧客から、なぜ電話一本ないのかと抗議が来た。', en: '' } }
        items:
          - { id: e03-a1, points: -10, axis: care, refs: [meti-disclosure-guidance] }
          - { id: e03-a2, points: -8, axis: order, refs: [meti-disclosure-guidance] }
      - id: e03-c
        text: { ja: '範囲が確定するまで顧客には伝えず、黙って調査を続ける。', en: '' }
        explain: { ja: '確定を待つ判断は、顧客から情報を取り上げたままにします。後から知った顧客の不信は、説明の遅れとして残ります。', en: '' }
        minutes: 120
        category: hurt
        points: -150
        refs: [meti-disclosure-guidance]
        gauges: { flame: 12, trust: -15 }
        coward: true
        setFlags: { hidFromCustomer: true }
        items:
          - { id: e03-b1, points: -12, axis: care, refs: [meti-disclosure-guidance] }
          - { id: e03-b2, points: -8, axis: wording, refs: [jpcert-handling] }

  - id: p04-punish
