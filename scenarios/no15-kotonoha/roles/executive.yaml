    sound: { se: [notify_chat] }
    text: { ja: '午後2時。入力した五名の処分をどうするか。人事部長は厳罰を求め、開発本部長は「本人は納期のためにやった」と庇う。社内には、誰がやったのかという噂が流れている。', en: '' }
    voices: [v04-boss, v04-ok]
    lesson: { ja: '処分を先に決めると、同じことをした人が黙ります。本人から経緯を聞き、再発防止の仕組みづくりに参加してもらう方が、次の入力を見つけられます。処分と再発防止は、分けて考えます。', en: '' }
    choices:
      - id: e04-a
        text: { ja: '入力した五名を懲戒処分にし、全社に厳罰で示す。', en: '' }
        explain: { ja: '厳罰は規律を示しますが、現場は隠す方を選びます。入力の実態が見えなくなり、再発防止の材料も失います。', en: '' }
        minutes: 120
        category: hurt
        points: -150
        refs: [no10-ai-guideline]
        gauges: { flame: 10, trust: -12 }
        setFlags: { punishedEmployee: true }
        delayed:
          - { afterPhases: 1, points: -40, gauges: { trust: -8 }, reason: { ja: '処分のあと、私用アカウントの利用を申告する社員が誰もいなくなった。', en: '' } }
        items:
          - { id: e04-a1, points: -12, axis: care, refs: [no10-ai-guideline] }
          - { id: e04-a2, points: -8, axis: record, refs: [meti-csm-guideline] }
      - id: e04-b
        text: { ja: '本人から経緯を聞き、再発防止の役割を担ってもらう。', en: '' }
        explain: { ja: '本人の話を聞くことで、なぜその入力が必要だったかが見えます。当事者を仕組みづくりに入れると、現場の実態に合った対策になります。', en: '' }
        minutes: 150
        category: recover
        points: 110
        refs: [no10-ai-guideline, meti-csm-guideline]
        gauges: { trust: 8, stamina: -8 }
        setFlags: { employeeInvolved: true }
        items:
          - { id: e04-c1, points: 10, axis: care, refs: [no10-ai-guideline] }
          - { id: e04-c2, points: 8, axis: content, refs: [meti-csm-guideline] }
      - id: e04-c
        text: { ja: '処分も聴取もせず、口頭の注意だけで終える。', en: '' }
        explain: { ja: '注意だけで終えると、なぜ起きたのかは分からないままです。本人も周囲も、何が問題だったかを学べません。', en: '' }
        minutes: 45
        category: maintain
        points: 20
        refs: [meti-csm-guideline]
        gauges: { trust: -2 }
        items:
          - { id: e04-b1, points: -8, axis: record, refs: [meti-csm-guideline] }
          - { id: e04-b2, points: -5, axis: content, refs: [no10-ai-guideline] }

  - id: p05-prelim
    at: { day: 2, minutes: 600 }
    phase: notify
    sound: { se: [notify_news] }
    text: { ja: '午前10時。個人情報保護委員会への報告をどうするか。テスト用とはいえ、顧客の利用者1,200人分の氏名と連絡先が入力されている。件数はまだ確定していない。', en: '' }
    voices: [v05-law, v05-ok]
    lesson: { ja: '個人データの漏えい等は、分かった時点で速報を出します。1,200人分なら件数だけで報告対象です。不明点は調査中と書けばよく、確定を待つ理由にはなりません。早く出すことが、被害を減らします。', en: '' }
    choices:
      - id: e05-a
        text: { ja: '分かっている範囲で速報を出し、不明点は調査中と書く。', en: '' }
        explain: { ja: '確定前でも、分かった事実を早く出しています。速報の目的は件数の断定ではなく、被害の拡大を早く知らせることです。', en: '' }
