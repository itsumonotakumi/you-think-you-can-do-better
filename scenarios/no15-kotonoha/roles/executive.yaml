    lesson: { ja: '事件の後は、使わないことが正解になります。報告した人を責めず、迷ったら相談できる窓口を残し、使ってよい例を共有します。萎縮させると、現場は再び隠れて使います。使える環境を残すことが、再発を防ぎます。', en: '' }
    choices:
      - id: e15-a
        text: { ja: '入力の判断を自分で報告させ、報告した人を減点しないと明言する。', en: '' }
        explain: { ja: '報告を責めないと決めることで、隠れ利用を防げます。現場が自分から相談できるようになり、危ない入力も早く見つかります。', en: '' }
        minutes: 240
        category: increase
        points: 320
        fatalAlternate: 40
        refs: [no10-ipa-genai, no10-ai-guideline]
        gauges: { damage: -12, flame: -10, trust: 20, stamina: -12 }
        setFlags: { speakUp: true, safeEnv: true }
        items:
          - { id: e15-c1, points: 10, axis: care, refs: [no10-ipa-genai] }
          - { id: e15-c2, points: 8, axis: content, refs: [no10-ai-guideline] }
      - id: e15-b
        text: { ja: 'もう一度禁止にして、当分は現場にAIを使わせない。', en: '' }
        explain: { ja: '禁止は短期的に安心ですが、現場は仕事のために別の方法を探します。使わない理由を説明できず、萎縮だけが残ります。', en: '' }
        minutes: 60
        category: hurt
        points: -70
        refs: [no10-ipa-genai]
        gauges: { trust: -8, stamina: -5 }
        coward: true
        items:
          - { id: e15-a1, points: -10, axis: care, refs: [no10-ipa-genai] }
          - { id: e15-a2, points: -5, axis: content, refs: [no10-ai-guideline] }
      - id: e15-c
        text: { ja: '便利な道具を配るだけで、ルールの見直しはしない。', en: '' }
        explain: { ja: '道具だけを配ると、入力の判断は現場に戻ります。何を入れてよいかが曖昧なまま、同じ事故の余地が残ります。', en: '' }
        minutes: 60
        category: hurt
        points: -90
        refs: [no10-ai-guideline]
        gauges: { damage: 8, trust: -8 }
        items:
          - { id: e15-b1, points: -10, axis: content, refs: [no10-ai-guideline] }
          - { id: e15-b2, points: -5, axis: order, refs: [no10-ipa-genai] }

drafts:
  executive-report:
    title: { ja: '調査報告書の公開版', en: '' }
    slots:
      - id: timing
        label: { ja: '公表の時期', en: '' }
        auto: true
        items:
          - { id: ed-t-30d, when: { withinHours: 720 }, points: 10, axis: time, refs: [meti-disclosure-guidance] }
          - { id: ed-t-45d, when: { withinHours: 1080 }, points: 3, axis: time, refs: [meti-disclosure-guidance] }
          - { id: ed-t-late, when: { otherwise: true }, points: -15, axis: time, refs: [meti-disclosure-guidance] }
      - id: scope
        label: { ja: '対象の書き方', en: '' }
        options:
          - { id: ed-s-names, text: { ja: '顧客名は伏せ、業種と規模だけを書く', en: '' }, points: -10, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '顧客名を伏せると、どの顧客が影響を受けたか分かりません。顧客自身も、自分の案件かどうかを判断できません。', en: '' } }
          - { id: ed-s-range, text: { ja: '設計情報とソースコードだけを対象として書く', en: '' }, points: -15, axis: content, refs: [ppc-report-scope], explain: { ja: '個人情報を対象から外すと、1,200人分の入力が報告から抜けます。後から範囲の訂正が必要になります。', en: '' } }
          - { id: ed-s-all, text: { ja: '顧客ごとの影響と、入力した情報の種類を書く', en: '' }, points: 10, axis: content, refs: [ppc-report-scope], explain: { ja: '顧客ごとに何が出たかを書くと、相手は自分の影響を確認できます。報告の範囲も明確になります。', en: '' } }
      - id: content
        label: { ja: '何が起きたか', en: '' }
        options:
          - { id: ed-c-vague, text: { ja: '「情報管理の不備がありました」とだけ書く', en: '' }, points: -10, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '「情報管理の不備」だけでは、何が外に出たのか分かりません。顧客は自分の情報の扱いを判断できません。', en: '' } }
          - { id: ed-c-specific, text: { ja: '入力した情報の種類、件数、時期を具体的に書く', en: '' }, points: 10, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '種類と件数、時期が具体的だと、顧客は影響の有無を照合できます。説明の土台になります。', en: '' } }
      - id: cause
        label: { ja: '原因の書き方', en: '' }
        options:
          - { id: ed-ca-person, text: { ja: '入力した社員の判断力と意識の問題として書く', en: '' }, points: -15, axis: wording, refs: [no10-ai-guideline], explain: { ja: '個人の判断力に寄せると、規程と環境の失敗が見えません。同じ状況の社員が、また同じ選択をします。', en: '' } }
          - { id: ed-ca-vendor, text: { ja: 'AI事業者の規約のせいだと書いて終える', en: '' }, points: -10, axis: wording, refs: [no10-ppc-genai], explain: { ja: '事業者のせいにすると、自社が入力の区分を決めなかった責任が抜けます。再発防止の主体も曖昧になります。', en: '' } }
          - { id: ed-ca-system, text: { ja: '規程と入力の判定がなかった仕組みを原因として書く', en: '' }, points: 10, axis: content, refs: [no10-ai-guideline], explain: { ja: '仕組みを原因として書くと、対策の担当と期限を決められます。個人を責めずに再発を防ぐ道筋になります。', en: '' } }
      - id: action
        label: { ja: '再発防止', en: '' }
        options:
          - { id: ed-a-plan, text: { ja: '再開の条件と、入力できる情報の区分を書く', en: '' }, points: 10, axis: content, refs: [no10-ipa-genai], explain: { ja: '再開の条件と入力の区分があれば、現場は何をしてよいか分かります。対策が実行されたかも確認できます。', en: '' } }
          - { id: ed-a-slogan, text: { ja: '「再発防止に努めます」とだけ書く', en: '' }, points: -10, axis: content, refs: [no10-ipa-genai], explain: { ja: '決まり文句だけでは、何をいつするのか分かりません。実行されたかの検証もできません。', en: '' } }
      - id: contact
        label: { ja: '問い合わせ窓口', en: '' }
        options:
          - { id: ed-co-none, text: { ja: '問い合わせ窓口は一切書かない', en: '' }, points: -15, axis: care, refs: [ppc-notify-person], explain: { ja: '窓口がないと、顧客は担当者個人に連絡します。情報が集まらず、対応の記録も残りません。', en: '' } }
          - { id: ed-co-number, text: { ja: '問い合わせの電話番号だけを書く', en: '' }, points: -5, axis: care, refs: [ppc-notify-person], explain: { ja: '番号だけでは、受付時間が分かりません。つながらないときに、顧客は次の手段を失います。', en: '' } }
          - { id: ed-co-window, text: { ja: '専用窓口の番号、受付時間、担当を書く', en: '' }, points: 8, axis: care, refs: [ppc-notify-person], explain: { ja: '窓口の使い方まで示すと、顧客は迷わず問い合わせられます。集中しても受け止められる体制が伝わります。', en: '' } }
      - id: staff
        label: { ja: '社員への配慮', en: '' }
        options:
          - { id: ed-st-punish, text: { ja: '入力した社員への処分だけを書く', en: '' }, points: -10, axis: care, refs: [no10-ai-guideline], explain: { ja: '処分だけを書くと、社員は報告を控えます。再発防止の担い手が失われ、現場の協力も得られません。', en: '' } }
          - { id: ed-st-care, text: { ja: '入力した社員への配慮と相談窓口を書く', en: '' }, points: 5, axis: care, refs: [no10-ai-guideline], explain: { ja: '社員への配慮と相談窓口を示すと、次の入力も相談として上がります。報告を罰しない姿勢が伝わります。', en: '' } }
      - id: next
        label: { ja: '次の公表', en: '' }
        options:
          - { id: ed-n-next, text: { ja: '次の公表の予定を書く', en: '' }, points: 5, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '次の予定があると、続報を待つ顧客の見通しが立ちます。憶測が広がる前に接点を示せます。', en: '' } }
          - { id: ed-n-none, text: { ja: '次回の予定は書かない', en: '' }, points: -5, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '次回の予定がないと、情報の空白を憶測で埋められます。問い合わせの終わりも見えません。', en: '' } }
