        category: hurt
        points: -90
        refs: [no10-ai-guideline]
        gauges: { damage: 8, trust: -6 }
        items:
          - { id: o15-b1, points: -10, axis: record, refs: [no10-ai-guideline] }
          - { id: o15-b2, points: -5, axis: content, refs: [no10-ipa-genai] }

drafts:
  officer-report:
    title: { ja: '調査報告書の管理部門版', en: '' }
    slots:
      - id: timing
        label: { ja: '公表の時期', en: '' }
        auto: true
        items:
          - { id: od-t-45d, when: { withinHours: 1080 }, points: 10, axis: time, refs: [meti-disclosure-guidance] }
          - { id: od-t-60d, when: { withinHours: 1440 }, points: 3, axis: time, refs: [meti-disclosure-guidance] }
          - { id: od-t-late, when: { otherwise: true }, points: -15, axis: time, refs: [meti-disclosure-guidance] }
      - id: scope
        label: { ja: '公開する範囲', en: '' }
        options:
          - { id: od-s-hide, text: { ja: '顧客の名前が入る部分は、すべて伏せる', en: '' }, points: -10, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '顧客の名前をすべて伏せると、どの案件の影響か分かりません。顧客自身も、自分の情報を照合できません。', en: '' } }
          - { id: od-s-omit, text: { ja: '入力の種類と件数は、報告書に書かずにおく', en: '' }, points: -15, axis: content, refs: [ppc-report-scope], explain: { ja: '入力の種類と件数を省くと、報告の核心が抜けます。後から範囲を訂正することになります。', en: '' } }
          - { id: od-s-all, text: { ja: '顧客の同意を得た範囲と、入力の種類を書く', en: '' }, points: 10, axis: content, refs: [ppc-report-scope], explain: { ja: '同意を得た範囲と入力の種類を書くことで、顧客の秘密を守りながら影響を説明できます。', en: '' } }
      - id: content
        label: { ja: '何が起きたか', en: '' }
        options:
          - { id: od-c-vague, text: { ja: '「外部サービスの利用に関する不備がありました」と書く', en: '' }, points: -10, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '外部サービスの利用とだけ書くと、生成AIに入力した事実が伝わりません。再発防止の前提も見えません。', en: '' } }
          - { id: od-c-specific, text: { ja: '生成AIへの入力の経緯と、止められなかった理由を書く', en: '' }, points: 10, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '入力の経緯と止められなかった理由を書くと、対策の必要性が伝わります。同じ使い方をする他社にも役立ちます。', en: '' } }
      - id: cause
        label: { ja: '原因の書き方', en: '' }
        options:
          - { id: od-ca-person, text: { ja: '入力した社員の意識と判断力が低かったと書く', en: '' }, points: -15, axis: wording, refs: [no10-ai-guideline], explain: { ja: '社員の意識に寄せると、規程と教育の不備が見えません。同じ状況の社員が、また同じ判断をします。', en: '' } }
          - { id: od-ca-system, text: { ja: '規程と申請の仕組みがなかったことを原因として書く', en: '' }, points: 10, axis: content, refs: [no10-ai-guideline], explain: { ja: '仕組みの不在を原因として書くと、対策の担当と期限を決められます。個人を責めずに再発を防げます。', en: '' } }
          - { id: od-ca-vendor, text: { ja: 'AI事業者の説明が不十分だったと書いて終える', en: '' }, points: -10, axis: wording, refs: [no10-ppc-genai], explain: { ja: '事業者の説明に寄せると、自社の入力の区分を決めなかった責任が抜けます。再発防止の主体も曖昧になります。', en: '' } }
      - id: action
        label: { ja: '再発防止', en: '' }
        options:
          - { id: od-a-plan, text: { ja: '入力の区分と申請の流れ、見直しの時期を書く', en: '' }, points: 10, axis: content, refs: [no10-ipa-genai], explain: { ja: '区分と申請の流れ、見直しの時期まで書くと、対策が実行されたか確認できます。現場も判断に迷いません。', en: '' } }
          - { id: od-a-slogan, text: { ja: '「再発防止に努めます」とだけ書いて終える', en: '' }, points: -10, axis: content, refs: [no10-ipa-genai], explain: { ja: '決まり文句だけでは、何をいつするのか分かりません。実行の確認もできず、説明が続きません。', en: '' } }
      - id: contact
        label: { ja: '問い合わせ窓口', en: '' }
        options:
          - { id: od-co-none, text: { ja: '問い合わせ窓口は一切書かない', en: '' }, points: -15, axis: care, refs: [ppc-notify-person], explain: { ja: '窓口がないと、顧客は担当者個人に連絡します。情報が集まらず、対応の記録も残りません。', en: '' } }
          - { id: od-co-number, text: { ja: '問い合わせの電話番号だけを書く', en: '' }, points: -5, axis: care, refs: [ppc-notify-person], explain: { ja: '番号だけでは受付時間が分からず、つながらないときに顧客は次の手段を失います。窓口の使い方まで示したい。', en: '' } }
          - { id: od-co-window, text: { ja: '専用窓口の番号、受付時間、担当を書く', en: '' }, points: 8, axis: care, refs: [ppc-notify-person], explain: { ja: '窓口の使い方まで示すと、顧客は迷わず問い合わせられます。集中しても受け止められます。', en: '' } }
      - id: staff
        label: { ja: '社員への配慮', en: '' }
        options:
          - { id: od-st-punish, text: { ja: '入力した社員への処分だけを書く', en: '' }, points: -10, axis: care, refs: [no10-ai-guideline], explain: { ja: '処分だけを書くと、社員は報告を控えます。再発防止の担い手が失われ、現場の協力も得られません。', en: '' } }
          - { id: od-st-care, text: { ja: '入力した社員への配慮と相談窓口を書く', en: '' }, points: 5, axis: care, refs: [no10-ai-guideline], explain: { ja: '社員への配慮と相談窓口を示すと、次の入力も相談として上がります。報告を罰しない姿勢が伝わります。', en: '' } }
      - id: next
        label: { ja: '次の公表', en: '' }
        options:
          - { id: od-n-next, text: { ja: '次の公表の予定を書く', en: '' }, points: 5, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '次の予定があると、続報を待つ顧客の見通しが立ちます。憶測が広がる前に接点を示せます。', en: '' } }
          - { id: od-n-none, text: { ja: '次回の予定は書かない', en: '' }, points: -5, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '次回の予定がないと、情報の空白を憶測で埋められます。問い合わせの終わりも見えません。', en: '' } }
