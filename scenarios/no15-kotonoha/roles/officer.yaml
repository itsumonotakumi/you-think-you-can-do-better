        explain: { ja: '電話の依頼は、内容も日時も残りません。削除の確認ができず、顧客にも報告機関にも説明できません。', en: '' }
        minutes: 60
        category: hurt
        points: -100
        refs: [jpcert-handling]
        gauges: { trust: -6 }
        items:
          - { id: o06-a1, points: -10, axis: record, refs: [jpcert-handling] }
          - { id: o06-a2, points: -5, axis: content, refs: [no10-ppc-genai] }
      - id: o06-letter
        text: { ja: '削除と学習利用の停止を書面で求め、回答を記録する。', en: '' }
        explain: { ja: '書面で求めることで、依頼の事実と回答が残ります。削除の範囲も確認でき、顧客への説明に使えます。', en: '' }
        minutes: 180
        category: recover
        points: 120
        refs: [jpcert-handling, no10-ppc-genai]
        gauges: { damage: -8, trust: 8, stamina: -10 }
        setFlags: { deletionRequested: true, termsChecked: true }
        items:
          - { id: o06-c1, points: 10, axis: record, refs: [jpcert-handling] }
          - { id: o06-c2, points: 8, axis: content, refs: [no10-ppc-genai] }
      - id: o06-none
        text: { ja: '事業者に落ち度はないので、こちらからは何も求めない。', en: '' }
        explain: { ja: '自社の入力の問題でも、事業者に削除を求めることはできます。求めなければ、情報は残ったままです。', en: '' }
        minutes: 45
        category: hurt
        points: -130
        refs: [no10-ppc-genai]
        gauges: { damage: 10, trust: -10 }
        items:
          - { id: o06-b1, points: -10, axis: content, refs: [no10-ppc-genai] }
          - { id: o06-b2, points: -8, axis: record, refs: [jpcert-handling] }

  - id: o07-terms
    at: { day: 4, minutes: 600 }
    phase: investigate
    sound: { se: [notify_chat] }
    text: { ja: '午前10時。AIの学習利用をどこまで確認するか。事業者の説明は「設定によります」の一点張りで、現場は「使っていないはず」と言っている。', en: '' }
    voices: [v07-expert, v07-ok]
    notable:
      - { id: note-terms, text: { ja: '無料の個人アカウントの規約では、入力が学習に利用されうる設定だった。', en: '' } }
