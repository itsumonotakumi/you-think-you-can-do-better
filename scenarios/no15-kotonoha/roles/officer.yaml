    phase: investigate
    sound: { se: [typing] }
    text: { ja: '午前10時。AI事業者に何を求めるか。事業者の担当者は「規約の範囲で対応します」と言うだけで、削除できるかは明言しない。', en: '' }
    voices: [v06-vendor, v06-ok]
    notable:
