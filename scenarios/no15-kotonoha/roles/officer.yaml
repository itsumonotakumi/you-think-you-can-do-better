# No.15 シラカバソフトウェア / 役員ロール（専務取締役・管理本部長）
# 判断ポイント15、細目は choices[].items と drafts の合計で80以上。
estimateMinutes: 30
intro: { ja: 'あなたはシラカバソフトウェアの専務。規程、契約、人事、広報をまとめる立場で、顧客の設計情報が外部AIに入力された件に向き合う。現場を責めずに、会社の仕組みを直せるかが問われる。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-prelim
    ref: ppc-report-prelim
    label: { ja: '個人情報保護委員会への速報', en: '' }
    points: -150
    doneFlag: prelimFiled
  - id: dl-final
    ref: ppc-report-final
    label: { ja: '個人情報保護委員会への確報', en: '' }
    points: -150
    doneFlag: finalFiled
events:
  - id: ev-news
    at: { day: 1, minutes: 1200 }
    voices: [v-ev-news]
    gauges: { flame: 5 }
    sound: { se: [notify_news] }
    caption: { ja: '業界紙が、顧客の設計情報が外部AIに入力されていたと報じた。', en: '' }
  - id: ev-client
    at: { day: 3, minutes: 780 }
    voices: [v-ev-client]
    gauges: { flame: 5 }
    sound: { se: [phone_ring] }
    caption: { ja: '顧客の情報システム部から、契約の扱いについて確認の電話が入った。', en: '' }
points:
  - id: o01-survey
    at: { day: 0, minutes: 660 }
    phase: detect
    sound: { se: [notify_chat] }
    text: { ja: '午前11時。社長から、調査の範囲を決めるように言われた。報告が上がっているのは一件だが、同じ使い方をした社員がほかにもいるとみられる。', en: '' }
    voices: [v01-narrow, v01-ok]
    notable:
      - { id: note-scope, text: { ja: '入力が確認できたのは、設計情報12件、ソースコード5件、テスト用の個人情報1,200人分。', en: '' } }
    lesson: { ja: '最初に調べる範囲を決めます。一件だけを見ていると、同じ使い方が残ります。全社の利用実態と、入力した情報の種類・期間を洗い出すのが出発点です。一件だけで終えません。', en: '' }
    choices:
      - id: o01-narrow
        text: { ja: '報告のあった一件だけを調べ、ほかの利用は目をつぶる。', en: '' }
        explain: { ja: '一件だけで終えると、同じ使い方をした社員が残ります。入力の範囲も広がったまま、説明できない状態が続きます。', en: '' }
        minutes: 60
        category: hurt
        points: -110
        refs: [no10-ai-guideline]
        gauges: { damage: 10, trust: -8 }
        items:
          - { id: o01-a1, points: -10, axis: content, refs: [no10-ai-guideline] }
          - { id: o01-a2, points: -8, axis: record, refs: [cissp-cbk-secops] }
      - id: o01-all
        text: { ja: '全社の利用実態を調べ、入力した情報の種類と期間を洗い出す。', en: '' }
        explain: { ja: '全社を調べることで、顧客に説明できる範囲が決まります。情報の種類と期間が分かれば、報告の材料にもなります。', en: '' }
        minutes: 240
        category: recover
        points: 130
        refs: [no10-ai-guideline, cissp-cbk-secops]
        gauges: { damage: -10, trust: 8, stamina: -10 }
        setFlags: { fullSurvey: true }
        items:
          - { id: o01-c1, points: 10, axis: content, refs: [no10-ai-guideline] }
          - { id: o01-c2, points: 8, axis: record, refs: [cissp-cbk-secops] }
      - id: o01-interview
        text: { ja: '本人たちに聞き取りをして、使ったサービス名だけを集める。', en: '' }
        explain: { ja: 'サービス名だけでは、何を入力したかが分かりません。顧客に影響を説明する材料としては足りません。', en: '' }
        minutes: 120
        category: maintain
        points: 20
        refs: [no10-ai-guideline]
        gauges: { trust: 2 }
        items:
          - { id: o01-b1, points: -5, axis: content, refs: [no10-ai-guideline] }
          - { id: o01-b2, points: 5, axis: order, refs: [cissp-cbk-secops] }

  - id: o02-stop
    at: { day: 0, minutes: 1020 }
    phase: contain
    sound: { se: [notify_chat] }
    text: { ja: '午後5時。利用をどこまで止めるか。顧客の情報を扱う案件は止められるが、納期の近い案件を止めると、現場の作業が止まる。', en: '' }
    voices: [v02-popular, v02-ok]
    lesson: { ja: '止める範囲は、情報の種類で決めます。顧客情報や設計情報を扱う案件を止め、私用アカウントも含めて実態を出させます。止めないまま注意だけを出しても、入力は続きます。', en: '' }
    choices:
      - id: o02-stop-all
        text: { ja: '全社の外部AI利用を止め、私用アカウントも申告させる。', en: '' }
        explain: { ja: '私用アカウントまで含めて止めることで、見えない入力も拾えます。申告を求めることで、実態の把握が進みます。', en: '' }
        minutes: 120
        category: recover
        points: 120
        refs: [no10-ai-guideline, no10-ipa-genai]
        gauges: { damage: -10, trust: 8, stamina: -8 }
        setFlags: { stoppedUse: true, fullSurvey: true }
        items:
          - { id: o02-c1, points: 10, axis: order, refs: [no10-ai-guideline] }
          - { id: o02-c2, points: 8, axis: content, refs: [no10-ipa-genai] }
      - id: o02-job
        text: { ja: '顧客情報を扱う案件だけ止め、ほかの開発は続けさせる。', en: '' }
        explain: { ja: '範囲を絞った停止は、現場の負担を抑えます。ただし設計情報を扱う案件が止まらず、同じ入力が残ります。', en: '' }
        minutes: 90
        category: hurt
        points: -60
        refs: [no10-ai-guideline]
        gauges: { damage: 6, trust: -4 }
        items:
          - { id: o02-a1, points: -8, axis: content, refs: [no10-ai-guideline] }
          - { id: o02-a2, points: -5, axis: order, refs: [no10-ipa-genai] }
      - id: o02-none
        text: { ja: '規程があるので、注意喚起だけを出して利用は止めない。', en: '' }
        explain: { ja: '規程が実際の判断に使われていなかったなら、注意喚起だけでは止まりません。入力は続き、被害の範囲も広がります。', en: '' }
        minutes: 45
        category: hurt
        points: -120
        refs: [no10-ipa-genai]
        gauges: { damage: 12, flame: 8, trust: -10 }
        items:
          - { id: o02-b1, points: -10, axis: content, refs: [no10-ipa-genai] }
          - { id: o02-b2, points: -8, axis: order, refs: [no10-ai-guideline] }

  - id: o03-customer
    at: { day: 1, minutes: 600 }
    phase: notify
    sound: { se: [phone_ring] }
    text: { ja: '午前10時。顧客への説明の順番を決める。営業は「まだ言わないでほしい」と言い、法務は契約上の責任を先に整理したいと言う。', en: '' }
    voices: [v03-coward, v03-ok]
    notable:
      - { id: note-customer, text: { ja: '顧客への説明は、影響の大きい5社から順に訪問で行った。', en: '' } }
    lesson: { ja: '顧客への説明は、契約の整理を待たずに始めます。影響の大きい顧客から順に、担当者が訪問して文書で伝えます。順番を決めておくと、説明の抜けも防げます。順番と文書が、顧客の判断を支えます。', en: '' }
    choices:
      - id: o03-sales
        text: { ja: '営業から顧客へ口頭で伝え、文書は後回しにする。', en: '' }
        explain: { ja: '口頭だけでは、顧客の社内で共有できません。担当者が変わると、説明した事実も残りません。', en: '' }
        minutes: 90
        category: hurt
        points: -100
        refs: [meti-disclosure-guidance]
        gauges: { flame: 8, trust: -8 }
        items:
          - { id: o03-a1, points: -10, axis: care, refs: [meti-disclosure-guidance] }
          - { id: o03-a2, points: -5, axis: record, refs: [jpcert-handling] }
      - id: o03-legal
        text: { ja: '法務が契約上の責任を確認してから、顧客に伝える。', en: '' }
        explain: { ja: '責任の整理は必要ですが、確認を待つ間に顧客の不安が広がります。分かっている事実は先に伝えられます。', en: '' }
        minutes: 180
        category: hurt
        points: -80
        refs: [meti-disclosure-guidance]
        gauges: { trust: -6 }
        coward: true
        delayed:
          - { afterPhases: 1, points: -30, gauges: { trust: -8 }, reason: { ja: '説明を待つ間に、顧客が独自に問い合わせを始めた。', en: '' } }
        items:
          - { id: o03-b1, points: -8, axis: order, refs: [meti-disclosure-guidance] }
          - { id: o03-b2, points: -5, axis: time, refs: [meti-disclosure-guidance] }
      - id: o03-visit
        text: { ja: '影響の大きい顧客から順に、担当者と文書で説明する。', en: '' }
        explain: { ja: '順番を決めて訪問と文書で伝えています。顧客は社内で説明でき、こちらの再発防止も伝わります。', en: '' }
        minutes: 240
        category: recover
        points: 120
        refs: [meti-disclosure-guidance, ppc-notify-person]
        gauges: { damage: -8, trust: 10, stamina: -10 }
        setFlags: { customerTold: true }
        items:
          - { id: o03-c1, points: 10, axis: order, refs: [meti-disclosure-guidance] }
          - { id: o03-c2, points: 8, axis: care, refs: [ppc-notify-person] }

  - id: o04-discipline
    at: { day: 2, minutes: 600 }
    phase: organize
    sound: { se: [notify_chat] }
    text: { ja: '午前10時。入力した社員の処分を、人事部長と決める。本人は業務改善の提案をしたばかりで、上司の指示で使った日もあるという。', en: '' }
    voices: [v04-boss, v04-ok]
    lesson: { ja: '処分は、事実を確認してから決めます。本人の経緯を聞き、再発防止の仕組みづくりに参加してもらうと、現場の実態に合った対策になります。厳罰だけでは、次の入力は報告されません。', en: '' }
    choices:
      - id: o04-fire
        text: { ja: '入力した社員を懲戒解雇し、全社に通達する。', en: '' }
        explain: { ja: '厳罰で規律を示せますが、現場は隠す方を選びます。上司の指示で使った事実も、表に出なくなります。', en: '' }
        minutes: 120
        category: hurt
        points: -150
        refs: [no10-ai-guideline]
        gauges: { flame: 10, trust: -12 }
        setFlags: { punishedEmployee: true }
        delayed:
          - { afterPhases: 1, points: -40, gauges: { trust: -8 }, reason: { ja: '解雇のあと、私用アカウントの利用を申告する社員が誰もいなくなった。', en: '' } }
        items:
          - { id: o04-a1, points: -12, axis: care, refs: [no10-ai-guideline] }
          - { id: o04-a2, points: -8, axis: record, refs: [meti-csm-guideline] }
      - id: o04-rule
        text: { ja: '処分はせず、規程づくりに参加してもらう。', en: '' }
        explain: { ja: '本人を仕組みづくりに入れると、なぜその入力が必要だったかが分かります。現場に合った規程になり、報告も上がります。', en: '' }
        minutes: 150
        category: recover
        points: 100
        refs: [no10-ai-guideline, meti-csm-guideline]
        gauges: { trust: 8, stamina: -8 }
        setFlags: { employeeInvolved: true }
        items:
          - { id: o04-c1, points: 10, axis: care, refs: [no10-ai-guideline] }
          - { id: o04-c2, points: 8, axis: content, refs: [meti-csm-guideline] }
      - id: o04-warn
        text: { ja: '始末書を取るだけで、氏名は社内に公表しない。', en: '' }
        explain: { ja: '始末書だけで終えると、原因の分析が進みません。本人も周囲も、何を直すべきかを学べません。', en: '' }
        minutes: 60
        category: maintain
        points: 20
        refs: [meti-csm-guideline]
        gauges: { trust: -2 }
        items:
          - { id: o04-b1, points: -8, axis: record, refs: [meti-csm-guideline] }
          - { id: o04-b2, points: -5, axis: content, refs: [no10-ai-guideline] }

  - id: o05-prelim
    at: { day: 2, minutes: 840 }
    phase: notify
    sound: { se: [notify_news] }
    text: { ja: '午後2時。委員会への報告をどうするか。顧客の利用者1,200人分の氏名と連絡先が入力されている。全件の特定には、まだ時間がかかる。', en: '' }
    voices: [v05-law, v05-ok]
    lesson: { ja: '速報は、全件の特定を待たずに、分かっている範囲で出します。1,200人分の個人データは件数だけで報告の対象です。顧客への写しも、同じ日に渡します。写しを渡すことも、説明の一部です。', en: '' }
    choices:
      - id: o05-file
        text: { ja: '分かっている範囲で速報を出し、顧客にも写しを送る。', en: '' }
        explain: { ja: '確定前でも分かった事実を出し、顧客にも同じ情報を渡しています。顧客が社内で説明する材料になります。', en: '' }
        minutes: 120
        category: recover
        points: 130
        refs: [ppc-report-prelim, ppc-report-scope]
        gauges: { flame: -5, trust: 10, stamina: -10 }
        setFlags: { prelimFiled: true, customerTold: true }
        items:
          - { id: o05-c1, points: 10, axis: time, refs: [ppc-report-prelim] }
          - { id: o05-c2, points: 8, axis: content, refs: [ppc-report-scope] }
      - id: o05-consent
        text: { ja: '顧客の同意が取れてから、委員会に報告する。', en: '' }
        explain: { ja: '顧客の同意は必要ありません。同意を待つ間に速報の期限が過ぎ、報告義務を怠ることになります。', en: '' }
        minutes: 240
        category: hurt
        points: -150
        refs: [ppc-report-prelim]
        gauges: { flame: 12, trust: -12 }
        items:
          - { id: o05-a1, points: -12, axis: time, refs: [ppc-report-prelim] }
          - { id: o05-a2, points: -8, axis: record, refs: [ppc-report-scope] }
      - id: o05-ask
        text: { ja: '委員会の窓口に相談し、必要かどうかを確認する。', en: '' }
        explain: { ja: '相談は有効ですが、確認を待つ間に期限は近づきます。相談と並行して、分かっている範囲を出すべきです。', en: '' }
        minutes: 90
        category: maintain
        points: 20
        refs: [ppc-report-prelim]
        gauges: { trust: 3 }
        coward: true
        items:
          - { id: o05-b1, points: -5, axis: time, refs: [ppc-report-prelim] }
          - { id: o05-b2, points: 5, axis: order, refs: [ppc-report-scope] }

