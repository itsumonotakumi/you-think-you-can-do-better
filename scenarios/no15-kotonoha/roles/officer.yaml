    choices:
      - id: o07-trust
        text: { ja: '事業者の説明を信じ、学習には使われていないと社内に伝える。', en: '' }
        explain: { ja: '確認せずに「使われていない」と伝えると、後から事実が違ったときに訂正が必要になります。顧客への説明も崩れます。', en: '' }
        minutes: 60
        category: hurt
        points: -120
        refs: [no10-ppc-genai]
        gauges: { flame: 8, trust: -10 }
        items:
          - { id: o07-a1, points: -10, axis: content, refs: [no10-ppc-genai] }
          - { id: o07-a2, points: -8, axis: wording, refs: [meti-disclosure-guidance] }
      - id: o07-check
        text: { ja: '規約とアカウント設定を確認し、学習に使われうる設定だと記録する。', en: '' }
        explain: { ja: '規約と設定を確認して事実を記録しています。学習に使われうる設定なら、そのまま説明する材料になります。', en: '' }
        minutes: 180
        category: recover
        points: 120
        refs: [no10-ppc-genai, no10-ai-guideline]
        gauges: { trust: 10, stamina: -10 }
        setFlags: { termsChecked: true }
        items:
          - { id: o07-c1, points: 10, axis: content, refs: [no10-ppc-genai] }
          - { id: o07-c2, points: 8, axis: record, refs: [no10-ai-guideline] }
      - id: o07-ignore
        text: { ja: '学習の有無は、顧客への説明に含めないままにしておく。', en: '' }
        explain: { ja: '学習の有無は、顧客が知りたい情報です。含めないと、後から分かったときに説明の信頼を失います。', en: '' }
        minutes: 90
        category: hurt
        points: -100
        refs: [no10-ppc-genai]
        gauges: { flame: 10, trust: -8 }
