        points: 120
        refs: [jpcert-handling, cissp-cbk-secops]
        gauges: { damage: -8, trust: 10, stamina: -12 }
        setFlags: { scopeKnown: true }
        items:
          - { id: a03-c1, points: 10, axis: content, refs: [jpcert-handling] }
          - { id: a03-c2, points: 8, axis: record, refs: [cissp-cbk-secops] }
      - id: a03-none
        text: { ja: '入力の内容は分からないので、範囲は調査中のままにする。', en: '' }
        explain: { ja: '調査中のままにすると、顧客は自分の影響を判断できません。報告の範囲も、いつまでも確定しません。', en: '' }
        minutes: 60
        category: hurt
        points: -100
        refs: [ppc-report-scope]
        gauges: { trust: -8 }
        items:
          - { id: a03-a1, points: -10, axis: content, refs: [ppc-report-scope] }
          - { id: a03-a2, points: -5, axis: time, refs: [jpcert-handling] }

  - id: a04-terms
    at: { day: 2, minutes: 660 }
    phase: investigate
    sound: { se: [notify_chat] }
    text: { ja: '午前11時。学習利用の設定を確認する。無料の個人アカウントが使われており、事業者の規約には、入力がサービス改善に使われる場合があると書かれている。', en: '' }
    voices: [v04-expert, v04-ok]
    notable:
      - { id: note-terms, text: { ja: '無料の個人アカウントの規約では、入力が学習に利用されうる設定だった。', en: '' } }
      - { id: note-delete, text: { ja: 'AI事業者に削除と学習利用の停止を書面で求め、回答を受け取った。', en: '' } }
    lesson: { ja: '学習に使われたかは、規約とアカウントの設定を確認して事実として記録します。事業者の説明をそのまま信じると、後から事実が違ったときに訂正が必要になります。事実の記録が、説明の根拠になります。', en: '' }
