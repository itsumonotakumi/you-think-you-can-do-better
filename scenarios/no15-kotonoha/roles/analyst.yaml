      - id: a04-believe
        text: { ja: '事業者の説明をそのまま信じ、学習には使われていないと記録する。', en: '' }
        explain: { ja: '確認せずに記録すると、後から事実が違ったときに訂正が必要になります。顧客への説明も崩れます。', en: '' }
        minutes: 60
        category: hurt
        points: -120
        refs: [no10-ppc-genai]
        gauges: { flame: 8, trust: -10 }
        items:
          - { id: a04-a1, points: -10, axis: content, refs: [no10-ppc-genai] }
          - { id: a04-a2, points: -8, axis: record, refs: [no10-ai-guideline] }
