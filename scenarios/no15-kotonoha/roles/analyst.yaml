          - { id: ad-t-20d, when: { withinHours: 480 }, points: 3, axis: time, refs: [meti-disclosure-guidance] }
          - { id: ad-t-late, when: { otherwise: true }, points: -15, axis: time, refs: [meti-disclosure-guidance] }
      - id: scope
        label: { ja: '対象の書き方', en: '' }
        options:
          - { id: ad-s-code, text: { ja: 'ソースコードだけを対象として書いておく', en: '' }, points: -15, axis: content, refs: [ppc-report-scope], explain: { ja: 'コードだけに絞ると、設計情報と個人情報が通知から抜けます。後から対象の訂正が必要になります。', en: '' } }
          - { id: ad-s-anon, text: { ja: '顧客名は伏せ、業種と時期だけを書く', en: '' }, points: -10, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '顧客名を伏せると、自分の案件かどうかを判断できません。照合の材料が足りません。顧客が照合できません。', en: '' } }
          - { id: ad-s-all, text: { ja: '設計情報、コード、個人情報の範囲を分けて書く', en: '' }, points: 10, axis: content, refs: [ppc-report-scope], explain: { ja: '三つの種類を分けて書くと、顧客は自分の情報がどこまで含まれるか確認できます。通知の範囲も明確です。', en: '' } }
      - id: content
        label: { ja: '何が起きたか', en: '' }
        options:
          - { id: ad-c-vague, text: { ja: '「情報管理に不備がありました」とだけ書く', en: '' }, points: -10, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '「情報管理の不備」だけでは、何が外に出たか分かりません。顧客は行動を決められません。', en: '' } }
          - { id: ad-c-specific, text: { ja: '入力された情報の種類と時期を具体的に書く', en: '' }, points: 10, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '種類と時期を具体的に書くと、顧客は自分の情報が含まれるか照合できます。行動もしやすくなります。', en: '' } }
      - id: cause
        label: { ja: '原因の書き方', en: '' }
        options:
          - { id: ad-ca-system, text: { ja: '入力の判定と申請の仕組みがなかったと書く', en: '' }, points: 10, axis: content, refs: [no10-ai-guideline], explain: { ja: '仕組みの不在を原因として書くと、再発防止の内容とつながります。顧客も対策を評価できます。', en: '' } }
          - { id: ad-ca-person, text: { ja: '担当者の知識が足りなかったと書く', en: '' }, points: -15, axis: wording, refs: [no10-ai-guideline], explain: { ja: '個人の知識に寄せると、仕組みの失敗が見えません。同じ環境の社員が、また同じ判断をします。', en: '' } }
      - id: action
        label: { ja: 'お客様が今すること', en: '' }
        options:
          - { id: ad-a-generic, text: { ja: '「十分ご注意ください」とだけ書いて終える', en: '' }, points: -10, axis: care, refs: [ppc-notify-person], explain: { ja: '注意を促すだけでは、何をすればよいか分かりません。問い合わせが窓口に集中します。', en: '' } }
          - { id: ad-a-concrete, text: { ja: '確認すべき自社の設定と、連絡先を書く', en: '' }, points: 10, axis: care, refs: [ppc-notify-person], explain: { ja: '確認すべき設定と連絡先を示すと、顧客は自分で影響を確かめられます。問い合わせも減ります。', en: '' } }
      - id: contact
        label: { ja: '問い合わせ窓口', en: '' }
        options:
          - { id: ad-co-none, text: { ja: '問い合わせ窓口は一切書かない', en: '' }, points: -15, axis: care, refs: [ppc-notify-person], explain: { ja: '窓口がないと、顧客は担当者個人に連絡します。情報が集まらず、対応の記録も残りません。', en: '' } }
          - { id: ad-co-number, text: { ja: '問い合わせの電話番号だけを書く', en: '' }, points: -5, axis: care, refs: [ppc-notify-person], explain: { ja: '番号だけでは受付時間が分からず、つながらないときに顧客は次の手段を失います。受付時間も示します。', en: '' } }
          - { id: ad-co-window, text: { ja: '専用窓口の番号、受付時間、担当を書く', en: '' }, points: 8, axis: care, refs: [ppc-notify-person], explain: { ja: '窓口の使い方まで示すと、顧客は迷わず問い合わせられます。集中しても受け止められます。', en: '' } }
      - id: staff
        label: { ja: '社員への配慮', en: '' }
        options:
          - { id: ad-st-punish, text: { ja: '入力した社員への処分だけを書く', en: '' }, points: -10, axis: care, refs: [no10-ai-guideline], explain: { ja: '処分だけを書くと、社員は報告を控えます。再発防止の担い手が失われ、現場の協力も得られません。', en: '' } }
          - { id: ad-st-care, text: { ja: '入力した社員への配慮と相談窓口を書く', en: '' }, points: 5, axis: care, refs: [no10-ai-guideline], explain: { ja: '社員への配慮と相談窓口を示すと、次の入力も相談として上がります。報告を罰しない姿勢が伝わります。', en: '' } }
      - id: next
        label: { ja: '次の連絡', en: '' }
        options:
          - { id: ad-n-next, text: { ja: '次の連絡の予定を書く', en: '' }, points: 5, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '次の予定があると、続報を待つ顧客の見通しが立ちます。憶測が広がる前に接点を示せます。', en: '' } }
          - { id: ad-n-none, text: { ja: '次回の予定は書かない', en: '' }, points: -5, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '次回の予定がないと、情報の空白を憶測で埋められます。問い合わせの終わりも見えません。', en: '' } }
