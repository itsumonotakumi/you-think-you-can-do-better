# No.15 シラカバソフトウェア / 担当者ロール（情報システム室長）
# 判断ポイント15、細目は choices[].items と drafts の合計で80以上。
estimateMinutes: 30
intro: { ja: 'あなたはシラカバソフトウェアの情報システム室長。社員が外部AIに顧客の情報を入力していた件で、実態の調査と記録の保全を任された。全件を調べると、上司の名前も出てくる。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-prelim
    ref: ppc-report-prelim
    label: { ja: '個人情報保護委員会への速報', en: '' }
    points: -150
    doneFlag: prelimFiled
  - id: dl-final
    ref: ppc-report-final
    label: { ja: '個人情報保護委員会への確報', en: '' }
    points: -150
    doneFlag: finalFiled
events:
  - id: ev-news
    at: { day: 1, minutes: 1200 }
    voices: [v-ev-news]
    gauges: { flame: 5 }
    sound: { se: [notify_news] }
    caption: { ja: '業界紙が、顧客の設計情報が外部AIに入力されていたと報じた。', en: '' }
  - id: ev-caller
    at: { day: 5, minutes: 960 }
    voices: [v-ev-caller]
    gauges: { flame: 5 }
    sound: { se: [phone_ring] }
    caption: { ja: '「御社の情報を持っている」という電話が、代表番号にかかってきた。', en: '' }
points:
  - id: a01-survey
    at: { day: 0, minutes: 720 }
    phase: detect
    sound: { se: [typing] }
    text: { ja: '正午。調査の範囲を決める。報告が上がっているのは一人だが、同じ使い方をした社員はほかにもいるとみられる。全件を調べるには、時間も手も足りない。', en: '' }
    voices: [v01-flattery, v01-ok]
    notable:
      - { id: note-scope, text: { ja: '入力が確認できたのは、設計情報12件、ソースコード5件、テスト用の個人情報1,200人分。', en: '' } }
    lesson: { ja: '調査は、端末の履歴と申請書、私用アカウントの申告を突き合わせます。一人だけを詳しく調べても、同じ使い方は見つかりません。全社の実態が、顧客への説明の土台になります。', en: '' }
    choices:
      - id: a01-all
        text: { ja: '全社の端末と申請書、私用の申告を突き合わせる。', en: '' }
        explain: { ja: '三つの情報を突き合わせることで、申請されていない利用も見つかります。範囲が広く取れ、顧客への説明も正確になります。', en: '' }
        minutes: 300
        category: recover
        points: 130
        refs: [no10-ai-guideline, cissp-cbk-secops]
        gauges: { damage: -10, trust: 8, stamina: -15 }
        setFlags: { fullSurvey: true, hiddenUseKnown: true }
        items:
          - { id: a01-c1, points: 10, axis: content, refs: [no10-ai-guideline] }
          - { id: a01-c2, points: 8, axis: record, refs: [cissp-cbk-secops] }
      - id: a01-one
        text: { ja: '報告のあった一人の端末だけを詳しく調べる。', en: '' }
        explain: { ja: '一人だけを調べると、同じ使い方をした人が残ります。入力の範囲も、顧客に説明できないままです。', en: '' }
        minutes: 120
        category: hurt
        points: -100
        refs: [no10-ai-guideline]
        gauges: { damage: 10, trust: -8 }
        items:
          - { id: a01-a1, points: -10, axis: content, refs: [no10-ai-guideline] }
          - { id: a01-a2, points: -5, axis: record, refs: [cissp-cbk-secops] }
      - id: a01-sample
        text: { ja: '無作為に十人を抽出して、聞き取りを行う。', en: '' }
        explain: { ja: '抽出では、外れた人の利用が分かりません。聞き取りは本人の記憶に頼るため、入力の記録も残りません。', en: '' }
        minutes: 180
        category: maintain
        points: 20
        refs: [cissp-cbk-secops]
        gauges: { trust: 2 }
        items:
          - { id: a01-b1, points: -5, axis: content, refs: [cissp-cbk-secops] }
          - { id: a01-b2, points: 5, axis: order, refs: [no10-ai-guideline] }

  - id: a02-evidence
    at: { day: 0, minutes: 1200 }
    phase: contain
    sound: { se: [notify_chat] }
    text: { ja: '午後8時。入力に使った端末をどうするか。本人は「明日も仕事で使う」と言い、上司は「初期化して早く戻せ」と言う。', en: '' }
    voices: [v02-past, v02-ok]
    lesson: { ja: '端末と入力の記録は、調査の証拠として保全します。初期化して戻すと、何が入力されたかを示せなくなります。本人には代替の端末を渡し、仕事を止めない形にします。代替の端末で、仕事を続けます。', en: '' }
    choices:
      - id: a02-wipe
        text: { ja: '入力に使った端末を初期化し、まっさらにする。', en: '' }
        explain: { ja: '初期化すると、入力の履歴も証拠も消えます。何が出たのかを説明できず、報告も訂正だらけになります。', en: '' }
        minutes: 90
        category: fatal
        points: -210
        refs: [jpcert-handling]
        gauges: { flame: 15, trust: -15 }
        setFlags: { hidEvidence: true }
        items:
          - { id: a02-a1, points: -15, axis: record, refs: [jpcert-handling] }
          - { id: a02-a2, points: -10, axis: content, refs: [cissp-cbk-secops] }
      - id: a02-keep
        text: { ja: '端末と入力の記録を保全し、調査に使える形で保管する。', en: '' }
        explain: { ja: '端末と記録を保全することで、入力の範囲を後から確認できます。代替の端末を渡せば、本人の仕事も止まりません。', en: '' }
        minutes: 180
        category: recover
        points: 120
        refs: [jpcert-handling, cissp-cbk-secops]
        gauges: { damage: -8, trust: 8, stamina: -10 }
        setFlags: { evidenceKept: true }
        items:
          - { id: a02-c1, points: 10, axis: record, refs: [jpcert-handling] }
          - { id: a02-c2, points: 8, axis: order, refs: [cissp-cbk-secops] }
      - id: a02-return
        text: { ja: '端末は本人に返し、そのまま使わせ続ける。', en: '' }
        explain: { ja: 'そのまま使わせると、履歴が上書きされます。後から範囲を確認したくても、材料が残りません。', en: '' }
        minutes: 45
        category: hurt
        points: -120
        refs: [jpcert-handling]
        gauges: { damage: 10, trust: -10 }
        items:
          - { id: a02-b1, points: -10, axis: record, refs: [jpcert-handling] }
          - { id: a02-b2, points: -8, axis: content, refs: [cissp-cbk-secops] }

  - id: a03-scope
    at: { day: 1, minutes: 900 }
    phase: investigate
    sound: { se: [typing] }
    text: { ja: '午後3時。何が入力されたかを復元する。本人は「もう覚えていない」と言う。チャットには、AIの回答を貼ったメッセージが残っている。', en: '' }
    voices: [v03-ok, v03-coward]
    lesson: { ja: '入力の範囲は、チャットと端末の履歴、AIの回答を突き合わせて特定します。本人の記憶だけに頼ると、抜けが出ます。分からない部分は、分からないと記録します。記録の突き合わせが、範囲を確定します。', en: '' }
    choices:
      - id: a03-ask
        text: { ja: '本人の記憶を頼りに、入力した内容を聞き取っていく。', en: '' }
        explain: { ja: '記憶は抜けます。忙しい時期の入力ほど忘れられ、顧客に説明できない部分が残ります。', en: '' }
        minutes: 120
        category: maintain
        points: 30
        refs: [jpcert-handling]
        gauges: { trust: 2 }
        items:
          - { id: a03-b1, points: 5, axis: content, refs: [jpcert-handling] }
          - { id: a03-b2, points: 5, axis: order, refs: [cissp-cbk-secops] }
      - id: a03-log
        text: { ja: 'チャットと端末の履歴、AIの回答を突き合わせて範囲を特定する。', en: '' }
        explain: { ja: '三つの記録を突き合わせると、本人が忘れた入力も拾えます。範囲が確定すれば、顧客への説明も報告も正確になります。', en: '' }
        minutes: 240
