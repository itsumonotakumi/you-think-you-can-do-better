drafts:
  lead-report:
    title: { ja: '調査報告書の技術部分', en: '' }
    slots:
      - id: timing
        label: { ja: '公表の時期', en: '' }
        auto: true
        items:
          - { id: ld-t-30d, when: { withinHours: 720 }, points: 10, axis: time, refs: [meti-disclosure-guidance] }
          - { id: ld-t-45d, when: { withinHours: 1080 }, points: 3, axis: time, refs: [meti-disclosure-guidance] }
          - { id: ld-t-late, when: { otherwise: true }, points: -15, axis: time, refs: [meti-disclosure-guidance] }
      - id: scope
        label: { ja: '対象の書き方', en: '' }
        options:
          - { id: ld-s-code, text: { ja: 'ソースコードだけを対象として書いておく', en: '' }, points: -15, axis: content, refs: [ppc-report-scope], explain: { ja: 'ソースコードだけに絞ると、設計情報と個人情報が報告から抜けます。後から範囲の訂正が必要になります。', en: '' } }
          - { id: ld-s-anon, text: { ja: '顧客名は伏せ、案件の種類だけを書く', en: '' }, points: -10, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '顧客名を伏せただけでは、顧客は自分の案件かどうかを判断できません。照合の材料が足りません。', en: '' } }
          - { id: ld-s-all, text: { ja: '設計情報、コード、個人情報の範囲を分けて書く', en: '' }, points: 10, axis: content, refs: [ppc-report-scope], explain: { ja: '三つの種類を分けて書くことで、顧客は自分の情報がどこまで含まれるか確認できます。', en: '' } }
      - id: content
        label: { ja: '何が起きたか', en: '' }
        options:
          - { id: ld-c-vague, text: { ja: '「外部サービスへの入力があった」とだけ書く', en: '' }, points: -10, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '入力があったとだけ書くと、何が外に出たのか分かりません。顧客の判断も対策の検証もできません。', en: '' } }
          - { id: ld-c-specific, text: { ja: '入力の対象と時期、開発の経緯を具体的に書く', en: '' }, points: 10, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '対象と時期、経緯を具体的に書くと、顧客は影響を確認できます。同じ開発の進め方をする他社にも役立ちます。', en: '' } }
      - id: cause
        label: { ja: '原因の書き方', en: '' }
        options:
          - { id: ld-ca-person, text: { ja: '入力した社員の判断力が低かったと書く', en: '' }, points: -15, axis: wording, refs: [no10-ai-guideline], explain: { ja: '個人の判断力に寄せると、納期と評価の構造が見えません。同じ環境の社員が、また同じ選択をします。', en: '' } }
          - { id: ld-ca-system, text: { ja: '納期と評価が近道を選ばせた構造を原因として書く', en: '' }, points: 10, axis: content, refs: [no10-ai-guideline], explain: { ja: '納期と評価の構造を原因として書くと、見積もりや評価の見直しまで対策に入ります。個人を責めずに済みます。', en: '' } }
          - { id: ld-ca-tool, text: { ja: '外部AIの危険性が原因だと書いて終える', en: '' }, points: -10, axis: wording, refs: [no10-ai-guideline], explain: { ja: '道具の危険性だけを書くと、自社の判断の誤りが抜けます。同じ使い方が残ります。再発防止になりません。', en: '' } }
      - id: action
        label: { ja: '再発防止', en: '' }
        options:
          - { id: ld-a-plan, text: { ja: '開発標準とレビュー、見積もりの見直しを書く', en: '' }, points: 10, axis: content, refs: [no10-ipa-genai], explain: { ja: '標準とレビュー、見積もりまで書くと、対策が現場の仕事の流れに組み込まれます。実行も確認できます。', en: '' } }
          - { id: ld-a-slogan, text: { ja: '「再発防止に努めます」とだけ書いて終える', en: '' }, points: -10, axis: content, refs: [no10-ipa-genai], explain: { ja: '決まり文句だけでは、何をいつするのか分かりません。実行の確認もできません。説明が続きません。', en: '' } }
      - id: contact
        label: { ja: '問い合わせ窓口', en: '' }
        options:
          - { id: ld-co-none, text: { ja: '問い合わせ窓口は一切書かない', en: '' }, points: -15, axis: care, refs: [ppc-notify-person], explain: { ja: '窓口がないと、顧客は担当者個人に連絡します。情報が集まらず、対応の記録も残りません。', en: '' } }
          - { id: ld-co-number, text: { ja: '問い合わせの電話番号だけを書く', en: '' }, points: -5, axis: care, refs: [ppc-notify-person], explain: { ja: '番号だけでは受付時間が分からず、つながらないときに顧客は次の手段を失います。受付時間も示します。', en: '' } }
          - { id: ld-co-window, text: { ja: '専用窓口の番号、受付時間、担当を書く', en: '' }, points: 8, axis: care, refs: [ppc-notify-person], explain: { ja: '窓口の使い方まで示すと、顧客は迷わず問い合わせられます。集中しても受け止められます。', en: '' } }
      - id: staff
        label: { ja: '開発チームへの配慮', en: '' }
        options:
          - { id: ld-st-punish, text: { ja: '入力した社員への処分だけを書く', en: '' }, points: -10, axis: care, refs: [no10-ai-guideline], explain: { ja: '処分だけを書くと、チームは報告を控えます。再発防止の担い手が失われ、現場の協力も得られません。', en: '' } }
          - { id: ld-st-care, text: { ja: '開発チームの負担と相談窓口を書く', en: '' }, points: 5, axis: care, refs: [no10-ai-guideline], explain: { ja: 'チームの負担と相談窓口を書くと、応援や休息の判断が早まります。報告を罰しない姿勢も伝わります。', en: '' } }
      - id: next
        label: { ja: '次の公表', en: '' }
        options:
          - { id: ld-n-next, text: { ja: '次の公表の予定を書く', en: '' }, points: 5, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '次の予定があると、続報を待つ顧客の見通しが立ちます。憶測が広がる前に接点を示せます。', en: '' } }
          - { id: ld-n-none, text: { ja: '次回の予定は書かない', en: '' }, points: -5, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '次回の予定がないと、情報の空白を憶測で埋められます。問い合わせの終わりも見えません。', en: '' } }
