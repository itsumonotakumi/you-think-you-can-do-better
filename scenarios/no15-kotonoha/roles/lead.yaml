      - id: l04-none
        text: { ja: '手元から消せば十分なので、事業者には何も言わない。', en: '' }
        explain: { ja: '手元を消しても、事業者の側には入力が残ります。削除を求めなければ、学習に使われる可能性も残ります。', en: '' }
        minutes: 45
        category: hurt
        points: -120
        refs: [no10-ppc-genai]
        gauges: { damage: 10, trust: -10 }
