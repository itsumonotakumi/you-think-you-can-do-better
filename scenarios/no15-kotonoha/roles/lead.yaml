      - id: l05-silent
        text: { ja: '何も言わず、次の案件から静かに外していく。', en: '' }
        explain: { ja: '理由を伝えずに外すと、本人も周囲も何が問題か分かりません。同じ判断が、別のメンバーで起きます。', en: '' }
