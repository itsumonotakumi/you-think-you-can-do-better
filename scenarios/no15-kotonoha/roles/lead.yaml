    lesson: { ja: '削除の依頼は書面で行い、回答を保全します。電話だけでは、依頼した事実も削除の結果も証明できません。学習利用の停止も、同じ書面で求めておきます。書面の依頼が、証拠になります。', en: '' }
    choices:
      - id: l04-request
        text: { ja: '削除と学習利用の停止を書面で求め、回答を保全する。', en: '' }
        explain: { ja: '書面で求め、回答を残しています。顧客への説明にも、報告機関への説明にも使える記録になります。', en: '' }
        minutes: 180
        category: recover
        points: 120
        refs: [jpcert-handling, no10-ppc-genai]
        gauges: { damage: -8, trust: 8, stamina: -10 }
        setFlags: { deletionRequested: true, termsChecked: true }
        items:
          - { id: l04-c1, points: 10, axis: record, refs: [jpcert-handling] }
