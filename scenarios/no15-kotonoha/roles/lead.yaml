# No.15 シラカバソフトウェア / 部門長ロール（開発本部長）
# 判断ポイント15、細目は choices[].items と drafts の合計で80以上。
estimateMinutes: 30
intro: { ja: 'あなたはシラカバソフトウェアの開発本部長。別件の障害調査の途中で、部下が顧客の設計情報を外部AIに入力していたことが分かった。納期と顧客と、チームの士気の間で判断する。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-prelim
    ref: ppc-report-prelim
    label: { ja: '速報の材料提出', en: '' }
    points: -120
    doneFlag: prelimFiled
  - id: dl-final
    ref: ppc-report-final
    label: { ja: '確報の材料提出', en: '' }
    points: -120
    doneFlag: finalFiled
events:
  - id: ev-news
    at: { day: 1, minutes: 1200 }
    voices: [v-ev-news]
    gauges: { flame: 5 }
    sound: { se: [notify_news] }
    caption: { ja: '業界紙が、顧客の設計情報が外部AIに入力されていたと報じた。', en: '' }
  - id: ev-team
    at: { day: 2, minutes: 1080 }
    voices: [v-ev-team]
    gauges: { flame: 5 }
    sound: { se: [notify_chat] }
    caption: { ja: '開発部のチャットで、AIを使ったら罰則があるのかという質問が流れた。', en: '' }
points:
  - id: l01-survey
    at: { day: 0, minutes: 630 }
    phase: detect
    sound: { se: [notify_chat] }
    text: { ja: '午前10時30分。別件の障害調査の途中で、部下が顧客の設計情報を外部AIに入力していたことが分かった。他にも同じ使い方をしたメンバーがいそうだ。', en: '' }
    voices: [v01-coward, v01-ok]
    notable:
      - { id: note-scope, text: { ja: '入力が確認できたのは、設計情報12件、ソースコード5件、テスト用の個人情報1,200人分。', en: '' } }
    lesson: { ja: '別件の調査を止めずに、利用の実態も並行して洗い出します。入力した情報の種類と期間が分かれば、顧客への説明と報告の材料になります。後回しにすると、範囲は広がったままです。', en: '' }
    choices:
      - id: l01-continue
        text: { ja: '別件の調査を優先し、AIの件は後でまとめて調べる。', en: '' }
        explain: { ja: '後回しにしている間も、入力は続きます。範囲が広がってからでは、顧客への説明も間に合いません。', en: '' }
        minutes: 240
        category: hurt
        points: -110
        refs: [no10-ai-guideline]
        gauges: { damage: 10, trust: -8 }
        coward: true
        items:
          - { id: l01-a1, points: -10, axis: time, refs: [no10-ai-guideline] }
          - { id: l01-a2, points: -8, axis: content, refs: [cissp-cbk-secops] }
      - id: l01-both
        text: { ja: '別件の調査と並行して、開発部の利用実態をその日のうちに洗い出す。', en: '' }
        explain: { ja: '二つの調査を並行させることで、どちらも止めずに実態を把握できます。範囲が早く分かれば、顧客への説明も早まります。', en: '' }
        minutes: 240
        category: recover
        points: 130
        refs: [no10-ai-guideline, cissp-cbk-secops]
        gauges: { damage: -10, trust: 8, stamina: -15 }
        setFlags: { fullSurvey: true }
        items:
          - { id: l01-c1, points: 10, axis: content, refs: [no10-ai-guideline] }
          - { id: l01-c2, points: 8, axis: record, refs: [cissp-cbk-secops] }
      - id: l01-self
        text: { ja: '本人だけを呼んで事情を聞き、他のメンバーには伏せる。', en: '' }
        explain: { ja: '本人だけを聞くと、同じ使い方をした人が見つかりません。伏せたこと自体が、あとで問題になります。', en: '' }
        minutes: 90
        category: hurt
        points: -80
        refs: [no10-ai-guideline]
        gauges: { trust: -6 }
        items:
          - { id: l01-b1, points: -8, axis: content, refs: [no10-ai-guideline] }
          - { id: l01-b2, points: -5, axis: order, refs: [cissp-cbk-secops] }

  - id: l02-stop
    at: { day: 0, minutes: 1080 }
    phase: contain
    sound: { se: [notify_chat] }
    text: { ja: '午後6時。顧客の設計情報を扱う作業を止めるか。止めれば、三つの案件の納期が危うくなる。現場は「明日まで待ってほしい」と言っている。', en: '' }
    voices: [v02-past, v02-ok]
    lesson: { ja: '顧客の設計情報を扱う作業は、まず止めます。影響する案件を洗い出し、止めた分の納期は顧客と相談します。納期を優先して続けると、入力の範囲が広がります。止める範囲は、情報の種類で決めます。', en: '' }
    choices:
      - id: l02-stop
        text: { ja: '顧客の設計情報を扱う作業を止め、影響する案件を洗い出す。', en: '' }
        explain: { ja: '情報の種類で止める範囲を決めています。止めた案件を洗い出せば、納期の相談も具体的にできます。', en: '' }
        minutes: 120
        category: recover
        points: 120
        refs: [no10-ai-guideline, cissp-cbk-secops]
        gauges: { damage: -10, trust: 8, stamina: -8 }
        setFlags: { stoppedUse: true }
        items:
          - { id: l02-c1, points: 10, axis: order, refs: [cissp-cbk-secops] }
          - { id: l02-c2, points: 8, axis: content, refs: [no10-ai-guideline] }
      - id: l02-keep
        text: { ja: '納期があるので作業は続け、AIの利用だけ控えさせる。', en: '' }
        explain: { ja: 'AIを控えても、手元の設計情報は同じように扱われます。止めた範囲が曖昧なまま、納期だけが優先されます。', en: '' }
        minutes: 60
        category: hurt
        points: -100
        refs: [no10-ai-guideline]
        gauges: { damage: 10, flame: 5, trust: -8 }
        items:
          - { id: l02-a1, points: -10, axis: order, refs: [no10-ai-guideline] }
          - { id: l02-a2, points: -5, axis: content, refs: [cissp-cbk-secops] }
      - id: l02-switch
        text: { ja: '別のAIに切り替えて、作業をそのまま続けさせる。', en: '' }
        explain: { ja: '事業者を変えても、顧客の情報を外に出すことに変わりはありません。入力の範囲も広がったままです。', en: '' }
        minutes: 90
        category: hurt
        points: -130
        refs: [no10-ppc-genai]
        gauges: { damage: 12, flame: 8, trust: -10 }
        items:
          - { id: l02-b1, points: -10, axis: content, refs: [no10-ppc-genai] }
          - { id: l02-b2, points: -8, axis: order, refs: [no10-ai-guideline] }

  - id: l03-customer
    at: { day: 1, minutes: 660 }
    phase: notify
    sound: { se: [phone_ring] }
    text: { ja: '午前11時。顧客の技術担当に、どこまで話すか。納期が近い案件もあり、営業は「今は言わないでほしい」と言っている。', en: '' }
    voices: [v03-field, v03-ok]
    notable:
      - { id: note-customer, text: { ja: '顧客への説明は、影響の大きい5社から順に訪問で行った。', en: '' } }
    lesson: { ja: '顧客の技術担当には、入力した情報と影響を具体的に伝えます。曖昧な表現で濁すと、後から分かったときに信頼を失います。納期の調整も、事実を伝えてから相談します。具体的な説明が、次の取引を守ります。', en: '' }
    choices:
      - id: l03-hide
        text: { ja: '顧客には言わず、社内で修正して納期に間に合わせる。', en: '' }
        explain: { ja: '黙って修正しても、入力された情報は戻りません。顧客が後から知れば、隠したことの方が問題になります。', en: '' }
        minutes: 120
        category: hurt
        points: -150
        refs: [meti-disclosure-guidance]
        gauges: { flame: 12, trust: -15 }
        coward: true
        setFlags: { hidFromCustomer: true }
        items:
          - { id: l03-a1, points: -12, axis: care, refs: [meti-disclosure-guidance] }
          - { id: l03-a2, points: -8, axis: wording, refs: [jpcert-handling] }
      - id: l03-explain
        text: { ja: '顧客の技術担当に、入力した情報と影響を具体的に説明する。', en: '' }
        explain: { ja: '技術担当に具体的に伝えることで、顧客は自分のシステムへの影響を判断できます。納期の相談も同じ場でできます。', en: '' }
        minutes: 180
        category: recover
        points: 120
        refs: [meti-disclosure-guidance, ppc-notify-person]
        gauges: { damage: -8, trust: 10, stamina: -10 }
        setFlags: { customerTold: true, prelimFiled: true }
        items:
          - { id: l03-c1, points: 10, axis: content, refs: [meti-disclosure-guidance] }
          - { id: l03-c2, points: 8, axis: care, refs: [ppc-notify-person] }
      - id: l03-vague
        text: { ja: '「一部の情報が外部に出た可能性」とだけ伝える。', en: '' }
        explain: { ja: '可能性とだけ伝えると、顧客は何を確認すればよいか分かりません。後から詳細が出て、説明のやり直しになります。', en: '' }
        minutes: 90
        category: hurt
        points: -90
        refs: [meti-disclosure-guidance]
        gauges: { flame: 8, trust: -8 }
        items:
          - { id: l03-b1, points: -10, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: l03-b2, points: -5, axis: content, refs: [ppc-notify-person] }

  - id: l04-delete
    at: { day: 2, minutes: 540 }
