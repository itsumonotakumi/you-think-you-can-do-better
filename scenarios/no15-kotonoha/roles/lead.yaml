    lesson: { ja: '本人を責めるだけでは、なぜ入力が必要だったかが見えません。経緯を聞き、何が入力されたかの洗い出しを一緒に進めます。納期の構造まで見えると、再発防止につながります。', en: '' }
    choices:
      - id: l05-blame
        text: { ja: '本人をチームから外し、全員の前で注意する。', en: '' }
        explain: { ja: '全員の前で責めると、他のメンバーは報告を控えます。入力の実態が見えなくなり、再発防止が進みません。', en: '' }
