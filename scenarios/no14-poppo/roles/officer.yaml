    lesson: { ja: '再発防止の教訓は、自社の中だけで終わらせない。点検表と教訓を自治体と業界に配り、毎年の訓練も続ける。共有は任意だからと待つと、同じ被害が起きてから動くことになる。', en: '' }
drafts:
  officer-notice:
    title: { ja: '会員通知文の法務確認', en: '' }
    slots:
      - id: legal
        label: { ja: '法的な位置づけ', en: '' }
        options:
          - { id: on-l-none, text: { ja: '法的な話は書かず、事実だけを書く', en: '' }, points: -5, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '法的な位置づけがないと、会員は会社が何をすべき立場か分からない。説明が不十分に見える。', en: '' } }
          - { id: on-l-short, text: { ja: '法務の確認だけを受けて、事実を書く', en: '' }, points: 2, axis: content, refs: [ppc-notify-person], explain: { ja: '法務の確認は受けたが、根拠までは示していない。会員への説明としてはもう一歩足りない。', en: '' } }
          - { id: on-l-explain, text: { ja: '法と規約に沿って、分かった事実を書く', en: '' }, points: 8, axis: content, refs: [ppc-notify-person], explain: { ja: '法的な根拠と事実を分けて書くと、会員は何が起きたか理解できる。説明責任も果たせる。', en: '' } }
      - id: scope
        label: { ja: '対象', en: '' }
        options:
          - { id: on-sc-some, text: { ja: '被害が確認できた会員だけに送る', en: '' }, points: -10, axis: content, refs: [ppc-notify-person], explain: { ja: '確認できた人だけに送ると、これから被害に遭う人に届かない。対象を後で訂正することになる。', en: '' } }
          - { id: on-sc-members, text: { ja: 'アプリ会員のうち、利用のある人に送る', en: '' }, points: 2, axis: content, refs: [ppc-notify-person], explain: { ja: '利用のある人に絞ると、久しぶりに使う人や残高だけ残している人に届かず、不安が残る。', en: '' } }
          - { id: on-sc-all, text: { ja: 'アプリ会員の全員に、まとめて送る', en: '' }, points: 5, axis: content, refs: [ppc-notify-person], explain: { ja: '全員に送れば、まだ気づいていない被害者も自分で確認できる。対象を絞るより安全だ。', en: '' } }
      - id: action
        label: { ja: '今すぐすること', en: '' }
        options:
          - { id: on-a-careful, text: { ja: '不審な動きに注意するよう呼びかける', en: '' }, points: -10, axis: care, refs: [ppc-notify-person], explain: { ja: '注意だけでは何をすればよいか分からない。不安が残り、窓口に問い合わせが集まって対応が遅れる。', en: '' } }
          - { id: on-a-one, text: { ja: 'パスワードの変更だけを書いて終える', en: '' }, points: 2, axis: care, refs: [no14-mfa-guideline], explain: { ja: 'パスワード変更は必要だが、それだけでは認証の弱さが残る。二要素認証の案内が抜けている。', en: '' } }
          - { id: on-a-change, text: { ja: 'パスワード変更と二要素認証の設定を書く', en: '' }, points: 10, axis: care, refs: [no14-mfa-guideline], explain: { ja: '取るべき行動が具体的で、実行すれば被害を防げる。設定の案内まで含んでいる点が良い。', en: '' } }
      - id: refund
        label: { ja: '補償の書き方', en: '' }
        options:
          - { id: on-r-rule, text: { ja: '規約に沿って個別に相談すると書く', en: '' }, points: -8, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '規約を盾にすると、何が戻るのか分からない。会員は自分で交渉するしかなくなり、不信が募る。', en: '' } }
          - { id: on-r-refund, text: { ja: '不正利用の残高とポイントは戻すと書く', en: '' }, points: 8, axis: care, refs: [ppc-notify-person], explain: { ja: '戻る範囲を明示すると、生活の不安が和らぐ。補償の手続きも案内しやすく、問い合わせが減る。', en: '' } }
      - id: contact
        label: { ja: '問い合わせ窓口', en: '' }
        options:
          - { id: on-w-hours, text: { ja: '専用窓口の番号と受付時間を書く', en: '' }, points: 8, axis: care, refs: [ppc-notify-person], explain: { ja: '番号と時間があれば、いつ相談できるか分かる。問い合わせの集中も時間帯に分散できる。', en: '' } }
          - { id: on-w-normal, text: { ja: '通常の店舗窓口で受けると書く', en: '' }, points: -5, axis: care, refs: [ipa-sme-guideline], explain: { ja: '通常の窓口は他の用事で混んでいる。被害の相談が埋もれ、店頭の負担も増えて対応が遅れる。', en: '' } }
      - id: apology
        label: { ja: '謝罪の主語', en: '' }
        options:
          - { id: on-ap-user, text: { ja: '利用者の使い回しが原因と書く', en: '' }, points: -15, axis: wording, refs: [no14-credential-stuffing], explain: { ja: '原因を利用者に寄せると、認証を弱くしていた自社の責任が消える。会員は会社を信頼しなくなる。', en: '' } }
          - { id: on-ap-own, text: { ja: '当社としてお詫びすると書く', en: '' }, points: 5, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: 'サービスを提供する主体としての謝罪が伝わる。責任の所在も明確になり、説明の前提が揃う。', en: '' } }
      - id: next
        label: { ja: '次の公表', en: '' }
        options:
          - { id: on-n-none, text: { ja: '次回の予定は書かない', en: '' }, points: -5, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '次回の予定がないと、不安が憶測に変わる。問い合わせがいつ終わるのかも見えず、問い合わせが増える。', en: '' } }
          - { id: on-n-next, text: { ja: '次の公表予定を書く', en: '' }, points: 5, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '次の接点があると、会員は続報を待てる。情報の空白を憶測で埋められにくくなり、問い合わせも減る。', en: '' } }
      - id: record
        label: { ja: '記録', en: '' }
        options:
          - { id: on-r-log, text: { ja: '通知の時刻と版を記録する', en: '' }, points: 5, axis: record, refs: [jpcert-handling], explain: { ja: 'いつ何を伝えたかが残れば、後からの訂正も説明できる。会員の問い合わせにも正確に答えられる。', en: '' } }
          - { id: on-r-none, text: { ja: '通知の記録は残さない', en: '' }, points: -8, axis: record, refs: [jpcert-handling], explain: { ja: '記録がないと、通知の内容を後から確認できない。訂正や説明のやり直しが難しくなる。', en: '' } }
      - id: staff
        label: { ja: '店頭の応援', en: '' }
        options:
          - { id: on-p-none, text: { ja: '応援の予定には特に触れない', en: '' }, points: -5, axis: care, refs: [ipa-sme-guideline], explain: { ja: '問い合わせの増加を見込まないと、現場が通常業務と対応を同時に抱える。疲労とミスが増える。', en: '' } }
          - { id: on-p-support, text: { ja: '店頭と電話の応援を増やすと書く', en: '' }, points: 5, axis: care, refs: [ipa-sme-guideline], explain: { ja: '通知の後には問い合わせが来る。先に応援を決めておくと、店頭の通常業務も止まらない。', en: '' } }
      - id: phish
        label: { ja: '偽の通知への注意', en: '' }
        options:
          - { id: on-ph-own, text: { ja: '電話で暗証番号を聞かないと書く', en: '' }, points: 8, axis: care, refs: [ppc-notify-person], explain: { ja: '自社が電話で暗証番号を聞かないと明言すると、偽の電話を見分けられる。二次被害を減らせる。', en: '' } }
          - { id: on-ph-none, text: { ja: '偽の連絡にも注意するよう書く', en: '' }, points: -5, axis: care, refs: [ppc-notify-person], explain: { ja: '注意だけでは、本物と偽物の見分けがつかない。不安につけ込む電話やメールを止められない。', en: '' } }
