          - { id: o13-a-order, points: -8, axis: order, refs: [meti-csm-guideline] }
          - { id: o13-a-time, points: -5, axis: time, refs: [no14-credential-stuffing] }
    lesson: { ja: '再発防止は、二要素認証と監視の両方に予算を付け、担当と期限を決める。監視だけではログインを止められず、研修だけでは認証の弱さは埋まらない。実行の確認と進捗の公開まで設計する。', en: '' }

