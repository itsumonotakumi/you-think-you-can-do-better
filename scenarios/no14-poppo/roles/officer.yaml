        items:
          - { id: o15-a-content, points: -20, axis: content, refs: [meti-disclosure-guidance] }
          - { id: o15-a-record, points: -10, axis: record, refs: [cissp-cbk-secops] }
          - { id: o15-a-wording, points: -10, axis: wording, refs: [meti-disclosure-guidance] }
      - id: o15-full
        text: { ja: '第三者委員会の意見を全文載せ、報告書を公開する。', en: '' }
        explain: { ja: '第三者委員会の意見を全文載せることで、調査の独立性が伝わる。都合の悪い指摘も隠さず、再発防止につなげられる。', en: '' }
        minutes: 180
        category: recover
        points: 110
        refs: [cissp-cbk-secops, meti-disclosure-guidance]
        gauges: { flame: -10, trust: 15, stamina: -10 }
        setFlags: { reportPublished: true }
        items:
