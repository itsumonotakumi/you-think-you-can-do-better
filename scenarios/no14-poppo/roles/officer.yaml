          - { id: o15-c-record, points: 8, axis: record, refs: [meti-disclosure-guidance] }
          - { id: o15-c-wording, points: 8, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: o15-c-order, points: 5, axis: order, refs: [meti-csm-guideline] }
    lesson: { ja: '調査報告書は、第三者委員会の意見を全文載せて公開する。要約だけでは、都合の悪い指摘が抜けていないか分からない。非公開にすると、検証も形だけと受け取られ、再発防止の信頼も失う。', en: '' }

