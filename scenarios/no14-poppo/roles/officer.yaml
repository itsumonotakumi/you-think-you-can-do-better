# No.14 ハルカゼマート / 役員（管理本部長）ロール
# プレイヤーは管理本部長。広報、法務、経理、人事、店舗運営を束ねる。
# 技術の判断はデジタル事業部に任せ、社内の連絡、対外的な説明、予算、契約、被害者対応を扱う。
# 判断ポイント16、細目は choices[].items と drafts の合計で80以上。
