          - { id: o14-c-care, points: 8, axis: care, refs: [ppc-notify-person] }
          - { id: o14-c-wording, points: 8, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: o14-c-record, points: 5, axis: record, refs: [jpcert-handling] }
    lesson: { ja: '記者会見の準備は、広報と法務だけでなく全役員で想定問答を揃える。最初に被害者への謝罪を置き、数字と会員対応の実態を確認する。質問を制限すると、隠していると映る。', en: '' }

  - id: o15-third-party
    at: { day: 21, minutes: 600 }
    phase: after
    sound: { se: [notify_news] }
    text: { ja: 'Day 21 午前10時。調査報告書と第三者委員会。どう扱うか。', en: '' }
    voices: [v15-expert, v15-law, v15-ok]
    choices:
      - id: o15-summary
        text: { ja: '第三者委員会の要約だけを載せて公開する。', en: '' }
        explain: { ja: '要約だけでは、都合の悪い指摘が抜けていないか分からない。調査の独立性そのものが疑われる。', en: '' }
        minutes: 90
        category: maintain
        points: 20
        refs: [cissp-cbk-secops]
        gauges: { trust: 5, stamina: -10 }
        items:
