        text: { ja: '点検表と教訓を自治体と業界に配り、毎年の訓練も続ける。', en: '' }
        explain: { ja: '点検表と教訓を配り、訓練まで続けると決めている。地域の事業者が同じ手口を防げる、実効性のある共有だ。', en: '' }
