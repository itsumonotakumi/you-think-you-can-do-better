          - { id: e14-c-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: e14-c-wording, points: 5, axis: wording, refs: [meti-disclosure-guidance] }
      - id: e14-summary
        text: { ja: '要約だけを公開し、詳しい内容は社内に留める。', en: '' }
        explain: { ja: '要約だけでは、原因をどこまで調べたのか分からない。都合の悪い指摘が隠れていると疑われ、検証の信頼が下がる。', en: '' }
        minutes: 90
        category: maintain
        points: 20
        refs: [meti-disclosure-guidance]
        gauges: { trust: 5, stamina: -10 }
        items:
          - { id: e14-b-content, points: 5, axis: content, refs: [meti-disclosure-guidance] }
          - { id: e14-b-record, points: 5, axis: record, refs: [jpcert-handling] }
          - { id: e14-b-wording, points: 5, axis: wording, refs: [meti-disclosure-guidance] }
      - id: e14-hide
        text: { ja: '報告書は公開せず、再発防止だけを発表する。', en: '' }
        explain: { ja: '原因の検証を閉じたままにすると、同じ手口のリスクが残る。隠蔽と受け取られ、回復しかけた信頼も失う。', en: '' }
        minutes: 60
        category: fatal
        points: -230
        refs: [meti-disclosure-guidance]
        gauges: { flame: 20, trust: -20 }
        setFlags: { reportHidden: true }
        delayed:
          - { afterPhases: 2, points: -80, gauges: { flame: 15, trust: -10 }, reason: { ja: '報告書の非公開が報じられ、再発防止も形だけと批判された。', en: '' } }
        items:
          - { id: e14-a-content, points: -20, axis: content, refs: [meti-disclosure-guidance] }
          - { id: e14-a-record, points: -10, axis: record, refs: [jpcert-handling] }
          - { id: e14-a-wording, points: -10, axis: wording, refs: [meti-disclosure-guidance] }
    lesson: { ja: '調査報告書は、攻撃に使える詳細だけ伏せて公開する。原因と判断の誤り、再発防止の担当と時期を書く。要約だけ、あるいは非公開にすると、検証の信頼も回復の機会も失う。', en: '' }

  - id: e15-steady
    at: { day: 45, minutes: 600 }
    phase: after
    sound: { se: [notify_chat] }
    text: { ja: 'Day 45 午前10時。再発防止の進捗をどう伝え、何を残すか。', en: '' }
    voices: [v15-past, v15-coward, v15-ok]
    choices:
      - id: e15-once
        text: { ja: '一度だけ公表し、その後は通常の広報に戻す。', en: '' }
        explain: { ja: '一度の公表で区切りをつけると、対策が続いているか確認できない。未完了の課題が放置されやすい。', en: '' }
        minutes: 60
        category: maintain
        points: 30
        refs: [meti-disclosure-guidance]
        gauges: { trust: 5, stamina: -5 }
        items:
          - { id: e15-b-record, points: 5, axis: record, refs: [meti-disclosure-guidance] }
          - { id: e15-b-content, points: 5, axis: content, refs: [meti-csm-guideline] }
          - { id: e15-b-order, points: 5, axis: order, refs: [meti-csm-guideline] }
      - id: e15-monthly
        text: { ja: '毎月の進捗と、他社でも使える点検表を公開する。', en: '' }
        explain: { ja: '対策の進み具合を続けて示し、他の事業者にも使える形にしている。地域全体の備えを上げる点で最も評価できる。', en: '' }
        minutes: 240
        category: increase
        points: 300
        fatalAlternate: 50
        refs: [meti-csm-guideline, no14-mfa-guideline]
        gauges: { flame: -15, trust: 20, stamina: -15 }
        setFlags: { sharedLessons: true, ppcFinalFiled: true }
        items:
          - { id: e15-c-content, points: 8, axis: content, refs: [meti-csm-guideline] }
          - { id: e15-c-record, points: 8, axis: record, refs: [meti-disclosure-guidance] }
          - { id: e15-c-care, points: 5, axis: care, refs: [no14-mfa-guideline] }
          - { id: e15-c-order, points: 5, axis: order, refs: [meti-csm-guideline] }
      - id: e15-quiet
        text: { ja: '再発防止は社内で進め、外には出さない。', en: '' }
        explain: { ja: '社内で進めるだけでは、対策が実行されたか外から確認できない。地域の信頼も、次の事件の備えも積み上がらない。', en: '' }
        minutes: 60
        category: hurt
        points: -80
        refs: [meti-disclosure-guidance]
        gauges: { trust: -5, flame: 5 }
        coward: true
        items:
          - { id: e15-a-content, points: -10, axis: content, refs: [meti-csm-guideline] }
          - { id: e15-a-record, points: -8, axis: record, refs: [meti-disclosure-guidance] }
          - { id: e15-a-care, points: -5, axis: care, refs: [no14-mfa-guideline] }
    lesson: { ja: '再発防止は一度公表して終わりにしない。進捗を毎月示し、他社でも使える点検表として共有する。社内だけで進めると、実行の有無も効果も外から確認できず、次の事件の備えにならない。', en: '' }
drafts:
  exec-notice:
    title: { ja: '会員への通知文', en: '' }
    slots:
      - id: timing
        label: { ja: '出す時刻', en: '' }
        auto: true
        items:
          - { id: en-t-24h, when: { withinHours: 24 }, points: 10, axis: time, refs: [ppc-notify-person] }
          - { id: en-t-48h, when: { withinHours: 48 }, points: 5, axis: time, refs: [ppc-notify-person] }
          - { id: en-t-late, when: { otherwise: true }, points: -15, axis: time, refs: [ppc-notify-person] }
      - id: subject
        label: { ja: '件名', en: '' }
        options:
          - { id: en-s-generic, text: { ja: 'アプリに関する重要なお知らせ', en: '' }, points: -5, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: '何の連絡か分からない件名は、開かれずに捨てられやすい。不安だけが残り、行動につながらない。', en: '' } }
          - { id: en-s-app, text: { ja: 'アプリの不正利用に関するお知らせ', en: '' }, points: 2, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: '何の話かは分かるが、開く理由が弱い。変更してほしい行動まで件名で伝わらず、開かれない。', en: '' } }
          - { id: en-s-own, text: { ja: '不正ログインのお詫びと変更のお願い', en: '' }, points: 8, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: '何の連絡かが件名で分かり、開いてもらいやすい。変更してほしい行動まで件名で伝わる。', en: '' } }
      - id: cause
        label: { ja: '原因の書き方', en: '' }
        options:
          - { id: en-c-other, text: { ja: '他社から流出した ID とパスワードの使い回し', en: '' }, points: 10, axis: content, refs: [no14-credential-stuffing], explain: { ja: '自社からの漏えいと区別しながら、手口を具体的に伝えている。利用者が自分の状況を判断できる。', en: '' } }
          - { id: en-c-bug, text: { ja: '当社システムの不具合による不正アクセス', en: '' }, points: -20, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '事実と違う原因を書くと、後で訂正が必要になる。利用者も取るべき行動を誤り、不信が残る。', en: '' } }
      - id: scope
        label: { ja: '対象', en: '' }
        options:
          - { id: en-sc-some, text: { ja: '確認できた人だけ', en: '' }, points: -10, axis: content, refs: [ppc-notify-person], explain: { ja: '確認できた人だけに送ると、これから被害に遭う人に届かない。対象の線引きを後で訂正することになる。', en: '' } }
          - { id: en-sc-all, text: { ja: 'アプリ会員の全員', en: '' }, points: 5, axis: content, refs: [ppc-notify-person], explain: { ja: '全員に知らせることで、まだ気づいていない被害者も自分で確認できる。対象を絞りすぎるより安全。', en: '' } }
      - id: action
        label: { ja: '今すぐすること', en: '' }
        options:
          - { id: en-a-change, text: { ja: 'パスワードの変更と二要素認証の設定', en: '' }, points: 10, axis: care, refs: [no14-mfa-guideline], explain: { ja: '取るべき行動が具体的で、実行すれば被害を防げる。設定の案内まで含んでいる点が良い。', en: '' } }
          - { id: en-a-careful, text: { ja: '不審な動きに注意するようお願いします', en: '' }, points: -10, axis: care, refs: [ppc-notify-person], explain: { ja: '何をすればよいか分からない注意喚起は、行動につながらない。不安だけが残り、窓口に問い合わせが集まる。', en: '' } }
      - id: money
        label: { ja: '残高とポイント', en: '' }
        options:
          - { id: en-m-rules, text: { ja: '規約に沿って個別に相談して対応する', en: '' }, points: -8, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '規約を盾にすると、何が戻るのか分からない。会員は自分で交渉するしかなくなり、不信が募る。', en: '' } }
          - { id: en-m-part, text: { ja: '不正に使われたポイントだけを戻す', en: '' }, points: 2, axis: care, refs: [ppc-notify-person], explain: { ja: 'ポイントだけを戻すと、チャージした残高を失った会員の生活が戻らない。補償の線引きも説明しにくい。', en: '' } }
          - { id: en-m-refund, text: { ja: '不正に使われた残高とポイントは戻す', en: '' }, points: 8, axis: care, refs: [ppc-notify-person], explain: { ja: '失ったものが戻る見通しを示すと、生活の不安が和らぐ。補償の対象と手続きも伝えやすい。', en: '' } }
      - id: contact
        label: { ja: '問い合わせ窓口', en: '' }
        options:
          - { id: en-w-hours, text: { ja: '専用窓口の番号と受付時間', en: '' }, points: 8, axis: care, refs: [ppc-notify-person], explain: { ja: '番号と時間があれば、いつ相談できるか分かる。問い合わせの集中も時間帯に分散できる。', en: '' } }
          - { id: en-w-normal, text: { ja: '通常の店舗窓口で受け付ける', en: '' }, points: -5, axis: care, refs: [ipa-sme-guideline], explain: { ja: '通常の窓口は他の用事で混んでいる。被害の相談が埋もれ、店頭の負担も増えて対応が遅れる。', en: '' } }
      - id: apology
        label: { ja: '謝罪の主語', en: '' }
        options:
          - { id: en-ap-user, text: { ja: '利用者の使い回しが原因です', en: '' }, points: -15, axis: wording, refs: [no14-credential-stuffing], explain: { ja: '原因を利用者に寄せると、認証を弱くしていた自社の責任が消える。会員は会社を信頼しなくなる。', en: '' } }
          - { id: en-ap-own, text: { ja: '当社として深くお詫びします', en: '' }, points: 5, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: 'サービスを提供する主体としての謝罪が伝わる。責任の所在も明確になり、説明の前提が揃う。', en: '' } }
      - id: record
        label: { ja: '記録', en: '' }
        options:
          - { id: en-r-none, text: { ja: '通知の記録は残さないままにする', en: '' }, points: -8, axis: record, refs: [jpcert-handling], explain: { ja: '記録がないと、通知の内容を後から確認できない。訂正や説明のやり直しが難しくなる。', en: '' } }
          - { id: en-r-simple, text: { ja: '通知を出した日だけを記録する', en: '' }, points: 2, axis: record, refs: [jpcert-handling], explain: { ja: '日付だけでは、何を伝えたか分からない。訂正が必要になったときに、説明の根拠が残らない。', en: '' } }
          - { id: en-r-log, text: { ja: '通知の時刻と版を記録に残す', en: '' }, points: 5, axis: record, refs: [jpcert-handling], explain: { ja: 'いつ何を伝えたかが残れば、後からの訂正も説明できる。会員からの問い合わせにも正確に答えられる。', en: '' } }
      - id: next
        label: { ja: '次の公表', en: '' }
        options:
          - { id: en-n-none, text: { ja: '次回の予定は書かない', en: '' }, points: -5, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '次回の予定がないと、不安が憶測に変わる。問い合わせがいつ終わるのかも見えず、問い合わせが増える。', en: '' } }
          - { id: en-n-next, text: { ja: '次の公表予定を書く', en: '' }, points: 5, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '次の接点があると、会員は続報を待てる。情報の空白を憶測で埋められにくくなり、問い合わせも減る。', en: '' } }
      - id: staff
        label: { ja: '店頭の応援', en: '' }
        options:
          - { id: en-p-none, text: { ja: '応援の予定には特に触れない', en: '' }, points: -5, axis: care, refs: [ipa-sme-guideline], explain: { ja: '問い合わせの増加を見込まないと、現場が通常業務と対応を同時に抱える。疲労とミスが増える。', en: '' } }
          - { id: en-p-later, text: { ja: '応援は必要になってから考える', en: '' }, points: 2, axis: care, refs: [ipa-sme-guideline], explain: { ja: '必要になってからでは、問い合わせの山に間に合わない。現場は通常業務と対応を同時に抱える。', en: '' } }
          - { id: en-p-support, text: { ja: '店頭と電話の応援を増やすと書く', en: '' }, points: 5, axis: care, refs: [ipa-sme-guideline], explain: { ja: '通知の後には問い合わせが来る。先に応援を決めておくと、店頭の通常業務も止まらない。', en: '' } }
      - id: phish
        label: { ja: '偽の通知への注意', en: '' }
        options:
          - { id: en-ph-none, text: { ja: '偽の連絡にも注意するよう書く', en: '' }, points: -5, axis: care, refs: [ppc-notify-person], explain: { ja: '注意だけでは、本物と偽物の見分けがつかない。不安につけ込む電話やメールを止められない。', en: '' } }
          - { id: en-ph-own, text: { ja: '電話で暗証番号を聞くことはないと書く', en: '' }, points: 8, axis: care, refs: [ppc-notify-person], explain: { ja: '自社が電話で暗証番号を聞かないと明言すると、偽の電話を見分けられる。二次被害を減らす効果が大きい。', en: '' } }
  exec-final-report:
    title: { ja: '調査報告書の公開版', en: '' }
    slots:
      - id: scope
        label: { ja: '公開する範囲', en: '' }
        options:
          - { id: efr-s-summary, text: { ja: '要約だけを社外に公開して済ませる', en: '' }, points: -10, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '要約だけでは、何を調べて何を直すのか分からない。都合の悪い指摘が隠れたと疑われる。', en: '' } }
          - { id: efr-s-omit, text: { ja: '攻撃に使える詳細だけ伏せて公開する', en: '' }, points: 10, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '危険な詳細を伏せつつ、検証の結果を伝えられる。再発防止の説得力も保てて、地域の理解も得やすい。', en: '' } }
      - id: cause
        label: { ja: '原因の書き方', en: '' }
        options:
          - { id: efr-c-weak, text: { ja: '認証の弱さと使い回しを具体的に書く', en: '' }, points: 10, axis: content, refs: [no14-credential-stuffing], explain: { ja: '攻撃の手口と自社の認証の弱点を分けて書いている。対策の担当と優先順位を決めやすい。', en: '' } }
          - { id: efr-c-vague, text: { ja: '外部からの攻撃があったとだけ書く', en: '' }, points: -10, axis: content, refs: [nist-sp800-61r3], explain: { ja: '外部からの攻撃だけでは、どこを直すのか分からない。対策が精神論に流れ、検証もできない。', en: '' } }
      - id: measures
        label: { ja: '再発防止策', en: '' }
        options:
          - { id: efr-m-slogan, text: { ja: '再発防止に努めますと書く', en: '' }, points: -10, axis: content, refs: [cissp-cbk-secops], explain: { ja: '努めますだけでは、何をいつ誰がやるのか分からない。実行されたかの確認もできない。', en: '' } }
          - { id: efr-m-plan, text: { ja: '実施時期と担当を書く', en: '' }, points: 10, axis: content, refs: [cissp-cbk-secops], explain: { ja: '時期と担当があれば、実行されたかを確かめられる。毎月の進捗公開にもそのまま使える。', en: '' } }
      - id: progress
        label: { ja: '進捗の公開', en: '' }
        options:
          - { id: efr-o-once, text: { ja: '一度だけ公開して終わりにする', en: '' }, points: -5, axis: record, refs: [meti-disclosure-guidance], explain: { ja: '一度きりの公開では、その後の進み具合が分からない。未完了の対策が放置されやすい。', en: '' } }
          - { id: efr-o-quarter, text: { ja: '四半期ごとに進捗を公開する', en: '' }, points: 2, axis: record, refs: [meti-disclosure-guidance], explain: { ja: '四半期ごとでは、対策の遅れに気づくのが遅れる。改善の速度も見えにくく、批判が続く。', en: '' } }
          - { id: efr-o-monthly, text: { ja: '毎月の進捗を公開し続けていく', en: '' }, points: 8, axis: record, refs: [meti-disclosure-guidance], explain: { ja: '毎月の公開は、対策が形だけになっていないか確かめられる。改善の速度も見え、信頼の回復につながる。', en: '' } }
      - id: victims
        label: { ja: '会員への対応', en: '' }
        options:
          - { id: efr-v-none, text: { ja: '会員対応には触れない', en: '' }, points: -10, axis: care, refs: [ppc-notify-person], explain: { ja: '会員対応に触れないと、被害者の視点が抜けた報告になる。地域の信頼も戻らず、再発防止も弱くなる。', en: '' } }
          - { id: efr-v-record, text: { ja: '通知と補償の実績を書く', en: '' }, points: 8, axis: care, refs: [ppc-notify-person], explain: { ja: '通知と補償の実績は、実際に行った証拠になる。口約束との違いを具体的に示せて、納得につながる。', en: '' } }
      - id: thirdparty
        label: { ja: '第三者委員会', en: '' }
        options:
          - { id: efr-t-full, text: { ja: '第三者委員会の意見を載せる', en: '' }, points: 8, axis: content, refs: [cissp-cbk-secops], explain: { ja: '第三者委員会の意見を載せると、調査の独立性が伝わる。都合の悪い指摘も隠せず、検証の信頼が上がる。', en: '' } }
          - { id: efr-t-summary, text: { ja: '意見は要約だけを載せる', en: '' }, points: -8, axis: content, refs: [cissp-cbk-secops], explain: { ja: '要約だけでは、都合の悪い指摘が抜けていないか分からない。調査の透明性が下がり、再発防止も弱くなる。', en: '' } }
      - id: share
        label: { ja: '業界への共有', en: '' }
        options:
          - { id: efr-sh-own, text: { ja: '自社と取引先の中にとどめる', en: '' }, points: -5, axis: content, refs: [meti-csm-guideline], explain: { ja: '自社だけに留めると、同じ型のリスクが地域に残る。再発防止に取り組む姿勢も伝わらない。', en: '' } }
          - { id: efr-sh-share, text: { ja: '得た教訓を地域の事業者に共有する', en: '' }, points: 8, axis: content, refs: [meti-csm-guideline], explain: { ja: '教訓を共有すると、同じ被害を別の店で防げる。点検の輪も広がり、地域の備えが上がる。', en: '' } }
      - id: ad
        label: { ja: '宣伝との線引き', en: '' }
        options:
          - { id: efr-ad-none, text: { ja: '復旧を宣伝に使わない', en: '' }, points: 5, axis: care, refs: [meti-disclosure-guidance], explain: { ja: '復旧を宣伝に使わない姿勢は、説明の信頼を保つ。関心が被害と会員対応からそれない。', en: '' } }
          - { id: efr-ad-use, text: { ja: '復旧を宣伝に使う', en: '' }, points: -15, axis: care, refs: [meti-disclosure-guidance], explain: { ja: '復旧を宣伝に使うと、被害や会員対応が軽く見られる。批判を招き、戻した信頼も損なう。', en: '' } }
      - id: reopen
        label: { ja: '再開の基準', en: '' }
        options:
          - { id: efr-r-none, text: { ja: '再開の基準は書かないままにする', en: '' }, points: -5, axis: order, refs: [nist-sp800-61r3], explain: { ja: '基準がないと、次の再開判断がその場の空気で決まる。危険な状態でも戻してしまい、再発を招く。', en: '' } }
          - { id: efr-r-clear, text: { ja: '再開の判断基準と停止の条件を書く', en: '' }, points: 8, axis: order, refs: [nist-sp800-61r3], explain: { ja: '再開と再停止の条件が明確だと、次の判断で迷わない。同じ手口が来たときの初動も速くなる。', en: '' } }
      - id: training
        label: { ja: '従業員への周知', en: '' }
        options:
          - { id: efr-tr-share, text: { ja: '店頭の従業員にも手口と対応を共有する', en: '' }, points: 8, axis: order, refs: [ipa-sme-guideline], explain: { ja: '店頭の従業員が手口を知ると、偽の電話や不審な依頼に気づける。会員への案内も揃う。', en: '' } }
          - { id: efr-tr-none, text: { ja: '本部だけで共有して店頭には伝えない', en: '' }, points: -5, axis: order, refs: [ipa-sme-guideline], explain: { ja: '店頭が知らないままでは、会員からの質問に答えられない。偽の電話への注意も伝わらない。', en: '' } }
      - id: leadership
        label: { ja: '経営陣の関与', en: '' }
        options:
          - { id: efr-l-own, text: { ja: '経営陣の関与と次の報告日を書く', en: '' }, points: 8, axis: order, refs: [meti-csm-guideline], explain: { ja: '経営陣が関わることと次の報告日が分かると、対策が止まらない。責任の所在も明確になる。', en: '' } }
          - { id: efr-l-none, text: { ja: '経営陣の関与には触れない', en: '' }, points: -5, axis: order, refs: [meti-csm-guideline], explain: { ja: '経営陣の関与が見えないと、対策が現場任せに見える。予算と権限の裏付けも伝わらない。', en: '' } }
