# No.14 ハルカゼマート / 経営者（代表取締役社長）ロール
# プレイヤーは社長。サービスを止めるか、補償をどこまで広げるか、二要素認証にいくら出すかを決める。
# 技術の詳細はデジタル事業部に任せ、外に出す言葉と、被害に遭った会員への向き合い方を選ぶ。
# 判断ポイント15、細目は choices[].items と drafts の合計で80以上。
estimateMinutes: 30
intro: { ja: 'あなたはハルカゼマートの代表取締役社長、風間 俊介。北関東で32店舗を営む食品スーパーだ。スマホの「ハルカゼポイント」は、店頭の支払いにもネットスーパーの決済にも使われ、会員は420万人いる。午前8時、お客様窓口から「残高が勝手に減っている」と電話が入った。同じ訴えが三件。原因も範囲も分かっていない。店は今日も開いている。止めるか、動かしたまま守るか。決めるのはあなただ。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-exec-ppc-prelim
    ref: ppc-report-prelim
    label: { ja: '個人情報保護委員会への速報', en: '' }
    points: -150
    doneFlag: ppcPrelimFiled
  - id: dl-exec-ppc-final
    ref: ppc-report-final-malicious
    label: { ja: '個人情報保護委員会への確報', en: '' }
    points: -120
    doneFlag: ppcFinalFiled
events:
  - id: ev-exec-news
    at: { day: 0, minutes: 1140 }
    voices: [v-ev-news]
    gauges: { flame: 10 }
    sound: { se: [notify_news] }
    caption: { ja: '地域ニュースが、アプリの不正利用を速報した。', en: '' }
  - id: ev-exec-store
    at: { day: 1, minutes: 720 }
    voices: [v-ev-store]
    gauges: { flame: 5 }
    sound: { se: [phone_ring] }
    caption: { ja: '店舗から、レジでの問い合わせが増えたと連絡が来た。', en: '' }
  - id: ev-exec-partner
    at: { day: 2, minutes: 900 }
    voices: [v-ev-partner]
    gauges: { flame: 5 }
    sound: { se: [mail_arrive] }
    caption: { ja: '提携する決済サービスから、対応状況の照会が来た。', en: '' }
  - id: ev-exec-member
    at: { day: 5, minutes: 540 }
    voices: [v-ev-member]
    gauges: { trust: -5 }
    sound: { se: [notify_chat] }
    caption: { ja: '窓口に、被害に遭った会員からの手紙が届いた。', en: '' }
points:
  - id: e01-first-call
    at: { day: 0, minutes: 480 }
    phase: detect
    sound: { se: [phone_ring] }
    text: { ja: '午前8時。お客様窓口から「アプリの残高が勝手に減っている」と電話が入った。同じ訴えが三件。まず何をするか。', en: '' }
    voices: [v01-public, v01-boss, v01-ok]
    notable:
      - { id: note-scale, text: { ja: '午前8時、残高の不正利用の訴えが三件。同じ兆候のアカウントを調査中。', en: '' } }
    choices:
      - id: e01-check
        text: { ja: '三件の詳細を聞き取り、残高の動きとログイン履歴を確認する。', en: '' }
        explain: { ja: '事実の確認から入るのは基本。ただし三件を個別に見るだけで、同じ手口の広がりを探す視点がない。', en: '' }
        minutes: 30
        category: maintain
        points: 20
        refs: [jpcert-handling]
        gauges: { trust: 5, stamina: -5 }
        items:
          - { id: e01-b-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: e01-b-time, points: 5, axis: time, refs: [jpcert-handling] }
          - { id: e01-b-order, points: 5, axis: order, refs: [meti-csm-guideline] }
      - id: e01-freeze
        text: { ja: '不正ログインの疑いがあるアカウントを凍結し、同じ兆候を全部調べる。', en: '' }
        explain: { ja: '個別の問い合わせを、同じ手口の被害の手がかりとして扱っている。凍結と全件調査を同時に始めた点が良い。', en: '' }
        minutes: 60
        category: recover
        points: 100
        refs: [no14-credential-stuffing, jpcert-handling]
        gauges: { trust: 10, stamina: -10 }
        setFlags: { initialFreeze: true }
        items:
          - { id: e01-c-order, points: 8, axis: order, refs: [meti-csm-guideline] }
          - { id: e01-c-content, points: 8, axis: content, refs: [no14-credential-stuffing] }
          - { id: e01-c-record, points: 5, axis: record, refs: [jpcert-handling] }
          - { id: e01-c-care, points: 5, axis: care, refs: [ppc-notify-person] }
      - id: e01-wait
        text: { ja: 'よくある問い合わせとして扱い、今日のうちは様子を見る。', en: '' }
        explain: { ja: '三件を偶然と決めつけ、同じ手口が広がる可能性を捨てている。翌日には被害の件数が増え、初動が後手になる。', en: '' }
        minutes: 30
        category: hurt
        points: -120
        refs: [jpcert-handling]
        gauges: { damage: 10, flame: 5, trust: -5 }
        coward: true
        delayed:
          - { afterPhases: 1, points: -40, gauges: { damage: 10 }, reason: { ja: '同じ手口の訴えが、翌朝には二十件を超えた。', en: '' } }
        items:
          - { id: e01-a-time, points: -10, axis: time, refs: [jpcert-handling] }
          - { id: e01-a-record, points: -10, axis: record, refs: [jpcert-handling] }
          - { id: e01-a-order, points: -8, axis: order, refs: [meti-csm-guideline] }
    lesson: { ja: '一件の問い合わせを、同じ手口の被害の手がかりとして扱う。疑わしいアカウントを凍結し、同じ兆候を全件洗い出す。様子を見る判断は、被害が広がってから初動をやり直すことになる。', en: '' }

  - id: e02-stop-app
    at: { day: 0, minutes: 525 }
    phase: detect
    sound: { se: [notify_chat] }
    text: { ja: '午前8時45分。同じ訴えが二十件を超えた。アプリは店頭決済とネットスーパーに使われている。止めるか。', en: '' }
    voices: [v02-coward, v02-bold, v02-ok]
    notable:
      - { id: note-stop, text: { ja: '午前8時45分、アプリの扱いを判断。店頭の代替決済と告知の準備を開始。', en: '' } }
    choices:
      - id: e02-stop-all
        text: { ja: 'アプリを全停止し、店頭の代替決済と告知を同時に用意する。', en: '' }
        explain: { ja: '被害の拡大を止める判断として妥当。止めることで生じる店頭とネットの混乱にも、先に手を打っている。', en: '' }
        minutes: 90
        category: recover
        points: 110
        refs: [nist-sp800-61r3, meti-disclosure-guidance]
        gauges: { damage: -15, flame: 10, trust: 5, stamina: -10 }
        setFlags: { appStopped: true }
        items:
          - { id: e02-c-order, points: 8, axis: order, refs: [nist-sp800-61r3] }
          - { id: e02-c-care, points: 8, axis: care, refs: [ppc-notify-person] }
          - { id: e02-c-content, points: 5, axis: content, refs: [meti-disclosure-guidance] }
          - { id: e02-c-time, points: 5, axis: time, refs: [nist-sp800-61r3] }
      - id: e02-freeze-only
        text: { ja: '該当アカウントだけを凍結し、アプリは動かしたまま監視する。', en: '' }
        explain: { ja: '影響を狭めてサービスを続ける判断は現実的。ただし凍結の基準が甘いと、次のアカウントで同じ被害が起きる。', en: '' }
        minutes: 60
        category: maintain
        points: 25
        refs: [no14-credential-stuffing]
        gauges: { flame: 5, trust: 5, stamina: -5 }
        setFlags: { appStopped: false }
        items:
          - { id: e02-b-order, points: 8, axis: order, refs: [no14-credential-stuffing] }
          - { id: e02-b-content, points: 5, axis: content, refs: [nist-sp800-61r3] }
          - { id: e02-b-record, points: 5, axis: record, refs: [jpcert-handling] }
      - id: e02-keep
        text: { ja: '止めずに監視だけを続け、被害の届け出が出るまで待つ。', en: '' }
        explain: { ja: '止めない理由を「届け出がない」に置くと、被害が確認されるまで使われ続ける。監視だけでは利用を止められない。', en: '' }
        minutes: 45
        category: hurt
        points: -140
        refs: [no14-credential-stuffing]
        gauges: { damage: 15, flame: 10, trust: -10 }
        coward: true
        setFlags: { appStopped: false }
        delayed:
          - { afterPhases: 1, points: -50, gauges: { damage: 10, trust: -10 }, reason: { ja: 'アプリを止めなかった間に、不正利用が夜通し続いた。', en: '' } }
        items:
          - { id: e02-a-content, points: -10, axis: content, refs: [no14-credential-stuffing] }
          - { id: e02-a-order, points: -10, axis: order, refs: [nist-sp800-61r3] }
          - { id: e02-a-care, points: -8, axis: care, refs: [ppc-notify-person] }
    lesson: { ja: '被害が広がる兆候があるときは、サービスを止める判断と、止めた後の代替手段を同時に決める。該当アカウントだけを凍結する場合も、基準を明確にして全件を監視する。届け出を待つ間も被害は進む。', en: '' }

  - id: e03-wording
    at: { day: 0, minutes: 600 }
    phase: contain
    sound: { se: [notify_chat] }
    text: { ja: '午前10時。他社から流出したメールアドレスとパスワードの使い回しでログインされていた。自社からの漏えいは確認されていない。どう説明するか。', en: '' }
    voices: [v03-attacker, v03-law, v03-ok]
    choices:
      - id: e03-other-leak
        text: { ja: '他社から流出した認証情報の使い回しによる被害だと説明する。', en: '' }
        explain: { ja: '自社からの漏えいがないことを、攻撃の手口と一緒に説明している。責任の所在を曖昧にせず、対策の必要性も伝わる。', en: '' }
        minutes: 90
        category: recover
        points: 100
        refs: [no14-credential-stuffing, meti-disclosure-guidance]
        gauges: { flame: 5, trust: 10, stamina: -10 }
        setFlags: { ownLeakExplained: true }
        items:
          - { id: e03-c-wording, points: 8, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: e03-c-content, points: 8, axis: content, refs: [no14-credential-stuffing] }
          - { id: e03-c-time, points: 5, axis: time, refs: [meti-disclosure-guidance] }
      - id: e03-not-our-leak
        text: { ja: '「当社から情報は漏れていない」とだけ強調する。', en: '' }
        explain: { ja: '事実ではあるが、それだけでは利用者の不安に答えていない。自社の認証が弱かった点も説明から抜け落ちる。', en: '' }
        minutes: 60
        category: hurt
        points: -90
        refs: [meti-disclosure-guidance]
        gauges: { flame: 10, trust: -5 }
        setFlags: { saidNotOurLeak: true }
        items:
          - { id: e03-b-wording, points: -10, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: e03-b-content, points: -8, axis: content, refs: [no14-credential-stuffing] }
          - { id: e03-b-care, points: -5, axis: care, refs: [ppc-notify-person] }
      - id: e03-user-fault
        text: { ja: '利用者のパスワード管理が甘かったと、はっきり説明する。', en: '' }
        explain: { ja: '被害の原因を利用者に寄せると、認証を弱いままにした自社の責任が消える。会員は会社を信頼しなくなる。', en: '' }
        minutes: 45
        category: fatal
        points: -220
        refs: [no14-credential-stuffing]
        gauges: { flame: 25, trust: -20 }
        setFlags: { blamedUsers: true }
        delayed:
          - { afterPhases: 2, points: -80, gauges: { flame: 15, trust: -10 }, reason: { ja: '「利用者のせいにする会社」と報道され、解約が増えた。', en: '' } }
        items:
          - { id: e03-a-wording, points: -20, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: e03-a-care, points: -10, axis: care, refs: [ppc-notify-person] }
          - { id: e03-a-content, points: -10, axis: content, refs: [no14-credential-stuffing] }
    lesson: { ja: '自社からの漏えいがない場合も、攻撃の手口と自社の認証の弱さを一緒に説明する。「漏れていない」だけでは不安に答えられない。被害の原因を利用者のパスワード管理に寄せると、信頼を失う。', en: '' }

  - id: e04-compensation
    at: { day: 0, minutes: 690 }
    phase: contain
    sound: { se: [notify_chat] }
    text: { ja: '午前11時30分。不正に使われた残高は、まだ把握できた分で六百万円を超える。補償をどうするか。', en: '' }
    voices: [v04-popular, v04-field, v04-ok]
    notable:
      - { id: note-refund, text: { ja: '不正利用の補償は、被害に遭った会員の残高を全額戻す方針。申請窓口を開く。', en: '' } }
    choices:
      - id: e04-case-by-case
        text: { ja: '警察の被害届が出た人だけ、個別に補償を検討する。', en: '' }
        explain: { ja: '届け出を条件にすると、泣き寝入りする会員が取り残される。少額の被害ほど届け出は出されず、不信が残る。', en: '' }
        minutes: 60
        category: hurt
        points: -110
        refs: [ppc-notify-person]
        gauges: { flame: 15, trust: -10 }
        coward: true
        items:
          - { id: e04-a-care, points: -10, axis: care, refs: [ppc-notify-person] }
          - { id: e04-a-order, points: -8, axis: order, refs: [ppc-notify-person] }
          - { id: e04-a-record, points: -5, axis: record, refs: [jpcert-handling] }
      - id: e04-full
        text: { ja: '被害に遭った会員の残高を全額戻し、申請窓口も開く。', en: '' }
        explain: { ja: '被害の大きさを問わず戻す方針を示し、申請の受け皿も用意している。会員が自分で動ける形になった点が良い。', en: '' }
        minutes: 120
        category: recover
        points: 110
        refs: [ppc-notify-person, meti-csm-guideline]
        gauges: { flame: -10, trust: 15, stamina: -10 }
        setFlags: { fullRefund: true }
        items:
          - { id: e04-c-care, points: 10, axis: care, refs: [ppc-notify-person] }
          - { id: e04-c-order, points: 8, axis: order, refs: [meti-csm-guideline] }
          - { id: e04-c-record, points: 5, axis: record, refs: [jpcert-handling] }
          - { id: e04-c-time, points: 5, axis: time, refs: [jpcert-handling] }
      - id: e04-points-only
        text: { ja: 'ポイントだけを戻し、チャージ残高は規約に沿って扱う。', en: '' }
        explain: { ja: '規約を盾にすると、現金に近い残高を失った会員の納得を得られない。補償の線引きを説明する機会も失う。', en: '' }
        minutes: 90
        category: maintain
        points: 20
        refs: [ppc-notify-person]
        gauges: { flame: 5, trust: -5 }
        items:
          - { id: e04-b-care, points: 5, axis: care, refs: [ppc-notify-person] }
          - { id: e04-b-content, points: 5, axis: content, refs: [meti-disclosure-guidance] }
          - { id: e04-b-record, points: 5, axis: record, refs: [jpcert-handling] }
    lesson: { ja: '不正利用の補償は、被害の大きさを問わず戻す方針を先に示す。警察の届け出を条件にすると、少額の被害者が取り残される。申請窓口を開き、対象と時期の考え方を公表する。', en: '' }

  - id: e05-command
    at: { day: 0, minutes: 840 }
    phase: organize
    sound: { se: [notify_chat] }
    text: { ja: '午後2時。社長室に対策本部を置いた。技術、広報、店舗、窓口の誰が何を決めるか。まだ決まっていない。', en: '' }
    voices: [v05-boss, v05-flattery, v05-ok]
    choices:
      - id: e05-meeting
        text: { ja: '毎回の会議で全員の合意を取ってから決める。', en: '' }
        explain: { ja: '合意形成を重んじるあまり、決定が遅れる。被害が動いている間は、決めないこと自体が被害を広げる。', en: '' }
        minutes: 120
        category: maintain
        points: 20
        refs: [meti-csm-guideline]
        gauges: { trust: 5, stamina: -15 }
        items:
          - { id: e05-b-order, points: 5, axis: order, refs: [meti-csm-guideline] }
          - { id: e05-b-record, points: 5, axis: record, refs: [jpcert-handling] }
          - { id: e05-b-care, points: 5, axis: care, refs: [ipa-sme-guideline] }
      - id: e05-ceo-all
        text: { ja: '社長が全部を自分で決め、担当者には報告だけ求める。', en: '' }
        explain: { ja: '決定は速いが、社長が技術と現場の詳細を同時に追えない。判断が一点に詰まり、現場は動けなくなる。', en: '' }
        minutes: 60
        category: hurt
        points: -80
        refs: [meti-csm-guideline]
        gauges: { trust: -5, stamina: -10 }
        items:
          - { id: e05-a-order, points: -10, axis: order, refs: [meti-csm-guideline] }
          - { id: e05-a-record, points: -5, axis: record, refs: [jpcert-handling] }
          - { id: e05-a-care, points: -5, axis: care, refs: [ipa-sme-guideline] }
      - id: e05-delegate
        text: { ja: '指揮命令を一枚にし、技術と広報と店舗の担当を決める。', en: '' }
        explain: { ja: '社長が抱え込まず、判断の担当を分けている。現場が同じ前提で動けるようになり、決定も速くなる。', en: '' }
        minutes: 90
        category: recover
        points: 100
        refs: [meti-csm-guideline]
        gauges: { trust: 10, stamina: -10, flame: -5 }
        setFlags: { commandSet: true }
        items:
          - { id: e05-c-order, points: 8, axis: order, refs: [meti-csm-guideline] }
          - { id: e05-c-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: e05-c-care, points: 5, axis: care, refs: [ipa-sme-guideline] }
    lesson: { ja: '対策本部では、誰が何を決めるかを一枚にまとめる。社長が全部を抱えると判断が詰まり、合意を待つと決定が遅れる。技術、広報、店舗、窓口の担当を決め、決定の時刻と理由を記録に残す。', en: '' }

  - id: e06-2fa
    at: { day: 0, minutes: 960 }
    phase: organize
    sound: { se: [mail_arrive] }
    text: { ja: '午後4時。二要素認証を入れていなかったことが分かった。導入には三か月と、既存の改修費がかかる。どうするか。', en: '' }
    voices: [v06-vendor, v06-past, v06-ok]
    choices:
      - id: e06-later
        text: { ja: '来期の予算で検討し、今回はパスワード変更の呼びかけで済ませる。', en: '' }
        explain: { ja: 'パスワード変更だけでは、次の使い回しに同じ手口が通る。被害が起きてから対策を先送りすると、再発を招く。', en: '' }
        minutes: 60
        category: hurt
        points: -100
        refs: [no14-mfa-guideline]
        gauges: { damage: 10, trust: -5 }
        coward: true
        delayed:
          - { afterPhases: 2, points: -40, gauges: { damage: 10 }, reason: { ja: '二要素認証のないまま、同じ手口のログインが再び増えた。', en: '' } }
        items:
          - { id: e06-a-content, points: -10, axis: content, refs: [no14-mfa-guideline] }
          - { id: e06-a-time, points: -8, axis: time, refs: [no14-credential-stuffing] }
          - { id: e06-a-order, points: -5, axis: order, refs: [meti-csm-guideline] }
      - id: e06-optional
        text: { ja: '希望する会員だけ、任意で設定できるようにしておく。', en: '' }
        explain: { ja: '任意設定では、守られるのは設定した人だけになる。攻撃者は設定率の低い層を狙うため、被害は残る。', en: '' }
        minutes: 90
        category: maintain
        points: 25
        refs: [no14-mfa-guideline]
        gauges: { trust: 5, stamina: -10 }
