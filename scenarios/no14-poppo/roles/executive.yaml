        text: { ja: '攻撃に使える詳細だけ伏せ、原因と対策を全文公開する。', en: '' }
        explain: { ja: '危険な情報を伏せつつ、検証の結果を公開している。原因と対策が読める形になり、再発防止の説得力も上がる。', en: '' }
        minutes: 180
        category: recover
        points: 120
        refs: [meti-disclosure-guidance, no14-credential-stuffing]
        gauges: { flame: -10, trust: 15, stamina: -10 }
