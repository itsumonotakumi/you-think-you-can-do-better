drafts:
  lead-reopen:
    title: { ja: '段階的再開の技術メモ', en: '' }
    slots:
      - id: criteria
        label: { ja: '再開の条件', en: '' }
        options:
          - { id: lr-c-feel, text: { ja: '担当者の勘で再開を決めてしまい、記録も残さない', en: '' }, points: -10, axis: order, refs: [nist-sp800-61r3], explain: { ja: '判断が人によって変わると、危険な状態でも戻してしまう。再停止の基準も曖昧になる。', en: '' } }
          - { id: lr-c-list, text: { ja: '監視の数字を参考にして、再開を決める', en: '' }, points: 2, axis: order, refs: [nist-sp800-61r3], explain: { ja: '数字は参考にしているが、条件として決めていない。担当が変わると判断がぶれやすい。', en: '' } }
          - { id: lr-c-number, text: { ja: '監視の数字で再開の条件を決め、記録に残す', en: '' }, points: 10, axis: order, refs: [nist-sp800-61r3], explain: { ja: '数字で決めれば、担当が変わっても同じ判断ができる。戻す範囲も説明しやすく、記録にも残せる。', en: '' } }
      - id: residual
        label: { ja: '残るリスク', en: '' }
        options:
          - { id: lr-r-hide, text: { ja: '残るリスクは説明せずに隠す', en: '' }, points: -10, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '残るリスクを隠すと、利用者が自分で身を守れない。後から分かったときに不信が大きくなる。', en: '' } }
          - { id: lr-r-part, text: { ja: '残るリスクは簡単に触れておく', en: '' }, points: 2, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '簡単に触れるだけでは、利用者は何に注意すべきか分からない。対策の説明も届きにくい。', en: '' } }
          - { id: lr-r-explain, text: { ja: '残るリスクと対策の両方を説明する', en: '' }, points: 10, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '残るリスクを説明すると、利用者は自分で注意できる。対策の進み具合も伝わり、不安が少し和らぐ。', en: '' } }
      - id: monitoring
        label: { ja: '監視の方法', en: '' }
        options:
          - { id: lr-m-stop, text: { ja: '再開したら監視を減らしてしまう', en: '' }, points: -10, axis: time, refs: [nist-sp800-61r3], explain: { ja: '再開直後こそ監視が必要だ。減らすと、同じ手口の再発に気づくのが遅れ、被害が広がってしまう。', en: '' } }
          - { id: lr-m-daily, text: { ja: '再開後は毎朝だけ監視する', en: '' }, points: 2, axis: time, refs: [nist-sp800-61r3], explain: { ja: '毎朝の確認だけでは、夜間や休日の異常に気づけない。再開直後の監視としては弱すぎる。', en: '' } }
          - { id: lr-m-watch, text: { ja: '再開した後も監視を続ける', en: '' }, points: 10, axis: time, refs: [nist-sp800-61r3], explain: { ja: '再開後も監視を続けることで、同じ兆候を早く見つけられる。再停止の判断にもつながる。', en: '' } }
      - id: stop
        label: { ja: '再停止の基準', en: '' }
        options:
          - { id: lr-s-vague, text: { ja: '再停止の基準は決めない', en: '' }, points: -8, axis: order, refs: [nist-sp800-61r3], explain: { ja: '基準がないと、夜間や休日に止める判断ができない。被害が広がってから決めることになる。', en: '' } }
          - { id: lr-s-clear, text: { ja: '再停止の基準を先に決める', en: '' }, points: 8, axis: order, refs: [nist-sp800-61r3], explain: { ja: '再停止の基準を先に決めれば、異常が出たときに迷わない。担当が変わっても同じ動きができる。', en: '' } }
      - id: auth
        label: { ja: '認証の扱い', en: '' }
        options:
          - { id: lr-a-require, text: { ja: '二要素認証の設定を求める', en: '' }, points: 10, axis: content, refs: [no14-mfa-guideline], explain: { ja: '再開の前提に二要素認証を置くと、同じ手口の被害を減らせる。設定できない人への支援も必要になる。', en: '' } }
          - { id: lr-a-later, text: { ja: '二要素認証の設定は後回しにする', en: '' }, points: -10, axis: content, refs: [no14-mfa-guideline], explain: { ja: '認証を後回しにすると、再開した瞬間から同じ手口の隙が残る。再発のリスクが高く、被害も繰り返す。', en: '' } }
      - id: rate
        label: { ja: '試行の制限', en: '' }
        options:
          - { id: lr-ra-none, text: { ja: '試行の制限は入れない', en: '' }, points: -8, axis: content, refs: [no14-credential-stuffing], explain: { ja: '試行を制限しないと、再開後に同じ自動化されたログインが戻ってくる。被害が再び広がる。', en: '' } }
          - { id: lr-ra-limit, text: { ja: '試行回数の制限を入れる', en: '' }, points: 8, axis: content, refs: [no14-credential-stuffing], explain: { ja: '試行回数を制限すると、自動化された攻撃を止めやすい。正常な利用者の再試行にも配慮する。', en: '' } }
      - id: contact
        label: { ja: '連絡先', en: '' }
        options:
          - { id: lr-co-clear, text: { ja: '夜間の連絡先を決める', en: '' }, points: 8, axis: order, refs: [nist-sp800-61r3], explain: { ja: '夜間に異常が出たときの連絡先を決めておくと、止める判断が遅れない。再発時の初動が速くなる。', en: '' } }
          - { id: lr-co-none, text: { ja: '夜間の連絡先は決めない', en: '' }, points: -8, axis: order, refs: [nist-sp800-61r3], explain: { ja: '連絡先がないと、異常に気づいても止める人がいない。翌朝まで被害が続き、対応が後手に回る。', en: '' } }
      - id: rollback
        label: { ja: '戻し方', en: '' }
        options:
          - { id: lr-ro-none, text: { ja: '戻し方の手順は決めない', en: '' }, points: -8, axis: order, refs: [nist-sp800-61r3], explain: { ja: '戻し方を決めないと、再停止が必要になったときに手順がなく、復旧が長引いて利用者の不便も増える。', en: '' } }
          - { id: lr-ro-plan, text: { ja: '戻し方の手順を先に決めておく', en: '' }, points: 8, axis: order, refs: [nist-sp800-61r3], explain: { ja: '戻し方の手順を決めておくと、再停止しても短時間で安全な状態に戻せる。復旧の見通しも立つ。', en: '' } }
      - id: record
        label: { ja: '記録', en: '' }
        options:
          - { id: lr-re-log, text: { ja: '再開の判断と時刻を記録する', en: '' }, points: 8, axis: record, refs: [jpcert-handling], explain: { ja: '判断と時刻を記録すると、後から経緯を説明できる。同じ判断を再現することもできる。', en: '' } }
          - { id: lr-re-none, text: { ja: '再開の判断の記録は残さない', en: '' }, points: -8, axis: record, refs: [jpcert-handling], explain: { ja: '記録がないと、なぜ再開したのか説明できない。再発時に判断の妥当性も示せず、検証が進まない。', en: '' } }
      - id: review
        label: { ja: '見直し', en: '' }
        options:
          - { id: lr-v-once, text: { ja: '再開した後も条件を見直さない', en: '' }, points: -8, axis: order, refs: [nist-sp800-61r3], explain: { ja: '再開後に見直さないと、条件が実態と合わなくなる。危険な状態でも戻し続け、再発を招いてしまう。', en: '' } }
          - { id: lr-v-review, text: { ja: '再開した後も、条件を見直し続ける', en: '' }, points: 8, axis: order, refs: [nist-sp800-61r3], explain: { ja: '再開した後も、条件を見直し続けると、監視の実態に合わせて判断を調整できる。安全側に戻すこともできる。', en: '' } }
