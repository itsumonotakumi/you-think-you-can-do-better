  - { id: v03-coward, media: news, misleading: true, type: coward-critique, text: { ja: '強制すると、利用者が離れる。任意で十分だ。', en: '' }, trigger: { at: point } }
  - { id: v03-ok, media: chat, misleading: false, text: { ja: '監視班「変更していないアカウントに、またログインがあります」。', en: '' }, trigger: { at: point } }
  - { id: v03-after, media: sns, misleading: false, text: { ja: '変更を強制されて、アプリが使いにくい。', en: '' }, trigger: { at: after, choice: l03-forced } }
  - { id: v04-bold, media: sns, misleading: true, type: bold-buzz, text: { ja: '全部止めれば、犯人も諦める。思い切れ。', en: '' }, trigger: { at: point } }
  - { id: v04-coward, media: news, misleading: true, type: coward-critique, text: { ja: '一部だけ止めるのは中途半端だ。', en: '' }, trigger: { at: point } }
  - { id: v04-ok, media: chat, misleading: false, text: { ja: '開発班「残高利用だけ止めれば、閲覧は残せます」。', en: '' }, trigger: { at: point } }
  - { id: v04-after, media: sns, misleading: false, text: { ja: 'ポイントは見られるのに、支払いはできないのか。', en: '' }, trigger: { at: after, choice: l04-partial } }
  - { id: v05-expert, media: vendor, misleading: true, type: fake-expert, text: { ja: '古いログは容量の無駄です。消しましょう。', en: '' }, trigger: { at: point } }
  - { id: v05-field, media: chat, misleading: true, type: well-meant-field, text: { ja: '調査会社に渡す前に、整理しておきました。', en: '' }, trigger: { at: point } }
  - { id: v05-ok, media: chat, misleading: false, text: { ja: '法務「ログは消さず、別の媒体に残しましょう」。', en: '' }, trigger: { at: point } }
  - { id: v05-after, media: vendor, misleading: false, text: { ja: 'ログを全部残すと、調査に時間がかかります。', en: '' }, trigger: { at: after, choice: l05-all } }
