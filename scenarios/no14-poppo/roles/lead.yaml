# No.14 ハルカゼマート / 部門長（デジタル事業部長）ロール
# プレイヤーはデジタル事業部長。アプリ、認証、決済、監視の技術判断を担う。
# 事業の停止や補償は経営が決める。あなたは、被害を止め、再開の条件を数字で示す。
# 判断ポイント16、細目は choices[].items と drafts の合計で80以上。
estimateMinutes: 30
intro: { ja: 'あなたはハルカゼマートのデジタル事業部長、三田 亮。ハルカゼポイントのアプリ、認証、決済、監視を預かっている。午前8時15分、監視画面のログイン失敗が跳ね上がった。10分で4000件。同じ時刻、お客様窓口には「残高が減った」という電話が入っている。止めるか、止めずに守るか。技術的に何ができて、何ができないか。数字で示すのはあなたの仕事だ。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-lead-ppc-prelim
    ref: ppc-report-prelim
    label: { ja: '個人情報保護委員会への速報', en: '' }
    points: -150
    doneFlag: ppcPrelimFiled
  - id: dl-lead-ppc-final
    ref: ppc-report-final-malicious
    label: { ja: '個人情報保護委員会への確報', en: '' }
    points: -120
    doneFlag: ppcFinalFiled
events:
  - id: ev-lead-fail
    at: { day: 0, minutes: 660 }
    voices: [v-ev-fail]
    gauges: { damage: 5 }
    sound: { se: [notify_chat] }
    caption: { ja: '監視のアラートが、別のサーバーでも上がった。', en: '' }
  - id: ev-lead-news
    at: { day: 0, minutes: 1200 }
    voices: [v-ev-news]
    gauges: { flame: 10 }
    sound: { se: [notify_news] }
    caption: { ja: 'ニュースサイトが、アプリの不正利用を報じた。', en: '' }
  - id: ev-lead-vendor
    at: { day: 1, minutes: 780 }
    voices: [v-ev-vendor]
    gauges: { flame: 5 }
    sound: { se: [mail_arrive] }
    caption: { ja: '認証基盤のベンダーから、設定変更の見積もりが届いた。', en: '' }
  - id: ev-lead-reopen
    at: { day: 3, minutes: 480 }
    voices: [v-ev-reopen]
    gauges: { trust: -5 }
    sound: { se: [notify_chat] }
    caption: { ja: '再開を待つ店舗から、問い合わせが来た。', en: '' }
points:
  - id: l01-alert
    at: { day: 0, minutes: 495 }
    phase: detect
    sound: { se: [notify_chat] }
    text: { ja: '午前8時15分。ログイン失敗が10分で4000件、成功も2300件。まず何を見るか。', en: '' }
    voices: [v01-past, v01-expert, v01-ok]
    notable:
      - { id: note-scale, text: { ja: '午前8時15分、ログイン失敗が10分で4000件、成功が2300件。', en: '' } }
    choices:
      - id: l01-failures
        text: { ja: '失敗の件数だけを集計し、増え方を見続ける。', en: '' }
        explain: { ja: '失敗の増加は攻撃の兆候として有用。ただし成功したログインを見なければ、すでに侵入された範囲が分からない。', en: '' }
        minutes: 30
        category: maintain
        points: 20
        refs: [no14-credential-stuffing]
        gauges: { trust: 5, stamina: -5 }
        items:
          - { id: l01-b-record, points: 5, axis: record, refs: [jpcert-handling] }
          - { id: l01-b-content, points: 5, axis: content, refs: [no14-credential-stuffing] }
          - { id: l01-b-time, points: 5, axis: time, refs: [jpcert-handling] }
      - id: l01-success-only
        text: { ja: '成功したログインだけを見て、失敗は無視する。', en: '' }
        explain: { ja: '失敗を無視すると、攻撃の試行に気づけない。大量の失敗の後ろで、少数の成功が被害を生んでいる。', en: '' }
        minutes: 30
        category: hurt
        points: -90
        refs: [no14-credential-stuffing]
        gauges: { damage: 10, flame: 5 }
        items:
          - { id: l01-a-content, points: -10, axis: content, refs: [no14-credential-stuffing] }
          - { id: l01-a-record, points: -8, axis: record, refs: [jpcert-handling] }
          - { id: l01-a-care, points: -5, axis: care, refs: [ppc-notify-person] }
      - id: l01-both
        text: { ja: '失敗と成功を IP と時刻で分け、普段と違う型を探す。', en: '' }
        explain: { ja: '失敗と成功を同じ軸で見ている。攻撃の試行と、実際に通ったログインの両方を特定できる。', en: '' }
        minutes: 60
        category: recover
        points: 100
        refs: [no14-credential-stuffing, nist-sp800-61r3]
        gauges: { trust: 10, stamina: -10 }
        setFlags: { patternFound: true }
        items:
          - { id: l01-c-content, points: 8, axis: content, refs: [no14-credential-stuffing] }
          - { id: l01-c-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: l01-c-time, points: 5, axis: time, refs: [nist-sp800-61r3] }
          - { id: l01-c-order, points: 5, axis: order, refs: [meti-csm-guideline] }
    lesson: { ja: '不正ログインの兆候は、失敗と成功を同じ軸で見る。大量の失敗の後ろで、少数の成功が被害を生む。IP と時刻で普段と違う型を探し、試行と侵入の両方を特定して、次の対策につなげる。', en: '' }

  - id: l02-block
    at: { day: 0, minutes: 540 }
    phase: detect
    sound: { se: [notify_chat] }
    text: { ja: '午前9時。同じ IP から多数のログイン成功。どう止めるか。', en: '' }
    voices: [v02-coward, v02-vendor, v02-ok]
    choices:
      - id: l02-email
        text: { ja: 'パスワードの変更を促すメールを、全会員に送る。', en: '' }
        explain: { ja: '利用者に知らせることは必要だが、メールを読む前にもログインは続く。攻撃の経路を止めていない。', en: '' }
        minutes: 30
        category: maintain
        points: 20
        refs: [no14-credential-stuffing]
        gauges: { trust: 5, stamina: -5 }
        items:
          - { id: l02-b-care, points: 8, axis: care, refs: [ppc-notify-person] }
          - { id: l02-b-order, points: 5, axis: order, refs: [meti-csm-guideline] }
          - { id: l02-b-record, points: 5, axis: record, refs: [jpcert-handling] }
      - id: l02-freeze
        text: { ja: '該当アカウントを凍結し、攻撃元の IP と端末を遮断する。', en: '' }
        explain: { ja: '被害に使われているアカウントと経路の両方を止めている。凍結した範囲を記録すれば、復旧の判断にも使える。', en: '' }
        minutes: 60
        category: recover
        points: 100
        refs: [no14-credential-stuffing, nist-sp800-61r3]
        gauges: { damage: -10, trust: 10, stamina: -10 }
        setFlags: { accountsFrozen: true }
        items:
          - { id: l02-c-order, points: 8, axis: order, refs: [no14-credential-stuffing] }
          - { id: l02-c-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: l02-c-content, points: 5, axis: content, refs: [nist-sp800-61r3] }
          - { id: l02-c-care, points: 5, axis: care, refs: [ppc-notify-person] }
      - id: l02-warning
        text: { ja: 'ログイン画面に警告を出すだけで、遮断はしない。', en: '' }
        explain: { ja: '警告は利用者への注意だが、攻撃者は画面を見ない。遮断しない限り、同じ経路でログインが続く。', en: '' }
        minutes: 30
        category: hurt
        points: -110
        refs: [no14-credential-stuffing]
        gauges: { damage: 15, trust: -5 }
        items:
          - { id: l02-a-content, points: -10, axis: content, refs: [no14-credential-stuffing] }
          - { id: l02-a-order, points: -10, axis: order, refs: [nist-sp800-61r3] }
          - { id: l02-a-care, points: -5, axis: care, refs: [ppc-notify-person] }
    lesson: { ja: '不正ログインは、使われているアカウントと攻撃元の経路の両方を止める。警告やメールだけでは、読まれる前も攻撃は続く。凍結した範囲と理由を記録し、復旧の判断に使う。', en: '' }

  - id: l03-reset
    at: { day: 0, minutes: 630 }
    phase: contain
    sound: { se: [typing] }
    text: { ja: '午前10時30分。パスワード変更の強制。どう設計するか。', en: '' }
    voices: [v03-popular, v03-coward, v03-ok]
    choices:
      - id: l03-forced
        text: { ja: '該当アカウントは次回ログインで変更を必須にし、通知も出す。', en: '' }
        explain: { ja: '該当アカウントだけに絞り、次回ログインで確実に変更させている。通知も出すので、利用者は理由を理解できる。', en: '' }
        minutes: 90
        category: recover
        points: 100
        refs: [no14-credential-stuffing, no14-mfa-guideline]
        gauges: { trust: 10, stamina: -10 }
        setFlags: { resetForced: true }
        items:
          - { id: l03-c-order, points: 8, axis: order, refs: [no14-credential-stuffing] }
          - { id: l03-c-care, points: 8, axis: care, refs: [ppc-notify-person] }
          - { id: l03-c-record, points: 5, axis: record, refs: [jpcert-handling] }
      - id: l03-optional
        text: { ja: '利用者に任意で変更を勧めるメールを送っておく。', en: '' }
        explain: { ja: '任意では、変更しない人のアカウントが残る。攻撃者はそこを狙い続けるため、被害が止まらない。', en: '' }
        minutes: 45
        category: maintain
        points: 20
        refs: [no14-credential-stuffing]
        gauges: { trust: 5, stamina: -5 }
        items:
          - { id: l03-b-care, points: 5, axis: care, refs: [ppc-notify-person] }
          - { id: l03-b-content, points: 5, axis: content, refs: [no14-credential-stuffing] }
          - { id: l03-b-order, points: 5, axis: order, refs: [meti-csm-guideline] }
      - id: l03-none
        text: { ja: '変更は本人の判断に任せきりにして、何もしない。', en: '' }
        explain: { ja: '何もしないと、漏えいした認証情報がそのまま使える。パスワードの使い回しは、本人だけでは防げない。', en: '' }
        minutes: 30
        category: hurt
        points: -90
        refs: [no14-credential-stuffing]
        gauges: { damage: 10, trust: -10 }
        coward: true
        items:
          - { id: l03-a-content, points: -10, axis: content, refs: [no14-credential-stuffing] }
          - { id: l03-a-care, points: -8, axis: care, refs: [ppc-notify-person] }
          - { id: l03-a-order, points: -5, axis: order, refs: [meti-csm-guideline] }
    lesson: { ja: '漏えいした認証情報が使われた疑いでは、該当アカウントのパスワード変更を次回ログインで必須にする。任意の呼びかけでは変更しない人が残り、攻撃者はそこを狙い続ける。理由も通知する。', en: '' }

  - id: l04-stop
    at: { day: 0, minutes: 720 }
    phase: contain
    sound: { se: [notify_chat] }
    text: { ja: '正午。アプリを止めるか。技術的には、認証と残高利用だけを止められる。', en: '' }
    voices: [v04-bold, v04-coward, v04-ok]
    notable:
      - { id: note-stop, text: { ja: '正午、残高利用と送金を止め、閲覧とポイント確認は残す判断。', en: '' } }
    choices:
      - id: l04-full-stop
        text: { ja: 'アプリ全体を止め、復旧の見通しを丁寧に出す。', en: '' }
        explain: { ja: '被害は確実に止まるが、ポイントの確認や店頭の支払いまで止まる。止める範囲を狭められるのに、全部を止めている。', en: '' }
        minutes: 60
        category: maintain
        points: 20
        refs: [nist-sp800-61r3]
        gauges: { flame: 10, trust: -5 }
        setFlags: { appStopped: true }
        items:
          - { id: l04-b-order, points: 8, axis: order, refs: [nist-sp800-61r3] }
          - { id: l04-b-care, points: 5, axis: care, refs: [ppc-notify-person] }
          - { id: l04-b-content, points: 5, axis: content, refs: [meti-disclosure-guidance] }
      - id: l04-partial
        text: { ja: '残高利用と送金だけを止め、閲覧とポイント確認は残す。', en: '' }
        explain: { ja: '危険な機能だけを止め、生活に必要な確認は残している。被害を抑えながら、混乱も小さくできる。', en: '' }
        minutes: 90
        category: recover
        points: 100
        refs: [nist-sp800-61r3, no14-mfa-guideline]
        gauges: { damage: -10, flame: 5, trust: 10, stamina: -10 }
        setFlags: { appStopped: false, partialStop: true }
        items:
          - { id: l04-c-order, points: 8, axis: order, refs: [nist-sp800-61r3] }
          - { id: l04-c-content, points: 8, axis: content, refs: [no14-mfa-guideline] }
          - { id: l04-c-care, points: 5, axis: care, refs: [ppc-notify-person] }
          - { id: l04-c-record, points: 5, axis: record, refs: [jpcert-handling] }
      - id: l04-keep
        text: { ja: 'すべて動かしたまま、ログの監視だけを続ける。', en: '' }
        explain: { ja: '監視だけでは残高は守れない。攻撃が続く間に、ポイントと残高が使われて被害が広がる。', en: '' }
        minutes: 30
        category: hurt
        points: -130
        refs: [no14-credential-stuffing]
        gauges: { damage: 15, flame: 10, trust: -10 }
        coward: true
        setFlags: { appStopped: false }
        delayed:
          - { afterPhases: 1, points: -50, gauges: { damage: 10 }, reason: { ja: '止めなかった残高利用が、夜間に集中して使われた。', en: '' } }
        items:
          - { id: l04-a-content, points: -12, axis: content, refs: [no14-credential-stuffing] }
          - { id: l04-a-order, points: -8, axis: order, refs: [nist-sp800-61r3] }
          - { id: l04-a-care, points: -5, axis: care, refs: [ppc-notify-person] }
    lesson: { ja: 'アプリ全体を止める前に、危険な機能だけを止められないか考える。残高利用と送金を止め、閲覧を残せば、被害を抑えながら生活の不便も小さくできる。監視だけでは残高は守れない。', en: '' }

  - id: l05-logs
    at: { day: 0, minutes: 840 }
    phase: investigate
    sound: { se: [notify_chat] }
    text: { ja: '午後2時。ログの保全。何を残すか。', en: '' }
    voices: [v05-expert, v05-field, v05-ok]
    choices:
      - id: l05-app-only
        text: { ja: 'アプリのログだけを、調査会社に丸ごと渡して任せる。', en: '' }
        explain: { ja: 'アプリのログだけでは、認証や決済の経路が分からない。調査の範囲が狭まり、原因の特定が遅れる。', en: '' }
        minutes: 60
        category: maintain
        points: 20
        refs: [jpcert-handling]
        gauges: { trust: 5, stamina: -5 }
        items:
          - { id: l05-b-record, points: 5, axis: record, refs: [jpcert-handling] }
          - { id: l05-b-content, points: 5, axis: content, refs: [nist-sp800-61r3] }
          - { id: l05-b-order, points: 5, axis: order, refs: [meti-csm-guideline] }
      - id: l05-all
        text: { ja: '認証、アプリ、決済のログを別媒体に保存し、手順を記録する。', en: '' }
        explain: { ja: '複数のログを別媒体に残し、保存の手順まで記録している。調査の再現性と証拠としての価値が高い。', en: '' }
        minutes: 120
        category: recover
        points: 100
        refs: [jpcert-handling, nist-sp800-61r3]
        gauges: { trust: 10, stamina: -15 }
        setFlags: { evidenceKept: true }
        items:
          - { id: l05-c-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: l05-c-order, points: 8, axis: order, refs: [nist-sp800-61r3] }
          - { id: l05-c-content, points: 5, axis: content, refs: [jpcert-handling] }
          - { id: l05-c-time, points: 5, axis: time, refs: [nist-sp800-61r3] }
      - id: l05-delete
        text: { ja: '容量を空けるため、古いログから順番に削除する。', en: '' }
        explain: { ja: '攻撃の痕跡を自分で消すことになる。原因も範囲も分からなくなり、調査と説明の両方が成り立たない。', en: '' }
        minutes: 30
        category: fatal
        points: -200
        refs: [jpcert-handling]
        gauges: { flame: 15, trust: -15 }
        setFlags: { logsDeleted: true }
        delayed:
          - { afterPhases: 2, points: -70, gauges: { flame: 10, trust: -10 }, reason: { ja: 'ログを消したことで、原因の特定ができなくなった。', en: '' } }
        items:
          - { id: l05-a-record, points: -20, axis: record, refs: [jpcert-handling] }
          - { id: l05-a-content, points: -10, axis: content, refs: [nist-sp800-61r3] }
          - { id: l05-a-order, points: -10, axis: order, refs: [meti-csm-guideline] }
    lesson: { ja: '調査の前にログを消さない。認証、アプリ、決済のログを別媒体に保存し、保存した時刻と手順を記録する。証拠が残っていなければ、原因も被害の範囲も説明できず、再発防止も設計できない。', en: '' }

  - id: l06-entry
    at: { day: 0, minutes: 960 }
    phase: investigate
    sound: { se: [mail_arrive] }
    text: { ja: '午後4時。他社の漏えい情報との照合。どこから手を付けるか。', en: '' }
    voices: [v06-insider, v06-vendor, v06-ok]
    choices:
      - id: l06-list
        text: { ja: '外部の漏えい情報と照合し、一致したアカウントを洗い出す。', en: '' }
        explain: { ja: '他社の漏えい情報と照合することで、狙われた ID の範囲が分かる。自社の認証の弱点も見えてくる。', en: '' }
        minutes: 120
        category: recover
        points: 100
        refs: [no14-credential-stuffing]
        gauges: { trust: 10, stamina: -10 }
        setFlags: { listMatched: true }
        items:
          - { id: l06-c-content, points: 8, axis: content, refs: [no14-credential-stuffing] }
          - { id: l06-c-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: l06-c-order, points: 5, axis: order, refs: [meti-csm-guideline] }
      - id: l06-strength
        text: { ja: '社内のパスワード強度だけを、ひととおり点検する。', en: '' }
        explain: { ja: '強度の点検は参考になるが、他社から漏えた認証情報は強度に関係なく使われる。侵入口の特定には届かない。', en: '' }
        minutes: 60
        category: maintain
        points: 20
        refs: [no14-credential-stuffing]
        gauges: { trust: 5, stamina: -5 }
        items:
          - { id: l06-b-content, points: 5, axis: content, refs: [no14-credential-stuffing] }
          - { id: l06-b-record, points: 5, axis: record, refs: [jpcert-handling] }
          - { id: l06-b-care, points: 5, axis: care, refs: [ppc-notify-person] }
      - id: l06-ip
        text: { ja: '攻撃者の IP を追い、手口の特定だけに集中する。', en: '' }
        explain: { ja: 'IP を追うだけでは、どのアカウントが使われたか分からない。攻撃元は変わるため、対策にも結びつきにくい。', en: '' }
        minutes: 60
        category: hurt
        points: -80
        refs: [nist-sp800-61r3]
        gauges: { damage: 5, trust: -5 }
        items:
          - { id: l06-a-content, points: -10, axis: content, refs: [nist-sp800-61r3] }
          - { id: l06-a-order, points: -5, axis: order, refs: [meti-csm-guideline] }
          - { id: l06-a-record, points: -5, axis: record, refs: [jpcert-handling] }
    lesson: { ja: '他社から漏えた認証情報の使い回しが疑われるときは、外部の漏えい情報と照合して、一致したアカウントを洗い出す。パスワード強度や IP の追跡だけでは、使われた範囲も対策も見えない。', en: '' }

  - id: l07-mfa
    at: { day: 1, minutes: 600 }
    phase: organize
    sound: { se: [mail_arrive] }
    text: { ja: 'Day 1 午前10時。二要素認証の方式。SMS と認証アプリ、どちらを主にするか。', en: '' }
