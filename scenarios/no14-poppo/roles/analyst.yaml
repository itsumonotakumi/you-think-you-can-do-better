          - { id: a16-c-care, points: 8, axis: care, refs: [ipa-sme-guideline] }
          - { id: a16-c-record, points: 8, axis: record, refs: [meti-disclosure-guidance] }
      - id: a16-own
        text: { ja: '自分のチームだけで、年に一度の研修を行う。', en: '' }
        explain: { ja: '自チームの研修は必要だが、店頭や業界に広がらない。同じ手口の被害が、別の場所で繰り返される。', en: '' }
        minutes: 60
        category: maintain
        points: 30
        refs: [ipa-sme-guideline]
        gauges: { trust: 5, stamina: -5 }
        items:
          - { id: a16-b-care, points: 5, axis: care, refs: [ipa-sme-guideline] }
          - { id: a16-b-record, points: 5, axis: record, refs: [meti-disclosure-guidance] }
          - { id: a16-b-order, points: 5, axis: order, refs: [meti-csm-guideline] }
      - id: a16-keep
        text: { ja: '今回の経験は、自分の中だけに留めておく。', en: '' }
        explain: { ja: '経験を個人に閉じると、担当が変わったときに失われる。組織の備えにならず、同じ苦労を繰り返す。', en: '' }
        minutes: 30
        category: hurt
        points: -70
        refs: [meti-csm-guideline]
        gauges: { trust: -5, flame: 5 }
        coward: true
        items:
          - { id: a16-a-content, points: -8, axis: content, refs: [meti-csm-guideline] }
          - { id: a16-a-record, points: -5, axis: record, refs: [meti-disclosure-guidance] }
          - { id: a16-a-care, points: -5, axis: care, refs: [ipa-sme-guideline] }
    lesson: { ja: '現場で得た手口は、点検表にして店舗と業界の訓練に使ってもらう。自チームの研修だけ、自分の中だけに留めると、担当が変わったときに経験が失われ、同じ被害が別の場所で繰り返される。', en: '' }
drafts:
  analyst-call:
    title: { ja: '被害会員への電話スクリプト', en: '' }
    slots:
      - id: opening
        label: { ja: '第一声', en: '' }
        options:
          - { id: ac-o-script, text: { ja: '決まった文面を読み上げるだけ', en: '' }, points: -8, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: '文面の読み上げは、相手に伝わらないことがある。早口になると、内容も理解されにくい。', en: '' } }
          - { id: ac-o-department, text: { ja: '部署名だけを名乗って要件を伝える', en: '' }, points: 2, axis: order, refs: [ppc-notify-person], explain: { ja: '部署名だけでは、誰からの電話か分かりにくい。相手は警戒して、話を聞く前に構えてしまう。', en: '' } }
          - { id: ac-o-name, text: { ja: '名前を名乗り、要件を短く伝える', en: '' }, points: 10, axis: order, refs: [ppc-notify-person], explain: { ja: '名前と要件を先に伝えると、相手は身構えずに話を聞ける。詐欺の電話と誤解されにくくもなる。', en: '' } }
      - id: confirm
        label: { ja: '確認すること', en: '' }
        options:
          - { id: ac-c-id, text: { ja: '本人確認だけを先に済ませる', en: '' }, points: -8, axis: order, refs: [ppc-notify-person], explain: { ja: '本人確認を急ぐと、相手は用件を言えずに不安が募る。確認は相手の話を聞いた後でも遅くない。', en: '' } }
          - { id: ac-c-date, text: { ja: '最後に使った日時だけを聞く', en: '' }, points: 2, axis: content, refs: [jpcert-handling], explain: { ja: '日時だけでは、残高が何に使われたか分からない。ログとの照合も、範囲の特定も難しくなる。', en: '' } }
          - { id: ac-c-use, text: { ja: '残高の使われ方を時刻順に聞く', en: '' }, points: 10, axis: content, refs: [jpcert-handling], explain: { ja: '使われ方を時刻順に聞くと、ログと照合できる。相手も自分の状況を整理しながら話せる。', en: '' } }
      - id: explain
        label: { ja: '説明の仕方', en: '' }
        options:
          - { id: ac-e-term, text: { ja: '専門用語をそのまま使って説明するだけにする', en: '' }, points: -8, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: '用語のままでは、聞き慣れない言葉で話が止まる。分からないまま相づちを打つ相手もいる。', en: '' } }
          - { id: ac-e-some, text: { ja: '難しい言葉を少しだけ言い換えて説明する', en: '' }, points: 2, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: '少し言い換えるだけでは、まだ分からない言葉が残る。相手は理解したふりをしてしまう。', en: '' } }
          - { id: ac-e-plain, text: { ja: '専門用語を使わず、起きたことを説明する', en: '' }, points: 10, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: '専門用語を避けると、相手は何が起きたか理解できる。次の行動も自分で決めやすくなる。', en: '' } }
      - id: refund
        label: { ja: '戻る見通し', en: '' }
        options:
          - { id: ac-r-vague, text: { ja: '詳しいことは後日連絡すると伝える', en: '' }, points: -8, axis: care, refs: [ppc-notify-person], explain: { ja: '後日連絡だけでは、いつ戻るのか分からない。待つ間の生活の不安が消えず、電話が繰り返される。', en: '' } }
          - { id: ac-r-date, text: { ja: '戻る範囲と時期を具体的に伝える', en: '' }, points: 10, axis: care, refs: [ppc-notify-person], explain: { ja: '範囲と時期が分かると、相手は生活の見通しを立てられる。追加の問い合わせも減り、不安も和らぐ。', en: '' } }
      - id: apology
        label: { ja: '謝罪', en: '' }
        options:
          - { id: ac-ap-own, text: { ja: '会社として、心からお詫びを伝える', en: '' }, points: 8, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: '会社として謝罪すると、相手は自分が責められているのではないと感じられる。話を続けやすい。', en: '' } }
          - { id: ac-ap-user, text: { ja: '使い回しに注意してほしかったと伝える', en: '' }, points: -15, axis: wording, refs: [no14-credential-stuffing], explain: { ja: '被害者に注意を求めるのは、責任を押しつける説明になる。相手は自分のせいだと思い込む。', en: '' } }
      - id: next
        label: { ja: '次の連絡', en: '' }
        options:
          - { id: ac-n-none, text: { ja: '次の連絡の予定は伝えない', en: '' }, points: -8, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '次の連絡がないと、相手は待つしかない。不安が憶測に変わり、何度も電話することになる。', en: '' } }
          - { id: ac-n-date, text: { ja: '次の連絡の日時を決めて伝える', en: '' }, points: 8, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '次の連絡の日時が分かると、相手は待てる。電話の集中も減り、こちらから連絡しやすくなる。', en: '' } }
      - id: record
        label: { ja: '記録', en: '' }
        options:
          - { id: ac-rec-log, text: { ja: '話した内容と時刻を記録に残す', en: '' }, points: 8, axis: record, refs: [jpcert-handling], explain: { ja: '話した内容と時刻を残すと、次の担当が同じ説明をできる。被害の確認にも使いやすい。', en: '' } }
          - { id: ac-rec-none, text: { ja: '電話の内容は記録に残さない', en: '' }, points: -8, axis: record, refs: [jpcert-handling], explain: { ja: '記録がないと、何を話したか分からない。同じ説明を繰り返すことになり、相手を不安にさせる。', en: '' } }
      - id: support
        label: { ja: '生活の支援', en: '' }
        options:
          - { id: ac-su-none, text: { ja: '生活の相談には触れない', en: '' }, points: -8, axis: care, refs: [ipa-sme-guideline], explain: { ja: '残高を生活費にしている人には、戻るまでの支援が必要だ。触れないと、相手は一人で抱える。', en: '' } }
          - { id: ac-su-window, text: { ja: '生活の相談窓口を案内する', en: '' }, points: 8, axis: care, refs: [ipa-sme-guideline], explain: { ja: '生活の相談窓口を案内すると、相手は追い詰められずに済む。電話の目的も支援につながる。', en: '' } }
      - id: phish
        label: { ja: '偽の連絡', en: '' }
        options:
          - { id: ac-ph-own, text: { ja: '電話で暗証番号を聞かないと伝える', en: '' }, points: 8, axis: care, refs: [ppc-notify-person], explain: { ja: '暗証番号を聞かないと伝えると、偽の電話を見分けられる。二次被害を防ぐ効果が大きい。', en: '' } }
          - { id: ac-ph-none, text: { ja: '偽の連絡の話には一切触れない', en: '' }, points: -8, axis: care, refs: [ppc-notify-person], explain: { ja: '偽の連絡に触れないと、相手は本物と偽物を区別できない。不安につけ込む電話にかけ直してしまう。', en: '' } }
      - id: close
        label: { ja: '電話の終わり', en: '' }
        options:
          - { id: ac-cl-cut, text: { ja: '決まったことは伝えたので切る', en: '' }, points: -8, axis: care, refs: [ppc-notify-person], explain: { ja: '一方的に切ると、相手は聞き残したことを抱える。不安が残り、再び電話することになる。', en: '' } }
          - { id: ac-cl-ask, text: { ja: '他に聞きたいことはないか尋ねる', en: '' }, points: 8, axis: care, refs: [ppc-notify-person], explain: { ja: '最後に問いかけると、言いそびれた不安を拾える。次の連絡への信頼にもつながり、電話が減る。', en: '' } }
