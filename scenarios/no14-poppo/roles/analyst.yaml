        gauges: { stamina: 10, trust: -5 }
        items:
          - { id: a14-b-care, points: -8, axis: care, refs: [ipa-sme-guideline] }
          - { id: a14-b-order, points: -5, axis: order, refs: [ipa-sme-guideline] }
          - { id: a14-b-record, points: -5, axis: record, refs: [jpcert-handling] }
      - id: a14-shift
        text: { ja: '交代制を組み、自分も休み、相談先を決める。', en: '' }
        explain: { ja: '交代制を組み、自分も休み、相談先まで決めている。長期の対応を続けるための最低限の設計だ。', en: '' }
        minutes: 90
        category: recover
        points: 100
        refs: [ipa-sme-guideline, cissp-cbk-secops]
        gauges: { stamina: 20, trust: 10 }
        setFlags: { shiftSet: true }
        items:
          - { id: a14-c-care, points: 10, axis: care, refs: [ipa-sme-guideline] }
          - { id: a14-c-care2, points: 8, axis: care, refs: [ipa-sme-guideline] }
          - { id: a14-c-order, points: 8, axis: order, refs: [cissp-cbk-secops] }
    lesson: { ja: '長期の対応では、交代制を組み、自分も休み、相談先を決める。全員で走り抜くと聞き漏らしと記録の抜けが増え、自分だけ休むと他の人に負担が寄る。休む仕組みを先に作る。', en: '' }

  - id: a15-review
    at: { day: 21, minutes: 600 }
    phase: after
    sound: { se: [typing] }
    text: { ja: 'Day 21 午前10時。振り返りと記録。何を残すか。', en: '' }
    voices: [v15-past, v15-coward, v15-ok]
    choices:
      - id: a15-result
        text: { ja: '結果だけを、簡単にまとめて報告して終わる。', en: '' }
        explain: { ja: '結果だけでは、なぜその判断をしたのか分からない。次の担当が同じ場面で同じ迷いを繰り返す。', en: '' }
        minutes: 45
        category: maintain
        points: 20
        refs: [cissp-cbk-secops]
        gauges: { trust: 5, stamina: -5 }
        items:
          - { id: a15-b-record, points: 5, axis: record, refs: [cissp-cbk-secops] }
          - { id: a15-b-content, points: 5, axis: content, refs: [meti-disclosure-guidance] }
          - { id: a15-b-order, points: 5, axis: order, refs: [meti-csm-guideline] }
      - id: a15-none
        text: { ja: '終わったことなので、記録は残さないでおく。', en: '' }
        explain: { ja: '記録を残さないと、同じ手口が来たときに初動が振り出しに戻る。教訓も組織に残らない。', en: '' }
        minutes: 30
        category: hurt
        points: -70
        refs: [cissp-cbk-secops]
        gauges: { trust: -5 }
        coward: true
        items:
          - { id: a15-a-record, points: -10, axis: record, refs: [cissp-cbk-secops] }
          - { id: a15-a-content, points: -5, axis: content, refs: [meti-disclosure-guidance] }
          - { id: a15-a-order, points: -5, axis: order, refs: [meti-csm-guideline] }
      - id: a15-timeline
        text: { ja: '時系列、判断、見落としを記録し、次の担当に渡す。', en: '' }
        explain: { ja: '時系列と判断、見落としまで残している。次の担当が同じ場面で迷わず、改善の材料にもなる。', en: '' }
        minutes: 120
        category: recover
        points: 100
        refs: [cissp-cbk-secops, jpcert-handling]
        gauges: { trust: 10, stamina: -10 }
        setFlags: { reviewRecorded: true }
        items:
          - { id: a15-c-record, points: 10, axis: record, refs: [cissp-cbk-secops] }
          - { id: a15-c-content, points: 8, axis: content, refs: [meti-disclosure-guidance] }
          - { id: a15-c-order, points: 5, axis: order, refs: [jpcert-handling] }
    lesson: { ja: '振り返りには、時系列、判断、見落としを残す。結果だけ、あるいは記録なしでは、次の担当が同じ場面で同じ迷いを繰り返す。次の事件の初動を速くするために、記録を渡す。', en: '' }

  - id: a16-next
    at: { day: 45, minutes: 600 }
    phase: after
    sound: { se: [notify_chat] }
    text: { ja: 'Day 45 午前10時。次の事件への備え。何を続けるか。', en: '' }
    voices: [v16-past, v16-coward, v16-ok]
    choices:
      - id: a16-share
        text: { ja: '手口の点検表を作り、店舗と業界の訓練に使ってもらう。', en: '' }
        explain: { ja: '現場で得た手口を点検表にし、店舗と業界の訓練に使ってもらう。同じ被害を別の場所で防げる。', en: '' }
        minutes: 180
        category: increase
        points: 300
        fatalAlternate: 50
        refs: [meti-csm-guideline, no14-credential-stuffing]
        gauges: { flame: -15, trust: 20, stamina: -15 }
