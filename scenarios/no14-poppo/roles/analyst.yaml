# No.14 ハルカゼマート / 担当者（不正利用対策チーム）ロール
# プレイヤーは不正利用対策チームの担当。電話、ログ、証拠、通知、補償の受付を現場で回す。
# 方針は上が決める。あなたは、目の前の会員と、手元の記録を扱う。
# 判断ポイント16、細目は choices[].items と drafts の合計で80以上。
estimateMinutes: 30
intro: { ja: 'あなたはハルカゼマートの不正利用対策チームの担当者。午前8時10分、お客様窓口から回ってきた電話に出た。「アプリの残高が、勝手に減っている」。相手は四十代の女性で、残高は生活費の足しにしているという。同じ訴えが、もう三件。あなたの仕事は、電話を聞き、ログを読み、記録を残し、次の担当につなぐことだ。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-analyst-ppc-prelim
    ref: ppc-report-prelim
    label: { ja: '個人情報保護委員会への速報', en: '' }
    points: -150
    doneFlag: ppcPrelimFiled
  - id: dl-analyst-ppc-final
    ref: ppc-report-final-malicious
    label: { ja: '個人情報保護委員会への確報', en: '' }
    points: -120
    doneFlag: ppcFinalFiled
events:
  - id: ev-analyst-calls
    at: { day: 0, minutes: 900 }
    voices: [v-ev-calls]
    gauges: { flame: 5 }
    sound: { se: [phone_ring] }
    caption: { ja: '同じ訴えの電話が、夕方までに二十件を超えた。', en: '' }
  - id: ev-analyst-sns
    at: { day: 0, minutes: 1260 }
    voices: [v-ev-sns]
    gauges: { flame: 10 }
    sound: { se: [notify_sns] }
    caption: { ja: 'SNSで、アプリの残高が消えたという投稿が広がった。', en: '' }
  - id: ev-analyst-elder
    at: { day: 1, minutes: 660 }
    voices: [v-ev-elder]
    gauges: { trust: -5 }
    sound: { se: [phone_ring] }
    caption: { ja: '高齢の会員から、二要素認証の設定方法を聞く電話が来た。', en: '' }
  - id: ev-analyst-team
    at: { day: 5, minutes: 1080 }
    voices: [v-ev-team]
    gauges: { stamina: -5 }
    sound: { se: [notify_chat] }
    caption: { ja: 'チームの一人が、声を落として「限界かもしれない」と言った。', en: '' }
points:
  - id: a01-first-call
    at: { day: 0, minutes: 495 }
    phase: detect
    sound: { se: [phone_ring] }
    text: { ja: '午前8時15分。お客様窓口から「アプリの残高が減っている」と電話。最初に何を聞くか。', en: '' }
    voices: [v01-popular, v01-boss, v01-ok]
    notable:
      - { id: note-scale, text: { ja: '午前8時10分、残高の不正利用の訴え。同じ訴えが三件。', en: '' } }
    choices:
      - id: a01-hear
        text: { ja: '残高の使われ方と、心当たりのログインを時刻順に聞く。', en: '' }
        explain: { ja: '被害の時刻と使われ方を聞くことで、ログと照合できる。会員の記憶を手がかりに、同じ手口を探せる。', en: '' }
        minutes: 30
        category: recover
        points: 100
        refs: [jpcert-handling, no14-credential-stuffing]
        gauges: { trust: 10, stamina: -5 }
        setFlags: { firstCallHeard: true }
        items:
          - { id: a01-c-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: a01-c-content, points: 8, axis: content, refs: [no14-credential-stuffing] }
          - { id: a01-c-care, points: 5, axis: care, refs: [ppc-notify-person] }
      - id: a01-id-only
        text: { ja: '本人確認だけをして、調査を約束して電話を切る。', en: '' }
        explain: { ja: '本人確認は必要だが、使われ方も時刻も聞いていない。調査の手がかりが減り、同じ被害を追えない。', en: '' }
        minutes: 15
        category: maintain
        points: 20
        refs: [jpcert-handling]
        gauges: { trust: 5, stamina: -5 }
        items:
          - { id: a01-b-record, points: 5, axis: record, refs: [jpcert-handling] }
          - { id: a01-b-order, points: 5, axis: order, refs: [meti-csm-guideline] }
          - { id: a01-b-care, points: 5, axis: care, refs: [ppc-notify-person] }
      - id: a01-dismiss
        text: { ja: '「よくあることです」と伝えて、様子を見る。', en: '' }
        explain: { ja: 'よくあることと片づけると、会員は自分で調べ始める。被害の連絡も遅れ、範囲の特定が難しくなる。', en: '' }
        minutes: 15
        category: hurt
        points: -100
        refs: [ppc-notify-person]
        gauges: { flame: 10, trust: -10 }
        coward: true
        items:
          - { id: a01-a-care, points: -10, axis: care, refs: [ppc-notify-person] }
          - { id: a01-a-record, points: -8, axis: record, refs: [jpcert-handling] }
          - { id: a01-a-content, points: -5, axis: content, refs: [no14-credential-stuffing] }
    lesson: { ja: '最初の電話では、本人確認の前に、残高がいつどう使われたかを時刻順に聞く。会員の記憶が、ログと照合する手がかりになる。よくあることと片づけると、被害の連絡も範囲の特定も遅れる。', en: '' }

  - id: a02-alert
    at: { day: 0, minutes: 525 }
    phase: detect
    sound: { se: [notify_chat] }
    text: { ja: '午前8時45分。同じ兆候のアカウントを洗い出す。何を基準にするか。', en: '' }
    voices: [v02-expert, v02-coward, v02-ok]
    notable:
      - { id: note-scale, text: { ja: '同じ兆候のアカウントを、ログイン失敗と成功の突き合わせで洗い出し中。', en: '' } }
    choices:
      - id: a02-only-reports
        text: { ja: '報告のあった会員だけを対象にして、他は調べない。', en: '' }
        explain: { ja: '報告だけを頼りにすると、静かに被害に遭っている人を見落とす。攻撃は報告より先に広がっている。', en: '' }
        minutes: 45
        category: hurt
        points: -100
        refs: [no14-credential-stuffing]
        gauges: { damage: 10, trust: -5 }
        coward: true
        items:
          - { id: a02-a-content, points: -10, axis: content, refs: [no14-credential-stuffing] }
          - { id: a02-a-record, points: -8, axis: record, refs: [jpcert-handling] }
          - { id: a02-a-care, points: -5, axis: care, refs: [ppc-notify-person] }
      - id: a02-cross
        text: { ja: '短時間の大量失敗と同じ IP の成功を突き合わせる。', en: '' }
        explain: { ja: '失敗と成功を同じ IP で結びつけることで、攻撃に使われたアカウントを絞り込める。', en: '' }
        minutes: 90
        category: recover
        points: 100
        refs: [no14-credential-stuffing, nist-sp800-61r3]
        gauges: { damage: -10, trust: 10, stamina: -10 }
        setFlags: { accountsFound: true }
        items:
          - { id: a02-c-content, points: 8, axis: content, refs: [no14-credential-stuffing] }
          - { id: a02-c-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: a02-c-order, points: 5, axis: order, refs: [nist-sp800-61r3] }
          - { id: a02-c-time, points: 5, axis: time, refs: [jpcert-handling] }
      - id: a02-report-based
        text: { ja: '残高の減った会員だけを、窓口の記録から拾う。', en: '' }
        explain: { ja: '届け出のあった人だけを拾うと、気づいていない被害者が残る。攻撃の全体像も見えない。', en: '' }
        minutes: 60
        category: maintain
        points: 20
        refs: [no14-credential-stuffing]
        gauges: { trust: 5, stamina: -5 }
        items:
          - { id: a02-b-record, points: 5, axis: record, refs: [jpcert-handling] }
          - { id: a02-b-content, points: 5, axis: content, refs: [no14-credential-stuffing] }
          - { id: a02-b-care, points: 5, axis: care, refs: [ppc-notify-person] }
    lesson: { ja: '被害の洗い出しは、届け出のあった人だけでは足りない。短時間の大量失敗と、同じ IP からの成功を突き合わせる。静かに被害に遭っている人を見つけ、報告より先に広がる攻撃を止める。', en: '' }

  - id: a03-order
    at: { day: 0, minutes: 600 }
    phase: contain
    sound: { se: [phone_ring] }
    text: { ja: '午前10時。該当会員への連絡。どの順にするか。', en: '' }
    voices: [v03-popular, v03-coward, v03-ok]
    choices:
      - id: a03-report-order
        text: { ja: '届いた順に、全員へ同じ文面で連絡する。', en: '' }
        explain: { ja: '全員に連絡する姿勢は良いが、順番を届いた順にすると、生活が苦しい人への連絡が遅れる。', en: '' }
        minutes: 60
        category: maintain
        points: 20
        refs: [ppc-notify-person]
        gauges: { trust: 5, stamina: -10 }
        items:
          - { id: a03-b-care, points: 5, axis: care, refs: [ppc-notify-person] }
          - { id: a03-b-order, points: 5, axis: order, refs: [ppc-notify-person] }
          - { id: a03-b-record, points: 5, axis: record, refs: [jpcert-handling] }
      - id: a03-email
        text: { ja: '連絡はメールだけにし、電話はかけない。', en: '' }
        explain: { ja: 'メールだけでは、読まない人や高齢の会員に届かない。被害に遭った人ほど、電話で説明を必要とする。', en: '' }
        minutes: 30
        category: hurt
        points: -90
        refs: [ppc-notify-person]
        gauges: { flame: 10, trust: -10 }
        coward: true
        items:
          - { id: a03-a-care, points: -10, axis: care, refs: [ppc-notify-person] }
          - { id: a03-a-order, points: -8, axis: order, refs: [ppc-notify-person] }
          - { id: a03-a-record, points: -5, axis: record, refs: [jpcert-handling] }
      - id: a03-priority
        text: { ja: '高額の被害と生活への影響が大きい人から電話する。', en: '' }
        explain: { ja: '被害の大きさと生活への影響で順番をつけている。限られた人員でも、困っている人に早く届く。', en: '' }
        minutes: 90
        category: recover
        points: 100
        refs: [ppc-notify-person, ipa-sme-guideline]
        gauges: { trust: 10, stamina: -10 }
        setFlags: { callsPrioritized: true }
        items:
          - { id: a03-c-care, points: 8, axis: care, refs: [ppc-notify-person] }
          - { id: a03-c-order, points: 8, axis: order, refs: [ipa-sme-guideline] }
          - { id: a03-c-record, points: 5, axis: record, refs: [jpcert-handling] }
    lesson: { ja: '該当会員への連絡は、届いた順ではなく、被害の大きさと生活への影響で順番をつける。高額の被害者、高齢者、生活費にしている人から電話する。メールだけでは、必要な人に届かない。', en: '' }

  - id: a04-victim-call
    at: { day: 0, minutes: 660 }
    phase: contain
    sound: { se: [phone_ring] }
    text: { ja: '午前11時。被害に遭った会員への一次対応。何を大切にするか。', en: '' }
    voices: [v04-public, v04-boss, v04-ok]
    notable:
      - { id: note-stop, text: { ja: '午前11時、被害に遭った会員への電話を開始。残高利用は止めている。', en: '' } }
    choices:
      - id: a04-listen
        text: { ja: '相手の話を最後まで聞き、戻る範囲と時期を具体的に伝える。', en: '' }
        explain: { ja: '不安を聞いたうえで、戻る範囲と時期を示している。会員が先の見通しを持てる、最初の対応になる。', en: '' }
        minutes: 45
        category: recover
        points: 110
        refs: [ppc-notify-person]
        gauges: { flame: -5, trust: 15, stamina: -10 }
        setFlags: { victimCare: true }
        detail: analyst-call
        items:
          - { id: a04-c-care, points: 10, axis: care, refs: [ppc-notify-person] }
          - { id: a04-c-care2, points: 8, axis: care, refs: [ppc-notify-person] }
          - { id: a04-c-wording, points: 5, axis: wording, refs: [meti-disclosure-guidance] }
      - id: a04-later
        text: { ja: '謝罪をして、詳しいことは後日連絡すると伝える。', en: '' }
        explain: { ja: '謝罪は必要だが、戻る範囲も時期も伝えていない。会員は待つ間、何も分からないまま不安になる。', en: '' }
        minutes: 30
        category: maintain
        points: 20
        refs: [ppc-notify-person]
        gauges: { trust: 5, stamina: -5 }
        items:
          - { id: a04-b-care, points: 5, axis: care, refs: [ppc-notify-person] }
          - { id: a04-b-wording, points: 5, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: a04-b-record, points: 5, axis: record, refs: [jpcert-handling] }
      - id: a04-blame
        text: { ja: '使い回しが原因かもしれないと、最初に伝える。', en: '' }
        explain: { ja: '被害に遭った人に原因を先に伝えると、自分のせいだと思わせる。会社の認証の弱さから目をそらす説明になる。', en: '' }
        minutes: 30
        category: fatal
        points: -200
        refs: [no14-credential-stuffing]
        gauges: { flame: 20, trust: -20 }
        setFlags: { blamedUsers: true }
        delayed:
          - { afterPhases: 2, points: -70, gauges: { flame: 15, trust: -10 }, reason: { ja: '被害者に原因を押しつけた電話が、SNSで共有された。', en: '' } }
        items:
          - { id: a04-a-care, points: -20, axis: care, refs: [ppc-notify-person] }
          - { id: a04-a-wording, points: -10, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: a04-a-content, points: -10, axis: content, refs: [no14-credential-stuffing] }
    lesson: { ja: '被害に遭った会員には、まず話を最後まで聞く。そのうえで、戻る範囲と時期を具体的に伝える。原因を利用者の使い回しに寄せると、自分のせいだと思わせ、会社の認証の弱さから目をそらすことになる。', en: '' }

  - id: a05-logs
    at: { day: 0, minutes: 780 }
    phase: investigate
    sound: { se: [typing] }
    text: { ja: '午後1時。ログの読み方と証拠保全。何を優先するか。', en: '' }
    voices: [v05-expert, v05-field, v05-ok]
    choices:
      - id: a05-list
        text: { ja: '怪しいログインだけを抜き出して、一覧にする。', en: '' }
        explain: { ja: '怪しいログインを一覧にすることは役立つ。ただし元のログを保存しないと、後から検証できない。', en: '' }
        minutes: 60
        category: maintain
        points: 20
        refs: [jpcert-handling]
        gauges: { trust: 5, stamina: -10 }
        items:
          - { id: a05-b-record, points: 5, axis: record, refs: [jpcert-handling] }
          - { id: a05-b-content, points: 5, axis: content, refs: [nist-sp800-61r3] }
          - { id: a05-b-order, points: 5, axis: order, refs: [meti-csm-guideline] }
      - id: a05-leave
        text: { ja: '調査会社に任せるので、自分では何もしない。', en: '' }
        explain: { ja: '任せる判断は分かるが、現場のログは時間とともに消える。保存の指示を出さないと証拠が残らない。', en: '' }
        minutes: 30
        category: hurt
        points: -80
        refs: [jpcert-handling]
        gauges: { damage: 5, trust: -5 }
        coward: true
        items:
          - { id: a05-a-record, points: -10, axis: record, refs: [jpcert-handling] }
          - { id: a05-a-content, points: -8, axis: content, refs: [nist-sp800-61r3] }
          - { id: a05-a-order, points: -5, axis: order, refs: [meti-csm-guideline] }
      - id: a05-preserve
        text: { ja: 'ログイン元と利用先の時刻を並べ、証拠として保存する。', en: '' }
        explain: { ja: 'ログインと利用の時刻を並べることで、手口の流れが見える。元のログを保存すれば、後から検証できる。', en: '' }
        minutes: 120
        category: recover
        points: 100
        refs: [jpcert-handling, nist-sp800-61r3]
        gauges: { trust: 10, stamina: -15 }
        setFlags: { evidenceKept: true }
        items:
          - { id: a05-c-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: a05-c-content, points: 8, axis: content, refs: [nist-sp800-61r3] }
          - { id: a05-c-time, points: 5, axis: time, refs: [jpcert-handling] }
          - { id: a05-c-order, points: 5, axis: order, refs: [meti-csm-guideline] }
    lesson: { ja: 'ログは、怪しい行だけを抜き出すのではなく、元の記録を保存する。ログイン元と利用先の時刻を並べれば、手口の流れが見える。調査会社に任せる場合も、保存の指示を出すのは現場の仕事だ。', en: '' }

  - id: a06-method
    at: { day: 0, minutes: 900 }
    phase: investigate
    sound: { se: [notify_chat] }
    text: { ja: '午後3時。手口の特定。ポイントが何に変わったか。', en: '' }
    voices: [v06-vendor, v06-insider, v06-ok]
    choices:
      - id: a06-total
        text: { ja: '被害額の合計だけを、まずは集計しておく。', en: '' }
        explain: { ja: '合計額は報告に使えるが、交換先が分からないと、同じ手口の資金の流れを止められない。', en: '' }
        minutes: 45
        category: maintain
        points: 20
        refs: [jpcert-handling]
        gauges: { trust: 5, stamina: -5 }
        items:
          - { id: a06-b-record, points: 5, axis: record, refs: [jpcert-handling] }
          - { id: a06-b-content, points: 5, axis: content, refs: [nist-sp800-61r3] }
          - { id: a06-b-care, points: 5, axis: care, refs: [ppc-notify-person] }
      - id: a06-follow
        text: { ja: 'ポイントの交換先と受け取りアカウントを追う。', en: '' }
        explain: { ja: 'ポイントが何に変わり、どこへ渡ったかを追っている。資金の流れが分かれば、警察への相談も具体化する。', en: '' }
        minutes: 120
        category: recover
        points: 100
        refs: [npa-consult, jpcert-handling]
        gauges: { trust: 10, stamina: -10 }
        setFlags: { methodFound: true }
        items:
          - { id: a06-c-content, points: 8, axis: content, refs: [npa-consult] }
          - { id: a06-c-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: a06-c-order, points: 5, axis: order, refs: [npa-consult] }
      - id: a06-ip
        text: { ja: '攻撃者の IP を遮断すれば終わりだと判断する。', en: '' }
        explain: { ja: 'IP を遮断しても、攻撃元は変わる。交換先と受け取り口座を押さえなければ、資金の流れは止まらない。', en: '' }
        minutes: 45
        category: hurt
        points: -80
        refs: [npa-consult]
        gauges: { damage: 5, trust: -5 }
        items:
          - { id: a06-a-content, points: -10, axis: content, refs: [npa-consult] }
          - { id: a06-a-order, points: -5, axis: order, refs: [jpcert-handling] }
          - { id: a06-a-record, points: -5, axis: record, refs: [jpcert-handling] }
    lesson: { ja: 'ポイントが何に変わり、どこへ渡ったかを追う。IP を遮断しても攻撃元は変わる。交換先と受け取りアカウントが分かれば、警察への相談も具体化し、同じ手口の資金の流れを止められる。', en: '' }

  - id: a07-team
    at: { day: 1, minutes: 540 }
    phase: organize
    sound: { se: [notify_chat] }
    text: { ja: 'Day 1 午前9時。チーム体制。誰が何を担当するか。', en: '' }
    voices: [v07-boss, v07-flattery, v07-ok]
    choices:
      - id: a07-roles
        text: { ja: '電話、調査、記録、窓口支援の担当を決め、交代も組む。', en: '' }
        explain: { ja: '役割と交代まで決めている。誰が休んでも電話と記録が止まらず、長期の対応でも品質が落ちない。', en: '' }
        minutes: 60
        category: recover
        points: 100
        refs: [ipa-sme-guideline, cissp-cbk-secops]
        gauges: { trust: 10, stamina: 10 }
        setFlags: { teamSet: true }
        items:
