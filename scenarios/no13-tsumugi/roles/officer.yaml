        refs: [no02-ppc-report-entrusted]
        gauges: { trust: -5, stamina: -5 }
        items:
          - { id: o16-b-content, points: 5, axis: content, refs: [no02-ppc-report-entrusted] }
          - { id: o16-b-record, points: 5, axis: record, refs: [ppc-report-final-malicious] }
      - id: o16-a-under
        text: { ja: '件数を少なく見積もって、確報を出してしまう', en: '' }
        explain: { ja: '少なく見せれば批判は避けられる。だが後から件数が増えれば、訂正と不信が何倍にもなって返ってくる。', en: '' }
        minutes: 90
        category: fatal
        points: -250
        refs: [ppc-report-scope]
        gauges: { flame: 20, trust: -20 }
        setFlags: { underReported: true }
        items:
          - { id: o16-a-content, points: -10, axis: content, refs: [ppc-report-scope] }
          - { id: o16-a-record, points: -10, axis: record, refs: [ppc-report-final-malicious] }
    lesson: { ja: '確報は、委託元と内容を揃えて期限内に出す。自社の従業員情報は自社の分として出す。件数を少なく見せると、後から増えたときに訂正と不信が返ってくる。分からない項目は、調査中と書く。', en: '' }

drafts:
  client-letter:
    title: { ja: '取引先へ渡す第一報', en: '' }
    slots:
      - id: timing
        label: { ja: '出す時刻', en: '' }
        auto: true
        items:
          - { id: cl-t-12h, when: { withinHours: 12 }, points: 10, axis: time, refs: [meti-disclosure-guidance] }
          - { id: cl-t-24h, when: { withinHours: 24 }, points: 5, axis: time, refs: [meti-disclosure-guidance] }
          - { id: cl-t-late, when: { otherwise: true }, points: -15, axis: time, refs: [meti-disclosure-guidance] }
      - id: scope
        label: { ja: '対象', en: '' }
        options:
          - { id: cl-s-all, text: { ja: '影響のあった取引先の全会員', en: '' }, points: 10, axis: content, refs: [ppc-notify-person], explain: { ja: '影響のあった会員を全員含めれば、対象者が自分で判断できる。漏れによる二次被害も防げる。', en: '' } }
          - { id: cl-s-part, text: { ja: '取引先が指定した一部の会員だけ', en: '' }, points: -10, axis: content, refs: [ppc-notify-person], explain: { ja: '一部に絞ると、対象外の会員が不安のまま残る。後から対象が増えたときの説明も難しくなる。', en: '' } }
          - { id: cl-s-name, text: { ja: '会員の氏名だけを対象とする', en: '' }, points: -5, axis: content, refs: [ppc-notify-person], explain: { ja: '氏名だけでは、購入履歴や連絡先が漏れたかを判断できない。問い合わせが窓口に集中する。', en: '' } }
      - id: cause
        label: { ja: '原因の書き方', en: '' }
        options:
          - { id: cl-c-vague, text: { ja: '外部からの不正アクセスとだけ書く', en: '' }, points: -5, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '不正アクセスとだけでは、どこに連絡し何をすればよいか分からない。会員の行動につながらない。', en: '' } }
          - { id: cl-c-own, text: { ja: '盗まれた認証情報でログインされたこと', en: '' }, points: 10, axis: content, refs: [nist-sp800-61r3], explain: { ja: '原因を具体的に書くことで、委託元も会員も何が起きたかを理解できる。再発防止の説明にもつながる。', en: '' } }
          - { id: cl-c-saas, text: { ja: 'SaaS事業者の設定不備だとする', en: '' }, points: -10, axis: wording, refs: [meti-csm-guideline], explain: { ja: '他社の責任に寄せると、自社の認証管理の話が消える。委託元は説明の不足を不誠実と受け取る。', en: '' } }
      - id: apology
        label: { ja: '謝罪の主語', en: '' }
        options:
          - { id: cl-ap-client, text: { ja: '委託元の管理不足が原因として謝罪する', en: '' }, points: -15, axis: wording, refs: [meti-csm-guideline], explain: { ja: '責任を相手に寄せると、委託元との信頼を失う。会員への説明も、誰の責任か分からない形になる。', en: '' } }
          - { id: cl-ap-none, text: { ja: '謝罪は書かず、事実だけを淡々と書く', en: '' }, points: -10, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: '事実だけを並べても、受け取る側の気持ちは動かない。謝罪の有無は、その後の対話を左右する。', en: '' } }
          - { id: cl-ap-own, text: { ja: '預かったデータを守れなかった当社として謝罪する', en: '' }, points: 10, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: '預かり主としての責任を自分の言葉で示している。委託元が会員に説明するときの前提も揃う。', en: '' } }
      - id: support
        label: { ja: '会員への案内', en: '' }
        options:
          - { id: cl-su-window, text: { ja: '専用窓口と二次被害の相談先を案内する', en: '' }, points: 10, axis: care, refs: [ppc-notify-person], explain: { ja: '通知を受けた会員が、次にどこへ行けばよいかを示している。不安を放置せず、行動につなげる案内だ。', en: '' } }
          - { id: cl-su-sales, text: { ja: '問い合わせは営業窓口へと書いておく', en: '' }, points: -5, axis: care, refs: [ppc-notify-person], explain: { ja: '営業窓口は相談の訓練を受けていない。問い合わせが集中すると、対応の質がばらつき不信を招く。', en: '' } }
          - { id: cl-su-none, text: { ja: '問い合わせ先は書かないでおく', en: '' }, points: -10, axis: care, refs: [ppc-notify-person], explain: { ja: '窓口がないと、会員はSNSや報道に流れる。問い合わせの負担は、後から現場に戻ってくる。', en: '' } }
      - id: contact
        label: { ja: '連絡先の書き方', en: '' }
        options:
          - { id: cl-co-number, text: { ja: '窓口の番号だけを書いておく', en: '' }, points: -5, axis: care, refs: [meti-csm-guideline], explain: { ja: '番号だけでは受付時間が分からず、夜間の問い合わせが迷う。増員の見通しも伝わらない。', en: '' } }
          - { id: cl-co-hours, text: { ja: '窓口の番号、受付時間、増員を書く', en: '' }, points: 10, axis: care, refs: [meti-csm-guideline], explain: { ja: '番号と受付時間、増員まで示すと、つながる見通しが立つ。待つ側の不安を減らせる。', en: '' } }
          - { id: cl-co-mail, text: { ja: '代表メールのアドレスを書く', en: '' }, points: -5, axis: care, refs: [meti-csm-guideline], explain: { ja: '代表メールは担当に届くまで時間がかかる。急ぎの相談には向かず、対応の遅れが不信になる。', en: '' } }
      - id: next
        label: { ja: '次の公表', en: '' }
        options:
          - { id: cl-n-none, text: { ja: '次回の予定は書かないでおく', en: '' }, points: -5, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '次回の予定がないと、情報の空白を憶測で埋められる。問い合わせの終わりも見えない。', en: '' } }
          - { id: cl-n-sns, text: { ja: 'SNSで随時発信するとだけ書く', en: '' }, points: -5, axis: content, refs: [meti-disclosure-guidance], explain: { ja: 'SNSだけでは、公式の情報に届かない人が残る。更新の時刻も分からず、待つ側は落ち着かない。', en: '' } }
          - { id: cl-n-date, text: { ja: '次回の公表日と更新の方法を書く', en: '' }, points: 10, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '次の接点があると、続報を待つ側の見通しが立つ。憶測が広がる前に、情報の入口を示せる。', en: '' } }
      - id: approval
        label: { ja: '送信前の確認', en: '' }
        options:
          - { id: cl-i-multi, text: { ja: '広報、法務、技術で送信前に確認する', en: '' }, points: 10, axis: order, refs: [meti-csm-guideline], explain: { ja: '複数の部署で確認すれば、事実誤認と表現の偏りを減らせる。委託元との文面のずれも防げる。', en: '' } }
          - { id: cl-i-solo, text: { ja: '担当者の判断だけで送ってしまう', en: '' }, points: -10, axis: order, refs: [meti-csm-guideline], explain: { ja: '一人で判断すると、法務や技術の確認が抜ける。訂正が増えるほど、説明のやり直しも難しくなる。', en: '' } }
          - { id: cl-i-ceo, text: { ja: '社長だけの確認で送ってしまう', en: '' }, points: -5, axis: order, refs: [meti-csm-guideline], explain: { ja: '経営の判断は速いが、技術の事実確認が抜けやすい。現場の言葉と食い違う文面になる。', en: '' } }
