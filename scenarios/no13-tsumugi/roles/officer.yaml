# No.13 ツムギ・アナリティクス / 役員ロール（管理本部長）
# 判断ポイント16、細目は choices[].items と drafts の合計で80以上。
estimateMinutes: 35
intro: { ja: 'あなたはツムギ・アナリティクスの管理本部長。契約、取引先、総務、広報をまとめる立場で、技術の詳細は分からない。分からないまま、誰に何をいつ伝えるかを決めなければならない。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-officer-prelim
    ref: ppc-report-prelim
    label: { ja: '個人情報保護委員会への速報', en: '' }
    points: -150
    doneFlag: ppcPrelimFiled
  - id: dl-officer-final
    ref: ppc-report-final-malicious
    label: { ja: '個人情報保護委員会への確報（不正の目的のおそれ）', en: '' }
    points: -80
    doneFlag: ppcFinalFiled
events:
  - id: ev-call
    at: { day: 0, minutes: 840 }
    voices: [v-ev-call]
    gauges: { flame: 5 }
    sound: { se: [phone_ring] }
    caption: { ja: '取引先の担当者から「うちの会員のデータは大丈夫か」と電話が入った。', en: '' }
  - id: ev-news
    at: { day: 1, minutes: 1260 }
    voices: [v-ev-news]
    gauges: { flame: 10 }
points:
  - id: p01-first-call
    at: { day: 0, minutes: 585 }
    phase: detect
    sound: { se: [phone_ring] }
    text: { ja: '午前9時45分。基盤のSaaS事業者から電話があった。当社のアカウントから、大量のダウンロードがあったらしい。', en: '' }
    voices: [v01-a, v01-b, v01-ok]
    choices:
      - id: o01-c-log
        text: { ja: '侵害の時刻と接続元、持ち出された範囲の記録を求める', en: '' }
        explain: { ja: '最初に押さえるべきは、いつ、どこから、何が出たかの記録だ。ここが曖昧だと、後の報告が全部やり直しになる。', en: '' }
        minutes: 75
        category: recover
        points: 120
        refs: [jpcert-handling, nist-sp800-61r3]
        gauges: { damage: -10, trust: 5, stamina: -10 }
        setFlags: { logRequested: true }
        items:
          - { id: o01-c-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: o01-c-content, points: 8, axis: content, refs: [nist-sp800-61r3] }
      - id: o01-b-wait
        text: { ja: '状況が分かった時点で、改めて連絡をもらう', en: '' }
        explain: { ja: '相手の連絡を待つ形は楽だが、時刻と範囲の記録は早く取るほど残る。待つ間に消えるものがある。', en: '' }
        minutes: 45
        category: maintain
        points: 20
        refs: [jpcert-handling]
        gauges: { stamina: -5 }
        items:
          - { id: o01-b-record, points: 5, axis: record, refs: [jpcert-handling] }
          - { id: o01-b-order, points: 5, axis: order, refs: [jpcert-handling] }
      - id: o01-a-blame
        text: { ja: '原因が当社にあるかどうかを、先に確かめる', en: '' }
        explain: { ja: '責任の確認を先にすると、相手は防御に回る。記録の提供が遅れ、被害の全体像が見えなくなる。', en: '' }
        minutes: 60
        category: hurt
        points: -90
        refs: [meti-csm-guideline]
        gauges: { flame: 5, trust: -5 }
        items:
          - { id: o01-a-content, points: -10, axis: content, refs: [meti-csm-guideline] }
          - { id: o01-a-order, points: -8, axis: order, refs: [jpcert-handling] }
    lesson: { ja: '最初の電話では、責任の確認より記録の確保を優先する。侵害の時刻、接続元、持ち出された範囲を、書面で求める。ここで取った記録が、委託元の報告と再発防止の土台になる。', en: '' }

  - id: p02-contract
    at: { day: 0, minutes: 630 }
    phase: contain
    text: { ja: '午前10時30分。委託契約書を開くと、インシデント時の連絡も費用負担も書かれていない。法務は「義務はない」と言う。', en: '' }
    voices: [v02-a, v02-b, v02-ok]
    choices:
      - id: o02-a-wait
        text: { ja: '契約に定めがないので、求められるまで待つ', en: '' }
        explain: { ja: '契約の文言だけを見れば、待つことも成り立つ。ただ、預かったデータの漏えいは、契約の外にある問題だ。', en: '' }
        minutes: 45
        category: hurt
        points: -120
        refs: [no02-ppc-report-entrusted]
        gauges: { flame: 10, trust: -10 }
        coward: true
        setFlags: { delayClient: true }
        items:
          - { id: o02-a-content, points: -10, axis: content, refs: [no02-ppc-report-entrusted] }
          - { id: o02-a-time, points: -8, axis: time, refs: [ppc-report-prelim] }
      - id: o02-c-notify
        text: { ja: '契約の有無にかかわらず、委託元への報告を先に行う', en: '' }
        explain: { ja: '契約の空白を、法律と信義の側から埋めている。委託元が報告するための時間を、自分たちの判断で短くしない。', en: '' }
        minutes: 120
        category: recover
        points: 130
        refs: [no02-ppc-report-entrusted, meti-csm-guideline]
        gauges: { trust: 15, stamina: -15, flame: -5 }
        setFlags: { clientNotified: true }
        items:
          - { id: o02-c-content, points: 8, axis: content, refs: [no02-ppc-report-entrusted] }
          - { id: o02-c-order, points: 8, axis: order, refs: [meti-csm-guideline] }
      - id: o02-b-legal
        text: { ja: '法務に条項の解釈を確認してから動き出す', en: '' }
        explain: { ja: '法務の確認は必要だ。だが解釈を待つ間に、委託元は報道で知ることになる。順番を間違えている。', en: '' }
        minutes: 90
        category: maintain
        points: 25
        refs: [meti-csm-guideline]
        gauges: { stamina: -10 }
        items:
          - { id: o02-b-order, points: 5, axis: order, refs: [meti-csm-guideline] }
          - { id: o02-b-record, points: 5, axis: record, refs: [jpcert-handling] }
    lesson: { ja: '契約に書かれていなくても、預かったデータの漏えいは委託元へ報告する。報告の順番を契約の解釈待ちにしない。契約の空白は、事件のあとに埋める。まず義務を果たし、次に条項を直す。', en: '' }

  - id: p03-mfa-cost
    at: { day: 0, minutes: 720 }
    phase: contain
    text: { ja: '正午。多要素認証の全社導入には費用と手間がかかる。経理は「今期は無理だ」と言い、現場は悲鳴を上げている。', en: '' }
    voices: [v03-a, v03-b, v03-ok]
    notable:
      - { id: note-mfa, text: { ja: '基盤の多要素認証は未設定で、費用の議論で先送りになっていた。', en: '' } }
    choices:
      - id: o03-b-key
        text: { ja: '重要システムだけを、先に切り替えておく', en: '' }
        explain: { ja: '費用を抑えつつ穴を減らす案として筋は通る。ただ、境界の外に残った基盤が、次の侵入口になる。', en: '' }
        minutes: 90
        category: maintain
        points: 25
        refs: [nist-sp800-61r3]
        gauges: { trust: 5, stamina: -10 }
        items:
          - { id: o03-b-content, points: 5, axis: content, refs: [nist-sp800-61r3] }
          - { id: o03-b-order, points: 5, axis: order, refs: [ipa-sme-guideline] }
      - id: o03-a-later
        text: { ja: '予算の都合を理由に、切り替えを来期まで待つ', en: '' }
        explain: { ja: '予算の制約は現実だ。ただし今回の侵入は、その制約の上で起きた。同じ条件のまま待てば、同じ結果になる。', en: '' }
        minutes: 45
        category: hurt
        points: -120
        refs: [nist-sp800-61r3]
        gauges: { flame: 5, trust: -10 }
        coward: true
        items:
          - { id: o03-a-content, points: -10, axis: content, refs: [nist-sp800-61r3] }
          - { id: o03-a-time, points: -10, axis: time, refs: [nist-sp800-61r3] }
      - id: o03-c-all
        text: { ja: '費用を確保し、全社の認証を今月中に切り替える', en: '' }
        explain: { ja: '費用の制約を前提に、期限を切って全部を対象にしている。委託元に見せる約束としても、具体的で強い。', en: '' }
        minutes: 150
        category: increase
        points: 250
        refs: [nist-sp800-61r3, meti-csm-guideline]
        gauges: { trust: 15, stamina: -15, damage: -10 }
        setFlags: { mfaRollout: true }
        items:
          - { id: o03-c-content, points: 8, axis: content, refs: [nist-sp800-61r3] }
          - { id: o03-c-order, points: 8, axis: order, refs: [meti-csm-guideline] }
    lesson: { ja: '認証の強化は、予算の制約を理由に先送りしない。全社を対象に、期限を切って切り替える。重要システムだけに絞る場合は、対象外をいつまでに埋めるかを、同じ文書に書いておく。', en: '' }

  - id: p04-clients
    at: { day: 0, minutes: 1020 }
    phase: organize
    sound: { se: [phone_ring] }
    text: { ja: '午後5時。取引先は12社。担当者への連絡を始めたいが、全社に同じ内容を伝えてよいかも分からない。', en: '' }
    voices: [v04-a, v04-b, v04-ok]
    notable:
      - { id: note-client-order, text: { ja: '影響の大きい委託元から順に電話し、同じ日に全社へ文書を出した。', en: '' } }
    choices:
      - id: o04-c-order
        text: { ja: '影響の大きい順に電話し、同じ日に全社へ文書を送る', en: '' }
        explain: { ja: '順番の理由を説明でき、全社に同じ日に届く。電話と文書を組み合わせたことで、報告の判断も早くなる。', en: '' }
        minutes: 210
        category: increase
        points: 300
        refs: [meti-csm-guideline, ppc-report-scope]
        gauges: { trust: 15, stamina: -20 }
        setFlags: { clientNotified: true }
        items:
          - { id: o04-c-order, points: 8, axis: order, refs: [meti-csm-guideline] }
          - { id: o04-c-care, points: 8, axis: care, refs: [ppc-report-scope] }
      - id: o04-b-mail
        text: { ja: '全社に同じ文書を、同じ日のうちに送っておく', en: '' }
        explain: { ja: '全社に同時に届く点は公平だ。ただ、影響の大きい委託元ほど、直接の説明を期待している。', en: '' }
        minutes: 90
        category: maintain
        points: 20
        refs: [meti-csm-guideline]
        gauges: { trust: 5 }
        items:
          - { id: o04-b-order, points: 5, axis: order, refs: [meti-csm-guideline] }
          - { id: o04-b-content, points: 5, axis: content, refs: [jpcert-handling] }
      - id: o04-a-big
        text: { ja: '売上の大きい取引先二社にだけ、先に伝える', en: '' }
        explain: { ja: '重要顧客を押さえる発想は理解できる。だが後から知った委託元は、自社が軽く見られたと受け取る。', en: '' }
        minutes: 60
        category: hurt
        points: -110
        refs: [meti-csm-guideline]
        gauges: { flame: 10, trust: -10 }
        setFlags: { delayClient: true }
        items:
          - { id: o04-a-order, points: -10, axis: order, refs: [meti-csm-guideline] }
          - { id: o04-a-wording, points: -8, axis: wording, refs: [meti-disclosure-guidance] }
    lesson: { ja: '取引先への連絡は、影響の大きい順に電話で行い、同じ日のうちに全社へ文書を出す。順番を決めた理由を説明できる形にする。大きい取引先だけを先にすると、残りは後回しにされたと受け取る。', en: '' }

  - id: p05-ppc-prep
    at: { day: 0, minutes: 1260 }
    phase: notify
    text: { ja: '午後9時。最大の委託元が、明日の朝に速報を出すという。必要な資料を、今夜のうちに渡さなければならない。', en: '' }
    voices: [v05-a, v05-b, v05-ok]
    notable:
      - { id: note-scope, text: { ja: '対象の取引先と、持ち出された項目の一覧を作った。', en: '' } }
    choices:
      - id: o05-b-mail
        text: { ja: '分かっていることを、メールで送っておく', en: '' }
        explain: { ja: '早く渡す姿勢は良い。ただ、委託元が報告に使う項目の順番までは整っておらず、書き直しになる。', en: '' }
        minutes: 60
        category: maintain
        points: 20
        refs: [ppc-report-prelim]
        gauges: { stamina: -10 }
        items:
          - { id: o05-b-content, points: 5, axis: content, refs: [ppc-report-prelim] }
          - { id: o05-b-time, points: 5, axis: time, refs: [ppc-report-prelim] }
      - id: o05-c-sheet
        text: { ja: '時刻と件数、対象項目、対応を1枚にまとめて渡す', en: '' }
        explain: { ja: '委託元の報告に必要な項目を、1枚で揃えている。相手の作業を減らし、期限に間に合わせる実務の判断だ。', en: '' }
        minutes: 150
        category: increase
        points: 250
        refs: [ppc-report-prelim, ppc-report-scope]
        gauges: { trust: 15, stamina: -15 }
        setFlags: { ppcPrelimFiled: true, reportShared: true }
        items:
          - { id: o05-c-record, points: 8, axis: record, refs: [ppc-report-prelim] }
          - { id: o05-c-content, points: 8, axis: content, refs: [ppc-report-scope] }
      - id: o05-a-location
        text: { ja: 'ログの保存場所だけを伝えて、あとは任せる', en: '' }
        explain: { ja: '情報は渡しているが、相手に調査を丸投げしている。委託元は技術の担当ではないので、期限に間に合わない。', en: '' }
        minutes: 45
        category: hurt
        points: -100
        refs: [no02-ppc-report-entrusted]
        gauges: { trust: -10, flame: 5 }
        items:
          - { id: o05-a-content, points: -10, axis: content, refs: [no02-ppc-report-entrusted] }
          - { id: o05-a-time, points: -8, axis: time, refs: [ppc-report-prelim] }
    lesson: { ja: '委託元の速報を支えるときは、相手の書式と項目に合わせて1枚にまとめる。時刻、件数、対象項目、自社の対応を揃える。ログの場所だけを渡すと、委託元は調査から始めることになる。', en: '' }

  - id: p06-apology
    at: { day: 1, minutes: 600 }
    phase: notify
    text: { ja: '2日目午前10時。謝罪に誰が行くかで、社内の意見が割れている。社長は現場を離れられないと言う。', en: '' }
    voices: [v06-a, v06-b, v06-ok]
    choices:
      - id: o06-b-staff
        text: { ja: '担当者だけで訪問し、経過と対策を説明する', en: '' }
        explain: { ja: '現場を知る担当者が説明する利点はある。ただ、経営の約束を持たない説明は、相手に届きにくい。', en: '' }
        minutes: 90
        category: maintain
        points: 20
        refs: [meti-csm-guideline]
        gauges: { trust: 5, stamina: -10 }
        items:
          - { id: o06-b-wording, points: 5, axis: wording, refs: [meti-csm-guideline] }
          - { id: o06-b-content, points: 5, axis: content, refs: [jpcert-handling] }
      - id: o06-a-mail
        text: { ja: 'メールで謝罪の文書を送るだけで済ませる', en: '' }
        explain: { ja: '文書での謝罪は記録に残る。だが訪問を避けたと受け取られ、その後の交渉が難しくなる。', en: '' }
        minutes: 45
        category: hurt
        points: -100
        refs: [meti-csm-guideline]
        gauges: { flame: 10, trust: -10 }
        items:
          - { id: o06-a-wording, points: -10, axis: wording, refs: [meti-csm-guideline] }
          - { id: o06-a-care, points: -8, axis: care, refs: [meti-disclosure-guidance] }
      - id: o06-c-visit
        text: { ja: '社長と担当が訪問し、経過と再発防止の期限を伝える', en: '' }
        explain: { ja: '経営の責任者が直接出向き、期限まで示している。委託元が契約を判断する材料として、最も強い説明だ。', en: '' }
        minutes: 180
        category: increase
        points: 250
        refs: [meti-csm-guideline, meti-disclosure-guidance]
        gauges: { trust: 20, stamina: -20, flame: -10 }
        setFlags: { apologyVisit: true }
        detail: client-letter
        items:
          - { id: o06-c-wording, points: 8, axis: wording, refs: [meti-csm-guideline] }
          - { id: o06-c-care, points: 8, axis: care, refs: [meti-disclosure-guidance] }
    lesson: { ja: '謝罪は、担当者だけで済ませない。経営の責任者が訪問し、経過と再発防止の期限を伝える。その場で渡す文書は、原因、対象、支援、次の連絡先まで揃える。訪問の有無が、契約の判断を変える。', en: '' }

  - id: p07-compensation
    at: { day: 1, minutes: 780 }
    phase: notify
    text: { ja: '午後1時。二社が補償の話を出してきた。契約には金額の定めがない。どこまで出すかを決めなければならない。', en: '' }
    voices: [v07-a, v07-b, v07-ok]
    choices:
      - id: o07-c-share
        text: { ja: '実費と再発防止の分担を、契約の枠を超えて示す', en: '' }
        explain: { ja: '契約の枠を超えて、実際に困っている費用から示している。交渉の出発点として現実的で、誠意も伝わる。', en: '' }
        minutes: 180
        category: increase
        points: 200
        refs: [meti-csm-guideline, ppc-notify-person]
        gauges: { trust: 20, stamina: -15, flame: -5 }
        setFlags: { compensation: true }
        items:
          - { id: o07-c-care, points: 8, axis: care, refs: [ppc-notify-person] }
          - { id: o07-c-wording, points: 8, axis: wording, refs: [meti-csm-guideline] }
      - id: o07-b-contract
        text: { ja: '契約に書かれた範囲で、補償を協議する', en: '' }
        explain: { ja: '契約を基準にする姿勢は公平だ。ただ、実費すら出ないと受け取られると、交渉は長引き不信が残る。', en: '' }
        minutes: 120
        category: maintain
        points: 20
        refs: [meti-csm-guideline]
        gauges: { trust: 5, stamina: -10 }
        items:
          - { id: o07-b-care, points: 5, axis: care, refs: [ppc-notify-person] }
          - { id: o07-b-order, points: 5, axis: order, refs: [meti-csm-guideline] }
      - id: o07-a-wait
        text: { ja: '損害が確定するまで、何も提示しないでおく', en: '' }
        explain: { ja: '金額を急がない判断は理解できる。だが何も出さない間、相手は弁護士を立てて構える。', en: '' }
        minutes: 45
        category: hurt
        points: -110
        refs: [meti-csm-guideline]
        gauges: { trust: -15, flame: 5 }
        coward: true
        items:
          - { id: o07-a-care, points: -10, axis: care, refs: [ppc-notify-person] }
          - { id: o07-a-wording, points: -8, axis: wording, refs: [meti-csm-guideline] }
    lesson: { ja: '補償は、金額の確定を待たずに枠を示す。実費と再発防止の分担を、契約の枠を超えて提示する。何も出さないまま待つと、相手は交渉の構えに入り、話が長引く。枠を示すことが、対話の入口になる。', en: '' }

  - id: p08-press-setup
    at: { day: 1, minutes: 960 }
    phase: notify
    sound: { se: [shutter] }
    text: { ja: '午後4時。報道各社から取材の申し込みが来た。会見をいつ、どの形で開くかを決めなければならない。', en: '' }
    voices: [v08-a, v08-b, v08-ok]
    choices:
      - id: o08-b-week
        text: { ja: '一週間後に、余裕を持って開くことにする', en: '' }
        explain: { ja: '準備の時間は取れる。だが一週間の空白は、憶測と二次被害の時間でもある。被害者の行動は待ってくれない。', en: '' }
        minutes: 60
        category: maintain
        points: 20
        refs: [meti-disclosure-guidance]
