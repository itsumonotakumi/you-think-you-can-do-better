        text: { ja: '被害届と相談を進め、業務に影響しない形で証拠を残す', en: '' }
        explain: { ja: '犯罪として扱う道筋を作りながら、証拠の保全と業務の両立を考えている。攻撃者への圧力にもなる。', en: '' }
