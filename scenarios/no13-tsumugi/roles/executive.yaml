          - { id: e10-a-content, points: -8, axis: content, refs: [meti-csm-guideline] }
      - id: e10-b-log
        text: { ja: 'SaaS事業者にログの提供だけを求めて終える', en: '' }
        explain: { ja: '必要な資料は押さえている。ただ、調査の分担と費用の話をしないと、後に揉める。分担を決めないまま調査を終えると、費用の負担で争いになる。', en: '' }
        minutes: 60
        category: maintain
        points: 25
        refs: [nist-sp800-61r3]
        gauges: { stamina: -5 }
        items:
          - { id: e10-b-content, points: 5, axis: content, refs: [nist-sp800-61r3] }
          - { id: e10-b-order, points: 5, axis: order, refs: [jpcert-handling] }
    lesson: { ja: 'SaaS事業者との責任分界は、調査の前に決め切らない。まずログの提供と共同調査を文書で求め、事実を揃える。そのうえで、契約の薄さを補う条項を次の更新で入れる。契約は次の更新で直す。', en: '' }

  - id: p11-compensation
    at: { day: 3, minutes: 600 }
