# No.13 ツムギ・アナリティクス / 経営者ロール（代表取締役社長）
# 判断ポイント16、細目は choices[].items と drafts の合計で80以上。
estimateMinutes: 30
intro: { ja: 'あなたはツムギ・アナリティクスの社長。取引先の会員データを預かって分析する会社で、朝から基盤の警告が鳴っている。預かったデータは、自社のものではない。その重さを、今日ほど意識した日はない。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-prelim
    ref: ppc-report-prelim
    label: { ja: '個人情報保護委員会への速報', en: '' }
    points: -150
    doneFlag: ppcPrelimFiled
  - id: dl-final
    ref: ppc-report-final-malicious
    label: { ja: '個人情報保護委員会への確報（不正の目的のおそれ）', en: '' }
    points: -80
    doneFlag: ppcFinalFiled
events:
  - id: ev-attacker
    at: { day: 0, minutes: 870 }
    voices: [v-ev-attacker]
    gauges: { flame: 5 }
    sound: { se: [mail_arrive] }
    caption: { ja: '差出人不明のメール。本文には、持ち出したデータの一部と支払いの期限が書かれていた。', en: '' }
  - id: ev-news
    at: { day: 1, minutes: 1320 }
    voices: [v-ev-news]
    gauges: { flame: 10 }
  - id: ev-client
    at: { day: 2, minutes: 480 }
    voices: [v-ev-client]
    caption: { ja: '最大の委託元から、役員が午後に訪ねると連絡が入った。', en: '' }
points:
  - id: p01-alert
    at: { day: 0, minutes: 570 }
    phase: detect
    sound: { se: [mail_arrive] }
    text: { ja: '午前9時30分。預かりデータの分析基盤に、海外から大量ダウンロードの警告が出た。技術部門は原因をまだ掴んでいない。', en: '' }
    voices: [v01-a, v01-b, v01-ok]
    notable:
      - { id: note-mfa, text: { ja: '基盤の多要素認証は全社で未設定だった。', en: '' } }
    choices:
      - id: e01-c-stop
        text: { ja: '全セッションを止め、調査と取引先への連絡を同時に始める', en: '' }
        explain: { ja: '被害を止める操作と、預かり主への連絡を同時に始めている。原因が確定する前でも、止める判断はできる。', en: '' }
        minutes: 90
        category: increase
        points: 300
        refs: [nist-sp800-61r3, meti-csm-guideline]
        gauges: { damage: -15, trust: 10, stamina: -15 }
        setFlags: { contained: true, earlyNotice: true }
        items:
          - { id: e01-c-content, points: 8, axis: content, refs: [nist-sp800-61r3] }
          - { id: e01-c-order, points: 8, axis: order, refs: [meti-csm-guideline] }
      - id: e01-b-wait
        text: { ja: '調査結果が出るまで、技術部門に任せて待機する', en: '' }
        explain: { ja: '技術の判断を任せること自体は悪くない。ただ、預かり主への連絡を待たせると、報告の時計も遅れる。', en: '' }
        minutes: 60
        category: maintain
        points: 20
        refs: [jpcert-handling]
        gauges: { stamina: -5 }
        items:
          - { id: e01-b-content, points: 5, axis: content, refs: [jpcert-handling] }
          - { id: e01-b-record, points: 5, axis: record, refs: [jpcert-handling] }
      - id: e01-a-hide
        text: { ja: '原因が分かるまで、社外には一切知らせないでおく', en: '' }
        explain: { ja: '漏えいの事実は、分かってからでは遅い。沈黙の間に攻撃者はデータを広げ、委託元の報告も遅れる。', en: '' }
        minutes: 45
        category: hurt
        points: -120
        refs: [meti-disclosure-guidance]
        gauges: { flame: 10, trust: -10 }
        coward: true
        setFlags: { hidAttack: true }
        items:
          - { id: e01-a-content, points: -10, axis: content, refs: [meti-disclosure-guidance] }
          - { id: e01-a-time, points: -10, axis: time, refs: [ppc-report-prelim] }
    lesson: { ja: '預かったデータの異常は、原因が確定する前に止める。全セッションの失効と、預かり主への第一報を同時に始める。隠している間にも攻撃は進み、報告の期限だけが過ぎていく。', en: '' }

  - id: p02-mfa
    at: { day: 0, minutes: 660 }
    phase: contain
    text: { ja: '午前11時。基盤の多要素認証は未設定だった。技術部門は全社導入に三か月はかかると言う。', en: '' }
    voices: [v02-a, v02-b, v02-ok]
    notable:
      - { id: note-mfa, text: { ja: '多要素認証の未設定が、今回の侵入を許した。', en: '' } }
    choices:
      - id: e02-a-later
        text: { ja: '現場の負担を考え、来期の計画に載せるだけにする', en: '' }
        explain: { ja: '負担への配慮は分かるが、同じ手口は明日も来る。期限を切らない計画は、実行されないまま終わりやすい。', en: '' }
        minutes: 60
        category: hurt
        points: -110
        refs: [nist-sp800-61r3]
        gauges: { trust: -10, flame: 5 }
        coward: true
        items:
          - { id: e02-a-content, points: -10, axis: content, refs: [nist-sp800-61r3] }
          - { id: e02-a-time, points: -8, axis: time, refs: [nist-sp800-61r3] }
      - id: e02-c-all
        text: { ja: '全社と全基盤に即時導入し、例外は期限付きで認める', en: '' }
        explain: { ja: '対象を絞らず、例外にも期限と承認を付けている。漏れを作らずに進める形で、再発防止の実効性が高い。', en: '' }
        minutes: 150
        category: increase
        points: 250
        refs: [nist-sp800-61r3, ipa-sme-guideline]
        gauges: { damage: -10, trust: 15, stamina: -15 }
        setFlags: { mfaRollout: true }
        items:
          - { id: e02-c-content, points: 8, axis: content, refs: [nist-sp800-61r3] }
          - { id: e02-c-record, points: 8, axis: record, refs: [ipa-sme-guideline] }
      - id: e02-b-key
        text: { ja: '重要な基盤だけを対象に、今週中に必須化する', en: '' }
        explain: { ja: '重要度で優先する判断は筋が通る。ただし境界が曖昧なままだと、後から足りない基盤が出てくる。', en: '' }
        minutes: 90
        category: maintain
        points: 25
        refs: [nist-sp800-61r3]
        gauges: { trust: 5, stamina: -10 }
        items:
          - { id: e02-b-content, points: 5, axis: content, refs: [nist-sp800-61r3] }
          - { id: e02-b-order, points: 5, axis: order, refs: [ipa-sme-guideline] }
    lesson: { ja: '認証の穴は、負担を理由に先送りすると必ず残る。全社と全基盤を対象にし、例外には期限と承認を付ける。優先順位で絞るなら、対象外にした理由を記録して後で確認し、見直しは続ける。', en: '' }

  - id: p03-ransom
    at: { day: 0, minutes: 900 }
    phase: contain
    sound: { se: [mail_arrive] }
    text: { ja: '午後3時。攻撃者から、72時間以内に支払わなければ取引先のデータを公開するとのメールが届いた。', en: '' }
    voices: [v03-a, v03-b, v03-ok]
    notable:
      - { id: note-scope, text: { ja: '攻撃者は取引先のデータの一部を、メールに添付して見せてきた。', en: '' } }
    choices:
      - id: e03-a-pay
        text: { ja: '支払って削除の証明を受け取り、公表は避ける', en: '' }
        explain: { ja: '支払っても削除は保証されず、犯罪組織の資金になる。公表を避けても、データは戻らない前提で動くべきだ。', en: '' }
        minutes: 120
        category: fatal
        points: -260
        refs: [npa-consult]
        gauges: { flame: 20, trust: -20, damage: 15 }
        setFlags: { paidRansom: true, hidAttack: true }
        items:
          - { id: e03-a-content, points: -10, axis: content, refs: [npa-consult] }
          - { id: e03-a-record, points: -10, axis: record, refs: [npa-consult] }
      - id: e03-b-hold
        text: { ja: '支払いは保留し、警察への相談だけを進める', en: '' }
        explain: { ja: '支払わない方向は正しい。ただ、保留のまま社内に置くと、現場が独自に交渉を始める余地が残る。', en: '' }
        minutes: 90
        category: maintain
        points: 20
        refs: [npa-consult]
        gauges: { damage: -5 }
        items:
          - { id: e03-b-content, points: 5, axis: content, refs: [npa-consult] }
          - { id: e03-b-order, points: 5, axis: order, refs: [npa-consult] }
      - id: e03-c-refuse
        text: { ja: '支払わない方針を即断し、警察と委託元に相談する', en: '' }
        explain: { ja: '方針を先に決め、相談先も同時に押さえている。現場が独自に交渉する余地をなくし、委託元にも判断を共有できる。', en: '' }
        minutes: 120
        category: recover
        points: 130
        refs: [npa-consult, meti-disclosure-guidance]
        gauges: { flame: -10, trust: 10, stamina: -15 }
        setFlags: { noRansom: true }
        items:
          - { id: e03-c-content, points: 8, axis: content, refs: [npa-consult] }
          - { id: e03-c-wording, points: 8, axis: wording, refs: [meti-disclosure-guidance] }
    lesson: { ja: '脅迫への対応は、支払わない方針を先に決めて共有する。削除も非公開も保証されない以上、支払いは資金を渡すだけになる。警察と委託元に相談し、現場が独自に交渉しない形を作る。', en: '' }

  - id: p04-statement
    at: { day: 0, minutes: 960 }
    phase: organize
    text: { ja: '午後4時。持ち出された範囲はまだ確定しない。広報は、今夜に第一報を出すかどうかを聞いてきた。', en: '' }
    voices: [v04-a, v04-b, v04-ok]
    choices:
      - id: e04-c-first
        text: { ja: '分かっている範囲で今夜第一報を出し、更新の予定を添える', en: '' }
        explain: { ja: '確定を待たずに事実を出し、次の接点を示している。憶測が広がる前に、会社の説明の軸を作れる。', en: '' }
        minutes: 120
        category: recover
        points: 120
        refs: [meti-disclosure-guidance, jpcert-handling]
        gauges: { flame: -10, trust: 10, stamina: -15 }
        setFlags: { firstStatement: true }
        items:
          - { id: e04-c-content, points: 8, axis: content, refs: [meti-disclosure-guidance] }
          - { id: e04-c-time, points: 8, axis: time, refs: [jpcert-handling] }
      - id: e04-a-later
        text: { ja: '確定するまで公表せず、社内の整理を優先する', en: '' }
        explain: { ja: '確定を待つ間に、委託元の会員は自分で情報を探し始める。沈黙は隠蔽と受け取られ、説明の前提を失う。', en: '' }
        minutes: 60
        category: hurt
        points: -130
        refs: [meti-disclosure-guidance]
        gauges: { flame: 15, trust: -15 }
        coward: true
        setFlags: { hidAttack: true }
        items:
          - { id: e04-a-wording, points: -10, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: e04-a-time, points: -10, axis: time, refs: [meti-disclosure-guidance] }
      - id: e04-b-client
        text: { ja: '取引先と相談して、公表の時期と内容を決める', en: '' }
        explain: { ja: '預かり主との調整は欠かせない。ただし調整に時間を取られると、一次情報のない時間が長く続く。', en: '' }
        minutes: 90
        category: maintain
        points: 20
        refs: [meti-disclosure-guidance]
        gauges: { trust: 5, stamina: -10 }
        items:
          - { id: e04-b-order, points: 5, axis: order, refs: [meti-disclosure-guidance] }
          - { id: e04-b-content, points: 5, axis: content, refs: [jpcert-handling] }
    lesson: { ja: '第一報は、確定を待たずに分かった範囲で出す。不明点は調査中と書き、次の公表の予定を添える。委託元との調整は必要だが、調整の間の沈黙が憶測を育てる。次の予定が、沈黙を埋める。', en: '' }

  - id: p05-clients
    at: { day: 0, minutes: 1110 }
