          - { id: e12-b-record, points: 5, axis: record, refs: [jpcert-handling] }
      - id: e12-c-ready
        text: { ja: '事実と不明点を分け、取引先と会員への対応を最初に述べる', en: '' }
        explain: { ja: '答える内容と順番を揃え、最初に被害者のことを置いている。会見の焦点が、説明責任に定まる。', en: '' }
        minutes: 150
        category: increase
        points: 250
