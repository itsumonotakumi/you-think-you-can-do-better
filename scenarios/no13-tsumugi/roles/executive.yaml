        text: { ja: 'SaaS事業者の責任だと公表して終わらせる', en: '' }
        explain: { ja: '責任を先に決めると、調査が相手の反論を潰す作業になる。自社の設定不備も見えなくなる。', en: '' }
        minutes: 60
        category: hurt
        points: -120
        refs: [meti-csm-guideline]
        gauges: { flame: 15, trust: -10 }
