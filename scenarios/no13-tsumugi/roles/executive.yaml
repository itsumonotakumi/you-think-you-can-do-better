  - id: p13-budget
    at: { day: 5, minutes: 600 }
    phase: recover
    text: { ja: '6日目午前10時。調査費用と再発防止の投資を、どこまで出すか。今期の利益は、ほぼ消える見込みだ。', en: '' }
