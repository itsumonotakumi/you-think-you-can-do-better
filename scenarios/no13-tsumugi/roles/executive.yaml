          - { id: e07-c-content, points: 8, axis: content, refs: [ipa-sme-guideline] }
      - id: e07-a-secret
        text: { ja: '動揺を避けるため、社員には詳しく伝えないでおく', en: '' }
        explain: { ja: '隠されたと知ったときの反発は大きい。自分の情報が漏れた事実を知らせないのは、通知の放棄でもある。', en: '' }
        minutes: 45
        category: hurt
        points: -100
        refs: [ppc-notify-person]
        gauges: { trust: -10, flame: 5 }
        coward: true
        items:
          - { id: e07-a-care, points: -10, axis: care, refs: [ppc-notify-person] }
          - { id: e07-a-wording, points: -8, axis: wording, refs: [meti-disclosure-guidance] }
      - id: e07-b-mail
        text: { ja: '社内のアナウンスと注意だけで済ませておく', en: '' }
        explain: { ja: '周知は最低限できる。ただ、何をすればよいかの案内がなく、パスワードの使い回しが残る。', en: '' }
        minutes: 60
        category: maintain
        points: 20
        refs: [ipa-sme-guideline]
        gauges: { stamina: -5 }
        items:
          - { id: e07-b-care, points: 5, axis: care, refs: [ipa-sme-guideline] }
          - { id: e07-b-record, points: 5, axis: record, refs: [jpcert-handling] }
    lesson: { ja: '従業員も被害者として扱う。本人通知と説明会を行い、パスワードの変更、多要素認証、不審な連絡への注意を具体的に案内する。社内アナウンスだけでは、行動は変わらない。', en: '' }

  - id: p08-meeting
    at: { day: 1, minutes: 900 }
    phase: notify
    sound: { se: [phone_ring] }
