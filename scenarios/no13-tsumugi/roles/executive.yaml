      - id: e14-c-all
        text: { ja: '全契約で、責任分界と連絡・費用負担を明文化する', en: '' }
        explain: { ja: '事件で露呈した空白を、契約の言葉で埋めている。委託元と委託先の役割が、次の事件で迷わない形になる。', en: '' }
        minutes: 240
        category: increase
        points: 250
        refs: [meti-csm-guideline, no02-ppc-report-entrusted]
