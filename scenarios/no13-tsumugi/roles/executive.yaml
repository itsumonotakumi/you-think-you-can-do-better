        text: { ja: 'ログ提供と共同調査を文書で求め、責任分界は後で整理する', en: '' }
        explain: { ja: '原因の断定を避け、事実の提供を先に求めている。契約が薄くても、調査への協力は別に取り付けられる。', en: '' }
        minutes: 150
        category: recover
