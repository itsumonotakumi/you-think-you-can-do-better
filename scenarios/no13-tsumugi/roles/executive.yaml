      - id: e13-a-cut
        text: { ja: '費用を抑えるために、調査をここで打ち切る', en: '' }
        explain: { ja: '費用の圧力は現実だ。だが範囲が確定しないまま終わると、再発防止の設計もできない。', en: '' }
        minutes: 60
        category: hurt
        points: -120
        refs: [nist-sp800-61r3]
        gauges: { damage: 15, trust: -10 }
        items:
          - { id: e13-a-content, points: -10, axis: content, refs: [nist-sp800-61r3] }
          - { id: e13-a-record, points: -10, axis: record, refs: [jpcert-handling] }
      - id: e13-b-insurance
        text: { ja: '保険と補償の手続きだけを、先に進めておくことにする', en: '' }
        explain: { ja: '資金の手当ては前進だ。ただ、保険金は対策の代わりにならず、調査の範囲も決まらない。', en: '' }
        minutes: 90
        category: maintain
        points: 20
        refs: [meti-csm-guideline]
