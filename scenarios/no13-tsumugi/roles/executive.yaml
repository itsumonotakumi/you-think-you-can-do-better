    notable:
      - { id: note-client-order, text: { ja: '影響の大きい委託元から順に、役員が直接電話し、同日中に全社へ文書を出した。', en: '' } }
    choices:
      - id: e05-a-big
        text: { ja: '売上の大きい取引先二社にだけ、先に伝えておく', en: '' }
        explain: { ja: '大きい取引先を優先する気持ちは分かる。だが小さい委託元ほど、後から知ったときの不信は大きい。', en: '' }
        minutes: 60
        category: hurt
        points: -100
        refs: [meti-csm-guideline]
        gauges: { flame: 10, trust: -10 }
        setFlags: { delayClient: true }
        items:
          - { id: e05-a-order, points: -10, axis: order, refs: [meti-csm-guideline] }
          - { id: e05-a-wording, points: -8, axis: wording, refs: [meti-disclosure-guidance] }
      - id: e05-c-direct
        text: { ja: '影響の大きい順に役員が電話し、同日中に全社へ文書を出す', en: '' }
        explain: { ja: '順番の理由が明確で、全社に同じ日に届く。直接の電話は、委託元が報告を判断する材料にもなる。', en: '' }
