          - { id: e05-c-care, points: 8, axis: care, refs: [ppc-report-scope] }
      - id: e05-b-mail
        text: { ja: '全社に同じ文書を一斉に送るだけで済ませておく', en: '' }
        explain: { ja: '全社に同じ日に届く点は良い。ただ、影響の大きい委託元ほど、電話での説明を期待している。', en: '' }
        minutes: 90
        category: maintain
        points: 20
        refs: [meti-csm-guideline]
        gauges: { trust: 5 }
        items:
          - { id: e05-b-order, points: 5, axis: order, refs: [meti-csm-guideline] }
          - { id: e05-b-content, points: 5, axis: content, refs: [jpcert-handling] }
    lesson: { ja: '取引先への連絡は、影響の大きい順に直接伝え、同じ日のうちに全社へ文書を出す。順番の理由を説明できる形にし、小さい委託元を後回しにしない。連絡の遅れは、隠蔽と受け取られる。', en: '' }

  - id: p06-ppc
    at: { day: 1, minutes: 540 }
    phase: notify
    text: { ja: '2日目午前9時。委託元の法務から「報告はどちらがするのか」と聞かれた。当社の従業員の情報も漏れている。', en: '' }
    voices: [v06-a, v06-b, v06-ok]
    choices:
      - id: e06-a-wait
        text: { ja: '委託元の報告を待ち、当社からの報告は不要と判断する', en: '' }
        explain: { ja: '委託元の報告義務を理解していても、自社の従業員情報は別だ。自社分を置き去りにすると、報告漏れになる。', en: '' }
        minutes: 60
        category: hurt
        points: -140
        refs: [no02-ppc-report-entrusted, ppc-report-scope]
        gauges: { trust: -10, flame: 5 }
        setFlags: { hidAttack: true }
        items:
          - { id: e06-a-content, points: -10, axis: content, refs: [ppc-report-scope] }
          - { id: e06-a-time, points: -10, axis: time, refs: [ppc-report-prelim] }
      - id: e06-b-client
        text: { ja: '委託元に任せたうえで、求められた資料を出す', en: '' }
        explain: { ja: '委託元が主体という理解は正しい。ただ、求められる前に出す姿勢が、報告の期限を守る鍵になる。', en: '' }
        minutes: 90
        category: maintain
        points: 25
        refs: [no02-ppc-report-entrusted]
        gauges: { trust: 5, stamina: -5 }
        items:
          - { id: e06-b-content, points: 5, axis: content, refs: [no02-ppc-report-entrusted] }
          - { id: e06-b-order, points: 5, axis: order, refs: [jpcert-handling] }
      - id: e06-c-both
        text: { ja: '委託元の速報を支え、自社の従業員分は自社で出す', en: '' }
        explain: { ja: '委託元と自社の義務を分けて、両方を同じ日に進めている。報告主体の違いを理解した、実務に沿う判断だ。', en: '' }
        minutes: 180
        category: increase
        points: 350
        refs: [no02-ppc-report-entrusted, ppc-report-prelim]
        gauges: { trust: 15, stamina: -20 }
        setFlags: { ppcPrelimFiled: true, reportShared: true }
        items:
          - { id: e06-c-content, points: 8, axis: content, refs: [no02-ppc-report-entrusted] }
          - { id: e06-c-record, points: 8, axis: record, refs: [ppc-report-prelim] }
    lesson: { ja: '委託元から預かったデータは、委託元が報告主体になる。委託先は事実と時刻を渡し、報告を支える。自社の従業員情報は自社の義務として、同じ日に速報を出す。二つを混ぜない。', en: '' }

