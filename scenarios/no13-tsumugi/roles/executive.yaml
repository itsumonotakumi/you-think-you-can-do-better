  - id: p16-future
    at: { day: 45, minutes: 600 }
    phase: after
    text: { ja: '46日目午前10時。新規の相談が戻り始めた。同じ方式でデータを預かる仕事を、続けるかどうか。', en: '' }
    voices: [v16-a, v16-b, v16-ok]
    choices:
      - id: e16-c-design
        text: { ja: '預からない分析方式に切り替え、第三者認証を取る', en: '' }
        explain: { ja: 'データを預からなければ、同じ事故の影響を小さくできる。認証で外部にも説明できる形になる。', en: '' }
        minutes: 300
        category: increase
        points: 200
        refs: [nist-sp800-61r3, meti-csm-guideline]
        gauges: { trust: 20, stamina: -20, damage: -10 }
        setFlags: { redesign: true }
        items:
          - { id: e16-c-content, points: 8, axis: content, refs: [nist-sp800-61r3] }
          - { id: e16-c-record, points: 8, axis: record, refs: [meti-csm-guideline] }
      - id: e16-a-resume
        text: { ja: '売上を優先し、これまでどおりの方式で再開する', en: '' }
        explain: { ja: '売上を戻す判断は分かる。ただ、預かり続ける限り同じリスクが残り、委託元も同じ不安を抱える。', en: '' }
        minutes: 60
        category: hurt
        points: -100
        refs: [nist-sp800-61r3]
        gauges: { damage: 10, trust: -10 }
        items:
          - { id: e16-a-content, points: -10, axis: content, refs: [nist-sp800-61r3] }
          - { id: e16-a-care, points: -8, axis: care, refs: [ppc-notify-person] }
      - id: e16-b-pause
        text: { ja: '新規の受注を止め、体制が整うまで待つ', en: '' }
        explain: { ja: '慎重な判断だが、止めている間も委託元は代わりの会社を探す。期限を切らない停止は長引く。', en: '' }
        minutes: 120
        category: maintain
        points: 25
        refs: [meti-csm-guideline]
        gauges: { trust: 5, stamina: -10 }
        items:
          - { id: e16-b-order, points: 5, axis: order, refs: [meti-csm-guideline] }
          - { id: e16-b-content, points: 5, axis: content, refs: [nist-sp800-61r3] }
    lesson: { ja: '再発防止は、注意ではなく仕組みで示す。データを預からない方式に変え、第三者認証を取る。売上を戻す速度より、同じ事故を繰り返さない設計を先に決める。その順番が、委託元の判断材料になる。', en: '' }

drafts:
  final-report:
    title: { ja: '調査報告書の公開範囲', en: '' }
    slots:
      - id: scope
        label: { ja: '公開する範囲', en: '' }
        options:
          - { id: fr-s-full, text: { ja: '攻撃に使える詳細だけ伏せて全文公開する', en: '' }, points: 10, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '危険な詳細だけを伏せる公開は、検証と再発防止を両立させる。委託元も同業も判断の材料にできる。', en: '' } }
          - { id: fr-s-hide, text: { ja: '公開せず、取引先にだけ渡して終える', en: '' }, points: -20, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '公開しないと、原因も対策も検証されない。同じ手口の被害が、別の会社で繰り返される。', en: '' } }
      - id: cause
        label: { ja: '原因の書き方', en: '' }
        options:
          - { id: fr-c-vague, text: { ja: '外部からの攻撃とだけ書いて終える', en: '' }, points: -10, axis: content, refs: [nist-sp800-61r3], explain: { ja: '外部からの攻撃とだけ書くと、どこを直すのか分からない。対策が精神論になり、検証もできない。', en: '' } }
          - { id: fr-c-saas, text: { ja: 'SaaS事業者の脆弱性だとして書いておく', en: '' }, points: -10, axis: wording, refs: [meti-csm-guideline], explain: { ja: '他社の脆弱性に寄せると、自社の認証の設定が抜ける。委託元は説明の不足を不誠実と受け取る。', en: '' } }
          - { id: fr-c-cause, text: { ja: '認証情報の窃取と権限の不備を書く', en: '' }, points: 10, axis: content, refs: [nist-sp800-61r3], explain: { ja: '侵入口と権限の不足を具体的に書くと、対策の優先順位が決まる。読み手も同じ穴を確認できる。', en: '' } }
      - id: responsibility
        label: { ja: '責任分界の書き方', en: '' }
        options:
          - { id: fr-r-own, text: { ja: '当社の認証管理、SaaSの設定、委託元の指示を分けて書く', en: '' }, points: 10, axis: content, refs: [no02-ppc-report-entrusted], explain: { ja: '三者の役割を分けて書くと、同じ事故を防ぐ分担が決まる。責任の押し付け合いも避けられる。', en: '' } }
          - { id: fr-r-client, text: { ja: '委託元の管理不足が原因だと、報告書で強調する', en: '' }, points: -15, axis: wording, refs: [meti-csm-guideline], explain: { ja: '委託元に責任を寄せると、自社の認証管理の不備が見えなくなる。取引先の信頼も損なう。', en: '' } }
      - id: clients
        label: { ja: '取引先への記載', en: '' }
        options:
          - { id: fr-l-none, text: { ja: '取引先の社名は書かないでおく', en: '' }, points: -5, axis: care, refs: [ppc-notify-person], explain: { ja: '社名を伏せる配慮は必要。ただし対象と通知の実績まで伏せると、委託元の説明と食い違う。', en: '' } }
          - { id: fr-l-notice, text: { ja: '対象の取引先と本人通知の実績を書く', en: '' }, points: 8, axis: care, refs: [ppc-notify-person], explain: { ja: '通知の実績は、実際に対応した証拠になる。委託元が会員に説明するときの支えにもなる。', en: '' } }
      - id: measures
        label: { ja: '再発防止策', en: '' }
        options:
          - { id: fr-m-slogan, text: { ja: '再発防止に努めますとだけ書く', en: '' }, points: -10, axis: content, refs: [cissp-cbk-secops], explain: { ja: '努めますだけでは、何をいつ誰がやるのか分からない。実行の確認もできない。', en: '' } }
          - { id: fr-m-tool, text: { ja: '新しい製品を導入したとだけ書く', en: '' }, points: -5, axis: content, refs: [cissp-cbk-secops], explain: { ja: '製品の導入は手段でしかない。何を守るためにどう使うかが書かれないと、効果を確かめられない。', en: '' } }
          - { id: fr-m-plan, text: { ja: '対策の時期と担当を、具体的に書く', en: '' }, points: 10, axis: content, refs: [cissp-cbk-secops], explain: { ja: '時期と担当があれば、対策が実行されたか検証できる。毎月の進捗公開にもそのまま使える。', en: '' } }
      - id: thirdparty
        label: { ja: '第三者検証', en: '' }
        options:
          - { id: fr-t-summary, text: { ja: '要約だけを載せて終える', en: '' }, points: -8, axis: record, refs: [cissp-cbk-secops], explain: { ja: '要約だけでは、都合の悪い指摘が抜けていないか分からない。調査の独立性が伝わらない。', en: '' } }
          - { id: fr-t-full, text: { ja: '第三者検証の意見を全文載せる', en: '' }, points: 8, axis: record, refs: [cissp-cbk-secops], explain: { ja: '第三者検証を全文載せると、調査の独立性が伝わる。都合の悪い指摘も隠せない。', en: '' } }
      - id: progress
        label: { ja: '進捗の公開', en: '' }
        options:
          - { id: fr-o-once, text: { ja: '一度だけ公開する', en: '' }, points: -5, axis: record, refs: [meti-disclosure-guidance], explain: { ja: '一度きりの公開では、その後の進み具合が分からない。未完了の対策が放置されやすい。', en: '' } }
          - { id: fr-o-monthly, text: { ja: '進捗を毎月公開する', en: '' }, points: 10, axis: record, refs: [meti-disclosure-guidance], explain: { ja: '毎月の進捗公開は、対策が形だけになっていないか確かめられる。改善の速度も見える。', en: '' } }
      - id: share
        label: { ja: '同業への共有', en: '' }
        options:
          - { id: fr-g-share, text: { ja: '得た教訓を同業と委託元に共有する', en: '' }, points: 10, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '教訓を共有すると、同じ手口の被害を他の会社で防げる。委託元の備えも上がる。', en: '' } }
          - { id: fr-g-keep, text: { ja: '自社の中だけにとどめておく', en: '' }, points: -5, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '自社だけに留めると、同じ型のリスクが業界に残る。再発防止に取り組む姿勢も伝わらない。', en: '' } }
