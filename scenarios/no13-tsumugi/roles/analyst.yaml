          - { id: a05-c-care, points: 8, axis: care, refs: [ipa-sme-guideline] }
      - id: a05-a-silent
        text: { ja: '自分のことで手一杯なので、黙っている', en: '' }
        explain: { ja: '余裕がないのは事実だ。だが同じ手口が同僚に残れば、被害は自分の分より広がる。一人で抱え込まない。', en: '' }
        minutes: 30
        category: hurt
        points: -120
        refs: [nist-sp800-61r3]
        gauges: { flame: 10, trust: -10 }
        coward: true
        items:
          - { id: a05-a-content, points: -10, axis: content, refs: [nist-sp800-61r3] }
