        explain: { ja: '同じツールを使った全員に広げ、認証情報まで無効にしている。感染源が同じなら、一人だけ直しても意味がない。', en: '' }
        minutes: 120
        category: increase
        points: 250
        refs: [nist-sp800-61r3, ipa-sme-guideline]
        gauges: { damage: -10, trust: 15, stamina: -15 }
