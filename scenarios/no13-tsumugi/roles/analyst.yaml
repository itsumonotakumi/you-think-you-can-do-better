          - { id: a16-a-content, points: -8, axis: content, refs: [meti-disclosure-guidance] }
          - { id: a16-a-care, points: -8, axis: care, refs: [ipa-sme-guideline] }
    lesson: { ja: '同業への共有は、自社の評判より、同じ手口の被害を減らすことを優先する。名前を伏せる配慮はしつつ、手口と失敗は具体的に話す。共有が、業界全体の備えになる。話すことが次の防御だ。', en: '' }

drafts:
  notice-list:
    title: { ja: '通知対象者リストの作り方', en: '' }
    slots:
      - id: timing
        label: { ja: '渡す時刻', en: '' }
        auto: true
        items:
          - { id: nl-t-12h, when: { withinHours: 12 }, points: 10, axis: time, refs: [ppc-notify-person] }
          - { id: nl-t-24h, when: { withinHours: 24 }, points: 5, axis: time, refs: [ppc-notify-person] }
          - { id: nl-t-late, when: { otherwise: true }, points: -15, axis: time, refs: [ppc-notify-person] }
      - id: scope
        label: { ja: '対象の範囲', en: '' }
        options:
          - { id: nl-s-all, text: { ja: '影響のあった全会員と退会者', en: '' }, points: 10, axis: content, refs: [ppc-notify-person], explain: { ja: '退会者まで含めれば、通知の漏れによる二次被害を防げる。対象者が自分で判断できる範囲になる。', en: '' } }
          - { id: nl-s-current, text: { ja: '現在の会員だけを対象にする', en: '' }, points: -10, axis: content, refs: [ppc-notify-person], explain: { ja: '退会者を外すと、データが残っていた人に通知が届かない。後から対象が増えれば訂正も必要になる。', en: '' } }
          - { id: nl-s-pending, text: { ja: '申込み途中の人だけを対象にする', en: '' }, points: -5, axis: content, refs: [ppc-notify-person], explain: { ja: '申込み途中だけでは、購入履歴のある会員が抜ける。対象の切り方の理由も説明できない。', en: '' } }
      - id: fields
        label: { ja: '載せる項目', en: '' }
        options:
          - { id: nl-f-name, text: { ja: '氏名と連絡先だけを載せる', en: '' }, points: -5, axis: content, refs: [ppc-report-scope], explain: { ja: '氏名と連絡先だけでは、何が漏れたかを伝えられない。会員は自分事として動けない。', en: '' } }
          - { id: nl-f-items, text: { ja: '氏名、連絡先、対象となった項目', en: '' }, points: 10, axis: content, refs: [ppc-report-scope], explain: { ja: '対象となった項目があれば、通知の文面にそのまま使える。会員も何を確認すべきか分かる。', en: '' } }
          - { id: nl-f-id, text: { ja: '会員番号だけを載せておく', en: '' }, points: -10, axis: content, refs: [ppc-report-scope], explain: { ja: '会員番号だけでは、通知を送る宛先が分からない。突き合わせの作業が、委託元に戻ってしまう。', en: '' } }
      - id: dedup
        label: { ja: '重複の扱い', en: '' }
        options:
          - { id: nl-d-dup, text: { ja: '重複したままでもよいとする', en: '' }, points: -10, axis: record, refs: [ppc-notify-person], explain: { ja: '重複を残すと、同じ会員に複数の通知が届く。問い合わせが増え、不信にもつながる。', en: '' } }
          - { id: nl-d-withdraw, text: { ja: '退会者だけを、先に除いておく', en: '' }, points: -5, axis: record, refs: [ppc-notify-person], explain: { ja: '退会者を除くと、データが残っていた人に通知が届かない。除く理由も説明できない。', en: '' } }
          - { id: nl-d-merge, text: { ja: '重複と退会者を除いて名寄せする', en: '' }, points: 10, axis: record, refs: [ppc-notify-person], explain: { ja: '重複と退会者を除いて名寄せすれば、通知は一度で届く。対象の数も正確になる。', en: '' } }
      - id: format
        label: { ja: '渡す形式', en: '' }
        options:
          - { id: nl-o-client, text: { ja: '委託元の書式に合わせて渡す', en: '' }, points: 10, axis: order, refs: [ppc-notify-person], explain: { ja: '委託元の書式に合わせれば、そのまま送信に使える。突き合わせの手間も減り、期限に間に合う。', en: '' } }
          - { id: nl-o-own, text: { ja: '自社の書式のままで渡す', en: '' }, points: -5, axis: order, refs: [ppc-notify-person], explain: { ja: '自社の書式のままだと、委託元で項目の対応づけが必要になる。その分だけ通知が遅れる。', en: '' } }
          - { id: nl-o-manual, text: { ja: '手作業で作った一覧で渡す', en: '' }, points: -5, axis: record, refs: [ppc-notify-person], explain: { ja: '手作業の一覧は、転記の誤りが入りやすい。誤った宛先に通知が届けば、信頼を大きく損なう。', en: '' } }
      - id: check
        label: { ja: '確認の方法', en: '' }
        options:
          - { id: nl-v-solo, text: { ja: '自分の確認だけで渡してしまう', en: '' }, points: -10, axis: order, refs: [ppc-notify-person], explain: { ja: '一人の確認では、抽出条件の思い違いに気づけない。対象の漏れは、後から見つかることが多い。', en: '' } }
          - { id: nl-v-peer, text: { ja: '抽出条件を別の担当に確認してもらう', en: '' }, points: 10, axis: order, refs: [ppc-notify-person], explain: { ja: '別の担当に条件を確認してもらえば、思い違いを減らせる。通知の漏れと重複を、渡す前に防げる。', en: '' } }
          - { id: nl-v-none, text: { ja: '確認をせずに、そのまま渡す', en: '' }, points: -10, axis: order, refs: [ppc-notify-person], explain: { ja: '確認なしで渡すと、条件の誤りがそのまま通知になる。訂正の連絡は、被害者に二度の不安を与える。', en: '' } }
      - id: protect
        label: { ja: '受け渡しの方法', en: '' }
        options:
          - { id: nl-p-mail, text: { ja: 'メールにそのまま添付して送る', en: '' }, points: -10, axis: care, refs: [ppc-notify-person], explain: { ja: '個人情報の一覧をそのまま添付すると、経路の途中で漏れる危険がある。送り方も安全管理の一部だ。', en: '' } }
          - { id: nl-p-share, text: { ja: '社内の共有の場所に置く', en: '' }, points: -5, axis: care, refs: [ppc-notify-person], explain: { ja: '共有の場所は便利だが、誰が見られるかの管理が要る。権限を決めないと、見てはいけない人まで見る。', en: '' } }
          - { id: nl-p-safe, text: { ja: 'パスワードを付けて安全に送る', en: '' }, points: 10, axis: care, refs: [ppc-notify-person], explain: { ja: 'パスワードを別経路で伝えれば、途中で漏れても中身は守られる。受け渡しの安全管理になる。', en: '' } }
      - id: record
        label: { ja: '記録', en: '' }
        options:
          - { id: nl-r-date, text: { ja: '渡した日時と版を記録する', en: '' }, points: 10, axis: record, refs: [jpcert-handling], explain: { ja: '日時と版を記録すれば、後から対象の変更をたどれる。訂正が必要になった理由も示せる。', en: '' } }
          - { id: nl-r-none, text: { ja: '記録は残さないでおく', en: '' }, points: -10, axis: record, refs: [jpcert-handling], explain: { ja: '記録がないと、いつ誰に何を渡したか説明できない。訂正のときの根拠も失う。', en: '' } }
          - { id: nl-r-verbal, text: { ja: '口頭で伝えるだけにしておく', en: '' }, points: -5, axis: record, refs: [jpcert-handling], explain: { ja: '口頭だけでは、渡した内容が残らない。担当が変わると、経緯をたどれなくなる。', en: '' } }
