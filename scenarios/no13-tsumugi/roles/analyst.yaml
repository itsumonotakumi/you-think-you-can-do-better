          - { id: a08-c-record, points: 8, axis: record, refs: [jpcert-handling] }
      - id: a08-a-hangup
        text: { ja: '自分では分からないと答えて、そのまま電話を切る', en: '' }
        explain: { ja: '知らないことを答えないのは誠実だ。だが取り次がずに切ると、相手は行き場を失い、憶測が広がる。', en: '' }
        minutes: 15
        category: hurt
        points: -100
        refs: [meti-csm-guideline]
        gauges: { flame: 10, trust: -10 }
        items:
          - { id: a08-a-care, points: -10, axis: care, refs: [meti-csm-guideline] }
          - { id: a08-a-wording, points: -8, axis: wording, refs: [meti-disclosure-guidance] }
    lesson: { ja: '取引先からの電話は、分かっている事実と不明点を分けて伝え、判断できる人につなぐ。取り次がずに切ると、相手は会員に説明できない。電話の内容と時刻は、記録に残す。つなぐことが答えになる。', en: '' }

  - id: p09-mfa-work
