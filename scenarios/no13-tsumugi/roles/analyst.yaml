          - { id: a11-b-order, points: 5, axis: order, refs: [jpcert-handling] }
      - id: a11-c-source
        text: { ja: '提供元と導入元を確かめ、社内の配布経路を一本化する', en: '' }
        explain: { ja: '道具の出どころを確かめ、配布の経路を一つにしている。同じ手口の再発を、仕組みで防ぐ判断だ。', en: '' }
        minutes: 150
        category: increase
        points: 200
        refs: [ipa-sme-guideline, nist-sp800-61r3]
        gauges: { trust: 10, stamina: -15, damage: -5 }
        setFlags: { toolsApproved: true }
        items:
          - { id: a11-c-content, points: 8, axis: content, refs: [ipa-sme-guideline] }
          - { id: a11-c-order, points: 8, axis: order, refs: [nist-sp800-61r3] }
      - id: a11-a-keep
        text: { ja: '便利なので、そのまま使い続けることにする', en: '' }
        explain: { ja: '便利さは分かる。だが今回の入口がその道具なら、使い続けることは同じ事故を招く。出どころを確かめるべきだ。', en: '' }
        minutes: 30
        category: hurt
        points: -130
        refs: [ipa-sme-guideline]
        gauges: { damage: 15, flame: 5 }
        items:
          - { id: a11-a-content, points: -10, axis: content, refs: [ipa-sme-guideline] }
          - { id: a11-a-record, points: -8, axis: record, refs: [jpcert-handling] }
    lesson: { ja: '業務で使う道具は、提供元と導入元を確かめる。非公式の配布サイトから落としたものを、必要な人だけに配っても危険は残る。社内の配布経路を一本化し、承認したものだけを使う。', en: '' }

  - id: p12-workload
    at: { day: 2, minutes: 600 }
    phase: recover
    text: { ja: '3日目午前10時。調査の作業が山積みで、通常の分析業務も止められない。自分の体力も限界に近い。', en: '' }
