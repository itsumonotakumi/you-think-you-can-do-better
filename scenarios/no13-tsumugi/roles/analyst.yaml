        text: { ja: '自社の評判を考えて、出席を断っておく', en: '' }
        explain: { ja: '評判を守る判断は分かる。だが同じ手口が広がれば、業界全体の信頼が下がり、自社も巻き込まれる。', en: '' }
        minutes: 30
        category: hurt
        points: -80
        refs: [meti-disclosure-guidance]
        gauges: { trust: -10, flame: 5 }
