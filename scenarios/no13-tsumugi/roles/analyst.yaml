    choices:
      - id: a06-b-mine
        text: { ja: '自分が担当した分だけを、先に伝えておく', en: '' }
        explain: { ja: '自分の範囲を正確に出すのは基本だ。ただ、共有のデータセットを使った分が抜けると、範囲が狭く見える。', en: '' }
        minutes: 75
