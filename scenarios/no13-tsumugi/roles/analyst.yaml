          - { id: a10-a-content, points: -8, axis: content, refs: [nist-sp800-61r3] }
    lesson: { ja: 'ログは、不審な行を拾うだけで終わらせない。時刻と操作を時系列に並べ、持ち出しの手順として再現する。前後の操作が分かれば、範囲の説明と再発防止の設計ができる。並べ直すことが調査だ。', en: '' }

  - id: p11-tools
    at: { day: 1, minutes: 1020 }
    phase: contain
    text: { ja: '午後5時。業務で使っていたツールは、実は非公式の配布サイトから落としたものだった。他の端末にも入っている。', en: '' }
    voices: [v11-a, v11-b, v11-ok]
    choices:
      - id: a11-b-needed
        text: { ja: '必要な人だけに、入れておくだけにしておく', en: '' }
