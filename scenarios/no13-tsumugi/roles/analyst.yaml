      - id: a09-a-delay
        text: { ja: '現場が混乱するので、設定を遅らせておくだけにする', en: '' }
        explain: { ja: '混乱を避ける判断は、現場を思ってのことだ。だが設定を遅らせた分だけ、同じ手口の余地が残る。', en: '' }
        minutes: 30
        category: hurt
        points: -100
        refs: [nist-sp800-61r3]
        gauges: { flame: 5, trust: -5 }
        coward: true
