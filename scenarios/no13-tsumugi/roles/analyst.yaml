          - { id: a06-a-content, points: -8, axis: content, refs: [nist-sp800-61r3] }
      - id: a06-c-table
        text: { ja: 'データセットと取引先の対応表を作り、調査班に渡す', en: '' }
        explain: { ja: '記憶ではなく、データセットと取引先の対応で示している。範囲の確定と、通知の設計に直結する作業だ。', en: '' }
