    notable:
      - { id: note-mfa, text: { ja: 'ブラウザに保存したパスワードが窃取され、多要素認証は未設定だった。', en: '' } }
    choices:
      - id: a03-b-main
        text: { ja: '仕事で使う主要なサービスだけを、先に変更する', en: '' }
        explain: { ja: '主要なものから変える順番は妥当だ。ただ、保存されていた十件のうち、残りが使い回されていれば同じ結果になる。', en: '' }
        minutes: 75
        category: maintain
        points: 25
        refs: [nist-sp800-61r3]
        gauges: { stamina: -10 }
        items:
          - { id: a03-b-content, points: 5, axis: content, refs: [nist-sp800-61r3] }
          - { id: a03-b-order, points: 5, axis: order, refs: [ipa-sme-guideline] }
      - id: a03-a-manager
        text: { ja: 'パスワードの変更は、管理者に任せておくだけにする', en: '' }
        explain: { ja: '任せれば漏れはないと思うかもしれない。だが本人しか知らない私的な使い回しまで、管理者は把握できない。', en: '' }
        minutes: 30
        category: hurt
        points: -100
        refs: [nist-sp800-61r3]
        gauges: { trust: -5, damage: 10 }
        items:
          - { id: a03-a-content, points: -10, axis: content, refs: [nist-sp800-61r3] }
          - { id: a03-a-record, points: -8, axis: record, refs: [jpcert-handling] }
      - id: a03-c-all
        text: { ja: '全サービスのパスワードを変え、多要素認証を設定する', en: '' }
        explain: { ja: '保存した全部を対象にし、認証も強くしている。一つでも残せば、そこから同じ手口で入り直せる。', en: '' }
        minutes: 150
        category: increase
        points: 300
        refs: [nist-sp800-61r3, ipa-sme-guideline]
        gauges: { damage: -15, trust: 15, stamina: -15 }
        setFlags: { credentialsRotated: true }
        items:
          - { id: a03-c-content, points: 8, axis: content, refs: [nist-sp800-61r3] }
          - { id: a03-c-record, points: 8, axis: record, refs: [ipa-sme-guideline] }
    lesson: { ja: 'ブラウザに保存した認証情報が盗まれたら、保存した全サービスのパスワードを変える。主要なものだけでは足りない。同時に多要素認証を設定し、同じ手口で入り直されるのを防ぐ。', en: '' }

  - id: p04-evidence
