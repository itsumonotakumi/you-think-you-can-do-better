          - { id: a13-c-wording, points: 8, axis: wording, refs: [meti-disclosure-guidance] }
      - id: a13-b-transfer
        text: { ja: '委託元の窓口に、そのまま転送しておくだけにする', en: '' }
        explain: { ja: '窓口を間違えない対応だ。ただ、転送の前に何も伝えないと、会員は不安を抱えたまま待つ。', en: '' }
        minutes: 30
        category: maintain
        points: 20
        refs: [ppc-notify-person]
        gauges: { stamina: -5 }
