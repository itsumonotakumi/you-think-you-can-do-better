    text: { ja: '午前9時15分。自分のアカウントに、見たことのない場所からのダウンロード履歴がある。件数は数千行分だ。', en: '' }
    voices: [v01-a, v01-b, v01-ok]
    choices:
      - id: a01-c-report
        text: { ja: '上司とSaaS事業者にすぐ連絡し、画面と時刻を残す', en: '' }
        explain: { ja: '見たものをそのまま残して、すぐ共有している。この時刻の記録が、後の調査の起点になる。', en: '' }
        minutes: 45
        category: recover
        points: 120
        refs: [jpcert-handling, nist-sp800-61r3]
        gauges: { damage: -10, trust: 5, stamina: -5 }
        setFlags: { earlyReport: true }
        items:
          - { id: a01-c-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: a01-c-order, points: 8, axis: order, refs: [nist-sp800-61r3] }
      - id: a01-b-password
        text: { ja: '自分のパスワードを変えて、しばらく様子を見る', en: '' }
        explain: { ja: '自分でできることを先にやる姿勢は良い。だが攻撃者は既にデータを持っており、報告の遅れだけが残る。', en: '' }
        minutes: 30
        category: maintain
        points: 20
        refs: [ipa-sme-guideline]
        gauges: { stamina: -5 }
        items:
          - { id: a01-b-content, points: 5, axis: content, refs: [ipa-sme-guideline] }
          - { id: a01-b-record, points: 5, axis: record, refs: [jpcert-handling] }
      - id: a01-a-confirm
        text: { ja: '誤操作かもしれないので、確かめてから報告する', en: '' }
        explain: { ja: '誤報を避けたい気持ちは分かる。だが数千行のダウンロードは誤操作では説明できず、確かめる間に広がる。', en: '' }
        minutes: 30
        category: hurt
        points: -110
        refs: [nist-sp800-61r3]
        gauges: { flame: 5, trust: -5 }
        coward: true
        items:
          - { id: a01-a-content, points: -10, axis: content, refs: [nist-sp800-61r3] }
          - { id: a01-a-time, points: -8, axis: time, refs: [jpcert-handling] }
    lesson: { ja: '見慣れない操作を見つけたら、確かめる前に共有する。画面と時刻を残し、上司とSaaS事業者に同時に連絡する。誤報を恐れて待つ間にも、持ち出しは進み、報告の時刻だけが遅れる。', en: '' }

  - id: p02-pc
    at: { day: 0, minutes: 585 }
    phase: detect
    text: { ja: '午前9時45分。自分の端末に、見覚えのない常駐ソフトがある。昨日、業務用と称するツールを入れた。', en: '' }
    voices: [v02-a, v02-b, v02-ok]
    choices:
      - id: a02-b-antivirus
        text: { ja: 'セキュリティソフトで、まず駆除しておく', en: '' }
        explain: { ja: '駆除すれば安心に見える。だが何をされたかの記録が消え、同じ手口の全容が分からなくなる。', en: '' }
        minutes: 45
        category: maintain
        points: 20
        refs: [ipa-sme-guideline]
        gauges: { stamina: -5 }
        items:
          - { id: a02-b-content, points: 5, axis: content, refs: [ipa-sme-guideline] }
          - { id: a02-b-record, points: 5, axis: record, refs: [jpcert-handling] }
      - id: a02-c-isolate
        text: { ja: 'ネットワークから切り離し、端末をそのまま保全する', en: '' }
        explain: { ja: '端末を止めて残す判断は、地味だが効く。分析担当の端末は、何が盗まれたかを示す証拠になる。', en: '' }
        minutes: 60
        category: recover
        points: 130
        refs: [nist-sp800-61r3, jpcert-handling]
        gauges: { damage: -10, trust: 10, stamina: -10 }
        setFlags: { pcIsolated: true }
        items:
          - { id: a02-c-record, points: 8, axis: record, refs: [nist-sp800-61r3] }
          - { id: a02-c-order, points: 8, axis: order, refs: [jpcert-handling] }
      - id: a02-a-reboot
        text: { ja: '再起動して、そのまま業務を続けてしまう', en: '' }
        explain: { ja: '業務を止めない判断は、現場の事情として理解できる。だが通信を続ければ、盗まれた情報も増える。', en: '' }
        minutes: 30
        category: hurt
        points: -130
        refs: [nist-sp800-61r3]
        gauges: { damage: 15, flame: 5 }
        items:
          - { id: a02-a-content, points: -10, axis: content, refs: [nist-sp800-61r3] }
          - { id: a02-a-record, points: -10, axis: record, refs: [jpcert-handling] }
    lesson: { ja: '怪しいソフトを見つけたら、駆除より先に端末を切り離して残す。何をされたかの記録は、その端末にしかない。動かしたままにすると、盗まれる情報も増え、調査の根拠も失う。', en: '' }

