        text: { ja: '全アカウントを棚卸しし、共有アカウントを個人に分ける', en: '' }
        explain: { ja: '設定の前に、アカウントの持ち主をはっきりさせている。共有を個人に分ければ、誰の操作かも追える。', en: '' }
        minutes: 180
        category: increase
        points: 250
        refs: [nist-sp800-61r3, ipa-sme-guideline]
        gauges: { trust: 15, stamina: -20, damage: -10 }
        setFlags: { accountsSplit: true }
        items:
          - { id: a09-c-content, points: 8, axis: content, refs: [nist-sp800-61r3] }
          - { id: a09-c-record, points: 8, axis: record, refs: [ipa-sme-guideline] }
    lesson: { ja: '多要素認証は、自分の分だけで終わらせない。共有アカウントを棚卸しし、個人のアカウントに分ける。共有のままだと、誰が操作したかも分からず、設定の穴として残る。持ち主を決めるのが先だ。', en: '' }

  - id: p10-log-review
