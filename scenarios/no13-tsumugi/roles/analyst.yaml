          - { id: a13-a-wording, points: -8, axis: wording, refs: [meti-disclosure-guidance] }
    lesson: { ja: '会員からの電話は、委託元の窓口と説明を揃えて答える。なりすましへの注意も伝える。分からないことを伝えるのは誠実だが、取り次がずに切ると、会員は行き場を失う。まず受け止める。', en: '' }

