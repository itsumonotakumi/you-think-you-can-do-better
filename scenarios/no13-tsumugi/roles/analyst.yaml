      - id: a14-c-fail
        text: { ja: '自分の失敗を手順にして、偽ツールの見分けを教える', en: '' }
        explain: { ja: '自分の失敗を手順として出し、見分け方まで教えている。当事者の言葉は、注意喚起より届く。', en: '' }
        minutes: 150
        category: increase
        points: 250
        refs: [ipa-sme-guideline, nist-sp800-61r3]
        gauges: { trust: 15, stamina: -15, damage: -5 }
