      - id: a15-c-all
        text: { ja: '全端末の設定を点検し、不備を記録して直す', en: '' }
        explain: { ja: '八十台を全部見て、不備を記録している。時間はかかるが、確認した範囲を説明できる形になる。', en: '' }
        minutes: 240
        category: recover
        points: 120
        refs: [ipa-sme-guideline, nist-sp800-61r3]
        gauges: { trust: 10, stamina: -20, damage: -10 }
