    label: { ja: '委託元の速報に使う対象者リストの提出', en: '' }
    points: -150
    doneFlag: ppcPrelimFiled
  - id: dl-analyst-final
    ref: ppc-report-final-malicious
    label: { ja: '確報に使う点検結果の提出', en: '' }
    points: -80
    doneFlag: ppcFinalFiled
