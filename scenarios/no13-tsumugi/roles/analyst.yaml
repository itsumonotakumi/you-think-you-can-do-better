    lesson: { ja: '同じツールを使った同僚には、すぐ声をかける。何を確認すべきかを伝え、認証情報を一緒に失効させる。自分の分だけで終えると、同じ侵入口から被害が広がる。声をかけることが被害を止める。', en: '' }

