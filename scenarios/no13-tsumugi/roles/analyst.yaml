    lesson: { ja: '調査には、自分が何をしたかを時系列で出す。警告の画面や時刻も、そのまま渡す。履歴を消すと、疑いを晴らす材料を自分で捨てることになり、侵入の解明も止まる。事実を出す勇気が要る。', en: '' }

  - id: p05-coworker
