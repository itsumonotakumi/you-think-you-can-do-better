          - { id: a12-c-care, points: 8, axis: care, refs: [ipa-sme-guideline] }
          - { id: a12-c-record, points: 8, axis: record, refs: [jpcert-handling] }
    lesson: { ja: '調査と通常業務を一人で抱えない。担当を交代し、休む時間を先に決める。根を詰めると確認漏れが起き、かえって調査が長引く。疲労は、事故の原因になる。休むことも対応のうちだ。', en: '' }

