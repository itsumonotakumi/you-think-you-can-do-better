      - id: a12-c-handover
        text: { ja: '調査を優先し、担当を交代して負担を減らす', en: '' }
        explain: { ja: '自分の限界を認めて、担当を交代している。調査の質を保つには、休む設計が要る。交代は後退ではない。', en: '' }
        minutes: 90
        category: recover
        points: 110
        refs: [ipa-sme-guideline, jpcert-handling]
        gauges: { stamina: 15, trust: 10, damage: -5 }
        setFlags: { workloadShared: true }
