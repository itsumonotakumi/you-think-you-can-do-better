          - { id: a14-a-wording, points: -8, axis: wording, refs: [meti-disclosure-guidance] }
    lesson: { ja: '自分の失敗は、手順として共有する。偽のツールをどう見分けるかまで具体的に伝えれば、他の社員の行動が変わる。運の話にすると他人事になり、同じ手口の被害が繰り返される。', en: '' }

  - id: p15-check
    at: { day: 10, minutes: 600 }
    phase: after
    text: { ja: '11日目午前10時。全端末の設定を見直す作業。台数は八十台あり、一日では終わらない。', en: '' }
