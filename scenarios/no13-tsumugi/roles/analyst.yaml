          - { id: a14-c-content, points: 8, axis: content, refs: [nist-sp800-61r3] }
      - id: a14-a-luck
        text: { ja: '自分が狙われたのは、運が悪かったと話しておく', en: '' }
        explain: { ja: '運の話にすると、他人事になる。誰にでも起きる手口だと伝わらず、同じ行動が残る。当事者の言葉が要る。', en: '' }
        minutes: 30
        category: hurt
        points: -80
        refs: [ipa-sme-guideline]
        gauges: { trust: -5, flame: 5 }
