        text: { ja: '調査よりも、売上を優先してしまう', en: '' }
        explain: { ja: '売上を気にする理由は分かる。ただ、調査が止まれば範囲が確定せず、委託元の通知も遅れる。', en: '' }
        minutes: 60
        category: hurt
        points: -110
        refs: [jpcert-handling]
        gauges: { trust: -10, damage: 10 }
        items:
