          - { id: a04-b-content, points: 5, axis: content, refs: [jpcert-handling] }
      - id: a04-a-erase
        text: { ja: '自分が疑われないように、履歴を消す', en: '' }
        explain: { ja: '疑われたくない気持ちは分かる。だが履歴を消すと、自分が何をしたかを説明できなくなり、立場は悪くなる。', en: '' }
