          - { id: l12-a-record, points: -8, axis: record, refs: [jpcert-handling] }
      - id: l12-c-request
        text: { ja: '不足する項目を特定し、追加の提供を文書で求める', en: '' }
        explain: { ja: '足りない項目を名指しして、追加を文書で求めている。範囲の確定を、推測で終わらせない姿勢だ。', en: '' }
        minutes: 120
        category: recover
        points: 100
        refs: [jpcert-handling, meti-csm-guideline]
        gauges: { trust: 10, stamina: -10 }
        items:
          - { id: l12-c-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: l12-c-order, points: 8, axis: order, refs: [meti-csm-guideline] }
    lesson: { ja: 'ログの項目が足りないときは、不足を名指しして追加を求める。ある分だけで終えると、範囲の説明が曖昧になる。推測で埋めると、通知の対象が変わり、後から訂正が必要になる。', en: '' }

