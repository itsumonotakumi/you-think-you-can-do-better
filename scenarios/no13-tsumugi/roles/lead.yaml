      - id: l11-a-fast
        text: { ja: '早く戻すために、監視を外して再開する', en: '' }
        explain: { ja: '監視を外せば動きは軽くなる。だが再発の兆候を見る手段を、自分から捨てることになる。', en: '' }
        minutes: 90
        category: hurt
        points: -130
        refs: [nist-sp800-61r3]
        gauges: { damage: 15, flame: 10 }
        items:
          - { id: l11-a-content, points: -10, axis: content, refs: [nist-sp800-61r3] }
          - { id: l11-a-record, points: -8, axis: record, refs: [jpcert-handling] }
      - id: l11-c-step
        text: { ja: '認証と権限の見直しが終わるまで、段階的に戻す', en: '' }
        explain: { ja: '戻す条件を先に決め、段階的に進めている。現場の不満は残るが、再発の芽を摘んでから動かせる。', en: '' }
        minutes: 210
        category: recover
        points: 130
        refs: [nist-sp800-61r3, ipa-sme-guideline]
        gauges: { damage: -10, trust: 10, stamina: -15 }
        setFlags: { verifiedResume: true }
        items:
          - { id: l11-c-content, points: 8, axis: content, refs: [nist-sp800-61r3] }
          - { id: l11-c-order, points: 8, axis: order, refs: [ipa-sme-guideline] }
    lesson: { ja: '復旧は、認証と権限の見直しを終えてから段階的に進める。監視を外して早く戻すと、再発を見逃す。戻す条件と、途中で止める判断の基準を先に決めておく。条件を決めることが復旧の設計だ。', en: '' }

  - id: p12-vendor-log
    at: { day: 2, minutes: 900 }
