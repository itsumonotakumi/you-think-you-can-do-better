        minutes: 45
        category: maintain
        points: 20
        refs: [npa-consult]
        gauges: { stamina: -5 }
        items:
          - { id: l09-b-content, points: 5, axis: content, refs: [npa-consult] }
          - { id: l09-b-order, points: 5, axis: order, refs: [npa-consult] }
      - id: l09-c-verify
        text: { ja: '反応せず、SaaSのログで削除の有無を確認する', en: '' }
        explain: { ja: '相手の言葉に反応せず、事実で確かめている。交渉に乗らないことが、そのまま記録の保全にもなる。', en: '' }
        minutes: 120
        category: recover
        points: 100
        refs: [npa-consult, jpcert-handling]
        gauges: { trust: 10, stamina: -10 }
        setFlags: { noNegotiation: true }
