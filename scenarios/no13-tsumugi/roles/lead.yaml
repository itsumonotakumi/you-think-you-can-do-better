        minutes: 210
        category: increase
        points: 250
        refs: [meti-disclosure-guidance, cissp-cbk-secops]
        gauges: { trust: 15, stamina: -15, flame: -5 }
        setFlags: { ppcFinalFiled: true, fullDisclosure: true }
        detail: incident-report
        items:
          - { id: l16-c-content, points: 8, axis: content, refs: [meti-disclosure-guidance] }
