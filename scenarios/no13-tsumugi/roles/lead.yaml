          - { id: l09-c-record, points: 8, axis: record, refs: [jpcert-handling] }
      - id: l09-a-believe
        text: { ja: '削除されたと信じて、公表を控えておく', en: '' }
        explain: { ja: '信じたい気持ちは理解できる。だが相手の言葉だけで公表を控えると、後から公開されたときの説明が立たない。', en: '' }
        minutes: 60
        category: hurt
        points: -120
        refs: [npa-consult, meti-disclosure-guidance]
        gauges: { flame: 5, trust: -10 }
        items:
          - { id: l09-a-content, points: -10, axis: content, refs: [meti-disclosure-guidance] }
          - { id: l09-a-time, points: -8, axis: time, refs: [meti-disclosure-guidance] }
    lesson: { ja: '攻撃者の「削除した」は、ログで確かめる。返信して交渉に乗ると、揺れていることを教えることになる。公開の判断は、相手の言葉ではなく、確認できた事実で行う。事実だけが根拠になる。', en: '' }

  - id: p10-forensics
    at: { day: 1, minutes: 900 }
    phase: investigate
    text: { ja: '午後3時。外部のフォレンジック調査は高価だ。社内でも、ある程度は調べられる。', en: '' }
    voices: [v10-a, v10-b, v10-ok]
