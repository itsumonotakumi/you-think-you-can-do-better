        explain: { ja: '外部の目を入れ、その結果を取引先に渡している。自社の調査だけでは得にくい信頼を、手間で買っている。', en: '' }
        minutes: 180
        category: increase
        points: 250
        refs: [nist-sp800-61r3, meti-csm-guideline]
        gauges: { trust: 15, stamina: -15, damage: -10 }
