          - { id: l10-c-content, points: 8, axis: content, refs: [nist-sp800-61r3] }
          - { id: l10-c-record, points: 8, axis: record, refs: [meti-csm-guideline] }
      - id: l10-b-inhouse
        text: { ja: '社内でできる範囲の調査だけで済ませる', en: '' }
        explain: { ja: '費用を抑えつつ調査は進む。ただ、侵入口の裏付けが弱く、再発防止の設計が推測になる。', en: '' }
        minutes: 120
        category: maintain
        points: 20
        refs: [jpcert-handling]
        gauges: { stamina: -15 }
        items:
          - { id: l10-b-record, points: 5, axis: record, refs: [jpcert-handling] }
          - { id: l10-b-content, points: 5, axis: content, refs: [jpcert-handling] }
      - id: l10-a-none
        text: { ja: '費用が高いので、外部の調査は入れない', en: '' }
        explain: { ja: '費用を理由に調査を絞ると、原因の説明ができない。委託元との交渉でも、根拠を欠くことになる。', en: '' }
        minutes: 45
        category: hurt
        points: -120
        refs: [nist-sp800-61r3]
        gauges: { trust: -15, damage: 10 }
        items:
          - { id: l10-a-content, points: -10, axis: content, refs: [nist-sp800-61r3] }
          - { id: l10-a-record, points: -8, axis: record, refs: [jpcert-handling] }
    lesson: { ja: '侵入口と範囲の説明には、外部の調査が効く。費用はかかるが、結果を取引先と共有すれば、契約を続ける判断の材料になる。社内調査だけで済ませると、対策が推測になり、説明も弱くなる。', en: '' }

  - id: p11-restore
    at: { day: 2, minutes: 600 }
    phase: recover
    text: { ja: '3日目午前10時。分析基盤を平常に戻す段階。現場は「もう使いたい」と言い、監視の担当者は慎重だ。', en: '' }
    voices: [v11-a, v11-b, v11-ok]
    choices:
      - id: l11-b-swap
        text: { ja: '端末を入れ替えて、先に通常の運用に戻す', en: '' }
