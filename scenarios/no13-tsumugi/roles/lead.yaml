      - id: l12-a-guess
        text: { ja: '推測で範囲を決めて、調査を終えてしまう', en: '' }
        explain: { ja: '推測で埋めれば話は早い。だが推測が外れれば、通知の対象が変わり、訂正が必要になる。', en: '' }
        minutes: 45
        category: hurt
        points: -110
        refs: [ppc-report-scope]
        gauges: { flame: 5, trust: -10 }
        items:
