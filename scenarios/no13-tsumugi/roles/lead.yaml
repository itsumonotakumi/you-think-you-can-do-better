      - id: l16-b-summary
        text: { ja: '要点だけを、報告書にまとめて済ませる', en: '' }
        explain: { ja: '要点だけなら読みやすい。ただ、判断の誤りが抜けると、再発防止の優先順位が決まらない。', en: '' }
        minutes: 90
        category: maintain
        points: 20
        refs: [meti-disclosure-guidance]
        gauges: { stamina: -10 }
        items:
          - { id: l16-b-content, points: 5, axis: content, refs: [meti-disclosure-guidance] }
          - { id: l16-b-record, points: 5, axis: record, refs: [jpcert-handling] }
      - id: l16-a-hide
        text: { ja: '攻撃者に手の内を与えないとして、伏せる', en: '' }
        explain: { ja: '攻撃に使える情報を伏せる配慮は要る。だが原因まで伏せると、同じ手口の被害を止められない。', en: '' }
        minutes: 45
        category: hurt
        points: -120
        refs: [meti-disclosure-guidance]
        gauges: { flame: 10, trust: -15 }
        coward: true
        items:
          - { id: l16-a-content, points: -10, axis: content, refs: [meti-disclosure-guidance] }
          - { id: l16-a-wording, points: -8, axis: wording, refs: [meti-disclosure-guidance] }
    lesson: { ja: '報告書には、侵入口、持ち出した範囲、判断の誤り、対策の期限を書く。攻撃に使える詳細だけを伏せる。原因まで伏せると、同じ手口の被害を他の会社で止められない。書くことが次の備えになる。', en: '' }

drafts:
  incident-report:
    title: { ja: '調査報告書の技術部分', en: '' }
    slots:
      - id: timing
        label: { ja: '公表の時期', en: '' }
        auto: true
        items:
          - { id: ir-t-24h, when: { withinHours: 24 }, points: 10, axis: time, refs: [meti-disclosure-guidance] }
          - { id: ir-t-72h, when: { withinHours: 72 }, points: 5, axis: time, refs: [meti-disclosure-guidance] }
          - { id: ir-t-late, when: { otherwise: true }, points: -15, axis: time, refs: [meti-disclosure-guidance] }
      - id: scope
        label: { ja: '範囲の書き方', en: '' }
        options:
          - { id: ir-s-list, text: { ja: '持ち出されたデータセットの一覧と件数', en: '' }, points: 10, axis: content, refs: [ppc-report-scope], explain: { ja: 'データセットごとの件数があれば、委託元は誰に通知するかを決められる。説明の根拠にもなる。', en: '' } }
          - { id: ir-s-count, text: { ja: '影響のあった会員数の概算だけ', en: '' }, points: -10, axis: content, refs: [ppc-report-scope], explain: { ja: '概算だけでは、どの取引先の誰が対象か分からない。委託元の通知の設計ができない。', en: '' } }
          - { id: ir-s-client, text: { ja: '対象の取引先の名前だけを書く', en: '' }, points: -5, axis: content, refs: [ppc-report-scope], explain: { ja: '取引先の名前だけでは、会員が自分事として判断できない。通知の文面も作れない。', en: '' } }
      - id: cause
        label: { ja: '原因の書き方', en: '' }
        options:
          - { id: ir-c-vague, text: { ja: '外部からの攻撃とだけ書いて終える', en: '' }, points: -10, axis: content, refs: [nist-sp800-61r3], explain: { ja: '外部からの攻撃とだけ書くと、どこを直すのか分からない。対策が精神論になり、検証もできない。', en: '' } }
          - { id: ir-c-auth, text: { ja: '窃取された認証情報と未設定の多要素認証', en: '' }, points: 10, axis: content, refs: [nist-sp800-61r3], explain: { ja: '侵入口と設定の不足を具体的に書いている。同じ穴を持つ他の基盤の点検にもつながる。', en: '' } }
          - { id: ir-c-saas, text: { ja: 'SaaS事業者の脆弱性だとして書く', en: '' }, points: -10, axis: wording, refs: [meti-csm-guideline], explain: { ja: '他社の脆弱性に寄せると、自社の認証の設定が抜ける。委託元は説明の不足を不誠実と受け取る。', en: '' } }
      - id: detection
        label: { ja: '検知の書き方', en: '' }
        options:
          - { id: ir-d-time, text: { ja: '気づいた時刻だけを書いておく', en: '' }, points: -5, axis: record, refs: [jpcert-handling], explain: { ja: '気づいた時刻だけでは、その後の判断が適切だったかを検証できない。再発防止の材料にならない。', en: '' } }
          - { id: ir-d-start, text: { ja: '調査を始めた日だけを書いておく', en: '' }, points: -5, axis: record, refs: [jpcert-handling], explain: { ja: '調査の開始日だけでは、遮断や連絡がいつ行われたか分からない。時系列の説明が飛ぶ。', en: '' } }
          - { id: ir-d-line, text: { ja: '最初の警告から公表までの時刻を書く', en: '' }, points: 10, axis: record, refs: [jpcert-handling], explain: { ja: '警告から公表までの時刻を並べると、判断の速さと遅れが検証できる。再発防止の焦点も定まる。', en: '' } }
      - id: measure
        label: { ja: '対策の書き方', en: '' }
        options:
          - { id: ir-m-plan, text: { ja: '対策の期限と担当を書く', en: '' }, points: 10, axis: content, refs: [cissp-cbk-secops], explain: { ja: '期限と担当があれば、対策が実行されたか検証できる。毎月の進捗公開にも使える。', en: '' } }
          - { id: ir-m-slogan, text: { ja: '再発防止に努めますとだけ書く', en: '' }, points: -10, axis: content, refs: [cissp-cbk-secops], explain: { ja: '努めますだけでは、何をいつ誰がやるのか分からない。実行の確認もできない。', en: '' } }
          - { id: ir-m-tool, text: { ja: '新しい製品を導入したとだけ書く', en: '' }, points: -5, axis: content, refs: [cissp-cbk-secops], explain: { ja: '製品の導入は手段でしかない。何を守るためにどう使うかが書かれないと、効果を確かめられない。', en: '' } }
      - id: thirdparty
        label: { ja: '検証の書き方', en: '' }
        options:
          - { id: ir-t-summary, text: { ja: '要約だけを載せて終わらせる', en: '' }, points: -8, axis: record, refs: [cissp-cbk-secops], explain: { ja: '要約だけでは、都合の悪い指摘が抜けていないか分からない。検証の独立性が伝わらない。', en: '' } }
          - { id: ir-t-full, text: { ja: '第三者検証の結果を全文載せる', en: '' }, points: 8, axis: record, refs: [cissp-cbk-secops], explain: { ja: '第三者検証を全文載せると、調査の独立性が伝わる。都合の悪い指摘も隠せない。', en: '' } }
          - { id: ir-t-none, text: { ja: '検証の結果には触れない', en: '' }, points: -10, axis: record, refs: [cissp-cbk-secops], explain: { ja: '検証に触れないと、報告書の信頼性を自分で下げることになる。読み手は根拠を確かめられない。', en: '' } }
      - id: share
        label: { ja: '共有先', en: '' }
        options:
          - { id: ir-g-own, text: { ja: '社内だけに共有しておく', en: '' }, points: -5, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '社内だけにとどめると、同じ手口のリスクが業界に残る。委託元の備えも上がらない。', en: '' } }
          - { id: ir-g-press, text: { ja: '報道には出さないでおく', en: '' }, points: -5, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '報道に出さない判断は、被害者の混乱を避けるように見える。だが説明の機会を自分で捨てている。', en: '' } }
          - { id: ir-g-share, text: { ja: '委託元と同業に教訓を共有する', en: '' }, points: 10, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '教訓を共有すると、同じ手口の被害を他の会社で防げる。委託元の備えも上がる。', en: '' } }
      - id: approval
        label: { ja: '公開前の確認', en: '' }
        options:
          - { id: ir-a-multi, text: { ja: '法務と広報の確認を経て公開する', en: '' }, points: 10, axis: order, refs: [meti-csm-guideline], explain: { ja: '法務と広報を通すことで、事実誤認と表現の偏りを減らせる。委託元との文面のずれも防げる。', en: '' } }
          - { id: ir-a-tech, text: { ja: '技術部門だけで公開してしまう', en: '' }, points: -10, axis: order, refs: [meti-csm-guideline], explain: { ja: '技術だけで書くと、法務の観点と広報の配慮が抜ける。訂正が増えるほど信頼を失う。', en: '' } }
          - { id: ir-a-ceo, text: { ja: '社長の判断だけで公開してしまう', en: '' }, points: -5, axis: order, refs: [meti-csm-guideline], explain: { ja: '経営の判断は速いが、技術の事実確認が抜けやすい。現場の言葉と食い違う報告になる。', en: '' } }
