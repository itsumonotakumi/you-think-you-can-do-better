      - id: l14-c-drill
        text: { ja: '実際の手口の訓練と、保存パスワードの禁止を続ける', en: '' }
        explain: { ja: '実際の手口を使い、保存パスワードの禁止まで踏み込んでいる。行動を変える設計として強い。', en: '' }
        minutes: 180
        category: recover
        points: 110
        refs: [ipa-sme-guideline, nist-sp800-61r3]
        gauges: { trust: 10, stamina: -15, damage: -5 }
