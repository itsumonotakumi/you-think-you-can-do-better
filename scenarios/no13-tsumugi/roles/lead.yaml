          - { id: l13-c-record, points: 8, axis: record, refs: [meti-csm-guideline] }
      - id: l13-b-inhouse
        text: { ja: '社内の検証だけで、結果をまとめておく', en: '' }
        explain: { ja: '社内で確かめる範囲は広げられる。ただ、委託元が知りたいのは、外から見て大丈夫かという点だ。', en: '' }
        minutes: 120
        category: maintain
        points: 20
        refs: [meti-csm-guideline]
        gauges: { stamina: -10 }
