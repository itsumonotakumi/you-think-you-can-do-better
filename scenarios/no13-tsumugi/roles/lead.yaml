        minutes: 120
        category: maintain
        points: 25
        refs: [nist-sp800-61r3]
        gauges: { stamina: -10 }
        items:
          - { id: l15-b-content, points: 5, axis: content, refs: [nist-sp800-61r3] }
          - { id: l15-b-order, points: 5, axis: order, refs: [ipa-sme-guideline] }
      - id: l15-a-same
        text: { ja: '従来の方式のまま、そのまま業務を続ける', en: '' }
        explain: { ja: '慣れた方式を続ける判断は、現場の負担を考えれば理解できる。だが同じ構造のリスクを抱えたままになる。', en: '' }
        minutes: 45
        category: hurt
        points: -80
        refs: [nist-sp800-61r3]
        gauges: { damage: 10, trust: -5 }
        items:
          - { id: l15-a-content, points: -8, axis: content, refs: [nist-sp800-61r3] }
          - { id: l15-a-care, points: -8, axis: care, refs: [ppc-notify-person] }
      - id: l15-c-redesign
        text: { ja: '預からない分析方式と最小権限の設計に作り替える', en: '' }
        explain: { ja: 'データを預からない方式に変え、権限も最小にする。事故の影響そのものを小さくする設計だ。', en: '' }
        minutes: 300
        category: increase
        points: 300
        refs: [nist-sp800-61r3, meti-csm-guideline]
        gauges: { trust: 20, stamina: -20, damage: -10 }
        setFlags: { redesign: true }
        items:
          - { id: l15-c-content, points: 8, axis: content, refs: [nist-sp800-61r3] }
