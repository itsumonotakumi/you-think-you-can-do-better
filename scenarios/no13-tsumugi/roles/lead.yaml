        text: { ja: '個人の責任として、強く注意しておくだけにする', en: '' }
        explain: { ja: '注意を強めれば一時的には減る。だが報告が上がりにくくなり、次の被害の発見が遅れる。', en: '' }
        minutes: 45
        category: hurt
        points: -90
        refs: [ipa-sme-guideline]
