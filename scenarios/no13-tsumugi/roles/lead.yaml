    lesson: { ja: '教育は、注意喚起のメールで終わらせない。実際の手口を使った訓練と、ブラウザへの保存パスワードの禁止をセットにする。個人を責める形にすると、報告が上がらなくなる。', en: '' }

  - id: p15-architecture
    at: { day: 14, minutes: 600 }
    phase: after
    text: { ja: '15日目午前10時。同じ事故を繰り返さないための設計を、技術の側から出す段階になった。', en: '' }
    voices: [v15-a, v15-b, v15-ok]
