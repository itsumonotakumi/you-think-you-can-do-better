# No.13 ツムギ・アナリティクス / 部門長ロール（技術部門長・情報セキュリティ責任者）
# 判断ポイント16、細目は choices[].items と drafts の合計で80以上。
estimateMinutes: 33
intro: { ja: 'あなたはツムギ・アナリティクスの技術部門長。分析基盤の設定も、端末の管理も、認証の設計も、全部あなたの責任範囲にある。取引先のデータを預かる仕組みを作ったのは、あなた自身だ。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-lead-prelim
    ref: ppc-report-prelim
    label: { ja: '委託元の速報を支える資料の提出', en: '' }
    points: -150
    doneFlag: ppcPrelimFiled
  - id: dl-lead-final
    ref: ppc-report-final-malicious
    label: { ja: '委託元と自社の確報に使う調査結果の提出', en: '' }
    points: -80
    doneFlag: ppcFinalFiled
events:
  - id: ev-malware
    at: { day: 0, minutes: 810 }
    voices: [v-ev-malware]
    gauges: { flame: 5 }
    sound: { se: [mail_arrive] }
    caption: { ja: '隔離した端末から、ブラウザに保存された認証情報を抜く種類のマルウェアが見つかった。', en: '' }
  - id: ev-news
    at: { day: 1, minutes: 1020 }
    voices: [v-ev-news]
    gauges: { flame: 10 }
points:
  - id: p01-alert
    at: { day: 0, minutes: 570 }
    phase: detect
    text: { ja: '午前9時30分。管理画面に、見慣れない場所からログインしたセッションが三つ残っている。まだ誰も気づいていない。', en: '' }
    voices: [v01-a, v01-b, v01-ok]
    choices:
      - id: l01-c-revoke
        text: { ja: '全セッションを失効し、APIキーとパスワードを作り直す', en: '' }
        explain: { ja: '生きているセッションを全部切るのが先だ。鍵の作り直しまで同時に行えば、奪われた認証情報を無効にできる。', en: '' }
        minutes: 75
        category: recover
        points: 130
        refs: [nist-sp800-61r3, jpcert-handling]
        gauges: { damage: -15, trust: 5, stamina: -10 }
        setFlags: { contained: true }
        items:
          - { id: l01-c-content, points: 8, axis: content, refs: [nist-sp800-61r3] }
          - { id: l01-c-order, points: 8, axis: order, refs: [jpcert-handling] }
      - id: l01-b-one
        text: { ja: '不審なセッションだけを切って様子を見ておく', en: '' }
        explain: { ja: '目に見える分だけを切る判断は自然だ。だが攻撃者は別のセッションを既に持っていることが多い。', en: '' }
        minutes: 45
        category: maintain
        points: 25
        refs: [nist-sp800-61r3]
        gauges: { stamina: -5 }
        items:
          - { id: l01-b-content, points: 5, axis: content, refs: [nist-sp800-61r3] }
          - { id: l01-b-record, points: 5, axis: record, refs: [jpcert-handling] }
      - id: l01-a-leave
        text: { ja: '業務が止まるので、記録だけ残して放置しておく', en: '' }
        explain: { ja: '業務を守る判断に見えるが、セッションを残すことは攻撃者に時間を渡すことだ。持ち出しは続く。', en: '' }
        minutes: 45
        category: hurt
        points: -140
        refs: [nist-sp800-61r3]
        gauges: { damage: 15, flame: 5 }
        items:
          - { id: l01-a-content, points: -10, axis: content, refs: [nist-sp800-61r3] }
          - { id: l01-a-time, points: -10, axis: time, refs: [nist-sp800-61r3] }
    lesson: { ja: '不審なログインを見つけたら、まず全セッションを失効させる。目に見える分だけを切ると、別のセッションから持ち出しが続く。APIキーとパスワードも同時に作り直し、奪われた認証情報を無効にする。', en: '' }

  - id: p02-logs
    at: { day: 0, minutes: 600 }
    phase: contain
    text: { ja: '午前10時。調査のためにログを残すか、早く復旧してログを消すか。サーバーは容量が足りない。', en: '' }
    voices: [v02-a, v02-b, v02-ok]
    choices:
      - id: l02-b-local
        text: { ja: '社内の端末のログだけを、先にきちんと保全する', en: '' }
        explain: { ja: '端末側の記録は押さえられる。だが今回の持ち出しは基盤側で起きており、そこが抜ける。', en: '' }
        minutes: 60
        category: maintain
        points: 20
        refs: [jpcert-handling]
        gauges: { stamina: -5 }
        items:
          - { id: l02-b-record, points: 5, axis: record, refs: [jpcert-handling] }
          - { id: l02-b-content, points: 5, axis: content, refs: [jpcert-handling] }
      - id: l02-c-keep
        text: { ja: '遮断しつつ、SaaS事業者にログの保全と提供を依頼する', en: '' }
        explain: { ja: '遮断と証拠の保全を両立させている。基盤側の記録が残れば、持ち出しの範囲を後から確定できる。', en: '' }
        minutes: 120
        category: recover
        points: 130
        refs: [nist-sp800-61r3, jpcert-handling]
        gauges: { damage: -10, trust: 10, stamina: -15 }
        setFlags: { logRequested: true }
        items:
          - { id: l02-c-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: l02-c-order, points: 8, axis: order, refs: [nist-sp800-61r3] }
      - id: l02-a-delete
        text: { ja: '早く復旧するために、古いログを消してしまう', en: '' }
        explain: { ja: '容量を空ければ復旧は早い。だが何が持ち出されたかを示す記録は、二度と戻らない。取り返しがつかない。', en: '' }
        minutes: 90
        category: fatal
        points: -250
        refs: [nist-sp800-61r3]
        gauges: { damage: 20, flame: 15, trust: -10 }
        setFlags: { logsLost: true }
        items:
          - { id: l02-a-record, points: -10, axis: record, refs: [jpcert-handling] }
          - { id: l02-a-content, points: -10, axis: content, refs: [nist-sp800-61r3] }
    lesson: { ja: '遮断と証拠の保全は、両立できる。先に侵害を止め、基盤と端末の両方のログを残す。復旧を急いでログを消すと、持ち出された範囲を説明できず、報告も再発防止も成り立たない。', en: '' }

  - id: p03-origin
    at: { day: 0, minutes: 660 }
    phase: contain
    text: { ja: '午前11時。侵入口は社員の端末だった。ブラウザに保存した認証情報を抜く種類のマルウェアが動いている。', en: '' }
    voices: [v03-a, v03-b, v03-ok]
    notable:
      - { id: note-mfa, text: { ja: '情報窃取型のマルウェアが、ブラウザに保存された認証情報を抜いていた。', en: '' } }
    choices:
      - id: l03-b-wipe
        text: { ja: '端末を初期化して、すぐに通常業務へ戻す', en: '' }
        explain: { ja: '業務に戻す速さは評価できる。ただ、初期化すると侵入の痕跡も消え、同じ手口の全容が分からない。', en: '' }
        minutes: 90
        category: hurt
        points: -110
        refs: [nist-sp800-61r3]
        gauges: { damage: 10, trust: -5 }
        items:
          - { id: l03-b-record, points: -10, axis: record, refs: [nist-sp800-61r3] }
          - { id: l03-b-content, points: -8, axis: content, refs: [nist-sp800-61r3] }
      - id: l03-a-remove
        text: { ja: 'マルウェアを削除して、そのまま様子を見る', en: '' }
        explain: { ja: '検知したものを消すだけでは、同じ端末の別の場所に残った仕掛けを見落とす。認証情報は既に盗まれている。', en: '' }
        minutes: 60
        category: hurt
        points: -120
        refs: [nist-sp800-61r3]
        gauges: { damage: 10, flame: 5 }
        items:
          - { id: l03-a-content, points: -10, axis: content, refs: [nist-sp800-61r3] }
          - { id: l03-a-record, points: -8, axis: record, refs: [jpcert-handling] }
      - id: l03-c-isolate
        text: { ja: '端末を隔離し、全サービスの認証情報を失効させる', en: '' }
        explain: { ja: '端末を残して調べ、同時に認証情報を無効にしている。痕跡の保全と、被害の拡大防止を両立させた判断だ。', en: '' }
        minutes: 150
        category: increase
        points: 300
        refs: [nist-sp800-61r3, ipa-sme-guideline]
        gauges: { damage: -15, trust: 15, stamina: -15 }
        setFlags: { pcIsolated: true }
        items:
          - { id: l03-c-content, points: 8, axis: content, refs: [nist-sp800-61r3] }
          - { id: l03-c-record, points: 8, axis: record, refs: [ipa-sme-guideline] }
    lesson: { ja: '侵入口の端末は、消さずに隔離する。端末に残る痕跡は、同じ手口の全容を明らかにする。同時に、その端末で使っていた全サービスの認証情報を失効させる。盗まれた鍵は、端末を消しても戻らない。', en: '' }

  - id: p04-mfa
    at: { day: 0, minutes: 690 }
    phase: contain
    text: { ja: '午前11時30分。基盤の多要素認証は未設定だった。全社に広げると、現場の手間は確実に増える。', en: '' }
    voices: [v04-a, v04-b, v04-ok]
    choices:
      - id: l04-c-all
        text: { ja: '全社とSaaSの全アカウントに、例外なく導入する', en: '' }
        explain: { ja: '例外を作らずに全部へ入れるのが、最も確実だ。設定の抜けが、次の侵入口になることを知っている判断だ。', en: '' }
        minutes: 180
        category: increase
        points: 300
        refs: [nist-sp800-61r3, meti-csm-guideline]
        gauges: { trust: 15, stamina: -20, damage: -10 }
        setFlags: { mfaRollout: true }
        items:
          - { id: l04-c-content, points: 8, axis: content, refs: [nist-sp800-61r3] }
          - { id: l04-c-record, points: 8, axis: record, refs: [meti-csm-guideline] }
      - id: l04-b-admin
        text: { ja: '管理者アカウントだけに、先に導入しておく', en: '' }
        explain: { ja: '管理者から守る順番は妥当だ。ただし今回の侵入口は一般の分析アカウントで、そこが残る。', en: '' }
        minutes: 90
        category: maintain
        points: 25
        refs: [nist-sp800-61r3]
        gauges: { trust: 5, stamina: -10 }
        items:
          - { id: l04-b-content, points: 5, axis: content, refs: [nist-sp800-61r3] }
          - { id: l04-b-order, points: 5, axis: order, refs: [nist-sp800-61r3] }
      - id: l04-a-later
        text: { ja: '現場の負担を考えて、導入を半年は延期する', en: '' }
        explain: { ja: '負担への配慮は分かる。だが今回の被害は、その負担を避けた結果だ。半年の間も同じ穴が開いている。', en: '' }
        minutes: 45
        category: hurt
        points: -120
        refs: [nist-sp800-61r3]
        gauges: { flame: 5, trust: -10 }
        coward: true
        items:
          - { id: l04-a-content, points: -10, axis: content, refs: [nist-sp800-61r3] }
          - { id: l04-a-time, points: -8, axis: time, refs: [nist-sp800-61r3] }
    lesson: { ja: '多要素認証は、管理者だけでなく全アカウントに入れる。今回の侵入口は一般の分析アカウントだった。例外を作ると、そこが次の穴になる。負担は、設定の自動化と手順の整備で減らす。', en: '' }

  - id: p05-scope
    at: { day: 0, minutes: 900 }
    phase: investigate
    text: { ja: '午後3時。持ち出された範囲を確定しなければならない。アクセス履歴は数千行あり、目で追うには限界がある。', en: '' }
    voices: [v05-a, v05-b, v05-ok]
    notable:
      - { id: note-scope, text: { ja: '監査ログとDLPの記録を突き合わせ、持ち出されたデータセットを特定した。', en: '' } }
    choices:
      - id: l05-b-eyes
        text: { ja: 'アクセス履歴を一覧にして、目視で確認する', en: '' }
        explain: { ja: '一覧にすれば傾向は見える。だが数千行の目視では、取りこぼしが起きる。報告の件数がぶれる。', en: '' }
        minutes: 120
        category: maintain
        points: 20
        refs: [jpcert-handling]
        gauges: { stamina: -15 }
        items:
          - { id: l05-b-record, points: 5, axis: record, refs: [jpcert-handling] }
          - { id: l05-b-content, points: 5, axis: content, refs: [jpcert-handling] }
      - id: l05-c-match
        text: { ja: '監査ログとDLPの記録を突き合わせて特定する', en: '' }
        explain: { ja: '二つの記録を突き合わせることで、持ち出しの操作と対象を対応づけている。件数の根拠になる。', en: '' }
        minutes: 210
        category: increase
        points: 300
        refs: [nist-sp800-61r3, jpcert-handling]
        gauges: { damage: -10, trust: 15, stamina: -20 }
        setFlags: { scopeFixed: true }
        items:
          - { id: l05-c-content, points: 8, axis: content, refs: [nist-sp800-61r3] }
          - { id: l05-c-record, points: 8, axis: record, refs: [jpcert-handling] }
      - id: l05-a-attacker
        text: { ja: '攻撃者が申告した件数を、そのまま使う', en: '' }
        explain: { ja: '相手の言葉をそのまま使えば早い。だが攻撃者は件数を膨らませて脅す。報告の数字が後で崩れる。', en: '' }
        minutes: 45
        category: hurt
        points: -130
        refs: [meti-disclosure-guidance]
        gauges: { flame: 10, trust: -15 }
        items:
          - { id: l05-a-content, points: -10, axis: content, refs: [meti-disclosure-guidance] }
          - { id: l05-a-record, points: -10, axis: record, refs: [jpcert-handling] }
    lesson: { ja: '持ち出しの範囲は、基盤の監査ログと自社のDLPの記録を突き合わせて決める。攻撃者の申告は参考にしない。件数の根拠を説明できることが、委託元の報告と本人通知の前提になる。', en: '' }

  - id: p06-vendor
    at: { day: 0, minutes: 1020 }
    phase: organize
    text: { ja: '午後5時。SaaS事業者は「認証は正常だった」と言う。委託元は、報告に使う材料を待っている。', en: '' }
    voices: [v06-a, v06-b, v06-ok]
    choices:
      - id: l06-b-wait
        text: { ja: 'SaaS事業者の見解を、しばらく待ってみる', en: '' }
        explain: { ja: '相手の説明を待つ姿勢は公平だ。だが委託元の報告には期限があり、待っている余裕はない。', en: '' }
        minutes: 60
        category: maintain
        points: 20
        refs: [meti-csm-guideline]
        gauges: { stamina: -5 }
        items:
          - { id: l06-b-order, points: 5, axis: order, refs: [meti-csm-guideline] }
          - { id: l06-b-content, points: 5, axis: content, refs: [jpcert-handling] }
      - id: l06-a-blame
        text: { ja: 'SaaS事業者の脆弱性が原因だと断定する', en: '' }
        explain: { ja: '断定すれば自社の責任は軽く見える。だが認証の設定は自社の担当で、責任分界を取り違えている。', en: '' }
        minutes: 60
        category: hurt
        points: -120
        refs: [meti-csm-guideline]
        gauges: { flame: 15, trust: -10 }
        items:
          - { id: l06-a-wording, points: -10, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: l06-a-content, points: -8, axis: content, refs: [meti-csm-guideline] }
      - id: l06-c-material
        text: { ja: '設定の責任を分け、委託元の報告に必要なログを渡す', en: '' }
        explain: { ja: '責任分界を整理しつつ、相手が必要とする材料を先に渡している。報告の期限を守る実務の判断だ。', en: '' }
        minutes: 150
        category: recover
        points: 120
        refs: [meti-csm-guideline, ppc-report-prelim]
        gauges: { trust: 15, stamina: -15 }
        setFlags: { ppcPrelimFiled: true, reportShared: true }
        items:
          - { id: l06-c-content, points: 8, axis: content, refs: [meti-csm-guideline] }
          - { id: l06-c-record, points: 8, axis: record, refs: [ppc-report-prelim] }
    lesson: { ja: '原因の断定を急がず、責任分界を整理して材料を先に渡す。委託元の報告には期限がある。認証の設定は自社、基盤の運用はSaaS事業者というように、事実で分けて書く。材料が期限を守る。', en: '' }

  - id: p07-dlp
    at: { day: 0, minutes: 1140 }
    phase: contain
    text: { ja: '午後7時。再発防止として、データの持ち出しを制限したい。ただ、分析業務は大量のデータを扱う。', en: '' }
    voices: [v07-a, v07-b, v07-ok]
    choices:
      - id: l07-c-limit
        text: { ja: '一括ダウンロードを禁じ、外部送信を制限する', en: '' }
        explain: { ja: '持ち出しの手口に直接効く制限を、即時に入れている。分析業務への影響は、承認の経路で吸収できる。', en: '' }
        minutes: 150
        category: increase
        points: 250
        refs: [nist-sp800-61r3, ipa-sme-guideline]
        gauges: { damage: -10, trust: 10, stamina: -15 }
        setFlags: { dlpOn: true }
        items:
          - { id: l07-c-content, points: 8, axis: content, refs: [nist-sp800-61r3] }
          - { id: l07-c-order, points: 8, axis: order, refs: [ipa-sme-guideline] }
      - id: l07-b-alert
        text: { ja: '監視のアラートだけを、先に強化しておく', en: '' }
        explain: { ja: '検知を強くする判断は無駄ではない。ただ、持ち出しそのものは止まらず、見つけるのが後になる。', en: '' }
        minutes: 75
        category: maintain
        points: 25
        refs: [nist-sp800-61r3]
        gauges: { stamina: -10 }
        items:
          - { id: l07-b-content, points: 5, axis: content, refs: [nist-sp800-61r3] }
          - { id: l07-b-record, points: 5, axis: record, refs: [jpcert-handling] }
      - id: l07-a-none
        text: { ja: '分析業務が止まるので、制限は入れない', en: '' }
        explain: { ja: '業務を止めない判断は、短期的には正しい。だが同じ手口に対策なしで臨むことになる。', en: '' }
        minutes: 45
        category: hurt
        points: -110
        refs: [nist-sp800-61r3]
        gauges: { damage: 10, flame: 5 }
        coward: true
        items:
          - { id: l07-a-content, points: -10, axis: content, refs: [nist-sp800-61r3] }
          - { id: l07-a-record, points: -8, axis: record, refs: [nist-sp800-61r3] }
    lesson: { ja: '持ち出しの対策は、検知より制限を先に入れる。一括ダウンロードの禁止と外部送信の制限は、分析業務の承認経路を決めれば続けられる。アラートだけでは、持ち出しは止まらない。', en: '' }

  - id: p08-keys
    at: { day: 1, minutes: 540 }
    phase: contain
    text: { ja: '2日目午前9時。取引先とのデータ連携には、それぞれ専用の鍵を使っている。同じ端末から使われていた。', en: '' }
    voices: [v08-a, v08-b, v08-ok]
    choices:
      - id: l08-b-route
        text: { ja: '侵害された経路のキーだけを、先に変えておく', en: '' }
        explain: { ja: '影響のあった経路から直すのは合理的だ。ただ、同じ端末から他の鍵も使われていた可能性が残る。', en: '' }
        minutes: 90
        category: maintain
        points: 25
        refs: [nist-sp800-61r3]
        gauges: { stamina: -10 }
        items:
          - { id: l08-b-content, points: 5, axis: content, refs: [nist-sp800-61r3] }
          - { id: l08-b-order, points: 5, axis: order, refs: [jpcert-handling] }
      - id: l08-a-keep
        text: { ja: '連携が止まるので、鍵は変えないままにする', en: '' }
        explain: { ja: '連携を止めない判断は、取引先への配慮に見える。だが盗まれた鍵を使われれば、止めるより大きな損が出る。', en: '' }
        minutes: 45
        category: hurt
        points: -120
        refs: [nist-sp800-61r3]
        gauges: { damage: 15, trust: -10 }
        coward: true
        items:
          - { id: l08-a-content, points: -10, axis: content, refs: [nist-sp800-61r3] }
          - { id: l08-a-record, points: -8, axis: record, refs: [jpcert-handling] }
      - id: l08-c-rotate
        text: { ja: '全取引先の連携キーを失効し、新しい方式に切り替える', en: '' }
        explain: { ja: '影響の有無を問わず、全部の鍵を無効にしている。切り替えの手間より、使われ続ける危険を避けた判断だ。', en: '' }
        minutes: 180
        category: recover
        points: 130
        refs: [nist-sp800-61r3, meti-csm-guideline]
        gauges: { trust: 10, stamina: -20 }
        setFlags: { keysRotated: true }
        items:
          - { id: l08-c-content, points: 8, axis: content, refs: [nist-sp800-61r3] }
          - { id: l08-c-order, points: 8, axis: order, refs: [meti-csm-guideline] }
    lesson: { ja: '端末から使われていた鍵は、影響の有無を問わず全部作り直す。連携が一時的に止まるより、盗まれた鍵が使われ続ける方が損は大きい。取引先には、止まる時間と再開の見通しを伝える。', en: '' }

  - id: p09-attacker
