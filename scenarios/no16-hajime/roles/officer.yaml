          - { id: of-p-common, text: { ja: '本部の統一文を渡して説明する', en: '' }, points: 10, axis: wording, refs: [ppc-notify-person], explain: { ja: '全教室が同じ文で説明できる。教室ごとの言い方の差が生まれず、記録も残る。迷わない。', en: '' } }
