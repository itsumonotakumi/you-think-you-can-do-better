    text: { ja: '午前10時45分。本部の電話が鳴り続けている。教室の受付にも保護者が来ている。誰が、どの窓口で、何を答えるのかが決まっていない。', en: '' }
    voices: [v-of-02-a, v-of-02-b, v-of-02-c]
    choices:
      - id: p-of-02-a
        text: { ja: '専用の電話とメール窓口を置き、受付時間と担当を決める。', en: '' }
        explain: { ja: '窓口を一本化し、受付時間と担当まで決めている。教室が個別に抱えず、記録も一か所に集まる。', en: '' }
