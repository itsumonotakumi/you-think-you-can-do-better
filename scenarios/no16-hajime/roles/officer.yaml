          - { id: of02a-order, points: 8, axis: order, refs: [cissp-cbk-secops] }
          - { id: of02a-content, points: 5, axis: content, refs: [ppc-notify-person] }
      - id: p-of-02-b
        text: { ja: '教室の受付で受け付け、本部には内容だけ共有する。', en: '' }
        explain: { ja: '教室の負担が増え、答え方もばらつく。本部に集約しないと、件数も傾向も見えない。記録も散らばる。', en: '' }
        minutes: 30
        category: maintain
        points: 20
        refs: [ipa-sme-guideline]
        gauges: { flame: 5 }
        items:
          - { id: of02b-time, points: 2, axis: time, refs: [ipa-sme-guideline] }
          - { id: of02b-wording, points: 1, axis: wording, refs: [ipa-sme-guideline] }
          - { id: of02b-record, points: 1, axis: record, refs: [cissp-cbk-secops] }
      - id: p-of-02-c
        text: { ja: '問い合わせは本部の総務で受け、後で担当に回す。', en: '' }
        explain: { ja: '受け付ける場所は決まったが、答える担当と時間がない。たらい回しになると不信が増す。', en: '' }
        minutes: 30
        category: hurt
        points: -100
        refs: [ppc-notify-person]
        gauges: { flame: 10, trust: -5 }
        items:
          - { id: of02c-care, points: -8, axis: care, refs: [ppc-notify-person] }
          - { id: of02c-time, points: -6, axis: time, refs: [ipa-sme-guideline] }
          - { id: of02c-order, points: -5, axis: order, refs: [cissp-cbk-secops] }
