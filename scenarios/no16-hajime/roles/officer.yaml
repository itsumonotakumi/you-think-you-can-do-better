# No.16 こもれびカルチャー / 役員（運営本部長）ロール
# 入門編: 判断8、報告書1。教室・講師・保護者への説明と、配信の運用を扱う。
# 視点: 12教室を統括する本部長。現場の混乱を抑え、本部と教室の説明をそろえる。
estimateMinutes: 13
intro: { ja: 'あなたはこもれびカルチャーの運営本部長。12教室の責任者と講師、約90人を束ねている。金曜の午前10時15分、教室から「保護者から電話が来ている」と連絡が入り始めた。会員向けメールの宛先を間違えたらしい。教室ごとに対応がばらつき始めている。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-of-coward-2
  '3': v-of-coward-3
  '4': v-of-coward-4
events:
  - id: ev-of-phones
    at: { day: 0, minutes: 720 }
    voices: [v-of-ev-phones]
    gauges: { flame: 5 }
    sound: { se: [phone_ring] }
    caption: { ja: '教室と本部の電話が、同時に鳴り始めた。', en: '' }
  - id: ev-of-sns
    at: { day: 0, minutes: 930 }
    voices: [v-of-ev-sns]
    gauges: { flame: 5 }
    sound: { se: [notify_sns] }
    caption: { ja: '保護者の投稿が、地域のSNSで共有され始めた。', en: '' }
points:
  - id: p-of-01
    at: { day: 0, minutes: 615 }
    phase: detect
    sound: { se: [phone_ring] }
    text: { ja: '午前10時15分。12教室から「保護者から電話が来ている」と連絡が入り始めた。次の配信は来週の月曜に予定されている。教室ごとに、謝る人と様子を見る人が分かれている。', en: '' }
    voices: [v-of-01-a, v-of-01-b, v-of-01-c]
    notable:
      - { id: note-cause, text: { ja: '会員412人のアドレスを To に入れ、Bcc を空のまま送信した。配信ツールの宛先設定の誤り。', en: '' } }
    choices:
      - id: p-of-01-a
        text: { ja: '次の配信の予定を確認し、止めるかは各教室に任せる。', en: '' }
        explain: { ja: '現場の判断を尊重した形だが、教室ごとに方針が分かれる。止める判断は本部がそろえたい。', en: '' }
        minutes: 30
        category: maintain
        points: 20
        refs: [ipa-sme-guideline]
        gauges: { flame: 5 }
        coward: true
        items:
          - { id: of01a-time, points: 3, axis: time, refs: [ipa-sme-guideline] }
          - { id: of01a-order, points: 2, axis: order, refs: [ipa-sme-guideline] }
          - { id: of01a-care, points: -2, axis: care, refs: [jpcert-handling] }
      - id: p-of-01-b
        text: { ja: '教室からの問い合わせを待ち、必要な教室にだけ連絡する。', en: '' }
        explain: { ja: '問い合わせを待つと、何も言わない教室が取り残される。全教室に同じ情報を届けるべき場面。', en: '' }
        minutes: 30
        category: hurt
        points: -100
        refs: [ipa-sme-guideline, jpcert-handling]
        gauges: { flame: 10, trust: -5 }
        items:
          - { id: of01b-order, points: -8, axis: order, refs: [jpcert-handling] }
          - { id: of01b-care, points: -6, axis: care, refs: [ipa-sme-guideline] }
          - { id: of01b-time, points: -5, axis: time, refs: [ipa-sme-guideline] }
      - id: p-of-01-c
        text: { ja: '全教室に配信を止めさせ、事実と対応方針を伝える。', en: '' }
        explain: { ja: '全教室に同じ指示と情報を出している。混乱の大きい現場ほど、本部の一本化が効く。指示をそろえる。', en: '' }
        minutes: 45
        category: increase
        points: 300
        refs: [jpcert-handling, ipa-sme-guideline]
        gauges: { flame: -10, trust: 10, stamina: -10 }
        setFlags: { mailingStopped: true }
        detail: draft-of-field-note
        items:
          - { id: of01c-order, points: 8, axis: order, refs: [jpcert-handling] }
          - { id: of01c-content, points: 10, axis: content, refs: [ipa-sme-guideline] }
          - { id: of01c-time, points: 5, axis: time, refs: [jpcert-handling] }
    lesson: { ja: '誤送信のあとは、次の配信を止めるかどうかを本部が決める。教室ごとに任せると、止める教室と止めない教室が混ざる。全教室に同じ事実と方針を出し、現場が同じ説明をできるようにする。', en: '' }

