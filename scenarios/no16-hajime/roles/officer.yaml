          - { id: of-c-person, text: { ja: '担当者の携帯電話番号', en: '' }, points: -12, axis: care, refs: [ppc-notify-person], explain: { ja: '個人の電話に集中すると、対応が止まり担当者も疲弊する。組織の窓口を用意する。担当者を守る。', en: '' } }
