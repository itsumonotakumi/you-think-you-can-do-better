          - { id: of-u-month, text: { ja: '来月の教室だよりで報告', en: '' }, points: -4, axis: time, refs: [ipa-sme-guideline], explain: { ja: '月に1度では遅い。保護者対応の途中で、古い説明のままになる。更新はもっと早めに出す。', en: '' } }
          - { id: of-u-none, text: { ja: '次は特に連絡をしない', en: '' }, points: -6, axis: record, refs: [cissp-cbk-secops], explain: { ja: '次の連絡がないと、教室は古い情報のまま動く。更新する時刻を決めておく。次の連絡を決める。', en: '' } }
      - id: record
        label: { ja: '教室での記録', en: '' }
