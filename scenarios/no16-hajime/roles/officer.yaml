    choices:
      - id: p-of-x1-a
        text: { ja: '各教室の判断で、予定どおり配信を続ける。', en: '' }
        explain: { ja: '教室の判断に任せると、止める教室と続ける教室が混ざる。本部が方針をそろえたい。方針をそろえる。', en: '' }
