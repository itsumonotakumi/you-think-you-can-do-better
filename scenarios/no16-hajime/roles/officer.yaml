          - { id: of-i-secret, text: { ja: '口外しないよう強く求める', en: '' }, points: -10, axis: care, refs: [ppc-notify-person], explain: { ja: '口止めは現場を孤立させる。保護者と話す講師には、事実と説明の仕方を渡す。口止めはしない。', en: '' } }
