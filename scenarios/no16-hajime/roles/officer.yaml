          - { id: of-r-oral, text: { ja: '口頭で本部に伝えるだけ', en: '' }, points: -4, axis: record, refs: [ipa-sme-guideline], explain: { ja: '口頭だけでは内容が抜け、件数も数えられない。簡単な書式で記録を残す。件数を数えたい。', en: '' } }
          - { id: of-r-count, text: { ja: '教室ごとに件数と内容を記録', en: '' }, points: 10, axis: record, refs: [cissp-cbk-secops], explain: { ja: '教室ごとの記録が本部に集まれば、対応の偏りと二次被害の兆候が見える。件数を数える。', en: '' } }
      - id: instructors
        label: { ja: '講師への扱い', en: '' }
