      - id: p-of-x1-b
        text: { ja: '次の配信を止め、宛先の確認が済むまで再開しない。', en: '' }
        explain: { ja: '再発の可能性が残るうちは止める。確認が済むまで再開しない判断は安全。今から止める。', en: '' }
        minutes: 30
        category: recover
        points: 120
        refs: [jpcert-handling, ipa-sme-guideline]
        gauges: { flame: -5, trust: 10 }
        setFlags: { mailingStopped: true }
