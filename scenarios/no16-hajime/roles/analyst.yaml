          - { id: an-r-none, text: { ja: 'まだ何も連絡していない', en: '' }, points: -10, axis: order, refs: [cissp-cbk-secops], explain: { ja: '連絡がないまま時間が過ぎると、二次被害と不信が広がる。最初の対応を書く。対応を書く。', en: '' } }
          - { id: an-r-window, text: { ja: '削除依頼と窓口の設置', en: '' }, points: 10, axis: order, refs: [ppc-notify-person], explain: { ja: '削除依頼と相談窓口を一組で記録している。本人が困った時の連絡先まで残る。一組で書く。', en: '' } }
      - id: evidence
        label: { ja: '証拠', en: '' }
        options:
          - { id: an-e-log, text: { ja: '画面と操作履歴を保存した', en: '' }, points: 10, axis: record, refs: [jpcert-handling], explain: { ja: '画面と履歴の両方を残している。何をいつ押したかを、同じ材料で説明できる。材料になる。', en: '' } }
          - { id: an-e-memory, text: { ja: '自分の記憶をメモした', en: '' }, points: -8, axis: record, refs: [jpcert-handling], explain: { ja: '記憶は時間とともに変わる。画面と履歴を保存すれば、後から確かめられる。履歴を残す。', en: '' } }
          - { id: an-e-screen, text: { ja: '設定画面の写真を撮った', en: '' }, points: 5, axis: record, refs: [cissp-cbk-secops], explain: { ja: '画面の写真は役に立つ。操作履歴と合わせると、より正確に説明できる。履歴も保存する。', en: '' } }
      - id: impact
        label: { ja: '影響の見通し', en: '' }
        options:
          - { id: an-i-none, text: { ja: '悪用はないと断言する', en: '' }, points: -10, axis: content, refs: [ppc-report-scope], explain: { ja: '確認していないことを断言すると、後で事実が変わった時に訂正が必要になる。断言しない。', en: '' } }
          - { id: an-i-check, text: { ja: '現時点で悪用なし、調査中', en: '' }, points: 10, axis: content, refs: [no16-ppc-breach-qa], explain: { ja: '分かったことと調査中を分けて書いている。あとで続報を出しても、説明がぶれない。分けて書く。', en: '' } }
          - { id: an-i-unknown, text: { ja: '影響は不明とだけ書く', en: '' }, points: -4, axis: content, refs: [jpcert-handling], explain: { ja: '不明とだけでは、今できる確認をしたのか分からない。確認した範囲を書く。範囲を書く。', en: '' } }
      - id: next
        label: { ja: '次の確認', en: '' }
        options:
          - { id: an-n-week, text: { ja: '来週に一度だけ確認する', en: '' }, points: 4, axis: time, refs: [nist-sp800-61r3], explain: { ja: '一度の確認はよいが、その後の変化は見えない。定期的な点検にしたい。続けて確認する。', en: '' } }
          - { id: an-n-none, text: { ja: '次の確認は特に決めない', en: '' }, points: -8, axis: record, refs: [cissp-cbk-secops], explain: { ja: '次の確認がないと、対策が動いたかを確かめられない。日付と担当を決める。予定を書く。', en: '' } }
          - { id: an-n-month, text: { ja: '1か月後に設定を点検する', en: '' }, points: 8, axis: time, refs: [cissp-cbk-secops], explain: { ja: '点検の予定を記録している。設定は変わっていくので、定期的な確認が必要になる。点検する。', en: '' } }
