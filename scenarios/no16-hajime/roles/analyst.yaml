# No.16 こもれびカルチャー / セキュリティ担当者（本部事務局の会員担当）ロール
# 入門編: 判断8、報告書1。送信した本人の初動、報告、削除依頼、記録を扱う。
# 視点: 会員名簿と配信を担当する事務局スタッフ。失敗した本人として、何を先に動くか。
estimateMinutes: 12
intro: { ja: 'あなたはこもれびカルチャー本部事務局の会員担当。会員向けのお知らせメールを送るのが今日の仕事だった。送信ボタンを押して18分後、画面を見て気づく。宛先は Bcc ではなく、To に412件のアドレスが並んでいた。もう戻せない。まず何をするか。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-an-coward-2
  '3': v-an-coward-3
  '4': v-an-coward-4
events:
  - id: ev-an-reply
    at: { day: 0, minutes: 660 }
    voices: [v-an-ev-reply]
    gauges: { flame: 5 }
    sound: { se: [mail_arrive] }
    caption: { ja: '返信が3件届いた。どれも「私のアドレスが見えています」という内容だった。', en: '' }
  - id: ev-an-phone
    at: { day: 0, minutes: 840 }
    voices: [v-an-ev-phone]
    gauges: { flame: 5 }
    sound: { se: [phone_ring] }
    caption: { ja: '教室から「保護者が直接、本部に電話をかけてきた」と連絡が入った。', en: '' }
points:
  - id: p-an-01
    at: { day: 0, minutes: 600 }
    phase: detect
    sound: { se: [notify_chat] }
    text: { ja: '午前10時。送信済みの画面を見て、宛先が To に並んでいることに気づいた。送信は9時42分。取り消しのボタンを探す手が震えている。', en: '' }
    voices: [v-an-01-sns, v-an-01-boss, v-an-01-ok]
    notable:
      - { id: note-cause, text: { ja: '会員412人のアドレスを To に入れ、Bcc を空のまま送信した。宛先欄に手で貼り付けたのが原因。', en: '' } }
      - { id: note-response, text: { ja: '送信は9時42分。気づいたのは10時。取り消しはできなかった。', en: '' } }
    choices:
      - id: p-an-01-a
        text: { ja: '上司にすぐ報告し、送信履歴と画面を保存する。', en: '' }
        explain: { ja: '隠さず報告し、証拠を押さえている。早い報告は、会社が動く時間を増やす。まず報告する。', en: '' }
        minutes: 15
        category: increase
        points: 300
        refs: [jpcert-handling, ipa-sme-guideline]
        gauges: { flame: -5, trust: 10 }
        setFlags: { reportedEarly: true }
        items:
          - { id: an01a-time, points: 10, axis: time, refs: [jpcert-handling] }
          - { id: an01a-record, points: 8, axis: record, refs: [cissp-cbk-secops] }
          - { id: an01a-order, points: 5, axis: order, refs: [ipa-sme-guideline] }
      - id: p-an-01-b
        text: { ja: '取り消しの方法を探し、見つかるまで報告を待つ。', en: '' }
        explain: { ja: '取り消しを探す間に、報告と初動が遅れる。送信済みメールは自分では戻せない。報告が先。報告が先。', en: '' }
        minutes: 30
        category: hurt
        points: -100
        refs: [no16-ppc-breach-qa]
        gauges: { flame: 10, trust: -5 }
        delayed:
          - { afterPhases: 1, points: -5, gauges: { flame: 5 }, reason: { ja: '報告が遅れた間に、受信者からの指摘が広がった。', en: '' } }
        items:
          - { id: an01b-time, points: -5, axis: time, refs: [no16-ppc-breach-qa] }
          - { id: an01b-order, points: -4, axis: order, refs: [jpcert-handling] }
          - { id: an01b-record, points: -3, axis: record, refs: [cissp-cbk-secops] }
      - id: p-an-01-c
        text: { ja: '自分の判断でお詫びのメールを送り、報告は後に回す。', en: '' }
        explain: { ja: '自分で何とかしたい気持ちは分かるが、独断の連絡は会社の説明と食い違う。まず報告する。', en: '' }
        minutes: 30
        category: hurt
        points: -120
        refs: [ipa-sme-guideline]
        gauges: { flame: 10, trust: -10 }
        items:
          - { id: an01c-order, points: -8, axis: order, refs: [ipa-sme-guideline] }
          - { id: an01c-wording, points: -6, axis: wording, refs: [ppc-notify-person] }
          - { id: an01c-record, points: -5, axis: record, refs: [cissp-cbk-secops] }
    lesson: { ja: '誤送信に気づいたら、まず上司に報告する。取り消しを探す時間は短くていい。報告のときに、送信時刻、宛先数、画面の状態を伝える。自分で何とかしようとして独断で連絡すると、会社の説明と食い違う。', en: '' }

