          - { id: ex-s-urgent, text: { ja: '至急、内容をご確認ください', en: '' }, points: -4, axis: wording, refs: [ppc-notify-person], explain: { ja: '急ぎであることは伝わるが、何の用件か分からない。不安だけをあおる件名になる。用件を書く。', en: '' } }
      - id: scope
        label: { ja: '対象の範囲', en: '' }
        options:
          - { id: ex-sc-current, text: { ja: '現在の会員だけを対象にする', en: '' }, points: -12, axis: content, refs: [ppc-notify-person], delayed: { afterPhases: 1, points: -20, reason: { ja: '退会者からの問い合わせで、対象から漏れていたことが分かった。', en: '' } }, explain: { ja: '退会者や体験申込者のアドレスも入っていた。現会員だけに絞ると、影響を受けた人に届かない。', en: '' } }
          - { id: ex-sc-unknown, text: { ja: '対象範囲は現在調査中と書く', en: '' }, points: -6, axis: content, refs: [ppc-notify-person], explain: { ja: '調査中と書くだけでは、自分が対象かどうかを読む人が判断できない。範囲は分かっている限り書く。', en: '' } }
          - { id: ex-sc-all, text: { ja: '全会員と体験申込者・退会者を含む', en: '' }, points: 10, axis: content, refs: [ppc-notify-person], explain: { ja: '実際にアドレスが入っていた範囲をすべて含めている。対象の漏れによる二次的な不信を防げる。', en: '' } }
      - id: cause
        label: { ja: '原因の書き方', en: '' }
        options:
          - { id: ex-ca-config, text: { ja: '配信ツールの宛先設定の誤り', en: '' }, points: 6, axis: content, refs: [no16-ppc-breach-qa], explain: { ja: '何が起きたかを具体的に書いている。責任の所在をぼかさず、再発防止の説明にもつながる。', en: '' } }
          - { id: ex-ca-person, text: { ja: '担当者の確認不足による誤り', en: '' }, points: -8, axis: wording, refs: [ipa-sme-guideline], explain: { ja: '個人の責任に寄せると、確認の手順がなかった事実が見えなくなる。再発防止の話にならない。', en: '' } }
          - { id: ex-ca-vendor, text: { ja: 'ツールの不具合による誤り', en: '' }, points: -12, axis: content, refs: [no16-ppc-breach-qa], explain: { ja: '事実と違う原因を書くと、後で訂正が必要になる。まず調べた事実を書くべき場面。事実を書く。', en: '' } }
      - id: action
        label: { ja: '本人がすること', en: '' }
        options:
          - { id: ex-ac-delete, text: { ja: '受信したメールを削除する', en: '' }, points: 3, axis: care, refs: [ppc-notify-person], explain: { ja: '削除は一つの対策だが、それだけでは不審なメールへの備えが伝わらない。不審メールへの備えも伝える。', en: '' } }
          - { id: ex-ac-watch, text: { ja: '不審なメールに注意し返信しない', en: '' }, points: 10, axis: care, refs: [ppc-notify-person], explain: { ja: 'アドレスが漏れた後に起きるのは、なりすましや迷惑メール。具体的な行動を示せている。', en: '' } }
          - { id: ex-ac-nothing, text: { ja: '特に対応は不要と記載する', en: '' }, points: -10, axis: care, refs: [ppc-notify-person], explain: { ja: '何もしなくてよいと受け取られ、不審メールの相談が遅れる。本人が取る行動を書くべき。', en: '' } }
      - id: apology
        label: { ja: '謝罪の主語', en: '' }
        options:
          - { id: ex-ap-company, text: { ja: '当社の確認不足として謝る', en: '' }, points: 5, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: '組織としての責任を示す書き方。担当者一人に責任を寄せない点が信頼につながる。組織の責任を示す。', en: '' } }
          - { id: ex-ap-staff, text: { ja: '担当者の確認不足として謝る', en: '' }, points: -8, axis: wording, refs: [ipa-sme-guideline], explain: { ja: '個人に責任を寄せると、会社が何を直すのかが見えない。再発防止の説明と食い違う。会社の責任を書く。', en: '' } }
          - { id: ex-ap-system, text: { ja: 'システム設定の誤りとして謝る', en: '' }, points: -4, axis: wording, refs: [no16-ppc-breach-qa], explain: { ja: '仕組みの話だけにすると、確認しなかった事実が抜ける。原因と謝罪の対象がずれる。確認の手順を示す。', en: '' } }
      - id: contact
        label: { ja: '問い合わせ先', en: '' }
        options:
          - { id: ex-co-staff, text: { ja: '担当者個人のメールアドレス', en: '' }, points: -12, axis: care, refs: [ppc-notify-person], explain: { ja: '個人のアドレスに問い合わせが集中すると、対応が止まる。担当者も特定されてしまう。', en: '' } }
          - { id: ex-co-window, text: { ja: '専用窓口の電話とメールと受付時間', en: '' }, points: 8, axis: care, refs: [ppc-notify-person], explain: { ja: '窓口と受付時間が分かれば、本人は迷わず連絡できる。対応の記録も一か所に集まる。記録も集まる。', en: '' } }
          - { id: ex-co-form, text: { ja: '教室の受付で口頭により説明', en: '' }, points: -5, axis: order, refs: [ipa-sme-guideline], explain: { ja: '教室の受付は数が限られ、記録も残りにくい。電話とメールの窓口を用意したい。電話とメールがよい。', en: '' } }
      - id: followup
        label: { ja: '次の報告', en: '' }
        options:
          - { id: ex-fu-month, text: { ja: '1か月後に再発防止の実施状況', en: '' }, points: 5, axis: record, refs: [meti-csm-guideline], explain: { ja: '次の報告の予定を示すと、対策が実行されたかを外から確かめられる。約束として残る。', en: '' } }
          - { id: ex-fu-none, text: { ja: '次の報告は特に記載しない', en: '' }, points: -6, axis: record, refs: [cissp-cbk-secops], explain: { ja: '次の報告がないと、対策が終わったのか続いているのか分からない。不安が残る。予定を書く。', en: '' } }
          - { id: ex-fu-soon, text: { ja: '来週までに実施状況を報告', en: '' }, points: 2, axis: time, refs: [meti-csm-guideline], explain: { ja: '早い報告はよいが、対策の実施には時間がかかる。実現できない期限は信頼を損なう。無理のない期限にする。', en: '' } }
