# No.16 こもれびカルチャー / 経営者（代表取締役社長）ロール
# 入門編: 判断8、報告書1。一つひとつの解説を長めに書く。
# 視点: 12教室を束ねる社長。事実の把握、会員への説明、公表、再発防止の予算を決める。
estimateMinutes: 13
intro: { ja: 'あなたはこもれびカルチャーの社長。12教室、会員4,200名の習い事チェーンを束ねている。金曜の午前10時、運営本部長が血相を変えて入ってきた。会員向けのお知らせメールが、Bcc ではなく To に約400件のアドレスを並べて送られたという。送信はもう戻せない。最初の一日で、何を決めるか。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-ex-coward-2
  '3': v-ex-coward-3
  '4': v-ex-coward-4
events:
  - id: ev-ex-replies
    at: { day: 0, minutes: 630 }
    voices: [v-ex-ev-replies]
    gauges: { flame: 5 }
    sound: { se: [notify_sns] }
    caption: { ja: '受信者からの返信が10件を超えた。「私のアドレスも見えています」という指摘が並ぶ。', en: '' }
  - id: ev-ex-press
    at: { day: 0, minutes: 900 }
    voices: [v-ex-ev-press]
    gauges: { flame: 5 }
    sound: { se: [phone_ring] }
    caption: { ja: '地域紙の記者から、誤送信について取材の申し込みが入った。', en: '' }
points:
  - id: p-ex-01
    at: { day: 0, minutes: 600 }
    phase: detect
    sound: { se: [notify_chat] }
    text: { ja: '午前10時。運営本部長が「会員向けメールの宛先を間違えました」と報告に来た。送信は9時42分。会員412人のアドレスが To に並び、Bcc は空だった。受信者同士が見える状態で、すでに数件の返信が来ている。', en: '' }
    voices: [v-ex-01-boss, v-ex-01-sns, v-ex-01-legal]
    notable:
      - { id: note-cause, text: { ja: '会員412人のアドレスを To に入れ、Bcc を空のまま送信した。配信ツールの宛先設定の誤り。', en: '' } }
      - { id: note-response, text: { ja: '送信は9時42分。気づいたのは10時。取り消しはできず、返信が届き始めている。', en: '' } }
    choices:
      - id: p-ex-01-a
        text: { ja: '事実と宛先数を確かめ、送信の記録と設定を保全する。', en: '' }
        explain: { ja: 'まず事実と証拠を押さえる判断。宛先数と設定が分かれば、その後の説明も再発防止もぶれない。', en: '' }
        minutes: 30
        category: increase
        points: 300
        refs: [jpcert-handling, no16-ppc-breach-qa]
        gauges: { flame: -5, trust: 10, stamina: -5 }
        setFlags: { factsFixed: true }
        items:
          - { id: ex01a-order, points: 8, axis: order, refs: [jpcert-handling] }
          - { id: ex01a-record, points: 10, axis: record, refs: [jpcert-handling] }
          - { id: ex01a-time, points: 5, axis: time, refs: [no16-ppc-breach-qa] }
      - id: p-ex-01-b
        text: { ja: '担当者を呼び、なぜ間違えたのかをその場で問い詰める。', en: '' }
        explain: { ja: '原因の確認は必要だが、問い詰めることを優先すると、事実の保全と初動が遅れる。まず記録を残す。', en: '' }
        minutes: 45
        category: hurt
        points: -120
        refs: [ipa-sme-guideline]
        gauges: { flame: 10, trust: -5 }
        delayed:
          - { afterPhases: 1, points: -30, gauges: { flame: 5 }, reason: { ja: '初動が遅れた間に、受信者からの指摘がSNSに広がった。', en: '' } }
        items:
          - { id: ex01b-record, points: -8, axis: record, refs: [jpcert-handling] }
          - { id: ex01b-order, points: -10, axis: order, refs: [ipa-sme-guideline] }
          - { id: ex01b-care, points: -5, axis: care, refs: [ipa-sme-guideline] }
      - id: p-ex-01-c
        text: { ja: 'まず取引先と講師に謝り、会員への連絡は後に回す。', en: '' }
        explain: { ja: '関係者への配慮に見えるが、被害を受けた会員への連絡が遅れ、不信が広がる。影響の大きい順に連絡する。', en: '' }
        minutes: 45
        category: hurt
        points: -100
        refs: [ppc-notify-person, ipa-sme-guideline]
        gauges: { flame: 5, trust: -10 }
        items:
          - { id: ex01c-order, points: -8, axis: order, refs: [ppc-notify-person] }
          - { id: ex01c-care, points: -6, axis: care, refs: [ipa-sme-guideline] }
          - { id: ex01c-time, points: -5, axis: time, refs: [ppc-notify-person] }
    lesson: { ja: '誤送信に気づいた直後に大事なのは、謝罪より先に事実と証拠を押さえること。宛先数、送信時刻、配信設定、返信の有無を記録すれば、説明と再発防止の土台になる。担当者を責める時間は、その後に使う。', en: '' }

