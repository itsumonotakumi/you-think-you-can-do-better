# No.12 ソラノ / 経営者ロール（代表取締役社長）
# 判断ポイント15、細目は choices[].items と drafts の合計で80以上。
estimateMinutes: 30
intro: { ja: 'あなたは株式会社ソラノの代表取締役社長、三浦 涼子。旅行予約サイトと会員サービスを運営し、会員は320万人。午前9時、外部の研究者から「顧客情報が誰でも見られる状態です」と連絡が入った。クラウドの設定ミス。アクセスの記録は一部しか残っていない。何を先に決めるかで、会社の信用が決まる。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-exec-prelim
    ref: ppc-report-prelim
    label: { ja: '個人情報保護委員会への速報', en: '' }
    points: -150
    doneFlag: ppcPrelimFiled
  - id: dl-exec-final
    ref: ppc-report-final
    label: { ja: '個人情報保護委員会への確報', en: '' }
    points: -100
    doneFlag: ppcFinalFiled
events:
  - id: ev-exec-news
    at: { day: 0, minutes: 1080 }
    voices: [ v-ev-news ]
    gauges: { flame: 10 }
    sound: { se: [ notify_news ] }
    caption: { ja: '旅行情報サイトの速報が、ソラノの保存領域の設定ミスを報じた。', en: '' }
  - id: ev-exec-customer
    at: { day: 1, minutes: 600 }
    voices: [ v-ev-customer ]
    gauges: { flame: 5 }
    sound: { se: [ phone_ring ] }
    caption: { ja: '会員からの問い合わせが、カスタマーサポートに集中している。', en: '' }
  - id: ev-exec-vendor
    at: { day: 1, minutes: 900 }
    voices: [ v-ev-vendor ]
    gauges: { flame: 5 }
    sound: { se: [ mail_arrive ] }
    caption: { ja: '開発委託先から、設定変更の経緯について説明文が届いた。', en: '' }
  - id: ev-exec-board
    at: { day: 2, minutes: 540 }
    voices: [ v-ev-board ]
    gauges: { flame: 5 }
    sound: { se: [ phone_ring ] }
    caption: { ja: '取締役から、株主と取引先への説明の予定を聞かれた。', en: '' }
points:
  - id: p01-researcher
    at: { day: 0, minutes: 540 }
    phase: detect
    sound: { se: [ mail_arrive ] }
    text: { ja: '午前9時。カスタマーサポートから回されてきた一通のメール。外部のセキュリティ研究者が「御社の顧客情報が、誰でも見られる場所に置かれています」と書いている。', en: '' }
    voices: [ v01-shake, v01-law, v01-ok ]
    notable:
      - { id: note-researcher, text: { ja: '午前9時、外部の研究者から保存領域の公開を知らされた。', en: '' } }
    choices:
      - id: p01-a-thanks
        text: { ja: '礼を述べて詳細を聞き、技術へつなぐと返信する。', en: '' }
        explain: { ja: "指摘者を味方につける対応。公開前に知らせた相手を尊重し、事実確認の経路を確保している。", en: "" }
        minutes: 30
        category: recover
        points: 120
        refs: [ jpcert-handling, meti-csm-guideline ]
        gauges: { flame: -5, trust: 10, stamina: -5 }
        setFlags: { researcherSafe: true }
        items:
          - { id: p01-a-order, points: 8, axis: order, refs: [ jpcert-handling ] }
          - { id: p01-a-care, points: 8, axis: care, refs: [ meti-csm-guideline ] }
      - id: p01-b-legal
        text: { ja: 'まず法務に相談し、返信は様子を見て決める。', en: '' }
        explain: { ja: "法務確認は必要だが、返信が遅れると研究者が公開に踏み切るおそれがある。ただし、次の判断につなげる記録と共有が不足している。", en: "" }
        minutes: 60
        category: maintain
        points: 20
        refs: [ jpcert-handling ]
        gauges: { stamina: -5 }
        items:
          - { id: p01-b-order, points: 5, axis: order, refs: [ jpcert-handling ] }
          - { id: p01-b-time, points: 3, axis: time, refs: [ jpcert-handling ] }
      - id: p01-c-threat
        text: { ja: 'いたずらとみなし、警告文を送って連絡を断つ。', en: '' }
        explain: { ja: "指摘者を脅すと、通報や公開に進み、被害の把握も遅れる。初動で最も避ける対応。この判断は、後の説明と再発防止の前提を崩す。", en: "" }
        minutes: 60
        category: hurt
        points: -120
        refs: [ meti-disclosure-guidance ]
        gauges: { flame: 10, trust: -10 }
        setFlags: { threatenedResearcher: true }
        items:
          - { id: p01-c-wording, points: -10, axis: wording, refs: [ meti-disclosure-guidance ] }
          - { id: p01-c-care, points: -8, axis: care, refs: [ jpcert-handling ] }
    lesson: { ja: "外部からの指摘は、まず礼を述べて事実を聞く。公開前に知らせてくれた相手を脅すと、連絡経路が閉じ、被害の全体像をつかめなくなる。技術と法務をつないで、同じ情報を共有する。", en: "" }

  - id: p02-close
    at: { day: 0, minutes: 570 }
    phase: contain
    sound: { se: [ notify_chat ] }
    text: { ja: '午前9時30分。情報システム部が「保存領域の設定が公開になっていた」と報告した。まだ影響範囲は分かっていない。最初に何をするか。', en: '' }
    voices: [ v02-vendor, v02-field, v02-ok ]
    choices:
      - id: p02-a-check
        text: { ja: '影響範囲を確認してから、公開設定を止める。', en: '' }
        explain: { ja: "確認を待つ間に閲覧が続く。公開状態は一分でも短くするのが原則。ただし、次の判断につなげる記録と共有が不足している。", en: "" }
        minutes: 60
        category: maintain
        points: 20
        refs: [ nist-sp800-61r3 ]
        gauges: { damage: 5 }
        items:
          - { id: p02-a-order, points: 5, axis: order, refs: [ nist-sp800-61r3 ] }
          - { id: p02-a-time, points: 3, axis: time, refs: [ nist-sp800-61r3 ] }
      - id: p02-b-close
        text: { ja: 'まず公開を止め、設定とログを証拠として保全する。', en: '' }
        explain: { ja: "被害を止める措置と証拠保全を同時に行っている。順序として最も妥当。判断の根拠を記録に残すことも、後の説明に役立つ。", en: "" }
        minutes: 30
        category: recover
        points: 120
        refs: [ nist-sp800-61r3, jpcert-handling ]
        gauges: { damage: -10, flame: -5, trust: 10, stamina: -5 }
        setFlags: { closedBucket: true, logsPreserved: true }
        items:
          - { id: p02-b-order, points: 8, axis: order, refs: [ nist-sp800-61r3 ] }
          - { id: p02-b-record, points: 8, axis: record, refs: [ jpcert-handling ] }
          - { id: p02-b-time, points: 5, axis: time, refs: [ nist-sp800-61r3 ] }
      - id: p02-c-wait
        text: { ja: '予約への影響を避けるため、週明けまで様子を見る。', en: '' }
        explain: { ja: "予約を守る判断が、閲覧の継続を許す。後から「なぜ止めなかったのか」を説明できない。", en: "" }
        minutes: 120
        category: hurt
        points: -150
        refs: [ nist-sp800-61r3 ]
        gauges: { damage: 20, flame: 10, trust: -10 }
        coward: true
        items:
          - { id: p02-c-time, points: -12, axis: time, refs: [ nist-sp800-61r3 ] }
          - { id: p02-c-record, points: -8, axis: record, refs: [ jpcert-handling ] }
    lesson: { ja: "公開状態の指摘を受けたら、影響確認より先に閉じる。閉じる操作の前後で設定とログを保全し、いつから公開だったかを後から検証できるようにする。営業を理由に待つと、閲覧の機会を延ばす。", en: "" }

  - id: p03-window
    at: { day: 0, minutes: 690 }
    phase: investigate
    sound: { se: [ notify_chat ] }
    text: { ja: '午前11時30分。設定が変わったのは三か月前の可能性があるという。アクセスの記録は一部しか残っていない。いつから見えていたかをどう扱うか。', en: '' }
    voices: [ v03-law, v03-popular, v03-ok ]
    notable:
      - { id: note-window, text: { ja: '設定変更は三か月前の可能性。アクセスログは30日分しか残っていない。', en: '' } }
    choices:
      - id: p03-a-unknown
        text: { ja: '記録がないので、公開期間は分からないとだけ説明する。', en: '' }
        explain: { ja: "分からないで終わらせると、対象者の判断材料がない。確認できる資料を探す努力も伝わらない。", en: "" }
        minutes: 60
        category: hurt
        points: -100
        refs: [ jpcert-handling ]
        gauges: { trust: -10 }
        items:
          - { id: p03-a-record, points: -10, axis: record, refs: [ jpcert-handling ] }
          - { id: p03-a-content, points: -8, axis: content, refs: [ jpcert-handling ] }
      - id: p03-b-assume
        text: { ja: '三か月前から公開されていたと決めて公表する。', en: '' }
        explain: { ja: "推定を断定すると、後で訂正が必要になる。根拠を示さない期間の説明は信頼を損なう。", en: "" }
        minutes: 60
        category: maintain
        points: 10
        refs: [ meti-disclosure-guidance ]
        gauges: { flame: 5 }
        items:
          - { id: p03-b-wording, points: 3, axis: wording, refs: [ meti-disclosure-guidance ] }
          - { id: p03-b-record, points: 3, axis: record, refs: [ jpcert-handling ] }
      - id: p03-c-estimate
        text: { ja: '設定変更の履歴とログから推定し、不明点も添えて公表する。', en: '' }
        explain: { ja: "分かる範囲と不明な範囲を分けて示している。推定の根拠を残すことで、後の訂正にも耐えられる。", en: "" }
        minutes: 120
        category: recover
        points: 120
        refs: [ jpcert-handling, meti-disclosure-guidance ]
        gauges: { flame: -5, trust: 10, stamina: -10 }
        setFlags: { exposureWindowKnown: true }
        items:
          - { id: p03-c-record, points: 10, axis: record, refs: [ jpcert-handling ] }
          - { id: p03-c-wording, points: 8, axis: wording, refs: [ meti-disclosure-guidance ] }
          - { id: p03-c-content, points: 5, axis: content, refs: [ jpcert-handling ] }
    lesson: { ja: "公開期間は、設定変更の履歴、デプロイ記録、保存期間内のログを突き合わせて推定する。分からない部分は、分からないと根拠付きで示す。断定も放置も、後で説明を難しくする。", en: "" }

  - id: p04-report
    at: { day: 0, minutes: 900 }
    phase: notify
    sound: { se: [ notify_news ] }
    text: { ja: '午後3時。法務が「個人情報保護委員会への報告はどうしますか」と聞く。閲覧された証拠はまだない。報告するか。', en: '' }
    voices: [ v04-law, v04-boss, v04-ok ]
    notable:
      - { id: note-report, text: { ja: '閲覧の痕跡は未確認。個人情報保護委員会への報告を検討している。', en: '' } }
    choices:
      - id: p04-a-report
        text: { ja: '「おそれ」の段階で速報を出し、確報は30日以内に備える。', en: '' }
        explain: { ja: "確定を待たずに報告する判断。対象と原因が未確定でも、分かる範囲で出すのが原則。判断の根拠を記録に残すことも、後の説明に役立つ。", en: "" }
        minutes: 120
        category: recover
        points: 150
        refs: [ ppc-report-prelim, ppc-report-final ]
        gauges: { flame: -10, trust: 15, stamina: -10 }
        setFlags: { reportedPpc: true, ppcPrelimFiled: true }
        items:
          - { id: p04-a-order, points: 10, axis: order, refs: [ ppc-report-prelim ] }
          - { id: p04-a-time, points: 8, axis: time, refs: [ ppc-report-prelim ] }
          - { id: p04-a-record, points: 5, axis: record, refs: [ jpcert-handling ] }
      - id: p04-b-wait
        text: { ja: '閲覧の痕跡が見つかってから報告するという判断。', en: '' }
        explain: { ja: "痕跡を待つと期限を過ぎるおそれがある。おそれの段階で報告するのが法の求め。ただし、次の判断につなげる記録と共有が不足している。", en: "" }
        minutes: 120
        category: maintain
        points: 20
        refs: [ ppc-report-prelim ]
        gauges: { flame: 5 }
        items:
          - { id: p04-b-time, points: -5, axis: time, refs: [ ppc-report-prelim ] }
          - { id: p04-b-order, points: 5, axis: order, refs: [ ppc-report-prelim ] }
      - id: p04-c-skip
        text: { ja: '設定ミスで漏れた証拠はないとして、報告を見送る。', en: '' }
        explain: { ja: "報告義務を自己判断で免除している。後から閲覧が分かると、隠蔽と法的制裁の両方を招く。", en: "" }
        minutes: 60
        category: fatal
        points: -250
        refs: [ ppc-report-scope, ppc-report-prelim ]
        gauges: { flame: 20, trust: -20 }
        items:
          - { id: p04-c-content, points: -15, axis: content, refs: [ ppc-report-scope ] }
          - { id: p04-c-record, points: -10, axis: record, refs: [ ppc-report-prelim ] }
    lesson: { ja: "漏えい等の報告は、確定を待たず「おそれ」の段階で出す。速報で分かる範囲を示し、確報は30日以内にそろえる。不正アクセスが疑われる場合だけ60日になる。自己判断で報告しないのは致命的。", en: "" }

  - id: p05-vendor
    at: { day: 1, minutes: 600 }
    phase: investigate
    sound: { se: [ mail_arrive ] }
    text: { ja: '午前10時。開発委託先の担当者が「設定を変えたのは弊社だが、確認は御社の指示だった」と言う。責任の所在をどう扱うか。', en: '' }
    voices: [ v05-vendor, v05-coward, v05-ok ]
    notable:
      - { id: note-vendor, text: { ja: '設定変更は委託先が実施。自社の承認と確認の記録が不足している。', en: '' } }
    choices:
      - id: p05-a-blame
        text: { ja: '委託先の責任として公表し、賠償を求める方針を立てる。', en: '' }
        explain: { ja: "責任の断定が先に立つと、原因の全体像が見えなくなる。自社の管理不足も問われない。", en: "" }
        minutes: 90
        category: hurt
        points: -100
        refs: [ meti-csm-guideline ]
        gauges: { flame: 10, trust: -10 }
        items:
          - { id: p05-a-wording, points: -10, axis: wording, refs: [ meti-csm-guideline ] }
          - { id: p05-a-order, points: -8, axis: order, refs: [ meti-csm-guideline ] }
      - id: p05-b-joint
        text: { ja: '作業記録を共同で確認し、責任分界は調査後に決める。', en: '' }
        explain: { ja: "事実の確認を先にしている。責任の断定を保留することで、再発防止の議論に集中できる。", en: "" }
        minutes: 120
        category: recover
        points: 120
        refs: [ meti-csm-guideline, jpcert-handling ]
        gauges: { trust: 10, stamina: -10 }
        setFlags: { vendorJoint: true }
        items:
          - { id: p05-b-order, points: 8, axis: order, refs: [ meti-csm-guideline ] }
          - { id: p05-b-record, points: 8, axis: record, refs: [ jpcert-handling ] }
      - id: p05-c-shift
        text: { ja: '委託先のせいにして、自社の説明責任を軽くする。', en: '' }
        explain: { ja: "責任転嫁は、後から自社の指示や確認漏れが判明したときに信頼を大きく損なう。この判断は、会社の説明責任そのものを損なう。", en: "" }
        minutes: 60
        category: fatal
        points: -200
        refs: [ meti-disclosure-guidance ]
        gauges: { flame: 15, trust: -15 }
        setFlags: { blamedVendor: true }
        items:
          - { id: p05-c-wording, points: -15, axis: wording, refs: [ meti-disclosure-guidance ] }
          - { id: p05-c-care, points: -8, axis: care, refs: [ meti-csm-guideline ] }
    lesson: { ja: "委託先の作業ミスが疑われるときも、まず事実を共同で確認する。責任分界は調査の後で決め、自社の指示と確認の不足も同じ机で扱う。責任転嫁は、再発防止を止め、説明の信頼を失う。", en: "" }

  - id: p06-statement
    at: { day: 1, minutes: 720 }
    phase: notify
    sound: { se: [ shutter ] }
    text: { ja: '正午。第一報を出す時刻だ。公開期間も対象者も確定していない。何を、どこまで書くか。', en: '' }
    voices: [ v06-public, v06-expert, v06-ok ]
    choices:
      - id: p06-a-hold
        text: { ja: '確定するまで公表を控え、社内の調査に専念する。', en: '' }
        explain: { ja: "公表を待つ間に、対象者は自分で情報を探す。後から判明すると隠蔽と受け取られる。この判断は、会社の説明責任そのものを損なう。", en: "" }
        minutes: 120
        category: fatal
        points: -250
        refs: [ meti-disclosure-guidance ]
        gauges: { flame: 20, trust: -20 }
        setFlags: { hidExposure: true }
        items:
          - { id: p06-a-wording, points: -15, axis: wording, refs: [ meti-disclosure-guidance ] }
          - { id: p06-a-time, points: -10, axis: time, refs: [ meti-disclosure-guidance ] }
      - id: p06-b-vague
        text: { ja: '「一部の情報が閲覧できる可能性があった」とだけ発表する。', en: '' }
        explain: { ja: "可能性だけを示すと、対象者が自分事として動けない。範囲と窓口がない。この判断は、後の説明と再発防止の前提を崩す。", en: "" }
        minutes: 90
        category: hurt
        points: -80
        refs: [ meti-disclosure-guidance ]
        gauges: { flame: 10, trust: -5 }
        items:
          - { id: p06-b-wording, points: -10, axis: wording, refs: [ meti-disclosure-guidance ] }
          - { id: p06-b-content, points: -8, axis: content, refs: [ meti-disclosure-guidance ] }
      - id: p06-c-window
        text: { ja: '事実と不明点、対象の見込み、問い合わせ窓口を書いて出す。', en: '' }
        explain: { ja: "分かる範囲を示し、対象者が次に取る行動を添えている。第一報の役割を果たす内容。判断の根拠を記録に残すことも、後の説明に役立つ。", en: "" }
        minutes: 120
        category: recover
        points: 150
        refs: [ meti-disclosure-guidance, ppc-notify-person ]
        gauges: { flame: 5, trust: 15, stamina: -10 }
        setFlags: { publicFirst: true }
        detail: first-statement
        items:
          - { id: p06-c-wording, points: 10, axis: wording, refs: [ meti-disclosure-guidance ] }
          - { id: p06-c-care, points: 8, axis: care, refs: [ ppc-notify-person ] }
          - { id: p06-c-time, points: 5, axis: time, refs: [ meti-disclosure-guidance ] }
    lesson: { ja: "第一報は、確定を待たずに出す。分かった事実、分かっていないこと、対象の見込み、問い合わせ先を分けて書く。曖昧な「可能性」だけでは、対象者は動けない。隠すと、後の説明がすべて疑われる。", en: "" }

  - id: p07-customers
    at: { day: 1, minutes: 900 }
    phase: notify
    sound: { se: [ phone_ring ] }
    text: { ja: '午後3時。会員への通知をどうするか。対象は最大で数十万人にのぼる可能性がある。メールアドレスが分からない退会者もいる。', en: '' }
    voices: [ v07-law, v07-boss, v07-ok ]
    choices:
      - id: p07-a-multi
        text: { ja: 'メール、マイページ、郵送、電話を組み合わせ、退会者も追う。', en: '' }
        explain: { ja: "届く手段を重ね、退会者も対象にしている。通知の実効性を考えた対応。判断の根拠を記録に残すことも、後の説明に役立つ。", en: "" }
        minutes: 240
        category: recover
        points: 150
        refs: [ ppc-notify-person, no04-ppc-guideline-general ]
        gauges: { flame: -10, trust: 15, stamina: -15 }
        setFlags: { notifiedUsers: true }
        items:
          - { id: p07-a-care, points: 10, axis: care, refs: [ ppc-notify-person ] }
          - { id: p07-a-content, points: 8, axis: content, refs: [ no04-ppc-guideline-general ] }
