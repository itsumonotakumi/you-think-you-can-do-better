# No.12 ソラノ / 役員ロール（執行役員 経営管理本部長）
# 顧客対応、広報、委託契約、取引先、コールセンターを預かる。
# 判断ポイント15、細目は choices[].items と drafts の合計で80以上。
estimateMinutes: 20
intro: { ja: 'あなたは株式会社ソラノの執行役員 経営管理本部長、柏木 修。旅行予約サイトの会員対応、広報、委託契約、取引先との調整を預かる。午前9時、カスタマーサポートに「顧客情報が誰でも見られます」という連絡が入った。技術の判断を、会員と取引先に伝わる言葉に変えるのがあなたの仕事だ。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-officer-prelim
    ref: ppc-report-prelim
    label: { ja: '個人情報保護委員会への速報', en: '' }
    points: -150
    doneFlag: ppcPrelimFiled
  - id: dl-officer-final
    ref: ppc-report-final
    label: { ja: '個人情報保護委員会への確報', en: '' }
    points: -100
    doneFlag: ppcFinalFiled
events:
  - id: ev-officer-news
    at: { day: 0, minutes: 1080 }
    voices: [ v-ev-news ]
    gauges: { flame: 10 }
    sound: { se: [ notify_news ] }
    caption: { ja: '旅行情報サイトの速報が、ソラノの保存領域の設定ミスを報じた。', en: '' }
  - id: ev-officer-customer
    at: { day: 1, minutes: 600 }
    voices: [ v-ev-customer ]
    gauges: { flame: 5 }
    sound: { se: [ phone_ring ] }
    caption: { ja: '会員からの問い合わせが、カスタマーサポートに集中している。', en: '' }
  - id: ev-officer-vendor
    at: { day: 1, minutes: 900 }
    voices: [ v-ev-vendor ]
    gauges: { flame: 5 }
    sound: { se: [ mail_arrive ] }
    caption: { ja: '開発委託先から、設定変更の経緯について説明文が届いた。', en: '' }
  - id: ev-officer-partner
    at: { day: 4, minutes: 480 }
    voices: [ v-ev-partner ]
    gauges: { flame: 5 }
    sound: { se: [ phone_ring ] }
    caption: { ja: '宿泊施設から、予約の取り扱いについて確認が入った。', en: '' }
points:
  - id: p01-call
    at: { day: 0, minutes: 540 }
    phase: detect
    sound: { se: [ phone_ring ] }
    text: { ja: '午前9時。カスタマーサポートに、外部の研究者から電話が入った。「御社の顧客情報が、誰でも見られる状態です」。一次対応をどうするか。', en: '' }
    voices: [ v01-law, v01-field, v01-ok ]
    notable:
      - { id: note-researcher, text: { ja: '午前9時、外部の研究者から保存領域の公開を知らされた。', en: '' } }
    choices:
      - id: p01-a-route
        text: { ja: '窓口を一本化し、礼を述べて技術へつなぐ。', en: '' }
        explain: { ja: "一次受付で切らず、技術と法務につないでいる。指摘者を尊重する姿勢が、その後の連絡を保つ。", en: "" }
        minutes: 30
        category: recover
        points: 120
        refs: [ jpcert-handling, meti-csm-guideline ]
        gauges: { flame: -5, trust: 10, stamina: -5 }
        setFlags: { researcherSafe: true }
        items:
          - { id: p01-a-order, points: 8, axis: order, refs: [ jpcert-handling ] }
          - { id: p01-a-care, points: 8, axis: care, refs: [ meti-csm-guideline ] }
      - id: p01-b-legal
        text: { ja: '法務の判断を待ち、その間は回答を控える。', en: '' }
        explain: { ja: "法務確認は必要だが、回答を控える間に研究者が公開へ動くおそれがある。ただし、次の判断につなげる記録と共有が不足している。", en: "" }
        minutes: 60
        category: maintain
        points: 20
        refs: [ jpcert-handling ]
        gauges: { stamina: -5 }
        items:
          - { id: p01-b-order, points: 5, axis: order, refs: [ jpcert-handling ] }
          - { id: p01-b-time, points: 3, axis: time, refs: [ jpcert-handling ] }
      - id: p01-c-hangup
        text: { ja: 'いたずらと判断し、電話を切って記録も残さない。', en: '' }
        explain: { ja: "指摘を切ると、公開の時期も内容も分からなくなる。記録がないため、後の説明もできない。", en: "" }
        minutes: 30
        category: hurt
        points: -120
        refs: [ jpcert-handling ]
        gauges: { flame: 10, trust: -10 }
        items:
          - { id: p01-c-record, points: -10, axis: record, refs: [ jpcert-handling ] }
          - { id: p01-c-care, points: -8, axis: care, refs: [ jpcert-handling ] }
    lesson: { ja: "外部からの指摘は、一次受付で切らない。窓口を一本化し、礼を述べて技術と法務につなぐ。記録を残さないと、後から時系列も主張も再現できない。初動の記録が、その後の説明と検証の出発点になる。", en: "" }

  - id: p02-support
    at: { day: 0, minutes: 720 }
    phase: contain
    sound: { se: [ notify_chat ] }
    text: { ja: '正午。会員からの問い合わせが増え始めた。まだ報道は出ていない。カスタマーサポートの体制をどうするか。', en: '' }
    voices: [ v02-public, v02-boss, v02-ok ]
    choices:
      - id: p02-a-normal
        text: { ja: '通常の窓口で受け、件数を見ながら考える方針。', en: '' }
        explain: { ja: "様子を見る判断だが、問い合わせは一気に増える。現場が疲弊し、説明もばらつく。この判断は、後の説明と再発防止の前提を崩す。", en: "" }
        minutes: 60
        category: hurt
        points: -100
        refs: [ meti-csm-guideline ]
        gauges: { flame: 10, trust: -5, stamina: -10 }
        items:
          - { id: p02-a-care, points: -10, axis: care, refs: [ meti-csm-guideline ] }
          - { id: p02-a-order, points: -8, axis: order, refs: [ meti-csm-guideline ] }
      - id: p02-b-prepare
        text: { ja: '専用窓口、FAQ、応援要員を用意し、受付時間を延ばす。', en: '' }
        explain: { ja: "問い合わせが集中する前に受け皿を整えている。受付時間を延ばすことで、会員の不安も減る。", en: "" }
        minutes: 120
        category: recover
        points: 120
        refs: [ meti-csm-guideline, ipa-sme-guideline ]
        gauges: { flame: -5, trust: 10, stamina: -10 }
        setFlags: { supportReady: true }
        items:
          - { id: p02-b-order, points: 8, axis: order, refs: [ meti-csm-guideline ] }
          - { id: p02-b-care, points: 8, axis: care, refs: [ ipa-sme-guideline ] }
          - { id: p02-b-content, points: 5, axis: content, refs: [ meti-csm-guideline ] }
          - id: p02-b-record
            points: 5
            axis: record
            refs:
              - jpcert-handling
      - id: p02-c-silent
        text: { ja: '問い合わせが来ても、公表まで個別回答しない。', en: '' }
        explain: { ja: "回答を止めると、会員は SNS や報道に流れる。問い合わせの負担も現場に戻る。ただし、次の判断につなげる記録と共有が不足している。", en: "" }
        minutes: 60
        category: maintain
        points: 10
        refs: [ meti-csm-guideline ]
        gauges: { flame: 5 }
        items:
          - { id: p02-c-care, points: 3, axis: care, refs: [ meti-csm-guideline ] }
          - { id: p02-c-content, points: 3, axis: content, refs: [ meti-csm-guideline ] }
    lesson: { ja: "問い合わせが増える前に、専用窓口とFAQ、応援要員を用意する。受付時間を延ばし、何を聞かれても同じ答えを返せるようにする。通常窓口のままでは、現場が疲弊し、説明もばらつく。", en: "" }

  - id: p03-contract
    at: { day: 0, minutes: 900 }
    phase: organize
    sound: { se: [ mail_arrive ] }
    text: { ja: '午後3時。開発委託先との契約書を開く。セキュリティの条項がない。設定変更の承認も、口頭で済まされていた。どう求めるか。', en: '' }
    voices: [ v03-vendor, v03-law, v03-ok ]
    notable:
      - { id: note-vendor, text: { ja: '委託契約にセキュリティ条項がなく、設定変更の承認も口頭だった。', en: '' } }
    choices:
      - id: p03-a-nothing
        text: { ja: '契約外として、委託先に何も求めない方針。', en: '' }
        explain: { ja: "契約にないからと何も求めないと、原因も再発防止も進まない。同じ作業が他に残る。この判断は、後の説明と再発防止の前提を崩す。", en: "" }
        minutes: 60
        category: hurt
        points: -100
        refs: [ meti-csm-guideline ]
        gauges: { trust: -10 }
        items:
          - { id: p03-a-order, points: -10, axis: order, refs: [ meti-csm-guideline ] }
          - { id: p03-a-content, points: -8, axis: content, refs: [ meti-csm-guideline ] }
      - id: p03-b-damages
        text: { ja: '契約書の免責条項を根拠に、賠償だけを求める。', en: '' }
        explain: { ja: "賠償の請求は権利だが、原因の共同確認がないと、再発防止の議論が進まない。ただし、次の判断につなげる記録と共有が不足している。", en: "" }
        minutes: 90
        category: maintain
        points: 10
        refs: [ meti-csm-guideline ]
        gauges: { flame: 5, trust: -5 }
        items:
          - { id: p03-b-order, points: 3, axis: order, refs: [ meti-csm-guideline ] }
          - { id: p03-b-wording, points: 3, axis: wording, refs: [ meti-csm-guideline ] }
      - id: p03-c-joint
        text: { ja: '共同調査と再発防止を文書で求め、契約の点検も始める。', en: '' }
        explain: { ja: "調査協力を文書で求め、契約の点検まで進めている。同じ型の作業を横断的に減らせる。", en: "" }
        minutes: 180
        category: recover
        points: 120
        refs: [ meti-csm-guideline, jpcert-handling ]
        gauges: { trust: 10, stamina: -10 }
        setFlags: { vendorJoint: true }
        items:
          - { id: p03-c-order, points: 8, axis: order, refs: [ meti-csm-guideline ] }
          - { id: p03-c-record, points: 8, axis: record, refs: [ jpcert-handling ] }
          - { id: p03-c-content, points: 5, axis: content, refs: [ meti-csm-guideline ] }
          - id: p03-c-wording
            points: 5
            axis: wording
            refs:
              - meti-disclosure-guidance
    lesson: { ja: "委託先との契約にセキュリティ条項がなくても、調査協力と情報提供は文書で求められる。共同調査を始め、同じ型の作業が他にないか契約を点検する。免責を根拠に何も求めないと、原因も再発防止も進まない。", en: "" }

  - id: p04-statement
    at: { day: 1, minutes: 600 }
    phase: notify
    sound: { se: [ shutter ] }
    text: { ja: '午前10時。第一報の文案を作る。対象者も原因も確定していない。何を書くか。', en: '' }
    voices: [ v04-public, v04-expert, v04-ok ]
    notable:
      - { id: note-report, text: { ja: '第一報を準備中。個人情報保護委員会への速報も検討している。', en: '' } }
    choices:
      - id: p04-a-window
        text: { ja: '事実、不明点、対象の見込み、窓口を書いて出す。', en: '' }
        explain: { ja: "分かる範囲と不明点を分け、会員が次に取る行動を添えている。第一報の役割を果たす。", en: "" }
        minutes: 120
        category: recover
        points: 150
        refs: [ meti-disclosure-guidance, ppc-notify-person ]
        gauges: { flame: 5, trust: 15, stamina: -10 }
        setFlags: { publicFirst: true, ppcPrelimFiled: true, reportedPpc: true }
        detail: first-statement
        items:
          - { id: p04-a-wording, points: 10, axis: wording, refs: [ meti-disclosure-guidance ] }
          - { id: p04-a-care, points: 8, axis: care, refs: [ ppc-notify-person ] }
          - { id: p04-a-time, points: 5, axis: time, refs: [ meti-disclosure-guidance ] }
      - id: p04-b-vague
        text: { ja: '「一部の情報が閲覧可能だった」とだけ書く。', en: '' }
        explain: { ja: "可能性だけでは、会員が自分事として動けない。範囲も窓口も伝わらない。この判断は、後の説明と再発防止の前提を崩す。", en: "" }
        minutes: 90
        category: hurt
        points: -80
        refs: [ meti-disclosure-guidance ]
        gauges: { flame: 10, trust: -5 }
        items:
          - { id: p04-b-wording, points: -10, axis: wording, refs: [ meti-disclosure-guidance ] }
          - { id: p04-b-content, points: -8, axis: content, refs: [ meti-disclosure-guidance ] }
      - id: p04-c-hold
        text: { ja: '確定するまで公表しないという方針を取る。', en: '' }
        explain: { ja: "公表を待つ間に、会員は自分で情報を探す。後から判明すると隠蔽と受け取られる。この判断は、会社の説明責任そのものを損なう。", en: "" }
        minutes: 120
        category: fatal
        points: -250
        refs: [ meti-disclosure-guidance ]
        gauges: { flame: 20, trust: -20 }
        setFlags: { hidExposure: true }
        items:
          - { id: p04-c-wording, points: -15, axis: wording, refs: [ meti-disclosure-guidance ] }
          - { id: p04-c-time, points: -10, axis: time, refs: [ meti-disclosure-guidance ] }
        coward: true
    lesson: { ja: "第一報は、確定を待たずに、分かる範囲と不明点を分けて書く。対象の見込み、会員が確認すること、問い合わせ先を添える。曖昧な表現だけでは、会員は動けない。伝える相手と順番を決め、記録に残す。", en: "" }

  - id: p05-notify
    at: { day: 1, minutes: 720 }
    phase: notify
    sound: { se: [ notify_chat ] }
    text: { ja: '正午。本人通知の手段を決める。メールアドレスが分からない退会者もいる。郵送の費用もかかる。どう届けるか。', en: '' }
    voices: [ v05-boss, v05-law, v05-ok ]
    notable:
      - { id: note-compensation, text: { ja: '本人通知と補償の窓口を準備している。', en: '' } }
    choices:
      - id: p05-a-mail
        text: { ja: '登録メールに一斉配信し、開封を待つ。', en: '' }
        explain: { ja: "メールだけでは届かない人と退会者が残る。通知したつもりが、届かない通知になる。ただし、次の判断につなげる記録と共有が不足している。", en: "" }
        minutes: 120
        category: maintain
        points: 20
        refs: [ ppc-notify-person ]
        gauges: { trust: 5 }
        items:
          - { id: p05-a-care, points: 5, axis: care, refs: [ ppc-notify-person ] }
          - { id: p05-a-content, points: 3, axis: content, refs: [ ppc-notify-person ] }
      - id: p05-b-multi
        text: { ja: 'メール、郵送、電話を組み合わせ、退会者も追う。', en: '' }
        explain: { ja: "届く手段を重ね、退会者も対象にしている。通知の実効性を考えた対応。判断の根拠を記録に残すことも、後の説明に役立つ。", en: "" }
        minutes: 240
        category: recover
        points: 150
        refs: [ ppc-notify-person, no04-ppc-guideline-general ]
        gauges: { flame: -10, trust: 15, stamina: -15 }
        setFlags: { notifiedUsers: true }
        detail: customer-notice
        items:
          - { id: p05-b-care, points: 10, axis: care, refs: [ ppc-notify-person ] }
          - { id: p05-b-content, points: 8, axis: content, refs: [ no04-ppc-guideline-general ] }
          - { id: p05-b-record, points: 5, axis: record, refs: [ ppc-notify-person ] }
          - id: p05-b-time
            points: 5
            axis: time
            refs:
              - ppc-notify-person
      - id: p05-c-news
        text: { ja: '通知は公表記事に任せ、個別には送らない。', en: '' }
        explain: { ja: "公表記事に任せると、知らない人には届かない。二次被害の防止もできない。この判断は、会社の説明責任そのものを損なう。", en: "" }
        minutes: 60
        category: fatal
        points: -200
        refs: [ ppc-notify-person ]
        gauges: { flame: 15, trust: -15 }
        items:
          - { id: p05-c-care, points: -15, axis: care, refs: [ ppc-notify-person ] }
          - { id: p05-c-content, points: -10, axis: content, refs: [ ppc-notify-person ] }
    lesson: { ja: "本人通知は、届く手段を重ねる。メールだけでなく、郵送や電話を使い、退会者も追う。公表記事に任せると、知らない人には届かず、二次被害の防止もできない。伝える相手と順番を決め、記録に残す。", en: "" }

  - id: p06-phishing
    at: { day: 2, minutes: 540 }
    phase: notify
    sound: { se: [ notify_sns ] }
    text: { ja: '午前9時。通知を装った偽メールが出回り始めた。「個人情報の確認」という件名で、カード番号を聞いてくる。どう対応するか。', en: '' }
    voices: [ v06-public, v06-expert, v06-ok ]
    choices:
      - id: p06-a-deny
        text: { ja: '偽メールは自分たちとは無関係だとだけ発表する。', en: '' }
        explain: { ja: "否定だけでは、会員はどれを信じればよいか分からない。偽メールは減らない。この判断は、後の説明と再発防止の前提を崩す。", en: "" }
        minutes: 60
        category: hurt
        points: -80
        refs: [ ppc-notify-person ]
        gauges: { flame: 10, trust: -5 }
        items:
          - { id: p06-a-care, points: -10, axis: care, refs: [ ppc-notify-person ] }
          - { id: p06-a-wording, points: -8, axis: wording, refs: [ meti-disclosure-guidance ] }
      - id: p06-b-call
        text: { ja: '問い合わせの多い人に、個別に電話で説明する。', en: '' }
        explain: { ja: "個別の電話は丁寧だが、全員には届かない。同じ説明を繰り返す負担も大きい。ただし、次の判断につなげる記録と共有が不足している。", en: "" }
        minutes: 120
        category: maintain
        points: 10
        refs: [ meti-csm-guideline ]
        gauges: { trust: 3, stamina: -10 }
        items:
          - { id: p06-b-care, points: 3, axis: care, refs: [ meti-csm-guideline ] }
          - { id: p06-b-order, points: 3, axis: order, refs: [ meti-csm-guideline ] }
      - id: p06-c-guide
        text: { ja: '公式サイトに注意喚起と照合方法を出し、通報窓口を設ける。', en: '' }
        explain: { ja: "本物の通知と照合する方法を示している。通報窓口もあり、会員が自分で判断できる。判断の根拠を記録に残すことも、後の説明に役立つ。", en: "" }
        minutes: 120
        category: recover
        points: 120
        refs: [ ppc-notify-person, meti-csm-guideline ]
        gauges: { flame: -5, trust: 10, stamina: -10 }
        setFlags: { phishingGuide: true }
        items:
          - { id: p06-c-care, points: 8, axis: care, refs: [ ppc-notify-person ] }
          - { id: p06-c-content, points: 8, axis: content, refs: [ meti-csm-guideline ] }
          - { id: p06-c-record, points: 5, axis: record, refs: [ jpcert-handling ] }
    lesson: { ja: "通知を装う偽メールには、公式サイトで注意喚起し、本物の通知と照合する方法を案内する。通報窓口も設ける。否定だけでは、会員はどれを信じればよいか分からない。伝える相手と順番を決め、記録に残す。", en: "" }

  - id: p07-compensation
    at: { day: 2, minutes: 720 }
    phase: organize
    sound: { se: [ phone_ring ] }
    text: { ja: '正午。補償の設計を迫られている。全員に一律で出すか、請求があった人に払うか。会員の不安と会社の負担の間で決める。', en: '' }
    voices: [ v07-law, v07-popular, v07-ok ]
    notable:
      - { id: note-compensation, text: { ja: '一律の見舞金と二次被害の実費を検討している。', en: '' } }
    choices:
      - id: p07-a-plan
        text: { ja: '一律の見舞金と二次被害の実費、申請窓口を用意する。', en: '' }
