        text: { ja: '本番設定の変更手続きと承認、継続監視を委託先にも適用する。', en: '' }
        explain: { ja: "変更の手続きと承認、監視を委託先にも広げている。同じ見落としを防ぐ仕組みになる。", en: "" }
        minutes: 240
        category: recover
        points: 120
        refs: [ meti-csm-guideline, cissp-cbk-secops ]
        gauges: { trust: 10, stamina: -15 }
        setFlags: { recurrencePlan: true }
        items:
          - { id: p14-b-order, points: 10, axis: order, refs: [ meti-csm-guideline ] }
          - { id: p14-b-content, points: 8, axis: content, refs: [ cissp-cbk-secops ] }
          - { id: p14-b-record, points: 5, axis: record, refs: [ jpcert-handling ] }
      - id: p14-c-outsource
        text: { ja: '委託先の手順書に従うことを条件に、確認は任せる。', en: '' }
        explain: { ja: "手順書に任せきりにすると、自社の確認責任が曖昧になる。同じミスが残る。この判断は、後の説明と再発防止の前提を崩す。", en: "" }
        minutes: 90
        category: hurt
        points: -100
        refs: [ meti-csm-guideline ]
        gauges: { trust: -10 }
        items:
          - { id: p14-c-order, points: -10, axis: order, refs: [ meti-csm-guideline ] }
          - { id: p14-c-content, points: -8, axis: content, refs: [ meti-csm-guideline ] }
    lesson: { ja: "委託先の設定変更は、手続きと承認、継続監視で管理する。研修だけでは、作業の抜けを防げない。委託先の手順書に任せきりにすると、自社の確認責任が曖昧になる。再開の条件と根拠を示すことが、信頼の回復につながる。", en: "" }

  - id: p15-report
    at: { day: 21, minutes: 600 }
    phase: after
    sound: { se: [ notify_news ] }
    text: { ja: '午前10時。調査報告書を公開する。会員への説明と、取引先への説明をどう両立させるか。確報の提出も控えている。', en: '' }
    voices: [ v15-expert, v15-law, v15-ok ]
    choices:
      - id: p15-a-hide
        text: { ja: '報告書は公開せず、問い合わせがあった人にだけ渡す。', en: '' }
        explain: { ja: "検証も再発防止の共有も進まない。会員と取引先への説明の材料も失う。この判断は、後の説明と再発防止の前提を崩す。", en: "" }
        minutes: 90
        category: hurt
        points: -150
        refs: [ meti-disclosure-guidance ]
        gauges: { flame: 15, trust: -15 }
        items:
          - { id: p15-a-content, points: -12, axis: content, refs: [ meti-disclosure-guidance ] }
          - { id: p15-a-wording, points: -8, axis: wording, refs: [ meti-disclosure-guidance ] }
      - id: p15-b-summary
        text: { ja: '要約だけを公開し、原因の詳細は伏せる方針。', en: '' }
        explain: { ja: "概要は伝わるが、原因と判断の誤りが見えず、再発防止の検証ができない。ただし、次の判断につなげる記録と共有が不足している。", en: "" }
        minutes: 120
        category: maintain
        points: 20
        refs: [ meti-disclosure-guidance ]
        gauges: { trust: 5 }
        items:
          - { id: p15-b-content, points: 5, axis: content, refs: [ meti-disclosure-guidance ] }
          - { id: p15-b-record, points: 3, axis: record, refs: [ meti-disclosure-guidance ] }
      - id: p15-c-full
        text: { ja: '攻撃に使える詳細だけ伏せ、原因、対策、進捗を公開する。', en: '' }
        explain: { ja: "危険な情報を伏せつつ、検証に必要な情報を公開している。再発防止の実効性が高い。判断の根拠を記録に残すことも、後の説明に役立つ。", en: "" }
        minutes: 240
        category: increase
        points: 350
        fatalAlternate: 40
        refs: [ meti-disclosure-guidance, ppc-report-final ]
        gauges: { flame: -15, trust: 20, stamina: -15 }
        setFlags: { fullDisclosure: true, ppcFinalFiled: true }
        items:
          - { id: p15-c-content, points: 10, axis: content, refs: [ meti-disclosure-guidance ] }
          - { id: p15-c-record, points: 8, axis: record, refs: [ jpcert-handling ] }
          - { id: p15-c-wording, points: 5, axis: wording, refs: [ meti-disclosure-guidance ] }
    lesson: { ja: "報告書は、攻撃に使える詳細だけ伏せて公開する。原因、判断の誤り、再発防止の進捗を書き、会員と取引先の両方に届く形にする。要約だけでは、検証も再発防止も進まない。", en: "" }

