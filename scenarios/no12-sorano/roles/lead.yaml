# No.12 ソラノ / セキュリティ部門長ロール（情報システム部長 兼 CISO）
# 技術の封じ込め、ログの保全、公開期間の推定、委託先との調整、再発防止を扱う。
# 判断ポイント15、細目は choices[].items と drafts の合計で80以上。
estimateMinutes: 35
intro: { ja: 'あなたは株式会社ソラノの情報システム部長で、情報セキュリティ責任者を兼ねている。午前9時、外部の研究者から「保存領域が公開されています」と連絡が来た。クラウドの設定ミス。アクセスの記録は一部しか残っていない。技術の事実を、経営と会員に伝わる形にするのがあなたの仕事だ。', en: '' }
