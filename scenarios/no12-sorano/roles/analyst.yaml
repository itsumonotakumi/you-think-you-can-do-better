          - { id: p14-b-order, points: 8, axis: order, refs: [ meti-csm-guideline ] }
          - { id: p14-b-record, points: 5, axis: record, refs: [ jpcert-handling ] }
      - id: p14-c-outsource
        text: { ja: '委託先の確認結果だけを受け取り、自社では確認しない。', en: '' }
        explain: { ja: "自社の確認を省くと、同じ見落としが残る。責任も曖昧になる。この判断は、後の説明と再発防止の前提を崩す。", en: "" }
        minutes: 90
        category: hurt
        points: -100
        refs: [ meti-csm-guideline ]
        gauges: { trust: -10 }
        items:
          - { id: p14-c-order, points: -10, axis: order, refs: [ meti-csm-guideline ] }
          - { id: p14-c-content, points: -8, axis: content, refs: [ cissp-cbk-secops ] }
    lesson: { ja: "設定の確認は、定期監査と自動検知、委託先の変更記録を組み合わせる。チェックリストだけでは、注意力に頼ることになる。自社の確認を省くと、同じ見落としが残る。再開の条件と根拠を示すことが、信頼の回復につながる。", en: "" }

  - id: p15-report
    at: { day: 21, minutes: 600 }
    phase: after
    sound: { se: [ notify_news ] }
    text: { ja: '午前10時。技術調査の報告書をまとめる。原因、影響、再発防止をどう書くか。確報の提出も控えている。', en: '' }
    voices: [ v15-expert, v15-law, v15-ok ]
    choices:
      - id: p15-a-hide
        text: { ja: '報告書は社内にだけ置き、外部への公開は見送る。', en: '' }
        explain: { ja: "検証も再発防止の共有も進まない。会員と取引先への説明の材料も失う。この判断は、後の説明と再発防止の前提を崩す。", en: "" }
        minutes: 90
        category: hurt
        points: -150
        refs: [ meti-disclosure-guidance ]
        gauges: { flame: 15, trust: -15 }
        items:
          - { id: p15-a-content, points: -12, axis: content, refs: [ meti-disclosure-guidance ] }
          - { id: p15-a-wording, points: -8, axis: wording, refs: [ meti-disclosure-guidance ] }
      - id: p15-b-summary
        text: { ja: '要約だけを公開し、原因の詳細は伏せる方針。', en: '' }
        explain: { ja: "概要は伝わるが、原因と判断の誤りが見えず、再発防止の検証ができない。ただし、次の判断につなげる記録と共有が不足している。", en: "" }
        minutes: 120
        category: maintain
        points: 20
        refs: [ meti-disclosure-guidance ]
        gauges: { trust: 5 }
        items:
          - { id: p15-b-content, points: 5, axis: content, refs: [ meti-disclosure-guidance ] }
          - { id: p15-b-record, points: 3, axis: record, refs: [ meti-disclosure-guidance ] }
      - id: p15-c-full
        text: { ja: '攻撃に使える詳細だけ伏せ、原因、影響、対策を公開する。', en: '' }
        explain: { ja: "危険な情報を伏せつつ、検証に必要な情報を公開している。再発防止の実効性が高い。判断の根拠を記録に残すことも、後の説明に役立つ。", en: "" }
        minutes: 240
        category: increase
        points: 350
        fatalAlternate: 40
        refs: [ meti-disclosure-guidance, ppc-report-final ]
        gauges: { flame: -15, trust: 20, stamina: -15 }
        setFlags: { fullDisclosure: true, ppcFinalFiled: true }
        detail: incident-report
        items:
          - { id: p15-c-content, points: 10, axis: content, refs: [ meti-disclosure-guidance ] }
          - { id: p15-c-record, points: 8, axis: record, refs: [ jpcert-handling ] }
          - { id: p15-c-wording, points: 5, axis: wording, refs: [ meti-disclosure-guidance ] }
    lesson: { ja: "技術報告書は、攻撃に使える詳細だけ伏せて公開する。原因、影響範囲、対策、進捗を書き、再現手順は伏せる。隠すと検証が止まり、同じ設定ミスが残る。検証と共有を続けることが、再発防止の実効性を高める。", en: "" }

