    text: { ja: '1か月後。第三者委員会の調査報告書が完成した。公開範囲を決める。中には、チェックシートの回答が形だけだった経緯も書かれている。', en: '' }
    voices: [v15-expert, v15-law, v15-ok]
    choices:
      - id: p15-hide
        text: { ja: '報告書は公開しない。', en: '' }
        minutes: 60
        category: hurt
        points: -150
        refs: [meti-disclosure-guidance]
        gauges: { flame: 15, trust: -15 }
        items:
          - { id: p15-a-content, points: -10, axis: content, refs: [meti-disclosure-guidance] }
          - { id: p15-a-wording, points: -10, axis: wording, refs: [meti-disclosure-guidance] }
      - id: p15-publish
        text: { ja: '攻撃に使える部分だけ伏せて、全文を公開する。', en: '' }
        minutes: 180
        category: recover
        points: 100
        refs: [meti-disclosure-guidance]
        gauges: { flame: -10, trust: 15, stamina: -10 }
        setFlags: { fullDisclosure: true }
        items:
          - { id: p15-b-content, points: 8, axis: content, refs: [meti-disclosure-guidance] }
          - { id: p15-b-record, points: 5, axis: record, refs: [meti-disclosure-guidance] }
      - id: p15-publish-share
        text: { ja: '全文を公開し、再発防止の進捗を毎月出し、得た教訓を業界に無償で共有する。', en: '' }
        minutes: 240
        category: increase
        points: 300
        fatalAlternate: 50
        refs: [meti-disclosure-guidance, meti-csm-guideline]
        gauges: { flame: -15, trust: 20, stamina: -15 }
        setFlags: { fullDisclosure: true, industryShare: true }
        items:
          - { id: p15-c-content, points: 8, axis: content, refs: [meti-disclosure-guidance] }
          - { id: p15-c-record, points: 8, axis: record, refs: [meti-disclosure-guidance] }
          - { id: p15-c-content2, points: 8, axis: content, refs: [meti-csm-guideline] }
      - id: p15-summary
        text: { ja: '要約だけを公開する。', en: '' }
        minutes: 90
        category: hurt
        points: -60
        refs: [meti-disclosure-guidance]
        gauges: { flame: 5, trust: -5 }
        items:
          - { id: p15-d-content, points: -8, axis: content, refs: [meti-disclosure-guidance] }
          - { id: p15-d-record, points: -8, axis: record, refs: [meti-disclosure-guidance] }

  - id: p16-industry
    at: { day: 31, minutes: 600 }
    phase: after
    sound: { se: [phone_ring] }
    text: { ja: '翌日。業界団体から「同じ手口の注意喚起を出したい。事例を共有してくれないか」と連絡が来た。社内には「余計なことを言うな」という声もある。', en: '' }
    voices: [v16-coward, v16-vendor, v16-ok]
    choices:
      - id: p16-refuse
        text: { ja: '事例は出さず、自社の再発防止だけを進める。', en: '' }
        minutes: 45
        category: hurt
        points: -60
        refs: [meti-disclosure-guidance]
        gauges: { trust: -5, flame: 5 }
        items:
          - { id: p16-a-content, points: -10, axis: content, refs: [meti-disclosure-guidance] }
          - { id: p16-a-care, points: -8, axis: care, refs: [meti-csm-guideline] }
      - id: p16-anonymous
