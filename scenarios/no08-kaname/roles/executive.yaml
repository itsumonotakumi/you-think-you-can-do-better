          - { id: p17-b-wording2, points: 8, axis: wording, refs: [meti-disclosure-guidance] }
      - id: p17-ready
        text: { ja: '役員全員で想定問答を確認し、最初に取引先と従業員への謝罪を述べる。数字は手元の資料だけを使う。', en: '' }
        minutes: 150
        category: recover
        points: 100
        refs: [meti-csm-guideline, jpcert-handling]
        gauges: { flame: -10, trust: 10, stamina: -10 }
        setFlags: { pressReady: true }
        items:
          - { id: p17-c-order, points: 8, axis: order, refs: [meti-csm-guideline] }
          - { id: p17-c-care, points: 8, axis: care, refs: [meti-csm-guideline] }
          - { id: p17-c-record, points: 8, axis: record, refs: [jpcert-handling] }
      - id: p17-cancel
        text: { ja: '会見を中止し、文書での発表だけにする。', en: '' }
        minutes: 30
        category: hurt
        points: -100
        refs: [meti-disclosure-guidance]
        gauges: { flame: 15, trust: -15 }
        items:
          - { id: p17-d-care, points: -10, axis: care, refs: [meti-disclosure-guidance] }
          - { id: p17-d-order, points: -8, axis: order, refs: [meti-disclosure-guidance] }

