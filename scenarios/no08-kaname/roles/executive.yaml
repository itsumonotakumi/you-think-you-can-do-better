# No.8 カナメ精工 / 経営者ロール
# 判断ポイント17、細目は choices[].items と drafts の合計で80以上。
estimateMinutes: 30
intro: { ja: 'あなたはカナメ精工の代表取締役社長。自動車部品を作る従業員480名の会社で、取引先の完成車メーカーの生産計画と受発注システムが直結している。土曜の夜9時15分、情報システム課長からの電話で、あなたの判断が始まる。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-ppc-prelim
    ref: ppc-report-prelim
    label: { ja: '個人情報保護委員会への速報', en: '' }
    points: -75
    doneFlag: ppcPrelimFiled
events:
  - id: ev-line-stop
    at: { day: 1, minutes: 720 }
    voices: [v-ev-line]
    gauges: { flame: 10 }
    sound: { se: [notify_news] }
    caption: { ja: '取引先の工場が、部品供給の停止でラインを止めた。', en: '' }
  - id: ev-paper
    at: { day: 5, minutes: 540 }
    voices: [v-ev-paper]
    gauges: { flame: 5 }
    caption: { ja: '業界紙が「取引先のラインを止めた部品メーカー」と書いた。', en: '' }
  - id: ev-check-request
    at: { day: 9, minutes: 900 }
    voices: [v-ev-check]
    gauges: { flame: 3 }
    caption: { ja: '取引先から、同じ機器を使っていないかの点検依頼が来た。', en: '' }
points:
  - id: p01-call
    at: { day: 0, minutes: 1275 }
    phase: detect
    sound: { se: [phone_ring] }
    text: { ja: '土曜の午後9時15分。夜勤の情報システム課長から電話が入る。「サーバーが暗号化されています。身代金を要求する文書が置かれていました」。受発注システムも止まっている。', en: '' }
    voices: [v01-boss, v01-expert, v01-ok]
    notable:
      - { id: note-first, text: { ja: '土曜21時15分、情報システム課長から第一報。サーバーが暗号化され、受発注システムが停止。', en: '' } }
    lesson: { ja: '経営者は技術の判断を自分で抱え込まず、対策本部を立てて指揮の所在を明確にする。技術判断は情報システムに任せ、外部の調査や警察への相談を同時に手配する。現場を自分で見に行くことや明朝まで待つことは、一見慎重でも初動を遅らせる。', en: '' }
    choices:
      - id: p01-wait
        text: { ja: '今夜は様子を見て、明朝に担当者を集めてから決める。情報がそろうほうが判断を誤らない。', en: '' }
        explain: { ja: '夜間の初動を遅らせ、被害の拡大と証拠の散逸を招く。落ち着いて判断したい意図は理解できるが、隔離と記録は待つ理由にならない。', en: '' }
        minutes: 120
        category: hurt
        points: -30
        refs: [jpcert-handling]
        gauges: { flame: 10, damage: 15, trust: -5, stamina: 5 }
        coward: true
        setFlags: { delayedCommand: true }
        delayed:
          - { afterPhases: 1, points: -12, gauges: { damage: 10, flame: 10 }, reason: { ja: '誰も指揮を取らないまま夜が明け、初動が丸一日遅れた。', en: '' } }
        items:
          - { id: p01-a-time, points: -8, axis: time, refs: [jpcert-handling] }
          - { id: p01-a-record, points: -6, axis: record, refs: [jpcert-handling] }
      - id: p01-command
        text: { ja: '対策本部を立ち上げて自分が本部長になり、技術判断と外部相談は課長に任せる。', en: '' }
        explain: { ja: '指揮の所在を明確にし、技術判断を任せ、外部相談まで同時に手配している。経営者が初動で果たす役割を押さえた、妥当な判断になる。', en: '' }
        minutes: 60
        category: maintain
        points: 25
        refs: [meti-csm-guideline, jpcert-handling]
        gauges: { flame: -5, trust: 5, stamina: -5 }
        setFlags: { commandStarted: true }
        items:
          - { id: p01-b-time, points: 4, axis: time, refs: [jpcert-handling] }
          - { id: p01-b-order, points: 4, axis: order, refs: [meti-csm-guideline] }
          - { id: p01-b-record, points: 4, axis: record, refs: [jpcert-handling] }
      - id: p01-self
        text: { ja: '自分でサーバー室に行き、暗号化された画面を直接確かめる。現場を見ないと判断できない。', en: '' }
        explain: { ja: '当事者が現場で直接確認すると、指揮と記録の担い手が不在になる。状況を把握したい気持ちは分かるが、初動では役割を分けるほうがよい。', en: '' }
        minutes: 60
        category: hurt
        points: -30
        refs: [jpcert-handling]
        gauges: { stamina: -10, trust: -5 }
        items:
          - { id: p01-c-order, points: -8, axis: order, refs: [meti-csm-guideline] }
          - { id: p01-c-care, points: -4, axis: care, refs: [jpcert-handling] }

  - id: p02-link
    at: { day: 0, minutes: 1425 }
    phase: contain
    sound: { se: [phone_ring] }
    text: { ja: '午後11時45分。受発注システムは、取引先三社の生産計画システムとつながっている。接続を切れば、明日の昼には取引先のラインが止まる。', en: '' }
    voices: [v02-sales, v02-public, v02-ok]
    notable:
      - { id: note-link, text: { ja: '23時45分、取引先三社の生産計画システムとの接続を遮断するか判断。連絡した時刻と相手を記録する。', en: '' } }
    lesson: { ja: '接続遮断は取引先の生産に直結する。だからこそ、切る判断、理由、代替手段、連絡先を一度にそろえて伝える。黙って切るのも、つないだまま様子を見るのも、相手の計画を狂わせる。社内の決裁と対外連絡を同時に進めたい。', en: '' }
    choices:
      - id: p02-keep
        text: { ja: 'つないだまま、自社側のサーバーだけを止める。取引先のラインを止めずに済むと考える。', en: '' }
        explain: { ja: '被害が取引先のシステムへ広がる可能性を残す。相手の生産を守りたい判断だが、自社側だけ止めても通信は止まらず、二次被害を招く。', en: '' }
        minutes: 60
        category: hurt
        points: -30
        refs: [nist-sp800-61r3]
        gauges: { damage: 20, flame: 5 }
        delayed:
          - { afterPhases: 1, points: -18, gauges: { damage: 15, trust: -10 }, reason: { ja: '取引先のシステムに、不審な通信が現れた。', en: '' } }
        items:
          - { id: p02-a-content, points: -8, axis: content, refs: [nist-sp800-61r3] }
          - { id: p02-a-order, points: -6, axis: order, refs: [meti-csm-guideline] }
      - id: p02-cut-silent
        text: { ja: '接続だけを切り、理由と影響の説明は明日の発表にまとめる。今夜は混乱を避けたいと考えている。', en: '' }
        explain: { ja: '断りなく接続を切ると、取引先は原因も復旧の見通しも分からず、生産計画を立てられない。説明を後回しにする分だけ信頼を失う。', en: '' }
        minutes: 45
        category: hurt
        points: -30
        refs: [meti-csm-guideline]
        gauges: { flame: 10, trust: -10 }
        items:
          - { id: p02-d-wording, points: -8, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: p02-d-care, points: -6, axis: care, refs: [meti-csm-guideline] }

      - id: p02-cut-plan
        text: { ja: '接続を切り、取引先の調達担当に電話する。FAXと手渡しの受発注手順を今夜のうちに示す。', en: '' }
        explain: { ja: '遮断の決裁、電話での連絡、代替手順の即日提供までそろっている。取引先のラインを止める影響を最小限にする実務が高く評価できる。', en: '' }
        minutes: 120
        category: recover
        points: 150
        refs: [meti-csm-guideline, jpcert-handling]
        gauges: { damage: -15, flame: -5, trust: 15, stamina: -10 }
        setFlags: { linkCut: true, alternativePlan: true }
        items:
          - { id: p02-c-time, points: 6, axis: time, refs: [jpcert-handling] }
          - { id: p02-c-order, points: 6, axis: order, refs: [meti-csm-guideline] }
          - { id: p02-c-care, points: 6, axis: care, refs: [meti-csm-guideline] }
          - { id: p02-c-content, points: 4, axis: content, refs: [meti-csm-guideline] }
      - id: p02-cut
        text: { ja: '接続を切り、理由と復旧の見通しを取引先三社にメールで一斉に伝え、次の連絡も約束する。', en: '' }
        explain: { ja: '遮断と理由の連絡は押さえているが、代替手順の実務までは踏み込んでいない。取引先の生産を止める以上、今夜の代替手段が要る。', en: '' }
        minutes: 60
        category: maintain
        points: 25
        refs: [meti-csm-guideline]
        gauges: { damage: -10, flame: 5, trust: 5 }
        setFlags: { linkCut: true }
        items:
          - { id: p02-b-order, points: 4, axis: order, refs: [meti-csm-guideline] }
          - { id: p02-b-content, points: 4, axis: content, refs: [meti-csm-guideline] }
  - id: p03-ransom
    at: { day: 1, minutes: 180 }
    phase: contain
    sound: { se: [mail_arrive] }
    text: { ja: '午前3時。身代金の要求文には、取引先に納入している図面の一部が添えられていた。「支払わなければ、次の公開は図面だ」。', en: '' }
    voices: [v03-attacker, v03-bold, v03-ok]
    lesson: { ja: '身代金の要求では、支払いの可否より先に証拠を守る。支払いは復号も削除も保証せず、交渉が新たな要求を招く。警察に相談し、図面が公開されたときの取引先との手順と窓口を先に決めておくことが、被害を抑える備えになる。', en: '' }
    choices:
      - id: p03-refuse-plan
        text: { ja: '支払わないと決め、警察に相談する。図面が公開されたときの取引先との対応手順と窓口も決める。', en: '' }
        explain: { ja: '支払わない判断、警察への相談、公開時の対応手順までそろえている。取引先と被害を分かち合う準備ができた、高い水準の判断になる。', en: '' }
        minutes: 150
        category: recover
        points: 150
        refs: [npa-consult, meti-trade-secret]
        gauges: { flame: -10, trust: 10, stamina: -10 }
        setFlags: { refusedRansom: true, victimPlan: true }
        items:
          - { id: p03-c-record, points: 4, axis: record, refs: [npa-consult] }
          - { id: p03-c-order, points: 8, axis: order, refs: [meti-trade-secret] }
          - { id: p03-c-content, points: 4, axis: content, refs: [npa-consult] }
          - { id: p03-c-care, points: 4, axis: care, refs: [meti-trade-secret] }
      - id: p03-pay
        text: { ja: '要求に応じて支払う。取引先の図面の公開を止めるには、これしか方法がないと判断する。', en: '' }
        explain: { ja: '支払っても復号や削除は保証されず、攻撃者との交渉が新たな要求を招く。図面を守りたい気持ちは分かるが、被害を広げる判断になる。', en: '' }
        minutes: 60
        category: fatal
        points: -240
        refs: [npa-consult]
        gauges: { damage: 20, flame: 20, trust: -20 }
        setFlags: { paidRansom: true }
        items:
          - { id: p03-a-record, points: -8, axis: record, refs: [npa-consult] }
          - { id: p03-a-content, points: -8, axis: content, refs: [npa-consult] }
      - id: p03-refuse
        text: { ja: '支払わないと決め、警察の相談窓口に連絡して、図面公開への備えも含めて対応を相談する。', en: '' }
        explain: { ja: '支払わない判断と警察への相談は適切で、被害を広げない基本を押さえている。図面が公開された場合の取引先との手順まで決めると、さらに良い。', en: '' }
        minutes: 90
        category: maintain
        points: 30
        refs: [npa-consult]
        gauges: { flame: -5, trust: 5, stamina: -5 }
        setFlags: { refusedRansom: true }
        items:
          - { id: p03-b-record, points: 4, axis: record, refs: [npa-consult] }
          - { id: p03-b-content, points: 4, axis: content, refs: [npa-consult] }
      - id: p03-ceo-sns
        text: { ja: '支払わないが、社長が個人のSNSで「犯人に屈しない」と強い言葉で発信する。', en: '' }
        explain: { ja: '感情的な発信は攻撃者を刺激し、公開を早めることがある。姿勢を示したい意図は分かるが、個人アカウントの言葉は会社の説明と食い違う。', en: '' }
        minutes: 30
        category: hurt
        points: -30
        refs: [meti-disclosure-guidance]
        gauges: { flame: 15, trust: -5 }
        delayed:
          - { afterPhases: 1, points: -12, gauges: { flame: 15 }, reason: { ja: '攻撃者が社長の投稿に反応し、図面の公開を早めた。', en: '' } }
        items:
          - { id: p03-d-wording, points: -8, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: p03-d-order, points: -8, axis: order, refs: [meti-disclosure-guidance] }

  - id: p04-org
    at: { day: 1, minutes: 540 }
    phase: organize
    sound: { se: [phone_ring, notify_chat] }
    text: { ja: '午前9時。営業本部長が血相を変えて入ってくる。「取引先の二社が、今日の昼でラインを止めると言っています」。情報システムは三人いて、一人は育休中だ。動けるのは二人しかいない。', en: '' }
    voices: [v04-boss, v04-field, v04-ok]
    notable:
      - { id: note-line, text: { ja: '日曜9時、取引先二社が同日の昼でラインを止めると連絡してきた。情報システムは実質二人。', en: '' } }
    lesson: { ja: '長期化するほど、指揮と作業を一部に集めてはいけない。指揮命令と対外窓口を決め、外部の応援と現場の交代を組み込む。人手が足りないときこそ、休ませる計画が判断の質を保ち、復旧のやり直しを防ぐ。', en: '' }
    choices:
      - id: p04-help
        text: { ja: '指揮命令を決め、窓口を一本化する。外部の技術者を手配し、現場の交代も組む。', en: '' }
        explain: { ja: '指揮と窓口を整えたうえで、外部の応援と交代まで手配している。限られた人数で長期戦を乗り切る、模範的な体制づくりになる。', en: '' }
        minutes: 180
        category: recover
        points: 150
        refs: [ipa-sme-guideline, meti-csm-guideline]
        gauges: { stamina: 10, trust: 10, flame: -5 }
        setFlags: { teamRelief: true }
        items:
          - { id: p04-c-order, points: 6, axis: order, refs: [meti-csm-guideline] }
          - { id: p04-c-care, points: 6, axis: care, refs: [ipa-sme-guideline] }
          - { id: p04-c-care2, points: 6, axis: care, refs: [ipa-sme-guideline] }
      - id: p04-allnight
        text: { ja: '情報システムの二人と経営で、休まずに復旧を進める。止めている時間を最短にする。', en: '' }
        explain: { ja: '人手が足りないまま連続で動くと、疲労から確認漏れが起きる。早く戻したい判断だが、交代を組まないと三日目に判断の質が落ちる。', en: '' }
        minutes: 240
        category: hurt
        points: -30
        refs: [ipa-sme-guideline]
        gauges: { stamina: -20, damage: 10, trust: -5 }
        delayed:
          - { afterPhases: 2, points: -12, gauges: { stamina: -15, damage: 10 }, reason: { ja: '疲労から復旧手順の確認漏れが出て、作業をやり直した。', en: '' } }
        items:
          - { id: p04-a-care, points: -8, axis: care, refs: [ipa-sme-guideline] }
          - { id: p04-a-care2, points: -6, axis: care, refs: [ipa-sme-guideline] }
      - id: p04-command
        text: { ja: '対策本部の指揮命令の順序を決め、取引先への窓口を営業本部長に一本化して混乱を防ぐ。', en: '' }
        explain: { ja: '指揮命令と対外窓口の一本化は適切で、情報の混乱を防げる。外部の応援や現場の交代まで組むと、長期化に耐えられる。', en: '' }
        minutes: 120
        category: maintain
        points: 30
        refs: [meti-csm-guideline, ipa-sme-guideline]
        gauges: { trust: 5, stamina: -5 }
        items:
          - { id: p04-b-order, points: 6, axis: order, refs: [meti-csm-guideline] }
          - { id: p04-b-care, points: 4, axis: care, refs: [ipa-sme-guideline] }
          - { id: p04-b-record, points: 4, axis: record, refs: [jpcert-handling] }
      - id: p04-wipe
        text: { ja: '復旧を優先し、暗号化された端末を初期化して作り直す。早く戻した現場の判断を褒める。', en: '' }
        explain: { ja: '端末の初期化は侵入経路を示す証拠を失わせる。現場をねぎらう気持ちは分かるが、判断を褒めると同じ行動が広がり、調査が止まる。', en: '' }
        minutes: 120
        category: hurt
        points: -30
        refs: [jpcert-handling]
        gauges: { damage: -10, flame: 15, trust: -15 }
        setFlags: { evidenceLost: true }
        delayed:
          - { afterPhases: 1, points: -18, gauges: { trust: -10, flame: 10 }, reason: { ja: '侵入経路が分からなくなり、調査が振り出しに戻った。', en: '' } }
        items:
          - { id: p04-d-record, points: -12, axis: record, refs: [jpcert-handling] }
          - { id: p04-d-content, points: -8, axis: content, refs: [nist-sp800-61r3] }
          - { id: p04-d-care, points: -4, axis: care, refs: [ipa-sme-guideline] }

  - id: p05-blame
    at: { day: 1, minutes: 960 }
    phase: organize
    sound: { se: [notify_news] }
    text: { ja: '午後4時。取引先の工場が止まった。ニュースは「部品供給の停止で完成車のラインが止まった」と速報している。社内には「うちが悪者にされた」という空気が広がっている。', en: '' }
    voices: [v05-flattery, v05-legal, v05-ok]
    lesson: { ja: '自社のシステムが止まったことで取引先のラインが止まったのなら、まずその事実を認める。責任を相手に向けると、原因の分析より印象の戦いになり、関係が悪化する。直接の謝罪と、埋め合わせの期限を示すことが信頼の回復につながる。', en: '' }
    choices:
      - id: p05-shift-blame
        text: { ja: '自社も被害者だと強調し、取引先の接続設定にも原因があったと示唆して責任を薄める。', en: '' }
        explain: { ja: '責任を取引先にも向けると、原因の分析より印象の戦いになり、関係が悪化する。被害者性を訴えたい気持ちは分かるが、事実の説明が先になる。', en: '' }
        minutes: 60
        category: fatal
        points: -200
        refs: [meti-disclosure-guidance]
        gauges: { flame: 25, trust: -25 }
        setFlags: { blamedCustomer: true }
        delayed:
          - { afterPhases: 2, points: -30, gauges: { flame: 20, trust: -15 }, reason: { ja: '責任転嫁だと報じられ、取引先が取引の見直しを始めた。', en: '' } }
        items:
          - { id: p05-a-wording, points: -16, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: p05-a-care, points: -12, axis: care, refs: [meti-csm-guideline] }
          - { id: p05-a-record, points: -8, axis: record, refs: [meti-disclosure-guidance] }
      - id: p05-facts
        text: { ja: '事実だけを伝える。取引先のラインが止まったのは、自社のシステム停止が原因だと認める。', en: '' }
        explain: { ja: '自社の停止が原因だと認める説明は、批判を受けても信頼を保てる。影響の大きい取引先への直接の謝罪や補償の見通しがあると、さらに良い。', en: '' }
        minutes: 90
        category: maintain
        points: 30
        refs: [meti-disclosure-guidance]
        gauges: { flame: -5, trust: 10, stamina: -5 }
        setFlags: { admittedCause: true }
        items:
