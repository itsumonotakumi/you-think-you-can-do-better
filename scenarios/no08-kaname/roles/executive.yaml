  - { id: v04-boss, media: boss, misleading: true, type: boss-pressure, text: { ja: 'とにかく現場に人を出せ。説明は後だ。', en: '' }, trigger: { at: point } }
  - { id: v04-field, media: chat, misleading: true, type: well-meant-field, text: { ja: '現場の若手が、暗号化された端末を初期化してくれました。これで復旧が早まります。', en: '' }, trigger: { at: point } }
