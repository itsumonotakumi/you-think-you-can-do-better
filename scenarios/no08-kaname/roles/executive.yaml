# No.8 カナメ精工 / 経営者ロール
# 判断ポイント17、細目は choices[].items と drafts の合計で80以上。
estimateMinutes: 30
intro: { ja: 'あなたはカナメ精工の代表取締役社長。自動車部品を作る従業員480名の会社で、取引先の完成車メーカーの生産計画と受発注システムが直結している。土曜の夜9時15分、情報システム課長からの電話で、あなたの判断が始まる。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-ppc-prelim
    ref: ppc-report-prelim
    label: { ja: '個人情報保護委員会への速報', en: '' }
    points: -150
    doneFlag: ppcPrelimFiled
events:
  - id: ev-line-stop
    at: { day: 1, minutes: 720 }
    voices: [v-ev-line]
    gauges: { flame: 10 }
    sound: { se: [notify_news] }
    caption: { ja: '取引先の工場が、部品供給の停止でラインを止めた。', en: '' }
  - id: ev-paper
    at: { day: 5, minutes: 540 }
    voices: [v-ev-paper]
    gauges: { flame: 5 }
    caption: { ja: '業界紙が「取引先のラインを止めた部品メーカー」と書いた。', en: '' }
  - id: ev-check-request
    at: { day: 9, minutes: 900 }
    voices: [v-ev-check]
    gauges: { flame: 3 }
    caption: { ja: '取引先から、同じ機器を使っていないかの点検依頼が来た。', en: '' }
points:
  - id: p01-call
    at: { day: 0, minutes: 1275 }
    phase: detect
    sound: { se: [phone_ring] }
    text: { ja: '土曜の午後9時15分。夜勤の情報システム課長から電話が入る。「サーバーが暗号化されています。身代金を要求する文書が置かれていました」。受発注システムも止まっている。', en: '' }
    voices: [v01-boss, v01-expert, v01-ok]
    notable:
      - { id: note-first, text: { ja: '土曜21時15分、情報システム課長から第一報。サーバーが暗号化され、受発注システムが停止。', en: '' } }
    choices:
      - id: p01-wait
        text: { ja: '正確な状況が分かるまで、月曜の朝に出社してから対応を決める。', en: '' }
        minutes: 480
        category: hurt
        points: -150
        refs: [jpcert-handling]
        gauges: { flame: 10, damage: 15, trust: -5, stamina: 5 }
        coward: true
        setFlags: { delayedCommand: true }
        delayed:
          - { afterPhases: 1, points: -40, gauges: { damage: 10, flame: 10 }, reason: { ja: '誰も指揮を取らないまま夜が明け、初動が丸一日遅れた。', en: '' } }
        items:
          - { id: p01-a-time, points: -10, axis: time, refs: [jpcert-handling] }
          - { id: p01-a-record, points: -8, axis: record, refs: [jpcert-handling] }
      - id: p01-command
        text: { ja: '対策本部を立ち上げ、情報システム課長に決裁を委ね、外部の調査会社と警察への相談を同時に手配する。', en: '' }
        minutes: 60
        category: maintain
        points: 20
        refs: [meti-csm-guideline, jpcert-handling]
        gauges: { flame: -5, trust: 5, stamina: -5 }
        setFlags: { commandStarted: true }
        items:
          - { id: p01-b-time, points: 5, axis: time, refs: [jpcert-handling] }
          - { id: p01-b-order, points: 5, axis: order, refs: [meti-csm-guideline] }
          - { id: p01-b-record, points: 5, axis: record, refs: [jpcert-handling] }
      - id: p01-self
        text: { ja: '自分でサーバー室に行き、暗号化された画面を直接確かめる。', en: '' }
        minutes: 60
        category: hurt
        points: -50
        refs: [jpcert-handling]
        gauges: { stamina: -10, trust: -5 }
        items:
          - { id: p01-c-order, points: -10, axis: order, refs: [meti-csm-guideline] }
          - { id: p01-c-care, points: -5, axis: care, refs: [jpcert-handling] }

  - id: p02-link
    at: { day: 0, minutes: 1425 }
    phase: contain
    sound: { se: [phone_ring] }
    text: { ja: '午後11時45分。受発注システムは、取引先三社の生産計画システムとつながっている。接続を切れば、月曜の朝から取引先のラインが止まる。', en: '' }
    voices: [v02-sales, v02-public, v02-ok]
    notable:
      - { id: note-link, text: { ja: '23時45分、取引先三社の生産計画システムとの接続を遮断するか判断。連絡した時刻と相手を記録する。', en: '' } }
    choices:
      - id: p02-keep
        text: { ja: 'つないだまま、自社側のサーバーだけを止める。', en: '' }
        minutes: 60
        category: hurt
        points: -100
        refs: [nist-sp800-61r3]
        gauges: { damage: 20, flame: 5 }
        delayed:
          - { afterPhases: 1, points: -60, gauges: { damage: 15, trust: -10 }, reason: { ja: '取引先のシステムに、不審な通信が現れた。', en: '' } }
        items:
          - { id: p02-a-content, points: -10, axis: content, refs: [nist-sp800-61r3] }
          - { id: p02-a-order, points: -8, axis: order, refs: [meti-csm-guideline] }
      - id: p02-cut
        text: { ja: '接続を切り、理由と見通しを取引先にメールで伝える。', en: '' }
        minutes: 60
        category: maintain
        points: 20
        refs: [meti-csm-guideline]
        gauges: { damage: -10, flame: 5, trust: 5 }
        setFlags: { linkCut: true }
        items:
          - { id: p02-b-order, points: 5, axis: order, refs: [meti-csm-guideline] }
          - { id: p02-b-content, points: 5, axis: content, refs: [meti-csm-guideline] }
      - id: p02-cut-plan
        text: { ja: '接続を切り、取引先三社の調達担当に電話を入れ、FAXと手渡しでの受発注手順を今夜のうちに示す。', en: '' }
        minutes: 120
        category: recover
        points: 100
        refs: [meti-csm-guideline, jpcert-handling]
        gauges: { damage: -15, flame: -5, trust: 15, stamina: -10 }
        setFlags: { linkCut: true, alternativePlan: true }
        items:
          - { id: p02-c-time, points: 8, axis: time, refs: [jpcert-handling] }
          - { id: p02-c-order, points: 8, axis: order, refs: [meti-csm-guideline] }
          - { id: p02-c-care, points: 8, axis: care, refs: [meti-csm-guideline] }
          - { id: p02-c-content, points: 5, axis: content, refs: [meti-csm-guideline] }
      - id: p02-cut-silent
        text: { ja: '接続だけ切り、理由は明日の発表で伝える。', en: '' }
        minutes: 45
        category: hurt
        points: -60
        refs: [meti-csm-guideline]
        gauges: { flame: 10, trust: -10 }
        items:
          - { id: p02-d-wording, points: -10, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: p02-d-care, points: -8, axis: care, refs: [meti-csm-guideline] }

  - id: p03-ransom
    at: { day: 1, minutes: 180 }
    phase: contain
    sound: { se: [mail_arrive] }
    text: { ja: '午前3時。身代金の要求文には、取引先に納入している図面の一部が添えられていた。「支払わなければ、次の公開は図面だ」。', en: '' }
    voices: [v03-attacker, v03-bold, v03-ok]
    choices:
      - id: p03-pay
        text: { ja: '要求に応じて支払う。', en: '' }
        minutes: 60
        category: fatal
        points: -300
        refs: [npa-consult]
        gauges: { damage: 20, flame: 20, trust: -20 }
        setFlags: { paidRansom: true }
        items:
          - { id: p03-a-record, points: -10, axis: record, refs: [npa-consult] }
          - { id: p03-a-content, points: -10, axis: content, refs: [npa-consult] }
      - id: p03-refuse
        text: { ja: '支払わないと決め、警察に相談する。', en: '' }
        minutes: 90
        category: maintain
        points: 30
        refs: [npa-consult]
        gauges: { flame: -5, trust: 5, stamina: -5 }
        setFlags: { refusedRansom: true }
        items:
          - { id: p03-b-record, points: 5, axis: record, refs: [npa-consult] }
          - { id: p03-b-content, points: 5, axis: content, refs: [npa-consult] }
      - id: p03-refuse-plan
        text: { ja: '支払わないと決め、警察に相談する。加えて、図面が公開されたときに取引先と一緒に対応する手順と窓口を先に決める。', en: '' }
        minutes: 150
        category: recover
        points: 120
        refs: [npa-consult, meti-trade-secret]
        gauges: { flame: -10, trust: 10, stamina: -10 }
        setFlags: { refusedRansom: true, victimPlan: true }
        items:
          - { id: p03-c-record, points: 5, axis: record, refs: [npa-consult] }
          - { id: p03-c-order, points: 10, axis: order, refs: [meti-trade-secret] }
          - { id: p03-c-content, points: 5, axis: content, refs: [npa-consult] }
          - { id: p03-c-care, points: 5, axis: care, refs: [meti-trade-secret] }
      - id: p03-ceo-sns
        text: { ja: '支払わないが、社長が個人のSNSで「犯人に屈しない」と強い言葉で発信する。', en: '' }
        minutes: 30
        category: hurt
        points: -60
        refs: [meti-disclosure-guidance]
        gauges: { flame: 15, trust: -5 }
        delayed:
          - { afterPhases: 1, points: -40, gauges: { flame: 15 }, reason: { ja: '攻撃者が社長の投稿に反応し、図面の公開を早めた。', en: '' } }
        items:
          - { id: p03-d-wording, points: -10, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: p03-d-order, points: -10, axis: order, refs: [meti-disclosure-guidance] }

  - id: p04-org
    at: { day: 1, minutes: 540 }
    phase: organize
    sound: { se: [phone_ring, notify_chat] }
    text: { ja: '午前9時。営業本部長が血相を変えて入ってくる。「取引先の二社が、今日の昼でラインを止めると言っています」。情報システムは二人しかいない。一人は育休中だ。', en: '' }
    voices: [v04-boss, v04-field, v04-ok]
    notable:
      - { id: note-line, text: { ja: '月曜9時、取引先二社が同日の昼でラインを止めると連絡してきた。情報システムは実質一人。', en: '' } }
    choices:
      - id: p04-allnight
        text: { ja: '情報システムの二人と経営で、休まずに復旧を進める。', en: '' }
        minutes: 240
        category: hurt
        points: -40
        refs: [ipa-sme-guideline]
        gauges: { stamina: -20, damage: 10, trust: -5 }
        delayed:
          - { afterPhases: 2, points: -40, gauges: { stamina: -15, damage: 10 }, reason: { ja: '疲労から復旧手順の確認漏れが出て、作業をやり直した。', en: '' } }
        items:
          - { id: p04-a-care, points: -10, axis: care, refs: [ipa-sme-guideline] }
          - { id: p04-a-care2, points: -8, axis: care, refs: [ipa-sme-guideline] }
      - id: p04-command
        text: { ja: '対策本部の指揮命令の順序を決め、取引先への窓口を営業本部長に一本化する。', en: '' }
        minutes: 120
        category: maintain
        points: 30
        refs: [meti-csm-guideline, ipa-sme-guideline]
        gauges: { trust: 5, stamina: -5 }
        items:
          - { id: p04-b-order, points: 8, axis: order, refs: [meti-csm-guideline] }
          - { id: p04-b-care, points: 5, axis: care, refs: [ipa-sme-guideline] }
          - { id: p04-b-record, points: 5, axis: record, refs: [jpcert-handling] }
      - id: p04-help
        text: { ja: '指揮命令を決め、窓口を一本化する。加えて、外部のヘルプデスクと派遣の技術者を手配し、現場の交代を組む。', en: '' }
        minutes: 180
        category: recover
        points: 100
        refs: [ipa-sme-guideline, meti-csm-guideline]
        gauges: { stamina: 10, trust: 10, flame: -5 }
        setFlags: { teamRelief: true }
        items:
          - { id: p04-c-order, points: 8, axis: order, refs: [meti-csm-guideline] }
          - { id: p04-c-care, points: 8, axis: care, refs: [ipa-sme-guideline] }
          - { id: p04-c-care2, points: 8, axis: care, refs: [ipa-sme-guideline] }
      - id: p04-wipe
        text: { ja: '復旧を優先し、暗号化された端末を初期化して作り直す。現場の判断を褒める。', en: '' }
        minutes: 120
        category: hurt
        points: -120
        refs: [jpcert-handling]
        gauges: { damage: -10, flame: 15, trust: -15 }
        setFlags: { evidenceLost: true }
        delayed:
          - { afterPhases: 1, points: -60, gauges: { trust: -10, flame: 10 }, reason: { ja: '侵入経路が分からなくなり、調査が振り出しに戻った。', en: '' } }
        items:
          - { id: p04-d-record, points: -15, axis: record, refs: [jpcert-handling] }
          - { id: p04-d-content, points: -10, axis: content, refs: [nist-sp800-61r3] }
          - { id: p04-d-care, points: -5, axis: care, refs: [ipa-sme-guideline] }

  - id: p05-blame
    at: { day: 1, minutes: 960 }
    phase: organize
    sound: { se: [notify_news] }
    text: { ja: '午後4時。取引先の工場が止まった。ニュースは「部品供給の停止で完成車のラインが止まった」と速報している。社内には「うちが悪者にされた」という空気が広がっている。', en: '' }
    voices: [v05-flattery, v05-legal, v05-ok]
    choices:
      - id: p05-shift-blame
        text: { ja: '自社は被害者だと強調し、取引先の接続設定にも原因があったと示唆する。', en: '' }
        minutes: 60
        category: fatal
        points: -250
        refs: [meti-disclosure-guidance]
        gauges: { flame: 25, trust: -25 }
        setFlags: { blamedCustomer: true }
        delayed:
          - { afterPhases: 2, points: -100, gauges: { flame: 20, trust: -15 }, reason: { ja: '責任転嫁だと報じられ、取引先が取引の見直しを始めた。', en: '' } }
        items:
          - { id: p05-a-wording, points: -20, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: p05-a-care, points: -15, axis: care, refs: [meti-csm-guideline] }
          - { id: p05-a-record, points: -10, axis: record, refs: [meti-disclosure-guidance] }
      - id: p05-facts
        text: { ja: '事実だけを伝える。取引先のラインが止まったのは、自社のシステムが止まったためだと認める。', en: '' }
        minutes: 90
        category: maintain
        points: 30
        refs: [meti-disclosure-guidance]
        gauges: { flame: -5, trust: 10, stamina: -5 }
        setFlags: { admittedCause: true }
        items:
          - { id: p05-b-content, points: 8, axis: content, refs: [meti-disclosure-guidance] }
          - { id: p05-b-wording, points: 5, axis: wording, refs: [meti-disclosure-guidance] }
      - id: p05-own
        text: { ja: '事実を認め、影響の大きい取引先の調達担当に直接謝罪する。止まった分をどう埋めるかの案を、明日の朝までに出すと約束する。', en: '' }
        minutes: 150
        category: recover
        points: 100
        refs: [meti-disclosure-guidance, meti-csm-guideline]
        gauges: { flame: -10, trust: 15, stamina: -10 }
        setFlags: { admittedCause: true, recoveryPromise: true }
        items:
          - { id: p05-c-content, points: 8, axis: content, refs: [meti-disclosure-guidance] }
          - { id: p05-c-care, points: 8, axis: care, refs: [meti-csm-guideline] }
          - { id: p05-c-order, points: 8, axis: order, refs: [meti-csm-guideline] }
      - id: p05-wait
        text: { ja: '反論の材料が揃うまで、報道には反応しない。', en: '' }
        minutes: 60
        category: hurt
        points: -60
        refs: [meti-disclosure-guidance]
        gauges: { flame: -5, trust: -10 }
        coward: true
        delayed:
          - { afterPhases: 1, points: -30, gauges: { flame: 15 }, reason: { ja: '反応しないことで「隠している」と受け取られ、批判が噴き出した。', en: '' } }
        items:
          - { id: p05-d-time, points: -10, axis: time, refs: [meti-disclosure-guidance] }
          - { id: p05-d-wording, points: -8, axis: wording, refs: [meti-disclosure-guidance] }

  - id: p06-scope
    at: { day: 2, minutes: 600 }
    phase: investigate
    sound: { se: [notify_chat] }
    text: { ja: '日曜の午前10時。調査会社の報告。侵入口は、取引先とつながるVPN機器の更新漏れ。侵入は三週間前。図面サーバーと、従業員の連絡先が入った共有フォルダに触られた形跡がある。', en: '' }
    voices: [v06-vendor, v06-expert, v06-ok]
    notable:
      - { id: note-scope, text: { ja: '侵入口は取引先とつながるVPN機器の更新漏れ。侵入は三週間前。図面と従業員の連絡先に触られた形跡。', en: '' } }
    choices:
      - id: p06-narrow
        text: { ja: '図面サーバーだけを調べ、従業員の連絡先は対象外にする。', en: '' }
        minutes: 120
        category: hurt
        points: -100
        refs: [nist-sp800-61r3]
        gauges: { damage: 15, trust: -10 }
        items:
          - { id: p06-a-content, points: -10, axis: content, refs: [nist-sp800-61r3] }
          - { id: p06-a-content2, points: -10, axis: content, refs: [nist-sp800-61r3] }
      - id: p06-expand
        text: { ja: '全拠点と全従業員の情報に調査範囲を広げ、第三者委員会を置く。', en: '' }
        minutes: 240
        category: maintain
        points: 30
        refs: [nist-sp800-61r3, meti-csm-guideline]
        gauges: { damage: -10, trust: 10, stamina: -15 }
        setFlags: { thirdParty: true }
        items:
          - { id: p06-b-content, points: 8, axis: content, refs: [nist-sp800-61r3] }
          - { id: p06-b-order, points: 5, axis: order, refs: [meti-csm-guideline] }
      - id: p06-expand-plan
        text: { ja: '範囲を広げ、第三者委員会を置く。加えて、影響を受けた可能性のある従業員と取引先担当者への通知文を先に用意する。', en: '' }
        minutes: 300
        category: recover
        points: 120
        refs: [nist-sp800-61r3, ppc-notify-person]
        gauges: { damage: -10, trust: 15, stamina: -20 }
        setFlags: { thirdParty: true, notifyReady: true }
        items:
          - { id: p06-c-content, points: 8, axis: content, refs: [nist-sp800-61r3] }
          - { id: p06-c-order, points: 8, axis: order, refs: [meti-csm-guideline] }
          - { id: p06-c-care, points: 8, axis: care, refs: [ppc-notify-person] }
          - { id: p06-c-record, points: 5, axis: record, refs: [jpcert-handling] }
      - id: p06-vendor
        text: { ja: 'ベンダーの説明を信じ、機器の設定だけを直す。', en: '' }
        minutes: 60
        category: hurt
        points: -80
        refs: [meti-csm-guideline]
        gauges: { flame: 5, trust: -10 }
        items:
          - { id: p06-d-content, points: -10, axis: content, refs: [meti-csm-guideline] }
          - { id: p06-d-order, points: -8, axis: order, refs: [meti-csm-guideline] }

  - id: p07-check
    at: { day: 2, minutes: 810 }
    phase: investigate
    sound: { se: [notify_chat] }
    text: { ja: '午後1時30分。先月、取引先に提出したセキュリティチェックシートが出てきた。VPN機器の更新、ログの保管、多要素認証。すべて「はい」に丸が付いている。書いたのは、育休中の担当者だ。', en: '' }
    voices: [v07-insider, v07-past, v07-ok]
    notable:
      - { id: note-check, text: { ja: '先月のセキュリティチェックシートは全項目「はい」。実際には更新も多要素認証も未実施だった。', en: '' } }
    choices:
      - id: p07-hide
        text: { ja: 'チェックシートの回答には触れず、調査の対象からも外す。', en: '' }
        minutes: 60
        category: fatal
        points: -250
        refs: [meti-csm-guideline]
        gauges: { flame: 25, trust: -25 }
        setFlags: { hidCheck: true }
        delayed:
          - { afterPhases: 2, points: -100, gauges: { flame: 20, trust: -15 }, reason: { ja: 'チェックシートの実態が報じられ、取引先が一斉に点検を始めた。', en: '' } }
        items:
