        gauges: { flame: 5, trust: -5 }
        items:
          - { id: p15-d-content, points: -6, axis: content, refs: [meti-disclosure-guidance] }
          - { id: p15-d-record, points: -6, axis: record, refs: [meti-disclosure-guidance] }

      - id: p15-publish-share
        text: { ja: '攻撃に使える部分を伏せて全文を公開し、進捗の毎月公表と業界共有を進める。', en: '' }
        explain: { ja: '全文公開、進捗の定期公表、業界への共有までそろっている。自社の再発防止を社会の資産に変える、模範的な判断になる。', en: '' }
        minutes: 240
        category: increase
        points: 400
        fatalAlternate: 50
        refs: [meti-disclosure-guidance, meti-csm-guideline]
        gauges: { flame: -15, trust: 20, stamina: -15 }
        setFlags: { fullDisclosure: true, industryShare: true }
        items:
          - { id: p15-c-content, points: 6, axis: content, refs: [meti-disclosure-guidance] }
          - { id: p15-c-record, points: 6, axis: record, refs: [meti-disclosure-guidance] }
          - { id: p15-c-content2, points: 6, axis: content, refs: [meti-csm-guideline] }
  - id: p16-industry
    at: { day: 31, minutes: 600 }
    phase: after
    sound: { se: [phone_ring] }
    text: { ja: '翌日。業界団体から「同じ手口の注意喚起を出したい。事例を共有してくれないか」と連絡が来た。社内には「余計なことを言うな」という声もある。', en: '' }
    voices: [v16-coward, v16-vendor, v16-ok]
    lesson: { ja: '同じ手口の被害を減らすには、事例の共有が効く。社名を出し、同じ機器を使う取引先へ個別に連絡する。宣伝に使うと売名と受け取られ、出さなければ他社が同じ被害を受ける。共有と販促は分けて考える。', en: '' }
    choices:
      - id: p16-refuse
        text: { ja: '事例は出さず、自社の再発防止だけを進める。他社に手の内を見せないための判断だ。', en: '' }
        explain: { ja: '事例を出さないと、同じ機器を使う他社が同じ被害を受ける。自社を守りたい判断だが、業界全体のリスクを残すことになる。', en: '' }
        minutes: 45
        category: hurt
        points: -30
        refs: [meti-disclosure-guidance]
        gauges: { trust: -5, flame: 5 }
        items:
          - { id: p16-a-content, points: -8, axis: content, refs: [meti-disclosure-guidance] }
          - { id: p16-a-care, points: -6, axis: care, refs: [meti-csm-guideline] }
      - id: p16-anonymous
        text: { ja: '社名を伏せて、手口と対策だけを共有する。攻撃に使える詳細は伏せておく。', en: '' }
        explain: { ja: '社名を伏せた共有は、再発防止に一定の効果がある。自社の関与を示さない分、取引先への説明責任は別に果たす必要がある。', en: '' }
        minutes: 120
        category: recover
        points: 75
        refs: [meti-disclosure-guidance]
        gauges: { trust: 5, stamina: -5 }
        items:
          - { id: p16-b-content, points: 6, axis: content, refs: [meti-disclosure-guidance] }
          - { id: p16-b-record, points: 4, axis: record, refs: [jpcert-handling] }
      - id: p16-named
        text: { ja: '社名を出して事例を共有し、同じ機器を使う取引先には個別に連絡して点検を促す。', en: '' }
        explain: { ja: '社名を出して共有し、同じ機器を使う取引先へ個別に連絡している。業界の再発防止と取引先への責任を同時に果たす、高い判断になる。', en: '' }
        minutes: 180
        category: increase
        points: 400
        refs: [meti-disclosure-guidance, meti-csm-guideline]
        gauges: { trust: 20, flame: -10, stamina: -10 }
        setFlags: { industryShare: true }
        items:
          - { id: p16-c-content, points: 6, axis: content, refs: [meti-disclosure-guidance] }
          - { id: p16-c-care, points: 6, axis: care, refs: [meti-csm-guideline] }
          - { id: p16-c-record, points: 4, axis: record, refs: [jpcert-handling] }
      - id: p16-sell
        text: { ja: '自社のセキュリティ診断サービスとして売り込み、事例を宣伝に使って受注につなげる。', en: '' }
        explain: { ja: '被害を宣伝に使うと、取引先や被害者から売名と受け取られる。営業に結びつけたい意図でも、事実の共有と販促は分けるべきだ。', en: '' }
        minutes: 90
        category: hurt
        points: -30
        refs: [meti-disclosure-guidance]
        gauges: { flame: 15, trust: -15 }
        items:
          - { id: p16-d-care, points: -12, axis: care, refs: [meti-csm-guideline] }
          - { id: p16-d-wording, points: -8, axis: wording, refs: [meti-disclosure-guidance] }

  - id: p17-press
    at: { day: 32, minutes: 600 }
    phase: after
    sound: { se: [shutter] }
    text: { ja: '午前10時。記者会見の直前。広報が「想定問答を作りました。質問は、VPN機器の更新漏れと、チェックシートと、取引先の補償に集中すると思います」と言う。', en: '' }
    voices: [v17-flattery, v17-coward, v17-ok]
    lesson: { ja: '記者会見は、読み上げの場ではなく説明の場である。記録を手元に置き、事実だけを答える。不明点は確認して回答すると言い、期限を守る。質問を制限したり会見を中止したりすると、隠している印象を強める。', en: '' }
    choices:
      - id: p17-short
        text: { ja: '会見を短く打ち切り、質問を三つに制限する。想定外の追及と失言を避ける。', en: '' }
        explain: { ja: '質問を制限すると、核心を避けたと受け取られる。失言を避けたい気持ちは分かるが、制限そのものが不信を招く。', en: '' }
        minutes: 45
        category: hurt
        points: -30
        refs: [meti-disclosure-guidance]
        gauges: { flame: 15, trust: -10 }
        items:
          - { id: p17-a-care, points: -8, axis: care, refs: [meti-disclosure-guidance] }
          - { id: p17-a-care2, points: -6, axis: care, refs: [meti-disclosure-guidance] }
      - id: p17-facts
        text: { ja: '記録を手元に置き、事実だけ答える。不明点は「確認して回答する」と約束する。', en: '' }
        explain: { ja: '記録に基づいて事実だけを答える姿勢は適切で、不明点を曖昧に埋めない。役員全員で想定問答を確認すると、さらに良い。', en: '' }
        minutes: 90
        category: maintain
        points: 30
        refs: [jpcert-handling]
        gauges: { trust: 5, stamina: -10 }
        items:
          - { id: p17-b-wording, points: 6, axis: wording, refs: [jpcert-handling] }
          - { id: p17-b-wording2, points: 6, axis: wording, refs: [meti-disclosure-guidance] }
      - id: p17-cancel
        text: { ja: '会見を中止し、文書での発表だけにする。失言と想定外の混乱のリスクを避ける。', en: '' }
        explain: { ja: '会見を避けると、説明を拒んだ印象を与え、批判が強まる。失言を恐れる気持ちは分かるが、対話の場を閉じるべきではない。', en: '' }
        minutes: 30
        category: hurt
        points: -30
        refs: [meti-disclosure-guidance]
        gauges: { flame: 15, trust: -15 }
        items:
          - { id: p17-d-care, points: -8, axis: care, refs: [meti-disclosure-guidance] }
          - { id: p17-d-order, points: -6, axis: order, refs: [meti-disclosure-guidance] }

      - id: p17-ready
        text: { ja: '役員全員で想定問答を確認し、最初に謝罪を述べる。数字は資料だけを使う。', en: '' }
        explain: { ja: '役員全員で準備し、謝罪から始めて数字を資料に限定している。会見で追及されても説明がぶれず、高い評価につながる。', en: '' }
        minutes: 150
        category: recover
        points: 150
        refs: [meti-csm-guideline, jpcert-handling]
        gauges: { flame: -10, trust: 10, stamina: -10 }
        setFlags: { pressReady: true }
        items:
          - { id: p17-c-order, points: 6, axis: order, refs: [meti-csm-guideline] }
          - { id: p17-c-care, points: 6, axis: care, refs: [meti-csm-guideline] }
          - { id: p17-c-record, points: 6, axis: record, refs: [jpcert-handling] }
drafts:
  first-report:
    title: { ja: '第2報の文案', en: '' }
    slots:
      - id: timing
        label: { ja: '出す時刻', en: '' }
        auto: true
        items:
          - { id: fd-t-72h, when: { withinHours: 72 }, points: 8, axis: time, refs: [meti-disclosure-guidance] }
          - { id: fd-t-96h, when: { withinHours: 96 }, points: 2, axis: time, refs: [meti-disclosure-guidance] }
          - { id: fd-t-late, when: { otherwise: true }, points: -12, axis: time, refs: [meti-disclosure-guidance] }
      - id: scope
        label: { ja: '対象範囲', en: '' }
        options:
          - { id: fd-s-current, text: { ja: '現役の従業員だけを対象として、退職者は外す', en: '' }, explain: { ja: '退職者を外すと、対象の訂正が必要になる。現役だけなら楽に見えるが、漏えいの範囲は雇用の有無で決まらない。', en: '' }, points: -16, axis: content, refs: [ppc-notify-person], delayed: { afterPhases: 1, points: -20, reason: { ja: '対象の訂正が必要になった。', en: '' } } }
          - { id: fd-s-all, text: { ja: '取引先の担当者、従業員、退職者を含める', en: '' }, explain: { ja: '対象を広く取ると、通知の漏れによる訂正を避けられる。範囲を狭めるより手間はかかるが、本人通知の信頼につながる。', en: '' }, points: 8, axis: content, refs: [ppc-notify-person] }
      - id: dates
        label: { ja: '日時の書き方', en: '' }
        options:
          - { id: fd-d-merge, text: { ja: '発生と検知をまとめて書く', en: '' }, explain: { ja: '発生と検知を一つにまとめると、検知の遅れが読み取れなくなる。分けて書く手間を省いた分、説明の精度を落とす。', en: '' }, points: -8, axis: wording, refs: [jpcert-handling] }
          - { id: fd-d-split, text: { ja: '発生と検知の日時を分けて書く', en: '' }, explain: { ja: '発生と検知を分けると、どこで時間を要したかを読み手が追える。初動の評価にもつながる基本の書き方で、加点になる。', en: '' }, points: 4, axis: content, refs: [jpcert-handling] }
      - id: certainty
        label: { ja: '断定の強さ', en: '' }
        options:
          - { id: fd-c-maybe, text: { ja: '「漏えいの可能性」と「確認」を使い分ける', en: '' }, explain: { ja: '確認できたことと可能性のあることを分けると、読み手は確からしさを判断できる。曖昧さを避ける、通知の基本になる。', en: '' }, points: 4, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: fd-c-none, text: { ja: '「漏えいはない」と書いて、可能性に触れない', en: '' }, explain: { ja: '漏えいがないと断言できる根拠がないなら、後に事実が判明して説明が崩れる。不安を下げたい意図でも、断定は避けたい。', en: '' }, points: -16, axis: wording, refs: [ppc-report-scope] }
          - { id: fd-c-confirm, text: { ja: 'すべて「漏えいを確認」と断定して書く', en: '' }, explain: { ja: '不確実な情報を断定すると、後で訂正が必要になり信用を損なう。早く伝えたい気持ちは分かるが、区分を崩す理由にはならない。', en: '' }, points: -12, axis: wording, refs: [meti-disclosure-guidance] }
      - id: leaked
        label: { ja: '漏れた項目', en: '' }
        options:
          - { id: fd-l-vague, text: { ja: '「情報の一部が漏れた」とぼかして書く', en: '' }, explain: { ja: '項目をぼかすと、取引先も従業員も何を警戒すべきか分からない。説明の負担を減らす意図でも、二次被害の予防にはならない。', en: '' }, points: -8, axis: content, refs: [ppc-report-prelim] }
          - { id: fd-l-specific, text: { ja: '図面、従業員の連絡先、取引先名簿を列挙する', en: '' }, explain: { ja: '漏れた可能性のある項目を具体的に挙げると、相手が自分の影響を判断できる。曖昧にぼかすより、通知の実効性が高い。', en: '' }, points: 8, axis: content, refs: [ppc-report-prelim] }
      - id: cause
        label: { ja: '原因の書き方', en: '' }
        options:
          - { id: fd-cz-none, text: { ja: '原因は「調査中」とだけ書いて触れない', en: '' }, explain: { ja: '原因を調査中とだけ書くと、取引先は何を警戒すべきか分からない。分かっている手がかりを出さない理由は乏しい。', en: '' }, points: -6, axis: content, refs: [nist-sp800-61r3] }
          - { id: fd-cz-vpn, text: { ja: '取引先とつながるVPN機器の更新漏れと書く', en: '' }, explain: { ja: '原因を具体的に書くと、取引先が自分の環境を点検する手がかりになる。分かっている範囲で原因を示すことは、再発防止に直結する。', en: '' }, points: 6, axis: content, refs: [nist-sp800-61r3] }
      - id: custaction
        label: { ja: '取引先が今すぐすること', en: '' }
        options:
          - { id: fd-ca-plan, text: { ja: '代替の受発注手順と、注文の窓口を具体的に書く', en: '' }, explain: { ja: '代替手順と窓口を示すと、取引先は止まった受発注を自分で動かせる。相手の実務を助ける、通知の中核になる記載だ。', en: '' }, points: 8, axis: care, refs: [meti-csm-guideline] }
          - { id: fd-ca-none, text: { ja: '取引先が今すべきことには触れず、書かない', en: '' }, explain: { ja: '相手がすべきことを書かないと、通知は状況説明で終わる。何をすればよいか分からないまま、問い合わせが集中する。', en: '' }, points: -12, axis: care, refs: [meti-csm-guideline] }
      - id: empaction
        label: { ja: '従業員が今すぐすること', en: '' }
        options:
          - { id: fd-ea-none, text: { ja: '従業員が今すべきことには触れず、何も書かないままにする', en: '' }, explain: { ja: '従業員の行動を示さないと、不安だけが残り、不審メールへの注意も届かない。社内の二次被害を防ぐ記載が抜けてしまう。', en: '' }, points: -8, axis: care, refs: [ipa-sme-guideline] }
          - { id: fd-ea-plan, text: { ja: 'パスワード変更、多要素認証の設定、不審メールへの注意を書く', en: '' }, explain: { ja: '従業員が取るべき行動を具体的に示すと、二次被害を防げる。通知を読んだ人がその場で動ける、実効性のある記載になる。', en: '' }, points: 8, axis: care, refs: [ipa-sme-guideline] }
      - id: phishing
        label: { ja: '偽通知への注意', en: '' }
        options:
          - { id: fd-p-none, text: { ja: '偽の連絡への注意は書かず、省いてしまう', en: '' }, explain: { ja: '偽の連絡への注意を省くと、攻撃者に付け込む隙を残す。本文の分量を減らす意図でも、この一行は削れない。', en: '' }, points: -8, axis: care, refs: [ppc-notify-person] }
          - { id: fd-p-warn, text: { ja: '電話でパスワードを聞くことはないと書く', en: '' }, explain: { ja: '偽の連絡への注意を先に書くと、漏えい後の詐欺を防げる。個人情報が漏れた場面では、定番の注意喚起になる。', en: '' }, points: 6, axis: care, refs: [ppc-notify-person] }
      - id: contact
        label: { ja: '問い合わせ窓口', en: '' }
        options:
          - { id: fd-w-number, text: { ja: '番号だけを書き、受付時間は書かない', en: '' }, explain: { ja: '番号だけでは、いつつながるのか分からず、問い合わせが集中する。窓口を載せた形にはなるが、実務の助けにはなりにくい。', en: '' }, points: -4, axis: care, refs: [ipa-sme-guideline] }
          - { id: fd-w-full, text: { ja: '専用窓口の番号、受付時間、増員を書く', en: '' }, explain: { ja: '窓口の番号と受付時間、増員まで示すと、問い合わせが集中しても対応できる。相手が連絡先を見つけやすい記載になる。', en: '' }, points: 4, axis: care, refs: [ipa-sme-guideline] }
          - { id: fd-w-none, text: { ja: '問い合わせ窓口は書かず、省いてしまう', en: '' }, explain: { ja: '窓口がないと、取引先も従業員も不安の行き場を失う。通知の目的である安心と行動につながらない。', en: '' }, points: -12, axis: care, refs: [ipa-sme-guideline] }
      - id: next
        label: { ja: '次の報告', en: '' }
        options:
          - { id: fd-n-next, text: { ja: '次の報告の予定を書く', en: '' }, explain: { ja: '次の報告の予定を示すと、相手は待つ間の見通しを持てる。情報が足りない段階でも、連絡の約束が信頼を支える。', en: '' }, points: 2, axis: content, refs: [meti-disclosure-guidance] }
          - { id: fd-n-none, text: { ja: '次の報告の予定は書かない', en: '' }, explain: { ja: '次の連絡がないと、相手は追加の情報をいつ得られるか分からない。問い合わせが集中し、説明の負担も増える。', en: '' }, points: -4, axis: content, refs: [meti-disclosure-guidance] }
      - id: apology
        label: { ja: '謝罪の主語', en: '' }
        options:
          - { id: fd-ap-vendor, text: { ja: '「機器のベンダー」の責任として謝罪する', en: '' }, explain: { ja: '責任をベンダーに寄せると、自社の説明責任が抜け落ちる。協力先への配慮は必要だが、通知の主体は自社である。', en: '' }, points: -8, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: fd-ap-company, text: { ja: '「当社」として謝罪し、責任を明示する', en: '' }, explain: { ja: '自社の責任として謝罪すると、説明の主体が明確になる。原因の説明と謝罪を分けて書くことで、誠実さが伝わる。', en: '' }, points: 4, axis: wording, refs: [meti-disclosure-guidance] }
      - id: excuse
        label: { ja: '前置き', en: '' }
        options:
          - { id: fd-e-advanced, text: { ja: '「高度な攻撃により」と前置きする', en: '' }, explain: { ja: '高度な攻撃という前置きは、自社の落ち度から目を逸らす印象を与える。相手を納得させたい意図でも、原因の説明が薄れる。', en: '' }, points: -8, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: fd-e-none, text: { ja: '言い訳は書かず、事実だけを述べる', en: '' }, explain: { ja: '言い訳を書かないと、事実に集中して読める。説明の信頼を保つ基本で、余計な反発を招かない。', en: '' }, points: 4, axis: wording, refs: [meti-disclosure-guidance] }
      - id: approval
        label: { ja: '社内確認', en: '' }
        options:
          - { id: fd-i-share, text: { ja: '公表前に広報・法務・営業で文案を確認する', en: '' }, explain: { ja: '複数の部署で確認すると、事実誤認や表現の齟齬を防げる。時間はかかるが、対外的な説明の一貫性を保てる。', en: '' }, points: 4, axis: order, refs: [meti-csm-guideline] }
          - { id: fd-i-solo, text: { ja: '社長の判断だけで出し、他部署に確認しない', en: '' }, explain: { ja: '一人の判断で出すと、法務や営業が見落とした表現が残る。速さは出るが、後の訂正のリスクを高める。', en: '' }, points: -8, axis: order, refs: [meti-csm-guideline] }
      - id: record
        label: { ja: '記録', en: '' }
        options:
          - { id: fd-r-none, text: { ja: '公表の記録は残さず、版も管理しない', en: '' }, explain: { ja: '記録がないと、複数の文書が出回ったときにどれが最新か分からない。更新のたびに説明が食い違う原因になる。', en: '' }, points: -6, axis: record, refs: [jpcert-handling] }
          - { id: fd-r-log, text: { ja: '公表した時刻と版を記録し、更新の履歴も残す', en: '' }, explain: { ja: '時刻と版を残すと、どの時点で何を説明したかを後から特定できる。訂正が起きても経緯をたどれる、記録の基本になる。', en: '' }, points: 4, axis: record, refs: [jpcert-handling] }
  customer-brief:
    title: { ja: '取引先説明会の資料', en: '' }
    slots:
      - id: cause
        label: { ja: '原因の書き方', en: '' }
        options:
          - { id: cb-cause-own, text: { ja: '自社のシステム停止が原因だと書く', en: '' }, explain: { ja: '原因を自社の停止として示すと、取引先は影響の起点を理解できる。責任を認める記載が、その後の説明の土台になる。', en: '' }, points: 8, axis: content, refs: [meti-disclosure-guidance] }
          - { id: cb-cause-them, text: { ja: '取引先の接続設定にも原因があると書く', en: '' }, explain: { ja: '相手にも原因があると書くと、責任転嫁と受け取られ、関係が悪化する。事実の確認前に相手の落ち度を示すべきではない。', en: '' }, points: -12, axis: wording, refs: [meti-csm-guideline] }
      - id: schedule
        label: { ja: '復旧の見通し', en: '' }
        options:
          - { id: cb-sch-unknown, text: { ja: '見通しは「調査中」とだけ書く', en: '' }, explain: { ja: '「調査中」だけでは、取引先は先の予定を立てられない。分からないなりに、次の連絡の予定を添えたい。', en: '' }, points: -8, axis: content, refs: [nist-sp800-61r3] }
          - { id: cb-sch-plan, text: { ja: '戻す順序と条件、見込みの日を書く', en: '' }, explain: { ja: '順序と条件、見込みの日を示すと、取引先は生産計画を立てられる。復旧の見通しを具体的に伝える中核の記載になる。', en: '' }, points: 8, axis: content, refs: [nist-sp800-61r3] }
      - id: alternative
        label: { ja: '代替の受発注', en: '' }
        options:
          - { id: cb-alt-plan, text: { ja: 'FAX、手渡し、専用窓口の手順を書く', en: '' }, explain: { ja: '代替の受発注手順を示すと、取引先は止まった業務を動かせる。ラインを止める影響を小さくする、実務的な記載になる。', en: '' }, points: 8, axis: order, refs: [meti-csm-guideline] }
          - { id: cb-alt-none, text: { ja: '代替の受発注手順には触れず、書かない', en: '' }, explain: { ja: '代替手順がないと、取引先は注文の出し方すら分からない。謝罪より先に必要な、実務の情報が欠けてしまう。', en: '' }, points: -12, axis: order, refs: [meti-csm-guideline] }
      - id: compensation
        label: { ja: '補償', en: '' }
        options:
          - { id: cb-comp-amount, text: { ja: '金額だけを書き、基準は示さない', en: '' }, explain: { ja: '金額だけを示すと、なぜその額なのか分からず、不満が残る。根拠の説明がない補償は、かえって不信を招く。', en: '' }, points: -4, axis: care, refs: [meti-csm-guideline] }
          - { id: cb-comp-none, text: { ja: '補償には触れず、何も書かない', en: '' }, explain: { ja: '補償に触れないと、取引先は責任の所在を疑う。まだ決まらない段階でも、窓口と決め方を示すことはできる。', en: '' }, points: -10, axis: care, refs: [meti-csm-guideline] }
          - { id: cb-comp-plan, text: { ja: '補償の窓口と基準の決め方を書く', en: '' }, explain: { ja: '補償の窓口と基準の決め方を示すと、取引先は先の見通しを持てる。金額より、決め方の透明さが納得につながる。', en: '' }, points: 6, axis: care, refs: [meti-csm-guideline] }
      - id: contact
        label: { ja: '連絡先', en: '' }
        options:
          - { id: cb-main, text: { ja: '代表番号だけを書いておく', en: '' }, explain: { ja: '代表番号だけでは、担当にたどり着くまで時間がかかる。窓口を載せた形にはなるが、緊急の連絡には向かない。', en: '' }, points: -4, axis: care, refs: [ipa-sme-guideline] }
          - { id: cb-who, text: { ja: '担当者名と直通番号を書き添える', en: '' }, explain: { ja: '担当者名と直通番号を示すと、取引先は迷わず連絡できる。窓口の実効性を高める、具体的な記載になる。', en: '' }, points: 6, axis: care, refs: [ipa-sme-guideline] }
      - id: apology
        label: { ja: '謝罪', en: '' }
        options:
          - { id: cb-ap-vague, text: { ja: '「ご迷惑をおかけしました」とだけ書く', en: '' }, explain: { ja: '「ご迷惑をおかけしました」だけでは、原因や責任の所在が伝わらない。定型の謝罪は、かえって説明を避けた印象を与える。', en: '' }, points: -6, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: cb-ap-own, text: { ja: '自社の停止が原因だと明記して謝罪する', en: '' }, explain: { ja: '原因を明記して謝罪すると、取引先は何に対する謝罪か理解できる。曖昧な謝罪より、誠実さが伝わる。', en: '' }, points: 6, axis: wording, refs: [meti-disclosure-guidance] }
      - id: record
        label: { ja: '配布の記録', en: '' }
        options:
          - { id: cb-rec-log, text: { ja: '配布した版と日時、渡した相手を記録する', en: '' }, explain: { ja: '配布の版と日時、相手を残すと、どの説明を誰に渡したかを後から確認できる。訂正や追加の連絡に役立つ。', en: '' }, points: 4, axis: record, refs: [jpcert-handling] }
          - { id: cb-rec-none, text: { ja: '配布の記録は残さず、版も管理しない', en: '' }, explain: { ja: '配布の記録がないと、後から「説明していない」と言われても確かめられない。説明会の成果を残す記録が要る。', en: '' }, points: -6, axis: record, refs: [jpcert-handling] }
voices:
  - { id: v01-boss, media: boss, misleading: true, type: boss-pressure, text: { ja: '日曜のうちに戻せるだろ。明日の昼までに間に合わせろ。', en: '' }, trigger: { at: point } }
