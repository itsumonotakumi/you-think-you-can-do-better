          - { id: p16-b-record, points: 5, axis: record, refs: [jpcert-handling] }
      - id: p16-named
        text: { ja: '社名を出して事例を共有し、同じ機器を使う取引先には個別に連絡する。', en: '' }
        minutes: 180
        category: increase
        points: 200
        refs: [meti-disclosure-guidance, meti-csm-guideline]
        gauges: { trust: 20, flame: -10, stamina: -10 }
        setFlags: { industryShare: true }
        items:
          - { id: p16-c-content, points: 8, axis: content, refs: [meti-disclosure-guidance] }
          - { id: p16-c-care, points: 8, axis: care, refs: [meti-csm-guideline] }
          - { id: p16-c-record, points: 5, axis: record, refs: [jpcert-handling] }
      - id: p16-sell
        text: { ja: '自社のセキュリティ診断サービスとして売り込み、事例は宣伝に使う。', en: '' }
        minutes: 90
        category: hurt
        points: -120
        refs: [meti-disclosure-guidance]
        gauges: { flame: 15, trust: -15 }
        items:
          - { id: p16-d-care, points: -15, axis: care, refs: [meti-csm-guideline] }
          - { id: p16-d-wording, points: -10, axis: wording, refs: [meti-disclosure-guidance] }

  - id: p17-press
    at: { day: 32, minutes: 600 }
    phase: after
    sound: { se: [shutter] }
    text: { ja: '午前10時。記者会見は明日。広報が「想定問答を作りました。質問は、VPN機器の更新漏れと、チェックシートと、取引先の補償に集中すると思います」と言う。', en: '' }
    voices: [v17-flattery, v17-coward, v17-ok]
    choices:
      - id: p17-short
        text: { ja: '会見を短く打ち切り、質問を三つに制限する。', en: '' }
        minutes: 45
        category: hurt
        points: -60
        refs: [meti-disclosure-guidance]
        gauges: { flame: 15, trust: -10 }
        items:
          - { id: p17-a-care, points: -10, axis: care, refs: [meti-disclosure-guidance] }
          - { id: p17-a-care2, points: -8, axis: care, refs: [meti-disclosure-guidance] }
      - id: p17-facts
        text: { ja: '記録を手元に置き、事実だけ答える。不明点は「確認して回答する」と言う。', en: '' }
