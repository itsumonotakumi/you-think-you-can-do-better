# No.8 カナメ精工 / セキュリティ担当者ロール
# 情報システム課の主任が、セキュリティを兼任している。専任の部署はない。
# 見えるのは、監視画面、ログ、現場のチャット、課長からの電話。
# 判断ポイント20、細目は choices[].items と drafts の合計で80以上。
estimateMinutes: 40
intro: { ja: 'あなたはカナメ精工の情報システム課の主任で、セキュリティを兼任している。専任のセキュリティ部署はなく、課長の三隅と二人で、工場と取引先のネットワークを見ている。同僚は育休中。土曜の夜、自宅の携帯が鳴った。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-prelim-material
    ref: ppc-report-prelim
    label: { ja: '個人情報保護委員会への速報の材料提出', en: '' }
    points: -50
    doneFlag: prelimMaterialsSent
  - id: dl-final-material
    ref: ppc-report-final-malicious
    label: { ja: '確報の材料提出', en: '' }
    points: -60
    doneFlag: finalMaterialsSent
events:
  - id: ev-a-night
    at: { day: 1, minutes: 180 }
    voices: [v-ev-night]
    gauges: { stamina: -5 }
    sound: { se: [notify_chat] }
    caption: { ja: '深夜。監視画面のアラートが鳴り続けている。', en: '' }
  - id: ev-a-line
    at: { day: 1, minutes: 720 }
    voices: [v-ev-line]
    gauges: { flame: 10 }
    sound: { se: [notify_news] }
    caption: { ja: '取引先の工場が、部品供給の停止でラインを止めた。', en: '' }
  - id: ev-a-check
    at: { day: 9, minutes: 900 }
    voices: [v-ev-check]
    gauges: { flame: 3 }
    caption: { ja: '取引先から、同じ機器を使っていないかの点検依頼が来た。', en: '' }
points:
  - id: a01-alert
    at: { day: 0, minutes: 1275 }
    phase: detect
    sound: { se: [notify_chat] }
    text: { ja: '土曜の午後9時15分。自宅の携帯に監視のアラートが届いた。ファイルサーバーの共有領域で、短時間に大量のファイルが書き換えられている。夜勤の製造現場からも「図面サーバーが開かない」とチャットが来た。', en: '' }
    voices: [v01-field, v01-expert, v01-ok]
    notable:
      - { id: note-alert, text: { ja: '21時15分、ファイルサーバーの大量書き換えを検知。図面サーバーが開かないとの連絡。', en: '' } }
    lesson: { ja: '検知したら、まず被害の拡大を止める隔離と、原因をたどる証拠保全を同時に行う。電源を落とすとメモリの痕跡が消え、様子見は暗号化を進める。検知時刻と操作を記録し、課長への第一報までを初動の一組として扱いたい。', en: '' }
    choices:
      - id: a01-off
        text: { ja: '電源を抜いて暗号化されたサーバーを止め、これ以上広がらないようにしてから考える。', en: '' }
        explain: { ja: '電源を落とすとメモリ上の痕跡が消え、侵入の手口をたどれなくなる。広がりを止めたい判断だが、隔離と証拠保全を分けて考えるべき場面だ。', en: '' }
        minutes: 15
        category: hurt
        points: -90
        refs: [jpcert-handling]
        gauges: { damage: -5, stamina: -5 }
        items:
          - { id: a01-a-record, points: -7, axis: record, refs: [jpcert-handling] }
          - { id: a01-a-content, points: -6, axis: content, refs: [nist-sp800-61r3] }
          - { id: a01-a-time, points: 2, axis: time, refs: [jpcert-handling] }
      - id: a01-isolate
        text: { ja: 'サーバーを切り離してログを保全し、検知時刻を記録して課長へ第一報を入れる。', en: '' }
        explain: { ja: '隔離、証拠保全、時刻の記録、上申の順序がそろっている。担当者として初動でやるべきことを押さえた、評価の高い対応になる。', en: '' }
        minutes: 30
        category: maintain
        points: 25
        refs: [nist-sp800-61r3, jpcert-handling]
        gauges: { damage: -5, trust: 5, stamina: -5 }
        setFlags: { isolateStart: true }
        items:
          - { id: a01-c-time, points: 4, axis: time, refs: [jpcert-handling] }
          - { id: a01-c-order, points: 4, axis: order, refs: [nist-sp800-61r3] }
          - { id: a01-c-record, points: 4, axis: record, refs: [jpcert-handling] }
          - { id: a01-c-content, points: 4, axis: content, refs: [nist-sp800-61r3] }
      - id: a01-wait
        text: { ja: '誤検知かもしれないので、30分だけアラートの推移を見てから動くことにする。', en: '' }
        explain: { ja: '様子を見る間に暗号化が進み、被害が広がる。誤検知を疑う気持ちは分かるが、大量の書き換えは待って確かめる種類の兆候ではない。', en: '' }
        minutes: 30
        category: hurt
        points: -30
        refs: [jpcert-handling]
        gauges: { damage: 10, flame: 5, trust: -5 }
        coward: true
        items:
          - { id: a01-b-time, points: -7, axis: time, refs: [jpcert-handling] }
          - { id: a01-b-record, points: -6, axis: record, refs: [jpcert-handling] }
      - id: a01-vendor
        text: { ja: '監視ベンダーに切り分けを依頼し、結果が来るまで待ってから対応を判断する。', en: '' }
        explain: { ja: 'ベンダーの回答を待つ間に被害が広がる。専門家の判断を仰ぐのはよいが、待つ前にできる隔離と記録を止めてはいけない。', en: '' }
        minutes: 30
        category: hurt
        points: -30
        refs: [meti-csm-guideline]
        gauges: { damage: 5, trust: -5 }
        items:
          - { id: a01-d-time, points: -6, axis: time, refs: [jpcert-handling] }
          - { id: a01-d-order, points: -3, axis: order, refs: [meti-csm-guideline] }

  - id: a02-ransom
    at: { day: 0, minutes: 1305 }
    phase: contain
    sound: { se: [mail_arrive] }
    text: { ja: '午後9時45分。暗号化されたサーバーのデスクトップに、身代金を要求する文書が置かれていた。添付には、取引先に納入している図面の一部らしき画像がある。あなたの業務用メールにも、同じ文面が届いている。', en: '' }
    voices: [v02-attacker, v02-public, v02-ok]
    notable:
      - { id: note-ransom, text: { ja: '21時45分、身代金要求文を確認。取引先の図面らしき画像が添付されていた。', en: '' } }
    lesson: { ja: '身代金の要求文は、手口と連絡先を示す証拠である。返信も削除もせず、本文、ヘッダ、受信時刻、添付を保全する。攻撃者と直接交渉すると要求が上がる。保全したうえで、課長と法務、警察の相談窓口につなぐ。', en: '' }
    choices:
      - id: a02-reply
        text: { ja: '自分で返信して、図面の公開を止めるための交渉を進めようとする。', en: '' }
        explain: { ja: '攻撃者と直接交渉すると、担当者の存在と弱みを知られ、要求がエスカレートする。止めたい気持ちは分かるが、返信は証拠と立場を失う行為になる。', en: '' }
        minutes: 30
        category: hurt
        points: -100
        refs: [npa-consult]
        gauges: { flame: 10, trust: -10 }
        delayed:
          - { afterPhases: 1, points: -12, gauges: { flame: 15 }, reason: { ja: '返信で担当者の存在が伝わり、要求額が上がった。', en: '' } }
        items:
          - { id: a02-a-order, points: -7, axis: order, refs: [npa-consult] }
          - { id: a02-a-record, points: -6, axis: record, refs: [npa-consult] }
      - id: a02-delete
        text: { ja: '気持ちが悪いので、要求文と添付を削除して、見なかったことにする。', en: '' }
        explain: { ja: '要求文と添付は、手口と連絡先を示す重要な証拠になる。気持ちが悪いという理由で消すと、後の調査と警察への相談ができなくなる。', en: '' }
        minutes: 15
        category: fatal
        points: -200
        refs: [jpcert-handling]
        gauges: { flame: 15, trust: -20 }
        setFlags: { destroyedEvidence: true }
        items:
          - { id: a02-b-record, points: -14, axis: record, refs: [jpcert-handling] }
          - { id: a02-b-content, points: -10, axis: content, refs: [npa-consult] }
          - { id: a02-b-wording, points: -7, axis: wording, refs: [meti-disclosure-guidance] }
      - id: a02-post
        text: { ja: '要求文をそのままSNSに投稿して、広く注意を呼びかけようとする。', en: '' }
        explain: { ja: '要求文を公開すると、攻撃者の手口や社内情報が広がり、取引先にも動揺が伝わる。注意を促したい意図でも、公開の範囲は慎重に決めたい。', en: '' }
        minutes: 30
        category: hurt
        points: -100
        refs: [meti-disclosure-guidance]
        gauges: { flame: 20, trust: -10 }
        items:
          - { id: a02-d-wording, points: -10, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: a02-d-care, points: -7, axis: care, refs: [meti-disclosure-guidance] }
          - { id: a02-d-record, points: -6, axis: record, refs: [jpcert-handling] }

      - id: a02-preserve
        text: { ja: '返信せず、本文とヘッダ、添付を保全する。警察に相談する。', en: '' }
        explain: { ja: '返信せず証拠を保全し、警察への相談まで進める対応は適切。担当者として、攻撃者に情報を与えず調査の材料を残せている。', en: '' }
        minutes: 30
        category: maintain
        points: 25
        refs: [jpcert-handling, npa-consult]
        gauges: { flame: -5, trust: 5, stamina: -5 }
        setFlags: { ransomPreserved: true }
        items:
          - { id: a02-c-record, points: 6, axis: record, refs: [jpcert-handling] }
          - { id: a02-c-order, points: 6, axis: order, refs: [npa-consult] }
          - { id: a02-c-time, points: 4, axis: time, refs: [jpcert-handling] }
          - { id: a02-c-care, points: 4, axis: care, refs: [npa-consult] }
  - id: a03-evidence
    at: { day: 0, minutes: 1335 }
    phase: contain
    sound: { se: [notify_chat] }
    text: { ja: '午後10時15分。現場から「再起動していいか」とチャットが来た。暗号化の前に動いていた不審なプログラムの痕跡は、メモリ上にしか残っていない可能性がある。', en: '' }
    voices: [v03-field, v03-expert, v03-ok]
    lesson: { ja: '端末を再起動すると、メモリ上の痕跡が消える。メモリ、ディスク、ネットワークログの順に取得し、ハッシュと時刻を記録する。不審なファイルを削除したり一部だけ持ち出したりすると、証拠としての完全性が失われる。', en: '' }
    choices:
      - id: a03-image
        text: { ja: 'メモリとディスクのイメージを取得し、ハッシュと時刻を記録して隔離する。', en: '' }
        explain: { ja: 'メモリとディスクを取得し、ハッシュと時刻まで記録している。証拠としての完全性を保つ、模範的な初動になる。', en: '' }
        minutes: 90
        category: maintain
        points: 25
        refs: [nist-sp800-61r3, cissp-cbk-secops]
        gauges: { damage: -10, trust: 5, stamina: -10 }
        detail: forensic-plan
        items:
          - { id: a03-b-order, points: 6, axis: order, refs: [nist-sp800-61r3] }
          - { id: a03-b-record, points: 6, axis: record, refs: [cissp-cbk-secops] }
          - { id: a03-b-time, points: 4, axis: time, refs: [jpcert-handling] }
          - { id: a03-b-content, points: 4, axis: content, refs: [nist-sp800-61r3] }
      - id: a03-reboot
        text: { ja: '再起動して様子を見る。いつもの手順どおりに戻せば直ると考えている。', en: '' }
        explain: { ja: '再起動でメモリ上の痕跡が消え、侵入の手口が分からなくなる。いつもの手順で直るという前提が、この場面では通用しない。', en: '' }
        minutes: 30
        category: hurt
        points: -30
        refs: [nist-sp800-61r3]
        gauges: { damage: 10, trust: -5 }
        delayed:
          - { afterPhases: 1, points: -9, gauges: { damage: 10 }, reason: { ja: '再起動でメモリ上の痕跡が消え、侵入の手口が分からなくなった。', en: '' } }
        items:
          - { id: a03-a-record, points: -8, axis: record, refs: [nist-sp800-61r3] }
          - { id: a03-a-content, points: -7, axis: content, refs: [nist-sp800-61r3] }
      - id: a03-delete
        text: { ja: '不審なファイルを削除し、サーバーをきれいにしてから現場に返してしまう。', en: '' }
        explain: { ja: '不審なファイルを消すと、侵入経路と侵害の範囲を示す証拠を失う。早く返したい意図は理解できるが、調査の前提が崩れる。', en: '' }
        minutes: 45
        category: fatal
        points: -200
        refs: [nist-sp800-61r3, jpcert-handling]
        gauges: { damage: 10, flame: 15, trust: -20 }
        setFlags: { destroyedEvidence: true }
        items:
          - { id: a03-c-record, points: -14, axis: record, refs: [jpcert-handling] }
          - { id: a03-c-content, points: -10, axis: content, refs: [nist-sp800-61r3] }
          - { id: a03-c-wording, points: -7, axis: wording, refs: [meti-disclosure-guidance] }
      - id: a03-usb
        text: { ja: '不審なファイルだけをUSBメモリにコピーし、元のファイルは消してしまう。', en: '' }
        explain: { ja: '一部だけをコピーして元を消すと、文脈と完全性が失われ、証拠として使えない。持ち出し先の管理も曖昧になる。', en: '' }
        minutes: 45
        category: fatal
        points: -200
        refs: [cissp-cbk-secops]
        gauges: { damage: 10, flame: 15, trust: -20 }
        setFlags: { destroyedEvidence: true }
        items:
          - { id: a03-d-record, points: -8, axis: record, refs: [cissp-cbk-secops] }
          - { id: a03-d-order, points: -6, axis: order, refs: [nist-sp800-61r3] }

  - id: a04-vpn
    at: { day: 1, minutes: 60 }
    phase: contain
    sound: { se: [notify_chat] }
    text: { ja: '日付が変わって午前1時。VPN機器のログを見ると、取引先とつながる接続点に、更新されていない機器を経由した不審なログインがある。止めれば取引先の受発注が止まる。課長は現場対応で電話に出られない。', en: '' }
    voices: [v04-sales, v04-public, v04-ok]
    notable:
      - { id: note-vpn, text: { ja: '午前1時、取引先とつながるVPN機器に不審なログイン。更新漏れの可能性。', en: '' } }
      - { id: note-link, text: { ja: '接続を止めた時刻と理由、取引先に連絡した相手と時刻を記録した。', en: '' } }
      - { id: note-line, text: { ja: '接続を止めた場合、取引先の受発注とラインに影響する。切った時刻と連絡先を記録する。', en: '' } }
    lesson: { ja: '接続点の不審なログインは、取引先のシステムへの侵入口になりうる。遮断は影響が大きいので、課長への上申と取引先への連絡を同時に進める。切った時刻と理由、代替の連絡手段を記録し、後から説明できるようにする。', en: '' }
    choices:
      - id: a04-keep
        text: { ja: 'つないだまま、自社側のサーバーだけを止めて、取引先の通信は通しておく。', en: '' }
        explain: { ja: '被害が取引先のシステムへ広がる可能性を残す。相手の生産を守りたい判断だが、自社側だけ止めても通信は止まらず、二次被害を招く。', en: '' }
        minutes: 60
        category: hurt
        points: -30
        refs: [nist-sp800-61r3]
        gauges: { damage: 20, flame: 5 }
        delayed:
          - { afterPhases: 1, points: -18, gauges: { damage: 15, trust: -10 }, reason: { ja: '取引先のシステムに、不審な通信が現れた。', en: '' } }
        items:
          - { id: a04-a-content, points: -8, axis: content, refs: [nist-sp800-61r3] }
          - { id: a04-a-order, points: -6, axis: order, refs: [meti-csm-guideline] }
      - id: a04-cut-alone
        text: { ja: '課長に確認せず、自分で判断してVPNを切ってしまう。影響は後で説明する。', en: '' }
        explain: { ja: '遮断自体は被害を抑えるが、無断で切ると取引先の生産と社内の決裁を混乱させる。判断より先に、影響と連絡の段取りが要る。', en: '' }
        minutes: 30
        category: hurt
        points: -30
        refs: [meti-csm-guideline]
        gauges: { damage: -10, trust: -10, stamina: -5 }
        items:
          - { id: a04-b-order, points: -7, axis: order, refs: [meti-csm-guideline] }
          - { id: a04-b-care, points: -6, axis: care, refs: [meti-csm-guideline] }
          - { id: a04-b-content, points: 3, axis: content, refs: [nist-sp800-61r3] }
      - id: a04-cut-report
        text: { ja: '遮断の了承を課長に取り、取引先に電話して時刻と理由を記録する。', en: '' }
        explain: { ja: '上申、遮断、取引先への連絡、記録までそろっている。自分の権限を越えず、影響を最小限にする実務を押さえた高い判断になる。', en: '' }
        minutes: 60
        category: recover
        points: 120
        refs: [nist-sp800-61r3, meti-csm-guideline]
        gauges: { damage: -15, flame: 5, trust: 10, stamina: -5 }
        setFlags: { linkCut: true }
        items:
          - { id: a04-c-order, points: 6, axis: order, refs: [meti-csm-guideline] }
          - { id: a04-c-content, points: 6, axis: content, refs: [nist-sp800-61r3] }
          - { id: a04-c-care, points: 6, axis: care, refs: [meti-csm-guideline] }
          - { id: a04-c-record, points: 4, axis: record, refs: [jpcert-handling] }
      - id: a04-wait-call
        text: { ja: '課長の返事を待ち、切らずに様子を見て、落ち着いてから判断しようと考える。', en: '' }
        explain: { ja: '返事を待つ間に、取引先へ向かう不審な通信が続く。確認を怠りたくない気持ちは分かるが、止める判断まで待つ必要はない。', en: '' }
        minutes: 45
        category: hurt
        points: -30
        refs: [jpcert-handling]
        gauges: { damage: 10, flame: 5 }
        coward: true
        items:
          - { id: a04-d-time, points: -7, axis: time, refs: [jpcert-handling] }
          - { id: a04-d-order, points: -6, axis: order, refs: [meti-csm-guideline] }

  - id: a05-first-report
    at: { day: 1, minutes: 120 }
    phase: contain
    sound: { se: [typing] }
    text: { ja: '午前2時。課長への第一報をまとめる時間。分かったこと、まだ分からないこと、次にやることが混ざっている。社内の連絡網にも、まだ何も流していない。', en: '' }
    voices: [v05-boss, v05-bold, v05-ok]
    notable:
      - { id: note-first-report, text: { ja: '午前2時、課長へ第一報。分かったことと不明点を分けて記録。', en: '' } }
    lesson: { ja: '第一報は、全容を待たず、分かったこと、不明点、次にやることを分けて短時間で出す。口頭だけや個人のSNSは、記録と統制を失う。正確さを待つより、判断できる材料を早く渡すことが初動の質を決める。', en: '' }
    choices:
      - id: a05-wait
        text: { ja: '全容が分かってから報告する。断片の報告で混乱させたくない。', en: '' }
        explain: { ja: '全容を待つ間に、現場は判断の材料を失い、初動が遅れる。混乱を避けたい意図は分かるが、分かったことと不明点を分けて伝えるほうがよい。', en: '' }
        minutes: 120
        category: hurt
        points: -30
        refs: [jpcert-handling]
        gauges: { flame: 10, trust: -10, damage: 5 }
        coward: true
        items:
          - { id: a05-a-time, points: -7, axis: time, refs: [jpcert-handling] }
          - { id: a05-a-record, points: -6, axis: record, refs: [jpcert-handling] }
