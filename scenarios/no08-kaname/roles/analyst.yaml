        refs: [meti-csm-guideline, cissp-cbk-secops]
        gauges: { damage: -15, trust: 20, stamina: -10 }
        setFlags: { preventionPlan: true }
        items:
          - { id: a20-b-content, points: 6, axis: content, refs: [meti-csm-guideline] }
          - { id: a20-b-order, points: 6, axis: order, refs: [cissp-cbk-secops] }
          - { id: a20-b-record, points: 4, axis: record, refs: [ipa-sme-guideline] }
          - { id: a20-b-care, points: 4, axis: care, refs: [meti-csm-guideline] }
          - { id: a20-b-time, points: 10, axis: time, refs: [meti-csm-guideline] }
          - { id: a20-b-wording, points: 10, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: a20-b-people, points: 10, axis: care, refs: [ipa-sme-guideline] }
      - id: a20-budget
        text: { ja: '「予算がないので何もできない」と答えて、検討を止めてしまう。', en: '' }
        explain: { ja: '何も提案しないと、経営は優先順位を判断できない。予算がないなら、効果と順序を示して選択肢を出すのが担当者の役割だ。', en: '' }
        minutes: 45
        category: hurt
        points: -30
        refs: [meti-csm-guideline]
        gauges: { trust: -10 }
        items:
          - { id: a20-d-care, points: -6, axis: care, refs: [meti-csm-guideline] }
          - { id: a20-d-record, points: -5, axis: record, refs: [ipa-sme-guideline] }
drafts:
  incident-note:
    title: { ja: '一次報告メモ', en: '' }
    slots:
      - id: detected
        label: { ja: '検知時刻の書き方', en: '' }
        options:
          - { id: in-t-vague, text: { ja: '「夜」とだけ書いて、時刻は省いておく', en: '' }, explain: { ja: '「夜」だけでは、いつ何が起きたかを後から追えない。書く手間を省いた分、初動の検証ができなくなる。', en: '' }, points: -6, axis: time, refs: [jpcert-handling] }
          - { id: in-t-split, text: { ja: '検知した時刻と、確認した時刻を分けて書く', en: '' }, explain: { ja: '検知と確認を分けると、どこで時間を要したかを読み手が追える。初動の評価にもつながる基本の書き方で、加点になる。', en: '' }, points: 4, axis: time, refs: [jpcert-handling] }
      - id: scope
        label: { ja: '影響範囲', en: '' }
        options:
          - { id: in-s-known, text: { ja: '分かった範囲と、まだ分からない範囲を分けて書く', en: '' }, explain: { ja: '分かった範囲と不明点を分けると、読み手は何を確定として扱えばよいか判断できる。報告の基本になる書き方だ。', en: '' }, points: 6, axis: content, refs: [cissp-cbk-secops] }
          - { id: in-s-all, text: { ja: '「全社が対象」と断定して、範囲を区切らない', en: '' }, explain: { ja: '根拠なく全社と断定すると、後で訂正が必要になり信用を失う。範囲を区切らずに大きく書くほど、説明の責任も重くなる。', en: '' }, points: -10, axis: content, refs: [ppc-report-scope] }
      - id: done
        label: { ja: '実施したこと', en: '' }
        options:
          - { id: in-d-summary, text: { ja: '「初動対応済み」とだけ書いて、実施内容を省く', en: '' }, explain: { ja: '「初動対応済み」だけでは、何をしたのか分からない。要約のようでいて、引き継ぎにも検証にも使えない記載になる。', en: '' }, points: -7, axis: content, refs: [jpcert-handling] }
          - { id: in-d-list, text: { ja: '隔離した機器、止めたアカウント、保全したログを列挙する', en: '' }, explain: { ja: '実施したことを具体的に並べると、読み手は初動の到達点を確認できる。何をしたか分かる記録が、次の判断を支える。', en: '' }, points: 6, axis: order, refs: [nist-sp800-61r3] }
      - id: evidence
        label: { ja: '証拠の扱い', en: '' }
        options:
          - { id: in-e-none, text: { ja: '証拠のことは書かず、触れないでおく', en: '' }, explain: { ja: '証拠の扱いに触れないと、調査の信頼性を説明できない。技術的な詳細を避けたい意図でも、初動の記録は省かないほうがよい。', en: '' }, points: -7, axis: record, refs: [nist-sp800-61r3] }
          - { id: in-e-chain, text: { ja: '保全したデータのハッシュと保管場所を書く', en: '' }, explain: { ja: 'ハッシュと保管場所を示すと、証拠が改変されていないことを後から説明できる。調査の前提を支える記載で、加点になる。', en: '' }, points: 6, axis: record, refs: [cissp-cbk-secops] }
      - id: uncertain
        label: { ja: '未確認事項', en: '' }
        options:
          - { id: in-u-explicit, text: { ja: '未確認事項と、確認する期限を書く', en: '' }, explain: { ja: '未確認事項と期限を示すと、読み手は次の報告を待てる。分からないことを分からないまま、行動の予定につなげる書き方だ。', en: '' }, points: 6, axis: content, refs: [meti-disclosure-guidance] }
          - { id: in-u-omit, text: { ja: '未確認事項には触れず、伏せておく', en: '' }, explain: { ja: '不明点を伏せると、後から分かった事実と食い違い、隠したように見える。分からないことを書くのが、報告の信頼を保つ。', en: '' }, points: -6, axis: content, refs: [meti-disclosure-guidance] }
      - id: next
        label: { ja: '次の連絡', en: '' }
        options:
          - { id: in-n-none, text: { ja: '次の連絡予定は書かないままにする', en: '' }, explain: { ja: '次の連絡がないと、読み手は追加の情報をいつ得られるか分からない。問い合わせが集中し、説明の負担も増える。', en: '' }, points: -3, axis: order, refs: [jpcert-handling] }
          - { id: in-n-scheduled, text: { ja: '次に報告する時刻と相手を書く', en: '' }, explain: { ja: '次の報告の時刻と相手を示すと、読み手は待つ間の見通しを持てる。短い一文でも、連絡の約束が信頼を支える。', en: '' }, points: 4, axis: order, refs: [jpcert-handling] }
      - id: sns
        label: { ja: '外部への発信', en: '' }
        options:
          - { id: in-x-none, text: { ja: '個人のSNSには書かず、黙っておく', en: '' }, explain: { ja: '個人のSNSを避けると、公式の説明と食い違わない。発信の窓口を一本化する、初動の基本になる判断だ。', en: '' }, points: 6, axis: wording, refs: [meti-csm-guideline] }
          - { id: in-x-vague, text: { ja: '個人のSNSに「調査中」と書く', en: '' }, explain: { ja: '個人の投稿は会社の公式説明と食い違い、特定と混乱を招く。早く伝えたい意図でも、発信は会社の窓口に集約したい。', en: '' }, points: -8, axis: wording, refs: [meti-disclosure-guidance] }
      - id: version
        label: { ja: '版の管理', en: '' }
        options:
          - { id: in-v-plain, text: { ja: '版番号を書かず、管理しない', en: '' }, explain: { ja: '版を管理しないと、複数の文書が出回ったときにどれが最新か分からない。更新のたびに説明が食い違う原因になる。', en: '' }, points: -3, axis: record, refs: [cissp-cbk-secops] }
          - { id: in-v-versioned, text: { ja: '版番号と更新時刻を書く', en: '' }, explain: { ja: '版と更新時刻を残すと、どの時点の報告かを後から特定できる。訂正が起きても経緯をたどれる、記録の基本になる。', en: '' }, points: 4, axis: record, refs: [cissp-cbk-secops] }
  forensic-plan:
    title: { ja: '証拠保全の手順', en: '' }
    slots:
      - id: order
        label: { ja: '保全の順序', en: '' }
        options:
          - { id: fp-o-memory, text: { ja: 'メモリ、ディスク、ネットワークログの順に保全する', en: '' }, explain: { ja: '消えやすいメモリから先に保全する順序は適切で、調査の材料を最大限に残せる。証拠保全の手順として評価できる。', en: '' }, points: 7, axis: order, refs: [nist-sp800-61r3] }
          - { id: fp-o-disk, text: { ja: 'ディスクだけをイメージして、他は保全しない', en: '' }, explain: { ja: 'ディスクだけでは、実行中のプログラムや通信の痕跡が残らない。手間を減らしたい意図でも、メモリの取得が抜けると手口を追えない。', en: '' }, points: -7, axis: content, refs: [nist-sp800-61r3] }
      - id: hash
        label: { ja: '完全性の担保', en: '' }
        options:
          - { id: fp-h-none, text: { ja: 'ハッシュは取らず、記録も残さないままにする', en: '' }, explain: { ja: 'ハッシュがないと、証拠の同一性を後から証明できない。取得の手間を省いた分、調査の信頼性を落とす。', en: '' }, points: -10, axis: record, refs: [cissp-cbk-secops] }
          - { id: fp-h-hash, text: { ja: '取得時にハッシュ値を計算し、記録と照合する', en: '' }, explain: { ja: 'ハッシュを計算して照合すると、証拠が改変されていないことを示せる。調査の結論を支える、欠かせない手順になる。', en: '' }, points: 7, axis: record, refs: [cissp-cbk-secops] }
      - id: who
        label: { ja: '実施者と立会い', en: '' }
        options:
          - { id: fp-w-two, text: { ja: '実施者と立会人を記録に残す', en: '' }, explain: { ja: '実施者と立会人を残すと、誰がどの手順で保全したかをたどれる。証拠の管理の連鎖を作る、基本の記録になる。', en: '' }, points: 6, axis: record, refs: [cissp-cbk-secops] }
          - { id: fp-w-solo, text: { ja: '一人で実施し、記録は残さない', en: '' }, explain: { ja: '一人で実施して記録がないと、証拠の扱いを後から説明できない。作業は速いが、管理の連鎖が切れてしまう。', en: '' }, points: -7, axis: record, refs: [jpcert-handling] }
      - id: store
        label: { ja: '保管場所', en: '' }
        options:
          - { id: fp-s-desk, text: { ja: '作業用の共有フォルダに置いたままにしておく', en: '' }, explain: { ja: '共有フォルダに置くと、誰でも書き換えられ、証拠の完全性を保てない。手軽さと引き換えに、調査の前提を失う。', en: '' }, points: -8, axis: order, refs: [cissp-cbk-secops] }
          - { id: fp-s-locked, text: { ja: '書き込み不可の媒体に保存し、施錠した場所で管理する', en: '' }, explain: { ja: '書き込み不可の媒体と施錠管理で、証拠の改変を防げる。取得後の保管まで考えた、実務的な手順になる。', en: '' }, points: 6, axis: order, refs: [cissp-cbk-secops] }
      - id: copy
        label: { ja: '調査用コピー', en: '' }
        options:
          - { id: fp-c-copy, text: { ja: '原本と調査用コピーを分け、コピーだけを解析する', en: '' }, explain: { ja: '原本とコピーを分けると、解析中に原本を汚さずに済む。証拠を守りながら調査を進める、基本の考え方になる。', en: '' }, points: 6, axis: content, refs: [nist-sp800-61r3] }
          - { id: fp-c-original, text: { ja: '原本を直接開いて解析し、コピーを作らない', en: '' }, explain: { ja: '原本を直接開くと、閲覧や更新で証拠が変わってしまう。早く見たい意図でも、コピーを作らずに解析してはいけない。', en: '' }, points: -7, axis: record, refs: [nist-sp800-61r3] }
      - id: notify
        label: { ja: '現場への説明', en: '' }
        options:
          - { id: fp-n-silent, text: { ja: '何も説明せず、端末をそのまま回収する', en: '' }, explain: { ja: '説明なしに端末を回収すると、現場は不安になり、勝手に再起動するおそれもある。保全には協力が要る。', en: '' }, points: -7, axis: care, refs: [ipa-sme-guideline] }
          - { id: fp-n-explain, text: { ja: '保全の理由と、再起動しない理由を現場に説明する', en: '' }, explain: { ja: '理由を説明すると、現場は端末を触らずに待てる。技術的な事情を相手の言葉に変えることで、協力を得られる。', en: '' }, points: 6, axis: care, refs: [ipa-sme-guideline] }
voices:
  - { id: v01-field, media: chat, misleading: true, type: well-meant-field, text: { ja: '現場「電源を抜いておきました。これで止まったはずです」。', en: '' }, trigger: { at: point } }
  - { id: v01-expert, media: vendor, misleading: true, type: fake-expert, text: { ja: 'まず初期化しましょう。暗号化されたファイルは戻りませんよ。', en: '' }, trigger: { at: point } }
  - { id: v01-ok, media: chat, misleading: false, text: { ja: '課長「まず隔離と記録。電源は落とさないでくれ」。', en: '' }, trigger: { at: point } }
  - { id: v01-after, media: sns, misleading: false, text: { ja: '現場を止めたままにして、いつまで調査するつもりだ。', en: '' }, trigger: { at: after, choice: a01-isolate } }
  - { id: v02-attacker, media: attacker, misleading: true, type: attacker-shake, text: { ja: '24時間以内に連絡しなければ、次の公開は図面だ。', en: '' }, trigger: { at: point } }
  - { id: v02-public, media: sns, misleading: true, type: public-opinion, text: { ja: '早く払って止めろ。取引先のラインが止まるぞ。', en: '' }, trigger: { at: point } }
  - { id: v02-ok, media: chat, misleading: false, text: { ja: '課長「返信せず、文書とヘッダを保全して警察の相談窓口へ」。', en: '' }, trigger: { at: point } }
  - { id: v02-after, media: news, misleading: false, text: { ja: '返信もしないのか。図面が公開されたら誰が責任を取る。', en: '' }, trigger: { at: after, choice: a02-preserve } }
  - { id: v03-field, media: chat, misleading: true, type: well-meant-field, text: { ja: '再起動すれば直りますよ。いつもそうしてます。', en: '' }, trigger: { at: point } }
  - { id: v03-expert, media: vendor, misleading: true, type: fake-expert, text: { ja: 'メモリを取っても分かりません。初期化して作り直しましょう。', en: '' }, trigger: { at: point } }
  - { id: v03-ok, media: chat, misleading: false, text: { ja: '課長「メモリ、ディスク、ネットワークログの順で保全して、ハッシュを記録しよう」。', en: '' }, trigger: { at: point } }
  - { id: v03-after, media: sns, misleading: false, text: { ja: '調査を優先して、サーバーを返さないのか。', en: '' }, trigger: { at: after, choice: a03-image } }
  - { id: v04-sales, media: boss, misleading: true, type: boss-pressure, text: { ja: '営業「切るな。明日の昼にラインが止まったら、取引そのものがなくなる」。', en: '' }, trigger: { at: point } }
  - { id: v04-public, media: sns, misleading: true, type: public-opinion, text: { ja: '部品屋の都合で、よその工場を止めるな。', en: '' }, trigger: { at: point } }
  - { id: v04-ok, media: chat, misleading: false, text: { ja: '課長「切る判断は上に上げる。接続点の一覧と影響を、今すぐまとめて」。', en: '' }, trigger: { at: point } }
  - { id: v04-after, media: news, misleading: false, text: { ja: '接続を切っただけで、ラインが戻るわけではない。', en: '' }, trigger: { at: after, choice: a04-cut-report } }
  - { id: v05-boss, media: boss, misleading: true, type: boss-pressure, text: { ja: '課長「確定的なことだけ報告しろ。中途半端な報告は混乱する」。', en: '' }, trigger: { at: point } }
  - { id: v05-bold, media: sns, misleading: true, type: bold-buzz, text: { ja: '個人のSNSに「大変なことになっている」と書けば、社内も動きますよ。', en: '' }, trigger: { at: point } }
  - { id: v05-ok, media: chat, misleading: false, text: { ja: '総務「分かったこと、分かっていないこと、次にやることを分けて」。', en: '' }, trigger: { at: point } }
  - { id: v05-after, media: boss, misleading: false, text: { ja: 'まだ全容が分かっていないのに、上に報告するのか。', en: '' }, trigger: { at: after, choice: a05-report } }
  - { id: v06-vendor, media: vendor, misleading: true, type: vendor-interest, text: { ja: 'キーを止めると取引先の業務が止まります。影響が確認できてからでいいのでは。', en: '' }, trigger: { at: point } }
  - { id: v06-law, media: board, misleading: true, type: law-ish, text: { ja: '契約上、キーの失効は取引先の同意が必要です。今は動かさないほうが安全です。', en: '' }, trigger: { at: point } }
  - { id: v06-ok, media: chat, misleading: false, text: { ja: '課長「侵害されたキーは止めて、切替手順を用意しよう」。', en: '' }, trigger: { at: point } }
  - { id: v06-after, media: vendor, misleading: false, text: { ja: 'キーを止められて、こちらの連携が止まった。説明しろ。', en: '' }, trigger: { at: after, choice: a06-rotate } }
  - { id: v07-expert, media: vendor, misleading: true, type: fake-expert, text: { ja: 'ログがないなら、もう分かりません。調査は打ち切りましょう。', en: '' }, trigger: { at: point } }
  - { id: v07-insider, media: board, misleading: true, type: fake-insider, text: { ja: '中の人だけど、ログは消された。上の指示らしい。', en: '' }, trigger: { at: point } }
  - { id: v07-ok, media: chat, misleading: false, text: { ja: '課長「監視装置とバックアップのログを突き合わせて、分かる範囲を確定しよう」。', en: '' }, trigger: { at: point } }
  - { id: v07-after, media: news, misleading: false, text: { ja: '残ったログをつなぎ合わせても、推測でしょ。', en: '' }, trigger: { at: after, choice: a07-piecing } }
  - { id: v08-boss, media: boss, misleading: true, type: boss-pressure, text: { ja: '課長「お前の確認のことは、調査と関係ない。出さなくていい」。', en: '' }, trigger: { at: point } }
  - { id: v08-coward, media: sns, misleading: true, type: public-opinion, text: { ja: '今さら自分の確認不足を出すのは、責任逃れに見えるぞ。', en: '' }, trigger: { at: point } }
  - { id: v08-ok, media: chat, misleading: false, text: { ja: '総務「回答の根拠を、いまから一つずつ確認し直そう」。', en: '' }, trigger: { at: point } }
  - { id: v08-after, media: sns, misleading: false, text: { ja: '今さらチェックシートを出して、格好をつけている。', en: '' }, trigger: { at: after, choice: a08-admit } }
  - { id: v09-vendor, media: vendor, misleading: true, type: vendor-interest, text: { ja: 'ベンダー「弊社の機器に問題はありません。運用の問題です」。', en: '' }, trigger: { at: point } }
  - { id: v09-flattery, media: chat, misleading: true, type: flattery, text: { ja: 'あなたなら社内だけで何とかできますよ。', en: '' }, trigger: { at: point } }
  - { id: v09-ok, media: chat, misleading: false, text: { ja: '課長「保険の相談窓口と外部調査の見積もりを、今日中に取ろう」。', en: '' }, trigger: { at: point } }
  - { id: v09-after, media: sns, misleading: false, text: { ja: '外部の人間を入れて、中の情報は大丈夫なのか。', en: '' }, trigger: { at: after, choice: a09-contract } }
  - { id: v10-insider, media: board, misleading: true, type: fake-insider, text: { ja: '中の人だけど、本当は十倍漏れている。今すぐ全部公表しろ。', en: '' }, trigger: { at: point } }
  - { id: v10-popular, media: sns, misleading: true, type: popular, text: { ja: '他の担当者の多くは、掲示板の書き込みを全部保存しているそうです。', en: '' }, trigger: { at: point } }
  - { id: v10-ok, media: chat, misleading: false, text: { ja: '課長「掲載されたファイルを保全して、自社のデータと照合しよう」。', en: '' }, trigger: { at: point } }
  - { id: v10-after, media: news, misleading: false, text: { ja: '掲載されたデータを認めないのか。', en: '' }, trigger: { at: after, choice: a10-verify } }
  - { id: v11-law, media: board, misleading: true, type: law-ish, text: { ja: '千人に満たないから、報告はいらないでしょう。', en: '' }, trigger: { at: point } }
