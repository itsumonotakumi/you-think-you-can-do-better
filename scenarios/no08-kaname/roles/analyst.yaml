  - id: a07-logs
    at: { day: 2, minutes: 540 }
    phase: investigate
    sound: { se: [typing] }
    text: { ja: '月曜の午前9時。調査を始めた。侵入は三週間前とみられるが、ログの保存期間は14日で、侵入直後の一週間分は残っていない。バックアップのログも一部だけだ。', en: '' }
