        text: { ja: '社長に第一報を入れ、外部の相談役と警察の相談窓口に連絡する。被害の記録を残す役と、取引先への連絡を分けて決める。', en: '' }
        minutes: 90
        category: recover
        points: 120
        refs: [meti-csm-guideline, jpcert-handling]
        gauges: { flame: -5, trust: 5, stamina: -5 }
