    at: { day: 0, minutes: 1275 }
    phase: detect
    sound: { se: [phone_ring] }
    text: { ja: '土曜の午後9時15分。夜勤の情報システム課長から電話が入る。「サーバーが暗号化されています。身代金を要求する文書が置かれていました」。受発注システムも止まっている。情報システムで動けるのは二人しかいない。', en: '' }
    voices: [v01-ceo, v01-expert, v01-cio]
    notable:
      - { id: note-first, text: { ja: '土曜21時15分、情報システム課長から第一報。サーバーが暗号化され、受発注システムが停止。情報システムは実質二人。', en: '' } }
    choices:
      - id: p01-wait
        text: { ja: '社長の指示を待ち、明朝に担当者を集めてから動く。', en: '' }
        minutes: 120
        category: hurt
        points: -60
        refs: [jpcert-handling]
        gauges: { flame: 10, damage: 15, trust: -5, stamina: 5 }
        coward: true
        setFlags: { delayedCommand: true }
        delayed:
          - { afterPhases: 1, points: -25, gauges: { damage: 10, flame: 10 }, reason: { ja: '誰も指揮を取らないまま夜が明け、初動が丸一日遅れた。', en: '' } }
        items:
          - { id: p01-a-time, points: -10, axis: time, refs: [jpcert-handling] }
          - { id: p01-a-order, points: -8, axis: order, refs: [meti-csm-guideline] }
          - { id: p01-a-record, points: -6, axis: record, refs: [jpcert-handling] }
      - id: p01-report
        text: { ja: '社長と情報システム課長に連絡し、対策本部の招集を上申する。', en: '' }
        minutes: 60
        category: maintain
        points: 25
        refs: [meti-csm-guideline, jpcert-handling]
        gauges: { flame: -5, trust: 5, stamina: -5 }
        setFlags: { commandStarted: true }
