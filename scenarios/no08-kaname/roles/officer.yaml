    voices: [v04-field, v04-expert, v04-cio]
    lesson: { ja: '現場が早く戻したいと思うのは自然だが、初期化は侵入経路と漏えい範囲の証拠を消す。端末を止めずに切り離し、メモリとログを保全する。外部の調査会社への引き継ぎと、保全の担当・時刻の記録まで決めたい。', en: '' }
    choices:
      - id: p04-wipe
