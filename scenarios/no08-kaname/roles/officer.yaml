        explain: { ja: '端末の初期化は侵入経路と漏えい範囲を示す証拠を失わせる。早く戻したい意図は理解できるが、復旧の前提が崩れる。', en: '' }
        minutes: 120
        category: hurt
        points: -80
        refs: [jpcert-handling]
        gauges: { damage: -10, flame: 15, trust: -15 }
