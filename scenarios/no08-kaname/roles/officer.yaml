          - { id: p04-c-order, points: 5, axis: order, refs: [jpcert-handling] }
  - id: p05-org
    at: { day: 1, minutes: 540 }
    phase: organize
    sound: { se: [phone_ring, notify_chat] }
    text: { ja: '午前9時。営業本部長が血相を変えて入ってくる。「取引先の二社が、今日の昼でラインを止めると言っています」。情報システムは三人いて、一人は育休中だ。動けるのは二人しかいない。', en: '' }
    voices: [v05-ceo, v05-sales, v05-pr]
    popular: { choiceId: p05-allnight, percent: 58 }
    notable:
      - { id: note-line, text: { ja: '日曜9時、取引先二社が同日の昼でラインを止めると連絡してきた。情報システムは実質二人。', en: '' } }
    lesson: { ja: '長期化するほど、指揮と作業を一部に集めてはいけない。指揮命令と対外窓口を決め、外部の応援と現場の交代を組み込む。人手が足りないときこそ、休ませる計画が判断の質を保ち、復旧のやり直しを防ぐ。', en: '' }
