# No.8 カナメ精工 / 役員（取締役 生産本部長・情報セキュリティ責任者 兼任）ロール
# 専任のセキュリティ部署がないため、生産本部長が情報セキュリティ責任者を兼ねる。
# 社長への上申と、取引先の調達部門・自部門の現場の間で判断する。
# 判断ポイント19、細目は choices[].items と drafts の合計で80以上。
estimateMinutes: 40
intro: { ja: 'あなたはカナメ精工の取締役 生産本部長、東海林 真紀。専任のセキュリティ部署がないため、情報セキュリティ責任者を兼任している。土曜の午後9時15分、夜勤の情報システム課長から「サーバーが暗号化され、受発注システムが止まった」と電話が入る。社長への報告、取引先のライン、現場の二人だけの情報システム。あなたの判断が始まる。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-ppc-prelim
    ref: ppc-report-prelim
    label: { ja: '本部門分の漏えい等報告（速報）の資料提出', en: '' }
    points: -75
    doneFlag: ppcPrelimFiled
  - id: dl-ppc-final
    ref: ppc-report-final-malicious
    label: { ja: '本部門分の漏えい等報告（確報）の資料提出', en: '' }
    points: -75
    doneFlag: ppcFinalFiled
events:
  - id: ev-line-stop
    at: { day: 1, minutes: 720 }
    voices: [v-ev-line]
    gauges: { flame: 10 }
    sound: { se: [notify_news] }
    caption: { ja: '取引先の工場が、部品供給の停止でラインを止めた。', en: '' }
  - id: ev-paper
    at: { day: 5, minutes: 540 }
    voices: [v-ev-paper]
    gauges: { flame: 5 }
    caption: { ja: '業界紙が「取引先のラインを止めた部品メーカー」と書いた。', en: '' }
  - id: ev-check-request
    at: { day: 9, minutes: 900 }
    voices: [v-ev-check]
    gauges: { flame: 3 }
    caption: { ja: '取引先から、同じ機器を使っていないかの点検依頼が来た。', en: '' }
points:
  - id: p01-call
    at: { day: 0, minutes: 1275 }
    phase: detect
    sound: { se: [phone_ring] }
    text: { ja: '土曜の午後9時15分。夜勤の情報システム課長から電話が入る。「サーバーが暗号化されています。身代金を要求する文書が置かれていました」。受発注システムも止まっている。情報システムで動けるのは二人しかいない。', en: '' }
    voices: [v01-ceo, v01-expert, v01-cio]
    notable:
      - { id: note-first, text: { ja: '土曜21時15分、情報システム課長から第一報。サーバーが暗号化され、受発注システムが停止。情報システムは実質二人。', en: '' } }
    lesson: { ja: '部門の責任者は、自分で抱え込まず、社長への上申と現場の指揮を分けて整える。外部の相談、証拠を残す役、取引先への連絡を同時に決める。現場を自分で見に行くことや明朝まで待つことは、一見慎重でも初動を遅らせる。', en: '' }
    choices:
      - id: p01-wait
        text: { ja: '社長の指示を待ち、明朝に担当者を集めてから動く。夜間の判断は混乱を招くと考える。', en: '' }
        explain: { ja: '夜間の初動を遅らせ、被害の拡大と証拠の散逸を招く。落ち着いて判断したい意図は理解できるが、隔離と記録は待つ理由にならない。', en: '' }
        minutes: 120
        category: hurt
        points: -60
        refs: [jpcert-handling]
        gauges: { flame: 10, damage: 15, trust: -5, stamina: 5 }
        coward: true
        setFlags: { delayedCommand: true }
        delayed:
          - { afterPhases: 1, points: -25, gauges: { damage: 10, flame: 10 }, reason: { ja: '誰も指揮を取らないまま夜が明け、初動が丸一日遅れた。', en: '' } }
        items:
          - { id: p01-a-time, points: -10, axis: time, refs: [jpcert-handling] }
          - { id: p01-a-order, points: -8, axis: order, refs: [meti-csm-guideline] }
          - { id: p01-a-record, points: -6, axis: record, refs: [jpcert-handling] }
      - id: p01-full
        text: { ja: '社長に第一報を入れ、外部と警察に連絡する。記録係と取引先の窓口を分ける。', en: '' }
        explain: { ja: '上申、外部相談、証拠を残す役割、取引先への連絡まで同時に整えている。部門の責任者として初動の全体を押さえた、高い水準の判断になる。', en: '' }
        minutes: 90
        category: recover
        points: 120
        refs: [meti-csm-guideline, jpcert-handling]
        gauges: { flame: -5, trust: 5, stamina: -5 }
        setFlags: { commandStarted: true, evidenceKept: true }
        items:
          - { id: p01-d-time, points: 8, axis: time, refs: [jpcert-handling] }
          - { id: p01-d-order, points: 8, axis: order, refs: [meti-csm-guideline] }
          - { id: p01-d-record, points: 7, axis: record, refs: [jpcert-handling] }
          - { id: p01-d-care, points: 5, axis: care, refs: [ipa-sme-guideline] }

      - id: p01-report
        text: { ja: '社長と情報システム課長に連絡し、対策本部の招集を上申して指揮の所在を決める。', en: '' }
        explain: { ja: '上申と指揮の明確化は適切で、自分の権限を越えた判断を避けている。外部相談や記録の分担まで同時に決めると、さらに評価が上がる。', en: '' }
        minutes: 60
        category: maintain
        points: 25
        refs: [meti-csm-guideline, jpcert-handling]
        gauges: { flame: -5, trust: 5, stamina: -5 }
        setFlags: { commandStarted: true }
        items:
          - { id: p01-b-time, points: 5, axis: time, refs: [jpcert-handling] }
          - { id: p01-b-order, points: 4, axis: order, refs: [meti-csm-guideline] }
          - { id: p01-b-record, points: 4, axis: record, refs: [jpcert-handling] }
      - id: p01-self
        text: { ja: '自分で工場のサーバー室に行き、暗号化された画面を直接確かめて状況を把握する。', en: '' }
        explain: { ja: '当事者が現場で直接確認すると、指揮と記録の担い手が不在になる。状況を把握したい気持ちは分かるが、初動では役割を分けるほうがよい。', en: '' }
        minutes: 90
        category: hurt
        points: -50
        refs: [jpcert-handling]
        gauges: { stamina: -10, trust: -5 }
        items:
          - { id: p01-c-order, points: -8, axis: order, refs: [meti-csm-guideline] }
          - { id: p01-c-care, points: -5, axis: care, refs: [jpcert-handling] }
  - id: p02-link
    at: { day: 0, minutes: 1425 }
    phase: contain
    sound: { se: [phone_ring] }
    text: { ja: '午後11時45分。受発注システムは、取引先三社の生産計画システムとつながっている。接続を切れば、明日の昼には取引先のラインが止まる。切らなければ、被害が取引先に広がる。', en: '' }
    voices: [v02-sales, v02-public, v02-cio]
    notable:
      - { id: note-link, text: { ja: '23時45分、取引先三社の生産計画システムとの接続を遮断するか判断。連絡した時刻と相手を記録する。', en: '' } }
    lesson: { ja: '接続遮断は取引先の生産に直結する。だからこそ、切る判断、理由、代替手段、連絡先を一度にそろえて伝える。黙って切るのも、つないだまま様子を見るのも、相手の計画を狂わせる。決裁と対外連絡を同時に進めたい。', en: '' }
    choices:
      - id: p02-keep
        text: { ja: 'つないだまま、自社側のサーバーだけを止めて、取引先のラインを守る判断をする。', en: '' }
        explain: { ja: '被害が取引先のシステムへ広がる可能性を残す。相手の生産を守りたい判断だが、自社側だけ止めても通信は止まらず、二次被害を招く。', en: '' }
        minutes: 60
        category: hurt
        points: -80
        refs: [nist-sp800-61r3]
        gauges: { damage: 20, flame: 5 }
        delayed:
          - { afterPhases: 1, points: -25, gauges: { damage: 15, trust: -10 }, reason: { ja: '取引先のシステムに、不審な通信が現れた。', en: '' } }
        items:
          - { id: p02-a-content, points: -10, axis: content, refs: [nist-sp800-61r3] }
          - { id: p02-a-order, points: -8, axis: order, refs: [meti-csm-guideline] }
      - id: p02-cut-mail
        text: { ja: '接続を切り、理由と復旧の見通しを取引先三社にメールで一斉に伝え、次の連絡も約束する。', en: '' }
        explain: { ja: '遮断と理由の連絡は押さえているが、代替手順の実務までは踏み込んでいない。取引先の生産を止める以上、今夜の代替手段が要る。', en: '' }
        minutes: 60
        category: maintain
        points: 25
        refs: [meti-csm-guideline]
        gauges: { damage: -10, flame: 5, trust: 5 }
        setFlags: { linkCut: true }
        items:
          - { id: p02-b-order, points: 5, axis: order, refs: [meti-csm-guideline] }
          - { id: p02-b-content, points: 4, axis: content, refs: [meti-csm-guideline] }
      - id: p02-cut-silent
        text: { ja: '接続だけを切り、理由と影響の説明は明日の発表にまとめる。今夜は混乱を避けたい。', en: '' }
        explain: { ja: '断りなく接続を切ると、取引先は原因も復旧の見通しも分からず、生産計画を立てられない。説明を後回しにする分だけ信頼を失う。', en: '' }
        minutes: 45
        category: hurt
        points: -50
        refs: [meti-csm-guideline]
        gauges: { flame: 10, trust: -10 }
        items:
          - { id: p02-d-wording, points: -9, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: p02-d-care, points: -7, axis: care, refs: [meti-csm-guideline] }

      - id: p02-cut-plan
        text: { ja: '接続を切り、取引先の調達担当に電話する。FAXと手渡しの手順を今夜示して記録する。', en: '' }
        explain: { ja: '遮断、電話での連絡、代替手順の即日提供、記録までそろっている。取引先のラインを止める影響を最小限にする実務が高く評価できる。', en: '' }
        minutes: 120
        category: recover
        points: 150
        refs: [meti-csm-guideline, jpcert-handling]
        gauges: { damage: -15, flame: -5, trust: 15, stamina: -10 }
        setFlags: { linkCut: true, alternativePlan: true }
        items:
          - { id: p02-c-time, points: 8, axis: time, refs: [jpcert-handling] }
          - { id: p02-c-order, points: 8, axis: order, refs: [meti-csm-guideline] }
          - { id: p02-c-care, points: 7, axis: care, refs: [meti-csm-guideline] }
          - { id: p02-c-content, points: 5, axis: content, refs: [meti-csm-guideline] }
  - id: p03-ransom
    at: { day: 1, minutes: 180 }
    phase: contain
    sound: { se: [mail_arrive] }
    text: { ja: '午前3時。身代金の要求文には、取引先に納入している図面の一部が添えられていた。「24時間以内に連絡しなければ、次の公開は図面だ」。社長はまだ連絡がつかない。', en: '' }
    voices: [v03-attacker, v03-public, v03-bold, v03-cio]
    lesson: { ja: '身代金の要求では、支払いの可否より先に証拠を守る。支払いは復号も削除も保証せず、交渉が新たな要求を招く。社長と警察に相談し、図面が公開されたときの取引先との手順と窓口を先に決めておきたい。', en: '' }
    choices:
      - id: p03-escalate-plan
        text: { ja: '社長と警察に連絡し、支払わない方針を進言する。公開時の取引先の手順も決める。', en: '' }
        explain: { ja: '支払わない判断、警察への相談、公開時の対応手順までそろえている。取引先と被害を分かち合う準備ができた、高い水準の判断になる。', en: '' }
        minutes: 150
        category: recover
        points: 150
        refs: [npa-consult, meti-trade-secret]
        gauges: { flame: -10, trust: 10, stamina: -10 }
        setFlags: { refusedRansom: true, victimPlan: true }
        items:
          - { id: p03-d-record, points: 6, axis: record, refs: [npa-consult] }
          - { id: p03-d-order, points: 8, axis: order, refs: [meti-trade-secret] }
          - { id: p03-d-content, points: 6, axis: content, refs: [npa-consult] }
          - { id: p03-d-care, points: 5, axis: care, refs: [meti-trade-secret] }

      - id: p03-pay
        text: { ja: '社長に代わって、支払いの交渉を進める。図面の公開を止めるには仕方ないと判断する。', en: '' }
        explain: { ja: '支払っても復号や削除は保証されず、攻撃者との交渉が新たな要求を招く。図面を守りたい気持ちは分かるが、権限を越えた支払いは被害を広げる。', en: '' }
        minutes: 60
        category: fatal
        points: -250
        refs: [npa-consult]
        gauges: { damage: 20, flame: 20, trust: -20 }
        setFlags: { paidRansom: true }
        items:
          - { id: p03-a-record, points: -16, axis: record, refs: [npa-consult] }
          - { id: p03-a-content, points: -14, axis: content, refs: [npa-consult] }
          - { id: p03-a-order, points: -10, axis: order, refs: [meti-csm-guideline] }
      - id: p03-escalate
        text: { ja: '社長と警察の相談窓口に連絡し、支払わない方針を進言して対応を相談する。', en: '' }
        explain: { ja: '支払わない方針の進言と警察への相談は適切で、被害を広げない基本を押さえている。図面が公開された場合の取引先との手順まで決めると、さらに良い。', en: '' }
        minutes: 90
        category: maintain
        points: 30
        refs: [npa-consult]
        gauges: { flame: -5, trust: 5, stamina: -5 }
        setFlags: { refusedRansom: true }
        items:
          - { id: p03-c-record, points: 6, axis: record, refs: [npa-consult] }
          - { id: p03-c-content, points: 5, axis: content, refs: [npa-consult] }
      - id: p03-wait
        text: { ja: '社長の連絡を待ち、この要求のことは誰にも知らせない。夜間の混乱を避けるためだ。', en: '' }
        explain: { ja: '一人で抱えると、判断も証拠の保全も遅れる。社長の判断を待つのは理解できるが、要求文の共有まで止める必要はない。', en: '' }
        minutes: 90
        category: hurt
        points: -50
        refs: [npa-consult]
        gauges: { flame: 10, trust: -10 }
        coward: true
        items:
          - { id: p03-b-time, points: -10, axis: time, refs: [npa-consult] }
          - { id: p03-b-record, points: -8, axis: record, refs: [npa-consult] }
  - id: p04-evidence
    at: { day: 1, minutes: 240 }
    phase: contain
    sound: { se: [notify_chat] }
