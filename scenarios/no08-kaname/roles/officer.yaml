# No.8 カナメ精工 / 役員（取締役 生産本部長・情報セキュリティ責任者 兼任）ロール
# 専任のセキュリティ部署がないため、生産本部長が情報セキュリティ責任者を兼ねる。
# 社長への上申と、取引先の調達部門・自部門の現場の間で判断する。
# 判断ポイント19、細目は choices[].items と drafts の合計で80以上。
estimateMinutes: 40
intro: { ja: 'あなたはカナメ精工の取締役 生産本部長、東海林 真紀。専任のセキュリティ部署がないため、情報セキュリティ責任者を兼任している。土曜の午後9時15分、夜勤の情報システム課長から「サーバーが暗号化され、受発注システムが止まった」と電話が入る。社長への報告、取引先のライン、現場の二人だけの情報システム。あなたの判断が始まる。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-ppc-prelim
    ref: ppc-report-prelim
    label: { ja: '本部門分の漏えい等報告（速報）の資料提出', en: '' }
    points: -75
    doneFlag: ppcPrelimFiled
  - id: dl-ppc-final
    ref: ppc-report-final-malicious
    label: { ja: '本部門分の漏えい等報告（確報）の資料提出', en: '' }
    points: -75
    doneFlag: ppcFinalFiled
events:
  - id: ev-line-stop
    at: { day: 1, minutes: 720 }
    voices: [v-ev-line]
    gauges: { flame: 10 }
    sound: { se: [notify_news] }
    caption: { ja: '取引先の工場が、部品供給の停止でラインを止めた。', en: '' }
  - id: ev-paper
    at: { day: 5, minutes: 540 }
    voices: [v-ev-paper]
    gauges: { flame: 5 }
    caption: { ja: '業界紙が「取引先のラインを止めた部品メーカー」と書いた。', en: '' }
  - id: ev-check-request
    at: { day: 9, minutes: 900 }
    voices: [v-ev-check]
    gauges: { flame: 3 }
    caption: { ja: '取引先から、同じ機器を使っていないかの点検依頼が来た。', en: '' }
points:
