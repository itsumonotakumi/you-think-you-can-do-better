        gauges: { flame: 15, trust: -10 }
        items:
          - { id: p19-a-care, points: -9, axis: care, refs: [meti-disclosure-guidance] }
          - { id: p19-a-care2, points: -7, axis: care, refs: [meti-disclosure-guidance] }
      - id: p19-facts
        text: { ja: '記録を手元に置き、事実だけ答える。不明点は「確認して回答する」と約束する。', en: '' }
        explain: { ja: '記録に基づいて事実だけを答える姿勢は適切で、不明点を曖昧に埋めない。役員全員で想定問答を確認すると、さらに良い。', en: '' }
        minutes: 90
        category: maintain
        points: 30
        refs: [jpcert-handling]
        gauges: { trust: 5, stamina: -10 }
        items:
          - { id: p19-b-wording, points: 7, axis: wording, refs: [jpcert-handling] }
          - { id: p19-b-record, points: 6, axis: record, refs: [jpcert-handling] }
      - id: p19-ready
        text: { ja: '役員全員で想定問答を確認し、最初に謝罪を述べる。数字は資料だけを使う。', en: '' }
        explain: { ja: '役員全員で準備し、謝罪から始めて数字を資料に限定している。会見で追及されても説明がぶれず、高い評価につながる。', en: '' }
        minutes: 150
        category: recover
        points: 150
        refs: [meti-csm-guideline, jpcert-handling]
        gauges: { flame: -10, trust: 10, stamina: -10 }
        setFlags: { pressReady: true }
        items:
          - { id: p19-c-order, points: 8, axis: order, refs: [meti-csm-guideline] }
          - { id: p19-c-care, points: 8, axis: care, refs: [meti-csm-guideline] }
          - { id: p19-c-record, points: 6, axis: record, refs: [jpcert-handling] }
      - id: p19-cancel
        text: { ja: '会見を中止し、文書での発表だけにするよう進言する。失言のリスクを避ける。', en: '' }
        explain: { ja: '会見を避けると、説明を拒んだ印象を与え、批判が強まる。失言を恐れる気持ちは分かるが、対話の場を閉じるべきではない。', en: '' }
        minutes: 30
        category: hurt
        points: -60
        refs: [meti-disclosure-guidance]
        gauges: { flame: 15, trust: -15 }
        items:
          - { id: p19-d-care, points: -9, axis: care, refs: [meti-disclosure-guidance] }
          - { id: p19-d-order, points: -7, axis: order, refs: [meti-csm-guideline] }

drafts:
  customer-brief:
    title: { ja: '取引先説明会の資料', en: '' }
    slots:
      - id: cause
        label: { ja: '原因の書き方', en: '' }
        options:
          - { id: cb-cause-them, text: { ja: '取引先の接続設定にも原因があると書く', en: '' }, explain: { ja: '相手にも原因があると書くと、責任転嫁と受け取られ、関係が悪化する。事実の確認前に相手の落ち度を示すべきではない。', en: '' }, points: -12, axis: wording, refs: [meti-csm-guideline] }
          - { id: cb-cause-own, text: { ja: '自社のVPN機器の更新漏れが原因だと書く', en: '' }, explain: { ja: '原因を自社の更新漏れとして示すと、取引先は影響の起点を理解できる。責任を認める記載が、その後の説明の土台になる。', en: '' }, points: 8, axis: content, refs: [nist-sp800-61r3] }
      - id: schedule
        label: { ja: '復旧の見通し', en: '' }
        options:
          - { id: cb-sch-plan, text: { ja: '戻す順序と条件、見込みの日を書く', en: '' }, explain: { ja: '順序と条件、見込みの日を示すと、取引先は生産計画を立てられる。復旧の見通しを具体的に伝える中核の記載になる。', en: '' }, points: 8, axis: content, refs: [nist-sp800-61r3] }
          - { id: cb-sch-unknown, text: { ja: '見通しは「調査中」とだけ書く', en: '' }, explain: { ja: '「調査中」だけでは、取引先は先の予定を立てられない。分からないなりに、次の連絡の予定を添えたい。', en: '' }, points: -8, axis: content, refs: [nist-sp800-61r3] }
      - id: alternative
        label: { ja: '代替の受発注', en: '' }
        options:
          - { id: cb-alt-none, text: { ja: '代替の受発注手順には触れず、書かない', en: '' }, explain: { ja: '代替手順がないと、取引先は注文の出し方すら分からない。謝罪より先に必要な、実務の情報が欠けてしまう。', en: '' }, points: -12, axis: order, refs: [meti-csm-guideline] }
          - { id: cb-alt-plan, text: { ja: 'FAX、手渡し、専用窓口の手順を書く', en: '' }, explain: { ja: '代替の受発注手順を示すと、取引先は止まった業務を動かせる。ラインを止める影響を小さくする、実務的な記載になる。', en: '' }, points: 8, axis: order, refs: [meti-csm-guideline] }
      - id: compensation
        label: { ja: '補償', en: '' }
        options:
          - { id: cb-comp-amount, text: { ja: '金額だけを書き、基準は説明しない', en: '' }, explain: { ja: '金額だけを示すと、なぜその額なのか分からず、不満が残る。根拠の説明がない補償は、かえって不信を招く。', en: '' }, points: -4, axis: care, refs: [meti-csm-guideline] }
          - { id: cb-comp-plan, text: { ja: '補償の窓口と基準の決め方を書く', en: '' }, explain: { ja: '補償の窓口と基準の決め方を示すと、取引先は先の見通しを持てる。金額より、決め方の透明さが納得につながる。', en: '' }, points: 6, axis: care, refs: [meti-csm-guideline] }
          - { id: cb-comp-none, text: { ja: '補償には触れず、窓口も書かない', en: '' }, explain: { ja: '補償に触れないと、取引先は責任の所在を疑う。まだ決まらない段階でも、窓口と決め方を示すことはできる。', en: '' }, points: -10, axis: care, refs: [meti-csm-guideline] }
      - id: contact
        label: { ja: '連絡先', en: '' }
        options:
          - { id: cb-main, text: { ja: '代表番号だけを書いておく', en: '' }, explain: { ja: '代表番号だけでは、担当にたどり着くまで時間がかかる。窓口を載せた形にはなるが、緊急の連絡には向かない。', en: '' }, points: -4, axis: care, refs: [ipa-sme-guideline] }
          - { id: cb-who, text: { ja: '担当者名と直通番号を書き添える', en: '' }, explain: { ja: '担当者名と直通番号を示すと、取引先は迷わず連絡できる。窓口の実効性を高める、具体的な記載になる。', en: '' }, points: 6, axis: care, refs: [ipa-sme-guideline] }
      - id: apology
        label: { ja: '謝罪', en: '' }
        options:
          - { id: cb-ap-own, text: { ja: '自社の停止が原因だと明記して謝罪する', en: '' }, explain: { ja: '原因を明記して謝罪すると、取引先は何に対する謝罪か理解できる。曖昧な謝罪より、誠実さが伝わる。', en: '' }, points: 6, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: cb-ap-vague, text: { ja: '「ご迷惑をおかけしました」とだけ書く', en: '' }, explain: { ja: '「ご迷惑をおかけしました」だけでは、原因や責任の所在が伝わらない。定型の謝罪は、かえって説明を避けた印象を与える。', en: '' }, points: -6, axis: wording, refs: [meti-disclosure-guidance] }
      - id: record
        label: { ja: '配布の記録', en: '' }
        options:
          - { id: cb-rec-none, text: { ja: '配布の記録は残さず、版も管理しない', en: '' }, explain: { ja: '配布の記録がないと、後から「説明していない」と言われても確かめられない。説明会の成果を残す記録が要る。', en: '' }, points: -6, axis: record, refs: [jpcert-handling] }
          - { id: cb-rec-log, text: { ja: '配布した版と日時、渡した相手を記録する', en: '' }, explain: { ja: '配布の版と日時、相手を残すと、どの説明を誰に渡したかを後から確認できる。訂正や追加の連絡に役立つ。', en: '' }, points: 4, axis: record, refs: [jpcert-handling] }
  board-report:
    title: { ja: '経営会議への第一報', en: '' }
    slots:
      - id: timing
        label: { ja: '提出までの時間', en: '' }
        auto: true
        items:
          - { id: br-t-48h, when: { withinHours: 48 }, points: 8, axis: time, refs: [jpcert-handling] }
          - { id: br-t-60h, when: { withinHours: 60 }, points: 3, axis: time, refs: [jpcert-handling] }
          - { id: br-t-late, when: { otherwise: true }, points: -10, axis: time, refs: [jpcert-handling] }
      - id: facts
        label: { ja: '事実と推測の分け方', en: '' }
        options:
          - { id: br-f-guess, text: { ja: '推測も事実として同じ調子で書く', en: '' }, explain: { ja: '推測を事実と同じ調子で書くと、後の訂正が増え、報告の信頼を損なう。早く結論を出したい意図でも、区分は崩せない。', en: '' }, points: -10, axis: wording, refs: [jpcert-handling] }
          - { id: br-f-split, text: { ja: '確認できた事実と不明点を分けて書く', en: '' }, explain: { ja: '事実と不明点を分けると、経営は何が確定していて何を決めるべきか判断できる。報告の基本になる書き方だ。', en: '' }, points: 8, axis: content, refs: [jpcert-handling] }
      - id: prior
        label: { ja: '先送りの経緯', en: '' }
        options:
          - { id: br-p-own, text: { ja: '半年前の更新稟議を先送りした経緯と自分の判断を書く', en: '' }, explain: { ja: '自分の判断で先送りした経緯を書くと、原因の説明に一貫性が生まれる。責任を明示することが、再発防止の起点になる。', en: '' }, points: 10, axis: record, refs: [meti-csm-guideline] }
          - { id: br-p-omit, text: { ja: '半年前の先送りには触れず、経緯を省いて報告する', en: '' }, explain: { ja: '先送りを省くと、後から事実が分かったときに隠蔽と受け取られる。都合の悪い経緯ほど、早く正確に書く必要がある。', en: '' }, points: -15, axis: record, refs: [meti-csm-guideline], delayed: { afterPhases: 1, points: -20, reason: { ja: '先送りの事実が後から分かり、報告の信頼を失った。', en: '' } } }
      - id: scope
        label: { ja: '影響の範囲', en: '' }
        options:
          - { id: br-s-current, text: { ja: '現役の従業員だけを対象として書く', en: '' }, explain: { ja: '退職者や取引先担当者を外すと、対象の訂正が必要になる。現役だけなら楽に見えるが、漏えいの範囲は雇用の有無で決まらない。', en: '' }, points: -16, axis: content, refs: [ppc-notify-person], delayed: { afterPhases: 1, points: -20, reason: { ja: '対象の訂正が必要になった。', en: '' } } }
          - { id: br-s-all, text: { ja: '取引先の担当者、従業員、退職者を含む', en: '' }, explain: { ja: '対象を広く取ると、通知の漏れによる訂正を避けられる。範囲を狭めるより手間はかかるが、本人通知の信頼につながる。', en: '' }, points: 8, axis: content, refs: [ppc-notify-person] }
      - id: ask
        label: { ja: '経営への要請', en: '' }
        options:
          - { id: br-a-resource, text: { ja: '外部の調査資源と現場の応援を書く', en: '' }, explain: { ja: '必要な資源を具体的に書くと、経営は何を用意すべきか判断できる。要請のない報告は、次の行動につながらない。', en: '' }, points: 5, axis: order, refs: [meti-csm-guideline] }
          - { id: br-a-none, text: { ja: '経営への要請は書かずに省く', en: '' }, explain: { ja: '要請を書かないと、報告を受けた経営は支援の必要性に気づけない。事実の報告だけで終わると、現場は孤立する。', en: '' }, points: -5, axis: order, refs: [meti-csm-guideline] }
      - id: responsibility
        label: { ja: '責任の書き方', en: '' }
        options:
          - { id: br-r-field, text: { ja: '現場と担当者の責任として書き、自分の関与を省く', en: '' }, explain: { ja: '現場に責任を寄せると、決裁した自分の責任が抜け落ちる。再発防止につながらず、社内の不信も招く。', en: '' }, points: -10, axis: wording, refs: [meti-csm-guideline] }
          - { id: br-r-own, text: { ja: '先送りを止められなかった自分の責任を書く', en: '' }, explain: { ja: '自分の責任を明記すると、原因の説明に説得力が生まれる。責任を認めることが、再発防止の議論を前に進める。', en: '' }, points: 8, axis: record, refs: [meti-csm-guideline] }
      - id: next
        label: { ja: '次の報告', en: '' }
        options:
          - { id: br-n-none, text: { ja: '次の報告の予定は書かない', en: '' }, explain: { ja: '次の連絡がないと、経営は追加の情報をいつ得られるか分からない。問い合わせが集中し、説明の負担も増える。', en: '' }, points: -5, axis: content, refs: [meti-disclosure-guidance] }
          - { id: br-n-next, text: { ja: '次の報告の予定を書く', en: '' }, explain: { ja: '次の報告の予定を示すと、経営は待つ間の見通しを持てる。情報が足りない段階でも、連絡の約束が信頼を支える。', en: '' }, points: 3, axis: content, refs: [meti-disclosure-guidance] }
      - id: tone
        label: { ja: '書き出し', en: '' }
        options:
          - { id: br-t-apology, text: { ja: '謝罪と事実を分けて、落ち着いて書く', en: '' }, explain: { ja: '謝罪と事実を分けると、読み手は何を謝罪し何が分かっているかを整理できる。感情と情報を混ぜない書き方が信頼を生む。', en: '' }, points: 5, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: br-t-excuse, text: { ja: '言い訳を先に書き、事実は後に回す', en: '' }, explain: { ja: '言い訳を先に置くと、事実より自己防衛が目立ち、反発を招く。説明の順序を誤ると、内容の正確さも伝わらない。', en: '' }, points: -10, axis: wording, refs: [meti-disclosure-guidance] }
      - id: record
        label: { ja: '記録', en: '' }
        options:
          - { id: br-rec-none, text: { ja: '提出の記録は残さず、版も管理しない', en: '' }, explain: { ja: '記録がないと、複数の文書が出回ったときにどれが最新か分からない。更新のたびに説明が食い違う原因になる。', en: '' }, points: -8, axis: record, refs: [jpcert-handling] }
          - { id: br-rec-log, text: { ja: '提出した時刻と版を記録し、更新も残す', en: '' }, explain: { ja: '時刻と版を残すと、どの時点で何を報告したかを後から特定できる。訂正が起きても経緯をたどれる、記録の基本になる。', en: '' }, points: 5, axis: record, refs: [jpcert-handling] }
      - id: staff
        label: { ja: '現場の負担', en: '' }
        options:
          - { id: br-st-staff, text: { ja: '現場の負担と交代の必要性を書く', en: '' }, explain: { ja: '現場の負担と交代の必要性を書くと、経営は人と時間の配分を判断できる。報告に現場の事情を組み込むことが、再発防止につながる。', en: '' }, points: 5, axis: care, refs: [ipa-sme-guideline] }
          - { id: br-st-none, text: { ja: '現場の負担には触れないままにする', en: '' }, explain: { ja: '現場の負担に触れないと、経営は疲労の蓄積に気づけない。数字だけの報告は、実行できない計画につながる。', en: '' }, points: -5, axis: care, refs: [ipa-sme-guideline] }
voices:
  - { id: v01-ceo, media: boss, misleading: true, type: boss-pressure, text: { ja: '明日の昼までに戻せ。説明は後でいい。', en: '' }, trigger: { at: point } }
  - { id: v01-expert, media: vendor, misleading: true, type: fake-expert, text: { ja: '初期化して作り直すのが一番早いです。明日の昼に間に合わせるなら、それしかありません。', en: '' }, trigger: { at: point } }
  - { id: v01-cio, media: chat, misleading: false, text: { ja: '情報システム課長「電源は落とさず、ログは保全しています」。', en: '' }, trigger: { at: point } }
  - { id: v01-after, media: sns, misleading: false, text: { ja: '役員が現場に来たところで、直るものじゃない。', en: '' }, trigger: { at: after, choice: p01-self } }
  - { id: v02-sales, media: boss, misleading: true, type: boss-pressure, text: { ja: '切るな。明日の昼にラインが止まったら、取引そのものがなくなる。', en: '' }, trigger: { at: point } }
  - { id: v02-public, media: sns, misleading: true, type: public-opinion, text: { ja: '部品屋の都合で、よそのラインを止めるな。', en: '' }, trigger: { at: point } }
  - { id: v02-cio, media: chat, misleading: false, text: { ja: '生産管理「切らないと、こちらの被害が取引先に広がる可能性があります」。', en: '' }, trigger: { at: point } }
  - { id: v02-after, media: news, misleading: false, text: { ja: '接続を切っただけで、ラインが戻るわけではない。', en: '' }, trigger: { at: after, choice: p02-cut-plan } }
  - { id: v03-attacker, media: attacker, misleading: true, type: attacker-shake, text: { ja: '連絡がなければ、次の公開は図面だ。', en: '' }, trigger: { at: point } }
  - { id: v03-public, media: sns, misleading: true, type: public-opinion, text: { ja: 'さっさと払って、取引先のラインを戻せ。', en: '' }, trigger: { at: point } }
  - { id: v03-bold, media: sns, misleading: true, type: bold-buzz, text: { ja: '社長の談話に「絶対に許さない」を入れましょう。バズりますよ。', en: '' }, trigger: { at: point } }
  - { id: v03-cio, media: chat, misleading: false, text: { ja: '法務「支払っても、図面が消える保証はありません。警察に相談しましょう」。', en: '' }, trigger: { at: point } }
  - { id: v03-after, media: news, misleading: false, text: { ja: '図面が公開されたときの対応を先に出すのは、被害を認めたことになるのでは。', en: '' }, trigger: { at: after, choice: p03-escalate-plan } }
  - { id: v04-field, media: chat, misleading: true, type: well-meant-field, text: { ja: '現場の若手が、暗号化された端末を初期化しようとしています。これで復旧が早まります。', en: '' }, trigger: { at: point } }
  - { id: v04-expert, media: vendor, misleading: true, type: fake-expert, text: { ja: 'ログを残しても読めませんよ。さっさと作り直しましょう。', en: '' }, trigger: { at: point } }
  - { id: v04-cio, media: chat, misleading: false, text: { ja: '情報システム課長「電源を切らずに、ネットワークから切り離せます」。', en: '' }, trigger: { at: point } }
  - { id: v04-after, media: sns, misleading: false, text: { ja: '外部の人間を入れて、中の情報は大丈夫なのか。', en: '' }, trigger: { at: after, choice: p04-isolate-external } }
  - { id: v05-ceo, media: boss, misleading: true, type: boss-pressure, text: { ja: 'とにかく現場に人を出せ。説明は後だ。', en: '' }, trigger: { at: point } }
  - { id: v05-sales, media: chat, misleading: true, type: well-meant-field, text: { ja: '現場の若手は、寝なくてもやってくれます。大丈夫です。', en: '' }, trigger: { at: point } }
  - { id: v05-pr, media: chat, misleading: false, text: { ja: '総務「取引先には、いつ、誰から、何を伝えるかを一本にしましょう」。', en: '' }, trigger: { at: point } }
  - { id: v05-after, media: sns, misleading: false, text: { ja: '外部の技術者を入れて、責任は誰が取るのか。', en: '' }, trigger: { at: after, choice: p05-help } }
  - { id: v06-public, media: news, misleading: true, type: public-opinion, text: { ja: '謝罪より復旧だ。頭を下げる時間があるなら手を動かせ。', en: '' }, trigger: { at: point } }
  - { id: v06-flattery, media: chat, misleading: true, type: flattery, text: { ja: 'あなたが出れば場は収まります。資料はいりません。', en: '' }, trigger: { at: point } }
