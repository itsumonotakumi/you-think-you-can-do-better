    text: { ja: '午前8時。対策本部の机が並んだ。情報システムは三人いて、一人は育休中だ。動けるのは二人しかいない。誰が指揮を執り、誰が記録し、誰が取引先と連絡するか。まだ決めていない。', en: '' }
    voices: [v04-flattery, v04-public, v04-ok]
    lesson: { ja: '長期化するほど、指揮と作業を一人に集めてはいけない。役割を分け、指揮の代行を決め、判断の時刻と理由を短い間隔で残す。人手が足りないときこそ、記録係を置くことが後の説明と引き継ぎを支える。', en: '' }
    choices:
      - id: p04-solo
