          - { id: p20-b-wording, points: -8, axis: wording, refs: [meti-disclosure-guidance] }
      - id: p20-apology
        text: { ja: '謝罪と公表済みの内容だけを読み、質問は最小限にして会見を手短に終える。', en: '' }
        explain: { ja: '謝罪と公表済みの内容にとどめる対応は無難だが、判断の根拠や不明点の説明が足りない。記録を示すと、説明の説得力が増す。', en: '' }
        minutes: 90
        category: maintain
        points: 25
        refs: [meti-disclosure-guidance]
        gauges: { trust: 5, stamina: -5 }
