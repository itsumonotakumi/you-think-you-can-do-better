    text: { ja: '午前10時。会見の十分前。手元には、遮断を決めた時刻、取引先に連絡した相手、チェックシートの訂正、復旧の条件が並んでいる。広報が「どこまで話しますか」と聞いてくる。', en: '' }
    voices: [v20-boss, v20-public, v20-ok]
    lesson: { ja: '会見では、判断の時刻と根拠、不明な点、回答の期限を順に示す。チェックシートや通知の遅れから目を逸らすと、後から判明して説明が崩れる。未確定の数字を断定せず、記録に基づいて話したい。', en: '' }
    choices:
      - id: p20-hide
        text: { ja: 'チェックシートと通知の遅れには触れず、復旧が進んだ話だけをして会見を終える。', en: '' }
        explain: { ja: '都合の悪い事実を外すと、後から報道で判明して説明が崩れる。復旧を伝えたい意図でも、隠した事実は責任を重くする。', en: '' }
        minutes: 60
