          - { id: p02-c-order, points: 6, axis: order, refs: [meti-csm-guideline] }
          - { id: p02-c-care, points: 6, axis: care, refs: [meti-csm-guideline] }
          - { id: p02-c-content, points: 4, axis: content, refs: [meti-csm-guideline] }
  - id: p03-ransom
    at: { day: 1, minutes: 180 }
    phase: contain
    sound: { se: [mail_arrive] }
    text: { ja: '午前3時。身代金の要求文には、取引先に納入している図面の一部が添えられていた。「支払わなければ、次の公開は図面だ」。現場からは「初期化して作り直したい」と声が上がっている。', en: '' }
    voices: [v03-attacker, v03-field, v03-ok]
    lesson: { ja: '身代金の要求では、支払いの可否より先に証拠を守る。端末の初期化は侵入経路も漏えい範囲も消す。保全の範囲を広げ、取得の担当と時刻を記録し、警察への相談を並行させる。支払いは復号も削除も保証しない。', en: '' }
    choices:
      - id: p03-preserve-chain
        text: { ja: '影響が疑われる端末も同じ手順で保全し、取得の担当と時刻を記録する。警察への相談も同時に進める。', en: '' }
        explain: { ja: '保全の範囲を広げ、管理の連鎖を記録し、警察への相談まで同時に進めている。後の調査と説明の土台がそろう、模範的な判断になる。', en: '' }
        minutes: 150
        category: recover
        points: 150
        refs: [nist-sp800-61r3, npa-consult]
        gauges: { damage: -10, flame: -5, trust: 10, stamina: -20 }
        setFlags: { evidencePreserved: true, evidenceChain: true, policeConsult: true }
