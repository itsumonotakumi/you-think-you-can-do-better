          - { id: p20-a-wording, points: -12, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: p20-a-care, points: -8, axis: care, refs: [meti-csm-guideline] }
      - id: p20-records
        text: { ja: '記録を手元に置き、判断の時刻と根拠、不明な点と回答の期限を、順に示す。', en: '' }
        explain: { ja: '時刻と根拠、不明点、回答期限を順に示すと、説明に一貫性が生まれる。記録を根拠にする姿勢が、会見の信頼を支える。', en: '' }
        minutes: 150
        category: recover
        points: 150
        refs: [jpcert-handling, meti-disclosure-guidance]
        gauges: { trust: 15, flame: -10, stamina: -10 }
        setFlags: { pressReady: true }
        items:
          - { id: p20-d-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: p20-d-wording, points: 8, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: p20-d-care, points: 6, axis: care, refs: [meti-disclosure-guidance] }
      - id: p20-numbers
        text: { ja: 'まだ確定していない件数を「確定」として読み上げ、数字の説得力で押し切る。', en: '' }
        explain: { ja: '未確定の件数を断定すると、後で訂正が必要になり信用を失う。明確に伝えたい意図でも、数字は確定度とセットで示すべきだ。', en: '' }
        minutes: 45
