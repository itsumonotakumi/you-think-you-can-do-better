drafts:
  tech-factsheet:
    title: { ja: '技術ファクトシート', en: '' }
    slots:
      - id: timing
        label: { ja: '出す時刻', en: '' }
        auto: true
        items:
          - { id: tf-t-72h, when: { withinHours: 72 }, points: 8, axis: time, refs: [ppc-report-prelim] }
          - { id: tf-t-96h, when: { withinHours: 96 }, points: 2, axis: time, refs: [ppc-report-prelim] }
          - { id: tf-t-late, when: { otherwise: true }, points: -12, axis: time, refs: [ppc-report-prelim] }
      - id: confirmed
        label: { ja: '確認できた事実', en: '' }
        options:
          - { id: tf-c-merge, text: { ja: '発生と検知をまとめて書く', en: '' }, explain: { ja: '発生と検知を一つにまとめると、検知の遅れが読み取れなくなる。分けて書く手間を省いた分、説明の精度を落とす。', en: '' }, points: -8, axis: wording, refs: [jpcert-handling] }
          - { id: tf-c-time, text: { ja: '発生と検知の日時を分けて書く', en: '' }, explain: { ja: '発生と検知を分けると、どこで時間を要したかを読み手が追える。初動の評価にもつながる基本の書き方で、加点になる。', en: '' }, points: 5, axis: content, refs: [jpcert-handling] }
      - id: uncertain
        label: { ja: '不確実な点の書き方', en: '' }
        options:
          - { id: tf-u-split, text: { ja: '「確認」と「可能性」を明確に分けて書く', en: '' }, explain: { ja: '確認できたことと可能性のあることを分けると、読み手は確からしさを判断できる。曖昧さを避ける、通知の基本になる。', en: '' }, points: 10, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: tf-u-omit, text: { ja: '不確実な点は書かず、空欄のままにする', en: '' }, explain: { ja: '不明点を省くと、後から分かった事実と食い違い、隠したように見える。分からないことを分からないと書くのが基本になる。', en: '' }, points: -10, axis: wording, refs: [ppc-report-prelim] }
          - { id: tf-u-confirm, text: { ja: 'すべて「確認」と断定し、迷いを書かない', en: '' }, explain: { ja: '不確実な情報を断定すると、後で訂正が必要になり信用を損なう。早く伝えたい気持ちは分かるが、区分を崩す理由にはならない。', en: '' }, points: -15, axis: wording, refs: [meti-disclosure-guidance] }
      - id: scope
        label: { ja: '対象範囲', en: '' }
        options:
          - { id: tf-s-current, text: { ja: '現役の従業員だけを対象として書く', en: '' }, explain: { ja: '退職者や取引先担当者を外すと、対象の訂正が必要になる。現役だけなら楽に見えるが、漏えいの範囲は雇用の有無で決まらない。', en: '' }, points: -20, axis: content, refs: [ppc-notify-person], delayed: { afterPhases: 1, points: -20, reason: { ja: '対象の訂正が必要になった。', en: '' } } }
          - { id: tf-s-all, text: { ja: '取引先の担当者、従業員、退職者を含む', en: '' }, explain: { ja: '対象を広く取ると、通知の漏れによる訂正を避けられる。範囲を狭めるより手間はかかるが、本人通知の信頼につながる。', en: '' }, points: 10, axis: content, refs: [ppc-notify-person] }
      - id: exposure
        label: { ja: '漏れた可能性のある項目', en: '' }
        options:
          - { id: tf-e-list, text: { ja: '図面、従業員の連絡先、取引先名簿を列挙する', en: '' }, explain: { ja: '漏れた可能性のある項目を具体的に挙げると、相手が自分の影響を判断できる。曖昧にぼかすより、通知の実効性が高い。', en: '' }, points: 10, axis: content, refs: [ppc-report-prelim] }
          - { id: tf-e-vague, text: { ja: '「情報の一部が漏れた」とぼかして書く', en: '' }, explain: { ja: '項目をぼかすと、取引先も従業員も何を警戒すべきか分からない。説明の負担を減らす意図でも、二次被害の予防にはならない。', en: '' }, points: -10, axis: content, refs: [ppc-report-prelim] }
      - id: evidence
        label: { ja: '証拠保全の記載', en: '' }
        options:
          - { id: tf-v-none, text: { ja: '証拠保全の記載はせず、調査に触れない', en: '' }, explain: { ja: '証拠保全に触れないと、調査の信頼性を説明できない。技術的な詳細を避けたい意図でも、初動の記録は省かないほうがよい。', en: '' }, points: -8, axis: record, refs: [jpcert-handling] }
          - { id: tf-v-hash, text: { ja: '取得したイメージのハッシュ値と保管場所を書く', en: '' }, explain: { ja: 'ハッシュ値と保管場所を示すと、証拠が改変されていないことを後から説明できる。調査の前提を支える記載で、加点になる。', en: '' }, points: 10, axis: record, refs: [cissp-cbk-secops] }
      - id: retention
        label: { ja: 'ログの欠損', en: '' }
        options:
          - { id: tf-r-gap, text: { ja: 'VPN機器のログが短く、欠損した期間を明記する', en: '' }, explain: { ja: 'ログの欠損を明記すると、調査の限界を正直に示せる。分からない期間があることを隠さない姿勢が、後の説明を支える。', en: '' }, points: 8, axis: content, refs: [nist-sp800-61r3] }
          - { id: tf-r-hide, text: { ja: 'ログの欠損には触れず、完全な記録として書く', en: '' }, explain: { ja: '欠損を隠すと、後から侵入経路を説明できない理由が分からなくなる。都合の悪い事実ほど、早く正確に書く必要がある。', en: '' }, points: -15, axis: record, refs: [jpcert-handling] }
      - id: decision
        label: { ja: '経営への決裁依頼', en: '' }
        options:
          - { id: tf-d-none, text: { ja: '経営への決裁依頼は書かず、報告で終える', en: '' }, explain: { ja: '決裁の依頼がないと、報告を受けた側は何を決めるのか分からない。情報は足りていても、次の行動につながらない。', en: '' }, points: -8, axis: order, refs: [meti-csm-guideline] }
          - { id: tf-d-ask, text: { ja: '遮断の継続と公表の時刻を決めてほしいと書く', en: '' }, explain: { ja: '経営に判断を求める項目を具体的に書くと、上申が止まらない。事実の報告で終わらせず、決めてほしいことを添えるのが要点。', en: '' }, points: 8, axis: order, refs: [meti-csm-guideline] }
      - id: contact
        label: { ja: '技術窓口', en: '' }
        options:
          - { id: tf-w-24h, text: { ja: '情シスの直通番号と夜間の受付を書く', en: '' }, explain: { ja: '夜間も届く窓口を示すと、取引先が異常に気づいたときに連絡できる。代表番号だけより、初動の連絡が早くなる。', en: '' }, points: 8, axis: care, refs: [ppc-notify-person] }
          - { id: tf-w-main, text: { ja: '代表番号だけを書き、夜間の窓口は書かない', en: '' }, explain: { ja: '代表番号だけでは、夜間や休日に技術の担当へ届かない。窓口を載せた形にはなるが、実際の連絡には時間がかかる。', en: '' }, points: -5, axis: care, refs: [meti-csm-guideline] }
      - id: version
        label: { ja: '版の管理', en: '' }
        options:
          - { id: tf-x-none, text: { ja: '版番号を書かず、更新の記録も残さない', en: '' }, explain: { ja: '版を管理しないと、複数の文書が出回ったときにどれが最新か分からない。更新のたびに説明が食い違う原因になる。', en: '' }, points: -8, axis: record, refs: [jpcert-handling] }
          - { id: tf-x-version, text: { ja: '版番号と確定時刻を書き、以後の変更も記録する', en: '' }, explain: { ja: '版と確定時刻を残すと、どの時点の説明かを後から特定できる。訂正が起きても経緯をたどれるため、記録の基本になる。', en: '' }, points: 8, axis: record, refs: [jpcert-handling] }
  recovery-plan:
    title: { ja: '復旧計画', en: '' }
    slots:
      - id: clean
        label: { ja: 'クリーンな環境', en: '' }
        options:
          - { id: rp-c-reuse, text: { ja: '既存の環境をそのまま使い、検証は省略する', en: '' }, explain: { ja: '既存環境の再利用は早いが、残った設定や認証情報が侵入口になりうる。時短の意図はあっても、再発のリスクを残す。', en: '' }, points: -15, axis: content, refs: [nist-sp800-61r3] }
          - { id: rp-c-new, text: { ja: '新規に構築し、イメージを検証してから戻す', en: '' }, explain: { ja: '新規構築は手間がかかるが、侵入に使われた環境を持ち越さない。検証を挟むことで、再開後の再感染を減らせる。', en: '' }, points: 10, axis: content, refs: [nist-sp800-61r3] }
      - id: backup
        label: { ja: 'バックアップの検証', en: '' }
        options:
          - { id: rp-b-test, text: { ja: '復元テストと整合性の確認をする', en: '' }, explain: { ja: '復元テストをすると、戻した後に動かない箇所を事前に見つけられる。バックアップの存在だけで安心せず、戻せることを確かめる。', en: '' }, points: 10, axis: content, refs: [cissp-cbk-secops] }
          - { id: rp-b-use, text: { ja: '検証をせずに、バックアップから戻す', en: '' }, explain: { ja: '検証せずに戻すと、壊れたバックアップや侵害前の状態に気づけない。復旧を急ぐほど、戻した後の確認が要る。', en: '' }, points: -10, axis: content, refs: [nist-sp800-61r3] }
      - id: creds
        label: { ja: '資格情報', en: '' }
        options:
          - { id: rp-k-some, text: { ja: '分かっている資格情報だけを変え、残りはそのまま使う', en: '' }, explain: { ja: '分かった分だけ変えると、気づいていない資格情報が残る。被害を狭く見積もるほど、再侵入の余地を残す。', en: '' }, points: -10, axis: order, refs: [cissp-cbk-secops] }
          - { id: rp-k-all, text: { ja: 'VPN証明書、管理者パスワード、APIキーを全て失効し再発行する', en: '' }, explain: { ja: '侵害後に資格情報を残すと、同じ経路で再侵入される。失効と再発行は手間だが、復旧の前提として欠かせない。', en: '' }, points: 10, axis: order, refs: [cissp-cbk-secops] }
      - id: monitor
        label: { ja: '監視', en: '' }
        options:
          - { id: rp-m-24h, text: { ja: '強化監視の期間と、異常時の基準を決める', en: '' }, explain: { ja: '監視の期間と基準を決めると、再開後に何を見るのかが明確になる。通常に戻す前に、変化を捉える体制を整えたい。', en: '' }, points: 8, axis: order, refs: [nist-sp800-61r3] }
          - { id: rp-m-normal, text: { ja: '通常の監視体制に戻し、強化は行わない', en: '' }, explain: { ja: '再開直後に通常監視へ戻すと、再侵入の兆候を見逃しやすい。負担を下げたい意図は分かるが、しばらくは強化が必要になる。', en: '' }, points: -10, axis: content, refs: [nist-sp800-61r3] }
      - id: sequence
        label: { ja: '再開の順番', en: '' }
        options:
          - { id: rp-s-all, text: { ja: '社内も取引先も区別せず、一斉に戻す', en: '' }, explain: { ja: '一斉再開は速いが、異常が出たときに止める範囲が広い。復旧の速さと引き換えに、切り分けの手がかりを失う。', en: '' }, points: -10, axis: order, refs: [nist-sp800-61r3] }
          - { id: rp-s-step, text: { ja: '社内、限定した取引先、全体の順に戻す', en: '' }, explain: { ja: '段階的に戻すと、問題が出た範囲を限定して止められる。一斉再開より時間はかかるが、影響を抑えながら確かめられる。', en: '' }, points: 8, axis: order, refs: [nist-sp800-61r3] }
      - id: rollback
        label: { ja: '切り戻しの条件', en: '' }
        options:
          - { id: rp-r-rule, text: { ja: '異常を検知したら自動で止める条件を書く', en: '' }, explain: { ja: '止める条件を先に決めておくと、再開後に異常が出ても迷わず戻せる。判断を人に委ねない仕組みが、被害の拡大を防ぐ。', en: '' }, points: 8, axis: content, refs: [cissp-cbk-secops] }
          - { id: rp-r-none, text: { ja: '切り戻しの条件は決めず、運用に任せる', en: '' }, explain: { ja: '切り戻しの条件がないと、異常が出ても止める判断が遅れる。再開の手順だけ整えても、戻す準備が抜けてしまう。', en: '' }, points: -8, axis: content, refs: [cissp-cbk-secops] }
      - id: verify
        label: { ja: '外部の検証', en: '' }
        options:
          - { id: rp-v-self, text: { ja: '自社の確認だけで判断し、外部は入れない', en: '' }, explain: { ja: '自社だけで判断すると、見落としをそのまま持ち越す。内部の事情は分かっても、客観的な確認にはならない。', en: '' }, points: -8, axis: record, refs: [cissp-cbk-secops] }
