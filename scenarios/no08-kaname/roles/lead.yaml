# No.8 カナメ精工 / セキュリティ部門長（CSIRTリーダー）ロール
# 専任のセキュリティ部署がないため、生産技術部長が情報セキュリティ責任者を兼務する。
# 判断ポイント20、細目は choices[].items と drafts の合計で80以上。
# 視点: 技術の事実と経営の意向の両方を見て、封じ込め・証拠保全・上申・復旧をつなぐ。
estimateMinutes: 45
intro: { ja: 'あなたはカナメ精工の生産技術部長で、情報セキュリティ責任者を兼務している。専任のセキュリティ部署はなく、情報システム課の二人と総務の兼任メンバーで社内CSIRTを組んでいる。土曜の午後9時15分、夜勤の情報システム課長から電話が入る。自社が止まれば、取引先のラインも止まる。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-ppc-prelim
    ref: ppc-report-prelim
    label: { ja: '個人情報保護委員会への速報', en: '' }
    points: -150
    doneFlag: ppcPrelimFiled
events:
  - id: ev-night
    at: { day: 1, minutes: 30 }
    voices: [v-ev-night]
    gauges: { stamina: -5 }
    caption: { ja: '現場から「このまま朝まで起きています」と連絡が入る。', en: '' }
  - id: ev-line-stop
    at: { day: 1, minutes: 720 }
    voices: [v-ev-line]
    gauges: { flame: 10 }
    sound: { se: [notify_news] }
    caption: { ja: '取引先の工場が、部品供給の停止でラインを止めた。', en: '' }
  - id: ev-paper
    at: { day: 5, minutes: 540 }
    voices: [v-ev-paper]
    gauges: { flame: 5 }
    caption: { ja: '業界紙が「取引先のラインを止めた部品メーカー」と書いた。', en: '' }
  - id: ev-check-request
    at: { day: 9, minutes: 900 }
    voices: [v-ev-check]
    gauges: { flame: 3 }
    caption: { ja: '取引先から、同じVPN機器を使っていないかの点検依頼が来た。', en: '' }
points:
  - id: p01-call
    at: { day: 0, minutes: 1275 }
    phase: detect
    sound: { se: [phone_ring] }
    text: { ja: '土曜の午後9時15分。夜勤の情報システム課長から電話が入る。「サーバーが暗号化されています。身代金を要求する文書が置かれていました。VPN機器の管理画面に、外部からのログインが残っています」。受発注システムも止まっている。', en: '' }
    voices: [v01-boss, v01-field, v01-ok]
    notable:
      - { id: note-first, text: { ja: '土曜21時15分、情報システム課長から第一報。サーバーが暗号化され受発注システムが停止。VPN機器に不審なログイン。', en: '' } }
    lesson: { ja: '初動では、被害の拡大を止める隔離、原因をたどる証拠保全、経営への第一報を同時に始める。現場を自分で見に行くことや明朝まで待つことは、一見慎重に見えて判断を遅らせる。誰が指揮し、誰が記録するかを最初に決めたい。', en: '' }
    choices:
      - id: p01-wait
        text: { ja: '夜間の招集は混乱するとして、状況が固まるまで動かず、明朝に担当者を集めてから対応を決めるという判断だ。', en: '' }
        explain: { ja: '夜間の初動を遅らせる判断で、被害の拡大と証拠の散逸を招く。落ち着いて体制を整える意図は理解できるが、隔離と記録は待つ理由にならない。', en: '' }
        minutes: 120
        category: hurt
        points: -30
        refs: [jpcert-handling]
        gauges: { flame: 10, damage: 15, trust: -5, stamina: 5 }
        coward: true
        setFlags: { delayedTriage: true }
        delayed:
          - { afterPhases: 1, points: -12, gauges: { damage: 10, flame: 10 }, reason: { ja: '誰も指揮を取らないまま夜が明け、初動が丸一日遅れた。', en: '' } }
        items:
          - { id: p01-a-time, points: -8, axis: time, refs: [jpcert-handling] }
          - { id: p01-a-order, points: -6, axis: order, refs: [jpcert-handling] }
      - id: p01-triage-isolate
        text: { ja: 'CSIRTを招集し端末を切り離す。VPN機器の管理画面を止め、影響を試算し、メモリとログを保全する。', en: '' }
        explain: { ja: '隔離と証拠保全を押さえ、VPN機器の扱いと遮断影響の試算まで同時に進めている。初動で必要な判断がそろった対応になる。', en: '' }
        minutes: 75
        category: recover
        points: 150
        refs: [jpcert-handling, meti-csm-guideline]
        gauges: { damage: -10, flame: -5, trust: 10, stamina: -15 }
        setFlags: { triageStarted: true }
        items:
          - { id: p01-c-time, points: 6, axis: time, refs: [jpcert-handling] }
          - { id: p01-c-order, points: 6, axis: order, refs: [meti-csm-guideline] }
          - { id: p01-c-record, points: 6, axis: record, refs: [jpcert-handling] }
          - { id: p01-c-care, points: 4, axis: care, refs: [meti-csm-guideline] }
      - id: p01-triage
        text: { ja: 'CSIRTを招集して影響する端末を切り離し、メモリとログを保全して経営へ第一報を入れる。', en: '' }
        explain: { ja: '隔離・証拠保全・上申の順序は適切で、初動として大きく外していない。遮断の影響試算や取引先への配慮が抜けるため、加点は標準にとどまる。', en: '' }
        minutes: 60
        category: maintain
        points: 25
        refs: [jpcert-handling, nist-sp800-61r3]
        gauges: { damage: -5, flame: -5, trust: 5, stamina: -10 }
        setFlags: { triageStarted: true }
        items:
          - { id: p01-b-time, points: 4, axis: time, refs: [jpcert-handling] }
          - { id: p01-b-order, points: 4, axis: order, refs: [nist-sp800-61r3] }
          - { id: p01-b-record, points: 4, axis: record, refs: [jpcert-handling] }
      - id: p01-solo
        text: { ja: '夜間の連絡は避け、まず自分でサーバー室に足を運んで、暗号化された画面とVPN機器の状態を確かめる。', en: '' }
        explain: { ja: '当事者が現場で直接確認する行為は、指揮と記録の担い手を失わせる。状況を把握したい気持ちは分かるが、初動では役割を分けるほうがよい。', en: '' }
        minutes: 60
        category: hurt
        points: -60
        refs: [jpcert-handling]
        gauges: { stamina: -10, trust: -5 }
        items:
          - { id: p01-d-order, points: -8, axis: order, refs: [jpcert-handling] }
          - { id: p01-d-record, points: -6, axis: record, refs: [nist-sp800-61r3] }
  - id: p02-link
    at: { day: 0, minutes: 1410 }
    phase: contain
    sound: { se: [phone_ring] }
    text: { ja: '午後11時30分。受発注システムは、取引先三社の生産計画システムとつながっている。接続を切れば、明日の昼には取引先のラインが止まる。経営は判断を待っている。', en: '' }
    voices: [v02-coo, v02-sales, v02-ok]
    popular: { choiceId: p02-keep, percent: 57 }
    notable:
      - { id: note-link, text: { ja: '23時30分、取引先三社の生産計画システムとの接続を遮断するか判断。連絡した時刻と相手を記録する。', en: '' } }
    lesson: { ja: '接続遮断は取引先の生産に直結する。だからこそ、切る判断、理由、代替手段、連絡先を一度にそろえて伝える。黙って切るのも、つないだまま様子を見るのも、相手の計画を狂わせる。社内の決裁と対外連絡を同時に進めたい。', en: '' }
    choices:
      - id: p02-keep
        text: { ja: '取引先のラインを止めないため、つないだまま自社側のサーバーだけを止めて様子を見る。', en: '' }
        explain: { ja: '被害が取引先のシステムへ広がる可能性を残す。相手の生産を守りたい判断だが、自社側だけ止めても通信は止まらず、二次被害を招く。', en: '' }
        minutes: 60
        category: hurt
        points: -100
        refs: [nist-sp800-61r3]
        gauges: { damage: 20, flame: 5 }
        delayed:
          - { afterPhases: 1, points: -40, gauges: { damage: 15, trust: -10 }, reason: { ja: '取引先のシステムに、不審な通信が現れた。', en: '' } }
        items:
          - { id: p02-a-content, points: -8, axis: content, refs: [nist-sp800-61r3] }
          - { id: p02-a-order, points: -6, axis: order, refs: [meti-csm-guideline] }
          - { id: p02-a-care, points: -6, axis: care, refs: [meti-csm-guideline] }
      - id: p02-cut-explain
        text: { ja: '遮断の了承を社長に取り、理由と代替手順の見通しを、取引先三社へメールで一斉に伝える。', en: '' }
        explain: { ja: '了承を得て切る順序と、理由の連絡は押さえている。代替手順を「見通し」にとどめ、今夜の実務まで踏み込まない点が物足りない。', en: '' }
        minutes: 60
        category: maintain
        points: 25
        refs: [meti-csm-guideline]
        gauges: { damage: -10, flame: 5, trust: 5 }
        setFlags: { linkCut: true }
        items:
          - { id: p02-b-order, points: 6, axis: order, refs: [meti-csm-guideline] }
          - { id: p02-b-content, points: 4, axis: content, refs: [meti-csm-guideline] }
      - id: p02-cut-silent
        text: { ja: '取引先への連絡は混乱を招くとして、接続だけを切り、理由は明日の発表でまとめて伝える。', en: '' }
        explain: { ja: '断りなく接続を切ると、取引先は原因も復旧の見通しも分からず、生産計画を立てられない。説明を後回しにする分だけ信頼を失う。', en: '' }
        minutes: 45
