          - { id: p03-c-content, points: 8, axis: content, refs: [nist-sp800-61r3] }
          - { id: p03-c-order, points: 6, axis: order, refs: [npa-consult] }
          - { id: p03-c-time, points: 4, axis: time, refs: [jpcert-handling] }
      - id: p03-preserve
        text: { ja: '電源を落とさず、メモリとディスクのイメージを取得し、ハッシュ値と保管場所を記録する。', en: '' }
        explain: { ja: '証拠保全の基本を押さえている。ただし影響が疑われる端末への展開や、警察への相談が抜けるため、標準的な加点にとどまる。', en: '' }
        minutes: 120
        category: maintain
        points: 25
        refs: [nist-sp800-61r3, jpcert-handling]
        gauges: { damage: -10, stamina: -15, trust: 5 }
        setFlags: { evidencePreserved: true }
        items:
          - { id: p03-b-record, points: 10, axis: record, refs: [nist-sp800-61r3] }
          - { id: p03-b-order, points: 8, axis: order, refs: [jpcert-handling] }
          - { id: p03-b-time, points: 4, axis: time, refs: [jpcert-handling] }
      - id: p03-pay
        text: { ja: '要求に応じて支払い、復号とデータの削除を待つ。取引先の図面公開を止めるにはこれしかないと判断する。', en: '' }
        explain: { ja: '支払っても復号や削除は保証されず、攻撃者との交渉が新たな要求を招く。図面を守りたい気持ちは分かるが、被害を広げる判断になる。', en: '' }
        minutes: 90
