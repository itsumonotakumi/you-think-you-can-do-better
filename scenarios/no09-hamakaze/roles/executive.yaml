          - { id: p08-a-care2, points: -10, axis: care, refs: [ppc-notify-person] }
      - id: p08-b-window
        text: { ja: '専用の相談窓口を増員し、患者と家族向けの説明会を開く。', en: '' }
        minutes: 180
        category: maintain
        points: 30
        refs: [ppc-notify-person, meti-disclosure-guidance]
        gauges: { flame: -10, trust: 10, stamina: -15 }
        setFlags: { familyMeeting: true }
        items:
          - { id: p08-b-care, points: 10, axis: care, refs: [ppc-notify-person] }
          - { id: p08-b-care2, points: 8, axis: care, refs: [ppc-notify-person] }
