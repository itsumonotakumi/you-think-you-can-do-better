# No.9 ハマカゼ総合医療センター / 経営者ロール
# 判断ポイント16、細目は choices[].items と drafts の合計で80以上。
estimateMinutes: 30
intro: { ja: 'あなたはハマカゼ総合医療センターの病院長。地域の救急を預かる病院で、早朝に電子カルテが止まった。目の前の患者と、明日の病院の両方を守る判断が始まる。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-ppc-prelim
    ref: ppc-report-prelim
    label: { ja: '個人情報保護委員会への速報', en: '' }
    points: -150
    doneFlag: ppcPrelimFiled
events:
  - id: ev-ambulance
    at: { day: 0, minutes: 405 }
    voices: [v-ev-ambulance]
    gauges: { flame: 5 }
    sound: { se: [phone_ring] }
    caption: { ja: '消防指令センターから、救急の受け入れについて確認が入った。', en: '' }
  - id: ev-poster
    at: { day: 0, minutes: 840 }
    voices: [v-ev-poster]
    caption: { ja: '院内の掲示板には「不審なメールは開かないように」の貼り紙。今回の侵入口は、設備保守委託先のVPN機器だった。', en: '' }
  - id: ev-news
    at: { day: 0, minutes: 1260 }
    voices: [v-ev-news]
    gauges: { flame: 10 }
    sound: { se: [notify_news] }
    caption: { ja: '地域紙の速報が、院内システムの停止を報じた。', en: '' }
  - id: ev-family
    at: { day: 1, minutes: 720 }
    voices: [v-ev-family]
    gauges: { flame: 5 }
    sound: { se: [phone_ring] }
    caption: { ja: '患者家族からの電話が、問い合わせ窓口に集中している。', en: '' }
  - id: ev-regional
    at: { day: 2, minutes: 480 }
    voices: [v-ev-regional]
    gauges: { flame: 5 }
    caption: { ja: '地域の医療機関から、紹介患者の受け入れについて問い合わせが来た。', en: '' }
points:
  - id: p01-down
    at: { day: 0, minutes: 330 }
    phase: detect
    sound: { se: [phone_ring] }
    text: { ja: '午前5時30分。事務局長から電話が入る。「電子カルテが全館で開きません。救急の患者さんが来ています」。', en: '' }
    voices: [v01-boss, v01-field, v01-ok]
    notable:
      - { id: note-outage, text: { ja: '午前5時30分、電子カルテが全館で停止した。', en: '' } }
    choices:
      - id: p01-a-wait
        text: { ja: '再起動を繰り返して復旧を試み、朝の外来が始まるまで様子を見続ける。', en: '' }
        explain: { ja: "再起動では原因も停止範囲も分からないまま時間を消費する。現場は紙の指示もなく動くことになり、被害と混乱が広がる。", en: "" }
        minutes: 60
        category: hurt
        points: -150
        refs: [jpcert-handling]
        gauges: { flame: 10, trust: -5, stamina: 5 }
        coward: true
        setFlags: { delayedCommand: true }
        delayed:
          - { afterPhases: 1, points: -40, gauges: { damage: 10, trust: -10 }, reason: { ja: '夜勤の看護師が、紙の指示簿だけで動いていた。', en: '' } }
        items:
          - { id: p01-a-time, points: -10, axis: time, refs: [jpcert-handling] }
          - { id: p01-a-record, points: -5, axis: record, refs: [jpcert-handling] }
      - id: p01-c-isolate
        text: { ja: '対策本部を立ち上げて紙に切り替え、全端末をネットワークから切り離す。', en: '' }
        explain: { ja: "診療の継続と被害の封じ込めを同時に進めている。最初に切り離すことで、暗号化の広がりを抑えられる。", en: "" }
        minutes: 45
        category: recover
        points: 100
        refs: [mhlw-medical-guideline, nist-sp800-61r3]
        gauges: { damage: -10, flame: -10, trust: 10, stamina: -10 }
        setFlags: { hqStarted: true, isolated: true }
        items:
          - { id: p01-c-time, points: 5, axis: time, refs: [nist-sp800-61r3] }
          - { id: p01-c-order, points: 8, axis: order, refs: [mhlw-medical-guideline] }
          - { id: p01-c-content, points: 8, axis: content, refs: [nist-sp800-61r3] }
          - { id: p01-c-record, points: 5, axis: record, refs: [jpcert-handling] }
      - id: p01-b-paper
        text: { ja: '対策本部を立ち上げ、紙のカルテと手書きの指示簿への切り替えを進める。', en: '' }
        explain: { ja: "診療を止めずに記録を残す判断として妥当。ただし端末がつながったままで、被害の拡大を止める措置には触れていない。", en: "" }
        minutes: 30
        category: maintain
        points: 20
        refs: [mhlw-medical-guideline]
        gauges: { flame: -5, trust: 5, stamina: -5 }
        setFlags: { hqStarted: true }
        items:
          - { id: p01-b-time, points: 5, axis: time, refs: [mhlw-medical-guideline] }
          - { id: p01-b-order, points: 5, axis: order, refs: [mhlw-medical-guideline] }
    lesson: { ja: "初動は、診療を止めない準備と被害を広げない措置を同時に始める。原因の特定を待つと感染が広がるので、切り離し、記録、説明の順で動く。様子見や再起動の繰り返しは復旧を遅らせる。", en: "" }

  - id: p02-emergency
    at: { day: 0, minutes: 420 }
    phase: contain
    sound: { se: [phone_ring] }
    text: { ja: '午前7時。救急外来の入口に、胸痛の患者を乗せた救急車が着いた。カルテも検査機器も使えない。受け入れを続けるか。', en: '' }
    voices: [v02-public, v02-coward, v02-ok]
    choices:
      - id: p02-a-continue
        text: { ja: 'これまで通り救急を受け入れ、現場の工夫で乗り切る方針を伝える。', en: '' }
        explain: { ja: "患者を受け入れる姿勢は評価できるが、機器が使えないまま受け入れると処置が遅れる。搬送先との調整もなく、リスクが現場に残る。", en: "" }
        minutes: 90
        category: hurt
        points: -150
        refs: [mhlw-medical-guideline]
        gauges: { damage: 20, flame: 10, trust: -5 }
        delayed:
          - { afterPhases: 1, points: -60, gauges: { damage: 15 }, reason: { ja: '受け入れ先の調整をしないまま患者が集中し、処置が遅れた。', en: '' } }
        items:
          - { id: p02-a-care, points: -10, axis: care, refs: [mhlw-medical-guideline] }
          - { id: p02-a-content, points: -10, axis: content, refs: [mhlw-medical-guideline] }
          - { id: p02-a-record, points: -5, axis: record, refs: [jpcert-handling] }
      - id: p02-b-divert
        text: { ja: '救急の受け入れを一時停止し、地域の救急告示病院に振り分けを依頼する。', en: '' }
        explain: { ja: "患者の安全を優先した判断で、地域との調整も始まっている。ただし患者情報をどう渡すかの手順がなく、引き継ぎで混乱しやすい。", en: "" }
        minutes: 60
        category: maintain
        points: 20
        refs: [mhlw-medical-guideline]
        gauges: { flame: 10, damage: -10, trust: -5 }
        setFlags: { divert: true }
        items:
          - { id: p02-b-order, points: 8, axis: order, refs: [mhlw-medical-guideline] }
          - { id: p02-b-care, points: 5, axis: care, refs: [mhlw-medical-guideline] }
      - id: p02-c-handover
        text: { ja: '受け入れを止めて振り分けを依頼し、患者情報を紙で渡す手順を決める。', en: '' }
        explain: { ja: "搬送先との情報連携まで設計している。紙の手順を決めることで、引き継ぎの抜けや二重の聞き取りを防げる。", en: "" }
        minutes: 90
        category: recover
        points: 100
        refs: [mhlw-medical-guideline, ppc-notify-person]
        gauges: { flame: 5, damage: -15, trust: 5, stamina: -10 }
        setFlags: { divert: true, handover: true }
        items:
          - { id: p02-c-order, points: 8, axis: order, refs: [mhlw-medical-guideline] }
          - { id: p02-c-care, points: 8, axis: care, refs: [ppc-notify-person] }
          - { id: p02-c-record, points: 5, axis: record, refs: [jpcert-handling] }
    lesson: { ja: "救急を止めるか続けるかは、患者の安全を軸に決める。受け入れを続けるにせよ振り分けるにせよ、情報をどう渡すかまで決めて初めて現場は動ける。勢いで受け入れると処置が遅れる。", en: "" }

  - id: p03-ransom
    at: { day: 0, minutes: 540 }
    phase: contain
    sound: { se: [mail_arrive] }
    text: { ja: '午前9時。医療情報部が身代金の要求文を見つけた。「復号しなければ、患者の情報を公開する」。法務が言った。「これは犯罪です。判断は私たちの側にあります」。', en: '' }
    voices: [v03-attacker, v03-vendor, v03-ok]
    choices:
      - id: p03-c-plan
        text: { ja: '支払わず警察に相談し、患者説明と窓口を用意する。', en: '' }
        explain: { ja: "支払わない判断に加え、公開された場合の患者対応まで先に用意している。備えがあることで、公表後の混乱を抑えられる。", en: "" }
        minutes: 120
        category: recover
        points: 120
        refs: [npa-consult, ppc-notify-person]
        gauges: { flame: -10, trust: 10, stamina: -10 }
        setFlags: { refusedRansom: true, patientPlan: true }
        items:
          - { id: p03-c-record, points: 5, axis: record, refs: [npa-consult] }
          - { id: p03-c-order, points: 10, axis: order, refs: [npa-consult] }
          - { id: p03-c-care, points: 5, axis: care, refs: [ppc-notify-person] }
      - id: p03-a-pay
        text: { ja: '要求に応じて支払い、一日も早い電子カルテの復旧を優先する。', en: '' }
        explain: { ja: "支払いは復号を保証せず、犯罪組織への資金提供にもつながる。患者情報の公開を止める保証もなく、被害を広げる判断になる。", en: "" }
        minutes: 60
        category: fatal
        points: -300
        refs: [npa-consult]
        gauges: { damage: 20, flame: 20, trust: -20 }
        setFlags: { paidRansom: true }
        items:
          - { id: p03-a-record, points: -10, axis: record, refs: [npa-consult] }
          - { id: p03-a-content, points: -10, axis: content, refs: [npa-consult] }
          - { id: p03-a-care, points: -5, axis: care, refs: [npa-consult] }
      - id: p03-b-refuse
        text: { ja: '支払わないと決めて警察に相談し、決定の理由を公表で説明する。', en: '' }
        explain: { ja: "支払わない判断と警察への相談は適切。ただし情報が公開された場合の患者対応が後手になり、現場が慌ててしまう。", en: "" }
        minutes: 90
        category: maintain
        points: 30
        refs: [npa-consult]
        gauges: { flame: -5, trust: 5, stamina: -5 }
        setFlags: { refusedRansom: true }
        items:
          - { id: p03-b-record, points: 5, axis: record, refs: [npa-consult] }
          - { id: p03-b-content, points: 5, axis: content, refs: [npa-consult] }
    lesson: { ja: "身代金の要求は犯罪であり、支払いは復号も沈黙も保証しない。まず警察と法務に相談し、情報が公開された場合の患者対応を同時に準備する。目の前の復旧に焦れて支払うと、被害は広がる。", en: "" }

  - id: p05-command
    at: { day: 0, minutes: 780 }
    phase: organize
    sound: { se: [notify_chat] }
    text: { ja: '午後1時。対策本部の会議室に、医師、看護師、事務、委託先が集まった。誰が何を決めるのか、まだ決まっていない。', en: '' }
    voices: [v05-boss, v05-past, v05-ok]
    choices:
      - id: p05-a-alone
        text: { ja: '院長がすべての判断を自分で行い、事務局は記録に専念する。', en: '' }
        explain: { ja: "判断が一人に集中すると、技術と広報の検討が止まる。疲労も集中し、記録だけでは現場の動きを支えられない。", en: "" }
        minutes: 90
        category: hurt
        points: -120
        refs: [meti-csm-guideline]
        gauges: { stamina: -15, trust: -10, damage: 10 }
        items:
          - { id: p05-a-order, points: -10, axis: order, refs: [meti-csm-guideline] }
          - { id: p05-a-care, points: -5, axis: care, refs: [meti-csm-guideline] }
      - id: p05-c-log
        text: { ja: '指揮命令を一本化して割り当て、判断の時刻と根拠を議事録に残す。', en: '' }
        explain: { ja: "役割分担に加えて記録と共有まで設計している。判断の経緯が残るため、後日の説明と検証に耐えられる。", en: "" }
        minutes: 120
        category: recover
        points: 100
        refs: [meti-csm-guideline, jpcert-handling]
        gauges: { trust: 10, stamina: -10 }
        setFlags: { command: true, dailyLog: true }
        items:
          - { id: p05-c-order, points: 8, axis: order, refs: [meti-csm-guideline] }
          - { id: p05-c-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: p05-c-wording, points: 5, axis: wording, refs: [meti-disclosure-guidance] }
      - id: p05-b-command
        text: { ja: '指揮命令を一本化し、技術は医療情報部、広報と窓口は事務局に割り当てる。', en: '' }
        explain: { ja: "役割分担を決めた点は良い。ただし決定の時刻や根拠を残す仕組みがなく、後から経緯を説明しにくい。", en: "" }
        minutes: 90
        category: maintain
        points: 30
        refs: [meti-csm-guideline]
        gauges: { trust: 5, stamina: -5 }
        setFlags: { command: true }
        items:
          - { id: p05-b-order, points: 8, axis: order, refs: [meti-csm-guideline] }
          - { id: p05-b-record, points: 5, axis: record, refs: [jpcert-handling] }
    lesson: { ja: "対策本部では、誰が何を決めるかを一枚にして共有する。技術、広報、現場の判断を分けたうえで、決定の時刻と根拠を残す。院長が抱え込むと判断が遅れ、記録がないと後で説明できない。", en: "" }

  - id: p04-wipe
    at: { day: 0, minutes: 900 }
    phase: organize
    sound: { se: [notify_chat] }
    text: { ja: '午後3時。全端末の隔離が終わらない。医療情報部は「初期化して作り直すのが早い」と言い、調査会社は「証拠を残してほしい」と言う。', en: '' }
    voices: [v04-expert, v04-field, v04-ok]
    choices:
      - id: p04-a-rebuild
        text: { ja: '全端末を初期化して作り直し、明日からの診療再開を優先する。', en: '' }
        explain: { ja: "復旧は早いが、侵入口も手口も分からないまま再開することになる。証拠が消え、同じ経路の被害が再発しやすい。", en: "" }
        minutes: 120
        category: hurt
        points: -120
        refs: [nist-sp800-61r3]
        gauges: { damage: 15, flame: 5, trust: -10 }
        delayed:
          - { afterPhases: 1, points: -60, gauges: { damage: 10, trust: -10 }, reason: { ja: '侵入口も手口も分からないまま再開し、同じ経路の通信が再び見つかった。', en: '' } }
        items:
          - { id: p04-a-content, points: -10, axis: content, refs: [nist-sp800-61r3] }
          - { id: p04-a-record, points: -10, axis: record, refs: [nist-sp800-61r3] }
          - { id: p04-a-order, points: -5, axis: order, refs: [jpcert-handling] }
      - id: p04-b-evidence
        text: { ja: '端末を隔離したまま、調査会社とともに証拠の保全を進める。', en: '' }
        explain: { ja: "証拠保全を優先した判断は妥当。ただし復旧の手順やバックアップの確認がなく、診療再開の見通しが立たない。", en: "" }
        minutes: 120
        category: maintain
        points: 30
        refs: [nist-sp800-61r3, jpcert-handling]
        gauges: { damage: -10, trust: 5, stamina: -10 }
        setFlags: { evidence: true }
        items:
          - { id: p04-b-order, points: 8, axis: order, refs: [nist-sp800-61r3] }
          - { id: p04-b-record, points: 8, axis: record, refs: [jpcert-handling] }
      - id: p04-c-backup
        text: { ja: '端末を隔離して証拠を保全し、バックアップの健全性と復旧手順も確認する。', en: '' }
        explain: { ja: "証拠を残しながら復旧の準備も進めている。オフラインのバックアップを確かめることで、安全に戻せる範囲が分かる。", en: "" }
        minutes: 180
        category: recover
        points: 100
        refs: [nist-sp800-61r3, jpcert-handling]
        gauges: { damage: -15, trust: 10, stamina: -15 }
        setFlags: { evidence: true, backupChecked: true }
        items:
          - { id: p04-c-order, points: 8, axis: order, refs: [nist-sp800-61r3] }
          - { id: p04-c-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: p04-c-content, points: 8, axis: content, refs: [nist-sp800-61r3] }
          - { id: p04-c-time, points: 3, axis: time, refs: [jpcert-handling] }
    lesson: { ja: "復旧を急ぐ前に、証拠を残して侵入口を特定する。初期化は速いが、原因を消して同じ被害を招く。証拠保全と並行してバックアップの健全性と復旧手順を確かめ、戻せる範囲から再開する。", en: "" }

  - id: p06-statement
    at: { day: 0, minutes: 1200 }
    phase: notify
    sound: { se: [notify_news] }
    text: { ja: '午後8時。広報が「今夜、第一報を出します」と言う。まだ原因も影響範囲も分かっていない。何と書くか。', en: '' }
    voices: [v06-public, v06-law, v06-ok]
    choices:
      - id: p06-c-window
        text: { ja: '攻撃と診療の制限を公表し、患者が今することと専用窓口を併記する。', en: '' }
        explain: { ja: "原因の説明だけでなく、患者の行動と相談先まで示している。情報が届くことで、問い合わせの混乱も減らせる。", en: "" }
        minutes: 120
        category: recover
        points: 120
        refs: [meti-disclosure-guidance, ppc-notify-person]
        gauges: { flame: 5, trust: 15, stamina: -10 }
        setFlags: { publicAttack: true, patientWindow: true }
        detail: first-statement
        items:
          - { id: p06-c-wording, points: 8, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: p06-c-care, points: 8, axis: care, refs: [ppc-notify-person] }
          - { id: p06-c-time, points: 5, axis: time, refs: [meti-disclosure-guidance] }
          - { id: p06-c-record, points: 5, axis: record, refs: [jpcert-handling] }
      - id: p06-a-maintenance
        text: { ja: '「院内システムの障害により診療を制限中」とだけ発表する。', en: '' }
        explain: { ja: "攻撃と診療への影響を伏せた発表は、後から判明したときに隠蔽と受け取られる。患者が取るべき行動も伝わらない。", en: "" }
        minutes: 60
        category: fatal
        points: -250
        refs: [meti-disclosure-guidance]
        gauges: { flame: 25, trust: -20 }
        setFlags: { hidAttack: true }
        delayed:
          - { afterPhases: 2, points: -100, gauges: { flame: 20, trust: -15 }, reason: { ja: 'サイバー攻撃だったことが報道で判明し、隠蔽と批判された。', en: '' } }
        items:
          - { id: p06-a-wording, points: -20, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: p06-a-record, points: -10, axis: record, refs: [meti-disclosure-guidance] }
          - { id: p06-a-care, points: -10, axis: care, refs: [ppc-notify-person] }
      - id: p06-b-attack
        text: { ja: 'サイバー攻撃を受けたことと、電子カルテが使えないことを公表する。', en: '' }
