    phase: organize
    sound: { se: [notify_chat] }
    text: { ja: '午後3時。全端末の隔離が終わらない。医療情報部は「初期化して作り直すのが早い」と言い、調査会社は「証拠を残してほしい」と言う。', en: '' }
    voices: [v04-expert, v04-field, v04-ok]
    choices:
      - id: p04-a-rebuild
        text: { ja: '全端末を初期化して、明日から診療を再開する。', en: '' }
        minutes: 120
        category: hurt
        points: -120
        refs: [nist-sp800-61r3]
        gauges: { damage: 15, flame: 5, trust: -10 }
        delayed:
          - { afterPhases: 1, points: -60, gauges: { damage: 10, trust: -10 }, reason: { ja: '侵入口も手口も分からないまま再開し、同じ経路の通信が再び見つかった。', en: '' } }
        items:
          - { id: p04-a-content, points: -10, axis: content, refs: [nist-sp800-61r3] }
          - { id: p04-a-record, points: -10, axis: record, refs: [nist-sp800-61r3] }
          - { id: p04-a-order, points: -5, axis: order, refs: [jpcert-handling] }
      - id: p04-b-evidence
        text: { ja: '端末を隔離したまま、調査会社と証拠を保全する。', en: '' }
        minutes: 120
        category: maintain
        points: 30
        refs: [nist-sp800-61r3, jpcert-handling]
        gauges: { damage: -10, trust: 5, stamina: -10 }
        setFlags: { evidence: true }
        items:
          - { id: p04-b-order, points: 8, axis: order, refs: [nist-sp800-61r3] }
          - { id: p04-b-record, points: 8, axis: record, refs: [jpcert-handling] }
      - id: p04-c-backup
        text: { ja: '端末を隔離して証拠を保全する。加えて、オフラインで保管していたバックアップの健全性を確認し、復旧の手順書を紙で配る。', en: '' }
        minutes: 180
        category: recover
        points: 100
        refs: [nist-sp800-61r3, jpcert-handling]
        gauges: { damage: -15, trust: 10, stamina: -15 }
        setFlags: { evidence: true, backupChecked: true }
        items:
          - { id: p04-c-order, points: 8, axis: order, refs: [nist-sp800-61r3] }
          - { id: p04-c-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: p04-c-content, points: 8, axis: content, refs: [nist-sp800-61r3] }
          - { id: p04-c-time, points: 3, axis: time, refs: [jpcert-handling] }

  - id: p06-statement
