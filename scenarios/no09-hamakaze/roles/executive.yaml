        items:
          - { id: p07-a-time, points: -10, axis: time, refs: [ppc-report-prelim] }
          - { id: p07-a-record, points: -8, axis: record, refs: [ppc-report-prelim] }
          - { id: p07-a-content, points: -5, axis: content, refs: [ppc-report-scope] }
      - id: p07-b-file
        text: { ja: '分かっている範囲で速報を出し、不明点は調査中と明記する。', en: '' }
        minutes: 90
        category: maintain
        points: 20
        refs: [ppc-report-prelim]
        gauges: { trust: 5, stamina: -10 }
        setFlags: { ppcPrelimFiled: true }
        items:
          - { id: p07-b-content, points: 8, axis: content, refs: [ppc-report-prelim] }
          - { id: p07-b-time, points: 5, axis: time, refs: [ppc-report-prelim] }
          - { id: p07-b-record, points: 5, axis: record, refs: [ppc-report-prelim] }
      - id: p07-c-notify
        text: { ja: '分かっている範囲で速報を出し、不明点は調査中と明記する。加えて、患者本人への通知文の準備を同時に始める。', en: '' }
        minutes: 120
        category: recover
        points: 100
        refs: [ppc-report-prelim, ppc-notify-person]
        gauges: { trust: 10, stamina: -15 }
        setFlags: { ppcPrelimFiled: true, notifyPrep: true }
        items:
          - { id: p07-c-content, points: 8, axis: content, refs: [ppc-report-prelim] }
          - { id: p07-c-time, points: 5, axis: time, refs: [ppc-report-prelim] }
          - { id: p07-c-care, points: 8, axis: care, refs: [ppc-notify-person] }
          - { id: p07-c-record, points: 5, axis: record, refs: [ppc-report-prelim] }

  - id: p08-patients
    at: { day: 1, minutes: 900 }
    phase: notify
    sound: { se: [phone_ring] }
    text: { ja: '午後3時。患者と家族からの電話が、1時間で二百件を超えた。地域の医療機関からも、紹介患者の受け入れについて問い合わせが来ている。', en: '' }
