    title: { ja: '調査報告書の公開範囲', en: '' }
    slots:
      - id: scope
        label: { ja: '公開する範囲', en: '' }
        options:
          - { id: fr-s-hide, text: { ja: '公開しない', en: '' }, points: -20, axis: content, refs: [meti-disclosure-guidance], explain: { ja: "公開しないと、原因も対策も検証されず、地域にも教訓が届かない。説明の機会も失う。", en: "" } }
          - { id: fr-s-full, text: { ja: '攻撃に使える詳細だけ伏せて全文公開する', en: '' }, points: 10, axis: content, refs: [meti-disclosure-guidance], explain: { ja: "危険な詳細だけ伏せる公開は、検証と再発防止の両立になる。地域の備えにもつながる。", en: "" } }
      - id: cause
        label: { ja: '原因の書き方', en: '' }
        options:
          - { id: fr-c-cause, text: { ja: '原因と判断の誤りを具体的に書く', en: '' }, points: 10, axis: content, refs: [nist-sp800-61r3], explain: { ja: "原因と判断の誤りを具体的に書くことで、再発防止が実行できる。対策の優先順位も決まる。", en: "" } }
          - { id: fr-c-vague, text: { ja: '「外部からの攻撃」とだけ書く', en: '' }, points: -10, axis: content, refs: [nist-sp800-61r3], explain: { ja: "「外部からの攻撃」だけでは、どこを直すのか分からない。対策が精神論に流れ、検証もできない。", en: "" } }
      - id: vendor
        label: { ja: '委託先の扱い', en: '' }
        options:
          - { id: fr-v-omit, text: { ja: '委託先に触れない', en: '' }, points: -15, axis: content, refs: [meti-csm-guideline], explain: { ja: "委託先に触れないと、同じ型の機器が残っていても対策が進まない。再発の芽を地域に残す。", en: "" } }
          - { id: fr-v-entry, text: { ja: '委託先のVPN機器と契約の不備を書く', en: '' }, points: 10, axis: content, refs: [meti-csm-guideline], explain: { ja: "侵入口と契約の不備を書くことで、他の委託先の点検にもつながる。責任分界も整理できる。", en: "" } }
      - id: measures
        label: { ja: '再発防止策', en: '' }
        options:
          - { id: fr-m-plan, text: { ja: '再発防止策の実施時期と担当を書く', en: '' }, points: 10, axis: content, refs: [cissp-cbk-secops], explain: { ja: "時期と担当があれば、対策が実行されたか検証できる。毎月の進捗の公開にもそのまま使える。", en: "" } }
          - { id: fr-m-slogan, text: { ja: '「再発防止に努めます」とだけ書く', en: '' }, points: -10, axis: content, refs: [cissp-cbk-secops], explain: { ja: "「努めます」だけでは、何をいつ誰がやるのか分からない。実行されたかの検証もできない。", en: "" } }
      - id: thirdparty
        label: { ja: '第三者委員会の意見', en: '' }
        options:
          - { id: fr-t-summary, text: { ja: '要約だけを載せる', en: '' }, points: -8, axis: content, refs: [cissp-cbk-secops], explain: { ja: "要約だけでは、都合の悪い指摘が抜けていないか分からない。調査の透明性が下がり、再発防止も弱くなる。", en: "" } }
          - { id: fr-t-full, text: { ja: '第三者委員会の意見を全文掲載する', en: '' }, points: 8, axis: content, refs: [cissp-cbk-secops], explain: { ja: "第三者委員会の意見を全文載せると、調査の独立性が伝わる。都合の悪い指摘も隠せない。", en: "" } }
      - id: patients
        label: { ja: '患者への対応', en: '' }
        options:
          - { id: fr-p-record, text: { ja: '通知と補償の実績を書く', en: '' }, points: 8, axis: care, refs: [ppc-notify-person], explain: { ja: "通知と補償の実績は、患者対応を実際に行った証拠になる。口約束との違いを具体的に示せる。", en: "" } }
          - { id: fr-p-none, text: { ja: '患者への対応に触れない', en: '' }, points: -10, axis: care, refs: [ppc-notify-person], explain: { ja: "患者への対応に触れないと、被害者の視点が抜けた報告になる。地域の信頼も戻らない。", en: "" } }
      - id: progress
        label: { ja: '進捗の公開', en: '' }
        options:
          - { id: fr-o-once, text: { ja: '一度だけ公開する', en: '' }, points: -5, axis: record, refs: [meti-disclosure-guidance], explain: { ja: "一度きりの公開では、その後の進み具合が分からない。未完了の対策が放置されやすい。", en: "" } }
          - { id: fr-o-monthly, text: { ja: '進捗を毎月公開する', en: '' }, points: 10, axis: record, refs: [meti-disclosure-guidance], explain: { ja: "毎月の進捗公開は、対策が形だけになっていないか確かめられる。改善の速度も見える。", en: "" } }
      - id: regional
        label: { ja: '地域への共有', en: '' }
        options:
          - { id: fr-g-share, text: { ja: '得た教訓を地域の医療機関に無償で共有する', en: '' }, points: 10, axis: content, refs: [mhlw-medical-guideline], explain: { ja: "教訓を地域で共有すると、同じ被害を別の病院で防げる。委託先の点検の輪も広がり、地域全体の備えが上がる。", en: "" } }
          - { id: fr-g-keep, text: { ja: '自院の中にとどめる', en: '' }, points: -5, axis: content, refs: [mhlw-medical-guideline], explain: { ja: "自院だけに留めると、同じ型のリスクが地域に残る。再発防止に取り組む姿勢も伝わらない。", en: "" } }
      - id: ad
        label: { ja: '宣伝との線引き', en: '' }
        options:
          - { id: fr-ad-use, text: { ja: '復旧を宣伝に使う', en: '' }, points: -15, axis: care, refs: [meti-disclosure-guidance], explain: { ja: "復旧を宣伝に使うと、被害や患者対応が軽く見られる。批判を招き、せっかく戻した信頼も損なう。", en: "" } }
          - { id: fr-ad-none, text: { ja: '復旧を宣伝に使わない', en: '' }, points: 5, axis: care, refs: [meti-disclosure-guidance], explain: { ja: "復旧を宣伝に使わない姿勢は、説明の信頼を保つ。関心が被害と患者対応からそれない。", en: "" } }
