        setFlags: { publicAttack: true }
        detail: first-statement
        items:
          - { id: p06-b-wording, points: 8, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: p06-b-time, points: 5, axis: time, refs: [meti-disclosure-guidance] }
      - id: p06-c-window
        text: { ja: '攻撃を受けたことと診療の制限を公表し、患者が今すぐ確認すべきことと専用窓口を併記する。', en: '' }
        minutes: 120
        category: recover
        points: 120
        refs: [meti-disclosure-guidance, ppc-notify-person]
        gauges: { flame: 5, trust: 15, stamina: -10 }
        setFlags: { publicAttack: true, patientWindow: true }
        detail: first-statement
        items:
          - { id: p06-c-wording, points: 8, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: p06-c-care, points: 8, axis: care, refs: [ppc-notify-person] }
          - { id: p06-c-time, points: 5, axis: time, refs: [meti-disclosure-guidance] }
          - { id: p06-c-record, points: 5, axis: record, refs: [jpcert-handling] }

  - id: p07-report
    at: { day: 1, minutes: 540 }
    phase: notify
    sound: { se: [typing] }
    text: { ja: '午前9時。法務から「個人情報保護委員会への速報を、いつ出すか」と聞かれた。診療情報は要配慮個人情報にあたる。件数はまだ確定していない。', en: '' }
    voices: [v07-law, v07-boss, v07-ok]
    popular: { choiceId: p07-a-wait, percent: 61 }
