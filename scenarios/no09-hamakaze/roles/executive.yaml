          - { id: fd-i-solo, text: { ja: '院長の判断だけで出す', en: '' }, points: -10, axis: order, refs: [meti-csm-guideline], explain: { ja: "院長だけで出すと、法務や現場の確認が抜けやすい。訂正が増えるほど信頼を失い、説明のやり直しも難しくなる。", en: "" } }
      - id: record
        label: { ja: '記録', en: '' }
        options:
          - { id: fd-r-none, text: { ja: '記録を残さない', en: '' }, points: -8, axis: record, refs: [jpcert-handling], explain: { ja: "記録がないと、何をいつ発表したか説明できなくなる。後日の検証や訂正の根拠にも耐えられない。", en: "" } }
          - { id: fd-r-log, text: { ja: '公表した時刻と版を記録する', en: '' }, points: 5, axis: record, refs: [jpcert-handling], explain: { ja: "時刻と版を記録すると、後から説明の経緯をたどれる。訂正が必要になった理由も示せる。", en: "" } }
