        explain: { ja: "公開されている以上、否定を続けると信頼を失う。患者への通知も遅れ、二次被害の防止ができない。", en: "" }
        minutes: 120
        category: hurt
        points: -150
        refs: [ppc-report-scope]
        gauges: { flame: 20, trust: -15, damage: 10 }
        coward: true
        items:
          - { id: p14-a-content, points: -10, axis: content, refs: [ppc-report-scope] }
          - { id: p14-a-wording, points: -10, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: p14-a-care, points: -5, axis: care, refs: [ppc-notify-person] }
      - id: p14-b-notice
        text: { ja: '公開された範囲を特定し、対象の患者本人へ通知して追加の速報も出す。', en: '' }
        explain: { ja: "本人通知と速報は適切。ただし相談窓口やなりすましへの備えがなく、通知を受けた患者が孤立しやすい。", en: "" }
        minutes: 180
        category: maintain
        points: 30
        refs: [ppc-notify-person, ppc-report-scope]
        gauges: { flame: -10, trust: 5, stamina: -15 }
        setFlags: { leakAdmitted: true }
        items:
          - { id: p14-b-content, points: 8, axis: content, refs: [ppc-report-scope] }
          - { id: p14-b-care, points: 8, axis: care, refs: [ppc-notify-person] }
          - { id: p14-b-time, points: 5, axis: time, refs: [ppc-report-prelim] }
      - id: p14-c-support
        text: { ja: '本人通知と追加の速報に加え、専用窓口と見舞金、監視を用意する。', en: '' }
        explain: { ja: "通知だけで終わらせず、患者が困ったときの受け皿まで用意している。公開後の二次被害を減らす実効性がある。", en: "" }
        minutes: 240
        category: recover
        points: 150
        refs: [ppc-notify-person]
        gauges: { flame: -15, trust: 15, stamina: -20 }
        setFlags: { leakAdmitted: true, patientSupport: true }
        items:
          - { id: p14-c-content, points: 8, axis: content, refs: [ppc-report-scope] }
          - { id: p14-c-care, points: 10, axis: care, refs: [ppc-notify-person] }
          - { id: p14-c-care2, points: 8, axis: care, refs: [ppc-notify-person] }
          - { id: p14-c-time, points: 5, axis: time, refs: [ppc-report-prelim] }
    lesson: { ja: "攻撃者が情報を公開したら、事実を認めて対象者に通知する。通知には相談窓口と、なりすましや二次被害への備えを添える。否定を続けると信頼を失い、患者が自力で情報を探すことになる。", en: "" }

  - id: p13-resume
    at: { day: 8, minutes: 900 }
    phase: recover
    sound: { se: [notify_sns] }
    text: { ja: '午後3時。電子カルテの復旧のめどが立った。全面再開を急ぐ声と、検証を優先する声がぶつかっている。', en: '' }
    voices: [v13-public, v13-coward, v13-ok]
    popular: { choiceId: p13-a-rush, percent: 52 }
    choices:
      - id: p13-a-rush
        text: { ja: '全面再開に踏み切り、強化してきた監視も通常体制に戻す。', en: '' }
        explain: { ja: "未確認の端末が残る状態での全面再開は、再感染のリスクが高い。監視を弱めると、再発の兆候を見逃す。", en: "" }
        minutes: 120
        category: hurt
        points: -150
        refs: [nist-sp800-61r3]
        gauges: { damage: 20, flame: 10, trust: -10 }
        delayed:
          - { afterPhases: 1, points: -60, gauges: { damage: 15, trust: -15 }, reason: { ja: '再開後に別の端末で不審な通信が見つかり、再度停止した。', en: '' } }
        items:
          - { id: p13-a-time, points: -10, axis: time, refs: [nist-sp800-61r3] }
          - { id: p13-a-record, points: -10, axis: record, refs: [nist-sp800-61r3] }
          - { id: p13-a-care, points: -10, axis: care, refs: [mhlw-medical-guideline] }
      - id: p13-c-verify
        text: { ja: '段階的に再開して監視を強化し、再開前の第三者検証と補償も明記する。', en: '' }
        explain: { ja: "再開の進め方に加えて、検証と補償まで示している。利用者が安心して戻れる条件を整えた点が評価できる。", en: "" }
        minutes: 300
        category: recover
        points: 120
        refs: [nist-sp800-61r3, ppc-notify-person]
        gauges: { damage: -15, trust: 15, stamina: -15 }
        setFlags: { verifiedResume: true }
        items:
          - { id: p13-c-content, points: 8, axis: content, refs: [nist-sp800-61r3] }
          - { id: p13-c-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: p13-c-care, points: 8, axis: care, refs: [ppc-notify-person] }
      - id: p13-b-step
        text: { ja: 'クリーンな環境から段階的に再開し、監視を強化して続ける。', en: '' }
        explain: { ja: "段階的な再開と監視強化は妥当。ただし再開の条件や検証の公開がなく、利用者には判断の根拠が見えない。", en: "" }
        minutes: 240
        category: maintain
        points: 30
        refs: [nist-sp800-61r3]
        gauges: { damage: -10, stamina: -10, trust: 5 }
        items:
          - { id: p13-b-content, points: 8, axis: content, refs: [nist-sp800-61r3] }
          - { id: p13-b-record, points: 5, axis: record, refs: [nist-sp800-61r3] }
    lesson: { ja: "再開は、未確認が残る限り段階的に進める。監視を弱めず、再開の条件と検証の結果を公開する。全面再開と監視の解除を同時に行うと、再発時に止める手段がなくなるので、条件を満たすまで待つ。", en: "" }

  - id: p15-report
    at: { day: 21, minutes: 600 }
    phase: after
    sound: { se: [notify_news] }
    text: { ja: '午前10時。調査報告書が完成した。公開範囲を決める。侵入口は塞いだが、同じ型の機器が他の委託先にも残っている。', en: '' }
    voices: [v15-expert, v15-law, v15-ok]
    choices:
      - id: p15-c-share
        text: { ja: '全文公開に加え、再発防止の進捗を毎月公開し、教訓を地域と共有する。', en: '' }
        explain: { ja: "公開を一度で終わらせず、進捗と教訓の共有まで続けている。地域全体の備えを高める点で最も評価できる。", en: "" }
        minutes: 240
        category: increase
        points: 300
        fatalAlternate: 50
        refs: [meti-disclosure-guidance, mhlw-medical-guideline]
        gauges: { flame: -15, trust: 20, stamina: -15 }
        setFlags: { fullDisclosure: true, regionalShare: true }
        detail: final-report
        items:
          - { id: p15-c-content, points: 8, axis: content, refs: [meti-disclosure-guidance] }
          - { id: p15-c-record, points: 8, axis: record, refs: [meti-disclosure-guidance] }
          - { id: p15-c-content2, points: 8, axis: content, refs: [mhlw-medical-guideline] }
      - id: p15-a-hide
        text: { ja: '報告書は公開せず、攻撃者に利用されるおそれがあると説明する。', en: '' }
        explain: { ja: "攻撃に使える情報を伏せる配慮は必要だが、全文を隠すと再発防止の検証が進まない。地域にも教訓が届かない。", en: "" }
        minutes: 60
        category: hurt
        points: -150
        refs: [meti-disclosure-guidance]
        gauges: { flame: 15, trust: -15 }
        items:
          - { id: p15-a-content, points: -10, axis: content, refs: [meti-disclosure-guidance] }
          - { id: p15-a-wording, points: -10, axis: wording, refs: [meti-disclosure-guidance] }
      - id: p15-b-publish
        text: { ja: '攻撃に利用できる部分だけを伏せて、報告書を全文公開する。', en: '' }
        explain: { ja: "危険な情報を伏せつつ、原因と対応を公開している。再発防止の材料として、院内にも地域にも価値がある。", en: "" }
        minutes: 180
        category: recover
        points: 100
        refs: [meti-disclosure-guidance]
        gauges: { flame: -10, trust: 15, stamina: -10 }
        setFlags: { fullDisclosure: true }
        detail: final-report
        items:
          - { id: p15-b-content, points: 8, axis: content, refs: [meti-disclosure-guidance] }
          - { id: p15-b-record, points: 5, axis: record, refs: [meti-disclosure-guidance] }
    lesson: { ja: "報告書は、攻撃に使える詳細だけを伏せて公開する。原因と判断の誤りを書き、再発防止の進捗を継続して示す。教訓を地域に共有すると、同じ型の被害を減らせる。隠すと検証も信頼も失う。", en: "" }

  - id: p16-press
    at: { day: 22, minutes: 540 }
    phase: after
    sound: { se: [shutter] }
    text: { ja: '午前9時。記者会見を明日に控え、広報が「質問は四問、十五分で終わらせたい」と言う。', en: '' }
    voices: [v16-flattery, v16-coward, v16-ok]
    choices:
      - id: p16-a-short
        text: { ja: '会見を短く打ち切り、質問の時間と範囲をあらかじめ制限する。', en: '' }
        explain: { ja: "都合の悪い質問を避けたと受け取られ、説明不足の印象を残す。患者と家族への説明の機会も失われる。", en: "" }
        minutes: 45
        category: hurt
        points: -60
        refs: [meti-disclosure-guidance]
        gauges: { flame: 15, trust: -10 }
        items:
          - { id: p16-a-care, points: -10, axis: care, refs: [meti-disclosure-guidance] }
          - { id: p16-a-care2, points: -8, axis: care, refs: [meti-disclosure-guidance] }
      - id: p16-b-facts
        text: { ja: '記録を手元に置き、事実だけを答え、不明点は確認して回答すると伝える。', en: '' }
        explain: { ja: "事実と不明点を分ける姿勢は良い。ただし患者と家族への謝罪や、想定問答の準備がなく、場当たりになりやすい。", en: "" }
        minutes: 90
        category: maintain
        points: 30
        refs: [jpcert-handling]
        gauges: { trust: 5, stamina: -10 }
        items:
          - { id: p16-b-wording, points: 8, axis: wording, refs: [jpcert-handling] }
          - { id: p16-b-wording2, points: 8, axis: wording, refs: [meti-disclosure-guidance] }
      - id: p16-c-ready
        text: { ja: '事実を答え、想定問答を確認し、最初に患者と家族へ謝罪を述べる。', en: '' }
        explain: { ja: "答える内容と順番を事前に揃えている。最初に謝罪を置くことで、説明の焦点が患者と家族に定まる。", en: "" }
        minutes: 150
        category: recover
        points: 100
        refs: [meti-csm-guideline, jpcert-handling]
        gauges: { flame: -10, trust: 10, stamina: -10 }
        setFlags: { pressReady: true }
        items:
          - { id: p16-c-order, points: 8, axis: order, refs: [meti-csm-guideline] }
          - { id: p16-c-care, points: 8, axis: care, refs: [meti-csm-guideline] }
          - { id: p16-c-record, points: 8, axis: record, refs: [jpcert-handling] }
    lesson: { ja: "記者会見では、記録に基づいて事実を答え、分からないことは回答期限を伝える。質問を制限すると隠していると映る。冒頭で患者と家族への謝罪を述べ、想定問答を役員で揃えておく。", en: "" }

drafts:
  first-statement:
    title: { ja: '第一報の文案', en: '' }
    slots:
      - id: timing
        label: { ja: '出す時刻', en: '' }
        auto: true
        items:
          - { id: fd-t-18h, when: { withinHours: 18 }, points: 10, axis: time, refs: [meti-disclosure-guidance] }
          - { id: fd-t-36h, when: { withinHours: 36 }, points: 5, axis: time, refs: [meti-disclosure-guidance] }
          - { id: fd-t-late, when: { otherwise: true }, points: -15, axis: time, refs: [meti-disclosure-guidance] }
      - id: scope
        label: { ja: '対象', en: '' }
        options:
          - { id: fd-s-inpatient, text: { ja: '入院患者のみ', en: '' }, points: -15, axis: content, refs: [ppc-notify-person], explain: { ja: "外来患者と家族に情報が届かず、問い合わせが窓口に集中する。対象を分ける理由も伝わらない。", en: "" } }
          - { id: fd-s-all, text: { ja: '入院・外来のすべての患者と家族', en: '' }, points: 10, axis: content, refs: [ppc-notify-person], explain: { ja: "入院と外来の両方に届く範囲で、患者と家族が自分事として行動できる。対象を狭めると不安が残る。", en: "" } }
      - id: cause
        label: { ja: '原因の書き方', en: '' }
        options:
          - { id: fd-c-attack, text: { ja: '外部からのサイバー攻撃による電子カルテの停止', en: '' }, points: 8, axis: content, refs: [meti-disclosure-guidance], explain: { ja: "原因を攻撃と明記できている。調査中であっても、確認できた事実として書けるので隠蔽の印象を避けられる。", en: "" } }
          - { id: fd-c-fault, text: { ja: '機器の故障', en: '' }, points: -20, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: "機器の故障と書くと、後から攻撃と判明したときに隠蔽と受け取られる。患者の判断も誤らせる。", en: "" } }
      - id: restrictions
        label: { ja: '診療の制限', en: '' }
        options:
          - { id: fd-r-vague, text: { ja: '「一部の診療を制限」とだけ書く', en: '' }, points: -10, axis: content, refs: [mhlw-medical-guideline], explain: { ja: "「一部」では何が止まっているか分からず、患者が問い合わせに殺到する。受診の判断もできない。", en: "" } }
          - { id: fd-r-specific, text: { ja: '救急の受け入れ停止、手術の延期、検査の制限を具体的に書く', en: '' }, points: 10, axis: content, refs: [mhlw-medical-guideline], explain: { ja: "止まっている診療が具体的で、患者は予約や受診の判断ができる。問い合わせの前に行動できる。", en: "" } }
      - id: action
        label: { ja: '患者が今すぐすること', en: '' }
        options:
          - { id: fd-a-concrete, text: { ja: '予約の変更、服用中の薬、急変時の連絡先を具体的に書く', en: '' }, points: 10, axis: care, refs: [ppc-notify-person], explain: { ja: "患者が今すぐ取る行動が具体的で、不安の中でも動ける。予約変更や服薬の確認まで届く。", en: "" } }
          - { id: fd-a-generic, text: { ja: '「注意してください」とだけ書く', en: '' }, points: -10, axis: care, refs: [ppc-notify-person], explain: { ja: "「注意してください」だけでは、何をすればよいか伝わらない。患者は情報を探して窓口に殺到する。", en: "" } }
      - id: contact
        label: { ja: '問い合わせ窓口', en: '' }
        options:
          - { id: fd-w-number, text: { ja: '番号だけを書く', en: '' }, points: -5, axis: care, refs: [meti-csm-guideline], explain: { ja: "番号だけでは受付時間が分からず、夜間の問い合わせが迷う。増員の見通しも伝わらない。", en: "" } }
          - { id: fd-w-hours, text: { ja: '専用窓口の番号、受付時間、増員を書く', en: '' }, points: 8, axis: care, refs: [meti-csm-guideline], explain: { ja: "番号と受付時間、増員まで示すと、つながる見通しが立つ。待つ側の不安を減らし、問い合わせの集中も抑えられる。", en: "" } }
          - { id: fd-w-none, text: { ja: '窓口を書かない', en: '' }, points: -15, axis: care, refs: [meti-csm-guideline], explain: { ja: "窓口がないと、患者は行き場を失い、SNSや報道に流れる。問い合わせの負担も現場に戻る。", en: "" } }
      - id: apology
        label: { ja: '謝罪の主語', en: '' }
        options:
          - { id: fd-ap-vendor, text: { ja: '「委託先」の責任として謝罪する', en: '' }, points: -10, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: "委託先に責任を寄せると、自院の説明責任を回避したと映る。患者との信頼も損ない、再発防止の主体が曖昧になる。", en: "" } }
          - { id: fd-ap-hospital, text: { ja: '「当院」として謝罪する', en: '' }, points: 5, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: "提供主体として謝罪する姿勢が伝わる。責任の所在も明確になり、患者と家族への説明の前提が揃う。", en: "" } }
      - id: excuse
        label: { ja: '前置き', en: '' }
        options:
          - { id: fd-e-none, text: { ja: '言い訳を書かない', en: '' }, points: 5, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: "言い訳を置かないことで、事実と対応に焦点が当たる。説明の途中で論点がぼやけない。", en: "" } }
          - { id: fd-e-advanced, text: { ja: '「高度な攻撃により」と前置きする', en: '' }, points: -10, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: "「高度な攻撃」は説明の先送りと受け取られやすい。対策の責任が自分たちにあることも曖昧になる。", en: "" } }
      - id: next
        label: { ja: '次の公表', en: '' }
        options:
          - { id: fd-n-none, text: { ja: '次回の予定を書かない', en: '' }, points: -5, axis: content, refs: [meti-disclosure-guidance], explain: { ja: "次回の予定がないと、情報の空白を憶測で埋められる。問い合わせの終わりも見えない。", en: "" } }
          - { id: fd-n-next, text: { ja: '次の公表予定を書く', en: '' }, points: 5, axis: content, refs: [meti-disclosure-guidance], explain: { ja: "次の公表予定があると、続報を待つ側の見通しが立つ。憶測が広がる前に次の接点を示せる。", en: "" } }
      - id: approval
        label: { ja: '院内の確認', en: '' }
        options:
