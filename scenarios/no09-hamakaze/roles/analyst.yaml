drafts:
  first-report:
    title: { ja: '医療情報部の一次報告', en: '' }
    slots:
      - id: timing
        label: { ja: '報告する時刻', en: '' }
        auto: true
        items:
          - { id: fr-t-2h, when: { withinHours: 3 }, points: 10, axis: time, refs: [jpcert-handling] }
          - { id: fr-t-5h, when: { withinHours: 6 }, points: 5, axis: time, refs: [jpcert-handling] }
          - { id: fr-t-late, when: { otherwise: true }, points: -12, axis: time, refs: [jpcert-handling] }
      - id: scope
        label: { ja: '影響範囲の書き方', en: '' }
        options:
          - { id: fr-s-all, text: { ja: '電子カルテ、共有フォルダ、検査系、設備保守委託先の接続を並べる', en: '' }, points: 8, axis: content, refs: [mhlw-medical-guideline] }
          - { id: fr-s-ehr, text: { ja: '電子カルテだけと書く', en: '' }, points: -10, axis: content, refs: [mhlw-medical-guideline] }
      - id: facts
        label: { ja: '事実と推測の書き分け', en: '' }
        options:
          - { id: fr-f-split, text: { ja: '確認できた事実と、まだ分からないことを分けて書く', en: '' }, points: 10, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: fr-f-guess, text: { ja: '「VPN機器の脆弱性が原因」と断定して書く', en: '' }, points: -15, axis: wording, refs: [meti-disclosure-guidance] }
      - id: next
        label: { ja: '次の更新', en: '' }
