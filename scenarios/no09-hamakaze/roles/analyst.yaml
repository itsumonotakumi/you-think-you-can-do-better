        explain: { ja: "停止と再発行、現場の手順をまとめて渡している。診療を止めずに権限を切り替えられる点が良い。", en: "" }
        minutes: 60
        category: recover
        points: 120
        refs: [no07-ipa-insider, nist-sp800-61r3]
        gauges: { damage: -10, trust: 5, stamina: -10 }
        setFlags: { accountsRotated: true }
        items:
          - { id: p04-b-order, points: 6, axis: order, refs: [no07-ipa-insider] }
          - { id: p04-b-content, points: 5, axis: content, refs: [nist-sp800-61r3] }
          - { id: p04-b-care, points: 5, axis: care, refs: [mhlw-medical-guideline] }
          - { id: p04-b-record, points: 4, axis: record, refs: [jpcert-handling] }
