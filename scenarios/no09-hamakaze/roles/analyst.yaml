# No.9 ハマカゼ総合医療センター / セキュリティ担当者ロール（医療情報部の運用担当）
# 見えるのは、監視端末のアラート、端末のログ、現場からの内線とチャット。
# 専任のセキュリティ部署はなく、医療情報部の六人が兼任。今朝この部屋にいるのは三人だけ。決められるのは、隔離・停止・記録・報告まで。
# 判断ポイント19、細目は choices[].items と drafts の合計で80以上。
estimateMinutes: 40
intro: { ja: 'あなたはハマカゼ総合医療センターの医療情報部の運用担当。早朝、監視端末のアラートで目が覚める。専任のセキュリティ部署はない。医療情報部は六人で、セキュリティは兼任。今朝この部屋にいるのは三人だけだ。まず何を守るかで、その後のすべてが変わる。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-prelim-material
    ref: ppc-report-prelim
    label: { ja: '速報の材料提出', en: '' }
    points: -40
    doneFlag: prelimMaterialsSent
  - id: dl-final-material
    ref: ppc-report-final-malicious
    label: { ja: '確報の材料提出', en: '' }
    points: -60
    doneFlag: finalMaterialsSent
events:
  - id: ev-night
    at: { day: 1, minutes: 180 }
    voices: [v-ev-night]
    gauges: { stamina: -5 }
    sound: { se: [notify_chat] }
    caption: { ja: '深夜。監視画面のアラートが、同じパターンで鳴り続けている。', en: '' }
  - id: ev-board
    at: { day: 2, minutes: 900 }
    voices: [v-ev-board]
    gauges: { flame: 5 }
    caption: { ja: '院内の掲示板には「不審なメールは開かないように」の貼り紙。今回の侵入口は、設備保守委託先のVPN機器だった。', en: '' }
  - id: ev-press
    at: { day: 4, minutes: 600 }
    voices: [v-ev-press]
    gauges: { stamina: -5 }
    sound: { se: [phone_ring] }
    caption: { ja: '広報から、記者の技術的な質問への回答を求められた。', en: '' }
  - id: ev-family
    at: { day: 10, minutes: 540 }
    voices: [v-ev-family]
    gauges: { flame: 5 }
    sound: { se: [phone_ring] }
    caption: { ja: '患者家族からの電話が、問い合わせ窓口に集中している。', en: '' }
points:
  - id: p01-alert
    at: { day: 0, minutes: 330 }
    phase: detect
    sound: { se: [notify_chat] }
    text: { ja: '午前5時30分。監視端末のアラートが鳴り続けている。共有フォルダのファイル名が一斉に変わり、電子カルテの応答が返らない。夜勤の看護師から「カルテが開かない」と内線が入った。', en: '' }
    voices: [v01-boss, v01-field, v01-ok]
    notable:
      - { id: note-outage, text: { ja: '午前5時30分、共有フォルダのファイル名が一斉に変わり、電子カルテが停止した。', en: '' } }
    choices:
      - id: p01-a-reboot
        text: { ja: '取り急ぎ、電子カルテのサーバーを再起動して復旧を試み始める。', en: '' }
        explain: { ja: "再起動は症状を消すだけで、暗号化の進行も侵入口も分からない。証拠が失われ、被害の全体像を追えなくなる。", en: "" }
        minutes: 15
        category: hurt
        points: -110
        refs: [nist-sp800-61r3]
        gauges: { damage: 10, flame: 5 }
        items:
          - { id: p01-a-time, points: -6, axis: time, refs: [jpcert-handling] }
          - { id: p01-a-content, points: -8, axis: content, refs: [nist-sp800-61r3] }
          - { id: p01-a-record, points: -4, axis: record, refs: [jpcert-handling] }
      - id: p01-b-scope
        text: { ja: 'アラートと共有フォルダのログを見て、影響する端末の範囲を切り分ける。', en: '' }
        explain: { ja: "影響範囲の切り分けは調査の基本。ただし記録の保全と上への第一報が遅れ、隔離の判断も後手になる。", en: "" }
        minutes: 30
        category: maintain
        points: 20
        refs: [jpcert-handling]
        gauges: { stamina: -5 }
        items:
          - { id: p01-b-time, points: 4, axis: time, refs: [jpcert-handling] }
          - { id: p01-b-content, points: 5, axis: content, refs: [nist-sp800-61r3] }
          - { id: p01-b-record, points: 4, axis: record, refs: [jpcert-handling] }
      - id: p01-c-first
        text: { ja: 'アラートの記録を保全し、部長と事務局長へ第一報を入れる。', en: '' }
        explain: { ja: "記録保全と報告の順序が明確。初動の事実が残り、後の説明と調査の土台になる点が良い。", en: "" }
        minutes: 30
        category: recover
        points: 110
        refs: [jpcert-handling, nist-sp800-61r3]
        gauges: { damage: -5, trust: 5, stamina: -5 }
        setFlags: { reportStarted: true }
        items:
          - { id: p01-c-time, points: 5, axis: time, refs: [jpcert-handling] }
          - { id: p01-c-order, points: 6, axis: order, refs: [nist-sp800-61r3] }
          - { id: p01-c-record, points: 5, axis: record, refs: [jpcert-handling] }
          - { id: p01-c-content, points: 4, axis: content, refs: [nist-sp800-61r3] }
      - id: p01-d-wait
        text: { ja: '誤検知かもしれないと考え、朝の外来が始まるまで様子を見続ける。', en: '' }
        explain: { ja: "誤検知の可能性はあるが、待つ間に暗号化が広がる。アラートが複数出ている時点で確認を優先すべきだ。", en: "" }
        minutes: 60
        category: hurt
        points: -100
        refs: [jpcert-handling]
        gauges: { damage: 15, flame: -5, trust: -5 }
        coward: true
        setFlags: { delayedCommand: true }
        delayed:
          - { afterPhases: 1, points: -40, gauges: { damage: 15, flame: 10, trust: -10 }, reason: { ja: '隔離が遅れた分だけ、暗号化された端末が増えた。', en: '' } }
        items:
          - { id: p01-d-time, points: -8, axis: time, refs: [jpcert-handling] }
          - { id: p01-d-record, points: -5, axis: record, refs: [jpcert-handling] }
          - { id: p01-d-content, points: -6, axis: content, refs: [nist-sp800-61r3] }
    lesson: { ja: "アラートが複数出たら、誤検知と決めずに記録を保全する。端末の隔離、上への第一報、影響範囲の切り分けを並行する。再起動や様子見は暗号化を進め、証拠も失わせる。初動の記録が説明を支える。", en: "" }

  - id: p02-terminal
    at: { day: 0, minutes: 360 }
    phase: contain
    sound: { se: [notify_chat] }
    text: { ja: '午前6時。端末を一台ずつネットワークから切り離している。救急の医師が、患者の名前を指して言う。「この端末だけは今使わせてくれ。この患者は待てない」。', en: '' }
    voices: [v02-field, v02-public, v02-ok]
    choices:
      - id: p02-a-use
        text: { ja: '医師にその端末を渡し、ネットワークにつないだまま使ってもらう。', en: '' }
        explain: { ja: "患者を優先する気持ちは分かるが、隔離した端末を戻すと感染が再び広がる。他の患者と職員の安全を損なう。", en: "" }
        minutes: 30
        category: hurt
        points: -120
        refs: [nist-sp800-61r3]
        gauges: { damage: 15, flame: -5 }
        delayed:
          - { afterPhases: 1, points: -50, gauges: { damage: 20, flame: 10 }, reason: { ja: 'つないだままの端末から、同じ共有フォルダへ暗号化の通信が広がった。', en: '' } }
        items:
          - { id: p02-a-content, points: -8, axis: content, refs: [nist-sp800-61r3] }
          - { id: p02-a-care, points: -6, axis: care, refs: [mhlw-medical-guideline] }
          - { id: p02-a-record, points: -4, axis: record, refs: [jpcert-handling] }
      - id: p02-c-offline
        text: { ja: '端末は切り離し、紙の指示簿と予備端末を渡して確認する。', en: '' }
        explain: { ja: "隔離を守りながら、現場が使える代替手段と手順まで渡している。混乱を抑えて診療を続けられる。", en: "" }
        minutes: 45
        category: recover
        points: 120
        refs: [mhlw-medical-guideline, nist-sp800-61r3]
        gauges: { damage: -10, trust: 5, stamina: -10 }
        setFlags: { offlineKit: true }
        items:
          - { id: p02-c-content, points: 6, axis: content, refs: [nist-sp800-61r3] }
          - { id: p02-c-care, points: 6, axis: care, refs: [mhlw-medical-guideline] }
          - { id: p02-c-order, points: 5, axis: order, refs: [mhlw-medical-guideline] }
          - { id: p02-c-record, points: 4, axis: record, refs: [jpcert-handling] }
      - id: p02-b-isolate
        text: { ja: '端末は切り離すが、代わりの手段は現場の判断に任せきりにする。', en: '' }
        explain: { ja: "切り離した判断は適切。ただし代わりの手段を現場に丸投げすると、紙の運用が定着せず診療が滞る。", en: "" }
        minutes: 30
        category: maintain
        points: 20
        refs: [mhlw-medical-guideline]
        gauges: { stamina: -5 }
        items:
          - { id: p02-b-content, points: 4, axis: content, refs: [nist-sp800-61r3] }
          - { id: p02-b-care, points: 3, axis: care, refs: [mhlw-medical-guideline] }
          - { id: p02-b-order, points: 3, axis: order, refs: [jpcert-handling] }
    lesson: { ja: "隔離した端末は、現場の切迫した要求があっても戻さない。紙の指示簿やオフラインの予備端末を渡し、使い方まで一緒に確認する。任せきりにすると診療が滞り、戻すと感染が広がる。", en: "" }

  - id: p03-backup
    at: { day: 0, minutes: 405 }
    phase: contain
    sound: { se: [notify_chat] }
    text: { ja: '午前6時45分。オンラインの記憶装置は暗号化されたが、別館の保管庫にテープ三世代が無事だった。復元できるかは、中身を確かめるまで分からない。', en: '' }
    voices: [v03-expert, v03-boss, v03-ok]
    choices:
      - id: p03-b-offline
        text: { ja: 'バックアップをネットワークから切り離し、オフライン保管分を確認する。', en: '' }
        explain: { ja: "切り離して健全性を確かめる判断は適切。ただし復元の手順や切り戻しの条件がなく、現場は再開の判断ができない。", en: "" }
        minutes: 60
        category: recover
        points: 110
