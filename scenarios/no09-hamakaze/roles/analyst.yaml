          - { id: fr-r-log, text: { ja: '報告した時刻、宛先、版を記録する', en: '' }, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: fr-r-none, text: { ja: '口頭と同じ内容なので記録しない', en: '' }, points: -10, axis: record, refs: [jpcert-handling] }
      - id: ask
        label: { ja: '上への依頼', en: '' }
        options:
          - { id: fr-a-help, text: { ja: '必要な判断（診療の制限、外部支援の発注）を明記して求める', en: '' }, points: 8, axis: order, refs: [meti-csm-guideline] }
          - { id: fr-a-none, text: { ja: '事実だけを書いて、判断は求めない', en: '' }, points: -6, axis: order, refs: [meti-csm-guideline] }
  tech-report:
    title: { ja: '調査報告書の技術編', en: '' }
    slots:
      - id: entry
        label: { ja: '侵入口の書き方', en: '' }
        options:
          - { id: tr-e-vpn, text: { ja: '設備保守委託先のVPN機器から院内に入られた経路と時刻を書く', en: '' }, points: 10, axis: content, refs: [nist-sp800-61r3] }
          - { id: tr-e-vague, text: { ja: '「外部からの不正アクセス」とだけ書く', en: '' }, points: -12, axis: content, refs: [nist-sp800-61r3] }
      - id: cause
        label: { ja: '原因の書き方', en: '' }
        options:
          - { id: tr-c-cause, text: { ja: '更新されていなかった機器と、全員が管理者権限だった運用の両方を書く', en: '' }, points: 10, axis: content, refs: [no07-ipa-insider] }
          - { id: tr-c-person, text: { ja: '委託先の担当者個人の責任として書く', en: '' }, points: -12, axis: content, refs: [meti-csm-guideline] }
      - id: scope
        label: { ja: '影響範囲', en: '' }
        options:
          - { id: tr-s-range, text: { ja: '暗号化された端末の台数と、公開された患者情報の範囲を書く', en: '' }, points: 8, axis: content, refs: [ppc-report-scope] }
          - { id: tr-s-unknown, text: { ja: '範囲は「調査中」とだけ書く', en: '' }, points: -8, axis: content, refs: [ppc-report-scope] }
      - id: measures
        label: { ja: '再発防止策', en: '' }
        options:
          - { id: tr-m-plan, text: { ja: '再発防止策の実施時期と担当を書く', en: '' }, points: 10, axis: content, refs: [cissp-cbk-secops] }
          - { id: tr-m-slogan, text: { ja: '「再発防止に努めます」とだけ書く', en: '' }, points: -10, axis: content, refs: [cissp-cbk-secops] }
      - id: vendor
        label: { ja: '委託先との契約', en: '' }
        options:
          - { id: tr-v-contract, text: { ja: '委託契約にセキュリティ条項を入れる改定を書く', en: '' }, points: 8, axis: order, refs: [meti-csm-guideline] }
          - { id: tr-v-omit, text: { ja: '委託先の契約には触れない', en: '' }, points: -8, axis: order, refs: [meti-csm-guideline] }
      - id: patients
        label: { ja: '患者への対応', en: '' }
        options:
          - { id: tr-p-notify, text: { ja: '本人通知と相談窓口の実績を書く', en: '' }, points: 8, axis: care, refs: [ppc-notify-person] }
          - { id: tr-p-none, text: { ja: '患者への対応に触れない', en: '' }, points: -10, axis: care, refs: [ppc-notify-person] }
      - id: progress
        label: { ja: '進捗の公開', en: '' }
        options:
          - { id: tr-o-monthly, text: { ja: '進捗を毎月公開する', en: '' }, points: 8, axis: record, refs: [meti-disclosure-guidance] }
          - { id: tr-o-once, text: { ja: '一度だけ公開する', en: '' }, points: -5, axis: record, refs: [meti-disclosure-guidance] }
