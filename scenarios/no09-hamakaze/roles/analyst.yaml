          - { id: p03-b-content, points: 6, axis: content, refs: [nist-sp800-61r3] }
          - { id: p03-b-record, points: 4, axis: record, refs: [jpcert-handling] }
      - id: p03-a-restore
        text: { ja: 'ネットワークにつないだまま、バックアップから復元を始める。', en: '' }
        explain: { ja: "本番につないだままの復元は、バックアップに残る感染を呼び戻すおそれがある。隔離した環境で確かめるべきだ。", en: "" }
        minutes: 60
        category: hurt
        points: -120
        refs: [nist-sp800-61r3]
        gauges: { damage: 15, flame: 5 }
        delayed:
          - { afterPhases: 1, points: -60, gauges: { damage: 15 }, reason: { ja: 'バックアップも暗号化され、戻せる世代がなくなった。', en: '' } }
        items:
