        explain: { ja: "都合の悪い資料を外すと、検証が不十分になり、再発防止につながらない。後から判明すれば信頼も失う。", en: "" }
        minutes: 30
        category: fatal
        points: -250
        refs: [meti-csm-guideline]
        gauges: { flame: 25, trust: -25 }
        setFlags: { hidWarning: true }
        delayed:
          - { afterPhases: 1, points: -60, gauges: { flame: 20, trust: -15 }, reason: { ja: '担当者が自分の指摘を隠したことが報道され、説明責任を問われた。', en: '' } }
        items:
          - { id: p19-a-record, points: -14, axis: record, refs: [meti-csm-guideline] }
          - { id: p19-a-content, points: -10, axis: content, refs: [meti-csm-guideline] }
          - { id: p19-a-care, points: -7, axis: care, refs: [jpcert-handling] }
      - id: p19-b-submit
        text: { ja: '資料に含め、当時の経緯と自分の判断を正直に記録する。', en: '' }
        explain: { ja: "経緯を正直に書いた点は適切。ただし自分が押し切らなかった点や、再発防止の担当までは踏み込んでいない。", en: "" }
        minutes: 90
        category: recover
        points: 130
        refs: [meti-csm-guideline, jpcert-handling]
        gauges: { flame: -5, trust: 10, stamina: -10 }
        setFlags: { ownWarningSubmitted: true }
        detail: tech-report
        items:
          - { id: p19-b-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: p19-b-content, points: 7, axis: content, refs: [meti-csm-guideline] }
          - { id: p19-b-wording, points: 5, axis: wording, refs: [meti-disclosure-guidance] }
      - id: p19-d-blame
        text: { ja: '「上の判断で止められた」とだけ書き、自分は悪くない形にする。', en: '' }
        explain: { ja: "責任を上にだけ寄せると、同じ判断が繰り返される。再発防止の主体が誰もいなくなる。", en: "" }
        minutes: 45
        category: hurt
        points: -70
        refs: [meti-csm-guideline]
        gauges: { flame: 10, trust: -10 }
        items:
          - { id: p19-d-wording, points: -8, axis: wording, refs: [meti-csm-guideline] }
          - { id: p19-d-care, points: -7, axis: care, refs: [jpcert-handling] }
      - id: p19-c-own
        text: { ja: '資料に含め、押し切らなかった点も書き、担当を引き受ける。', en: '' }
        explain: { ja: "事実を残したうえで自分の責任を引き受けている。再発防止が人と仕組みに根づく点で最も評価できる。", en: "" }
        minutes: 120
        category: increase
        points: 220
        fatalAlternate: 50
        refs: [meti-csm-guideline, cissp-cbk-secops]
        gauges: { flame: -10, trust: 20, stamina: -15 }
        setFlags: { ownWarningSubmitted: true, ownWarningOwned: true }
        detail: tech-report
        items:
          - { id: p19-c-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: p19-c-content, points: 8, axis: content, refs: [meti-csm-guideline] }
          - { id: p19-c-care, points: 7, axis: care, refs: [cissp-cbk-secops] }
          - { id: p19-c-wording, points: 5, axis: wording, refs: [meti-disclosure-guidance] }
    lesson: { ja: "自分の関与が不利に見える資料ほど、外さずに残す。押し切れなかった点も書き、再発防止の担当を引き受ける。隠すと検証が崩れ、責任を上に寄せるだけでは同じ判断が繰り返される。", en: "" }
drafts:
  first-report:
    title: { ja: '医療情報部の一次報告', en: '' }
    slots:
      - id: timing
        label: { ja: '報告する時刻', en: '' }
        auto: true
        items:
          - { id: fr-t-2h, when: { withinHours: 3 }, points: 10, axis: time, refs: [jpcert-handling] }
          - { id: fr-t-5h, when: { withinHours: 6 }, points: 5, axis: time, refs: [jpcert-handling] }
          - { id: fr-t-late, when: { otherwise: true }, points: -12, axis: time, refs: [jpcert-handling] }
      - id: scope
        label: { ja: '影響範囲の書き方', en: '' }
        options:
          - { id: fr-s-ehr, text: { ja: '電子カルテだけと書く', en: '' }, points: -10, axis: content, refs: [mhlw-medical-guideline], explain: { ja: "電子カルテだけと書くと、共有フォルダや検査系の被害が見落とされ、初動の対応が遅れる。", en: "" } }
          - { id: fr-s-all, text: { ja: '電子カルテ、共有フォルダ、検査系、設備保守委託先の接続を並べる', en: '' }, points: 8, axis: content, refs: [mhlw-medical-guideline], explain: { ja: "電子カルテ、共有フォルダ、検査系、委託先の接続を並べると、影響の広がりが伝わる。", en: "" } }
      - id: facts
        label: { ja: '事実と推測の書き分け', en: '' }
        options:
          - { id: fr-f-split, text: { ja: '確認できた事実と、まだ分からないことを分けて書く', en: '' }, points: 10, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: "確認できた事実と不明を分けると、誤った断定を避けられ、後から落ち着いて訂正できる。", en: "" } }
          - { id: fr-f-guess, text: { ja: '「VPN機器の脆弱性が原因」と断定して書く', en: '' }, points: -15, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: "脆弱性が原因と断定すると、違っていたときに調査全体の信頼を失い、説明のやり直しになる。", en: "" } }
      - id: next
        label: { ja: '次の更新', en: '' }
        options:
          - { id: fr-n-none, text: { ja: '次回の予定を書かない', en: '' }, points: -6, axis: time, refs: [cissp-cbk-secops], explain: { ja: "次回の予定がないと、情報の空白を憶測で埋められる。現場と患者の不安が大きくなる。", en: "" } }
          - { id: fr-n-time, text: { ja: '次の更新時刻と、更新する担当を書く', en: '' }, points: 8, axis: time, refs: [cissp-cbk-secops], explain: { ja: "次の更新時刻と担当を書くと、受け取る側が続報を待てる。問い合わせの集中も抑えられる。", en: "" } }
      - id: record
        label: { ja: '記録', en: '' }
        options:
          - { id: fr-r-log, text: { ja: '報告した時刻、宛先、版を記録する', en: '' }, points: 8, axis: record, refs: [jpcert-handling], explain: { ja: "報告した時刻、宛先、版を記録すると、後から説明の経緯を正確にたどれるようになる。", en: "" } }
          - { id: fr-r-none, text: { ja: '口頭と同じ内容なので記録しない', en: '' }, points: -10, axis: record, refs: [jpcert-handling], explain: { ja: "口頭と同じだからと記録しないと、誰に何を伝えたか分からなくなり、後から説明が崩れる。", en: "" } }
      - id: ask
        label: { ja: '上への依頼', en: '' }
        options:
          - { id: fr-a-none, text: { ja: '事実だけを書いて、判断は求めない', en: '' }, points: -6, axis: order, refs: [meti-csm-guideline], explain: { ja: "事実だけを書いて判断を求めないと、必要な決裁が止まったままになり、現場が待ち続ける。", en: "" } }
          - { id: fr-a-help, text: { ja: '必要な判断（診療の制限、外部支援の発注）を明記して求める', en: '' }, points: 8, axis: order, refs: [meti-csm-guideline], explain: { ja: "必要な判断を明記すると、上は何を決めればよいか分かる。判断待ちの停滞を防げるはずだ。", en: "" } }
  tech-report:
    title: { ja: '調査報告書の技術編', en: '' }
    slots:
      - id: entry
        label: { ja: '侵入口の書き方', en: '' }
        options:
          - { id: tr-e-vague, text: { ja: '「外部からの不正アクセス」とだけ書く', en: '' }, points: -12, axis: content, refs: [nist-sp800-61r3], explain: { ja: "「不正アクセス」だけでは、どこを塞ぐのか分からない。同じ穴が地域に残ったままになる。", en: "" } }
          - { id: tr-e-vpn, text: { ja: '設備保守委託先のVPN機器から院内に入られた経路と時刻を書く', en: '' }, points: 10, axis: content, refs: [nist-sp800-61r3], explain: { ja: "侵入口と時刻を書くと、同じ経路の点検ができる。原因の追跡も具体的に進められるようになる。", en: "" } }
      - id: cause
        label: { ja: '原因の書き方', en: '' }
        options:
          - { id: tr-c-cause, text: { ja: '更新されていなかった機器と、全員が管理者権限だった運用の両方を書く', en: '' }, points: 10, axis: content, refs: [no07-ipa-insider], explain: { ja: "更新されていない機器と、全員が管理者権限だった運用の両方を書くと、対策が決まる。", en: "" } }
          - { id: tr-c-person, text: { ja: '委託先の担当者個人の責任として書く', en: '' }, points: -12, axis: content, refs: [meti-csm-guideline], explain: { ja: "担当者個人の責任にすると、契約や運用の不備が見えず、再発防止につながらないおそれがある。", en: "" } }
      - id: scope
        label: { ja: '影響範囲', en: '' }
        options:
          - { id: tr-s-unknown, text: { ja: '範囲は「調査中」とだけ書く', en: '' }, points: -8, axis: content, refs: [ppc-report-scope], explain: { ja: "範囲を「調査中」とだけ書くと、どこまで確認したのか分からず、患者と家族の不安が残る。", en: "" } }
          - { id: tr-s-range, text: { ja: '暗号化された端末の台数と、公開された患者情報の範囲を書く', en: '' }, points: 8, axis: content, refs: [ppc-report-scope], explain: { ja: "端末の台数と公開された患者情報の範囲を書くと、被害の大きさと必要な対応が伝わる。", en: "" } }
      - id: measures
        label: { ja: '再発防止策', en: '' }
        options:
          - { id: tr-m-plan, text: { ja: '再発防止策の実施時期と担当を書く', en: '' }, points: 10, axis: content, refs: [cissp-cbk-secops], explain: { ja: "時期と担当があれば、対策が実行されたか検証できる。毎月の進捗の公開にもそのまま使える。", en: "" } }
          - { id: tr-m-slogan, text: { ja: '「再発防止に努めます」とだけ書く', en: '' }, points: -10, axis: content, refs: [cissp-cbk-secops], explain: { ja: "「努めます」だけでは、何をいつ誰がやるのか分からない。実行されたかの検証もできない。", en: "" } }
      - id: vendor
        label: { ja: '委託先との契約', en: '' }
        options:
          - { id: tr-v-omit, text: { ja: '委託先の契約には触れない', en: '' }, points: -8, axis: order, refs: [meti-csm-guideline], explain: { ja: "委託先の契約に触れないと、同じ型のリスクが残る。再発防止の点検も進まないままになる。", en: "" } }
          - { id: tr-v-contract, text: { ja: '委託契約にセキュリティ条項を入れる改定を書く', en: '' }, points: 8, axis: order, refs: [meti-csm-guideline], explain: { ja: "セキュリティ条項の改定を書くと、次の契約で同じ不備を繰り返さずに済むようになる。", en: "" } }
      - id: patients
        label: { ja: '患者への対応', en: '' }
        options:
          - { id: tr-p-notify, text: { ja: '本人通知と相談窓口の実績を書く', en: '' }, points: 8, axis: care, refs: [ppc-notify-person], explain: { ja: "本人通知と相談窓口の実績を書くと、患者対応が実際に行われたことが具体的に伝わる。", en: "" } }
          - { id: tr-p-none, text: { ja: '患者への対応に触れない', en: '' }, points: -10, axis: care, refs: [ppc-notify-person], explain: { ja: "患者への対応に触れないと、被害者の視点が抜けた報告になる。地域の信頼も戻らない。", en: "" } }
      - id: progress
        label: { ja: '進捗の公開', en: '' }
        options:
          - { id: tr-o-once, text: { ja: '一度だけ公開する', en: '' }, points: -5, axis: record, refs: [meti-disclosure-guidance], explain: { ja: "一度きりの公開では、その後の進み具合が分からない。未完了の対策が放置されやすい。", en: "" } }
          - { id: tr-o-monthly, text: { ja: '進捗を毎月公開する', en: '' }, points: 8, axis: record, refs: [meti-disclosure-guidance], explain: { ja: "毎月の進捗公開は、対策が形だけになっていないか確かめられる。改善の速度も見える。", en: "" } }
