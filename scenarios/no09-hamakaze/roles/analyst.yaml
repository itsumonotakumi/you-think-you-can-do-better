          - { id: p03-a-order, points: -6, axis: order, refs: [nist-sp800-61r3] }
          - { id: p03-a-record, points: -4, axis: record, refs: [jpcert-handling] }
      - id: p03-c-report
        text: { ja: 'バックアップがあるので、復元すれば戻ると上に報告する。', en: '' }
        explain: { ja: "確認前の報告は、復旧の見通しを誤らせる。壊れたバックアップなら、その後の判断が大きく崩れる。", en: "" }
        minutes: 15
        category: hurt
        points: -80
        refs: [jpcert-handling]
        gauges: { trust: -5 }
        items:
          - { id: p03-c-content, points: -8, axis: content, refs: [nist-sp800-61r3] }
          - { id: p03-c-wording, points: -5, axis: wording, refs: [meti-disclosure-guidance] }
    lesson: { ja: "バックアップは、ネットワークから切り離して健全性を確かめる。復元できると確認前に報告すると、見通しが崩れる。復元の順番と切り戻しの条件を決めてから本番に戻す。確認を飛ばさない。", en: "" }

