          - { id: cr-e-none, text: { ja: '証拠保全に触れない', en: '' }, points: -8, axis: record, refs: [jpcert-handling], explain: { ja: "証拠保全に触れないと、調査の前提が崩れる。原因の特定も再発防止の根拠も示せない。", en: "" } }
