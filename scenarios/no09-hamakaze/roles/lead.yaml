        gauges: { damage: -10, trust: 5, stamina: -15 }
        setFlags: { evidencePreserved: true, evidenceChain: true }
        items:
          - { id: p06-c-record, points: 10, axis: record, refs: [cissp-cbk-secops] }
          - { id: p06-c-order, points: 8, axis: order, refs: [nist-sp800-61r3] }
          - { id: p06-c-content, points: 5, axis: content, refs: [nist-sp800-61r3] }
      - id: p06-a-wipe
        text: { ja: '影響した端末を初期化して、午後の外来に間に合わせる。', en: '' }
        explain: { ja: "復旧は早いが、証拠が消えて侵入口も手口も分からなくなる。同じ経路で再び被害を受けるおそれがある。", en: "" }
        minutes: 120
