          - { id: cr-p-vague, text: { ja: '「権限設定の不備」とだけ書く', en: '' }, points: -10, axis: content, refs: [no07-ipa-insider], explain: { ja: "「権限設定の不備」だけでは、何をどう変えるのか分からない。対策が実行されないまま終わる。", en: "" } }
