          - { id: p05-a-content, points: -10, axis: content, refs: [npa-consult] }
          - { id: p05-a-care, points: -5, axis: care, refs: [npa-consult] }
      - id: p05-c-plan
        text: { ja: '上申と警察への相談に加え、情報公開に備えた患者対応の下書きを作る。', en: '' }
        explain: { ja: "支払わない判断と患者対応の準備を同時に進めている。公開後の混乱を抑えられる点が評価できる。", en: "" }
        minutes: 90
        category: recover
        points: 100
        refs: [npa-consult, ppc-notify-person]
        gauges: { flame: -10, trust: 10, stamina: -10 }
        setFlags: { policeConsult: true, refusedRansom: true, patientPlanDraft: true }
        items:
          - { id: p05-c-order, points: 8, axis: order, refs: [npa-consult] }
          - { id: p05-c-care, points: 10, axis: care, refs: [ppc-notify-person] }
          - { id: p05-c-record, points: 5, axis: record, refs: [jpcert-handling] }
      - id: p05-b-refuse
        text: { ja: '返信せず、要求文と接続記録を保全する。病院長に上申し、警察への相談を進める。', en: '' }
        explain: { ja: "保全と上申、警察への相談は適切。ただし情報が公開された場合の患者対応が後手になる。", en: "" }
        minutes: 60
        category: maintain
        points: 10
        refs: [npa-consult, jpcert-handling]
        gauges: { flame: -5, trust: 5, stamina: -5 }
        setFlags: { policeConsult: true, refusedRansom: true }
        items:
          - { id: p05-b-order, points: 10, axis: order, refs: [npa-consult] }
          - { id: p05-b-record, points: 8, axis: record, refs: [jpcert-handling] }
