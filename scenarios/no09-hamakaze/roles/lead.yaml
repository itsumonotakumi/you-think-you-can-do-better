# No.9 ハマカゼ総合医療センター / セキュリティ部門長（医療情報部長 兼 情報セキュリティ責任者）ロール
# 判断ポイント20、細目は choices[].items と drafts の合計で80以上。
# 視点: 専任のセキュリティ部署がない病院で、技術の判断と経営への上申を一人でつなぐ兼任の責任者。
#       端末の隔離、証拠の保全、外部専門家の手配、権限の棚卸し、復旧の順番、委託先との調整が仕事。
estimateMinutes: 35
intro: { ja: 'あなたはハマカゼ総合医療センターの医療情報部長で、情報セキュリティ責任者を兼ねている。専任のセキュリティ部署はなく、医療情報部の六人と、外部の相談先が頼りだ。早朝に電子カルテが止まり、端末には暗号化の警告が並んだ。技術の言葉を経営の判断につなぐ、長い一日が始まる。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-ppc-prelim
    ref: ppc-report-prelim
    label: { ja: '個人情報保護委員会への速報（技術情報の提供）', en: '' }
    points: -150
    doneFlag: ppcPrelimFiled
events:
  - id: ev-ambulance
    at: { day: 0, minutes: 420 }
    voices: [v-ev-ambulance]
    gauges: { flame: 5 }
    sound: { se: [phone_ring] }
    caption: { ja: '消防指令センターから、救急の受け入れについて確認が入った。', en: '' }
  - id: ev-poster
    at: { day: 0, minutes: 840 }
    voices: [v-ev-poster]
    caption: { ja: '院内の掲示板には「不審なメールは開かないように」の貼り紙。今回の侵入口は、設備保守委託先のVPN機器だった。', en: '' }
  - id: ev-news
    at: { day: 0, minutes: 1260 }
    voices: [v-ev-news]
    gauges: { flame: 10 }
    sound: { se: [notify_news] }
    caption: { ja: '地域紙の速報が、院内システムの停止を報じた。', en: '' }
  - id: ev-family
    at: { day: 1, minutes: 720 }
    voices: [v-ev-family]
    gauges: { flame: 5 }
    sound: { se: [phone_ring] }
    caption: { ja: '患者家族からの電話が、問い合わせ窓口に集中している。', en: '' }
  - id: ev-regional
    at: { day: 2, minutes: 480 }
    voices: [v-ev-regional]
    gauges: { flame: 5 }
    caption: { ja: '地域の医療機関から、紹介患者の受け入れについて問い合わせが来た。', en: '' }
points:
  - id: p01-alert
    at: { day: 0, minutes: 330 }
    phase: detect
    sound: { se: [notify_chat] }
    text: { ja: '午前5時30分。当直の看護師から「電子カルテが全館で開かない」と電話が入った。同時に、医療情報部の端末には、共有フォルダを暗号化する動きの警告が三件並んだ。救急の患者が来ている。', en: '' }
    voices: [v01-boss, v01-field, v01-ok]
    notable:
      - { id: note-outage, text: { ja: '午前5時30分、電子カルテが全館で停止した。', en: '' } }
    choices:
      - id: p01-a-reboot
        text: { ja: '再起動を繰り返して復旧を待ち、朝の外来が始まるまで様子を見続ける。', en: '' }
        explain: { ja: "再起動では暗号化の進行も侵入口も分からない。待つ間に被害が広がり、初動の記録も残らない。", en: "" }
        minutes: 60
        category: hurt
        points: -120
        refs: [jpcert-handling]
        gauges: { flame: 10, trust: -5, damage: 10 }
        setFlags: { delayedTriage: true }
        delayed:
          - { afterPhases: 1, points: -40, gauges: { damage: 10 }, reason: { ja: '隔離が遅れた端末から、同じ共有フォルダへの暗号化が広がった。', en: '' } }
        items:
          - { id: p01-a-time, points: -10, axis: time, refs: [jpcert-handling] }
          - { id: p01-a-record, points: -8, axis: record, refs: [jpcert-handling] }
      - id: p01-c-preserve
        text: { ja: '切り離しと同時に端末のメモリとログを保全し、院長へ第一報を入れる。', en: '' }
        explain: { ja: "封じ込めと証拠保全、上への報告を同時に進めている。初動で記録を残した点が後日の調査を支える。", en: "" }
        minutes: 45
        category: recover
        points: 100
        refs: [nist-sp800-61r3, jpcert-handling]
        gauges: { damage: -10, flame: -10, trust: 10, stamina: -10 }
        setFlags: { isolated: true, evidencePreserved: true }
        items:
          - { id: p01-c-order, points: 8, axis: order, refs: [nist-sp800-61r3] }
          - { id: p01-c-record, points: 10, axis: record, refs: [jpcert-handling] }
          - { id: p01-c-time, points: 5, axis: time, refs: [jpcert-handling] }
          - { id: p01-c-content, points: 5, axis: content, refs: [nist-sp800-61r3] }
      - id: p01-b-isolate
        text: { ja: '全端末をネットワークから切り離し、紙のカルテと指示簿に切り替える。', en: '' }
        explain: { ja: "切り離しと紙への切り替えは適切。ただし影響した端末の記録保全と上への第一報が抜けている。", en: "" }
        minutes: 30
        category: maintain
        points: 10
        refs: [mhlw-medical-guideline, nist-sp800-61r3]
        gauges: { damage: -5, flame: -5, trust: 5, stamina: -5 }
        setFlags: { isolated: true }
        items:
          - { id: p01-b-order, points: 8, axis: order, refs: [nist-sp800-61r3] }
          - { id: p01-b-care, points: 5, axis: care, refs: [mhlw-medical-guideline] }
          - { id: p01-b-time, points: 5, axis: time, refs: [mhlw-medical-guideline] }
    lesson: { ja: "感染が疑われる端末は、まず切り離して紙に切り替える。同時にメモリとログを保全し、院長と事務局長へ第一報を入れる。再起動や様子見は暗号化を進め、証拠も失わせる。記録が後日の説明を支える。", en: "" }

  - id: p02-emergency
    at: { day: 0, minutes: 375 }
    phase: contain
    sound: { se: [phone_ring] }
    text: { ja: '午前6時15分。救急外来の医師から「この端末だけは今すぐ使わせてくれ。この患者は待てない」と詰め寄られた。端末は隔離済みで、紙の運用はまだ現場に浸透していない。', en: '' }
    voices: [v02-field, v02-public, v02-ok]
    choices:
      - id: p02-a-open
        text: { ja: 'その端末だけ接続を戻し、目の前の患者の診療を最優先にする。', en: '' }
        explain: { ja: "患者を優先する気持ちは分かるが、隔離した端末を戻すと感染が再び広がる。他の患者と職員の安全を損なう。", en: "" }
        minutes: 30
        category: hurt
        points: -100
        refs: [mhlw-medical-guideline]
        gauges: { damage: 15, trust: -5 }
        delayed:
          - { afterPhases: 1, points: -40, gauges: { damage: 10 }, reason: { ja: '戻した端末から、同じ共有フォルダへ暗号化が再び広がった。', en: '' } }
        items:
          - { id: p02-a-care, points: -10, axis: care, refs: [mhlw-medical-guideline] }
          - { id: p02-a-content, points: -8, axis: content, refs: [nist-sp800-61r3] }
      - id: p02-b-paper
        text: { ja: '接続は戻さず、紙の指示簿と電話連絡で現場を回し続ける。', en: '' }
        explain: { ja: "隔離を維持した判断は適切。ただし紙の手順を現場に配らず、記載の担当も決まっていないため混乱する。", en: "" }
        minutes: 45
        category: maintain
        points: 10
        refs: [mhlw-medical-guideline]
        gauges: { trust: 5, stamina: -5 }
        items:
          - { id: p02-b-order, points: 8, axis: order, refs: [mhlw-medical-guideline] }
          - { id: p02-b-care, points: 5, axis: care, refs: [mhlw-medical-guideline] }
      - id: p02-c-share
        text: { ja: '接続は戻さず、紙の手順を配って記載の担当を決める。', en: '' }
        explain: { ja: "隔離を守りながら、現場が動ける手順と担当まで整えている。紙の手順と担当を決めた点が抜けを防ぐ。", en: "" }
        minutes: 60
        category: recover
        points: 100
        refs: [mhlw-medical-guideline, jpcert-handling]
        gauges: { damage: -5, trust: 10, stamina: -10 }
        setFlags: { paperDrill: true }
        items:
          - { id: p02-c-care, points: 10, axis: care, refs: [mhlw-medical-guideline] }
          - { id: p02-c-order, points: 8, axis: order, refs: [mhlw-medical-guideline] }
          - { id: p02-c-record, points: 5, axis: record, refs: [jpcert-handling] }
    lesson: { ja: "隔離した端末は、現場の切迫した要求があっても戻さない。代わりに紙の指示簿と電話連絡の手順を配り、記載の担当を決めて申し送りで共有する。戻す判断は感染を再び広げる。", en: "" }

  - id: p03-vendor
    at: { day: 0, minutes: 450 }
    phase: contain
    sound: { se: [phone_ring] }
    text: { ja: '午前7時30分。侵入口の候補が一つに絞られた。設備保守委託先が保守用に置いたVPN機器。運用担当の外山は「弊社の機器に問題はない」と言い、設定を見せようとしない。', en: '' }
    voices: [v03-vendor, v03-boss, v03-ok]
    choices:
      - id: p03-c-joint
        text: { ja: '接続を止めさせ、設定とログを保全して共同調査を始める。', en: '' }
        explain: { ja: "停止、保全、共同調査を順に進めている。証拠を確保したまま原因を確認できる点が強い。", en: "" }
        minutes: 90
        category: recover
        points: 100
        refs: [meti-csm-guideline, no06-ipa-10threats]
        gauges: { damage: -10, trust: 10, stamina: -10 }
        setFlags: { vendorCut: true, jointVendorReview: true }
        items:
