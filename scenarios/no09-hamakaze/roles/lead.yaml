          - { id: cr-l-gap, text: { ja: '保存期間と、欠損した期間を明記する', en: '' }, points: 8, axis: record, refs: [cissp-cbk-secops], explain: { ja: "保存期間と欠損した期間を書くと、調査の限界を正直に示せる。証拠の評価もぶれない。", en: "" } }
