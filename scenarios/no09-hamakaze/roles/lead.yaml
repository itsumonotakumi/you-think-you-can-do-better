          - { id: p03-c-record, points: 10, axis: record, refs: [jpcert-handling] }
          - { id: p03-c-content, points: 5, axis: content, refs: [no06-ipa-10threats] }
      - id: p03-a-believe
        text: { ja: '委託先の説明を信じ、機器を調査の対象から外したまま進める。', en: '' }
        explain: { ja: "説明をそのまま受け入れると、侵入口の候補を自ら消してしまう。設定を見せない理由を確かめる必要がある。", en: "" }
        minutes: 45
        category: hurt
        points: -100
        refs: [meti-csm-guideline]
        gauges: { damage: 10, trust: -10 }
        items:
          - { id: p03-a-content, points: -10, axis: content, refs: [meti-csm-guideline] }
          - { id: p03-a-order, points: -8, axis: order, refs: [meti-csm-guideline] }
      - id: p03-b-cut
        text: { ja: '機器の接続を止めさせ、接続履歴の提供を文書で請求する。', en: '' }
        explain: { ja: "接続停止と履歴提供の要求は適切。ただし設定とログの保全を条件にしておらず、後から確認できないおそれがある。", en: "" }
        minutes: 45
        category: maintain
        points: 10
        refs: [meti-csm-guideline]
        gauges: { damage: -5, trust: 5, stamina: -5 }
        setFlags: { vendorCut: true }
        items:
          - { id: p03-b-order, points: 8, axis: order, refs: [meti-csm-guideline] }
          - { id: p03-b-record, points: 5, axis: record, refs: [jpcert-handling] }
    lesson: { ja: "委託先の機器が侵入口の候補なら、説明を待たずに接続を止めさせる。設定とログを保全し、契約に基づく共同調査を文書で始める。機器に問題はないという主張だけで対象から外すと、原因を追えなくなる。", en: "" }

