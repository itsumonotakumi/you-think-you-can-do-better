          - { id: p04-a-care, points: -8, axis: care, refs: [ipa-sme-guideline] }
      - id: p04-b-roles
        text: { ja: '指揮、記録、外部連絡、現場対応を分けて当番表を作り直す。', en: '' }
        explain: { ja: "役割を分けた点は良い。ただし外部の相談窓口や保険会社への連絡が遅れ、応援の手配が始まらない。", en: "" }
        minutes: 60
        category: maintain
        points: 10
        refs: [cissp-cbk-secops, jpcert-handling]
        gauges: { stamina: 5, trust: 5 }
        setFlags: { command: true }
        items:
          - { id: p04-b-order, points: 8, axis: order, refs: [cissp-cbk-secops] }
          - { id: p04-b-record, points: 5, axis: record, refs: [jpcert-handling] }
          - { id: p04-b-care, points: 5, axis: care, refs: [ipa-sme-guideline] }
      - id: p04-c-external
        text: { ja: '役割分担に加え、外部の相談窓口と保険会社へ連絡する。', en: '' }
        explain: { ja: "分担と外部支援の起動を同時に進めている。相談先を早く押さえた点が良い判断だと思う。", en: "" }
        minutes: 90
        category: recover
        points: 100
        refs: [cissp-cbk-secops, meti-csm-guideline]
        gauges: { stamina: -5, trust: 10 }
        setFlags: { command: true, externalHelp: true }
        items:
          - { id: p04-c-order, points: 8, axis: order, refs: [cissp-cbk-secops] }
          - { id: p04-c-record, points: 5, axis: record, refs: [jpcert-handling] }
          - { id: p04-c-care, points: 8, axis: care, refs: [ipa-sme-guideline] }
          - { id: p04-c-time, points: 5, axis: time, refs: [meti-csm-guideline] }
    lesson: { ja: "対策本部では、指揮、記録、外部連絡、現場対応を分けて当番を決める。同時に外部の相談窓口と保険会社へ連絡し、応援の手配を始める。自分が全部を持つと、記録と外部連絡が最初に落ちる。", en: "" }

  - id: p05-ransom
    at: { day: 0, minutes: 570 }
    phase: organize
    sound: { se: [mail_arrive] }
    text: { ja: '午前9時30分。暗号化されたフォルダに、身代金の要求文が残されていた。医療情報部の端末が一通だけ開いてしまった。「連絡がなければ患者の情報をすべて公開する」と書いてある。法務が言った。「これは犯罪です。判断は私たちの側にあります」。', en: '' }
    voices: [v05-attacker, v05-public, v05-ok]
    choices:
      - id: p05-a-pay
        text: { ja: '要求に応じる方向で、支払いの段取りを関係者と早急に進めると決める。', en: '' }
        explain: { ja: "支払いは復号を保証せず、犯罪組織への資金提供にもつながる。患者情報の公開を止める保証もない。", en: "" }
