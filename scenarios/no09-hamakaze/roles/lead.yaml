drafts:
  tech-factsheet:
    title: { ja: '第一報の技術ファクトシート', en: '' }
    slots:
      - id: timing
        label: { ja: '出す時刻', en: '' }
        auto: true
        items:
          - { id: tf-t-12h, when: { withinHours: 18 }, points: 10, axis: time, refs: [meti-disclosure-guidance] }
          - { id: tf-t-24h, when: { withinHours: 24 }, points: 5, axis: time, refs: [meti-disclosure-guidance] }
          - { id: tf-t-late, when: { otherwise: true }, points: -15, axis: time, refs: [meti-disclosure-guidance] }
      - id: confirmed
        label: { ja: '確認できた事実', en: '' }
        options:
          - { id: tf-c-merge, text: { ja: '発生と検知をまとめて書く', en: '' }, points: -8, axis: wording, refs: [jpcert-handling], explain: { ja: "発生と検知をまとめると、遅れの原因が見えず、再発防止の検討ができないままになる。", en: "" } }
          - { id: tf-c-time, text: { ja: '発生と検知の日時を分けて書く', en: '' }, points: 5, axis: content, refs: [jpcert-handling], explain: { ja: "発生と検知を分けると、どこで遅れたのかを検証できる。対策の優先順位も決めやすい。", en: "" } }
      - id: uncertain
        label: { ja: '不確実な点の書き方', en: '' }
        options:
          - { id: tf-u-split, text: { ja: '「確認」と「可能性」を分けて書く', en: '' }, points: 10, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: "「確認」と「可能性」を分けると、誤った断定を避けられ、後から訂正しやすい説明になる。", en: "" } }
          - { id: tf-u-confirm, text: { ja: 'すべて「確認」と断定する', en: '' }, points: -15, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: "すべて確認と断定すると、誤りが判明したときに説明の信頼を大きく失い、訂正も難しくなる。", en: "" } }
          - { id: tf-u-omit, text: { ja: '不確実な点を書かない', en: '' }, points: -10, axis: wording, refs: [ppc-report-prelim], explain: { ja: "不確実な点を書かないと、空白を憶測で埋められる。後から追加の説明が必要になってしまう。", en: "" } }
      - id: scope
        label: { ja: '対象範囲', en: '' }
        options:
          - { id: tf-s-inpatient, text: { ja: '入院患者だけ', en: '' }, points: -15, axis: content, refs: [ppc-notify-person], explain: { ja: "外来患者と家族に情報が届かず、問い合わせが窓口に集中する。対象を分ける理由も伝わらない。", en: "" } }
          - { id: tf-s-all, text: { ja: '入院と外来のすべての患者と家族', en: '' }, points: 10, axis: content, refs: [ppc-notify-person], explain: { ja: "入院と外来の両方に届く範囲で、患者と家族が自分事として行動できる。対象を狭めると不安が残る。", en: "" } }
      - id: cause
        label: { ja: '原因の書き方', en: '' }
        options:
          - { id: tf-c-attack, text: { ja: '外部からのサイバー攻撃による電子カルテの停止', en: '' }, points: 8, axis: content, refs: [meti-disclosure-guidance], explain: { ja: "原因を攻撃と明記できている。調査中でも確認できた事実として書けるので、隠蔽の印象を避けられる。", en: "" } }
          - { id: tf-c-fault, text: { ja: '機器の故障', en: '' }, points: -20, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: "機器の故障と書くと、後から攻撃と判明したときに隠蔽と受け取られる。患者の判断も誤らせる。", en: "" } }
      - id: restrictions
        label: { ja: '診療の制限', en: '' }
        options:
          - { id: tf-r-vague, text: { ja: '「一部の診療を制限」とだけ書く', en: '' }, points: -10, axis: content, refs: [mhlw-medical-guideline], explain: { ja: "「一部」では何が止まっているか分からず、患者が問い合わせに殺到する。受診の判断もできない。", en: "" } }
          - { id: tf-r-specific, text: { ja: '救急の受け入れ停止、手術の延期、検査の制限を具体的に書く', en: '' }, points: 10, axis: content, refs: [mhlw-medical-guideline], explain: { ja: "止まっている診療が具体的で、患者は予約や受診の判断ができる。問い合わせの前に行動できる。", en: "" } }
      - id: action
        label: { ja: '患者が今すぐすること', en: '' }
        options:
          - { id: tf-a-concrete, text: { ja: '予約の変更、服用中の薬、急変時の連絡先を具体的に書く', en: '' }, points: 10, axis: care, refs: [ppc-notify-person], explain: { ja: "患者が今すぐ取る行動が具体的で、不安の中でも動ける。予約変更や服薬の確認まで届く。", en: "" } }
          - { id: tf-a-generic, text: { ja: '「注意してください」とだけ書く', en: '' }, points: -10, axis: care, refs: [ppc-notify-person], explain: { ja: "「注意してください」だけでは、何をすればよいか伝わらない。患者は情報を探して窓口に殺到する。", en: "" } }
      - id: contact
        label: { ja: '問い合わせ窓口', en: '' }
        options:
          - { id: tf-w-number, text: { ja: '番号だけを書く', en: '' }, points: -5, axis: care, refs: [meti-csm-guideline], explain: { ja: "番号だけでは受付時間が分からず、夜間の問い合わせが迷う。増員の見通しも伝わらない。", en: "" } }
          - { id: tf-w-hours, text: { ja: '専用窓口の番号、受付時間、増員を書く', en: '' }, points: 8, axis: care, refs: [meti-csm-guideline], explain: { ja: "番号と受付時間、増員まで示すと、つながる見通しが立つ。待つ側の不安を減らし、集中も抑えられる。", en: "" } }
          - { id: tf-w-none, text: { ja: '窓口を書かない', en: '' }, points: -15, axis: care, refs: [meti-csm-guideline], explain: { ja: "窓口がないと、患者は行き場を失い、SNSや報道に流れる。問い合わせの負担も現場に戻る。", en: "" } }
      - id: apology
        label: { ja: '謝罪の主語', en: '' }
        options:
          - { id: tf-ap-hospital, text: { ja: '「当院」として謝罪する', en: '' }, points: 5, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: "提供主体として謝罪する姿勢が伝わる。責任の所在も明確になり、患者と家族への説明の前提が揃う。", en: "" } }
          - { id: tf-ap-vendor, text: { ja: '「委託先」の責任として謝罪する', en: '' }, points: -10, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: "委託先に責任を寄せると、自院の説明責任を回避したと映る。患者との信頼も損ない、再発防止の主体が曖昧になる。", en: "" } }
      - id: approval
        label: { ja: '院内の確認', en: '' }
        options:
          - { id: tf-i-solo, text: { ja: '医療情報部の判断だけで出す', en: '' }, points: -10, axis: order, refs: [meti-csm-guideline], explain: { ja: "医療情報部だけで出すと、法務や現場の確認が抜けやすい。訂正が増えるほど信頼を失い、説明のやり直しも難しくなる。", en: "" } }
          - { id: tf-i-share, text: { ja: '公表前に広報、法務、医療情報部で文案を確認する', en: '' }, points: 5, axis: order, refs: [meti-csm-guideline], explain: { ja: "複数の部署で確認することで、事実誤認と表現の偏りを減らせる。患者対応の前提も揃う。", en: "" } }
  control-report:
    title: { ja: '調査報告書の技術面の章', en: '' }
