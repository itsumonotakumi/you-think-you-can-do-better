    text: { ja: '午前8時30分。対策本部を置く。医療情報部は六人で、うち一人は育休中。誰が指揮し、誰が記録し、誰が外部と連絡するか。決めないまま、質問が自分に集まっている。', en: '' }
    voices: [v04-flattery, v04-boss, v04-ok]
    choices:
      - id: p04-a-alone
        text: { ja: '自分が指揮も調査も外部連絡も持ち、そのほうが速いと判断する。', en: '' }
        explain: { ja: "一人で抱えると判断は速く見えるが、記録と外部連絡が滞る。疲労も集中し、長期の対応で破綻する。", en: "" }
        minutes: 60
