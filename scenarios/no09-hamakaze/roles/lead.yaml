          - { id: cr-p-record, text: { ja: '本人通知と補償の実績を書く', en: '' }, points: 8, axis: care, refs: [ppc-notify-person], explain: { ja: "通知と補償の実績は、患者対応を実際に行った証拠になる。口約束との違いを具体的に示せる。", en: "" } }
