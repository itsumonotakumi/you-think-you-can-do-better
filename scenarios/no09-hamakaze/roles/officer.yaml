# No.9 ハマカゼ総合医療センター / 役員（事務局長）ロール
# プレイヤーは事務局長。病院長の診療判断ではなく、職員・予算・委託契約・地域連携・患者対応を扱う。
# 専任のセキュリティ部署はない。医療情報部、外部の調査会社、法務、委託先が頼り。
# 判断ポイント17、細目は choices[].items と drafts の合計で80以上。
estimateMinutes: 40
intro: { ja: 'あなたはハマカゼ総合医療センターの事務局長、早瀬 達也。病院長と並ぶ役員として、職員・予算・委託契約・地域連携・患者対応を預かる。午前5時30分、電子カルテが全館で止まった。病院長は救急の現場へ向かった。あなたの机には、設備保守委託先との契約書、地域の医療機関の連絡先、そして報道からの電話がある。診療を止めない段取りと、外に出す説明の順番を決めるのは、あなたの仕事だ。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-officer-ppc-prelim
    ref: ppc-report-prelim
    label: { ja: '個人情報保護委員会への速報', en: '' }
    points: -150
    doneFlag: ppcPrelimFiled
  - id: dl-officer-ppc-final
    ref: ppc-report-final-malicious
    label: { ja: '個人情報保護委員会への確報', en: '' }
    points: -100
    doneFlag: ppcFinalFiled
events:
  - id: ev-officer-board
    at: { day: 0, minutes: 1020 }
    voices: [v-ev-board]
    gauges: { flame: 5 }
    sound: { se: [phone_ring] }
    caption: { ja: '評議員から、診療収入への影響を聞かれた。', en: '' }
  - id: ev-officer-news
    at: { day: 0, minutes: 1260 }
    voices: [v-ev-news]
    gauges: { flame: 10 }
    sound: { se: [notify_news] }
    caption: { ja: '地域紙の速報が、院内システムの停止を報じた。', en: '' }
  - id: ev-officer-family
    at: { day: 1, minutes: 720 }
    voices: [v-ev-family]
    gauges: { flame: 5 }
    sound: { se: [phone_ring] }
    caption: { ja: '患者家族からの電話が、問い合わせ窓口に集中している。', en: '' }
  - id: ev-officer-regional
    at: { day: 2, minutes: 480 }
    voices: [v-ev-regional]
    gauges: { flame: 5 }
    caption: { ja: '地域の医療機関から、紹介患者の受け入れについて問い合わせが来た。', en: '' }
points:
  - id: p01-morning
    at: { day: 0, minutes: 360 }
    phase: detect
    sound: { se: [phone_ring] }
    text: { ja: '午前6時。夜勤の看護師長から事務局に電話が入る。「電子カルテが開きません。救急の患者さんが来ています」。病院長は救急外来へ向かった。事務局として、まず何を押さえるか。', en: '' }
    voices: [v01-boss, v01-coward, v01-ok]
    notable:
      - { id: note-officer-outage, text: { ja: '午前5時30分、電子カルテが全館で停止。午前6時、事務局に第一報。', en: '' } }
    choices:
      - id: p01-desk-plan
        text: { ja: '連絡台を置き、記録係と委託先窓口、紙の連絡と代替手順の担当を決める。', en: '' }
        explain: { ja: "記録、連絡、現場の代替手順まで一度に整えている。誰が何をするかが見えるため、初動の混乱を抑えられる。", en: "" }
        minutes: 60
        category: recover
        points: 100
        refs: [meti-csm-guideline, mhlw-medical-guideline]
        gauges: { flame: -10, trust: 10, stamina: -15 }
        setFlags: { officeDesk: true, staffNotice: true }
        items:
          - { id: p01-c-time, points: 5, axis: time, refs: [jpcert-handling] }
          - { id: p01-c-order, points: 8, axis: order, refs: [meti-csm-guideline] }
          - { id: p01-c-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: p01-c-care, points: 5, axis: care, refs: [ipa-sme-guideline] }
      - id: p01-wait
        text: { ja: '理事会への根回しを優先し、現場の対応は病院長に任せきりにする。', en: '' }
        explain: { ja: "根回しも必要な仕事だが、初動の情報が集まらないまま現場に任せると判断がばらつく。時系列の記録も残らない。", en: "" }
        minutes: 60
        category: hurt
        points: -150
        refs: [jpcert-handling]
        gauges: { flame: 5, trust: -5, stamina: 5 }
        coward: true
        setFlags: { delayedCommand: true }
        delayed:
          - { afterPhases: 1, points: -40, gauges: { trust: -10 }, reason: { ja: '夜勤の看護師が、紙の指示簿だけで動いていた。', en: '' } }
        items:
          - { id: p01-a-time, points: -10, axis: time, refs: [jpcert-handling] }
          - { id: p01-a-record, points: -10, axis: record, refs: [jpcert-handling] }
          - { id: p01-a-order, points: -5, axis: order, refs: [meti-csm-guideline] }
      - id: p01-desk
        text: { ja: '事務局に連絡台を置き、時系列の記録係と委託先の窓口を決める。', en: '' }
        explain: { ja: "初動の記録と連絡先を押さえた点は良い。ただし職員への周知や代替手順の担当が決まっておらず、現場は動けない。", en: "" }
        minutes: 45
        category: maintain
        points: 20
        refs: [meti-csm-guideline]
        gauges: { flame: -5, trust: 5, stamina: -10 }
        setFlags: { officeDesk: true }
        items:
          - { id: p01-b-time, points: 5, axis: time, refs: [jpcert-handling] }
          - { id: p01-b-order, points: 8, axis: order, refs: [meti-csm-guideline] }
          - { id: p01-b-record, points: 5, axis: record, refs: [jpcert-handling] }
    lesson: { ja: "初動の事務局は、情報の集約と現場の支援を同時に設計する。連絡台、記録係、委託先の窓口を決め、紙の連絡と部門ごとの代替手順の担当まで名指しする。根回しを優先すると現場が止まる。", en: "" }

  - id: p02-vpn
    at: { day: 0, minutes: 450 }
    phase: detect
    sound: { se: [notify_chat] }
    text: { ja: '午前7時30分。医療情報部が、設備保守委託先のVPN機器が院内ネットワークにつながったままだと報告した。委託先は「弊社の機器に問題はない」と言う。接続をどうするか。', en: '' }
    voices: [v02-vendor, v02-past, v02-ok]
    notable:
      - { id: note-officer-entry, text: { ja: '侵入口は設備保守委託先のVPN機器の疑い。機器は院内ネットワークにつながったまま。', en: '' } }
    choices:
      - id: p02-keep
        text: { ja: '委託先の説明を信じ、設備の遠隔監視を止めないよう接続を残す。', en: '' }
        explain: { ja: "説明を鵜呑みにすると侵入口を残す。遠隔監視の便利さと、被害の拡大を止める優先順位を取り違えている。", en: "" }
        minutes: 60
        category: hurt
        points: -120
        refs: [nist-sp800-61r3]
        gauges: { damage: 10, flame: 5, trust: -5 }
        delayed:
          - { afterPhases: 1, points: -50, gauges: { damage: 10, trust: -10 }, reason: { ja: '同じVPN機器から、夜間に不審な通信が見つかった。', en: '' } }
        items:
          - { id: p02-a-content, points: -10, axis: content, refs: [nist-sp800-61r3] }
          - { id: p02-a-record, points: -10, axis: record, refs: [nist-sp800-61r3] }
          - { id: p02-a-order, points: -8, axis: order, refs: [meti-csm-guideline] }
      - id: p02-cut-plan
        text: { ja: 'VPNを切り、ログを保全し、監視の代替と接続一覧も作る。', en: '' }
        explain: { ja: "封じ込めと業務継続、横展開の確認をまとめて行っている。他の接続まで見える化した点が効いている。", en: "" }
        minutes: 90
        category: recover
        points: 100
        refs: [nist-sp800-61r3, meti-csm-guideline]
        gauges: { damage: -15, trust: 10, stamina: -10 }
        setFlags: { vpnCut: true, vendorIsolated: true }
        items:
          - { id: p02-c-order, points: 8, axis: order, refs: [meti-csm-guideline] }
          - { id: p02-c-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: p02-c-content, points: 5, axis: content, refs: [nist-sp800-61r3] }
          - { id: p02-c-care, points: 5, axis: care, refs: [mhlw-medical-guideline] }
      - id: p02-cut
        text: { ja: 'VPNの接続を切り、機器のログを保全してから委託先に事情を聞く。', en: '' }
        explain: { ja: "切り離してログを残す順序は適切。ただし設備監視の代替手段がなく、委託先の他の接続も未確認のまま残る。", en: "" }
        minutes: 60
        category: maintain
        points: 20
        refs: [nist-sp800-61r3, jpcert-handling]
        gauges: { damage: -10, trust: 5, stamina: -5 }
        setFlags: { vpnCut: true }
        items:
          - { id: p02-b-order, points: 8, axis: order, refs: [meti-csm-guideline] }
          - { id: p02-b-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: p02-b-content, points: 5, axis: content, refs: [nist-sp800-61r3] }
    lesson: { ja: "侵入口の疑いがある接続は、説明を待たずに切ってログを残す。設備監視の代替手順を用意し、同じ委託先の接続を一覧にする。機器に問題がないという主張だけで残すと、被害が広がる。", en: "" }

  - id: p03-regional
    at: { day: 0, minutes: 540 }
    phase: contain
    sound: { se: [phone_ring] }
    text: { ja: '午前9時。救急外来の待合には、搬送を断れない患者が残っている。消防と地域の救急告示病院に、何をどこまで伝えるか。', en: '' }
    voices: [v03-public, v03-coward, v03-ok]
    choices:
      - id: p03-accept
        text: { ja: 'これまで通り受け入れ、地域の調整はせず現場の裁量に任せる。', en: '' }
        explain: { ja: "現場の負担が増えるだけでなく、受け入れ先の調整ができず患者の処置が遅れる。地域の救急にもしわ寄せが行く。", en: "" }
        minutes: 90
        category: hurt
        points: -140
        refs: [mhlw-medical-guideline]
        gauges: { damage: 15, flame: 10, trust: -5 }
        delayed:
          - { afterPhases: 1, points: -50, gauges: { damage: 10 }, reason: { ja: '受け入れ先の調整をしないまま患者が集中し、処置が遅れた。', en: '' } }
        items:
          - { id: p03-a-care, points: -10, axis: care, refs: [mhlw-medical-guideline] }
          - { id: p03-a-order, points: -10, axis: order, refs: [mhlw-medical-guideline] }
          - { id: p03-a-content, points: -8, axis: content, refs: [mhlw-medical-guideline] }
      - id: p03-coordinate
        text: { ja: '消防と地域の救急告示病院に状況を伝え、受け入れの振り分けを依頼する。', en: '' }
        explain: { ja: "地域と状況を共有した判断は妥当。ただし患者情報を紙で渡す様式がなく、引き継ぎのたびに聞き取りが発生する。", en: "" }
        minutes: 60
        category: maintain
        points: 20
        refs: [mhlw-medical-guideline]
        gauges: { flame: 5, damage: -10, trust: -5 }
        setFlags: { regionalCoord: true }
        items:
          - { id: p03-b-order, points: 8, axis: order, refs: [mhlw-medical-guideline] }
          - { id: p03-b-care, points: 5, axis: care, refs: [mhlw-medical-guideline] }
          - { id: p03-b-content, points: 5, axis: content, refs: [mhlw-medical-guideline] }
      - id: p03-coordinate-plan
        text: { ja: '振り分けを頼み、患者情報の紙様式と家族への連絡手順も用意する。', en: '' }
        explain: { ja: "搬送先への情報伝達と家族への連絡まで整えている。現場が迷わず動ける形にした点が良い。", en: "" }
        minutes: 90
        category: recover
        points: 90
        refs: [mhlw-medical-guideline, ppc-notify-person]
        gauges: { flame: 5, damage: -15, trust: 10, stamina: -10 }
        setFlags: { regionalCoord: true, handover: true }
        items:
          - { id: p03-c-order, points: 8, axis: order, refs: [mhlw-medical-guideline] }
          - { id: p03-c-care, points: 8, axis: care, refs: [ppc-notify-person] }
          - { id: p03-c-record, points: 5, axis: record, refs: [jpcert-handling] }
          - { id: p03-c-time, points: 5, axis: time, refs: [mhlw-medical-guideline] }
    lesson: { ja: "救急の受け入れを調整するときは、誰に何を伝えるかまで決める。消防と近隣病院への状況共有、患者情報を紙で渡す様式、家族への連絡手順を揃える。調整なしの受け入れは現場を孤立させる。", en: "" }

  - id: p04-vendor-account
    at: { day: 0, minutes: 630 }
    phase: contain
    sound: { se: [notify_chat] }
    text: { ja: '午前10時30分。委託先の保守アカウントが、院内の全端末に管理者権限で入れる状態だった。止めれば設備の遠隔監視も止まる。どうするか。', en: '' }
    voices: [v04-vendor, v04-insider, v04-ok]
    choices:
      - id: p04-leave
        text: { ja: '設備の遠隔監視を止めないため、保守アカウントはそのままにする。', en: '' }
        explain: { ja: "監視を止めない配慮は分かるが、侵害に使われた可能性のある権限を残す。侵入口を開けたまま復旧を進めることになる。", en: "" }
        minutes: 60
        category: hurt
        points: -130
        refs: [nist-sp800-61r3]
        gauges: { damage: 15, trust: -10 }
        delayed:
          - { afterPhases: 1, points: -50, gauges: { damage: 10 }, reason: { ja: '止めなかった保守アカウントが、別の端末で使われた。', en: '' } }
        items:
          - { id: p04-a-content, points: -10, axis: content, refs: [nist-sp800-61r3] }
          - { id: p04-a-record, points: -10, axis: record, refs: [nist-sp800-61r3] }
          - { id: p04-a-order, points: -8, axis: order, refs: [meti-csm-guideline] }
      - id: p04-stop-plan
        text: { ja: '記録してから止め、委託先の接続を棚卸しして代替も用意する。', en: '' }
        explain: { ja: "権限の停止と横断的な点検、業務の継続を同時に進めている。同じ型のアカウントを残さない点が評価できる。", en: "" }
        minutes: 120
        category: recover
        points: 100
        refs: [nist-sp800-61r3, meti-csm-guideline]
        gauges: { damage: -15, trust: 10, stamina: -15 }
        setFlags: { vendorAccountsStopped: true, vendorAudit: true }
        items:
          - { id: p04-c-order, points: 8, axis: order, refs: [meti-csm-guideline] }
          - { id: p04-c-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: p04-c-content, points: 5, axis: content, refs: [nist-sp800-61r3] }
          - { id: p04-c-care, points: 5, axis: care, refs: [mhlw-medical-guideline] }
      - id: p04-stop
        text: { ja: '使われた形跡を記録してから、委託先の保守アカウントを止める。', en: '' }
        explain: { ja: "記録してから止める順序は適切。ただし他の委託先の接続や代替の監視手段が未整理で、同じ穴が残る。", en: "" }
        minutes: 90
        category: maintain
        points: 20
        refs: [nist-sp800-61r3, jpcert-handling]
        gauges: { damage: -10, trust: 5, stamina: -10 }
        setFlags: { vendorAccountsStopped: true }
        items:
          - { id: p04-b-order, points: 8, axis: order, refs: [meti-csm-guideline] }
          - { id: p04-b-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: p04-b-content, points: 5, axis: content, refs: [nist-sp800-61r3] }
    lesson: { ja: "侵害に使われた可能性のあるアカウントは、記録を残して止める。設備監視が止まるなら代替手段を先に用意し、全委託先の接続と権限を棚卸しする。便利だからと残すと、侵入口を閉じられない。", en: "" }

  - id: p05-hq
    at: { day: 0, minutes: 780 }
    phase: organize
    sound: { se: [notify_chat] }
    text: { ja: '午後1時。対策本部の会議室に、医師、看護師、事務、委託先が集まった。誰が何を決めるのか、まだ決まっていない。', en: '' }
    voices: [v05-boss, v05-field, v05-ok]
    choices:
      - id: p05-secretary
        text: { ja: '会議は病院長に任せ、事務局は議事録の作成だけに徹する。', en: '' }
        explain: { ja: "記録は残るが、事務局が持つ調整の役割を手放している。技術と広報の判断が分断され、決定が遅れる。", en: "" }
        minutes: 45
        category: hurt
        points: -100
        refs: [meti-csm-guideline]
        gauges: { trust: -10, stamina: 5 }
        coward: true
        items:
          - { id: p05-a-order, points: -10, axis: order, refs: [meti-csm-guideline] }
          - { id: p05-a-care, points: -8, axis: care, refs: [ipa-sme-guideline] }
          - { id: p05-a-record, points: -5, axis: record, refs: [jpcert-handling] }
      - id: p05-command
        text: { ja: '指揮命令を一枚にし、技術と広報、窓口の担当を分けて割り当てる。', en: '' }
        explain: { ja: "役割分担を明確にした点は良い。ただし決定の時刻や根拠を残す運用がなく、後から経緯を説明しにくい。", en: "" }
        minutes: 60
        category: maintain
        points: 30
        refs: [meti-csm-guideline]
        gauges: { trust: 5, stamina: -10 }
        setFlags: { officeCommand: true }
        items:
          - { id: p05-b-order, points: 8, axis: order, refs: [meti-csm-guideline] }
          - { id: p05-b-record, points: 5, axis: record, refs: [jpcert-handling] }
          - { id: p05-b-care, points: 5, axis: care, refs: [ipa-sme-guideline] }
      - id: p05-command-log
        text: { ja: '指揮命令を一枚にし、議事録と決定時刻を残して毎朝共有する。', en: '' }
        explain: { ja: "分担と記録、共有を一体で設計している。決定の経緯が残り、現場も同じ前提で動ける。", en: "" }
        minutes: 90
        category: recover
        points: 100
        refs: [meti-csm-guideline, jpcert-handling]
        gauges: { trust: 10, stamina: -10, flame: -5 }
        setFlags: { officeCommand: true, dailyLog: true }
        items:
          - { id: p05-c-order, points: 8, axis: order, refs: [meti-csm-guideline] }
          - { id: p05-c-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: p05-c-care, points: 5, axis: care, refs: [ipa-sme-guideline] }
          - { id: p05-c-wording, points: 5, axis: wording, refs: [meti-disclosure-guidance] }
    lesson: { ja: "対策本部では、指揮命令を一枚にまとめ、技術と広報、現場の役割を分ける。決定の時刻と根拠を議事録に残し、毎朝共有する。事務局が記録だけに徹すると、調整の機能が抜け落ちる。", en: "" }

  - id: p06-board
    at: { day: 0, minutes: 900 }
    phase: organize
    sound: { se: [phone_ring] }
    text: { ja: '午後3時。理事会が臨時に開かれた。診療収入の落ち込みと、復旧の費用をどう説明するか。', en: '' }
    voices: [v06-bold, v06-law, v06-ok]
    choices:
      - id: p06-facts-plan
