        gauges: { damage: -10, trust: 5, stamina: -5 }
        setFlags: { vpnCut: true }
        items:
          - { id: p02-b-order, points: 8, axis: order, refs: [meti-csm-guideline] }
          - { id: p02-b-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: p02-b-content, points: 5, axis: content, refs: [nist-sp800-61r3] }
