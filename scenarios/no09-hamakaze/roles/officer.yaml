        text: { ja: 'VPNを切り、ログを保全する。加えて、給食の代替手順を委託先と決め、委託先の他の接続も一覧にする。', en: '' }
        minutes: 90
        category: recover
        points: 100
        refs: [nist-sp800-61r3, meti-csm-guideline]
        gauges: { damage: -15, trust: 10, stamina: -10 }
        setFlags: { vpnCut: true, vendorIsolated: true }
        items:
