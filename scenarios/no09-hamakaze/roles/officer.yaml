        label: { ja: '診療の制限', en: '' }
        options:
          - { id: of-r-vague, text: { ja: '「一部の診療を制限」とだけ書く', en: '' }, points: -10, axis: content, refs: [mhlw-medical-guideline], explain: { ja: "「一部」では何が止まっているか分からず、患者が問い合わせに殺到する。受診の判断もできない。", en: "" } }
          - { id: of-r-specific, text: { ja: '救急の受け入れ停止、手術の延期、検査の制限を具体的に書く', en: '' }, points: 10, axis: content, refs: [mhlw-medical-guideline], explain: { ja: "止まっている診療が具体的で、患者は予約や受診の判断ができる。問い合わせの前に行動できる。", en: "" } }
      - id: action
        label: { ja: '患者が今すぐすること', en: '' }
        options:
          - { id: of-a-concrete, text: { ja: '予約の変更、服用中の薬、急変時の連絡先を具体的に書く', en: '' }, points: 10, axis: care, refs: [ppc-notify-person], explain: { ja: "患者が今すぐ取る行動が具体的で、不安の中でも動ける。予約変更や服薬の確認まで届く。", en: "" } }
          - { id: of-a-generic, text: { ja: '「注意してください」とだけ書く', en: '' }, points: -10, axis: care, refs: [ppc-notify-person], explain: { ja: "「注意してください」だけでは、何をすればよいか伝わらない。患者は情報を探して窓口に殺到する。", en: "" } }
      - id: contact
        label: { ja: '問い合わせ窓口', en: '' }
        options:
          - { id: of-w-number, text: { ja: '番号だけを書く', en: '' }, points: -5, axis: care, refs: [meti-csm-guideline], explain: { ja: "番号だけでは受付時間が分からず、夜間の問い合わせが迷う。増員の見通しも伝わらない。", en: "" } }
          - { id: of-w-hours, text: { ja: '専用窓口の番号、受付時間、増員を書く', en: '' }, points: 8, axis: care, refs: [meti-csm-guideline], explain: { ja: "番号と受付時間、増員まで示すと、つながる見通しが立つ。待つ側の不安を減らし、集中も抑えられる。", en: "" } }
          - { id: of-w-none, text: { ja: '窓口を書かない', en: '' }, points: -15, axis: care, refs: [meti-csm-guideline], explain: { ja: "窓口がないと、患者は行き場を失い、SNSや報道に流れる。問い合わせの負担も現場に戻る。", en: "" } }
      - id: apology
        label: { ja: '謝罪の主語', en: '' }
        options:
          - { id: of-ap-hospital, text: { ja: '「当院」として謝罪する', en: '' }, points: 5, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: "提供主体として謝罪する姿勢が伝わる。責任の所在も明確になり、患者と家族への説明の前提が揃う。", en: "" } }
          - { id: of-ap-vendor, text: { ja: '「委託先」の責任として謝罪する', en: '' }, points: -10, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: "委託先に責任を寄せると、自院の説明責任を回避したと映る。患者との信頼も損ない、再発防止の主体が曖昧になる。", en: "" } }
      - id: excuse
        label: { ja: '前置き', en: '' }
        options:
          - { id: of-e-advanced, text: { ja: '「高度な攻撃により」と前置きする', en: '' }, points: -10, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: "「高度な攻撃」は説明の先送りと受け取られやすい。対策の責任が自分たちにあることも曖昧になる。", en: "" } }
          - { id: of-e-none, text: { ja: '言い訳を書かない', en: '' }, points: 5, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: "言い訳を置かないことで、事実と対応に焦点が当たる。説明の途中で論点がぼやけない。", en: "" } }
      - id: next
        label: { ja: '次の公表', en: '' }
        options:
          - { id: of-n-next, text: { ja: '次の公表予定を書く', en: '' }, points: 5, axis: content, refs: [meti-disclosure-guidance], explain: { ja: "次の公表予定があると、続報を待つ側の見通しが立つ。憶測が広がる前に次の接点を示せる。", en: "" } }
          - { id: of-n-none, text: { ja: '次回の予定を書かない', en: '' }, points: -5, axis: content, refs: [meti-disclosure-guidance], explain: { ja: "次回の予定がないと、情報の空白を憶測で埋められる。問い合わせの終わりも見えない。", en: "" } }
      - id: approval
        label: { ja: '院内の確認', en: '' }
        options:
          - { id: of-i-solo, text: { ja: '事務局長の判断だけで出す', en: '' }, points: -10, axis: order, refs: [meti-csm-guideline], explain: { ja: "事務局長だけで出すと、法務や現場の確認が抜けやすい。訂正が増えるほど信頼を失い、説明のやり直しも難しくなる。", en: "" } }
          - { id: of-i-share, text: { ja: '広報、法務、医療情報部、地域連携室で文案を確認する', en: '' }, points: 5, axis: order, refs: [meti-csm-guideline], explain: { ja: "複数の部署で確認することで、事実誤認と表現の偏りを減らせる。患者対応の前提も揃う。", en: "" } }
      - id: record
        label: { ja: '記録', en: '' }
        options:
          - { id: of-r-log, text: { ja: '公表した時刻と版を記録する', en: '' }, points: 5, axis: record, refs: [jpcert-handling], explain: { ja: "時刻と版を記録すると、後から説明の経緯をたどれる。訂正が必要になった理由も示せる。", en: "" } }
          - { id: of-r-none, text: { ja: '記録を残さない', en: '' }, points: -8, axis: record, refs: [jpcert-handling], explain: { ja: "記録がないと、何をいつ発表したか説明できなくなる。後日の検証や訂正の根拠にも耐えられない。", en: "" } }
      - id: staff
        label: { ja: '現場の負担', en: '' }
        options:
          - { id: of-p-none, text: { ja: '現場の負担に触れない', en: '' }, points: -5, axis: care, refs: [ipa-sme-guideline], explain: { ja: "現場の負担に触れないと、応援の判断が遅れる。現場は説明と通常業務を同時に抱え込む。", en: "" } }
          - { id: of-p-staff, text: { ja: '現場の負担と交代の必要性を書く', en: '' }, points: 5, axis: care, refs: [ipa-sme-guideline], explain: { ja: "現場の負担を書くと、交代や応援の必要性が伝わる。患者対応の水準を保つ前提にもなる。", en: "" } }
  officer-final-report:
    title: { ja: '調査報告書の事務局部分', en: '' }
    slots:
      - id: scope
        label: { ja: '公開する範囲', en: '' }
        options:
          - { id: ofr-s-full, text: { ja: '攻撃に使える詳細だけ伏せて全文公開する', en: '' }, points: 10, axis: content, refs: [meti-disclosure-guidance], explain: { ja: "危険な詳細だけ伏せる公開は、検証と再発防止の両立になる。地域の備えにもつながる。", en: "" } }
          - { id: ofr-s-hide, text: { ja: '公開しない', en: '' }, points: -20, axis: content, refs: [meti-disclosure-guidance], explain: { ja: "公開しないと、原因も対策も検証されず、地域にも教訓が届かない。説明の機会も失う。", en: "" } }
      - id: cause
        label: { ja: '原因の書き方', en: '' }
        options:
          - { id: ofr-c-vague, text: { ja: '「外部からの攻撃」とだけ書く', en: '' }, points: -10, axis: content, refs: [nist-sp800-61r3], explain: { ja: "「外部からの攻撃」だけでは、どこを直すのか分からない。対策が精神論に流れ、検証もできない。", en: "" } }
          - { id: ofr-c-cause, text: { ja: '委託先のVPN機器と権限管理の不備を具体的に書く', en: '' }, points: 10, axis: content, refs: [nist-sp800-61r3], explain: { ja: "委託先のVPNと権限管理の不備を具体的に書くと、再発防止の担当と期限も決めやすい。", en: "" } }
      - id: vendor
        label: { ja: '委託先の扱い', en: '' }
        options:
          - { id: ofr-v-entry, text: { ja: '委託先のVPN機器と契約の不備を書く', en: '' }, points: 10, axis: content, refs: [meti-csm-guideline], explain: { ja: "侵入口と契約の不備を書くことで、他の委託先の点検にもつながる。責任分界も整理できる。", en: "" } }
          - { id: ofr-v-omit, text: { ja: '委託先に触れない', en: '' }, points: -15, axis: content, refs: [meti-csm-guideline], explain: { ja: "委託先に触れないと、同じ型の機器が残っていても対策が進まない。再発の芽を地域に残す。", en: "" } }
      - id: measures
        label: { ja: '再発防止策', en: '' }
        options:
          - { id: ofr-m-slogan, text: { ja: '「再発防止に努めます」とだけ書く', en: '' }, points: -10, axis: content, refs: [cissp-cbk-secops], explain: { ja: "「努めます」だけでは、何をいつ誰がやるのか分からない。実行されたかの検証もできない。", en: "" } }
          - { id: ofr-m-plan, text: { ja: '実施時期と担当を書く', en: '' }, points: 10, axis: content, refs: [cissp-cbk-secops], explain: { ja: "時期と担当があれば、対策が実行されたか検証できる。毎月の進捗の公開にもそのまま使える。", en: "" } }
      - id: thirdparty
        label: { ja: '第三者委員会の意見', en: '' }
        options:
          - { id: ofr-t-full, text: { ja: '第三者委員会の意見を全文掲載する', en: '' }, points: 8, axis: content, refs: [cissp-cbk-secops], explain: { ja: "第三者委員会の意見を全文載せると、調査の独立性が伝わる。都合の悪い指摘も隠せない。", en: "" } }
          - { id: ofr-t-summary, text: { ja: '要約だけを載せる', en: '' }, points: -8, axis: content, refs: [cissp-cbk-secops], explain: { ja: "要約だけでは、都合の悪い指摘が抜けていないか分からない。調査の透明性が下がり、再発防止も弱くなる。", en: "" } }
      - id: patients
        label: { ja: '患者への対応', en: '' }
        options:
          - { id: ofr-p-none, text: { ja: '患者への対応に触れない', en: '' }, points: -10, axis: care, refs: [ppc-notify-person], explain: { ja: "患者への対応に触れないと、被害者の視点が抜けた報告になる。地域の信頼も戻らない。", en: "" } }
          - { id: ofr-p-record, text: { ja: '通知と補償の実績を書く', en: '' }, points: 8, axis: care, refs: [ppc-notify-person], explain: { ja: "通知と補償の実績は、患者対応を実際に行った証拠になる。口約束との違いを具体的に示せる。", en: "" } }
      - id: progress
        label: { ja: '進捗の公開', en: '' }
        options:
          - { id: ofr-o-monthly, text: { ja: '進捗を毎月公開する', en: '' }, points: 10, axis: record, refs: [meti-disclosure-guidance], explain: { ja: "毎月の進捗公開は、対策が形だけになっていないか確かめられる。改善の速度も見える。", en: "" } }
          - { id: ofr-o-once, text: { ja: '一度だけ公開する', en: '' }, points: -5, axis: record, refs: [meti-disclosure-guidance], explain: { ja: "一度きりの公開では、その後の進み具合が分からない。未完了の対策が放置されやすい。", en: "" } }
      - id: regional
        label: { ja: '地域への共有', en: '' }
        options:
          - { id: ofr-g-keep, text: { ja: '自院の中にとどめる', en: '' }, points: -5, axis: content, refs: [mhlw-medical-guideline], explain: { ja: "自院だけに留めると、同じ型のリスクが地域に残る。再発防止に取り組む姿勢も伝わらない。", en: "" } }
          - { id: ofr-g-share, text: { ja: '得た教訓を地域の医療機関に無償で共有する', en: '' }, points: 10, axis: content, refs: [mhlw-medical-guideline], explain: { ja: "教訓を地域で共有すると、同じ被害を別の病院で防げる。委託先の点検の輪も広がり、備えが上がる。", en: "" } }
      - id: ad
        label: { ja: '宣伝との線引き', en: '' }
        options:
          - { id: ofr-ad-none, text: { ja: '復旧を宣伝に使わない', en: '' }, points: 5, axis: care, refs: [meti-disclosure-guidance], explain: { ja: "復旧を宣伝に使わない姿勢は、説明の信頼を保つ。関心が被害と患者対応からそれない。", en: "" } }
          - { id: ofr-ad-use, text: { ja: '復旧を宣伝に使う', en: '' }, points: -15, axis: care, refs: [meti-disclosure-guidance], explain: { ja: "復旧を宣伝に使うと、被害や患者対応が軽く見られる。批判を招き、せっかく戻した信頼も損なう。", en: "" } }
      - id: contract
        label: { ja: '委託契約の点検', en: '' }
        options:
          - { id: ofr-contract-keep, text: { ja: '自院の中にとどめる', en: '' }, points: -5, axis: order, refs: [meti-csm-guideline], explain: { ja: "自院だけに留めると、同じ契約の不備が地域に残る。点検の効果も自院の中だけで終わる。", en: "" } }
          - { id: ofr-contract-check, text: { ja: '点検表を地域の医療機関に配る', en: '' }, points: 8, axis: order, refs: [meti-csm-guideline], explain: { ja: "点検表を地域に配ると、同じ型の委託契約の不備を各院が確認できる。地域全体の備えが上がる。", en: "" } }
      - id: staff
        label: { ja: '職員の負担', en: '' }
        options:
          - { id: ofr-staff-record, text: { ja: '職員の負担と交代の実績を書く', en: '' }, points: 5, axis: care, refs: [ipa-sme-guideline], explain: { ja: "職員の負担と交代の実績を書くと、応援の必要性と改善の効果を具体的な数字で説明できる。", en: "" } }
          - { id: ofr-staff-none, text: { ja: '職員の負担に触れない', en: '' }, points: -5, axis: care, refs: [ipa-sme-guideline], explain: { ja: "職員の負担に触れないと、応援や休息の判断が遅れる。再発防止が現場の犠牲の上に立つ。", en: "" } }
voices:
  - { id: v01-boss, media: boss, misleading: true, type: boss-pressure, text: { ja: '理事会への根回しが先だ。現場の指示は病院長に任せておけ。', en: '' }, trigger: { at: point } }
  - { id: v01-coward, media: sns, misleading: true, type: public-opinion, text: { ja: '原因も分からないうちに動くと、余計に混乱する。', en: '' }, trigger: { at: point } }
  - { id: v01-ok, media: chat, misleading: false, text: { ja: '事務局の総務課長「委託先の連絡先と、昨夜の当直表はこちらです」。', en: '' }, trigger: { at: point } }
  - { id: v01-after, media: news, misleading: false, text: { ja: '事務局が前のめりになり、現場が混乱した。', en: '' }, trigger: { at: after, choice: p01-desk-plan } }
  - { id: v02-vendor, media: vendor, misleading: true, type: vendor-interest, text: { ja: '止めると設備の遠隔監視が止まります。弊社の機器は関係ありません。', en: '' }, trigger: { at: point } }
  - { id: v02-past, media: boss, misleading: true, type: past-success, text: { ja: '前の機器更新のときも、つないだままで問題なかった。', en: '' }, trigger: { at: point } }
  - { id: v02-ok, media: chat, misleading: false, text: { ja: '医療情報部「まずVPNを切り、機器のログは残しましょう」。', en: '' }, trigger: { at: point } }
  - { id: v02-after, media: vendor, misleading: false, text: { ja: '設備の監視を止める前に、相談してほしかった。', en: '' }, trigger: { at: after, choice: p02-cut-plan } }
  - { id: v03-public, media: sns, misleading: true, type: public-opinion, text: { ja: '救急を断るな。地域の信用が落ちる。', en: '' }, trigger: { at: point } }
  - { id: v03-coward, media: news, misleading: true, type: coward-critique, text: { ja: '救急を断る病院に、誰が患者を預ける。受け入れを止めるな。', en: '' }, trigger: { at: point } }
  - { id: v03-ok, media: chat, misleading: false, text: { ja: '看護部長「搬送先と情報を共有する紙の様式が要ります」。', en: '' }, trigger: { at: point } }
  - { id: v03-after, media: sns, misleading: false, text: { ja: '他所の病院に押し付けるのか。', en: '' }, trigger: { at: after, choice: p03-coordinate-plan } }
  - { id: v04-vendor, media: vendor, misleading: true, type: vendor-interest, text: { ja: 'アカウントを止めると、復旧は保証できません。', en: '' }, trigger: { at: point } }
  - { id: v04-insider, media: board, misleading: true, type: fake-insider, text: { ja: '中の者だけど、委託先のアカウントは全部消されている。今すぐ公表しろ。', en: '' }, trigger: { at: point } }
  - { id: v04-ok, media: chat, misleading: false, text: { ja: '医療情報部「止める前に、使われた形跡を記録しましょう」。', en: '' }, trigger: { at: point } }
  - { id: v04-after, media: vendor, misleading: false, text: { ja: '止めるなら、設備監視の代替を先に決めてほしかった。', en: '' }, trigger: { at: after, choice: p04-stop-plan } }
  - { id: v05-boss, media: boss, misleading: true, type: boss-pressure, text: { ja: '会議は病院長に任せろ。事務は議事録だけ取っていろ。', en: '' }, trigger: { at: point } }
  - { id: v05-field, media: chat, misleading: true, type: well-meant-field, text: { ja: '現場はもう紙で回しています。会議なんていりません。', en: '' }, trigger: { at: point } }
  - { id: v05-ok, media: chat, misleading: false, text: { ja: '看護部長「誰が決めるのか、一枚にしてください」。', en: '' }, trigger: { at: point } }
  - { id: v05-after, media: sns, misleading: false, text: { ja: '会議ばかり増えて、現場が疲れる。', en: '' }, trigger: { at: after, choice: p05-command-log } }
  - { id: v06-bold, media: sns, misleading: true, type: bold-buzz, text: { ja: '理事会には「影響は軽微」と言っておけ。評議員に心配をかけるな。', en: '' }, trigger: { at: point } }
  - { id: v06-law, media: board, misleading: true, type: law-ish, text: { ja: '診療収入の減少は、まだ確定していません。報告は不要です。', en: '' }, trigger: { at: point } }
  - { id: v06-ok, media: board, misleading: false, text: { ja: '経理部長「紙運用の追加費用と、止まった診療科の収入を出しました」。', en: '' }, trigger: { at: point } }
  - { id: v06-after, media: news, misleading: false, text: { ja: '数字を出すと、評議員が動揺するではないか。', en: '' }, trigger: { at: after, choice: p06-facts-plan } }
  - { id: v07-vendor, media: vendor, misleading: true, type: vendor-interest, text: { ja: '弊社は運用の指示に従っただけです。責任は当院にあります。', en: '' }, trigger: { at: point } }
  - { id: v07-law, media: news, misleading: true, type: law-ish, text: { ja: '契約に書いていないことは、求められません。', en: '' }, trigger: { at: point } }
  - { id: v07-ok, media: chat, misleading: false, text: { ja: '法務「共同調査を求めて、契約の棚卸しをしましょう」。', en: '' }, trigger: { at: point } }
  - { id: v07-after, media: vendor, misleading: false, text: { ja: '契約を点検するとは、うちを疑っているのか。', en: '' }, trigger: { at: after, choice: p07-joint-plan } }
  - { id: v08-public, media: sns, misleading: true, type: public-opinion, text: { ja: 'まだ原因が分からない。システム障害で出そう。', en: '' }, trigger: { at: point } }
  - { id: v08-coward, media: news, misleading: true, type: public-opinion, text: { ja: 'サイバー攻撃と書くと、患者が離れる。', en: '' }, trigger: { at: point } }
