    notable:
      - { id: note-officer-entry, text: { ja: '侵入口は給食委託先のVPN機器の疑い。機器は院内ネットワークにつながったまま。', en: '' } }
    choices:
      - id: p02-keep
        text: { ja: '委託先の説明を信じ、給食を止めないよう接続を残す。', en: '' }
