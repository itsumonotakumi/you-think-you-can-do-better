# No.7 コネクトコール / 経営者ロール
# 判断ポイント16、細目は choices[].items と drafts の合計で80以上。
estimateMinutes: 35
intro: { ja: 'あなたはコネクトコールの代表取締役社長。10年分の顧客名簿が、派遣の保守担当者によって持ち出されていた。午前10時の一本の電話から、あなたの判断が始まる。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-ppc-prelim
    ref: ppc-report-prelim
    label: { ja: '個人情報保護委員会への速報', en: '' }
    points: -150
    doneFlag: ppcPrelimFiled
events:
  - id: ev-client-calls
    at: { day: 1, minutes: 720 }
    voices: [v-ev-client]
    gauges: { flame: 5 }
    sound: { se: [phone_ring] }
    caption: { ja: '複数のクライアントから「説明はまだか」と電話が続いている。', en: '' }
  - id: ev-training
    at: { day: 7, minutes: 600 }
    voices: [v-ev-training]
    caption: { ja: '全社研修の記録では、本人は10年連続で満点だった。', en: '' }
  - id: ev-news
    at: { day: 8, minutes: 600 }
    voices: [v-ev-news]
    gauges: { flame: 10 }
    sound: { se: [notify_news] }
    caption: { ja: '「10年気づかなかった」と報道され、受託先の選定を見直す動きが出ている。', en: '' }
points:
  - id: p01-call
    at: { day: 0, minutes: 600 }
    phase: detect
    sound: { se: [phone_ring] }
    text: { ja: '午前10時。主要クライアントの担当者から電話が入る。「うちの顧客名簿が外部で使われている。御社のセンターからではないか」。相手は名簿の項目まで具体的に話している。', en: '' }
    voices: [v01-public, v01-boss, v01-ok]
    notable:
      - { id: note-first-call, text: { ja: '午前10時、クライアントから名簿の外部利用を指摘された。項目まで具体的だった。', en: '' } }
    choices:
      - id: p01-deny
        text: { ja: '「当社では持ち出しはありません」と現時点で断言し、調査は週明けに始める。', en: '' }
        minutes: 60
        category: hurt
        points: -120
        refs: [meti-disclosure-guidance]
        gauges: { flame: 10, trust: -10 }
        coward: true
        setFlags: { deniedFirst: true }
        delayed:
          - { afterPhases: 1, points: -40, gauges: { trust: -10 }, reason: { ja: '断言が覆り、クライアントの信頼をさらに落とした。', en: '' } }
        items:
          - { id: p01-a-record, points: -8, axis: record, refs: [jpcert-handling] }
          - { id: p01-a-wording, points: -10, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: p01-a-time, points: -10, axis: time, refs: [jpcert-handling] }
      - id: p01-investigate
        text: { ja: 'その場で調査を始め、該当アカウントの利用履歴、端末、外部媒体を保全する。', en: '' }
        minutes: 90
        category: maintain
        points: 20
        refs: [jpcert-handling]
        gauges: { trust: 5, stamina: -5 }
        setFlags: { startedInvestigation: true }
        items:
          - { id: p01-b-time, points: 5, axis: time, refs: [jpcert-handling] }
          - { id: p01-b-order, points: 5, axis: order, refs: [meti-csm-guideline] }
          - { id: p01-b-record, points: 5, axis: record, refs: [jpcert-handling] }
      - id: p01-investigate-agency
        text: { ja: '調査を始め、派遣元にも同日中に連絡する。本人への聴取は弁護士立会いで行う段取りを組む。', en: '' }
        minutes: 120
        category: recover
        points: 100
        refs: [meti-csm-guideline, meti-trade-secret]
        gauges: { trust: 10, stamina: -10 }
        setFlags: { startedInvestigation: true, agencyNotified: true }
        items:
          - { id: p01-c-order, points: 8, axis: order, refs: [meti-csm-guideline] }
          - { id: p01-c-record, points: 8, axis: record, refs: [meti-trade-secret] }
          - { id: p01-c-time, points: 5, axis: time, refs: [jpcert-handling] }

  - id: p02-scope
    at: { day: 0, minutes: 840 }
    phase: contain
    sound: { se: [notify_chat] }
    text: { ja: '午後2時。保守用の管理者アカウントが10年分の履歴を持ち、夜間に外部媒体へ書き出した形跡がある。まず何を止めるか。', en: '' }
    voices: [v02-expert, v02-field, v02-ok]
    notable:
      - { id: note-scale, text: { ja: '持ち出しは10年にわたり、管理者アカウントで外部媒体に書き出されていた可能性がある。', en: '' } }
    choices:
      - id: p02-wipe
        text: { ja: 'アカウントを削除し、該当端末を初期化して再配布する。', en: '' }
        minutes: 120
        category: fatal
        points: -260
        refs: [jpcert-handling, meti-trade-secret]
        gauges: { damage: 10, trust: -10 }
        setFlags: { destroyedEvidence: true }
        delayed:
          - { afterPhases: 2, points: -80, gauges: { damage: 10, trust: -15 }, reason: { ja: '初期化で、持ち出しの経路と期間を裏付ける記録が失われた。', en: '' } }
        items:
          - { id: p02-a-record, points: -20, axis: record, refs: [jpcert-handling] }
          - { id: p02-a-content, points: -15, axis: content, refs: [meti-trade-secret] }
      - id: p02-stop
        text: { ja: 'アカウントを停止し、端末と外部媒体を保全して、業務は別の担当に切り替える。', en: '' }
        minutes: 90
        category: maintain
        points: 30
        refs: [jpcert-handling]
        gauges: { damage: -10, stamina: -5 }
        setFlags: { contained: true }
        items:
          - { id: p02-b-time, points: 5, axis: time, refs: [jpcert-handling] }
          - { id: p02-b-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: p02-b-order, points: 5, axis: order, refs: [no07-ipa-insider] }
      - id: p02-stop-restrict
        text: { ja: 'アカウントを停止して証拠を保全する。加えて、全管理者アカウントの棚卸しと、外部媒体への書き出し禁止を当日からかける。', en: '' }
        minutes: 150
        category: recover
        points: 120
        refs: [no07-ipa-insider, jpcert-handling]
        gauges: { damage: -15, trust: 5, stamina: -10 }
        setFlags: { contained: true, restrictedExport: true }
        items:
          - { id: p02-c-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: p02-c-order, points: 8, axis: order, refs: [no07-ipa-insider] }
          - { id: p02-c-care, points: 5, axis: care, refs: [no07-ipa-insider] }
          - { id: p02-c-content, points: 5, axis: content, refs: [no07-ipa-insider] }

  - id: p03-agency
    at: { day: 1, minutes: 540 }
    phase: organize
    sound: { se: [mail_arrive] }
    text: { ja: '午前9時。派遣元の営業担当が来社した。「本人は弊社で処分します。御社は関わらないでください」。', en: '' }
    voices: [v03-vendor, v03-law, v03-ok]
    choices:
      - id: p03-leave
        text: { ja: '派遣元に任せ、自社は本人への連絡も処分も関与しない。', en: '' }
        minutes: 45
        category: hurt
        points: -100
        refs: [no07-dispatch-law]
        gauges: { trust: -10, damage: 5 }
        items:
          - { id: p03-a-order, points: -10, axis: order, refs: [no07-dispatch-law] }
          - { id: p03-a-record, points: -10, axis: record, refs: [meti-trade-secret] }
      - id: p03-joint
        text: { ja: '派遣元と共同で事実確認を進め、契約の秘密保持条項に基づいて報告を求める。', en: '' }
        minutes: 90
        category: maintain
        points: 20
        refs: [no07-dispatch-law, meti-csm-guideline]
        gauges: { trust: 5, stamina: -5 }
        setFlags: { agencyJoint: true }
        items:
          - { id: p03-b-order, points: 8, axis: order, refs: [no07-dispatch-law] }
          - { id: p03-b-wording, points: 5, axis: wording, refs: [meti-csm-guideline] }
          - { id: p03-b-record, points: 5, axis: record, refs: [meti-trade-secret] }
      - id: p03-joint-police
        text: { ja: '共同調査に加え、証拠を保全して警察への相談と刑事告訴を視野に、弁護士を通じて進める。', en: '' }
        minutes: 150
        category: recover
        points: 100
        refs: [npa-consult, meti-trade-secret]
        gauges: { trust: 10, stamina: -10 }
        setFlags: { agencyJoint: true, policeConsulted: true }
        items:
          - { id: p03-c-order, points: 8, axis: order, refs: [no07-dispatch-law] }
          - { id: p03-c-record, points: 8, axis: record, refs: [meti-trade-secret] }
          - { id: p03-c-content, points: 5, axis: content, refs: [npa-consult] }

  - id: p04-clients
    at: { day: 1, minutes: 840 }
    phase: organize
    sound: { se: [phone_ring] }
    text: { ja: '午後2時。影響しうるクライアントは数十社。各社も個人情報取扱事業者として、報告と通知の判断を迫られる。どの順で、何を伝えるか。', en: '' }
    voices: [v04-public, v04-boss, v04-ok]
    choices:
      - id: p04-after-news
        text: { ja: '影響が大きい一社だけに先に伝え、他社は報道が出てから連絡する。', en: '' }
        minutes: 90
        category: hurt
        points: -120
        refs: [meti-disclosure-guidance]
        gauges: { flame: 10, trust: -10 }
        coward: true
        delayed:
          - { afterPhases: 1, points: -60, gauges: { flame: 10, trust: -10 }, reason: { ja: '報道で知ったクライアントから、説明の遅れへの抗議が届いた。', en: '' } }
        items:
          - { id: p04-a-order, points: -10, axis: order, refs: [meti-disclosure-guidance] }
          - { id: p04-a-time, points: -10, axis: time, refs: [meti-disclosure-guidance] }
          - { id: p04-a-care, points: -8, axis: care, refs: [no07-dispatch-law] }
      - id: p04-all
        text: { ja: '全クライアントに同じ時刻で一次連絡を入れ、詳細は分かった順に更新する。', en: '' }
        minutes: 120
        category: maintain
        points: 30
        refs: [meti-disclosure-guidance]
        gauges: { trust: 5, stamina: -5 }
        setFlags: { clientsNotified: true }
        items:
          - { id: p04-b-order, points: 8, axis: order, refs: [meti-disclosure-guidance] }
          - { id: p04-b-time, points: 5, axis: time, refs: [meti-disclosure-guidance] }
          - { id: p04-b-wording, points: 5, axis: wording, refs: [meti-disclosure-guidance] }
      - id: p04-all-dedicated
        text: { ja: '全社に同時に一次連絡し、各社の担当者向けの専用窓口と、説明に使える事実整理のひな形を用意する。', en: '' }
        minutes: 180
        category: recover
        points: 120
        refs: [meti-csm-guideline, ppc-report-prelim]
        gauges: { trust: 15, stamina: -10 }
        setFlags: { clientsNotified: true, clientHelp: true }
        items:
          - { id: p04-c-order, points: 8, axis: order, refs: [meti-disclosure-guidance] }
          - { id: p04-c-care, points: 8, axis: care, refs: [meti-csm-guideline] }
          - { id: p04-c-wording, points: 5, axis: wording, refs: [ppc-report-prelim] }
          - { id: p04-c-record, points: 5, axis: record, refs: [jpcert-handling] }

  - id: p05-notice
    at: { day: 2, minutes: 600 }
    phase: notify
    sound: { se: [typing] }
    text: { ja: '午前10時。クライアント向けの一次通知を、今日中に全社へ送る。件数はまだ確定していない。文案をどうするか。', en: '' }
    voices: [v05-popular, v05-law, v05-ok]
    choices:
      - id: p05-hold
        text: { ja: '件数が確定するまで、文面は作らず口頭で「調査中」と伝える。', en: '' }
        minutes: 120
        category: hurt
        points: -100
        refs: [ppc-report-prelim]
        gauges: { flame: 15, trust: -10 }
        coward: true
        delayed:
          - { afterPhases: 1, points: -40, gauges: { flame: 10, trust: -10 }, reason: { ja: '件数を待つ間に、クライアントの顧客への説明が遅れた。', en: '' } }
        items:
          - { id: p05-a-time, points: -10, axis: time, refs: [ppc-report-prelim] }
          - { id: p05-a-care, points: -8, axis: care, refs: [ppc-notify-person] }
      - id: p05-draft
        text: { ja: '分かっている範囲で一次通知の文案を作り、全社に送る。', en: '' }
        minutes: 90
        category: maintain
        points: 20
        refs: [ppc-report-prelim]
        gauges: { trust: 5, stamina: -5 }
        detail: client-notice
        setFlags: { clientNoticeSent: true }
        items:
          - { id: p05-b-order, points: 5, axis: order, refs: [meti-csm-guideline] }
          - { id: p05-b-time, points: 5, axis: time, refs: [ppc-report-prelim] }
      - id: p05-draft-support
        text: { ja: '一次通知の文案を作り、各社の顧客対応に使えるQ&Aと、窓口の増員も同時に用意する。', en: '' }
        minutes: 150
        category: recover
        points: 100
        refs: [ppc-notify-person, meti-csm-guideline]
        gauges: { trust: 10, stamina: -10 }
        detail: client-notice
        setFlags: { clientNoticeSent: true, clientQA: true }
        items:
          - { id: p05-c-care, points: 8, axis: care, refs: [ppc-notify-person] }
          - { id: p05-c-order, points: 5, axis: order, refs: [meti-csm-guideline] }

  - id: p06-own
    at: { day: 2, minutes: 900 }
    phase: notify
    sound: { se: [notify_chat] }
    text: { ja: '午後3時。グループ会社が運営する通販サービスの顧客情報も、同じ担当者が触れる環境にあった。グループも被害者だが、その顧客にも説明と通知が要る。', en: '' }
    voices: [v06-boss, v06-law, v06-ok]
    choices:
      - id: p06-hold
        text: { ja: 'グループの分は後回しにし、クライアント対応が落ち着いてから検討する。', en: '' }
        minutes: 60
        category: hurt
        points: -100
        refs: [ppc-report-scope]
        gauges: { flame: 10, trust: -10 }
        coward: true
        items:
          - { id: p06-a-time, points: -10, axis: time, refs: [ppc-report-prelim] }
          - { id: p06-a-care, points: -10, axis: care, refs: [ppc-notify-person] }
      - id: p06-same
        text: { ja: 'グループの分も同じ基準で対象を特定し、本人通知と公表を行う。', en: '' }
        minutes: 120
        category: maintain
        points: 30
        refs: [ppc-report-scope, ppc-notify-person]
        gauges: { trust: 5, stamina: -5 }
        setFlags: { ownNotified: true }
        items:
          - { id: p06-b-content, points: 8, axis: content, refs: [ppc-report-scope] }
          - { id: p06-b-care, points: 8, axis: care, refs: [ppc-notify-person] }
      - id: p06-same-plus
        text: { ja: 'グループの分も同じ基準で通知・公表し、対象者向けの相談窓口と、なりすまし被害の監視を用意する。', en: '' }
        minutes: 180
        category: recover
        points: 120
        refs: [ppc-notify-person]
        gauges: { flame: -5, trust: 15, stamina: -10 }
        setFlags: { ownNotified: true, ownVictimSupport: true }
        items:
          - { id: p06-c-care, points: 8, axis: care, refs: [ppc-notify-person] }
          - { id: p06-c-care2, points: 8, axis: care, refs: [ppc-notify-person] }
          - { id: p06-c-content, points: 5, axis: content, refs: [ppc-report-scope] }

  - id: p07-ppc
    at: { day: 2, minutes: 1020 }
    phase: notify
    sound: { se: [clock_tick] }
    text: { ja: '午後5時。法務から「個人情報保護委員会への速報を、いつ出すか」と聞かれた。期限は明日の午前中。件数はまだ確定していない。', en: '' }
    voices: [v07-law, v07-boss, v07-ok]
    choices:
      - id: p07-wait
        text: { ja: '件数と対象が確定してから報告する。', en: '' }
        minutes: 150
        category: hurt
        points: -150
        refs: [ppc-report-prelim]
        gauges: { flame: 15, trust: -10, damage: 10 }
        coward: true
        items:
          - { id: p07-a-time, points: -10, axis: time, refs: [ppc-report-prelim] }
          - { id: p07-a-record, points: -8, axis: record, refs: [ppc-report-prelim] }
      - id: p07-file
        text: { ja: '分かっている範囲で速報を出し、不明点は調査中と明記する。', en: '' }
        minutes: 90
        category: maintain
        points: 30
        refs: [ppc-report-prelim]
        gauges: { trust: 5, stamina: -5 }
        setFlags: { ppcPrelimFiled: true }
        items:
          - { id: p07-b-time, points: 8, axis: time, refs: [ppc-report-prelim] }
          - { id: p07-b-content, points: 5, axis: content, refs: [ppc-report-prelim] }
          - { id: p07-b-record, points: 5, axis: record, refs: [ppc-report-prelim] }
      - id: p07-file-plus
        text: { ja: '速報を出し、クライアント各社にも報告の要否と書き方を案内する。', en: '' }
        minutes: 120
        category: recover
        points: 100
        refs: [ppc-report-prelim, meti-csm-guideline]
        gauges: { trust: 10, stamina: -10 }
        setFlags: { ppcPrelimFiled: true, clientReportGuide: true }
        items:
          - { id: p07-c-time, points: 8, axis: time, refs: [ppc-report-prelim] }
          - { id: p07-c-order, points: 8, axis: order, refs: [meti-csm-guideline] }
          - { id: p07-c-care, points: 5, axis: care, refs: [ppc-report-prelim] }

  - id: p08-police
    at: { day: 3, minutes: 600 }
    phase: notify
    sound: { se: [phone_ring] }
    text: { ja: '午前10時。持ち出しは犯罪にあたる可能性が高い。顧問弁護士から「警察への相談と、被害届の準備をどうするか」と聞かれた。', en: '' }
    voices: [v08-vendor, v08-past, v08-ok]
    choices:
      - id: p08-settle
        text: { ja: '示談で穏便に済ませ、警察には相談しない。', en: '' }
        minutes: 90
        category: hurt
        points: -120
        refs: [meti-trade-secret]
        gauges: { trust: -10, damage: 5 }
        items:
          - { id: p08-a-record, points: -10, axis: record, refs: [meti-trade-secret] }
          - { id: p08-a-order, points: -10, axis: order, refs: [npa-consult] }
      - id: p08-consult
        text: { ja: '警察に相談し、証拠の保全と今後の手続きを確認する。', en: '' }
        minutes: 90
        category: maintain
        points: 20
        refs: [npa-consult]
        gauges: { trust: 5, stamina: -5 }
        setFlags: { policeConsulted: true }
        items:
          - { id: p08-b-order, points: 8, axis: order, refs: [npa-consult] }
          - { id: p08-b-record, points: 5, axis: record, refs: [meti-trade-secret] }
      - id: p08-consult-report
        text: { ja: '警察に相談し、被害届の準備を進める。加えて、同じ権限を持つ全担当者の棚卸しを始める。', en: '' }
        minutes: 150
        category: recover
        points: 100
        refs: [npa-consult, no07-ipa-insider]
        gauges: { trust: 10, stamina: -10 }
        setFlags: { policeReport: true, privilegeReview: true }
        items:
          - { id: p08-c-order, points: 8, axis: order, refs: [npa-consult] }
          - { id: p08-c-record, points: 8, axis: record, refs: [meti-trade-secret] }
          - { id: p08-c-content, points: 5, axis: content, refs: [no07-ipa-insider] }

  - id: p09-rumor
    at: { day: 3, minutes: 960 }
    phase: notify
    sound: { se: [notify_sns] }
    text: { ja: '午後4時。掲示板とSNSに「あのコールセンターから名簿が流出した」と書き込みが広がっている。数字も原因も、こちらの調査結果とは一致しない。', en: '' }
    voices: [v09-insider, v09-coward, v09-ok]
    choices:
      - id: p09-deny
        text: { ja: '「事実無根」とだけ発表し、以後の書き込みには反応しない。', en: '' }
        minutes: 60
        category: hurt
        points: -100
        refs: [meti-disclosure-guidance]
        gauges: { flame: 15, trust: -10 }
        items:
          - { id: p09-a-wording, points: -10, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: p09-a-content, points: -10, axis: content, refs: [jpcert-handling] }
      - id: p09-facts
