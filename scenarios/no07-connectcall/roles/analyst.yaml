          - { id: a18-c-care, points: 5, axis: care, refs: [ipa-sme-guideline] }
          - { id: a18-c-time, points: 4, axis: time, refs: [jpcert-handling] }
        explain: { ja: '権限、監査ログ、外部媒体の制限を仕組みにする方向は正しい。委託先の受け入れと退場の条件が契約にないため、境界で穴が残る。', en: '' }
    lesson: { ja: '研修の回数を増やすより、権限の棚卸し、監査ログの保存期間、外部媒体の制限を仕組みにする。委託先の受け入れ時の審査と退場時の削除を契約に盛り込むと、人に依存しない再発防止になる。', en: '' }
drafts:
  incident-note:
    title: { ja: '一次報告メモ', en: '' }
    slots:
      - id: timing
        label: { ja: '出す時刻', en: '' }
        auto: true
        items:
          - { id: in-t-12h, when: { withinHours: 12 }, points: 10, axis: time, refs: [jpcert-handling] }
          - { id: in-t-24h, when: { withinHours: 24 }, points: 3, axis: time, refs: [jpcert-handling] }
          - { id: in-t-late, when: { otherwise: true }, points: -15, axis: time, refs: [jpcert-handling] }
      - id: scope
        label: { ja: '対象範囲', en: '' }
        options:
          - { id: in-s-split, text: { ja: '可能性のある全期間と、確認済みのクライアントを分けて書く', en: '' }, points: 10, axis: content, refs: [ppc-report-prelim], explain: { ja: '影響の全期間と確認済みの範囲を分けており、後から対象が増えても説明を足すだけで済む。範囲を狭く見せる書き方より安全だ。', en: '' } }
          - { id: in-s-recent, text: { ja: '直近1年分だけを対象として書き、それ以前の期間には触れない', en: '' }, points: -15, axis: content, refs: [ppc-report-prelim], delayed: { afterPhases: 1, points: -20, reason: { ja: '対象の追加連絡が必要になり、説明が二度手間になった。', en: '' } }, explain: { ja: '直近1年と書くと、10年に及ぶ可能性を隠した形になり、後から対象を広げる連絡が必要になる。初報の信頼を落とす。', en: '' } }
      - id: evidence
        label: { ja: '証拠の扱い', en: '' }
        options:
          - { id: in-e-none, text: { ja: '証拠の保管場所や取得時刻には触れず、本文から外しておく', en: '' }, points: -8, axis: record, refs: [nist-sp800-61r3], explain: { ja: '証拠に触れないと、保全しているのか否かが伝わらず、後の説明で前提が食い違う。書ける範囲で触れておきたい。', en: '' } }
          - { id: in-e-chain, text: { ja: '保全した端末、ログ、入退室記録の保管場所と取得時刻を書く', en: '' }, points: 8, axis: record, refs: [cissp-cbk-secops], explain: { ja: '保管場所と取得時刻を書いておくと、証拠がいつ誰の管理下にあったかを後から示せる。調査の前提を共有する意味がある。', en: '' } }
      - id: certainty
        label: { ja: '断定の強さ', en: '' }
        options:
          - { id: in-c-maybe, text: { ja: '「可能性」と「確認できた事実」を使い分ける', en: '' }, points: 8, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: '可能性と確認済みを使い分けており、後で事実が増えても記述を訂正しなくて済む。断定を避けた分だけ説明が安定する。', en: '' } }
          - { id: in-c-confirm, text: { ja: 'すべての記述を「確認した」と断定した書き方にそろえる', en: '' }, points: -10, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: '未確認の内容まで断定すると、後で違ったときに全面訂正になる。確認と可能性の区別を失う書き方は避けたい。', en: '' } }
      - id: unknown
        label: { ja: '不明点', en: '' }
        options:
          - { id: in-u-omit, text: { ja: '不明な点には触れず、確認できた内容だけを並べておく', en: '' }, points: -6, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '不明点に触れないと、分かっていることだけが独り歩きする。後から不明点が増えたときの説明が苦しくなる。', en: '' } }
          - { id: in-u-explicit, text: { ja: '不明点と、それを確認する期限を並べて書いておく', en: '' }, points: 8, axis: content, refs: [jpcert-handling], explain: { ja: '不明点と確認の期限を並べると、読み手は何がまだ分からないかを把握できる。次の報告の約束にもなる。', en: '' } }
      - id: next
        label: { ja: '次の連絡', en: '' }
        options:
          - { id: in-n-next, text: { ja: '次の報告の時刻と、報告する相手の名前を書いておく', en: '' }, points: 5, axis: order, refs: [jpcert-handling], explain: { ja: '次の報告の時刻と相手を書くと、読み手は待つべき時点を知れる。連絡の途切れを防ぐ最小限の記載だ。', en: '' } }
          - { id: in-n-none, text: { ja: '次の連絡の予定は書かず、今回の内容だけに絞る', en: '' }, points: -5, axis: order, refs: [jpcert-handling], explain: { ja: '次の連絡の予定がないと、読み手はいつ動くのか分からず、問い合わせが担当者に直接集まる。', en: '' } }
      - id: self
        label: { ja: '自分の権限', en: '' }
        options:
          - { id: in-p-none, text: { ja: '自分の権限には触れず、本人の操作だけを確認対象として書く', en: '' }, points: -10, axis: record, refs: [no07-ipa-insider], explain: { ja: '自分の権限に触れないと、同じ権限を持つ者が他にいる事実が抜け落ちる。調査の説得力が下がる。', en: '' } }
          - { id: in-p-self, text: { ja: '自分も同じ権限だと書き、自分の操作も確認対象にする', en: '' }, points: 10, axis: record, refs: [no07-ipa-insider], explain: { ja: '自分も同じ権限を持つと書くと、調査の対象から自分を外していないことが伝わる。説明の公平さを示す記載だ。', en: '' } }
      - id: sns
        label: { ja: '外部への発信', en: '' }
        options:
          - { id: in-x-none, text: { ja: '個人のSNSには書かない方針を明記する', en: '' }, points: 6, axis: wording, refs: [meti-csm-guideline], explain: { ja: '個人のSNSに書かない方針を明記すると、社内外の説明が会社の窓口に一本化される。食い違いの芽を摘める。', en: '' } }
          - { id: in-x-vague, text: { ja: '個人のSNSに「調査中」とだけ書いておく形にする', en: '' }, points: -10, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: '個人のSNSの調査中は会社の説明と切り離せず、後で食い違えば信頼を損なう。窓口を一本化したい。', en: '' } }
      - id: consult
        label: { ja: '相談先', en: '' }
        options:
          - { id: in-q-none, text: { ja: '相談先には触れず、社内の担当者だけを窓口として書く', en: '' }, points: -4, axis: order, refs: [ipa-sme-guideline], explain: { ja: '相談先を書かないと、判断が行き詰まったときに誰も動けない。外部窓口の存在は初動の保険になる。', en: '' } }
          - { id: in-q-external, text: { ja: '外部の相談窓口と保険会社の連絡先を、部長に上げる形で書く', en: '' }, points: 6, axis: order, refs: [ipa-sme-guideline], explain: { ja: '外部の相談窓口と保険会社の連絡先を書いておくと、初動の選択肢が増える。上に上げる形にした点も筋が通る。', en: '' } }
      - id: version
        label: { ja: '版の管理', en: '' }
        options:
          - { id: in-v-versioned, text: { ja: '版番号と更新時刻を書いておく形にする', en: '' }, points: 4, axis: record, refs: [cissp-cbk-secops], explain: { ja: '版番号と更新時刻があると、どの時点の報告かを後から特定できる。訂正の経緯も追いやすくなる。', en: '' } }
          - { id: in-v-plain, text: { ja: '版番号は書かずに本文だけを整える', en: '' }, points: -4, axis: record, refs: [cissp-cbk-secops], explain: { ja: '版の記載がないと、複数の版が出回ったときにどれが最新か分からない。更新の履歴も追えなくなる。', en: '' } }
  log-timeline:
    title: { ja: '持ち出しの時系列整理', en: '' }
    slots:
      - id: order
        label: { ja: '突き合わせの順序', en: '' }
        options:
          - { id: lt-o-device, text: { ja: '端末のログだけを見て、他の記録は使わずに済ませておく', en: '' }, points: -8, axis: content, refs: [nist-sp800-61r3], explain: { ja: '端末のログだけでは、入退室やバックアップと食い違ったときに原因を絞れない。突き合わせの材料を減らすのは不利だ。', en: '' } }
          - { id: lt-o-all, text: { ja: '入退室、端末、バックアップの順に突き合わせる', en: '' }, points: 8, axis: order, refs: [nist-sp800-61r3], explain: { ja: '複数の記録を順に突き合わせると、抜けた期間を別の記録で補える。順序を決めておくと作業の抜けも防げる。', en: '' } }
      - id: source
        label: { ja: '使える記録', en: '' }
        options:
          - { id: lt-s-cover, text: { ja: '残ったログとバックアップの範囲を、先に確定しておく', en: '' }, points: 8, axis: content, refs: [jpcert-handling], explain: { ja: '使える記録の範囲を先に決めると、推測で埋める必要がなくなる。説明できる範囲を明確にできる点が強い。', en: '' } }
          - { id: lt-s-memory, text: { ja: '記憶と推測で、記録の空いた期間を埋めていく', en: '' }, points: -10, axis: record, refs: [jpcert-handling], explain: { ja: '記憶と推測で空いた期間を埋めると、後で事実と食い違う。時系列の信頼を自分で落とす書き方になる。', en: '' } }
      - id: gap
        label: { ja: '分からない期間', en: '' }
        options:
          - { id: lt-g-fill, text: { ja: '不明な期間は推定の値で埋めておく形にする', en: '' }, points: -8, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: '推定で期間を埋めると、その値が事実として扱われる。後で違ったときの訂正が難しくなる。', en: '' } }
          - { id: lt-g-unknown, text: { ja: '分からない期間は「不明」と書く', en: '' }, points: 8, axis: content, refs: [cissp-cbk-secops], explain: { ja: '分からない期間を不明と明記すると、後から記録が出たときに説明を足せる。隠した形にならない点が安全だ。', en: '' } }
      - id: hash
        label: { ja: '完全性の担保', en: '' }
        options:
          - { id: lt-h-hash, text: { ja: '保全したデータのハッシュと取得者を記録する', en: '' }, points: 8, axis: record, refs: [cissp-cbk-secops], explain: { ja: 'ハッシュと取得者を残すと、保全したデータが変わっていないことを後から示せる。証拠の完全性を支える記載だ。', en: '' } }
          - { id: lt-h-none, text: { ja: 'ハッシュは取らず、ファイルだけを残す', en: '' }, points: -8, axis: record, refs: [cissp-cbk-secops], explain: { ja: 'ハッシュがないと、データが途中で変わっていないことを示せない。証拠としての重みが下がる。', en: '' } }
      - id: scope
        label: { ja: '調べる範囲', en: '' }
        options:
          - { id: lt-a-one, text: { ja: '本人が使っていた端末だけを見て、範囲を広げないでおく', en: '' }, points: -10, axis: content, refs: [no07-ipa-insider], explain: { ja: '本人の端末だけを見ると、同じ権限の別の経路を見落とす。関与の確認が本人に閉じてしまう。', en: '' } }
          - { id: lt-a-all, text: { ja: '書き出しが可能だった端末とアカウントを並べる', en: '' }, points: 10, axis: content, refs: [no07-ipa-insider], explain: { ja: '同じ書き出しが可能な端末とアカウントを並べると、本人以外の関与も視野に入る。範囲の見落としを減らせる。', en: '' } }
      - id: clients
        label: { ja: 'クライアントの書き方', en: '' }
        options:
          - { id: lt-c-split, text: { ja: '影響しうるクライアントを、確認済みと調査中に分ける', en: '' }, points: 8, axis: order, refs: [ppc-report-prelim], explain: { ja: '確認済みと調査中を分けると、読み手は通知の順番を決められる。範囲を広げすぎずに説明できる点が良い。', en: '' } }
          - { id: lt-c-all, text: { ja: 'クライアントの欄は「全社」とだけ書いておく', en: '' }, points: -6, axis: content, refs: [ppc-report-prelim], explain: { ja: '全社とだけ書くと、影響の有無にかかわらず同じ説明になり、対象の絞り込みが進まない。', en: '' } }
      - id: self
        label: { ja: '自分の操作', en: '' }
        options:
          - { id: lt-p-none, text: { ja: '自分の操作は確認の対象から外しておく', en: '' }, points: -10, axis: record, refs: [no07-ipa-insider], explain: { ja: '自分の操作を除くと、同じ権限を持つ者の確認が片手落ちになる。都合のよい範囲だけを見た形になりやすい。', en: '' } }
          - { id: lt-p-self, text: { ja: '自分の操作履歴も、同じ条件で確認する', en: '' }, points: 8, axis: record, refs: [no07-ipa-insider], explain: { ja: '自分の操作も同じ条件で見ると、調査の公平さが伝わる。同じ権限を持つ者の確認を省かない姿勢が信頼につながる。', en: '' } }
      - id: review
        label: { ja: '確認の体制', en: '' }
        options:
          - { id: lt-r-second, text: { ja: '整理した時系列を、調査の担当者以外にも確認してもらう', en: '' }, points: 6, axis: order, refs: [cissp-cbk-secops], explain: { ja: '担当者以外の確認を挟むと、見落としや思い込みを減らせる。時系列の説得力が上がる。', en: '' } }
          - { id: lt-r-solo, text: { ja: '時系列の確認は、自分一人で済ませて終える形にする', en: '' }, points: -6, axis: order, refs: [cissp-cbk-secops], explain: { ja: '一人で確認して終えると、思い込みがそのまま残る。後から別の目で見直す費用の方が大きい。', en: '' } }
  inquiry-guide:
    title: { ja: '問い合わせ応答の台本', en: '' }
    slots:
      - id: facts
        label: { ja: '事実の書き方', en: '' }
        options:
          - { id: iq-f-split, text: { ja: '確認できた事実と、まだ確認中の点を分けて書く', en: '' }, points: 8, axis: content, refs: [ppc-notify-person], explain: { ja: '確認済みと確認中を分けると、現場は同じ言い方で答えられる。後から事実が増えても説明を足すだけで済む。', en: '' } }
          - { id: iq-f-vague, text: { ja: '「調査中です」とだけ書いて、詳細には触れない', en: '' }, points: -8, axis: care, refs: [ppc-notify-person], explain: { ja: '調査中とだけ答えると、現場ごとに言い方が変わる。説明の食い違いが次の問い合わせを呼ぶ。', en: '' } }
      - id: scope
        label: { ja: '対象範囲', en: '' }
        options:
          - { id: iq-s-all, text: { ja: '対象の欄は「全員」と書いて、範囲を絞らずにおく', en: '' }, points: -8, axis: content, refs: [ppc-report-scope], explain: { ja: '全員とだけ答えると、対象かどうかに関係なく同じ不安が広がる。問い合わせが現場に集中する。', en: '' } }
          - { id: iq-s-client, text: { ja: '対象になりうる範囲をクライアントごとに分ける', en: '' }, points: 8, axis: content, refs: [ppc-report-scope], explain: { ja: 'クライアントごとに対象を分けると、相手は自分の範囲を把握できる。範囲を広く見せない分、混乱も減る。', en: '' } }
      - id: action
        label: { ja: '相手にすること', en: '' }
        options:
          - { id: iq-a-concrete, text: { ja: '不審な電話や郵便への注意と、問い合わせ先を具体的に書く', en: '' }, points: 8, axis: care, refs: [ppc-notify-person], explain: { ja: '不審な電話や郵便への注意と問い合わせ先を具体的に書くと、相手は自分で動ける。現場の負担も減る。', en: '' } }
          - { id: iq-a-generic, text: { ja: '「十分ご注意ください」とだけ書いておく形にする', en: '' }, points: -8, axis: care, refs: [ppc-notify-person], explain: { ja: '注意してくださいだけでは、何に気をつけるのか伝わらない。具体的な案内がない分、問い合わせが増える。', en: '' } }
      - id: phishing
        label: { ja: '偽の連絡への注意', en: '' }
        options:
          - { id: iq-p-none, text: { ja: '偽の連絡への注意は書かず、本物の連絡だけを案内する', en: '' }, points: -8, axis: care, refs: [ppc-notify-person], explain: { ja: '偽の連絡への注意がないと、相手は本物と誤解して番号を伝えかねない。通知の効果が薄れる。', en: '' } }
          - { id: iq-p-warn, text: { ja: '当社やクライアントが電話で暗証番号を聞くことはないと書く', en: '' }, points: 8, axis: care, refs: [ppc-notify-person], explain: { ja: '暗証番号を聞かないと明記すると、偽の連絡による二次被害を防げる。通知の場面で必ず触れたい。', en: '' } }
      - id: promise
        label: { ja: '補償の扱い', en: '' }
        options:
          - { id: iq-m-route, text: { ja: '補償は約束せず、窓口に回す基準を書く', en: '' }, points: 6, axis: order, refs: [no07-dispatch-law], explain: { ja: '補償を約束せず窓口に回す基準を書くと、現場は判断に迷わない。約束の食い違いも防げる。', en: '' } }
          - { id: iq-m-promise, text: { ja: '現場の判断で、補償を約束してよいと書く形にする', en: '' }, points: -10, axis: order, refs: [no07-dispatch-law], explain: { ja: '現場の判断で補償を約束すると、後の条件と食い違い、履行をめぐる争いになる。窓口を決めてからにする。', en: '' } }
      - id: record
        label: { ja: '記録', en: '' }
        options:
          - { id: iq-r-none, text: { ja: '問い合わせの記録は残さず、対応だけで終えておく', en: '' }, points: -6, axis: record, refs: [jpcert-handling], explain: { ja: '記録がないと、何をどこまで答えたかを後から示せない。同じ質問への対応も毎回振り出しになる。', en: '' } }
          - { id: iq-r-log, text: { ja: '問い合わせの時刻と応答、転送先を記録する', en: '' }, points: 6, axis: record, refs: [jpcert-handling], explain: { ja: '時刻、内容、応答、転送先を残すと、同じ質問の傾向が分かり、次の案内に生かせる。記録は応援要員を判断する材料にもなる。', en: '' } }
      - id: escalate
        label: { ja: '上げる基準', en: '' }
        options:
          - { id: iq-e-rule, text: { ja: '同じ質問が続いたら上に上げる基準を書く', en: '' }, points: 6, axis: order, refs: [meti-csm-guideline], explain: { ja: '上げる基準を決めておくと、現場は抱え込まずに済む。対応の遅れも見えやすくなり、同じ質問の増加にも早く気づける。', en: '' } }
          - { id: iq-e-floor, text: { ja: '現場の判断で何とかさせると書く', en: '' }, points: -6, axis: order, refs: [meti-csm-guideline], explain: { ja: '現場の判断で何とかさせると、判断の重さが現場に残る。基準がない分、対応がばらつく。', en: '' } }
      - id: relief
        label: { ja: '現場の負担', en: '' }
        options:
          - { id: iq-b-ot, text: { ja: '残業で対応すると書いて、要員は増やさない', en: '' }, points: -6, axis: care, refs: [ipa-sme-guideline], explain: { ja: '残業で対応すると書くだけでは、長引いたときに現場が疲弊する。答えの質も下がりやすい。', en: '' } }
          - { id: iq-b-rest, text: { ja: '応援要員の配置と、休憩の取り方を決める', en: '' }, points: 6, axis: care, refs: [ipa-sme-guideline], explain: { ja: '応援要員と休憩の取り方を決めると、長引いても答えの質が落ちない。現場の消耗を先に抑えられる。', en: '' } }
voices:
  - { id: v01-public, media: sns, misleading: true, type: public-opinion, text: { ja: '委託先の不始末だ。早く認めて謝れば済む。', en: '' }, trigger: { at: point } }
  - { id: v01-boss, media: boss, misleading: true, type: boss-pressure, text: { ja: '今日は経理の更新が優先だ。調査は明日でいい。', en: '' }, trigger: { at: point } }
  - { id: v01-ok, media: chat, misleading: false, text: { ja: '受付の現場「同じ名簿の項目を、さっき別の会社からも聞かれました」。', en: '' }, trigger: { at: point } }
  - { id: v01-after, media: news, misleading: false, text: { ja: '先に謝るとは、責任を認めたことになる。', en: '' }, trigger: { at: after, choice: a01-check-report } }
  - { id: v02-expert, media: vendor, misleading: true, type: fake-expert, text: { ja: '端末を新品に替えれば同じ経路はもう使えません。クライアントにも早く安心してもらえます。', en: '' }, trigger: { at: point } }
  - { id: v02-field, media: chat, misleading: true, type: well-meant-field, text: { ja: '怪しい端末は電源を抜いて倉庫にしまっておきました。これで安全です。', en: '' }, trigger: { at: point } }
  - { id: v02-popular, media: sns, misleading: true, type: popular, text: { ja: '他のプレイヤーの多くは、『様子を見る』を選んでいます。', en: '' }, trigger: { at: point } }
  - { id: v02-ok, media: chat, misleading: false, text: { ja: '情シスの同僚「止める前に、ログイン中のセッションと接続元を控えましょう」。', en: '' }, trigger: { at: point } }
  - { id: v02-after, media: sns, misleading: false, text: { ja: '現場の仕事を止めるのか。他のセンターは動いている。', en: '' }, trigger: { at: after, choice: a02-stop-rotate } }
  - { id: v03-field, media: chat, misleading: true, type: well-meant-field, text: { ja: '保証が切れる前に、メーカーに点検に出しましょう。触らないほうが安全です。', en: '' }, trigger: { at: point } }
  - { id: v03-past, media: boss, misleading: true, type: past-success, text: { ja: '前回も端末を初期化して済んだ。今回も同じでいい。', en: '' }, trigger: { at: point } }
  - { id: v03-ok, media: chat, misleading: false, text: { ja: '外部の相談窓口「電源を入れ直す前に、保全の順序を決めましょう」。', en: '' }, trigger: { at: point } }
  - { id: v03-after, media: news, misleading: false, text: { ja: '端末を返さないのか。業務が回らない。', en: '' }, trigger: { at: after, choice: a03-preserve-plus } }
  - { id: v04-expert, media: vendor, misleading: true, type: fake-expert, text: { ja: 'ログがないなら、もう分かりません。調査は打ち切りましょう。', en: '' }, trigger: { at: point } }
  - { id: v04-insider, media: board, misleading: true, type: fake-insider, text: { ja: '中の人だけど、ログは上に消された。本当は10倍の名簿が流れている。', en: '' }, trigger: { at: point } }
  - { id: v04-ok, media: chat, misleading: false, text: { ja: '同僚「バックアップのテープと、入退室の記録は残っています」。', en: '' }, trigger: { at: point } }
  - { id: v04-after, media: news, misleading: false, text: { ja: '残ったログをつなぎ合わせても、推測でしょ。', en: '' }, trigger: { at: after, choice: a04-piece-plus } }
  - { id: v05-boss, media: boss, misleading: true, type: boss-pressure, text: { ja: '確定したことだけ書け。推測は書くな。', en: '' }, trigger: { at: point } }
  - { id: v05-bold, media: sns, misleading: true, type: bold-buzz, text: { ja: 'SNSで一言書けば、社内も一斉に動きますよ。', en: '' }, trigger: { at: point } }
  - { id: v05-ok, media: chat, misleading: false, text: { ja: '部長「分からないことは、分からないと書いてくれ。あとで直せる」。', en: '' }, trigger: { at: point } }
  - { id: v05-after, media: boss, misleading: false, text: { ja: 'まだ分かっていないのに、上に報告するのか。', en: '' }, trigger: { at: after, choice: a05-report-plus } }
  - { id: v06-vendor, media: vendor, misleading: true, type: vendor-interest, text: { ja: '証拠は弊社で預かります。御社は業務に集中してください。', en: '' }, trigger: { at: point } }
  - { id: v06-law, media: board, misleading: true, type: law-ish, text: { ja: '派遣先に捜査権はありません。端末は持ち帰らせるのが筋です。', en: '' }, trigger: { at: point } }
  - { id: v06-ok, media: chat, misleading: false, text: { ja: '顧問弁護士「端末はこちらの管理下に置いたまま、事実確認に必要な記録だけを弁護士を通じて渡しましょう」。', en: '' }, trigger: { at: point } }
  - { id: v06-after, media: vendor, misleading: false, text: { ja: '派遣元に証拠を渡さないのか。角が立つぞ。', en: '' }, trigger: { at: after, choice: a06-joint-police } }
  - { id: v07-public, media: sns, misleading: true, type: public-opinion, text: { ja: 'もう一人いるなら、全員を即刻退場させろ。それが一番早い。', en: '' }, trigger: { at: point } }
  - { id: v07-past, media: boss, misleading: true, type: past-success, text: { ja: '前回の情報漏えいも、注意すれば収まった。今回は大ごとにしないでいい。', en: '' }, trigger: { at: point } }
  - { id: v07-ok, media: chat, misleading: false, text: { ja: '現場のリーダー「まず、誰が何を書き出せるのかを止めましょう」。', en: '' }, trigger: { at: point } }
