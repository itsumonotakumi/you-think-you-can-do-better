          - { id: a10-b-wording, points: -10, axis: wording, refs: [meti-disclosure-guidance] }
        explain: { ja: '根拠のない件数を断定すると、後で大きく変わったときに訂正が必要になる。概算と書くだけでも、断定の表現は避けたい。', en: '' }
      - id: a10-material-plus
        text: { ja: '材料に加え、顧客各社が自社の報告に使える整理もあわせて用意する。', en: '' }
        minutes: 180
        category: recover
        points: 120
        refs: [ppc-report-prelim, meti-csm-guideline]
        gauges: { trust: 10, stamina: -10 }
        setFlags: { prelimMaterialsSent: true, clientReportGuide: true }
        items:
          - { id: a10-d-content, points: 8, axis: content, refs: [ppc-report-prelim] }
          - { id: a10-d-time, points: 8, axis: time, refs: [ppc-report-prelim] }
          - { id: a10-d-order, points: 6, axis: order, refs: [meti-csm-guideline] }
          - { id: a10-d-care, points: 4, axis: care, refs: [ppc-notify-person] }
        explain: { ja: '確認済みと候補と不明点を分けた材料に加え、顧客が自社の報告に使える整理まで用意している。期限に間に合わせつつ、後の説明も軽くなる。', en: '' }
      - id: a10-material
        text: { ja: '確認できた範囲、対象の候補、不明点、次の確認予定を分けて材料を作る。', en: '' }
        minutes: 120
        category: maintain
        points: 30
        refs: [ppc-report-prelim]
        gauges: { trust: 5, stamina: -5 }
        setFlags: { prelimMaterialsSent: true }
        items:
          - { id: a10-c-content, points: 8, axis: content, refs: [ppc-report-prelim] }
          - { id: a10-c-time, points: 8, axis: time, refs: [ppc-report-prelim] }
          - { id: a10-c-record, points: 4, axis: record, refs: [jpcert-handling] }
        explain: { ja: '確認できた範囲と不明点を分けて期限内に出す形は妥当だ。顧客各社の報告に使う材料までは用意しておらず、問い合わせが集まりやすい。', en: '' }
    lesson: { ja: '期限のある速報は、件数が固まるのを待たずに、確認できた範囲と候補と不明点を分けて出す。顧客が自社の報告に使える材料も同じ事実から作ると、説明が食い違わず、問い合わせにも答えやすい。', en: '' }

  - id: a11-police
    at: { day: 3, minutes: 600 }
    phase: notify
    sound: { se: [phone_ring] }
    text: { ja: '午前10時。持ち出しは犯罪にあたる可能性が高い。顧問弁護士から「警察に相談する前に、渡せる記録をそろえてほしい」と言われた。手元には、切れ切れのログと端末のディスクイメージがある。', en: '' }
    voices: [v11-vendor, v11-flattery, v11-ok]
    choices:
      - id: a11-settle
        text: { ja: '示談を優先し、警察への相談は見送って社内の処理だけで終える。', en: '' }
        minutes: 90
        category: hurt
        points: -120
        refs: [meti-trade-secret, npa-consult]
        gauges: { trust: -10, damage: 5 }
        items:
          - { id: a11-a-order, points: -10, axis: order, refs: [npa-consult] }
          - { id: a11-a-record, points: -10, axis: record, refs: [meti-trade-secret] }
        explain: { ja: '示談だけで終えると、証拠が残らず、後の刑事手続きで説明する材料も失う。犯罪の可能性がある事案では相談を避ける理由にならない。', en: '' }
      - id: a11-oral
        text: { ja: '口頭で概要だけを話し、時系列や保全した記録は渡さずに終える。', en: '' }
