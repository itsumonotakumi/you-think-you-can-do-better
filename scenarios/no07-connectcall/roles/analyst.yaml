          - { id: a11-b-order, points: -6, axis: order, refs: [jpcert-handling] }
        explain: { ja: '口頭だけでは、伝えた事実も時刻も残らない。記録を渡さないと、聞き取りのたびに説明が変わり、信用を落とす。', en: '' }
      - id: a11-pack
        text: { ja: '時系列、保全した証拠の一覧、管理の連鎖を1つの資料にまとめて渡す。', en: '' }
        minutes: 150
        category: maintain
        points: 30
        refs: [npa-consult, cissp-cbk-secops]
        gauges: { trust: 5, stamina: -10 }
        setFlags: { policePack: true }
        items:
          - { id: a11-c-order, points: 8, axis: order, refs: [npa-consult] }
          - { id: a11-c-record, points: 8, axis: record, refs: [cissp-cbk-secops] }
          - { id: a11-c-content, points: 4, axis: content, refs: [jpcert-handling] }
        explain: { ja: '時系列と証拠の一覧を1つにまとめる形は、説明の土台として十分に機能する。相手ごとに事実がずれる点までは手当てできていない。', en: '' }
      - id: a11-pack-plus
        text: { ja: '資料に加え、警察と派遣元の双方に同じ事実を渡し、食い違いを防ぐ。', en: '' }
        minutes: 210
        category: recover
        points: 120
        refs: [npa-consult, no07-dispatch-law]
        gauges: { trust: 10, stamina: -15 }
        setFlags: { policePack: true, agencyJoint: true }
        items:
          - { id: a11-d-order, points: 8, axis: order, refs: [npa-consult] }
          - { id: a11-d-record, points: 8, axis: record, refs: [cissp-cbk-secops] }
          - { id: a11-d-content, points: 5, axis: content, refs: [no07-dispatch-law] }
          - { id: a11-d-care, points: 4, axis: care, refs: [meti-csm-guideline] }
        explain: { ja: '資料を整えたうえで、警察と派遣元に同じ事実を渡している。説明の食い違いを先に防ぐ点が強く、後の調整も進めやすい。', en: '' }
    lesson: { ja: '警察に相談する前提で、時系列、保全した証拠、管理の連鎖を1つの資料にまとめる。同じ事実を派遣元にも渡し、説明の食い違いを先に防ぐ。示談は相談を避ける理由にならない。', en: '' }

  - id: a12-threat
    at: { day: 4, minutes: 600 }
    phase: notify
    sound: { se: [mail_arrive] }
    text: { ja: '午前10時。会社の代表アドレスに、差出人不明のメールが届いた。「警察に出すなら、持っている名簿を全部公開する。君の名前も出す」。同じメールが、自分の端末にも転送されている。名簿の公開と脅迫は犯罪です。', en: '' }
    voices: [v12-attacker, v12-public, v12-ok]
    choices:
      - id: a12-preserve-plus
        text: { ja: '保全に加え、同じ文面が他の社員にも届いていないかを確かめて注意を出す。', en: '' }
        minutes: 120
        category: recover
        points: 120
        refs: [jpcert-handling, npa-consult]
        gauges: { flame: -10, trust: 10, stamina: -10 }
        setFlags: { threatPreserved: true, threatAlert: true }
        items:
          - { id: a12-d-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: a12-d-order, points: 8, axis: order, refs: [npa-consult] }
          - { id: a12-d-care, points: 6, axis: care, refs: [meti-csm-guideline] }
          - { id: a12-d-content, points: 4, axis: content, refs: [jpcert-handling] }
        explain: { ja: '返信せずに記録を保全し、他の社員への到達まで確かめている。社内への注意も同時に進み、同じ脅しへの備えが広がる。', en: '' }
      - id: a12-reply
        text: { ja: '自分で返信し、名簿を公開しないよう相手と直接交渉して収めようとしてしまう。', en: '' }
        minutes: 60
        category: hurt
        points: -120
        refs: [npa-consult]
        gauges: { flame: 10, trust: -10 }
        delayed:
          - { afterPhases: 1, points: -40, gauges: { flame: 15 }, reason: { ja: '返信で担当者の存在が伝わり、要求が強まった。', en: '' } }
        items:
          - { id: a12-a-order, points: -10, axis: order, refs: [npa-consult] }
          - { id: a12-a-record, points: -8, axis: record, refs: [jpcert-handling] }
        explain: { ja: '返信すると担当者の存在が伝わり、要求が強まる。交渉に応じる姿勢は、相手に材料を渡す結果になりやすい。', en: '' }
      - id: a12-delete
        text: { ja: '気持ちが悪いので、届いたメールをそのまま削除して見なかったことにする。', en: '' }
        minutes: 15
        category: fatal
        points: -250
        refs: [jpcert-handling]
        gauges: { flame: 15, trust: -20 }
        setFlags: { destroyedEvidence: true }
        items:
          - { id: a12-b-record, points: -20, axis: record, refs: [jpcert-handling] }
          - { id: a12-b-content, points: -12, axis: content, refs: [npa-consult] }
        explain: { ja: '削除すると脅迫の記録が失われ、警察への相談も難しくなる。証拠を自分で消す行為で、後の説明の土台も失う。', en: '' }
      - id: a12-preserve
        text: { ja: '返信せず、本文、ヘッダ、受信時刻を保全し、弁護士と警察の窓口に渡す。', en: '' }
        minutes: 90
        category: maintain
        points: 30
        refs: [jpcert-handling, npa-consult]
        gauges: { flame: -5, trust: 5, stamina: -5 }
        setFlags: { threatPreserved: true }
        items:
          - { id: a12-c-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: a12-c-order, points: 8, axis: order, refs: [npa-consult] }
          - { id: a12-c-time, points: 4, axis: time, refs: [jpcert-handling] }
        explain: { ja: '返信せずに本文とヘッダを保全し、弁護士と警察につなぐ流れは正しい。他の社員への到達の確認が抜け、備えが遅れる。', en: '' }
    lesson: { ja: '脅迫には返信しない。本文、ヘッダ、受信時刻を保全し、弁護士と警察の窓口に渡す。同じ文面が他の社員に届いていないかを確かめ、社内にも注意を出す。削除は証拠を失う。', en: '' }

  - id: a13-inquiry
    at: { day: 5, minutes: 600 }
    phase: notify
    sound: { se: [phone_ring] }
    text: { ja: '午前10時。クライアントの顧客から「名簿が使われたのか」という問い合わせが、自社の窓口にも入り始めた。現場のオペレーターは、何と答えてよいか分からず、電話を保留にしている。', en: '' }
    voices: [v13-public, v13-vendor, v13-ok]
    choices:
      - id: a13-nothing
        text: { ja: '現場には「調査中」とだけ言わせ、答え方の台本は作らずに任せておく。', en: '' }
        minutes: 30
        category: hurt
        points: -100
        refs: [ppc-notify-person]
        gauges: { flame: 15, trust: -10 }
        coward: true
        items:
          - { id: a13-a-care, points: -10, axis: care, refs: [ppc-notify-person] }
          - { id: a13-a-order, points: -8, axis: order, refs: [meti-csm-guideline] }
        explain: { ja: '台本がないと、現場は同じ質問に違う答えを返す。説明の食い違いが次の問い合わせを呼び、信頼をさらに落とす。', en: '' }
      - id: a13-script-plus
        text: { ja: '事実の整理に加え、問い合わせの記録様式と応援要員の必要性も提案する。', en: '' }
        minutes: 180
        category: recover
        points: 120
        refs: [ppc-notify-person, meti-csm-guideline]
        gauges: { flame: -10, trust: 10, stamina: -15 }
        detail: inquiry-guide
        setFlags: { inquiryScript: true, inquiryDesk: true }
        items:
          - { id: a13-d-care, points: 8, axis: care, refs: [ppc-notify-person] }
          - { id: a13-d-content, points: 8, axis: content, refs: [meti-csm-guideline] }
          - { id: a13-d-record, points: 6, axis: record, refs: [jpcert-handling] }
          - { id: a13-d-order, points: 4, axis: order, refs: [ipa-sme-guideline] }
        explain: { ja: '事実の整理に加え、記録の様式と応援要員まで提案しており、現場が同じ答えを続けられる。負担の偏りも先に抑えている。', en: '' }
      - id: a13-promise
        text: { ja: '「補償します」と、現場の判断だけでその場の約束をさせてしまう形にする。', en: '' }
        minutes: 45
        category: hurt
        points: -80
        refs: [no07-dispatch-law, ppc-notify-person]
        gauges: { trust: -10 }
        items:
          - { id: a13-b-order, points: -10, axis: order, refs: [no07-dispatch-law] }
          - { id: a13-b-care, points: -8, axis: care, refs: [ppc-notify-person] }
        explain: { ja: '現場の判断で補償を約束すると、後の条件と食い違い、約束の履行をめぐる争いになる。約束は窓口を決めてからにする。', en: '' }
      - id: a13-script
        text: { ja: '確認できた事実、言ってはいけないこと、転送先の案をまとめて現場に渡す。', en: '' }
        minutes: 120
        category: maintain
        points: 30
        refs: [ppc-notify-person, meti-csm-guideline]
        gauges: { flame: -5, trust: 5, stamina: -10 }
        detail: inquiry-guide
        setFlags: { inquiryScript: true }
        items:
          - { id: a13-c-care, points: 8, axis: care, refs: [ppc-notify-person] }
          - { id: a13-c-content, points: 8, axis: content, refs: [meti-csm-guideline] }
          - { id: a13-c-order, points: 4, axis: order, refs: [jpcert-handling] }
        explain: { ja: '事実と禁句と転送先をまとめて渡す形は、現場の答えをそろえる。記録の様式と応援要員の見通しがなく、長引くと負担が偏る。', en: '' }
    lesson: { ja: '問い合わせには、確認できた事実、言ってはいけないこと、転送先をまとめた台本を渡す。補償は現場で約束させない。記録の様式と応援要員まで決めると、長引いても答えがぶれない。', en: '' }

  - id: a14-resume
    at: { day: 10, minutes: 600 }
    phase: recover
    sound: { se: [notify_sns] }
    text: { ja: '午前10時。受託業務を再開する日。権限を絞った状態で、一部のセンターだけ動かす案が出ている。再開の前に、何を確認するかを決める。', en: '' }
    voices: [v14-public, v14-coward, v14-ok]
    choices:
      - id: a14-full
        text: { ja: '全センターを全面再開し、監視も当日から通常の体制に戻してしまう形にする。', en: '' }
        minutes: 120
        category: hurt
        points: -150
        refs: [no07-ipa-insider]
        gauges: { damage: 20, flame: 10, trust: -10 }
        delayed:
          - { afterPhases: 1, points: -60, gauges: { damage: 15, trust: -15 }, reason: { ja: '再開後に別の担当者が外部媒体へ書き出そうとし、業務を再度止めた。', en: '' } }
        items:
          - { id: a14-a-order, points: -12, axis: order, refs: [no07-ipa-insider] }
          - { id: a14-a-record, points: -10, axis: record, refs: [jpcert-handling] }
          - { id: a14-a-care, points: -5, axis: care, refs: [meti-csm-guideline] }
        explain: { ja: '全面再開すると、権限の見直しが済む前に古い経路が戻る。監視も通常に戻すため、再発の兆候を取り逃がしやすい。', en: '' }
      - id: a14-wait
        text: { ja: 'もう一週間は全部止めたままにして、再開の判断を先に延ばし続けてしまう。', en: '' }
        minutes: 60
        category: hurt
        points: -80
        refs: [no07-ipa-insider]
        gauges: { flame: 5, trust: -5 }
        coward: true
        items:
          - { id: a14-b-time, points: -8, axis: time, refs: [no07-ipa-insider] }
          - { id: a14-b-care, points: -6, axis: care, refs: [meti-csm-guideline] }
        explain: { ja: '止めたままにする期間が延びるほど、現場と顧客の負担が増える。再開の条件を示さないまま待つのは、判断を先延ばしにしているだけになる。', en: '' }
      - id: a14-step-verify
        text: { ja: '段階再開の条件に加え、再開前のチェックリストを第三者に確認してもらう。', en: '' }
        minutes: 210
        category: recover
        points: 120
        refs: [no07-ipa-insider, meti-csm-guideline]
        gauges: { damage: -15, trust: 10, stamina: -15 }
        setFlags: { steppedResume: true, resumeVerified: true }
        items:
          - { id: a14-d-order, points: 8, axis: order, refs: [no07-ipa-insider] }
          - { id: a14-d-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: a14-d-content, points: 6, axis: content, refs: [nist-sp800-61r3] }
          - { id: a14-d-care, points: 4, axis: care, refs: [meti-csm-guideline] }
        explain: { ja: '権限を絞った段階再開に加え、第三者がチェックリストを確認している。再開の速さと安全の両方を説明できる形になっている。', en: '' }
      - id: a14-step
        text: { ja: '段階再開の条件と、監視を強める案を作り、部長に提案して判断を仰いでおく。', en: '' }
        minutes: 150
        category: maintain
        points: 30
        refs: [no07-ipa-insider]
        gauges: { damage: -10, trust: 5, stamina: -10 }
        setFlags: { steppedResume: true }
        items:
          - { id: a14-c-order, points: 8, axis: order, refs: [no07-ipa-insider] }
          - { id: a14-c-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: a14-c-content, points: 4, axis: content, refs: [nist-sp800-61r3] }
        explain: { ja: '段階再開と監視強化の案は妥当で、被害の再発を抑えながら動かせる。チェックの第三者確認がないため、条件の妥当性は社内の見立てに頼る。', en: '' }
    lesson: { ja: '再開は段階的に進め、権限を絞った状態で監視を強める。再開前のチェックリストを作り、第三者の確認を経ると、条件の妥当性を社外にも説明できる。全面再開と全面停止の間で決める。', en: '' }

  - id: a15-monitor
    at: { day: 14, minutes: 600 }
    phase: recover
    sound: { se: [notify_chat] }
    text: { ja: '午前10時。復旧から四日。深夜のアラートは増えているが、大半は誤検知だ。監視を通常に戻すか、強化を続けるか。本来の仕事も、机の上にたまっている。', en: '' }
    voices: [v15-flattery, v15-public, v15-ok]
    choices:
      - id: a15-normal
        text: { ja: '誤検知が多いことを理由に、監視を通常の体制へ戻してしまう形にする。', en: '' }
        minutes: 60
        category: hurt
        points: -100
        refs: [nist-sp800-61r3]
        gauges: { damage: 10, trust: -5 }
        delayed:
          - { afterPhases: 1, points: -40, gauges: { damage: 15, trust: -10 }, reason: { ja: '監視を緩めた直後に、別の端末で不審な書き出しを見逃した。', en: '' } }
        items:
          - { id: a15-a-care, points: -8, axis: care, refs: [nist-sp800-61r3] }
          - { id: a15-a-record, points: -8, axis: record, refs: [cissp-cbk-secops] }
        explain: { ja: '誤検知が多いとはいえ、再発の兆候を拾う監視を通常に戻すと見逃しが増える。理由を記録しないまま緩めると、次の判断も勘に頼る。', en: '' }
      - id: a15-off
        text: { ja: 'アラートがうるさいので、通知そのものを切って静かにしてしまう形にする。', en: '' }
        minutes: 15
        category: fatal
        points: -200
        refs: [nist-sp800-61r3]
        gauges: { damage: 20, trust: -15 }
        setFlags: { alertsOff: true }
        items:
          - { id: a15-b-record, points: -15, axis: record, refs: [cissp-cbk-secops] }
