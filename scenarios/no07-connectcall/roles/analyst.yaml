    text: { ja: '午前10時。全社の情報セキュリティ研修の見直しを任された。持ち出したとされる担当者は10年連続で満点だった。研修の資料には、今回の事実はまだ反映されていない。本来の仕事に戻る日も、近づいている。', en: '' }
