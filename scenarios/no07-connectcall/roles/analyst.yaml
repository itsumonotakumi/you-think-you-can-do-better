# No.7 コネクトコール / セキュリティ担当者ロール
# 専任のセキュリティ部署はない。情報システム部の主任が、運用とセキュリティを兼ねている。
# 見えるのは、ログ、端末、現場の声。判断ポイント18、細目は choices[].items と drafts の合計で80以上。
estimateMinutes: 40
intro: { ja: 'あなたはコネクトコールの情報システム部の主任。社内システムの運用と、セキュリティの窓口を一人で兼任している。専任のセキュリティ部署はない。持ち出したとされる保守担当者は、あなたと同じフロアで、同じ管理者権限を持っていた。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-prelim-material
    ref: ppc-report-prelim
    label: { ja: '速報に使う技術的な材料の提出', en: '' }
    points: -40
    doneFlag: prelimMaterialsSent
  - id: dl-final-material
    ref: ppc-report-final-malicious
    label: { ja: '確報に使う技術的な材料の提出', en: '' }
    points: -60
    doneFlag: finalMaterialsSent
events:
  - id: ev-a-night
    at: { day: 0, minutes: 1320 }
    voices: [v-ev-night]
    gauges: { stamina: -5 }
    sound: { se: [notify_chat] }
    caption: { ja: '深夜。ログの抽出が終わらない。', en: '' }
  - id: ev-a-client
    at: { day: 1, minutes: 720 }
    voices: [v-ev-client]
    gauges: { flame: 5 }
    sound: { se: [phone_ring] }
    caption: { ja: '複数のクライアントから「説明はまだか」と電話が続いている。', en: '' }
  - id: ev-a-training
    at: { day: 7, minutes: 600 }
    voices: [v-ev-training]
    caption: { ja: '全社研修の記録では、本人は10年連続で満点だった。', en: '' }
points:
  - id: a01-client-call
    at: { day: 0, minutes: 600 }
    phase: detect
    sound: { se: [phone_ring] }
    text: { ja: '午前10時。主要クライアントの担当者から電話が入る。「うちの顧客名簿が外部で使われている。御社のセンターからではないか」。相手は名簿の項目まで具体的に話している。今日の予定は、経理システムの更新と、来月の端末入替の見積もり。セキュリティは自分一人が兼ねている。', en: '' }
    voices: [v01-public, v01-boss, v01-ok]
    notable:
      - { id: note-first-call, text: { ja: '午前10時、クライアントから名簿の外部利用を指摘された。項目まで具体的だった。', en: '' } }
    choices:
      - id: a01-vendor
        text: { ja: '監視サービスのベンダーに一次切り分けを任せ、その結果を待ってから動く。', en: '' }
        minutes: 120
        category: hurt
        points: -60
        refs: [meti-csm-guideline]
        gauges: { damage: 5, trust: -5 }
        items:
          - { id: a01-d-time, points: -7, axis: time, refs: [jpcert-handling] }
          - { id: a01-d-order, points: -6, axis: order, refs: [meti-csm-guideline] }
        explain: { ja: '一次切り分けを外部に任せた分だけ初動が遅れ、自社の管理下にある記録の確認も後回しになる。任せること自体は悪くないが、待つ姿勢が響く。', en: '' }
      - id: a01-check-report
        text: { ja: '履歴を確かめ、部長への一次連絡と外部の相談窓口への相談予約を同時に進める。', en: '' }
        minutes: 45
        category: recover
        points: 100
        refs: [jpcert-handling, meti-csm-guideline]
        gauges: { trust: 5, stamina: -10 }
        setFlags: { startedInvestigation: true, bossNotified: true }
        items:
          - { id: a01-c-time, points: 5, axis: time, refs: [jpcert-handling] }
          - { id: a01-c-order, points: 8, axis: order, refs: [meti-csm-guideline] }
          - { id: a01-c-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: a01-c-care, points: 5, axis: care, refs: [meti-csm-guideline] }
        explain: { ja: '指摘の当日に事実確認と社内への一次連絡を同時に始めており、初動として最も整っている。外部の相談窓口につなぐ判断も、後の説明の一貫性を支える。', en: '' }
      - id: a01-deny
        text: { ja: '「当社では持ち出しはありません」と断言し、詳しい調査は明日の午後に回す。', en: '' }
        minutes: 60
        category: hurt
        points: -100
        refs: [meti-disclosure-guidance]
        gauges: { flame: 10, trust: -10 }
        coward: true
        setFlags: { deniedFirst: true }
        delayed:
          - { afterPhases: 1, points: -30, gauges: { flame: 10, trust: -10 }, reason: { ja: '断言が覆り、クライアントの信頼をさらに落とした。', en: '' } }
        items:
          - { id: a01-a-record, points: -8, axis: record, refs: [jpcert-handling] }
          - { id: a01-a-time, points: -8, axis: time, refs: [jpcert-handling] }
          - { id: a01-a-wording, points: -10, axis: wording, refs: [meti-disclosure-guidance] }
        explain: { ja: '根拠のない断言は、後で事実が覆ったときに信頼を大きく落とす。調査を翌日に回す判断も、初動の遅れとして響く。', en: '' }
      - id: a01-check
        text: { ja: '保守用アカウントのログイン履歴と、外部媒体への書き出しの履歴をその場で確かめる。', en: '' }
        minutes: 90
        category: maintain
        points: 30
        refs: [jpcert-handling]
        gauges: { stamina: -5 }
        setFlags: { startedInvestigation: true }
        items:
          - { id: a01-b-time, points: 5, axis: time, refs: [jpcert-handling] }
          - { id: a01-b-order, points: 5, axis: order, refs: [jpcert-handling] }
          - { id: a01-b-record, points: 5, axis: record, refs: [jpcert-handling] }
        explain: { ja: 'ログの確認だけを進めるのは妥当だが、部長への連絡と外部相談の予約が抜けている。事実がそろってから動こうとすると初動が遅れる。', en: '' }
    lesson: { ja: '最初の電話で問われるのは、原因の断定ではなく初動の速さだ。事実確認と社内への一次連絡を同じ日に始め、外部の相談窓口にもつなぐ。断言や先送りは、後で覆ったときの損失が大きい。', en: '' }

  - id: a02-account
    at: { day: 0, minutes: 645 }
    phase: contain
    sound: { se: [notify_chat] }
    text: { ja: '午前10時45分。保守用の管理者アカウントは、10年前から同じものが使われていた。直近の記録には昨夜も外部媒体への書き出しの形跡がある。そのアカウントは、いまも生きている。', en: '' }
    voices: [v02-expert, v02-field, v02-popular, v02-ok]
    popular: { choiceId: a02-wait, percent: 61 }
    choices:
      - id: a02-wipe
        text: { ja: 'アカウントを削除し、端末をすぐに初期化したうえで、新しい端末と入れ替えてしまう。', en: '' }
        minutes: 120
        category: fatal
        points: -250
        refs: [jpcert-handling, meti-trade-secret]
        gauges: { damage: 10, trust: -10 }
        setFlags: { destroyedEvidence: true }
        delayed:
          - { afterPhases: 2, points: -60, gauges: { damage: 10, trust: -15 }, reason: { ja: '初期化で、持ち出しの経路と期間を裏付ける記録が失われた。', en: '' } }
        items:
          - { id: a02-a-record, points: -20, axis: record, refs: [jpcert-handling] }
          - { id: a02-a-content, points: -15, axis: content, refs: [meti-trade-secret] }
          - { id: a02-a-time, points: -10, axis: time, refs: [jpcert-handling] }
        explain: { ja: '初期化すると、持ち出しの経路と期間を裏付ける記録が失われる。端末を入れ替えるほど被害の輪郭がつかめなくなり、後の説明も難しくなる。', en: '' }
      - id: a02-stop
        text: { ja: 'アカウントを止め、接続元と操作履歴を先に控えてから、使っていた端末を隔離しておく。', en: '' }
        minutes: 90
        category: maintain
        points: 30
        refs: [jpcert-handling, no07-ipa-insider]
        gauges: { damage: -10, stamina: -5 }
        setFlags: { contained: true }
        items:
          - { id: a02-c-time, points: 5, axis: time, refs: [jpcert-handling] }
          - { id: a02-c-order, points: 5, axis: order, refs: [no07-ipa-insider] }
          - { id: a02-c-record, points: 8, axis: record, refs: [jpcert-handling] }
        explain: { ja: '止めて記録を控える順序は妥当で、被害の拡大は抑えられる。ただし同じ権限を持つ他のアカウントの点検が抜けており、再発の余地が残る。', en: '' }
      - id: a02-stop-rotate
        text: { ja: '停止と隔離に加え、同じ派遣元のアカウントを棚卸しし、パスワードも再発行して回す。', en: '' }
        minutes: 45
        category: recover
        points: 120
        refs: [no07-ipa-insider, jpcert-handling]
        gauges: { damage: -15, trust: 5, stamina: -10 }
        setFlags: { contained: true, privilegeReview: true }
        items:
          - { id: a02-d-order, points: 8, axis: order, refs: [no07-ipa-insider] }
          - { id: a02-d-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: a02-d-content, points: 5, axis: content, refs: [no07-ipa-insider] }
          - { id: a02-d-care, points: 5, axis: care, refs: [no07-dispatch-law] }
        explain: { ja: '止めるだけでなく、同じ権限の棚卸しと再発行まで進めており、再発の入口をふさいでいる。記録を残す順序も自然で、後続の調査を助ける。', en: '' }
      - id: a02-wait
        text: { ja: '人事と派遣元の了解が出るまでの間は、アカウントを止めずに監視だけを強めておく。', en: '' }
        minutes: 90
        category: hurt
        points: -100
        refs: [no07-dispatch-law]
        gauges: { damage: 15, flame: 5 }
        coward: true
        items:
          - { id: a02-b-time, points: -10, axis: time, refs: [no07-dispatch-law] }
          - { id: a02-b-record, points: -8, axis: record, refs: [jpcert-handling] }
        explain: { ja: '監視だけを強めても、生きているアカウントからの持ち出しは止まらない。了解を待つ間も被害は進むため、止める判断を遅らせた分だけ不利になる。', en: '' }
    lesson: { ja: '生きている管理者アカウントは、監視ではなく停止で止める。止める前に接続元と操作履歴を控え、同じ権限を持つアカウントの棚卸しまで同じ日に進めるのが基本だ。初期化は証拠を消す行為になる。', en: '' }

  - id: a03-endpoint
    at: { day: 0, minutes: 690 }
    phase: contain
    sound: { se: [notify_chat] }
    text: { ja: '午前11時30分。派遣の保守担当者が使っていたノート端末は、倉庫にしまわれている。電源は抜かれ、メモリ上の記録はもう残っていない。同じフロアには、その人と交替で入っている自分の席もある。', en: '' }
    voices: [v03-field, v03-past, v03-ok]
    choices:
      - id: a03-return
        text: { ja: '初期化はせず、そのまま午後から別の担当者に貸し出して業務に使わせる。', en: '' }
        minutes: 60
        category: hurt
        points: -120
        refs: [jpcert-handling]
        gauges: { damage: 5, trust: -10 }
        items:
          - { id: a03-a-record, points: -20, axis: record, refs: [jpcert-handling] }
          - { id: a03-a-content, points: -12, axis: content, refs: [nist-sp800-61r3] }
          - { id: a03-a-care, points: -8, axis: care, refs: [jpcert-handling] }
        explain: { ja: '初期化しない点だけを見れば悪くないが、証拠になり得る端末を別の担当者に渡すと、記録が汚れて使えなくなる。貸し出す前に保全が要る。', en: '' }
      - id: a03-poweron
        text: { ja: '電源を入れて、いつもの手順どおりに初期化してから倉庫に戻してしまう。', en: '' }
        minutes: 90
        category: fatal
        points: -250
        refs: [nist-sp800-61r3]
        gauges: { damage: 5, trust: -5 }
        setFlags: { destroyedEvidence: true }
        items:
          - { id: a03-b-record, points: -20, axis: record, refs: [nist-sp800-61r3] }
          - { id: a03-b-order, points: -10, axis: order, refs: [jpcert-handling] }
        explain: { ja: '電源を入れるとメモリ上の記録が失われ、初期化でディスクの痕跡も消える。証拠を自分で壊す行為で、後の調査と説明の土台を失う。', en: '' }
      - id: a03-preserve
        text: { ja: '端末は電源を入れずに保全し、ディスクのイメージと取得時刻を記録しておく。', en: '' }
        minutes: 90
        category: maintain
        points: 30
        refs: [nist-sp800-61r3, cissp-cbk-secops]
        gauges: { damage: -5, stamina: -5 }
        items:
          - { id: a03-c-order, points: 8, axis: order, refs: [nist-sp800-61r3] }
          - { id: a03-c-record, points: 8, axis: record, refs: [cissp-cbk-secops] }
          - { id: a03-c-time, points: 5, axis: time, refs: [jpcert-handling] }
        explain: { ja: '電源を入れずに保全し、イメージと取得時刻を残す順序は正しい。ただし書き出しの経路が他にも残っている点までは手が届いていない。', en: '' }
      - id: a03-preserve-plus
        text: { ja: '保全に加え、外部媒体に書き込める端末を一覧にして、書き出しを止めておく。', en: '' }
        minutes: 60
        category: recover
        points: 120
        refs: [no07-ipa-insider, nist-sp800-61r3]
        gauges: { damage: -10, trust: 5, stamina: -10 }
        setFlags: { exportRestricted: true }
        items:
          - { id: a03-d-order, points: 8, axis: order, refs: [no07-ipa-insider] }
          - { id: a03-d-record, points: 8, axis: record, refs: [nist-sp800-61r3] }
          - { id: a03-d-content, points: 5, axis: content, refs: [no07-ipa-insider] }
          - { id: a03-d-time, points: 4, axis: time, refs: [jpcert-handling] }
        explain: { ja: '保全と同時に、書き出せる端末を一覧化して経路そのものを止めており、再発の入口をふさいでいる。証拠を残す順序も崩れていない。', en: '' }
    lesson: { ja: '端末は電源を入れずに保全し、イメージと取得時刻を記録する。初期化や貸し出しは証拠を失う行為になる。保全と並行して、外部媒体に書き出せる端末を洗い出し、経路そのものを止める。', en: '' }

  - id: a04-logs
    at: { day: 0, minutes: 780 }
    phase: organize
    sound: { se: [typing] }
    text: { ja: '午後1時。持ち出しは10年に及ぶ可能性がある。だが管理者権限の監査ログは半年で上書きされ、外部媒体への書き出しの記録は直近の分しか残っていない。残っているのは、ファイルサーバーの更新履歴、入退室の記録、数台の端末のログだけだ。', en: '' }
    voices: [v04-expert, v04-insider, v04-ok]
    notable:
      - { id: note-scale, text: { ja: '持ち出しは10年に及ぶ可能性がある。影響するクライアントは確認済みと調査中に分ける必要がある。', en: '' } }
      - { id: note-audit, text: { ja: '管理者権限の監査ログは半年で上書きされる設定で、10年分は残っていない。', en: '' } }
    choices:
      - id: a04-piece-plus
        text: { ja: '残った記録を突き合わせ、大量の書き出しがあった端末と影響しうる顧客を一覧にする。', en: '' }
        minutes: 60
        category: recover
        points: 120
        refs: [no07-ipa-insider, jpcert-handling]
        gauges: { damage: -10, trust: 10, stamina: -15 }
        detail: log-timeline
        setFlags: { timelineBuilt: true, scopeListed: true }
        items:
          - { id: a04-d-content, points: 6, axis: content, refs: [no07-ipa-insider] }
          - { id: a04-d-record, points: 6, axis: record, refs: [jpcert-handling] }
          - { id: a04-d-order, points: 6, axis: order, refs: [cissp-cbk-secops] }
          - { id: a04-d-care, points: 4, axis: care, refs: [meti-csm-guideline] }
          - { id: a04-d-time, points: 4, axis: time, refs: [jpcert-handling] }
        explain: { ja: '残った記録をつなぎ、影響しうる顧客まで一覧にしている。分かる範囲と不明点を分けたまま範囲を広げており、後の通知と説明の土台になる。', en: '' }
      - id: a04-giveup
        text: { ja: 'ログが残っていないことを理由にして、この時点で調査を打ち切って終わりにしてしまう。', en: '' }
        minutes: 60
        category: hurt
        points: -100
        refs: [jpcert-handling]
        gauges: { damage: 10, trust: -10 }
        coward: true
        items:
          - { id: a04-a-content, points: -10, axis: content, refs: [jpcert-handling] }
          - { id: a04-a-record, points: -8, axis: record, refs: [jpcert-handling] }
        explain: { ja: 'ログが欠けていても、バックアップや入退室の記録は残っている。打ち切ると影響範囲が分からないままになり、通知の判断もできなくなる。', en: '' }
      - id: a04-assume
        text: { ja: 'おそらく夜間の一括書き出しだと断定し、その前提のまま報告書を書き上げてしまう。', en: '' }
        minutes: 90
        category: hurt
        points: -80
        refs: [meti-disclosure-guidance]
        gauges: { flame: 5, trust: -5 }
        items:
          - { id: a04-b-wording, points: -10, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: a04-b-content, points: -8, axis: content, refs: [jpcert-handling] }
        explain: { ja: '推測を断定として報告書に書くと、後で事実が違ったときに説明が崩れる。夜間とは限らない点を確かめずに結論を固定している。', en: '' }
      - id: a04-piece
        text: { ja: 'ログ、バックアップ、入退室の記録と端末の履歴を突き合わせ、分かる範囲と不明点を書き分ける。', en: '' }
        minutes: 240
        category: maintain
        points: 30
        refs: [nist-sp800-61r3, jpcert-handling]
        gauges: { damage: -5, trust: 5, stamina: -15 }
        detail: log-timeline
        setFlags: { timelineBuilt: true }
        items:
          - { id: a04-c-content, points: 6, axis: content, refs: [nist-sp800-61r3] }
          - { id: a04-c-record, points: 6, axis: record, refs: [jpcert-handling] }
          - { id: a04-c-order, points: 4, axis: order, refs: [cissp-cbk-secops] }
          - { id: a04-c-time, points: 4, axis: time, refs: [jpcert-handling] }
        explain: { ja: '複数の記録を突き合わせて整理する方向は正しい。ただし書き出しの多い端末を洗い出すところまで進んでおらず、影響範囲の特定が遅れる。', en: '' }
    lesson: { ja: 'ログが欠けていても、バックアップ、入退室、端末の履歴は残る。突き合わせて分かる範囲と不明点を分け、書き出しの多かった端末から影響しうる顧客を絞る。推測を断定として書かない。', en: '' }

  - id: a05-first-report
    at: { day: 0, minutes: 870 }
    phase: organize
    sound: { se: [typing] }
    text: { ja: '午後2時30分。部長への一次報告をまとめる。分かったこと、まだ分からないこと、次にやることを、A4一枚に収める。明日の朝には、クライアントへの説明が始まる。', en: '' }
    voices: [v05-boss, v05-bold, v05-ok]
    choices:
      - id: a05-verbal
        text: { ja: '口頭で「調査中」とだけ伝え、書面での一次報告は後回しにする。', en: '' }
        minutes: 30
        category: hurt
        points: -80
        refs: [jpcert-handling]
        gauges: { trust: -5 }
        coward: true
        items:
          - { id: a05-a-record, points: -8, axis: record, refs: [jpcert-handling] }
          - { id: a05-a-time, points: -6, axis: time, refs: [jpcert-handling] }
        explain: { ja: '口頭だけで済ませると、誰が何をいつ判断したかが残らない。後から説明を求められたときに、社内の記録が食い違う原因になる。', en: '' }
      - id: a05-report-plus
        text: { ja: '一次報告に加え、経営会議用の一枚と顧客向けの事実整理も用意する。', en: '' }
        minutes: 120
        category: recover
        points: 120
        refs: [jpcert-handling, meti-csm-guideline]
        gauges: { trust: 10, stamina: -10 }
        detail: incident-note
        setFlags: { firstReport: true, clientBrief: true }
        items:
          - { id: a05-d-time, points: 6, axis: time, refs: [jpcert-handling] }
          - { id: a05-d-order, points: 6, axis: order, refs: [meti-csm-guideline] }
          - { id: a05-d-record, points: 6, axis: record, refs: [jpcert-handling] }
          - { id: a05-d-care, points: 4, axis: care, refs: [meti-csm-guideline] }
          - { id: a05-d-content, points: 4, axis: content, refs: [cissp-cbk-secops] }
        explain: { ja: '分かったことと不明点を分けて早く出し、顧客説明の材料まで同時に整えている。社内と外向けの説明が同じ事実に揃う点が強い。', en: '' }
      - id: a05-wait
        text: { ja: '全容が分かってから報告しようと、部長への連絡を先に延ばしてしまう。', en: '' }
        minutes: 120
        category: hurt
        points: -100
        refs: [jpcert-handling, meti-disclosure-guidance]
        gauges: { flame: 10, trust: -10 }
        coward: true
        items:
          - { id: a05-b-time, points: -10, axis: time, refs: [jpcert-handling] }
          - { id: a05-b-record, points: -8, axis: record, refs: [jpcert-handling] }
        explain: { ja: '全容が分かるまで待つと、初動の連絡が遅れて社内の判断も止まる。分からないことを分からないと書けば、早く出しても問題は小さい。', en: '' }
      - id: a05-report
        text: { ja: '30分以内に、分かったこと、不明点、次にやることを分けて一次報告する。', en: '' }
        minutes: 30
        category: maintain
        points: 30
        refs: [jpcert-handling, cissp-cbk-secops]
        gauges: { trust: 5, stamina: -5 }
        detail: incident-note
        setFlags: { firstReport: true }
        items:
          - { id: a05-c-time, points: 6, axis: time, refs: [jpcert-handling] }
          - { id: a05-c-order, points: 6, axis: order, refs: [cissp-cbk-secops] }
          - { id: a05-c-record, points: 4, axis: record, refs: [jpcert-handling] }
          - { id: a05-c-content, points: 4, axis: content, refs: [cissp-cbk-secops] }
        explain: { ja: '短時間で分かったこと、不明点、次の行動を分けて出しており、初動として十分に機能する。顧客向けの材料までは手が回っていない。', en: '' }
    lesson: { ja: '一次報告は全容が分かる前でも出す。分かったこと、不明点、次にやることを分け、期限を切って書く。顧客説明に使える事実整理を同時に用意できると、社内外の説明がぶれない。', en: '' }

  - id: a06-agency
    at: { day: 1, minutes: 540 }
    phase: organize
    sound: { se: [mail_arrive] }
    text: { ja: '午前9時。派遣元の営業担当が来社した。「本人は弊社で処分します。御社は関わらないでください。端末もこちらで回収します」。端末が渡れば、中の記録は自分の手を離れる。', en: '' }
    voices: [v06-vendor, v06-law, v06-ok]
    choices:
      - id: a06-handover
        text: { ja: '端末と記録をそのまま派遣元に渡し、以後の調査はすべて任せる。', en: '' }
        minutes: 45
        category: hurt
        points: -120
        refs: [no07-dispatch-law, meti-trade-secret]
        gauges: { damage: 10, trust: -10 }
        items:
          - { id: a06-a-record, points: -10, axis: record, refs: [meti-trade-secret] }
          - { id: a06-a-order, points: -10, axis: order, refs: [no07-dispatch-law] }
          - { id: a06-a-care, points: -6, axis: care, refs: [jpcert-handling] }
        explain: { ja: '端末を渡すと、中の記録は自社の管理を離れ、後から検証も説明もできなくなる。調査を任せた分だけ、こちらの対応責任もあいまいになる。', en: '' }
      - id: a06-refuse
        text: { ja: '派遣元の担当者を部屋から出し、以後の連絡を一切断ってしまう。', en: '' }
        minutes: 30
        category: hurt
        points: -80
        refs: [no07-dispatch-law]
        gauges: { trust: -5, damage: 5 }
        items:
          - { id: a06-d-order, points: -8, axis: order, refs: [no07-dispatch-law] }
          - { id: a06-d-care, points: -8, axis: care, refs: [meti-csm-guideline] }
        explain: { ja: '連絡を断つと、派遣元と事実の食い違いが生まれ、後で調整する費用が膨らむ。協力を得る窓口を閉じた点が響く。', en: '' }
      - id: a06-joint-police
        text: { ja: '共同確認に加え、証拠の保全手順を文書化し、弁護士に渡す記録の一覧も作る。', en: '' }
        minutes: 150
        category: recover
        points: 120
        refs: [npa-consult, meti-trade-secret, no07-dispatch-law]
        gauges: { trust: 10, stamina: -10 }
        setFlags: { agencyJoint: true, policeReady: true }
        items:
          - { id: a06-c-order, points: 8, axis: order, refs: [no07-dispatch-law] }
          - { id: a06-c-record, points: 8, axis: record, refs: [meti-trade-secret] }
          - { id: a06-c-content, points: 5, axis: content, refs: [npa-consult] }
          - { id: a06-c-care, points: 4, axis: care, refs: [meti-csm-guideline] }
        explain: { ja: '端末を自社で保全したまま共同確認を進め、証拠の手順と渡す記録の一覧まで整えている。後の説明と捜査への協力の両方に耐える。', en: '' }
      - id: a06-joint
        text: { ja: '派遣元と共同で事実確認を進め、端末は自社で保全したまま必要な記録だけを渡す。', en: '' }
        minutes: 120
        category: maintain
        points: 30
        refs: [no07-dispatch-law, meti-trade-secret]
        gauges: { trust: 5, stamina: -5 }
        setFlags: { agencyJoint: true }
        items:
          - { id: a06-b-order, points: 8, axis: order, refs: [no07-dispatch-law] }
          - { id: a06-b-record, points: 8, axis: record, refs: [meti-trade-secret] }
          - { id: a06-b-wording, points: 4, axis: wording, refs: [meti-csm-guideline] }
        explain: { ja: '端末を自社で保全し、渡す記録を絞ったうえで共同確認に応じている。方向は正しいが、証拠の手順を文書で残すところまで届いていない。', en: '' }
    lesson: { ja: '端末は自社の管理下に置いたまま、派遣元とは共同で事実確認を進める。渡す記録は目的と範囲を決め、弁護士を通す。連絡を断つのでも丸ごと渡すのでもなく、手順を文書で残す。', en: '' }

  - id: a07-usb
    at: { day: 1, minutes: 840 }
    phase: investigate
    sound: { se: [notify_chat] }
    text: { ja: '午後2時。同じフロアの別の端末で、私物のUSBメモリへの書き出しが試された記録がある。操作したのは、別の派遣の保守担当者。本人は「昨日、先輩に頼まれた」と言っている。', en: '' }
    voices: [v07-public, v07-past, v07-ok]
    choices:
      - id: a07-fire-all
        text: { ja: '派遣の保守担当者を、確認もそこそこに全員その日のうちに退場させてしまう。', en: '' }
        minutes: 60
        category: hurt
        points: -100
        refs: [no07-dispatch-law, no07-ipa-insider]
        gauges: { trust: -10, stamina: -5 }
        items:
          - { id: a07-a-care, points: -10, axis: care, refs: [no07-dispatch-law] }
          - { id: a07-a-order, points: -8, axis: order, refs: [no07-ipa-insider] }
        explain: { ja: '確認前に全員を退場させると、関与の有無を確かめる機会を失い、必要な協力も得られなくなる。範囲を広げすぎた対応は現場の信頼も削る。', en: '' }
      - id: a07-ignore
        text: { ja: '「頼まれただけ」という説明をそのまま受け取り、注意だけで終わりにしてしまう。', en: '' }
        minutes: 30
        category: hurt
        points: -80
        refs: [no07-ipa-insider]
        gauges: { damage: 10, flame: 5 }
        coward: true
        items:
          - { id: a07-b-content, points: -8, axis: content, refs: [no07-ipa-insider] }
          - { id: a07-b-record, points: -6, axis: record, refs: [jpcert-handling] }
        explain: { ja: '頼まれただけという説明は、関与の否定にも確定にもならない。注意だけで終えると、同じ経路からの書き出しが続く。', en: '' }
      - id: a07-block
        text: { ja: '全端末で外部媒体への書き出しをすぐに止め、例外の申請手順を作って運用に乗せる。', en: '' }
        minutes: 120
        category: maintain
        points: 30
        refs: [no07-ipa-insider]
        gauges: { damage: -10, stamina: -5 }
        setFlags: { exportRestricted: true }
        items:
          - { id: a07-c-order, points: 8, axis: order, refs: [no07-ipa-insider] }
          - { id: a07-c-content, points: 8, axis: content, refs: [no07-ipa-insider] }
          - { id: a07-c-care, points: 4, axis: care, refs: [ipa-sme-guideline] }
        explain: { ja: '書き出しを止めて例外の申請手順まで作るのは有効で、経路はふさがる。ただし誰が何を書き出せるかの把握が抜け、監視が追いつかない。', en: '' }
      - id: a07-block-audit
        text: { ja: '書き出しを止め、誰が何を書き出せるかの一覧を作り、同じ権限の操作を見る。', en: '' }
        minutes: 180
        category: recover
        points: 120
        refs: [no07-ipa-insider, jpcert-handling]
        gauges: { damage: -10, trust: 5, stamina: -10 }
        setFlags: { exportRestricted: true, privilegeReview: true }
        items:
          - { id: a07-d-order, points: 8, axis: order, refs: [no07-ipa-insider] }
          - { id: a07-d-content, points: 8, axis: content, refs: [jpcert-handling] }
          - { id: a07-d-record, points: 6, axis: record, refs: [jpcert-handling] }
          - { id: a07-d-care, points: 4, axis: care, refs: [meti-csm-guideline] }
        explain: { ja: '経路を止めたうえで、権限の一覧と操作の確認まで組み合わせている。被害の拡大を止めながら、関与の確認も同じ流れで進められる。', en: '' }
    lesson: { ja: '外部媒体への書き出しは、まず経路を止める。そのうえで誰が何を書き出せるかの一覧を作り、同じ権限の操作を重点的に見る。人をまとめて排除する前に、事実確認の窓口を残す。', en: '' }

  - id: a08-insider
    at: { day: 2, minutes: 600 }
    phase: investigate
    sound: { se: [notify_chat] }
    text: { ja: '午前10時。別のクライアントからも「うちの名簿が出回っている」と連絡が入った。担当は、最初の一人と一緒に現場へ入ったことのある社員。まだ、何も確認できていない。', en: '' }
    voices: [v08-insider, v08-public, v08-ok]
    choices:
      - id: a08-verify-plus
        text: { ja: '照合に加え、同じ権限の全担当者の操作を横並びで比べ、調査の対象を絞り込む。', en: '' }
        minutes: 210
        category: recover
        points: 120
        refs: [no07-ipa-insider, cissp-cbk-secops]
        gauges: { trust: 10, stamina: -15 }
        setFlags: { othersVerified: true, scopeListed: true }
        items:
          - { id: a08-d-content, points: 8, axis: content, refs: [no07-ipa-insider] }
          - { id: a08-d-record, points: 8, axis: record, refs: [cissp-cbk-secops] }
          - { id: a08-d-order, points: 6, axis: order, refs: [jpcert-handling] }
          - { id: a08-d-care, points: 4, axis: care, refs: [meti-csm-guideline] }
        explain: { ja: '事実の照合に加え、同じ権限の操作を横並びで比べて対象を絞っている。確認できた事実だけを扱う姿勢も保たれ、後の説明が崩れにくい。', en: '' }
      - id: a08-name
        text: { ja: '社内掲示板に「協力者あり」と書き、その社員の名前を出して注意を促す。', en: '' }
        minutes: 30
        category: fatal
        points: -200
        refs: [meti-disclosure-guidance, no07-ipa-insider]
        gauges: { flame: 20, trust: -20 }
        setFlags: { namedSuspect: true }
        items:
          - { id: a08-a-wording, points: -15, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: a08-a-care, points: -12, axis: care, refs: [no07-ipa-insider] }
          - { id: a08-a-record, points: -8, axis: record, refs: [jpcert-handling] }
        explain: { ja: '確認前に名前を出すと、関与が否定された場合に会社側の責任が大きくなる。掲示板での指摘は拡散しやすく、取り消しも効かない。', en: '' }
      - id: a08-accuse
        text: { ja: 'その社員を呼び出して問い詰め、持っている端末をその場で取り上げてしまう。', en: '' }
        minutes: 90
        category: hurt
        points: -100
        refs: [no07-ipa-insider]
        gauges: { trust: -10 }
        items:
          - { id: a08-b-care, points: -10, axis: care, refs: [no07-ipa-insider] }
          - { id: a08-b-record, points: -8, axis: record, refs: [jpcert-handling] }
        explain: { ja: '問い詰めて端末を取り上げると、必要な記録が得られず、後から不当な扱いを問われる。事実の確認より先に処分の形を作っている。', en: '' }
      - id: a08-verify
        text: { ja: '該当アカウントの操作履歴と端末の記録を照合し、確認できた事実だけを報告する。', en: '' }
        minutes: 150
        category: maintain
        points: 30
        refs: [jpcert-handling, no07-ipa-insider]
        gauges: { trust: 5, stamina: -10 }
        setFlags: { othersVerified: true }
        items:
          - { id: a08-c-content, points: 8, axis: content, refs: [jpcert-handling] }
          - { id: a08-c-record, points: 8, axis: record, refs: [no07-ipa-insider] }
          - { id: a08-c-order, points: 4, axis: order, refs: [cissp-cbk-secops] }
        explain: { ja: '操作履歴と端末の記録を照合し、確認できた事実だけを報告する姿勢は正しい。ただし他の担当者との比較がなく、対象の絞り込みが遅れる。', en: '' }
    lesson: { ja: '疑いが向いた段階では、名前を出すのでも問い詰めるのでもなく、記録の照合を先にする。確認できた事実だけを報告し、同じ権限の担当者の操作を横並びで比べて対象を絞り込む。', en: '' }

  - id: a09-rumor
    at: { day: 2, minutes: 900 }
    phase: notify
    sound: { se: [notify_sns] }
    text: { ja: '午後3時。SNSと掲示板に「あのコールセンターから名簿が流出した」と書き込みが広がっている。数字も原因も、こちらの調査結果とは一致しない。広報から「技術的な反論を書いてほしい」と連絡が来た。', en: '' }
    voices: [v09-bold, v09-coward, v09-ok]
    choices:
      - id: a09-personal
        text: { ja: '担当者の個人アカウントから「事実無根だ」と反論を投稿してしまう。', en: '' }
        minutes: 30
        category: hurt
        points: -100
        refs: [meti-disclosure-guidance]
        gauges: { flame: 15, trust: -10 }
        delayed:
          - { afterPhases: 1, points: -30, gauges: { flame: 15 }, reason: { ja: '個人の投稿が特定され、会社の説明と食い違った。', en: '' } }
        items:
          - { id: a09-a-wording, points: -10, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: a09-a-care, points: -8, axis: care, refs: [meti-csm-guideline] }
        explain: { ja: '個人の投稿は会社の説明と切り離せず、食い違えば信頼を損なう。反応した分だけ注目を集め、拡散を止められなくなる。', en: '' }
      - id: a09-facts-window
        text: { ja: '事実整理を渡し、問い合わせ窓口の応答例と訂正の基準も一緒に作る。', en: '' }
        minutes: 150
        category: recover
        points: 120
        refs: [meti-disclosure-guidance, ppc-notify-person]
        gauges: { flame: -10, trust: 10, stamina: -10 }
        setFlags: { rumorFacts: true, inquiryDesk: true }
        items:
          - { id: a09-d-content, points: 8, axis: content, refs: [meti-disclosure-guidance] }
          - { id: a09-d-wording, points: 8, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: a09-d-care, points: 6, axis: care, refs: [ppc-notify-person] }
          - { id: a09-d-order, points: 4, axis: order, refs: [meti-csm-guideline] }
        explain: { ja: '事実と未確認を分けて渡し、応答例と訂正の基準まで用意している。現場が同じ言い方で答えられ、後から説明がぶれにくい。', en: '' }
      - id: a09-silent
        text: { ja: '書き込みには反応せず、広報にも何も渡さずに静かにやり過ごす。', en: '' }
        minutes: 30
        category: hurt
        points: -80
        refs: [meti-disclosure-guidance]
        gauges: { flame: 5, trust: -5 }
        coward: true
        items:
          - { id: a09-b-wording, points: -8, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: a09-b-time, points: -6, axis: time, refs: [jpcert-handling] }
        explain: { ja: '何も出さないと、誤った数字が事実として定着する。広報が説明の材料を持たないまま、問い合わせだけが現場に集まる。', en: '' }
      - id: a09-facts
        text: { ja: '確認できた事実と未確認の点を整理し、広報の公式窓口だけに渡して任せる。', en: '' }
        minutes: 90
        category: maintain
        points: 30
        refs: [jpcert-handling, meti-disclosure-guidance]
        gauges: { flame: -5, trust: 5, stamina: -5 }
        setFlags: { rumorFacts: true }
        items:
          - { id: a09-c-content, points: 8, axis: content, refs: [jpcert-handling] }
          - { id: a09-c-wording, points: 8, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: a09-c-order, points: 4, axis: order, refs: [meti-csm-guideline] }
        explain: { ja: '公式窓口に事実を渡す方向は正しい。ただし応答例や訂正の基準がないため、現場の答えがばらつき、追加の訂正が必要になりやすい。', en: '' }
    lesson: { ja: 'うわさには、事実と未確認を分けた材料を会社の窓口から出す。応答例と訂正を出す基準まで用意すると、現場の答えがそろう。個人の投稿で反論せず、問い合わせの記録様式も決めておく。', en: '' }

  - id: a10-ppc
    at: { day: 2, minutes: 1020 }
    phase: notify
    sound: { se: [clock_tick] }
    text: { ja: '午後5時。法務から「個人情報保護委員会への速報に使う技術的な部分を、今日中に書いてほしい」と依頼が来た。件数はまだ確定していない。材料の期限は明日の午前10時だ。', en: '' }
    voices: [v10-boss, v10-law, v10-ok]
    choices:
      - id: a10-wait
        text: { ja: '件数が確定するまで待ち、速報に使う技術的な材料を出さないでおく。', en: '' }
        minutes: 150
        category: hurt
        points: -150
        refs: [ppc-report-prelim]
        gauges: { flame: 15, trust: -10, damage: 10 }
        coward: true
        items:
          - { id: a10-a-time, points: -12, axis: time, refs: [ppc-report-prelim] }
          - { id: a10-a-record, points: -10, axis: record, refs: [ppc-report-prelim] }
        explain: { ja: '期限のある速報で材料を出さないと、報告そのものが遅れる。件数が固まるのを待つ間に、求められる記載はそろえられる。', en: '' }
      - id: a10-guess
        text: { ja: '「1万人」と概算の数字を断定して書き、そのまま速報の材料にする。', en: '' }
        minutes: 60
        category: hurt
        points: -100
        refs: [ppc-report-prelim, meti-disclosure-guidance]
        gauges: { flame: 5, trust: -10 }
        items:
