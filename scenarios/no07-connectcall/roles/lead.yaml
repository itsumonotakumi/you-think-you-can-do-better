          - { id: p07-b-order, points: 3, axis: order, refs: [jpcert-handling] }
        explain: { ja: '残る記録を調べる方向は正しいが、聴取と媒体の追跡が抜けると、期間の裏づけが弱いまま報告に載る。', en: '' }
    lesson: { ja: 'ログが短くても、調べられる範囲を諦める理由にはならない。残るバックアップ、当時の担当者の記憶、媒体の所在を並行して当たる。分からない期間は不明と書く。直近だけで切ると、後から対象者が増えて説明をやり直すことになる。', en: '' }

