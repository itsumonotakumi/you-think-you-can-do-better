drafts:
  tech-factsheet:
    title: { ja: '技術ファクトシート', en: '' }
    slots:
      - id: confirmed
        label: { ja: '発生と検知の書き方', en: '' }
        options:
          - { id: tf-t-merge, text: { ja: '発生と検知を同じ時期のこととして一つにまとめて書く', en: '' }, points: -8, axis: wording, refs: [jpcert-handling], explain: { ja: 'まとめると検知が遅れた事実が消える。後から時系列を問われたときに説明をやり直すことになる。', en: '' } }
          - { id: tf-t-split, text: { ja: '持ち出しが始まった時期と、判明した日時を分けて書く', en: '' }, points: 5, axis: content, refs: [ppc-report-prelim], explain: { ja: '始まった時期と分かった日時を分けると、検知の遅れも同時に説明できる。訂正が起きにくい書き方になる。', en: '' } }
      - id: scope
        label: { ja: '対象期間', en: '' }
        options:
          - { id: tf-s-recent, text: { ja: '直近の一年を対象として、それ以前の期間には触れずに書く', en: '' }, points: -15, axis: content, refs: [ppc-report-scope], delayed: { afterPhases: 1, points: -20, reason: { ja: '対象の追加連絡が必要になり、説明が二度手間になった。', en: '' } }, explain: { ja: '一年で切ると、古い持ち出しが見つかった時点で対象者の追加連絡が要る。説明が二度手間になり信頼も落ちる。', en: '' } }
          - { id: tf-s-all, text: { ja: '10年にわたり持ち出された可能性を、調査中として明記する', en: '' }, points: 10, axis: content, refs: [ppc-report-scope], explain: { ja: '可能性として全期間を示すと、後から古い持ち出しが出ても説明が崩れない。範囲の広さを先に認めている。', en: '' } }
      - id: leaked
        label: { ja: '持ち出された項目', en: '' }
        options:
          - { id: tf-i-list, text: { ja: '氏名、住所、電話番号、通話履歴を項目ごとに具体的に列挙する', en: '' }, points: 10, axis: content, refs: [ppc-report-prelim], explain: { ja: '項目を具体的に列挙すると、対象者が自分の何が漏れたかを知れる。通知と相談の前提になる。', en: '' } }
          - { id: tf-i-vague, text: { ja: '「顧客情報の一部」とだけぼかして、項目を明示しない', en: '' }, points: -10, axis: content, refs: [ppc-report-prelim], explain: { ja: 'ぼかすと対象者が危険に気づけない。後から項目が判明したとき、公表文の信頼を失うことになる。', en: '' } }
      - id: certainty
        label: { ja: '断定の強さ', en: '' }
        options:
          - { id: tf-c-all, text: { ja: 'すべて「確認」として断定した書き方でそろえる', en: '' }, points: -15, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: 'すべて断定すると、推定だった部分が外れたときに公表文の信頼をまとめて失う。訂正も大きくなる。', en: '' } }
          - { id: tf-c-hide, text: { ja: '不明な点は書かずに削って短くまとめる', en: '' }, points: -10, axis: wording, refs: [ppc-report-prelim], explain: { ja: '不明を削ると、分かっていないことを隠したように見える。後から補う説明が難しくなる書き方になる。', en: '' } }
          - { id: tf-c-split, text: { ja: '「確認」と「可能性」を使い分けて書き分ける', en: '' }, points: 10, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: '確認と可能性を書き分けると、後で事実が動いても訂正で済む。読み手も確度を判断できる。', en: '' } }
      - id: cause
        label: { ja: '原因の書き方', en: '' }
        options:
          - { id: tf-r-vague, text: { ja: '「委託先の不適切な行為」とだけ書いて、原因の特定には触れない', en: '' }, points: -10, axis: content, refs: [jpcert-handling], explain: { ja: '委託先に寄せるだけだと、自社の権限管理の穴が見えなくなる。再発防止の説明が薄いまま終わる。', en: '' } }
          - { id: tf-r-specific, text: { ja: '保守用の管理者アカウントが外部媒体へ書き出した可能性まで書き添える', en: '' }, points: 10, axis: content, refs: [jpcert-handling], explain: { ja: '手段と経路まで書くと、再発防止の対象が明確になる。推定であることも同時に伝えられる書き方になる。', en: '' } }
      - id: agency
        label: { ja: '派遣元への言及', en: '' }
        options:
          - { id: tf-a-joint, text: { ja: '派遣元との共同調査と、責任分界の整理を書き添える', en: '' }, points: 8, axis: order, refs: [no07-dispatch-law], explain: { ja: '共同調査と責任分界を書くと、役割の所在が読む側に伝わる。再発防止の分担も同時に示せる。', en: '' } }
          - { id: tf-a-hide, text: { ja: '派遣元の関与には触れず、伏せたままにしておく', en: '' }, points: -10, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: '関与を伏せると、後から委託先の役割が判明したときに説明をやり直すことになる。信頼も落ちる。', en: '' } }
      - id: evidence
        label: { ja: '証拠保全の記載', en: '' }
        options:
          - { id: tf-e-none, text: { ja: '証拠保全の記載は省き、取得の方法にも一切触れない', en: '' }, points: -8, axis: record, refs: [jpcert-handling], explain: { ja: '保全の記載がないと、証拠の扱いを疑われたときに裏づけを示せない。調査の信用に関わる。', en: '' } }
          - { id: tf-e-hash, text: { ja: '取得したイメージのハッシュ値と保管場所を書く', en: '' }, points: 10, axis: record, refs: [cissp-cbk-secops], explain: { ja: 'ハッシュ値と保管場所を書くと、取得した証拠が改変されていないことを後からでも示せる。', en: '' } }
      - id: loggap
