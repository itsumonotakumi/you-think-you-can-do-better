        setFlags: { auditFixed: true }
        items:
          - { id: p11-c-record, points: 8, axis: record, refs: [no07-ipa-insider] }
          - { id: p11-c-content, points: 5, axis: content, refs: [meti-disclosure-guidance] }
        explain: { ja: '直して欠損を書く対応は正しい。保存期間と改ざん検知まで踏み込めず、再発の余地が残る点が弱い。', en: '' }
      - id: p11-fix-public
        text: { ja: '設定を直して欠損を明記し、保存期間の延長と改ざん検知を期限つきで申請する。', en: '' }
        minutes: 180
        category: recover
        points: 120
        refs: [no07-ipa-insider, meti-csm-guideline]
        gauges: { trust: 15, flame: -10, stamina: -10 }
        setFlags: { auditFixed: true, auditInvest: true }
        items:
          - { id: p11-d-record, points: 10, axis: record, refs: [no07-ipa-insider] }
          - { id: p11-d-content, points: 8, axis: content, refs: [meti-disclosure-guidance] }
          - { id: p11-d-order, points: 8, axis: order, refs: [meti-csm-guideline] }
        explain: { ja: '欠損の明記に加え、保存期間と改ざん検知を費用と期限つきで求めている。対策が仕組みとして残る形になる。', en: '' }
    lesson: { ja: '都合の悪い設定も、報告書に書くから説明が成り立つ。ログの欠損は隠すと後から必ず整合を崩し、隠したこと自体が問われる。直すだけでなく、保存期間と改ざん検知を費用と期限つきで経営に求め、仕組みとして残す。', en: '' }

  - id: p12-field
    at: { day: 4, minutes: 600 }
    phase: investigate
    sound: { se: [notify_chat] }
    text: { ja: '午前10時。対策本部は四日目。情報システム部の三人は寝ていない。受電の現場からは「また研修か」と反発が出ている。交代と社内への説明をどうするか。', en: '' }
    voices: [v12-flattery, v12-public, v12-ok]
    choices:
      - id: p12-shift-log
        text: { ja: '交代制にし、引き継ぎは15分で書面に。記録係を専任にし、話せる範囲も示す。', en: '' }
        minutes: 90
        category: recover
        points: 100
        refs: [ipa-sme-guideline, cissp-cbk-secops]
        gauges: { stamina: 15, trust: 10 }
        setFlags: { shiftWork: true, handoverLog: true }
        items:
          - { id: p12-c-care, points: 8, axis: care, refs: [ipa-sme-guideline] }
          - { id: p12-c-record, points: 10, axis: record, refs: [cissp-cbk-secops] }
          - { id: p12-c-order, points: 5, axis: order, refs: [cissp-cbk-secops] }
        explain: { ja: '交代と記録と説明を同時に整えている。疲労による確認漏れを防ぎ、現場の反発も下げられる。', en: '' }
      - id: p12-shift
        text: { ja: '半日ごとの交代制を敷き、自分も休む。引き継ぎは口頭で短く済ませて回す。', en: '' }
        minutes: 60
        category: maintain
        points: 10
        refs: [ipa-sme-guideline]
        gauges: { stamina: 10, trust: 5 }
        setFlags: { shiftWork: true }
        items:
          - { id: p12-b-care, points: 5, axis: care, refs: [ipa-sme-guideline] }
          - { id: p12-b-record, points: 3, axis: record, refs: [cissp-cbk-secops] }
        explain: { ja: '交代制は妥当だが、引き継ぎが口頭だと抜けが出る。記録係もいないまま回すことになる点が惜しい。', en: '' }
      - id: p12-allnight
        text: { ja: '全員で走り抜く。ここで休むと流れが切れるので、交代は後回しにすることにする。', en: '' }
        minutes: 120
        category: hurt
        points: -60
        refs: [ipa-sme-guideline]
        gauges: { stamina: -20, damage: 10 }
        delayed:
          - { afterPhases: 2, points: -40, gauges: { stamina: -15 }, reason: { ja: '疲労から復旧手順の確認漏れが起き、作業をやり直した。', en: '' } }
        items:
          - { id: p12-a-care, points: -10, axis: care, refs: [ipa-sme-guideline] }
          - { id: p12-a-record, points: -8, axis: record, refs: [jpcert-handling] }
        explain: { ja: '疲労が重なると確認漏れと作業のやり直しが起きる。休まない判断は、速度の面でも結局は損になる。', en: '' }
    lesson: { ja: '長期戦では休むことが進行管理になる。交代制を敷き、引き継ぎを短い書面にし、記録係を決める。現場には話してよい範囲を文書で示す。全員で走り抜く判断は、疲労から確認漏れを起こし、結局やり直しで時間を失う。', en: '' }

  - id: p13-statement
    at: { day: 4, minutes: 900 }
    phase: notify
    sound: { se: [typing] }
    text: { ja: '午後3時。広報が公表文の技術部分のレビューを求めてきた。「原因は委託先の不適切な行為」と書きたいと言う。どこまで技術的に書くか。', en: '' }
    voices: [v13-vendor, v13-bold, v13-ok]
    choices:
      - id: p13-blame
        text: { ja: '「委託先の不適切な行為」とだけ書き、自社の管理不足には触れずに短くまとめる。', en: '' }
        minutes: 60
        category: hurt
        points: -120
        refs: [meti-disclosure-guidance]
        gauges: { flame: 10, trust: -10 }
        items:
          - { id: p13-a-wording, points: -10, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: p13-a-content, points: -10, axis: content, refs: [no07-ipa-insider] }
        explain: { ja: '原因を委託先に寄せると、自社の管理不足が問われた時点で訂正が要る。信頼の回復からは遠い書き方になる。', en: '' }
      - id: p13-own
        text: { ja: '権限の棚卸し、監査ログ、書き出し制限の不備を具体的に書き、防止策も示す。', en: '' }
        minutes: 150
        category: recover
        points: 100
        refs: [no07-ipa-insider, meti-disclosure-guidance]
        gauges: { flame: -10, trust: 15, stamina: -10 }
        setFlags: { admittedOwnGap: true }
        items:
          - { id: p13-c-content, points: 8, axis: content, refs: [no07-ipa-insider] }
          - { id: p13-c-wording, points: 8, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: p13-c-order, points: 5, axis: order, refs: [meti-csm-guideline] }
          - { id: p13-c-care, points: 5, axis: care, refs: [ppc-notify-person] }
        explain: { ja: '自社の不備を具体的に書き、再発防止の時期と担当まで示している。説明責任を果たす形として最も整う。', en: '' }
      - id: p13-facts
        text: { ja: '確認できた事実と調査中の範囲を分けて書き、原因の断定は避けて公表文を整える。', en: '' }
        minutes: 90
        category: maintain
        points: 10
        refs: [meti-disclosure-guidance]
        gauges: { trust: 5, stamina: -5 }
        items:
          - { id: p13-b-content, points: 5, axis: content, refs: [meti-disclosure-guidance] }
          - { id: p13-b-wording, points: 5, axis: wording, refs: [jpcert-handling] }
        explain: { ja: '事実と調査中の区分は適切だが、自社の管理面への言及が薄く、再発防止の中身が見えないまま終わる。', en: '' }
    lesson: { ja: '公表文は責任の押し付け合いではなく、何が起きて何を直すかの説明である。確認できた事実と調査中の範囲を分け、自社の不備も具体的に書く。原因を委託先に寄せるだけの文は、後から事実が出たときに訂正を重ねることになる。', en: '' }

  - id: p14-rebuild
    at: { day: 7, minutes: 600 }
    phase: recover
    sound: { se: [mail_arrive] }
    text: { ja: '午前10時。再開の準備。管理者権限を外した状態で業務が回るか、監視をどこまで強めるか。情報システム部は、既存の環境をそのまま戻したがっている。', en: '' }
    voices: [v14-vendor, v14-coward, v14-ok]
    choices:
      - id: p14-restart
        text: { ja: '既存の環境をそのまま再起動して戻し、止めていた時間を取り戻すことを優先する。', en: '' }
        minutes: 180
        category: hurt
        points: -150
        refs: [nist-sp800-61r3]
        gauges: { damage: 20, trust: -10 }
        setFlags: { dirtyResume: true }
        delayed:
          - { afterPhases: 1, points: -60, gauges: { damage: 15 }, reason: { ja: '再開後に、同じ権限の別の担当者が外部媒体へ書き出そうとした。', en: '' } }
        items:
          - { id: p14-a-content, points: -10, axis: content, refs: [nist-sp800-61r3] }
          - { id: p14-a-care, points: -10, axis: care, refs: [meti-csm-guideline] }
        explain: { ja: '既存の環境には同じ抜けが残る。再開後に同じ書き出しが起き、止めていた時間がそのまま無駄になる。', en: '' }
      - id: p14-rebuild
        text: { ja: '新規に構築し、バックアップから戻して稼働を再開させる。検証は追って行う。', en: '' }
        minutes: 300
        category: maintain
        points: 10
        refs: [nist-sp800-61r3]
        gauges: { damage: -10, stamina: -15 }
        detail: recovery-plan
        setFlags: { cleanRebuild: true }
        items:
          - { id: p14-b-content, points: 5, axis: content, refs: [nist-sp800-61r3] }
          - { id: p14-b-record, points: 3, axis: record, refs: [cissp-cbk-secops] }
        explain: { ja: '新規構築の判断は正しいが、検証を後回しにすると資格情報と媒体の制御が残ったまま再開する。', en: '' }
      - id: p14-rebuild-verify
        text: { ja: '新規構築に加え、復元テスト、資格情報の全失効、媒体の制御の検証までして戻す。', en: '' }
        minutes: 420
        category: recover
        points: 120
        refs: [nist-sp800-61r3, cissp-cbk-secops]
        gauges: { damage: -20, trust: 10, stamina: -20 }
        detail: recovery-plan
        setFlags: { cleanRebuild: true, credentialsRotated: true }
        items:
          - { id: p14-c-content, points: 8, axis: content, refs: [nist-sp800-61r3] }
          - { id: p14-c-record, points: 8, axis: record, refs: [cissp-cbk-secops] }
          - { id: p14-c-order, points: 8, axis: order, refs: [no07-ipa-insider] }
        explain: { ja: '復元テストと資格情報の失効と媒体の制御まで確かめてから戻している。再発の入口を塞いだうえで再開できる。', en: '' }
    lesson: { ja: '再開は復旧ではなく、安全に戻せたことの確認である。新規に構築し、復元テスト、資格情報の全失効、外部媒体の制御の検証を終えてから戻す。既存の環境をそのまま再起動する判断は、同じ抜けを残したまま業務を再開させる。', en: '' }

  - id: p15-resume
    at: { day: 10, minutes: 600 }
    phase: recover
    sound: { se: [notify_sns] }
    text: { ja: '午前10時。段階再開の初日。権限を絞ったことで、現場の処理時間は1.5倍になった。クライアントからは「いつ元に戻るのか」と聞かれている。', en: '' }
    voices: [v15-public, v15-ops, v15-ok]
    choices:
      - id: p15-full
        text: { ja: '全センターを全面再開し、権限も元に戻して、処理時間を以前の水準まで完全に取り戻す。', en: '' }
        minutes: 120
        category: hurt
        points: -150
        refs: [no07-ipa-insider, nist-sp800-61r3]
        gauges: { damage: 15, flame: 10, trust: -10 }
        setFlags: { rushedResume: true }
        delayed:
          - { afterPhases: 1, points: -60, gauges: { damage: 15 }, reason: { ja: '権限を戻した直後に、同じ方法の書き出しが再び見つかった。', en: '' } }
        items:
          - { id: p15-a-order, points: -10, axis: order, refs: [no07-ipa-insider] }
          - { id: p15-a-record, points: -10, axis: record, refs: [nist-sp800-61r3] }
          - { id: p15-a-care, points: -5, axis: care, refs: [meti-csm-guideline] }
        explain: { ja: '権限を戻した直後に同じ手口が出る危険が高い。処理時間を優先すると、再発の入口を自分で開けることになる。', en: '' }
      - id: p15-step
        text: { ja: '絞った権限のまま段階的に再開し、監視を強化した状態で影響を見ながら範囲を広げる。', en: '' }
        minutes: 150
        category: maintain
        points: 10
        refs: [no07-ipa-insider, nist-sp800-61r3]
        gauges: { damage: -5, trust: 5 }
        setFlags: { gatedResume: true }
        items:
          - { id: p15-b-order, points: 5, axis: order, refs: [nist-sp800-61r3] }
          - { id: p15-b-record, points: 3, axis: record, refs: [no07-ipa-insider] }
        explain: { ja: '段階再開と監視強化は妥当だが、戻す条件が数字で決まっておらず、判断が感覚に寄る点が弱い。', en: '' }
      - id: p15-step-eval
        text: { ja: '段階再開を続け、処理時間の影響を測って共有する。戻す条件は数字で決める。', en: '' }
        minutes: 210
        category: recover
        points: 120
        refs: [no07-ipa-insider, meti-csm-guideline]
        gauges: { damage: -10, trust: 15, stamina: -15 }
        setFlags: { gatedResume: true, resumeCriteria: true }
        items:
          - { id: p15-c-order, points: 8, axis: order, refs: [no07-ipa-insider] }
          - { id: p15-c-record, points: 8, axis: record, refs: [nist-sp800-61r3] }
          - { id: p15-c-care, points: 8, axis: care, refs: [meti-csm-guideline] }
          - { id: p15-c-content, points: 5, axis: content, refs: [cissp-cbk-secops] }
        explain: { ja: '影響を測って共有し、戻す条件を数字で決め第三者に検証させている。段階再開の根拠を外にも説明できる。', en: '' }
    lesson: { ja: '再開は段階的に広げ、戻す条件を先に数字で決める。処理時間の影響を測ってクライアントと共有し、第三者の検証も公開する。全面再開して権限を戻す判断は、同じ手口が再び見つかったときに、止めた時間を無駄にする。', en: '' }

  - id: p16-monitor
    at: { day: 14, minutes: 600 }
    phase: recover
    sound: { se: [notify_sns] }
    text: { ja: '午前10時。名簿を使った電話が、クライアントの顧客に届き始めた。フィッシングらしい連絡も出ている。二次被害の監視と注意喚起をどう設計するか。', en: '' }
    voices: [v16-vendor, v16-coward, v16-ok]
    choices:
      - id: p16-none
        text: { ja: '二次被害はクライアントの責任として、自社では監視も注意喚起も行わない方針にする。', en: '' }
        minutes: 60
        category: hurt
        points: -120
        refs: [ppc-notify-person]
        gauges: { flame: 15, trust: -15 }
        items:
          - { id: p16-a-care, points: -10, axis: care, refs: [ppc-notify-person] }
          - { id: p16-a-care2, points: -10, axis: care, refs: [meti-csm-guideline] }
        explain: { ja: '名簿が流出した元としての説明責任が残る。放置は被害の拡大を見落とし、信頼の回復も遠ざける。', en: '' }
      - id: p16-watch-guide
        text: { ja: '監視に加え、顧客向けの注意喚起をクライアントと共同で出す。見分け方も書く。', en: '' }
        minutes: 180
        category: recover
        points: 120
        refs: [ppc-notify-person, meti-csm-guideline]
        gauges: { flame: -10, trust: 15, stamina: -10 }
        setFlags: { secondWaveWatch: true, victimGuide: true }
        items:
          - { id: p16-c-care, points: 8, axis: care, refs: [ppc-notify-person] }
          - { id: p16-c-care2, points: 8, axis: care, refs: [meti-csm-guideline] }
          - { id: p16-c-content, points: 5, axis: content, refs: [jpcert-handling] }
          - { id: p16-c-wording, points: 5, axis: wording, refs: [meti-disclosure-guidance] }
        explain: { ja: '監視と注意喚起を共同で行い、見分け方と相談窓口まで書いている。被害者の手元に届く形になっている。', en: '' }
      - id: p16-watch
        text: { ja: '問い合わせの傾向を集計し、クライアントと共有して二次被害の広がりを把握する。', en: '' }
        minutes: 120
        category: maintain
        points: 10
        refs: [ppc-notify-person, jpcert-handling]
        gauges: { trust: 5, stamina: -10 }
        setFlags: { secondWaveWatch: true }
        items:
          - { id: p16-b-care, points: 5, axis: care, refs: [ppc-notify-person] }
          - { id: p16-b-content, points: 5, axis: content, refs: [jpcert-handling] }
        explain: { ja: '傾向の集計は有効だが、顧客に届く注意喚起がないと、偽の電話や郵便を止められないまま広がる。', en: '' }
    lesson: { ja: '二次被害は放置すると広がり、止める手段は注意喚起しかないことが多い。問い合わせの傾向を集計して共有し、偽の電話や郵便の見分け方と相談窓口を具体的に示す。クライアントの責任として切り離すと、被害者の支援も説明も失う。', en: '' }

  - id: p17-final
    at: { day: 20, minutes: 600 }
    phase: recover
    sound: { se: [clock_tick] }
    text: { ja: '午前10時。確報を出せる状態になった。期限はまだ先だが、対象者数はまだ動いている。どう出すか。', en: '' }
    voices: [v17-law, v17-boss, v17-ok]
    choices:
      - id: p17-file-plan
        text: { ja: '確報を出し、更新の予定と通知体制を添えて、数字が動く前提を示す。', en: '' }
        minutes: 240
        category: recover
        points: 100
        refs: [ppc-report-final-malicious, ppc-notify-person]
        gauges: { trust: 10, stamina: -15 }
        setFlags: { ppcFinalFiled: true, finalWithPlan: true }
        items:
          - { id: p17-c-content, points: 8, axis: content, refs: [ppc-report-final-malicious] }
          - { id: p17-c-care, points: 8, axis: care, refs: [ppc-notify-person] }
          - { id: p17-c-time, points: 5, axis: time, refs: [ppc-report-final-malicious] }
        explain: { ja: '確報に更新の予定と通知体制を添えている。数字が動いても説明の筋を保てる形になり、対象者も動ける。', en: '' }
      - id: p17-file
        text: { ja: '分かっている範囲で確報を出し、件数が動く可能性を注記して提出する形にする。', en: '' }
        minutes: 180
        category: maintain
        points: 10
        refs: [ppc-report-final-malicious]
        gauges: { trust: 5, stamina: -10 }
        setFlags: { ppcFinalFiled: true }
        items:
          - { id: p17-b-time, points: 5, axis: time, refs: [ppc-report-final-malicious] }
          - { id: p17-b-content, points: 5, axis: content, refs: [ppc-report-final-malicious] }
          - { id: p17-b-record, points: 3, axis: record, refs: [jpcert-handling] }
        explain: { ja: '早く出す判断は正しいが、件数が動いた後の更新と通知の見通しがなく、説明が途中で途切れる。', en: '' }
      - id: p17-wait
        text: { ja: '件数が完全に確定するまで待ち、確定してから確報を出すことにして期限を延ばす。', en: '' }
        minutes: 120
        category: hurt
        points: -120
        refs: [ppc-report-final-malicious]
        gauges: { flame: 10, trust: -10 }
        coward: true
        setFlags: { finalDelayed: true }
        items:
          - { id: p17-a-time, points: -10, axis: time, refs: [ppc-report-final-malicious] }
          - { id: p17-a-record, points: -10, axis: record, refs: [ppc-report-final-malicious] }
        explain: { ja: '確定を待つと期限を過ぎる。件数が動くこと自体を前提にできない判断で、制度上の不利も残る。', en: '' }
    lesson: { ja: '確報も、確定を待って出すものではない。その時点で分かる範囲を出し、件数が動く可能性と更新の予定を添える。対象者への通知体制まで書いておけば、後から数字が変わっても説明の筋を保てる。確定待ちは期限を過ぎるだけになる。', en: '' }

  - id: p18-fix
    at: { day: 26, minutes: 600 }
    phase: after
    sound: { se: [mail_arrive] }
