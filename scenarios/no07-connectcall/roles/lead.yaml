          - { id: p07-c-order, points: 5, axis: order, refs: [nist-sp800-61r3] }
          - { id: p07-c-care, points: 5, axis: care, refs: [ppc-report-scope] }
        explain: { ja: '記録と人の記憶と媒体を同時に押さえている。分からない期間を不明と明記する前提も整い、範囲の説明が崩れにくい。', en: '' }
