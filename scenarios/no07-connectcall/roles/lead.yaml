# No.7 コネクトコール / セキュリティ部門長（CSIRTリーダー）ロール
# 判断ポイント20、細目は choices[].items と drafts の合計で80以上。
# 視点: 専任のセキュリティ部署がない会社で、情報システム部の兼任として対応を組み立てる部門長。
#       技術の事実を経営の言葉に訳し、証拠の保全と復旧の両立を判断する。
estimateMinutes: 45
intro: { ja: 'あなたはコネクトコール情報システム部のセキュリティ責任者で、CSIRTのリーダーを兼ねる。専任のセキュリティ部署はない。情報システム部長の下で、外部の相談先と現場の兼任メンバーを束ね、技術の事実を経営の言葉に訳す。午前10時の一本の電話から、あなたの一か月が始まる。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-ppc-prelim
    ref: ppc-report-prelim
    label: { ja: '個人情報保護委員会への速報', en: '' }
    points: -150
    doneFlag: ppcPrelimFiled
  - id: dl-ppc-final
    ref: ppc-report-final-malicious
    label: { ja: '個人情報保護委員会への確報', en: '' }
    points: -100
    doneFlag: ppcFinalFiled
events:
  - id: ev-lead-night
    at: { day: 1, minutes: 120 }
    voices: [v-ev-night]
    gauges: { stamina: -5 }
    caption: { ja: '情報システム部の三人が、交代も決めずに夜通し作業を続けている。', en: '' }
  - id: ev-lead-news
    at: { day: 2, minutes: 420 }
    voices: [v-ev-news]
    gauges: { flame: 5 }
    sound: { se: [notify_news] }
    caption: { ja: '朝のニュースが「コールセンターで顧客名簿の流出か」と報じた。', en: '' }
  - id: ev-lead-client
    at: { day: 8, minutes: 600 }
    voices: [v-ev-client]
    gauges: { flame: 5 }
    sound: { se: [phone_ring] }
    caption: { ja: 'クライアントの担当者から「うちの顧客に不審な電話が来ている」と連絡が入る。', en: '' }
points:
  - id: p01-call
    at: { day: 0, minutes: 600 }
    phase: detect
    sound: { se: [phone_ring] }
    text: { ja: '午前10時。主要クライアントの担当者から電話が入る。「うちの顧客名簿が外部で使われている。御社のセンターからではないか」。相手は名簿の項目まで具体的に話している。', en: '' }
    voices: [v01-boss, v01-public, v01-ok]
    notable:
      - { id: note-first-call, text: { ja: '午前10時、クライアントから名簿の外部利用を指摘された。項目まで具体的だった。', en: '' } }
    choices:
      - id: p01-stop-preserve
        text: { ja: '該当アカウントを止めて端末と媒体を保全し、履歴を確認し30分で経営に第一報を入れる。', en: '' }
        minutes: 90
        category: recover
        points: 100
        refs: [jpcert-handling, no07-ipa-insider]
        gauges: { trust: 10, stamina: -10 }
        setFlags: { startedInvestigation: true, ownerStopped: true }
        items:
          - { id: p01-c-time, points: 5, axis: time, refs: [jpcert-handling] }
          - { id: p01-c-order, points: 8, axis: order, refs: [jpcert-handling] }
          - { id: p01-c-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: p01-c-care, points: 5, axis: care, refs: [meti-csm-guideline] }
        explain: { ja: '停止と保全を先に行い、経営への第一報まで同じ時間に済ませている。証拠を残しながら被害の拡大を止める順序として筋が通る。', en: '' }
      - id: p01-check
        text: { ja: '該当アカウントの利用履歴と接続元の記録を、その場で時間をかけて確認してから次の手を決める。', en: '' }
        minutes: 60
        category: maintain
        points: 10
        refs: [jpcert-handling]
        gauges: { trust: 5, stamina: -5 }
        items:
          - { id: p01-b-time, points: 3, axis: time, refs: [jpcert-handling] }
          - { id: p01-b-order, points: 3, axis: order, refs: [jpcert-handling] }
          - { id: p01-b-record, points: 3, axis: record, refs: [jpcert-handling] }
        explain: { ja: '履歴の確認は必要だが、止める判断と保全が後手になる。確認している間も書き出しは続きうる点が響く。', en: '' }
      - id: p01-later
        text: { ja: '誤解だとして今日は調査に入らず、明日の営業時間に担当者を集めてから動き出すことにする。', en: '' }
        minutes: 60
        category: hurt
        points: -110
        refs: [meti-disclosure-guidance]
        gauges: { flame: 10, trust: -10 }
        coward: true
        items:
          - { id: p01-a-time, points: -10, axis: time, refs: [meti-disclosure-guidance] }
          - { id: p01-a-wording, points: -8, axis: wording, refs: [meti-disclosure-guidance] }
        explain: { ja: '誤解だと言い切る根拠がなく、初動が一日遅れる。その間に被害の拡大と証拠の散逸が進む対応になる。', en: '' }
    lesson: { ja: '最初の電話は事実の断定ではなく、確認の起点として扱う。止める、残す、報せるの三つを同じ日のうちに着手できるかで、その後の説明責任の重さが変わる。相手の話を否定して時間を空けると、被害も記録も失われやすい。', en: '' }

  - id: p02-evidence
    at: { day: 0, minutes: 750 }
    phase: contain
    sound: { se: [notify_chat] }
    text: { ja: '午後0時半。派遣の保守担当者の端末が事務所に残っていた。現場からは「早く初期化して次の人に渡したい」と声が上がる。夜間に外部媒体へ書き出した形跡が、ログに残っている。', en: '' }
    voices: [v02-field, v02-expert, v02-ok]
    notable:
      - { id: note-device, text: { ja: '保守担当者の端末と外部媒体が残っており、夜間の書き出しの形跡があった。', en: '' } }
    choices:
      - id: p02-wipe
        text: { ja: '端末を初期化して次の担当者に渡し、作業環境を早く整えて業務の遅れを取り戻す。', en: '' }
        minutes: 90
        category: fatal
        points: -250
        refs: [jpcert-handling, nist-sp800-61r3]
        gauges: { damage: 15, trust: -15 }
        setFlags: { destroyedEvidence: true }
        delayed:
          - { afterPhases: 2, points: -80, gauges: { damage: 10, trust: -15 }, reason: { ja: '初期化で、持ち出しの経路と期間を裏付ける記録が失われた。', en: '' } }
        items:
          - { id: p02-a-record, points: -20, axis: record, refs: [jpcert-handling] }
          - { id: p02-a-content, points: -15, axis: content, refs: [nist-sp800-61r3] }
          - { id: p02-a-order, points: -10, axis: order, refs: [cissp-cbk-secops] }
        explain: { ja: '初期化は持ち出しの経路と期間を裏付ける記録を消す。復旧の速さと引き換えに説明の土台を失う最悪の一手になる。', en: '' }
      - id: p02-off
        text: { ja: '電源を切ったまま保管し、詳しい調査は状況が落ち着いてから着手することにする。', en: '' }
        minutes: 45
        category: hurt
        points: -90
        refs: [nist-sp800-61r3]
        gauges: { damage: 5, stamina: 5 }
        items:
          - { id: p02-b-record, points: -10, axis: record, refs: [nist-sp800-61r3] }
          - { id: p02-b-time, points: -8, axis: time, refs: [jpcert-handling] }
        explain: { ja: '電源を切って置くだけでは媒体の内容も接続記録も残らない。復旧を優先した結果、原因の追跡が難しくなる。', en: '' }
      - id: p02-image
        text: { ja: 'ディスクのイメージを取得し、ハッシュ値と保管場所を記録してから端末を隔離する。', en: '' }
        minutes: 90
        category: maintain
        points: 10
        refs: [nist-sp800-61r3, jpcert-handling]
        gauges: { damage: -10, stamina: -15, trust: 5 }
        setFlags: { evidencePreserved: true }
        items:
          - { id: p02-c-record, points: 8, axis: record, refs: [nist-sp800-61r3] }
          - { id: p02-c-order, points: 5, axis: order, refs: [cissp-cbk-secops] }
          - { id: p02-c-time, points: 3, axis: time, refs: [jpcert-handling] }
        explain: { ja: 'イメージ取得とハッシュの記録は適切だが、外部媒体と接続記録が抜けると経路の証明が片手落ちになる。', en: '' }
      - id: p02-chain
        text: { ja: 'イメージと外部媒体と接続記録を同じ手順で保全し、担当と時刻を連鎖で残す。', en: '' }
        minutes: 150
        category: maintain
        points: 30
        refs: [nist-sp800-61r3, cissp-cbk-secops]
        gauges: { damage: -10, stamina: -20, trust: 5 }
        setFlags: { evidencePreserved: true, evidenceChain: true }
        items:
          - { id: p02-d-record, points: 10, axis: record, refs: [cissp-cbk-secops] }
          - { id: p02-d-content, points: 8, axis: content, refs: [nist-sp800-61r3] }
          - { id: p02-d-order, points: 8, axis: order, refs: [nist-sp800-61r3] }
          - { id: p02-d-time, points: 5, axis: time, refs: [jpcert-handling] }
        explain: { ja: '端末と媒体と記録を同じ手順で押さえ、担当と時刻まで残している。後から第三者に説明できる形になっている点が強い。', en: '' }
    lesson: { ja: '証拠は消してからでは戻らない。端末を初期化する前に、何を残すかを決めて手順と担当と時刻を記録する。目の前の業務を回したいという現場の声はもっともだが、復旧の速さを優先した初期化は、原因も範囲も言えなくする。', en: '' }

  - id: p03-scope
    at: { day: 0, minutes: 900 }
    phase: contain
    sound: { se: [notify_chat] }
    text: { ja: '午後3時。同じ管理者権限を持つ担当者は、派遣と自社を合わせて十数名いる。外部媒体への書き出しの制限も、まだかけていない。どこまで止めるか。', en: '' }
    voices: [v03-ops, v03-public, v03-ok]
    choices:
      - id: p03-one
        text: { ja: '本人のアカウントだけを止め、ほかの同権限の担当者は様子を見ながら通常どおり業務を続ける。', en: '' }
        minutes: 60
        category: hurt
        points: -110
        refs: [no07-ipa-insider]
        gauges: { damage: 10, flame: 5, trust: -5 }
        coward: true
        setFlags: { scopeNarrow: true }
        delayed:
          - { afterPhases: 1, points: -50, gauges: { damage: 10 }, reason: { ja: '止めなかった同権限の担当者が、同じ方法で外部媒体へ書き出していた。', en: '' } }
        items:
          - { id: p03-a-order, points: -10, axis: order, refs: [no07-ipa-insider] }
          - { id: p03-a-content, points: -10, axis: content, refs: [no07-ipa-insider] }
        explain: { ja: '止める範囲を本人に限ると、同じ権限の経路が開いたままになる。遅れて同じ手口が見つかる典型の判断。', en: '' }
      - id: p03-all-export
        text: { ja: '全アカウントを止め、外部媒体への書き出しを全社で禁止する。権限の棚卸しも当日に始める。', en: '' }
        minutes: 150
        category: recover
        points: 120
        refs: [no07-ipa-insider]
        gauges: { damage: -15, trust: 10, stamina: -15 }
        setFlags: { scopeStopped: true, exportBlocked: true }
        items:
          - { id: p03-c-order, points: 8, axis: order, refs: [no07-ipa-insider] }
          - { id: p03-c-content, points: 8, axis: content, refs: [no07-ipa-insider] }
          - { id: p03-c-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: p03-c-care, points: 5, axis: care, refs: [meti-csm-guideline] }
        explain: { ja: '止める範囲と書き出しの禁止を同時に押さえ、権限の棚卸しまで同じ日に始めている。再発の入口を塞ぐ順序として良い。', en: '' }
      - id: p03-all
        text: { ja: '同じ権限を持つ全アカウントを止め、業務は別の担当に切り替えて受電の水準を保つ。', en: '' }
        minutes: 90
        category: maintain
        points: 10
        refs: [no07-ipa-insider, jpcert-handling]
        gauges: { damage: -10, stamina: -10, trust: 5 }
        setFlags: { scopeStopped: true }
        items:
          - { id: p03-b-order, points: 5, axis: order, refs: [no07-ipa-insider] }
          - { id: p03-b-time, points: 3, axis: time, refs: [jpcert-handling] }
          - { id: p03-b-record, points: 3, axis: record, refs: [jpcert-handling] }
        explain: { ja: '全アカウントの停止は妥当だが、書き出しの禁止と権限の棚卸しが後回しになり、再び書き出せる入口が残る。', en: '' }
    lesson: { ja: '権限は人ではなく経路で見る。同じ管理者権限が複数人に開いているなら、止める範囲も同じ広さで考える。本人だけを止めて様子を見る判断は、止めなかった経路から同じことが起きる前提を欠いている。', en: '' }

  - id: p04-escalate
    at: { day: 1, minutes: 540 }
    phase: organize
    sound: { se: [phone_ring] }
    text: { ja: '午前9時。経営会議の前。社長は影響の大きさと、いま決めてほしいことを知りたがっている。技術の報告をどう作るか。', en: '' }
    voices: [v04-boss, v04-flattery, v04-ok]
    choices:
      - id: p04-late
        text: { ja: '影響が出てから上申することにして、いまは調査の作業量を優先して手を動かす。', en: '' }
        minutes: 60
        category: hurt
        points: -120
        refs: [meti-csm-guideline]
        gauges: { flame: 10, trust: -10 }
        coward: true
        setFlags: { lateEscalation: true }
        delayed:
          - { afterPhases: 1, points: -50, gauges: { damage: 10, trust: -10 }, reason: { ja: '経営の決裁が遅れ、全アカウント停止の判断が四時間ずれた。', en: '' } }
        items:
          - { id: p04-a-order, points: -10, axis: order, refs: [meti-csm-guideline] }
          - { id: p04-a-time, points: -10, axis: time, refs: [meti-csm-guideline] }
        explain: { ja: '経営の判断が要る場面で材料を渡さないと、止める範囲の決裁が遅れる。その遅れはそのまま被害の拡大になる。', en: '' }
      - id: p04-dump
        text: { ja: '調査のログをそのまま貼り付けて送り、読めば分かるはずだとして説明は省く。', en: '' }
        minutes: 45
        category: hurt
        points: -60
        refs: [meti-csm-guideline]
        gauges: { trust: -5 }
        items:
          - { id: p04-b-order, points: -8, axis: order, refs: [meti-csm-guideline] }
          - { id: p04-b-wording, points: -8, axis: wording, refs: [meti-csm-guideline] }
        explain: { ja: '生のログは経営には読めない。判断に必要な論点が埋もれ、結局こちらへ差し戻されて時間を失う。', en: '' }
      - id: p04-one-pager
        text: { ja: '分かった事実と不明な点、決めてほしいことを一枚に分けて経営会議の前に上申する。', en: '' }
        minutes: 45
        category: maintain
        points: 10
        refs: [meti-csm-guideline, jpcert-handling]
        gauges: { trust: 5, stamina: -5 }
        setFlags: { escalated: true }
        items:
          - { id: p04-c-order, points: 5, axis: order, refs: [meti-csm-guideline] }
          - { id: p04-c-wording, points: 5, axis: wording, refs: [meti-csm-guideline] }
          - { id: p04-c-record, points: 3, axis: record, refs: [jpcert-handling] }
        explain: { ja: '事実と不明と判断事項を分けた整理は適切だが、選択肢ごとの影響が見えないと決裁は止まりやすい。', en: '' }
      - id: p04-options
        text: { ja: '一枚の上申に、止める範囲ごとの顧客影響と復旧時間の見積もりを添える。', en: '' }
        minutes: 75
        category: recover
        points: 100
        refs: [meti-csm-guideline]
        gauges: { trust: 10, stamina: -10 }
        setFlags: { escalated: true, optionsPrepared: true }
        items:
          - { id: p04-d-order, points: 8, axis: order, refs: [meti-csm-guideline] }
          - { id: p04-d-content, points: 8, axis: content, refs: [nist-sp800-61r3] }
          - { id: p04-d-care, points: 5, axis: care, refs: [meti-csm-guideline] }
        explain: { ja: '判断事項に加えて選択肢と顧客影響と復旧時間を添えており、経営がその場で決められる。上申の形として理想的。', en: '' }
    lesson: { ja: '経営に求められているのは技術の詳細ではなく、決めるための材料である。分かったこと、分からないこと、決めてほしいことを分け、選択肢ごとの顧客影響と復旧時間を示す。影響が出てから報せる判断は、決裁の遅れをそのまま被害にする。', en: '' }

  - id: p05-team
    at: { day: 1, minutes: 720 }
    phase: organize
    sound: { se: [notify_chat] }
    text: { ja: '午後0時。対策本部を立ち上げる。専任のセキュリティ部署はない。情報システム部の三人と、法務・広報・人事の兼任で回すしかない。誰が何を持ち、どこに相談するか。', en: '' }
    voices: [v05-flattery, v05-vendor, v05-ok]
    choices:
      - id: p05-solo
        text: { ja: '自分が指揮も調査も外部連絡も持つ。人数が少ないぶん、そのほうが速いという判断でまとめる。', en: '' }
        minutes: 60
        category: hurt
        points: -80
        refs: [cissp-cbk-secops]
        gauges: { stamina: -15, trust: -5 }
        items:
          - { id: p05-a-order, points: -10, axis: order, refs: [cissp-cbk-secops] }
          - { id: p05-a-care, points: -8, axis: care, refs: [cissp-cbk-secops] }
        explain: { ja: '一人に集めると速度は出るが、記録と外部連絡が止まる。疲労で判断の質も落ち、属人化がそのまま残る。', en: '' }
      - id: p05-roles
        text: { ja: '指揮、調査、記録、外部連絡、経営窓口を分け、当番表を作って回す形に整える。', en: '' }
        minutes: 60
        category: maintain
        points: 10
        refs: [cissp-cbk-secops, jpcert-handling]
        gauges: { stamina: 5, trust: 5 }
        setFlags: { commandStructure: true }
        items:
          - { id: p05-b-order, points: 8, axis: order, refs: [cissp-cbk-secops] }
          - { id: p05-b-record, points: 5, axis: record, refs: [jpcert-handling] }
        explain: { ja: '役割を分けて当番表を作るのは基本として正しい。ただし外部の相談先が決まっておらず、初動で迷う。', en: '' }
      - id: p05-roles-external
        text: { ja: '役割分担に加え、外部の相談先への連絡順を決め、窓口と番号を一枚にまとめて共有する。', en: '' }
        minutes: 90
        category: recover
        points: 100
        refs: [cissp-cbk-secops, meti-csm-guideline]
        gauges: { stamina: 5, trust: 10 }
        setFlags: { commandStructure: true, externalContacts: true }
        items:
          - { id: p05-c-order, points: 10, axis: order, refs: [cissp-cbk-secops] }
          - { id: p05-c-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: p05-c-care, points: 8, axis: care, refs: [ipa-sme-guideline] }
        explain: { ja: '分担と当番に加え、外部の相談先と連絡順まで一枚にしている。初動で誰に電話するか迷わずに済む。', en: '' }
    lesson: { ja: '専任の部署がない組織ほど、役割と順番を先に決める。指揮、調査、記録、外部連絡、経営窓口を分け、外部の相談先と連絡順を一枚にする。全部を自分で持つ判断は速く見えて、記録と外部連絡が最初に落ちる。', en: '' }

  - id: p06-agency
    at: { day: 1, minutes: 900 }
    phase: organize
