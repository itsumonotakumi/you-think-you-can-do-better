          - { id: tf-w-none, text: { ja: '技術窓口は設けず、連絡先もどこにも書かない', en: '' }, points: -15, axis: care, refs: [meti-csm-guideline], explain: { ja: '窓口がないと、顧客はどこに連絡すればよいか分からない。窓口の不在は不信につながる。', en: '' } }
          - { id: tf-w-hours, text: { ja: '専用窓口の番号と受付時間、増員の体制を書く', en: '' }, points: 8, axis: care, refs: [meti-csm-guideline], explain: { ja: '番号と受付時間と増員の体制まで書くと、問い合わせが集中しても対応が破綻しにくい。', en: '' } }
      - id: version
        label: { ja: '版の管理', en: '' }
        options:
          - { id: tf-x-version, text: { ja: '版番号と確定時刻を書き、以後の変更も記録する', en: '' }, points: 8, axis: record, refs: [jpcert-handling], explain: { ja: '版と確定時刻を残すと、広報と法務が同じ文面を使っていることを後から示せる。訂正のときにも役立つ。', en: '' } }
          - { id: tf-x-none, text: { ja: '版は管理せず、更新の履歴も残さないままにする', en: '' }, points: -8, axis: record, refs: [jpcert-handling], explain: { ja: '版がないと、どれが最新か分からず、古い文面が独り歩きする。訂正のときに手戻りが出る。', en: '' } }
