          - { id: tf-l-hide, text: { ja: '欠損の期間には触れずに書く', en: '' }, points: -15, axis: record, refs: [jpcert-handling], explain: { ja: '欠損を書かないと、調べた範囲を過大に見せることになる。後から指摘されやすい書き方になる。', en: '' } }
      - id: victims
        label: { ja: 'クライアントの顧客への言及', en: '' }
        options:
          - { id: tf-v-leave, text: { ja: 'クライアントに任せると書いて自社の対応には触れない', en: '' }, points: -15, axis: care, refs: [ppc-notify-person], explain: { ja: '委ねるだけだと、二次被害への備えが見えない。自社の役割を問われる書き方になるため弱い。', en: '' } }
          - { id: tf-v-client, text: { ja: 'クライアントの顧客への影響と、相談窓口の連絡先を書く', en: '' }, points: 10, axis: care, refs: [ppc-notify-person], explain: { ja: '顧客への影響と相談窓口を書くと、被害者の次の行動が決まる。通知の実効性が上がる。', en: '' } }
      - id: contact
