      - id: export
        label: { ja: '外部媒体の制御', en: '' }
        options:
          - { id: rp-e-block, text: { ja: '外部媒体への書き出しを技術的に禁止する', en: '' }, points: 10, axis: order, refs: [no07-ipa-insider], explain: { ja: '技術的に禁止すると、ルールを破る気があっても書き出せない。再発の入口を仕組みで塞げる。', en: '' } }
          - { id: rp-e-rule, text: { ja: 'ルールの周知だけを行い、技術的な制御はしない', en: '' }, points: -10, axis: order, refs: [no07-ipa-insider], explain: { ja: '周知だけでは書き出しは止まらない。同じ方法が再び使われる余地が残り、再発の抑止にならない。', en: '' } }
      - id: monitor
        label: { ja: '監視', en: '' }
        options:
          - { id: rp-m-normal, text: { ja: '通常の監視体制に戻してしばらく様子を見る', en: '' }, points: -10, axis: content, refs: [nist-sp800-61r3], explain: { ja: 'すぐ通常の監視に戻すと、再発の兆候を取りこぼす。監視を弱める判断の根拠も残らない。', en: '' } }
          - { id: rp-m-criteria, text: { ja: '強化監視の期間と、戻す基準を決める', en: '' }, points: 8, axis: order, refs: [nist-sp800-61r3], explain: { ja: '期間と戻す基準を決めると、監視をいつ弱めるかを感覚で決めずに済む。説明もできる。', en: '' } }
      - id: sequence
        label: { ja: '再開の順番', en: '' }
        options:
          - { id: rp-s-step, text: { ja: '社内、限定したクライアント、全体の順に戻す', en: '' }, points: 8, axis: order, refs: [nist-sp800-61r3], explain: { ja: '範囲を区切って戻すと、問題が出た場所を切り分けられる。切り戻しも小さく済ませられる。', en: '' } }
          - { id: rp-s-all, text: { ja: '全センターを同じ日のうちに一斉に戻してしまう', en: '' }, points: -10, axis: order, refs: [nist-sp800-61r3], explain: { ja: '一斉に戻すと、問題が出たときに影響範囲が全センターに広がる。切り戻しの負担も大きくなる。', en: '' } }
      - id: rollback
        label: { ja: '切り戻しの条件', en: '' }
        options:
          - { id: rp-r-rule, text: { ja: '異常を検知したら自動で止める条件を書いておく', en: '' }, points: 8, axis: content, refs: [cissp-cbk-secops], explain: { ja: '自動で止まる条件を書くと、判断が遅れた場合でも被害を広げずに済む。戻せる範囲も限られる。', en: '' } }
          - { id: rp-r-none, text: { ja: '切り戻しの条件は決めずにそのまま運用する', en: '' }, points: -8, axis: content, refs: [cissp-cbk-secops], explain: { ja: '条件がないと、異常に気づいても止める判断が人任せになる。その分だけ時間を失いやすい。', en: '' } }
      - id: verify
        label: { ja: '外部の検証', en: '' }
        options:
          - { id: rp-v-third, text: { ja: '第三者の検証を経てから戻す', en: '' }, points: 8, axis: record, refs: [cissp-cbk-secops], explain: { ja: '第三者の検証を挟むと、戻してよい根拠を外にも説明できる。後から疑われたときの裏づけになる。', en: '' } }
          - { id: rp-v-self, text: { ja: '自社の判断だけで戻して再開する', en: '' }, points: -8, axis: record, refs: [cissp-cbk-secops], explain: { ja: '自社だけの判断は速いが、見落としを指摘する人がいない。戻してよい根拠も弱いまま残る。', en: '' } }
      - id: comms
        label: { ja: '現場への説明', en: '' }
        options:
          - { id: rp-m-safe, text: { ja: '「安全です」とだけ書き、説明を終える', en: '' }, points: -10, axis: care, refs: [meti-disclosure-guidance], explain: { ja: '「安全です」だけでは根拠が伝わらない。何を確かめたかが分からず、同じ不安が現場に残る。', en: '' } }
          - { id: rp-m-explain, text: { ja: '何を確認したのかを具体的に書き示す', en: '' }, points: 8, axis: care, refs: [meti-csm-guideline], explain: { ja: '確認した内容を具体的に書くと、現場は何が変わったかを理解して動ける。説明の納得も得やすい。', en: '' } }
