          - { id: p08-b-record, points: 5, axis: record, refs: [meti-trade-secret] }
      - id: p08-joint-record
        text: { ja: '共同調査と責任分界を文書で求め、取引先への説明材料に使える形で記録する。', en: '' }
        minutes: 150
        category: recover
        points: 100
        refs: [no07-dispatch-law, meti-trade-secret]
        gauges: { trust: 10, stamina: -10 }
        setFlags: { agencyJoint: true, agencyRecord: true }
        items:
          - { id: p08-c-order, points: 8, axis: order, refs: [no07-dispatch-law] }
          - { id: p08-c-record, points: 8, axis: record, refs: [meti-trade-secret] }
          - { id: p08-c-content, points: 5, axis: content, refs: [no07-ipa-insider] }

  - id: p09-own-gap
    at: { day: 2, minutes: 600 }
    phase: investigate
    sound: { se: [notify_chat] }
    text: { ja: '午前10時。自社には専任の情報セキュリティ担当がいない。総務部長が「権限の棚卸しも監査ログの確認も、親会社任せでした」と報告する。自社の運用の穴を、どこまで公表するか。', en: '' }
    voices: [v09-parent, v09-expert, v09-ok]
    notable:
      - { id: note-audit, text: { ja: '自社には専任の情報セキュリティ担当がなく、権限の棚卸しと監査ログの確認は親会社任せだった。', en: '' } }
    choices:
      - id: p09-hide
        text: { ja: '自社の運用の穴は公表せず、調査報告にも書かない。', en: '' }
        minutes: 60
        category: fatal
        points: -250
        refs: [no07-ipa-insider]
        gauges: { flame: 10, trust: -20 }
        setFlags: { hidOwnGap: true }
        delayed:
          - { afterPhases: 2, points: -80, gauges: { flame: 20, trust: -15 }, reason: { ja: '自社の穴を隠したことが報道され、説明責任を問われた。', en: '' } }
        items:
          - { id: p09-a-record, points: -20, axis: record, refs: [no07-ipa-insider] }
          - { id: p09-a-content, points: -15, axis: content, refs: [meti-csm-guideline] }
      - id: p09-fix
        text: { ja: '自社の権限確認、委託先の作業範囲、外部媒体への書き出しのルールを点検し、調査報告に書く。', en: '' }
        minutes: 120
        category: maintain
        points: 30
        refs: [no07-ipa-insider]
        gauges: { trust: 5, stamina: -5 }
        setFlags: { ownGapFixed: true }
        items:
          - { id: p09-b-record, points: 8, axis: record, refs: [no07-ipa-insider] }
          - { id: p09-b-content, points: 5, axis: content, refs: [meti-csm-guideline] }
      - id: p09-fix-external
        text: { ja: '権限確認、委託先の作業範囲、外部媒体への書き出しのルールを点検して報告書に書き、兼任体制の限界を認めて外部の相談先を確保する。', en: '' }
        minutes: 180
        category: recover
        points: 120
        refs: [no07-ipa-insider, ipa-sme-guideline]
        gauges: { flame: -10, trust: 15, stamina: -10 }
        setFlags: { ownGapFixed: true, externalAdvisor: true }
        items:
          - { id: p09-c-record, points: 8, axis: record, refs: [no07-ipa-insider] }
          - { id: p09-c-content, points: 8, axis: content, refs: [ipa-sme-guideline] }
          - { id: p09-c-order, points: 5, axis: order, refs: [meti-csm-guideline] }

