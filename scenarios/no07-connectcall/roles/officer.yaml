        explain: { ja: '件数が固まるのを待つと、取引先の顧客への説明が遅れる。口頭で調査中と伝えるだけでは、取引先が自社の顧客に何と言うか決められない。', en: '' }
      - id: p05-draft
        text: { ja: '分かっている範囲で一次通知を作り、全取引先に同じ内容で送って状況の更新を約す。', en: '' }
