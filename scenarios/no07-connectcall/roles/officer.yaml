        explain: { ja: '分かる範囲で一次通知を出し、更新を約す対応は適切になる。ただ取引先の顧客対応を支える材料と窓口がなく、説明の負担が各社に残る。', en: '' }
    lesson: { ja: '件数が固まるのを待つと、取引先の顧客への説明が遅れる。分かっている範囲で一次通知を出し、不明点は調査中と明記する。加えて顧客対応用のQ&Aと窓口の増員を用意すると、通知が実際の行動につながる。', en: '' }

  - id: p06-parent-victim
    at: { day: 2, minutes: 1020 }
    phase: notify
    sound: { se: [notify_chat] }
    text: { ja: '午後5時。親会社が持つ顧客情報も、持ち出された名簿に含まれていた。親会社も被害者だが、自社の取引先データを預かった責任は自社にある。「親会社も被害者」とどう説明するか。', en: '' }
