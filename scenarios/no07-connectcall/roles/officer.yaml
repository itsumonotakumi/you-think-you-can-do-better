# No.7 コネクトコール / 役員・グループ会社社長ロール
# プレイヤーはグループ会社コネクトコール・フィールドの社長。親会社のセンター基盤で起きた内部不正で、
# 自社が預かる取引先データと、親会社も被害者という立場の間で判断する。
# 判断ポイント17、細目は choices[].items と drafts の合計で80以上。
estimateMinutes: 35
intro: { ja: 'あなたはコネクトコールのグループ会社、コネクトコール・フィールド株式会社の代表取締役社長。親会社のセンター基盤を借りて、取引先企業の窓口業務と受注処理を請け負っている。専任の情報セキュリティ部署はなく、総務部長が情報管理を兼任し、外部のITベンダーに運用を頼っている。午前10時、親会社の情報システム部長・倉橋から電話が入る。主要クライアントの顧客名簿が外部で使われているという指摘だった。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-ppc-prelim
    ref: ppc-report-prelim
    label: { ja: '自社分の漏えい等報告（速報）', en: '' }
    points: -150
    doneFlag: ppcPrelimFiled
  - id: dl-ppc-final
    ref: ppc-report-final-malicious
    label: { ja: '自社分の漏えい等報告（確報）', en: '' }
    points: -150
    doneFlag: ppcFinalFiled
events:
  - id: ev-client-calls
    at: { day: 1, minutes: 720 }
    voices: [v-ev-client]
    gauges: { flame: 5 }
    sound: { se: [phone_ring] }
    caption: { ja: '取引先から「うちの顧客は大丈夫か」と電話が続いている。', en: '' }
  - id: ev-parent-board
    at: { day: 2, minutes: 1080 }
    voices: [v-ev-board]
    gauges: { flame: 5 }
    caption: { ja: '親会社の臨時取締役会が開かれ、グループの対応方針が議題になった。', en: '' }
  - id: ev-staff-fatigue
    at: { day: 5, minutes: 960 }
    voices: [v-ev-staff]
    gauges: { stamina: -10 }
    caption: { ja: '現場から「交代がなく、休めない」という声が出ている。', en: '' }
  - id: ev-training
    at: { day: 7, minutes: 600 }
    voices: [v-ev-training]
    caption: { ja: '全社研修の記録では、本人は10年連続で満点だった。', en: '' }
  - id: ev-news
    at: { day: 8, minutes: 600 }
    voices: [v-ev-news]
    gauges: { flame: 10 }
    sound: { se: [notify_news] }
    caption: { ja: '続報で、取引先が受託先の見直しを始めたと報じられた。', en: '' }
points:
  - id: p01-call
    at: { day: 0, minutes: 600 }
    phase: detect
    sound: { se: [phone_ring] }
    text: { ja: '午前10時。親会社の情報システム部長・倉橋から電話。『主要クライアントから、顧客名簿が外部で使われていると指摘された。グループ共通のセンター基盤が疑われている。御社が預かる取引先のデータも同じ環境にある』。自社には専任の情報セキュリティ担当がいない。', en: '' }
    voices: [v01-parent, v01-public, v01-ok]
    choices:
      - id: p01-check-plan
        text: { ja: '自社の対策会議を開き、対象データの確認と窓口の一本化、取引先への一次連絡の準備を同時に始める。', en: '' }
        minutes: 150
        category: recover
        points: 100
        refs: [meti-csm-guideline, jpcert-handling]
        gauges: { flame: -5, trust: 10, stamina: -10 }
        setFlags: { ownScopeChecked: true, ownTaskForce: true }
        items:
          - { id: p01-c-time, points: 8, axis: time, refs: [jpcert-handling] }
          - { id: p01-c-order, points: 8, axis: order, refs: [meti-csm-guideline] }
          - { id: p01-c-record, points: 5, axis: record, refs: [jpcert-handling] }
          - { id: p01-c-care, points: 5, axis: care, refs: [ipa-sme-guideline] }
        explain: { ja: '対象の確認、窓口の一本化、取引先への連絡準備を同時に始めており、初動で必要な三つを押さえている。専任部署がなくても社長判断で動ける形にした点が評価できる。', en: '' }
      - id: p01-wait
        text: { ja: '親会社の調査結果が出るまで待つ方針を固め、自社の取引先には今日は何も伝えず、明日以降の対応も決めないままにする。', en: '' }
        minutes: 90
        category: hurt
        points: -90
        refs: [jpcert-handling]
        gauges: { flame: 5, trust: -10 }
        coward: true
        setFlags: { waitedParent: true }
        delayed:
          - { afterPhases: 1, points: -40, gauges: { trust: -10 }, reason: { ja: '取引先が報道で知り、自社だけ説明が遅れた。', en: '' } }
        items:
          - { id: p01-a-time, points: -10, axis: time, refs: [jpcert-handling] }
          - { id: p01-a-order, points: -8, axis: order, refs: [meti-csm-guideline] }
        explain: { ja: '親会社の調査を待つ間も、自社の取引先データは同じ基盤の上にある。何も伝えないまま報道で知られると、説明の遅れが不信につながる。待つ判断が被害を広げる。', en: '' }
      - id: p01-check
        text: { ja: '自社の取引先データの有無を同日中に確認し、分かった事実を親会社の対策本部にそのまま返す。', en: '' }
        minutes: 120
        category: maintain
        points: 20
        refs: [jpcert-handling]
        gauges: { trust: 5, stamina: -5 }
        setFlags: { ownScopeChecked: true }
        items:
          - { id: p01-b-time, points: 5, axis: time, refs: [jpcert-handling] }
          - { id: p01-b-order, points: 5, axis: order, refs: [meti-csm-guideline] }
          - { id: p01-b-record, points: 5, axis: record, refs: [jpcert-handling] }
        explain: { ja: '自社分の確認を同日中に済ませ、事実を親会社に返す対応は妥当な一歩になる。ただし窓口の一本化と取引先への初報の準備が抜けており、次の一手が遅れる。', en: '' }
    lesson: { ja: '発端の電話では、手口の断定より自社の守備範囲の確認が先になる。同じ基盤に自社の取引先データがあるなら、対象の特定と親会社への窓口の一本化、取引先への初報の準備を同時に走らせる。調査結果を待つだけの構えは、説明の遅れを生む。', en: '' }

  - id: p02-operations
    at: { day: 0, minutes: 840 }
    phase: contain
    sound: { se: [notify_chat] }
    text: { ja: '午後2時。自社の窓口業務と受注処理は、親会社のセンター基盤の上で動いている。親会社は侵入経路を特定している最中だ。自社の業務を止めるか、続けるか。', en: '' }
    voices: [v02-coward, v02-vendor, v02-ok]
    choices:
      - id: p02-continue
        text: { ja: '業務は止めずに続け、不審な操作の監視も親会社の担当者に任せたままにする。', en: '' }
        minutes: 120
        category: hurt
        points: -100
        refs: [jpcert-handling]
        gauges: { damage: 10, trust: -5 }
        setFlags: { continuedOps: true }
        delayed:
          - { afterPhases: 1, points: -50, gauges: { damage: 10, trust: -10 }, reason: { ja: '止めなかった業務で、別の不審な操作が見つかった。', en: '' } }
        items:
          - { id: p02-a-record, points: -10, axis: record, refs: [jpcert-handling] }
          - { id: p02-a-order, points: -8, axis: order, refs: [nist-sp800-61r3] }
        explain: { ja: '基盤が共有されている以上、動かし続ける業務は被害の経路になりうる。監視を相手に任せたままでは、自社の取引先データに起きた変化を自分で把握できない。', en: '' }
      - id: p02-stop
        text: { ja: '該当する窓口業務だけを止め、影響の出る取引先には電話で状況をその都度伝える。', en: '' }
        minutes: 90
        category: maintain
        points: 30
        refs: [nist-sp800-61r3]
        gauges: { damage: -10, trust: 5, stamina: -5 }
        setFlags: { contained: true }
        items:
          - { id: p02-b-time, points: 5, axis: time, refs: [jpcert-handling] }
          - { id: p02-b-order, points: 5, axis: order, refs: [nist-sp800-61r3] }
          - { id: p02-b-record, points: 5, axis: record, refs: [jpcert-handling] }
        explain: { ja: '被害の広がりを止める範囲を絞った判断は適切になる。ただ止めた後の代替手段と影響範囲の共有が抜けており、取引先の業務は止まったまま残る。', en: '' }
      - id: p02-stop-plan
        text: { ja: '該当業務を止め、取引先ごとの代替窓口と手作業の受け付けを用意し、影響範囲を親会社に返す。', en: '' }
        minutes: 150
        category: recover
        points: 120
        refs: [nist-sp800-61r3, meti-csm-guideline]
        gauges: { damage: -15, trust: 10, stamina: -10 }
        setFlags: { contained: true, ownContinuityPlan: true }
        items:
          - { id: p02-c-order, points: 8, axis: order, refs: [nist-sp800-61r3] }
          - { id: p02-c-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: p02-c-care, points: 5, axis: care, refs: [meti-csm-guideline] }
          - { id: p02-c-time, points: 5, axis: time, refs: [jpcert-handling] }
        explain: { ja: '止める範囲を決めたうえで代替の受け付けを用意し、影響を親会社に返している。封じ込めと業務継続を一組で設計した点が、取引先の損失を最小にする。', en: '' }
    lesson: { ja: '基盤を共有している以上、自社の業務も被害の範囲に入りうる。止める範囲を決め、代替の受け付けを用意し、影響を親会社に返すところまでを一組で考える。監視を相手に任せたまま動かし続けると、二次的な被害を自社の取引先に広げる。', en: '' }

  - id: p03-parent
    at: { day: 1, minutes: 540 }
    phase: organize
    sound: { se: [mail_arrive] }
    text: { ja: '午前9時。親会社の方針は「グループで一本化する。子会社は個別に動くな」。自社も個人情報取扱事業者として、報告と通知の判断を持っている。親会社への第一報をどう出すか。', en: '' }
    voices: [v03-parent, v03-law, v03-ok]
    choices:
      - id: p03-entrust
        text: { ja: '親会社にすべて任せ、自社からの報告も取引先への通知も行わないままにする。', en: '' }
        minutes: 45
        category: hurt
        points: -120
        refs: [meti-csm-guideline]
        gauges: { trust: -15, flame: 10 }
        coward: true
        setFlags: { leftToParent: true }
        delayed:
          - { afterPhases: 1, points: -40, gauges: { trust: -10 }, reason: { ja: '親会社の発表と自社の説明が食い違い、訂正が必要になった。', en: '' } }
        items:
          - { id: p03-a-order, points: -10, axis: order, refs: [meti-csm-guideline] }
          - { id: p03-a-record, points: -10, axis: record, refs: [jpcert-handling] }
          - { id: p03-a-content, points: -8, axis: content, refs: [ppc-report-scope] }
        explain: { ja: 'グループで一本化する方針と、自社が個人情報取扱事業者として持つ判断は別になる。任せきりにすると、親会社の発表との食い違いが後から訂正を生む。', en: '' }
      - id: p03-report-own
        text: { ja: '書面で提出したうえで、自社が報告と通知をすべき範囲を親会社と分けて整理する。', en: '' }
        minutes: 150
        category: recover
        points: 100
        refs: [meti-csm-guideline, ppc-report-scope]
        gauges: { trust: 10, stamina: -10 }
        detail: parent-report
        setFlags: { parentReportFiled: true, ownScopeSplit: true }
        items:
          - { id: p03-c-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: p03-c-content, points: 8, axis: content, refs: [ppc-report-scope] }
          - { id: p03-c-order, points: 5, axis: order, refs: [meti-csm-guideline] }
        explain: { ja: '事実を書面で出したうえで自社の報告範囲を切り分けており、役割が後から曖昧にならない。グループの方針と自社の義務を両立させた整理になる。', en: '' }
      - id: p03-report
        text: { ja: '自社分の事実と件数を書面にまとめて親会社へ提出し、グループの方針にそのまま合わせる。', en: '' }
        minutes: 120
        category: maintain
        points: 20
        refs: [jpcert-handling]
        gauges: { trust: 5, stamina: -10 }
        detail: parent-report
        setFlags: { parentReportFiled: true }
        items:
          - { id: p03-b-record, points: 5, axis: record, refs: [jpcert-handling] }
          - { id: p03-b-content, points: 5, axis: content, refs: [meti-csm-guideline] }
          - { id: p03-b-time, points: 5, axis: time, refs: [jpcert-handling] }
        explain: { ja: '書面で事実と件数を出す対応は評価できる。ただ自社が報告と通知を負う範囲を整理していないため、方針が変わったときに根拠を示せない。', en: '' }
    lesson: { ja: 'グループで一本化する方針と、自社が個人情報取扱事業者として持つ判断は別のものになる。事実と件数を書面で出したうえで、自社が報告と通知を負う範囲を分けて整理する。任せきりにすると、親会社の発表との食い違いが後から訂正を生む。', en: '' }

  - id: p04-clients
    at: { day: 1, minutes: 840 }
    phase: organize
    sound: { se: [phone_ring] }
    text: { ja: '午後2時。自社が預かる取引先は数十社。各社も自社の顧客に説明する立場になる。報道前に個別に伝えるか、親会社の発表を待つか。', en: '' }
    voices: [v04-public, v04-parent, v04-ok]
    notable:
      - { id: note-scale, text: { ja: '影響する取引先は確認済み十数社と調査中に分けて把握している。', en: '' } }
    choices:
      - id: p04-wait
        text: { ja: '親会社の発表を待ち、報道が出てから取引先へまとめて伝える方針を取るので、今日は何も動かない。', en: '' }
        minutes: 90
        category: hurt
        points: -120
        refs: [meti-disclosure-guidance]
        gauges: { flame: 10, trust: -10 }
        coward: true
        delayed:
          - { afterPhases: 1, points: -50, gauges: { flame: 10, trust: -10 }, reason: { ja: '報道で知った取引先から、説明の遅れへの抗議が届いた。', en: '' } }
        items:
          - { id: p04-a-time, points: -10, axis: time, refs: [meti-disclosure-guidance] }
          - { id: p04-a-order, points: -10, axis: order, refs: [ppc-notify-person] }
          - { id: p04-a-care, points: -8, axis: care, refs: [meti-csm-guideline] }
        explain: { ja: '取引先は自社の顧客に説明する立場になる。報道を待つ間にその準備を奪うことになり、後から抗議として返ってくる。先に伝える理由はここにある。', en: '' }
      - id: p04-brief-support
        text: { ja: '全取引先に一次連絡し、各社の顧客対応に使えるQ&Aと専用の相談窓口を用意する。', en: '' }
        minutes: 180
        category: recover
        points: 120
        refs: [meti-csm-guideline, ppc-notify-person]
        gauges: { trust: 15, stamina: -10 }
        setFlags: { clientsNotified: true, clientQA: true }
        items:
          - { id: p04-c-order, points: 8, axis: order, refs: [meti-disclosure-guidance] }
          - { id: p04-c-care, points: 8, axis: care, refs: [ppc-notify-person] }
          - { id: p04-c-wording, points: 5, axis: wording, refs: [meti-csm-guideline] }
          - { id: p04-c-record, points: 5, axis: record, refs: [jpcert-handling] }
        explain: { ja: '同じ時刻の一次連絡に加え、各社が顧客へ説明するためのQ&Aと窓口を渡している。取引先の説明準備まで支えた点が、信頼の回復につながる。', en: '' }
      - id: p04-brief
        text: { ja: '全取引先に同じ時刻で一次連絡を入れ、詳細は分かった順に更新して伝えていく。', en: '' }
        minutes: 120
        category: maintain
        points: 30
        refs: [meti-disclosure-guidance]
        gauges: { trust: 5, stamina: -5 }
        setFlags: { clientsNotified: true }
        items:
          - { id: p04-b-order, points: 8, axis: order, refs: [meti-disclosure-guidance] }
          - { id: p04-b-time, points: 5, axis: time, refs: [ppc-notify-person] }
          - { id: p04-b-wording, points: 5, axis: wording, refs: [meti-disclosure-guidance] }
        explain: { ja: '同じ時刻に同じ内容で届ける判断は、説明のばらつきを防ぐ。ただ各社が顧客へ説明する材料と窓口がなく、取引先の負担が残ったままになる。', en: '' }
    lesson: { ja: '取引先は自社の顧客に説明する立場になる。報道で知られる前に一度連絡を入れ、各社が使えるQ&Aと窓口を添える。同じ時刻に同じ内容で届けることが、説明のばらつきを防ぐ。報道を待つ判断は、取引先の説明準備を奪う。', en: '' }

  - id: p08-agency
    at: { day: 1, minutes: 1080 }
    phase: investigate
    sound: { se: [mail_arrive] }
    text: { ja: '午後6時。派遣元の営業担当が自社にも来た。「本人は弊社で処分します。御社は関わらないでください」。自社の取引先に説明する材料が要る。', en: '' }
    voices: [v08-vendor, v08-past, v08-ok]
    choices:
      - id: p08-joint-record
        text: { ja: '共同調査と責任分界を文書で求め、取引先への説明材料に使える形で記録に残す。', en: '' }
        minutes: 150
        category: recover
        points: 100
        refs: [no07-dispatch-law, meti-trade-secret]
        gauges: { trust: 10, stamina: -10 }
        setFlags: { agencyJoint: true, agencyRecord: true }
        items:
          - { id: p08-c-order, points: 8, axis: order, refs: [no07-dispatch-law] }
          - { id: p08-c-record, points: 8, axis: record, refs: [meti-trade-secret] }
          - { id: p08-c-content, points: 5, axis: content, refs: [no07-ipa-insider] }
        explain: { ja: '派遣元の処分に任せず、事実確認と責任分界を文書で残している。取引先へ説明する材料になるうえ、後から経緯をたどれる形にした点が強い。', en: '' }
      - id: p08-leave
        text: { ja: '派遣元に任せ、自社の取引先データに関わる事実確認も記録の提供も求めないでおく。', en: '' }
        minutes: 45
        category: hurt
        points: -100
        refs: [no07-dispatch-law]
        gauges: { trust: -10, damage: 5 }
        items:
          - { id: p08-a-order, points: -10, axis: order, refs: [no07-dispatch-law] }
          - { id: p08-a-record, points: -10, axis: record, refs: [meti-trade-secret] }
        explain: { ja: '派遣元が処分すると言っても、自社が預かったデータの事実確認まで任せてよいわけではない。求めないままでは、取引先に説明する材料が手元に残らない。', en: '' }
      - id: p08-joint
        text: { ja: '親会社を通じて、派遣元に共同調査と責任分界の整理を求めて話し合いの場を設ける。', en: '' }
        minutes: 90
        category: maintain
        points: 20
        refs: [no07-dispatch-law, meti-csm-guideline]
        gauges: { trust: 5, stamina: -5 }
        setFlags: { agencyJoint: true }
        items:
          - { id: p08-b-order, points: 8, axis: order, refs: [no07-dispatch-law] }
          - { id: p08-b-wording, points: 5, axis: wording, refs: [meti-csm-guideline] }
          - { id: p08-b-record, points: 5, axis: record, refs: [meti-trade-secret] }
        explain: { ja: '共同調査と責任分界の整理を求める方向は正しい。ただし文書と記録に残していないため、取引先への説明や後日の確認に使える形になっていない。', en: '' }
    lesson: { ja: '派遣元が処分すると言っても、自社が預かったデータの事実確認まで任せてよいわけではない。共同調査と責任分界を文書で求め、取引先への説明に使える記録として残す。口頭の約束だけでは、後から経緯を説明できない。', en: '' }

  - id: p09-own-gap
    at: { day: 2, minutes: 600 }
    phase: investigate
    sound: { se: [notify_chat] }
    text: { ja: '午前10時。自社には専任の情報セキュリティ担当がいない。総務部長が「権限の棚卸しも監査ログの確認も、親会社任せでした」と報告する。自社の運用の穴を、どこまで公表するか。', en: '' }
    voices: [v09-parent, v09-expert, v09-ok]
    notable:
      - { id: note-audit, text: { ja: '自社には専任の情報セキュリティ担当がなく、権限の棚卸しと監査ログの確認は親会社任せだった。', en: '' } }
    choices:
      - id: p09-hide
        text: { ja: '自社の運用の穴は公表せず、第三者委員会の調査報告書にも書かないままにして、グループの信用を守る。', en: '' }
        minutes: 60
        category: fatal
        points: -250
        refs: [no07-ipa-insider]
        gauges: { flame: 10, trust: -20 }
        setFlags: { hidOwnGap: true, hidAudit: true }
