        points: 120
        refs: [no07-ipa-insider, ipa-sme-guideline]
        gauges: { flame: -10, trust: 15, stamina: -10 }
        setFlags: { ownGapFixed: true, externalAdvisor: true }
        items:
          - { id: p09-c-record, points: 8, axis: record, refs: [no07-ipa-insider] }
          - { id: p09-c-content, points: 8, axis: content, refs: [ipa-sme-guideline] }
          - { id: p09-c-order, points: 5, axis: order, refs: [meti-csm-guideline] }
        explain: { ja: '穴を点検して報告書に書き、兼任体制の限界まで認めたうえで外部の相談先を確保している。次の点検も回る形にした点が、再発防止として実効的になる。', en: '' }
      - id: p09-fix
        text: { ja: '自社の権限確認と委託先の作業範囲、外部媒体への書き出しのルールを点検し、調査報告書に書いて残す。', en: '' }
        minutes: 120
        category: maintain
        points: 30
        refs: [no07-ipa-insider]
        gauges: { trust: 5, stamina: -5 }
        setFlags: { ownGapFixed: true }
