# No.7 コネクトコール / 役員・グループ会社社長ロール
# プレイヤーはグループ会社コネクトコール・フィールドの社長。親会社のセンター基盤で起きた内部不正で、
# 自社が預かる取引先データと、親会社も被害者という立場の間で判断する。
# 判断ポイント17、細目は choices[].items と drafts の合計で80以上。
estimateMinutes: 35
intro: { ja: 'あなたはコネクトコールのグループ会社、コネクトコール・フィールド株式会社の代表取締役社長。親会社のセンター基盤を借りて、取引先企業の窓口業務と受注処理を請け負っている。専任の情報セキュリティ部署はなく、総務部長が情報管理を兼任し、外部のITベンダーに運用を頼っている。午前10時、親会社の情報システム部長から電話が入る。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-ppc-prelim
    ref: ppc-report-prelim
    label: { ja: '自社分の漏えい等報告（速報）', en: '' }
    points: -150
    doneFlag: ppcPrelimFiled
  - id: dl-ppc-final
    ref: ppc-report-final-malicious
    label: { ja: '自社分の漏えい等報告（確報）', en: '' }
    points: -150
    doneFlag: ppcFinalFiled
events:
  - id: ev-client-calls
    at: { day: 1, minutes: 720 }
    voices: [v-ev-client]
    gauges: { flame: 5 }
    sound: { se: [phone_ring] }
    caption: { ja: '取引先から「うちの顧客は大丈夫か」と電話が続いている。', en: '' }
  - id: ev-parent-board
    at: { day: 2, minutes: 1080 }
    voices: [v-ev-board]
    gauges: { flame: 5 }
    caption: { ja: '親会社の臨時取締役会が開かれ、グループの対応方針が議題になった。', en: '' }
  - id: ev-staff-fatigue
    at: { day: 5, minutes: 960 }
    voices: [v-ev-staff]
    gauges: { stamina: -10 }
    caption: { ja: '現場から「交代がなく、休めない」という声が出ている。', en: '' }
  - id: ev-training
    at: { day: 7, minutes: 600 }
    voices: [v-ev-training]
    caption: { ja: '全社研修の記録では、本人は10年連続で満点だった。', en: '' }
  - id: ev-news
    at: { day: 8, minutes: 600 }
    voices: [v-ev-news]
    gauges: { flame: 10 }
    sound: { se: [notify_news] }
    caption: { ja: '「10年気づかなかった」と報道され、取引先が受託先の見直しを始めた。', en: '' }
points:
  - id: p01-call
    at: { day: 0, minutes: 600 }
    phase: detect
    sound: { se: [phone_ring] }
    text: { ja: '午前10時。親会社の情報システム部長・倉橋から電話が入る。「グループ共通のセンター基盤で、派遣の保守担当者が10年分の顧客名簿を外部媒体に書き出していた。御社が預かる取引先のデータも、同じ環境にあった」。自社には専任の情報セキュリティ担当がいない。', en: '' }
    voices: [v01-parent, v01-public, v01-ok]
    notable:
      - { id: note-scale, text: { ja: '自社が預かる取引先データも、親会社のセンター基盤にあった。確認できた範囲では十数社で、調査中の取引先もある。', en: '' } }
    choices:
      - id: p01-wait
        text: { ja: '親会社の調査結果を待ち、自社の取引先には今日は何も伝えない。', en: '' }
        minutes: 90
        category: hurt
        points: -90
        refs: [jpcert-handling]
        gauges: { flame: 5, trust: -10 }
        coward: true
        setFlags: { waitedParent: true }
        delayed:
          - { afterPhases: 1, points: -40, gauges: { trust: -10 }, reason: { ja: '取引先が報道で知り、自社だけ説明が遅れた。', en: '' } }
        items:
          - { id: p01-a-time, points: -10, axis: time, refs: [jpcert-handling] }
          - { id: p01-a-order, points: -8, axis: order, refs: [meti-csm-guideline] }
      - id: p01-check
        text: { ja: '自社の取引先データの有無を同日中に確認し、分かった事実を親会社の対策本部に返す。', en: '' }
        minutes: 120
        category: maintain
        points: 20
        refs: [jpcert-handling]
        gauges: { trust: 5, stamina: -5 }
        setFlags: { ownScopeChecked: true }
        items:
          - { id: p01-b-time, points: 5, axis: time, refs: [jpcert-handling] }
          - { id: p01-b-order, points: 5, axis: order, refs: [meti-csm-guideline] }
          - { id: p01-b-record, points: 5, axis: record, refs: [jpcert-handling] }
      - id: p01-check-plan
        text: { ja: '自社でも対策会議を開き、対象データの確認、親会社への窓口一本化、取引先への一次連絡の準備を同時に始める。', en: '' }
        minutes: 150
        category: recover
        points: 100
        refs: [meti-csm-guideline, jpcert-handling]
        gauges: { flame: -5, trust: 10, stamina: -10 }
        setFlags: { ownScopeChecked: true, ownTaskForce: true }
        items:
          - { id: p01-c-time, points: 8, axis: time, refs: [jpcert-handling] }
          - { id: p01-c-order, points: 8, axis: order, refs: [meti-csm-guideline] }
          - { id: p01-c-record, points: 5, axis: record, refs: [jpcert-handling] }
          - { id: p01-c-care, points: 5, axis: care, refs: [ipa-sme-guideline] }

  - id: p02-operations
    at: { day: 0, minutes: 840 }
    phase: contain
    sound: { se: [notify_chat] }
    text: { ja: '午後2時。自社の窓口業務と受注処理は、親会社のセンター基盤の上で動いている。親会社は侵入経路を特定している最中だ。自社の業務を止めるか、続けるか。', en: '' }
    voices: [v02-coward, v02-vendor, v02-ok]
    choices:
      - id: p02-continue
        text: { ja: '業務は止めず、監視も親会社に任せる。', en: '' }
        minutes: 120
        category: hurt
        points: -100
        refs: [jpcert-handling]
        gauges: { damage: 10, trust: -5 }
        setFlags: { continuedOps: true }
        delayed:
          - { afterPhases: 1, points: -50, gauges: { damage: 10, trust: -10 }, reason: { ja: '止めなかった業務で、別の不審な操作が見つかった。', en: '' } }
        items:
          - { id: p02-a-record, points: -10, axis: record, refs: [jpcert-handling] }
          - { id: p02-a-order, points: -8, axis: order, refs: [nist-sp800-61r3] }
      - id: p02-stop
        text: { ja: '該当する窓口業務だけを止め、取引先には電話で状況を伝える。', en: '' }
        minutes: 90
        category: maintain
        points: 30
        refs: [nist-sp800-61r3]
        gauges: { damage: -10, trust: 5, stamina: -5 }
        setFlags: { contained: true }
        items:
          - { id: p02-b-time, points: 5, axis: time, refs: [jpcert-handling] }
          - { id: p02-b-order, points: 5, axis: order, refs: [nist-sp800-61r3] }
          - { id: p02-b-record, points: 5, axis: record, refs: [jpcert-handling] }
      - id: p02-stop-plan
        text: { ja: '該当業務を止め、取引先ごとの代替窓口と手作業の受け付けを用意し、影響範囲を親会社に返す。', en: '' }
        minutes: 150
        category: recover
        points: 120
        refs: [nist-sp800-61r3, meti-csm-guideline]
        gauges: { damage: -15, trust: 10, stamina: -10 }
        setFlags: { contained: true, ownContinuityPlan: true }
        items:
          - { id: p02-c-order, points: 8, axis: order, refs: [nist-sp800-61r3] }
          - { id: p02-c-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: p02-c-care, points: 5, axis: care, refs: [meti-csm-guideline] }
          - { id: p02-c-time, points: 5, axis: time, refs: [jpcert-handling] }

  - id: p03-parent
    at: { day: 1, minutes: 540 }
    phase: organize
    sound: { se: [mail_arrive] }
    text: { ja: '午前9時。親会社の方針は「グループで一本化する。子会社は個別に動くな」。自社も個人情報取扱事業者として、報告と通知の判断を持っている。親会社への第一報をどう出すか。', en: '' }
    voices: [v03-parent, v03-law, v03-ok]
    choices:
      - id: p03-entrust
        text: { ja: '親会社にすべて任せ、自社からは報告も通知もしない。', en: '' }
        minutes: 45
        category: hurt
        points: -120
        refs: [meti-csm-guideline]
        gauges: { trust: -15, flame: 10 }
        coward: true
        setFlags: { leftToParent: true }
        delayed:
          - { afterPhases: 1, points: -40, gauges: { trust: -10 }, reason: { ja: '親会社の発表と自社の説明が食い違い、訂正が必要になった。', en: '' } }
        items:
          - { id: p03-a-order, points: -10, axis: order, refs: [meti-csm-guideline] }
          - { id: p03-a-record, points: -10, axis: record, refs: [jpcert-handling] }
          - { id: p03-a-content, points: -8, axis: content, refs: [ppc-report-scope] }
      - id: p03-report
        text: { ja: '自社分の事実と件数を書面で親会社に提出し、グループの方針に合わせる。', en: '' }
        minutes: 120
        category: maintain
        points: 20
        refs: [jpcert-handling]
        gauges: { trust: 5, stamina: -10 }
        detail: parent-report
        setFlags: { parentReportFiled: true }
        items:
          - { id: p03-b-record, points: 5, axis: record, refs: [jpcert-handling] }
          - { id: p03-b-content, points: 5, axis: content, refs: [meti-csm-guideline] }
          - { id: p03-b-time, points: 5, axis: time, refs: [jpcert-handling] }
      - id: p03-report-own
        text: { ja: '書面で提出し、自社が報告・通知すべき範囲を親会社と分けて整理する。', en: '' }
        minutes: 150
        category: recover
        points: 100
        refs: [meti-csm-guideline, ppc-report-scope]
        gauges: { trust: 10, stamina: -10 }
        detail: parent-report
        setFlags: { parentReportFiled: true, ownScopeSplit: true }
        items:
          - { id: p03-c-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: p03-c-content, points: 8, axis: content, refs: [ppc-report-scope] }
          - { id: p03-c-order, points: 5, axis: order, refs: [meti-csm-guideline] }

  - id: p04-clients
    at: { day: 1, minutes: 840 }
    phase: organize
    sound: { se: [phone_ring] }
    text: { ja: '午後2時。自社が預かる取引先は数十社。各社も自社の顧客に説明する立場になる。報道前に個別に伝えるか、親会社の発表を待つか。', en: '' }
    voices: [v04-public, v04-parent, v04-ok]
    choices:
      - id: p04-wait
        text: { ja: '親会社の発表を待ち、報道が出てからまとめて伝える。', en: '' }
        minutes: 90
        category: hurt
        points: -120
        refs: [meti-disclosure-guidance]
        gauges: { flame: 10, trust: -10 }
        coward: true
        delayed:
          - { afterPhases: 1, points: -50, gauges: { flame: 10, trust: -10 }, reason: { ja: '報道で知った取引先から、説明の遅れへの抗議が届いた。', en: '' } }
        items:
          - { id: p04-a-time, points: -10, axis: time, refs: [meti-disclosure-guidance] }
