          - { id: p04-b-wording, points: 5, axis: wording, refs: [meti-disclosure-guidance] }
      - id: p04-brief-support
        text: { ja: '全社に一次連絡し、各社の顧客対応に使えるQ&Aと専用窓口を用意する。', en: '' }
        minutes: 180
        category: recover
        points: 120
        refs: [meti-csm-guideline, ppc-notify-person]
        gauges: { trust: 15, stamina: -10 }
        setFlags: { clientsNotified: true, clientQA: true }
        items:
          - { id: p04-c-order, points: 8, axis: order, refs: [meti-disclosure-guidance] }
          - { id: p04-c-care, points: 8, axis: care, refs: [ppc-notify-person] }
          - { id: p04-c-wording, points: 5, axis: wording, refs: [meti-csm-guideline] }
          - { id: p04-c-record, points: 5, axis: record, refs: [jpcert-handling] }

  - id: p08-agency
    at: { day: 1, minutes: 1080 }
    phase: investigate
    sound: { se: [mail_arrive] }
    text: { ja: '午後6時。派遣元の営業担当が自社にも来た。「本人は弊社で処分します。御社は関わらないでください」。自社の取引先に説明する材料が要る。', en: '' }
    voices: [v08-vendor, v08-past, v08-ok]
    choices:
      - id: p08-leave
        text: { ja: '派遣元に任せ、自社は本人への連絡も処分も関与しない。', en: '' }
