          - { id: p09-b-content, points: 5, axis: content, refs: [meti-csm-guideline] }
        explain: { ja: '穴を点検して報告書に書く対応は誠実になる。ただ兼任のまま抱える形が残り、次の点検を回す力が足りない。外部の相談先まで踏み込めると強い。', en: '' }
    lesson: { ja: '兼任体制の限界は、隠すほど大きく見える。権限の棚卸しと委託先の作業範囲、外部媒体への書き出しのルールを点検し、報告書に書く。そのうえで外部の相談先を確保すれば、次の点検も回る。穴を書かない報告は、再発の芽を残す。', en: '' }

