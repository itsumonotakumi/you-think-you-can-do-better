    phase: recover
    sound: { se: [notify_sns] }
    text: { ja: '午前10時。親会社の検証はまだ終わっていない。取引先からは「早く戻してほしい」、現場からは「検証が終わるまで戻せない」という声が上がる。自社だけ先に再開するか。', en: '' }
    voices: [v12-public, v12-coward, v12-ok]
    choices:
      - id: p12-full
        text: { ja: '自社だけ先に全面再開し、不審な操作の監視も通常の体制に戻して、再発の兆候を見落とす。', en: '' }
        minutes: 120
        category: hurt
        points: -150
        refs: [nist-sp800-61r3]
        gauges: { damage: 20, flame: 10, trust: -10 }
        delayed:
          - { afterPhases: 1, points: -60, gauges: { damage: 15, trust: -15 }, reason: { ja: '再開後に別の端末で不審な通信が見つかり、再度止めた。', en: '' } }
        items:
          - { id: p12-a-order, points: -10, axis: order, refs: [nist-sp800-61r3] }
          - { id: p12-a-record, points: -10, axis: record, refs: [jpcert-handling] }
          - { id: p12-a-care, points: -5, axis: care, refs: [meti-csm-guideline] }
        explain: { ja: '検証が終わる前に全面再開すると、同じ基盤から再び侵入される危険が残る。監視も通常に戻すと、二度目の停止を自分たちで招くことになる。', en: '' }
      - id: p12-wait-alt
        text: { ja: '検証完了を待って段階再開し、待つ間の代替手段を取引先に案内し、点検結果も共有する。', en: '' }
        minutes: 210
        category: recover
        points: 120
        refs: [nist-sp800-61r3, meti-csm-guideline]
        gauges: { damage: -15, trust: 10, stamina: -15 }
        setFlags: { verifiedResume: true }
        items:
          - { id: p12-c-order, points: 8, axis: order, refs: [nist-sp800-61r3] }
          - { id: p12-c-care, points: 8, axis: care, refs: [meti-csm-guideline] }
          - { id: p12-c-record, points: 5, axis: record, refs: [jpcert-handling] }
        explain: { ja: '検証を待つ間の代替手段を案内し、段階再開と点検結果の共有まで組み立てている。遅れの理由と安全の根拠を同時に示した点が信頼につながる。', en: '' }
      - id: p12-wait
        text: { ja: '親会社の検証完了を待ち、権限を絞った状態から段階的に業務を再開する。', en: '' }
        minutes: 150
        category: maintain
        points: 30
        refs: [nist-sp800-61r3]
        gauges: { damage: -10, trust: 5, stamina: -10 }
        items:
          - { id: p12-b-order, points: 8, axis: order, refs: [nist-sp800-61r3] }
          - { id: p12-b-record, points: 5, axis: record, refs: [jpcert-handling] }
        explain: { ja: '検証を待ち権限を絞って段階再開する判断は安全側になる。ただ待つ間の代替手段と点検結果の共有がなく、取引先には遅れの理由が見えない。', en: '' }
    lesson: { ja: '再開は検証の終わりを待ち、権限を絞った状態から段階的に戻す。待つ間の代替手段を取引先に案内し、再開前の点検結果を共有すれば、遅れの理由も伝わる。全面再開と通常監視への即時復帰は、二度目の停止を招く。', en: '' }

  - id: p13-compensation
    at: { day: 10, minutes: 600 }
    phase: recover
    sound: { se: [phone_ring] }
    text: { ja: '午前10時。業務が止まった間の取引先の損失をどう補償するか。親会社は「グループで一本化する」と言う。自社の取引先に、どこまで出すか。', en: '' }
    voices: [v13-vendor, v13-public, v13-ok]
    choices:
      - id: p13-none
        text: { ja: '補償は親会社に任せ、自社の取引先には何も出さないままにする。', en: '' }
        minutes: 60
        category: hurt
        points: -150
        refs: [ppc-notify-person]
        gauges: { flame: 20, trust: -15 }
        items:
          - { id: p13-a-care, points: -10, axis: care, refs: [ppc-notify-person] }
          - { id: p13-a-care2, points: -10, axis: care, refs: [meti-csm-guideline] }
        explain: { ja: '補償を親会社に任せきりにすると、自社の取引先との関係が修復されない。取引先は自社に業務を預けており、損失の穴を埋める相手は自社でもある。', en: '' }
      - id: p13-share
        text: { ja: '取引先と費用を分担し、共同の相談窓口を設けて話し合いを続ける。', en: '' }
        minutes: 120
        category: recover
        points: 100
        refs: [ppc-notify-person]
        gauges: { flame: -5, trust: 5, stamina: -10 }
        setFlags: { compensation: true }
        items:
          - { id: p13-b-care, points: 8, axis: care, refs: [ppc-notify-person] }
          - { id: p13-b-order, points: 5, axis: order, refs: [meti-csm-guideline] }
        explain: { ja: '費用を分担し相談窓口を設ける形は、取引先との関係を保ちながら話を進められる。ただ損失の幅に応じた配分が見えておらず、納得を得るには説明が要る。', en: '' }
      - id: p13-tier
        text: { ja: '損失に応じた段階補償を決め、説明会と相談窓口を用意して案内する。', en: '' }
        minutes: 180
        category: recover
        points: 150
        refs: [ppc-notify-person]
        gauges: { flame: -10, trust: 15, stamina: -10 }
        setFlags: { compensation: true, tieredCompensation: true }
        items:
          - { id: p13-c-care, points: 8, axis: care, refs: [ppc-notify-person] }
          - { id: p13-c-care2, points: 8, axis: care, refs: [ppc-notify-person] }
          - { id: p13-c-order, points: 5, axis: order, refs: [meti-csm-guideline] }
        explain: { ja: '損失に応じた段階補償を決め、説明会と窓口まで用意している。取引先ごとの事情に合わせた配分と説明の場がそろい、納得を得やすい形になる。', en: '' }
    lesson: { ja: '補償は金額の多寡より、決め方と説明の仕方が問われる。損失に応じた段階を決め、説明会と相談窓口を用意する。親会社に任せきりにすると、自社の取引先との関係が修復されない。一律か段階かは、取引先ごとの事情で決める。', en: '' }

  - id: p14-staff
    at: { day: 12, minutes: 600 }
    phase: recover
    sound: { se: [notify_chat] }
    text: { ja: '午前10時。親会社から「同じ管理者権限を持っていた自社の派遣スタッフは、全員交代させろ」と言われた。現場のスタッフの大半は派遣と業務委託で、全員を替えれば業務が止まる。', en: '' }
    voices: [v14-parent, v14-field, v14-ok]
    choices:
      - id: p14-replace-care
        text: { ja: '該当者だけを外し、残るスタッフへの説明と休暇・交代を用意し、取引先への引き継ぎを記録する。', en: '' }
        minutes: 180
        category: recover
        points: 120
        refs: [no07-ipa-insider, ipa-sme-guideline]
        gauges: { damage: -10, trust: 10, stamina: 15 }
        setFlags: { staffRotated: true, staffCare: true }
        items:
          - { id: p14-c-care, points: 8, axis: care, refs: [ipa-sme-guideline] }
          - { id: p14-c-order, points: 8, axis: order, refs: [no07-ipa-insider] }
          - { id: p14-c-record, points: 5, axis: record, refs: [jpcert-handling] }
        explain: { ja: '該当者だけを外し、残るスタッフの負担と交代計画まで用意している。引き継ぎを記録に残したことで、取引先への回答が止まらない設計になった。', en: '' }
      - id: p14-replace-all
        text: { ja: '親会社の指示どおり全員を即時に交代させ、引き継ぎの整理は現場の判断に任せる。', en: '' }
        minutes: 120
        category: hurt
        points: -120
        refs: [no07-dispatch-law]
        gauges: { damage: 10, trust: -10, stamina: -10 }
        delayed:
          - { afterPhases: 1, points: -40, gauges: { trust: -10 }, reason: { ja: '交代したスタッフの引き継ぎが回らず、取引先への回答が止まった。', en: '' } }
        items:
          - { id: p14-a-order, points: -10, axis: order, refs: [no07-dispatch-law] }
          - { id: p14-a-care, points: -10, axis: care, refs: [ipa-sme-guideline] }
        explain: { ja: '権限を持っていたという理由で全員を替えると、業務の知識が一度に失われる。引き継ぎを現場任せにすると、取引先への回答が止まり被害が広がる。', en: '' }
      - id: p14-replace-step
        text: { ja: '該当する権限を持つスタッフだけを外し、残る現場の負担を見ながら交代を段階的に進める。', en: '' }
        minutes: 120
        category: maintain
        points: 30
        refs: [no07-ipa-insider]
        gauges: { damage: -5, trust: 5, stamina: -10 }
        setFlags: { staffRotated: true }
        items:
          - { id: p14-b-order, points: 8, axis: order, refs: [no07-ipa-insider] }
          - { id: p14-b-record, points: 5, axis: record, refs: [jpcert-handling] }
        explain: { ja: '該当者だけを外し交代を段階的に進める判断は、業務を止めない。ただ残るスタッフへの説明と休暇の用意がなく、現場の負担が片寄る。', en: '' }
    lesson: { ja: '同じ権限を持っていたという理由で全員を替えると、引き継ぎが回らず取引先への回答が止まる。該当者だけを外し、残るスタッフへの説明と休暇、交代の計画を用意する。人の入れ替えは、業務を止めない設計と一緒に進める。', en: '' }

  - id: p15-report
    at: { day: 30, minutes: 600 }
    phase: after
    sound: { se: [notify_news] }
    text: { ja: '午前10時。第三者委員会の調査報告書が完成した。自社部分には、権限確認の不足と、兼任体制の限界が並ぶ。公開範囲と、自社分の確報の提出を決める。', en: '' }
    voices: [v15-expert, v15-law, v15-ok]
    choices:
      - id: p15-hide
        text: { ja: '自社部分は公開せず、自社分の確報に報告者として入っているかどうかも確認しないままにする。', en: '' }
        minutes: 60
        category: fatal
        points: -250
        refs: [meti-disclosure-guidance]
        gauges: { flame: 15, trust: -20 }
        setFlags: { hidReport: true }
        items:
          - { id: p15-a-content, points: -20, axis: content, refs: [meti-disclosure-guidance] }
          - { id: p15-a-record, points: -10, axis: record, refs: [jpcert-handling] }
        explain: { ja: '自社部分を伏せると、調査の結論を自分たちで選んだことになる。確報の記載まで確認しないままでは、報告の主体が抜けた状態で手続きが終わってしまう。', en: '' }
      - id: p15-publish-share
        text: { ja: '自社部分を公開して確報を出し、再発防止の進捗を毎月公開し、グループ会社向けに教訓を共有する。', en: '' }
        minutes: 240
        category: increase
        points: 400
        fatalAlternate: 60
        refs: [meti-disclosure-guidance, no07-ipa-insider]
        gauges: { flame: -15, trust: 20, stamina: -15 }
        setFlags: { fullDisclosure: true, ppcFinalFiled: true, industryShare: true }
        items:
          - { id: p15-c-content, points: 8, axis: content, refs: [meti-disclosure-guidance] }
          - { id: p15-c-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: p15-c-content2, points: 5, axis: content, refs: [no07-ipa-insider] }
        explain: { ja: '自社部分の公開と確報に加え、再発防止の進捗を毎月示し、グループ会社へ教訓を共有している。説明を一度で終わらせず、次の事故を減らす活動までつないだ点が最も強い。', en: '' }
      - id: p15-publish
        text: { ja: '攻撃に使える部分だけを伏せて自社部分を公開し、自社分の確報をまとめて提出する。', en: '' }
        minutes: 180
        category: recover
        points: 120
        refs: [meti-disclosure-guidance]
        gauges: { flame: -10, trust: 15, stamina: -10 }
        setFlags: { fullDisclosure: true, ppcFinalFiled: true }
        items:
          - { id: p15-b-content, points: 8, axis: content, refs: [meti-disclosure-guidance] }
          - { id: p15-b-record, points: 5, axis: record, refs: [jpcert-handling] }
        explain: { ja: '攻撃に使える部分だけを伏せて公開し、確報を出す対応は適切になる。ただ再発防止の進捗や他社への共有がなく、説明はこの時点で止まってしまう。', en: '' }
    lesson: { ja: '調査報告の自社部分は、権限確認の不足と兼任体制の限界を含む。攻撃に使える部分だけを伏せて公開し、自社分の確報を出す。再発防止の進捗を毎月示し、グループ会社に教訓を共有するところまでが説明になる。伏せた報告は再発の機会を残す。', en: '' }

  - id: p16-prevention
    at: { day: 30, minutes: 900 }
    phase: after
    sound: { se: [notify_chat] }
    text: { ja: '午後3時。再発防止の予算をどう取るか。専任のセキュリティ担当を置くか、外部に頼るか。親会社は「グループ共通の仕組みで足りる」と言う。', en: '' }
    voices: [v16-parent, v16-past, v16-ok]
    choices:
      - id: p16-none
        text: { ja: '親会社の共通施策に任せきりにし、自社では再発防止のための予算を取らないままにする方針を取る。', en: '' }
        minutes: 60
        category: hurt
        points: -100
        refs: [ipa-sme-guideline]
        gauges: { trust: -10, flame: 5 }
        items:
          - { id: p16-a-content, points: -10, axis: content, refs: [ipa-sme-guideline] }
          - { id: p16-a-record, points: -8, axis: record, refs: [no07-ipa-insider] }
        explain: { ja: 'グループ共通の仕組みは、自社の運用の穴を埋めない。予算を取らない判断は、兼任のまま次の点検も回らない状態を固定し、再発の準備を残す。', en: '' }
      - id: p16-budget
        text: { ja: '兼任の担当を決め、権限の棚卸しと外部の相談先との契約を自社の予算に載せて、来期から少しずつ実行に移す。', en: '' }
        minutes: 120
        category: maintain
        points: 30
        refs: [ipa-sme-guideline]
        gauges: { trust: 5, stamina: -10 }
        setFlags: { ownBudget: true }
        items:
          - { id: p16-b-content, points: 8, axis: content, refs: [ipa-sme-guideline] }
          - { id: p16-b-order, points: 5, axis: order, refs: [meti-csm-guideline] }
          - { id: p16-b-record, points: 5, axis: record, refs: [no07-ipa-insider] }
        explain: { ja: '権限の棚卸しと外部の相談先を予算に載せる判断は、再発防止を実行に移す一歩になる。ただ点検を続ける周期と結果の公開がなく、続くかどうかが見えない。', en: '' }
      - id: p16-budget-plan
        text: { ja: '兼任の担当と外部相談先を置き、権限の棚卸しと外部書き出しの制限を四半期ごとに続け、結果を取引先に公開する。', en: '' }
        minutes: 180
        category: recover
        points: 120
        refs: [ipa-sme-guideline, meti-csm-guideline]
        gauges: { trust: 15, stamina: -15 }
        setFlags: { ownBudget: true, quarterlyReview: true }
        items:
          - { id: p16-c-content, points: 8, axis: content, refs: [ipa-sme-guideline] }
          - { id: p16-c-record, points: 8, axis: record, refs: [no07-ipa-insider] }
          - { id: p16-c-order, points: 5, axis: order, refs: [meti-csm-guideline] }
        explain: { ja: '担当と外部相談先を置き、点検を四半期ごとに続けて結果まで公開している。再発防止が一度の施策で終わらず、取引先にも検証できる形になった点が強い。', en: '' }
    lesson: { ja: 'グループ共通の仕組みは、自社の運用の穴を埋めない。兼任の担当と外部の相談先を置き、権限の棚卸しと外部媒体への書き出し制限を四半期ごとに続ける。結果を取引先に公開すれば、再発防止が約束で終わらない。予算を取らない判断は、次の事故の準備になる。', en: '' }

  - id: p17-pressprep
    at: { day: 31, minutes: 540 }
    phase: after
    sound: { se: [shutter] }
    text: { ja: '午前9時。記者会見を控え、親会社の社長と同席する。広報の藤崎が「質問は四問、二十分で終わらせたい」と言う。手元に置く記録と、最初に述べることを決める。', en: '' }
    voices: [v17-flattery, v17-coward, v17-ok]
    choices:
      - id: p17-ready
        text: { ja: '記録を手元に置き、想定問答を親会社とすり合わせる。最初に取引先とその顧客への謝罪を述べる。', en: '' }
        minutes: 150
        category: recover
        points: 120
        refs: [meti-csm-guideline, jpcert-handling]
        gauges: { flame: -10, trust: 10, stamina: -10 }
        detail: press-statement
        setFlags: { pressReady: true, apologyFirst: true }
        items:
          - { id: p17-c-order, points: 8, axis: order, refs: [meti-csm-guideline] }
          - { id: p17-c-care, points: 8, axis: care, refs: [meti-csm-guideline] }
          - { id: p17-c-wording, points: 8, axis: wording, refs: [jpcert-handling] }
        explain: { ja: '記録と想定問答を整え、最初に謝罪を置く順序まで決めている。会見の焦点が被害者に向き、その後の回答も記録に沿ってぶれにくくなる。', en: '' }
      - id: p17-short
        text: { ja: '会見を予定より短く打ち切り、質問の数と時間を制限して、都合の悪い話には触れずに早めに終わらせる。', en: '' }
        minutes: 45
        category: hurt
        points: -80
        refs: [meti-disclosure-guidance]
        gauges: { flame: 15, trust: -10 }
        items:
          - { id: p17-a-care, points: -10, axis: care, refs: [meti-disclosure-guidance] }
          - { id: p17-a-order, points: -8, axis: order, refs: [meti-csm-guideline] }
        explain: { ja: '短く切って質問を制限すると、答えたくないことがあると受け取られる。会見の時間を削るほど、隠しているという印象が強くなる。', en: '' }
      - id: p17-facts
        text: { ja: '記録を手元に置き、事実だけを答え、不明な点は確認してから回答すると伝える。', en: '' }
        minutes: 90
        category: maintain
        points: 30
        refs: [jpcert-handling]
        gauges: { trust: 5, stamina: -10 }
        detail: press-statement
        setFlags: { pressReady: true }
        items:
          - { id: p17-b-wording, points: 8, axis: wording, refs: [jpcert-handling] }
          - { id: p17-b-record, points: 8, axis: record, refs: [jpcert-handling] }
        explain: { ja: '記録に基づき事実だけを答える姿勢は、誤りを減らす。ただ最初に何を述べるかを決めておらず、会見の焦点が被害者ではなく手続きの説明に向きやすい。', en: '' }
    lesson: { ja: '会見では、最初の一文が会見全体の意味を決める。取引先とその顧客への謝罪から述べ、記録を手元に置いて事実だけを答える。想定問答を親会社とすり合わせ、不明点は確認して回答すると伝える。短く切って質問を制限すると、隠していると受け取られる。', en: '' }

