          - { id: pr-t-26h, when: { withinHours: 26 }, points: 8, axis: time, refs: [jpcert-handling] }
          - { id: pr-t-40h, when: { withinHours: 40 }, points: 3, axis: time, refs: [jpcert-handling] }
          - { id: pr-t-late, when: { otherwise: true }, points: -10, axis: time, refs: [jpcert-handling] }
      - id: scope
        label: { ja: '被害の範囲', en: '' }
        options:
          - { id: pr-s-none, text: { ja: '「自社は影響なし」と書き、対象範囲には触れない', en: '' }, points: -20, axis: content, refs: [ppc-report-scope], delayed: { afterPhases: 1, points: -20, reason: { ja: '自社の影響を否定した訂正が必要になった。', en: '' } }, explain: { ja: '影響なしと書けば当面は穏便に見えるが、範囲を伏せた報告は後で訂正が要る。預かったデータの範囲は分けて書くべきだった。', en: '' } }
          - { id: pr-s-split, text: { ja: '自社が預かる取引先データの範囲を、確定分と調査中に分けて書く', en: '' }, points: 10, axis: content, refs: [ppc-report-scope], explain: { ja: '確定分と調査中を分けて書けば、後から範囲が広がっても訂正でなく更新として説明できる。報告の土台になる書き方になる。', en: '' } }
      - id: facts
        label: { ja: '事実と推測の分け方', en: '' }
        options:
          - { id: pr-f-split, text: { ja: '確認できた事実と不明点を分けて書く', en: '' }, points: 8, axis: content, refs: [jpcert-handling], explain: { ja: '事実と不明点を分けると、読み手は何が確定していて何がこれから分かるのかを判断できる。調査の進行に耐える書き方になる。', en: '' } }
          - { id: pr-f-guess, text: { ja: '推測も確認済みの事実と同じ調子で書く', en: '' }, points: -10, axis: wording, refs: [jpcert-handling], explain: { ja: '推測を事実と同じ調子で書くと、後で覆ったときに報告全体の信用が落ちる。断定を避けて分けるのが基本になる。', en: '' } }
      - id: entry
        label: { ja: '侵入経路の書き方', en: '' }
        options:
          - { id: pr-e-fixed, text: { ja: '入口は自社の端末だと断定して、調査中とは書かない', en: '' }, points: -10, axis: wording, refs: [jpcert-handling], explain: { ja: '入口を自社の端末と断定すると、調査で別の経路が出たときに訂正が要る。特定前は可能性として書くべきだった。', en: '' } }
          - { id: pr-e-maybe, text: { ja: '親会社のセンター基盤経由の可能性があり、調査中と書く', en: '' }, points: 8, axis: content, refs: [jpcert-handling], explain: { ja: '侵入経路は調査中と書き、可能性の幅を残すのが正確な報告になる。断定を避けることで後の更新も自然にできる。', en: '' } }
      - id: clients
        label: { ja: '取引先への言及', en: '' }
        options:
          - { id: pr-c-impact, text: { ja: '取引先への影響と、通知の要否を書く', en: '' }, points: 8, axis: content, refs: [meti-csm-guideline], explain: { ja: '取引先への影響と通知の要否まで書くと、親会社も次の判断をしやすい。報告は自社だけで閉じず、先の対応につなげたい。', en: '' } }
          - { id: pr-c-none, text: { ja: '取引先への言及は避け、影響の有無も書かない', en: '' }, points: -15, axis: content, refs: [ppc-notify-person], explain: { ja: '取引先への言及を落とすと、通知の要否を検討した記録が残らない。後で説明を求められたときに根拠を示せなくなる。', en: '' } }
      - id: ask
        label: { ja: '親会社への要請', en: '' }
        options:
          - { id: pr-a-none, text: { ja: '親会社への要請は書かず、自社で抱える', en: '' }, points: -5, axis: order, refs: [meti-csm-guideline], explain: { ja: '要請を書かないと、自社だけで抱える前提の報告になる。人員の薄い会社ほど応援の依頼は早く出すべきだった。', en: '' } }
          - { id: pr-a-resource, text: { ja: '調査の資源と取引先対応の応援を頼む', en: '' }, points: 5, axis: order, refs: [meti-csm-guideline], explain: { ja: '調査の資源と応援を具体的に求めると、グループ内の役割分担が動き出す。遠慮した報告は実行につながらない。', en: '' } }
      - id: contact
        label: { ja: '窓口', en: '' }
        options:
          - { id: pr-w-own, text: { ja: '自社の窓口と、連絡できる時間帯を書く', en: '' }, points: 5, axis: order, refs: [jpcert-handling], explain: { ja: '自社の窓口と連絡できる時間を示すと、親会社も取引先も次の一報を迷わない。連絡経路の明示は初報の要になる。', en: '' } }
          - { id: pr-w-parent, text: { ja: '連絡は親会社に任せると書く', en: '' }, points: -8, axis: order, refs: [jpcert-handling], explain: { ja: '連絡を親会社に任せると書くと、自社の窓口が空白になる。取引先は直接の取引先である自社に問い合わせてくる。', en: '' } }
      - id: record
        label: { ja: '記録', en: '' }
        options:
          - { id: pr-r-none, text: { ja: '提出した記録は残さず、口頭で伝える', en: '' }, points: -8, axis: record, refs: [jpcert-handling], explain: { ja: '記録がないと、いつ何を出したかを説明できない。訂正や追加の報告のときに自社が困るのはこの一点になる。', en: '' } }
          - { id: pr-r-log, text: { ja: '提出の時刻と版を手元の記録に残す', en: '' }, points: 5, axis: record, refs: [jpcert-handling], explain: { ja: '提出の時刻と版を残すと、後から内容の変遷をたどれる。報告は出して終わりではなく、履歴で信用を支える。', en: '' } }
      - id: tone
        label: { ja: '書き出し', en: '' }
        options:
          - { id: pr-t-apology, text: { ja: '謝罪と事実を分けて、落ち着いて書く', en: '' }, points: 5, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: '謝罪と事実を分けて書くと、感情と情報が混ざらず読み手に届く。書き出しの整理は報告全体の印象を決める。', en: '' } }
          - { id: pr-t-excuse, text: { ja: '事情の説明と言い訳を先に書く', en: '' }, points: -10, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: '言い訳を先に置くと、読む側は事実にたどり着く前に身構える。事情は事実の後に短く添えるのが適切だった。', en: '' } }
      - id: staff
        label: { ja: '現場の負担', en: '' }
        options:
          - { id: pr-p-none, text: { ja: '現場の負担には触れず、業務の話だけ書く', en: '' }, points: -5, axis: care, refs: [ipa-sme-guideline], explain: { ja: '現場の負担に触れないと、聞き取りの負荷が報告から消える。実務を回す人の余力は早い段階で共有したい。', en: '' } }
          - { id: pr-p-staff, text: { ja: '現場の負担と、交代の必要性を書く', en: '' }, points: 5, axis: care, refs: [ipa-sme-guideline], explain: { ja: '現場の負担と交代の必要性まで書くと、親会社も人員の支援を判断しやすい。報告は人を動かす材料にもなる。', en: '' } }
      - id: approval
        label: { ja: '社内確認', en: '' }
        options:
          - { id: pr-i-check, text: { ja: '自社の総務と顧問弁護士、親会社の担当で確認する', en: '' }, points: 5, axis: order, refs: [meti-csm-guideline], explain: { ja: '総務と顧問弁護士、親会社の担当で確認すると、事実誤認と法的な抜けを同時に減らせる。初報ほど確認が効く。', en: '' } }
          - { id: pr-i-solo, text: { ja: '社長の判断だけで、確認を取らずに出す', en: '' }, points: -10, axis: order, refs: [meti-csm-guideline], explain: { ja: '社長の判断だけで出すと、事実の裏取りと法務の確認が省かれる。速さは出るが、訂正の危険を一人で抱える。', en: '' } }
      - id: next
        label: { ja: '次の報告', en: '' }
        options:
          - { id: pr-n-none, text: { ja: '次回の報告予定は書かない', en: '' }, points: -5, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '次回の予定がないと、相手はいつ連絡が来るか分からず不安になる。区切りの約束は報告の一部として書くべきだ。', en: '' } }
          - { id: pr-n-next, text: { ja: '次の報告の予定を書く', en: '' }, points: 3, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '次の報告予定を書くと、読み手は待つべき時点を知れる。区切りを約束する報告は信頼の土台になる。', en: '' } }
  client-notice:
    title: { ja: '取引先向け一次通知の文案', en: '' }
    slots:
      - id: timing
        label: { ja: '送る時刻', en: '' }
        auto: true
        items:
          - { id: cn-t-42h, when: { withinHours: 42 }, points: 10, axis: time, refs: [ppc-report-prelim] }
          - { id: cn-t-48h, when: { withinHours: 48 }, points: 3, axis: time, refs: [ppc-report-prelim] }
          - { id: cn-t-late, when: { otherwise: true }, points: -15, axis: time, refs: [ppc-report-prelim] }
      - id: scope
        label: { ja: '対象範囲', en: '' }
        options:
          - { id: cn-s-all, text: { ja: '10年にわたり持ち出された可能性のある全取引先と全期間を対象にする', en: '' }, points: 10, axis: content, refs: [ppc-report-scope], explain: { ja: '全取引先と全期間を対象にすると、後から対象が増えても説明がぶれない。広めに取る判断は通知の信頼を守る。', en: '' } }
          - { id: cn-s-recent, text: { ja: '対象は直近1年分に限り、それ以前の分はすべて含めない', en: '' }, points: -15, axis: content, refs: [ppc-report-scope], delayed: { afterPhases: 1, points: -20, reason: { ja: '対象の追加連絡が必要になり、説明が二度手間になった。', en: '' } }, explain: { ja: '直近1年分に絞ると、対象の追加連絡が必ず要る。狭く見せたい気持ちは説明の二度手間として返ってくる。', en: '' } }
      - id: leaked
        label: { ja: '持ち出された項目', en: '' }
        options:
          - { id: cn-l-vague, text: { ja: '「顧客情報の一部」とだけぼかして書く', en: '' }, points: -10, axis: content, refs: [ppc-report-prelim], explain: { ja: '「一部」とぼかすと、取引先は自社の顧客に何を伝えるか決められない。具体性の不足は問い合わせを増やす。', en: '' } }
          - { id: cn-l-specific, text: { ja: '氏名と住所、電話番号、通話履歴を具体的に列挙する', en: '' }, points: 10, axis: content, refs: [ppc-report-prelim], explain: { ja: '項目を具体的に列挙すると、取引先は顧客への説明を組み立てられる。何が出たかが分かる通知が役に立つ。', en: '' } }
      - id: dates
        label: { ja: '日時の書き方', en: '' }
        options:
          - { id: cn-d-split, text: { ja: '持ち出しが始まった時期と、判明した日時を分けて書く', en: '' }, points: 5, axis: content, refs: [jpcert-handling], explain: { ja: '始まった時期と判明した日時を分けると、被害の広がりと対応の速さを別々に説明できる。整理された通知になる。', en: '' } }
          - { id: cn-d-merge, text: { ja: '発生と判明の時期を、まとめて一行で書く', en: '' }, points: -8, axis: wording, refs: [jpcert-handling], explain: { ja: '発生と判明をまとめると、いつ何が分かったのかが読み取れない。説明の土台になる時系列は分けて書くべきだ。', en: '' } }
      - id: certainty
        label: { ja: '断定の強さ', en: '' }
        options:
          - { id: cn-c-confirm, text: { ja: 'すべて「持ち出しを確認」と断定して書く', en: '' }, points: -10, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: 'すべて確認と断定すると、後で覆ったときに通知全体が疑われる。不確かな部分は可能性として書くべきだ。', en: '' } }
          - { id: cn-c-maybe, text: { ja: '「可能性」と「確認」の語を使い分ける', en: '' }, points: 5, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: '可能性と確認を使い分けると、未確定の部分を断定せずに伝えられる。正確さが通知の信頼を支える。', en: '' } }
          - { id: cn-c-none, text: { ja: '「持ち出しはない」と書いて被害を否定する', en: '' }, points: -20, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: '持ち出しはないと書くと、事実と違えば取り返しがつかない。否定の断定は最も慎重に扱うべき表現になる。', en: '' } }
      - id: action
        label: { ja: '顧客が今すぐすること', en: '' }
        options:
          - { id: cn-a-concrete, text: { ja: '顧客が行うこと（不審な電話や郵便への注意と問い合わせ先）を具体的に書く', en: '' }, points: 10, axis: care, refs: [ppc-notify-person], explain: { ja: '顧客が何をすればよいかを具体的に書くと、受け取った側はそのまま動ける。行動の指示までが通知の役割だ。', en: '' } }
          - { id: cn-a-generic, text: { ja: '「注意してください」とだけ書いて、具体的な行動は示さない', en: '' }, points: -10, axis: care, refs: [ppc-notify-person], explain: { ja: '「注意してください」だけでは、顧客は何を警戒すればよいか分からない。具体的な行動を示してこそ通知になる。', en: '' } }
      - id: phishing
        label: { ja: '偽の連絡への注意', en: '' }
        options:
          - { id: cn-p-none, text: { ja: '偽の連絡への注意は書かず、本物の案内だけにする', en: '' }, points: -10, axis: care, refs: [ppc-notify-person], explain: { ja: '偽の連絡への注意を落とすと、名簿を知る相手からの電話に顧客が応じてしまう。二次被害の入口を閉じたい。', en: '' } }
          - { id: cn-p-warn, text: { ja: '「当社や取引先が電話で暗証番号を聞くことはない」と書く', en: '' }, points: 8, axis: care, refs: [ppc-notify-person], explain: { ja: '暗証番号を聞かないと明示すると、偽の電話が来ても顧客は判断できる。二次被害を防ぐ一文として効く。', en: '' } }
      - id: contact
        label: { ja: '問い合わせ窓口', en: '' }
        options:
          - { id: cn-w-number, text: { ja: '専用窓口の番号だけを書く', en: '' }, points: -5, axis: care, refs: [meti-csm-guideline], explain: { ja: '番号だけでは、繋がらない時間に何度も掛け直す顧客が出る。受付時間の明示は窓口の質を左右する。', en: '' } }
          - { id: cn-w-hours, text: { ja: '専用窓口の番号と受付時間を書く', en: '' }, points: 5, axis: care, refs: [meti-csm-guideline], explain: { ja: '番号と受付時間を示すと、顧客はいつ掛ければよいか分かる。増員まで書けば待たせる不安も減らせる。', en: '' } }
          - { id: cn-w-none, text: { ja: '問い合わせの窓口は書かない', en: '' }, points: -15, axis: care, refs: [meti-csm-guideline], explain: { ja: '窓口を書かないと、顧客は取引先か自社のどこに聞けばよいか分からない。通知の最後に必ず置くべき情報だ。', en: '' } }
      - id: parent
        label: { ja: '親会社への言及', en: '' }
        options:
          - { id: cn-g-joint, text: { ja: '親会社との共同調査と責任分界を書く', en: '' }, points: 8, axis: order, refs: [no07-dispatch-law], explain: { ja: '共同調査と責任分界まで書くと、取引先は誰が何を調べているかを理解できる。関係の説明が安心につながる。', en: '' } }
          - { id: cn-g-hide, text: { ja: '親会社の関与は伏せて、自社の話だけ書く', en: '' }, points: -10, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: '親会社の関与を伏せると、後で分かったときに隠した印象が残る。関係は事実として書き、役割を分けて説明したい。', en: '' } }
      - id: next
        label: { ja: '次の連絡', en: '' }
        options:
          - { id: cn-n-none, text: { ja: '次回の連絡予定は書かない', en: '' }, points: -5, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '次回の予定がないと、取引先は追加の情報をいつ得られるか分からない。更新の約束は通知の一部として書くべきだ。', en: '' } }
          - { id: cn-n-next, text: { ja: '次の連絡の予定を書く', en: '' }, points: 3, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '次の連絡予定を書くと、取引先は情報を待つ間の心構えができる。区切りの約束は問い合わせの集中も和らげる。', en: '' } }
      - id: apology
        label: { ja: '謝罪の主語', en: '' }
        options:
          - { id: cn-ap-company, text: { ja: '「当社」として謝罪する', en: '' }, points: 3, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: '「当社」として謝罪すると、預かった立場の責任が明確になる。主語の選択が責任の所在を示す。', en: '' } }
          - { id: cn-ap-parent, text: { ja: '「親会社」の責任として書く', en: '' }, points: -10, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: '「親会社」の責任として書くと、自社の預かり責任が抜け落ちる。取引先は自社との契約で動いている。', en: '' } }
      - id: approval
        label: { ja: '社内確認', en: '' }
        options:
          - { id: cn-i-solo, text: { ja: '担当者の判断で、確認を取らずに即送る', en: '' }, points: -10, axis: order, refs: [meti-csm-guideline], explain: { ja: '担当者の判断で即送ると、速さは出るが文面の誤りがそのまま届く。対外的な通知ほど確認を挟みたい。', en: '' } }
          - { id: cn-i-share, text: { ja: '送付の前に総務と顧問弁護士、主要取引先の確認を取る', en: '' }, points: 5, axis: order, refs: [meti-csm-guideline], explain: { ja: '総務と顧問弁護士、主要取引先の確認を取ると、文面の誤解と事実誤認を減らせる。送る前の確認が効く。', en: '' } }
      - id: record
        label: { ja: '記録', en: '' }
        options:
          - { id: cn-r-log, text: { ja: '送付した時刻と版を記録に残す', en: '' }, points: 5, axis: record, refs: [jpcert-handling], explain: { ja: '送付の時刻と版を残すと、後から文面の変遷をたどれる。訂正が必要になったときの土台になる。', en: '' } }
          - { id: cn-r-none, text: { ja: '送付の記録は残さない', en: '' }, points: -8, axis: record, refs: [jpcert-handling], explain: { ja: '記録がなければ、いつ何を送ったかを説明できない。通知は送った後にも説明を求められる。', en: '' } }
  press-statement:
    title: { ja: '記者会見で最初に述べる文', en: '' }
    slots:
      - id: opening
        label: { ja: '最初に述べること', en: '' }
        options:
          - { id: pst-o-victim, text: { ja: '取引先と顧客への謝罪から入る', en: '' }, points: 10, axis: care, refs: [meti-disclosure-guidance], explain: { ja: '取引先とその顧客への謝罪から始めると、会見の焦点が被害に置かれる。最初の一文が誠意の印象を決める。', en: '' } }
          - { id: pst-o-self, text: { ja: '自社の被害の説明から述べ始める', en: '' }, points: -10, axis: care, refs: [meti-disclosure-guidance], explain: { ja: '自社の被害から語り始めると、聞き手には自分たちの話に聞こえる。まず謝罪を置く順序が求められた。', en: '' } }
      - id: facts
        label: { ja: '事実の述べ方', en: '' }
        options:
          - { id: pst-f-guess, text: { ja: '推測も交えて説明する', en: '' }, points: -10, axis: wording, refs: [jpcert-handling], explain: { ja: '推測を交えると、臆測が事実として引用されうる。会見の言葉はそのまま記録に残る前提で選ぶべきだった。', en: '' } }
          - { id: pst-f-confirmed, text: { ja: '確認できた事実だけを述べる', en: '' }, points: 10, axis: content, refs: [jpcert-handling], explain: { ja: '確認できた事実だけを述べると、後で覆る危険が減る。会見では断定の範囲を狭く保つのが安全だ。', en: '' } }
      - id: scope
        label: { ja: '対象の範囲', en: '' }
        options:
          - { id: pst-s-own, text: { ja: '自社が預かる取引先と対象期間を明示する', en: '' }, points: 8, axis: content, refs: [ppc-report-scope], explain: { ja: '自社が預かる取引先と対象期間を示すと、責任の範囲が具体的に伝わる。曖昧さを残さない説明が信頼を生む。', en: '' } }
          - { id: pst-s-group, text: { ja: '「グループ全体」とだけ述べる', en: '' }, points: -8, axis: content, refs: [ppc-report-scope], explain: { ja: '「グループ全体」とだけ述べると、自社の範囲がどこか分からない。預かった立場の説明が抜けてしまう。', en: '' } }
      - id: parent
        label: { ja: '親会社との関係', en: '' }
        options:
          - { id: pst-p-blame, text: { ja: '親会社の責任だとして、自社の関与には触れない', en: '' }, points: -10, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: '親会社の責任だとだけ述べると、自社の預かり責任が消える。取引先は自社との契約で業務を預けている。', en: '' } }
          - { id: pst-p-split, text: { ja: '親会社との責任分界と共同調査を述べる', en: '' }, points: 8, axis: order, refs: [no07-dispatch-law], explain: { ja: '責任分界と共同調査の枠組みを述べると、親会社との役割が伝わる。関係を説明することが自社の立場を守る。', en: '' } }
      - id: unknown
        label: { ja: '不明点の扱い', en: '' }
        options:
          - { id: pst-u-later, text: { ja: '不明点は確認し改めて答えると述べる', en: '' }, points: 8, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '不明点は確認して改めて答えると述べると、その場の沈黙より信頼される。誠実さは回答の仕方に出る。', en: '' } }
          - { id: pst-u-none, text: { ja: '「把握していない」とだけ答えて終える', en: '' }, points: -8, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '「把握していない」で終えると、調べる意思がないように聞こえる。確認して答える姿勢を示すべき場面だった。', en: '' } }
      - id: victims
        label: { ja: '顧客への言及', en: '' }
        options:
          - { id: pst-v-none, text: { ja: '取引先の顧客への言及は避けて終える', en: '' }, points: -10, axis: care, refs: [ppc-notify-person], explain: { ja: '顧客への言及を避けると、会見は自社の弁明に見える。被害を受けた人への説明が抜けたままになる。', en: '' } }
          - { id: pst-v-care, text: { ja: '取引先の顧客への影響と窓口を示す', en: '' }, points: 10, axis: care, refs: [ppc-notify-person], explain: { ja: '取引先の顧客への影響と相談窓口を述べると、会見が被害者のための場になる。誰のために話すかが伝わる。', en: '' } }
      - id: prevention
        label: { ja: '再発防止', en: '' }
        options:
          - { id: pst-r-plan, text: { ja: '権限の棚卸しと外部相談先の確保を、時期と担当つきで述べる', en: '' }, points: 8, axis: content, refs: [no07-ipa-insider], explain: { ja: '時期と担当を示すと、再発防止が約束ではなく計画として伝わる。具体性が再発防止策の説得力を決める。', en: '' } }
          - { id: pst-r-slogan, text: { ja: '「再発防止に努める」とだけ述べて締めくくる', en: '' }, points: -8, axis: content, refs: [ipa-sme-guideline], explain: { ja: '「努める」だけでは、何をいつ誰がするのか分からない。再発防止は具体策と期限まで示してこそ伝わる。', en: '' } }
      - id: record
        label: { ja: '記録の確認', en: '' }
        options:
          - { id: pst-rec-none, text: { ja: '記録を持たず、記憶だけで答える', en: '' }, points: -8, axis: record, refs: [jpcert-handling], explain: { ja: '記録を持たずに答えると、記憶違いがそのまま発言として残る。日時や件数は必ず手元で確認したい。', en: '' } }
          - { id: pst-rec-check, text: { ja: '記録と時刻を確認して答える', en: '' }, points: 5, axis: record, refs: [jpcert-handling], explain: { ja: '手元の記録と時刻を確認してから答えると、誤りの少ない回答になる。会見でも記録に基づく姿勢が信用になる。', en: '' } }
      - id: apology
        label: { ja: '謝罪の主語', en: '' }
        options:
          - { id: pst-a-own, text: { ja: '「当社」として謝罪する', en: '' }, points: 3, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: '「当社」として謝罪すると、預かった立場の責任が明確になる。主語が責任の所在を伝える。', en: '' } }
          - { id: pst-a-parent, text: { ja: '「親会社」として謝罪する', en: '' }, points: -10, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: '「親会社」として謝罪すると、自社の預かり責任が抜ける。取引先は自社に業務を預けている。', en: '' } }
      - id: next
        label: { ja: '次の説明', en: '' }
        options:
          - { id: pst-n-none, text: { ja: '次回の予定は述べない', en: '' }, points: -5, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '次回の予定を述べないと、説明はそこで途切れる。続報の約束は会見の最後に置くべき一言だった。', en: '' } }
          - { id: pst-n-next, text: { ja: '次の説明の予定を述べる', en: '' }, points: 3, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '次の説明の予定を述べると、記者も読者も続報を待てる。区切りを示すことが会見の信用になる。', en: '' } }
