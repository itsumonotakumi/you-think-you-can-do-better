# No.5 コガネ酒造HD / 役員・グループ会社社長ロール
# プレイヤーは北陸コガネ飲料の社長。グループ共通の受注網が止まり、自社の工場と得意先をどう守るかを扱う。
# 専任のセキュリティ部署は無く、経理兼任の総務部長と外部ベンダー、親会社の情報システム部が頼り。
# 判断ポイント18、細目は choices[].items と drafts の合計で80以上。
estimateMinutes: 35
intro: { ja: 'あなたはコガネ酒造ホールディングスのグループ会社、北陸コガネ飲料株式会社の代表取締役社長。月曜の朝、グループ共通の受注・出荷システムが止まった。自社の工場は動いているが、出荷の指示が出せない。専任の情報システム部はなく、経理を兼ねる総務部長と外部ベンダーが頼りだ。得意先の酒店と飲食店は、年末の商品を待っている。7時45分の電話から、あなたの判断が始まる。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-sub-ppc-prelim
    ref: ppc-report-prelim
    label: { ja: '自社分の漏えい等報告（速報）', en: '' }
    points: -150
    doneFlag: subPpcPrelimFiled
  - id: dl-sub-ppc-final
    ref: ppc-report-final
    label: { ja: '自社分の漏えい等報告（確報）', en: '' }
    points: -150
    doneFlag: subPpcFinalFiled
events:
  - id: ev-competitor
    at: { day: 1, minutes: 720 }
    voices: [v-ev-competitor]
    gauges: { flame: 5 }
    sound: { se: [notify_news] }
    caption: { ja: '競合の営業が、得意先に「うちの樽でよければ」と回り始めている。', en: '' }
  - id: ev-fax
    at: { day: 2, minutes: 1080 }
    voices: [v-ev-fax]
    gauges: { flame: 3 }
    caption: { ja: '得意先からの注文は、FAXで届き続けている。', en: '' }
  - id: ev-cancel
    at: { day: 9, minutes: 600 }
    voices: [v-ev-cancel]
    gauges: { flame: 10 }
    sound: { se: [notify_sns] }
    caption: { ja: '年末商品のキャンセルを検討する、という連絡が入り始めた。', en: '' }
points:
  - id: p01-call
    at: { day: 0, minutes: 465 }
    phase: detect
    sound: { se: [phone_ring] }
    text: { ja: '7時45分。親会社の情報システム部長から電話が入る。「グループ共通の受注・出荷システムが止まりました。サーバーに身代金を求める文書があります。北陸さんの受注も出荷も止まります」。工場のラインは動いている。得意先の酒店からは、年末商品の問い合わせが来ている。', en: '' }
    voices: [v01-parent, v01-public, v01-ok]
    notable:
      - { id: note-first-call, text: { ja: '7時45分、グループ共通の受注・出荷システムが停止。自社の受注と出荷も止まった。', en: '' } }
    choices:
      - id: p01-wait
        text: { ja: '親会社の指示を待ち、自社は様子を見る。', en: '' }
        minutes: 60
        category: hurt
        points: -100
        refs: [jpcert-handling]
        gauges: { flame: 5, trust: -5 }
        coward: true
        setFlags: { delayedCommand: true }
        delayed:
          - { afterPhases: 1, points: -40, gauges: { flame: 10, trust: -10 }, reason: { ja: '出荷できないまま、得意先からの電話が殺到した。', en: '' } }
        items:
          - { id: p01-a-time, points: -10, axis: time, refs: [jpcert-handling] }
          - { id: p01-a-order, points: -8, axis: order, refs: [meti-csm-guideline] }
      - id: p01-check
        text: { ja: '自社の受注・出荷・在庫がどこで止まったかを確かめ、分かった事実を親会社に返す。', en: '' }
        minutes: 45
        category: maintain
        points: 15
        refs: [jpcert-handling]
        gauges: { stamina: -5 }
        setFlags: { subStatusChecked: true }
        items:
          - { id: p01-b-time, points: 5, axis: time, refs: [jpcert-handling] }
          - { id: p01-b-order, points: 5, axis: order, refs: [meti-csm-guideline] }
          - { id: p01-b-record, points: 5, axis: record, refs: [jpcert-handling] }
      - id: p01-check-notice
        text: { ja: '止まった範囲を確かめて親会社に返し、今日の出荷が止まることを得意先に先に伝える段取りを決める。', en: '' }
        minutes: 60
        category: recover
        points: 70
        refs: [meti-csm-guideline, meti-disclosure-guidance]
        gauges: { flame: -5, trust: 10, stamina: -5 }
        setFlags: { subStatusChecked: true, partnerFirstNotice: true }
        items:
          - { id: p01-c-time, points: 8, axis: time, refs: [jpcert-handling] }
          - { id: p01-c-order, points: 8, axis: order, refs: [meti-csm-guideline] }
          - { id: p01-c-care, points: 8, axis: care, refs: [meti-disclosure-guidance] }
          - { id: p01-c-record, points: 5, axis: record, refs: [jpcert-handling] }
      - id: p01-self
        text: { ja: '自分で工場のサーバー室に行き、端末を直接確かめる。', en: '' }
        minutes: 90
        category: hurt
        points: -50
        refs: [jpcert-handling]
        gauges: { stamina: -10, trust: -5 }
        items:
          - { id: p01-d-order, points: -10, axis: order, refs: [jpcert-handling] }
          - { id: p01-d-care, points: -5, axis: care, refs: [meti-csm-guideline] }

  - id: p02-vpn
    at: { day: 0, minutes: 510 }
    phase: contain
    sound: { se: [notify_chat] }
    text: { ja: '8時30分。自社の受注端末は、グループ共通のVPN機器を通っている。切り離せば安全側に寄るが、受注は紙と電話になる。親会社は「まだ原因が分からない」と言う。', en: '' }
    voices: [v02-expert, v02-field, v02-ok]
    choices:
      - id: p02-keep
        text: { ja: '親会社が直すのを待ち、繋いだままにする。', en: '' }
        minutes: 90
        category: hurt
        points: -120
        refs: [nist-sp800-61r3]
        gauges: { damage: 15, flame: 5 }
        setFlags: { keptConnected: true }
        delayed:
          - { afterPhases: 1, points: -60, gauges: { damage: 15, trust: -10 }, reason: { ja: '繋いだままだった自社の端末でも、暗号化の被害が出た。', en: '' } }
        items:
          - { id: p02-a-content, points: -10, axis: content, refs: [nist-sp800-61r3] }
          - { id: p02-a-record, points: -5, axis: record, refs: [jpcert-handling] }
      - id: p02-cut
        text: { ja: '自社の端末をグループのVPNから切り離し、受注を紙と電話に切り替える。', en: '' }
        minutes: 60
        category: maintain
        points: 20
        refs: [nist-sp800-61r3, ipa-sme-guideline]
        gauges: { damage: -10, stamina: -5 }
        setFlags: { subIsolated: true }
        items:
          - { id: p02-b-content, points: 8, axis: content, refs: [nist-sp800-61r3] }
          - { id: p02-b-order, points: 5, axis: order, refs: [ipa-sme-guideline] }
          - { id: p02-b-record, points: 5, axis: record, refs: [jpcert-handling] }
      - id: p02-cut-log
        text: { ja: '切り離したうえで、ログと接続履歴を保全し、親会社の情報システム部と外部ベンダーに渡す。手作業の受付手順も決める。', en: '' }
        minutes: 120
        category: recover
        points: 100
        refs: [nist-sp800-61r3, meti-csm-guideline]
        gauges: { damage: -20, trust: 10, stamina: -10 }
        setFlags: { subIsolated: true, evidenceKept: true }
        items:
          - { id: p02-c-time, points: 5, axis: time, refs: [jpcert-handling] }
          - { id: p02-c-content, points: 8, axis: content, refs: [nist-sp800-61r3] }
          - { id: p02-c-record, points: 8, axis: record, refs: [nist-sp800-61r3] }
          - { id: p02-c-order, points: 5, axis: order, refs: [meti-csm-guideline] }
      - id: p02-off
        text: { ja: '端末の電源を切り、初期化して新しい機械に入れ替える。', en: '' }
        minutes: 120
        category: fatal
        points: -250
        refs: [nist-sp800-61r3]
        gauges: { damage: 15, flame: 10, trust: -15 }
        setFlags: { destroyedEvidence: true }
        items:
          - { id: p02-d-record, points: -20, axis: record, refs: [nist-sp800-61r3] }
          - { id: p02-d-content, points: -12, axis: content, refs: [nist-sp800-61r3] }

  - id: p03-factory
    at: { day: 0, minutes: 585 }
    phase: contain
    sound: { se: [notify_chat] }
    text: { ja: '9時45分。工場のラインは自社のネットワークで動いているが、在庫管理はグループ共通のシステムに繋がっている。年末商品の仕込みの最中だ。ラインを止めるか。', en: '' }
    voices: [v03-public, v03-past, v03-ok]
    choices:
      - id: p03-run
        text: { ja: '工場は動かしたまま、在庫管理の接続だけを切る。', en: '' }
        minutes: 90
        category: hurt
        points: -100
        refs: [nist-sp800-61r3]
        gauges: { damage: 15, flame: 5 }
        delayed:
          - { afterPhases: 1, points: -50, gauges: { damage: 15, trust: -10 }, reason: { ja: '繋いだままの在庫管理から、製造番号の記録が書き換えられた。', en: '' } }
        items:
          - { id: p03-a-content, points: -10, axis: content, refs: [nist-sp800-61r3] }
          - { id: p03-a-order, points: -8, axis: order, refs: [nist-sp800-61r3] }
      - id: p03-stop
        text: { ja: '工場のラインを安全のため止め、従業員に理由を説明する。', en: '' }
        minutes: 90
        category: maintain
        points: 20
        refs: [nist-sp800-61r3, ipa-sme-guideline]
        gauges: { flame: 5, damage: -15, stamina: -5 }
        setFlags: { factoryStopped: true }
        items:
          - { id: p03-b-time, points: 5, axis: time, refs: [nist-sp800-61r3] }
          - { id: p03-b-care, points: 5, axis: care, refs: [ipa-sme-guideline] }
          - { id: p03-b-record, points: 5, axis: record, refs: [jpcert-handling] }
      - id: p03-stop-plan
        text: { ja: 'ラインを止め、紙と電話で限られた商品だけを出す手順を作り、得意先に納期を伝える。', en: '' }
        minutes: 150
        category: recover
        points: 100
        refs: [nist-sp800-61r3, meti-csm-guideline]
        gauges: { flame: 5, damage: -25, trust: 10, stamina: -10 }
        setFlags: { factoryStopped: true, paperOps: true }
        items:
          - { id: p03-c-order, points: 8, axis: order, refs: [nist-sp800-61r3] }
          - { id: p03-c-content, points: 8, axis: content, refs: [nist-sp800-61r3] }
          - { id: p03-c-care, points: 8, axis: care, refs: [meti-csm-guideline] }
          - { id: p03-c-record, points: 5, axis: record, refs: [jpcert-handling] }
      - id: p03-hide
        text: { ja: 'ラインは止めるが、社内外には「設備点検」と伝える。', en: '' }
        minutes: 60
        category: fatal
        points: -250
        refs: [meti-disclosure-guidance]
        gauges: { flame: 25, trust: -20 }
        setFlags: { hidFacts: true }
        delayed:
          - { afterPhases: 2, points: -80, gauges: { flame: 20, trust: -15 }, reason: { ja: '設備点検ではないことが報道で分かり、隠したと批判された。', en: '' } }
        items:
          - { id: p03-d-wording, points: -20, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: p03-d-record, points: -10, axis: record, refs: [jpcert-handling] }
          - { id: p03-d-care, points: -8, axis: care, refs: [meti-disclosure-guidance] }

  - id: p04-who
    at: { day: 0, minutes: 675 }
    phase: organize
    sound: { se: [phone_ring] }
    text: { ja: '11時15分。自社に専任の情報システム部はない。総務部長は経理と兼務で、端末の面倒は外部のITベンダーが見ている。誰に何を任せ、誰に相談するか。', en: '' }
    voices: [v04-parent, v04-vendor, v04-ok]
    choices:
      - id: p04-leave
        text: { ja: '親会社に全部任せ、自社は現場に出ない。', en: '' }
        minutes: 45
        category: hurt
        points: -60
        refs: [meti-csm-guideline]
        gauges: { trust: -5, stamina: 5 }
        coward: true
        items:
          - { id: p04-a-order, points: -10, axis: order, refs: [meti-csm-guideline] }
          - { id: p04-a-care, points: -8, axis: care, refs: [ipa-sme-guideline] }
      - id: p04-window
        text: { ja: '兼務の総務部長を窓口にし、親会社の情報システム部と毎時連絡する場を作る。', en: '' }
        minutes: 90
        category: maintain
        points: 20
        refs: [meti-csm-guideline, ipa-sme-guideline]
        gauges: { trust: 5, stamina: -10 }
        setFlags: { reportingLine: true }
        items:
          - { id: p04-b-order, points: 8, axis: order, refs: [meti-csm-guideline] }
          - { id: p04-b-time, points: 5, axis: time, refs: [jpcert-handling] }
          - { id: p04-b-record, points: 5, axis: record, refs: [jpcert-handling] }
      - id: p04-window-plan
        text: { ja: '窓口を一人に決め、外部ベンダー・保険会社・弁護士への連絡順を決める。社員への説明も同じ日に始める。', en: '' }
        minutes: 120
        category: recover
        points: 100
        refs: [meti-csm-guideline, ipa-sme-guideline]
        gauges: { trust: 10, stamina: -10, flame: -5 }
        setFlags: { reportingLine: true, advisorLine: true }
        items:
          - { id: p04-c-order, points: 8, axis: order, refs: [meti-csm-guideline] }
          - { id: p04-c-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: p04-c-care, points: 8, axis: care, refs: [ipa-sme-guideline] }
          - { id: p04-c-content, points: 5, axis: content, refs: [meti-csm-guideline] }
      - id: p04-vendor
        text: { ja: '外部ベンダーに調査を一任し、親会社には結果が出てから報告する。', en: '' }
        minutes: 90
        category: hurt
        points: -80
        refs: [meti-csm-guideline]
        gauges: { trust: -10 }
        items:
          - { id: p04-d-order, points: -10, axis: order, refs: [meti-csm-guideline] }
          - { id: p04-d-content, points: -8, axis: content, refs: [meti-csm-guideline] }

  - id: p05-parent-report
    at: { day: 0, minutes: 840 }
    phase: organize
    sound: { se: [typing] }
    text: { ja: '午後2時。親会社に第一報を出す。電話で概要を伝えるか、書面で事実と不明点を分けて出すか。調査の応援も頼みたい。', en: '' }
    voices: [v05-coward, v05-parent, v05-ok]
    choices:
      - id: p05-oral
        text: { ja: '電話で概要だけを伝える。', en: '' }
        minutes: 60
        category: hurt
        points: -80
        refs: [jpcert-handling]
        gauges: { trust: -10, flame: 5 }
        items:
          - { id: p05-a-record, points: -10, axis: record, refs: [jpcert-handling] }
          - { id: p05-a-content, points: -8, axis: content, refs: [meti-csm-guideline] }
      - id: p05-written
        text: { ja: '書面で、分かった事実と不明点を分けて提出する。', en: '' }
        minutes: 120
        category: maintain
        points: 20
        refs: [jpcert-handling]
        gauges: { trust: 5, stamina: -10 }
        detail: parent-report
        setFlags: { subReportFiled: true }
        items:
          - { id: p05-b-record, points: 5, axis: record, refs: [jpcert-handling] }
          - { id: p05-b-content, points: 5, axis: content, refs: [meti-csm-guideline] }
          - { id: p05-b-time, points: 5, axis: time, refs: [jpcert-handling] }
      - id: p05-written-plan
        text: { ja: '書面で出し、応援要員と調査の支援を求める。自社の社員にも同じ内容を伝える。', en: '' }
        minutes: 150
        category: recover
        points: 90
        refs: [jpcert-handling, ipa-sme-guideline, meti-csm-guideline]
        gauges: { trust: 10, stamina: 5, flame: -5 }
        detail: parent-report
        setFlags: { subReportFiled: true, subStaffSupport: true }
        items:
          - { id: p05-c-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: p05-c-content, points: 8, axis: content, refs: [meti-csm-guideline] }
          - { id: p05-c-order, points: 5, axis: order, refs: [meti-csm-guideline] }
          - { id: p05-c-care, points: 8, axis: care, refs: [ipa-sme-guideline] }
      - id: p05-minimize
        text: { ja: '「自社は影響なし」と報告する。', en: '' }
        minutes: 60
        category: hurt
        points: -120
        refs: [meti-disclosure-guidance]
        gauges: { flame: 10, trust: -15 }
        setFlags: { falseReport: true }
        delayed:
          - { afterPhases: 1, points: -50, gauges: { flame: 15, trust: -10 }, reason: { ja: '影響なしと報告した自社の受注も止まっていたことが分かった。', en: '' } }
        items:
          - { id: p05-d-content, points: -10, axis: content, refs: [meti-disclosure-guidance] }
          - { id: p05-d-record, points: -10, axis: record, refs: [jpcert-handling] }

  - id: p06-scope
    at: { day: 0, minutes: 1020 }
    phase: investigate
    sound: { se: [notify_chat] }
    text: { ja: '午後5時。自社の得意先名簿（酒店と飲食店の担当者名、注文履歴）が、グループ共通のファイルサーバに置かれていたことが分かった。親会社が示した調査範囲に、自社の名簿を入れるか。', en: '' }
    voices: [v06-insider, v06-parent, v06-ok]
    notable:
      - { id: note-scope, text: { ja: '自社の得意先名簿がグループ共通のファイルサーバに置かれていた。', en: '' } }
    choices:
      - id: p06-narrow
        text: { ja: '親会社が示した範囲だけを調べ、自社の名簿は含めない。', en: '' }
        minutes: 120
        category: hurt
        points: -100
        refs: [ppc-report-scope]
        gauges: { damage: 15, trust: -10 }
        delayed:
          - { afterPhases: 1, points: -40, gauges: { damage: 10, flame: 10 }, reason: { ja: '調べていなかった得意先の名簿が、あとから公開された。', en: '' } }
        items:
          - { id: p06-a-content, points: -10, axis: content, refs: [ppc-report-scope] }
          - { id: p06-a-record, points: -8, axis: record, refs: [nist-sp800-61r3] }
      - id: p06-include
        text: { ja: '自社の得意先名簿も調査範囲に加え、親会社に伝える。', en: '' }
        minutes: 90
        category: maintain
        points: 20
        refs: [ppc-report-scope]
        gauges: { damage: -5, trust: 5, stamina: -10 }
        setFlags: { subScope: true }
        items:
          - { id: p06-b-content, points: 8, axis: content, refs: [ppc-report-scope] }
          - { id: p06-b-order, points: 5, axis: order, refs: [meti-csm-guideline] }
      - id: p06-include-plan
        text: { ja: '範囲に加え、得意先への先行連絡と、注文が止まった場合の代替の受付を準備する。', en: '' }
        minutes: 150
        category: recover
        points: 100
        refs: [ppc-report-scope, ppc-notify-person]
        gauges: { damage: -10, trust: 10, stamina: -15 }
        setFlags: { subScope: true, customerPlan: true }
        items:
          - { id: p06-c-content, points: 8, axis: content, refs: [ppc-report-scope] }
          - { id: p06-c-order, points: 8, axis: order, refs: [meti-csm-guideline] }
          - { id: p06-c-care, points: 8, axis: care, refs: [ppc-notify-person] }
          - { id: p06-c-time, points: 5, axis: time, refs: [jpcert-handling] }
      - id: p06-rebuild
        text: { ja: '名簿は古いので、調査せずに新しく作り直す。', en: '' }
        minutes: 120
        category: hurt
        points: -80
        refs: [nist-sp800-61r3]
        gauges: { damage: 5, trust: -5 }
        items:
          - { id: p06-d-content, points: -10, axis: content, refs: [nist-sp800-61r3] }
          - { id: p06-d-record, points: -8, axis: record, refs: [jpcert-handling] }

  - id: p07-evidence
    at: { day: 1, minutes: 540 }
