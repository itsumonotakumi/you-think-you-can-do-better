# No.5 コガネ酒造HD / 経営者ロール
# 判断ポイント17、細目は choices[].items と drafts の合計で80以上。
estimateMinutes: 30
intro: { ja: 'あなたはコガネ酒造ホールディングスの代表取締役社長。朝7時30分、受注・出荷システムとコールセンターが止まったという電話が入る。年末商戦を前に、あなたの判断が始まる。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-ppc-prelim
    ref: ppc-report-prelim
    label: { ja: '個人情報保護委員会への速報', en: '' }
    points: -150
    doneFlag: ppcPrelimFiled
events:
  - id: ev-competitor
    at: { day: 1, minutes: 720 }
    voices: [v-ev-competitor]
    gauges: { flame: 5 }
    sound: { se: [notify_news] }
    caption: { ja: '競合他社の営業が、取引先に「うちの樽でよければ」と回り始めている。', en: '' }
  - id: ev-fax
    at: { day: 2, minutes: 1080 }
    voices: [v-ev-fax]
    gauges: { flame: 3 }
    caption: { ja: '取引先からの注文は、FAXで届き続けている。', en: '' }
  - id: ev-rumor
    at: { day: 4, minutes: 540 }
    voices: [v-ev-rumor]
    gauges: { flame: 10 }
    sound: { se: [notify_sns] }
    caption: { ja: '掲示板に「実は身代金を払ったらしい」という書き込みが出た。', en: '' }
points:
  - id: p01-call
    at: { day: 0, minutes: 450 }
    phase: detect
    sound: { se: [phone_ring] }
    text: { ja: '朝7時30分。情報システム部長から電話が入る。「受注・出荷システムとコールセンターが止まりました。サーバーに身代金を求める文書があります」。工場は動いているが、出荷の指示が出せない。', en: '' }
    voices: [v01-boss, v01-expert, v01-ok]
    notable:
      - { id: note-first-call, text: { ja: '7時30分、受注・出荷システムとコールセンターが停止。サーバーに身代金要求文。', en: '' } }
    choices:
      - id: p01-self
        text: { ja: '自分でサーバー室に行き、止まった画面と機器の状態を直接確かめる。', en: '' }
        explain: { ja: '現場を直接見る姿勢は評価できるが、指揮と連絡が遅れ、封じ込めの初動が止まる。点数の低い選択。', en: '' }
        minutes: 60
        category: hurt
        points: -50
        refs: [jpcert-handling]
        gauges: { stamina: -10, trust: -5 }
        items:
          - { id: p01-d-order, points: -10, axis: order, refs: [meti-csm-guideline] }
          - { id: p01-d-care, points: -5, axis: care, refs: [meti-csm-guideline] }
      - id: p01-command-plan
        text: { ja: '本部を立ち上げ、権限委譲と警察・専門家への連絡に加え、取引先への先行連絡も決める。', en: '' }
        explain: { ja: '初動の指揮・権限移譲・外部連絡に加え、影響を受ける取引先への先行連絡まで決めており、時間と信頼を守れる。', en: '' }
        minutes: 45
        category: recover
        points: 70
        refs: [meti-csm-guideline, meti-disclosure-guidance]
        gauges: { flame: -5, trust: 10, stamina: -5 }
        setFlags: { commandStarted: true, partnerFirstNotice: true }
        items:
          - { id: p01-c-time, points: 5, axis: time, refs: [meti-csm-guideline] }
          - { id: p01-c-order, points: 8, axis: order, refs: [meti-disclosure-guidance] }
          - { id: p01-c-care, points: 8, axis: care, refs: [meti-disclosure-guidance] }
          - { id: p01-c-record, points: 5, axis: record, refs: [jpcert-handling] }
      - id: p01-morning
        text: { ja: '誤報の可能性も考え、状況が揃うまで朝の定例会議の報告を待つ方針にする。', en: '' }
        explain: { ja: '誤報を疑う慎重さは分かるが、身代金要求文がある時点で待つ理由にならない。被害拡大と信頼低下を招く。', en: '' }
        minutes: 60
        category: hurt
        points: -120
        refs: [jpcert-handling]
        gauges: { flame: 10, trust: -5 }
        coward: true
        setFlags: { delayedCommand: true }
        delayed:
          - { afterPhases: 1, points: -40, gauges: { flame: 10, trust: -10 }, reason: { ja: '出荷できないまま、取引先からの電話が殺到した。', en: '' } }
        items:
          - { id: p01-a-time, points: -10, axis: time, refs: [jpcert-handling] }
          - { id: p01-a-record, points: -5, axis: record, refs: [jpcert-handling] }
      - id: p01-command
        text: { ja: 'その場で対策本部を立ち上げ、部長に権限を移して警察と専門家へ連絡する。', en: '' }
        explain: { ja: '本部立ち上げと権限移譲は妥当。ただし取引先への連絡が抜け、出荷停止の説明が後手になる。', en: '' }
        minutes: 30
        category: maintain
        points: 20
        refs: [meti-csm-guideline, npa-consult]
        gauges: { flame: -5, trust: 5, stamina: -5 }
        setFlags: { commandStarted: true }
        items:
          - { id: p01-b-time, points: 5, axis: time, refs: [jpcert-handling] }
          - { id: p01-b-order, points: 5, axis: order, refs: [meti-csm-guideline] }
          - { id: p01-b-record, points: 5, axis: record, refs: [jpcert-handling] }
    lesson: { ja: '要求文が出ている時点で誤報と決めつけず、まず指揮系統と権限を決め、警察と専門家へ連絡する。並行して、影響を受ける取引先へ何が止まったかを先に伝えると、後続の説明がぶれない。', en: '' }

  - id: p02-ransom
    at: { day: 0, minutes: 540 }
    phase: contain
    sound: { se: [mail_arrive] }
    text: { ja: '午前9時。攻撃者からの要求文。金銭の支払いと引き換えに復号鍵を渡す、応じなければ持ち出したデータを公開する、と書かれている。法務からは「これは犯罪です」と言われた。', en: '' }
    voices: [v02-public, v02-attacker, v02-bold, v02-ok]
    notable:
      - { id: note-ransom, text: { ja: '身代金の要求文。支払わなければデータを公開すると書かれている。', en: '' } }
    choices:
      - id: p02-pay
        text: { ja: '要求どおりに支払い、復号鍵と削除の証明を受け取れると期待して臨む。', en: '' }
        explain: { ja: '支払っても復号や削除は保証されず、資金が犯罪組織に渡る。二重恐喝のリスクも高く、致命的な失点になる。', en: '' }
        minutes: 60
        category: fatal
        points: -300
        refs: [npa-consult]
        gauges: { damage: 20, flame: 20, trust: -20 }
        setFlags: { paidRansom: true }
        items:
          - { id: p02-a-record, points: -10, axis: record, refs: [npa-consult] }
          - { id: p02-a-content, points: -10, axis: content, refs: [npa-consult] }
      - id: p02-negotiate
        text: { ja: '支払わずに交渉を続け、データ公開の期限を少しでも先に延ばしてもらう。', en: '' }
        explain: { ja: '交渉で時間を稼ぐ発想は分かるが、警察への相談が遅れ、攻撃者に期限を動かす主導権を渡す。', en: '' }
        minutes: 60
        category: hurt
        points: -100
        refs: [npa-consult]
        gauges: { damage: 10, trust: -10 }
        delayed:
          - { afterPhases: 1, points: -50, gauges: { damage: 10, trust: -10 }, reason: { ja: '交渉の間に、攻撃者が公開の期限を早めた。', en: '' } }
        items:
          - { id: p02-d-order, points: -10, axis: order, refs: [npa-consult] }
          - { id: p02-d-record, points: -8, axis: record, refs: [npa-consult] }
      - id: p02-refuse-plan
        text: { ja: '支払わないと決めて警察に相談し、公開された場合の補償方針と専用窓口も先に発表する。', en: '' }
        explain: { ja: '支払わない判断と警察への相談に加え、公開時の補償と窓口を先に用意しており、被害者側の不安に先回りできている。', en: '' }
        minutes: 120
        category: recover
        points: 120
        refs: [npa-consult, ppc-notify-person]
        gauges: { flame: -10, trust: 10, stamina: -10 }
        setFlags: { refusedRansom: true, victimPlan: true }
        items:
          - { id: p02-c-record, points: 5, axis: record, refs: [npa-consult] }
          - { id: p02-c-order, points: 10, axis: order, refs: [ppc-notify-person] }
          - { id: p02-c-content, points: 5, axis: content, refs: [npa-consult] }
          - { id: p02-c-care, points: 8, axis: care, refs: [ppc-notify-person] }
      - id: p02-refuse
        text: { ja: '支払わないと決めて警察に相談し、その理由を公表の場できちんと説明する。', en: '' }
        explain: { ja: '支払わない判断と警察への相談は妥当。ただし公開後の補償や窓口が未定で、いざという時の説明が遅れる。', en: '' }
        minutes: 90
        category: maintain
        points: 30
        refs: [npa-consult]
        gauges: { flame: -5, trust: 5, stamina: -5 }
        setFlags: { refusedRansom: true }
        items:
          - { id: p02-b-record, points: 5, axis: record, refs: [npa-consult] }
          - { id: p02-b-content, points: 5, axis: content, refs: [npa-consult] }
          - { id: p02-b-time, points: 3, axis: time, refs: [npa-consult] }
    lesson: { ja: '身代金は支払っても復号も削除も保証されず、警察への相談が原則になる。決めた理由を説明し、データが公開された場合の補償と相談窓口を先に用意しておくと、被害の拡大と二次被害を抑えられる。', en: '' }

  - id: p03-stop
    at: { day: 0, minutes: 630 }
    phase: contain
    sound: { se: [notify_chat] }
    text: { ja: '午前10時30分。感染は受注系だけでは収まっていない可能性がある。基幹ネットワークは販売子会社、物流子会社、三つの工場に繋がっている。止めるか。', en: '' }
    voices: [v03-public, v03-field, v03-coward, v03-ok]
    choices:
      - id: p03-stop-isolate
        text: { ja: '基幹網を遮断して生産を止め、感染していない工場の物流だけを別経路で動かす。', en: '' }
        explain: { ja: '被害の広がりを止める遮断と生産停止を決めつつ、影響の少ない物流を別経路で残しており、安全と供給の両立を狙えている。', en: '' }
        minutes: 120
        category: recover
        points: 100
        refs: [nist-sp800-61r3, meti-csm-guideline]
        gauges: { flame: 10, damage: -30, trust: 10, stamina: -15 }
        setFlags: { contained: true, transparentStop: true, isolatedLogistics: true }
        items:
          - { id: p03-c-order, points: 8, axis: order, refs: [nist-sp800-61r3] }
          - { id: p03-c-content, points: 8, axis: content, refs: [nist-sp800-61r3] }
          - { id: p03-c-care, points: 8, axis: care, refs: [meti-csm-guideline] }
          - { id: p03-c-record, points: 5, axis: record, refs: [jpcert-handling] }
      - id: p03-stop-notify
        text: { ja: '基幹ネットワークを遮断して生産を一時停止し、理由を不正アクセス対応として公表する。', en: '' }
        explain: { ja: '遮断と生産停止、理由の公表までは妥当。ただし物流を切り離す設計がなく、供給の停止が長引く。', en: '' }
        minutes: 90
        category: maintain
        points: 25
        refs: [nist-sp800-61r3, meti-disclosure-guidance]
        gauges: { flame: 10, damage: -20, trust: 5, stamina: -10 }
        setFlags: { contained: true, transparentStop: true }
        items:
          - { id: p03-b-time, points: 5, axis: time, refs: [nist-sp800-61r3] }
          - { id: p03-b-order, points: 5, axis: order, refs: [meti-disclosure-guidance] }
          - { id: p03-b-record, points: 5, axis: record, refs: [jpcert-handling] }
      - id: p03-hide
        text: { ja: '遮断はするが、社内には計画停電と伝え、外部には何も説明を出さない。', en: '' }
        explain: { ja: '遮断自体は正しいが、計画停電という虚偽の説明は後に必ず露呈し、隠蔽として信頼を大きく損なう。', en: '' }
        minutes: 60
        category: fatal
        points: -250
        refs: [meti-disclosure-guidance]
        gauges: { flame: 25, trust: -20 }
        setFlags: { hidFacts: true }
        delayed:
          - { afterPhases: 2, points: -80, gauges: { flame: 20, trust: -15 }, reason: { ja: '計画停電ではないことが報道で判明し、隠蔽と批判された。', en: '' } }
        items:
          - { id: p03-d-wording, points: -20, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: p03-d-record, points: -10, axis: record, refs: [jpcert-handling] }
          - { id: p03-d-care, points: -10, axis: care, refs: [meti-disclosure-guidance] }
      - id: p03-partial
        text: { ja: '受注系だけを切り離し、工場のネットワークは繋いだまま様子を見る。', en: '' }
        explain: { ja: '受注系だけを切る判断は甘い。繋いだままの工場網から感染が広がり、被害と信用の両方を失う。', en: '' }
        minutes: 90
        category: hurt
        points: -120
        refs: [nist-sp800-61r3]
        gauges: { damage: 20, flame: 5 }
        delayed:
          - { afterPhases: 1, points: -60, gauges: { damage: 15, trust: -10 }, reason: { ja: '繋いだままにした工場の端末でも、暗号化の被害が出た。', en: '' } }
        items:
          - { id: p03-a-content, points: -10, axis: content, refs: [nist-sp800-61r3] }
          - { id: p03-a-record, points: -5, axis: record, refs: [nist-sp800-61r3] }
    lesson: { ja: '封じ込めは、怪しい範囲より広く切るのが原則になる。止める範囲と残す物流を同時に設計し、止めた理由を正直に説明すること。虚偽の理由は一時をしのげても、後で隠蔽として跳ね返る。', en: '' }

  - id: p04-manual
    at: { day: 0, minutes: 840 }
    phase: contain
    sound: { se: [phone_ring] }
    text: { ja: '午後2時。受注が止まって半日。取引先からはFAXと電話で注文が届き始めた。手作業で受注と出荷をやるか。件数は多く、誤出荷の危険もある。', en: '' }
    voices: [v04-boss, v04-past, v04-law, v04-ok]
    choices:
      - id: p04-all
        text: { ja: '全商品を手作業で受注し、これまでと同じ日程で通常どおり出荷を続ける。', en: '' }
        explain: { ja: '全商品を同じ手順で流すと、確認が追いつかず誤出荷と二重受注が重なる。善意でも現場の負担を無視している。', en: '' }
        minutes: 120
        category: hurt
        points: -80
        refs: [nist-sp800-61r3]
        gauges: { damage: 10, flame: 5, trust: -5 }
        delayed:
          - { afterPhases: 1, points: -40, gauges: { damage: 10, trust: -10 }, reason: { ja: '誤出荷と二重受注が重なり、回収の作業が発生した。', en: '' } }
        items:
          - { id: p04-a-content, points: -10, axis: content, refs: [nist-sp800-61r3] }
          - { id: p04-a-care, points: -8, axis: care, refs: [meti-disclosure-guidance] }
          - { id: p04-a-record, points: -5, axis: record, refs: [jpcert-handling] }
      - id: p04-none
        text: { ja: '手作業は混乱するので、システムが戻るまで受注を止めて待つ方針にする。', en: '' }
        explain: { ja: '受注を止める判断は安全側に見えるが、取引先の年末商戦を落とし、信頼と売上を同時に失う。', en: '' }
        minutes: 30
        category: hurt
        points: -60
        refs: [ipa-sme-guideline]
        gauges: { flame: 5, trust: -10 }
        coward: true
        items:
          - { id: p04-d-time, points: -10, axis: time, refs: [ipa-sme-guideline] }
          - { id: p04-d-care, points: -8, axis: care, refs: [meti-disclosure-guidance] }
      - id: p04-limited
        text: { ja: '主要商品だけ手作業で受注し、確認を二重にして誤出荷を防いで回す。', en: '' }
        explain: { ja: '主要商品に絞って二重確認を入れるのは妥当。ただし納期の案内と誤出荷時の補償が抜け、不安が残る。', en: '' }
        minutes: 90
        category: maintain
        points: 25
        refs: [ipa-sme-guideline]
        gauges: { flame: -5, trust: 5, stamina: -10 }
        setFlags: { manualOps: true }
        items:
          - { id: p04-b-content, points: 5, axis: content, refs: [ipa-sme-guideline] }
          - { id: p04-b-order, points: 5, axis: order, refs: [ipa-sme-guideline] }
          - { id: p04-b-record, points: 5, axis: record, refs: [jpcert-handling] }
      - id: p04-limited-plan
        text: { ja: '主要商品に絞って二重確認と納期の案内を徹底し、誤出荷の補償方針も先に決める。', en: '' }
        explain: { ja: '対象を絞った受注、二重確認、正直な納期案内、誤出荷の補償まで揃えており、限られた人員でも信頼を守れる。', en: '' }
        minutes: 150
        category: recover
        points: 100
        refs: [ipa-sme-guideline, meti-disclosure-guidance]
        gauges: { flame: -5, trust: 10, stamina: -15 }
        setFlags: { manualOps: true, returnPolicy: true }
        items:
          - { id: p04-c-care, points: 8, axis: care, refs: [meti-disclosure-guidance] }
          - { id: p04-c-content, points: 8, axis: content, refs: [ipa-sme-guideline] }
          - { id: p04-c-order, points: 8, axis: order, refs: [ipa-sme-guideline] }
          - { id: p04-c-record, points: 5, axis: record, refs: [jpcert-handling] }
    lesson: { ja: '手作業に切り替えるなら、扱う商品を絞り、確認を二重にして誤出荷を防ぐ。納期は正直に伝え、誤出荷が起きた時の補償方針まで先に決めておくことが、取引先の信頼を保つ鍵になる。', en: '' }

  - id: p05-group
    at: { day: 0, minutes: 1020 }
    phase: organize
    sound: { se: [notify_chat] }
    text: { ja: '午後5時。グループ各社の社長が集まった。販売子会社は自社だけ先に再開したいと言い、物流子会社は共通ネットワークなので動けないと言う。', en: '' }
    voices: [v05-boss, v05-coward, v05-ok]
    choices:
      - id: p05-split
        text: { ja: '販売子会社だけを別のネットワークに移し、自社だけ先に再開させる。', en: '' }
        explain: { ja: '一社だけ先に動かすと、共通の認証基盤や感染の疑いが残ったままになり、再開後の再感染を招く。', en: '' }
        minutes: 120
        category: hurt
        points: -100
        refs: [nist-sp800-61r3]
        gauges: { damage: 15, trust: -5 }
        delayed:
          - { afterPhases: 1, points: -50, gauges: { damage: 15, trust: -10 }, reason: { ja: '先に再開した販売子会社の端末から、再び不審な通信が出た。', en: '' } }
        items:
          - { id: p05-a-order, points: -10, axis: order, refs: [nist-sp800-61r3] }
          - { id: p05-a-content, points: -8, axis: content, refs: [nist-sp800-61r3] }
      - id: p05-unify-doc
        text: { ja: 'グループ共通の判断とし、各社の役割・連絡先・復旧の順番を文書にして共有する。', en: '' }
        explain: { ja: '共通判断のもとで役割・連絡先・順番を文書化しており、各社が同じ前提で動ける。復旧の混乱を最も抑えられる。', en: '' }
        minutes: 150
        category: recover
        points: 100
        refs: [meti-csm-guideline]
        gauges: { flame: -5, trust: 15, stamina: -15 }
        setFlags: { groupUnified: true, groupPlan: true }
        items:
          - { id: p05-c-order, points: 8, axis: order, refs: [meti-csm-guideline] }
          - { id: p05-c-record, points: 8, axis: record, refs: [meti-csm-guideline] }
          - { id: p05-c-content, points: 8, axis: content, refs: [meti-csm-guideline] }
