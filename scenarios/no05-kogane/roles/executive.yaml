        category: recover
        points: 70
        refs: [meti-disclosure-guidance]
        gauges: { trust: 15, stamina: -10 }
        setFlags: { honestEarnings: true, investorBriefing: true }
        items:
          - { id: p15-c-content, points: 8, axis: content, refs: [meti-disclosure-guidance] }
          - { id: p15-c-care, points: 8, axis: care, refs: [meti-disclosure-guidance] }
          - { id: p15-c-record, points: 5, axis: record, refs: [meti-disclosure-guidance] }

  - id: p16-final-report
