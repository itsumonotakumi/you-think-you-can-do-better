  - { id: v03-after, media: sns, misleading: false, text: { ja: '工場を止めたのに、物流だけ動かすとは都合がいい。', en: '' }, trigger: { at: after, choice: p03-stop-isolate } }
  - { id: v04-boss, media: boss, misleading: true, type: boss-pressure, text: { ja: '手作業でやれ。止めたまま年末を越すつもりか。', en: '' }, trigger: { at: point } }
