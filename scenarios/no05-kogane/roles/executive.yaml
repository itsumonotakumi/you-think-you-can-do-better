  - { id: v-ev-fax, media: chat, misleading: false, text: { ja: '物流部長「FAXの注文が止まりません。手書きの伝票が山になっています」。', en: '' }, trigger: { at: manual } }
  - { id: v-ev-rumor, media: board, misleading: false, text: { ja: '掲示板「実は身代金を払ったらしい。あの会社は終わりだ」。', en: '' }, trigger: { at: manual } }
