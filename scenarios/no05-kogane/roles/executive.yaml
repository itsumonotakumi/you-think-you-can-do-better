          - { id: p16-c-content2, points: 8, axis: content, refs: [meti-disclosure-guidance] }
      - id: p16-hide
        text: { ja: '報告書は公開せず、攻撃者に利用されるおそれがあるとだけ説明する。', en: '' }
        explain: { ja: '非公開は攻撃者に手の内を渡さないように見えるが、原因も対策も見えず、隠蔽として不信を招く。', en: '' }
        minutes: 60
        category: hurt
        points: -150
        refs: [meti-disclosure-guidance]
        gauges: { flame: 15, trust: -15 }
        items:
          - { id: p16-a-content, points: -10, axis: content, refs: [meti-disclosure-guidance] }
          - { id: p16-a-wording, points: -10, axis: wording, refs: [meti-disclosure-guidance] }
    lesson: { ja: '調査報告書は、攻撃に使える詳細だけを伏せて全文を公開する。さらに再発防止の進捗を定期的に公開し、得た教訓を業界に共有すると、説明責任と再発防止の実効性を示せる。', en: '' }

  - id: p17-press
    at: { day: 30, minutes: 540 }
    phase: after
    sound: { se: [shutter] }
    text: { ja: '一か月後。記者会見を明日に控えた。質問は五問、二十分で終わらせたいと広報が言う。記録は手元にある。', en: '' }
    voices: [v17-flattery, v17-coward, v17-ok]
    choices:
      - id: p17-short
        text: { ja: '会見を短く打ち切り、質問の数をあらかじめ制限して終える。', en: '' }
        explain: { ja: '質問を制限すると、都合の悪いことを隠していると受け取られる。会見の時間より、答える姿勢が問われる。', en: '' }
        minutes: 45
        category: hurt
        points: -60
        refs: [meti-disclosure-guidance]
        gauges: { flame: 15, trust: -10 }
        items:
          - { id: p17-a-care, points: -10, axis: care, refs: [meti-disclosure-guidance] }
          - { id: p17-a-care2, points: -8, axis: care, refs: [meti-disclosure-guidance] }
      - id: p17-facts
        text: { ja: '記録を手元に置き、事実だけを答え、不明点は確認して回答すると言う。', en: '' }
        explain: { ja: '記録に基づき事実だけを答える姿勢は妥当。ただし謝罪と想定問答の準備がなく、受け答えが不安定になる。', en: '' }
        minutes: 90
        category: maintain
        points: 30
        refs: [jpcert-handling]
        gauges: { trust: 5, stamina: -10 }
        items:
          - { id: p17-b-wording, points: 8, axis: wording, refs: [jpcert-handling] }
          - { id: p17-b-wording2, points: 5, axis: wording, refs: [meti-disclosure-guidance] }
      - id: p17-ready
        text: { ja: '想定問答を全役員で確認し、最初に被害者と取引先への謝罪を述べる。', en: '' }
        explain: { ja: '全役員で想定問答をそろえ、最初に被害者と取引先へ謝罪しており、説明の一貫性と誠意を最も示せる。', en: '' }
        minutes: 120
        category: recover
        points: 100
        refs: [meti-csm-guideline, jpcert-handling]
        gauges: { flame: -10, trust: 10, stamina: -10 }
        setFlags: { pressReady: true }
        items:
          - { id: p17-c-order, points: 8, axis: order, refs: [meti-csm-guideline] }
          - { id: p17-c-care, points: 8, axis: care, refs: [meti-csm-guideline] }
          - { id: p17-c-record, points: 8, axis: record, refs: [jpcert-handling] }
    lesson: { ja: '記者会見は時間の短さより、何をどう答えるかの準備で決まる。全役員で想定問答をすり合わせ、最初に被害者と取引先へ謝罪する。質問を制限すると、隠しているという印象だけが残る。', en: '' }

drafts:
  first-report:
    title: { ja: '第1報の文案', en: '' }
    slots:
      - id: timing
        label: { ja: '出す時刻', en: '' }
        auto: true
        items:
          - { id: fd-t-48h, when: { withinHours: 48 }, points: 8, axis: time, refs: [meti-disclosure-guidance] }
          - { id: fd-t-72h, when: { withinHours: 72 }, points: 3, axis: time, refs: [meti-disclosure-guidance] }
          - { id: fd-t-late, when: { otherwise: true }, points: -15, axis: time, refs: [meti-disclosure-guidance] }
      - id: scope
        label: { ja: '対象範囲', en: '' }
        options:
          - { id: fd-s-current, text: { ja: '受注システムの利用者と、その取引先だけに限る', en: '' }, points: -20, axis: content, refs: [meti-disclosure-guidance], delayed: { afterPhases: 1, points: -20, reason: { ja: '対象範囲の訂正が必要になった。', en: '' } }, explain: { ja: '対象を狭めると、後から範囲の訂正が必要になり、公表の信頼を損なう。対象は広めに取るのが安全。', en: '' } }
          - { id: fd-s-all, text: { ja: 'グループ各社の取引先と消費者まで広く含める', en: '' }, points: 10, axis: content, refs: [meti-disclosure-guidance], explain: { ja: 'グループ各社の取引先と消費者まで含めた範囲は、漏えいの可能性がある対象を網羅しており、訂正を避けられる。', en: '' } }
      - id: dates
        label: { ja: '日時の書き方', en: '' }
        options:
          - { id: fd-d-split, text: { ja: '発生した日時と検知した日時を分けて書く', en: '' }, points: 5, axis: content, refs: [jpcert-handling], explain: { ja: '発生と検知を分けると、どこで時間がかかったかが読み手に伝わり、初動の評価にもつながる。', en: '' } }
          - { id: fd-d-merge, text: { ja: '発生と検知を一つにまとめて書く', en: '' }, points: -10, axis: wording, refs: [jpcert-handling], explain: { ja: '発生と検知をまとめると、対応が遅れたのか元から早かったのか分からず、後で説明を求められる。', en: '' } }
      - id: certainty
        label: { ja: '断定の強さ', en: '' }
        options:
          - { id: fd-c-confirm, text: { ja: 'すべて漏えいを確認したと断定して書く', en: '' }, points: -15, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: 'すべて漏えいと断定すると、未確認の段階で過剰に認めたことになり、撤回も難しくなる。', en: '' } }
          - { id: fd-c-none, text: { ja: '情報の漏えいはないと断言して書き切る', en: '' }, points: -20, axis: wording, refs: [ppc-report-scope], explain: { ja: '漏えいはないと断言すると、後で事実が判明したときに虚偽の説明となり、信頼を大きく失う。', en: '' } }
          - { id: fd-c-maybe, text: { ja: '「持ち出された可能性」と「確認」を使い分ける', en: '' }, points: 5, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: '確認できたことと可能性を書き分けると、後の調査で新たな事実が出ても説明が破綻しない。', en: '' } }
      - id: leaked
        label: { ja: '漏れた可能性のある項目', en: '' }
        options:
          - { id: fd-l-vague, text: { ja: '顧客情報の一部が漏れた可能性があるとだけ書いて詳細をぼかす', en: '' }, points: -10, axis: content, refs: [ppc-report-prelim], explain: { ja: '項目をぼかすと、対象者は何を警戒すべきか分からず、問い合わせが集中して信頼も下がる。', en: '' } }
          - { id: fd-l-specific, text: { ja: '取引先の担当者名・連絡先と、通販会員の氏名・住所・電話番号を挙げる', en: '' }, points: 10, axis: content, refs: [ppc-report-prelim], explain: { ja: '項目を具体的に挙げると、対象者が自分で危険を判断でき、二次被害の防止につながる。', en: '' } }
      - id: action
        label: { ja: '取引先が今すぐすること', en: '' }
        options:
          - { id: fd-a-concrete, text: { ja: '代替の注文方法、納期の確認、窓口の連絡先を具体的に書く', en: '' }, points: 10, axis: care, refs: [meti-disclosure-guidance], explain: { ja: '代替の注文方法と窓口を具体的に示すと、取引先は今日から動ける。実務の継続が信頼につながる。', en: '' } }
          - { id: fd-a-generic, text: { ja: '注意してくださいとだけ書いて、具体的な行動は示さない', en: '' }, points: -10, axis: care, refs: [meti-disclosure-guidance], explain: { ja: '注意だけでは取引先は何をすればよいか分からない。具体的な手順の欠如が混乱と問い合わせを増やす。', en: '' } }
      - id: phishing
        label: { ja: '偽の連絡への注意', en: '' }
        options:
          - { id: fd-p-none, text: { ja: '偽の連絡への注意は書かず、本文を短くまとめる', en: '' }, points: -10, axis: care, refs: [ppc-notify-person], explain: { ja: '注意書きがないと、名簿を悪用した電話やメールに被害者が引っかかる。二次被害の責任も問われる。', en: '' } }
          - { id: fd-p-warn, text: { ja: '「当社が電話で口座情報を聞くことはありません」と書く', en: '' }, points: 8, axis: care, refs: [ppc-notify-person], explain: { ja: '詐欺の手口を名指しで注意すると、漏えい後の二次被害を防げる。通知に必ず入れるべき一文になる。', en: '' } }
      - id: contact
        label: { ja: '問い合わせ窓口', en: '' }
        options:
          - { id: fd-w-hours, text: { ja: '専用窓口の番号、受付時間、増員を書く', en: '' }, points: 5, axis: care, refs: [meti-csm-guideline], explain: { ja: '受付時間と増員まで書くと、問い合わせが集中しても対応できると伝わり、不安を和らげられる。', en: '' } }
          - { id: fd-w-none, text: { ja: '問い合わせ窓口の記載は省いておく', en: '' }, points: -15, axis: care, refs: [meti-csm-guideline], explain: { ja: '窓口がないと、困った人が問い合わせ先を失い、SNSなどで不満が拡散し、不安も募る。', en: '' } }
          - { id: fd-w-number, text: { ja: '窓口の電話番号だけを書いておく', en: '' }, points: -5, axis: care, refs: [meti-csm-guideline], explain: { ja: '番号だけでは受付時間も対応体制も分からず、つながらない窓口への不満が噴出することになる。', en: '' } }
      - id: next
        label: { ja: '次の報告', en: '' }
        options:
          - { id: fd-n-none, text: { ja: '次回の報告予定は書かない', en: '' }, points: -5, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '次回の予定がないと、情報が出尽くしたと思われ、その後の更新が注目されないままになる。', en: '' } }
          - { id: fd-n-next, text: { ja: '次の報告の日時と内容を書く', en: '' }, points: 3, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '次の報告の予定を示すと、不明点が残っていても安心につながり、継続して説明する姿勢が伝わる。', en: '' } }
      - id: apology
        label: { ja: '謝罪の主語', en: '' }
        options:
          - { id: fd-ap-company, text: { ja: '当社として責任を認めて謝罪する', en: '' }, points: 3, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: '自社の責任として謝罪すると、説明の一貫性が保てる。原因の一部が外部でも姿勢は問われる。', en: '' } }
          - { id: fd-ap-vendor, text: { ja: '機器ベンダーの責任として謝罪する', en: '' }, points: -10, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: 'ベンダーに責任を押しつけると、管理責任を放棄したと受け取られ、批判が強まるばかりだ。', en: '' } }
      - id: excuse
        label: { ja: '前置き', en: '' }
        options:
          - { id: fd-e-advanced, text: { ja: '高度な攻撃によりと前置きして始める', en: '' }, points: -10, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: '高度な攻撃という前置きは、自社の落ち度から目を逸らす印象を与え、かえって反発を招く。', en: '' } }
          - { id: fd-e-none, text: { ja: '前置きの言い訳は書かずに始める', en: '' }, points: 5, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: '言い訳を置かないことで、事実と対応に話が絞られ、読み手の集中を削がず説明も簡潔になる。', en: '' } }
      - id: approval
        label: { ja: '社内確認', en: '' }
        options:
          - { id: fd-i-share, text: { ja: '公表前に広報・法務・営業で文案を確認する', en: '' }, points: 5, axis: order, refs: [meti-csm-guideline], explain: { ja: '公表前に広報・法務・営業で確認すると、表現の抜けや事実のずれを潰せることが多い。', en: '' } }
          - { id: fd-i-solo, text: { ja: '社長の判断だけで文案を出してしまう', en: '' }, points: -10, axis: order, refs: [meti-csm-guideline], explain: { ja: '一人で出すと、事実の誤りや表現のまずさに気づけない。公開後に訂正する羽目になる。', en: '' } }
      - id: record
        label: { ja: '記録', en: '' }
        options:
          - { id: fd-r-none, text: { ja: '公表した記録は残さずに進める', en: '' }, points: -8, axis: record, refs: [jpcert-handling], explain: { ja: '記録がないと、いつ何を公表したかを示せず、後から訂正した経緯も説明できなくなる。', en: '' } }
          - { id: fd-r-log, text: { ja: '公表した時刻と版を必ず記録する', en: '' }, points: 5, axis: record, refs: [jpcert-handling], explain: { ja: '公表した時刻と版を残すと、後から訂正した経緯を説明でき、説明責任を果たすことにつながる。', en: '' } }
  final-report:
    title: { ja: '調査報告書の公開範囲', en: '' }
    slots:
      - id: scope
        label: { ja: '公開する範囲', en: '' }
        options:
          - { id: fr-s-full, text: { ja: '攻撃に使える詳細だけ伏せて全文公開する', en: '' }, points: 10, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '攻撃に使える部分だけを伏せた全文公開は、原因と対策を示しつつ悪用の危険も抑えられる。', en: '' } }
          - { id: fr-s-hide, text: { ja: '報告書は一切公開せずに伏せておく', en: '' }, points: -20, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '報告書を非公開にすると、原因も再発防止も見えず、隠蔽と受け取られて信頼を大きく失う。', en: '' } }
      - id: cause
        label: { ja: '原因の書き方', en: '' }
        options:
          - { id: fr-c-vague, text: { ja: '外部からの攻撃とだけ書いておく', en: '' }, points: -10, axis: content, refs: [nist-sp800-61r3], explain: { ja: '外部からの攻撃とだけ書くと、自社の課題が見えず、再発防止の実効性まで疑われてしまう。', en: '' } }
          - { id: fr-c-cause, text: { ja: '原因と判断の誤りを具体的に書く', en: '' }, points: 10, axis: content, refs: [nist-sp800-61r3], explain: { ja: '原因と判断の誤りを具体的に書くと、再発防止の説得力が生まれ、同じ失敗の共有にもなる。', en: '' } }
      - id: warning
        label: { ja: '遠隔接続の点検', en: '' }
        options:
          - { id: fr-w-include, text: { ja: '遠隔接続機器の点検の機会がなかった経緯を書く', en: '' }, points: 10, axis: content, refs: [meti-csm-guideline], explain: { ja: '点検の機会がなかった経緯を書くと、原因の構造が伝わり、再発防止策の必要性も理解される。', en: '' } }
          - { id: fr-w-omit, text: { ja: '古い設定が残っていた事実には触れない', en: '' }, points: -15, axis: content, refs: [meti-csm-guideline], explain: { ja: '古い設定に触れないと、原因の核心が抜け落ち、報告書全体の信頼性が大きく損なわれる。', en: '' } }
      - id: measures
        label: { ja: '再発防止策', en: '' }
        options:
          - { id: fr-m-slogan, text: { ja: '再発防止に努めますとだけ書く', en: '' }, points: -10, axis: content, refs: [cissp-cbk-secops], explain: { ja: '努めますという掛け声だけでは、何をいつ誰がやるのか分からず、再発防止にならない。', en: '' } }
          - { id: fr-m-plan, text: { ja: '実施時期と担当者を具体的に書く', en: '' }, points: 10, axis: content, refs: [cissp-cbk-secops], explain: { ja: '実施時期と担当を書くと、対策が絵に描いた餅にならず、進み具合も後から検証できる。', en: '' } }
      - id: thirdparty
        label: { ja: '第三者委員会の意見', en: '' }
        options:
          - { id: fr-t-full, text: { ja: '第三者委員会の意見を全文掲載する', en: '' }, points: 8, axis: content, refs: [cissp-cbk-secops], explain: { ja: '第三者委員会の意見を全文載せると、自社に不利な指摘も含めて説明した姿勢が伝わる。', en: '' } }
          - { id: fr-t-summary, text: { ja: '要点だけを短く要約して載せる', en: '' }, points: -8, axis: content, refs: [cissp-cbk-secops], explain: { ja: '要約だけだと、都合の悪い部分を隠したと受け取られ、第三者性まで疑われるおそれがある。', en: '' } }
      - id: victims
        label: { ja: '取引先への補償', en: '' }
        options:
          - { id: fr-v-none, text: { ja: '補償については触れない', en: '' }, points: -10, axis: care, refs: [meti-disclosure-guidance], explain: { ja: '補償に触れないと、被害者を置き去りにした印象を与え、説明会や会見でも必ず追及される。', en: '' } }
          - { id: fr-v-record, text: { ja: '補償と相談窓口の実績を書く', en: '' }, points: 8, axis: care, refs: [meti-disclosure-guidance], explain: { ja: '補償と窓口の実績を示すと、被害者への対応が続いていることが伝わり、信頼の回復につながる。', en: '' } }
      - id: progress
        label: { ja: '進捗の公開', en: '' }
        options:
          - { id: fr-p-monthly, text: { ja: '再発防止の進捗を毎月公開する', en: '' }, points: 10, axis: record, refs: [meti-disclosure-guidance], explain: { ja: '進捗を毎月公開すると、対策が続いていることを示せ、時間が経っても説明責任を果たせる。', en: '' } }
          - { id: fr-p-once, text: { ja: '一度だけ公開したら終わりにする', en: '' }, points: -5, axis: record, refs: [meti-disclosure-guidance], explain: { ja: '一度きりの公開では、その後対策が進んだのか分からず、再発防止への本気度を疑われる。', en: '' } }
      - id: industry
        label: { ja: '業界への共有', en: '' }
        options:
          - { id: fr-i-keep, text: { ja: '教訓は自社の中だけにとどめる', en: '' }, points: -5, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '教訓を社内に閉じ込めると、業界全体の再発を防げず、協調性を欠く印象を与えることになる。', en: '' } }
          - { id: fr-i-share, text: { ja: '得た教訓を業界に無償で共有する', en: '' }, points: 10, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '教訓を業界に無償で共有すると、同じ被害を減らす貢献になり、自社への評価も高まる。', en: '' } }
      - id: ad
        label: { ja: '宣伝との線引き', en: '' }
        options:
          - { id: fr-ad-none, text: { ja: '復旧の成果を宣伝には使わない', en: '' }, points: 5, axis: care, refs: [meti-disclosure-guidance], explain: { ja: '復旧を宣伝に使わない姿勢は、被害者への配慮として伝わり、説明の誠実さを支えることになる。', en: '' } }
          - { id: fr-ad-use, text: { ja: '復旧をそのまま宣伝に使う', en: '' }, points: -15, axis: care, refs: [meti-disclosure-guidance], explain: { ja: '復旧を宣伝に使うと、被害を棚に上げて売り込む印象を与え、強い批判を招くことになる。', en: '' } }
voices:
  - { id: v01-boss, media: boss, misleading: true, type: boss-pressure, text: { ja: '朝の定例会議で報告を受けてから動こう。まず状況を整理しろ。', en: '' }, trigger: { at: point } }
  - { id: v01-expert, media: vendor, misleading: true, type: fake-expert, text: { ja: 'まず全台の電源を落として広がりを止めるのが定石です。ログは後からバックアップで復元できます。', en: '' }, trigger: { at: point } }
  - { id: v01-ok, media: chat, misleading: false, text: { ja: '情報システム部長「身代金の要求文があります。これは犯罪です」。', en: '' }, trigger: { at: point } }
  - { id: v01-after, media: news, misleading: false, text: { ja: 'まだ何も分かっていないのに、取引先に先に伝えるのか。', en: '' }, trigger: { at: after, choice: p01-command-plan } }
  - { id: v02-public, media: sns, misleading: true, type: public-opinion, text: { ja: '身代金を払ってさっさと戻せ。年末商戦が終わるぞ。', en: '' }, trigger: { at: point } }
  - { id: v02-attacker, media: attacker, misleading: true, type: attacker-shake, text: { ja: '72時間で公開する。連絡がなければ、取引先の名簿から出す。', en: '' }, trigger: { at: point } }
  - { id: v02-bold, media: sns, misleading: true, type: bold-buzz, text: { ja: '社長、犯人に「絶対に許さない」と会見で言ってください。ニュースになりますよ。', en: '' }, trigger: { at: point } }
  - { id: v02-ok, media: chat, misleading: false, text: { ja: '法務「支払っても復号は保証されません。警察に相談しましょう」。', en: '' }, trigger: { at: point } }
  - { id: v02-after, media: news, misleading: false, text: { ja: '補償方針を先に出すのは、被害を認めたことになるのでは。', en: '' }, trigger: { at: after, choice: p02-refuse-plan } }
  - { id: v03-public, media: sns, misleading: true, type: public-opinion, text: { ja: '工場まで止めたら商品がなくなる。現場は止めるなと言っている。', en: '' }, trigger: { at: point } }
  - { id: v03-field, media: chat, misleading: true, type: well-meant-field, text: { ja: '怪しい端末は電源を抜いておきました。これで大丈夫です。', en: '' }, trigger: { at: point } }
  - { id: v03-coward, media: news, misleading: true, type: coward-critique, text: { ja: '止める判断が遅い。経営は何をしていた。', en: '' }, trigger: { at: point } }
