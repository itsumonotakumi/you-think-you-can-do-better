        category: recover
        points: 80
        refs: [ppc-report-final, meti-disclosure-guidance]
        gauges: { trust: 10, stamina: -10 }
        setFlags: { ppcFinalFiled: true, finalDetailed: true }
        items:
          - { id: p21-d-content, points: 8, axis: content, refs: [ppc-report-final] }
          - { id: p21-d-record, points: 8, axis: record, refs: [meti-disclosure-guidance] }
          - { id: p21-d-care, points: 5, axis: care, refs: [meti-disclosure-guidance] }

  - id: p22-press
