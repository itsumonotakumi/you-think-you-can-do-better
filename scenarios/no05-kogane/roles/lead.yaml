# No.5 コガネ酒造HD / セキュリティ部門長（情報システム部のセキュリティ統括・CSIRTリーダー）ロール
# 判断ポイント22、細目は choices[].items と drafts の合計で80以上。
# 視点: 専任のセキュリティ部署がない会社で、技術と経営の間を翻訳する兼任の責任者。
#       体制づくり、証拠の保全、外部専門家の手配、経営への上申、復旧の安全確認が仕事。
estimateMinutes: 45
intro: { ja: 'あなたはコガネ酒造ホールディングスの情報システム部で、セキュリティ統括責任者を務めている。専任のセキュリティ部署はなく、受注システム担当2名とインフラ担当1名を兼務で束ねるCSIRTのリーダーでもある。月曜の朝7時30分、部長の瀬川からの電話で、受注・出荷システムの停止と身代金要求文を知る。経営に技術を翻訳して伝え、限られた人数で封じ込めと復旧を両立させる。あなたの一か月が始まる。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-ppc-prelim
    ref: ppc-report-prelim
    label: { ja: '個人情報保護委員会への速報', en: '' }
    points: -150
    doneFlag: ppcPrelimFiled
  - id: dl-ppc-final
    ref: ppc-report-final
    label: { ja: '個人情報保護委員会への確報', en: '' }
    points: -100
    doneFlag: ppcFinalFiled
events:
  - id: ev-night
    at: { day: 1, minutes: 120 }
    voices: [v-ev-night]
    gauges: { stamina: -5 }
    caption: { ja: '日付が変わった。兼任の3名は、通常業務の引き継ぎをしながら対応を続けている。', en: '' }
  - id: ev-competitor
    at: { day: 1, minutes: 720 }
    voices: [v-ev-competitor]
    gauges: { flame: 5 }
    sound: { se: [notify_news] }
    caption: { ja: '取引先から「競合の営業が、うちの樽でよければと言ってきた」と連絡が入る。', en: '' }
  - id: ev-fax
    at: { day: 2, minutes: 1080 }
    voices: [v-ev-fax]
    gauges: { flame: 3 }
    caption: { ja: '取引先からの注文は、FAXで届き続けている。', en: '' }
  - id: ev-rumor
    at: { day: 4, minutes: 540 }
    voices: [v-ev-rumor]
    gauges: { flame: 10 }
    sound: { se: [notify_sns] }
    caption: { ja: '掲示板に「実は身代金を払ったらしい」という書き込みが出た。', en: '' }
points:
  - id: p01-alert
    at: { day: 0, minutes: 450 }
    phase: detect
    sound: { se: [phone_ring] }
    text: { ja: '月曜の朝7時30分。部長の瀬川から電話が入る。「受注・出荷システムとコールセンターが止まりました。サーバーに身代金を求める文書があります」。監視画面では、複数のサーバーが外部と通信を続けている。専任の部署はない。招集できるのは受注システム担当2名とインフラ担当1名で、外部の相談先は保険会社の窓口と契約している調査会社だけだ。', en: '' }
    voices: [v01-boss, v01-field, v01-expert, v01-ok]
    notable:
      - { id: note-lead-first-call, text: { ja: '7時30分、受注・出荷システムとコールセンターが停止。サーバーに身代金要求文。現場が一台の電源を抜いた。', en: '' } }
    choices:
      - id: p01-wait
        text: { ja: '誤検知の可能性もある。朝の定例会議まで待ち、報告の形に整えてから動く。', en: '' }
        minutes: 120
        category: hurt
        points: -120
        refs: [jpcert-handling]
        gauges: { flame: 10, trust: -5 }
        coward: true
        setFlags: { delayedTriage: true }
        delayed:
          - { afterPhases: 1, points: -40, gauges: { damage: 15 }, reason: { ja: '隔離が遅れた間に、隣接するサーバーへ暗号化が広がった。', en: '' } }
        items:
          - { id: p01-a-time, points: -10, axis: time, refs: [jpcert-handling] }
          - { id: p01-a-order, points: -8, axis: order, refs: [jpcert-handling] }
      - id: p01-self
        text: { ja: '自分でサーバー室に行き、感染した端末の電源を抜いて回る。', en: '' }
        minutes: 60
        category: hurt
        points: -60
        refs: [nist-sp800-61r3]
        gauges: { stamina: -10, trust: -5 }
        items:
          - { id: p01-b-order, points: -10, axis: order, refs: [nist-sp800-61r3] }
          - { id: p01-b-record, points: -8, axis: record, refs: [nist-sp800-61r3] }
      - id: p01-triage
        text: { ja: '兼任の3名を招集し、受注系のセグメントを切り離す。メモリとログの保全を最優先にして、瀬川へ第一報を入れる。', en: '' }
        minutes: 45
        category: maintain
        points: 10
        refs: [jpcert-handling, nist-sp800-61r3]
        gauges: { damage: -5, stamina: -10, trust: 5 }
        setFlags: { triageStarted: true }
        items:
          - { id: p01-c-time, points: 3, axis: time, refs: [jpcert-handling] }
          - { id: p01-c-order, points: 4, axis: order, refs: [nist-sp800-61r3] }
          - { id: p01-c-record, points: 4, axis: record, refs: [jpcert-handling] }
      - id: p01-impact
        text: { ja: '招集と隔離、証拠の保全に加え、影響範囲と停止時間の見積もりを30分で作り、広報・法務・生産に同時に渡す。', en: '' }
        minutes: 75
        category: recover
        points: 100
        refs: [jpcert-handling, meti-csm-guideline]
        gauges: { damage: -10, stamina: -15, trust: 10 }
        setFlags: { triageStarted: true, impactAssessed: true }
        items:
          - { id: p01-d-order, points: 5, axis: order, refs: [meti-csm-guideline] }
          - { id: p01-d-care, points: 8, axis: care, refs: [meti-csm-guideline] }
          - { id: p01-d-record, points: 8, axis: record, refs: [jpcert-handling] }

  - id: p02-ransom
    at: { day: 0, minutes: 540 }
    phase: contain
    sound: { se: [mail_arrive] }
    text: { ja: '午前9時。要求文の全文が届いた。72時間以内に金銭を支払わなければ、持ち出したデータを公開する。復号鍵は保証されない。方針を決めるのは経営だが、技術的な見立てを求められている。あなたの進言が、支払うかどうかの土台になる。', en: '' }
    voices: [v02-attacker, v02-public, v02-law, v02-ok]
    notable:
      - { id: note-lead-ransom, text: { ja: '身代金要求文。72時間の期限。復号鍵の保証はない。', en: '' } }
    choices:
      - id: p02-advise-pay
        text: { ja: '経営に、支払って復号鍵を得る案を強く進言する。', en: '' }
        minutes: 60
        category: fatal
        points: -300
        refs: [npa-consult]
        gauges: { damage: 20, flame: 20, trust: -20 }
        setFlags: { paidRansom: true }
        items:
          - { id: p02-a-record, points: -10, axis: record, refs: [npa-consult] }
          - { id: p02-a-content, points: -10, axis: content, refs: [npa-consult] }
      - id: p02-negotiate
        text: { ja: '自分で攻撃者と交渉し、公開の延期とサンプルの削除を引き出す。', en: '' }
        minutes: 90
        category: hurt
        points: -100
        refs: [npa-consult]
        gauges: { damage: 10, trust: -10 }
        delayed:
          - { afterPhases: 1, points: -50, gauges: { damage: 10, trust: -10 }, reason: { ja: '交渉の間に、攻撃者が公開の期限を早めた。', en: '' } }
        items:
          - { id: p02-b-order, points: -10, axis: order, refs: [npa-consult] }
          - { id: p02-b-record, points: -8, axis: record, refs: [npa-consult] }
      - id: p02-refuse
        text: { ja: '支払わない前提で、復号の可能性を評価し、警察と保険会社への連絡を整える。', en: '' }
        minutes: 90
        category: maintain
        points: 10
        refs: [npa-consult, jpcert-handling]
        gauges: { flame: -5, trust: 5, stamina: -5 }
        setFlags: { refusedRansom: true }
        items:
          - { id: p02-c-record, points: 3, axis: record, refs: [npa-consult] }
          - { id: p02-c-content, points: 3, axis: content, refs: [npa-consult] }
          - { id: p02-c-time, points: 2, axis: time, refs: [jpcert-handling] }
      - id: p02-refuse-plan
        text: { ja: '支払わない前提で連絡を整え、データが公開された場合の監視と本人通知の準備を並行させる。', en: '' }
        minutes: 120
        category: recover
        points: 90
        refs: [npa-consult, ppc-notify-person]
        gauges: { flame: -10, trust: 10, stamina: -10 }
        setFlags: { refusedRansom: true, leakWatch: true }
        items:
          - { id: p02-d-order, points: 8, axis: order, refs: [ppc-notify-person] }
          - { id: p02-d-care, points: 8, axis: care, refs: [ppc-notify-person] }
          - { id: p02-d-content, points: 5, axis: content, refs: [npa-consult] }

  - id: p03-containment
    at: { day: 0, minutes: 630 }
    phase: contain
    sound: { se: [notify_chat] }
    text: { ja: '午前10時30分。受注系の隔離だけでは足りない可能性がある。基幹ネットワークは販売子会社、物流子会社、三つの工場に繋がっている。遮断すれば工場は止まる。止めなければ広がる。切る範囲と順番の技術案を作るのが、あなたの役目だ。', en: '' }
    voices: [v03-boss, v03-field, v03-coward, v03-ok]
    choices:
      - id: p03-partial
        text: { ja: '受注系だけを切り離し、工場のネットワークはそのままにする。', en: '' }
        minutes: 90
        category: hurt
        points: -120
        refs: [nist-sp800-61r3]
        gauges: { damage: 20, flame: 5 }
        delayed:
          - { afterPhases: 1, points: -60, gauges: { damage: 15, trust: -10 }, reason: { ja: '繋いだままにした工場の端末でも、暗号化の被害が出た。', en: '' } }
        items:
          - { id: p03-a-content, points: -10, axis: content, refs: [nist-sp800-61r3] }
          - { id: p03-a-record, points: -5, axis: record, refs: [nist-sp800-61r3] }
      - id: p03-wait
        text: { ja: '遮断はせず、監視を強めて様子を見る。', en: '' }
        minutes: 60
        category: hurt
        points: -80
        refs: [nist-sp800-61r3]
        gauges: { flame: 5, trust: -10 }
        coward: true
        items:
          - { id: p03-b-time, points: -10, axis: time, refs: [nist-sp800-61r3] }
          - { id: p03-b-content, points: -8, axis: content, refs: [nist-sp800-61r3] }
      - id: p03-stop
        text: { ja: '基幹ネットワークの遮断を上申し、切る範囲と復旧の順番を技術案として示す。', en: '' }
        minutes: 90
        category: maintain
        points: 10
        refs: [nist-sp800-61r3, meti-csm-guideline]
        gauges: { flame: 10, damage: -20, trust: 5, stamina: -10 }
        setFlags: { contained: true }
        items:
          - { id: p03-c-time, points: 3, axis: time, refs: [nist-sp800-61r3] }
          - { id: p03-c-order, points: 3, axis: order, refs: [meti-csm-guideline] }
          - { id: p03-c-record, points: 3, axis: record, refs: [jpcert-handling] }
      - id: p03-stop-design
        text: { ja: '遮断を上申し、止められない物流だけを別経路で動かす設計を、業務側と30分で作る。', en: '' }
        minutes: 120
        category: recover
        points: 100
        refs: [nist-sp800-61r3, meti-csm-guideline]
        gauges: { flame: 10, damage: -30, trust: 10, stamina: -15 }
        setFlags: { contained: true, isolatedLogistics: true }
        items:
          - { id: p03-d-order, points: 8, axis: order, refs: [nist-sp800-61r3] }
          - { id: p03-d-content, points: 8, axis: content, refs: [nist-sp800-61r3] }
          - { id: p03-d-care, points: 8, axis: care, refs: [meti-csm-guideline] }

  - id: p04-evidence
    at: { day: 0, minutes: 840 }
    phase: contain
    sound: { se: [phone_ring] }
    text: { ja: '午後2時。現場から「初期化して作り直したい」と声が上がる。受注を止めて半日が経つ。メモリには動いている不審なプログラムが残り、ディスクには侵入に使われた形跡がある。初期化すれば復旧は早いが、痕跡は消える。初期化を許すかどうかは、あなたが決める。', en: '' }
    voices: [v04-expert, v04-vendor, v04-past, v04-ok]
    notable:
      - { id: note-lead-evidence, text: { ja: 'メモリに不審なプログラム、ディスクに侵入の形跡。初期化すると消える。', en: '' } }
    choices:
      - id: p04-wipe
        text: { ja: '初期化を許可し、復旧を優先する。', en: '' }
        minutes: 120
        category: fatal
        points: -250
        refs: [nist-sp800-61r3]
        gauges: { damage: 20, trust: -15 }
        setFlags: { evidenceLost: true }
        delayed:
          - { afterPhases: 2, points: -80, gauges: { flame: 15 }, reason: { ja: '侵入経路も漏えい範囲も分からないまま、説明だけを求められた。', en: '' } }
        items:
          - { id: p04-a-record, points: -20, axis: record, refs: [nist-sp800-61r3] }
          - { id: p04-a-content, points: -15, axis: content, refs: [nist-sp800-61r3] }
          - { id: p04-a-order, points: -10, axis: order, refs: [cissp-cbk-secops] }
      - id: p04-poweroff
        text: { ja: '全台の電源を落として、調査は落ち着いてからにする。', en: '' }
        minutes: 60
        category: hurt
        points: -80
        refs: [nist-sp800-61r3]
        gauges: { damage: 10, stamina: 5 }
        items:
          - { id: p04-b-record, points: -10, axis: record, refs: [nist-sp800-61r3] }
          - { id: p04-b-time, points: -8, axis: time, refs: [jpcert-handling] }
      - id: p04-image
        text: { ja: '影響した端末のメモリとディスクイメージを取得し、ハッシュ値と保管場所を記録してから復旧に入る。', en: '' }
        minutes: 120
        category: maintain
        points: 10
        refs: [nist-sp800-61r3, jpcert-handling]
        gauges: { damage: -10, stamina: -15, trust: 5 }
        setFlags: { evidencePreserved: true }
        items:
          - { id: p04-c-record, points: 5, axis: record, refs: [nist-sp800-61r3] }
          - { id: p04-c-order, points: 4, axis: order, refs: [cissp-cbk-secops] }
          - { id: p04-c-time, points: 3, axis: time, refs: [jpcert-handling] }
      - id: p04-image-chain
        text: { ja: 'イメージの取得に加え、感染が疑われる端末も同じ手順で保全し、取得の担当と時刻を管理の連鎖として残す。', en: '' }
        minutes: 180
        category: recover
        points: 110
        refs: [nist-sp800-61r3, cissp-cbk-secops]
        gauges: { damage: -10, stamina: -20, trust: 5 }
        setFlags: { evidencePreserved: true, evidenceChain: true }
        items:
          - { id: p04-d-record, points: 10, axis: record, refs: [cissp-cbk-secops] }
          - { id: p04-d-content, points: 8, axis: content, refs: [nist-sp800-61r3] }
          - { id: p04-d-order, points: 5, axis: order, refs: [nist-sp800-61r3] }

  - id: p05-group
    at: { day: 0, minutes: 1020 }
    phase: organize
    sound: { se: [notify_chat] }
    text: { ja: '午後5時。グループ各社の情報システム担当が集まった。販売子会社は自社だけ先に再開したいと言い、物流子会社は共通の認証基盤なので動けないと言う。親会社の判断はまだ出ていない。技術側の調整役は、あなたしかいない。', en: '' }
    voices: [v05-group, v05-coward, v05-ok]
    choices:
      - id: p05-split
        text: { ja: '販売子会社だけを、別のネットワークで先に再開させる。', en: '' }
        minutes: 120
        category: hurt
        points: -100
        refs: [nist-sp800-61r3]
        gauges: { damage: 15, trust: -5 }
        delayed:
          - { afterPhases: 1, points: -50, gauges: { damage: 15, trust: -10 }, reason: { ja: '先に再開した販売子会社の端末から、再び不審な通信が出た。', en: '' } }
        items:
          - { id: p05-a-order, points: -10, axis: order, refs: [nist-sp800-61r3] }
          - { id: p05-a-content, points: -8, axis: content, refs: [nist-sp800-61r3] }
      - id: p05-leave
        text: { ja: '各社の判断に任せ、技術的な助言だけにする。', en: '' }
        minutes: 30
        category: hurt
        points: -60
        refs: [meti-csm-guideline]
        gauges: { trust: -10 }
        coward: true
        items:
          - { id: p05-b-order, points: -10, axis: order, refs: [meti-csm-guideline] }
          - { id: p05-b-record, points: -8, axis: record, refs: [meti-csm-guideline] }
      - id: p05-unify
        text: { ja: '共通の認証基盤の復旧を最優先にし、各社の再開順を技術案として一本化する。', en: '' }
        minutes: 90
        category: maintain
        points: 10
        refs: [meti-csm-guideline]
        gauges: { trust: 5, stamina: -10 }
        setFlags: { groupUnified: true }
        items:
          - { id: p05-c-order, points: 3, axis: order, refs: [meti-csm-guideline] }
          - { id: p05-c-record, points: 3, axis: record, refs: [meti-csm-guideline] }
          - { id: p05-c-time, points: 3, axis: time, refs: [meti-csm-guideline] }
      - id: p05-unify-doc
        text: { ja: '再開順を一本化し、各社の接続条件と連絡先、切り戻しの条件を文書にして共有する。', en: '' }
        minutes: 150
        category: recover
        points: 100
        refs: [meti-csm-guideline]
        gauges: { flame: -5, trust: 15, stamina: -15 }
        setFlags: { groupUnified: true, groupPlan: true }
        items:
          - { id: p05-d-order, points: 8, axis: order, refs: [meti-csm-guideline] }
          - { id: p05-d-record, points: 8, axis: record, refs: [meti-csm-guideline] }
          - { id: p05-d-content, points: 8, axis: content, refs: [meti-csm-guideline] }

  - id: p06-external
    at: { day: 1, minutes: 540 }
    phase: organize
    sound: { se: [phone_ring] }
    text: { ja: '火曜の朝9時。外部の手を借りる段階。保険会社のインシデント対応窓口、契約している調査会社、警察の相談窓口、そして弁護士。順番と契約の範囲を決めなければ、動き出せない。費用の説明も、あなたが経営にすることになる。', en: '' }
    voices: [v06-vendor, v06-expert, v06-boss, v06-ok]
    choices:
      - id: p06-single
        text: { ja: '調査を一社に任せ、警察への相談は結果が出てからにする。', en: '' }
        minutes: 60
        category: hurt
        points: -80
        refs: [npa-consult]
        gauges: { trust: -10 }
        items:
          - { id: p06-a-order, points: -10, axis: order, refs: [npa-consult] }
          - { id: p06-a-content, points: -8, axis: content, refs: [meti-csm-guideline] }
      - id: p06-cheap
        text: { ja: '費用を抑えるため、知り合いの技術者に調査を頼む。', en: '' }
        minutes: 60
        category: hurt
        points: -70
        refs: [ipa-sme-guideline]
        gauges: { trust: -5 }
        coward: true
        items:
          - { id: p06-b-content, points: -10, axis: content, refs: [ipa-sme-guideline] }
          - { id: p06-b-record, points: -8, axis: record, refs: [ipa-sme-guideline] }
      - id: p06-order
        text: { ja: '保険会社、調査会社、警察、弁護士の順に連絡し、対応の記録を残す。', en: '' }
        minutes: 90
        category: maintain
        points: 10
        refs: [npa-consult, jpcert-handling]
        gauges: { trust: 5, stamina: -10 }
        setFlags: { reportedPolice: true }
        items:
