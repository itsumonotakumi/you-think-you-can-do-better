          - { id: p20-d-record, points: 8, axis: record, refs: [meti-disclosure-guidance] }
          - { id: p20-d-care, points: 8, axis: care, refs: [meti-csm-guideline] }

  - id: p21-final
    at: { day: 27, minutes: 600 }
    phase: after
    sound: { se: [typing] }
    text: { ja: '個人情報保護委員会への確報の期限が近い。件数は確定し、対象は顧客名簿の一部、項目は氏名・住所・電話番号・注文履歴。侵入経路と対策も書ける。だが、書き切れない項目が一つ残っている。復号できなかったデータの最終的な扱いだ。', en: '' }
    voices: [v21-law, v21-coward, v21-ok]
    choices:
      - id: p21-wait
        text: { ja: 'すべての項目が揃うまで、確報を出さない。', en: '' }
        minutes: 90
        category: hurt
        points: -150
        refs: [ppc-report-final]
        gauges: { flame: 15, trust: -15 }
        coward: true
        items:
          - { id: p21-a-time, points: -10, axis: time, refs: [ppc-report-final] }
          - { id: p21-a-record, points: -8, axis: record, refs: [ppc-report-final] }
      - id: p21-vague
        text: { ja: '確定した項目だけを書いて出す。', en: '' }
        minutes: 90
        category: hurt
        points: -60
        refs: [ppc-report-final]
        gauges: { trust: -5 }
        items:
          - { id: p21-b-content, points: -8, axis: content, refs: [ppc-report-final] }
          - { id: p21-b-record, points: -5, axis: record, refs: [ppc-report-final] }
      - id: p21-file
        text: { ja: '不明点は不明と書いて、期限どおりに確報を出す。', en: '' }
        minutes: 120
        category: maintain
        points: 10
        refs: [ppc-report-final]
        gauges: { trust: 5, stamina: -10 }
