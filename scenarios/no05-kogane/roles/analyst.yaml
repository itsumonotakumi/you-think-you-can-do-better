    at: { day: 1, minutes: 120 }
    voices: [va-ev-night]
    gauges: { stamina: -5 }
    sound: { se: [notify_chat] }
    caption: { ja: '深夜。監視画面の警告は鳴り続けている。', en: '' }
  - id: ev-competitor
    at: { day: 1, minutes: 720 }
    voices: [va-ev-competitor]
    gauges: { flame: 5 }
    sound: { se: [notify_news] }
    caption: { ja: '取引先から、競合の営業が回り始めたという連絡が入る。', en: '' }
  - id: ev-fax
    at: { day: 2, minutes: 1080 }
    voices: [va-ev-fax]
    gauges: { flame: 3 }
    caption: { ja: '取引先からの注文は、FAXで届き続けている。', en: '' }
  - id: ev-rumor
    at: { day: 4, minutes: 540 }
    voices: [va-ev-rumor]
    gauges: { flame: 5 }
    sound: { se: [notify_sns] }
    caption: { ja: '掲示板に、身代金を払ったという書き込みが出始めた。', en: '' }
