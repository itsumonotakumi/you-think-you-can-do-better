    voices: [va01-field, va01-boss, va01-vendor, va01-ok]
    notable:
      - { id: note-first-call, text: { ja: '7時30分、受注サーバーで警告。共有フォルダに身代金要求文。出荷の指示が止まった。', en: '' } }
    choices:
