# No.5 コガネ酒造HD / セキュリティ担当者（情報システム部の主任・兼任）ロール
# 視点: 専任のセキュリティ部署がない会社で、受注システムの運用と一次対応を兼務する担当者。
#       見えるのは監視画面、ログ、端末、アカウント、現場のチャット。できるのは隔離・停止・保全・一次報告まで。
#       公表、予算、取引先との契約は上に上げる。外部の調査会社と保険会社の窓口が相談先。
# 判断ポイント21、細目は choices[].items と drafts の合計で80以上。
estimateMinutes: 40
intro: { ja: 'あなたはコガネ酒造ホールディングスの情報システム部の主任。受注システムの運用と、セキュリティの一次対応を兼務している。専任のセキュリティ部署はなく、頼れるのはセキュリティ統括を兼ねる先輩、外部の調査会社、保険会社の窓口だ。朝7時30分、監視画面の警告と、共有フォルダの身代金要求文から、あなたの一か月が始まる。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-ppc-prelim
    ref: ppc-report-prelim
    label: { ja: '漏えい等報告の速報に使う材料の提出', en: '' }
    points: -100
    doneFlag: ppcMaterialsSent
  - id: dl-ppc-final
    ref: ppc-report-final-malicious
    label: { ja: '漏えい等報告の確報に使う材料の提出', en: '' }
    points: -80
    doneFlag: ppcFinalMaterialsSent
