# No.2 ペイブリッジ / セキュリティ担当者ロール
# 見えるのは、監視画面のアラート、ログ、端末、現場からのチャット。
# 判断ポイント19、細目は choices[].items と drafts の合計で80以上。
estimateMinutes: 40
intro: { ja: 'あなたはペイブリッジのセキュリティ担当者。監視画面のアラートとログ、そして現場からのチャットが、あなたの持ち場だ。決済を止める権限も、公表する権限もない。だが、最初に気づき、事実を記録し、上に渡すのはあなたの仕事である。注意喚起が出た日の夕方、監視画面の一行が目に入る。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-prelim-material
    ref: ppc-report-prelim
    label: { ja: '個人情報保護委員会への速報の材料提出', en: '' }
    points: -60
    doneFlag: prelimMaterialsSent
  - id: dl-final-material
    ref: ppc-report-final-malicious
    label: { ja: '個人情報保護委員会への確報の材料提出', en: '' }
    points: -50
    doneFlag: finalMaterialsSent
events:
  - id: ev-a-night
    at: { day: 1, minutes: 90 }
    voices: [v-ev-night]
    gauges: { stamina: -5 }
    sound: { se: [notify_chat] }
    caption: { ja: '深夜。監視画面のアラートが鳴り続けている。', en: '' }
  - id: ev-a-board
    at: { day: 3, minutes: 540 }
    voices: [v-ev-board]
    gauges: { flame: 5 }
    caption: { ja: '社内掲示板に、現場からの書き込みが増えている。', en: '' }
  - id: ev-a-client
    at: { day: 5, minutes: 540 }
    voices: [v-ev-client]
    gauges: { flame: 5 }
    sound: { se: [phone_ring] }
    caption: { ja: '委託元から、調査状況の説明を求められている。', en: '' }
points:
  - id: a01-first-alert
    at: { day: 0, minutes: 975 }
    phase: detect
    sound: { se: [notify_chat] }
    text: { ja: '16時15分。広く使われている業務フレームワークの脆弱性が公表された三十分後、委託元の自治体の税金払いサイトで、外部への不審な通信を検知した。WAFの記録には、攻撃らしき文字列が並んでいる。影響の範囲はまだ分からない。', en: '' }
    voices: [v01-field, v01-boss, v01-ok]
    popular: { choiceId: a01-vendor, percent: 58 }
    notable:
      - { id: note-first-alert, text: { ja: '16時15分、自治体の税金払いサイトで外部への不審な通信を検知。宛先と時刻を記録した。', en: '' } }
    choices:
      - id: a01-isolate
        text: { ja: '端末をネットワークから隔離し、通信の宛先とプロセスを記録して保全する。', en: '' }
        minutes: 45
        category: maintain
        points: 30
        refs: [nist-sp800-61r3, jpcert-handling]
        gauges: { damage: -10, trust: 5, stamina: -5 }
        setFlags: { isolateStart: true }
        items:
          - { id: a01-b-time, points: 4, axis: time, refs: [jpcert-handling] }
          - { id: a01-b-order, points: 6, axis: order, refs: [nist-sp800-61r3] }
          - { id: a01-b-record, points: 6, axis: record, refs: [jpcert-handling] }
          - { id: a01-b-content, points: 4, axis: content, refs: [nist-sp800-61r3] }
        explain: { ja: '隔離して通信先とプロセスを記録し、メモリを保全した。被害を止めながら証拠も残している。', en: '' }
      - id: a01-poweroff
        text: { ja: '危険なので、そのサーバーの電源を抜いて止め、しばらく様子を見る。', en: '' }
        minutes: 30
        category: hurt
        points: -30
        refs: [nist-sp800-61r3]
        gauges: { damage: -10, stamina: -5 }
        items:
          - { id: a01-a-record, points: -10, axis: record, refs: [nist-sp800-61r3] }
          - { id: a01-a-content, points: -8, axis: content, refs: [jpcert-handling] }
          - { id: a01-a-time, points: 2, axis: time, refs: [nist-sp800-61r3] }
        explain: { ja: '電源を切ると、メモリ上の証拠が失われる。危険を止める判断は妥当でも、記録の順序が逆だ。', en: '' }
      - id: a01-vendor
        text: { ja: '監視サービスのベンダーに誤検知かどうかを確認し、返事を待つ。', en: '' }
        minutes: 90
        category: hurt
        points: -30
        refs: [meti-csm-guideline]
        gauges: { damage: 5, trust: -5 }
        coward: true
        items:
          - { id: a01-c-time, points: -8, axis: time, refs: [jpcert-handling] }
          - { id: a01-c-order, points: -4, axis: order, refs: [meti-csm-guideline] }
          - { id: a01-c-record, points: -6, axis: record, refs: [jpcert-handling] }
        explain: { ja: 'ベンダーの返事を待つ間に、被害が広がる。誤検知の確認と並行して調査を進めるべきだ。', en: '' }
      - id: a01-delete
        text: { ja: '不審なファイルを削除し、サーバーをきれいにしてから様子を見る。', en: '' }
        minutes: 45
        category: fatal
        points: -200
        refs: [nist-sp800-61r3, jpcert-handling]
        gauges: { damage: 10, flame: 15, trust: -20 }
        setFlags: { destroyedEvidence: true }
        items:
          - { id: a01-d-record, points: -16, axis: record, refs: [jpcert-handling] }
          - { id: a01-d-content, points: -12, axis: content, refs: [nist-sp800-61r3] }
          - { id: a01-d-wording, points: -8, axis: wording, refs: [meti-disclosure-guidance] }
        explain: { ja: 'ファイルを消すと、侵入の痕跡も手口も分からなくなる。再発の危険が残る。再発の危険を残す。', en: '' }

    lesson: { ja: '端末の異常を見つけたら、電源を切る前に記録を残す。隔離して通信の宛先とプロセスを控え、メモリを保全する。削除や再起動は、侵入の痕跡を消す。誤検知の確認を待つ間も、調査に必要な情報は集められる。', en: '' }
  - id: a02-scope
    at: { day: 0, minutes: 1050 }
    phase: contain
    sound: { se: [notify_chat] }
    text: { ja: '17時30分。同じフレームワークは、社内の決済サーバー、バックアップ系、委託元の接続装置にも残っている。修正を当てる候補は、台帳の上では三百台を超える。', en: '' }
    voices: [v02-vendor, v02-popular, v02-ok]
    popular: { choiceId: a02-one, percent: 61 }
    choices:
      - id: a02-one
        text: { ja: '目の前の一台だけ修正し、ほかは監視を強めて様子を見る。', en: '' }
        minutes: 90
        category: hurt
        points: -30
        refs: [nist-sp800-61r3]
        gauges: { damage: 15, flame: 5 }
        delayed:
          - { afterPhases: 1, points: -12, gauges: { damage: 15, trust: -10 }, reason: { ja: '直していないサーバーから、同じ手口の通信が再び出た。', en: '' } }
        items:
          - { id: a02-a-content, points: -8, axis: content, refs: [nist-sp800-61r3] }
          - { id: a02-a-record, points: 2, axis: record, refs: [jpcert-handling] }
          - { id: a02-a-time, points: -6, axis: time, refs: [nist-sp800-61r3] }
        explain: { ja: '目の前の一台だけでは、横展開を見落とす。全体の影響を把握できない。関係先の不信を招きやすい。', en: '' }
      - id: a02-inventory-plan
        text: { ja: '一覧に加え、修正の適用順と決済の代替経路を設計して上に出す。', en: '' }
        minutes: 180
        category: recover
        points: 150
        refs: [meti-csm-guideline, nist-sp800-61r3]
        gauges: { damage: -15, trust: 5, stamina: -15 }
        setFlags: { scopeMapped: true }
        items:
          - { id: a02-c-order, points: 6, axis: order, refs: [nist-sp800-61r3] }
          - { id: a02-c-content, points: 6, axis: content, refs: [meti-csm-guideline] }
          - { id: a02-c-care, points: 4, axis: care, refs: [meti-csm-guideline] }
          - { id: a02-c-record, points: 4, axis: record, refs: [jpcert-handling] }
        explain: { ja: '一覧に加え、適用順と決済の代替経路を設計した。業務を止めない視点が強い。現場の負担も抑えられる。', en: '' }
      - id: a02-inventory
        text: { ja: '台帳と実機を突き合わせ、影響する機器とバックアップ系を一覧にする。', en: '' }
        minutes: 120
        category: maintain
        points: 30
        refs: [meti-csm-guideline, jpcert-handling]
        gauges: { damage: -10, stamina: -10 }
        items:
          - { id: a02-b-content, points: 6, axis: content, refs: [nist-sp800-61r3] }
          - { id: a02-b-record, points: 6, axis: record, refs: [jpcert-handling] }
          - { id: a02-b-order, points: 4, axis: order, refs: [meti-csm-guideline] }
        explain: { ja: '台帳と実機を突き合わせ、影響する機器とバックアップを一覧にした。範囲の把握として妥当だ。', en: '' }
      - id: a02-all-patch
        text: { ja: '検証を飛ばして、すべての機器に一斉に修正を当てて回る。', en: '' }
        minutes: 120
        category: hurt
        points: -30
        refs: [nist-sp800-61r3]
        gauges: { flame: 10, trust: -10 }
        items:
          - { id: a02-d-order, points: -10, axis: order, refs: [nist-sp800-61r3] }
          - { id: a02-d-care, points: -8, axis: care, refs: [meti-csm-guideline] }
          - { id: a02-d-time, points: 4, axis: time, refs: [nist-sp800-61r3] }
        explain: { ja: '検証なしの一斉適用は、業務を止める危険がある。切り戻しも効かない。後の訂正や説明の負担が増える。', en: '' }

    lesson: { ja: '影響範囲は、目の前の一台ではなく台帳と実機の突き合わせで決める。修正の適用順と、止められない決済の代替経路を設計して上に出す。全台に一斉に当てると、検証のない変更で業務を止める。', en: '' }
  - id: a03-logs
    at: { day: 0, minutes: 1125 }
    phase: contain
    sound: { se: [typing] }
    text: { ja: '18時45分。監視ログの保存期間は三十日で、今夜零時に古いものが消える。消える前の期間には、侵入の手口と、外部へ出た通信の記録が残っている。', en: '' }
    voices: [v03-law, v03-expert, v03-ok]
    notable:
      - { id: note-log-retention, text: { ja: '監視ログの保存期間は三十日。今夜零時に古い記録が削除される。', en: '' } }
    choices:
      - id: a03-wait
        text: { ja: '規程どおり、零時の自動削除に任せて何もしないでおく。', en: '' }
        minutes: 60
        category: hurt
        points: -37
        refs: [jpcert-handling]
        gauges: { damage: 10, flame: 5, trust: -10 }
        coward: true
        delayed:
          - { afterPhases: 1, points: -15, gauges: { damage: 10 }, reason: { ja: '必要なログが消え、侵入の手口を追えなくなった。', en: '' } }
        items:
          - { id: a03-a-record, points: -12, axis: record, refs: [jpcert-handling] }
          - { id: a03-a-content, points: -8, axis: content, refs: [nist-sp800-61r3] }
          - { id: a03-a-time, points: -6, axis: time, refs: [jpcert-handling] }
        explain: { ja: '零時の削除に任せると、必要なログが消える。調査の前提が崩れる。関係先の不信を招きやすい。', en: '' }
      - id: a03-export
        text: { ja: '調査対象の期間を切り出し、ハッシュと取得時刻を付けて保存する。', en: '' }
        minutes: 90
        category: maintain
        points: 30
        refs: [nist-sp800-61r3, cissp-cbk-secops]
        gauges: { damage: -5, trust: 5, stamina: -10 }
        items:
          - { id: a03-b-record, points: 6, axis: record, refs: [cissp-cbk-secops] }
          - { id: a03-b-order, points: 6, axis: order, refs: [nist-sp800-61r3] }
          - { id: a03-b-content, points: 4, axis: content, refs: [nist-sp800-61r3] }
          - { id: a03-b-time, points: 4, axis: time, refs: [jpcert-handling] }
        explain: { ja: '対象期間を切り出し、ハッシュと取得時刻を付けた。証拠として使える形になっている。', en: '' }
      - id: a03-export-plan
        text: { ja: '保全に加え、保存期間の延長と外部への引き渡し手順を決める。', en: '' }
        minutes: 120
        category: recover
        points: 120
        refs: [nist-sp800-61r3, cissp-cbk-secops]
        gauges: { damage: -10, trust: 10, stamina: -10 }
        setFlags: { logsPreserved: true }
        items:
          - { id: a03-c-record, points: 6, axis: record, refs: [cissp-cbk-secops] }
          - { id: a03-c-order, points: 6, axis: order, refs: [nist-sp800-61r3] }
          - { id: a03-c-content, points: 4, axis: content, refs: [jpcert-handling] }
          - { id: a03-c-care, points: 4, axis: care, refs: [meti-csm-guideline] }
        explain: { ja: '保全に加え、保存期間の延長と引き渡し手順を決めた。後の調査がつながる。現場の負担も抑えられる。', en: '' }
      - id: a03-retention
        text: { ja: '保存期間の設定だけを延ばし、今夜の削除は止めない。', en: '' }
        minutes: 45
        category: hurt
        points: -30
        refs: [jpcert-handling]
        gauges: { trust: -5 }
        items:
          - { id: a03-d-record, points: -8, axis: record, refs: [jpcert-handling] }
          - { id: a03-d-order, points: -6, axis: order, refs: [nist-sp800-61r3] }
        explain: { ja: '設定だけ延ばしても、今夜の削除は止まらない。目の前のログが失われる。関係先の不信を招きやすい。', en: '' }

    lesson: { ja: 'ログは、削除される前に保全する。対象期間を切り出し、ハッシュと取得時刻を付けて保存する。保存期間の延長と外部への引き渡し手順まで決めておけば、後の調査がつながらない事態を避けられる。', en: '' }
  - id: a04-first-report
    at: { day: 0, minutes: 1200 }
    phase: organize
    sound: { se: [typing] }
    text: { ja: '20時。セキュリティ責任者への一次報告の時間。影響の範囲はまだ分かっていない。決済基盤部長からは「決済だけは止めないでくれ」とだけ返ってきている。', en: '' }
    voices: [v04-boss, v04-bold, v04-ok]
    choices:
      - id: a04-wait
        text: { ja: '全容が分かってから、まとめて報告しようとして待つ。', en: '' }
        minutes: 120
        category: hurt
        points: -30
        refs: [jpcert-handling]
        gauges: { flame: 10, trust: -10, damage: 5 }
        coward: true
        items:
          - { id: a04-a-time, points: -8, axis: time, refs: [jpcert-handling] }
          - { id: a04-a-record, points: -6, axis: record, refs: [jpcert-handling] }
        explain: { ja: '全容を待つ間に、現場と上への情報が止まる。初動の判断が遅れる。再発の危険を残す。', en: '' }
      - id: a04-sns
        text: { ja: '自分のSNSに大きな障害が出ていると書いて、現場に知らせる。', en: '' }
        minutes: 30
        category: hurt
        points: -100
        refs: [meti-disclosure-guidance]
        gauges: { flame: 15, trust: -10 }
        delayed:
          - { afterPhases: 1, points: -12, gauges: { flame: 15, trust: -10 }, reason: { ja: '担当者の投稿が特定され、会社の説明と食い違った。', en: '' } }
        items:
          - { id: a04-c-wording, points: -12, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: a04-c-record, points: -8, axis: record, refs: [jpcert-handling] }
          - { id: a04-c-care, points: -4, axis: care, refs: [meti-csm-guideline] }
        explain: { ja: 'SNSで知らせると、情報が制御できない。誤った内容が広がる恐れがある。関係先の不信を招きやすい。', en: '' }
      - id: a04-oral
        text: { ja: '口頭で短く伝え、書面での報告は後回しにしてしまう。', en: '' }
        minutes: 30
        category: hurt
        points: -30
        refs: [jpcert-handling]
        gauges: { trust: -5 }
        items:
          - { id: a04-d-record, points: -8, axis: record, refs: [jpcert-handling] }
          - { id: a04-d-order, points: -4, axis: order, refs: [jpcert-handling] }
        explain: { ja: '口頭だけでは記録が残らない。後から経緯をたどれない。後の訂正や説明の負担が増える。', en: '' }
      - id: a04-report
        text: { ja: '30分以内に、事実・不明点・次の行動を分けて一次報告する。', en: '' }
        minutes: 45
        category: maintain
        points: 30
        refs: [jpcert-handling, cissp-cbk-secops]
        gauges: { trust: 5, stamina: -5 }
        detail: first-note
        setFlags: { firstReport: true }
        items:
          - { id: a04-b-time, points: 6, axis: time, refs: [jpcert-handling] }
          - { id: a04-b-order, points: 4, axis: order, refs: [cissp-cbk-secops] }
          - { id: a04-b-record, points: 4, axis: record, refs: [jpcert-handling] }
          - { id: a04-b-content, points: 4, axis: content, refs: [cissp-cbk-secops] }
        explain: { ja: '30分以内に事実、不明点、次の行動を分けて報告した。一次報告として十分だ。現場の負担も抑えられる。', en: '' }

    lesson: { ja: '一次報告は、全容が分かるのを待たない。30分以内に、事実、不明点、次の行動を分けて伝える。SNSで知らせると情報が制御できず、口頭だけでは記録が残らない。迷ったときは、事実と時系列に戻る。', en: '' }
  - id: a05-keys
    at: { day: 0, minutes: 1335 }
    phase: contain
    sound: { se: [notify_chat] }
    text: { ja: '22時15分。侵害されたサーバーから、決済基盤の管理APIキーと、委託元の連携用キーが読める状態だった。止めれば、委託元の収納処理も止まる。', en: '' }
    voices: [v05-vendor, v05-law, v05-ok]
    choices:
      - id: a05-rotate-plan
        text: { ja: '失効と再発行に加え、同じキーを使う全システムの切替まで検証する。', en: '' }
        minutes: 180
        category: recover
        points: 150
        refs: [nist-sp800-61r3, meti-csm-guideline]
        gauges: { damage: -15, trust: 10, stamina: -15 }
        setFlags: { keysRotated: true, keyScope: true }
        items:
          - { id: a05-c-order, points: 6, axis: order, refs: [nist-sp800-61r3] }
          - { id: a05-c-content, points: 6, axis: content, refs: [meti-csm-guideline] }
          - { id: a05-c-record, points: 4, axis: record, refs: [jpcert-handling] }
          - { id: a05-c-care, points: 4, axis: care, refs: [meti-csm-guideline] }
        explain: { ja: '同じキーを使う全システムを洗い出し、切替まで検証した。影響を残さない。復旧までの時間を短くできる。', en: '' }
      - id: a05-keep
        text: { ja: '影響が確認できるまで、キーは有効のままにして待つ方針。', en: '' }
        minutes: 60
        category: hurt
        points: -30
        refs: [nist-sp800-61r3]
        gauges: { damage: 15, trust: -10 }
        delayed:
          - { afterPhases: 1, points: -15, gauges: { damage: 20, flame: 10 }, reason: { ja: '止めなかったキーで、外部から顧客データへのアクセスが続いた。', en: '' } }
        items:
          - { id: a05-a-content, points: -10, axis: content, refs: [nist-sp800-61r3] }
          - { id: a05-a-record, points: -8, axis: record, refs: [jpcert-handling] }
        explain: { ja: '有効なままにすると、侵害された鍵で再侵入される。確認を待つ余裕はない。再発の危険を残す。', en: '' }
      - id: a05-rotate
        text: { ja: '侵害されたキーを失効させ、新しいキーを発行して切替を案内する。', en: '' }
        minutes: 120
        category: maintain
        points: 30
