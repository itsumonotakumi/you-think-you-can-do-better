# No.2 ペイブリッジ / セキュリティ部門長（CSIRTリーダー）ロール
# 判断ポイント21、細目は choices[].items と drafts の合計で80以上。
# 視点: 技術の状況と経営の意向の両方を見る部門長。体制づくり、証拠の保全、
#       外部専門家の手配、経営への上申が仕事。公表や事業停止の決定権は持たない。
estimateMinutes: 50
intro: { ja: 'あなたはペイブリッジのセキュリティ部門長で、CSIRTのリーダー。執行役員セキュリティ責任者の黒瀬の下で、決済基盤の監視とインシデント対応を預かる。注意喚起が出た日の16時、影響調査の画面に、委託元の自治体の税金払いサイトから外部への不審な通信が映った。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-prelim
    ref: ppc-report-prelim
    label: { ja: '個人情報保護委員会への速報', en: '' }
    points: -150
    doneFlag: ppcPrelimFiled
  - id: dl-final
    ref: ppc-report-final-malicious
    label: { ja: '個人情報保護委員会への確報（不正の目的）', en: '' }
    points: -100
    doneFlag: ppcFinalFiled
events:
  - id: ev-card-inquiry
    at: { day: 1, minutes: 660 }
    voices: [v-ev-card]
    gauges: { flame: 5 }
    sound: { se: [notify_news] }
    caption: { ja: 'カード会社から技術照会が来ている。', en: '' }
  - id: ev-other-victim
    at: { day: 4, minutes: 510 }
    voices: [v-ev-other]
    gauges: { flame: 5 }
    caption: { ja: '別の委託元でも、同じ手口の痕跡が見つかった。', en: '' }
  - id: ev-extortion
    at: { day: 2, minutes: 960 }
    voices: [v-ev-extortion]
    gauges: { flame: 5 }
    sound: { se: [mail_arrive] }
    caption: { ja: '研究者を名乗る人物から、データ公開を予告するメールが届いた。', en: '' }
  - id: ev-rumor
    at: { day: 7, minutes: 720 }
    voices: [v-ev-rumor]
    gauges: { flame: 5 }
    caption: { ja: '根拠のない書き込みが広がっている。', en: '' }
points:
  - id: p01-trace
    at: { day: 0, minutes: 960 }
    phase: detect
    sound: { se: [notify_chat] }
    text: { ja: '16時。注意喚起が出た日の夕方、影響調査の画面に、委託元の自治体の税金払いサイトから外部への不審な通信が映った。同じフレームワークを使うテナントは、決済基盤にまだ数百ある。', en: '' }
    voices: [v01-boss, v01-field, v01-ok]
    notable:
      - { id: note-first-trace, text: { ja: 'Day 0 16時、自治体の税金払いサイトに外部への不審な通信。同じフレームワークのテナントが数百残っている。', en: '' } }
    choices:
      - id: p01-wait
        text: { ja: '誤検知の可能性が高いと判断し、明日の定例会議でまとめて報告する。', en: '' }
        minutes: 90
        category: hurt
        points: -120
        refs: [jpcert-handling]
        gauges: { flame: -5, trust: -5 }
        coward: true
        setFlags: { delayedTriage: true }
        delayed:
          - { afterPhases: 1, points: -40, gauges: { damage: 15 }, reason: { ja: '隔離が遅れたテナントから、同じ認証情報を使って横展開が始まった。', en: '' } }
        items:
          - { id: p01-a-time, points: -10, axis: time, refs: [jpcert-handling] }
          - { id: p01-a-order, points: -8, axis: order, refs: [jpcert-handling] }
        explain: { ja: '誤検知と決めつけて会議に回すと、その間の通信が残る。初動の遅れが被害を広げる。現場の混乱が長引く。', en: '' }
      - id: p01-solo
        text: { ja: '自分でログを読み、該当するテナントだけを一時遮断して報告は後にする。', en: '' }
        minutes: 60
        category: hurt
        points: -50
        refs: [nist-sp800-61r3]
        gauges: { stamina: -10, trust: -5 }
        items:
          - { id: p01-b-order, points: -10, axis: order, refs: [nist-sp800-61r3] }
          - { id: p01-b-record, points: -8, axis: record, refs: [jpcert-handling] }
        explain: { ja: '自分で遮断する行動力はあるが、報告が遅れ、他の影響を見落とす。指揮と調査が止まる。', en: '' }
      - id: p01-triage
        text: { ja: 'CSIRTを招集し、疑わしいテナントを遮断して証拠を保全し、第一報を入れる。', en: '' }
        minutes: 45
        category: maintain
        points: 20
        refs: [jpcert-handling, nist-sp800-61r3]
        gauges: { damage: -5, stamina: -10, trust: 5 }
        setFlags: { triageStarted: true }
        items:
          - { id: p01-c-order, points: 5, axis: order, refs: [nist-sp800-61r3] }
          - { id: p01-c-record, points: 1, axis: record, refs: [jpcert-handling] }
        explain: { ja: '招集、遮断、証拠保全、第一報をまとめて動いた。初動の型ができており、被害を抑えやすい。', en: '' }
      - id: p01-impact
        text: { ja: '招集と遮断、証拠の保全に加え、委託元への影響を30分で評価して経営に渡す。', en: '' }
        minutes: 75
        category: recover
        points: 50
        refs: [jpcert-handling, meti-csm-guideline]
        gauges: { damage: -10, stamina: -15, trust: 10 }
        setFlags: { triageStarted: true, impactAssessed: true }
        items:
          - { id: p01-d-care, points: 8, axis: care, refs: [meti-csm-guideline] }
          - { id: p01-d-record, points: 5, axis: record, refs: [jpcert-handling] }
        explain: { ja: '初動に加え、委託元への影響を短時間で評価して経営に渡した。判断と説明の両方が早くなる。', en: '' }

    lesson: { ja: '検知の初動では、誤検知かどうかの判断を待たずに動く。招集、遮断、証拠の保全、第一報を同時に進め、委託元と決済基盤への影響を短時間で評価する。自分だけで抱えたり、会議に先延ばしにしたりすると、その間の通信と被害が残る。', en: '' }
  - id: p02-evidence
    at: { day: 0, minutes: 1050 }
    phase: contain
    sound: { se: [notify_chat] }
    text: { ja: '17時30分。修正を当てるなら今。ただしバックアップ系にも同じ穴がある。初期化して作り直したいという声と、証拠を残したいという声が同時に来ている。', en: '' }
    voices: [v02-expert, v02-field, v02-ok]
    choices:
      - id: p02-wipe
        text: { ja: '影響したサーバーを初期化して作り直し、証拠より復旧を優先する。', en: '' }
        minutes: 120
        category: fatal
        points: -300
        refs: [nist-sp800-61r3]
        gauges: { damage: 20, trust: -20 }
        setFlags: { evidenceLost: true }
        delayed:
          - { afterPhases: 2, points: -80, gauges: { flame: 15 }, reason: { ja: '侵入経路も漏えい範囲も分からないまま、説明だけを求められた。', en: '' } }
        items:
          - { id: p02-a-record, points: -20, axis: record, refs: [nist-sp800-61r3] }
          - { id: p02-a-content, points: -15, axis: content, refs: [nist-sp800-61r3] }
          - { id: p02-a-order, points: -10, axis: order, refs: [cissp-cbk-secops] }
        explain: { ja: '復旧を急ぐ判断だが、証拠を失うと侵入経路も範囲も分からない。再発の危険が残る。被害の拡大を招きかねない。', en: '' }
      - id: p02-preserve-plan
        text: { ja: '証拠を保全し、修正の計画と切り戻し、決済の代替手段を同時に用意する。', en: '' }
        minutes: 150
        category: recover
        points: 50
        refs: [nist-sp800-61r3, meti-csm-guideline]
        gauges: { damage: -10, stamina: -20, trust: 5 }
        setFlags: { evidencePreserved: true, patchPlan: true }
        items:
          - { id: p02-d-order, points: 8, axis: order, refs: [nist-sp800-61r3] }
          - { id: p02-d-record, points: 5, axis: record, refs: [jpcert-handling] }
        explain: { ja: '証拠、修正、切り戻し、決済の代替まで揃えた。復旧と説明の両方を見ている。関係先の理解を得やすい。', en: '' }
      - id: p02-stop-all
        text: { ja: 'バックアップ系も含めて全台を止め、調査は落ち着いてから始める。', en: '' }
        minutes: 90
        category: hurt
        points: -100
        refs: [nist-sp800-61r3]
        gauges: { damage: 10, stamina: 5 }
        items:
          - { id: p02-b-record, points: -10, axis: record, refs: [nist-sp800-61r3] }
          - { id: p02-b-time, points: -8, axis: time, refs: [jpcert-handling] }
        explain: { ja: '安全側の判断だが、バックアップまで止めると復旧が遅れ、業務への影響が大きい。被害の拡大を招きかねない。', en: '' }
      - id: p02-preserve
        text: { ja: '影響した系を切り離して証拠を保全し、修正は調査と並行して進める。', en: '' }
        minutes: 120
        category: maintain
        points: 30
        refs: [nist-sp800-61r3, jpcert-handling]
        gauges: { damage: -10, stamina: -15, trust: 5 }
        setFlags: { evidencePreserved: true }
        items:
          - { id: p02-c-record, points: 5, axis: record, refs: [nist-sp800-61r3] }
          - { id: p02-c-order, points: 1, axis: order, refs: [cissp-cbk-secops] }
        explain: { ja: '証拠を保全し、修正を調査と並行した。基本に沿った妥当な対応だ。復旧までの時間を短くできる。', en: '' }

    lesson: { ja: '証拠保全と復旧は、順番を間違えると取り返しがつかない。影響した系を切り離して証拠を残し、修正は調査と並行する。初期化や全台停止は、侵入経路も被害範囲も分からなくするか、業務を止めすぎる。', en: '' }
  - id: p03-escalate
    at: { day: 0, minutes: 1200 }
    phase: organize
    sound: { se: [phone_ring] }
    text: { ja: '20時。セキュリティ責任者への上申をまとめる。社長は、影響の大きさと、いま決めてほしいことを知りたがっている。', en: '' }
    voices: [v03-boss, v03-flattery, v03-ok]
    choices:
      - id: p03-hold
        text: { ja: '影響が出てから上申すると決め、今は調査だけに集中する。', en: '' }
        minutes: 60
        category: hurt
        points: -120
        refs: [meti-csm-guideline]
        gauges: { flame: 10, trust: -10 }
        coward: true
        setFlags: { lateEscalation: true }
        delayed:
          - { afterPhases: 1, points: -50, gauges: { damage: 10, trust: -10 }, reason: { ja: '経営の決裁が遅れ、対象サイトを止める判断が四時間ずれた。', en: '' } }
        items:
          - { id: p03-a-order, points: -10, axis: order, refs: [meti-csm-guideline] }
          - { id: p03-a-time, points: -10, axis: time, refs: [meti-csm-guideline] }
        explain: { ja: '影響が出てからでは遅い。上申の遅れが、止める判断と説明の両方を後手にする。関係先の不信を招きやすい。', en: '' }
      - id: p03-jargon
        text: { ja: '調査ログをそのまま貼り付けて送り、判断は上に任せようとする。', en: '' }
        minutes: 45
        category: hurt
        points: -50
        refs: [meti-csm-guideline]
        gauges: { trust: -5 }
        items:
          - { id: p03-b-order, points: -8, axis: order, refs: [meti-csm-guideline] }
          - { id: p03-b-wording, points: -8, axis: wording, refs: [meti-csm-guideline] }
        explain: { ja: 'ログの羅列では経営は判断できない。決めてほしいことが伝わらない。関係先の不信を招きやすい。', en: '' }
      - id: p03-one-pager
        text: { ja: '分かっている事実、不明な点、決めてほしいことを一枚に分けて上申する。', en: '' }
        minutes: 45
        category: maintain
        points: 30
        refs: [meti-csm-guideline, jpcert-handling]
        gauges: { trust: 5, stamina: -5 }
        setFlags: { escalated: true }
        items:
          - { id: p03-c-order, points: 5, axis: order, refs: [meti-csm-guideline] }
          - { id: p03-c-wording, points: 1, axis: wording, refs: [meti-csm-guideline] }
        explain: { ja: '事実、不明点、決めてほしいことを分けた。上申として必要十分な形だ。再発の防止にもつながる。', en: '' }
      - id: p03-options
        text: { ja: '上申に加え、止めるか止めないかの選択肢ごとに影響と復旧時間を添える。', en: '' }
        minutes: 75
        category: recover
        points: 50
        refs: [meti-csm-guideline]
        gauges: { trust: 10, stamina: -10 }
        setFlags: { escalated: true, optionsPrepared: true }
        items:
          - { id: p03-d-content, points: 8, axis: content, refs: [meti-csm-guideline] }
          - { id: p03-d-order, points: 5, axis: order, refs: [meti-csm-guideline] }
        explain: { ja: '選択肢ごとに影響と復旧時間を添えた。経営が比較して決められる。現場の負担も抑えられる。', en: '' }

    lesson: { ja: '上申は、事実と不明点と決めてほしいことを分けて一枚にまとめる。技術用語の羅列では経営は判断できない。止めるか止めないかの選択肢ごとに、影響と復旧時間を添えると、判断が早くなる。', en: '' }
  - id: p04-egress
    at: { day: 0, minutes: 1290 }
    phase: organize
    sound: { se: [notify_chat] }
    text: { ja: '21時30分。外部への持ち出し経路がまだ生きている。決済は動かしたままだが、同じ認証情報を使うテナントが残っている。', en: '' }
    voices: [v04-public, v04-coward, v04-ok]
    choices:
      - id: p04-block-scope
        text: { ja: '外部への通信を遮断し、同じ認証情報を使う全テナントも順に確かめる。', en: '' }
        minutes: 120
        category: recover
        points: 50
        refs: [nist-sp800-61r3]
        gauges: { damage: -10, stamina: -15, trust: 5 }
        setFlags: { egressBlocked: true, scopeMapped: true }
        items:
          - { id: p04-c-content, points: 8, axis: content, refs: [nist-sp800-61r3] }
          - { id: p04-c-record, points: 5, axis: record, refs: [jpcert-handling] }
        explain: { ja: '遮断に加え、同じ認証情報を使う全テナントを確かめた。横展開を防ぐ視点がある。現場の負担も抑えられる。', en: '' }
      - id: p04-watch
        text: { ja: '決済を止めないため、監視を強めてしばらく様子を見る。', en: '' }
        minutes: 60
        category: hurt
        points: -100
        refs: [nist-sp800-61r3]
        gauges: { damage: 15, flame: -5 }
        delayed:
          - { afterPhases: 1, points: -50, gauges: { damage: 15 }, reason: { ja: '止めなかった経路から再び侵入され、被害が広がった。', en: '' } }
        items:
          - { id: p04-a-content, points: -10, axis: content, refs: [nist-sp800-61r3] }
          - { id: p04-a-record, points: -8, axis: record, refs: [nist-sp800-61r3] }
        explain: { ja: '監視だけで様子を見ると、侵入が続く。決済を止めない判断と、被害を止める判断が混ざっている。', en: '' }
      - id: p04-block
        text: { ja: '外部への通信だけを遮断し、決済は動かしたまま監視を続ける。', en: '' }
        minutes: 90
        category: maintain
        points: 30
        refs: [nist-sp800-61r3, jpcert-handling]
        gauges: { damage: -5, stamina: -10 }
        setFlags: { egressBlocked: true }
        items:
          - { id: p04-b-content, points: 5, axis: content, refs: [nist-sp800-61r3] }
          - { id: p04-b-order, points: 1, axis: order, refs: [jpcert-handling] }
        explain: { ja: '外部通信を遮断し、決済を動かしたまま監視した。影響を抑える妥当な対応だ。関係先の理解を得やすい。', en: '' }

    lesson: { ja: '外部への通信を遮断するときは、同じ認証情報を使う範囲まで広げて考える。決済を止めない判断は妥当でも、監視だけで済ませると侵入が続く。遮断と影響確認を同時に進める。', en: '' }
  - id: p05-prepare-stop
    at: { day: 1, minutes: 330 }
    phase: organize
    sound: { se: [phone_ring] }
    text: { ja: '朝5時30分。窓口は8時に開く。止めるかどうかは経営の判断だが、止める前提の手順は、いま作っておかなければ間に合わない。', en: '' }
    voices: [v05-public, v05-law, v05-ok]
    notable:
      - { id: note-gov-share, text: { ja: '自治体には停止する範囲と公表の文面を先に共有すると伝えた。', en: '' } }
    choices:
      - id: p05-wait
        text: { ja: '経営の判断が出るまで、停止の準備はしないで待つことにする。', en: '' }
        minutes: 45
        category: hurt
        points: -100
        refs: [meti-csm-guideline]
        gauges: { flame: 10, trust: -10 }
        coward: true
        delayed:
          - { afterPhases: 1, points: -40, gauges: { flame: 10 }, reason: { ja: '判断が出てから手順を作り始め、窓口の開く時刻に間に合わなかった。', en: '' } }
        items:
          - { id: p05-a-time, points: -10, axis: time, refs: [meti-csm-guideline] }
          - { id: p05-a-care, points: -8, axis: care, refs: [jpcert-handling] }
        explain: { ja: '経営の判断を待つ間に、準備まで止めている。決まった時に間に合わない。再発の危険を残す。', en: '' }
      - id: p05-plan-alt
        text: { ja: '停止手順に加え、代替の支払い方法と窓口の案内を自治体と詰めておく。', en: '' }
        minutes: 90
        category: recover
        points: 50
        refs: [meti-csm-guideline, jpcert-handling]
        gauges: { damage: -5, trust: 10, stamina: -10 }
        setFlags: { stopPlanReady: true, alternativeReady: true }
        items:
          - { id: p05-c-care, points: 8, axis: care, refs: [jpcert-handling] }
          - { id: p05-c-order, points: 5, axis: order, refs: [meti-csm-guideline] }
        explain: { ja: '停止手順に加え、代替の支払い方法と窓口の案内を自治体と詰めた。現場が困らない。その後の説明が楽になる。', en: '' }
      - id: p05-plan
        text: { ja: '停止と復旧の手順を用意し、8時の窓口に間に合わせる。', en: '' }
        minutes: 60
        category: maintain
        points: 30
        refs: [meti-csm-guideline, jpcert-handling]
        gauges: { damage: -5, stamina: -10, trust: 5 }
        setFlags: { stopPlanReady: true }
        items:
          - { id: p05-b-order, points: 5, axis: order, refs: [meti-csm-guideline] }
          - { id: p05-b-record, points: 1, axis: record, refs: [jpcert-handling] }
        explain: { ja: '停止と復旧の手順を用意した。基本だが、代替の支払い方法への配慮が足りない。現場の負担も抑えられる。', en: '' }

    lesson: { ja: '停止の判断は経営がするが、準備は現場が先にできる。停止と復旧の手順、代替の支払い方法、窓口の案内を用意しておく。判断を待つ間に準備まで止めると、決まった時に間に合わない。', en: '' }
  - id: p06-roles
    at: { day: 1, minutes: 570 }
    phase: organize
    sound: { se: [notify_chat] }
    text: { ja: '9時30分。対策本部の机が並んだ。誰が指揮を執り、誰が記録し、誰が外部と連絡するか。まだ決めていない。', en: '' }
    voices: [v06-flattery, v06-vendor, v06-ok]
    choices:
      - id: p06-solo
        text: { ja: '自分が指揮も調査も外部連絡も全部持ち、そのほうが速いと考える。', en: '' }
        minutes: 60
        category: hurt
        points: -60
        refs: [cissp-cbk-secops]
