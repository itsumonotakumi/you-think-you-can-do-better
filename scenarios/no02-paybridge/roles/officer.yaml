    notable:
      - { id: note-stop-range, text: { ja: '21時、カード会社と自治体に停止範囲と再開の見込みを伝えた。', en: '' } }
    choices:
      - id: p03-keep
        text: { ja: '止めずに監視を強め、翌朝の利用状況を見て決める。', en: '' }
        minutes: 60
