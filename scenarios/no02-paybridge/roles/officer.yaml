  - { id: v02-after, media: sns, misleading: false, text: { ja: '証拠保全より、決済を止めないことを優先してほしい。', en: '' }, trigger: { at: after, choice: p02-business-plan } }
  - { id: v03-public, media: sns, misleading: true, type: public-opinion, text: { ja: '止めるな。月末の納付があるんだ。', en: '' }, trigger: { at: point } }
  - { id: v03-coward, media: news, misleading: true, type: coward-critique, text: { ja: '止める判断が遅い。経営は何をしていた。', en: '' }, trigger: { at: point } }
  - { id: v03-ok, media: chat, misleading: false, text: { ja: '藤崎「自治体の担当者なら、朝8時に電話をもらえれば窓口で案内できる」。', en: '' }, trigger: { at: point } }
  - { id: v03-after, media: news, misleading: false, text: { ja: '委託元を差し置いて、カード会社と先に話すのか。', en: '' }, trigger: { at: after, choice: p03-protect } }
  - { id: v04-ceo, media: boss, misleading: true, type: boss-pressure, text: { ja: '残業で何とかしろ。窓口を増やす金はない。', en: '' }, trigger: { at: point } }
  - { id: v04-coward, media: sns, misleading: true, type: public-opinion, text: { ja: 'また大げさに。いつもの窓口で足りる。', en: '' }, trigger: { at: point } }
  - { id: v04-ok, media: chat, misleading: false, text: { ja: '現場「小さい加盟店ほど電話がつながらないと言っています」。', en: '' }, trigger: { at: point } }
  - { id: v04-after, media: news, misleading: false, text: { ja: '専用窓口を作ったところで、補償がないなら同じだ。', en: '' }, trigger: { at: after, choice: p04-dedicated-plan } }
  - { id: v05-ceo, media: boss, misleading: true, type: boss-pressure, text: { ja: '報告は口頭でいい。書面にすると、あとで責任を問われるぞ。', en: '' }, trigger: { at: point } }
