# No.2 ペイブリッジ / 役員・グループ会社社長ロール
# プレイヤーは取締役・決済事業担当。カード会社との協議、加盟店の業務継続、社長・取締役会への報告を扱う。
# 判断ポイント17、細目は choices[].items と drafts の合計で80以上。
estimateMinutes: 40
intro: { ja: 'あなたはペイブリッジ株式会社の取締役・決済事業担当。カード決済と加盟店の窓口を預かり、社長と取締役会に報告する立場にある。親会社はない。上場企業の役員として、委託元の自治体、カード会社、加盟店、そして社員に説明する責任がある。注意喚起が出た日の16時、セキュリティ責任者からの電話で始まる。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-prelim
    ref: ppc-report-prelim
    label: { ja: '個人情報保護委員会への速報', en: '' }
    points: -150
    doneFlag: ppcPrelimFiled
  - id: dl-final
    ref: ppc-report-final-malicious
    label: { ja: '個人情報保護委員会への確報（不正の目的）', en: '' }
    points: -100
    doneFlag: ppcFinalFiled
events:
  - id: ev-card-audit
    at: { day: 1, minutes: 540 }
    voices: [v-ev-audit]
    gauges: { flame: 5 }
    sound: { se: [mail_arrive] }
    caption: { ja: 'カード会社から、保存してはいけない情報の扱いについて照会が来た。', en: '' }
  - id: ev-merchant-churn
    at: { day: 7, minutes: 720 }
    voices: [v-ev-churn]
    gauges: { flame: 10 }
    sound: { se: [notify_news] }
    caption: { ja: '大口の加盟店が、代替の決済代行の検討を始めた。', en: '' }
  - id: ev-weekly
    at: { day: 10, minutes: 600 }
    voices: [v-ev-weekly]
    gauges: { flame: 5 }
    caption: { ja: '週刊誌から、セキュリティコード保存の疑いについて取材が来た。', en: '' }
  - id: ev-extortion
    at: { day: 2, minutes: 960 }
    voices: [v-ev-extortion]
    gauges: { flame: 5 }
    sound: { se: [mail_arrive] }
    caption: { ja: '研究者を名乗る人物から、データ公開を予告するメールが届いた。', en: '' }
points:
  - id: p01-first-call
    at: { day: 0, minutes: 960 }
    phase: detect
    sound: { se: [phone_ring] }
    text: { ja: '16時。広く使われている業務フレームワークの脆弱性が公表された日、セキュリティ責任者の黒瀬から電話が入る。「委託元の自治体の税金払いサイトに、不審な通信の痕跡があります。カード側への影響はまだ分かりません」。', en: '' }
    voices: [v01-ceo, v01-coward, v01-ok]
    notable:
      - { id: note-first-call, text: { ja: 'Day 0 16時、自治体の税金払いサイトに不審な通信。カード決済への影響は未確認。', en: '' } }
    choices:
      - id: p01-taskforce
        text: { ja: '決済事業の対策会議を招集し、カード会社への連絡窓口を一本化する。', en: '' }
        minutes: 60
        category: maintain
        points: 20
        refs: [meti-csm-guideline]
        gauges: { flame: -5, trust: 5, stamina: -5 }
        setFlags: { ownTaskForce: true }
        items:
          - { id: p01-b-time, points: 5, axis: time, refs: [jpcert-handling] }
          - { id: p01-b-order, points: 5, axis: order, refs: [meti-csm-guideline] }
          - { id: p01-b-record, points: 5, axis: record, refs: [jpcert-handling] }
        explain: { ja: '対策会議を招集し、外部への連絡窓口を一本化した。初動の体制を早く整えた点が強い。', en: '' }
      - id: p01-wait
        text: { ja: '正確な報告が揃うのを待ち、明日の定例会議で詳しく聞く。', en: '' }
        minutes: 60
        category: hurt
        points: -100
        refs: [jpcert-handling]
        gauges: { flame: 5, trust: -5, stamina: 5 }
        coward: true
        setFlags: { delayedCommand: true }
        delayed:
          - { afterPhases: 1, points: -40, gauges: { trust: -10 }, reason: { ja: 'その夜も不審な通信が続き、翌朝の報道で初動の遅れが分かった。', en: '' } }
        items:
          - { id: p01-a-time, points: -10, axis: time, refs: [jpcert-handling] }
          - { id: p01-a-order, points: -8, axis: order, refs: [meti-csm-guideline] }
        explain: { ja: '報告を待つ間に被害が広がる。初動の遅れは復旧と説明の両方を難しくする。現場の混乱が長引く。', en: '' }
      - id: p01-floor
        text: { ja: '自分で決済スイッチ室に向かい、カード系の回線を確かめる。', en: '' }
        minutes: 90
        category: hurt
        points: -50
        refs: [nist-sp800-61r3]
        gauges: { stamina: -10, trust: -5 }
        items:
          - { id: p01-c-order, points: -10, axis: order, refs: [meti-csm-guideline] }
          - { id: p01-c-care, points: -5, axis: care, refs: [ipa-sme-guideline] }
        explain: { ja: '現場を見る姿勢はあるが、担当者が持ち場を離れると指揮が空く。役割分担を崩した点が響く。', en: '' }

    lesson: { ja: '最初の電話で決めるのは、会議の日程ではなく体制だ。対策会議を招集し、外部への連絡窓口を一本化する。報告を待つ間に被害は広がり、現場が勝手に動けば情報が乱れる。初動の型を早く決めるほど、後の説明が整う。', en: '' }
  - id: p02-evidence
    at: { day: 0, minutes: 1110 }
    phase: contain
    sound: { se: [notify_chat] }
    text: { ja: '18時30分。決済基盤部長の曽根が「修正を当てるなら今です。ただし、バックアップ系にも同じ穴があります。証拠を残すなら、先に切り離す必要があります」と言う。', en: '' }
    voices: [v02-expert, v02-field, v02-ok]
    popular: { choiceId: p02-initialize, percent: 58 }
    choices:
      - id: p02-initialize
        text: { ja: '決済を止めないため、影響のある機器を初期化して作り直す。', en: '' }
        minutes: 120
        category: fatal
        points: -250
        refs: [nist-sp800-61r3]
        gauges: { flame: 20, damage: 15, trust: -20 }
        setFlags: { destroyedEvidence: true }
        delayed:
          - { afterPhases: 2, points: -100, gauges: { damage: 15, trust: -20 }, reason: { ja: '証拠が消え、侵入経路も漏えい範囲も分からなくなった。', en: '' } }
        items:
          - { id: p02-a-record, points: -20, axis: record, refs: [nist-sp800-61r3] }
          - { id: p02-a-content, points: -15, axis: content, refs: [nist-sp800-61r3] }
          - { id: p02-a-order, points: -10, axis: order, refs: [jpcert-handling] }
        explain: { ja: '復旧を急ぐ判断だが、証拠を失うと侵入経路と範囲が分からなくなる。再発の危険も残る。', en: '' }
      - id: p02-business-plan
        text: { ja: '証拠を保全し、カード決済の代替経路と止められない加盟店を洗い出す。', en: '' }
        minutes: 180
        category: recover
        points: 100
        refs: [nist-sp800-61r3, meti-csm-guideline]
        gauges: { damage: -15, trust: 10, stamina: -15 }
        setFlags: { evidencePreserved: true, paymentContinuity: true }
        items:
          - { id: p02-c-record, points: 8, axis: record, refs: [nist-sp800-61r3] }
          - { id: p02-c-order, points: 8, axis: order, refs: [nist-sp800-61r3] }
          - { id: p02-c-content, points: 8, axis: content, refs: [meti-csm-guideline] }
          - { id: p02-c-care, points: 5, axis: care, refs: [ipa-sme-guideline] }
        explain: { ja: '証拠保全に加え、決済の代替経路と影響する加盟店を洗い出した。業務を止めない視点が強い。', en: '' }
      - id: p02-parallel
        text: { ja: '影響のある機器を切り離して証拠を保全し、修正は調査と並行する。', en: '' }
        minutes: 150
        category: maintain
        points: 20
        refs: [nist-sp800-61r3]
        gauges: { damage: -10, trust: 5, stamina: -10 }
        setFlags: { evidencePreserved: true }
        items:
          - { id: p02-b-record, points: 8, axis: record, refs: [nist-sp800-61r3] }
          - { id: p02-b-order, points: 5, axis: order, refs: [nist-sp800-61r3] }
          - { id: p02-b-time, points: 3, axis: time, refs: [jpcert-handling] }
        explain: { ja: '証拠を保全し、修正を調査と並行した点は妥当。決済の代替経路まで踏み込むとさらに良い。', en: '' }

    lesson: { ja: '証拠保全と決済の継続は、どちらかを捨てる話ではない。証拠を残しつつ、別経路で決済を動かす手順を同時に作る。初期化して作り直す判断は、侵入経路も被害範囲も分からなくする。', en: '' }
  - id: p03-card-stop
    at: { day: 0, minutes: 1260 }
    phase: contain
    sound: { se: [phone_ring, notify_sns] }
    text: { ja: '21時。カード会社から「不正利用の監視を強めています。影響のある経路を止めますか」と聞かれた。止めれば、夜間の決済も一部止まる。', en: '' }
    voices: [v03-public, v03-coward, v03-ok]
    notable:
      - { id: note-stop-range, text: { ja: '21時、カード会社と自治体に停止範囲と再開の見込みを伝えた。', en: '' } }
    choices:
      - id: p03-keep
        text: { ja: '止めずに監視を強め、翌朝の利用状況を見てから判断する。', en: '' }
        minutes: 60
        category: hurt
        points: -100
        refs: [nist-sp800-61r3]
        gauges: { damage: 20, flame: 5 }
        delayed:
          - { afterPhases: 1, points: -60, gauges: { damage: 15, trust: -10 }, reason: { ja: '止めなかった経路から再び侵入され、被害が広がった。', en: '' } }
        items:
          - { id: p03-a-content, points: -10, axis: content, refs: [nist-sp800-61r3] }
          - { id: p03-a-record, points: -8, axis: record, refs: [nist-sp800-61r3] }
        explain: { ja: '監視を強めても、侵入が続けば被害は広がる。止める判断を先送りした分、復旧が後手に回る。', en: '' }
      - id: p03-partial
        text: { ja: '影響のある経路だけを止め、自治体とカード会社に電話で連絡する。', en: '' }
        minutes: 90
        category: maintain
        points: 20
        refs: [meti-csm-guideline]
        gauges: { flame: 10, damage: -20, stamina: -10 }
        setFlags: { cardRouteStopped: true }
        items:
          - { id: p03-b-content, points: 5, axis: content, refs: [nist-sp800-61r3] }
          - { id: p03-b-order, points: 5, axis: order, refs: [meti-csm-guideline] }
          - { id: p03-b-care, points: -5, axis: care, refs: [jpcert-handling] }
        explain: { ja: '止める範囲を絞った判断は妥当だが、連絡が電話だけで、代替手段と再開見込みが伝わらない。', en: '' }
      - id: p03-protect
        text: { ja: '影響のある経路を止め、代替の決済手段と再開の見込みを加盟店に伝える。', en: '' }
        minutes: 120
        category: recover
        points: 100
        refs: [meti-csm-guideline, jpcert-handling]
        gauges: { flame: 10, damage: -30, trust: 10, stamina: -15 }
        setFlags: { cardRouteStopped: true, muniInformed: true }
        items:
          - { id: p03-c-time, points: 5, axis: time, refs: [jpcert-handling] }
          - { id: p03-c-order, points: 8, axis: order, refs: [meti-csm-guideline] }
          - { id: p03-c-care, points: 10, axis: care, refs: [jpcert-handling] }
          - { id: p03-c-content, points: 5, axis: content, refs: [meti-csm-guideline] }
        explain: { ja: '止める範囲を絞り、代替の決済手段と再開見込みを加盟店に伝えた。現場の混乱を抑えている。', en: '' }

    lesson: { ja: '止める範囲は、被害の広がりと業務の影響で決める。止めるなら、代替の決済手段と再開の見込みを加盟店と委託元に伝える。電話一本で済ませると、現場は止まったままになる。', en: '' }
  - id: p04-merchant-desk
    at: { day: 1, minutes: 480 }
    phase: organize
    sound: { se: [phone_ring, notify_chat] }
    text: { ja: '8時。加盟店からの問い合わせが窓口に集中している。現場は「通常の受付では回らない」と言う。', en: '' }
    voices: [v04-ceo, v04-coward, v04-ok]
    choices:
      - id: p04-dedicated-plan
        text: { ja: '専用窓口を開き、カード会社と共同のFAQで小さい加盟店から電話する。', en: '' }
        minutes: 150
        category: recover
        points: 100
        refs: [ipa-sme-guideline, meti-csm-guideline]
        gauges: { stamina: 5, trust: 10, flame: -5 }
        setFlags: { merchantDesk: true, merchantPriority: true }
        items:
          - { id: p04-c-order, points: 8, axis: order, refs: [meti-csm-guideline] }
          - { id: p04-c-care, points: 8, axis: care, refs: [ipa-sme-guideline] }
          - { id: p04-c-care2, points: 5, axis: care, refs: [ipa-sme-guideline] }
          - { id: p04-c-record, points: 5, axis: record, refs: [jpcert-handling] }
        explain: { ja: '専用窓口に加え、カード会社と共同のFAQを作り、小さい加盟店から電話した。きめ細かい対応だ。', en: '' }
      - id: p04-normal
        text: { ja: '通常の窓口で受け付け、担当者が残業して個別に対応する。', en: '' }
        minutes: 60
        category: hurt
        points: -60
        refs: [ipa-sme-guideline]
        gauges: { stamina: -10, trust: -5 }
        items:
          - { id: p04-a-care, points: -10, axis: care, refs: [ipa-sme-guideline] }
          - { id: p04-a-order, points: -8, axis: order, refs: [meti-csm-guideline] }
        explain: { ja: '通常窓口の残業で対応すると、他の業務と応対の品質が崩れる。問い合わせの集中に耐えられない。', en: '' }
      - id: p04-dedicated
        text: { ja: '加盟店向けの専用窓口を開き、想定問答と担当者名を決める。', en: '' }
        minutes: 90
        category: maintain
        points: 20
        refs: [ipa-sme-guideline]
        gauges: { stamina: -5, trust: 5 }
        setFlags: { merchantDesk: true }
        items:
          - { id: p04-b-order, points: 8, axis: order, refs: [meti-csm-guideline] }
          - { id: p04-b-care, points: 5, axis: care, refs: [ipa-sme-guideline] }
          - { id: p04-b-record, points: 5, axis: record, refs: [jpcert-handling] }
        explain: { ja: '専用窓口を開き、想定問答と担当者を決めた。加盟店の問い合わせに答える体制が整っている。', en: '' }

    lesson: { ja: '加盟店の問い合わせは、最初の数時間に集中する。専用窓口を開き、想定問答を用意し、影響の大きい先から連絡する。通常窓口の残業で対応すると、他の業務と品質の両方が崩れる。', en: '' }
  - id: p05-ceo-report
    at: { day: 1, minutes: 660 }
    phase: organize
    sound: { se: [typing] }
    text: { ja: '11時。社長とCFOへの報告。電話で概要を伝えるか、事実と不明点、決裁をお願いしたいことを書面にするか。', en: '' }
    voices: [v05-ceo, v05-coward, v05-ok]
    notable:
      - { id: note-timely, text: { ja: '11時、社長とCFOに、カード会社への説明と適時開示の判断を求める書面を出した。', en: '' } }
    choices:
      - id: p05-oral
        text: { ja: '電話で概要だけを伝え、詳しい内容や判断は後日に回す。', en: '' }
        minutes: 45
        category: hurt
        points: -80
        refs: [jpcert-handling]
        gauges: { trust: -10, flame: 5 }
        items:
          - { id: p05-a-record, points: -10, axis: record, refs: [jpcert-handling] }
          - { id: p05-a-content, points: -8, axis: content, refs: [meti-csm-guideline] }
        explain: { ja: '電話の概要だけでは、経営の判断が動かない。詳しい内容と決裁事項が抜けている。後の訂正や説明の負担が増える。', en: '' }
      - id: p05-written-ask
        text: { ja: '書面で事実と不明点を分け、説明方針と応援要員の決裁を求める。', en: '' }
        minutes: 120
        category: recover
        points: 100
        refs: [jpcert-handling, no02-timely-disclosure]
        gauges: { trust: 10, stamina: -10 }
        setFlags: { boardReportFiled: true, decisionRequested: true }
        items:
          - { id: p05-c-order, points: 8, axis: order, refs: [meti-csm-guideline] }
          - { id: p05-c-content, points: 8, axis: content, refs: [no02-timely-disclosure] }
          - { id: p05-c-time, points: 5, axis: time, refs: [jpcert-handling] }
          - { id: p05-c-record, points: 8, axis: record, refs: [jpcert-handling] }
        explain: { ja: '事実と不明点を分け、説明方針と応援要員の決裁を求めた。経営が判断できる材料が揃っている。', en: '' }
      - id: p05-written
        text: { ja: '書面で、分かった事実と不明点を分けて提出し、判断を仰ぐ。', en: '' }
        minutes: 90
        category: maintain
        points: 20
        refs: [jpcert-handling]
        gauges: { trust: 5, stamina: -10 }
        setFlags: { boardReportFiled: true }
        items:
          - { id: p05-b-record, points: 5, axis: record, refs: [jpcert-handling] }
          - { id: p05-b-content, points: 5, axis: content, refs: [meti-csm-guideline] }
          - { id: p05-b-time, points: 5, axis: time, refs: [jpcert-handling] }
        explain: { ja: '事実と不明点を分けた書面は妥当。説明方針や要員の決裁まで求めると、さらに動きやすい。', en: '' }

    lesson: { ja: '経営への報告は、事実と不明点を分け、判断してほしいことを添える。電話の概要だけでは決裁が動かない。書面で説明方針と要員の判断を求めると、その後の動きが早くなる。', en: '' }
  - id: p06-card-code
    at: { day: 2, minutes: 540 }
    phase: investigate
    sound: { se: [mail_arrive] }
    text: { ja: '9時。カード会社との協議。調査で、保存しない設計だったカードのセキュリティコードが、三年前の接続仕様の変更でデバッグ用ログに残る設定が入り、そのまま本番に残っていたことが分かった。当時の決裁はあなたの部門にある。', en: '' }
    voices: [v06-vendor, v06-law, v06-ok]
    notable:
      - { id: note-card-code, text: { ja: 'カードのセキュリティコードを、三年前の接続仕様の変更でデバッグ用ログに残る設定が入り、そのまま本番に残っていた事実と、廃止の予定を記録した。', en: '' } }
      - { id: note-prior-warning, text: { ja: '二年前、技術者がセキュリティコード保存の停止を上申し、自部門が接続仕様の変更費用を理由に先送りした。', en: '' } }
    choices:
      - id: p06-blame
        text: { ja: '加盟店が保存していた不備として説明し、自社の責任を避ける。', en: '' }
        minutes: 60
        category: hurt
        points: -120
        refs: [meti-csm-guideline]
        gauges: { flame: 5, trust: -10 }
        items:
          - { id: p06-a-content, points: -10, axis: content, refs: [meti-csm-guideline] }
          - { id: p06-a-wording, points: -8, axis: wording, refs: [meti-disclosure-guidance] }
        explain: { ja: '加盟店の不備として説明すると、自社の設計の問題が見えなくなる。関係も悪化しやすい。', en: '' }
      - id: p06-admit
        text: { ja: '保存していた事実を認め、範囲と期間を調べて報告する。', en: '' }
        minutes: 90
        category: maintain
