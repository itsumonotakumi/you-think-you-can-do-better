# No.2 ペイブリッジ / 経営者ロール
# 判断ポイント16、細目は choices[].items と drafts の合計で80以上。
estimateMinutes: 30
intro: { ja: 'あなたはペイブリッジの代表取締役社長。決済と収納を預かる上場企業の経営者として、委託元の自治体、カード会社、株主、そして利用者に説明する責任がある。注意喚起が出た日の夕方、一本の電話から始まる。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-prelim
    ref: ppc-report-prelim
    label: { ja: '個人情報保護委員会への速報', en: '' }
    points: -150
    doneFlag: ppcPrelimFiled
  - id: dl-final
    ref: ppc-report-final-malicious
    label: { ja: '個人情報保護委員会への確報（不正の目的）', en: '' }
    points: -100
    doneFlag: ppcFinalFiled
events:
  - id: ev-card-inquiry
    at: { day: 1, minutes: 540 }
    voices: [v-ev-card]
    gauges: { flame: 5 }
    sound: { se: [notify_news] }
    caption: { ja: 'カード会社から追加の照会が来ている。', en: '' }
  - id: ev-other-victim
    at: { day: 4, minutes: 480 }
    voices: [v-ev-other]
    gauges: { flame: 5 }
    caption: { ja: '別の委託元でも、同じ手口の痕跡が見つかった。', en: '' }
  - id: ev-extortion
    at: { day: 2, minutes: 960 }
    voices: [v-ev-extortion]
    gauges: { flame: 5 }
    sound: { se: [mail_arrive] }
    caption: { ja: '研究者を名乗る人物から、データ公開を予告するメールが届いた。', en: '' }
  - id: ev-rumor
    at: { day: 7, minutes: 720 }
    voices: [v-ev-rumor]
    gauges: { flame: 5 }
    caption: { ja: '根拠のない書き込みが広がっている。', en: '' }
points:
  - id: p01-ack
    at: { day: 0, minutes: 960 }
    phase: detect
    sound: { se: [phone_ring] }
    text: { ja: '16時。広く使われている業務フレームワークの脆弱性が公表された日の夕方、セキュリティ責任者から電話が入る。「影響調査を始めたところ、委託元の自治体の税金払いサイトに、不審な通信の痕跡があります」。', en: '' }
    voices: [v01-boss, v01-ok]
    notable:
      - { id: note-first-call, text: { ja: 'Day 0 16時、自治体の税金払いサイトに不審な通信の痕跡。影響範囲は不明。', en: '' } }
    choices:
      - id: p01-command
        text: { ja: '対策本部を立ち上げ、調査会社と弁護士を手配し、権限を委譲する。', en: '' }
        minutes: 30
        category: maintain
        points: 20
        refs: [meti-csm-guideline]
        gauges: { flame: -5, trust: 5, stamina: -5 }
        setFlags: { commandStarted: true }
        items:
          - { id: p01-b-time, points: 5, axis: time, refs: [jpcert-handling] }
          - { id: p01-b-order, points: 5, axis: order, refs: [meti-csm-guideline] }
          - { id: p01-b-record, points: 5, axis: record, refs: [jpcert-handling] }
        explain: { ja: '指揮と調査の体制を早く整え、専門家への委任も決めた。初動を止めず、被害の拡大を抑えやすい。', en: '' }
      - id: p01-wait
        text: { ja: '正確な報告が揃うのを待ち、明日の定例会議でまとめて聞く。', en: '' }
        minutes: 60
        category: hurt
        points: -150
        refs: [jpcert-handling]
        gauges: { flame: 10, trust: -5, stamina: 5 }
        coward: true
        setFlags: { delayedCommand: true }
        delayed:
          - { afterPhases: 1, points: -40, gauges: { trust: -10 }, reason: { ja: 'その夜も不審な通信が続き、翌朝の報道で初動の遅れが分かった。', en: '' } }
        items:
          - { id: p01-a-record, points: -5, axis: record, refs: [jpcert-handling] }
          - { id: p01-a-time, points: -10, axis: time, refs: [jpcert-handling] }
        explain: { ja: '報告を待つ間に被害が広がる。初動の遅れは復旧時間と信頼の両方を損なうため、評価は低い。', en: '' }
      - id: p01-self
        text: { ja: '自分でサーバー室に向かい、画面を直接見て状況を確かめる。', en: '' }
        minutes: 60
        category: hurt
        points: -50
        refs: [jpcert-handling]
        gauges: { stamina: -10, trust: -5 }
        items:
          - { id: p01-c-order, points: -10, axis: order, refs: [meti-csm-guideline] }
          - { id: p01-c-care, points: -5, axis: care, refs: [meti-csm-guideline] }
        explain: { ja: '現場を見る姿勢は悪くないが、経営者が自ら動くと指揮が空く。役割分担を崩した点が響く。', en: '' }

    lesson: { ja: '初動で問われるのは、自分が何をするかより指揮の形を決めることだ。報告が揃う前でも、対策本部の立ち上げと権限の委譲は決められる。会議を待つ間に被害は広がり、初動の遅れは復旧と説明の両方を難しくする。', en: '' }
  - id: p02-evidence
    at: { day: 0, minutes: 1140 }
    phase: contain
    sound: { se: [notify_chat] }
    text: { ja: '19時。決済基盤部長が「修正を当てるなら今です。ただし、バックアップ系にも同じ穴があります。証拠を残すなら、先に切り離す必要があります」と言う。', en: '' }
    voices: [v02-expert, v02-field, v02-rule, v02-ok]
    choices:
      - id: p02-preserve
        text: { ja: 'サーバーを切り離して証拠を保全し、修正は調査と並行して進める。', en: '' }
        minutes: 150
        category: maintain
        points: 20
        refs: [nist-sp800-61r3]
        gauges: { damage: -10, stamina: -10 }
        setFlags: { evidencePreserved: true }
        items:
          - { id: p02-b-record, points: 8, axis: record, refs: [nist-sp800-61r3] }
          - { id: p02-b-order, points: 5, axis: order, refs: [nist-sp800-61r3] }
          - { id: p02-b-time, points: 3, axis: time, refs: [jpcert-handling] }
        explain: { ja: '証拠保全と修正の並行は妥当だが、止められない決済の代替手段に触れておらず、現場が止まりやすい。', en: '' }
      - id: p02-preserve-plan
        text: { ja: '証拠を保全し、修正の計画と決済の代替手段を同時に指示する。', en: '' }
        minutes: 180
        category: recover
        points: 100
        refs: [nist-sp800-61r3, meti-csm-guideline]
        gauges: { damage: -15, trust: 5, stamina: -15 }
        setFlags: { evidencePreserved: true, patchPlan: true }
        items:
          - { id: p02-c-record, points: 8, axis: record, refs: [nist-sp800-61r3] }
          - { id: p02-c-order, points: 8, axis: order, refs: [nist-sp800-61r3] }
          - { id: p02-c-content, points: 8, axis: content, refs: [meti-csm-guideline] }
          - { id: p02-c-care, points: 5, axis: care, refs: [jpcert-handling] }
        explain: { ja: '証拠と復旧を同時に進め、決済の代替まで示した。被害と業務の両方を見ている点が強い。', en: '' }
      - id: p02-patch
        text: { ja: '修正を当てることを優先し、証拠の保全は後回しにして進める。', en: '' }
        minutes: 120
        category: hurt
        points: -120
        refs: [nist-sp800-61r3]
        gauges: { damage: 15, flame: 5, trust: -10 }
        delayed:
          - { afterPhases: 1, points: -50, gauges: { damage: 10, trust: -10 }, reason: { ja: '証拠が失われ、侵入経路と漏えい範囲の特定ができなくなった。', en: '' } }
        items:
          - { id: p02-a-record, points: -15, axis: record, refs: [nist-sp800-61r3] }
          - { id: p02-a-content, points: -10, axis: content, refs: [nist-sp800-61r3] }
        explain: { ja: '修正を急ぐ判断は理解できるが、証拠を失うと侵入経路と範囲の特定が難しくなる。後工程の負担が大きい。', en: '' }

    lesson: { ja: '証拠保全と復旧は対立しない。影響のある系を切り離して証拠を残し、修正は調査と並行して進める。決済のように止められない業務には、先に代替手段を用意しておくことが、その後の説明責任にもつながる。', en: '' }
  - id: p03-stop
    at: { day: 1, minutes: 420 }
    phase: contain
    sound: { se: [phone_ring, notify_sns] }
    text: { ja: '朝7時。自治体の税金払いサイトを止めるか。窓口は8時に開く。カード決済は分離して動かしたままにできる。', en: '' }
    voices: [v03-public, v03-coward, v03-ok]
    choices:
      - id: p03-partial
        text: { ja: '問題のサイトだけを止め、自治体の担当者に電話で連絡する。', en: '' }
        minutes: 90
        category: maintain
        points: 20
        refs: [meti-csm-guideline]
        gauges: { flame: 10, damage: -20, stamina: -10 }
        setFlags: { siteStopped: true }
        items:
          - { id: p03-b-content, points: 5, axis: content, refs: [nist-sp800-61r3] }
          - { id: p03-b-order, points: 5, axis: order, refs: [meti-csm-guideline] }
          - { id: p03-b-care, points: -5, axis: care, refs: [jpcert-handling] }
        explain: { ja: '対象を絞って止めた判断は妥当だが、委託元への連絡が電話だけで、代替手段と再開見込みが伝わらない。', en: '' }
      - id: p03-keep
        text: { ja: '決済は止めずに監視を強め、翌朝の利用状況を見て判断する。', en: '' }
        minutes: 60
        category: hurt
        points: -100
        refs: [nist-sp800-61r3]
        gauges: { damage: 20, flame: 5 }
        delayed:
          - { afterPhases: 1, points: -60, gauges: { damage: 15, trust: -10 }, reason: { ja: '止めなかった経路から再び侵入され、被害が広がった。', en: '' } }
        items:
          - { id: p03-a-content, points: -10, axis: content, refs: [nist-sp800-61r3] }
          - { id: p03-a-record, points: -8, axis: record, refs: [nist-sp800-61r3] }
        explain: { ja: '監視を強めても、侵入が続けば被害は広がる。止める判断を先送りした分、復旧と説明が後手に回る。', en: '' }
      - id: p03-stop-plan
        text: { ja: '対象サイトを止め、自治体に代替の支払い方法と再開見込みを伝える。', en: '' }
        minutes: 120
        category: recover
        points: 100
        refs: [meti-csm-guideline, jpcert-handling]
        gauges: { flame: 10, damage: -30, trust: 10, stamina: -15 }
        setFlags: { siteStopped: true, muniInformed: true }
        items:
          - { id: p03-c-time, points: 5, axis: time, refs: [jpcert-handling] }
          - { id: p03-c-order, points: 8, axis: order, refs: [meti-csm-guideline] }
          - { id: p03-c-care, points: 10, axis: care, refs: [jpcert-handling] }
          - { id: p03-c-content, points: 5, axis: content, refs: [meti-csm-guideline] }
        explain: { ja: '止める範囲を絞り、代替の支払い方法と再開見込みまで伝えた。利用者の混乱を抑える実務的な対応だ。', en: '' }

    lesson: { ja: '止めるか止めないかは、被害の拡大と業務への影響を並べて決める。止める場合でも、委託元への連絡、代替の支払い方法、再開の見込みを同時に伝えれば、利用者の混乱は抑えられる。監視だけで様子を見る判断は、被害が続く前提を忘れがちだ。', en: '' }
  - id: p04-muni
    at: { day: 1, minutes: 600 }
    phase: organize
    sound: { se: [phone_ring] }
    text: { ja: '10時。自治体は「庁内の調整に一週間はかかる。発表は一緒に頼む」と言う。まだ報道はない。どちらが先に発表するか。', en: '' }
    voices: [v04-law, v04-boss, v04-ok]
    notable:
      - { id: note-gov-share, text: { ja: '自治体には公表の文面を事前に共有し、発表の順番と理由を記録した。', en: '' } }
    choices:
      - id: p04-share
        text: { ja: '同日の同時発表を自治体に求め、文面を先に共有して事実を出す。', en: '' }
        minutes: 120
        category: recover
        points: 100
        refs: [meti-disclosure-guidance, no02-ppc-report-entrusted, jpcert-handling]
        gauges: { flame: -5, trust: 10, stamina: -10 }
        setFlags: { govAligned: true }
        items:
          - { id: p04-b-order, points: 8, axis: order, refs: [jpcert-handling] }
          - { id: p04-b-care, points: 8, axis: care, refs: [meti-disclosure-guidance] }
          - { id: p04-b-content, points: 5, axis: content, refs: [no02-ppc-report-entrusted] }
          - { id: p04-b-record, points: 5, axis: record, refs: [jpcert-handling] }
        explain: { ja: '文面を先に共有し、同時発表を目指した点が評価できる。応じられない場合の自社発表も決めており、順番を守りつつ空白を作らない。', en: '' }
      - id: p04-wait
        text: { ja: '自治体の庁内調整を待ち、それが終わるまで当社は何も出さない。', en: '' }
        minutes: 180
        category: hurt
        points: -80
        refs: [meti-disclosure-guidance]
        gauges: { flame: 10, trust: -10, damage: 5 }
        coward: true
        delayed:
          - { afterPhases: 1, points: -40, gauges: { flame: 15 }, reason: { ja: '調整を待つ間に報道が先に出て、説明の順番が崩れた。', en: '' } }
        items:
          - { id: p04-a-time, points: -10, axis: time, refs: [meti-disclosure-guidance] }
          - { id: p04-a-order, points: -8, axis: order, refs: [meti-disclosure-guidance] }
          - { id: p04-a-record, points: -5, axis: record, refs: [jpcert-handling] }
        explain: { ja: '庁内調整を待つ間にも報道は進む。説明の空白は隠蔽と受け取られやすく、信頼の回復に時間がかかる。', en: '' }
      - id: p04-silent
        text: { ja: '自治体が発表するまで待ち、当社からの説明は控えることに決める。', en: '' }
        minutes: 60
        category: hurt
        points: -120
        refs: [meti-disclosure-guidance, no02-ppc-report-entrusted]
        gauges: { flame: 25, trust: -25 }
        setFlags: { deferredToClient: true }
        delayed:
          - { afterPhases: 2, points: -60, gauges: { flame: 15, trust: -10 }, reason: { ja: '委託元まかせと報じられ、隠蔽と受け取られた。', en: '' } }
        items:
          - { id: p04-c-wording, points: -20, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: p04-c-record, points: -10, axis: record, refs: [jpcert-handling] }
          - { id: p04-c-time, points: -10, axis: time, refs: [meti-disclosure-guidance] }
        explain: { ja: '委託元に任せきりにすると、当社の関与が見えなくなる。事実を出さない時間が長いほど、後で説明しにくくなる。', en: '' }

    lesson: { ja: '委託元との発表は、順番と文面の共有で決まる。同時発表が難しい場合でも、事実を出す時刻を先に伝え、共有した記録を残す。待つことと任せることは違う。黙って待てば、隠蔽と受け取られても仕方がない。', en: '' }
  - id: p05-first-report
    at: { day: 1, minutes: 1080 }
    phase: notify
    sound: { se: [typing] }
    text: { ja: '18時。広報が「今夜、第1報を出せます。被害の全容はまだ分かっていません」と言う。', en: '' }
    voices: [v05-coward, v05-popular, v05-ok]
    choices:
      - id: p05-wait
        text: { ja: '全容が分かってから、正確な内容だけをまとめて発表する。', en: '' }
        minutes: 180
        category: hurt
        points: -100
        refs: [ppc-report-prelim]
        gauges: { flame: 15, trust: -10 }
        coward: true
        delayed:
          - { afterPhases: 1, points: -30, gauges: { flame: 10 }, reason: { ja: '報道が先に「説明なし」と報じた。', en: '' } }
        items:
          - { id: p05-b-time, points: -10, axis: time, refs: [ppc-report-prelim] }
          - { id: p05-b-care, points: -10, axis: care, refs: [ppc-notify-person] }
        explain: { ja: '全容を待つ間に、報道や憶測が先に広がる。説明の空白は、後から事実を出しても埋めにくい。', en: '' }
      - id: p05-tonight
        text: { ja: '今夜中に第1報を出し、分からない点は調査中と明記する。', en: '' }
        minutes: 120
        category: maintain
        points: 20
        refs: [ppc-report-prelim]
        gauges: { trust: 5, stamina: -10 }
        detail: first-report
        setFlags: { firstPublic: true }
        items:
          - { id: p05-a-record, points: 5, axis: record, refs: [meti-disclosure-guidance] }
          - { id: p05-a-order, points: 5, axis: order, refs: [meti-disclosure-guidance] }
        explain: { ja: '分かる範囲で第1報を出し、不明点を調査中と明記した。初期の説明として誠実で、その後の更新もしやすい。', en: '' }
      - id: p05-maintenance
        text: { ja: '今夜、メンテナンスに伴う障害として利用者に発表する。', en: '' }
        minutes: 90
        category: fatal
        points: -250
        refs: [ppc-report-scope]
        gauges: { flame: 30, trust: -20 }
        setFlags: { hidFacts: true, maintenanceExplained: true }
        items:
          - { id: p05-c-wording, points: -20, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: p05-c-care, points: -10, axis: care, refs: [meti-disclosure-guidance] }
          - { id: p05-c-record, points: -10, axis: record, refs: [jpcert-handling] }
        explain: { ja: '障害という言い換えは、原因が分かった時に矛盾する。隠す意図がなくても、後の説明の信頼を大きく損なう。', en: '' }

    lesson: { ja: '全容が分かるまで待つと、その間の説明が空白になる。分かっている事実と不明点を分け、今夜中に第1報を出す。メンテナンス障害という言い換えは、後で必ず矛盾する。最初の説明が、その後の信頼の土台になる。', en: '' }
  - id: p06-card
    at: { day: 2, minutes: 540 }
    phase: notify
    sound: { se: [mail_arrive] }
    text: { ja: '9時。調査で、カードのセキュリティコードまで保存していたことが分かった。三年前の接続仕様の変更で、デバッグ用ログに残す設定が入り、そのまま本番に残っていた。当時の決裁は決済事業部門にある。カード会社への連絡をどうするか。', en: '' }
    voices: [v06-vendor, v06-law, v06-ok]
    notable:
      - { id: note-card-code, text: { ja: 'カードのセキュリティコードを保存していた事実と、三年前の接続仕様の変更で入った設定、廃止の予定を記録した。', en: '' } }
    choices:
      - id: p06-later
        text: { ja: '原因の究明を優先し、カード会社への連絡は後日に回す。', en: '' }
        minutes: 120
        category: hurt
        points: -120
        refs: [ppc-report-scope]
        gauges: { damage: 15, flame: 5, trust: -10 }
        items:
          - { id: p06-a-order, points: -10, axis: order, refs: [ppc-report-scope] }
          - { id: p06-a-content, points: -10, axis: content, refs: [ppc-report-scope] }
        explain: { ja: '原因の究明を優先した結果、カード会社の監視強化が遅れる。不正利用の拡大を招きかねない。', en: '' }
      - id: p06-notify
        text: { ja: 'カード会社と加盟店契約会社に事実を連絡し、監視の強化を頼む。', en: '' }
        minutes: 120
        category: maintain
        points: 20
        refs: [ppc-report-scope, meti-csm-guideline]
        gauges: { trust: 5, stamina: -10 }
        setFlags: { cardNotified: true }
        items:
          - { id: p06-b-order, points: 8, axis: order, refs: [ppc-report-scope] }
          - { id: p06-b-content, points: 5, axis: content, refs: [meti-csm-guideline] }
        explain: { ja: '事実を早く連絡し、監視の強化を依頼した点は妥当。保存情報の削除予定まで踏み込むと、さらに信頼される。', en: '' }
      - id: p06-notify-plan
