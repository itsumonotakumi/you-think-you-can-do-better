      - id: timing
        label: { ja: '出す時刻', en: '' }
        auto: true
        items:
          - { id: fd-t-24h, when: { withinHours: 24 }, points: 10, axis: time, refs: [ppc-report-prelim] }
          - { id: fd-t-72h, when: { withinHours: 72 }, points: 3, axis: time, refs: [ppc-report-prelim] }
          - { id: fd-t-late, when: { otherwise: true }, points: -15, axis: time, refs: [ppc-report-prelim] }
      - id: scope
        label: { ja: '対象範囲', en: '' }
        options:
          - { id: fd-s-all, text: { ja: '委託元の全利用者（過去の利用者を含む）', en: '' }, points: 10, axis: content, refs: [ppc-report-scope] }
          - { id: fd-s-current, text: { ja: '現行の利用者のみ', en: '' }, points: -20, axis: content, refs: [ppc-report-scope], delayed: { afterPhases: 1, points: -20, reason: { ja: '対象の訂正が必要になった。', en: '' } } }
      - id: dates
        label: { ja: '日時の書き方', en: '' }
        options:
          - { id: fd-d-split, text: { ja: '発生と検知の日時を分けて書く', en: '' }, points: 5, axis: content, refs: [jpcert-handling] }
          - { id: fd-d-merge, text: { ja: '発生と検知をまとめて書く', en: '' }, points: -10, axis: wording, refs: [jpcert-handling] }
      - id: certainty
        label: { ja: '断定の強さ', en: '' }
        options:
          - { id: fd-c-maybe, text: { ja: '「漏えいの可能性」と「確認」を使い分ける', en: '' }, points: 5, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: fd-c-confirm, text: { ja: 'すべて「漏えいを確認」と断定する', en: '' }, points: -15, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: fd-c-none, text: { ja: '「漏えいはない」と書く', en: '' }, points: -20, axis: wording, refs: [ppc-report-scope] }
      - id: leaked
        label: { ja: '漏れた項目', en: '' }
        options:
          - { id: fd-l-specific, text: { ja: 'カード番号、有効期限、氏名、連絡先を具体的に列挙する', en: '' }, points: 10, axis: content, refs: [ppc-report-scope] }
          - { id: fd-l-vague, text: { ja: '「一部の情報」とぼかす', en: '' }, points: -10, axis: content, refs: [ppc-report-scope] }
      - id: action
