        explain: { ja: '交代制に加え、外部ヘルプデスクと臨時窓口を増員した。負荷を分け、社員のケアも組み込んでいる。', en: '' }
      - id: p13-allnight
        text: { ja: '全員で最後まで走り抜き、休むのは落ち着いてからにする。', en: '' }
        minutes: 120
        category: hurt
        points: -30
        refs: [ipa-sme-guideline]
        gauges: { stamina: -20, damage: 10, trust: -5 }
        delayed:
          - { afterPhases: 2, points: -40, gauges: { stamina: -15, damage: 10 }, reason: { ja: '疲労から確認漏れが起き、復旧作業がやり直しになった。', en: '' } }
        items:
          - { id: p13-a-care, points: -10, axis: care, refs: [ipa-sme-guideline] }
          - { id: p13-a-care2, points: -8, axis: care, refs: [ipa-sme-guideline] }
        explain: { ja: '全員で走り続けると、疲労から確認漏れが起きる。休む判断を先送りした分、復旧のやり直しが増える。', en: '' }
      - id: p13-shift
        text: { ja: '半日ごとの交代制を敷き、社長自身も休む時間を確保する。', en: '' }
        minutes: 90
        category: maintain
        points: 20
        refs: [ipa-sme-guideline]
        gauges: { stamina: 10, trust: 5 }
        items:
          - { id: p13-b-care, points: 8, axis: care, refs: [ipa-sme-guideline] }
          - { id: p13-b-care2, points: 5, axis: care, refs: [ipa-sme-guideline] }
        explain: { ja: '交代制を敷き、社長自身も休むことにした。長い対応を前提にした現実的な判断だ。復旧までの時間を短くできる。', en: '' }

    lesson: { ja: '長時間の対応は、集中力を落とし、確認漏れを生む。半日ごとの交代制を敷き、社外のヘルプデスクや臨時窓口で負荷を分ける。社員のケアも、復旧の品質を保つための投資と考えたい。', en: '' }
  - id: p14-resume
    at: { day: 12, minutes: 540 }
    phase: recover
    sound: { se: [phone_ring] }
    text: { ja: '9時。自治体から「月末の納付期限に間に合わせてほしい」と連絡が来た。復旧のめどは立ったが、検証は終わっていない。', en: '' }
    voices: [v14-coward, v14-public, v14-ok]
    choices:
      - id: p14-rush
        text: { ja: '全面再開に踏み切り、監視を通常の体制に戻して様子を見る。', en: '' }
        minutes: 120
        category: hurt
        points: -150
        refs: [nist-sp800-61r3]
        gauges: { damage: 20, flame: 10, trust: -10 }
        delayed:
          - { afterPhases: 1, points: -60, gauges: { damage: 15, trust: -15 }, reason: { ja: '再開後に別の経路で不審な通信が見つかり、再度停止した。', en: '' } }
        items:
          - { id: p14-a-time, points: -10, axis: time, refs: [nist-sp800-61r3] }
          - { id: p14-a-record, points: -10, axis: record, refs: [nist-sp800-61r3] }
          - { id: p14-a-care, points: -10, axis: care, refs: [ppc-notify-person] }
        explain: { ja: '全面再開と監視の通常化を同時に決めた。再発の兆候を見逃し、再度止める事態になりやすい。', en: '' }
      - id: p14-verified
        text: { ja: '段階的に再開し、再開前の第三者検証と再発時の補償を明記する。', en: '' }
        minutes: 300
        category: recover
        points: 100
        refs: [nist-sp800-61r3, ppc-notify-person]
        gauges: { damage: -15, trust: 10, stamina: -15 }
        setFlags: { verifiedResume: true }
        items:
          - { id: p14-c-content, points: 8, axis: content, refs: [nist-sp800-61r3] }
          - { id: p14-c-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: p14-c-care, points: 8, axis: care, refs: [ppc-notify-person] }
          - { id: p14-c-time, points: 5, axis: time, refs: [meti-csm-guideline] }
        explain: { ja: '再開前に第三者検証を行い、再発時の補償も明記した。利用者と取引先の不安に応える内容だ。', en: '' }
      - id: p14-step
        text: { ja: 'クリーンな環境から段階的に再開し、監視を強化して続ける。', en: '' }
        minutes: 240
        category: maintain
        points: 30
        refs: [nist-sp800-61r3]
        gauges: { damage: -10, stamina: -10, trust: 5 }
        items:
          - { id: p14-b-content, points: 8, axis: content, refs: [nist-sp800-61r3] }
          - { id: p14-b-record, points: 5, axis: record, refs: [nist-sp800-61r3] }
          - { id: p14-b-time, points: 3, axis: time, refs: [meti-csm-guideline] }
        explain: { ja: '段階的に再開し、監視を強化した。リスクを抑えながら業務を戻す妥当な判断だ。再発の防止にもつながる。', en: '' }

    lesson: { ja: '再開は速さより条件で決める。クリーンな環境から段階的に戻し、第三者検証と監視の強化を前提にする。再発したときの補償まで先に明記しておけば、利用者と取引先の不安を減らせる。', en: '' }
  - id: p15-final
    at: { day: 45, minutes: 600 }
    phase: after
    sound: { se: [notify_news] }
    text: { ja: '10時。個人情報保護委員会への確報と、第三者委員会の調査報告書が完成した。公開の範囲を決める。', en: '' }
    voices: [v15-expert, v15-law, v15-ok]
    choices:
      - id: p15-hide
        text: { ja: '確報は出すが、調査報告書は社内にとどめて公開しない。', en: '' }
        minutes: 60
        category: hurt
        points: -100
        refs: [meti-disclosure-guidance]
        gauges: { flame: 15, trust: -15 }
        setFlags: { ppcFinalFiled: true }
        items:
          - { id: p15-a-content, points: -10, axis: content, refs: [meti-disclosure-guidance] }
          - { id: p15-a-wording, points: -10, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: p15-a-record, points: -5, axis: record, refs: [meti-disclosure-guidance] }
        explain: { ja: '確報だけを出して報告書を公開しないと、隠しているという疑いが残る。再発防止の検証も進みにくい。', en: '' }
      - id: p15-publish
        text: { ja: '攻撃に使える部分だけを伏せて、調査報告書を全文公開する。', en: '' }
        minutes: 180
        category: recover
        points: 100
        refs: [meti-disclosure-guidance]
        gauges: { flame: -10, trust: 15, stamina: -10 }
        setFlags: { ppcFinalFiled: true, fullDisclosure: true }
        detail: final-report
        items:
          - { id: p15-b-content, points: 8, axis: content, refs: [meti-disclosure-guidance] }
          - { id: p15-b-record, points: 5, axis: record, refs: [meti-disclosure-guidance] }
        explain: { ja: '攻撃に使える部分だけを伏せて全文公開した。説明責任を果たしつつ、悪用のリスクも抑えている。', en: '' }
      - id: p15-share
        text: { ja: '全文公開に加え、再発防止の進捗と教訓を業界に無償で共有する。', en: '' }
        minutes: 240
        category: increase
        points: 300
        fatalAlternate: 50
        refs: [meti-disclosure-guidance]
        gauges: { flame: -15, trust: 20, stamina: -15 }
        setFlags: { ppcFinalFiled: true, fullDisclosure: true, industryShare: true }
        detail: final-report
        items:
          - { id: p15-c-content, points: 8, axis: content, refs: [meti-disclosure-guidance] }
          - { id: p15-c-record, points: 8, axis: record, refs: [meti-disclosure-guidance] }
          - { id: p15-c-content2, points: 8, axis: content, refs: [meti-disclosure-guidance] }
        explain: { ja: '全文公開に加え、進捗と教訓を業界に共有した。自社だけでなく、決済業界全体の再発防止に貢献する。', en: '' }

    lesson: { ja: '調査報告書は、隠すほど疑いを残す。攻撃に使える部分だけを伏せて全文を公開し、再発防止の進捗と教訓を業界に共有する。説明を一度で終わらせず、更新し続けることが信頼につながる。', en: '' }
  - id: p16-press
    at: { day: 46, minutes: 540 }
    phase: after
    sound: { se: [shutter] }
    text: { ja: '9時。記者会見を明日に控え、広報が「質問は制限して、二十分で終わらせたい」と言う。', en: '' }
    voices: [v16-flattery, v16-coward, v16-ok]
    choices:
      - id: p16-ready
        text: { ja: '想定問答を全役員で確認し、最初に被害者への謝罪を述べる。', en: '' }
        minutes: 150
        category: recover
        points: 100
        refs: [meti-csm-guideline, jpcert-handling]
        gauges: { flame: -10, trust: 10, stamina: -10 }
        setFlags: { pressReady: true }
        items:
          - { id: p16-c-order, points: 8, axis: order, refs: [meti-csm-guideline] }
          - { id: p16-c-care, points: 8, axis: care, refs: [meti-csm-guideline] }
          - { id: p16-c-record, points: 8, axis: record, refs: [jpcert-handling] }
        explain: { ja: '想定問答を全役員で確認し、最初に謝罪を述べた。会見の準備と順番が整っており、信頼の回復に近い。', en: '' }
      - id: p16-short
        text: { ja: '質問を制限し、会見を短時間で打ち切って終わらせる。', en: '' }
        minutes: 45
        category: hurt
        points: -60
        refs: [meti-disclosure-guidance]
        gauges: { flame: 15, trust: -10 }
        items:
          - { id: p16-a-care, points: -10, axis: care, refs: [meti-disclosure-guidance] }
          - { id: p16-a-care2, points: -8, axis: care, refs: [meti-disclosure-guidance] }
        explain: { ja: '質問を制限して打ち切ると、隠していると受け取られる。説明の機会を減らすほど、批判は長引く。', en: '' }
      - id: p16-facts
        text: { ja: '記録を手元に置き、事実だけを答え、不明点は確認して答える。', en: '' }
        minutes: 90
        category: maintain
        points: 30
        refs: [jpcert-handling]
        gauges: { trust: 5, stamina: -10 }
        items:
          - { id: p16-b-wording, points: 8, axis: wording, refs: [jpcert-handling] }
          - { id: p16-b-wording2, points: 8, axis: wording, refs: [meti-disclosure-guidance] }
        explain: { ja: '記録を手元に置き、事実だけを答えた。不明点に期限を設ける姿勢も、誠実な説明につながる。', en: '' }

    lesson: { ja: '記者会見では、記録に基づく事実だけを答える。想定問答を全役員で確認し、最初に被害者への謝罪を述べる。答えられない問いには、回答の期限を約束する。質問を制限すると、隠していると受け取られる。', en: '' }
drafts:
  first-report:
    title: { ja: '第1報の文案', en: '' }
    slots:
      - id: timing
        label: { ja: '出す時刻', en: '' }
        auto: true
        items:
          - { id: fd-t-24h, when: { withinHours: 24 }, points: 10, axis: time, refs: [ppc-report-prelim] }
          - { id: fd-t-72h, when: { withinHours: 72 }, points: 3, axis: time, refs: [ppc-report-prelim] }
          - { id: fd-t-late, when: { otherwise: true }, points: -15, axis: time, refs: [ppc-report-prelim] }
      - id: scope
        label: { ja: '対象範囲', en: '' }
        options:
          - { id: fd-s-current, text: { ja: '現行の利用者だけを対象にし、過去の利用者は除く。', en: '' }, points: -20, axis: content, refs: [ppc-report-scope], delayed: { afterPhases: 1, points: -20, reason: { ja: '対象の訂正が必要になった。', en: '' } }, explain: { ja: '現行の利用者に限定すると、過去の利用者への通知が漏れる。対象の訂正が必要になり、信頼を損なう。', en: '' } }
          - { id: fd-s-all, text: { ja: '委託元の全利用者を対象にし、過去の利用者も含める。', en: '' }, points: 10, axis: content, refs: [ppc-report-scope], explain: { ja: '過去の利用者まで対象にした点が評価できる。対象を広げるほど通知の負担は増えるが、漏れによる不信を避けられる。', en: '' } }
      - id: dates
        label: { ja: '日時の書き方', en: '' }
        options:
          - { id: fd-d-split, text: { ja: '発生と検知の日時を分けて、それぞれの時刻を書く。', en: '' }, points: 5, axis: content, refs: [jpcert-handling], explain: { ja: '発生と検知を分けると、初動の遅れも隠さず示せる。後の検証で時刻を照合しやすい。復旧までの時間を短くできる。', en: '' } }
          - { id: fd-d-merge, text: { ja: '発生と検知をまとめて、一つの日時として書く。', en: '' }, points: -10, axis: wording, refs: [jpcert-handling], explain: { ja: '発生と検知をまとめると、都合よく見える。検証で食い違いが出た時の説明が難しくなる。', en: '' } }
      - id: certainty
        label: { ja: '断定の強さ', en: '' }
        options:
          - { id: fd-c-confirm, text: { ja: 'すべて漏えいを確認したと断定して、強く書く。', en: '' }, points: -15, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: '未確認の事実まで断定すると、後で訂正が必要になる。説明の信頼を損ないやすい。被害の拡大を招きかねない。', en: '' } }
          - { id: fd-c-maybe, text: { ja: '漏えいの可能性と確認済みを使い分けて、確度を示す。', en: '' }, points: 5, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: '可能性と確認済みを使い分け、確度を正確に伝えている。断定的な表現を避け、後の更新にも耐える。', en: '' } }
          - { id: fd-c-none, text: { ja: '漏えいはないと明記して、影響を否定する。', en: '' }, points: -20, axis: wording, refs: [ppc-report-scope], explain: { ja: '漏えいがないと書くと、事実と異なる場合に大きな問題になる。安全宣言は根拠がある時だけ使う。', en: '' } }
      - id: leaked
        label: { ja: '漏れた項目', en: '' }
        options:
          - { id: fd-l-specific, text: { ja: '漏れた項目を、カード番号や氏名など具体的に列挙する。', en: '' }, points: 10, axis: content, refs: [ppc-report-scope], explain: { ja: '漏れた項目を具体的に示すと、利用者が自分のリスクを判断できる。通知の実効性が高い。', en: '' } }
          - { id: fd-l-vague, text: { ja: '漏れた項目は一部の情報とぼかして、詳細を避ける。', en: '' }, points: -10, axis: content, refs: [ppc-report-scope], explain: { ja: '一部の情報とぼかすと、利用者は何を確認すべきか分からない。不安だけが残る。被害の拡大を招きかねない。', en: '' } }
      - id: action
        label: { ja: '利用者が今すぐすること', en: '' }
        options:
          - { id: fd-a-generic, text: { ja: '注意してくださいとだけ書いて、具体的な行動は示さない。', en: '' }, points: -10, axis: care, refs: [ppc-notify-person], explain: { ja: '注意してくださいだけでは、何をすればよいか伝わらない。行動につながらない通知になる。', en: '' } }
          - { id: fd-a-concrete, text: { ja: 'カード会社への連絡や明細の確認など、行動を具体的に書く。', en: '' }, points: 10, axis: care, refs: [ppc-notify-person], explain: { ja: '連絡先や確認方法を具体的に示すと、利用者はすぐ行動できる。通知の目的を果たしている。', en: '' } }
      - id: phishing
        label: { ja: '偽通知への注意', en: '' }
        options:
          - { id: fd-p-warn, text: { ja: '当社が電話でカード番号を聞くことはないと明記する。', en: '' }, points: 8, axis: care, refs: [ppc-notify-person], explain: { ja: '当社が電話でカード番号を聞かないと明記した。偽の連絡による二次被害を防ぐ実務的な注意だ。', en: '' } }
          - { id: fd-p-none, text: { ja: '偽の連絡への注意は書かず、本題だけを伝える。', en: '' }, points: -10, axis: care, refs: [ppc-notify-person], explain: { ja: '偽通知への注意を書かないと、不安につけ込む連絡に利用者が応じてしまう恐れがある。', en: '' } }
      - id: contact
        label: { ja: '問い合わせ窓口', en: '' }
        options:
          - { id: fd-w-number, text: { ja: '問い合わせは代表番号だけを書いて、受付時間は省く。', en: '' }, points: -5, axis: care, refs: [meti-csm-guideline], explain: { ja: '番号だけでは、いつ誰が対応するか分からない。問い合わせの混雑に対応できない。現場の混乱が長引く。', en: '' } }
          - { id: fd-w-none, text: { ja: '問い合わせ窓口は書かず、案内は本文だけにする。', en: '' }, points: -15, axis: care, refs: [meti-csm-guideline], explain: { ja: '窓口を書かないと、利用者は相談先を失う。不安がSNSなどに流れ、二次的な混乱を招く。', en: '' } }
          - { id: fd-w-hours, text: { ja: '専用窓口の番号、受付時間、増員の体制まで書く。', en: '' }, points: 5, axis: care, refs: [meti-csm-guideline], explain: { ja: '番号だけでなく受付時間と増員まで示した。問い合わせが集中しても対応しやすい。復旧までの時間を短くできる。', en: '' } }
      - id: next
        label: { ja: '次の報告', en: '' }
        options:
          - { id: fd-n-next, text: { ja: '次の報告の予定日と、更新する内容を書く。', en: '' }, points: 3, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '次の報告予定を示すと、利用者は更新を待てる。説明が一度で終わらないことを伝えている。', en: '' } }
          - { id: fd-n-none, text: { ja: '次回の報告予定は書かず、今回の内容だけを伝える。', en: '' }, points: -5, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '次回の予定がないと、利用者は情報が出るまで不安を抱える。問い合わせも増えやすい。', en: '' } }
      - id: apology
        label: { ja: '謝罪の主語', en: '' }
        options:
          - { id: fd-ap-muni, text: { ja: '委託元の自治体の責任として、謝罪の主体を任せる。', en: '' }, points: -10, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: '委託元の責任として謝罪すると、自社の責任を回避しているように見える。関係が悪化しやすい。', en: '' } }
          - { id: fd-ap-company, text: { ja: '当社として謝罪し、責任の所在を明確にする。', en: '' }, points: 3, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: '当社として謝罪し、責任の所在を明確にした。委託元に責任を転嫁しない姿勢が伝わる。', en: '' } }
      - id: govshare
        label: { ja: '自治体への共有', en: '' }
        options:
          - { id: fd-g-share, text: { ja: '公表の前に、自治体へ文面を共有して了解を得る。', en: '' }, points: 5, axis: order, refs: [jpcert-handling], explain: { ja: '公表前に文面を共有し、自治体の了解を得た。同時発表の土台になり、順番の混乱を避けられる。', en: '' } }
          - { id: fd-g-after, text: { ja: '公表の後に、自治体へ報告して事後で連絡する。', en: '' }, points: -10, axis: order, refs: [jpcert-handling], explain: { ja: '公表後に報告すると、自治体は事後対応になる。発表の順番を巡る不信を招きやすい。被害の拡大を招きかねない。', en: '' } }
      - id: approval
        label: { ja: '社内確認', en: '' }
        options:
          - { id: fd-i-solo, text: { ja: '社長の判断だけで文案を決め、社内の確認は省く。', en: '' }, points: -10, axis: order, refs: [meti-csm-guideline], explain: { ja: '社長の判断だけで出すと、法務やIRの確認が抜ける。後の訂正や説明の負担が増える。', en: '' } }
          - { id: fd-i-share, text: { ja: '公表の前に、広報・法務・IRで文案を確認する。', en: '' }, points: 5, axis: order, refs: [meti-csm-guideline], explain: { ja: '広報・法務・IRで文案を確認した。表現の齟齬や開示漏れを防げる。現場の負担も抑えられる。', en: '' } }
      - id: record
        label: { ja: '記録', en: '' }
        options:
          - { id: fd-r-log, text: { ja: '公表した時刻と版を記録に残し、後から確認できるようにする。', en: '' }, points: 5, axis: record, refs: [jpcert-handling], explain: { ja: '公表した時刻と版を記録した。後の訂正や検証で、何をいつ出したかを示せる。復旧までの時間を短くできる。', en: '' } }
          - { id: fd-r-none, text: { ja: '公表の記録は残さず、口頭の共有だけで済ませる。', en: '' }, points: -8, axis: record, refs: [jpcert-handling], explain: { ja: '記録を残さないと、後の検証で説明が食い違う。訂正の経緯も追えなくなる。再発の危険を残す。', en: '' } }
  final-report:
    title: { ja: '調査報告書の公開範囲', en: '' }
    slots:
      - id: scope
        label: { ja: '公開する範囲', en: '' }
        options:
          - { id: fr-s-hide, text: { ja: '報告書は公開せず、社内と所管庁への提出だけにする。', en: '' }, points: -20, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '報告書を公開しないと、隠蔽の疑いが残る。再発防止の検証も進みにくい。後の訂正や説明の負担が増える。', en: '' } }
          - { id: fr-s-full, text: { ja: '攻撃に使える詳細だけを伏せて、報告書を全文公開する。', en: '' }, points: 10, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '攻撃に使える詳細だけを伏せて全文公開した。説明責任と悪用防止のバランスが取れている。', en: '' } }
      - id: cause
        label: { ja: '原因の書き方', en: '' }
        options:
          - { id: fr-c-cause, text: { ja: '原因と判断の誤りを、具体的な経緯として書く。', en: '' }, points: 10, axis: content, refs: [nist-sp800-61r3], explain: { ja: '原因と判断の誤りを具体的に書いた。再発防止につながり、説明としても説得力がある。', en: '' } }
          - { id: fr-c-vague, text: { ja: '外部からの攻撃とだけ書いて、原因は特定しない。', en: '' }, points: -10, axis: content, refs: [nist-sp800-61r3], explain: { ja: '外部からの攻撃とだけ書くと、自社の課題が見えない。再発防止の議論が進まない。関係先の不信を招きやすい。', en: '' } }
      - id: vuln
        label: { ja: '公表済みの脆弱性への対応', en: '' }
        options:
          - { id: fr-v-omit, text: { ja: '公表済みの脆弱性には触れず、対応の遅れも書かない。', en: '' }, points: -15, axis: content, refs: [meti-csm-guideline], explain: { ja: '脆弱性に触れないと、同じ問題の再発を防げない。説明の一貫性も失う。被害の拡大を招きかねない。', en: '' } }
          - { id: fr-v-late, text: { ja: '公表済みの脆弱性に、対応が遅れた経緯を書く。', en: '' }, points: 10, axis: content, refs: [meti-csm-guideline], explain: { ja: '対応が遅れた経緯を書いた。都合の悪い事実ほど、隠さず示すほうが信頼される。関係先の理解を得やすい。', en: '' } }
      - id: code
        label: { ja: 'セキュリティコードの保存', en: '' }
        options:
          - { id: fr-k-design, text: { ja: '保存していた設計と、廃止が完了したことを書く。', en: '' }, points: 10, axis: content, refs: [ppc-report-scope], explain: { ja: '保存していた設計と廃止の完了を書いた。法令上の論点に正面から向き合っている。再発の防止にもつながる。', en: '' } }
          - { id: fr-k-omit, text: { ja: 'セキュリティコードの保存には触れず、件数だけを書く。', en: '' }, points: -15, axis: content, refs: [ppc-report-scope], explain: { ja: '保存の事実に触れないと、後から明らかになった時に説明が崩れる。現場の混乱が長引く。', en: '' } }
      - id: measures
        label: { ja: '再発防止策', en: '' }
        options:
          - { id: fr-m-slogan, text: { ja: '再発防止に努めますとだけ書いて、具体策は示さない。', en: '' }, points: -10, axis: content, refs: [cissp-cbk-secops], explain: { ja: '再発防止に努めますだけでは、何をするか分からない。実行の検証もできない。現場の混乱が長引く。', en: '' } }
          - { id: fr-m-plan, text: { ja: '再発防止策の実施時期と担当を、具体的に書く。', en: '' }, points: 10, axis: content, refs: [cissp-cbk-secops], explain: { ja: '実施時期と担当を書いた。対策が実行されるかを後から確認できる。その後の説明が楽になる。', en: '' } }
      - id: thirdparty
        label: { ja: '第三者委員会の意見', en: '' }
        options:
          - { id: fr-t-full, text: { ja: '第三者委員会の意見を、要約せず全文掲載する。', en: '' }, points: 8, axis: content, refs: [cissp-cbk-secops], explain: { ja: '第三者委員会の意見を全文掲載した。都合の悪い指摘も含め、説明の透明性が高い。その後の説明が楽になる。', en: '' } }
          - { id: fr-t-summary, text: { ja: '第三者委員会の意見は要約だけを載せる。', en: '' }, points: -8, axis: content, refs: [cissp-cbk-secops], explain: { ja: '要約だけでは、委員会が何を指摘したか伝わらない。都合よく切り取ったと見られやすい。', en: '' } }
      - id: victims
        label: { ja: '被害者への補償', en: '' }
        options:
          - { id: fr-vi-none, text: { ja: '被害者への補償には触れず、対応の事実だけを書く。', en: '' }, points: -10, axis: care, refs: [ppc-notify-person], explain: { ja: '補償に触れないと、被害者への配慮が乏しく見える。信頼の回復が遅れる。再発の危険を残す。', en: '' } }
          - { id: fr-vi-record, text: { ja: '被害者への補償と、窓口の実績を書く。', en: '' }, points: 8, axis: care, refs: [ppc-notify-person], explain: { ja: '補償と窓口の実績を書いた。被害者への対応が具体的に伝わる。関係先の理解を得やすい。', en: '' } }
      - id: progress
        label: { ja: '進捗の公開', en: '' }
        options:
          - { id: fr-p-monthly, text: { ja: '再発防止の進捗を、毎月公開して更新する。', en: '' }, points: 10, axis: record, refs: [meti-disclosure-guidance], explain: { ja: '進捗を毎月公開すると、対策が続いていることを示せる。説明の更新が信頼になる。現場の負担も抑えられる。', en: '' } }
          - { id: fr-p-once, text: { ja: '進捗は一度だけ公開して、以後は更新しない。', en: '' }, points: -5, axis: record, refs: [meti-disclosure-guidance], explain: { ja: '一度だけの公開では、その後の進捗が分からない。対策が止まったように見える。現場の混乱が長引く。', en: '' } }
      - id: industry
        label: { ja: '業界への共有', en: '' }
        options:
          - { id: fr-i-keep, text: { ja: '得た教訓は社内にとどめ、外部へは共有しない。', en: '' }, points: -5, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '教訓を社内にとどめると、同じ被害が他社で繰り返される。業界からの評価も上がりにくい。', en: '' } }
          - { id: fr-i-share, text: { ja: '得た教訓を業界に無償で共有し、再発を防ぐ。', en: '' }, points: 10, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '得た教訓を業界に共有した。自社の再発防止だけでなく、業界全体の底上げになる。その後の説明が楽になる。', en: '' } }
      - id: ad
        label: { ja: '宣伝との線引き', en: '' }
        options:
          - { id: fr-ad-none, text: { ja: '復旧を宣伝に使わず、事実の説明にとどめる。', en: '' }, points: 5, axis: care, refs: [meti-disclosure-guidance], explain: { ja: '復旧を宣伝に使わない姿勢は、被害者への配慮として伝わる。関係先の理解を得やすい。', en: '' } }
          - { id: fr-ad-use, text: { ja: '復旧の速さを宣伝に使い、信頼の回復を狙う。', en: '' }, points: -15, axis: care, refs: [meti-disclosure-guidance], explain: { ja: '復旧を宣伝に使うと、被害を軽く見ていると受け取られる。信頼を損ないやすい。後の訂正や説明の負担が増える。', en: '' } }
