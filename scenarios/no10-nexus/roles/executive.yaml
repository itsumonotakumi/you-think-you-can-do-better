# No.10 ネクサス半導体 / 経営者ロール
# 判断ポイント17、細目は choices[].items と drafts の合計で80以上。
estimateMinutes: 40
intro: { ja: 'あなたはネクサス半導体の代表取締役社長。生成AIの社内利用を解禁して三週間。装置制御のソースコードと会議の文字起こしが、外部のAIに入力されていた。禁じるか、安全に使える環境を用意するか。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-ppc-prelim
    ref: ppc-report-prelim
    label: { ja: '個人情報保護委員会への速報', en: '' }
    points: -150
    doneFlag: ppcPrelimFiled
  - id: dl-ppc-final
    ref: ppc-report-final-malicious
    label: { ja: '個人情報保護委員会への確報', en: '' }
    points: -100
    doneFlag: ppcFinalFiled
events:
  - id: ev-sns-share
    at: { day: 2, minutes: 1140 }
    voices: [v-ev-sns]
    gauges: { flame: 5 }
    sound: { se: [notify_sns] }
    caption: { ja: '社内の出来事が、SNSで「うちの会社も同じかも」と書かれ始めた。', en: '' }
  - id: ev-customer-call
    at: { day: 5, minutes: 600 }
    voices: [v-ev-customer]
    gauges: { flame: 5 }
    sound: { se: [phone_ring] }
    caption: { ja: '大口顧客から、説明の場を求める連絡が入った。', en: '' }
  - id: ev-competitor
    at: { day: 9, minutes: 720 }
    voices: [v-ev-competitor]
    gauges: { flame: 5 }
    caption: { ja: '競合他社が、生成AIの社内ルールを先に公開した。', en: '' }
points:
  - id: p01-code
    at: { day: 0, minutes: 570 }
    phase: detect
    sound: { se: [notify_chat] }
    text: { ja: '午前9時30分。情報システム部から連絡が入る。「社内で使っている生成AIの入力履歴に、装置制御のソースコードらしい文字列があります。まだ誰が入れたかは分かりません」。', en: '' }
    voices: [v01-boss, v01-past, v01-ok]
    notable:
      - { id: note-ai-log, text: { ja: '生成AIの入力履歴に、装置制御のソースコードらしき文字列があった。', en: '' } }
    choices:
      - id: p01-later
        text: { ja: '事実が確認できるまで、現場には知らせず、明日の役員会で扱う。', en: '' }
        minutes: 90
        category: hurt
        points: -120
        refs: [meti-trade-secret]
        gauges: { flame: 10, trust: -5, damage: 10 }
        coward: true
        setFlags: { delayedCommand: true }
        delayed:
          - { afterPhases: 1, points: -40, gauges: { trust: -10 }, reason: { ja: 'その日のうちに、同じ顧客情報が別の部署でも入力されていた。', en: '' } }
        items:
          - { id: p01-a-record, points: -8, axis: record, refs: [meti-trade-secret] }
          - { id: p01-a-time, points: -10, axis: time, refs: [meti-trade-secret] }
          - { id: p01-a-care, points: -5, axis: care, refs: [meti-csm-guideline] }
      - id: p01-secure
        text: { ja: '入力履歴を保全し、対象者と範囲の調査を直ちに始める。広報・法務・人事に共有する。', en: '' }
        minutes: 60
        category: maintain
        points: 20
        refs: [jpcert-handling, meti-trade-secret]
        gauges: { flame: -5, trust: 5, stamina: -5 }
        setFlags: { evidenceKept: true, commandStarted: true }
        items:
          - { id: p01-b-time, points: 5, axis: time, refs: [jpcert-handling] }
          - { id: p01-b-record, points: 5, axis: record, refs: [meti-trade-secret] }
          - { id: p01-b-order, points: 5, axis: order, refs: [meti-csm-guideline] }
      - id: p01-rule
        text: { ja: '履歴を保全して調査を始め、その日のうちに「何を入れてはいけないか」の一時ルールを全社に配る。', en: '' }
        minutes: 120
        category: recover
        points: 100
        refs: [meti-trade-secret, no10-ai-guideline]
        gauges: { flame: -10, damage: -10, trust: 10, stamina: -10 }
        setFlags: { evidenceKept: true, commandStarted: true, interimRule: true }
        items:
          - { id: p01-c-time, points: 5, axis: time, refs: [jpcert-handling] }
          - { id: p01-c-order, points: 8, axis: order, refs: [meti-csm-guideline] }
          - { id: p01-c-content, points: 8, axis: content, refs: [no10-ai-guideline] }
          - { id: p01-c-care, points: 5, axis: care, refs: [no10-ipa-genai] }
      - id: p01-scold
        text: { ja: '入力した本人をすぐ呼び出して、理由を問いただす。', en: '' }
        minutes: 60
        category: hurt
        points: -60
        refs: [meti-trade-secret]
        gauges: { flame: 5, trust: -5, stamina: -5 }
        items:
          - { id: p01-d-care, points: -10, axis: care, refs: [meti-csm-guideline] }
          - { id: p01-d-order, points: -8, axis: order, refs: [meti-trade-secret] }

  - id: p02-log
    at: { day: 0, minutes: 780 }
    phase: detect
    sound: { se: [notify_chat] }
    text: { ja: '午後1時。管理画面から、三週間で412人が生成AIを使い、入力は数千件あると分かった。全部を見るか、目立つものだけ見るか。', en: '' }
    voices: [v02-law, v02-field, v02-ok]
    choices:
      - id: p02-sample
        text: { ja: '目立つ数件だけ確認して、調査を終える。', en: '' }
        minutes: 90
        category: hurt
        points: -100
        refs: [meti-trade-secret]
        gauges: { damage: 15, trust: -10 }
        items:
          - { id: p02-a-content, points: -10, axis: content, refs: [meti-trade-secret] }
          - { id: p02-a-record, points: -8, axis: record, refs: [jpcert-handling] }
      - id: p02-all
        text: { ja: '全件を抽出し、機密区分と照合する。', en: '' }
        minutes: 180
        category: maintain
        points: 20
        refs: [meti-trade-secret, jpcert-handling]
        gauges: { damage: -10, stamina: -10 }
        items:
          - { id: p02-b-content, points: 8, axis: content, refs: [meti-trade-secret] }
          - { id: p02-b-record, points: 5, axis: record, refs: [jpcert-handling] }
      - id: p02-classify
        text: { ja: '全件を個人情報・顧客情報・ソースコードの三区分で分類し、外部専門家と法務に評価を依頼する。', en: '' }
