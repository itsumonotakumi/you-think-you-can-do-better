        category: recover
        points: 100
        refs: [meti-trade-secret, ppc-report-scope]
        gauges: { damage: -15, trust: 10, stamina: -15 }
        setFlags: { classified: true }
        items:
          - { id: p02-c-content, points: 8, axis: content, refs: [meti-trade-secret] }
          - { id: p02-c-order, points: 8, axis: order, refs: [no10-ppc-genai] }
          - { id: p02-c-record, points: 8, axis: record, refs: [jpcert-handling] }
      - id: p02-delete
        text: { ja: 'ログは確認したら消す。残しておくと、あとで不利になる。', en: '' }
        minutes: 60
        category: fatal
        points: -250
        refs: [jpcert-handling]
        gauges: { flame: 15, trust: -20, damage: 10 }
        setFlags: { deletedLogs: true }
        delayed:
          - { afterPhases: 2, points: -100, gauges: { flame: 20, trust: -15 }, reason: { ja: 'ログを消したことが調査で分かり、隠蔽と批判された。', en: '' } }
        items:
          - { id: p02-d-record, points: -20, axis: record, refs: [jpcert-handling] }
          - { id: p02-d-content, points: -15, axis: content, refs: [meti-trade-secret] }
          - { id: p02-d-wording, points: -10, axis: wording, refs: [meti-disclosure-guidance] }

