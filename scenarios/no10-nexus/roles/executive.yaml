          - { id: p03-c-wording, points: 8, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: p03-c-order, points: 8, axis: order, refs: [no10-ai-guideline] }
      - id: p03-hunt
        text: { ja: '誰が一番多く入力したかを詰める。内部告発者を探す。', en: '' }
