            points: -40
            gauges:
              damage: 15
            reason:
              ja: 確認が遅れた間に、同じ種類の入力が別の部署でも続いていた。
              en: ""
        items:
          - id: p01-a-time
            points: -10
            axis: time
            refs:
              - jpcert-handling
          - id: p01-a-order
            points: -8
            axis: order
            refs:
              - cissp-cbk-secops
          - id: p01-a-care
            points: -5
            axis: care
            refs:
              - meti-csm-guideline
        explain:
          ja: 誤検知という前提を自分で決めてしまい、保全の機会も初動の記録も失う。同種の入力が続いても気づけない。
          en: ""
      - id: p01-check
        text:
          ja: 管理画面の入力履歴を画面ごと保存し、入力した人が誰かを確かめる。
          en: ""
        minutes: 60
        category: maintain
        points: 20
        refs:
          - jpcert-handling
          - no10-ai-guideline
        gauges:
          trust: 5
          stamina: -5
        items:
          - id: p01-b-record
            points: 5
            axis: record
            refs:
              - jpcert-handling
          - id: p01-b-time
            points: 5
            axis: time
            refs:
              - jpcert-handling
        explain:
          ja: 履歴の保存は正しいが、範囲の調査と社内外への共有が遅れる。証拠は残るが初動が半歩遅い。
          en: ""
      - id: p01-delete
        text:
          ja: 確認が済んだら履歴は消す。残すと後で説明が面倒になるからだ。
          en: ""
        minutes: 30
        category: fatal
        points: -250
        refs:
          - jpcert-handling
        gauges:
          flame: 15
          trust: -20
          damage: 10
        setFlags:
          deletedLogs: true
        delayed:
          - afterPhases: 2
            points: -100
            gauges:
              flame: 20
              trust: -15
            reason:
              ja: 履歴を消したことが調査で分かり、隠蔽と批判された。
              en: ""
        items:
          - id: p01-d-record
            points: -20
            axis: record
            refs:
              - jpcert-handling
          - id: p01-d-content
            points: -15
            axis: content
            refs:
              - meti-trade-secret
          - id: p01-d-wording
            points: -10
            axis: wording
            refs:
              - meti-disclosure-guidance
