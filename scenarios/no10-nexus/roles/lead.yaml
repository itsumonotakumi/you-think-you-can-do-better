      en: ""
    voices:
      - v01-boss
      - v01-field
      - v01-ok
    choices:
      - id: p01-preserve
        text:
          ja: 履歴を保全し、範囲の調査と経営・法務・広報への共有を同時に始める。
          en: ""
        minutes: 90
        category: recover
        points: 100
        refs:
          - jpcert-handling
          - meti-trade-secret
        gauges:
          flame: -5
          damage: -10
          trust: 10
          stamina: -10
        setFlags:
          evidenceKept: true
          commandStarted: true
        items:
          - id: p01-c-time
            points: 8
            axis: time
            refs:
              - jpcert-handling
          - id: p01-c-record
            points: 8
            axis: record
            refs:
              - meti-trade-secret
          - id: p01-c-order
            points: 8
            axis: order
            refs:
              - cissp-cbk-secops
          - id: p01-c-care
            points: 5
            axis: care
            refs:
