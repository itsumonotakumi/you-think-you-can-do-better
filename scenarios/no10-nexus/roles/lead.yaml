          en: ""
      - id: p01-later
        text:
          ja: 誤検知の可能性が高いと見て、現場には伝えず明日の定例会議で扱う。
          en: ""
        minutes: 45
        category: hurt
        points: -120
        refs:
          - jpcert-handling
        gauges:
          flame: 10
          trust: -5
          damage: 10
        coward: true
        setFlags:
          delayedTriage: true
        delayed:
