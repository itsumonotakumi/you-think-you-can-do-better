            points: 8
            axis: content
            refs:
              - meti-trade-secret
          - id: p02-c-order
            points: 8
            axis: order
            refs:
              - no10-ppc-genai
          - id: p02-c-record
            points: 8
            axis: record
            refs:
              - jpcert-handling
        explain:
          ja: 三区分に分けて外部と法務の目を入れており、範囲の説明と優先順位づけの両方に効く。以後の判断の土台になる。
          en: ""
      - id: p02-all
        text:
          ja: 全件を抽出して機密区分と照合し、該当する入力を洗い出して整理する。
          en: ""
        minutes: 150
        category: maintain
        points: 20
        refs:
          - meti-trade-secret
          - jpcert-handling
        gauges:
          damage: -10
          stamina: -10
        items:
          - id: p02-b-content
            points: 8
            axis: content
            refs:
              - meti-trade-secret
          - id: p02-b-record
            points: 5
            axis: record
            refs:
              - jpcert-handling
        explain:
          ja: 全件を見る方向は正しいが、区分と評価の基準がなく、重さの切り分けまで届かない。評価の基準づくりが次の課題になる。
          en: ""
      - id: p02-hide
        text:
          ja: 目立つ数件だけを上司に報告し、入力した本人には口止めをしておく。
          en: ""
        minutes: 60
        category: hurt
        points: -80
        refs:
          - meti-trade-secret
        gauges:
          flame: 5
          trust: -5
        items:
          - id: p02-d-care
            points: -10
            axis: care
            refs:
              - meti-csm-guideline
          - id: p02-d-wording
            points: -8
            axis: wording
            refs:
              - meti-disclosure-guidance
        explain:
          ja: 報告の範囲を狭め、本人に口止めしている。後で広がったときに説明が崩れる。本人が相談する道も閉ざされる。
          en: ""
    lesson:
      ja: 範囲は印象ではなく区分で決める。全件を抽出し、個人情報・顧客情報・ソースコードの三つに分けて評価を依頼すると、どこまで話すかと何から直すかを同時に決められる。目立つ数件で終えると、後から範囲の訂正が必要になる。
      en: ""
