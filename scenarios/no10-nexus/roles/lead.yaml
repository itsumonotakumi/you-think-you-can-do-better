          en: ""
      - id: p20-review
        text:
          ja: 総括を社内に共有し、再発防止の進捗を確認して終える形にする。
          en: ""
        minutes: 120
        category: maintain
        points: 20
        refs:
          - meti-csm-guideline
        gauges:
          trust: 5
          stamina: -10
        items:
          - id: p20-c-record
            points: 8
            axis: record
            refs:
              - cissp-cbk-secops
          - id: p20-c-content
            points: 5
            axis: content
            refs:
              - meti-csm-guideline
        explain:
          ja: 社内に共有して進捗を見る形は堅実。外に出す情報が限定され、業界には届かない。外に出す情報が限られる。
          en: ""
      - id: p20-grow
        text:
          ja: 教訓を匿名化して業界に無償で共有し、入力制限の設計も公開する。
          en: ""
        minutes: 240
        category: increase
        points: 300
        fatalAlternate: 50
        refs:
          - meti-disclosure-guidance
          - no10-ai-guideline
        gauges:
          flame: -15
          trust: 20
          stamina: -15
        setFlags:
          industryShare: true
          lessonsShared: true
        items:
          - id: p20-d-content
            points: 8
            axis: content
            refs:
              - no10-ai-guideline
          - id: p20-d-record
            points: 8
            axis: record
            refs:
              - cissp-cbk-secops
          - id: p20-d-care
            points: 5
            axis: care
            refs:
              - meti-disclosure-guidance
        explain:
          ja: 匿名化して無償で共有し、設計まで公開している。自社の信用と業界の底上げを両立する。業界全体の底上げにつながる。
          en: ""
    lesson:
      ja: 総括は、自社のためだけでなく次の誰かのために出す。技術面の教訓を匿名化して無償で共有し、入力制限の設計まで公開すると、信用と業界の底上げが同時に進む。教訓を商材にすると、被害を受けた顧客の視線とずれる。
      en: ""
drafts:
  tech-factsheet:
    title:
      ja: 技術ファクトシート
      en: ""
    slots:
      - id: confirmed
        label:
          ja: 確認できた事実
          en: ""
        options:
          - id: tf-c-split
            text:
              ja: 入力された時期と検知の日時を分けて書く
              en: ""
            points: 5
            axis: content
            refs:
              - ppc-report-prelim
            explain:
              ja: 入力時期と検知日時を分けると、遅れの所在を正確に示せる。混ぜると検知の遅れが見えなくなる。
              en: ""
          - id: tf-c-merge
            text:
              ja: 入力と検知を一つの時点としてまとめて書く
              en: ""
            points: -8
            axis: wording
            refs:
              - jpcert-handling
            explain:
              ja: 入力と検知をまとめると、いつ気づいたかを曖昧にしてしまう。初動の評価を下げる書き方になる。
              en: ""
      - id: uncertain
        label:
          ja: 不確実な点の書き方
          en: ""
        options:
          - id: tf-u-assert
            text:
              ja: すべて確認したと断定して書く
              en: ""
            points: -15
            axis: wording
            refs:
              - meti-disclosure-guidance
            explain:
              ja: すべて確認したと断定すると、後で覆ったときに訂正が必要になる。信頼を大きく損なう。
              en: ""
          - id: tf-u-split
            text:
              ja: 「確認」と「可能性」を分けて書く
              en: ""
            points: 10
            axis: wording
            refs:
              - meti-disclosure-guidance
            explain:
              ja: 確認できたことと可能性を分けており、後で数字が動いても説明を保てる。読み手も事実と見込みを区別できる。
              en: ""
          - id: tf-u-omit
            text:
              ja: 不確実な点には触れずに書く
              en: ""
            points: -10
            axis: wording
            refs:
              - ppc-report-prelim
            explain:
              ja: 不確実な点を省くと、読み手は確定した事実だけを受け取る。後から齟齬が出やすい。範囲の説明が崩れる。
              en: ""
      - id: range
        label:
          ja: 対象範囲
          en: ""
        options:
          - id: tf-s-all
            text:
              ja: ソースコード、会議録、顧客の条件表を書く
              en: ""
            points: 10
            axis: content
            refs:
              - meti-trade-secret
            explain:
              ja: 三種類をすべて並べており、対象の取りこぼしを防げる。顧客との認識合わせにも使える。
              en: ""
          - id: tf-s-code
            text:
              ja: ソースコードだけを範囲として書く
              en: ""
            points: -20
            axis: content
            refs:
              - meti-trade-secret
            delayed:
              afterPhases: 1
              points: -20
              reason:
                ja: 対象の訂正が必要になった。
                en: ""
            explain:
              ja: ソースコードに絞ると、顧客の条件表が抜ける。後から対象の訂正が必要になる。顧客との認識合わせが乱れる。
              en: ""
      - id: items
        label:
          ja: 入力された項目の列挙
          en: ""
        options:
          - id: tf-i-vague
            text:
              ja: 「一部の情報」とぼかして書く
              en: ""
            points: -10
            axis: content
            refs:
              - ppc-report-prelim
            explain:
              ja: 一部の情報とぼかすと、範囲が伝わらず、後から追加の説明を求められる。顧客の確認も進まない。
              en: ""
          - id: tf-i-list
            text:
              ja: 入力された項目を具体的に列挙する
              en: ""
            points: 10
            axis: content
            refs:
              - ppc-report-prelim
            explain:
              ja: 項目を具体的に並べると、顧客は影響の有無を自分で判断できる。問い合わせの一次対応も速くなる。
              en: ""
      - id: cause
        label:
          ja: 原因の書き方
          en: ""
        options:
          - id: tf-x-mech
            text:
              ja: 本人の意図と止められなかった仕組みを書く
              en: ""
            points: 8
            axis: content
            refs:
              - no10-ai-guideline
            explain:
              ja: 本人の意図と止められなかった仕組みを並べると、再発防止の議論が具体になり、対策も選びやすい。
              en: ""
          - id: tf-x-person
            text:
              ja: 「社員の不注意」として原因を書く
              en: ""
            points: -15
            axis: wording
            refs:
              - meti-disclosure-guidance
            explain:
              ja: 社員の不注意と書くと、仕組みの穴が見えなくなる。本人への説明も通らない。同じ入力が再び起きる。
              en: ""
      - id: vendor
        label:
          ja: AI事業者の扱い
          en: ""
        options:
          - id: tf-a-none
            text:
              ja: AI事業者の扱いについては触れずに書く
              en: ""
            points: -10
            axis: content
            refs:
              - no10-ai-guideline
            explain:
              ja: 事業者の扱いに触れないと、学習利用の不安に答えられず、説明が不足したままになる。
              en: ""
          - id: tf-a-status
            text:
              ja: 学習に使わない設定と削除依頼の状況を書く
              en: ""
            points: 10
            axis: record
            refs:
              - no10-ai-guideline
            explain:
              ja: 設定と削除依頼の状況を書くと、事業者側の対応を後から検証できる。学習利用の不安にも答えられる。
              en: ""
      - id: evidence
        label:
          ja: 証拠保全の記載
          en: ""
        options:
          - id: tf-e-hash
            text:
              ja: 取得した履歴のハッシュ値と保管場所を書く
              en: ""
            points: 10
            axis: record
            refs:
              - cissp-cbk-secops
            explain:
              ja: ハッシュ値と保管場所があれば、記録が改変されていないことを後から示せる。保管の状況も説明できる。
              en: ""
          - id: tf-e-none
            text:
              ja: 証拠の保全にも保管場所にも触れない
              en: ""
            points: -8
            axis: record
            refs:
              - jpcert-handling
            explain:
              ja: 証拠保全に触れないと、記録の信頼性を説明できない。保管の状況も不明なままになる。
              en: ""
      - id: gap
        label:
          ja: ログの欠損
          en: ""
        options:
          - id: tf-g-hide
            text:
              ja: 欠損した期間には触れずに書く
              en: ""
            points: -15
            axis: record
            refs:
              - jpcert-handling
            explain:
              ja: 欠損を伏せると、後から見つかったときに隠したと受け取られる。隠したと見られても仕方ない。
              en: ""
          - id: tf-g-gap
            text:
              ja: 欠損した期間を明記して書く
              en: ""
            points: 8
            axis: content
            refs:
              - nist-sp800-61r3
            explain:
              ja: 欠損期間を明記すると、推測と事実の境目が読み手に伝わり、余計な憶測を招かない。説明の前提も整う。
              en: ""
      - id: persons
        label:
          ja: 本人への通知
          en: ""
        options:
          - id: tf-p-plan
            text:
              ja: 通知の対象と方法、問い合わせ先を書く
              en: ""
            points: 10
            axis: care
            refs:
              - ppc-notify-person
            explain:
              ja: 対象と方法と窓口を書くと、本人が次の行動を取れ、通知が形だけにならない。実効性が伝わる。
              en: ""
          - id: tf-p-none
            text:
              ja: 通知の対象や方法には触れずに書く
              en: ""
            points: -12
            axis: care
            refs:
              - ppc-notify-person
            explain:
              ja: 通知に触れないと、対象者が動けないまま不安だけが残る。説明の空白も埋まらないままだ。
              en: ""
      - id: decision
        label:
          ja: 経営への決裁依頼
          en: ""
        options:
          - id: tf-d-none
            text:
              ja: 決裁の依頼を書かずに本文をまとめる
              en: ""
            points: -8
            axis: order
            refs:
              - meti-csm-guideline
            explain:
              ja: 決裁の依頼がないと上申は報告で終わり、判断が現場に戻ってしまう。決裁の遅れも生む。
              en: ""
          - id: tf-d-ask
            text:
              ja: 止める範囲と公表の時刻を決めてほしいと書く
              en: ""
            points: 8
            axis: order
            refs:
              - meti-csm-guideline
            explain:
              ja: 止める範囲と公表の時刻を求めると、経営はすぐ判断でき、上申が決裁につながる。期限も明確になる。
              en: ""
      - id: contact
        label:
          ja: 技術窓口
          en: ""
        options:
          - id: tf-w-number
            text:
              ja: 窓口の直通番号と受付時間を書く
              en: ""
            points: 5
            axis: care
            refs:
              - meti-csm-guideline
            explain:
              ja: 直通番号と受付時間があると、問い合わせが窓口に届き、窓口の負担も読める。たらい回しも減る。
              en: ""
          - id: tf-w-main
            text:
              ja: 代表番号だけを書いて終える
              en: ""
            points: -5
            axis: care
            refs:
              - meti-csm-guideline
            explain:
              ja: 代表番号だけだと、問い合わせが迷子になり、一次対応が遅れやすい。取り次ぎの負担も増える。
              en: ""
      - id: record
        label:
          ja: 版の管理
          en: ""
        options:
          - id: tf-r-none
            text:
              ja: 版を管理せず、以後の変更も記録しない
              en: ""
            points: -8
            axis: record
            refs:
              - jpcert-handling
            explain:
              ja: 版を管理しないと古い版が独り歩きし、訂正の連絡も届かないままになる。読む側の混乱が続く。
              en: ""
          - id: tf-r-version
            text:
              ja: 版番号と確定時刻を書き、以後の変更も記録する
              en: ""
            points: 8
            axis: record
            refs:
              - jpcert-handling
            explain:
              ja: 版と確定時刻を残すと、どの版を誰に渡したかを後からたどれる。後から食い違いを防げる。
              en: ""
  recovery-plan:
    title:
      ja: 復旧計画
      en: ""
    slots:
      - id: clean
        label:
          ja: 入力経路
          en: ""
        options:
          - id: rp-c-gateway
            text:
              ja: 外部AIへの通信を許可リスト方式にし、管理外を遮断する
              en: ""
            points: 10
            axis: content
            refs:
              - no10-ai-guideline
            explain:
              ja: 許可リストで管理外を遮断すると、入力の入口を技術で絞れる。例外は申請で扱える。入口を絞る効果が大きい。
              en: ""
          - id: rp-c-open
            text:
              ja: 通信経路は変えないまま、これまでどおり使わせる
              en: ""
            points: -15
            axis: content
            refs:
              - no10-ai-guideline
            explain:
              ja: 通信経路を変えないと、同じ入口が残る。次の入力も同じ経路で起きる。範囲も広がりやすい。
              en: ""
      - id: gate
        label:
          ja: 入力制限の強制
          en: ""
        options:
          - id: rp-g-rule
            text:
              ja: ルールを周知するだけにとどめる
              en: ""
            points: -12
            axis: content
            refs:
              - no10-ai-guideline
            explain:
              ja: 周知だけでは守るかどうかが本人次第になる。運用のばらつきも残る。例外の扱いも曖昧になる。
              en: ""
          - id: rp-g-tech
            text:
              ja: 機密区分に応じた制限を技術で強制する
              en: ""
            points: 10
            axis: content
            refs:
              - no10-ai-guideline
            explain:
              ja: 機密区分に応じた制限を技術で強制すると、本人の判断に頼らずに止められる。抜け道を減らせる。
              en: ""
      - id: monitor
        label:
          ja: 監視
          en: ""
        options:
          - id: rp-m-period
            text:
              ja: 強化監視の期間と基準を決める
              en: ""
            points: 8
            axis: order
            refs:
              - nist-sp800-61r3
            explain:
              ja: 期間と基準を決めると、いつ通常に戻すかを後から説明できる。判断の理由も残せる。監視を弱める時期も決まる。
              en: ""
          - id: rp-m-normal
            text:
              ja: 通常の監視に戻して様子を見る
              en: ""
            points: -10
            axis: content
            refs:
              - nist-sp800-61r3
            explain:
              ja: 通常監視に戻すと、再発の兆候を取り逃がし、判断の根拠も残らない。戻す時期の説明もできない。
              en: ""
      - id: sequence
        label:
          ja: 再開の順番
          en: ""
        options:
          - id: rp-s-all
            text:
              ja: 確認を待たずに全社で一斉に戻す
              en: ""
            points: -10
            axis: order
            refs:
              - nist-sp800-61r3
            explain:
              ja: 一斉に戻すと、不具合が出たときに原因の範囲を絞れない。切り分けができなくなる。顧客への説明も荒れる。
              en: ""
          - id: rp-s-step
            text:
              ja: 設計部、営業部、全体の順に戻す
              en: ""
            points: 8
            axis: order
            refs:
              - nist-sp800-61r3
            explain:
              ja: 影響の大きい部門から順に戻すと、問題が出ても切り分けやすい。顧客への説明もしやすい。
              en: ""
      - id: creds
        label:
          ja: アカウント
          en: ""
        options:
          - id: rp-k-personal
            text:
              ja: 共有アカウントを個人に切り替え、操作者を記録する
              en: ""
            points: 10
            axis: order
            refs:
              - cissp-cbk-secops
            explain:
              ja: 個人アカウントにすると、誰が何を入力したかを記録できる。原因の追跡が可能になる。
              en: ""
          - id: rp-k-shared
            text:
              ja: 共有アカウントのまま運用し、記録は取らない
              en: ""
            points: -10
            axis: order
            refs:
              - cissp-cbk-secops
            explain:
              ja: 共有のままだと操作者が特定できず、同じ状態が再び起きても原因を追えない。記録も残らない。
              en: ""
      - id: rollback
        label:
          ja: 切り戻しの条件
          en: ""
        options:
          - id: rp-r-none
            text:
              ja: 止める条件を決めずに運用を続ける
              en: ""
            points: -8
            axis: content
            refs:
              - cissp-cbk-secops
            explain:
              ja: 条件がないと、止める判断がその場の空気に左右され、切り戻しが遅れる。基準も説明できない。
              en: ""
          - id: rp-r-rule
            text:
              ja: 異常を検知したら自動で止める条件を書く
              en: ""
            points: 8
            axis: content
            refs:
              - cissp-cbk-secops
            explain:
              ja: 止める条件を先に決めると、異常時に迷わず切り戻せる。被害を小さく止められる。判断が人に依存しない。
              en: ""
      - id: verify
        label:
          ja: 外部の検証
          en: ""
        options:
          - id: rp-v-third
            text:
              ja: 第三者の検証を経てから戻す
              en: ""
            points: 8
            axis: record
            refs:
              - cissp-cbk-secops
            explain:
              ja: 第三者の目を入れると、自社で見落とした点を補える。対外的な説明にも使える。監査にも耐えられる。
              en: ""
          - id: rp-v-self
            text:
              ja: 自社の判断だけで再開を決める
              en: ""
            points: -8
            axis: record
            refs:
              - cissp-cbk-secops
            explain:
              ja: 自社だけで判断すると、見落としが残ったまま再開し、対外的な説明も弱くなる。監査にも耐えない。
              en: ""
      - id: comms
        label:
          ja: 顧客への説明
          en: ""
        options:
          - id: rp-m-safe
            text:
              ja: 「安全です」とだけ伝えて終える
              en: ""
            points: -10
            axis: care
            refs:
              - meti-disclosure-guidance
            explain:
              ja: 安全ですとだけ書くと、根拠が伝わらず、後から説明を求められる。顧客の納得も得られない。
              en: ""
          - id: rp-m-explain
            text:
              ja: 何を確認したかを具体的に書く
              en: ""
            points: 8
            axis: care
            refs:
              - meti-disclosure-guidance
            explain:
              ja: 何を確認したかを具体的に書くと、顧客は判断の根拠を受け取れる。説明の重複も避けられる。
              en: ""
voices:
  - id: v01-boss
    media: boss
    misleading: true
    type: boss-pressure
    text:
      ja: 誤検知かもしれない。今夜は何も動かさず、明日の会議で報告しろ。
      en: ""
    trigger:
      at: point
  - id: v01-field
    media: chat
    misleading: true
    type: well-meant-field
    text:
      ja: 現場は便利に使っています。調査で止めると、設計が止まります。
      en: ""
    trigger:
      at: point
  - id: v01-ok
    media: chat
    misleading: false
    text:
      ja: 兼任メンバー「管理画面の履歴は、まだ消していません。保全できます」。
      en: ""
    trigger:
      at: point
  - id: v01-after
    media: sns
    misleading: false
    text:
      ja: 履歴を保全したところで、何が変わるんだ。
      en: ""
    trigger:
      at: after
      choice: p01-preserve
  - id: v02-law
    media: board
    misleading: true
    type: fake-expert
    text:
      ja: サンプル調査で統計的に十分です。全件は過剰です。
