      minutes: 690
    phase: detect
    sound:
      se:
        - notify_chat
    text:
      ja: 午前11時30分。管理画面を集計すると、五週間で412人が使い、入力は数千件あった。設計部、営業部、製造本部。どこまで見るかで、その後のすべてが変わる。
      en: ""
    voices:
      - v02-law
      - v02-field
      - v02-ok
    popular:
      choiceId: p02-sample
      percent: 62
    choices:
      - id: p02-sample
        text:
          ja: 目立つ数件だけを確認し、全体の傾向は変わらないと判断して調査を終える。
          en: ""
        minutes: 90
        category: hurt
        points: -100
        refs:
          - meti-trade-secret
        gauges:
          damage: 15
          trust: -10
        items:
          - id: p02-a-content
            points: -10
            axis: content
            refs:
              - meti-trade-secret
          - id: p02-a-record
            points: -8
            axis: record
            refs:
              - jpcert-handling
          - id: p02-a-time
            points: -8
            axis: time
            refs:
              - jpcert-handling
        explain:
          ja: 一部だけを見て全体を判断しており、範囲の説明ができない。顧客情報の見落としが残る。
          en: ""
      - id: p02-classify
        text:
          ja: 全件を個人情報と顧客情報とソースコードに分類し、外部と法務に評価を頼む。
          en: ""
        minutes: 180
        category: recover
        points: 100
        refs:
          - meti-trade-secret
          - ppc-report-scope
        gauges:
          damage: -15
          trust: 10
          stamina: -15
        setFlags:
          classified: true
        items:
