      ja: 漏れたときの重さが違う情報を、同じ土俵で扱わない。種類ごとに基準をそろえて分類し、顧客の条件表が入った入力を特定して影響を切り分ける。ソースコードだけを見ていると、契約上の説明責任から外れてしまう。
