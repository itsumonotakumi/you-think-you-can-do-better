# No.10 ネクサス半導体 / セキュリティ部門長（情報セキュリティ責任者）ロール
# 判断ポイント20、細目は choices[].items と drafts の合計で80以上。
# 視点: 専任のセキュリティ部署がない会社で、情報システム部と総務を兼任で束ねる執行役員。
#       技術の言葉を経営の言葉に訳し、証拠を守りながら、安全に使える環境を設計するのが仕事。
estimateMinutes: 45
intro: { ja: 'あなたはネクサス半導体の執行役員情報セキュリティ責任者。専任のセキュリティ部署はなく、情報システム部の五名と総務の二名を兼任で束ねている。生成AIの解禁から五週間。最初に気づいたのは、あなたのチームだった。技術の言葉を経営の言葉に訳し、証拠を守りながら、明日の使い方を決める。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-ppc-prelim
    ref: ppc-report-prelim
    label: { ja: '個人情報保護委員会への速報', en: '' }
    points: -150
    doneFlag: ppcPrelimFiled
  - id: dl-ppc-final
    ref: ppc-report-final
    label: { ja: '個人情報保護委員会への確報', en: '' }
    points: -100
    doneFlag: ppcFinalFiled
events:
  - id: ev-night
    at: { day: 1, minutes: 120 }
    voices: [v-ev-night]
    gauges: { stamina: -5 }
    caption: { ja: '兼任のメンバーから「このまま朝まで起きています」と連絡が入る。', en: '' }
  - id: ev-news
    at: { day: 2, minutes: 420 }
    voices: [v-ev-news]
    gauges: { flame: 5 }
    sound: { se: [notify_news] }
    caption: { ja: '朝のニュースが「製造装置メーカーで生成AIへの機密入力」と報じた。', en: '' }
  - id: ev-silence
    at: { day: 8, minutes: 600 }
    voices: [v-ev-silence]
    gauges: { trust: -5 }
    caption: { ja: '問い合わせ窓口の電話が、三日続けてつながらないままになっている。', en: '' }
points:
  - id: p01-log
    at: { day: 0, minutes: 570 }
    phase: detect
    sound: { se: [notify_chat] }
    text: { ja: '午前9時30分。兼任のメンバーから連絡が入る。「社内で使っている生成AIサービスの管理画面に、装置制御のソースコードらしい入力が残っています。誰が入れたかは、まだ分かりません」。解禁から五週間。まず何を守るか。', en: '' }
    voices: [v01-boss, v01-field, v01-ok]
    choices:
      - id: p01-later
        text: { ja: '誤検知の可能性が高いとして、現場には知らせず、明日の定例会議で扱う。', en: '' }
        minutes: 45
        category: hurt
        points: -120
        refs: [jpcert-handling]
        gauges: { flame: 10, trust: -5, damage: 10 }
        coward: true
        setFlags: { delayedTriage: true }
        delayed:
          - { afterPhases: 1, points: -40, gauges: { damage: 15 }, reason: { ja: '確認が遅れた間に、同じ種類の入力が別の部署でも続いていた。', en: '' } }
        items:
          - { id: p01-a-time, points: -10, axis: time, refs: [jpcert-handling] }
          - { id: p01-a-order, points: -8, axis: order, refs: [cissp-cbk-secops] }
          - { id: p01-a-care, points: -5, axis: care, refs: [meti-csm-guideline] }
      - id: p01-check
        text: { ja: '管理画面の入力履歴を画面ごと保存し、誰が入れたかを確認する。', en: '' }
        minutes: 60
        category: maintain
        points: 20
        refs: [jpcert-handling, no10-ai-guideline]
        gauges: { trust: 5, stamina: -5 }
        items:
          - { id: p01-b-record, points: 5, axis: record, refs: [jpcert-handling] }
          - { id: p01-b-time, points: 5, axis: time, refs: [jpcert-handling] }
      - id: p01-preserve
        text: { ja: '入力履歴を保全し、対象者と範囲の調査をすぐ始める。経営への第一報と、法務・広報への共有も同時に走らせる。', en: '' }
        minutes: 90
        category: recover
        points: 100
        refs: [jpcert-handling, meti-trade-secret]
        gauges: { flame: -5, damage: -10, trust: 10, stamina: -10 }
        setFlags: { evidenceKept: true, commandStarted: true }
        items:
          - { id: p01-c-time, points: 8, axis: time, refs: [jpcert-handling] }
          - { id: p01-c-record, points: 8, axis: record, refs: [meti-trade-secret] }
          - { id: p01-c-order, points: 8, axis: order, refs: [cissp-cbk-secops] }
          - { id: p01-c-care, points: 5, axis: care, refs: [meti-csm-guideline] }
      - id: p01-delete
        text: { ja: '履歴は確認したら消す。残しておくと、あとで説明が面倒になる。', en: '' }
        minutes: 30
        category: fatal
        points: -250
        refs: [jpcert-handling]
        gauges: { flame: 15, trust: -20, damage: 10 }
        setFlags: { deletedLogs: true }
        delayed:
          - { afterPhases: 2, points: -100, gauges: { flame: 20, trust: -15 }, reason: { ja: '履歴を消したことが調査で分かり、隠蔽と批判された。', en: '' } }
        items:
          - { id: p01-d-record, points: -20, axis: record, refs: [jpcert-handling] }
          - { id: p01-d-content, points: -15, axis: content, refs: [meti-trade-secret] }
          - { id: p01-d-wording, points: -10, axis: wording, refs: [meti-disclosure-guidance] }

  - id: p02-scope
    at: { day: 0, minutes: 690 }
    phase: detect
    sound: { se: [notify_chat] }
    text: { ja: '午前11時30分。管理画面を集計すると、五週間で412人が使い、入力は数千件あった。設計部、営業部、製造本部。どこまで見るかで、その後のすべてが変わる。', en: '' }
    voices: [v02-law, v02-field, v02-ok]
    popular: { choiceId: p02-sample, percent: 62 }
    choices:
      - id: p02-sample
        text: { ja: '目立つ数件だけ確認して、調査を終える。', en: '' }
        minutes: 90
        category: hurt
        points: -100
        refs: [meti-trade-secret]
        gauges: { damage: 15, trust: -10 }
        items:
          - { id: p02-a-content, points: -10, axis: content, refs: [meti-trade-secret] }
          - { id: p02-a-record, points: -8, axis: record, refs: [jpcert-handling] }
          - { id: p02-a-time, points: -8, axis: time, refs: [jpcert-handling] }
      - id: p02-all
        text: { ja: '全件を抽出し、機密区分と照合する。', en: '' }
        minutes: 150
        category: maintain
        points: 20
        refs: [meti-trade-secret, jpcert-handling]
        gauges: { damage: -10, stamina: -10 }
        items:
          - { id: p02-b-content, points: 8, axis: content, refs: [meti-trade-secret] }
          - { id: p02-b-record, points: 5, axis: record, refs: [jpcert-handling] }
      - id: p02-classify
        text: { ja: '全件を個人情報・顧客情報・ソースコードの三区分で分類し、外部の調査会社と法務に評価を依頼する。', en: '' }
        minutes: 180
        category: recover
        points: 100
        refs: [meti-trade-secret, ppc-report-scope]
        gauges: { damage: -15, trust: 10, stamina: -15 }
        setFlags: { classified: true }
        items:
          - { id: p02-c-content, points: 8, axis: content, refs: [meti-trade-secret] }
          - { id: p02-c-order, points: 8, axis: order, refs: [no10-ppc-genai] }
          - { id: p02-c-record, points: 8, axis: record, refs: [jpcert-handling] }
      - id: p02-hide
        text: { ja: '目立つ数件だけを上司に報告し、入力した本人には口止めする。', en: '' }
        minutes: 60
        category: hurt
        points: -80
        refs: [meti-trade-secret]
        gauges: { flame: 5, trust: -5 }
        items:
          - { id: p02-d-care, points: -10, axis: care, refs: [meti-csm-guideline] }
          - { id: p02-d-wording, points: -8, axis: wording, refs: [meti-disclosure-guidance] }

  - id: p03-kinds
    at: { day: 0, minutes: 870 }
    phase: contain
    sound: { se: [notify_chat] }
    text: { ja: '午後2時30分。入力の中身が分かってきた。装置の制御パラメータ、大口顧客の製造条件表、役員会の議事録。三つは、漏れたときの重さが違う。入力したのは、先月の業務改善表彰を受けた主任だった。', en: '' }
    voices: [v03-boss, v03-expert, v03-ok]
    notable:
      - { id: note-customer-process, text: { ja: '大口顧客A社の製造プロセスの条件表が、入力に含まれていた。NDAの対象。', en: '' } }
      - { id: note-employee-intent, text: { ja: '入力したのは業務改善で表彰された主任。悪意はなく、上司の名前もログに多い。', en: '' } }
    choices:
      - id: p03-code-only
        text: { ja: 'ソースコードだけを対象にし、顧客の条件表はAIに入れただけなので対象外とする。', en: '' }
        minutes: 120
        category: hurt
        points: -120
        refs: [meti-trade-secret]
        gauges: { flame: 10, trust: -10, damage: 10 }
        setFlags: { downplayedScope: true, downplayed: true }
        items:
          - { id: p03-a-content, points: -12, axis: content, refs: [meti-trade-secret] }
          - { id: p03-a-wording, points: -10, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: p03-a-care, points: -8, axis: care, refs: [meti-disclosure-guidance] }
      - id: p03-list
        text: { ja: '入力された項目を一覧にして、法務と広報に渡す。', en: '' }
        minutes: 60
        category: maintain
        points: 20
        refs: [meti-trade-secret]
        gauges: { trust: 5, stamina: -5 }
        items:
          - { id: p03-b-content, points: 5, axis: content, refs: [meti-trade-secret] }
          - { id: p03-b-record, points: 5, axis: record, refs: [jpcert-handling] }
      - id: p03-split
        text: { ja: '三つを同じ基準で分類し、顧客の条件表が含まれる入力を特定して、顧客ごとに影響を切り分ける。', en: '' }
        minutes: 120
        category: recover
        points: 100
        refs: [meti-trade-secret, meti-csm-guideline]
        gauges: { damage: -10, trust: 10, stamina: -10 }
        setFlags: { kindsSplit: true, customerScope: true }
        items:
          - { id: p03-c-content, points: 8, axis: content, refs: [meti-trade-secret] }
          - { id: p03-c-order, points: 8, axis: order, refs: [meti-csm-guideline] }
          - { id: p03-c-record, points: 5, axis: record, refs: [jpcert-handling] }
      - id: p03-defer
        text: { ja: '重さの判断は経営に任せ、こちらは事実の整理だけを続ける。', en: '' }
        minutes: 45
        category: hurt
        points: -60
        refs: [meti-csm-guideline]
        gauges: { trust: -5 }
        coward: true
        items:
          - { id: p03-d-order, points: -8, axis: order, refs: [meti-csm-guideline] }
          - { id: p03-d-care, points: -5, axis: care, refs: [meti-csm-guideline] }

  - id: p04-isolate
    at: { day: 0, minutes: 1020 }
    phase: contain
    sound: { se: [notify_chat] }
    text: { ja: '午後5時。入力が多いのは設計部の端末だった。37台。設計を止めれば開発が止まる。端末を隔離するか、様子を見るか。', en: '' }
    voices: [v04-field, v04-coward, v04-ok]
    choices:
      - id: p04-none
        text: { ja: '設計は止められないので、端末はそのまま使わせる。', en: '' }
        minutes: 60
        category: hurt
        points: -120
        refs: [nist-sp800-61r3]
        gauges: { damage: 15, trust: -10 }
        delayed:
          - { afterPhases: 1, points: -60, gauges: { damage: 15 }, reason: { ja: '止めなかった端末から、別の顧客情報が入力され続けた。', en: '' } }
        items:
          - { id: p04-a-content, points: -10, axis: content, refs: [nist-sp800-61r3] }
          - { id: p04-a-order, points: -8, axis: order, refs: [nist-sp800-61r3] }
      - id: p04-all
        text: { ja: '設計部の全端末を一斉に停止し、業務の再開は明日考える。', en: '' }
        minutes: 90
        category: hurt
        points: -60
        refs: [nist-sp800-61r3]
        gauges: { damage: -10, trust: -10, stamina: -5 }
        items:
          - { id: p04-b-order, points: -8, axis: order, refs: [nist-sp800-61r3] }
          - { id: p04-b-care, points: -5, axis: care, refs: [meti-csm-guideline] }
      - id: p04-target
        text: { ja: '入力が確認できた端末だけを隔離し、業務は他の端末で続ける。', en: '' }
        minutes: 120
        category: maintain
        points: 20
        refs: [nist-sp800-61r3, jpcert-handling]
        gauges: { damage: -10, trust: 5, stamina: -10 }
        setFlags: { devicesIsolated: true }
        items:
          - { id: p04-c-order, points: 8, axis: order, refs: [nist-sp800-61r3] }
          - { id: p04-c-record, points: 5, axis: record, refs: [jpcert-handling] }
      - id: p04-target-log
        text: { ja: '該当端末を隔離し、入力の時刻と宛先を端末側の記録からも復元する。設計部には代替の端末と作業手順を用意する。', en: '' }
        minutes: 120
        category: recover
        points: 100
        refs: [nist-sp800-61r3, jpcert-handling]
        gauges: { damage: -10, trust: 10, stamina: -10 }
        setFlags: { devicesIsolated: true, deviceRecordsKept: true }
        items:
          - { id: p04-d-order, points: 8, axis: order, refs: [nist-sp800-61r3] }
          - { id: p04-d-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: p04-d-care, points: 8, axis: care, refs: [meti-csm-guideline] }
          - { id: p04-d-content, points: 5, axis: content, refs: [nist-sp800-61r3] }

  - id: p05-rule
    at: { day: 0, minutes: 1140 }
    phase: contain
    sound: { se: [notify_chat] }
    text: { ja: '午後7時。終業前。明日の朝から、何をAIに入れてよいかを決めなければならない。禁止の紙を配るだけでは、また同じことが起きる。', en: '' }
    voices: [v05-boss, v05-popular, v05-ok]
    choices:
      - id: p05-ban
        text: { ja: '明日から全面禁止。違反は処分すると通達する。', en: '' }
        minutes: 120
        category: hurt
        points: -80
        refs: [no10-ai-guideline]
        gauges: { flame: -5, trust: -10, stamina: -5 }
        setFlags: { fullBan: true }
        delayed:
          - { afterPhases: 2, points: -60, gauges: { damage: 10 }, reason: { ja: '禁止されたことで、私物端末の隠れ利用が増えた。', en: '' } }
        items:
          - { id: p05-a-content, points: -10, axis: content, refs: [no10-ai-guideline] }
          - { id: p05-a-order, points: -5, axis: order, refs: [no10-ipa-genai] }
          - { id: p05-a-care, points: -8, axis: care, refs: [meti-csm-guideline] }
      - id: p05-paper
        text: { ja: '入力してよい情報の一覧を配り、明日の朝に説明会をする。', en: '' }
        minutes: 90
        category: maintain
        points: 20
        refs: [no10-ai-guideline, no10-ipa-genai]
        gauges: { trust: 5, stamina: -5 }
        items:
          - { id: p05-b-content, points: 5, axis: content, refs: [no10-ai-guideline] }
          - { id: p05-b-care, points: 5, axis: care, refs: [no10-ipa-genai] }
      - id: p05-tech
        text: { ja: '入力してよい情報を一覧にし、機密区分に応じた入力制限をゲートウェイで技術的に強制する。例外の申請手続きも用意する。', en: '' }
        minutes: 120
        category: recover
        points: 120
        refs: [no10-ai-guideline, no10-ipa-genai]
        gauges: { flame: -10, damage: -10, trust: 10, stamina: -10 }
        setFlags: { interimRule: true, enforcedDLP: true }
        items:
          - { id: p05-c-content, points: 8, axis: content, refs: [no10-ai-guideline] }
          - { id: p05-c-order, points: 8, axis: order, refs: [no10-ipa-genai] }
          - { id: p05-c-care, points: 8, axis: care, refs: [meti-csm-guideline] }
      - id: p05-nothing
        text: { ja: '現場の判断に任せ、何も配らない。', en: '' }
        minutes: 30
        category: hurt
        points: -100
        refs: [no10-ai-guideline]
        gauges: { damage: 10, trust: -10 }
        coward: true
        items:
          - { id: p05-d-content, points: -10, axis: content, refs: [no10-ai-guideline] }
          - { id: p05-d-order, points: -8, axis: order, refs: [no10-ipa-genai] }

  - id: p06-command
    at: { day: 1, minutes: 540 }
    phase: organize
    sound: { se: [phone_ring] }
    text: { ja: '午前9時。対策会議。集まったのは、情報システム部の五名と総務の二名。全員が兼任で、明日も通常業務がある。誰が指揮し、誰が記録し、誰が外部と話すか。', en: '' }
    voices: [v06-flattery, v06-public, v06-ok]
    choices:
      - id: p06-solo
        text: { ja: '自分が指揮も調査も外部連絡も持つ。そのほうが速い。', en: '' }
        minutes: 60
        category: hurt
        points: -100
        refs: [cissp-cbk-secops]
        gauges: { stamina: -15, trust: -5 }
        items:
          - { id: p06-a-order, points: -10, axis: order, refs: [cissp-cbk-secops] }
          - { id: p06-a-record, points: -8, axis: record, refs: [jpcert-handling] }
      - id: p06-external
        text: { ja: '外部の調査会社に全部任せ、社内は通常業務に戻す。', en: '' }
        minutes: 120
        category: hurt
        points: -60
        refs: [meti-csm-guideline]
        gauges: { trust: -5, stamina: 5 }
        items:
          - { id: p06-b-order, points: -10, axis: order, refs: [meti-csm-guideline] }
          - { id: p06-b-record, points: -8, axis: record, refs: [cissp-cbk-secops] }
      - id: p06-roles
        text: { ja: '指揮、調査、記録、外部連絡を分け、当番を決める。', en: '' }
        minutes: 90
        category: maintain
        points: 20
        refs: [cissp-cbk-secops, jpcert-handling]
        gauges: { stamina: 5, trust: 5 }
        setFlags: { commandStructure: true }
        items:
          - { id: p06-c-order, points: 10, axis: order, refs: [cissp-cbk-secops] }
          - { id: p06-c-record, points: 8, axis: record, refs: [jpcert-handling] }
      - id: p06-roles-deputy
        text: { ja: '役割を分け、指揮の代行と判断の記録を決める。通常業務を止めないよう、上長に応援を依頼する。', en: '' }
        minutes: 150
        category: recover
        points: 120
        refs: [cissp-cbk-secops, meti-csm-guideline]
        gauges: { stamina: 10, trust: 10 }
        setFlags: { commandStructure: true, decisionLog: true }
        items:
          - { id: p06-d-order, points: 10, axis: order, refs: [cissp-cbk-secops] }
          - { id: p06-d-record, points: 10, axis: record, refs: [jpcert-handling] }
          - { id: p06-d-care, points: 8, axis: care, refs: [ipa-sme-guideline] }

  - id: p07-escalate
    at: { day: 1, minutes: 750 }
    phase: organize
    sound: { se: [phone_ring] }
    text: { ja: '午後0時30分。CTOに何を話すか。技術のログをそのまま渡しても、判断はできない。決めてほしいのは、AI利用を止めるか、調査の予算を出すか。', en: '' }
    voices: [v07-boss, v07-expert, v07-ok]
    choices:
      - id: p07-hold
        text: { ja: '影響が出てから上申する。今は調査に集中する。', en: '' }
        minutes: 60
        category: hurt
        points: -120
        refs: [meti-csm-guideline]
        gauges: { flame: 10, trust: -10 }
        coward: true
        setFlags: { lateEscalation: true }
        delayed:
          - { afterPhases: 1, points: -50, gauges: { damage: 10, trust: -10 }, reason: { ja: '経営の決裁が遅れ、利用停止の判断が半日ずれた。', en: '' } }
        items:
          - { id: p07-a-order, points: -10, axis: order, refs: [meti-csm-guideline] }
