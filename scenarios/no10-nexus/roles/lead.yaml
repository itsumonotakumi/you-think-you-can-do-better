# No.10 ネクサス半導体 / セキュリティ部門長（情報セキュリティ責任者）ロール
# 判断ポイント20、細目は choices[].items と drafts の合計で80以上。
# 視点: 専任のセキュリティ部署がない会社で、情報システム部と総務を兼任で束ねる執行役員。
#       技術の言葉を経営の言葉に訳し、証拠を守りながら、安全に使える環境を設計するのが仕事。

estimateMinutes: 45
intro:
  ja: あなたはネクサス半導体の執行役員情報セキュリティ責任者。専任のセキュリティ部署はなく、情報システム部の五名と総務の二名を兼任で束ねている。生成AIの解禁から五週間。最初に気づいたのは、あなたのチームだった。技術の言葉を経営の言葉に訳し、証拠を守りながら、明日の使い方を決める。
  en: ""
pressEnabled: true
cowardVoices:
  "2": v-coward-2
  "3": v-coward-3
  "4": v-coward-4
deadlines:
  - id: dl-ppc-prelim
    ref: ppc-report-prelim
    label:
      ja: 個人情報保護委員会への速報
      en: ""
    points: -150
    doneFlag: ppcPrelimFiled
  - id: dl-ppc-final
    ref: ppc-report-final
    label:
      ja: 個人情報保護委員会への確報
      en: ""
    points: -100
    doneFlag: ppcFinalFiled
events:
  - id: ev-night
    at:
      day: 1
      minutes: 120
    voices:
      - v-ev-night
    gauges:
      stamina: -5
    caption:
      ja: 兼任のメンバーから「このまま朝まで起きています」と連絡が入る。
      en: ""
  - id: ev-news
    at:
      day: 2
      minutes: 420
    voices:
      - v-ev-news
    gauges:
      flame: 5
    sound:
      se:
        - notify_news
    caption:
      ja: 朝のニュースが「製造装置メーカーで生成AIへの機密入力」と報じた。
      en: ""
  - id: ev-silence
    at:
      day: 8
      minutes: 600
    voices:
      - v-ev-silence
    gauges:
      trust: -5
    caption:
      ja: 問い合わせ窓口の電話が、三日続けてつながらないままになっている。
      en: ""
