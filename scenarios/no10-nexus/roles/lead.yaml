          - id: p03-b-record
            points: 5
            axis: record
            refs:
              - jpcert-handling
        explain:
          ja: 一覧にして渡すところまでは良いが、重さの判断を渡すだけで、影響の切り分けが残る。
          en: ""
      - id: p03-split
        text:
          ja: 三つを同じ基準で分類し、顧客の条件表を含む入力を特定して影響を切り分ける。
