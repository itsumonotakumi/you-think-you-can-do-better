          ja: 証拠を自ら失う判断で、後から隠蔽と受け取られる。調査も説明も成り立たなくなる。証拠が残らない。
          en: ""
    lesson:
      ja: 発覚の第一報では、消さず・止めず・一人で抱えないを守る。履歴の保全と経営・法務・広報への共有を同じ日に走らせれば、後から事実が増えても説明の筋を保てる。誤検知と決めつけて先送りすると、同種の入力が続き、隠そうとしたと見られる。
      en: ""
