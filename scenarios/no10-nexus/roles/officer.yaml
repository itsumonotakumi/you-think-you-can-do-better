# No.10 ネクサス半導体 / 役員・グループ会社社長ロール
# プレイヤーは親会社の執行役員を兼ねる子会社ネクサス・デバイスサービス（NDS）の社長。
# 親会社への報告、顧客の工場を止めない業務判断、現場の社員を守る判断を扱う。
# 判断ポイント19、細目は choices[].items と drafts の合計で80以上。

estimateMinutes: 35
intro:
  ja: あなたはネクサス半導体の執行役員で、グループ会社ネクサス・デバイスサービスの社長。装置の据付と保守を担う子会社には、専任のセキュリティ部署がない。親会社の生成AI基盤に、顧客工場の稼働データと会議録が入力されていた。親会社にどこまで報告し、顧客の工場を止めずに、現場の社員をどう守るか。午前11時の電話から、あなたの判断が始まる。
  en: ""
pressEnabled: true
cowardVoices:
  "2": v-coward-2
  "3": v-coward-3
  "4": v-coward-4
deadlines:
  - id: dl-ppc-prelim
    ref: ppc-report-prelim
    label:
      ja: 子会社分の漏えい等報告（速報）
      en: ""
    points: -150
    doneFlag: ppcPrelimFiled
  - id: dl-ppc-final
    ref: ppc-report-final
    label:
      ja: 子会社分の漏えい等報告（確報）
      en: ""
    points: -100
    doneFlag: ppcFinalFiled
