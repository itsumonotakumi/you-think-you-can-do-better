# No.10 ネクサス半導体 / 役員・グループ会社社長ロール
# プレイヤーは親会社の執行役員を兼ねる子会社ネクサス・デバイスサービス（NDS）の社長。
# 親会社への報告、顧客の工場を止めない業務判断、現場の社員を守る判断を扱う。
# 判断ポイント19、細目は choices[].items と drafts の合計で80以上。
estimateMinutes: 35
intro: { ja: 'あなたはネクサス半導体の執行役員で、グループ会社ネクサス・デバイスサービスの社長。装置の据付と保守を担う子会社には、専任のセキュリティ部署がない。親会社の生成AI基盤に、顧客工場の稼働データと会議録が入力されていた。親会社にどこまで報告し、顧客の工場を止めずに、現場の社員をどう守るか。午前11時の電話から、あなたの判断が始まる。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-ppc-prelim
    ref: ppc-report-prelim
    label: { ja: '子会社分の漏えい等報告（速報）', en: '' }
    points: -150
    doneFlag: ppcPrelimFiled
  - id: dl-ppc-final
    ref: ppc-report-final
    label: { ja: '子会社分の漏えい等報告（確報）', en: '' }
    points: -100
    doneFlag: ppcFinalFiled
events:
  - id: ev-field-rumor
    at: { day: 2, minutes: 1140 }
    voices: [v-ev-rumor]
    gauges: { flame: 5 }
    sound: { se: [notify_sns] }
    caption: { ja: '現場のSNSに「NDSが顧客の工場データをAIに流したらしい」と書かれ始めた。', en: '' }
  - id: ev-customer-audit
    at: { day: 5, minutes: 600 }
    voices: [v-ev-audit]
    gauges: { flame: 5 }
    sound: { se: [phone_ring] }
    caption: { ja: '大口顧客から、監査の受け入れを求める連絡が入った。', en: '' }
  - id: ev-parent-board
    at: { day: 9, minutes: 720 }
    voices: [v-ev-board]
    gauges: { flame: 5 }
    caption: { ja: '親会社の臨時取締役会で、子会社の対応が議題になった。', en: '' }
points:
  - id: p01-call
    at: { day: 0, minutes: 660 }
    phase: detect
    sound: { se: [phone_ring] }
    text: { ja: '午前11時。親会社の情報セキュリティ責任者、一ノ瀬から電話が入る。「グループの生成AI基盤の入力履歴に、装置の制御パラメータと顧客工場の稼働ログらしい文字列がある。NDSの現場アカウントが使われた可能性がある」。子会社に専任のセキュリティ部署はない。', en: '' }
    voices: [v01-boss, v01-past, v01-ok]
    popular: { choiceId: p01-wait, percent: 58 }
    notable:
      - { id: note-ai-log, text: { ja: '生成AIの入力履歴に、装置の制御パラメータと顧客工場の稼働ログらしき文字列。NDSの現場アカウントが使われた可能性がある。', en: '' } }
    choices:
      - id: p01-wait
        text: { ja: '親会社の指示を待ち、明日の朝に対応を決める。', en: '' }
        minutes: 90
        category: hurt
        points: -100
        refs: [jpcert-handling]
        gauges: { flame: 5, trust: -5, stamina: 5 }
        coward: true
        setFlags: { delayedCommand: true }
        delayed:
          - { afterPhases: 1, points: -40, gauges: { trust: -10 }, reason: { ja: 'その日のうちに、同じ種類の入力が別の現場でも続いていた。', en: '' } }
        items:
          - { id: p01-a-time, points: -10, axis: time, refs: [jpcert-handling] }
          - { id: p01-a-order, points: -8, axis: order, refs: [meti-csm-guideline] }
          - { id: p01-a-care, points: -5, axis: care, refs: [ipa-sme-guideline] }
      - id: p01-check
        text: { ja: '自社の担当者を集めて状況を確認し、対象アカウントと端末の一覧を親会社に共有する。', en: '' }
        minutes: 60
        category: maintain
        points: 20
        refs: [meti-csm-guideline, jpcert-handling]
        gauges: { flame: -5, trust: 5, stamina: -5 }
        setFlags: { commandStarted: true, evidenceKept: true }
        items:
