        category: recover
        points: 100
        refs: [meti-csm-guideline, ipa-sme-guideline]
        gauges: { flame: -10, damage: -10, trust: 10, stamina: -10 }
        setFlags: { commandStarted: true, evidenceKept: true, fieldContinuity: true }
        items:
          - { id: p01-c-time, points: 5, axis: time, refs: [jpcert-handling] }
          - { id: p01-c-order, points: 8, axis: order, refs: [meti-csm-guideline] }
          - { id: p01-c-content, points: 8, axis: content, refs: [jpcert-handling] }
          - { id: p01-c-care, points: 5, axis: care, refs: [ipa-sme-guideline] }
      - id: p01-delete
        text: { ja: '入力履歴を消すよう現場に指示して、様子を見る。', en: '' }
        minutes: 45
        category: fatal
        points: -250
        refs: [jpcert-handling]
        gauges: { flame: 15, trust: -20, damage: 10 }
        setFlags: { deletedLogs: true }
        delayed:
