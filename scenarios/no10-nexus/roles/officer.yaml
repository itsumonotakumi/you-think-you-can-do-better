        items:
          - { id: p01-d-record, points: -20, axis: record, refs: [jpcert-handling] }
          - { id: p01-d-content, points: -15, axis: content, refs: [meti-trade-secret] }
          - { id: p01-d-wording, points: -10, axis: wording, refs: [meti-disclosure-guidance] }

