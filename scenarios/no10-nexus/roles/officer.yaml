      ja: 最初の電話を受けた日の動きで、その後の説明の土台が決まる。事実の確認と対象の一覧の共有を当日に始め、顧客の窓口と現場の代替手順を同時に整えたい。指示待ちや履歴の削除は、後から隠蔽と受け取られる。
