# No.10 ネクサス半導体 / セキュリティ担当者ロール
# 見えるのは、生成AIの管理画面の入力履歴、端末のログ、現場からのチャット。
# 専任のセキュリティ部署はなく、情報システム部の担当者が兼務している。
# 判断ポイント20、細目は choices[].items と drafts の合計で80以上。
estimateMinutes: 45
intro: { ja: 'あなたはネクサス半導体の情報システム部で、セキュリティを兼務する担当者。専任のSOCはなく、外部の相談窓口と契約している。生成AIの入力履歴に、装置制御のソースコードらしき文字列が見つかった。あなたに見えるのは、ログと現場の声だけだ。', en: '' }
pressEnabled: true
cowardVoices:
  '2': va-coward-2
  '3': va-coward-3
  '4': va-coward-4
deadlines:
  - id: dl-prelim-material
    ref: ppc-report-prelim
    label: { ja: '個人情報保護委員会への速報の材料提出', en: '' }
    points: -100
    doneFlag: prelimMaterialsSent
  - id: dl-final-material
    ref: ppc-report-final-malicious
    label: { ja: '個人情報保護委員会への確報の材料提出', en: '' }
    points: -80
    doneFlag: finalMaterialsSent
events:
  - id: ev-an-sns
    at: { day: 2, minutes: 1140 }
    voices: [va-ev-sns]
    gauges: { flame: 5 }
    sound: { se: [notify_sns] }
    caption: { ja: '社内の出来事が、SNSで「うちの会社も同じかも」と書かれ始めた。', en: '' }
  - id: ev-an-board
    at: { day: 4, minutes: 900 }
    voices: [va-ev-board]
    gauges: { flame: 5 }
    sound: { se: [notify_chat] }
    caption: { ja: '社内掲示板に、現場からの書き込みが増えている。', en: '' }
  - id: ev-an-customer
    at: { day: 6, minutes: 600 }
    voices: [va-ev-customer]
    gauges: { flame: 5 }
    sound: { se: [phone_ring] }
    caption: { ja: '大口顧客から、技術的な説明を求める連絡が入った。', en: '' }
points:
  - id: an01-input-alert
    at: { day: 0, minutes: 570 }
    phase: detect
    sound: { se: [notify_chat] }
    text: { ja: '午前9時30分。生成AIの管理画面を定期確認すると、装置制御のソースコードらしき文字列が入力履歴に残っていた。誰が入れたか、いつからかは分からない。現場は「業務で使っているだけ」と言っている。', en: '' }
    voices: [va01-boss, va01-vendor, va01-field, va01-ok]
    notable:
      - { id: note-ai-log, text: { ja: '生成AIの入力履歴に、装置制御のソースコードらしき文字列があった。', en: '' } }
    choices:
      - id: an01-delete
        text: { ja: '履歴を消して、再発防止の設定だけ入れる。', en: '' }
        minutes: 30
        category: fatal
        points: -250
        refs: [jpcert-handling, meti-trade-secret]
        gauges: { flame: 15, trust: -20, damage: 10 }
        setFlags: { deletedLogs: true }
        delayed:
          - { afterPhases: 2, points: -60, gauges: { flame: 15, trust: -10 }, reason: { ja: '入力履歴を消したことが調査で分かり、隠蔽と批判された。', en: '' } }
        items:
          - { id: an01-a-record, points: -20, axis: record, refs: [jpcert-handling] }
          - { id: an01-a-content, points: -15, axis: content, refs: [meti-trade-secret] }
          - { id: an01-a-wording, points: -10, axis: wording, refs: [meti-disclosure-guidance] }
      - id: an01-wait
        text: { ja: '誤検知かもしれないので、夕方まで様子を見る。', en: '' }
        minutes: 240
        category: hurt
        points: -60
        refs: [jpcert-handling]
        gauges: { damage: 10, flame: 5, trust: -5 }
        coward: true
        delayed:
          - { afterPhases: 1, points: -10, gauges: { damage: 5 }, reason: { ja: '様子を見ている間に、同じ入力が別の部署でも続いた。', en: '' } }
        items:
          - { id: an01-b-time, points: -8, axis: time, refs: [jpcert-handling] }
          - { id: an01-b-record, points: -6, axis: record, refs: [jpcert-handling] }
      - id: an01-preserve
        text: { ja: '入力履歴と管理画面のスクリーンショットを保全し、検知時刻と操作を記録してCISOに一次報告する。', en: '' }
        minutes: 60
        category: maintain
        points: 10
        refs: [jpcert-handling, cissp-cbk-secops]
        gauges: { flame: -5, trust: 5, stamina: -5 }
        setFlags: { evidenceKept: true, commandStarted: true }
        items:
          - { id: an01-c-time, points: 3, axis: time, refs: [jpcert-handling] }
          - { id: an01-c-record, points: 3, axis: record, refs: [cissp-cbk-secops] }
          - { id: an01-c-order, points: 2, axis: order, refs: [jpcert-handling] }
          - { id: an01-c-content, points: 2, axis: content, refs: [meti-trade-secret] }
      - id: an01-ask
        text: { ja: '入力した本人をすぐ呼び出して、理由を問いただす。', en: '' }
        minutes: 60
        category: hurt
        points: -30
        refs: [meti-csm-guideline]
        gauges: { trust: -5, stamina: -5 }
        items:
          - { id: an01-d-care, points: -7, axis: care, refs: [meti-csm-guideline] }
          - { id: an01-d-order, points: -5, axis: order, refs: [jpcert-handling] }

