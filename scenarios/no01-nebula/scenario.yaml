# No.1 ネビュラクラウド（大手クラウドサービス）
# 元事件は「構造」だけを参考にしたフィクション。会社名・人物名・数字はすべて架空。
# 公開判定メモ: 元事件の公式発表・調査報告書の確認日を公開判定に記録するまでは、
# 時期を特定できる書き方を避け、sourcePeriod を年代だけにぼかしている（要件: 続報が出そろうまで待つ）。
id: no01-nebula
version: '1.0.0'
status: latest
published: '2026-11-08'
sourcePeriod: { ja: '2020年代の事件の構造を参考にしたフィクション', en: '' }
difficulty: 5
languages: [ja]
referencesVersion: '2026-11-08'
legalPack: jp
title: { ja: '安全を売る会社が、安全でなかった', en: '' }
tagline: { ja: '長期潜伏、身代金要求、そして情報戦。経営者の判断が試される。', en: '' }
company:
  name: { ja: 'ネビュラクラウド株式会社', en: '' }
  industry: { ja: 'クラウドサービス', en: '' }
  size: { ja: '従業員千名規模、国内市場に上場', en: '' }
  people:
    - id: ceo
      name: { ja: '桐生 聡', en: '' }
      title: { ja: '代表取締役社長', en: '' }
    - id: cfo
      name: { ja: '三浦 遥', en: '' }
      title: { ja: '取締役CFO', en: '' }
    - id: ciso
      name: { ja: '藤堂 京介', en: '' }
      title: { ja: '執行役員セキュリティ責任者', en: '' }
    - id: pr
      name: { ja: '神谷 涼子', en: '' }
      title: { ja: '広報部長', en: '' }
    - id: ops
      name: { ja: '大庭 修', en: '' }
      title: { ja: '基盤運用部長', en: '' }
start: { day: 0, minutes: 1185 }
initialGauges: { damage: 20, flame: 0, trust: 70, stamina: 100 }
audio:
  bgmDefault: tension_low
  bgmByPhase:
    detect: tension_low
    contain: tension_mid
    organize: tension_mid
    investigate: tension_mid
    notify: tension_high
    recover: calm
    after: calm
press:
  questions:
    - id: q-delay
      seconds: 25
      timeoutPoints: -30
      text: { ja: 'なぜ数か月も気づかなかったのですか。', en: '' }
      answers:
        - { id: a-delay-attack, text: { ja: '高度な攻撃だったためです。', en: '' }, points: -80 }
        - { id: a-delay-design, text: { ja: '監視とログ保全の設計が不十分でした。', en: '' }, points: 30 }
        - { id: a-delay-verify, text: { ja: '侵入を数か月気づかなかった原因を検証し、再発防止策とともに公表します。', en: '' }, points: 80, requiresNote: note-scope }
    - id: q-disclosure
      seconds: 30
      timeoutPoints: -30
      text: { ja: '公表が遅かったのではありませんか。', en: '' }
      answers:
        - { id: a-disclosure-fast, text: { ja: 'できるだけ早く出しました。', en: '' }, points: -30 }
        - { id: a-disclosure-late, text: { ja: '速報は出しましたが、初動の判断は遅れました。', en: '' }, points: 30 }
        - { id: a-disclosure-verify, text: { ja: '遅れの原因を検証し、再発防止策とあわせて公表します。', en: '' }, points: 80 }
    - id: q-ransom
      seconds: 20
      timeoutPoints: -30
      text: { ja: '身代金は支払ったのですか。', en: '' }
      answers:
        - { id: a-ransom-paid, text: { ja: '支払いました。警察に報告し、経緯を公表します。', en: '' }, points: 30, when: { flags: { paidRansom: true } } }
        - { id: a-ransom-deny, text: { ja: '支払っていません。そのような事実はありません。', en: '' }, points: -300, when: { flags: { paidRansom: true } } }
        - { id: a-ransom-refuse, text: { ja: '支払っていません。警察に相談し、犯罪組織への資金提供を避けました。', en: '' }, points: 80, when: { flags: { paidRansom: false } } }
        - { id: a-ransom-none, text: { ja: '答えられません。', en: '' }, points: -30 }
  extraQuestions:
    - when: { flags: { hidWarning: false } }
      question:
        id: q-warning
        seconds: 30
        timeoutPoints: -30
        text: { ja: '社内から事前に指摘があったというのは本当ですか。', en: '' }
        answers:
          - { id: a-warning-none, text: { ja: '確認しておりません。', en: '' }, points: -30 }
          - { id: a-warning-admit, text: { ja: '指摘はありました。生かせませんでした。', en: '' }, points: 30 }
          - { id: a-warning-own, text: { ja: '指摘はありました。生かせなかった責任は経営にあります。', en: '' }, points: 80, requiresNote: note-warning }
    - when: { flags: { compensation: true } }
      question:
        id: q-money
        seconds: 35
        timeoutPoints: -30
        text: { ja: '見舞金の金額の根拠を教えてください。', en: '' }
        answers:
          - { id: a-money-flat, text: { ja: '気持ちとして一律に決めました。', en: '' }, points: -50 }
          - { id: a-money-tier, text: { ja: '被害の重さに応じた段階を設けました。', en: '' }, points: 30 }
          - { id: a-money-public, text: { ja: '対象と根拠を公表し、追加の請求にも誠実に対応します。', en: '' }, points: 80 }
    - when: { flags: { hidFacts: true } }
      question:
        id: q-hidden
        seconds: 25
        timeoutPoints: -30
        text: { ja: '当初「メンテナンス」と説明したのはなぜですか。', en: '' }
        answers:
          - { id: a-hidden-avoid, text: { ja: '混乱を避けるためです。', en: '' }, points: -100 }
          - { id: a-hidden-late, text: { ja: '公表の判断が遅れました。', en: '' }, points: 30 }
          - { id: a-hidden-correct, text: { ja: '隠す意図はありませんでしたが、説明は不正確でした。訂正と経緯を公表します。', en: '' }, points: 80 }
endings:
  S:
    bgm: ending_s
    text: { ja: '事件前より信頼も売上も伸びた。調査報告書は対応の手本として業界で引用され、復旧の朝に現場から短い感謝の言葉が届いた。', en: '' }
  A:
    bgm: ending_a
    text: { ja: '批判は受けたが信頼を取り戻し、売上は事件前の水準に戻った。次の四半期の契約更新は、大きな解約なしで終わる。', en: '' }
  B:
    bgm: ending_b
    text: { ja: '会社は立ち直ったが、大口の取引先を一つ失った。残った顧客との関係を、時間をかけて作り直すことになった。', en: '' }
  C:
    bgm: ending_c
    text: { ja: '第三者委員会は対応の不備を指摘し、経営陣は辞任した。残された社員が、限られた予算で再発防止策を進めている。', en: '' }
  D:
    bgm: ending_d
    text: { ja: '行政指導と集団訴訟が重なり、一部の事業から撤退した。どこで判断を誤ったのか、記録を読み返す日が続く。', en: '' }
salesModel: { base: 100, trustWeight: 0.4, fatalPenalty: 10, min: 40, max: 130 }
