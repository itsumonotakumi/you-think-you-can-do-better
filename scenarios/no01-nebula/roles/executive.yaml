drafts:
  first-report:
    title: { ja: '第1報の文案', en: '' }
    slots:
      - id: 'timing'
        label: { ja: '出す時刻', en: '' }
        auto: true
        items:
          - { id: 'fd-t-24h', when: { withinHours: 24 }, points: 10, axis: 'time', refs: ['ppc-report-prelim'] }
          - { id: 'fd-t-72h', when: { withinHours: 72 }, points: 3, axis: 'time', refs: ['ppc-report-prelim'] }
          - { id: 'fd-t-late', when: { otherwise: true }, points: -15, axis: 'time', refs: ['ppc-report-prelim'] }
      - id: 'scope'
        label: { ja: '対象範囲', en: '' }
        options:
          - { id: 'fd-s-current', text: { ja: '現行プランの顧客だけに限定する', en: '' }, points: -20, axis: 'content', refs: ['ppc-report-prelim'], delayed: { afterPhases: 1, points: -20, reason: { ja: '対象の訂正が必要になった。', en: '' } }, explain: { ja: '現行の契約者だけに絞ると、退会者や解約者が対象から漏れる。後から訂正と追加通知が必要になる。', en: '' } }
          - { id: 'fd-s-all', text: { ja: '全顧客（退会済みと解約済みを含む）', en: '' }, points: 10, axis: 'content', refs: ['ppc-report-prelim'], explain: { ja: '対象を広く取れば、後から漏れが判明しても訂正が要らない。被害の可能性がある人を漏らさない判断になる。', en: '' } }
      - id: 'dates'
        label: { ja: '日時の書き方', en: '' }
        options:
          - { id: 'fd-d-split', text: { ja: '発生と検知の日時を分けて書く', en: '' }, points: 5, axis: 'content', refs: ['jpcert-handling'], explain: { ja: '発生と検知を分ければ、何がいつ起きたかを正確に伝えられる。調査の進み具合も説明しやすい。', en: '' } }
          - { id: 'fd-d-merge', text: { ja: '発生と検知をまとめて一件で書く', en: '' }, points: -10, axis: 'wording', refs: ['jpcert-handling'], explain: { ja: '発生と検知をまとめると、潜伏期間の長さが伝わらず、検知の遅れを曖昧にしてしまう。', en: '' } }
      - id: 'certainty'
        label: { ja: '断定の強さ', en: '' }
        options:
          - { id: 'fd-c-maybe', text: { ja: '漏えいの可能性と確認を使い分ける', en: '' }, points: 5, axis: 'wording', refs: ['meti-disclosure-guidance'], explain: { ja: '確認できた事実と可能性を分ければ、誤った断定を避けられる。後から判明しても説明を維持しやすい。', en: '' } }
          - { id: 'fd-c-confirm', text: { ja: 'すべて漏えいを確認と断定して書く', en: '' }, points: -15, axis: 'wording', refs: ['meti-disclosure-guidance'], explain: { ja: '未確認の段階で断定すると、後から否定や訂正が必要になる。説明の信頼を損なう書き方になる。', en: '' } }
          - { id: 'fd-c-none', text: { ja: '漏えいはないと明言して書く', en: '' }, points: -20, axis: 'wording', refs: ['ppc-report-scope'], explain: { ja: '漏えいがないと断言すると、公開後に事実と食い違い、隠蔽を疑われる。最も危険な書き方になる。', en: '' } }
      - id: 'leaked'
        label: { ja: '漏れた項目', en: '' }
        options:
          - { id: 'fd-l-specific', text: { ja: 'メールアドレス、ログイン履歴、請求情報、APIキーを列挙する', en: '' }, points: 10, axis: 'content', refs: ['ppc-report-prelim'], explain: { ja: '漏れた項目を具体的に示せば、被害者が自分で取るべき対策を判断できる。通知の実効性が高まる。', en: '' } }
          - { id: 'fd-l-vague', text: { ja: '詳細を確定せず顧客情報の一部が漏れた可能性とぼかす', en: '' }, points: -10, axis: 'content', refs: ['ppc-report-prelim'], explain: { ja: '項目をぼかすと、被害者は何を変えればよいか分からない。問い合わせが集中し、不安も解消されない。', en: '' } }
      - id: 'action'
        label: { ja: '顧客が今すぐすること', en: '' }
        options:
          - { id: 'fd-a-generic', text: { ja: '注意してくださいとだけ書き、具体的な行動は示さないでおく', en: '' }, points: -10, axis: 'care', refs: ['ppc-notify-person'], explain: { ja: '注意を促すだけでは、顧客は何をすればよいか分からない。行動につながらず、不安だけが残る。', en: '' } }
          - { id: 'fd-a-concrete', text: { ja: 'パスワード変更やセッション切断、取引口座への連絡を具体的に書く', en: '' }, points: 10, axis: 'care', refs: ['ppc-notify-person'], explain: { ja: '今すぐ取れる行動を具体的に示すことで、被害の拡大を実際に防げる。顧客の不安にも応えられる。', en: '' } }
      - id: 'phishing'
        label: { ja: '偽通知への注意', en: '' }
        options:
          - { id: 'fd-p-warn', text: { ja: '当社が電話でパスワードを聞くことはないと書く', en: '' }, points: 8, axis: 'care', refs: ['ppc-notify-person'], explain: { ja: '偽の連絡を想定した注意書きは、二次被害を防ぐ。事件後の顧客を狙う手口への備えになる。', en: '' } }
          - { id: 'fd-p-none', text: { ja: '偽通知への注意は書かず、問い合わせだけ案内する', en: '' }, points: -10, axis: 'care', refs: ['ppc-notify-person'], explain: { ja: '偽通知への注意がないと、被害者が詐欺的な連絡に応じてしまう。二次被害の入口を開けておく。', en: '' } }
      - id: 'contact'
        label: { ja: '問い合わせ窓口', en: '' }
        options:
          - { id: 'fd-w-number', text: { ja: '代表番号だけを書いて詳しくは触れない', en: '' }, points: -5, axis: 'care', refs: ['meti-csm-guideline'], explain: { ja: '代表番号だけでは、どこに何を聞けばよいか分からない。問い合わせが集中し、対応が滞る。', en: '' } }
          - { id: 'fd-w-hours', text: { ja: '専用窓口の番号と受付時間を書く', en: '' }, points: 5, axis: 'care', refs: ['meti-csm-guideline'], explain: { ja: '専用窓口と受付時間が分かれば、顧客は迷わず連絡できる。増員の予定も伝えると安心につながる。', en: '' } }
          - { id: 'fd-w-none', text: { ja: '窓口の記載を省き案内もしない', en: '' }, points: -15, axis: 'care', refs: ['meti-csm-guideline'], explain: { ja: '問い合わせ先がないと、顧客は SNS や報道に頼るしかない。誤情報の拡散を招きやすい。', en: '' } }
      - id: 'next'
        label: { ja: '次の報告', en: '' }
        options:
          - { id: 'fd-n-next', text: { ja: '次の報告予定を日時つきで書く', en: '' }, points: 3, axis: 'content', refs: ['meti-disclosure-guidance'], explain: { ja: '次の更新の日時を示せば、顧客は情報を待てる。説明を止めない姿勢が伝わり、問い合わせの抑制にもなる。', en: '' } }
          - { id: 'fd-n-none', text: { ja: '次の報告予定を書かないで終える', en: '' }, points: -5, axis: 'content', refs: ['meti-disclosure-guidance'], explain: { ja: '次の予定がないと、顧客はいつ情報が来るか分からず不安になる。問い合わせも減らない。', en: '' } }
      - id: 'apology'
        label: { ja: '謝罪の主語', en: '' }
        options:
          - { id: 'fd-ap-vendor', text: { ja: '委託先の責任として謝罪すると書く', en: '' }, points: -10, axis: 'wording', refs: ['meti-disclosure-guidance'], explain: { ja: '委託先の責任として謝罪すると、責任逃れと受け取られる。委託していても自社の管理責任は残る。', en: '' } }
          - { id: 'fd-ap-company', text: { ja: '当社の責任として謝罪すると書く', en: '' }, points: 3, axis: 'wording', refs: ['meti-disclosure-guidance'], explain: { ja: '自社の責任として謝罪すれば、委託先に押し付ける印象を与えない。説明の主体が明確になる。', en: '' } }
      - id: 'excuse'
        label: { ja: '前置き', en: '' }
        options:
          - { id: 'fd-e-none', text: { ja: '言い訳を書かず事実だけを書く', en: '' }, points: 5, axis: 'wording', refs: ['meti-disclosure-guidance'], explain: { ja: '前置きを置かず事実を書くほうが、説明として誠実に読まれる。余計な反発を招かない。', en: '' } }
          - { id: 'fd-e-advanced', text: { ja: '高度な攻撃によりと前置きして書く', en: '' }, points: -10, axis: 'wording', refs: ['meti-disclosure-guidance'], explain: { ja: '高度な攻撃を前置きにすると、言い訳と受け取られやすい。原因の説明を先送りしている印象を与える。', en: '' } }
      - id: 'approval'
        label: { ja: '社内確認', en: '' }
        options:
          - { id: 'fd-i-solo', text: { ja: '社長の判断だけで文案を決めて公表する', en: '' }, points: -10, axis: 'order', refs: ['meti-csm-guideline'], explain: { ja: '一人で決めると、法務や広報の観点が抜けやすい。表現の誤りが後の訂正につながり、信頼を損なう。', en: '' } }
          - { id: 'fd-i-share', text: { ja: '公表前に広報、IR、法務で文案を確認する', en: '' }, points: 5, axis: 'order', refs: ['meti-csm-guideline'], explain: { ja: '複数の部署で確認すれば、法令や投資家向けの表現の抜けを防げる。公表後の訂正も減らせる。', en: '' } }
      - id: 'record'
        label: { ja: '記録', en: '' }
        options:
          - { id: 'fd-r-log', text: { ja: '公表した時刻と版を記録に残す', en: '' }, points: 5, axis: 'record', refs: ['jpcert-handling'], explain: { ja: '公表の時刻と版を残せば、後から説明の変遷をたどれる。訂正が必要になったときの経緯も示しやすい。', en: '' } }
          - { id: 'fd-r-none', text: { ja: '記録を残さず公表だけを行う', en: '' }, points: -8, axis: 'record', refs: ['jpcert-handling'], explain: { ja: '記録がないと、いつ何を公表したか説明できない。訂正や検証の場面で根拠を示せず困る。', en: '' } }
  final-report:
    title: { ja: '調査報告書の公開範囲', en: '' }
    slots:
      - id: 'scope'
        label: { ja: '公開する範囲', en: '' }
        options:
          - { id: 'fr-s-full', text: { ja: '攻撃に使える詳細だけ伏せて全文公開する', en: '' }, points: 10, axis: 'content', refs: ['meti-disclosure-guidance'], explain: { ja: '攻撃に使える部分だけを伏せて全文を出すことで、説明責任と安全の両立を図れる。被害者にも配慮が伝わる。', en: '' } }
          - { id: 'fr-s-hide', text: { ja: '攻撃の詳細を理由に全文を公開しない', en: '' }, points: -20, axis: 'content', refs: ['meti-disclosure-guidance'], explain: { ja: '公開しない理由が攻撃の詳細だけなら、隠蔽と受け取られやすい。かえって推測と批判を招く。', en: '' } }
      - id: 'cause'
        label: { ja: '原因の書き方', en: '' }
        options:
          - { id: 'fr-c-vague', text: { ja: '外部からの攻撃とだけ書いて終える', en: '' }, points: -10, axis: 'content', refs: ['nist-sp800-61r3'], explain: { ja: '外部からの攻撃とだけ書くと、自社の課題が見えない。再発防止の実効性を疑われても仕方がない。', en: '' } }
          - { id: 'fr-c-cause', text: { ja: '原因と判断の誤りを具体的に書く', en: '' }, points: 10, axis: 'content', refs: ['nist-sp800-61r3'], explain: { ja: '原因と判断の誤りまで具体的に書くと、再発防止の説得力が増す。信頼回復にもつながる。', en: '' } }
      - id: 'warning'
        label: { ja: '事前の指摘', en: '' }
        options:
          - { id: 'fr-w-include', text: { ja: '事前の社内指摘と生かせなかった経緯を詳しく書く', en: '' }, points: 10, axis: 'content', refs: ['meti-csm-guideline'], explain: { ja: '事前の指摘と生かせなかった経緯を書けば、組織の課題を正面から説明できる。再発防止にもつながる。', en: '' } }
          - { id: 'fr-w-omit', text: { ja: '事前の社内指摘には一切触れないでおく', en: '' }, points: -15, axis: 'content', refs: ['meti-csm-guideline'], explain: { ja: '社内指摘に触れないと、後から判明したときに隠蔽を疑われる。説明の信頼を大きく損なう。', en: '' } }
      - id: 'measures'
        label: { ja: '再発防止策', en: '' }
        options:
          - { id: 'fr-m-slogan', text: { ja: '再発防止に努めますとだけ書く', en: '' }, points: -10, axis: 'content', refs: ['cissp-cbk-secops'], explain: { ja: '決意だけでは、何をいつ誰がやるのか分からない。実行を伴わない印象を与え、評価されない。', en: '' } }
          - { id: 'fr-m-plan', text: { ja: '再発防止策の実施時期と担当を書く', en: '' }, points: 10, axis: 'content', refs: ['cissp-cbk-secops'], explain: { ja: '時期と担当を書けば、対策が実行されるかを後から検証できる。具体性が信頼につながる。', en: '' } }
      - id: 'thirdparty'
        label: { ja: '第三者委員会の意見', en: '' }
        options:
          - { id: 'fr-t-full', text: { ja: '第三者委員会の意見を全文掲載する', en: '' }, points: 8, axis: 'content', refs: ['cissp-cbk-secops'], explain: { ja: '第三者委員会の意見を全文載せれば、都合の悪い指摘も含めて説明したことになる。独立性も示せる。', en: '' } }
          - { id: 'fr-t-summary', text: { ja: '第三者委員会の意見は要約だけ載せる', en: '' }, points: -8, axis: 'content', refs: ['cissp-cbk-secops'], explain: { ja: '要約だけでは、都合の悪い部分を省いたと疑われやすい。委員会の独立性への信頼も損なう。', en: '' } }
      - id: 'victims'
        label: { ja: '被害者への補償', en: '' }
        options:
          - { id: 'fr-v-none', text: { ja: '補償には触れないでおく', en: '' }, points: -10, axis: 'care', refs: ['ppc-notify-person'], explain: { ja: '補償に触れないと、被害者を置き去りにした印象を与える。納得と回復を遠ざける結果になる。', en: '' } }
          - { id: 'fr-v-record', text: { ja: '補償と窓口の実績を書く', en: '' }, points: 8, axis: 'care', refs: ['ppc-notify-person'], explain: { ja: '補償と窓口の実績を示せば、被害者支援が言葉だけでないと伝わる。具体的な数字が信頼になる。', en: '' } }
      - id: 'progress'
        label: { ja: '進捗の公開', en: '' }
        options:
          - { id: 'fr-p-monthly', text: { ja: '進捗を毎月公開すると書く', en: '' }, points: 10, axis: 'record', refs: ['meti-disclosure-guidance'], explain: { ja: '毎月の公開を約束すれば、対策の実行を継続的に確認できる。説明を止めない姿勢になる。', en: '' } }
          - { id: 'fr-p-once', text: { ja: '一度だけ公開すると書く', en: '' }, points: -5, axis: 'record', refs: ['meti-disclosure-guidance'], explain: { ja: '一度きりでは、対策が続いているかを確認できない。形だけの報告と受け取られやすい。', en: '' } }
      - id: 'industry'
        label: { ja: '業界への共有', en: '' }
        options:
          - { id: 'fr-i-keep', text: { ja: '得た教訓は自社の中にとどめる', en: '' }, points: -5, axis: 'content', refs: ['meti-disclosure-guidance'], explain: { ja: '教訓を閉じ込めると、社会への還元がない。攻撃の手口が他社にも及ぶ可能性を放置する。', en: '' } }
          - { id: 'fr-i-share', text: { ja: '得た教訓を業界に無償で共有する', en: '' }, points: 10, axis: 'content', refs: ['meti-disclosure-guidance'], explain: { ja: '業界への共有は、同種の被害を減らす社会的な貢献になる。自社への評価も高まり、信頼の回復につながる。', en: '' } }
      - id: 'ad'
        label: { ja: '宣伝との線引き', en: '' }
        options:
          - { id: 'fr-ad-none', text: { ja: '復旧を宣伝に使わないと書く', en: '' }, points: 5, axis: 'care', refs: ['meti-disclosure-guidance'], explain: { ja: '復旧を宣伝に使わないと明言すれば、被害者への配慮が伝わる。売上より信頼を選ぶ姿勢になる。', en: '' } }
          - { id: 'fr-ad-use', text: { ja: '復旧を宣伝に使うと書く', en: '' }, points: -15, axis: 'care', refs: ['meti-disclosure-guidance'], explain: { ja: '復旧を宣伝に使うと、被害を商機にしたと受け取られる。信頼回復の途中で反発を招く。', en: '' } }
