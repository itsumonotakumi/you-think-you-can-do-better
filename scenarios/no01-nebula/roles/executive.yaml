drafts:
  first-report:
    title: { ja: '第1報の文案', en: '' }
    slots:
      - id: timing
        label: { ja: '出す時刻', en: '' }
        auto: true
        items:
          - { id: fd-t-24h, when: { withinHours: 24 }, points: 10, axis: time, refs: [ppc-report-prelim] }
          - { id: fd-t-72h, when: { withinHours: 72 }, points: 3, axis: time, refs: [ppc-report-prelim] }
          - { id: fd-t-late, when: { otherwise: true }, points: -15, axis: time, refs: [ppc-report-prelim] }
      - id: scope
        label: { ja: '対象範囲', en: '' }
        options:
          - { id: fd-s-all, text: { ja: '全顧客（退会・解約済みを含む）', en: '' }, points: 10, axis: content, refs: [ppc-report-prelim] }
          - { id: fd-s-current, text: { ja: '現行プランの顧客のみ', en: '' }, points: -20, axis: content, refs: [ppc-report-prelim], delayed: { afterPhases: 1, points: -20, reason: { ja: '対象の訂正が必要になった。', en: '' } } }
      - id: dates
        label: { ja: '日時の書き方', en: '' }
        options:
          - { id: fd-d-split, text: { ja: '発生と検知の日時を分けて書く', en: '' }, points: 5, axis: content, refs: [jpcert-handling] }
          - { id: fd-d-merge, text: { ja: '発生と検知をまとめて書く', en: '' }, points: -10, axis: wording, refs: [jpcert-handling] }
      - id: certainty
        label: { ja: '断定の強さ', en: '' }
        options:
          - { id: fd-c-maybe, text: { ja: '「漏えいの可能性」と「確認」を使い分ける', en: '' }, points: 5, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: fd-c-confirm, text: { ja: 'すべて「漏えいを確認」と断定する', en: '' }, points: -15, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: fd-c-none, text: { ja: '「漏えいはない」と書く', en: '' }, points: -20, axis: wording, refs: [ppc-report-scope] }
      - id: leaked
        label: { ja: '漏れた項目', en: '' }
        options:
          - { id: fd-l-specific, text: { ja: 'メールアドレス、ログイン履歴、請求情報、APIキーを具体的に列挙する', en: '' }, points: 10, axis: content, refs: [ppc-report-prelim] }
          - { id: fd-l-vague, text: { ja: '「顧客情報の一部」とぼかす', en: '' }, points: -10, axis: content, refs: [ppc-report-prelim] }
      - id: action
        label: { ja: '顧客が今すぐすること', en: '' }
        options:
          - { id: fd-a-concrete, text: { ja: 'パスワード変更、セッション切断、取引口座やカード会社への連絡を具体的に書く', en: '' }, points: 10, axis: care, refs: [ppc-notify-person] }
          - { id: fd-a-generic, text: { ja: '「注意してください」とだけ書く', en: '' }, points: -10, axis: care, refs: [ppc-notify-person] }
      - id: phishing
        label: { ja: '偽通知への注意', en: '' }
        options:
          - { id: fd-p-warn, text: { ja: '「当社が電話でパスワードを聞くことはありません」と書く', en: '' }, points: 8, axis: care, refs: [ppc-notify-person] }
          - { id: fd-p-none, text: { ja: '偽通知への注意を書かない', en: '' }, points: -10, axis: care, refs: [ppc-notify-person] }
      - id: contact
        label: { ja: '問い合わせ窓口', en: '' }
        options:
          - { id: fd-w-hours, text: { ja: '専用窓口の番号、受付時間、増員を書く', en: '' }, points: 5, axis: care, refs: [meti-csm-guideline] }
          - { id: fd-w-number, text: { ja: '番号だけを書く', en: '' }, points: -5, axis: care, refs: [meti-csm-guideline] }
          - { id: fd-w-none, text: { ja: '窓口を書かない', en: '' }, points: -15, axis: care, refs: [meti-csm-guideline] }
      - id: next
        label: { ja: '次の報告', en: '' }
        options:
          - { id: fd-n-next, text: { ja: '次の報告予定を書く', en: '' }, points: 3, axis: content, refs: [meti-disclosure-guidance] }
          - { id: fd-n-none, text: { ja: '次回の予定を書かない', en: '' }, points: -5, axis: content, refs: [meti-disclosure-guidance] }
      - id: apology
        label: { ja: '謝罪の主語', en: '' }
