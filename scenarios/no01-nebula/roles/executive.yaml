# No.1 ネビュラクラウド / 経営者ロール
# 判断ポイント16、細目は choices[].items と drafts の合計で80以上。
estimateMinutes: 35
intro: { ja: 'あなたはネビュラクラウドの代表取締役社長。安全を売る会社が、自社の安全を守れるか。19時45分の電話から、あなたの判断が始まる。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-ppc-prelim
    ref: ppc-report-prelim
    label: { ja: '個人情報保護委員会への速報', en: '' }
    points: -150
    doneFlag: ppcPrelimFiled
events:
  - id: ev-client-inquiry
    at: { day: 1, minutes: 720 }
    voices: [v-ev-client]
    gauges: { flame: 5 }
    sound: { se: [phone_ring] }
    caption: { ja: '主要取引先から問い合わせが相次いでいる。', en: '' }
  - id: ev-ad-vision
    at: { day: 2, minutes: 1080 }
    voices: [v-ev-ad]
    gauges: { flame: 5 }
    caption: { ja: '駅前の大型ビジョンで、自社のセキュリティ商品の広告が流れ続けている。', en: '' }
  - id: ev-leak-online
    at: { day: 6, minutes: 480 }
    voices: [v-ev-leak]
    gauges: { flame: 15 }
    sound: { se: [notify_news] }
    caption: { ja: 'リークサイトに、顧客情報の一部が公開された。', en: '' }
points:
  - id: p01-call
    at: { day: 0, minutes: 1185 }
    phase: detect
    sound: { se: [phone_ring] }
    text: { ja: '19時45分。基盤運用部長から電話が入る。「顧客のサーバーに不正プログラムが見つかりました。影響範囲はまだ分かりません」。', en: '' }
    voices: [v01-boss, v01-ok]
    notable:
      - { id: note-first-call, text: { ja: '19時45分、基盤運用部長から第一報。影響範囲は不明。', en: '' } }
    choices:
      - id: p01-wait
        text: { ja: '正確な報告が揃うまで、明日の定例会議で聞く。', en: '' }
        minutes: 60
        category: hurt
        points: -150
        refs: [jpcert-handling]
        gauges: { flame: 10, trust: -5, stamina: 5 }
        coward: true
        setFlags: { delayedCommand: true }
        delayed:
          - { afterPhases: 1, points: -40, gauges: { trust: -10 }, reason: { ja: 'その夜も顧客の口座で不正取引が続いた。', en: '' } }
        items:
          - { id: p01-a-record, points: -5, axis: record, refs: [jpcert-handling] }
          - { id: p01-a-time, points: -10, axis: time, refs: [jpcert-handling] }
      - id: p01-command
        text: { ja: 'その場で対策本部を立ち上げ、決裁権限を部門長に委譲し、外部専門家と弁護士を手配する。', en: '' }
        minutes: 30
        category: maintain
        points: 20
        refs: [meti-csm-guideline]
        gauges: { flame: -5, trust: 5, stamina: -5 }
        setFlags: { commandStarted: true }
        items:
          - { id: p01-b-time, points: 5, axis: time, refs: [jpcert-handling] }
          - { id: p01-b-order, points: 5, axis: order, refs: [meti-csm-guideline] }
          - { id: p01-b-record, points: 5, axis: record, refs: [jpcert-handling] }
      - id: p01-self
        text: { ja: '自分でサーバー室に行き、状況を直接確かめる。', en: '' }
        minutes: 60
        category: hurt
        points: -50
        refs: [jpcert-handling]
        gauges: { stamina: -10, trust: -5 }
        items:
          - { id: p01-c-order, points: -10, axis: order, refs: [meti-csm-guideline] }
          - { id: p01-c-care, points: -5, axis: care, refs: [meti-csm-guideline] }

  - id: p02-stop
    at: { day: 1, minutes: 240 }
    phase: contain
    sound: { se: [phone_ring, notify_news] }
    text: { ja: '午前4時。被害が確認されたサーバーは三台。同じネットワークに、まだ五百台の顧客サーバーがぶら下がっている。全プランを止めるか。', en: '' }
    voices: [v02-public, v02-coward, v02-field, v02-ok]
    choices:
      - id: p02-partial
        text: { ja: '被害が確認されたサーバーだけ止める。', en: '' }
        minutes: 60
        category: hurt
        points: -100
        refs: [nist-sp800-61r3]
        gauges: { damage: 20, flame: 5 }
        delayed:
          - { afterPhases: 1, points: -60, gauges: { damage: 15, trust: -10 }, reason: { ja: '止めなかったサーバーでも不正取引が起きた。', en: '' } }
        items:
          - { id: p02-a-content, points: -10, axis: content, refs: [nist-sp800-61r3] }
          - { id: p02-a-record, points: 3, axis: record, refs: [nist-sp800-61r3] }
      - id: p02-stop-notice
        text: { ja: '全プランを順次停止し、停止理由だけを告知する。', en: '' }
        minutes: 90
        category: maintain
        points: 20
        refs: [meti-disclosure-guidance]
        gauges: { flame: 15, damage: -20, stamina: -10 }
        setFlags: { contained: true, transparentStop: true }
        items:
          - { id: p02-b-content, points: 5, axis: content, refs: [meti-disclosure-guidance] }
          - { id: p02-b-care, points: -5, axis: care, refs: [ppc-notify-person] }
      - id: p02-stop-guide
        text: { ja: '全プランを順次停止し、顧客が今すぐすべきこと（パスワード変更、セッション切断、取引口座やカード会社への連絡）を同時に具体的に告知する。', en: '' }
        minutes: 120
        category: recover
        points: 100
        refs: [ppc-notify-person]
        gauges: { flame: 10, damage: -30, trust: 10, stamina: -15 }
        setFlags: { contained: true, transparentStop: true, customerGuidance: true }
        items:
          - { id: p02-c-time, points: 5, axis: time, refs: [meti-disclosure-guidance] }
          - { id: p02-c-care, points: 10, axis: care, refs: [ppc-notify-person] }
          - { id: p02-c-content, points: 5, axis: content, refs: [meti-disclosure-guidance] }
          - { id: p02-c-next, points: 3, axis: content, refs: [meti-disclosure-guidance] }
      - id: p02-maintenance
        text: { ja: '全停止するが、告知は「メンテナンス」と書く。', en: '' }
        minutes: 90
        category: fatal
        points: -250
        refs: [ppc-report-scope]
        gauges: { flame: 30, damage: 10, trust: -20 }
        setFlags: { hidFacts: true }
        delayed:
          - { afterPhases: 2, points: -100, gauges: { flame: 25, trust: -20 }, reason: { ja: '不正アクセスであることが報道で判明し、隠蔽と批判された。', en: '' } }
        items:
          - { id: p02-d-wording, points: -20, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: p02-d-promise, points: -10, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: p02-d-record, points: -10, axis: record, refs: [jpcert-handling] }

  - id: p03-ransom
    at: { day: 1, minutes: 840 }
    phase: contain
    sound: { se: [mail_arrive] }
    text: { ja: '午後2時。攻撃者からメールが届く。「顧客情報を預かっている。連絡がなければ公開する」。', en: '' }
    voices: [v03-public, v03-bold, v03-attacker, v03-ok]
    choices:
      - id: p03-pay
        text: { ja: '要求に応じて支払う。', en: '' }
        minutes: 60
        category: fatal
        points: -300
        refs: [npa-consult]
        gauges: { damage: 20, flame: 20, trust: -20 }
        setFlags: { paidRansom: true }
        items:
          - { id: p03-a-record, points: -10, axis: record, refs: [npa-consult] }
          - { id: p03-a-content, points: -10, axis: content, refs: [npa-consult] }
      - id: p03-refuse
        text: { ja: '支払わないと決め、警察に相談し、決定の理由を公表で説明する。', en: '' }
        minutes: 90
        category: maintain
        points: 30
        refs: [npa-consult]
        gauges: { flame: -5, trust: 5, stamina: -5 }
        setFlags: { refusedRansom: true }
        items:
          - { id: p03-b-record, points: 5, axis: record, refs: [npa-consult] }
          - { id: p03-b-content, points: 5, axis: content, refs: [npa-consult] }
      - id: p03-refuse-plan
        text: { ja: '支払わないと決め、警察に相談する。加えて、情報が公開されたときの被害者の補償方針と専用窓口を先に発表する。', en: '' }
        minutes: 150
        category: recover
        points: 120
        refs: [npa-consult, ppc-notify-person]
        gauges: { flame: -10, trust: 10, stamina: -10 }
        setFlags: { refusedRansom: true, victimPlan: true }
        items:
          - { id: p03-c-record, points: 5, axis: record, refs: [npa-consult] }
          - { id: p03-c-order, points: 10, axis: order, refs: [ppc-notify-person] }
          - { id: p03-c-content, points: 5, axis: content, refs: [npa-consult] }
          - { id: p03-c-coord, points: 5, axis: order, refs: [npa-consult] }
      - id: p03-ceo-sns
        text: { ja: '支払わないが、社長が個人のSNSで「犯人に屈しない」と強い言葉で発信する。', en: '' }
        minutes: 30
        category: hurt
        points: -60
        refs: [meti-disclosure-guidance]
        gauges: { flame: 15, trust: -5 }
        delayed:
          - { afterPhases: 1, points: -40, gauges: { flame: 15 }, reason: { ja: '攻撃者が社長の発信に反応し、公開を早めた。', en: '' } }
        items:
          - { id: p03-d-wording, points: -10, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: p03-d-order, points: -10, axis: order, refs: [meti-disclosure-guidance] }

  - id: p04-prelim
    at: { day: 2, minutes: 600 }
    phase: notify
    sound: { se: [phone_ring] }
    text: { ja: '午前10時。法務から「個人情報保護委員会への第1報（速報）を、いつ出すか」と聞かれた。件数はまだ確定していない。', en: '' }
    voices: [v04-law, v04-boss, v04-ok]
    choices:
      - id: p04-wait
        text: { ja: '件数が確定してから報告する。', en: '' }
        minutes: 120
        category: hurt
        points: -150
        refs: [ppc-report-prelim]
        gauges: { flame: 15, trust: -10, damage: 10 }
        coward: true
        setFlags: { delayedReport: true }
        items:
          - { id: p04-a-time, points: -10, axis: time, refs: [ppc-report-prelim] }
          - { id: p04-a-record, points: -8, axis: record, refs: [ppc-report-prelim] }
      - id: p04-file
        text: { ja: '分かっている範囲で第1報（速報）を出し、不明点は「調査中」と明記する。', en: '' }
        minutes: 90
        category: maintain
        points: 20
        refs: [ppc-report-prelim]
        gauges: { trust: 5, stamina: -10 }
        setFlags: { ppcPrelimFiled: true }
        items:
          - { id: p04-b-content, points: 8, axis: content, refs: [ppc-report-prelim] }
          - { id: p04-b-time, points: 5, axis: time, refs: [ppc-report-prelim] }
          - { id: p04-b-record, points: 5, axis: record, refs: [ppc-report-prelim] }
      - id: p04-oral
        text: { ja: '所管庁には口頭で相談するが、書面は出さない。', en: '' }
        minutes: 60
        category: hurt
        points: -100
        refs: [ppc-report-scope]
        gauges: { flame: 10, trust: -10 }
        items:
          - { id: p04-c-record, points: -10, axis: record, refs: [ppc-report-scope] }
          - { id: p04-c-time, points: -8, axis: time, refs: [ppc-report-scope] }

  - id: p05-first-report
    at: { day: 2, minutes: 900 }
    phase: notify
    sound: { se: [typing] }
    text: { ja: '午後3時。広報が「今夜、第1報を出せます」と言う。被害の全容はまだ分かっていない。', en: '' }
    voices: [v05-expert, v05-coward, v05-popular, v05-ok]
    choices:
      - id: p05-tonight
        text: { ja: '今夜中に第1報を出す。', en: '' }
        minutes: 120
        category: maintain
        points: 20
        refs: [ppc-report-prelim]
        gauges: { trust: 5, stamina: -10 }
        detail: first-report
        setFlags: { firstPublic: true }
        items:
          - { id: p05-a-record, points: 5, axis: record, refs: [meti-disclosure-guidance] }
          - { id: p05-a-order, points: 5, axis: order, refs: [meti-disclosure-guidance] }
      - id: p05-wait
        text: { ja: '全容が分かってから出す。', en: '' }
        minutes: 180
        category: hurt
        points: -100
        refs: [ppc-report-prelim]
        gauges: { flame: 15, trust: -10 }
        coward: true
        delayed:
          - { afterPhases: 1, points: -30, gauges: { flame: 10 }, reason: { ja: '報道が先に「説明なし」と報じた。', en: '' } }
        items:
          - { id: p05-b-time, points: -10, axis: time, refs: [ppc-report-prelim] }
          - { id: p05-b-care, points: -10, axis: care, refs: [ppc-notify-person] }
      - id: p05-maintenance
        text: { ja: '今夜、メンテナンス障害として公表する。', en: '' }
        minutes: 90
        category: fatal
        points: -250
        refs: [ppc-report-scope]
        gauges: { flame: 30, trust: -20 }
        setFlags: { hidFacts: true }
        items:
          - { id: p05-c-wording, points: -20, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: p05-c-care, points: -10, axis: care, refs: [meti-disclosure-guidance] }
          - { id: p05-c-record, points: -10, axis: record, refs: [jpcert-handling] }

  - id: p06-ad
    at: { day: 2, minutes: 1140 }
    phase: contain
    sound: { se: [notify_news] }
    text: { ja: '午後7時。駅前の大型ビジョンで、自社のセキュリティ商品の広告が流れている。「安心を、すべての人に」。', en: '' }
    voices: [v06-vendor, v06-flattery]
    choices:
      - id: p06-stop
        text: { ja: '広告を止める。', en: '' }
        minutes: 60
        category: maintain
        points: 20
        refs: [meti-disclosure-guidance]
        gauges: { flame: -5, trust: 5 }
        items:
          - { id: p06-a-order, points: 5, axis: order, refs: [meti-disclosure-guidance] }
          - { id: p06-a-wording, points: 3, axis: wording, refs: [meti-disclosure-guidance] }
      - id: p06-replace
        text: { ja: '広告を止め、同じ枠を被害者向けの注意喚起に差し替える。', en: '' }
        minutes: 90
        category: recover
        points: 100
        refs: [ppc-notify-person]
        gauges: { flame: -10, trust: 10, stamina: -5 }
        items:
          - { id: p06-b-record, points: 5, axis: record, refs: [meti-disclosure-guidance] }
          - { id: p06-b-care, points: 10, axis: care, refs: [ppc-notify-person] }
          - { id: p06-b-wording, points: 5, axis: wording, refs: [meti-disclosure-guidance] }
      - id: p06-continue
        text: { ja: '広告は続ける。安全を売る会社が広告を止めるのは、自信がない証拠だ。', en: '' }
        minutes: 15
        category: hurt
        points: -50
        refs: [meti-disclosure-guidance]
        gauges: { flame: 10, trust: -10 }
        items:
          - { id: p06-c-care, points: -10, axis: care, refs: [meti-disclosure-guidance] }
          - { id: p06-c-record, points: -5, axis: record, refs: [meti-disclosure-guidance] }

  - id: p07-scope
    at: { day: 3, minutes: 600 }
    phase: investigate
    sound: { se: [notify_chat] }
    text: { ja: '午前10時。調査会社の報告。侵入は二か月半前。影響範囲は顧客の一部とAPIキーに及ぶ可能性がある。', en: '' }
    voices: [v07-insider, v07-past, v07-ok]
    notable:
      - { id: note-scope, text: { ja: '侵入は二か月半前。影響範囲は調査中。APIキーも対象の可能性。', en: '' } }
    choices:
      - id: p07-narrow
        text: { ja: 'すでに公表した範囲だけを調査し、追加の公表は控える。', en: '' }
        minutes: 120
        category: hurt
        points: -60
        refs: [nist-sp800-61r3]
        gauges: { damage: 15, trust: -10 }
        items:
          - { id: p07-a-content, points: -10, axis: content, refs: [nist-sp800-61r3] }
          - { id: p07-a-content2, points: -10, axis: content, refs: [nist-sp800-61r3] }
      - id: p07-expand
        text: { ja: '全顧客・全システムに調査範囲を広げ、第三者委員会を設置する。', en: '' }
        minutes: 240
        category: maintain
        points: 30
        refs: [meti-csm-guideline]
        gauges: { damage: -10, trust: 10, stamina: -15 }
        setFlags: { thirdParty: true }
        items:
          - { id: p07-b-content, points: 8, axis: content, refs: [nist-sp800-61r3] }
          - { id: p07-b-order, points: 5, axis: order, refs: [meti-csm-guideline] }
      - id: p07-expand-plan
        text: { ja: '全顧客・全システムに調査範囲を広げ、第三者委員会を設置する。加えて、被害者への補償基準を先に決めて公表する。', en: '' }
        minutes: 300
        category: recover
        points: 120
        refs: [ppc-notify-person, meti-csm-guideline]
        gauges: { damage: -10, trust: 15, stamina: -20 }
        setFlags: { thirdParty: true, victimSupport: true }
        items:
          - { id: p07-c-content, points: 8, axis: content, refs: [nist-sp800-61r3] }
          - { id: p07-c-order, points: 8, axis: order, refs: [meti-csm-guideline] }
          - { id: p07-c-care, points: 8, axis: care, refs: [ppc-notify-person] }
          - { id: p07-c-record, points: 5, axis: record, refs: [jpcert-handling] }

  - id: p08-warning
    at: { day: 3, minutes: 960 }
    phase: organize
    sound: { se: [notify_chat] }
    text: { ja: '午後4時。半年前に社内の技術者が「VPN機器の更新とログ保全を優先してほしい」と送っていたメールが見つかった。当時、あなたは決裁していない。', en: '' }
    voices: [v08-boss, v08-coward, v08-ok]
    notable:
      - { id: note-warning, text: { ja: '半年前、社内技術者がVPN機器の更新とログ保全を指摘していた。', en: '' } }
    choices:
      - id: p08-hide
        text: { ja: 'メールの存在は公表せず、調査の対象からも外す。', en: '' }
        minutes: 60
        category: fatal
        points: -250
        refs: [meti-csm-guideline]
        gauges: { flame: 25, trust: -25 }
        setFlags: { hidWarning: true }
        delayed:
          - { afterPhases: 2, points: -100, gauges: { flame: 20, trust: -15 }, reason: { ja: '内部の指摘を隠したことが報道され、説明責任を問われた。', en: '' } }
        items:
          - { id: p08-a-record, points: -20, axis: record, refs: [meti-csm-guideline] }
          - { id: p08-a-content, points: -15, axis: content, refs: [meti-csm-guideline] }
          - { id: p08-a-care, points: -10, axis: care, refs: [meti-csm-guideline] }
      - id: p08-admit
        text: { ja: '調査に含め、公表文と会見で「事前の指摘を生かせなかった」と認める。', en: '' }
        minutes: 90
        category: maintain
        points: 30
        refs: [meti-csm-guideline]
        gauges: { flame: -10, trust: 10, stamina: -10 }
        setFlags: { admittedWarning: true }
        items:
          - { id: p08-b-content, points: 8, axis: content, refs: [meti-csm-guideline] }
          - { id: p08-b-wording, points: 5, axis: wording, refs: [meti-disclosure-guidance] }
      - id: p08-own
        text: { ja: '調査に含め、公表文と会見で認める。加えて、指摘者を責めず、生かせなかった責任は経営にあると明言する。', en: '' }
        minutes: 120
        category: recover
        points: 100
        refs: [meti-csm-guideline]
        gauges: { flame: -15, trust: 15, stamina: -10 }
        setFlags: { admittedWarning: true, protectedWhistleblower: true }
        items:
          - { id: p08-c-record, points: 10, axis: record, refs: [meti-csm-guideline] }
          - { id: p08-c-content, points: 8, axis: content, refs: [meti-csm-guideline] }
          - { id: p08-c-care, points: 8, axis: care, refs: [meti-csm-guideline] }

  - id: p09-vendor
    at: { day: 4, minutes: 600 }
    phase: investigate
    sound: { se: [mail_arrive] }
    text: { ja: '午前10時。VPN機器のベンダーが「弊社の製品に問題はありません。運用の問題です」と説明した。', en: '' }
    voices: [v09-vendor, v09-law, v09-ok]
    choices:
      - id: p09-accept
        text: { ja: 'ベンダーの主張をそのまま公表し、調査をベンダーに任せる。', en: '' }
        minutes: 60
