          - { id: 'tf-x-none', text: { ja: '版を管理せず変更も記録しないでおく', en: '' }, points: -8, axis: 'record', refs: ['jpcert-handling'], explain: { ja: '版を管理しないと、どの時点の事実を公表したか分からない。訂正の場面で根拠を示せず困る。', en: '' } }
