drafts:
  tech-factsheet:
    title: { ja: '技術ファクトシート', en: '' }
    slots:
      - id: 'confirmed'
        label: { ja: '確認できた事実', en: '' }
        options:
          - { id: 'tf-c-time', text: { ja: '発生と検知の日時を分けて書く', en: '' }, points: 5, axis: 'content', refs: ['ppc-report-prelim'], explain: { ja: '発生と検知を分ければ、潜伏期間の長さを正確に伝えられる。調査の進み具合も説明しやすい。', en: '' } }
          - { id: 'tf-c-merge', text: { ja: '発生と検知をまとめて書く', en: '' }, points: -8, axis: 'wording', refs: ['jpcert-handling'], explain: { ja: '発生と検知をまとめると、検知の遅れが伝わらず、対応の評価を誤らせる。潜伏期間も見えなくなる。', en: '' } }
      - id: 'uncertain'
        label: { ja: '不確実な点の書き方', en: '' }
        options:
          - { id: 'tf-u-confirm', text: { ja: 'すべて確認と断定して書く', en: '' }, points: -15, axis: 'wording', refs: ['meti-disclosure-guidance'], explain: { ja: '未確認の段階で断定すると、後から否定や訂正が必要になる。説明の信頼を損ない、訂正の繰り返しになる。', en: '' } }
          - { id: 'tf-u-split', text: { ja: '確認と可能性を分けて書く', en: '' }, points: 10, axis: 'wording', refs: ['meti-disclosure-guidance'], explain: { ja: '確認できたことと可能性を分ければ、誤った断定を避けられる。後から判明しても説明を維持しやすい。', en: '' } }
          - { id: 'tf-u-omit', text: { ja: '不確実な点を書かないでおく', en: '' }, points: -10, axis: 'wording', refs: ['ppc-report-prelim'], explain: { ja: '不確実な点を書かないと、調査の限界が伝わらない。後から追加の説明が必要になり、不信を招く。', en: '' } }
      - id: 'scope'
        label: { ja: '対象範囲', en: '' }
        options:
          - { id: 'tf-s-all', text: { ja: '退会済みと解約済みも含めて書く', en: '' }, points: 10, axis: 'content', refs: ['ppc-report-scope'], explain: { ja: '退会者や解約者まで含めれば、後から対象の漏れが判明しても訂正が要らない。通知の抜けも防げる。', en: '' } }
          - { id: 'tf-s-current', text: { ja: '現行プランの顧客だけを書く', en: '' }, points: -20, axis: 'content', refs: ['ppc-report-scope'], delayed: { afterPhases: 1, points: -20, reason: { ja: '対象の訂正が必要になった。', en: '' } }, explain: { ja: '現行の契約者だけに絞ると、退会者や解約者が対象から漏れる。後から追加の通知が必要になる。', en: '' } }
      - id: 'exposure'
        label: { ja: '漏れた可能性のある項目', en: '' }
        options:
          - { id: 'tf-e-vague', text: { ja: '項目を特定せず顧客情報の一部が漏れたとだけぼかして書く', en: '' }, points: -10, axis: 'content', refs: ['ppc-report-prelim'], explain: { ja: '項目をぼかすと、被害者は何を変えればよいか分からない。問い合わせが集中し、不安も解消されない。', en: '' } }
          - { id: 'tf-e-list', text: { ja: 'メールアドレス、ログイン履歴、請求情報、APIキーを列挙する', en: '' }, points: 10, axis: 'content', refs: ['ppc-report-prelim'], explain: { ja: '漏れた項目を具体的に示せば、被害者が自分で取るべき対策を判断できる。通知の実効性が高まる。', en: '' } }
      - id: 'evidence'
        label: { ja: '証拠保全の記載', en: '' }
        options:
          - { id: 'tf-v-hash', text: { ja: '取得したイメージのハッシュと保管場所を書く', en: '' }, points: 10, axis: 'record', refs: ['cissp-cbk-secops'], explain: { ja: 'ハッシュと保管場所を書けば、証拠の完全性を後から示せる。調査の信頼につながり、検証にも耐える。', en: '' } }
          - { id: 'tf-v-none', text: { ja: '証拠の保全には一切触れずに報告を書く', en: '' }, points: -8, axis: 'record', refs: ['jpcert-handling'], explain: { ja: '証拠の保全に触れないと、調査の前提が伝わらない。後から証拠の扱いを疑われ、説明が難しくなる。', en: '' } }
      - id: 'retention'
        label: { ja: 'ログの欠損', en: '' }
        options:
          - { id: 'tf-r-hide', text: { ja: '欠損に触れないでおく', en: '' }, points: -15, axis: 'record', refs: ['jpcert-handling'], explain: { ja: '欠損に触れないと、調査の限界を隠したことになる。後から判明すれば説明の信頼を失う。', en: '' } }
          - { id: 'tf-r-gap', text: { ja: '欠損した期間を明記する', en: '' }, points: 8, axis: 'content', refs: ['nist-sp800-61r3'], explain: { ja: '欠損した期間を明記すれば、調査の限界を正直に伝えられる。報告の信頼性はむしろ上がる。', en: '' } }
      - id: 'decision'
        label: { ja: '経営への決裁依頼', en: '' }
        options:
          - { id: 'tf-d-ask', text: { ja: '全停止と公表の時刻を決めてほしいと書く', en: '' }, points: 8, axis: 'order', refs: ['meti-csm-guideline'], explain: { ja: '何をいつまでに決めてほしいかを明示すれば、経営は判断しやすい。初動の速度が上がる。', en: '' } }
          - { id: 'tf-d-none', text: { ja: '経営への決裁の依頼は書かないでおく', en: '' }, points: -8, axis: 'order', refs: ['meti-csm-guideline'], explain: { ja: '決裁の依頼がないと、経営は何をすればよいか分からない。判断が遅れ、現場も動けない。', en: '' } }
      - id: 'contact'
        label: { ja: '技術窓口', en: '' }
        options:
          - { id: 'tf-w-main', text: { ja: '代表番号だけを書いて終えておく', en: '' }, points: -5, axis: 'care', refs: ['meti-csm-guideline'], explain: { ja: '代表番号だけでは、技術の確認に時間がかかる。夜間や休日にはつながらず、初動が遅れる。', en: '' } }
          - { id: 'tf-w-24h', text: { ja: 'SOCの直通番号と24時間の受付を書く', en: '' }, points: 8, axis: 'care', refs: ['ppc-notify-person'], explain: { ja: '直通番号と受付時間を示せば、法務や広報が技術者にすぐ確認できる。公表の判断も速くなる。', en: '' } }
      - id: 'record'
