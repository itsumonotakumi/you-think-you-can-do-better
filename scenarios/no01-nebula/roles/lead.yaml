# No.1 ネビュラクラウド / セキュリティ部門長（CSIRTリーダー）ロール
# 判断ポイント21、細目は choices[].items と drafts の合計で80以上。
# 視点: 技術的な状況と経営の意向の両方を見る執行役員セキュリティ責任者。
#       体制づくり、証拠の保全、外部専門家の手配、経営への上申が仕事。
estimateMinutes: 45
intro: { ja: 'あなたはネビュラクラウドの執行役員セキュリティ責任者で、CSIRTのリーダー。技術の言葉を経営の言葉に訳し、現場と経営の間で判断を組み立てる。19時45分のアラートから、あなたの四週間が始まる。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-ppc-prelim
    ref: ppc-report-prelim
    label: { ja: '個人情報保護委員会への速報', en: '' }
    points: -150
    doneFlag: ppcPrelimFiled
  - id: dl-ppc-final
    ref: ppc-report-final-malicious
    label: { ja: '個人情報保護委員会への確報', en: '' }
    points: -100
    doneFlag: ppcFinalFiled
events:
  - id: ev-first-night
    at: { day: 1, minutes: 120 }
    voices: [v-ev-night]
    gauges: { stamina: -5 }
    caption: { ja: '現場から「このまま朝まで起きています」と連絡が入る。', en: '' }
  - id: ev-morning-news
    at: { day: 2, minutes: 420 }
    voices: [v-ev-news]
    gauges: { flame: 5 }
    sound: { se: [notify_news] }
    caption: { ja: '朝のニュースが「大手ホスティングで障害」と報じた。', en: '' }
  - id: ev-phone-silence
    at: { day: 8, minutes: 600 }
    voices: [v-ev-silence]
    gauges: { trust: -5 }
    caption: { ja: '問い合わせ窓口の電話が、三日続けてつながらないままになっている。', en: '' }
points:
  - id: 'p01-alert'
    at: { day: 0, minutes: 1185 }
    phase: 'detect'
    text: { ja: '19時45分。SOCのアラートが三件、同時に上がった。顧客サーバー三台で不審なプロセスが動き、外部へ定期的に通信している。同じセグメントには数百台の顧客サーバーがぶら下がっている。', en: '' }
    sound: { se: ['notify_chat'] }
    voices: ['v01-boss', 'v01-field', 'v01-ok']
    notable:
      - { id: 'note-first-alert', text: { ja: '19時45分、SOCが三台の不審な通信を検知。同じセグメントに数百台。', en: '' } }
    choices:
      - id: 'p01-triage-impact'
        text: { ja: '隔離と保全に加え、顧客影響の一次評価を三十分で作り広報と法務に渡す。', en: '' }
        minutes: 75
        category: 'recover'
        points: 100
        refs: ['jpcert-handling', 'meti-csm-guideline']
        gauges: { damage: -10, stamina: -15, trust: 10 }
        setFlags: { triageStarted: true, impactAssessed: true }
        explain: { ja: '初動に加えて顧客影響の評価まで先に作っている。広報と法務が同じ材料で動け、公表の判断も速くなる。', en: '' }
        items:
          - { id: 'p01-d-order', points: 5, axis: 'order', refs: ['meti-csm-guideline'] }
          - { id: 'p01-d-care', points: 8, axis: 'care', refs: ['meti-csm-guideline'] }
          - { id: 'p01-d-record', points: 8, axis: 'record', refs: ['jpcert-handling'] }
      - id: 'p01-wait'
        text: { ja: '誤検知の可能性が高いと判断し、明日の定例会議で報告することにする。', en: '' }
        minutes: 120
        category: 'hurt'
        points: -120
        refs: ['jpcert-handling']
        gauges: { flame: 10, trust: -5 }
        coward: true
        setFlags: { delayedTriage: true }
        delayed:
          - { afterPhases: 1, points: -40, gauges: { damage: 15 }, reason: { ja: '隔離が遅れた三台から、同じセグメントへ横展開が始まった。', en: '' } }
        explain: { ja: '誤検知と決めつけて待つ間に、同じセグメントへ横展開が進む。三台同時の検知は偶然ではなく、初動を遅らせる理由にならない。', en: '' }
        items:
          - { id: 'p01-a-time', points: -10, axis: 'time', refs: ['jpcert-handling'] }
          - { id: 'p01-a-order', points: -8, axis: 'order', refs: ['jpcert-handling'] }
      - id: 'p01-solo'
        text: { ja: '自分でサーバーに入り、不審なプロセスの正体を直接確かめる。', en: '' }
        minutes: 90
        category: 'hurt'
        points: -60
        refs: ['nist-sp800-61r3']
        gauges: { stamina: -10, trust: -5 }
        explain: { ja: '自分で確かめる姿勢は評価できるが、指揮と経営への報告が遅れる。CSIRTを集める前に個人で動くと全体が止まる。', en: '' }
        items:
          - { id: 'p01-c-order', points: -10, axis: 'order', refs: ['nist-sp800-61r3'] }
          - { id: 'p01-c-record', points: -8, axis: 'record', refs: ['nist-sp800-61r3'] }
      - id: 'p01-triage'
        text: { ja: 'CSIRTを招集し、三台を隔離して痕跡を保全し、経営へ第一報を入れる。', en: '' }
        minutes: 45
        category: 'maintain'
        points: 20
        refs: ['jpcert-handling', 'nist-sp800-61r3']
        gauges: { damage: -5, stamina: -10, trust: 5 }
        setFlags: { triageStarted: true }
        explain: { ja: '招集と隔離、痕跡の保全、経営への報告を同時に進める初動は適切。被害の拡大と説明の遅れを防げる。', en: '' }
        items:
          - { id: 'p01-b-time', points: 5, axis: 'time', refs: ['jpcert-handling'] }
          - { id: 'p01-b-order', points: 8, axis: 'order', refs: ['nist-sp800-61r3'] }
          - { id: 'p01-b-record', points: 8, axis: 'record', refs: ['jpcert-handling'] }
    lesson: { ja: '三台同時の検知は誤検知では済まない可能性が高い。CSIRTを招集し、隔離と痕跡の保全を同時に進め、経営へ第一報を入れる。さらに顧客影響の一次評価を早く作れば、広報と法務が同じ材料で動け、公表の判断も速くなる。', en: '' }
  - id: 'p02-preserve'
    at: { day: 0, minutes: 1290 }
    phase: 'contain'
    text: { ja: '21時30分。現場から「早く初期化して作り直したい」と声が上がる。メモリには実行中の不審なプログラムが残り、ディスクには侵入に使われた形跡がある。', en: '' }
    sound: { se: ['phone_ring'] }
    voices: ['v02-expert', 'v02-ok']
    choices:
      - id: 'p02-wipe'
        text: { ja: '初期化して作り直し、証拠より復旧を優先する方針を取る。', en: '' }
        minutes: 120
        category: 'fatal'
        points: -250
        refs: ['nist-sp800-61r3']
        gauges: { damage: 20, trust: -20 }
        setFlags: { evidenceLost: true }
        delayed:
          - { afterPhases: 2, points: -80, gauges: { flame: 15 }, reason: { ja: '侵入経路も漏えい範囲も分からないまま、説明だけを求められた。', en: '' } }
        explain: { ja: '初期化すると侵入経路も漏えい範囲も分からなくなる。復旧を急ぐほど、後から説明できない事態になる。', en: '' }
        items:
          - { id: 'p02-a-record', points: -20, axis: 'record', refs: ['nist-sp800-61r3'] }
          - { id: 'p02-a-content', points: -15, axis: 'content', refs: ['nist-sp800-61r3'] }
          - { id: 'p02-a-order', points: -10, axis: 'order', refs: ['cissp-cbk-secops'] }
      - id: 'p02-image-chain'
        text: { ja: '三台を保全し、影響が疑われる端末も同じ手順で保全して管理の連鎖を残す。', en: '' }
        minutes: 180
        category: 'recover'
        points: 100
        refs: ['nist-sp800-61r3', 'cissp-cbk-secops']
        gauges: { damage: -10, stamina: -20, trust: 5 }
        setFlags: { evidencePreserved: true, evidenceChain: true }
        explain: { ja: '影響が疑われる端末まで同じ手順で保全し、管理の連鎖を残している。証拠の扱いを後から検証できる。', en: '' }
        items:
          - { id: 'p02-d-record', points: 10, axis: 'record', refs: ['cissp-cbk-secops'] }
          - { id: 'p02-d-content', points: 8, axis: 'content', refs: ['nist-sp800-61r3'] }
          - { id: 'p02-d-order', points: 5, axis: 'order', refs: ['nist-sp800-61r3'] }
      - id: 'p02-shutdown'
        text: { ja: '全台の電源を落とし、調査は落ち着いてから始めることにする。', en: '' }
        minutes: 60
        category: 'hurt'
        points: -100
        refs: ['nist-sp800-61r3']
        gauges: { damage: 10, stamina: 5 }
        explain: { ja: '電源を落とすとメモリ上の痕跡が失われる。調査を後回しにすると、手口の特定が難しくなる。', en: '' }
        items:
          - { id: 'p02-b-record', points: -10, axis: 'record', refs: ['nist-sp800-61r3'] }
          - { id: 'p02-b-time', points: -8, axis: 'time', refs: ['jpcert-handling'] }
      - id: 'p02-image'
        text: { ja: '影響した三台のメモリとディスクを保全し、ハッシュと保管場所を記録する。', en: '' }
        minutes: 120
        category: 'maintain'
        points: 30
        refs: ['nist-sp800-61r3', 'jpcert-handling']
        gauges: { damage: -10, stamina: -15, trust: 5 }
        setFlags: { evidencePreserved: true }
        explain: { ja: 'メモリとディスクを保全し、ハッシュと保管場所を記録するのは基本。証拠の完全性を後から示せる。', en: '' }
        items:
          - { id: 'p02-c-record', points: 10, axis: 'record', refs: ['nist-sp800-61r3'] }
          - { id: 'p02-c-order', points: 8, axis: 'order', refs: ['cissp-cbk-secops'] }
          - { id: 'p02-c-time', points: 5, axis: 'time', refs: ['jpcert-handling'] }
    lesson: { ja: '復旧を急ぐほど証拠を失いやすくなる。初期化や電源断の前に、メモリとディスクを保全し、ハッシュと保管場所を記録する。影響が疑われる端末まで同じ手順で扱い、管理の連鎖を残せば、後から証拠の扱いを検証できる。', en: '' }
  - id: 'p03-escalate'
    at: { day: 0, minutes: 1350 }
    phase: 'organize'
    text: { ja: '22時30分。経営への第一報をまとめる時間。社長は影響の大きさと、いま決めてほしいことを知りたがっている。', en: '' }
    sound: { se: ['phone_ring'] }
    voices: ['v03-boss', 'v03-flattery', 'v03-ok']
    choices:
      - id: 'p03-hold'
        text: { ja: '影響が出てから上申すると決め、今は調査だけに集中する。', en: '' }
        minutes: 60
        category: 'hurt'
        points: -120
        refs: ['meti-csm-guideline']
        gauges: { flame: 10, trust: -10 }
        coward: true
        setFlags: { lateEscalation: true }
        delayed:
          - { afterPhases: 1, points: -50, gauges: { damage: 10, trust: -10 }, reason: { ja: '経営の決裁が遅れ、全停止の判断が四時間ずれた。', en: '' } }
        explain: { ja: '影響が出てからでは経営の決裁が間に合わない。初動の段階で事実と選択肢を渡すことが、判断の速度を生む。', en: '' }
        items:
          - { id: 'p03-a-order', points: -10, axis: 'order', refs: ['meti-csm-guideline'] }
          - { id: 'p03-a-time', points: -10, axis: 'time', refs: ['meti-csm-guideline'] }
      - id: 'p03-jargon'
        text: { ja: '調査ログをそのまま貼り付けて送り、技術者なら分かると考える。', en: '' }
        minutes: 45
        category: 'hurt'
        points: -50
        refs: ['meti-csm-guideline']
        gauges: { trust: -5 }
        explain: { ja: '技術ログをそのまま渡すと、経営は何を決めればよいか分からない。翻訳のない報告は判断を止める。', en: '' }
        items:
          - { id: 'p03-b-order', points: -8, axis: 'order', refs: ['meti-csm-guideline'] }
          - { id: 'p03-b-wording', points: -8, axis: 'wording', refs: ['meti-csm-guideline'] }
      - id: 'p03-translate-decision'
        text: { ja: '上申に加え、止める判断の選択肢ごとに顧客影響と復旧時間を添える。', en: '' }
        minutes: 75
        category: 'recover'
        points: 100
        refs: ['meti-csm-guideline']
        gauges: { trust: 10, stamina: -10 }
        setFlags: { escalated: true, optionsPrepared: true }
        explain: { ja: '選択肢ごとに顧客影響と復旧時間を示している。経営は比較して決められ、判断の記録も残る。', en: '' }
        items:
          - { id: 'p03-d-order', points: 8, axis: 'order', refs: ['meti-csm-guideline'] }
          - { id: 'p03-d-content', points: 8, axis: 'content', refs: ['nist-sp800-61r3'] }
          - { id: 'p03-d-care', points: 5, axis: 'care', refs: ['meti-csm-guideline'] }
      - id: 'p03-translate'
        text: { ja: '分かった事実、不明な点、決めてほしいことを一枚に分けて上申する。', en: '' }
        minutes: 45
        category: 'maintain'
        points: 20
        refs: ['meti-csm-guideline', 'jpcert-handling']
        gauges: { trust: 5, stamina: -5 }
        setFlags: { escalated: true }
        explain: { ja: '事実と不明点と決裁事項を分けた一枚の上申は、経営が判断しやすい。初動の速度と質の両方が上がる。', en: '' }
        items:
          - { id: 'p03-c-order', points: 8, axis: 'order', refs: ['meti-csm-guideline'] }
          - { id: 'p03-c-wording', points: 8, axis: 'wording', refs: ['meti-csm-guideline'] }
          - { id: 'p03-c-record', points: 5, axis: 'record', refs: ['jpcert-handling'] }
    lesson: { ja: '経営への第一報は、技術ログの翻訳ではなく判断材料の提供になる。分かった事実、不明な点、決めてほしいことを分け、止めるかどうかの選択肢ごとに顧客影響と復旧時間を添える。これが初動の速度を決める。', en: '' }
  - id: 'p04-command'
    at: { day: 1, minutes: 30 }
    phase: 'organize'
    text: { ja: '0時30分。対策本部の机が並んだ。誰が指揮を執り、誰が記録し、誰が外部と連絡するか。まだ決めていない。', en: '' }
    sound: { se: ['notify_chat'] }
    voices: ['v04-flattery', 'v04-public', 'v04-ok']
    choices:
      - id: 'p04-solo'
        text: { ja: '自分ひとりが指揮も調査も外部連絡も全部持ち、そのほうが速いと考える。', en: '' }
        minutes: 60
        category: 'hurt'
        points: -80
        refs: ['cissp-cbk-secops']
        gauges: { stamina: -15, trust: -5 }
        explain: { ja: '一人で全部を持つと、どこかが必ず止まる。指揮と調査と外部連絡は同時に走るため、分担が要る。', en: '' }
        items:
          - { id: 'p04-a-order', points: -10, axis: 'order', refs: ['cissp-cbk-secops'] }
          - { id: 'p04-a-care', points: -8, axis: 'care', refs: ['cissp-cbk-secops'] }
      - id: 'p04-names'
        text: { ja: '役割だけを決めて記録係は置かず、手が足りないまま進める。', en: '' }
        minutes: 45
        category: 'hurt'
        points: -50
        refs: ['jpcert-handling']
        gauges: { stamina: -5 }
        explain: { ja: '記録係を置かないと、判断の時刻と理由が残らない。後から検証も説明もできなくなる。', en: '' }
        items:
          - { id: 'p04-b-record', points: -10, axis: 'record', refs: ['jpcert-handling'] }
          - { id: 'p04-b-order', points: -8, axis: 'order', refs: ['cissp-cbk-secops'] }
      - id: 'p04-roles'
        text: { ja: '指揮、調査、記録、外部連絡、経営窓口を分けて当番表を作る。', en: '' }
        minutes: 60
        category: 'maintain'
        points: 30
        refs: ['cissp-cbk-secops', 'jpcert-handling']
        gauges: { stamina: 5, trust: 5 }
        setFlags: { commandStructure: true }
        explain: { ja: '役割を分けて当番表を作るのは適切。誰が何を決めるかが明確になり、現場の迷いが減る。', en: '' }
        items:
          - { id: 'p04-c-order', points: 10, axis: 'order', refs: ['cissp-cbk-secops'] }
          - { id: 'p04-c-record', points: 8, axis: 'record', refs: ['jpcert-handling'] }
      - id: 'p04-roles-deputy'
        text: { ja: '役割分担に加え、指揮の代行を決め、判断の時刻と理由を定時に記録する。', en: '' }
        minutes: 90
        category: 'recover'
        points: 100
        refs: ['cissp-cbk-secops', 'meti-csm-guideline']
        gauges: { stamina: 10, trust: 10 }
        setFlags: { commandStructure: true, decisionLog: true }
        explain: { ja: '代行と記録の仕組みまで整えている。指揮が不在でも止まらず、判断の過程を後からたどれる。', en: '' }
        items:
          - { id: 'p04-d-order', points: 10, axis: 'order', refs: ['cissp-cbk-secops'] }
          - { id: 'p04-d-record', points: 10, axis: 'record', refs: ['jpcert-handling'] }
          - { id: 'p04-d-care', points: 8, axis: 'care', refs: ['ipa-sme-guideline'] }
    lesson: { ja: '対策本部では、指揮、調査、記録、外部連絡、経営窓口を分ける。記録係を置かなければ判断の時刻と理由が残らず、後から検証できない。指揮の代行まで決めておけば、長時間の対応でも止まらない。', en: '' }
  - id: 'p05-stop-rec'
    at: { day: 1, minutes: 180 }
    phase: 'organize'
    text: { ja: '午前3時。全プランを止めるかの判断材料を、経営に出す時間。止めれば顧客の取引も止まる。止めなければ、同じセグメントの数百台が危ない。', en: '' }
    sound: { se: ['notify_news'] }
    voices: ['v05-public', 'v05-coward', 'v05-ok']
    popular: { choiceId: 'p05-partial', percent: 61 }
    choices:
      - id: 'p05-full-rec'
        text: { ja: '全停止を推薦し、顧客が今すぐすべき行動を同時に告知する案を添える。', en: '' }
        minutes: 90
        category: 'recover'
        points: 100
        refs: ['meti-disclosure-guidance', 'ppc-notify-person']
        gauges: { damage: -20, flame: 10, trust: 10, stamina: -10 }
        setFlags: { stopRecommended: true, customerGuidance: true }
        explain: { ja: '停止と顧客の行動をセットで示している。被害の拡大を防ぎながら、顧客の不安にも応えられる。', en: '' }
        items:
          - { id: 'p05-c-content', points: 8, axis: 'content', refs: ['nist-sp800-61r3'] }
          - { id: 'p05-c-care', points: 10, axis: 'care', refs: ['ppc-notify-person'] }
          - { id: 'p05-c-order', points: 8, axis: 'order', refs: ['meti-csm-guideline'] }
      - id: 'p05-partial'
        text: { ja: '被害が出た三台だけ止め、同じ認証情報の他のサーバーはそのままにする。', en: '' }
        minutes: 60
        category: 'hurt'
        points: -100
        refs: ['nist-sp800-61r3']
        gauges: { damage: 20, flame: 5 }
        delayed:
          - { afterPhases: 1, points: -60, gauges: { damage: 15 }, reason: { ja: '止めなかったサーバーでも同じ認証情報が使われ、被害が広がった。', en: '' } }
        explain: { ja: '同じ認証情報を使う数百台を残すと、被害は確実に広がる。部分停止は安全に見えて最も危険な選択になる。', en: '' }
        items:
          - { id: 'p05-a-content', points: -10, axis: 'content', refs: ['nist-sp800-61r3'] }
          - { id: 'p05-a-care', points: -8, axis: 'care', refs: ['ppc-notify-person'] }
      - id: 'p05-wait-ceo'
        text: { ja: '経営の決裁を待ち、自分からは全停止を推薦しないでおく。', en: '' }
        minutes: 90
        category: 'hurt'
        points: -60
