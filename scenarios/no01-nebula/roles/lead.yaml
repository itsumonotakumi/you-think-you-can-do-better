      - id: 'clean'
        label: { ja: 'クリーンな環境', en: '' }
        options:
          - { id: 'rp-c-new', text: { ja: '新規に構築しイメージを検証する', en: '' }, points: 10, axis: 'content', refs: ['nist-sp800-61r3'], explain: { ja: '新規構築とイメージの検証で、残った仕掛けを持ち込まずに済む。安全な復旧の前提になる。', en: '' } }
          - { id: 'rp-c-reuse', text: { ja: '既存の環境をそのまま使う', en: '' }, points: -15, axis: 'content', refs: ['nist-sp800-61r3'], explain: { ja: '既存環境をそのまま使うと、残った認証情報や仕掛けが戻る。再び不正な通信が出る危険が高い。', en: '' } }
      - id: 'backup'
        label: { ja: 'バックアップの検証', en: '' }
        options:
          - { id: 'rp-b-use', text: { ja: '検証せずにバックアップを戻す', en: '' }, points: -10, axis: 'content', refs: ['nist-sp800-61r3'], explain: { ja: '検証せずに戻すと、壊れたデータや古い設定をそのまま復旧してしまう。復旧後の再停止にもつながる。', en: '' } }
          - { id: 'rp-b-test', text: { ja: '復元テストと整合性の確認をする', en: '' }, points: 10, axis: 'content', refs: ['cissp-cbk-secops'], explain: { ja: '復元テストと整合性の確認をすれば、壊れたデータを戻す事故を防げる。戻した後の検証も速くなる。', en: '' } }
      - id: 'creds'
        label: { ja: '資格情報', en: '' }
        options:
          - { id: 'rp-k-all', text: { ja: 'APIキーとトークン、パスワードをすべて失効する', en: '' }, points: 10, axis: 'order', refs: ['cissp-cbk-secops'], explain: { ja: 'すべての資格情報を失効させれば、攻撃者が持つ鍵を使えなくできる。復旧の前提になる。', en: '' } }
          - { id: 'rp-k-some', text: { ja: '分かっている認証情報だけを変えて済ませる', en: '' }, points: -10, axis: 'order', refs: ['cissp-cbk-secops'], explain: { ja: '分かっている分だけを変えると、見落とした鍵が残る。再び侵入される入口になり、対策が後手になる。', en: '' } }
      - id: 'monitor'
        label: { ja: '監視', en: '' }
        options:
          - { id: 'rp-m-normal', text: { ja: '通常の監視体制にすぐ戻す', en: '' }, points: -10, axis: 'content', refs: ['nist-sp800-61r3'], explain: { ja: '復旧直後に通常監視へ戻すと、再発の兆候を見逃しやすい。強化を続ける期間を決めてから戻したい。', en: '' } }
          - { id: 'rp-m-24h', text: { ja: '強化監視の期間と基準を決める', en: '' }, points: 8, axis: 'order', refs: ['nist-sp800-61r3'], explain: { ja: '期間と基準を決めれば、いつ通常に戻すかを判断できる。監視の緩め忘れも防ぎ、再発の兆候を捉えられる。', en: '' } }
      - id: 'sequence'
        label: { ja: '再開の順番', en: '' }
        options:
          - { id: 'rp-s-step', text: { ja: '社内、限定顧客、全体の順に戻す', en: '' }, points: 8, axis: 'order', refs: ['nist-sp800-61r3'], explain: { ja: '段階を踏めば、問題が起きた範囲を限定できる。全体への影響を抑えながら安全に戻せる。', en: '' } }
          - { id: 'rp-s-all', text: { ja: '全顧客の環境を一斉に戻す', en: '' }, points: -10, axis: 'order', refs: ['nist-sp800-61r3'], explain: { ja: '一斉に戻すと、問題が起きたときに全顧客へ影響が広がる。切り分けも難しくなり、再停止の危険が高い。', en: '' } }
      - id: 'rollback'
        label: { ja: '切り戻しの条件', en: '' }
        options:
          - { id: 'rp-r-none', text: { ja: '切り戻しの条件は決めずに進める', en: '' }, points: -8, axis: 'content', refs: ['cissp-cbk-secops'], explain: { ja: '条件を決めないと、異常が出ても止める判断が遅れる。被害が広がってからでは間に合わない。', en: '' } }
          - { id: 'rp-r-rule', text: { ja: '異常を検知したら自動で止める条件を書く', en: '' }, points: 8, axis: 'content', refs: ['cissp-cbk-secops'], explain: { ja: '自動で止める条件を決めておけば、再発の兆候に素早く対応できる。被害の拡大を抑えられる。', en: '' } }
      - id: 'verify'
        label: { ja: '外部の検証', en: '' }
        options:
          - { id: 'rp-v-third', text: { ja: '第三者の検証を経てから戻す', en: '' }, points: 8, axis: 'record', refs: ['cissp-cbk-secops'], explain: { ja: '第三者の検証を経れば、自社の見落としを補える。顧客への説明の根拠にもなり、再開の信頼が高まる。', en: '' } }
          - { id: 'rp-v-self', text: { ja: '自社だけで判断して戻す', en: '' }, points: -8, axis: 'record', refs: ['cissp-cbk-secops'], explain: { ja: '自社だけで判断すると、見落としに気づけない。第三者による確認がないと説明の説得力も弱い。', en: '' } }
      - id: 'comms'
        label: { ja: '顧客への説明', en: '' }
        options:
          - { id: 'rp-m-safe', text: { ja: '安全ですとだけ書いて終える', en: '' }, points: -10, axis: 'care', refs: ['meti-disclosure-guidance'], explain: { ja: '安全ですとだけ書いても、何を確認したか分からない。不安が残り、問い合わせも減らない。', en: '' } }
          - { id: 'rp-m-explain', text: { ja: '何を確認したかを具体的に書く', en: '' }, points: 8, axis: 'care', refs: ['ppc-notify-person'], explain: { ja: '確認した内容を具体的に書けば、顧客は安全性を自分で判断できる。納得につながり、問い合わせも減る。', en: '' } }
