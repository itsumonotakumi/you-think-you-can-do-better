# No.1 ネビュラクラウド / セキュリティ部門長（CSIRTリーダー）ロール
# 判断ポイント21、細目は choices[].items と drafts の合計で80以上。
# 視点: 技術的な状況と経営の意向の両方を見る執行役員セキュリティ責任者。
#       体制づくり、証拠の保全、外部専門家の手配、経営への上申が仕事。
estimateMinutes: 45
intro: { ja: 'あなたはネビュラクラウドの執行役員セキュリティ責任者で、CSIRTのリーダー。技術の言葉を経営の言葉に訳し、現場と経営の間で判断を組み立てる。19時45分のアラートから、あなたの四週間が始まる。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-ppc-prelim
    ref: ppc-report-prelim
    label: { ja: '個人情報保護委員会への速報', en: '' }
    points: -150
    doneFlag: ppcPrelimFiled
  - id: dl-ppc-final
    ref: ppc-report-final-malicious
    label: { ja: '個人情報保護委員会への確報', en: '' }
    points: -100
    doneFlag: ppcFinalFiled
events:
  - id: ev-first-night
    at: { day: 1, minutes: 120 }
    voices: [v-ev-night]
    gauges: { stamina: -5 }
    caption: { ja: '現場から「このまま朝まで起きています」と連絡が入る。', en: '' }
  - id: ev-morning-news
    at: { day: 2, minutes: 420 }
    voices: [v-ev-news]
    gauges: { flame: 5 }
    sound: { se: [notify_news] }
    caption: { ja: '朝のニュースが「大手ホスティングで障害」と報じた。', en: '' }
  - id: ev-phone-silence
    at: { day: 8, minutes: 600 }
    voices: [v-ev-silence]
    gauges: { trust: -5 }
    caption: { ja: '問い合わせ窓口の電話が、三日続けてつながらないままになっている。', en: '' }
points:
  - id: p01-alert
    at: { day: 0, minutes: 1185 }
    phase: detect
    sound: { se: [notify_chat] }
    text: { ja: '19時45分。SOCのアラートが三件、同時に上がった。顧客サーバー三台で不審なプロセスが動き、外部へ定期的に通信している。同じセグメントには五百台の顧客サーバーがぶら下がっている。', en: '' }
    voices: [v01-boss, v01-field, v01-ok]
    notable:
      - { id: note-first-alert, text: { ja: '19時45分、SOCが三台の不審な通信を検知。同じセグメントに五百台。', en: '' } }
    choices:
      - id: p01-wait
        text: { ja: '誤検知の可能性が高いと判断し、明日の定例会議で報告する。', en: '' }
        minutes: 120
        category: hurt
        points: -120
        refs: [jpcert-handling]
        gauges: { flame: 10, trust: -5 }
        coward: true
        setFlags: { delayedTriage: true }
        delayed:
          - { afterPhases: 1, points: -40, gauges: { damage: 15 }, reason: { ja: '隔離が遅れた三台から、同じセグメントへ横展開が始まった。', en: '' } }
        items:
          - { id: p01-a-time, points: -10, axis: time, refs: [jpcert-handling] }
          - { id: p01-a-order, points: -8, axis: order, refs: [jpcert-handling] }
      - id: p01-solo
        text: { ja: '自分でサーバーに入り、不審なプロセスの正体を確かめる。', en: '' }
        minutes: 90
        category: hurt
        points: -60
        refs: [nist-sp800-61r3]
        gauges: { stamina: -10, trust: -5 }
        items:
          - { id: p01-c-order, points: -10, axis: order, refs: [nist-sp800-61r3] }
          - { id: p01-c-record, points: -8, axis: record, refs: [nist-sp800-61r3] }
      - id: p01-triage
        text: { ja: 'CSIRTを招集し、三台をネットワークから隔離する。メモリとログを保全し、経営へ第一報を入れる。', en: '' }
        minutes: 45
        category: maintain
        points: 20
        refs: [jpcert-handling, nist-sp800-61r3]
        gauges: { damage: -5, stamina: -10, trust: 5 }
        setFlags: { triageStarted: true }
        items:
          - { id: p01-b-time, points: 5, axis: time, refs: [jpcert-handling] }
          - { id: p01-b-order, points: 8, axis: order, refs: [nist-sp800-61r3] }
          - { id: p01-b-record, points: 8, axis: record, refs: [jpcert-handling] }
      - id: p01-triage-impact
        text: { ja: '招集と隔離、証拠の保全に加え、顧客影響の一次評価を三十分で作り、広報と法務に同時に渡す。', en: '' }
        minutes: 75
        category: recover
        points: 100
        refs: [jpcert-handling, meti-csm-guideline]
        gauges: { damage: -10, stamina: -15, trust: 10 }
        setFlags: { triageStarted: true, impactAssessed: true }
        items:
          - { id: p01-d-order, points: 5, axis: order, refs: [meti-csm-guideline] }
          - { id: p01-d-care, points: 8, axis: care, refs: [meti-csm-guideline] }
          - { id: p01-d-record, points: 8, axis: record, refs: [jpcert-handling] }

  - id: p02-preserve
    at: { day: 0, minutes: 1290 }
    phase: contain
    sound: { se: [phone_ring] }
    text: { ja: '21時30分。現場から「早く初期化して作り直したい」と声が上がる。メモリには実行中の不審なプログラムが残り、ディスクには侵入に使われた形跡がある。', en: '' }
    voices: [v02-expert, v02-ok]
    choices:
      - id: p02-wipe
        text: { ja: '初期化して作り直す。証拠より復旧を優先する。', en: '' }
        minutes: 120
        category: fatal
        points: -250
        refs: [nist-sp800-61r3]
        gauges: { damage: 20, trust: -20 }
        setFlags: { evidenceLost: true }
        delayed:
          - { afterPhases: 2, points: -80, gauges: { flame: 15 }, reason: { ja: '侵入経路も漏えい範囲も分からないまま、説明だけを求められた。', en: '' } }
        items:
          - { id: p02-a-record, points: -20, axis: record, refs: [nist-sp800-61r3] }
          - { id: p02-a-content, points: -15, axis: content, refs: [nist-sp800-61r3] }
          - { id: p02-a-order, points: -10, axis: order, refs: [cissp-cbk-secops] }
      - id: p02-shutdown
        text: { ja: '全台の電源を落とし、調査は落ち着いてからにする。', en: '' }
        minutes: 60
        category: hurt
        points: -100
        refs: [nist-sp800-61r3]
        gauges: { damage: 10, stamina: 5 }
        items:
          - { id: p02-b-record, points: -10, axis: record, refs: [nist-sp800-61r3] }
          - { id: p02-b-time, points: -8, axis: time, refs: [jpcert-handling] }
      - id: p02-image
        text: { ja: '影響した三台のメモリとディスクのイメージを取得し、ハッシュ値と保管場所を記録してから隔離を続ける。', en: '' }
        minutes: 120
        category: maintain
        points: 30
        refs: [nist-sp800-61r3, jpcert-handling]
        gauges: { damage: -10, stamina: -15, trust: 5 }
        setFlags: { evidencePreserved: true }
        items:
          - { id: p02-c-record, points: 10, axis: record, refs: [nist-sp800-61r3] }
          - { id: p02-c-order, points: 8, axis: order, refs: [cissp-cbk-secops] }
          - { id: p02-c-time, points: 5, axis: time, refs: [jpcert-handling] }
      - id: p02-image-chain
        text: { ja: 'イメージの取得に加え、影響が疑われる端末も同じ手順で保全し、取得の手順と担当を管理の連鎖として記録に残す。', en: '' }
        minutes: 180
        category: recover
        points: 100
        refs: [nist-sp800-61r3, cissp-cbk-secops]
        gauges: { damage: -10, stamina: -20, trust: 5 }
        setFlags: { evidencePreserved: true, evidenceChain: true }
        items:
          - { id: p02-d-record, points: 10, axis: record, refs: [cissp-cbk-secops] }
          - { id: p02-d-content, points: 8, axis: content, refs: [nist-sp800-61r3] }
          - { id: p02-d-order, points: 5, axis: order, refs: [nist-sp800-61r3] }

