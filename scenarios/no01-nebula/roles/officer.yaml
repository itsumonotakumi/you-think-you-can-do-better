  - { id: v06-insider, media: board, misleading: true, type: fake-insider, text: { ja: '中の人だけど、加盟店のデータは全部持っていかれている。今すぐ全部公表しろ。', en: '' }, trigger: { at: point } }
  - { id: v06-past, media: boss, misleading: true, type: past-success, text: { ja: '前の障害は範囲を絞って収まった。今回も同じでいい。', en: '' }, trigger: { at: point } }
