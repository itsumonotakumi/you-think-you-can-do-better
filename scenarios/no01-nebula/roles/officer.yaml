    voices: [v-ev-card]
    gauges: { flame: 5 }
    sound: { se: [phone_ring] }
    caption: { ja: 'カード会社から、決済データの扱いについて説明を求められた。', en: '' }
  - id: ev-parent-board
    at: { day: 2, minutes: 1080 }
    voices: [v-ev-board]
    gauges: { flame: 5 }
    caption: { ja: '親会社の臨時取締役会が開かれた。子会社の報告はまだ上がっていない。', en: '' }
  - id: ev-merchant-churn
    at: { day: 8, minutes: 600 }
    voices: [v-ev-churn]
    gauges: { flame: 10 }
    sound: { se: [notify_news] }
    caption: { ja: '大口の加盟店が、代替の決済代行の検討を始めた。', en: '' }
