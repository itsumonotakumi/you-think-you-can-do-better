  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-ppc-prelim
    ref: ppc-report-prelim
    label: { ja: 'グループ会社分の漏えい等報告（速報）', en: '' }
    points: -150
    doneFlag: ppcPrelimFiled
