# No.1 ネビュラクラウド / 役員・グループ会社社長ロール
# プレイヤーは子会社ネビュラ・ペイメントサービスの社長。親会社への報告と、自社の加盟店を守る判断を扱う。
# 判断ポイント16、細目は choices[].items と drafts の合計で80以上。
estimateMinutes: 35
intro: { ja: 'あなたはネビュラクラウドのグループ会社、ネビュラ・ペイメントサービス株式会社の代表取締役社長。グループ共通のネットワークが攻撃され、自社の加盟店データも危うい。親会社にどこまで報告し、自社の顧客をどこまで守れるか。20時15分の電話から、あなたの判断が始まる。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-ppc-prelim
    ref: ppc-report-prelim
    label: { ja: 'グループ会社分の漏えい等報告（速報）', en: '' }
    points: -150
    doneFlag: ppcPrelimFiled
  - id: dl-ppc-final
    ref: ppc-report-final-malicious
    label: { ja: 'グループ会社分の漏えい等報告（確報）', en: '' }
    points: -150
    doneFlag: ppcFinalFiled
events:
  - id: ev-card-inquiry
    at: { day: 1, minutes: 720 }
    voices: [v-ev-card]
    gauges: { flame: 5 }
    sound: { se: [phone_ring] }
    caption: { ja: 'カード会社から、決済データの扱いについて説明を求められた。', en: '' }
  - id: ev-parent-board
    at: { day: 2, minutes: 1080 }
    when: { flags: { parentReportFiled: false } }
    voices: [v-ev-board]
    gauges: { flame: 5 }
    caption: { ja: '親会社の臨時取締役会が開かれた。子会社の報告はまだ上がっていない。', en: '' }
  - id: ev-parent-board-ok
    at: { day: 2, minutes: 1080 }
    when: { flags: { parentReportFiled: true } }
    voices: [v-ev-board-ok]
    caption: { ja: '親会社の臨時取締役会で、子会社の報告書が配られた。', en: '' }
  - id: ev-merchant-churn
    at: { day: 8, minutes: 600 }
    voices: [v-ev-churn]
    gauges: { flame: 10 }
    sound: { se: [notify_news] }
    caption: { ja: '大口の加盟店が、代替の決済代行の検討を始めた。', en: '' }
points:
  - id: 'p01-parent-call'
    at: { day: 0, minutes: 1215 }
    phase: 'detect'
    text: { ja: '20時15分。親会社のセキュリティ責任者から電話が入る。「グループ共通の認証基盤に不正アクセスがあった。子会社のファイル転送装置が入口の可能性がある」。', en: '' }
    sound: { se: ['phone_ring'] }
    voices: ['v01-parent', 'v01-public', 'v01-ok']
    notable:
      - { id: 'note-parent-call', text: { ja: '20時15分、親会社のセキュリティ責任者から第一報。子会社のファイル転送装置が入口の可能性。', en: '' } }
      - { id: 'note-warning', text: { ja: '半年前、子会社の技術者がファイル転送装置の更新を上申し、自分が予算を理由に先送りした。', en: '' } }
    choices:
      - id: 'p01-taskforce'
        text: { ja: '子会社の対策本部を立ち上げ、装置を確認して事実を親会社と共有する。', en: '' }
        minutes: 60
        category: 'maintain'
        points: 20
        refs: ['meti-csm-guideline']
        gauges: { flame: -5, trust: 5, stamina: -5 }
        setFlags: { subTaskForce: true }
        explain: { ja: '子会社としての体制を作り、事実を親会社と共有する初動は適切。役割と連絡の経路を同時に確保できる。', en: '' }
        items:
          - { id: 'p01-b-time', points: 5, axis: 'time', refs: ['jpcert-handling'] }
          - { id: 'p01-b-order', points: 5, axis: 'order', refs: ['meti-csm-guideline'] }
          - { id: 'p01-b-record', points: 5, axis: 'record', refs: ['jpcert-handling'] }
      - id: 'p01-wait'
        text: { ja: '親会社の指示を待ち、明日の朝まで子会社では動かないことにする。', en: '' }
        minutes: 60
        category: 'hurt'
        points: -100
        refs: ['jpcert-handling']
        gauges: { flame: 5, trust: -5, stamina: 5 }
        coward: true
        setFlags: { delayedCommand: true }
        delayed:
          - { afterPhases: 1, points: -40, gauges: { trust: -10 }, reason: { ja: 'その夜、加盟店からの問い合わせが子会社の窓口に集中した。', en: '' } }
        explain: { ja: '指示待ちの間に子会社側の被害が広がる。グループの一部として、自分たちの装置の状況を先に確かめる必要がある。', en: '' }
        items:
          - { id: 'p01-a-time', points: -10, axis: 'time', refs: ['jpcert-handling'] }
          - { id: 'p01-a-order', points: -8, axis: 'order', refs: ['meti-csm-guideline'] }
      - id: 'p01-self'
        text: { ja: '自分で子会社のサーバー室に行き、ファイル転送装置を直接止める。', en: '' }
        minutes: 90
        category: 'hurt'
        points: -50
        refs: ['jpcert-handling']
        gauges: { stamina: -10, trust: -5 }
        explain: { ja: '現場に急行する姿勢は評価できるが、社長が手を動かすと指揮と親会社との連携が止まる。順序を誤りやすい。', en: '' }
        items:
          - { id: 'p01-c-order', points: -10, axis: 'order', refs: ['meti-csm-guideline'] }
          - { id: 'p01-c-care', points: -5, axis: 'care', refs: ['meti-csm-guideline'] }
    lesson: { ja: 'グループの一員として最初にすべきは、自社の装置の状況を確かめ、事実を親会社と共有する体制を作ること。指示を待つだけでは被害が広がり、社長が自分で装置を止めに行くと指揮が止まる。対策本部を立ち上げ、役割と連絡の経路を決めてから動きたい。', en: '' }
  - id: 'p02-appliance'
    at: { day: 0, minutes: 1350 }
    phase: 'contain'
    text: { ja: '22時30分。子会社のファイル転送装置が侵入経路の疑い。装置をどうするかで、調べられる範囲が変わる。', en: '' }
    sound: { se: ['notify_chat'] }
    voices: ['v02-expert', 'v02-field', 'v02-ok']
    popular: { choiceId: 'p02-initialize', percent: 58 }
    choices:
      - id: 'p02-initialize'
        text: { ja: '装置を初期化して作り直し、きれいな状態から調査をやり直す。', en: '' }
        minutes: 120
        category: 'fatal'
        points: -250
        refs: ['nist-sp800-61r3']
        gauges: { flame: 20, damage: 15, trust: -20 }
        setFlags: { destroyedEvidence: true }
        delayed:
          - { afterPhases: 2, points: -100, gauges: { damage: 15, trust: -20 }, reason: { ja: '証拠が消え、侵入経路も漏えい範囲も分からなくなった。', en: '' } }
        explain: { ja: '初期化すると侵入経路も漏えい範囲も分からなくなる。復旧を急ぐほど説明ができなくなる判断になる。', en: '' }
        items:
          - { id: 'p02-a-record', points: -20, axis: 'record', refs: ['nist-sp800-61r3'] }
          - { id: 'p02-a-content', points: -15, axis: 'content', refs: ['nist-sp800-61r3'] }
          - { id: 'p02-a-order', points: -10, axis: 'order', refs: ['jpcert-handling'] }
      - id: 'p02-isolate'
        text: { ja: '電源を切らずに切り離し、ログとメモリを保全して専門家に引き継ぐ。', en: '' }
        minutes: 90
        category: 'maintain'
        points: 30
        refs: ['nist-sp800-61r3']
        gauges: { damage: -10, trust: 5, stamina: -10 }
        setFlags: { contained: true, evidenceKept: true }
        explain: { ja: '電源を入れずに隔離し、痕跡を保全したうえで専門家に渡している。調査と復旧の両立を考えた適切な対応になる。', en: '' }
        items:
          - { id: 'p02-c-time', points: 5, axis: 'time', refs: ['jpcert-handling'] }
          - { id: 'p02-c-record', points: 8, axis: 'record', refs: ['nist-sp800-61r3'] }
          - { id: 'p02-c-order', points: 5, axis: 'order', refs: ['meti-csm-guideline'] }
          - { id: 'p02-c-content', points: 5, axis: 'content', refs: ['nist-sp800-61r3'] }
      - id: 'p02-poweroff'
        text: { ja: '装置の電源を切り、ネットワークから外して様子を見ることにする。', en: '' }
        minutes: 60
        category: 'hurt'
        points: -60
        refs: ['jpcert-handling']
        gauges: { damage: 5, trust: -5 }
        explain: { ja: '電源を切るとメモリ上の痕跡が失われる。切り離すだけなら調査を続けられるため、手順としては粗い。', en: '' }
        items:
          - { id: 'p02-b-record', points: -10, axis: 'record', refs: ['nist-sp800-61r3'] }
          - { id: 'p02-b-content', points: -8, axis: 'content', refs: ['nist-sp800-61r3'] }
    lesson: { ja: '侵入経路の疑いがある装置は、初期化や電源断より隔離と保全を優先する。メモリ上の痕跡を残せば手口が分かり、漏えい範囲の特定も進む。復旧を急ぐ気持ちは理解できるが、証拠を失うと説明も再発防止もできなくなる。', en: '' }
  - id: 'p03-scope'
    at: { day: 1, minutes: 120 }
    phase: 'contain'
    text: { ja: '午前2時。子会社の加盟店の決済データ（カード情報の一部を含む）も、同じ装置を通っていた。親会社が示した調査範囲に、自社のデータを含めるか。', en: '' }
    sound: { se: ['notify_chat'] }
    voices: ['v03-parent', 'v03-vendor', 'v03-ok']
    notable:
      - { id: 'note-scope', text: { ja: 'グループ共通の認証基盤への不正アクセス。子会社の加盟店決済データも同じ装置を通っていた。', en: '' } }
    choices:
      - id: 'p03-parent-scope'
        text: { ja: '親会社が示した範囲だけを調査し、自社の加盟店データは含めない。', en: '' }
        minutes: 120
        category: 'hurt'
        points: -100
        refs: ['ppc-report-scope']
        gauges: { damage: 15, trust: -10 }
        delayed:
          - { afterPhases: 1, points: -40, gauges: { damage: 10, flame: 10 }, reason: { ja: '調査していなかった加盟店のデータが、あとから公開された。', en: '' } }
        explain: { ja: '自社の加盟店データを調査から外すと、後から被害が判明したときに対応が後手になる。範囲を狭める理由が弱い。', en: '' }
        items:
          - { id: 'p03-a-content', points: -10, axis: 'content', refs: ['ppc-report-scope'] }
          - { id: 'p03-a-record', points: -8, axis: 'record', refs: ['nist-sp800-61r3'] }
      - id: 'p03-include'
        text: { ja: '加盟店の決済データも調査範囲に含め、親会社の調査に加えてもらうよう求める。', en: '' }
        minutes: 90
        category: 'maintain'
        points: 20
        refs: ['ppc-report-scope']
        gauges: { damage: -5, trust: 5, stamina: -10 }
        setFlags: { merchantScope: true }
        explain: { ja: '自社のデータを調査に含めるのは適切。グループ全体の被害像を正確にし、加盟店への説明にも備えられる。', en: '' }
        items:
          - { id: 'p03-b-content', points: 8, axis: 'content', refs: ['ppc-report-scope'] }
          - { id: 'p03-b-order', points: 5, axis: 'order', refs: ['meti-csm-guideline'] }
      - id: 'p03-include-plan'
        text: { ja: '加盟店データを調査に含め、先行連絡と代替決済の検討も同時に始める。', en: '' }
        minutes: 150
        category: 'recover'
        points: 100
        refs: ['ppc-report-scope', 'ppc-notify-person']
        gauges: { damage: -10, trust: 10, stamina: -15 }
        setFlags: { merchantScope: true, merchantPlan: true }
        explain: { ja: '調査への追加に加え、加盟店への先行連絡と代替決済の検討まで進めている。事業を止めない備えになる。', en: '' }
        items:
          - { id: 'p03-c-content', points: 8, axis: 'content', refs: ['ppc-report-scope'] }
          - { id: 'p03-c-order', points: 8, axis: 'order', refs: ['meti-csm-guideline'] }
          - { id: 'p03-c-care', points: 8, axis: 'care', refs: ['ppc-notify-person'] }
          - { id: 'p03-c-time', points: 5, axis: 'time', refs: ['jpcert-handling'] }
    lesson: { ja: '親会社の調査範囲に自社のデータが含まれていないなら、自分から加える必要がある。加盟店の決済データが同じ装置を通っていたなら、被害はグループの枠を超える。先行連絡と代替決済の検討まで同時に進め、事業への影響も抑えたい。', en: '' }
  - id: 'p04-reporting-line'
    at: { day: 1, minutes: 540 }
    phase: 'organize'
    text: { ja: '午前9時。親会社のCSIRTと子会社の現場の指示が二重になっている。子会社の窓口を誰にするか。', en: '' }
    sound: { se: ['phone_ring'] }
    voices: ['v04-parent', 'v04-coward', 'v04-ok']
    choices:
      - id: 'p04-line-support'
        text: { ja: '窓口を一本化し、応援要員を親会社に求めながら社員への説明も行う。', en: '' }
        minutes: 120
        category: 'recover'
        points: 100
        refs: ['meti-csm-guideline', 'ipa-sme-guideline']
        gauges: { trust: 10, stamina: 10, flame: -5 }
        setFlags: { reportingLine: true, staffSupport: true }
        explain: { ja: '窓口の一本化に加え、応援の要請と社員への説明まで行き届いている。現場の負担と不安の両方を抑えられる。', en: '' }
        items:
          - { id: 'p04-c-order', points: 8, axis: 'order', refs: ['meti-csm-guideline'] }
          - { id: 'p04-c-care', points: 8, axis: 'care', refs: ['ipa-sme-guideline'] }
          - { id: 'p04-c-care2', points: 5, axis: 'care', refs: ['ipa-sme-guideline'] }
          - { id: 'p04-c-record', points: 5, axis: 'record', refs: ['jpcert-handling'] }
      - id: 'p04-leave'
        text: { ja: '親会社にすべて任せ、自分は現場に出ずに状況の報告だけを受ける。', en: '' }
        minutes: 45
        category: 'hurt'
        points: -60
        refs: ['meti-csm-guideline']
        gauges: { trust: -5, stamina: 5 }
        coward: true
        explain: { ja: '子会社の現場を知る立場が動かないと、指示が二重になり現場が混乱する。当事者としての責任が薄い。', en: '' }
        items:
          - { id: 'p04-a-order', points: -10, axis: 'order', refs: ['meti-csm-guideline'] }
          - { id: 'p04-a-care', points: -8, axis: 'care', refs: ['ipa-sme-guideline'] }
      - id: 'p04-line'
        text: { ja: '子会社の窓口を一人に決め、親会社のCSIRTと毎時連絡する場を設ける。', en: '' }
        minutes: 90
        category: 'maintain'
        points: 30
        refs: ['meti-csm-guideline']
        gauges: { trust: 5, stamina: -10 }
        setFlags: { reportingLine: true }
        explain: { ja: '窓口を一本化し、定時の連絡の場を作るのは適切。指示の二重化を防ぎ、情報の抜けも減らせる。', en: '' }
        items:
          - { id: 'p04-b-order', points: 8, axis: 'order', refs: ['meti-csm-guideline'] }
          - { id: 'p04-b-time', points: 5, axis: 'time', refs: ['jpcert-handling'] }
          - { id: 'p04-b-record', points: 5, axis: 'record', refs: ['jpcert-handling'] }
    lesson: { ja: '指示が二重になると現場は動けない。子会社の窓口を一人に決め、親会社のCSIRTと定時に連絡する場を作る。応援の要請と社員への説明も同じタイミングで行うと、現場の負担と不安を同時に減らせる。', en: '' }
  - id: 'p05-parent-report'
    at: { day: 1, minutes: 840 }
    phase: 'organize'
    text: { ja: '午後2時。親会社に第一報を出す。電話で概要を伝えるか、書面で事実と不明点を分けて出すか。', en: '' }
    sound: { se: ['typing'] }
    voices: ['v05-parent', 'v05-coward', 'v05-ok']
    choices:
      - id: 'p05-oral'
        text: { ja: '電話で概要だけを伝え、詳細な書面は後日に回すことにする。', en: '' }
        minutes: 60
        category: 'hurt'
        points: -80
        refs: ['jpcert-handling']
        gauges: { trust: -10, flame: 5 }
        explain: { ja: '口頭だけでは事実と不明点の区別が残らない。記録が曖昧になり、後から対応の経緯を説明しにくい。', en: '' }
        items:
          - { id: 'p05-a-record', points: -10, axis: 'record', refs: ['jpcert-handling'] }
          - { id: 'p05-a-content', points: -8, axis: 'content', refs: ['meti-csm-guideline'] }
      - id: 'p05-written'
        text: { ja: '書面で、分かった事実と不明点を分けて親会社に提出する。', en: '' }
        minutes: 120
        category: 'maintain'
        points: 20
        refs: ['jpcert-handling']
        gauges: { trust: 5, stamina: -10 }
        setFlags: { parentReportFiled: true }
        detail: 'parent-report'
        explain: { ja: '事実と不明点を分けた書面は、親会社との認識のずれを防ぐ。後から検証する材料にもなる。', en: '' }
        items:
          - { id: 'p05-b-record', points: 5, axis: 'record', refs: ['jpcert-handling'] }
          - { id: 'p05-b-content', points: 5, axis: 'content', refs: ['meti-csm-guideline'] }
          - { id: 'p05-b-time', points: 5, axis: 'time', refs: ['jpcert-handling'] }
      - id: 'p05-delegate'
        text: { ja: '親会社の広報に任せ、子会社からは何も発信しないことにする。', en: '' }
        minutes: 45
        category: 'hurt'
        points: -120
        refs: ['meti-csm-guideline']
        gauges: { trust: -15, flame: 10 }
        coward: true
        delayed:
          - { afterPhases: 1, points: -30, gauges: { trust: -10 }, reason: { ja: '親会社の発表と子会社の説明が食い違い、訂正が必要になった。', en: '' } }
        explain: { ja: '子会社が発信しないと、加盟店は自社の状況を把握できない。グループの説明と食い違う原因にもなる。', en: '' }
        items:
          - { id: 'p05-c-record', points: -10, axis: 'record', refs: ['jpcert-handling'] }
          - { id: 'p05-c-order', points: -10, axis: 'order', refs: ['meti-csm-guideline'] }
          - { id: 'p05-c-content', points: -8, axis: 'content', refs: ['meti-csm-guideline'] }
    lesson: { ja: '親会社への第一報は、口頭の概要だけで済ませず、確認できた事実と不明点を分けた書面で出す。子会社が発信を止めると加盟店は状況を知れず、グループの説明との食い違いも生まれる。事実の共有が後々の判断の土台になる。', en: '' }
  - id: 'p05b-warning'
    at: { day: 2, minutes: 480 }
    phase: 'organize'
    text: { ja: '午前8時。半年前、子会社の技術者がファイル転送装置の更新とログ保全を上申していた記録が出てきた。当時、自分が予算を理由に先送りしていた。調査と公表に含めるか。', en: '' }
    sound: { se: ['notify_chat'] }
    voices: ['v05b-parent', 'v05b-ok']
    choices:
      - id: 'p05b-hide'
        text: { ja: 'この記録は調査に含めず、公表もせずに経営の中だけで伏せておく。', en: '' }
        minutes: 45
        category: 'fatal'
        points: -250
        refs: ['meti-csm-guideline']
        gauges: { flame: 25, trust: -25 }
        setFlags: { hidWarning: true }
        delayed:
          - { afterPhases: 2, points: -100, gauges: { flame: 20, trust: -15 }, reason: { ja: '子会社が事前の指摘を隠したことが報道され、説明責任を問われた。', en: '' } }
        explain: { ja: '事前の指摘を隠すと、後から必ず問題になる。隠蔽と受け取られ、子会社の説明責任が厳しく問われる。', en: '' }
        items:
          - { id: 'p05b-a-record', points: -20, axis: 'record', refs: ['meti-csm-guideline'] }
          - { id: 'p05b-a-content', points: -15, axis: 'content', refs: ['meti-csm-guideline'] }
