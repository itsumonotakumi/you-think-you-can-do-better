  - { id: v09-public, media: sns, misleading: true, type: public-opinion, text: { ja: '先に加盟店へ言うとパニックになる。報道を待て。', en: '' }, trigger: { at: point } }
  - { id: v09-coward, media: news, misleading: true, type: public-opinion, text: { ja: 'まだ確定していないのに加盟店へ言うのか。余計な混乱を招くだけだ。', en: '' }, trigger: { at: point } }
  - { id: v09-ok, media: chat, misleading: false, text: { ja: '子会社の営業部長「報道で知る前に、担当から直接伝えたいという声が出ています」。', en: '' }, trigger: { at: point } }
  - { id: v09-after, media: sns, misleading: false, text: { ja: '先に加盟店へ言って、パニックになった。', en: '' }, trigger: { at: after, choice: p09-individual-plan } }
  - { id: v10-attacker, media: attacker, misleading: true, type: attacker-shake, text: { ja: '次の公開は、もっと多くの加盟店だ。', en: '' }, trigger: { at: point } }
  - { id: v10-coward, media: sns, misleading: true, type: public-opinion, text: { ja: '一部が公開された程度で、全部を認めるのか。弱みを見せるな。', en: '' }, trigger: { at: point } }
  - { id: v10-ok, media: chat, misleading: false, text: { ja: '子会社の窓口「公開された加盟店から電話が来ています」。', en: '' }, trigger: { at: point } }
  - { id: v10-after, media: sns, misleading: false, text: { ja: '見舞金が少ない。これで済むと思うな。', en: '' }, trigger: { at: after, choice: p10-support } }
  - { id: v11-sales, media: chat, misleading: true, type: flattery, text: { ja: '社長、加盟店が待っています。子会社だけ先に再開しましょう。', en: '' }, trigger: { at: point } }
  - { id: v11-public, media: news, misleading: true, type: public-opinion, text: { ja: '他社はもう動いている。止めているのはうちだけだ。', en: '' }, trigger: { at: point } }
  - { id: v11-ok, media: chat, misleading: false, text: { ja: '子会社の技術責任者「グループの検証が終わるまで、共通ネットワークには戻せません」。', en: '' }, trigger: { at: point } }
