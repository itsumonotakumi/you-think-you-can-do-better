drafts:
  parent-report:
    title: { ja: '親会社への第一報', en: '' }
    slots:
      - id: 'timing'
        label: { ja: '提出までの時間', en: '' }
        auto: true
        items:
          - { id: 'or-t-24h', when: { withinHours: 24 }, points: 8, axis: 'time', refs: ['jpcert-handling'] }
          - { id: 'or-t-36h', when: { withinHours: 36 }, points: 3, axis: 'time', refs: ['jpcert-handling'] }
          - { id: 'or-t-late', when: { otherwise: true }, points: -10, axis: 'time', refs: ['jpcert-handling'] }
      - id: 'scope'
        label: { ja: '被害の範囲', en: '' }
        options:
          - { id: 'or-s-none', text: { ja: '子会社は影響なしと書いて範囲を限定する', en: '' }, points: -20, axis: 'content', refs: ['ppc-report-scope'], delayed: { afterPhases: 1, points: -20, reason: { ja: '子会社の影響を否定した訂正が必要になった。', en: '' } }, explain: { ja: '影響なしと書くと、後から子会社の被害が判明したときに訂正が必要になる。報告の信頼を損なう。', en: '' } }
          - { id: 'or-s-split', text: { ja: 'グループ全体の被害と子会社の範囲を分けて書く', en: '' }, points: 10, axis: 'content', refs: ['ppc-report-scope'], explain: { ja: 'グループと子会社の範囲を分ければ、誰が何を負うのかが明確になる。後から責任分界を問われても答えられる。', en: '' } }
      - id: 'facts'
        label: { ja: '事実と推測の分け方', en: '' }
        options:
          - { id: 'or-f-split', text: { ja: '確認できた事実と不明点を分けて書く', en: '' }, points: 8, axis: 'content', refs: ['jpcert-handling'], explain: { ja: '事実と不明点を分ければ、親会社は何を判断できるか分かる。追加の調査依頼もしやすい。', en: '' } }
          - { id: 'or-f-guess', text: { ja: '推測も事実として同じ調子で書く', en: '' }, points: -10, axis: 'wording', refs: ['jpcert-handling'], explain: { ja: '推測を事実と混ぜると、後から否定や訂正が必要になる。親会社の判断を誤らせる危険がある。', en: '' } }
      - id: 'entry'
        label: { ja: '侵入経路の書き方', en: '' }
        options:
          - { id: 'or-e-fixed', text: { ja: '入口は特定済みと断定して書く', en: '' }, points: -10, axis: 'wording', refs: ['nist-sp800-61r3'], explain: { ja: '未確定の段階で断定すると、別の経路が見つかったときに報告の信頼を失う。訂正も必要になる。', en: '' } }
          - { id: 'or-e-maybe', text: { ja: 'ファイル転送装置が入口の可能性と書く', en: '' }, points: 8, axis: 'content', refs: ['nist-sp800-61r3'], explain: { ja: '可能性と書けば、調査の途中でも事実を曲げずに伝えられる。確定後に更新する前提も示せる。', en: '' } }
      - id: 'data'
        label: { ja: '対象データ', en: '' }
        options:
          - { id: 'or-d-merchant', text: { ja: '加盟店の決済データを含めて書く', en: '' }, points: 8, axis: 'content', refs: ['ppc-report-scope'], explain: { ja: '自社の加盟店データを含めれば、調査と通知の対象が正しく伝わる。グループの被害像も正確になる。', en: '' } }
          - { id: 'or-d-customer', text: { ja: '顧客情報だけが対象だと書く', en: '' }, points: -15, axis: 'content', refs: ['ppc-report-scope'], explain: { ja: '加盟店データを外すと、対象範囲が実際より狭く伝わる。後から追加の報告と通知が必要になる。', en: '' } }
      - id: 'ask'
        label: { ja: '親会社への要請', en: '' }
        options:
          - { id: 'or-a-none', text: { ja: '支援の要請は書かないでおく', en: '' }, points: -5, axis: 'order', refs: ['meti-csm-guideline'], explain: { ja: '支援を求めなければ、子会社の現場だけで抱え込むことになる。疲労と確認漏れの原因になる。', en: '' } }
          - { id: 'or-a-resource', text: { ja: '応援要員と調査資源の支援を求める', en: '' }, points: 5, axis: 'order', refs: ['meti-csm-guideline'], explain: { ja: '子会社だけでは人手も専門性も足りない。応援と調査資源を具体的に求めれば、初動の速度が上がる。', en: '' } }
      - id: 'contact'
        label: { ja: '窓口', en: '' }
        options:
          - { id: 'or-c-window', text: { ja: '子会社の窓口と連絡できる時間を書く', en: '' }, points: 5, axis: 'order', refs: ['jpcert-handling'], explain: { ja: '窓口と時間が分かれば、親会社も加盟店も迷わず連絡できる。情報の抜けと二重連絡を防げる。', en: '' } }
          - { id: 'or-c-parent', text: { ja: '連絡は親会社に任せると書いておく', en: '' }, points: -8, axis: 'order', refs: ['jpcert-handling'], explain: { ja: '子会社の窓口を示さないと、現場の状況が親会社に届きにくい。問い合わせのたらい回しも起きる。', en: '' } }
      - id: 'record'
        label: { ja: '記録', en: '' }
        options:
          - { id: 'or-r-none', text: { ja: '提出の記録を残さずに終える', en: '' }, points: -8, axis: 'record', refs: ['jpcert-handling'], explain: { ja: '記録がないと、いつ何を伝えたか説明できない。責任の所在が曖昧になり、後から困る。', en: '' } }
          - { id: 'or-r-log', text: { ja: '提出した時刻と版を記録に残す', en: '' }, points: 5, axis: 'record', refs: ['jpcert-handling'], explain: { ja: '提出の時刻と版を残せば、親会社との認識のずれを後から確認できる。訂正の経緯もたどれる。', en: '' } }
      - id: 'next'
        label: { ja: '次の報告', en: '' }
        options:
          - { id: 'or-n-next', text: { ja: '次の報告予定を日時つきで書く', en: '' }, points: 3, axis: 'content', refs: ['meti-disclosure-guidance'], explain: { ja: '次の報告の日時を示せば、親会社は情報を待てる。報告が止まらない安心にもつながる。', en: '' } }
          - { id: 'or-n-none', text: { ja: '次回の予定を書かないで終える', en: '' }, points: -5, axis: 'content', refs: ['meti-disclosure-guidance'], explain: { ja: '次の予定がないと、親会社はいつ情報が来るか分からない。催促と問い合わせが増える。', en: '' } }
      - id: 'tone'
        label: { ja: '書き出し', en: '' }
        options:
          - { id: 'or-t-excuse', text: { ja: '言い訳を先に書いて書き出しにする', en: '' }, points: -10, axis: 'wording', refs: ['meti-disclosure-guidance'], explain: { ja: '言い訳を先に置くと、責任逃れの印象が強くなる。肝心の事実が伝わりにくく、反発を招く。', en: '' } }
          - { id: 'or-t-apology', text: { ja: '謝罪と事実を分けて書き出しにする', en: '' }, points: 5, axis: 'wording', refs: ['meti-disclosure-guidance'], explain: { ja: '謝罪と事実を分ければ、誠意と状況の説明が混ざらない。読み手が落ち着いて内容を把握できる。', en: '' } }
      - id: 'staff'
        label: { ja: '現場の負担', en: '' }
        options:
          - { id: 'or-p-staff', text: { ja: '現場の負担と交代の必要性を書く', en: '' }, points: 5, axis: 'care', refs: ['ipa-sme-guideline'], explain: { ja: '現場の負担と交代の必要性を書けば、応援の判断につながる。疲労による確認漏れも防げる。', en: '' } }
          - { id: 'or-p-none', text: { ja: '現場の負担には触れないでおく', en: '' }, points: -5, axis: 'care', refs: ['ipa-sme-guideline'], explain: { ja: '現場の負担に触れないと、応援が後手になる。限られた人数で無理を続け、ミスが増える。', en: '' } }
      - id: 'approval'
        label: { ja: '社内確認', en: '' }
        options:
          - { id: 'or-i-solo', text: { ja: '社長の判断だけで文案を決めて提出する', en: '' }, points: -10, axis: 'order', refs: ['meti-csm-guideline'], explain: { ja: '一人で決めると、法務や広報の観点が抜ける。表現の誤りが訂正につながり、信頼を損なう。', en: '' } }
          - { id: 'or-i-check', text: { ja: '子会社の法務と広報、親会社で文案を確認する', en: '' }, points: 5, axis: 'order', refs: ['meti-csm-guideline'], explain: { ja: '子会社と親会社の双方で確認すれば、表現の食い違いを防げる。グループの説明との一貫性も保てる。', en: '' } }
  final-report:
    title: { ja: '調査報告書の子会社部分', en: '' }
    slots:
      - id: 'scope'
        label: { ja: '公開する範囲', en: '' }
        options:
          - { id: 'of-s-full', text: { ja: '攻撃に使える詳細だけ伏せて全文公開する', en: '' }, points: 10, axis: 'content', refs: ['meti-disclosure-guidance'], explain: { ja: '攻撃に使える部分だけを伏せて全文を出せば、説明責任と安全を両立できる。加盟店の納得も得やすい。', en: '' } }
          - { id: 'of-s-hide', text: { ja: '攻撃の詳細を理由に子会社部分を公開しない', en: '' }, points: -20, axis: 'content', refs: ['meti-disclosure-guidance'], explain: { ja: '公開しない理由が攻撃の詳細だけなら、隠蔽と受け取られやすい。かえって推測と批判を招く。', en: '' } }
      - id: 'cause'
        label: { ja: '原因の書き方', en: '' }
        options:
          - { id: 'of-c-vague', text: { ja: '外部からの攻撃とだけ書いて終える', en: '' }, points: -10, axis: 'content', refs: ['nist-sp800-61r3'], explain: { ja: '外部からの攻撃とだけ書くと、自社の課題が見えない。再発防止の実効性を疑われても仕方がない。', en: '' } }
          - { id: 'of-c-cause', text: { ja: '侵入経路と設定の不備を具体的に書く', en: '' }, points: 10, axis: 'content', refs: ['nist-sp800-61r3'], explain: { ja: '侵入経路と設定の不備を具体的に書けば、再発防止の説得力が増す。信頼回復にもつながる。', en: '' } }
      - id: 'warning'
        label: { ja: '事前の指摘', en: '' }
        options:
          - { id: 'of-w-include', text: { ja: '事前の社内指摘と経緯を具体的に書く', en: '' }, points: 10, axis: 'content', refs: ['meti-csm-guideline'], explain: { ja: '事前の指摘と生かせなかった経緯を書けば、組織の課題を正面から説明できる。再発防止にもつながる。', en: '' } }
          - { id: 'of-w-omit', text: { ja: '事前の社内指摘には一切触れない', en: '' }, points: -15, axis: 'content', refs: ['meti-csm-guideline'], explain: { ja: '社内指摘に触れないと、後から判明したときに隠蔽を疑われる。説明の信頼を大きく損なう。', en: '' } }
      - id: 'responsibility'
        label: { ja: '責任の書き方', en: '' }
        options:
          - { id: 'of-r-field', text: { ja: '現場の責任として処理しておく', en: '' }, points: -10, axis: 'wording', refs: ['meti-csm-guideline'], explain: { ja: '現場の責任にすると、経営の判断の問題が見えなくなる。再発防止が表面的になり、再び同じ誤りを繰り返す。', en: '' } }
          - { id: 'of-r-own', text: { ja: '上申を止めた子会社社長の責任を書く', en: '' }, points: 8, axis: 'record', refs: ['meti-csm-guideline'], explain: { ja: '上申を止めた社長の責任を書けば、組織の意思決定の問題として説明できる。再発防止にもつながる。', en: '' } }
      - id: 'measures'
        label: { ja: '再発防止策', en: '' }
        options:
          - { id: 'of-m-plan', text: { ja: '実施時期と担当を具体的に書く', en: '' }, points: 10, axis: 'content', refs: ['cissp-cbk-secops'], explain: { ja: '時期と担当を書けば、対策が実行されたかを後から検証できる。具体性が信頼につながる。', en: '' } }
          - { id: 'of-m-slogan', text: { ja: '再発防止に努めますとだけ書く', en: '' }, points: -10, axis: 'content', refs: ['cissp-cbk-secops'], explain: { ja: '決意だけでは、何をいつ誰がやるのか分からない。実行を伴わない印象を与え、評価されない。', en: '' } }
      - id: 'thirdparty'
        label: { ja: '第三者委員会の意見', en: '' }
        options:
          - { id: 'of-t-summary', text: { ja: '意見は要約だけを載せておく', en: '' }, points: -8, axis: 'content', refs: ['cissp-cbk-secops'], explain: { ja: '要約だけでは、都合の悪い部分を省いたと疑われやすい。委員会の独立性への信頼も損なう。', en: '' } }
          - { id: 'of-t-full', text: { ja: '第三者委員会の意見を全文掲載する', en: '' }, points: 8, axis: 'content', refs: ['cissp-cbk-secops'], explain: { ja: '第三者委員会の意見を全文載せれば、都合の悪い指摘も含めて説明したことになる。独立性も示せる。', en: '' } }
      - id: 'victims'
        label: { ja: '加盟店への補償', en: '' }
        options:
          - { id: 'of-v-record', text: { ja: '補償と窓口の実績を書く', en: '' }, points: 8, axis: 'care', refs: ['ppc-notify-person'], explain: { ja: '補償と窓口の実績を示せば、加盟店支援が言葉だけでないと伝わる。具体的な数字が信頼になる。', en: '' } }
          - { id: 'of-v-none', text: { ja: '補償には触れないでおく', en: '' }, points: -10, axis: 'care', refs: ['ppc-notify-person'], explain: { ja: '補償に触れないと、加盟店を置き去りにした印象を与える。納得と回復を遠ざける結果になる。', en: '' } }
      - id: 'progress'
        label: { ja: '進捗の公開', en: '' }
        options:
          - { id: 'of-p-once', text: { ja: '一度だけ公開すると書く', en: '' }, points: -5, axis: 'record', refs: ['meti-disclosure-guidance'], explain: { ja: '一度きりでは、対策が続いているかを確認できない。形だけの報告と受け取られやすい。', en: '' } }
          - { id: 'of-p-monthly', text: { ja: '進捗を毎月公開すると書く', en: '' }, points: 10, axis: 'record', refs: ['meti-disclosure-guidance'], explain: { ja: '毎月の公開を約束すれば、対策の実行を継続的に確認できる。説明を止めない姿勢になる。', en: '' } }
      - id: 'industry'
        label: { ja: 'グループ会社への共有', en: '' }
        options:
          - { id: 'of-i-share', text: { ja: 'グループ会社向けに教訓を共有する', en: '' }, points: 10, axis: 'content', refs: ['meti-disclosure-guidance'], explain: { ja: 'グループ会社に教訓を共有すれば、同種の被害をグループ全体で防げる。再発防止の効果が広がる。', en: '' } }
          - { id: 'of-i-keep', text: { ja: '教訓は子会社の中にとどめる', en: '' }, points: -5, axis: 'content', refs: ['meti-disclosure-guidance'], explain: { ja: '教訓を子会社の中だけにとどめると、同じ弱点を持つグループ会社が同じ被害を受ける。', en: '' } }
      - id: 'parent'
        label: { ja: '親会社との責任分界', en: '' }
        options:
          - { id: 'of-parent-none', text: { ja: '親会社に任せると書く', en: '' }, points: -8, axis: 'content', refs: ['meti-csm-guideline'], explain: { ja: '責任分界を書かずに親会社へ任せると、子会社の責任が曖昧なまま残る。説明の一貫性も失う。', en: '' } }
          - { id: 'of-parent-split', text: { ja: '親会社との責任分界を書く', en: '' }, points: 8, axis: 'content', refs: ['meti-csm-guideline'], explain: { ja: '親会社との責任分界を書けば、誰が何を負うのかが明確になる。後から責任を問われても答えられる。', en: '' } }
voices:
