# No.1 ネビュラクラウド / 役員・グループ会社社長ロール
# プレイヤーは子会社ネビュラ・ペイメントサービスの社長。親会社への報告と、自社の加盟店を守る判断を扱う。
# 判断ポイント16、細目は choices[].items と drafts の合計で80以上。
estimateMinutes: 35
intro: { ja: 'あなたはネビュラクラウドのグループ会社、ネビュラ・ペイメントサービス株式会社の代表取締役社長。グループ共通のネットワークが攻撃され、自社の加盟店データも危うい。親会社にどこまで報告し、自社の顧客をどこまで守れるか。20時15分の電話から、あなたの判断が始まる。', en: '' }
pressEnabled: true
cowardVoices:
