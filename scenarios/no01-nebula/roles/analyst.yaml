drafts:
  incident-note:
    title: { ja: '一次報告メモ', en: '' }
    slots:
      - id: 'detected'
        label: { ja: '検知時刻の書き方', en: '' }
        options:
          - { id: 'in-t-split', text: { ja: '検知した時刻と、確認した時刻を分けて書く', en: '' }, points: 4, axis: 'time', refs: ['jpcert-handling'], explain: { ja: '検知と確認を分ければ、初動の速さを正確に示せる。後から時系列を検証する材料にもなる。', en: '' } }
