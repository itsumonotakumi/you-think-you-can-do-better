# No.1 ネビュラクラウド / セキュリティ担当者ロール
# 見えるのは、監視画面のアラート、ログ、現場からのチャット。
# 判断ポイント18、細目は choices[].items と drafts の合計で80以上。
estimateMinutes: 40
intro: { ja: 'あなたはネビュラクラウドのセキュリティ担当者。監視画面のアラートと、現場からの電話の間に立つ。半年前に自分が送った指摘メールが、まだどこかに残っている。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-prelim-material
    ref: ppc-report-prelim
    label: { ja: '一次報告と速報の材料提出', en: '' }
    points: -40
    doneFlag: prelimMaterialsSent
  - id: dl-final-material
    ref: ppc-report-final-malicious
    label: { ja: '確報の材料提出', en: '' }
    points: -60
    doneFlag: finalMaterialsSent
events:
  - id: ev-a-night
    at: { day: 1, minutes: 180 }
    voices: [v-ev-night]
    gauges: { stamina: -5 }
    sound: { se: [notify_chat] }
    caption: { ja: '深夜。監視画面のアラートが鳴り続けている。', en: '' }
  - id: ev-a-board
    at: { day: 3, minutes: 900 }
    voices: [v-ev-board]
    gauges: { flame: 5 }
    caption: { ja: '社内掲示板に、現場からの書き込みが増えている。', en: '' }
  - id: ev-a-client
    at: { day: 5, minutes: 600 }
    voices: [v-ev-client]
    gauges: { flame: 5 }
    sound: { se: [phone_ring] }
    caption: { ja: '取引先から、調査状況の説明を求められている。', en: '' }
points:
  - id: 'a01-first-alert'
    at: { day: 0, minutes: 1185 }
    phase: 'detect'
    text: { ja: '19時45分。顧客の仮想サーバー三台で不審なプロセスの実行を検知した。同じ時刻、基盤運用部長から「顧客のサーバーに不正プログラムが見つかった」と電話が入る。影響範囲はまだ分からない。', en: '' }
    sound: { se: ['notify_chat'] }
    voices: ['v01-vendor', 'v01-boss', 'v01-field', 'v01-ok']
    notable:
      - { id: 'note-first-alert', text: { ja: '19時45分、顧客の仮想サーバー三台で不審なプロセスを検知。影響範囲は不明。', en: '' } }
    choices:
      - id: 'a01-isolate'
        text: { ja: '三台をネットワークから隔離し、メモリとディスクを保全して記録する。', en: '' }
        minutes: 30
        category: 'maintain'
        points: 30
        refs: ['nist-sp800-61r3', 'jpcert-handling']
        gauges: { damage: -5, trust: 5, stamina: -5 }
        setFlags: { isolateStart: true }
        explain: { ja: '隔離と保全を同時に行い、操作も記録している。被害の拡大を防ぎながら調査の材料を残せる。', en: '' }
        items:
          - { id: 'a01-c-time', points: 4, axis: 'time', refs: ['jpcert-handling'] }
          - { id: 'a01-c-order', points: 4, axis: 'order', refs: ['nist-sp800-61r3'] }
          - { id: 'a01-c-record', points: 4, axis: 'record', refs: ['jpcert-handling'] }
          - { id: 'a01-c-content', points: 4, axis: 'content', refs: ['nist-sp800-61r3'] }
      - id: 'a01-poweroff'
        text: { ja: '危険なので、該当する三台のコンセントを抜いて止める。', en: '' }
        minutes: 15
        category: 'hurt'
        points: -30
        refs: ['nist-sp800-61r3']
        gauges: { damage: -10, stamina: -5 }
        explain: { ja: '電源を抜くとメモリ上の痕跡が失われる。危険を止める目的は果たせるが、侵入の手口を調べられなくなる。', en: '' }
        items:
          - { id: 'a01-a-record', points: -7, axis: 'record', refs: ['nist-sp800-61r3'] }
          - { id: 'a01-a-content', points: -6, axis: 'content', refs: ['jpcert-handling'] }
          - { id: 'a01-a-time', points: 2, axis: 'time', refs: ['nist-sp800-61r3'] }
      - id: 'a01-observe'
        text: { ja: '誤検知かもしれないと判断し、朝までアラートの推移を見る。', en: '' }
        minutes: 60
        category: 'hurt'
        points: -60
        refs: ['jpcert-handling']
        gauges: { damage: 10, flame: 5, trust: -5 }
        coward: true
        explain: { ja: '推移を見る間に横展開が進む。三台同時の検知は誤検知では済まない可能性が高く、初動が遅れる。', en: '' }
        items:
          - { id: 'a01-b-time', points: -7, axis: 'time', refs: ['jpcert-handling'] }
          - { id: 'a01-b-record', points: -6, axis: 'record', refs: ['jpcert-handling'] }
      - id: 'a01-vendor-first'
        text: { ja: '監視サービスのベンダーに一次切り分けを依頼し、結果を待つ。', en: '' }
        minutes: 90
        category: 'hurt'
        points: -50
        refs: ['meti-csm-guideline']
        gauges: { damage: 5, trust: -5 }
        explain: { ja: '外部に切り分けを頼むと初動が遅れる。自分たちで隔離できる状況なのに、判断を委ねる理由が弱い。', en: '' }
        items:
          - { id: 'a01-d-time', points: -6, axis: 'time', refs: ['jpcert-handling'] }
          - { id: 'a01-d-order', points: -3, axis: 'order', refs: ['meti-csm-guideline'] }
    lesson: { ja: '三台同時の検知は誤検知では済まない可能性が高い。電源を抜かずに隔離し、メモリとディスクを保全して操作を記録する。自分で切り分けを抱え込まず、CSIRTと経営に事実を渡すことが初動の速度を決める。', en: '' }
  - id: 'a02-same-credential'
    at: { day: 0, minutes: 1215 }
    phase: 'contain'
    text: { ja: '20時15分。隔離した三台と同じ認証情報を使うサーバーが、同じネットワークに数百台ある。全部止めれば顧客の取引も止まる。', en: '' }
    sound: { se: ['notify_chat'] }
    voices: ['v02-public', 'v02-past', 'v02-popular', 'v02-ok']
    popular: { choiceId: 'a02-one', percent: 64 }
    choices:
      - id: 'a02-one'
        text: { ja: '隔離は三台で止め、ほかは監視を強めて様子を見て、上には進言しない。', en: '' }
        minutes: 60
        category: 'hurt'
        points: -30
        refs: ['nist-sp800-61r3']
        gauges: { damage: 15, flame: 5 }
        delayed:
          - { afterPhases: 1, points: -18, gauges: { damage: 15, trust: -10 }, reason: { ja: '止めなかったサーバーでも、同じ認証情報を使った不正な通信が続いた。', en: '' } }
        explain: { ja: '同じ認証情報を使う数百台を残すと、被害は確実に広がる。進言しないことで組織の判断も遅れる。', en: '' }
        items:
          - { id: 'a02-a-content', points: -7, axis: 'content', refs: ['nist-sp800-61r3'] }
          - { id: 'a02-a-record', points: 2, axis: 'record', refs: ['jpcert-handling'] }
          - { id: 'a02-a-time', points: -6, axis: 'time', refs: ['nist-sp800-61r3'] }
      - id: 'a02-all'
        text: { ja: '同じ認証情報を使う全サーバーをまとめ、無効化と隔離を進言する。', en: '' }
        minutes: 120
        category: 'maintain'
        points: 30
        refs: ['nist-sp800-61r3', 'meti-csm-guideline']
        gauges: { damage: -20, flame: 10, stamina: -10 }
        setFlags: { containmentProposed: true }
        explain: { ja: '影響範囲を整理して進言している。事業判断は上に委ねつつ、危険の全体像を渡せる適切な対応になる。', en: '' }
        items:
          - { id: 'a02-b-content', points: 6, axis: 'content', refs: ['nist-sp800-61r3'] }
          - { id: 'a02-b-order', points: 6, axis: 'order', refs: ['meti-csm-guideline'] }
          - { id: 'a02-b-time', points: 4, axis: 'time', refs: ['nist-sp800-61r3'] }
          - { id: 'a02-b-care', points: 4, axis: 'care', refs: ['meti-csm-guideline'] }
      - id: 'a02-ignore'
        text: { ja: '監視ツールの誤検知としてアラートを閉じ、対応を打ち切る。', en: '' }
        minutes: 15
        category: 'hurt'
        points: -60
        refs: ['jpcert-handling']
        gauges: { damage: 20, trust: -10 }
        coward: true
        explain: { ja: '同じ認証情報が使われている事実を見落としている。誤検知と決めつけると、被害の拡大に気づけない。', en: '' }
        items:
          - { id: 'a02-c-content', points: -10, axis: 'content', refs: ['jpcert-handling'] }
          - { id: 'a02-c-record', points: -7, axis: 'record', refs: ['jpcert-handling'] }
    lesson: { ja: '同じ認証情報を使うサーバーが数百台あるなら、三台の隔離だけでは足りない。全サーバーの一覧と影響をまとめ、無効化と隔離を進言する。事業判断は上に委ねつつ、危険の全体像を渡すのが担当者の役割になる。', en: '' }
  - id: 'a03-evidence'
    at: { day: 0, minutes: 1245 }
    phase: 'contain'
    text: { ja: '20時45分。現場から「再起動していいか」とチャットが来た。再起動すればメモリ上の痕跡が消える。', en: '' }
    sound: { se: ['notify_chat'] }
    voices: ['v03-field', 'v03-expert', 'v03-ok']
    choices:
      - id: 'a03-reboot'
        text: { ja: '再起動してメモリ上の痕跡を消し、それから落ち着いて様子を見る。', en: '' }
        minutes: 30
        category: 'hurt'
        points: -40
        refs: ['nist-sp800-61r3']
        gauges: { damage: 10, trust: -5 }
        delayed:
          - { afterPhases: 1, points: -9, gauges: { damage: 10 }, reason: { ja: '再起動でメモリ上の痕跡が消え、侵入の手口が分からなくなった。', en: '' } }
        explain: { ja: '再起動でメモリ上の痕跡が消える。手口の特定が難しくなり、漏えい範囲の説明もできなくなる。', en: '' }
        items:
          - { id: 'a03-a-record', points: -8, axis: 'record', refs: ['nist-sp800-61r3'] }
          - { id: 'a03-a-content', points: -7, axis: 'content', refs: ['nist-sp800-61r3'] }
      - id: 'a03-delete'
        text: { ja: '不審なファイルを削除し、サーバーをきれいにしてから返却する。', en: '' }
        minutes: 45
        category: 'fatal'
        points: -200
        refs: ['nist-sp800-61r3', 'jpcert-handling']
        gauges: { damage: 10, flame: 15, trust: -20 }
        setFlags: { destroyedEvidence: true }
        explain: { ja: 'ファイルを削除すると証拠が失われる。きれいに見えても、侵入の手口も漏えい範囲も分からなくなる。', en: '' }
        items:
          - { id: 'a03-c-record', points: -14, axis: 'record', refs: ['jpcert-handling'] }
          - { id: 'a03-c-content', points: -10, axis: 'content', refs: ['nist-sp800-61r3'] }
          - { id: 'a03-c-wording', points: -7, axis: 'wording', refs: ['meti-disclosure-guidance'] }
      - id: 'a03-image'
        text: { ja: 'メモリとディスクのイメージを取得し、ハッシュと取得時刻を記録する。', en: '' }
        minutes: 90
        category: 'maintain'
        points: 30
        refs: ['nist-sp800-61r3', 'cissp-cbk-secops']
        gauges: { damage: -10, trust: 5, stamina: -10 }
        detail: 'forensic-plan'
        explain: { ja: 'メモリとディスクを保全し、ハッシュと時刻を記録するのは基本。証拠の完全性を後から示せる。', en: '' }
        items:
          - { id: 'a03-b-order', points: 6, axis: 'order', refs: ['nist-sp800-61r3'] }
          - { id: 'a03-b-record', points: 6, axis: 'record', refs: ['cissp-cbk-secops'] }
          - { id: 'a03-b-time', points: 4, axis: 'time', refs: ['jpcert-handling'] }
          - { id: 'a03-b-content', points: 4, axis: 'content', refs: ['nist-sp800-61r3'] }
      - id: 'a03-copy'
        text: { ja: '不審なファイルだけをUSBメモリにコピーし、元のファイルは消してしまう。', en: '' }
        minutes: 45
        category: 'hurt'
        points: -60
        refs: ['cissp-cbk-secops']
        gauges: { damage: 5, trust: -10 }
        explain: { ja: '一部だけをコピーして元を消すと、文脈が失われる。ハッシュも取れず、証拠としての価値が下がる。', en: '' }
        items:
          - { id: 'a03-d-record', points: -8, axis: 'record', refs: ['cissp-cbk-secops'] }
          - { id: 'a03-d-order', points: -6, axis: 'order', refs: ['nist-sp800-61r3'] }
    lesson: { ja: '再起動や削除は、メモリ上の痕跡とファイルの文脈を失わせる。まずメモリとディスクを保全し、ハッシュと取得時刻を記録する。証拠を残せば、侵入の手口も漏えい範囲も後から説明できる。', en: '' }
  - id: 'a04-first-report'
    at: { day: 0, minutes: 1305 }
    phase: 'contain'
    text: { ja: '21時45分。CSIRTリーダーに第一報を出す時間。まだ影響範囲は分かっていない。個人のSNSには「うちの会社やばい」と書きたい気持ちもある。', en: '' }
    sound: { se: ['typing'] }
    voices: ['v04-boss', 'v04-bold', 'v04-ok']
    choices:
      - id: 'a04-wait'
        text: { ja: '全容が分かってから報告すると決め、今は調べることに集中する。', en: '' }
        minutes: 120
        category: 'hurt'
        points: -60
        refs: ['jpcert-handling']
        gauges: { flame: 10, trust: -10, damage: 5 }
        coward: true
        explain: { ja: '全容を待つ間に初動の判断が遅れる。第一報は分かったことと不明点を分けて早く出すのが基本になる。', en: '' }
        items:
          - { id: 'a04-a-time', points: -7, axis: 'time', refs: ['jpcert-handling'] }
          - { id: 'a04-a-record', points: -6, axis: 'record', refs: ['jpcert-handling'] }
      - id: 'a04-sns'
        text: { ja: '個人のSNSに大変なことになっていると投稿し、社内にも知らせようとする。', en: '' }
        minutes: 15
        category: 'hurt'
        points: -100
        refs: ['meti-disclosure-guidance']
        gauges: { flame: 15, trust: -10 }
        delayed:
          - { afterPhases: 1, points: -12, gauges: { flame: 15, trust: -10 }, reason: { ja: '担当者の投稿が特定され、会社の説明と食い違った。', en: '' } }
        explain: { ja: '個人の投稿は特定されやすく、会社の説明と食い違う。情報の管理も失い、二次的な被害を招く。', en: '' }
        items:
          - { id: 'a04-c-wording', points: -10, axis: 'wording', refs: ['meti-disclosure-guidance'] }
          - { id: 'a04-c-record', points: -7, axis: 'record', refs: ['jpcert-handling'] }
          - { id: 'a04-c-care', points: -3, axis: 'care', refs: ['meti-csm-guideline'] }
      - id: 'a04-oral'
        text: { ja: '口頭で軽く伝え、書面での報告は後回しにすることにしておく。', en: '' }
        minutes: 30
        category: 'hurt'
        points: -40
        refs: ['jpcert-handling']
        gauges: { trust: -5 }
        explain: { ja: '口頭だけでは事実と不明点が残らない。後から経緯を説明できず、対応の評価も定まらない。', en: '' }
        items:
          - { id: 'a04-d-record', points: -7, axis: 'record', refs: ['jpcert-handling'] }
          - { id: 'a04-d-order', points: -3, axis: 'order', refs: ['jpcert-handling'] }
      - id: 'a04-report'
        text: { ja: '30分以内に、分かったことと不明点、次にやることを分けて報告する。', en: '' }
        minutes: 45
        category: 'maintain'
        points: 30
        refs: ['jpcert-handling', 'cissp-cbk-secops']
        gauges: { trust: 5, stamina: -5 }
        setFlags: { firstReport: true, prelimMaterialsSent: true }
        detail: 'incident-note'
        explain: { ja: '短時間で事実と不明点と次の行動を分けて報告している。受け手が判断しやすく、初動も速くなる。', en: '' }
        items:
          - { id: 'a04-b-time', points: 6, axis: 'time', refs: ['jpcert-handling'] }
          - { id: 'a04-b-order', points: 4, axis: 'order', refs: ['cissp-cbk-secops'] }
          - { id: 'a04-b-record', points: 4, axis: 'record', refs: ['jpcert-handling'] }
          - { id: 'a04-b-content', points: 4, axis: 'content', refs: ['cissp-cbk-secops'] }
    lesson: { ja: '第一報は全容を待たず、分かったことと不明点、次にやることを分けて早く出す。個人のSNSへの投稿は特定されやすく、会社の説明と食い違う。口頭だけで済ませず、書面で記録を残したい。', en: '' }
  - id: 'a05-keys'
    at: { day: 0, minutes: 1335 }
    phase: 'contain'
    text: { ja: '22時15分。侵害されたサーバーから、管理用APIキーと複数の顧客APIキーが読める状態だった。キーを止めれば、顧客の連携機能も止まる。', en: '' }
    sound: { se: ['notify_chat'] }
    voices: ['v05-vendor', 'v05-law', 'v05-ok']
    choices:
      - id: 'a05-rotate'
        text: { ja: '侵害されたキーを失効させ、顧客ごとに新キーを発行して案内する。', en: '' }
        minutes: 120
        category: 'maintain'
        points: 30
        refs: ['nist-sp800-61r3', 'meti-csm-guideline']
        gauges: { damage: -15, trust: 5, stamina: -10 }
        setFlags: { keysRotated: true }
        explain: { ja: '侵害されたキーを止め、顧客ごとに再発行して案内している。被害を止めながら連携機能も維持できる。', en: '' }
        items:
          - { id: 'a05-b-order', points: 6, axis: 'order', refs: ['nist-sp800-61r3'] }
          - { id: 'a05-b-content', points: 6, axis: 'content', refs: ['nist-sp800-61r3'] }
          - { id: 'a05-b-care', points: 6, axis: 'care', refs: ['meti-csm-guideline'] }
          - { id: 'a05-b-record', points: 4, axis: 'record', refs: ['jpcert-handling'] }
      - id: 'a05-keep'
        text: { ja: '影響が確認できるまで、キーは有効のままにして様子を見る。', en: '' }
        minutes: 60
        category: 'hurt'
        points: -60
        refs: ['nist-sp800-61r3']
        gauges: { damage: 15, trust: -10 }
        delayed:
          - { afterPhases: 1, points: -15, gauges: { damage: 20, flame: 10 }, reason: { ja: '止めなかったキーで、外部から顧客データへのアクセスが続いた。', en: '' } }
        explain: { ja: '侵害されたキーを有効のままにすると、外部からのアクセスが続く。確認を待つ間に被害が広がる。', en: '' }
        items:
          - { id: 'a05-a-content', points: -8, axis: 'content', refs: ['nist-sp800-61r3'] }
          - { id: 'a05-a-record', points: -7, axis: 'record', refs: ['jpcert-handling'] }
      - id: 'a05-all-rotate'
        text: { ja: '全キーを一斉に失効させ、再発行は顧客に任せることにする。', en: '' }
        minutes: 60
        category: 'hurt'
        points: -40
        refs: ['meti-csm-guideline']
        gauges: { damage: -10, flame: 10, trust: -10 }
        explain: { ja: '全キーを一斉に止めると顧客の連携が止まる。再発行を任せると復旧が遅れ、問い合わせも集中する。', en: '' }
        items:
          - { id: 'a05-c-care', points: -7, axis: 'care', refs: ['meti-csm-guideline'] }
          - { id: 'a05-c-order', points: -6, axis: 'order', refs: ['meti-csm-guideline'] }
      - id: 'a05-share-key'
        text: { ja: '調査を急ぐため、新しい共通キーを担当者全員に配ってしまうことにする。', en: '' }
        minutes: 30
        category: 'hurt'
        points: -80
        refs: ['cissp-cbk-secops']
        gauges: { damage: 10, trust: -10 }
        explain: { ja: '共通キーを配ると、誰が何に使ったか追えなくなる。権限が広がり、次の事故の原因になる。', en: '' }
        items:
          - { id: 'a05-d-content', points: -8, axis: 'content', refs: ['cissp-cbk-secops'] }
          - { id: 'a05-d-record', points: -7, axis: 'record', refs: ['cissp-cbk-secops'] }
