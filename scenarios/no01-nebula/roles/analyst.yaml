        options:
          - { id: 'in-e-none', text: { ja: '証拠の保全には触れずに書いておく', en: '' }, points: -7, axis: 'record', refs: ['nist-sp800-61r3'], explain: { ja: '証拠の保全に触れないと、調査の前提が伝わらない。後から証拠の扱いを疑われ、説明が難しくなる。', en: '' } }
          - { id: 'in-e-chain', text: { ja: '保全したデータのハッシュと保管場所を書く', en: '' }, points: 6, axis: 'record', refs: ['cissp-cbk-secops'], explain: { ja: 'ハッシュと保管場所を書けば、証拠の完全性を後から示せる。調査の信頼につながり、検証にも耐える。', en: '' } }
      - id: 'uncertain'
