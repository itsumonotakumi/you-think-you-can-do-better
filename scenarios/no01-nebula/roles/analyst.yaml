          - { id: 'in-u-omit', text: { ja: '未確認事項には触れないでおく', en: '' }, points: -6, axis: 'content', refs: ['meti-disclosure-guidance'], explain: { ja: '未確認事項に触れないと、分かったこととの区別がつかない。後から追加の説明が必要になる。', en: '' } }
