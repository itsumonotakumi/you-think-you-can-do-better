          - { id: 'in-d-list', text: { ja: '隔離した機器と止めたアカウント、保全したログを列挙する', en: '' }, points: 6, axis: 'order', refs: ['nist-sp800-61r3'], explain: { ja: '実施したことを具体的に列挙すれば、何が済んで何が残るか分かる。引き継ぎにもそのまま使える。', en: '' } }
          - { id: 'in-d-summary', text: { ja: '初動対応はすべて済んだとだけ書いて終えることにする', en: '' }, points: -7, axis: 'content', refs: ['jpcert-handling'], explain: { ja: '済んだとだけ書くと、何をしたか分からない。抜けや重複に気づけず、次の担当が動けない。', en: '' } }
