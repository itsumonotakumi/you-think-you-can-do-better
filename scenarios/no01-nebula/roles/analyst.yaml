          - { id: 'in-x-vague', text: { ja: '個人のSNSに調査中と書いておく', en: '' }, points: -8, axis: 'wording', refs: ['meti-disclosure-guidance'], explain: { ja: '個人の投稿は公式発表と食い違いやすい。特定されれば、会社の説明の信頼も損ない、混乱を招く。', en: '' } }
