  - { id: v05-vendor, media: vendor, misleading: true, type: vendor-interest, text: { ja: 'キーを止めると顧客の業務が止まります。影響が確認できてからでいいのでは。', en: '' }, trigger: { at: point } }
  - { id: v05-law, media: board, misleading: true, type: law-ish, text: { ja: '契約上、キーの失効は顧客の同意が必要です。今は動かさないほうが安全です。', en: '' }, trigger: { at: point } }
