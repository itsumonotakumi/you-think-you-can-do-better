# No.1 ネビュラクラウド / セキュリティ担当者ロール
# 見えるのは、監視画面のアラート、ログ、現場からのチャット。
# 判断ポイント18、細目は choices[].items と drafts の合計で80以上。
estimateMinutes: 40
intro: { ja: 'あなたはネビュラクラウドのセキュリティ担当者。監視画面のアラートと、現場からの電話の間に立つ。半年前に自分が送った指摘メールが、まだどこかに残っている。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-prelim-material
    ref: ppc-report-prelim
    label: { ja: '一次報告と速報の材料提出', en: '' }
    points: -40
    doneFlag: prelimMaterialsSent
  - id: dl-final-material
    ref: ppc-report-final-malicious
    label: { ja: '確報の材料提出', en: '' }
    points: -60
    doneFlag: finalMaterialsSent
events:
  - id: ev-a-night
    at: { day: 1, minutes: 180 }
    voices: [v-ev-night]
    gauges: { stamina: -5 }
    sound: { se: [notify_chat] }
    caption: { ja: '深夜。監視画面のアラートが鳴り続けている。', en: '' }
  - id: ev-a-board
    at: { day: 3, minutes: 900 }
    voices: [v-ev-board]
    gauges: { flame: 5 }
    caption: { ja: '社内掲示板に、現場からの書き込みが増えている。', en: '' }
  - id: ev-a-client
    at: { day: 5, minutes: 600 }
    voices: [v-ev-client]
    gauges: { flame: 5 }
    sound: { se: [phone_ring] }
    caption: { ja: '取引先から、調査状況の説明を求められている。', en: '' }
points:
  - id: a01-first-alert
    at: { day: 0, minutes: 1185 }
    phase: detect
    sound: { se: [notify_chat] }
    text: { ja: '19時45分。顧客の仮想サーバーで不審なプロセスの実行を検知した。同じ時刻、基盤運用部長から「顧客のサーバーに不正プログラムが見つかった」と電話が入る。影響範囲はまだ分からない。', en: '' }
    voices: [v01-vendor, v01-boss, v01-field, v01-ok]
    notable:
      - { id: note-first-alert, text: { ja: '19時45分、顧客の仮想サーバーで不審なプロセスを検知。影響範囲は不明。', en: '' } }
    choices:
      - id: a01-poweroff
        text: { ja: '危険なので、そのサーバーの電源を抜いて止める。', en: '' }
        minutes: 15
        category: hurt
        points: -30
        refs: [nist-sp800-61r3]
        gauges: { damage: -10, stamina: -5 }
        items:
          - { id: a01-a-record, points: -7, axis: record, refs: [nist-sp800-61r3] }
          - { id: a01-a-content, points: -6, axis: content, refs: [jpcert-handling] }
          - { id: a01-a-time, points: 2, axis: time, refs: [nist-sp800-61r3] }
      - id: a01-observe
        text: { ja: '誤検知かもしれない。朝までアラートの推移を見てから動く。', en: '' }
        minutes: 60
        category: hurt
        points: -30
        refs: [jpcert-handling]
        gauges: { damage: 10, flame: 5, trust: -5 }
        coward: true
        items:
          - { id: a01-b-time, points: -7, axis: time, refs: [jpcert-handling] }
          - { id: a01-b-record, points: -6, axis: record, refs: [jpcert-handling] }
      - id: a01-isolate
        text: { ja: '対象サーバーをネットワークから隔離し、メモリとディスクの保全を始める。検知時刻と操作を記録する。', en: '' }
        minutes: 30
        category: maintain
        points: 30
        refs: [nist-sp800-61r3, jpcert-handling]
        gauges: { damage: -5, trust: 5, stamina: -5 }
        setFlags: { isolateStart: true }
        items:
          - { id: a01-c-time, points: 4, axis: time, refs: [jpcert-handling] }
          - { id: a01-c-order, points: 4, axis: order, refs: [nist-sp800-61r3] }
          - { id: a01-c-record, points: 4, axis: record, refs: [jpcert-handling] }
          - { id: a01-c-content, points: 4, axis: content, refs: [nist-sp800-61r3] }
      - id: a01-vendor-first
        text: { ja: '監視サービスのベンダーに一次切り分けを依頼し、結果を待つ。', en: '' }
        minutes: 90
        category: hurt
        points: -30
        refs: [meti-csm-guideline]
        gauges: { damage: 5, trust: -5 }
        items:
          - { id: a01-d-time, points: -6, axis: time, refs: [jpcert-handling] }
          - { id: a01-d-order, points: -3, axis: order, refs: [meti-csm-guideline] }

