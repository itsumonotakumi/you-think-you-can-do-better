    sound: { se: [notify_chat] }
    text: { ja: '20時15分。隔離した一台と同じ認証情報を使うサーバーが、同じネットワークに五百台ある。全部止めれば顧客の取引も止まる。', en: '' }
    voices: [v02-public, v02-past, v02-popular, v02-ok]
    popular: { choiceId: a02-one, percent: 64 }
    choices:
      - id: a02-one
        text: { ja: '隔離した一台だけを止め、ほかは監視を強めて様子を見る。', en: '' }
        minutes: 60
        category: hurt
        points: -30
        refs: [nist-sp800-61r3]
        gauges: { damage: 15, flame: 5 }
        delayed:
          - { afterPhases: 1, points: -18, gauges: { damage: 15, trust: -10 }, reason: { ja: '止めなかったサーバーでも、同じ認証情報を使った不正な通信が続いた。', en: '' } }
        items:
          - { id: a02-a-content, points: -7, axis: content, refs: [nist-sp800-61r3] }
          - { id: a02-a-record, points: 2, axis: record, refs: [jpcert-handling] }
          - { id: a02-a-time, points: -6, axis: time, refs: [nist-sp800-61r3] }
      - id: a02-all
        text: { ja: '影響しうる全サーバーの認証情報を無効化し、順次隔離する。顧客への影響は運用部と調整する。', en: '' }
        minutes: 120
        category: maintain
        points: 30
        refs: [nist-sp800-61r3, meti-csm-guideline]
        gauges: { damage: -20, flame: 10, stamina: -10 }
        setFlags: { contained: true }
        items:
          - { id: a02-b-content, points: 6, axis: content, refs: [nist-sp800-61r3] }
          - { id: a02-b-order, points: 6, axis: order, refs: [meti-csm-guideline] }
          - { id: a02-b-time, points: 4, axis: time, refs: [nist-sp800-61r3] }
          - { id: a02-b-care, points: 4, axis: care, refs: [meti-csm-guideline] }
      - id: a02-ignore
        text: { ja: '監視ツールの誤検知としてアラートを閉じる。', en: '' }
        minutes: 15
        category: hurt
        points: -30
        refs: [jpcert-handling]
        gauges: { damage: 20, trust: -10 }
        coward: true
        items:
          - { id: a02-c-content, points: -10, axis: content, refs: [jpcert-handling] }
          - { id: a02-c-record, points: -7, axis: record, refs: [jpcert-handling] }

