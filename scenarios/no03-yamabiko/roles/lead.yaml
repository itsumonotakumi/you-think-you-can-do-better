# No.3 やまびこ商店 / セキュリティ部門長ロール（外部アドバイザー）
# 専任のセキュリティ部署がない会社なので、要件定義書のとおり、商工会議所の専門家派遣で入る
# 外部の相談員の視点にする。決めるのは店、あなたの仕事は段取りと助言と記録。
# 判断ポイント20、細目は choices[].items と drafts の合計で80以上。
estimateMinutes: 40
intro: { ja: 'あなたは商工会議所の情報セキュリティの相談員。半年前の経営相談で名刺を渡したやまびこ商店から、午前10時15分に電話が入る。専任の担当がいない12人の店で、順番を組み、外の手配をする。決めるのは店で、あなたにできるのは助言と段取りだ。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-ppc-prelim
    ref: ppc-report-prelim
    label: { ja: '個人情報保護委員会への速報', en: '' }
    points: -60
    doneFlag: ppcPrelimFiled
  - id: dl-ppc-final
    ref: ppc-report-final-malicious
    label: { ja: '個人情報保護委員会への確報', en: '' }
    points: -60
    doneFlag: ppcFinalFiled
