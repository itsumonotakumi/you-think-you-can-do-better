  - id: p01-card-call
    at: { day: 0, minutes: 615 }
    phase: detect
    sound: { se: [phone_ring] }
    text: { ja: '午前10時15分。常務の真由美から電話が入る。「カード会社から、うちの決済画面がおかしいと言われました。社長は配達で出ています」。決済も注文も動いたままで、あなたは店の外にいる。', en: '' }
    voices: [v01-ok, v01-boss, v01-public]
    notable:
      - { id: note-first-call, text: { ja: '午前10時、カード会社から決済画面の不審な通信について連絡があった。社長は不在だった。', en: '' } }
    choices:
      - id: p01-hear
        text: { ja: 'カード会社の担当者に代わってもらい、検知の日時・画面・注文番号・折り返し先を聞き取る。聞いた内容と推測を分けて記録し、常務に復唱して、こちらから連絡する時刻を伝える。', en: '' }
