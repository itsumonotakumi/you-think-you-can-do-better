    voices: [v-ev-fake-call]
    gauges: { flame: 10 }
    sound: { se: [notify_sns] }
    caption: { ja: '「カードの不正利用を確認しました」という電話が、高齢の常連客にかかっている。', en: '' }
  - id: ev-advisor-limit
    at: { day: 2, minutes: 1020 }
    voices: [v-ev-hours]
    gauges: { stamina: -5 }
    caption: { ja: '商工会議所から次の案件の連絡。店に使える時間は、今週あと一日になった。', en: '' }
