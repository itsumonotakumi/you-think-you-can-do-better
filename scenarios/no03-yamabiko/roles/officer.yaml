          - { id: np-m-plan, text: { ja: 'サイトの作り直しと点検の時期、担当を書く', en: '' }, points: 8, axis: content, refs: [ipa-sme-guideline] , explain: { ja: '再発防止を具体的に示す判断です。時期と担当があると、口約束ではなく実行の予定として伝わります。', en: '' } }
      - id: contact
        label: { ja: '問い合わせ窓口', en: '' }
        options:
          - { id: np-c-window, text: { ja: '専用の窓口と受付時間を書く', en: '' }, points: 5, axis: care, refs: [ppc-notify-person] , explain: { ja: '問い合わせ先を明示する判断です。専用窓口は、通常の注文対応を止めずに不安に答えられます。', en: '' } }
