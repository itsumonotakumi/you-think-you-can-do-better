# No.3 やまびこ商店 / 役員（常務取締役・通販部門責任者）ロール
# 専任の情報システム部門がない会社なので、報告先を社長、相談先を商工会議所・保険・警察など外部に置く。
# 判断ポイント18、細目は choices[].items と drafts の合計で80以上。
estimateMinutes: 30
intro: { ja: 'あなたはやまびこ商店の常務取締役。経理と通販の運用を預かり、社長である夫の判断を支えている。従業員は12人、情報システムの専任担当はいない。午前10時、カード会社からの電話が、あなたの机にかかる。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-ppc-prelim
    ref: ppc-report-prelim
    label: { ja: '個人情報保護委員会への速報', en: '' }
    points: -150
    doneFlag: ppcPrelimFiled
  - id: dl-ppc-final
    ref: ppc-report-final-malicious
    label: { ja: '個人情報保護委員会への確報', en: '' }
    points: -150
    doneFlag: ppcFinalFiled
events:
  - id: ev-card-second
    at: { day: 2, minutes: 540 }
    when: { flags: { cardCompanyInformed: false } }
    voices: [v-ev-card]
    gauges: { flame: 5 }
    sound: { se: [phone_ring] }
    caption: { ja: 'カード会社から二度目の連絡。前回の回答がまだ届いていない。', en: '' }
  - id: ev-fake-call
    at: { day: 4, minutes: 480 }
    when: { flags: { notifiedToCustomers: false } }
    voices: [v-ev-fake-call]
    gauges: { flame: 10 }
    sound: { se: [notify_sns] }
    caption: { ja: '「カードの不正利用を確認しました」という電話が、高齢の常連客にかかっている。', en: '' }
  - id: ev-local-paper
    at: { day: 5, minutes: 600 }
    voices: [v-ev-paper]
    gauges: { flame: 10 }
    sound: { se: [notify_news] }
    caption: { ja: '地域の新聞の地域面に、小さな記事が出た。', en: '' }
points:
  - id: p01-card-call
    at: { day: 0, minutes: 600 }
    phase: detect
    sound: { se: [phone_ring] }
    text: { ja: '午前10時。カード会社から電話が入る。「御社のサイトの決済画面で、不審な通信が確認されました」。社長は配送先に出ていて不在。決済も注文も、いま動いている。', en: '' }
    voices: [v01-card, v01-boss, v01-warehouse, v01-ok]
    notable:
      - { id: note-first-call, text: { ja: '午前10時、カード会社から決済画面の不審な通信について連絡があった。社長は不在だった。', en: '' } }
    lesson: { ja: '最初の連絡で、いつ・どの画面・どの注文が怪しいかを聞き取り、決済を止める判断が模範です。社長の帰りを待つ間に、偽画面からの注文は積み上がります。常務がその場で止め、関係先と社長に同時に連絡し、時刻と理由を残せば、後の説明もぶれません。', en: '' }
    choices:
      - id: p01-stop-all
        text: { ja: '内容を聞き、決済と注文を止めると自分で決める。関係先と社長に同時に連絡し、時刻と理由を残す。', en: '' }
        explain: { ja: '自分で止める判断をし、連絡と記録を同時に進める模範的な対応です。常務が動くことで、社長の戻りを待たずに被害を止められます。', en: '' }
        minutes: 90
        category: recover
        points: 100
        refs: [jpcert-handling, no03-pci-dss]
        gauges: { flame: 5, damage: -10, trust: 8, stamina: -10 }
        setFlags: { stoppedPayment: true, cardCompanyInformed: true }
        items:
          - { id: p01-c-content, points: 8, axis: content, refs: [no03-pci-dss] }
          - { id: p01-c-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: p01-c-time, points: 5, axis: time, refs: [ipa-sme-guideline] }
          - { id: p01-c-care, points: 5, axis: care, refs: [no03-pci-dss] }
      - id: p01-wait
        text: { ja: '社長の帰りを待ち、今日の発送を終わらせてから、落ち着いて相談して決めようとする。', en: '' }
        explain: { ja: '社長の判断を仰ぐ姿勢は自然ですが、待つ間に偽の決済画面から注文が入ります。初動の記録も取れず、確認が遅れます。', en: '' }
        minutes: 240
        category: hurt
        points: -100
        refs: [ipa-sme-guideline]
        gauges: { flame: 10, damage: 10, trust: -5 }
        coward: true
        setFlags: { waitedBoss: true }
        delayed:
          - { afterPhases: 1, points: -40, gauges: { damage: 15, flame: 5 }, reason: { ja: '待っている間に、偽の決済画面から入力された注文が届いた。', en: '' } }
        items:
          - { id: p01-a-time, points: -10, axis: time, refs: [ipa-sme-guideline] }
          - { id: p01-a-record, points: -8, axis: record, refs: [jpcert-handling] }
          - { id: p01-a-order, points: -5, axis: order, refs: [ipa-sme-guideline] }
      - id: p01-check
        text: { ja: 'カード会社の担当者から、検知した日時・画面・注文番号を聞いて記録し、社長に電話する。', en: '' }
        explain: { ja: '事実を正確に聞き取り、社長につなぐ良い初動です。ただし決済を止める判断まで踏み込んでおらず、その間の注文は守れません。', en: '' }
        minutes: 60
        category: maintain
        points: 20
        refs: [jpcert-handling, ipa-sme-guideline]
        gauges: { flame: -5, trust: 5, stamina: -5 }
        items:
          - { id: p01-b-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: p01-b-order, points: 5, axis: order, refs: [ipa-sme-guideline] }

  - id: p02-vendor
    at: { day: 0, minutes: 660 }
    phase: detect
    sound: { se: [mail_arrive] }
    text: { ja: '昼前。8年前にサイトを作った制作会社の担当者に連絡がついた。「保守は切れていますが、消すだけなら今からでもできます」。社長はまだ戻らない。', en: '' }
    voices: [v02-vendor, v02-expert, v02-ok]
    lesson: { ja: '善意の作業でも、こちらが手順を決める必要があります。まず触るのを止め、スナップショットと画面を残し、誰がいつ何をしたかを書き留めます。再インストールは調査の後に回すのが模範です。早く直したい気持ちが、証拠を消す結果になりがちです。', en: '' }
    choices:
      - id: p02-erase
        text: { ja: '制作会社に頼んで、怪しいファイルだけを消してもらい、早く再開する。', en: '' }
        explain: { ja: '怪しいファイルを消すだけでは、侵入経路や残った仕掛けを見落とします。証拠も消えるため、後から説明できません。', en: '' }
        minutes: 60
        category: fatal
        points: -250
        refs: [jpcert-handling, nist-sp800-61r3]
        gauges: { damage: 15, trust: -10 }
        setFlags: { erasedEvidence: true }
        delayed:
          - { afterPhases: 2, points: -80, gauges: { damage: 20, trust: -15 }, reason: { ja: '侵入経路も漏えいの時期も分からないまま、証拠が消えた。', en: '' } }
        items:
          - { id: p02-a-record, points: -20, axis: record, refs: [jpcert-handling] }
          - { id: p02-a-content, points: -15, axis: content, refs: [nist-sp800-61r3] }
          - { id: p02-a-order, points: -10, axis: order, refs: [nist-sp800-61r3] }
      - id: p02-preserve
        text: { ja: '作業を止めて記録を取り、触った範囲と時刻を書面に残す。直すのは調査の後だ。', en: '' }
        explain: { ja: '証拠保全と作業の統制を両立した模範的な判断です。誰がいつ何に触れたかを残すことで、調査と説明の両方が成り立ちます。', en: '' }
        minutes: 120
        category: recover
        points: 80
        refs: [jpcert-handling, nist-sp800-61r3]
        gauges: { flame: -5, trust: 10, stamina: -10 }
        setFlags: { evidenceKept: true }
        items:
          - { id: p02-c-record, points: 10, axis: record, refs: [jpcert-handling] }
          - { id: p02-c-content, points: 8, axis: content, refs: [nist-sp800-61r3] }
          - { id: p02-c-order, points: 5, axis: order, refs: [nist-sp800-61r3] }
      - id: p02-restore-only
        text: { ja: '復旧作業だけを頼み、触った範囲と時刻を書面で報告してもらう。', en: '' }
        explain: { ja: '作業範囲を記録させる点は前進です。ただし再インストールを許すと、侵入経路や漏えい時期の証拠が失われます。', en: '' }
        minutes: 90
        category: hurt
        points: -60
        refs: [jpcert-handling]
        gauges: { damage: 10, trust: -5 }
        items:
          - { id: p02-b-record, points: -8, axis: record, refs: [jpcert-handling] }
          - { id: p02-b-order, points: -8, axis: order, refs: [cissp-cbk-secops] }

  - id: p03-stop-site
    at: { day: 0, minutes: 840 }
    phase: contain
    sound: { se: [notify_sns] }
    text: { ja: '午後2時。1日の注文は、これから増える。売上の6割は通販で、止めれば今月の給料にも響く。止めるかどうかを、今日中に決めなければならない。', en: '' }
    voices: [v03-public, v03-boss, v03-ok]
    popular: { choiceId: p03-payment-only, percent: 58 }
    lesson: { ja: '売上と安全のどちらかを選ぶ場面ではありません。被害の入口を閉じたうえで、電話やFAXなど別の注文手段を用意し、止めた理由と注文方法を先に伝えます。サイトだけ止めて黙ると、客は問い合わせに困ります。短い停止でも説明があれば信頼は保てます。', en: '' }
    choices:
      - id: p03-payment-only
        text: { ja: '決済だけ止めて、商品ページは開けたまま、注文の電話は受けておく。', en: '' }
        explain: { ja: '売上を守りたい気持ちは分かりますが、改ざんされたページを公開し続けると偽画面の被害が続きます。止める範囲が中途半端です。', en: '' }
        minutes: 60
        category: hurt
        points: -150
        refs: [no03-pci-dss]
        gauges: { damage: 20, flame: 10, trust: -5 }
        coward: true
        setFlags: { keptSite: true }
        delayed:
          - { afterPhases: 1, points: -60, gauges: { damage: 15, trust: -10 }, reason: { ja: '商品ページに残っていた偽の決済画面から、さらに注文が入った。', en: '' } }
        items:
          - { id: p03-a-content, points: -10, axis: content, refs: [no03-pci-dss] }
          - { id: p03-a-care, points: -10, axis: care, refs: [ppc-notify-person] }
          - { id: p03-a-record, points: -5, axis: record, refs: [jpcert-handling] }
      - id: p03-stop
        text: { ja: 'サイト全体を止め、トップに「一時停止」とだけ出して、再開を待つ。', en: '' }
        explain: { ja: '被害の拡大は止まりますが、理由も注文方法も伝えていないため、客は問い合わせに困ります。停止の案内文まで用意したいところです。', en: '' }
        minutes: 60
        category: maintain
        points: 30
        refs: [ipa-sme-guideline]
        gauges: { flame: 10, damage: -15, stamina: -5 }
        setFlags: { stoppedSite: true }
        items:
          - { id: p03-b-content, points: 5, axis: content, refs: [no03-pci-dss] }
          - { id: p03-b-time, points: 5, axis: time, refs: [ipa-sme-guideline] }
      - id: p03-stop-phone
        text: { ja: 'サイトを止めて電話とFAXの注文に切り替え、理由と注文方法をトップと店頭に出す。', en: '' }
        explain: { ja: '売上を完全には失わず、被害も止める判断です。止めた理由と代替の注文方法を先に伝えることで、客の不安と混乱を減らせます。', en: '' }
        minutes: 120
        category: recover
        points: 120
        refs: [ipa-sme-guideline, ppc-notify-person]
        gauges: { flame: 5, damage: -25, trust: 10, stamina: -10 }
        setFlags: { stoppedSite: true, phoneOrders: true }
        items:
          - { id: p03-c-content, points: 8, axis: content, refs: [no03-pci-dss] }
          - { id: p03-c-care, points: 10, axis: care, refs: [ppc-notify-person] }
          - { id: p03-c-time, points: 5, axis: time, refs: [ipa-sme-guideline] }
          - { id: p03-c-wording, points: 5, axis: wording, refs: [meti-disclosure-guidance] }

