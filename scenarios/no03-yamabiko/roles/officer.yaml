          - { id: np-v-shop, text: { ja: '店の損失と再開の見込みを最初に書く', en: '' }, points: -8, axis: care, refs: [ppc-notify-person] , explain: { ja: '店の事情を先に出すと、客への配慮が後回しに見えます。謝罪と被害の説明を先に置くべきです。', en: '' } }
