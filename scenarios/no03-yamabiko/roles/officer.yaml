          - { id: np-p-none, text: { ja: '期間は書かず、分かった時点で改めて知らせる', en: '' }, points: -10, axis: content, refs: [ppc-report-prelim] , explain: { ja: '期間を示さないと、対象かどうか分からず不安が広がります。分かっている範囲だけでも書くべきです。', en: '' } }
