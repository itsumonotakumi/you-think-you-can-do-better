          - { id: np-n-split, text: { ja: '件数は「判明分」と書き、不明点は調査中と明記する', en: '' }, points: 8, axis: wording, refs: [ppc-report-prelim] , explain: { ja: '件数の性格を明示する判断です。判明分と調査中を分けると、後で数字が変わっても説明できます。', en: '' } }
