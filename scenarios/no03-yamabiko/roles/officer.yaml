        category: recover
        points: 100
        refs: [jpcert-handling, no03-pci-dss]
        gauges: { flame: 5, damage: -10, trust: 8, stamina: -10 }
        setFlags: { stoppedPayment: true, cardCompanyInformed: true }
        items:
          - { id: p01-c-content, points: 8, axis: content, refs: [no03-pci-dss] }
          - { id: p01-c-record, points: 8, axis: record, refs: [jpcert-handling] }
