# No.3 やまびこ商店 / 役員（常務取締役・通販部門責任者）ロール
# 専任の情報システム部門がない会社なので、報告先を社長、相談先を商工会議所・保険・警察など外部に置く。
# 判断ポイント18、細目は choices[].items と drafts の合計で80以上。
estimateMinutes: 30
intro: { ja: 'あなたはやまびこ商店の常務取締役。経理と通販の運用を預かり、社長である夫の判断を支えている。従業員は12人、情報システムの専任担当はいない。午前10時、カード会社からの電話が、あなたの机にかかる。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-ppc-prelim
    ref: ppc-report-prelim
    label: { ja: '個人情報保護委員会への速報', en: '' }
    points: -150
    doneFlag: ppcPrelimFiled
  - id: dl-ppc-final
    ref: ppc-report-final-malicious
    label: { ja: '個人情報保護委員会への確報', en: '' }
    points: -150
    doneFlag: ppcFinalFiled
events:
  - id: ev-card-second
    at: { day: 2, minutes: 540 }
    when: { flags: { cardCompanyInformed: false } }
    voices: [v-ev-card]
    gauges: { flame: 5 }
    sound: { se: [phone_ring] }
    caption: { ja: 'カード会社から二度目の連絡。前回の回答がまだ届いていない。', en: '' }
  - id: ev-fake-call
    at: { day: 4, minutes: 480 }
    when: { flags: { notifiedToCustomers: false } }
    voices: [v-ev-fake-call]
    gauges: { flame: 10 }
    sound: { se: [notify_sns] }
    caption: { ja: '「カードの不正利用を確認しました」という電話が、高齢の常連客にかかっている。', en: '' }
  - id: ev-local-paper
    at: { day: 5, minutes: 600 }
    voices: [v-ev-paper]
    gauges: { flame: 10 }
    sound: { se: [notify_news] }
    caption: { ja: '地域の新聞の地域面に、小さな記事が出た。', en: '' }
points:
  - id: p01-card-call
    at: { day: 0, minutes: 600 }
    phase: detect
    sound: { se: [phone_ring] }
    text: { ja: '午前10時。カード会社から電話が入る。「御社のサイトの決済画面で、不審な通信が確認されました」。社長は配送先に出ていて不在。決済も注文も、いま動いている。', en: '' }
    voices: [v01-card, v01-boss, v01-warehouse, v01-ok]
    notable:
      - { id: note-first-call, text: { ja: '午前10時、カード会社から決済画面の不審な通信について連絡があった。社長は不在だった。', en: '' } }
    choices:
      - id: p01-wait
        text: { ja: '社長の帰りを待ち、今日の発送を終わらせてから相談する。', en: '' }
        minutes: 240
        category: hurt
        points: -100
        refs: [ipa-sme-guideline]
        gauges: { flame: 10, damage: 10, trust: -5 }
        coward: true
        setFlags: { waitedBoss: true }
        delayed:
          - { afterPhases: 1, points: -40, gauges: { damage: 15, flame: 5 }, reason: { ja: '待っている間に、偽の決済画面から入力された注文が届いた。', en: '' } }
        items:
          - { id: p01-a-time, points: -10, axis: time, refs: [ipa-sme-guideline] }
          - { id: p01-a-record, points: -8, axis: record, refs: [jpcert-handling] }
          - { id: p01-a-order, points: -5, axis: order, refs: [ipa-sme-guideline] }
      - id: p01-check
        text: { ja: 'カード会社の担当者から、検知した日時・画面・注文番号を聞いて記録し、社長に電話する。', en: '' }
        minutes: 60
        category: maintain
        points: 20
        refs: [jpcert-handling, ipa-sme-guideline]
        gauges: { flame: -5, trust: 5, stamina: -5 }
        items:
