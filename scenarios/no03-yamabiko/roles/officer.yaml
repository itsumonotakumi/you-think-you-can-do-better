      - id: next
        label: { ja: '次の報告', en: '' }
        options:
          - { id: np-x-none, text: { ja: '次回の予定は書かない', en: '' }, points: -5, axis: content, refs: [meti-disclosure-guidance] , explain: { ja: '次回の予定がないと、情報の更新を待てません。追加の説明があることを伝えるべきです。', en: '' } }
          - { id: np-x-next, text: { ja: '次の報告の予定を書く', en: '' }, points: 3, axis: content, refs: [meti-disclosure-guidance] , explain: { ja: '次の連絡を示す判断です。情報が一度で終わらないことが伝わり、客は落ち着いて待てます。', en: '' } }
