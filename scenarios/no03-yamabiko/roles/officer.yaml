        options:
          - { id: np-t-none, text: { ja: '復旧を宣伝に使わない', en: '' }, points: 5, axis: care, refs: [meti-disclosure-guidance] , explain: { ja: '復旧を売り込みに使わない判断です。被害の渦中に宣伝が混ざると、謝罪の誠意が疑われます。', en: '' } }
          - { id: np-t-sale, text: { ja: '再開セールの案内を入れる', en: '' }, points: -15, axis: care, refs: [meti-disclosure-guidance] , explain: { ja: '再開を機に売上を取り戻したい気持ちは分かりますが、被害の案内に販売を混ぜると不誠実に映ります。', en: '' } }
