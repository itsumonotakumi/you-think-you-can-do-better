          - { id: np-a-check, text: { ja: '社長と専門家で文案を確認する', en: '' }, points: 5, axis: order, refs: [cissp-cbk-secops] , explain: { ja: '出す前に複数の目で確認する判断です。法令や表現の抜けを減らし、公表後の訂正も防げます。', en: '' } }
      - id: record
        label: { ja: '記録', en: '' }
        options:
          - { id: np-r-log, text: { ja: '公表した時刻と版を記録する', en: '' }, points: 5, axis: record, refs: [jpcert-handling] , explain: { ja: '公表の記録を残す判断です。いつ何を出したかは、後からの訂正や会見での説明に役立ちます。', en: '' } }
          - { id: np-r-none, text: { ja: '公開の記録は残さない', en: '' }, points: -8, axis: record, refs: [jpcert-handling] , explain: { ja: '記録がないと、いつ何を公表したか説明できません。訂正の履歴も追えなくなり、会見での説明も苦しくなります。', en: '' } }
  final-report:
    title: { ja: '調査報告書の公開範囲', en: '' }
    slots:
      - id: scope
        label: { ja: '公開する範囲', en: '' }
        options:
          - { id: fr-s-hide, text: { ja: '公開せず、社内と取引先だけに共有する', en: '' }, points: -20, axis: content, refs: [meti-disclosure-guidance] , explain: { ja: '社内に閉じると、客や地域への説明が不足します。再発防止の姿勢も外から見えません。', en: '' } }
          - { id: fr-s-full, text: { ja: '攻撃に使える詳細だけ伏せて全文公開する', en: '' }, points: 10, axis: content, refs: [meti-disclosure-guidance] , explain: { ja: '危険な情報だけ伏せて公開する判断です。何が起きたかを説明しつつ、新たな攻撃の材料は出しません。', en: '' } }
