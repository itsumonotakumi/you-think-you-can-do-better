    choices:
      - id: p17-hide
        text: { ja: '報告書は公開せず、確報も出さないまま、店の内情を伏せておこうとする。', en: '' }
        explain: { ja: '内情を伏せたい気持ちは分かりますが、任意の報告まで閉じると、再発防止の姿勢が見えません。説明を求める声に答えられなくなります。', en: '' }
