        category: recover
        points: 100
        refs: [ipa-sme-guideline, ppc-notify-person]
        gauges: { flame: 5, damage: -25, trust: 10, stamina: -10 }
        setFlags: { stoppedSite: true, phoneOrders: true }
        items:
          - { id: p03-c-content, points: 8, axis: content, refs: [no03-pci-dss] }
          - { id: p03-c-care, points: 10, axis: care, refs: [ppc-notify-person] }
          - { id: p03-c-time, points: 5, axis: time, refs: [ipa-sme-guideline] }
          - { id: p03-c-wording, points: 5, axis: wording, refs: [meti-disclosure-guidance] }

