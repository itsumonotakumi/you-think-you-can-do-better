  - id: p14-staff
    at: { day: 9, minutes: 600 }
    phase: recover
    sound: { se: [notify_chat] }
    text: { ja: '9日目の朝。村瀬は問い合わせを一人で回し、妻は経理と窓口の両方に出ている。倉庫の担当者は、夜中まで返品の処理をしている。', en: '' }
    voices: [v14-flattery, v14-public, v14-ok]
    lesson: { ja: '長引く対応では、人の余力を残すことが成果につながります。交代制を決め、臨時のパートや外部の相談窓口を入れ、社員と家族の相談先も案内するのが模範です。全員で走り抜けると、疲労から判断の誤りが生まれます。', en: '' }
    choices:
      - id: p14-allnight
        text: { ja: 'このまま全員で走り抜ける。あと少しで終わるから大丈夫だ。', en: '' }
        explain: { ja: '短期間なら走り抜けられますが、疲労が判断の誤りを招きます。社長が倒れれば、店の意思決定が止まります。', en: '' }
        minutes: 120
