drafts:
  customer-notice:
    title: { ja: 'お客様への通知文', en: '' }
    slots:
      - id: timing
        label: { ja: '出す時刻', en: '' }
        auto: true
        items:
          - { id: cn-t-79h, when: { withinHours: 79 }, points: 10, axis: time, refs: [ppc-notify-person] }
          - { id: cn-t-84h, when: { withinHours: 84 }, points: 3, axis: time, refs: [ppc-notify-person] }
          - { id: cn-t-late, when: { otherwise: true }, points: -15, axis: time, refs: [ppc-notify-person] }
      - id: who
        label: { ja: '対象', en: '' }
        options:
          - { id: cn-w-all, text: { ja: '調査で判明した期間に注文した全員（返品・キャンセルを含む）', en: '' }, points: 10, axis: content, refs: [ppc-notify-person] , explain: { ja: '対象を広く取る判断です。返品やキャンセルの人も含めることで、漏れなく知らせられます。', en: '' } }
          - { id: cn-w-current, text: { ja: '今も会員の人だけに送り、退会した人には送らない', en: '' }, points: -20, axis: content, refs: [ppc-notify-person], delayed: { afterPhases: 1, points: -20, reason: { ja: '対象の訂正が必要になった。', en: '' } } , explain: { ja: '送る手間は減りますが、退会した人ほど被害に気づいていません。対象を狭めると通知漏れになります。', en: '' } }
      - id: leaked
        label: { ja: '何が起きたか', en: '' }
        options:
          - { id: cn-l-vague, text: { ja: '「個人情報の一部が漏れた可能性」とだけ、ぼかして書く', en: '' }, points: -10, axis: content, refs: [no03-pci-dss] , explain: { ja: 'ぼかすと、カード番号が漏れた事実が伝わりません。客は再発行や明細確認の必要に気づけません。', en: '' } }
          - { id: cn-l-fake, text: { ja: '決済画面が差し替えられ、カード番号が外部に送られたと具体的に書く', en: '' }, points: 10, axis: content, refs: [no03-pci-dss] , explain: { ja: '何が漏れたかを具体的に伝えることで、客は自分の被害に気づき、行動できます。曖昧な表現は不安だけを残します。', en: '' } }
      - id: action
        label: { ja: 'お客様が今すること', en: '' }
        options:
          - { id: cn-a-concrete, text: { ja: 'カード会社への連絡、利用明細の確認、必要なら再発行を具体的に書く', en: '' }, points: 10, axis: care, refs: [ppc-notify-person] , explain: { ja: '客が今すぐ取るべき行動を示す判断です。具体的な手順があると、被害の拡大を自分で防げます。', en: '' } }
          - { id: cn-a-generic, text: { ja: '「十分ご注意ください」とだけ書いて、具体的な手順は省く', en: '' }, points: -10, axis: care, refs: [ppc-notify-person] , explain: { ja: '注意を促すだけでは、何をすればよいか分かりません。手順のない案内は、問い合わせを増やすだけになります。', en: '' } }
      - id: phishing
        label: { ja: '偽の連絡への注意', en: '' }
        options:
          - { id: cn-p-none, text: { ja: '偽の電話への注意は書かず、問い合わせがあれば説明する', en: '' }, points: -10, axis: care, refs: [no03-pci-dss] , explain: { ja: '偽の連絡は待っていても防げません。注意を書かないと、客が詐欺の電話に応じてしまいます。', en: '' } }
          - { id: cn-p-warn, text: { ja: '「当店が電話でカード番号を聞くことはありません」と書く', en: '' }, points: 8, axis: care, refs: [no03-pci-dss] , explain: { ja: '漏えい後の偽の電話を防ぐ一文です。実際に起きやすい二次被害への備えとして有効です。', en: '' } }
      - id: contact
        label: { ja: '問い合わせ窓口', en: '' }
        options:
          - { id: cn-c-number, text: { ja: '専用の電話番号だけを書いて、受付時間や代替の連絡先は省く', en: '' }, points: -5, axis: care, refs: [ppc-notify-person] , explain: { ja: '番号だけでは、いつつながるか分かりません。つながらないときに諦められ、不安が残ります。', en: '' } }
          - { id: cn-c-hours, text: { ja: '専用の電話番号と受付時間、つながらないときの連絡先を書く', en: '' }, points: 5, axis: care, refs: [ppc-notify-person] , explain: { ja: '窓口の使い方まで示す判断です。受付時間や代替の連絡先があると、客は安心して問い合わせられます。', en: '' } }
          - { id: cn-c-none, text: { ja: '問い合わせの窓口は書かず、店の通常の番号でよいとする', en: '' }, points: -15, axis: care, refs: [ppc-notify-person] , explain: { ja: '窓口がないと、問い合わせが通常の注文対応に混ざります。対応の遅れと取りこぼしにつながります。', en: '' } }
      - id: apology
        label: { ja: '謝罪の主語', en: '' }
        options:
          - { id: cn-ap-vendor, text: { ja: '「制作会社」の責任として謝罪し、自店の落ち度には触れない', en: '' }, points: -10, axis: wording, refs: [meti-disclosure-guidance] , explain: { ja: '委託先に責任を寄せると、客には他人事のように映ります。自店の確認不足を認めない謝罪は伝わりません。', en: '' } }
          - { id: cn-ap-own, text: { ja: '「当店」として謝罪し、委託先のせいにはしない', en: '' }, points: 3, axis: wording, refs: [meti-disclosure-guidance] , explain: { ja: '自分の店のこととして謝る姿勢です。責任の所在を曖昧にせず、客の信頼を保つ基本になります。', en: '' } }
      - id: next
        label: { ja: '次の連絡', en: '' }
        options:
          - { id: cn-n-next, text: { ja: '次の報告の日を書いて、待ってもらう', en: '' }, points: 3, axis: content, refs: [meti-disclosure-guidance] , explain: { ja: '次の連絡の予定を示す判断です。見通しがあると、客は問い合わせを繰り返さずに待てます。', en: '' } }
          - { id: cn-n-none, text: { ja: '次回の予定は書かずに、決まってから知らせる', en: '' }, points: -5, axis: content, refs: [meti-disclosure-guidance] , explain: { ja: '予定を示さないと、情報が止まったように見えます。次の連絡があること自体を伝えるべきです。', en: '' } }
      - id: excuse
        label: { ja: '前置き', en: '' }
        options:
          - { id: cn-e-skilled, text: { ja: '「巧妙な手口により」と前置きして、自店の落ち度を弱める', en: '' }, points: -10, axis: wording, refs: [meti-disclosure-guidance] , explain: { ja: '手口を強調する前置きは、自店の落ち度を薄めようと見えます。謝罪の前に言い訳が来ると、印象を損ないます。', en: '' } }
          - { id: cn-e-none, text: { ja: '言い訳や前置きを書かず、起きたことをそのまま書く', en: '' }, points: 5, axis: wording, refs: [meti-disclosure-guidance] , explain: { ja: '前置きを置かない判断です。事実を先に書くことで、客は内容を読み取りやすくなります。', en: '' } }
      - id: channel
        label: { ja: '伝える方法', en: '' }
        options:
          - { id: cn-ch-both, text: { ja: 'メールとサイトの両方に出す', en: '' }, points: 5, axis: care, refs: [ppc-notify-person] , explain: { ja: '複数の経路で伝える判断です。メールを見ない人にも届き、同じ内容を後から確認できます。', en: '' } }
          - { id: cn-ch-mail, text: { ja: 'メールだけを送って済ませる', en: '' }, points: -5, axis: care, refs: [ppc-notify-person] , explain: { ja: 'メールだけでは、アドレスが変わった人や見ていない人に届きません。サイトにも同じ案内が要ります。', en: '' } }
      - id: record
        label: { ja: '記録', en: '' }
        options:
          - { id: cn-r-none, text: { ja: '送った記録は残さない', en: '' }, points: -8, axis: record, refs: [jpcert-handling] , explain: { ja: '記録がないと、通知した事実を説明できません。対象の漏れや再送の判断もできなくなります。', en: '' } }
          - { id: cn-r-log, text: { ja: '送った時刻と対象を記録する', en: '' }, points: 5, axis: record, refs: [jpcert-handling] , explain: { ja: '通知の実施を記録する判断です。誰にいつ送ったかは、後の説明と報告の根拠になります。', en: '' } }
  press-release:
    title: { ja: 'サイトに出すお知らせ', en: '' }
    slots:
      - id: facts
        label: { ja: '何が起きたか', en: '' }
        options:
          - { id: pr-f-timeline, text: { ja: '偽の決済画面が表示されたことと、気づいた日を時系列で書く', en: '' }, points: 8, axis: content, refs: [meti-disclosure-guidance] , explain: { ja: '何がいつ起きたかを時系列で示す判断です。客が自分の注文の時期と照らし合わせられます。', en: '' } }
          - { id: pr-f-vague, text: { ja: '「不正アクセスにより」とだけ書いて、日付は伏せる', en: '' }, points: -8, axis: content, refs: [meti-disclosure-guidance] , explain: { ja: '日付がないと、客は自分が対象かどうか判断できません。時期を示すことが説明の第一歩です。', en: '' } }
      - id: period
        label: { ja: '対象の期間', en: '' }
        options:
          - { id: pr-p-none, text: { ja: '期間は書かず、分かった時点で改めて知らせる', en: '' }, points: -10, axis: content, refs: [ppc-report-prelim] , explain: { ja: '期間を示さないと、対象かどうか分からず不安が広がります。分かっている範囲だけでも書くべきです。', en: '' } }
          - { id: pr-p-range, text: { ja: '分かっている期間と、まだ確認中の範囲を分けて書く', en: '' }, points: 8, axis: content, refs: [ppc-report-prelim] , explain: { ja: '確定した範囲と調査中を分ける判断です。不確かな部分を正直に示すことで、後からの訂正も説明できます。', en: '' } }
      - id: numbers
        label: { ja: '件数の書き方', en: '' }
        options:
          - { id: pr-n-split, text: { ja: '件数は「判明分」と書き、不明点は調査中と明記する', en: '' }, points: 8, axis: wording, refs: [ppc-report-prelim] , explain: { ja: '件数の性格を明示する判断です。判明分と調査中を分けると、後で数字が変わっても説明できます。', en: '' } }
          - { id: pr-n-assert, text: { ja: 'すべての件数を断定して書いて、調査中とは書かない', en: '' }, points: -10, axis: wording, refs: [ppc-report-prelim] , explain: { ja: '断定すると、後から件数が増えたときに訂正が必要になります。不確かな数字を確定として出すべきではありません。', en: '' } }
      - id: victims
        label: { ja: '最初に書くこと', en: '' }
        options:
          - { id: pr-v-shop, text: { ja: '店の損失と再開の見込みを最初に書く', en: '' }, points: -8, axis: care, refs: [ppc-notify-person] , explain: { ja: '店の事情を先に出すと、客への配慮が後回しに見えます。謝罪と被害の説明を先に置くべきです。', en: '' } }
          - { id: pr-v-first, text: { ja: '被害に遭ったお客様へのお詫びを最初に書く', en: '' }, points: 8, axis: care, refs: [ppc-notify-person] , explain: { ja: '被害者を最初に置く判断です。誰に向けた文章かが伝わり、店の都合を優先していないことが分かります。', en: '' } }
      - id: measures
        label: { ja: '再発防止', en: '' }
        options:
          - { id: pr-m-plan, text: { ja: 'サイトの作り直しと点検の時期、担当を書く', en: '' }, points: 8, axis: content, refs: [ipa-sme-guideline] , explain: { ja: '再発防止を具体的に示す判断です。時期と担当があると、口約束ではなく実行の予定として伝わります。', en: '' } }
          - { id: pr-m-slogan, text: { ja: '「再発防止に努めます」とだけ書いて、時期は示さない', en: '' }, points: -10, axis: content, refs: [ipa-sme-guideline] , explain: { ja: '決まり文句だけでは、何をいつするのか分かりません。具体的な予定がないと、安心にはつながりません。', en: '' } }
      - id: contact
        label: { ja: '問い合わせ窓口', en: '' }
        options:
          - { id: pr-c-none, text: { ja: '専用の窓口は書かない', en: '' }, points: -10, axis: care, refs: [ppc-notify-person] , explain: { ja: '窓口がないと、客は問い合わせる先を失います。通常の電話が埋まれば、注文にも影響します。', en: '' } }
          - { id: pr-c-window, text: { ja: '専用の窓口と受付時間を書く', en: '' }, points: 5, axis: care, refs: [ppc-notify-person] , explain: { ja: '問い合わせ先を明示する判断です。専用窓口は、通常の注文対応を止めずに不安に答えられます。', en: '' } }
      - id: next
        label: { ja: '次の報告', en: '' }
        options:
          - { id: pr-x-next, text: { ja: '次の報告の予定を書く', en: '' }, points: 3, axis: content, refs: [meti-disclosure-guidance] , explain: { ja: '次の連絡を示す判断です。情報が一度で終わらないことが伝わり、客は落ち着いて待てます。', en: '' } }
          - { id: pr-x-none, text: { ja: '次回の予定は書かない', en: '' }, points: -5, axis: content, refs: [meti-disclosure-guidance] , explain: { ja: '次回の予定がないと、情報の更新を待てません。追加の説明があることを伝えるべきです。', en: '' } }
      - id: tone
        label: { ja: '宣伝との線引き', en: '' }
        options:
          - { id: pr-t-sale, text: { ja: '再開セールの案内を入れる', en: '' }, points: -15, axis: care, refs: [meti-disclosure-guidance] , explain: { ja: '再開を機に売上を取り戻したい気持ちは分かりますが、被害の案内に販売を混ぜると不誠実に映ります。', en: '' } }
          - { id: pr-t-none, text: { ja: '復旧を宣伝に使わない', en: '' }, points: 5, axis: care, refs: [meti-disclosure-guidance] , explain: { ja: '復旧を売り込みに使わない判断です。被害の渦中に宣伝が混ざると、謝罪の誠意が疑われます。', en: '' } }
      - id: approval
        label: { ja: '出す前の確認', en: '' }
        options:
          - { id: pr-a-check, text: { ja: '専門家と家族で文案を確認する', en: '' }, points: 5, axis: order, refs: [cissp-cbk-secops] , explain: { ja: '出す前に複数の目で確認する判断です。法令や表現の抜けを減らし、公表後の訂正も防げます。', en: '' } }
          - { id: pr-a-solo, text: { ja: '社長の判断だけで、確認せずに出す', en: '' }, points: -8, axis: order, refs: [cissp-cbk-secops] , explain: { ja: '一人の判断で出すと、事実の誤りや表現のまずさに気づけません。公表は取り消せないため確認が要ります。', en: '' } }
      - id: record
        label: { ja: '記録', en: '' }
        options:
          - { id: pr-r-none, text: { ja: '公開の記録は残さない', en: '' }, points: -8, axis: record, refs: [jpcert-handling] , explain: { ja: '記録がないと、いつ何を公表したか説明できません。訂正の履歴も追えなくなり、会見での説明も苦しくなります。', en: '' } }
          - { id: pr-r-log, text: { ja: '公表した時刻と版を記録する', en: '' }, points: 5, axis: record, refs: [jpcert-handling] , explain: { ja: '公表の記録を残す判断です。いつ何を出したかは、後からの訂正や会見での説明に役立ちます。', en: '' } }
  final-report:
    title: { ja: '調査報告書の公開範囲', en: '' }
    slots:
      - id: scope
        label: { ja: '公開する範囲', en: '' }
        options:
          - { id: fr-s-full, text: { ja: '攻撃に使える詳細だけ伏せて全文公開する', en: '' }, points: 10, axis: content, refs: [meti-disclosure-guidance] , explain: { ja: '危険な情報だけ伏せて公開する判断です。何が起きたかを説明しつつ、新たな攻撃の材料は出しません。', en: '' } }
          - { id: fr-s-hide, text: { ja: '公開せず、社内と取引先だけに共有する', en: '' }, points: -20, axis: content, refs: [meti-disclosure-guidance] , explain: { ja: '社内に閉じると、客や地域への説明が不足します。再発防止の姿勢も外から見えません。', en: '' } }
      - id: cause
        label: { ja: '原因の書き方', en: '' }
        options:
          - { id: fr-c-vague, text: { ja: '「外部からの攻撃」とだけ書いて、経路は伏せる', en: '' }, points: -10, axis: content, refs: [nist-sp800-61r3] , explain: { ja: '経路を伏せると、何を直したのか分かりません。原因の説明がない報告は、再発防止の根拠になりません。', en: '' } }
          - { id: fr-c-cause, text: { ja: '侵入の経路と、判断の誤りを具体的に書く', en: '' }, points: 10, axis: content, refs: [nist-sp800-61r3] , explain: { ja: '原因と判断の誤りを書く判断です。自店の問題を認める内容は、再発防止の実効性を伝えます。', en: '' } }
      - id: oldsite
        label: { ja: '8年間の放置', en: '' }
        options:
          - { id: fr-o-include, text: { ja: '更新を先送りした経緯と、委託先に複製が残っていたことを書く', en: '' }, points: 10, axis: content, refs: [ipa-sme-guideline] , explain: { ja: '自店と委託先の両方の問題を書く判断です。都合の悪い経緯まで示すことで、説明の信頼性が上がります。', en: '' } }
          - { id: fr-o-omit, text: { ja: '古いサイトを放置した話には触れず、今回だけを書く', en: '' }, points: -15, axis: content, refs: [ipa-sme-guideline] , explain: { ja: '放置の経緯を省くと、同じ判断を繰り返す危険が見えません。原因の一部を隠す報告は説得力を欠きます。', en: '' } }
      - id: measures
        label: { ja: '再発防止策', en: '' }
        options:
          - { id: fr-m-slogan, text: { ja: '「再発防止に努めます」とだけ書いて、時期は書かない', en: '' }, points: -10, axis: content, refs: [cissp-cbk-secops] , explain: { ja: '決まり文句だけでは、何をいつするのか分かりません。具体的な予定のない対策は評価できません。', en: '' } }
          - { id: fr-m-plan, text: { ja: '実施の時期と担当、費用の見込みを具体的に書く', en: '' }, points: 10, axis: content, refs: [cissp-cbk-secops] , explain: { ja: '再発防止を予定として示す判断です。時期、担当、費用があると、実行できる内容として伝わります。', en: '' } }
      - id: victims
        label: { ja: 'お客様への補償', en: '' }
        options:
          - { id: fr-v-record, text: { ja: '補償の内容と、窓口で受けた件数を書く', en: '' }, points: 8, axis: care, refs: [ppc-notify-person] , explain: { ja: '補償の実績を示す判断です。何をどこまで行ったかが分かり、客の不安に具体的に応えられます。', en: '' } }
          - { id: fr-v-none, text: { ja: '補償の内容には触れず、再開だけ知らせる', en: '' }, points: -10, axis: care, refs: [ppc-notify-person] , explain: { ja: '補償に触れないと、被害に遭った客への説明が欠けます。再開の案内だけでは不十分です。', en: '' } }
      - id: progress
        label: { ja: '進捗の公開', en: '' }
        options:
          - { id: fr-p-once, text: { ja: '一度だけ公開して、あとは出さない', en: '' }, points: -5, axis: record, refs: [meti-disclosure-guidance] , explain: { ja: '一度で終えると、その後の進み具合が分かりません。継続して確認できる形が望ましいです。', en: '' } }
          - { id: fr-p-monthly, text: { ja: '再発防止の進捗を毎月公開する', en: '' }, points: 10, axis: record, refs: [meti-disclosure-guidance] , explain: { ja: '進捗を続けて出す判断です。一度きりの報告より、対策が止まっていないことを示せます。', en: '' } }
      - id: share
        label: { ja: '近隣の店への共有', en: '' }
        options:
          - { id: fr-sh-share, text: { ja: '学んだことを商工会議所の勉強会で話す', en: '' }, points: 10, axis: content, refs: [ipa-sme-guideline] , explain: { ja: '地域に経験を共有する判断です。同じ規模の店の備えにつながり、自店の再発防止も定着します。', en: '' } }
          - { id: fr-sh-keep, text: { ja: '学んだことは自店の中だけにとどめる', en: '' }, points: -5, axis: content, refs: [ipa-sme-guideline] , explain: { ja: '内側だけで抱えると、同じ被害が近隣の店に広がります。話せる範囲で共有する価値があります。', en: '' } }
      - id: ad
        label: { ja: '宣伝との線引き', en: '' }
        options:
          - { id: fr-ad-use, text: { ja: '復旧を宣伝に使う', en: '' }, points: -15, axis: care, refs: [meti-disclosure-guidance] , explain: { ja: '復旧を宣伝に使うと、被害者の心情を置き去りにした印象を与えます。信頼の回復より売上を優先したと見られます。', en: '' } }
          - { id: fr-ad-none, text: { ja: '復旧を宣伝に使わない', en: '' }, points: 5, axis: care, refs: [meti-disclosure-guidance] , explain: { ja: '復旧を売り込みに使わない判断です。被害の説明と販売を分けることで、誠実さが伝わります。', en: '' } }
      - id: next
        label: { ja: '次の点検', en: '' }
        options:
          - { id: fr-n-date, text: { ja: '次の点検の日付と担当を書く', en: '' }, points: 5, axis: record, refs: [ipa-sme-guideline] , explain: { ja: '次の点検を約束する判断です。日付と担当があれば、対策が続くことを具体的に示せます。', en: '' } }
          - { id: fr-n-none, text: { ja: '次回の予定は書かない', en: '' }, points: -5, axis: record, refs: [ipa-sme-guideline] , explain: { ja: '次回の予定がないと、対策が今回限りに見えます。継続して点検する見通しを具体的に示すべきです。', en: '' } }
voices:
