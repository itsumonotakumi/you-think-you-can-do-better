# No.3 やまびこ商店 / 経営者ロール
# 判断ポイント16、細目は choices[].items と drafts の合計で80以上。
estimateMinutes: 30
intro: { ja: 'あなたはやまびこ商店の社長。従業員は12人、家族と近所の人がほとんどだ。8年前に作ったサイトの保守は切れている。カード会社からの電話で、いつもの朝が終わる。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-ppc-prelim
    ref: ppc-report-prelim
    label: { ja: '個人情報保護委員会への速報', en: '' }
    points: -120
    doneFlag: ppcFiled
  - id: dl-ppc-final
    ref: ppc-report-final-malicious
    label: { ja: '個人情報保護委員会への確報', en: '' }
    points: -150
    doneFlag: ppcFinalFiled
events:
  - id: ev-card-second
    at: { day: 2, minutes: 540 }
    when: { flags: { cardCompanyInformed: false } }
    voices: [v-ev-card]
    gauges: { flame: 5 }
    sound: { se: [phone_ring] }
    caption: { ja: 'カード会社から二度目の連絡。前回の回答がまだ来ていない。', en: '' }
  - id: ev-fake-support
    at: { day: 4, minutes: 480 }
    when: { flags: { notified: false } }
    voices: [v-ev-fake-support]
    gauges: { flame: 10 }
    sound: { se: [notify_sns] }
    caption: { ja: '「カードの不正利用を確認しました」という電話が、高齢の常連客にかかっている。', en: '' }
  - id: ev-local-paper
    at: { day: 5, minutes: 600 }
    voices: [v-ev-paper]
    gauges: { flame: 10 }
    sound: { se: [notify_news] }
    caption: { ja: '地域の新聞の地域面に、小さな記事が出た。', en: '' }
points:
  - id: p01-card-call
    at: { day: 0, minutes: 600 }
    phase: detect
    sound: { se: [phone_ring] }
    text: { ja: '午前10時。配達先にいるあなたの携帯に、妻から電話が転送される。「カード会社が、うちの決済画面で不審な通信があったと」。8年前に制作会社が作ったままのサイトで、保守契約はもうない。', en: '' }
    voices: [v01-card, v01-wife, v01-ok]
    notable:
      - { id: note-first-call, text: { ja: '午前10時、カード会社から決済画面の不審な通信について連絡があった。', en: '' } }
    lesson: { ja: '最初の連絡で、いつ・どの画面・どの注文が怪しいかを聞き取り、決済を止める判断が模範です。発送を優先して確認を遅らせると、偽画面からの注文が積み上がります。落ち着いて記録を取り、カード会社とサーバー会社につなぐことが、後の説明の土台になります。', en: '' }
    choices:
      - id: p01-stop-check
        text: { ja: 'カートを止め、決済画面を保存して、カード会社とサーバー会社に連絡する。', en: '' }
        explain: { ja: '被害の拡大を止めながら証拠を残す、模範に近い判断です。停止と保存、連絡を同じ時間帯に進めており、後の説明にも困りません。', en: '' }
        minutes: 90
        category: recover
        points: 80
        refs: [jpcert-handling, no03-pci-dss]
        gauges: { flame: 5, damage: -10, trust: 8, stamina: -10 }
        setFlags: { stoppedCart: true, cardCompanyInformed: true }
        items:
          - { id: p01-c-content, points: 8, axis: content, refs: [no03-pci-dss] }
          - { id: p01-c-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: p01-c-care, points: 5, axis: care, refs: [no03-pci-dss] }
          - { id: p01-c-time, points: 5, axis: time, refs: [ipa-sme-guideline] }
      - id: p01-later
        text: { ja: '電話を保留にして、今日の発送を終わらせてから、夕方に調べる。', en: '' }
        explain: { ja: '目の前の業務を優先した判断です。確認が数時間遅れる間に、偽の決済画面から注文が入る可能性が残り、初動の記録も取れません。', en: '' }
        minutes: 240
        category: hurt
        points: -100
        refs: [ipa-sme-guideline]
        gauges: { flame: 10, damage: 10, trust: -5 }
        coward: true
        setFlags: { delayedCheck: true }
        delayed:
          - { afterPhases: 1, points: -40, gauges: { damage: 15, flame: 5 }, reason: { ja: 'その日のうちに、偽の決済画面から入力された注文が届いた。', en: '' } }
        items:
          - { id: p01-a-time, points: -10, axis: time, refs: [ipa-sme-guideline] }
          - { id: p01-a-record, points: -8, axis: record, refs: [jpcert-handling] }
          - { id: p01-a-order, points: -8, axis: order, refs: [ipa-sme-guideline] }
      - id: p01-details
        text: { ja: 'カード会社の担当者から、検知の日時・画面・注文番号を聞き取り、記録する。', en: '' }
        explain: { ja: '事実を正確に聞き取り記録する良い初動です。ただし聞くだけで決済を止めていないため、その間の注文は守れません。', en: '' }
        minutes: 60
        category: maintain
        points: 20
        refs: [jpcert-handling]
        gauges: { flame: -5, trust: 5, stamina: -5 }
        items:
          - { id: p01-b-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: p01-b-order, points: 5, axis: order, refs: [ipa-sme-guideline] }
          - { id: p01-b-time, points: 3, axis: time, refs: [jpcert-handling] }

  - id: p02-reinstall
    at: { day: 0, minutes: 720 }
    phase: contain
    sound: { se: [notify_chat] }
    text: { ja: '昼休み。倉庫の常連客だった技術者が顔を出す。「とりあえず再インストールしておきました。これで安全です」。管理画面を開くと、すでに作業が始まっている。', en: '' }
    voices: [v02-friend, v02-expert, v02-ok]
    notable:
      - { id: note-reinstall, text: { ja: '知人の技術者が、こちらの許可なくサイトの再インストールを始めていた。', en: '' } }
    lesson: { ja: '善意の作業でも、こちらが手順を決める必要があります。まず触るのを止め、スナップショットと画面を残し、誰がいつ何をしたかを書き留めます。再インストールは調査の後に回すのが模範です。早く安全にしたい気持ちが、証拠を消す結果になりがちです。', en: '' }
    choices:
      - id: p02-let
        text: { ja: '知人の作業をそのまま任せる。早く安全になるなら、それで構わない。', en: '' }
        explain: { ja: '善意でも、許可なく再インストールされると侵入経路や漏えい時期の証拠が消えます。原因が分からないまま復旧し、同じ穴が残ります。', en: '' }
        minutes: 60
        category: fatal
        points: -250
        refs: [jpcert-handling, nist-sp800-61r3]
        gauges: { damage: 15, trust: -10 }
        setFlags: { reinstalled: true }
        delayed:
          - { afterPhases: 2, points: -80, gauges: { damage: 20, trust: -15 }, reason: { ja: '侵入経路も漏えいの時期も分からないまま、再インストールで証拠が消えた。', en: '' } }
        items:
          - { id: p02-a-record, points: -20, axis: record, refs: [jpcert-handling] }
          - { id: p02-a-content, points: -15, axis: content, refs: [nist-sp800-61r3] }
          - { id: p02-a-care, points: -5, axis: care, refs: [ipa-sme-guideline] }
      - id: p02-snapshot-seal
        text: { ja: '作業を止めて記録を取り、触った範囲と時刻を書面に残す。入れ直しは調査の後だ。', en: '' }
        explain: { ja: '証拠保全と作業の統制を両立した模範的な判断です。誰がいつ何に触れたかを残すことで、調査と説明の両方が成り立ちます。', en: '' }
        minutes: 120
        category: recover
        points: 80
        refs: [jpcert-handling, nist-sp800-61r3]
        gauges: { flame: -5, trust: 10, stamina: -10 }
        setFlags: { snapshot: true, evidenceSealed: true }
        items:
          - { id: p02-c-record, points: 10, axis: record, refs: [jpcert-handling] }
          - { id: p02-c-content, points: 8, axis: content, refs: [nist-sp800-61r3] }
          - { id: p02-c-order, points: 5, axis: order, refs: [nist-sp800-61r3] }
          - { id: p02-c-care, points: 3, axis: care, refs: [ipa-sme-guideline] }
      - id: p02-snapshot
        text: { ja: '作業を止め、レンタルサーバーのスナップショットと画面の記録を先に取る。', en: '' }
        explain: { ja: '証拠を残す順序は正しい判断です。ただし触った範囲や時刻を書面にせず、再インストールの可否も決めていないため、後の説明が弱くなります。', en: '' }
        minutes: 90
        category: maintain
        points: 20
        refs: [jpcert-handling]
        gauges: { trust: 5, stamina: -10 }
        setFlags: { snapshot: true }
        items:
          - { id: p02-b-record, points: 10, axis: record, refs: [jpcert-handling] }
          - { id: p02-b-order, points: 5, axis: order, refs: [nist-sp800-61r3] }

  - id: p03-stop-site
    at: { day: 0, minutes: 840 }
    phase: contain
    sound: { se: [notify_sns] }
    text: { ja: '午後2時。1日の注文は、いつもこの時間から増える。サイトの売上が6割を占める店で、止めるかどうかを今日中に決めなければならない。', en: '' }
    voices: [v03-public, v03-coward, v03-wife, v03-ok]
    lesson: { ja: '売上と安全のどちらかを選ぶ場面ではありません。被害の入口を閉じたうえで、電話やFAXなど別の注文手段を用意し、止めた理由と注文方法を先に伝えます。サイトだけ止めて黙ると、客は問い合わせに困ります。短い停止でも説明があれば信頼は保てます。', en: '' }
    choices:
      - id: p03-keep
        text: { ja: '決済だけ止めて、商品ページは開けたまま、注文の電話は受けておく。', en: '' }
        explain: { ja: '売上を守りたい気持ちは分かりますが、改ざんされたページを公開し続けると偽画面の被害が続きます。止める範囲が中途半端です。', en: '' }
        minutes: 60
        category: hurt
        points: -150
        refs: [no03-pci-dss]
        gauges: { damage: 20, flame: 10, trust: -5 }
        coward: true
        setFlags: { keptSite: true }
        delayed:
          - { afterPhases: 1, points: -60, gauges: { damage: 15, trust: -10 }, reason: { ja: '商品ページに残っていた偽の決済画面から、さらに注文が入った。', en: '' } }
        items:
          - { id: p03-a-content, points: -10, axis: content, refs: [no03-pci-dss] }
          - { id: p03-a-care, points: -10, axis: care, refs: [ppc-notify-person] }
          - { id: p03-a-record, points: -5, axis: record, refs: [jpcert-handling] }
      - id: p03-stop
        text: { ja: 'サイト全体を止め、トップに「一時停止」とだけ出して、再開を待つ。', en: '' }
        explain: { ja: '被害の拡大は止まりますが、理由も注文方法も伝えていないため、客は問い合わせに困ります。停止の案内文まで用意したいところです。', en: '' }
        minutes: 60
        category: maintain
        points: 20
        refs: [ipa-sme-guideline]
        gauges: { flame: 10, damage: -15, stamina: -5 }
        setFlags: { stoppedSite: true }
        items:
          - { id: p03-b-content, points: 5, axis: content, refs: [no03-pci-dss] }
          - { id: p03-b-time, points: 5, axis: time, refs: [ipa-sme-guideline] }
      - id: p03-stop-care
        text: { ja: 'サイトを止めて電話とFAXの注文に切り替え、理由と注文方法をトップと店頭に出す。', en: '' }
        explain: { ja: '売上を完全には失わず、被害も止める判断です。止めた理由と代替の注文方法を先に伝えることで、客の不安と混乱を減らせます。', en: '' }
        minutes: 120
        category: recover
        points: 100
        refs: [ipa-sme-guideline, ppc-notify-person]
        gauges: { flame: 5, damage: -25, trust: 10, stamina: -10 }
        setFlags: { stoppedSite: true, phoneOrders: true }
        items:
          - { id: p03-c-content, points: 8, axis: content, refs: [no03-pci-dss] }
          - { id: p03-c-care, points: 10, axis: care, refs: [ppc-notify-person] }
          - { id: p03-c-time, points: 5, axis: time, refs: [ipa-sme-guideline] }
          - { id: p03-c-wording, points: 5, axis: wording, refs: [meti-disclosure-guidance] }

  - id: p04-password
    at: { day: 1, minutes: 540 }
    phase: contain
    sound: { se: [notify_chat] }
    text: { ja: '翌朝。管理画面のパスワードは、倉庫のホワイトボードに書いたまま、あなたと倉庫の熊谷、事務の村瀬の3人で共用している。変更すると、今日の出荷が止まる。', en: '' }
    voices: [v04-law, v04-insider, v04-ok]
    lesson: { ja: '共用のパスワードは、誰が使ったか分からないまま侵入を許します。変更と同時に、共有していた端末やサービスを洗い出し、変更の時刻と担当を記録するのが模範です。出荷を理由に延期すると、同じ資格情報から再び侵入されます。', en: '' }
    choices:
      - id: p04-change-record
        text: { ja: '全員のパスワードを変え、共有していた端末とサービスを洗い出す。時刻と担当も記録する。', en: '' }
        explain: { ja: '変更と洗い出し、記録をまとめて行う良い判断です。共用の範囲を把握することで、同じ資格情報を使い回した危険を減らせます。', en: '' }
        minutes: 120
        category: recover
        points: 50
        refs: [ipa-sme-guideline, cissp-cbk-secops]
        gauges: { damage: -15, trust: 8, stamina: -10 }
        setFlags: { passwordChanged: true }
        items:
          - { id: p04-c-content, points: 8, axis: content, refs: [ipa-sme-guideline] }
          - { id: p04-c-record, points: 8, axis: record, refs: [cissp-cbk-secops] }
          - { id: p04-c-care, points: 5, axis: care, refs: [ipa-sme-guideline] }
          - { id: p04-c-order, points: 5, axis: order, refs: [jpcert-handling] }
      - id: p04-keep
        text: { ja: '出荷が落ち着くまで、パスワードは変えずに、いつもの共用のままにしておく。', en: '' }
        explain: { ja: '変更の手間を避けた判断です。共用のままでは侵入された経路が残り、誰が使ったかも分かりません。延期するほど被害が続きます。', en: '' }
        minutes: 90
        category: hurt
        points: -100
        refs: [ipa-sme-guideline]
        gauges: { damage: 15, trust: -10 }
        items:
          - { id: p04-a-record, points: -10, axis: record, refs: [jpcert-handling] }
          - { id: p04-a-content, points: -10, axis: content, refs: [ipa-sme-guideline] }
          - { id: p04-a-care, points: -5, axis: care, refs: [ipa-sme-guideline] }
      - id: p04-change
        text: { ja: '全員のパスワードを変更し、ホワイトボードの記載もすぐに消して回る。', en: '' }
        explain: { ja: 'パスワード変更そのものは必要です。ただし共用していた端末やサービスを洗い出さず、記録も残さないため、再発の確認ができません。', en: '' }
        minutes: 60
        category: maintain
        points: 20
        refs: [ipa-sme-guideline]
        gauges: { damage: -10, stamina: -5 }
        items:
          - { id: p04-b-content, points: 8, axis: content, refs: [ipa-sme-guideline] }
          - { id: p04-b-care, points: 5, axis: care, refs: [ipa-sme-guideline] }

  - id: p05-forensics
    at: { day: 1, minutes: 840 }
    phase: organize
    sound: { se: [mail_arrive] }
    text: { ja: '午後2時。調査会社の見積もりは120万円。去年の利益より大きい。制作会社は「うちで消しておきます。費用は抑えます」と言う。', en: '' }
    voices: [v05-vendor, v05-public, v05-ok]
    lesson: { ja: '調査は原因と範囲を知るために必要です。費用を抑えたい気持ちは分かりますが、怪しいファイルを消すだけでは侵入経路が残ります。範囲を決めて調査を頼み、無料の専門家派遣や警察への相談、保険の確認まで進めると、小さな店でも再発防止と説明の両方に備えられます。', en: '' }
    choices:
      - id: p05-scoped-support
        text: { ja: '範囲を決めて調査を頼み、専門家派遣と警察への相談も申し込み、保険も確認する。', en: '' }
        explain: { ja: '調査と並行して無料の支援や警察への相談、保険の確認まで進める判断です。小さな店でも使える制度を押さえ、再発防止と説明に備えます。', en: '' }
        minutes: 180
        category: recover
        points: 100
        refs: [nist-sp800-61r3, ipa-sme-guideline]
        gauges: { damage: -15, trust: 10, stamina: -15 }
        setFlags: { investigation: true, advisor: true }
        items:
          - { id: p05-d-content, points: 8, axis: content, refs: [nist-sp800-61r3] }
          - { id: p05-d-order, points: 8, axis: order, refs: [ipa-sme-guideline] }
          - { id: p05-d-record, points: 5, axis: record, refs: [jpcert-handling] }
          - { id: p05-d-care, points: 5, axis: care, refs: [npa-consult] }
      - id: p05-none
        text: { ja: '調査はしない。サイトを作り直せば、原因は分からなくても困らないと考える。', en: '' }
        explain: { ja: '作り直せば動きますが、原因が分からないままでは同じ穴が残ります。報告や再発防止の根拠も作れず、次の被害につながります。', en: '' }
        minutes: 60
        category: hurt
        points: -150
        refs: [nist-sp800-61r3]
        gauges: { damage: 15, trust: -10 }
        setFlags: { noInvestigation: true }
        items:
          - { id: p05-a-content, points: -15, axis: content, refs: [nist-sp800-61r3] }
          - { id: p05-a-record, points: -10, axis: record, refs: [jpcert-handling] }
          - { id: p05-a-care, points: -8, axis: care, refs: [ppc-notify-person] }
      - id: p05-cheap
        text: { ja: '制作会社に頼んで、怪しいファイルだけを消してもらい、費用を抑える。', en: '' }
        explain: { ja: '怪しいファイルを消すだけでは、侵入経路や残った仕掛けを見落とします。証拠も消えるため、後から説明できません。', en: '' }
        minutes: 60
        category: hurt
        points: -100
        refs: [jpcert-handling]
        gauges: { damage: 10, trust: -5 }
        setFlags: { cheapCleanup: true }
        items:
          - { id: p05-b-record, points: -12, axis: record, refs: [jpcert-handling] }
          - { id: p05-b-content, points: -10, axis: content, refs: [nist-sp800-61r3] }
          - { id: p05-b-order, points: -5, axis: order, refs: [nist-sp800-61r3] }
      - id: p05-scoped
        text: { ja: '範囲を決めて、外部の調査会社に最小限の調査だけを頼み、費用を抑える。', en: '' }
        explain: { ja: '範囲を絞った調査は、費用を抑える現実的な一歩です。ただし再発防止や外部の支援、保険の確認まで届いていないため加点は控えめです。', en: '' }
        minutes: 120
        category: maintain
        points: 30
        refs: [nist-sp800-61r3]
        gauges: { damage: -10, stamina: -10 }
        setFlags: { investigation: true }
        items:
          - { id: p05-c-content, points: 8, axis: content, refs: [nist-sp800-61r3] }
          - { id: p05-c-record, points: 5, axis: record, refs: [jpcert-handling] }

  - id: p06-advisor
    at: { day: 1, minutes: 1080 }
    phase: organize
    sound: { se: [notify_chat] }
