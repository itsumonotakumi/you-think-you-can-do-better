    voices: [v03-public, v03-coward, v03-wife, v03-ok]
    choices:
      - id: p03-keep
        text: { ja: '決済だけ止めて、商品ページは開けておく。', en: '' }
        minutes: 60
        category: hurt
        points: -150
        refs: [no03-pci-dss]
        gauges: { damage: 20, flame: 10, trust: -5 }
        coward: true
        setFlags: { keptSite: true }
        delayed:
