          - { id: p15-b-record, points: 8, axis: record, refs: [cissp-cbk-secops] }
          - { id: p15-b-wording, points: 5, axis: wording, refs: [meti-disclosure-guidance] }
      - id: p15-publish-share
        text: { ja: '攻撃に使える部分を伏せて公開し、確報も出す。進み具合を毎月出し、学びは勉強会で話す。', en: '' }
        explain: { ja: '公開に加えて進捗の継続公表と地域への共有まで行う判断です。小さな店の経験を外に出し、再発防止を止めない仕組みになります。', en: '' }
        minutes: 240
        category: increase
        points: 300
        fatalAlternate: 50
        refs: [meti-disclosure-guidance, ipa-sme-guideline]
        gauges: { flame: -15, trust: 20, stamina: -15 }
