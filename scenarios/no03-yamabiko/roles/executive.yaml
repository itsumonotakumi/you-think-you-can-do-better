          - { id: p13-c-care, points: 5, axis: care, refs: [ppc-notify-person] }
      - id: p13-rush
        text: { ja: '全面再開して、監視はいつもどおりの体制で続ける。', en: '' }
        explain: { ja: '全面再開は早く見えますが、監視が従来のままで、異常に気づけません。再び被害が出れば、信用の回復は難しくなります。', en: '' }
        minutes: 60
        category: hurt
        points: -150
        refs: [nist-sp800-61r3]
        gauges: { damage: 15, flame: 10, trust: -10 }
