          - { id: p16-c-record, points: 5, axis: record, refs: [jpcert-handling] }
      - id: p16-short
        text: { ja: '会見は十分ほどで切り上げ、質問の数を制限しておくつもりだ。', en: '' }
        explain: { ja: '短く切り上げれば失点は減るように見えますが、質問を制限するとHideした印象を与えます。説明不足は後から批判されます。', en: '' }
        minutes: 45
        category: hurt
        points: -60
        refs: [meti-disclosure-guidance]
        gauges: { flame: 12, trust: -8 }
        items:
          - { id: p16-a-care, points: -10, axis: care, refs: [meti-disclosure-guidance] }
          - { id: p16-a-care2, points: -8, axis: care, refs: [meti-disclosure-guidance] }
      - id: p16-facts
        text: { ja: '記録を手元に置いておき、聞かれた事実だけを答えていく。', en: '' }
        explain: { ja: '事実だけを答える姿勢は安全ですが、被害者の心情や今後の見通しに触れないため、誠意が伝わりにくくなります。', en: '' }
        minutes: 90
        category: maintain
