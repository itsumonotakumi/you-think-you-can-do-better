          - { id: p15-c-record, points: 8, axis: record, refs: [cissp-cbk-secops] }
          - { id: p15-c-care, points: 8, axis: care, refs: [ipa-sme-guideline] }

  - id: p16-press
    at: { day: 31, minutes: 540 }
    phase: after
    sound: { se: [shutter] }
    text: { ja: '会見を明日に控えた朝。妻が「聞かれることは決まっている」と、質問を三つ書いた紙を置いていく。', en: '' }
    voices: [v16-coward, v16-flattery, v16-ok]
    lesson: { ja: '会見は、準備した事実と被害者への配慮で信頼が決まります。想定問答を家族と専門家で確認し、最初に被害に遭った人のことを述べ、分からないことは調べて答えるのが模範です。短く切り上げたり、事実だけを淡々と答えると、誠意が伝わりません。', en: '' }
    choices:
      - id: p16-ready
        text: { ja: '想定問答を家族と専門家で確認し、被害に遭った人のことを最初に述べる。', en: '' }
        explain: { ja: '準備と被害者への配慮を両立した判断です。分からないことを調べて答える姿勢も、会見では信頼につながります。', en: '' }
        minutes: 150
