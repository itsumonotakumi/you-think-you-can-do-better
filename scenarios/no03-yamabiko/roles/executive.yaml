          - { id: p13-a-record, points: -10, axis: record, refs: [jpcert-handling] }
          - { id: p13-a-care, points: -8, axis: care, refs: [ppc-notify-person] }
      - id: p13-step
        text: { ja: '段階的に再開して、注文を少ない数から受けてみる。', en: '' }
        explain: { ja: '段階的な再開は被害を抑える良い方法です。ただし監視と中止の条件がなく、異常が起きたときに止められません。', en: '' }
