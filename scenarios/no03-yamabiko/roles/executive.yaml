          - { id: p15-a-content, points: -12, axis: content, refs: [meti-disclosure-guidance] }
          - { id: p15-a-wording, points: -10, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: p15-a-record, points: -8, axis: record, refs: [cissp-cbk-secops] }
      - id: p15-publish
        text: { ja: '攻撃に使える部分だけ伏せて、報告書を公開し、確報を期限どおり出す。', en: '' }
        explain: { ja: '公開と確報の提出を両立した判断です。攻撃に使える情報を伏せつつ、起きたことを説明する姿勢が信頼につながります。', en: '' }
        minutes: 180
        category: recover
        points: 100
        refs: [meti-disclosure-guidance]
        gauges: { flame: -10, trust: 12, stamina: -10 }
        setFlags: { reportPublished: true, ppcFinalFiled: true }
