  - id: p13-reopen
    at: { day: 8, minutes: 600 }
    phase: recover
    sound: { se: [notify_sns] }
    text: { ja: '8日目の朝。新しいサイトの検証が終わった。再開を急ぐ声と、もう一度確かめたい声がある。', en: '' }
    voices: [v13-public, v13-coward, v13-ok]
    lesson: { ja: '再開は早さよりも条件が大切です。段階的に注文を戻し、一定期間は外部の監視を続け、再開と中止の条件を先に決めて公表するのが模範です。全面再開して従来の監視のままだと、異常に気づけません。', en: '' }
    choices:
      - id: p13-step-monitor
        text: { ja: '段階的に再開して監視を続け、再開と中止の条件は先に公表する。', en: '' }
        explain: { ja: '段階的な再開に監視と中止条件を組み合わせた模範的な判断です。止める基準を先に示すことで、公表の信頼も保てます。', en: '' }
        minutes: 240
        category: recover
        points: 80
        refs: [nist-sp800-61r3, meti-disclosure-guidance]
        gauges: { damage: -15, trust: 10, stamina: -15 }
