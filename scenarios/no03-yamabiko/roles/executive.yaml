          - { id: p14-c-care2, points: 8, axis: care, refs: [ipa-sme-guideline] }
          - { id: p14-c-care3, points: 8, axis: care, refs: [ipa-sme-guideline] }
          - { id: p14-c-order, points: 5, axis: order, refs: [cissp-cbk-secops] }
      - id: p14-shift
        text: { ja: '交代制を決めて、社長も休む日を先に作っておくようにする。', en: '' }
        explain: { ja: '交代制と休息は必要な判断です。ただし人手の補充や相談先の案内がなく、負担は結局家族に戻ります。', en: '' }
        minutes: 90
