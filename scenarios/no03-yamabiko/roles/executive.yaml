        text: { ja: '交代制にして臨時のパートを入れ、社員と家族の相談先も伝える。', en: '' }
        explain: { ja: '交代制に加えて人手と相談先を用意する模範的な判断です。社員と家族の余力を残すことが、長期の対応を支えます。', en: '' }
        minutes: 150
        category: recover
        points: 80
        refs: [ipa-sme-guideline]
        gauges: { stamina: 15, trust: 10, flame: -5 }
        setFlags: { staffSupport: true }
