# No.3 やまびこ商店 / 経営者ロール
# 判断ポイント16、細目は choices[].items と drafts の合計で80以上。
estimateMinutes: 30
intro: { ja: 'あなたはやまびこ商店の社長。従業員は12人、家族と近所の人がほとんどだ。8年前に作ったサイトの保守は切れている。カード会社からの電話で、いつもの朝が終わる。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-ppc-prelim
    ref: ppc-report-prelim
    label: { ja: '個人情報保護委員会への速報', en: '' }
    points: -120
    doneFlag: ppcFiled
events:
  - id: ev-card-second
    at: { day: 2, minutes: 540 }
    when: { flags: { cardCompanyInformed: false } }
    voices: [v-ev-card]
    gauges: { flame: 5 }
    sound: { se: [phone_ring] }
    caption: { ja: 'カード会社から二度目の連絡。前回の回答がまだ来ていない。', en: '' }
  - id: ev-fake-support
    at: { day: 4, minutes: 480 }
    when: { flags: { notified: false } }
    voices: [v-ev-fake-support]
    gauges: { flame: 10 }
    sound: { se: [notify_sns] }
    caption: { ja: '「カードの不正利用を確認しました」という電話が、高齢の常連客にかかっている。', en: '' }
  - id: ev-local-paper
    at: { day: 5, minutes: 600 }
    voices: [v-ev-paper]
    gauges: { flame: 10 }
    sound: { se: [notify_news] }
    caption: { ja: '地域の新聞の地域面に、小さな記事が出た。', en: '' }
points:
  - id: p01-card-call
    at: { day: 0, minutes: 600 }
    phase: detect
    sound: { se: [phone_ring] }
    text: { ja: '午前10時。カード会社から電話が入る。「御社のサイトの決済画面で、不審な通信が確認されました」。8年前に制作会社が作ったままのサイトで、保守契約はもうない。', en: '' }
    voices: [v01-card, v01-wife, v01-ok]
    notable:
      - { id: note-first-call, text: { ja: '午前10時、カード会社から決済画面の不審な通信について連絡があった。', en: '' } }
    choices:
      - id: p01-later
        text: { ja: '電話を保留にして、今日の発送を終わらせてから調べる。', en: '' }
        minutes: 240
        category: hurt
        points: -100
        refs: [ipa-sme-guideline]
        gauges: { flame: 10, damage: 10, trust: -5 }
        coward: true
        setFlags: { delayedCheck: true }
        delayed:
          - { afterPhases: 1, points: -40, gauges: { damage: 15, flame: 5 }, reason: { ja: 'その日のうちに、偽の決済画面から入力された注文が届いた。', en: '' } }
        items:
          - { id: p01-a-time, points: -10, axis: time, refs: [ipa-sme-guideline] }
          - { id: p01-a-record, points: -8, axis: record, refs: [jpcert-handling] }
          - { id: p01-a-order, points: -8, axis: order, refs: [ipa-sme-guideline] }
      - id: p01-details
        text: { ja: 'カード会社の担当者から、検知した日時・画面・注文番号を聞き取り、記録する。', en: '' }
        minutes: 60
        category: maintain
        points: 20
        refs: [jpcert-handling]
        gauges: { flame: -5, trust: 5, stamina: -5 }
        items:
          - { id: p01-b-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: p01-b-order, points: 5, axis: order, refs: [ipa-sme-guideline] }
          - { id: p01-b-time, points: 3, axis: time, refs: [jpcert-handling] }
      - id: p01-stop-check
        text: { ja: 'カートを止めて、表示されている決済画面を保存し、カード会社とレンタルサーバーに連絡する。', en: '' }
        minutes: 90
        category: recover
        points: 80
        refs: [jpcert-handling, no03-pci-dss]
        gauges: { flame: 5, damage: -10, trust: 8, stamina: -10 }
        setFlags: { stoppedCart: true }
        items:
          - { id: p01-c-content, points: 8, axis: content, refs: [no03-pci-dss] }
          - { id: p01-c-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: p01-c-care, points: 5, axis: care, refs: [no03-pci-dss] }
          - { id: p01-c-time, points: 5, axis: time, refs: [ipa-sme-guideline] }

  - id: p02-reinstall
    at: { day: 0, minutes: 720 }
    phase: contain
    sound: { se: [notify_chat] }
    text: { ja: '昼休み。倉庫の常連客だった技術者が顔を出す。「とりあえず再インストールしておきました。これで安全です」。管理画面を開くと、すでに作業が始まっている。', en: '' }
    voices: [v02-friend, v02-expert, v02-ok]
    notable:
      - { id: note-reinstall, text: { ja: '知人の技術者が、こちらの許可なくサイトの再インストールを始めていた。', en: '' } }
    choices:
      - id: p02-let
        text: { ja: '任せる。早く安全になるならありがたい。', en: '' }
        minutes: 60
        category: fatal
        points: -250
        refs: [jpcert-handling, nist-sp800-61r3]
        gauges: { damage: 15, trust: -10 }
        setFlags: { reinstalled: true }
        delayed:
          - { afterPhases: 2, points: -80, gauges: { damage: 20, trust: -15 }, reason: { ja: '侵入経路も漏えいの時期も分からないまま、再インストールで証拠が消えた。', en: '' } }
        items:
          - { id: p02-a-record, points: -20, axis: record, refs: [jpcert-handling] }
          - { id: p02-a-content, points: -15, axis: content, refs: [nist-sp800-61r3] }
          - { id: p02-a-care, points: -5, axis: care, refs: [ipa-sme-guideline] }
      - id: p02-snapshot
        text: { ja: '作業を止め、レンタルサーバーのスナップショットと画面の記録を先に取る。', en: '' }
        minutes: 90
        category: maintain
        points: 20
        refs: [jpcert-handling]
        gauges: { trust: 5, stamina: -10 }
        setFlags: { snapshot: true }
        items:
          - { id: p02-b-record, points: 10, axis: record, refs: [jpcert-handling] }
          - { id: p02-b-order, points: 5, axis: order, refs: [nist-sp800-61r3] }
      - id: p02-snapshot-seal
        text: { ja: '作業を止め、スナップショットと画面の記録を取り、触った範囲と時刻を書面に残す。再インストールは調査の後にする。', en: '' }
        minutes: 120
        category: recover
        points: 80
        refs: [jpcert-handling, nist-sp800-61r3]
        gauges: { flame: -5, trust: 10, stamina: -10 }
        setFlags: { snapshot: true, evidenceSealed: true }
        items:
          - { id: p02-c-record, points: 10, axis: record, refs: [jpcert-handling] }
          - { id: p02-c-content, points: 8, axis: content, refs: [nist-sp800-61r3] }
          - { id: p02-c-order, points: 5, axis: order, refs: [nist-sp800-61r3] }
          - { id: p02-c-care, points: 3, axis: care, refs: [ipa-sme-guideline] }

