        gauges: { stamina: 10, trust: 5 }
        items:
          - { id: p14-b-care, points: 8, axis: care, refs: [ipa-sme-guideline] }
          - { id: p14-b-care2, points: 5, axis: care, refs: [ipa-sme-guideline] }

  - id: p15-report
    at: { day: 30, minutes: 600 }
    phase: after
    sound: { se: [notify_news] }
    text: { ja: '30日目の午前10時。調査の報告書ができた。公開する範囲を決める。', en: '' }
    voices: [v15-expert, v15-law, v15-ok]
    lesson: { ja: '報告書は、何が起きたかを説明し、再発防止を続ける意思を示す機会です。攻撃に使える部分だけ伏せて公開し、確報を出し、進み具合を続けて公表するのが模範です。内情を理由に伏せると、説明を求める声に答えられません。', en: '' }
    choices:
      - id: p15-hide
        text: { ja: '報告書は公開しない。小さな店の内情をさらす必要はないと判断して、伏せる。', en: '' }
        explain: { ja: '内情を伏せたい気持ちは分かりますが、任意の報告まで閉じると、再発防止の姿勢が見えません。説明を求める声に答えられなくなります。', en: '' }
        minutes: 60
