# No.3 やまびこ商店 / セキュリティ担当者（倉庫・出荷担当が兼任）ロール
# 専任の情報システム担当がいない会社なので、サイトと端末の面倒を倉庫の担当者が見ている。
# 見えるのは、管理画面、レンタルサーバーのログ、決済画面、事務所のパソコン、現場の声。
# 判断ポイント18、細目は choices[].items と drafts の合計で80以上。
estimateMinutes: 35
intro: { ja: 'あなたはやまびこ商店の倉庫・出荷担当。専任の情報システム担当はいないので、サイトと事務所のパソコンの面倒はあなたが見ている。管理画面のパスワードは、社長と事務の村瀬と3人で同じものを使っている。午前10時、カード会社からの電話が、あなたのところに回ってくる。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-ppc-prelim
    ref: ppc-report-prelim
    label: { ja: '個人情報保護委員会への速報の材料提出', en: '' }
    points: -150
    doneFlag: ppcPrelimFiled
  - id: dl-ppc-final
    ref: ppc-report-final-malicious
    label: { ja: '個人情報保護委員会への確報の材料提出', en: '' }
    points: -150
    doneFlag: ppcFinalFiled
events:
  - id: ev-card-second
    at: { day: 2, minutes: 540 }
    when: { flags: { cardCompanyInformed: false } }
    voices: [v-ev-card]
    gauges: { flame: 5 }
    sound: { se: [phone_ring] }
    caption: { ja: 'カード会社から二度目の電話。前回の回答がまだ届いていない。', en: '' }
  - id: ev-fake-call
    at: { day: 4, minutes: 480 }
    when: { flags: { notified: false } }
    voices: [v-ev-fake]
    gauges: { flame: 10 }
    sound: { se: [notify_sns] }
    caption: { ja: '「カードの不正利用を確認しました」という電話が、高齢の常連客にかかっている。', en: '' }
  - id: ev-local-paper
    at: { day: 5, minutes: 600 }
    voices: [v-ev-paper]
    gauges: { flame: 10 }
    sound: { se: [notify_news] }
    caption: { ja: '地域の新聞の地域面に、小さな記事が出た。', en: '' }
points:
  - id: a01-card-call
    at: { day: 0, minutes: 600 }
    phase: detect
    sound: { se: [phone_ring] }
    text: { ja: '午前10時。カード会社から電話が回ってきた。「御社のサイトの決済画面で、不審な通信が確認されました」。管理画面のパスワードは、社長と事務の村瀬と自分の3人で同じものを使っている。決済も注文も、いま動いている。', en: '' }
    voices: [v01-card, v01-owner, v01-field, v01-ok]
    notable:
      - { id: note-first-call, text: { ja: '午前10時、カード会社から決済画面の不審な通信について連絡があった。管理画面のパスワードは3人で共用していた。', en: '' } }
    choices:
      - id: a01-later
        text: { ja: '電話を保留にして、昼の出荷を終わらせてから画面を見る。', en: '' }
        minutes: 120
        category: hurt
        points: -55
        refs: [ipa-sme-guideline, jpcert-handling]
        gauges: { flame: 10, damage: 10, trust: -5 }
        coward: true
        delayed:
          - { afterPhases: 1, points: -40, gauges: { damage: 15, flame: 5 }, reason: { ja: '見ている間に、偽の決済画面から入力された注文が届いた。', en: '' } }
        items:
          - { id: a01-a-time, points: -6, axis: time, refs: [ipa-sme-guideline] }
          - { id: a01-a-record, points: -5, axis: record, refs: [jpcert-handling] }
      - id: a01-check
        text: { ja: 'カード会社から日時・画面・注文番号を聞き、管理画面の操作履歴とFTPの接続履歴を確認する。', en: '' }
        minutes: 60
        category: maintain
        points: 25
        refs: [jpcert-handling, no03-pci-dss]
        gauges: { flame: -5, trust: 5, stamina: -5 }
        setFlags: { logChecked: true }
        items:
          - { id: a01-b-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: a01-b-time, points: 5, axis: time, refs: [ipa-sme-guideline] }
          - { id: a01-b-content, points: 5, axis: content, refs: [no03-pci-dss] }
      - id: a01-stop
        text: { ja: 'カートの決済ボタンを外して決済を止め、画面とログを保存してから、カード会社とレンタルサーバーに連絡する。', en: '' }
        minutes: 90
        category: recover
        points: 90
        refs: [jpcert-handling, no03-pci-dss]
        gauges: { flame: 5, damage: -10, trust: 8, stamina: -10 }
        setFlags: { stoppedPayment: true, cardCompanyInformed: true, logChecked: true }
        items:
          - { id: a01-c-content, points: 8, axis: content, refs: [no03-pci-dss] }
          - { id: a01-c-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: a01-c-time, points: 5, axis: time, refs: [ipa-sme-guideline] }
          - { id: a01-c-care, points: 5, axis: care, refs: [no03-pci-dss] }
      - id: a01-restart
        text: { ja: 'とりあえずサーバーを再起動して、画面が戻るか見る。', en: '' }
        minutes: 30
        category: hurt
        points: -45
        refs: [jpcert-handling]
        gauges: { damage: 10, trust: -5 }
        items:
          - { id: a01-d-record, points: -7, axis: record, refs: [jpcert-handling] }
          - { id: a01-d-content, points: -5, axis: content, refs: [jpcert-handling] }
          - { id: a01-d-time, points: -3, axis: time, refs: [jpcert-handling] }

