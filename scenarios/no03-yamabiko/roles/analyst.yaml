# No.3 やまびこ商店 / セキュリティ担当者（倉庫・出荷担当が兼任）ロール
# 専任の情報システム担当がいない会社なので、サイトと端末の面倒を倉庫の担当者が見ている。
# 見えるのは、管理画面、レンタルサーバーのログ、決済画面、事務所のパソコン、現場の声。
# 判断ポイント18、細目は choices[].items と drafts の合計で80以上。
estimateMinutes: 35
intro: { ja: 'あなたはやまびこ商店の倉庫・出荷担当で、社長の甥。専任の情報システム担当はいないので、サイトと事務所のパソコンの面倒はあなたが見ている。管理画面のパスワードは、社長と事務の村瀬と3人で同じものを使っている。午前10時、カード会社からの電話が、あなたのところに回ってくる。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-ppc-prelim
    ref: ppc-report-prelim
    label: { ja: '個人情報保護委員会への速報の材料提出', en: '' }
    points: -150
    doneFlag: ppcPrelimFiled
  - id: dl-ppc-final
    ref: ppc-report-final-malicious
    label: { ja: '個人情報保護委員会への確報の材料提出', en: '' }
    points: -150
    doneFlag: ppcFinalFiled
events:
  - id: ev-card-second
    at: { day: 2, minutes: 540 }
    when: { flags: { cardCompanyInformed: false } }
    voices: [v-ev-card]
    gauges: { flame: 5 }
    sound: { se: [phone_ring] }
    caption: { ja: 'カード会社から二度目の電話。前回の回答がまだ届いていない。', en: '' }
  - id: ev-fake-call
    at: { day: 4, minutes: 480 }
    when: { flags: { notified: false } }
    voices: [v-ev-fake]
    gauges: { flame: 10 }
    sound: { se: [notify_sns] }
    caption: { ja: '「カードの不正利用を確認しました」という電話が、高齢の常連客にかかっている。', en: '' }
  - id: ev-local-paper
    at: { day: 5, minutes: 600 }
    voices: [v-ev-paper]
    gauges: { flame: 10 }
    sound: { se: [notify_news] }
    caption: { ja: '地域の新聞の地域面に、小さな記事が出た。', en: '' }
points:
  - id: a01-card-call
    at: { day: 0, minutes: 600 }
    phase: detect
    sound: { se: [phone_ring] }
    text: { ja: '午前10時。カード会社から電話が回ってきた。「御社のサイトの決済画面で、不審な通信が確認されました」。管理画面のパスワードは、社長と事務の村瀬と自分の3人で同じものを使っている。決済も注文も、いま動いている。', en: '' }
    voices: [v01-card, v01-owner, v01-field, v01-ok]
    notable:
      - { id: note-first-call, text: { ja: '午前10時、カード会社から決済画面の不審な通信について連絡があった。管理画面のパスワードは3人で共用していた。', en: '' } }
    lesson: { ja: '最初の連絡では、日時と画面、注文番号を聞き、決済を止める判断が模範です。出荷を優先して確認を遅らせると、偽画面からの注文が積み上がります。止める、保存する、関係先へ連絡するを同じ時間帯に進め、その時刻を残しておくと、後の説明がぶれません。', en: '' }
    choices:
      - id: a01-later
        text: { ja: '電話を保留にして、昼の出荷を終わらせてから、決済画面と注文をまとめて確認する。', en: '' }
        explain: { ja: '出荷を優先した判断です。確認が数時間遅れる間に偽の注文が積み上がり、初動の記録も取れません。目の前の業務より被害の拡大を止める順序が大切です。', en: '' }
        minutes: 120
        category: hurt
        points: -55
        refs: [ipa-sme-guideline, jpcert-handling]
        gauges: { flame: 10, damage: 10, trust: -5 }
        coward: true
        delayed:
          - { afterPhases: 1, points: -40, gauges: { damage: 15, flame: 5 }, reason: { ja: '見ている間に、偽の決済画面から入力された注文が届いた。', en: '' } }
        items:
          - { id: a01-a-time, points: -6, axis: time, refs: [ipa-sme-guideline] }
          - { id: a01-a-record, points: -5, axis: record, refs: [jpcert-handling] }
      - id: a01-stop
        text: { ja: '決済ボタンを外して決済を止め、画面とログを保存してから、カード会社とサーバー会社に連絡する。', en: '' }
        explain: { ja: '決済を止め、証拠を保存して関係先へ連絡する、模範に近い判断です。被害を広げず、後の説明に必要な記録も残せています。', en: '' }
        minutes: 90
        category: recover
        points: 90
        refs: [jpcert-handling, no03-pci-dss]
        gauges: { flame: 5, damage: -10, trust: 8, stamina: -10 }
        setFlags: { stoppedPayment: true, cardCompanyInformed: true, logChecked: true }
        items:
          - { id: a01-c-content, points: 8, axis: content, refs: [no03-pci-dss] }
          - { id: a01-c-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: a01-c-time, points: 5, axis: time, refs: [ipa-sme-guideline] }
          - { id: a01-c-care, points: 5, axis: care, refs: [no03-pci-dss] }
      - id: a01-check
        text: { ja: 'カード会社から日時と画面、注文番号を聞き、管理画面とFTPの接続履歴を確認する。', en: '' }
        explain: { ja: '日時と画面、注文番号を聞き、操作履歴を確認する良い初動です。事実を押さえる点は評価できますが、決済を止めておらず、その間の注文は守れません。', en: '' }
        minutes: 60
        category: maintain
        points: 25
        refs: [jpcert-handling, no03-pci-dss]
        gauges: { flame: -5, trust: 5, stamina: -5 }
        setFlags: { logChecked: true }
        items:
          - { id: a01-b-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: a01-b-time, points: 5, axis: time, refs: [ipa-sme-guideline] }
          - { id: a01-b-content, points: 5, axis: content, refs: [no03-pci-dss] }
      - id: a01-restart
        text: { ja: 'とりあえずサーバーを再起動して、決済画面が元に戻るかどうかを確かめてみる。', en: '' }
        explain: { ja: '再起動は原因を隠すだけで、偽の決済画面も止まりません。ログや画面を失う可能性があり、初動としては不利な判断です。', en: '' }
        minutes: 30
        category: hurt
        points: -45
        refs: [jpcert-handling]
        gauges: { damage: 10, trust: -5 }
        items:
          - { id: a01-d-record, points: -7, axis: record, refs: [jpcert-handling] }
          - { id: a01-d-content, points: -5, axis: content, refs: [jpcert-handling] }
          - { id: a01-d-time, points: -3, axis: time, refs: [jpcert-handling] }

  - id: a02-shared-password
    at: { day: 0, minutes: 660 }
    phase: contain
    sound: { se: [notify_chat] }
    text: { ja: '管理画面の接続履歴に、見覚えのない住所からのログインが残っていた。最後にパスワードを変えた記録はない。村瀬は「私も社長も、同じパスワードで入っています」と言う。サイトはまだ動いている。', en: '' }
    voices: [v02-owner, v02-popular, v02-ok]
    popular: { choiceId: a02-wait, percent: 58 }
    lesson: { ja: '共用のパスワードは、誰が使ったか分からないまま侵入を許します。変更と同時に、同じパスワードを使っている端末やサービスを洗い出し、変更した時刻と担当を記録するのが模範です。文字列を変えるだけでは、共用の危険は消えません。', en: '' }
    choices:
      - id: a02-wait
        text: { ja: '社長が戻ってから相談することにして、共用のパスワードは当日はそのまま使う。', en: '' }
        explain: { ja: '社長の判断を仰ぐ姿勢は自然ですが、待つ間に同じ共用パスワードで侵入が続きます。変更を先送りした分だけ被害と説明の負担が増えます。', en: '' }
        minutes: 60
        category: hurt
        points: -45
        refs: [ipa-sme-guideline, jpcert-handling]
        gauges: { flame: 5, damage: 5, trust: -5 }
        coward: true
        items:
          - { id: a02-a-time, points: -6, axis: time, refs: [ipa-sme-guideline] }
          - { id: a02-a-record, points: -5, axis: record, refs: [jpcert-handling] }
          - { id: a02-a-order, points: -3, axis: order, refs: [ipa-sme-guideline] }
      - id: a02-password-only
        text: { ja: '共用のままパスワードの文字列だけを変えて、サイトは止めずに動かし続ける。', en: '' }
        explain: { ja: '文字列の変更だけでは、共用のままなので誰が使ったか分かりません。漏れた資格情報が使い回されている可能性も残ります。', en: '' }
        minutes: 45
        category: hurt
        points: -30
        refs: [cissp-cbk-secops]
        gauges: { damage: 5, trust: -5 }
        setFlags: { keptSite: true }
        items:
          - { id: a02-c-order, points: -5, axis: order, refs: [cissp-cbk-secops] }
          - { id: a02-c-content, points: -3, axis: content, refs: [jpcert-handling] }
      - id: a02-log-only
        text: { ja: '不審なログインの履歴だけを保存し、パスワードの変更は次の休みまで先送りする。', en: '' }
        explain: { ja: '履歴の保存は良い習慣ですが、変更を休みまで延ばすと侵入の入口が開いたままです。記録と封じ込めを同時に進めたい場面です。', en: '' }
        minutes: 30
        category: maintain
        points: 10
        refs: [jpcert-handling]
        gauges: { trust: 2 }
        setFlags: { logChecked: true }
        items:
          - { id: a02-d-record, points: 5, axis: record, refs: [jpcert-handling] }
          - { id: a02-d-time, points: -4, axis: time, refs: [ipa-sme-guideline] }
          - { id: a02-d-order, points: -3, axis: order, refs: [cissp-cbk-secops] }
      - id: a02-separate
        text: { ja: '共用アカウントを止めて別々のものに分け、FTPのパスワードも同時に変える。', en: '' }
        explain: { ja: '共用アカウントを止めて個人ごとに分け、FTPの資格情報も変える模範的な判断です。誰が使ったかを追える状態になり、再発を防げます。', en: '' }
        minutes: 90
        category: maintain
        points: 30
        refs: [cissp-cbk-secops, ipa-sme-guideline]
        gauges: { trust: 8, stamina: -10 }
        setFlags: { accountsSeparated: true }
        items:
          - { id: a02-b-order, points: 8, axis: order, refs: [cissp-cbk-secops] }
          - { id: a02-b-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: a02-b-content, points: 5, axis: content, refs: [cissp-cbk-secops] }
          - { id: a02-b-care, points: 5, axis: care, refs: [ipa-sme-guideline] }

  - id: a03-payment-script
    at: { day: 0, minutes: 735 }
    phase: contain
    sound: { se: [notify_chat] }
    text: { ja: '決済画面のファイルを開くと、見覚えのない一行が足されていた。カード番号を外部の住所へ送るコードらしい。ファイルの更新日は、サーバーの記録と合っていない。', en: '' }
