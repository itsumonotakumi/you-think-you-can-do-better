    notable:
      - { id: note-payment-fake, text: { ja: '決済画面に外部のスクリプトが仕込まれ、入力されたカード番号が外部へ送られていた。開始時期は調査中。', en: '' } }
    lesson: { ja: '怪しいコードを見つけたら、消す前に状態をそのまま保存します。ファイル一式、画面、ログを残し、時刻とハッシュを記録してから、該当部分だけを無効にします。早く直したい気持ちが証拠を消し、漏えいの期間も原因も分からなくするのが典型的な誤りです。', en: '' }
