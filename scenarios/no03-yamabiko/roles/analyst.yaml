        text: { ja: '足された一行をその場で消して、サイトを元の決済画面にすぐ戻すことにする。', en: '' }
        explain: { ja: '一行を消すと復旧は早いものの、侵入経路と漏えい時期の証拠が消えます。後から原因も範囲も説明できなくなる重大な判断です。', en: '' }
        minutes: 45
        category: fatal
