      - id: order
        label: { ja: '保全の順序', en: '' }
        options:
          - { id: fp-o-screen, text: { ja: '画面、ファイル一式、ログ、操作履歴の順に保存する', en: '' }, points: 10, axis: order, refs: [nist-sp800-61r3] , explain: { ja: '画面、ファイル、ログ、操作履歴の順に残すと、状態と時系列の両方を押さえられます。後の調査で再現しやすい並びです。', en: '' } }
          - { id: fp-o-file, text: { ja: '書き換えられたファイルだけを保存して終える', en: '' }, points: -6, axis: content, refs: [nist-sp800-61r3] , explain: { ja: '書き換えられたファイルだけでは、侵入の入口や前後の状態が分かりません。範囲を狭めた保存は証拠として不足します。', en: '' } }
      - id: hash
        label: { ja: '完全性の担保', en: '' }
        options:
          - { id: fp-h-none, text: { ja: 'ハッシュ値は取らず、保存した日付だけを控える', en: '' }, points: -9, axis: record, refs: [cissp-cbk-secops] , explain: { ja: 'ハッシュがないと、保存したデータが変更されていないと示せません。日付だけでは証拠として弱くなります。', en: '' } }
          - { id: fp-h-hash, text: { ja: '保存した時刻とハッシュ値を記録して、後で照合する', en: '' }, points: 10, axis: record, refs: [cissp-cbk-secops] , explain: { ja: '時刻とハッシュを記録すると、後から改変されていないことを示せます。証拠の完全性を保つ基本です。', en: '' } }
