        explain: { ja: '手元に控える発想は悪くありませんが、サーバーから消すと原本の状態が失われます。保存場所と手順を決めてから扱いたいところです。', en: '' }
        minutes: 45
        category: hurt
        points: -70
        refs: [cissp-cbk-secops]
        gauges: { damage: 5, trust: -10 }
