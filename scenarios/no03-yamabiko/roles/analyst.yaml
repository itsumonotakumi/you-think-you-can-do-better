          - { id: fp-w-two, text: { ja: '作業した人と立会人を、日時とあわせて記録に残す', en: '' }, points: 8, axis: record, refs: [cissp-cbk-secops] , explain: { ja: '作業者と立会人を日時ごと残すと、誰が何に触れたかを説明できます。証拠の扱いを明確にする基本です。', en: '' } }
