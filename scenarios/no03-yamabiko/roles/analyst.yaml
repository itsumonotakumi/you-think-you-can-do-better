        label: { ja: '保管場所', en: '' }
        options:
          - { id: fp-s-desk, text: { ja: '作業用の共有フォルダに置いたままにしておく', en: '' }, points: -7, axis: order, refs: [cissp-cbk-secops] , explain: { ja: '共有フォルダは誰でも触れ、上書きや削除の恐れがあります。証拠の保管場所としては不適切です。', en: '' } }
          - { id: fp-s-locked, text: { ja: '書き込みできない媒体に保存し、施錠した棚で管理する', en: '' }, points: 8, axis: order, refs: [cissp-cbk-secops] , explain: { ja: '書き込みできない媒体を施錠して管理すると、改変や紛失を防げます。証拠の保管として適切です。', en: '' } }
      - id: copy
        label: { ja: '調査用コピー', en: '' }
        options:
          - { id: fp-c-original, text: { ja: '原本を直接開いて、その場で中身を調べる', en: '' }, points: -6, axis: record, refs: [nist-sp800-61r3] , explain: { ja: '原本を直接開くと、閲覧や更新で状態が変わることがあります。調査はコピーで行うのが安全です。', en: '' } }
          - { id: fp-c-copy, text: { ja: '原本と調査用のコピーを分けて、コピーだけを開く', en: '' }, points: 8, axis: content, refs: [nist-sp800-61r3] , explain: { ja: '原本と調査用コピーを分けると、調査中の操作で原本を汚しません。証拠を守る基本の進め方です。', en: '' } }
      - id: notify
        label: { ja: '現場への説明', en: '' }
        options:
          - { id: fp-n-silent, text: { ja: '何も説明せずに、画面をそのままにしておく', en: '' }, points: -6, axis: care, refs: [ipa-sme-guideline] , explain: { ja: '何も説明しないと、現場が善意で再起動や削除をしてしまうかもしれません。短い説明でも共有しておきたいです。', en: '' } }
          - { id: fp-n-explain, text: { ja: 'なぜ触らないのかを、事務と倉庫の全員に説明しておく', en: '' }, points: 8, axis: care, refs: [ipa-sme-guideline] , explain: { ja: '触らない理由を事務と倉庫の全員に説明すると、誤った操作や再起動を防げます。現場の協力が証拠を守ります。', en: '' } }
  incident-note:
    title: { ja: '社長への一次報告メモ', en: '' }
    slots:
      - id: detected
        label: { ja: '検知時刻の書き方', en: '' }
        options:
          - { id: in-t-split, text: { ja: '連絡を受けた時刻と、自分で確認した時刻を分けて書く', en: '' }, points: 5, axis: time, refs: [jpcert-handling] , explain: { ja: '連絡を受けた時刻と確認した時刻を分けると、初動の遅れや判断の順序を後から説明できます。', en: '' } }
          - { id: in-t-vague, text: { ja: '「朝のうち」とだけ書いて、時刻は残さない', en: '' }, points: -5, axis: time, refs: [jpcert-handling] , explain: { ja: '「朝のうち」だけでは、いつ何をしたかを追えません。時刻を残さないと初動の検証ができません。', en: '' } }
      - id: scope
        label: { ja: '影響範囲', en: '' }
        options:
          - { id: in-s-all, text: { ja: '「全員が対象」と断定して、範囲を限定しない', en: '' }, points: -9, axis: content, refs: [ppc-report-scope] , explain: { ja: '「全員が対象」と断定すると、調査前に対象を広げすぎます。範囲を限定しない表現は訂正が必要になりがちです。', en: '' } }
          - { id: in-s-known, text: { ja: '分かった範囲と、まだ分からない範囲を分けて書く', en: '' }, points: 8, axis: content, refs: [cissp-cbk-secops] , explain: { ja: '分かった範囲と不明な範囲を分けると、誤った断定を避けられます。後の更新もしやすくなります。', en: '' } }
      - id: done
        label: { ja: '実施したこと', en: '' }
        options:
          - { id: in-d-list, text: { ja: '止めた決済、保存した画面、止めたアカウントを並べて書く', en: '' }, points: 8, axis: order, refs: [nist-sp800-61r3] , explain: { ja: '止めた決済や保存した画面を並べると、実施した対応が具体的に伝わります。重複や漏れの確認にも役立ちます。', en: '' } }
          - { id: in-d-summary, text: { ja: '「初動対応済み」とだけ書いて、中身は書かない', en: '' }, points: -6, axis: content, refs: [jpcert-handling] , explain: { ja: '「初動対応済み」だけでは、何をしたか分かりません。具体的な対応を書かないと、後の確認ができません。', en: '' } }
      - id: evidence
        label: { ja: '証拠の扱い', en: '' }
        options:
          - { id: in-e-none, text: { ja: '証拠を保存したことには、特に触れない', en: '' }, points: -6, axis: record, refs: [nist-sp800-61r3] , explain: { ja: '証拠に触れないと、保存したのかどうかが伝わりません。存在と場所だけでも書いておきたいところです。', en: '' } }
          - { id: in-e-chain, text: { ja: '保存したデータのハッシュと、保管した場所を書く', en: '' }, points: 8, axis: record, refs: [cissp-cbk-secops] , explain: { ja: 'ハッシュと保管場所を書くと、証拠が改変されていないことと所在を示せます。説明の信頼につながります。', en: '' } }
      - id: uncertain
        label: { ja: '未確認事項', en: '' }
        options:
          - { id: in-u-explicit, text: { ja: '未確認の項目と、それを確認する期限を書く', en: '' }, points: 8, axis: content, refs: [meti-disclosure-guidance] , explain: { ja: '未確認の項目と確認期限を書くと、何が残っているかが共有され、次の行動につながります。', en: '' } }
          - { id: in-u-omit, text: { ja: '未確認の項目には触れず、確定分だけを書く', en: '' }, points: -5, axis: content, refs: [meti-disclosure-guidance] , explain: { ja: '未確認の項目を省くと、分かったことだけが独り歩きします。後で方針が変わる原因になります。', en: '' } }
      - id: next
        label: { ja: '次の連絡', en: '' }
        options:
          - { id: in-n-none, text: { ja: '次の連絡の予定には触れないでおく', en: '' }, points: -3, axis: order, refs: [jpcert-handling] , explain: { ja: '次の連絡の予定がないと、報告が止まったまま気づかれません。短くても日時を決めておきたいです。', en: '' } }
          - { id: in-n-scheduled, text: { ja: '次に報告する時刻と、報告する相手を書く', en: '' }, points: 5, axis: order, refs: [jpcert-handling] , explain: { ja: '次の報告の時刻と相手を書くと、連絡が途切れません。相手も待ち時間の見当がつきます。', en: '' } }
      - id: sns
        label: { ja: '外部への発信', en: '' }
        options:
          - { id: in-x-none, text: { ja: '個人のSNSには、今回のことを書かない', en: '' }, points: 8, axis: wording, refs: [meti-csm-guideline] , explain: { ja: '個人のSNSに書かない判断は、会社の説明と食い違わないために大切です。発信は公式の窓口にそろえます。', en: '' } }
          - { id: in-x-vague, text: { ja: '個人のSNSに「調査中です」とだけ書く', en: '' }, points: -7, axis: wording, refs: [meti-disclosure-guidance] , explain: { ja: '個人のSNSに「調査中です」と書くと、会社の説明とずれる恐れがあります。発信は公式に集約したいです。', en: '' } }
      - id: version
        label: { ja: '版の管理', en: '' }
        options:
          - { id: in-v-plain, text: { ja: '版番号は書かず、日付だけを残す', en: '' }, points: -3, axis: record, refs: [cissp-cbk-secops] , explain: { ja: '版番号がないと、複数の版がどれか分からず、古い内容のまま判断される恐れがあります。', en: '' } }
          - { id: in-v-versioned, text: { ja: '版番号と、更新した時刻をあわせて書く', en: '' }, points: 5, axis: record, refs: [cissp-cbk-secops] , explain: { ja: '版番号と更新時刻を書くと、どの時点の報告かが分かります。訂正や更新の履歴を追えます。', en: '' } }
  prelim-note:
    title: { ja: '速報の材料', en: '' }
    slots:
      - id: timing
        label: { ja: '出した時刻', en: '' }
        auto: true
        items:
          - { id: pn-t-fast, points: 10, axis: time, refs: [ppc-report-prelim], when: { withinHours: 72 } }
          - { id: pn-t-late, points: -9, axis: time, refs: [ppc-report-prelim], when: { otherwise: true } }
      - id: period
        label: { ja: '発生と検知', en: '' }
        options:
          - { id: pn-p-split, text: { ja: '発生した可能性のある時期と、気づいた日時を分けて書く', en: '' }, points: 5, axis: time, refs: [jpcert-handling] , explain: { ja: '発生の可能性がある時期と気づいた日時を分けると、調査の進み具合を正確に伝えられます。', en: '' } }
          - { id: pn-p-vague, text: { ja: '「先日」とだけ書いて、発生の日時は特定しない', en: '' }, points: -5, axis: time, refs: [ppc-report-prelim] , explain: { ja: '「先日」だけでは、いつから漏れたかの判断ができません。日時を特定しない表現は避けたいです。', en: '' } }
      - id: scope
        label: { ja: '対象', en: '' }
        options:
          - { id: pn-s-all, text: { ja: '「全顧客」と書いて、対象の期間を限定しない', en: '' }, points: -9, axis: content, refs: [ppc-report-scope] , explain: { ja: '「全顧客」と広く取ると、根拠のない範囲まで対象にします。後で訂正する負担が増えます。', en: '' } }
          - { id: pn-s-known, text: { ja: '対象の期間と、まだ確定していないことを分けて書く', en: '' }, points: 10, axis: content, refs: [ppc-report-scope] , explain: { ja: '対象の期間と、まだ確定していない部分を分けて書くと、誤った断定を避けて報告できます。', en: '' } }
      - id: item
        label: { ja: '漏れた項目', en: '' }
        options:
          - { id: pn-l-card, text: { ja: 'カード番号が外部へ送信された可能性を具体的に書く', en: '' }, points: 10, axis: content, refs: [no03-pci-dss] , explain: { ja: 'カード番号が外部へ送信された可能性を具体的に書くと、本人が取るべき行動が伝わります。', en: '' } }
          - { id: pn-l-vague, text: { ja: '「個人情報の一部」とだけ書いて、項目をぼかす', en: '' }, points: -6, axis: content, refs: [no03-pci-dss] , explain: { ja: '「個人情報の一部」とぼかすと、何が漏れたか分からず、本人が適切な対策を取れません。', en: '' } }
      - id: cause
        label: { ja: '原因の書き方', en: '' }
        options:
          - { id: pn-c-assert, text: { ja: '「外部の攻撃者によるもの」と断定して書く', en: '' }, points: -9, axis: wording, refs: [meti-disclosure-guidance] , explain: { ja: '外部の攻撃者によるものと断定すると、調査で別の原因だった場合に訂正が必要になります。', en: '' } }
          - { id: pn-c-unknown, text: { ja: '原因は調査中と書いて、特定の犯人を断定しない', en: '' }, points: 8, axis: wording, refs: [meti-disclosure-guidance] , explain: { ja: '原因を調査中とし、特定の犯人を断定しない書き方は、後の調査結果と大きく矛盾しません。', en: '' } }
      - id: action
        label: { ja: '本人がすること', en: '' }
        options:
          - { id: pn-a-none, text: { ja: '本人がすることを、通知の文面には書かない', en: '' }, points: -6, axis: care, refs: [ppc-notify-person] , explain: { ja: '本人がすることを具体的に書かないと、通知を受け取っても何をすればよいか分かりません。', en: '' } }
          - { id: pn-a-concrete, text: { ja: '利用明細の確認と、必要ならカードの再発行を書く', en: '' }, points: 10, axis: care, refs: [ppc-notify-person] , explain: { ja: '利用明細の確認や再発行を具体的に書くと、本人がすぐ行動できます。通知の目的はそこにあります。', en: '' } }
      - id: contact
        label: { ja: '窓口', en: '' }
        options:
          - { id: pn-o-window, text: { ja: '専用の電話番号と、受付時間を書く', en: '' }, points: 5, axis: care, refs: [ppc-notify-person] , explain: { ja: '専用の電話番号と受付時間を書いておくと、問い合わせが集中しても対応しやすくなります。', en: '' } }
          - { id: pn-o-none, text: { ja: '問い合わせの連絡先は書かない', en: '' }, points: -6, axis: care, refs: [ppc-notify-person] , explain: { ja: '問い合わせ先を書かないと、不安な本人がそのまま別の窓口や偽の連絡先に流れてしまいます。', en: '' } }
      - id: next
        label: { ja: '次の報告', en: '' }
        options:
          - { id: pn-n-date, text: { ja: '次に報告する時期と、確報の予定を書く', en: '' }, points: 5, axis: order, refs: [ppc-report-prelim] , explain: { ja: '次の報告時期と確報の予定を書いておくと、続報を待つ側の不安を和らげることができます。', en: '' } }
          - { id: pn-n-none, text: { ja: '次の報告の予定には、触れない', en: '' }, points: -3, axis: order, refs: [ppc-report-prelim] , explain: { ja: '次の報告に触れないと、続報があるのか分からず、余計な問い合わせが増えてしまいます。', en: '' } }
  notify-note:
    title: { ja: '本人通知の文面', en: '' }
    slots:
      - id: target
        label: { ja: '対象', en: '' }
        options:
          - { id: nn-t-all, text: { ja: '調査で判明した期間に注文した全員（返品・キャンセルを含む）', en: '' }, points: 10, axis: content, refs: [ppc-notify-person] , explain: { ja: '判明した期間に注文した全員を対象にすると、返品やキャンセルの人も含めて漏れが減ります。', en: '' } }
          - { id: nn-t-current, text: { ja: '今も会員として登録が残っている人だけに、通知を送る', en: '' }, points: -12, axis: content, refs: [ppc-notify-person] , explain: { ja: '今も会員の人だけに絞ると、過去に注文した人へ通知が届きません。対象の取りこぼしになります。', en: '' } }
      - id: what
        label: { ja: '何が起きたか', en: '' }
        options:
          - { id: nn-w-vague, text: { ja: '「個人情報の一部が漏れた可能性がある」とだけ書く', en: '' }, points: -6, axis: content, refs: [no03-pci-dss] , explain: { ja: '「個人情報の一部」とだけ書くと、カード番号の危険が伝わらず、本人の確認が遅れます。', en: '' } }
          - { id: nn-w-fake, text: { ja: '決済画面が差し替えられ、カード番号が外部に送られた可能性を書く', en: '' }, points: 10, axis: content, refs: [no03-pci-dss] , explain: { ja: '決済画面が差し替えられカード番号が送られた可能性を書くと、本人が被害を疑えます。', en: '' } }
      - id: action
        label: { ja: '本人がすること', en: '' }
        options:
          - { id: nn-a-concrete, text: { ja: '利用明細の確認、カード会社への連絡、必要なら再発行を具体的に書く', en: '' }, points: 10, axis: care, refs: [ppc-notify-person] , explain: { ja: '利用明細の確認、カード会社への連絡、再発行まで具体的に書くと、本人が迷わず動けます。', en: '' } }
          - { id: nn-a-credit, text: { ja: '「カード会社の案内に従ってください」とだけ書いて終える', en: '' }, points: -5, axis: care, refs: [ppc-notify-person] , explain: { ja: '「カード会社の案内に従ってください」だけでは、何をいつ確認するかが伝わりません。', en: '' } }
      - id: fake
        label: { ja: '偽の連絡への注意', en: '' }
        options:
          - { id: nn-f-none, text: { ja: '偽の電話やメールが来ていることには、何も触れない', en: '' }, points: -6, axis: wording, refs: [meti-disclosure-guidance] , explain: { ja: '偽の連絡に触れないと、本物の通知を装った電話やメールに引っかかる人が出てしまいます。', en: '' } }
          - { id: nn-f-warning, text: { ja: '当社が電話でカード番号を聞くことはないと書き、偽の窓口も示す', en: '' }, points: 10, axis: wording, refs: [meti-disclosure-guidance] , explain: { ja: '電話でカード番号を聞かないと明記し、偽の窓口も示すと、本物と間違えた連絡による二次被害を防げます。', en: '' } }
      - id: contact
        label: { ja: '窓口', en: '' }
        options:
          - { id: nn-c-window, text: { ja: '専用の電話番号と受付時間、つながらないときの連絡先を書く', en: '' }, points: 5, axis: care, refs: [ppc-notify-person] , explain: { ja: '専用の番号と受付時間、つながらないときの連絡先があると、問い合わせに対応できます。', en: '' } }
          - { id: nn-c-none, text: { ja: '問い合わせの窓口については、どこにも書かない', en: '' }, points: -6, axis: care, refs: [ppc-notify-person] , explain: { ja: '問い合わせ先を書かないと、不安な本人がそのまま偽の窓口に連絡してしまう恐れがあります。', en: '' } }
      - id: next
        label: { ja: '次の報告', en: '' }
        options:
          - { id: nn-n-none, text: { ja: '次の報告の予定には触れないでおく', en: '' }, points: -3, axis: order, refs: [ppc-report-prelim] , explain: { ja: '次の報告に触れないと、追加の連絡があるのか分からず、問い合わせが増えてしまいます。', en: '' } }
          - { id: nn-n-date, text: { ja: '次に報告する時期と、その連絡方法を書く', en: '' }, points: 5, axis: order, refs: [ppc-notify-person] , explain: { ja: '次に報告する時期と連絡の方法を書いておくと、続報を待つ側の不安を和らげることができます。', en: '' } }
  ops-checklist:
    title: { ja: 'サイトとパスワードの手順書', en: '' }
    slots:
      - id: update
        label: { ja: '更新の時期', en: '' }
        options:
          - { id: oc-u-schedule, text: { ja: '更新の時期と担当を決め、実施した日を残す', en: '' }, points: 8, axis: order, refs: [no03-ipa-web] , explain: { ja: '更新の時期と担当を先に決めて実施日を記録すると、点検が習慣として無理なく続きます。', en: '' } }
          - { id: oc-u-annual, text: { ja: '年1回の点検だけで済ませることにする', en: '' }, points: -5, axis: order, refs: [no03-ipa-web] , explain: { ja: '年1回の点検だけでは、更新の間隔が空きすぎます。変更のたびに見直す余地を残したいです。', en: '' } }
      - id: password
        label: { ja: 'パスワードの扱い', en: '' }
        options:
          - { id: oc-p-shared, text: { ja: '共用のままにして、金庫にメモを置いておく', en: '' }, points: -9, axis: record, refs: [cissp-cbk-secops] , explain: { ja: '共用のまま金庫にメモを置くと、誰が使ったか分からず、漏えいの原因を追えなくなります。', en: '' } }
          - { id: oc-p-separate, text: { ja: '1人1アカウントにして、共用はしないと決める', en: '' }, points: 10, axis: record, refs: [cissp-cbk-secops] , explain: { ja: '1人1アカウントにすると、誰が操作したかを記録で追え、共用の危険を大幅に減らせます。', en: '' } }
      - id: change
        label: { ja: '変更履歴', en: '' }
        options:
          - { id: oc-c-log, text: { ja: '誰がいつ何を変えたかを、1行ずつ残す', en: '' }, points: 8, axis: record, refs: [cissp-cbk-secops] , explain: { ja: '誰がいつ何を変えたかを1行ずつ残しておくと、異常が起きた原因を後からたどれます。', en: '' } }
          - { id: oc-c-none, text: { ja: '変更の履歴は残さずに、そのままにする', en: '' }, points: -6, axis: record, refs: [jpcert-handling] , explain: { ja: '変更履歴がないと、いつ何が変わったかを確認できず、復旧の判断も遅れてしまいます。', en: '' } }
      - id: owner
        label: { ja: '担当', en: '' }
        options:
          - { id: oc-o-anyone, text: { ja: '誰かがやることにして、担当は決めない', en: '' }, points: -3, axis: order, refs: [ipa-sme-guideline] , explain: { ja: '誰かがやるでは、実際には誰もやらずに点検が抜けます。担当を決めておきたいところです。', en: '' } }
