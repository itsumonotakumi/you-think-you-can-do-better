        explain: { ja: '公開された事実を認め、対象者に具体的な行動と相談先を届けている。範囲が確定していなくても、可能性がある人に早く知らせることが優先になる。', en: '' }
        minutes: 240
        category: recover
        points: 150
        refs: [ppc-notify-person, no11-ppc-entrust-report]
        gauges: { flame: -15, trust: 15, stamina: -20 }
        setFlags: { leakNotified: true, supportWindow: true }
        items:
          - { id: p13-b-content, points: 8, axis: content, refs: [ppc-report-scope] }
          - { id: p13-b-care, points: 10, axis: care, refs: [ppc-notify-person] }
          - { id: p13-b-care2, points: 8, axis: care, refs: [no11-ppc-entrust-report] }
          - { id: p13-b-wording, points: 8, axis: wording, refs: [meti-disclosure-guidance] }
      - id: p13-c-deny
        text: { ja: '漏れていないと断言し、物流の発表を待つよう案内する', en: '' }
        explain: { ja: '公開されているデータを否定すると、顧客は自社の説明を信じられなくなる。事実と異なる断言は、隠蔽に近い対応として重く受け取られる。', en: '' }
        minutes: 60
        category: fatal
        points: -200
        refs: [ppc-report-scope, meti-disclosure-guidance]
        gauges: { flame: 25, trust: -20, damage: 15 }
        setFlags: { deniedLeak: true }
        items:
          - { id: p13-c-wording, points: -15, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: p13-c-content, points: -10, axis: content, refs: [ppc-report-scope] }
          - { id: p13-c-care, points: -10, axis: care, refs: [ppc-notify-person] }
    lesson: { ja: '攻撃者が情報を公開したら、確定を待たずに可能性がある人へ通知する。通知には、何が漏れたか、本人が何をすればよいか、どこに相談するかを入れる。否定を続けると、顧客は自力で情報を探し、二次被害に備えられない。', en: '' }

  - id: p14-resume
    at: { day: 21, minutes: 600 }
    phase: recover
    sound: { se: [notify_sns] }
    text: { ja: '午前10時。物流の復旧と代替配送の体制が整った。全面再開の条件を決める。監視の手を緩めるかどうかも迷う。', en: '' }
    voices: [v14-public, v14-past, v14-ok]
    popular: { choiceId: p14-a-full, percent: 55 }
    choices:
      - id: p14-a-full
        text: { ja: '物流の復旧に合わせて全面再開し、監視も通常に戻す', en: '' }
        explain: { ja: '問題が起きていない状態を前提に、監視まで一度に戻している。再発の兆候を見逃すと、止める手段がないまま被害が広がる。', en: '' }
        minutes: 120
        category: hurt
        points: -150
        refs: [nist-sp800-61r3]
        gauges: { damage: 15, flame: 10, trust: -10 }
        delayed:
          - { afterPhases: 1, points: -60, gauges: { damage: 15, trust: -15 }, reason: { ja: '再開後に不審な通信が見つかり、通販を再度止めた。', en: '' } }
        items:
          - { id: p14-a-time, points: -10, axis: time, refs: [nist-sp800-61r3] }
          - { id: p14-a-record, points: -10, axis: record, refs: [nist-sp800-61r3] }
          - { id: p14-a-content, points: -8, axis: content, refs: [nist-sp800-61r3] }
      - id: p14-c-delay
        text: { ja: '店頭受け取りを続けながら、通販の全面再開を先に延ばす', en: '' }
        explain: { ja: '安全側の判断ではあるが、再開の条件を決めずに延ばすと、いつ戻るのか分からない状態が続く。顧客の離脱と売上の損失が固定化する。', en: '' }
        minutes: 60
        category: maintain
        points: 30
        refs: [no11-bcp-continuity]
        gauges: { trust: 3, flame: 3 }
        items:
          - { id: p14-c-order, points: 5, axis: order, refs: [no11-bcp-continuity] }
          - { id: p14-c-record, points: 3, axis: record, refs: [no11-bcp-continuity] }
      - id: p14-b-phased
        text: { ja: '段階再開を続け、注文と出荷の数を見て全面再開を決める', en: '' }
        explain: { ja: '再開の範囲を広げながら、数字で次の判断を決めている。監視を維持したまま進めるため、問題が起きたときに止める範囲を限定できる。', en: '' }
        minutes: 180
        category: recover
        points: 130
        refs: [nist-sp800-61r3, no11-bcp-continuity]
        gauges: { damage: -15, trust: 15, stamina: -10 }
        setFlags: { phasedResume: true, monitorKept: true }
        items:
          - { id: p14-b-order, points: 8, axis: order, refs: [nist-sp800-61r3] }
          - { id: p14-b-content, points: 8, axis: content, refs: [no11-bcp-continuity] }
          - { id: p14-b-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: p14-b-time, points: 3, axis: time, refs: [nist-sp800-61r3] }
    lesson: { ja: '再開は、安全を確認できた範囲から段階的に広げる。監視を維持し、注文と出荷の数を見て次の判断を決める。全面再開と監視の解除を同時に行うと、再発したときに止める手段がなくなる。', en: '' }

  - id: p15-report
    at: { day: 30, minutes: 600 }
    phase: after
    sound: { se: [notify_news] }
    text: { ja: '午前10時。調査報告書がまとまった。個人情報保護委員会への確報も出す。どこまで公開するかを決める。', en: '' }
    voices: [v15-expert, v15-boss, v15-ok]
    choices:
      - id: p15-a-open
        text: { ja: '監督の不備を含む報告書を公開し、再発防止の進捗を毎月出す', en: '' }
        explain: { ja: '自社の監督責任まで含めて公開し、対策の進捗を継続して示している。一度の公表で終わらせず、改善を確かめられる形にした点が最も評価できる。', en: '' }
        minutes: 240
        category: increase
        points: 300
        fatalAlternate: 50
        refs: [meti-disclosure-guidance, no11-ppc-entrust-supervision]
        gauges: { flame: -15, trust: 20, stamina: -15 }
        setFlags: { fullDisclosure: true, ppcFinalFiled: true }
        detail: final-report
        items:
          - { id: p15-a-content, points: 8, axis: content, refs: [meti-disclosure-guidance] }
          - { id: p15-a-record, points: 8, axis: record, refs: [no11-ppc-entrust-supervision] }
          - { id: p15-a-care, points: 8, axis: care, refs: [ppc-notify-person] }
      - id: p15-b-publish
        text: { ja: '攻撃に使える詳細だけを伏せて、報告書を全文公開する', en: '' }
        explain: { ja: '危険な詳細を伏せつつ、原因と対応を公開している。再発防止の材料として価値はあるが、進捗の継続公開までは踏み込んでいない。', en: '' }
        minutes: 180
        category: recover
        points: 100
        refs: [meti-disclosure-guidance]
        gauges: { flame: -10, trust: 15, stamina: -10 }
        setFlags: { fullDisclosure: true, ppcFinalFiled: true }
        detail: final-report
        items:
          - { id: p15-b-content, points: 8, axis: content, refs: [meti-disclosure-guidance] }
          - { id: p15-b-record, points: 5, axis: record, refs: [meti-disclosure-guidance] }
      - id: p15-c-hide
        text: { ja: '報告書は公開せず、再発防止は社内だけで進めると説明する', en: '' }
        explain: { ja: '攻撃に使える情報を伏せる配慮は必要だが、全文を隠すと検証が進まない。委託先の監督をどう直したのかも説明できず、再発への備えが見えない。', en: '' }
        minutes: 60
        category: hurt
        points: -150
        refs: [meti-disclosure-guidance]
        gauges: { flame: 15, trust: -15 }
        items:
          - { id: p15-c-content, points: -10, axis: content, refs: [meti-disclosure-guidance] }
          - { id: p15-c-wording, points: -10, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: p15-c-record, points: -8, axis: record, refs: [meti-disclosure-guidance] }
    lesson: { ja: '報告書は、攻撃に使える詳細だけを伏せて公開する。自社の監督責任と原因を書き、再発防止の進捗を継続して示す。一度公開して終わりにすると、対策が形だけになっていないか確かめられない。', en: '' }

drafts:
  first-statement:
    title: { ja: '第一報の文案', en: '' }
    slots:
      - id: scope
        label: { ja: '対象', en: '' }
        options:
          - { id: fs-s-late, text: { ja: '停止後も注文した人だけ', en: '' }, points: -15, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '停止後に注文した人だけに絞ると、それ以前の注文者が自分は対象か分からない。問い合わせが窓口に集中する。', en: '' } }
          - { id: fs-s-month, text: { ja: '直近一か月に注文した人', en: '' }, points: 3, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '直近一か月は分かりやすいが、それ以前の注文者を外す理由にはならない。対象を狭めた分、説明の追加が必要になる。', en: '' } }
          - { id: fs-s-all, text: { ja: '通販の注文者全員', en: '' }, points: 10, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '注文者全員を対象にすると、止まっている荷物に関係する人が自分事として動ける。対象を広く取るほど説明の抜けは減る。', en: '' } }
      - id: cause
        label: { ja: '原因の書き方', en: '' }
        options:
          - { id: fs-c-attack, text: { ja: '委託先のランサムウェア被害', en: '' }, points: 8, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '委託先の攻撃被害と書くと、原因が自社の障害ではないことと、起きている事態の重さが同時に伝わる。', en: '' } }
          - { id: fs-c-system, text: { ja: '委託先のシステム障害', en: '' }, points: 3, axis: content, refs: [meti-disclosure-guidance], explain: { ja: 'システム障害と書くと、攻撃による被害だと分からない。後から判明したとき、説明の訂正が必要になる。', en: '' } }
          - { id: fs-c-fault, text: { ja: '委託先の機器故障によるシステム障害', en: '' }, points: -20, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: '機器故障と書くと、原因が異なる説明になる。攻撃と判明した後で、隠していたと受け取られる。', en: '' } }
      - id: impact
        label: { ja: '止まっていること', en: '' }
        options:
          - { id: fs-i-vague, text: { ja: '「一部の遅れ」とだけ書く', en: '' }, points: -10, axis: content, refs: [no11-bcp-continuity], explain: { ja: '一部の遅れでは、注文できるのか、いつ届くのかが分からない。顧客はサイトと窓口の両方に問い合わせる。', en: '' } }
          - { id: fs-i-specific, text: { ja: '出荷停止と再開の見込み', en: '' }, points: 10, axis: content, refs: [no11-bcp-continuity], explain: { ja: '出荷が止まっていることと再開の見込みが分かると、顧客は待つか取り消すかを自分で選べる。', en: '' } }
          - { id: fs-i-none, text: { ja: '影響の範囲を書かない', en: '' }, points: -12, axis: content, refs: [no11-bcp-continuity], explain: { ja: '影響の範囲がないと、自分の注文がどうなるか判断できない。憶測がSNSに流れ、問い合わせが増える。', en: '' } }
      - id: action
        label: { ja: '顧客が今すること', en: '' }
        options:
          - { id: fs-a-apology, text: { ja: '「申し訳ありません」とだけ書く', en: '' }, points: -10, axis: care, refs: [meti-disclosure-guidance], explain: { ja: '謝罪だけでは、顧客が注文を取り消せるのか、返金はあるのかが分からない。次の行動につながらない。', en: '' } }
          - { id: fs-a-site, text: { ja: 'サイトの更新だけを案内する', en: '' }, points: 3, axis: care, refs: [meti-disclosure-guidance], explain: { ja: 'サイトを見るよう案内するだけでは、電話やメールで確認したい人に届かない。窓口の存在も伝わらない。', en: '' } }
          - { id: fs-a-cancel, text: { ja: '注文の取り消しと返金の方法', en: '' }, points: 10, axis: care, refs: [meti-disclosure-guidance], explain: { ja: '取り消しと返金の方法が具体的だと、顧客は待つか戻すかを選べる。返金の問い合わせも減る。', en: '' } }
      - id: contact
        label: { ja: '問い合わせ窓口', en: '' }
        options:
          - { id: fs-w-hours, text: { ja: '専用窓口の番号と受付時間', en: '' }, points: 8, axis: care, refs: [no11-bcp-continuity], explain: { ja: '番号と受付時間があると、つながる見通しが立つ。夜間や休日の問い合わせも迷わない。', en: '' } }
          - { id: fs-w-number, text: { ja: '番号だけを書く', en: '' }, points: -5, axis: care, refs: [no11-bcp-continuity], explain: { ja: '番号だけでは受付時間が分からず、夜間の問い合わせが迷う。窓口の混雑も伝わらない。', en: '' } }
          - { id: fs-w-none, text: { ja: '問い合わせ先を書かない', en: '' }, points: -15, axis: care, refs: [meti-disclosure-guidance], explain: { ja: '問い合わせ先がないと、顧客はSNSや店舗に流れる。現場が個別に説明することになり、内容もばらつく。', en: '' } }
      - id: apology
        label: { ja: '謝罪の主語', en: '' }
        options:
          - { id: fs-ap-logistics, text: { ja: '「物流会社の事情」として謝罪する', en: '' }, points: -5, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: '取引先の事情として謝罪すると、自社の提供責任が曖昧になる。顧客から見れば、注文した相手は自社だ。', en: '' } }
          - { id: fs-ap-own, text: { ja: '「当社」として謝罪する', en: '' }, points: 5, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: '提供主体として謝罪する姿勢が伝わる。委託先への責任追及とは別に、顧客への責任を明確にできる。', en: '' } }
          - { id: fs-ap-vendor, text: { ja: '「委託先」の責任として謝罪する', en: '' }, points: -10, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: '委託先の責任として謝罪すると、自社の説明責任を回避したと映る。顧客との信頼を損ない、再発防止の主体も曖昧になる。', en: '' } }
      - id: next
        label: { ja: '次の公表', en: '' }
        options:
          - { id: fs-n-none, text: { ja: '次回の予定を書かない', en: '' }, points: -5, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '次の予定がないと、情報の空白を憶測で埋められる。問い合わせの終わりも見えない。', en: '' } }
          - { id: fs-n-undecided, text: { ja: '次回は未定と書く', en: '' }, points: 2, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '未定と書くだけでは、いつ情報が出るのか分からない。待つ側の見通しが立たず、問い合わせが続く。', en: '' } }
          - { id: fs-n-next, text: { ja: '次の公表予定を書く', en: '' }, points: 5, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '次の公表予定があると、続報を待つ側の見通しが立つ。憶測が広がる前に、次の接点を示せる。', en: '' } }
      - id: approval
        label: { ja: '社内の確認', en: '' }
        options:
          - { id: fs-v-share, text: { ja: '広報と法務、物流で文案を確認する', en: '' }, points: 5, axis: order, refs: [meti-csm-guideline], explain: { ja: '複数の立場で確認すると、事実誤認と表現の偏りを減らせる。委託先の情報との食い違いも防げる。', en: '' } }
          - { id: fs-v-pr, text: { ja: '広報だけで確認して出す', en: '' }, points: 2, axis: order, refs: [meti-csm-guideline], explain: { ja: '広報だけで出すと、法務の確認が抜けやすい。法的な報告との整合が取れず、訂正が増える。', en: '' } }
          - { id: fs-v-solo, text: { ja: '社長と広報だけで確認して出す', en: '' }, points: -10, axis: order, refs: [meti-csm-guideline], explain: { ja: '経営と広報だけで決めると、現場と法務の確認が抜ける。顧客対応の前提が揃わず、発表後に修正が重なる。', en: '' } }
      - id: record
        label: { ja: '記録', en: '' }
        options:
          - { id: fs-r-time, text: { ja: '公表の時刻だけを記録する', en: '' }, points: 2, axis: record, refs: [jpcert-handling], explain: { ja: '時刻だけでも記録は残るが、どの版を出したか分からない。訂正が必要になったとき、変更の経緯をたどれない。', en: '' } }
          - { id: fs-r-log, text: { ja: '公表の時刻と版を記録する', en: '' }, points: 5, axis: record, refs: [jpcert-handling], explain: { ja: '時刻と版を記録すると、後から説明の経緯をたどれる。訂正が必要になった理由も示せる。', en: '' } }
          - { id: fs-r-none, text: { ja: '記録を残さず、口頭だけで共有する', en: '' }, points: -8, axis: record, refs: [jpcert-handling], explain: { ja: '口頭だけの共有は、誰が何をいつ出したか残らない。後日の検証や訂正の根拠に耐えられない。', en: '' } }
  final-report:
    title: { ja: '調査報告書の公開範囲', en: '' }
    slots:
      - id: scope
        label: { ja: '公開する範囲', en: '' }
        options:
          - { id: fr-s-partial, text: { ja: '攻撃に使える詳細だけ伏せて公開', en: '' }, points: 10, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '危険な詳細だけを伏せる公開は、検証と再発防止の両立になる。委託先の監督の見直しも説明できる。', en: '' } }
          - { id: fr-s-summary, text: { ja: '報告書の要約だけを公開する', en: '' }, points: -5, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '要約だけでは、都合の悪い指摘が抜けていないか分からない。調査の透明性が下がり、再発防止も弱くなる。', en: '' } }
          - { id: fr-s-hide, text: { ja: '報告書を公開しない', en: '' }, points: -20, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '公開しないと、原因も対策も検証されない。委託先の監督をどう直したのかも説明できず、顧客の信頼も戻らない。', en: '' } }
      - id: cause
        label: { ja: '原因の書き方', en: '' }
        options:
          - { id: fr-c-vague, text: { ja: '「外部からの攻撃」とだけ書く', en: '' }, points: -10, axis: content, refs: [nist-sp800-61r3], explain: { ja: '外部からの攻撃だけでは、どこを直すのか分からない。対策が精神論に流れ、検証もできない。', en: '' } }
          - { id: fr-c-specific, text: { ja: '監督の不備と原因を具体的に書く', en: '' }, points: 10, axis: content, refs: [no11-ppc-entrust-supervision], explain: { ja: '委託先の権限管理と自社の監督のどこが不足したかを具体的に書くと、再発防止の優先順位が決まる。', en: '' } }
          - { id: fr-c-vendor, text: { ja: '原因は委託先にあるとだけ書く', en: '' }, points: -8, axis: content, refs: [no11-ppc-entrust-supervision], explain: { ja: '原因を委託先だけに寄せると、自社の監督責任が見えない。同じ契約の他の委託先の点検も進まない。', en: '' } }
      - id: vendor
        label: { ja: '委託先の扱い', en: '' }
        options:
          - { id: fr-v-omit, text: { ja: '委託先の記載をすべて省く', en: '' }, points: -15, axis: content, refs: [no11-ppc-entrust-supervision], explain: { ja: '委託先に触れないと、同じ型のリスクが他の業務に残る。監督の見直しを説明する材料も失う。', en: '' } }
          - { id: fr-v-name, text: { ja: '委託先の名前と契約だけを書く', en: '' }, points: -5, axis: content, refs: [no11-ppc-entrust-supervision], explain: { ja: '名前と契約だけでは、権限管理やログの確認がどうだったか分からない。再発防止の中身が見えない。', en: '' } }
          - { id: fr-v-detail, text: { ja: '委託先の権限と契約の不備を書く', en: '' }, points: 10, axis: content, refs: [no11-ppc-entrust-supervision], explain: { ja: '権限と契約の不備を書くと、他の委託先の点検にもつながる。責任分界も整理でき、監督の実効性が伝わる。', en: '' } }
      - id: measures
        label: { ja: '再発防止策', en: '' }
        options:
          - { id: fr-m-plan, text: { ja: '再発防止の時期と担当を書く', en: '' }, points: 10, axis: content, refs: [cissp-cbk-secops], explain: { ja: '時期と担当があれば、対策が実行されたか検証できる。毎月の進捗の公開にもそのまま使える。', en: '' } }
          - { id: fr-m-slogan, text: { ja: '「再発防止に努める」とだけ書く', en: '' }, points: -10, axis: content, refs: [cissp-cbk-secops], explain: { ja: '「努める」だけでは、何をいつ誰がやるのか分からない。実行されたかの検証もできない。', en: '' } }
          - { id: fr-m-pending, text: { ja: '対策は検討中とだけ書く', en: '' }, points: -5, axis: content, refs: [cissp-cbk-secops], explain: { ja: '検討中とだけ書くと、対策の方向も期限も見えない。再発への備えが進んでいるのか判断できない。', en: '' } }
      - id: thirdparty
        label: { ja: '第三者委員会の意見', en: '' }
        options:
          - { id: fr-t-summary, text: { ja: '第三者委員会の意見は要約だけ載せる', en: '' }, points: -8, axis: content, refs: [cissp-cbk-secops], explain: { ja: '要約だけでは、都合の悪い指摘が抜けていないか分からない。調査の独立性が伝わらず、再発防止も弱くなる。', en: '' } }
          - { id: fr-t-full, text: { ja: '第三者委員会の意見を全文載せる', en: '' }, points: 8, axis: content, refs: [cissp-cbk-secops], explain: { ja: '第三者委員会の意見を全文載せると、調査の独立性が伝わる。都合の悪い指摘も隠せない。', en: '' } }
          - { id: fr-t-none, text: { ja: '第三者委員会の意見は載せない', en: '' }, points: -10, axis: content, refs: [cissp-cbk-secops], explain: { ja: '第三者委員会の意見を載せないと、調査の検証が外部から見えない。報告書の説得力が大きく下がる。', en: '' } }
      - id: customers
        label: { ja: '顧客への対応', en: '' }
        options:
          - { id: fr-p-none, text: { ja: '顧客への対応には触れない', en: '' }, points: -10, axis: care, refs: [ppc-notify-person], explain: { ja: '顧客への対応に触れないと、被害者の視点が抜けた報告になる。通知や返金の実績も伝わらない。', en: '' } }
          - { id: fr-p-count, text: { ja: '通知した件数と返金の実績だけを書く', en: '' }, points: 3, axis: care, refs: [ppc-notify-person], explain: { ja: '件数と返金の実績は事実として必要だが、相談窓口や二次被害への備えが見えない。', en: '' } }
          - { id: fr-p-support, text: { ja: '通知と返金、相談窓口の実績を書く', en: '' }, points: 8, axis: care, refs: [ppc-notify-person], explain: { ja: '通知と返金に加えて相談窓口の実績を書くと、顧客対応が実際に行われたことが伝わる。', en: '' } }
      - id: progress
        label: { ja: '進捗の公開', en: '' }
        options:
          - { id: fr-o-monthly, text: { ja: '進捗を毎月公開する', en: '' }, points: 10, axis: record, refs: [meti-disclosure-guidance], explain: { ja: '毎月の進捗公開は、対策が形だけになっていないか確かめられる。改善の速度も見える。', en: '' } }
          - { id: fr-o-once, text: { ja: '一度だけ公開する', en: '' }, points: -5, axis: record, refs: [meti-disclosure-guidance], explain: { ja: '一度きりの公開では、その後の進み具合が分からない。未完了の対策が放置されやすい。', en: '' } }
          - { id: fr-o-internal, text: { ja: '進捗は社内だけで確認する', en: '' }, points: -8, axis: record, refs: [meti-disclosure-guidance], explain: { ja: '社内だけで確認すると、対策が進んでいるかを外部が確かめられない。約束が守られたかの説明もできない。', en: '' } }
      - id: industry
        label: { ja: '業界への共有', en: '' }
        options:
          - { id: fr-g-keep, text: { ja: '得た教訓は自社の社内だけにとどめる', en: '' }, points: -5, axis: content, refs: [meti-csm-guideline], explain: { ja: '自社だけに留めると、同じ型のリスクが業界に残る。再発防止に取り組む姿勢も伝わらない。', en: '' } }
          - { id: fr-g-share, text: { ja: '得た教訓を業界に無償で共有する', en: '' }, points: 10, axis: content, refs: [meti-csm-guideline], explain: { ja: '教訓を業界で共有すると、同じ被害を他の小売でも防げる。委託先の点検の輪も広がる。', en: '' } }
          - { id: fr-g-none, text: { ja: '業界には何も共有しない', en: '' }, points: -8, axis: content, refs: [meti-csm-guideline], explain: { ja: '何も共有しないと、同じ物流会社を使う他社も同じリスクを抱えたままになる。自社の再発防止も検証されない。', en: '' } }
