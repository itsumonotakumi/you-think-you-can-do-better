# No.11 ヒナタマート / 経営者ロール（代表取締役社長）
# 判断ポイント15、細目は choices[].items と drafts の合計で80以上。
estimateMinutes: 30
intro: { ja: 'あなたはヒナタマートの代表取締役社長。生活雑貨・衣料・食品を扱う120店舗のチェーンで、通販の配送は物流会社に委託している。朝、その物流会社がランサムウェアの被害に遭ったと分かる。店は開いている。自社のシステムも無事だ。それでも今日から、何を止め、誰に何を説明するかを決めなければならない。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-ppc-prelim
    ref: ppc-report-prelim
    label: { ja: '個人情報保護委員会への速報', en: '' }
    points: -150
    doneFlag: ppcPrelimFiled
  - id: dl-ppc-final
    ref: ppc-report-final-malicious
    label: { ja: '個人情報保護委員会への確報', en: '' }
    points: -150
    doneFlag: ppcFinalFiled
events:
  - id: ev-ransom
    at: { day: 0, minutes: 555 }
    voices: [v-ev-ransom]
    sound: { se: [mail_arrive] }
    caption: { ja: '物流会社が、ランサムウェアの被害を認めた。', en: '' }
  - id: ev-stores
    at: { day: 0, minutes: 720 }
    voices: [v-ev-store]
    gauges: { flame: 5 }
    caption: { ja: '店頭で、通販の注文についての質問が出始めた。', en: '' }
  - id: ev-news
    at: { day: 0, minutes: 1110 }
    voices: [v-ev-news]
    gauges: { flame: 10 }
    sound: { se: [notify_news] }
    caption: { ja: '業界紙が、物流会社の障害と通販各社の停止を報じた。', en: '' }
  - id: ev-customer
    at: { day: 1, minutes: 720 }
    voices: [v-ev-customer]
    gauges: { flame: 5 }
    sound: { se: [phone_ring] }
    caption: { ja: '顧客からの問い合わせが、コールセンターに集中している。', en: '' }
  - id: ev-peer
    at: { day: 2, minutes: 540 }
    voices: [v-ev-peer]
    gauges: { flame: 5 }
    caption: { ja: '同じ物流会社を使う大手通販が、記者会見を開いた。', en: '' }
points:
  - id: p01-outage
    at: { day: 0, minutes: 480 }
    phase: detect
    sound: { se: [phone_ring] }
    text: { ja: '午前8時。ハコブ物流から電話が入る。「出荷システムが止まり、今日の便が出せません」。通販の注文は止まらない。', en: '' }
    voices: [v01-boss, v01-public, v01-ok]
    notable:
      - { id: note-outage, text: { ja: '午前8時、物流から出荷停止の連絡。9時15分、ランサムウェアと判明。', en: '' } }
    choices:
      - id: p01-a-stopall
        text: { ja: '店舗も含めて全社の販売を止め、被害の全体像を待つ', en: '' }
        explain: { ja: '物流の障害で店舗まで止める必要はない。止める範囲を広げるほど、従業員と顧客の不安が増え、説明の手間も膨らむ。', en: '' }
        minutes: 60
        category: hurt
        points: -100
        refs: [no11-bcp-continuity]
        gauges: { flame: 10, trust: -10, damage: 5 }
        items:
          - { id: p01-a-time, points: -8, axis: time, refs: [no11-bcp-continuity] }
          - { id: p01-a-order, points: -10, axis: order, refs: [no11-bcp-continuity] }
          - { id: p01-a-care, points: -5, axis: care, refs: [meti-disclosure-guidance] }
      - id: p01-b-prepare
        text: { ja: '通販の受注を止め、代替配送と顧客案内の準備を指示する', en: '' }
        explain: { ja: '止める範囲を限定し、代替の手段と案内を同時に動かしている。店舗を通常営業のまま残した判断も、被害を広げない。', en: '' }
        minutes: 45
        category: recover
        points: 120
        refs: [no11-bcp-continuity, meti-disclosure-guidance]
        gauges: { damage: -5, flame: -5, trust: 10, stamina: -10 }
        setFlags: { ecStopped: true, altPrepared: true }
        items:
          - { id: p01-b-time, points: 5, axis: time, refs: [no11-bcp-continuity] }
          - { id: p01-b-order, points: 8, axis: order, refs: [no11-bcp-continuity] }
          - { id: p01-b-content, points: 8, axis: content, refs: [meti-disclosure-guidance] }
          - { id: p01-b-record, points: 5, axis: record, refs: [jpcert-handling] }
      - id: p01-c-continue
        text: { ja: '状況が分かるまで通販は通常どおり受注を続ける', en: '' }
        explain: { ja: '出荷できないのに注文だけを受けると、遅延と問い合わせが積み上がる。復旧の見込みがないまま顧客の期待を膨らませる判断になる。', en: '' }
        minutes: 30
        category: hurt
        points: -150
        refs: [meti-disclosure-guidance]
        gauges: { flame: 15, trust: -15, damage: 10 }
        coward: true
        setFlags: { continuedSales: true }
        delayed:
          - { afterPhases: 1, points: -40, gauges: { flame: 10, trust: -10 }, reason: { ja: '出荷できない注文が積み上がり、キャンセルの問い合わせが殺到した。', en: '' } }
        items:
          - { id: p01-c-time, points: -10, axis: time, refs: [meti-disclosure-guidance] }
          - { id: p01-c-order, points: -8, axis: order, refs: [no11-bcp-continuity] }
          - { id: p01-c-care, points: -8, axis: care, refs: [meti-disclosure-guidance] }
    lesson: { ja: '委託先が止まったとき、自社のどの業務を止めるかを先に決める。物流に依存する通販は止めても、店舗まで巻き込む必要はない。止める範囲を限定し、代替の手段と顧客への案内を同時に動かす。', en: '' }

  - id: p02-ransom
    at: { day: 0, minutes: 555 }
    phase: contain
    sound: { se: [mail_arrive] }
    text: { ja: '午前9時15分。物流から「復号には金が必要だ」と連絡。要求は物流宛てだが、こちらにも「配送データを公開する」とメールが来た。', en: '' }
    voices: [v02-attacker, v02-vendor, v02-ok]
    choices:
      - id: p02-a-refuse
        text: { ja: '支払わず、警察への相談と再開条件の整理を物流と進める', en: '' }
        explain: { ja: '支払わない判断と警察への相談を、物流と足並みを揃えて進めている。復号の保証がないことを前提に、再開の条件を整理できている。', en: '' }
        minutes: 90
        category: recover
        points: 130
        refs: [npa-consult, no11-ppc-entrust-supervision]
        gauges: { flame: -5, trust: 10, stamina: -10 }
        setFlags: { refusedRansom: true }
        items:
          - { id: p02-a-record, points: 8, axis: record, refs: [npa-consult] }
          - { id: p02-a-order, points: 8, axis: order, refs: [npa-consult] }
          - { id: p02-a-content, points: 5, axis: content, refs: [no11-ppc-entrust-supervision] }
      - id: p02-b-keep
        text: { ja: '物流の判断に任せ、自社は関与しないと伝える', en: '' }
        explain: { ja: '委託先の問題として距離を置くと、配送データを預けた側の責任を果たせない。再開の見通しも立たず、顧客への説明が止まる。', en: '' }
        minutes: 30
        category: hurt
        points: -120
        refs: [no11-ppc-entrust-supervision]
        gauges: { flame: 5, trust: -10, damage: 10 }
        coward: true
        items:
          - { id: p02-b-order, points: -10, axis: order, refs: [no11-ppc-entrust-supervision] }
          - { id: p02-b-record, points: -8, axis: record, refs: [jpcert-handling] }
      - id: p02-c-pay
        text: { ja: '物流に代わって身代金を支払い、配送データを取り戻す', en: '' }
        explain: { ja: '支払いは復号もデータの削除も保証せず、犯罪組織への資金提供になる。自社が払えば、取引先を巻き込む判断として後から重く問われる。', en: '' }
        minutes: 60
        category: fatal
        points: -300
        refs: [npa-consult]
        gauges: { damage: 20, flame: 20, trust: -20 }
        setFlags: { paidRansom: true }
        items:
          - { id: p02-c-record, points: -10, axis: record, refs: [npa-consult] }
          - { id: p02-c-content, points: -10, axis: content, refs: [npa-consult] }
          - { id: p02-c-care, points: -5, axis: care, refs: [npa-consult] }
    lesson: { ja: '身代金の要求は犯罪であり、支払いは復号も沈黙も保証しない。委託先が払うかどうかにかかわらず、自社は警察と法務に相談し、支払わない方針を明確にする。復旧の見込みと再開の条件を同時に整理する。', en: '' }

