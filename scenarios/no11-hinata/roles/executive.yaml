        text: { ja: '詳しい確認は物流の調査結果が出てからまとめて行う', en: '' }
        explain: { ja: '委託先の調査を待つ間、自社の接続点が安全かは分からないままになる。自社で確認できる範囲を後回しにすると、説明も再開も遅れる。', en: '' }
        minutes: 30
        category: maintain
        points: 20
        refs: [jpcert-handling]
        gauges: { trust: 0, stamina: 3 }
        coward: true
        items:
