          - { id: p03-a-content, points: -5, axis: content, refs: [no11-bcp-continuity] }
      - id: p03-b-stop
        text: { ja: '注文を止め、再開の見込みと問い合わせ窓口をサイトに出す', en: '' }
        explain: { ja: '止める判断と、顧客が次に知りたいことを同時に示している。注文を受けない分の売上は減るが、返金と問い合わせの膨張を防げる。', en: '' }
        minutes: 60
        category: recover
        points: 130
        refs: [meti-disclosure-guidance, no11-bcp-continuity]
        gauges: { flame: -5, trust: 12, stamina: -5 }
        setFlags: { ecStopped: true, customerWindow: true }
        items:
          - { id: p03-b-order, points: 8, axis: order, refs: [meti-disclosure-guidance] }
          - { id: p03-b-content, points: 8, axis: content, refs: [no11-bcp-continuity] }
          - { id: p03-b-care, points: 8, axis: care, refs: [meti-disclosure-guidance] }
          - { id: p03-b-record, points: 3, axis: record, refs: [jpcert-handling] }
      - id: p03-c-maintenance
        text: { ja: '注文を止めるが、理由は「システム保守」とだけ表示する', en: '' }
        explain: { ja: '攻撃と物流の停止を伏せた発表は、後から判明したときに隠蔽と受け取られる。顧客が取るべき行動も伝わらず、問い合わせが増える。', en: '' }
        minutes: 30
        category: fatal
        points: -250
        refs: [meti-disclosure-guidance]
        gauges: { flame: 20, trust: -20 }
        setFlags: { hidAttack: true }
