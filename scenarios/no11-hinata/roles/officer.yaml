# No.11 ヒナタマート / 役員ロール（ヒナタ通販株式会社 代表取締役社長）
# プレイヤーは通販子会社の社長。店舗は親会社の担当。受注・出荷・顧客対応・親会社への報告を預かる。
# 判断ポイント15、細目は choices[].items と drafts の合計で80以上。
estimateMinutes: 35
intro: { ja: 'あなたはヒナタ通販株式会社の社長、小柳 真澄。親会社ヒナタマートの通販を担い、配送はハコブ物流に委託している。午前8時、その物流会社の出荷システムが止まったと連絡が入った。店は親会社が開けている。あなたの仕事は、注文を止める判断と、顧客と親会社への説明だ。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-officer-ppc-prelim
    ref: ppc-report-prelim
    label: { ja: '個人情報保護委員会への速報', en: '' }
    points: -150
    doneFlag: ppcPrelimFiled
  - id: dl-officer-ppc-final
    ref: ppc-report-final-malicious
    label: { ja: '個人情報保護委員会への確報', en: '' }
    points: -120
    doneFlag: ppcFinalFiled
events:
  - id: ev-officer-ransom
    at: { day: 0, minutes: 555 }
    voices: [v-ev-ransom]
    gauges: { flame: 5 }
    sound: { se: [mail_arrive] }
    caption: { ja: '物流会社が、ランサムウェアの被害を認めた。', en: '' }
  - id: ev-officer-parent
    at: { day: 0, minutes: 1020 }
    voices: [v-ev-parent]
    gauges: { flame: 5 }
    sound: { se: [phone_ring] }
    caption: { ja: '親会社の経営企画から、状況の説明を求められた。', en: '' }
  - id: ev-officer-news
    at: { day: 0, minutes: 1200 }
    voices: [v-ev-news]
    gauges: { flame: 8 }
    sound: { se: [notify_news] }
    caption: { ja: '業界紙が、物流会社の障害と通販各社の停止を報じた。', en: '' }
  - id: ev-officer-member
    at: { day: 1, minutes: 720 }
    voices: [v-ev-member]
    gauges: { flame: 5 }
    sound: { se: [phone_ring] }
    caption: { ja: '会員から、注文と請求についての問い合わせが集中している。', en: '' }
  - id: ev-officer-peer
    at: { day: 2, minutes: 540 }
    voices: [v-ev-peer]
    gauges: { flame: 5 }
    caption: { ja: '同じ物流を使う大手通販が、記者会見を開いた。', en: '' }
points:
  - id: o01-stop
    at: { day: 0, minutes: 480 }
    phase: detect
    sound: { se: [phone_ring] }
    text: { ja: '午前8時。ハコブ物流から電話が入る。「出荷システムが止まり、今日の便が出せません」。通販の注文は今朝も入っている。受注をどうするか。', en: '' }
    voices: [v01-boss, v01-public, v01-ok]
    notable:
      - { id: note-outage, text: { ja: '午前8時、物流から出荷停止の連絡。今朝の注文は未出荷のまま残っている。', en: '' } }
    choices:
      - id: o01-a-continue
        text: { ja: '受注は続け、発送が遅れることだけをサイトに出す', en: '' }
        explain: { ja: '出荷の見込みがないまま注文を積むと、後から大量の取り消しと返金が発生する。顧客の期待を先に膨らませる判断になる。', en: '' }
        minutes: 45
        category: hurt
        points: -150
        refs: [meti-disclosure-guidance]
        gauges: { flame: 12, trust: -12, damage: 10 }
        setFlags: { continuedSales: true }
        delayed:
          - { afterPhases: 1, points: -40, gauges: { flame: 10, trust: -10 }, reason: { ja: '出荷できない注文が積み上がり、取り消しの問い合わせが殺到した。', en: '' } }
        items:
          - { id: o01-a-time, points: -10, axis: time, refs: [meti-disclosure-guidance] }
          - { id: o01-a-order, points: -8, axis: order, refs: [no11-bcp-continuity] }
          - { id: o01-a-care, points: -8, axis: care, refs: [meti-disclosure-guidance] }
      - id: o01-b-notice
        text: { ja: '受注を止め、理由と再開の見込みをサイトと会員メールで出す', en: '' }
        explain: { ja: '止める範囲を決め、理由と再開の見込みを同時に示している。顧客は待つか取り消すかを、自分で選べるようになる。', en: '' }
        minutes: 60
        category: recover
        points: 120
        refs: [no11-bcp-continuity, meti-disclosure-guidance]
        gauges: { damage: -5, flame: -5, trust: 12, stamina: -10 }
        setFlags: { ecStopped: true, customerWindow: true }
        items:
          - { id: o01-b-time, points: 5, axis: time, refs: [no11-bcp-continuity] }
          - { id: o01-b-order, points: 8, axis: order, refs: [no11-bcp-continuity] }
          - { id: o01-b-content, points: 8, axis: content, refs: [meti-disclosure-guidance] }
          - { id: o01-b-care, points: 8, axis: care, refs: [meti-disclosure-guidance] }
      - id: o01-c-hide
        text: { ja: '受注を止め、理由は「システム保守」とだけ表示する', en: '' }
        explain: { ja: '攻撃による停止を伏せた発表は、後から判明したときに隠蔽と受け取られる。顧客が取るべき行動も伝わらない。', en: '' }
        minutes: 30
        category: fatal
        points: -250
        refs: [meti-disclosure-guidance]
        gauges: { flame: 20, trust: -20 }
        setFlags: { hidAttack: true }
        delayed:
          - { afterPhases: 2, points: -100, gauges: { flame: 20, trust: -15 }, reason: { ja: '物流のランサム被害が報道され、当初の説明が隠蔽と批判された。', en: '' } }
        items:
          - { id: o01-c-wording, points: -20, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: o01-c-record, points: -10, axis: record, refs: [meti-disclosure-guidance] }
          - { id: o01-c-care, points: -8, axis: care, refs: [meti-disclosure-guidance] }
    lesson: { ja: '出荷できないと分かった時点で、注文を止めるかを決める。止めるなら、理由と再開の見込み、取り消しの方法を同じ案内に並べる。理由を別の言葉に置き換えると、後で必ず説明のやり直しになる。', en: '' }

