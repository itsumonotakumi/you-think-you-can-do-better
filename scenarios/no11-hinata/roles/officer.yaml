          - { id: en-n-none, text: { ja: '次回の予定を書かない', en: '' }, points: -5, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '次の予定がないと、情報の空白を憶測で埋められる。問い合わせの終わりも見えない。', en: '' } }
          - { id: en-n-next, text: { ja: '次の公表予定を書く', en: '' }, points: 5, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '次の公表予定があると、続報を待つ側の見通しが立つ。憶測が広がる前に、次の接点を示せる。', en: '' } }
          - { id: en-n-undecided, text: { ja: '次回は未定と書く', en: '' }, points: 2, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '未定と書くだけでは、いつ情報が出るのか分からない。待つ側の見通しが立たず、問い合わせが続く。', en: '' } }
  resume-guide:
