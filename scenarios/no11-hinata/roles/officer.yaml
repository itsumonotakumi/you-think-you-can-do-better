        explain: { ja: '確定を待つ間に、親会社は支援の判断も広報の準備もできない。子会社だけの判断が独走し、後から整合を取る手間が増える。', en: '' }
        minutes: 45
        category: hurt
        points: -100
        refs: [meti-csm-guideline]
