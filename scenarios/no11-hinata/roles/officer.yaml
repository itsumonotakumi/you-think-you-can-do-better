    choices:
      - id: o02-a-parent
        text: { ja: '事実と不明点、親会社に決めてほしいことを一枚にまとめる', en: '' }
        explain: { ja: '起きたことと分からないことを分け、判断してほしいことを添えている。親会社は支援の可否をその場で決められる。', en: '' }
