        points: -200
        refs: [ppc-report-scope, meti-disclosure-guidance]
        gauges: { flame: 25, trust: -20, damage: 15 }
        setFlags: { deniedLeak: true }
        items:
          - { id: o13-c-wording, points: -15, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: o13-c-content, points: -10, axis: content, refs: [ppc-report-scope] }
          - { id: o13-c-care, points: -10, axis: care, refs: [ppc-notify-person] }
    lesson: { ja: '攻撃者が情報を公開したら、確定を待たずに可能性がある人へ通知する。通知には、何が漏れたか、本人が何をすればよいか、どこに相談するかを入れる。否定を続けると、顧客は自力で情報を探すことになる。', en: '' }

  - id: o14-resume
    at: { day: 21, minutes: 600 }
    phase: recover
    sound: { se: [notify_sns] }
    text: { ja: '午前10時。物流の復旧と代替配送の体制が整った。全面再開の条件を決める。監視の手を緩めるかどうかも迷う。', en: '' }
    voices: [v14-public, v14-past, v14-ok]
    choices:
      - id: o14-a-full
        text: { ja: '物流の復旧に合わせて全面再開し、監視も通常に戻す', en: '' }
        explain: { ja: '問題が起きていない状態を前提に、監視まで一度に戻している。再発の兆候を見逃すと、止める手段がないまま被害が広がる。', en: '' }
        minutes: 120
        category: hurt
        points: -150
        refs: [nist-sp800-61r3]
        gauges: { damage: 15, flame: 10, trust: -10 }
        delayed:
          - { afterPhases: 1, points: -60, gauges: { damage: 15, trust: -15 }, reason: { ja: '再開後に不審な通信が見つかり、通販を再度止めた。', en: '' } }
        items:
          - { id: o14-a-time, points: -10, axis: time, refs: [nist-sp800-61r3] }
          - { id: o14-a-record, points: -10, axis: record, refs: [nist-sp800-61r3] }
          - { id: o14-a-content, points: -8, axis: content, refs: [nist-sp800-61r3] }
      - id: o14-b-phased
        text: { ja: '段階再開を続け、注文と出荷の数を見て全面再開を決める', en: '' }
        explain: { ja: '再開の範囲を広げながら、数字で次の判断を決めている。監視を維持したまま進めるため、問題が起きたときに止める範囲を限定できる。', en: '' }
        minutes: 180
        category: recover
        points: 130
        refs: [nist-sp800-61r3, no11-bcp-continuity]
        gauges: { damage: -15, trust: 15, stamina: -10 }
        setFlags: { phasedResume: true, monitorKept: true }
        items:
          - { id: o14-b-order, points: 8, axis: order, refs: [nist-sp800-61r3] }
          - { id: o14-b-content, points: 8, axis: content, refs: [no11-bcp-continuity] }
          - { id: o14-b-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: o14-b-time, points: 3, axis: time, refs: [nist-sp800-61r3] }
      - id: o14-c-delay
        text: { ja: '店頭受け取りを続けながら、全面再開を先に延ばす', en: '' }
        explain: { ja: '安全側の判断ではあるが、再開の条件を決めずに延ばすと、いつ戻るのか分からない状態が続く。顧客の離脱と売上の損失が固定化する。', en: '' }
        minutes: 60
        category: maintain
        points: 30
        refs: [no11-bcp-continuity]
        gauges: { trust: 3, flame: 3 }
        items:
          - { id: o14-c-order, points: 5, axis: order, refs: [no11-bcp-continuity] }
          - { id: o14-c-record, points: 3, axis: record, refs: [no11-bcp-continuity] }
    lesson: { ja: '再開は、安全を確認できた範囲から段階的に広げる。監視を維持し、注文と出荷の数を見て次の判断を決める。全面再開と監視の解除を同時に行うと、再発したときに止める手段がなくなる。', en: '' }

  - id: o15-report
    at: { day: 30, minutes: 600 }
    phase: after
    sound: { se: [notify_news] }
    text: { ja: '午前10時。子会社としての総括を、親会社と顧客に出す。再開の案内と、委託先の監督の見直しをどう書くか。', en: '' }
    voices: [v15-expert, v15-boss, v15-ok]
    choices:
      - id: o15-a-hide
        text: { ja: '総括は社内だけで共有し、外には再開の案内だけを出す', en: '' }
        explain: { ja: '攻撃に使える情報を伏せる配慮は必要だが、総括を隠すと検証が進まない。監督をどう直したのかも説明できず、再発への備えが見えない。', en: '' }
        minutes: 60
        category: hurt
        points: -150
        refs: [meti-disclosure-guidance]
        gauges: { flame: 15, trust: -15 }
        items:
          - { id: o15-a-content, points: -10, axis: content, refs: [meti-disclosure-guidance] }
          - { id: o15-a-wording, points: -10, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: o15-a-record, points: -8, axis: record, refs: [meti-disclosure-guidance] }
      - id: o15-b-publish
        text: { ja: '攻撃に使える詳細だけを伏せて、総括を全文公開する', en: '' }
        explain: { ja: '危険な詳細を伏せつつ、原因と対応を公開している。再発防止の材料として価値はあるが、進捗の継続公開までは踏み込んでいない。', en: '' }
        minutes: 180
        category: recover
        points: 100
        refs: [meti-disclosure-guidance]
        gauges: { flame: -10, trust: 15, stamina: -10 }
        setFlags: { fullDisclosure: true, ppcFinalFiled: true }
        items:
          - { id: o15-b-content, points: 8, axis: content, refs: [meti-disclosure-guidance] }
          - { id: o15-b-record, points: 5, axis: record, refs: [meti-disclosure-guidance] }
      - id: o15-c-open
        text: { ja: '監督の不備を含む総括を公開し、対策の進捗を毎月出す', en: '' }
        explain: { ja: '自社の監督責任まで含めて公開し、対策の進捗を継続して示している。一度の公表で終わらせず、改善を確かめられる形にした点が最も評価できる。', en: '' }
        minutes: 240
        category: increase
        points: 300
        fatalAlternate: 50
        refs: [meti-disclosure-guidance, no11-ppc-entrust-supervision]
        gauges: { flame: -15, trust: 20, stamina: -15 }
        setFlags: { fullDisclosure: true, ppcFinalFiled: true }
        detail: resume-guide
        items:
          - { id: o15-c-content, points: 8, axis: content, refs: [meti-disclosure-guidance] }
          - { id: o15-c-record, points: 8, axis: record, refs: [no11-ppc-entrust-supervision] }
          - { id: o15-c-care, points: 8, axis: care, refs: [ppc-notify-person] }
    lesson: { ja: '総括は、攻撃に使える詳細だけを伏せて公開する。自社の監督責任と原因を書き、対策の進捗を継続して示す。一度公開して終わりにすると、対策が形だけになっていないか確かめられない。', en: '' }

drafts:
  ec-notice:
