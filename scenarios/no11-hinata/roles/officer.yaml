          - { id: en-a-apology, text: { ja: '「申し訳ありません」とだけ書く', en: '' }, points: -10, axis: care, refs: [meti-disclosure-guidance], explain: { ja: '謝罪だけでは、顧客が注文を取り消せるのか、返金はあるのかが分からない。次の行動につながらない。', en: '' } }
