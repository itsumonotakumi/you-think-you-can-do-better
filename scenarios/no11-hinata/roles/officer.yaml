          - { id: en-s-late, text: { ja: '停止後に注文した人だけ', en: '' }, points: -15, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '停止後に注文した人だけに絞ると、それ以前の注文者が自分は対象か分からない。問い合わせが窓口に集中する。', en: '' } }
          - { id: en-s-all, text: { ja: '通販の注文者全員', en: '' }, points: 10, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '注文者全員を対象にすると、止まっている荷物に関わる人が自分事として動ける。対象を広く取るほど説明の抜けは減る。', en: '' } }
          - { id: en-s-month, text: { ja: '直近一か月に注文した人', en: '' }, points: 3, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '直近一か月は分かりやすいが、それ以前の注文者を外す理由にはならない。対象を狭めた分、説明の追加が必要になる。', en: '' } }
      - id: cause
        label: { ja: '原因の書き方', en: '' }
        options:
          - { id: en-c-attack, text: { ja: '委託先のランサムウェア被害', en: '' }, points: 8, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '委託先の攻撃被害と書くと、自社の障害ではないことと、起きている事態の重さが同時に伝わる。', en: '' } }
          - { id: en-c-system, text: { ja: '委託先のシステム障害', en: '' }, points: 3, axis: content, refs: [meti-disclosure-guidance], explain: { ja: 'システム障害と書くと、攻撃による被害だと分からない。後から判明したとき、説明の訂正が必要になる。', en: '' } }
          - { id: en-c-fault, text: { ja: '委託先の機器故障による障害', en: '' }, points: -20, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: '機器故障と書くと、原因が異なる説明になる。攻撃と判明した後で、隠していたと受け取られる。', en: '' } }
