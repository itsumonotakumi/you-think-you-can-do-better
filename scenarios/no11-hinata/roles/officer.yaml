          - { id: en-i-specific, text: { ja: '出荷停止と再開の見込み', en: '' }, points: 10, axis: content, refs: [no11-bcp-continuity], explain: { ja: '出荷が止まっていることと再開の見込みが分かると、顧客は待つか取り消すかを自分で選べる。', en: '' } }
