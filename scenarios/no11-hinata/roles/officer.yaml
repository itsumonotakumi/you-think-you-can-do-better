          - { id: rg-o-phased, text: { ja: '地域を分けて段階的に再開する', en: '' }, points: 10, axis: order, refs: [no11-bcp-continuity], explain: { ja: '地域を分けて戻すと、問題が起きたときに止める範囲を限定できる。注文と出荷の数を見て次を決められる。', en: '' } }
