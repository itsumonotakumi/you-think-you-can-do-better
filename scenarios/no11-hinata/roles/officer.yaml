          - { id: rg-p-done, text: { ja: '返金の実績と今後の扱いを書く', en: '' }, points: 10, axis: care, refs: [meti-disclosure-guidance], explain: { ja: '実績と今後の扱いを書くと、顧客は自分の分がどうなるか判断できる。同じ基準で対応したことも伝わる。', en: '' } }
