          - { id: rg-d-window, text: { ja: '通知と相談窓口を書く', en: '' }, points: 10, axis: care, refs: [ppc-notify-person], explain: { ja: '通知と相談窓口を案内すると、対象の人が次に動ける。二次被害への備えも同じ案内で伝わる。', en: '' } }
