          - { id: en-w-none, text: { ja: '問い合わせ先を書かない', en: '' }, points: -15, axis: care, refs: [meti-disclosure-guidance], explain: { ja: '問い合わせ先がないと、顧客はSNSや店舗に流れる。現場が個別に説明することになり、内容もばらつく。', en: '' } }
          - { id: en-w-hours, text: { ja: '専用窓口の番号と受付時間', en: '' }, points: 8, axis: care, refs: [no11-bcp-continuity], explain: { ja: '番号と受付時間があると、つながる見通しが立つ。夜間や休日の問い合わせも迷わない。', en: '' } }
