    voices: [v04-boss, v04-law, v04-ok]
    choices:
      - id: l04-a-onepage
        text: { ja: '事実、不明点、決めてほしいことを1枚にまとめて上申する', en: '' }
        explain: { ja: '分かったことと分からないことを分け、経営に決めてほしいことを添えている。会議で判断が止まらず、次の手も決まる。', en: '' }
        minutes: 60
        category: recover
        points: 120
        refs: [meti-csm-guideline, nist-sp800-61r3]
        gauges: { flame: -5, trust: 12, stamina: -8 }
