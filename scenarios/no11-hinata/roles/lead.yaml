        items:
          - { id: l05-a-record, points: -10, axis: record, refs: [nist-sp800-61r3] }
          - { id: l05-a-time, points: -8, axis: time, refs: [nist-sp800-61r3] }
      - id: l05-b-watch
        text: { ja: '委託先との接続の監視を強め、検知の条件を追加する', en: '' }
        explain: { ja: '見る場所と条件を増やし、異常に早く気づける形にしている。再開の判断にも、監視の結果を使える。', en: '' }
        minutes: 90
        category: recover
        points: 110
        refs: [nist-sp800-61r3, jpcert-handling]
        gauges: { damage: -8, trust: 10, stamina: -10 }
        setFlags: { monitorKept: true }
        items:
          - { id: l05-b-record, points: 8, axis: record, refs: [nist-sp800-61r3] }
          - { id: l05-b-content, points: 8, axis: content, refs: [jpcert-handling] }
          - { id: l05-b-order, points: 5, axis: order, refs: [nist-sp800-61r3] }
      - id: l05-c-block
        text: { ja: '外部との通信を全部止め、安全を確認してから戻す', en: '' }
        explain: { ja: '全部を止めれば安全に見えるが、店舗の決済も受注も止まる。止める範囲を広げるほど、戻す作業と説明が重くなる。', en: '' }
        minutes: 60
        category: maintain
        points: 20
        refs: [no11-bcp-continuity]
        gauges: { damage: 10, flame: 5, trust: -5 }
        items:
          - { id: l05-c-order, points: -8, axis: order, refs: [no11-bcp-continuity] }
          - { id: l05-c-care, points: 3, axis: care, refs: [meti-disclosure-guidance] }
    lesson: { ja: '委託先を経由した動きは、通常の監視では見つけにくい。接続の監視を強め、検知の条件を具体的に足す。全部の通信を止める判断は、店舗と受注まで止めるため、範囲を分けて考える。', en: '' }

