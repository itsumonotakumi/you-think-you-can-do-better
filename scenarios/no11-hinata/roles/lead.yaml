          - { id: l04-a-record, points: 5, axis: record, refs: [jpcert-handling] }
      - id: l04-b-detail
        text: { ja: '技術的な調査結果を、見つかった順に全部並べて報告する', en: '' }
        explain: { ja: '情報は多いが、どこが事実でどこが不明か、何を決めてほしいのかが伝わらない。会議は共有で終わり、判断が持ち越される。', en: '' }
        minutes: 45
        category: maintain
        points: 20
        refs: [meti-csm-guideline]
        gauges: { trust: 3, stamina: -5 }
        items:
          - { id: l04-b-content, points: 5, axis: content, refs: [meti-csm-guideline] }
          - { id: l04-b-record, points: 3, axis: record, refs: [jpcert-handling] }
      - id: l04-c-hold
        text: { ja: '確認できるまで経営には報告せず、調査を続ける', en: '' }
        explain: { ja: '確定を待つ間に、経営は止める範囲も公表も決められない。技術の判断だけで組織が動き、後から整合を取る手間が増える。', en: '' }
        minutes: 30
        category: hurt
        points: -100
        refs: [meti-csm-guideline]
        gauges: { flame: 8, trust: -10 }
        coward: true
        items:
          - { id: l04-c-order, points: -10, axis: order, refs: [meti-csm-guideline] }
          - { id: l04-c-time, points: -8, axis: time, refs: [jpcert-handling] }
    lesson: { ja: '技術の調査は、経営が判断できる形に翻訳して出す。事実、不明点、決めてほしいことを1枚にまとめる。全部を並べても判断は進まず、確定を待てば組織は止まったままになる。', en: '' }

