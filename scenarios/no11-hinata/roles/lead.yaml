# No.11 ヒナタマート / セキュリティ部門長ロール（情報システム部長）
# プレイヤーは情報システム部長。自社は感染していないが、委託先の被害と自社の接続点を扱う。
# 経営への翻訳、証拠の保全、監視、委託先の監督、段階再開の条件が仕事。
# 判断ポイント15、細目は choices[].items と drafts の合計で80以上。
estimateMinutes: 30
intro: { ja: 'あなたはヒナタマートの情報システム部長、瀬川 理恵。朝、配送を委託するハコブ物流の出荷システムが止まったと連絡が入った。自社の端末とサーバーに感染の痕跡はない。だが、委託先には顧客の配送データを渡している。何を確かめ、どこまで経営に伝えるかが、今日の仕事だ。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-lead-ppc-prelim
    ref: ppc-report-prelim
    label: { ja: '個人情報保護委員会への速報の材料', en: '' }
    points: -150
    doneFlag: ppcPrelimFiled
  - id: dl-lead-ppc-final
    ref: ppc-report-final-malicious
    label: { ja: '個人情報保護委員会への確報の材料', en: '' }
    points: -120
    doneFlag: ppcFinalFiled
events:
  - id: ev-lead-ransom
    at: { day: 0, minutes: 555 }
    voices: [v-ev-ransom]
    gauges: { flame: 5 }
    sound: { se: [mail_arrive] }
    caption: { ja: '物流会社が、ランサムウェアの被害を認めた。', en: '' }
  - id: ev-lead-alert
    at: { day: 0, minutes: 750 }
    voices: [v-ev-alert]
    sound: { se: [notify_chat] }
    caption: { ja: '監視の画面に、普段と違う通信の記録が出た。', en: '' }
  - id: ev-lead-news
    at: { day: 0, minutes: 1200 }
    voices: [v-ev-news]
    gauges: { flame: 8 }
    sound: { se: [notify_news] }
    caption: { ja: '業界紙が、物流会社の障害と通販各社の停止を報じた。', en: '' }
  - id: ev-lead-peer
    at: { day: 2, minutes: 540 }
    voices: [v-ev-peer]
    gauges: { flame: 5 }
    caption: { ja: '同じ物流を使う大手通販が、記者会見を開いた。', en: '' }
  - id: ev-lead-board
    at: { day: 3, minutes: 540 }
    voices: [v-ev-board]
    gauges: { flame: 5 }
    sound: { se: [phone_ring] }
    caption: { ja: '取締役から、再開の時期と予算の見通しを聞かれた。', en: '' }
points:
  - id: l01-first
    at: { day: 0, minutes: 480 }
    phase: detect
    sound: { se: [phone_ring] }
    text: { ja: '午前8時。ハコブ物流の出荷システムが止まった。自社の通販は止まるが、店舗は動いている。情報システム部として、まず何を押さえるか。', en: '' }
    voices: [v01-boss, v01-coward, v01-ok]
    notable:
      - { id: note-outage, text: { ja: '午前8時、委託先の出荷停止。自社の受注と出荷は物流の接続点で止まっている。', en: '' } }
    choices:
      - id: l01-a-scope
        text: { ja: '自社の受注と出荷の接続点を確認する体制を作る', en: '' }
        explain: { ja: '委託先の障害が自社に及ぶ範囲を先に切り分けている。調べる範囲と担当が見えるため、経営への報告も早くなる。', en: '' }
        minutes: 60
        category: recover
        points: 120
        refs: [jpcert-handling, no11-bcp-continuity]
        gauges: { damage: -5, flame: -5, trust: 10, stamina: -10 }
        setFlags: { scopeChecked: true }
        items:
          - { id: l01-a-time, points: 5, axis: time, refs: [jpcert-handling] }
          - { id: l01-a-order, points: 8, axis: order, refs: [jpcert-handling] }
          - { id: l01-a-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: l01-a-content, points: 5, axis: content, refs: [no11-bcp-continuity] }
      - id: l01-b-wait
        text: { ja: '物流の復旧を待ち、その間に通常の業務を続ける', en: '' }
        explain: { ja: '委託先の復旧を待つ間に、自社の接続点は調べられない。影響の範囲が分からないまま、経営への報告も止まる。', en: '' }
        minutes: 30
        category: hurt
        points: -110
        refs: [jpcert-handling]
        gauges: { flame: 8, trust: -10, damage: 5 }
        coward: true
        items:
          - { id: l01-b-time, points: -10, axis: time, refs: [jpcert-handling] }
          - { id: l01-b-order, points: -8, axis: order, refs: [jpcert-handling] }
      - id: l01-c-cut
        text: { ja: '全社の端末を一斉にネットワークから切り離す', en: '' }
        explain: { ja: '感染の痕跡がない段階で全部を切ると、店舗と受注の業務まで止まる。止める範囲を根拠なく広げる判断になる。', en: '' }
        minutes: 90
        category: hurt
        points: -120
        refs: [no11-bcp-continuity]
        gauges: { damage: 15, flame: 10, trust: -10 }
        items:
          - { id: l01-c-order, points: -10, axis: order, refs: [no11-bcp-continuity] }
          - { id: l01-c-time, points: -8, axis: time, refs: [no11-bcp-continuity] }
          - { id: l01-c-care, points: -5, axis: care, refs: [meti-disclosure-guidance] }
    lesson: { ja: '委託先が止まったら、まず自社のどこがつながっているかを確かめる。範囲と担当を決めて調べれば、影響の切り分けが早くなる。感染の痕跡がない段階で全部を止めると、動かす必要のない業務まで止まる。', en: '' }

  - id: l02-evidence
    at: { day: 0, minutes: 555 }
    phase: contain
    sound: { se: [mail_arrive] }
    text: { ja: '午前9時15分。物流から「暗号化された。復旧には時間がかかる」と連絡。原因の調査には、機器と記録が要る。', en: '' }
    voices: [v02-vendor, v02-past, v02-ok]
    choices:
      - id: l02-a-reset
        text: { ja: '復旧を優先し、機器の初期化を物流に勧める', en: '' }
        explain: { ja: '初期化すると侵入の経路と時刻が分からなくなる。原因が分からなければ、同じ手口への備えも作れない。', en: '' }
        minutes: 45
        category: hurt
        points: -140
        refs: [jpcert-handling, nist-sp800-61r3]
        gauges: { damage: 10, trust: -10 }
        items:
          - { id: l02-a-record, points: -15, axis: record, refs: [jpcert-handling] }
          - { id: l02-a-content, points: -8, axis: content, refs: [nist-sp800-61r3] }
      - id: l02-b-preserve
        text: { ja: 'ログと機器の保全を、時刻と範囲を決めて文書で依頼する', en: '' }
        explain: { ja: '何を、いつから、どの範囲で残すかを決めて依頼している。調査の前提が揃い、復旧の手順も根拠を持てる。', en: '' }
        minutes: 75
        category: recover
        points: 120
        refs: [jpcert-handling, nist-sp800-61r3]
        gauges: { damage: -5, trust: 10, stamina: -10 }
        setFlags: { evidenceKept: true }
        items:
          - { id: l02-b-record, points: 10, axis: record, refs: [jpcert-handling] }
          - { id: l02-b-order, points: 8, axis: order, refs: [nist-sp800-61r3] }
          - { id: l02-b-content, points: 8, axis: content, refs: [jpcert-handling] }
      - id: l02-c-leave
        text: { ja: '証拠の扱いは物流の判断に任せ、こちらは関与しない', en: '' }
        explain: { ja: '委託先に任せきると、こちらの預けたデータの扱いを確かめられない。調査の前提が崩れ、報告の根拠も弱くなる。', en: '' }
        minutes: 30
        category: maintain
        points: 20
        refs: [jpcert-handling]
        gauges: { trust: 0, stamina: -3 }
        items:
          - { id: l02-c-record, points: 5, axis: record, refs: [jpcert-handling] }
          - { id: l02-c-order, points: -5, axis: order, refs: [nist-sp800-61r3] }
    lesson: { ja: '復旧の前に、残すものを決める。ログ、機器、作業の記録について、時刻と範囲を指定して保全を依頼する。初期化してからでは、侵入の経路も時刻も分からず、同じ手口への備えを作れない。', en: '' }

  - id: l03-own
    at: { day: 0, minutes: 690 }
    phase: contain
    sound: { se: [notify_chat] }
    text: { ja: '午前11時30分。ECサイトと受注データベースの調査が途中だ。物流との接続に、普段と違う通信が残っている。', en: '' }
    voices: [v03-expert, v03-public, v03-ok]
    choices:
      - id: l03-a-clear
        text: { ja: '問題なしと社内に断言し、調査を打ち切る', en: '' }
        explain: { ja: '接続点の確認が終わる前に断言すると、後で不審な通信が見つかったときに訂正が要る。説明の自由度が下がる。', en: '' }
        minutes: 30
        category: hurt
        points: -110
        refs: [jpcert-handling]
        gauges: { flame: 8, trust: -10 }
        items:
          - { id: l03-a-content, points: -12, axis: content, refs: [jpcert-handling] }
          - { id: l03-a-record, points: -6, axis: record, refs: [jpcert-handling] }
      - id: l03-b-reboot
        text: { ja: '全システムを再起動し、様子を見て判断する', en: '' }
        explain: { ja: '再起動で消える記録があり、原因の手がかりを失う。様子を見る間に、接続点の調査も進まない。', en: '' }
        minutes: 60
        category: maintain
        points: 20
        refs: [nist-sp800-61r3]
        gauges: { damage: 5, stamina: -5 }
        items:
          - { id: l03-b-record, points: -8, axis: record, refs: [nist-sp800-61r3] }
          - { id: l03-b-time, points: 5, axis: time, refs: [jpcert-handling] }
      - id: l03-c-triage
        text: { ja: '通信経路とアカウントを点検し、影響を切り分ける', en: '' }
        explain: { ja: '怪しい通信の中身と、使われたアカウントを確かめている。影響の範囲が分かれば、止める範囲も説明も決められる。', en: '' }
        minutes: 90
        category: recover
        points: 120
        refs: [jpcert-handling, nist-sp800-61r3]
        gauges: { damage: -8, trust: 10, stamina: -10 }
        setFlags: { ownChecked: true }
        items:
          - { id: l03-c-content, points: 8, axis: content, refs: [jpcert-handling] }
          - { id: l03-c-record, points: 8, axis: record, refs: [nist-sp800-61r3] }
          - { id: l03-c-order, points: 8, axis: order, refs: [jpcert-handling] }
    lesson: { ja: '自社が無事かを語る前に、接続点を調べる。通信の行き先と使われたアカウントを確かめ、影響の範囲を切り分ける。再起動や断言は、記録を失い、後で説明をやり直す原因になる。', en: '' }

  - id: l04-board
