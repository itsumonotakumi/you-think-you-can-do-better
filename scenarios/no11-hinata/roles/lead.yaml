        gauges: { trust: 12, stamina: -12 }
        setFlags: { drillPlanned: true }
        items:
          - { id: l14-c-order, points: 8, axis: order, refs: [nist-sp800-61r3] }
          - { id: l14-c-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: l14-c-content, points: 8, axis: content, refs: [no11-bcp-continuity] }
    lesson: { ja: '事業継続の手順は、直して終わりにしない。復旧の手順を更新し、訓練の日程と担当を決めて、動けるかを確かめる。今回うまくいったことは、次も同じようにできる理由にはならない。', en: '' }

  - id: l15-budget
    at: { day: 30, minutes: 600 }
    phase: after
    sound: { se: [notify_news] }
    text: { ja: '午前10時。再発防止の予算を経営に諮る。監視の強化、委託先の点検、訓練のどれを、どの規模で求めるか。', en: '' }
    voices: [v15-vendor, v15-boss, v15-ok]
    choices:
      - id: l15-a-ask
        text: { ja: '予算要求と効果の測り方を示して経営に出す', en: '' }
        explain: { ja: '何にいくら使い、何がどう変わるかを示している。対策の効果を後から確かめられるため、次の予算も説明できる。', en: '' }
        minutes: 120
        category: increase
        points: 300
        fatalAlternate: 50
        refs: [meti-csm-guideline, no11-ppc-entrust-supervision]
        gauges: { flame: -12, trust: 18, stamina: -12 }
        setFlags: { budgetAsked: true, ppcFinalFiled: true }
        items:
          - { id: l15-a-content, points: 8, axis: content, refs: [meti-csm-guideline] }
          - { id: l15-a-record, points: 8, axis: record, refs: [no11-ppc-entrust-supervision] }
          - { id: l15-a-order, points: 8, axis: order, refs: [nist-sp800-61r3] }
      - id: l15-b-product
        text: { ja: '監視の製品を導入し、運用は現場に任せる', en: '' }
        explain: { ja: '製品を入れても、誰が何を見て判断するかが決まらなければ動かない。導入が目的になり、効果の確認もできない。', en: '' }
        minutes: 60
        category: maintain
        points: 20
        refs: [nist-sp800-61r3]
        gauges: { trust: 3, stamina: -3 }
        items:
          - { id: l15-b-content, points: 5, axis: content, refs: [nist-sp800-61r3] }
          - { id: l15-b-record, points: 3, axis: record, refs: [meti-csm-guideline] }
      - id: l15-c-skip
        text: { ja: '予算要求は見送り、現場の運用で対応する', en: '' }
        explain: { ja: '現場の運用だけで補うと、点検も訓練も後回しになる。同じ事故が起きたときに、また同じところで止まる。', en: '' }
        minutes: 45
        category: hurt
        points: -100
        refs: [no11-ppc-entrust-supervision]
        gauges: { flame: 8, trust: -10 }
        items:
          - { id: l15-c-content, points: -10, axis: content, refs: [no11-ppc-entrust-supervision] }
          - { id: l15-c-record, points: -8, axis: record, refs: [meti-csm-guideline] }
    lesson: { ja: '再発防止の予算は、何にいくら使い、何がどう変わるかを添えて求める。効果の測り方があれば、次の年に確かめられる。製品の導入や現場の努力だけで済ませると、対策は続かない。', en: '' }

drafts:
  status-note:
    title: { ja: '経営への上申メモ', en: '' }
    slots:
      - id: facts
        label: { ja: '分かったこと', en: '' }
        options:
          - { id: sn-f-vague, text: { ja: '委託先で障害が起きた', en: '' }, points: -8, axis: content, refs: [meti-csm-guideline], explain: { ja: '障害が起きただけでは、自社のどこが止まっているか分からない。経営は止める範囲を決められない。', en: '' } }
          - { id: sn-f-own, text: { ja: '自社の接続点と感染の有無', en: '' }, points: 10, axis: content, refs: [jpcert-handling], explain: { ja: '自社のどこがつながり、感染があるかを示すと、経営は止める範囲を判断できる。', en: '' } }
          - { id: sn-f-vendor, text: { ja: '委託先の復旧の見込みだけ', en: '' }, points: 3, axis: content, refs: [no11-bcp-continuity], explain: { ja: '復旧の見込みだけでは、自社の顧客への影響が分からない。判断の材料としては足りない。', en: '' } }
      - id: unknown
        label: { ja: '不明なこと', en: '' }
        options:
          - { id: sn-u-list, text: { ja: '分かっていない点を並べる', en: '' }, points: 10, axis: content, refs: [meti-csm-guideline], explain: { ja: '不明な点を先に示すと、経営は何を待てばよいか分かる。後から見つかった事実も、説明の延長として扱える。', en: '' } }
          - { id: sn-u-none, text: { ja: '不明な点は特に書かない', en: '' }, points: -10, axis: content, refs: [meti-csm-guideline], explain: { ja: '不明な点を書かないと、分かったこととの境目が消える。後から判明したときに、説明が二転三転したように見える。', en: '' } }
          - { id: sn-u-later, text: { ja: '後で口頭で補足するだけにする', en: '' }, points: -5, axis: record, refs: [jpcert-handling], explain: { ja: '口頭の補足は記録に残らず、会議の結論も曖昧になる。同じ説明を何度もやり直すことになる。', en: '' } }
      - id: ask
        label: { ja: '決めてほしいこと', en: '' }
        options:
          - { id: sn-k-none, text: { ja: '特に書かない', en: '' }, points: -8, axis: order, refs: [meti-csm-guideline], explain: { ja: '決めてほしいことがないと、会議は共有で終わる。判断が持ち越され、次の手が決まらない。', en: '' } }
          - { id: sn-k-wait, text: { ja: '判断は任せると書く', en: '' }, points: 2, axis: order, refs: [meti-csm-guideline], explain: { ja: '任せると書いても、何を判断するのかが分からない。経営は質問を返すことになる。', en: '' } }
          - { id: sn-k-decide, text: { ja: '止める範囲と公表の時期', en: '' }, points: 10, axis: order, refs: [meti-csm-guideline], explain: { ja: '止める範囲と公表の時期を具体的に求めると、会議で結論が出る。現場も次の手に移れる。', en: '' } }
      - id: risk
        label: { ja: '起きうるリスク', en: '' }
        options:
          - { id: sn-r-none, text: { ja: 'リスクは書かない', en: '' }, points: -8, axis: content, refs: [nist-sp800-61r3], explain: { ja: 'リスクを書かないと、判断の重みが伝わらない。対策の優先順位も付けられない。', en: '' } }
          - { id: sn-r-data, text: { ja: '配送データの流出の可能性', en: '' }, points: 10, axis: content, refs: [no11-ppc-entrust-report], explain: { ja: '預けたデータが危ない可能性を示すと、報告と通知の準備を同時に始められる。', en: '' } }
          - { id: sn-r-all, text: { ja: '考えられるリスクを全部書く', en: '' }, points: 3, axis: content, refs: [nist-sp800-61r3], explain: { ja: '全部を並べると、どれが今決めるべきことか分からない。優先順位が伝わらない。', en: '' } }
      - id: next
        label: { ja: '次の報告', en: '' }
        options:
          - { id: sn-n-time, text: { ja: '次の報告の時刻を決める', en: '' }, points: 8, axis: order, refs: [meti-csm-guideline], explain: { ja: '次の報告の時刻を決めると、経営は待つ間の判断ができる。情報の空白も生まれない。', en: '' } }
          - { id: sn-n-open, text: { ja: '分かったら連絡する', en: '' }, points: 2, axis: order, refs: [meti-csm-guideline], explain: { ja: '分かったら連絡する、では待つ側の見通しが立たない。会議が終わっても、次の接点がない。', en: '' } }
          - { id: sn-n-none, text: { ja: '次は書かない', en: '' }, points: -5, axis: order, refs: [meti-csm-guideline], explain: { ja: '次の報告を書かないと、情報が出るまで憶測が広がる。経営も現場も、同じ問いを抱えたままになる。', en: '' } }
  audit-plan:
    title: { ja: '委託先の点検計画', en: '' }
    slots:
      - id: scope
        label: { ja: '点検する範囲', en: '' }
        options:
          - { id: ap-s-all, text: { ja: '委託先の全システム', en: '' }, points: 3, axis: content, refs: [no11-ppc-entrust-supervision], explain: { ja: '全部を対象にすると、どこから手を付けるか決まらない。今回の事故に関係する範囲から始める方が実効的だ。', en: '' } }
          - { id: ap-s-contract, text: { ja: '契約を結んだシステムだけ', en: '' }, points: 2, axis: content, refs: [no11-ppc-entrust-supervision], explain: { ja: '契約の範囲だけを見ると、再委託先の環境が抜ける。データが渡っている先まで確かめる必要がある。', en: '' } }
          - { id: ap-s-data, text: { ja: 'データが渡る範囲すべて', en: '' }, points: 10, axis: content, refs: [no11-ppc-entrust-supervision], explain: { ja: 'データが渡る範囲をすべて対象にすると、再委託先の環境も点検に入る。今回の事故と同じ穴を塞げる。', en: '' } }
      - id: evidence
        label: { ja: '確かめる証跡', en: '' }
        options:
          - { id: ap-e-log, text: { ja: '権限の一覧と操作の記録', en: '' }, points: 10, axis: record, refs: [jpcert-handling], explain: { ja: '権限の一覧と操作の記録があれば、誰が何を見られたかを確かめられる。口頭の説明より検証できる。', en: '' } }
          - { id: ap-e-hear, text: { ja: '担当者への聞き取りだけ', en: '' }, points: 2, axis: record, refs: [jpcert-handling], explain: { ja: '聞き取りだけでは、記録と食い違ったときに確かめようがない。証跡として残らない。', en: '' } }
          - { id: ap-e-none, text: { ja: '証跡は求めない', en: '' }, points: -10, axis: record, refs: [no11-ppc-entrust-supervision], explain: { ja: '証跡を求めないと、対策が実行されたか分からない。同じ状態が残っていても気づけない。', en: '' } }
      - id: deadline
        label: { ja: '期限の決め方', en: '' }
        options:
          - { id: ap-d-none, text: { ja: '期限は決めない', en: '' }, points: -8, axis: time, refs: [no11-ppc-entrust-supervision], explain: { ja: '期限がないと、点検は後回しになる。忙しい時期に入ると、そのまま忘れられる。', en: '' } }
          - { id: ap-d-item, text: { ja: '項目ごとに期限を決める', en: '' }, points: 10, axis: time, refs: [no11-ppc-entrust-supervision], explain: { ja: '項目ごとに期限を決めると、進み具合を確かめられる。遅れた項目も見える化できる。', en: '' } }
          - { id: ap-d-later, text: { ja: '来期までに済ませる', en: '' }, points: 3, axis: time, refs: [no11-ppc-entrust-supervision], explain: { ja: '来期まで、では具体的な時期が分からない。優先順位も決まらず、点検が止まりやすい。', en: '' } }
      - id: report
        label: { ja: '結果の報告先', en: '' }
        options:
          - { id: ap-r-board, text: { ja: '経営会議に定期で報告する', en: '' }, points: 10, axis: order, refs: [meti-csm-guideline], explain: { ja: '経営会議に定期で報告すると、点検が止まらない。予算と体制の判断も同時にできる。', en: '' } }
          - { id: ap-r-dept, text: { ja: '情報システム部の中だけで共有する', en: '' }, points: 3, axis: order, refs: [meti-csm-guideline], explain: { ja: '部の中だけだと、予算や体制の話が進まない。点検の結果が改善につながらない。', en: '' } }
          - { id: ap-r-none, text: { ja: '報告はしない', en: '' }, points: -8, axis: order, refs: [meti-csm-guideline], explain: { ja: '報告しないと、点検をした事実も残らない。再発防止の進み具合を、誰も確かめられない。', en: '' } }
