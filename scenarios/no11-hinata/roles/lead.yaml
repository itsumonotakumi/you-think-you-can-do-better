        minutes: 45
        category: maintain
        points: 20
        refs: [no11-ppc-entrust-report]
        gauges: { trust: 3, stamina: -5 }
        items:
          - { id: l06-c-content, points: 5, axis: content, refs: [no11-ppc-entrust-report] }
