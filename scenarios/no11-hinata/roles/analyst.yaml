# No.11 ツムギマート / 担当者ロール（情報システム部 委託先管理担当）
# プレイヤーは委託先管理の担当者。一次対応、事実の聞き取り、契約と台帳、再委託、通知の材料を扱う。
# 判断ポイント15、細目は choices[].items と drafts の合計で80以上。
estimateMinutes: 30
intro: { ja: 'あなたはツムギマート情報システム部の委託先管理担当、森下 千尋。配送を委託するハコブ物流の窓口は、あなたの担当だ。午前8時、その担当者から「出荷システムが止まった」と電話が入った。何を聞き、何を確かめ、誰に渡すかで、あとの対応が決まる。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-analyst-ppc-prelim
    ref: ppc-report-prelim
    label: { ja: '個人情報保護委員会への速報の材料', en: '' }
    points: -150
    doneFlag: ppcPrelimFiled
  - id: dl-analyst-ppc-final
    ref: ppc-report-final-malicious
    label: { ja: '個人情報保護委員会への確報の材料', en: '' }
    points: -120
    doneFlag: ppcFinalFiled
events:
  - id: ev-analyst-ransom
    at: { day: 0, minutes: 555 }
    voices: [v-ev-ransom]
    gauges: { flame: 5 }
    sound: { se: [mail_arrive] }
    caption: { ja: '物流会社が、ランサムウェアの被害を認めた。', en: '' }
  - id: ev-analyst-news
    at: { day: 0, minutes: 1200 }
    voices: [v-ev-news]
    gauges: { flame: 8 }
    sound: { se: [notify_news] }
    caption: { ja: '業界紙が、物流会社の障害と通販各社の停止を報じた。', en: '' }
  - id: ev-analyst-inquiry
    at: { day: 1, minutes: 720 }
    voices: [v-ev-inquiry]
    gauges: { flame: 5 }
    sound: { se: [phone_ring] }
    caption: { ja: '同じ物流を使う他社から、状況を確認したいと連絡が来た。', en: '' }
  - id: ev-analyst-site
    at: { day: 2, minutes: 540 }
    voices: [v-ev-site]
    gauges: { flame: 5 }
    caption: { ja: '物流の現場では、古い端末がまだ倉庫に残っていた。', en: '' }
  - id: ev-analyst-publish
    at: { day: 14, minutes: 540 }
    voices: [v-ev-publish]
    gauges: { flame: 10 }
    sound: { se: [notify_news] }
    caption: { ja: '攻撃者が、配送データの一部を公開した。', en: '' }
points:
  - id: a01-call
    at: { day: 0, minutes: 480 }
    phase: detect
    sound: { se: [phone_ring] }
    text: { ja: '午前8時。ハコブ物流の担当者から電話。「出荷システムが止まりました」。まず、何を聞き取るか。', en: '' }
    voices: [v01-vendor, v01-coward, v01-ok]
    notable:
      - { id: note-analyst-call, text: { ja: '午前8時、委託先の担当者から出荷停止の連絡。原因はまだ不明。', en: '' } }
    choices:
      - id: a01-a-when
        text: { ja: '復旧の見込みだけを聞き、詳しくは後で聞く', en: '' }
        explain: { ja: '復旧の見込みだけでは、何が止まり、どのデータが危ないか分からない。最初の聞き取りが薄いと、後で同じ確認をやり直す。', en: '' }
        minutes: 30
        category: hurt
        points: -110
        refs: [jpcert-handling]
        gauges: { flame: 8, trust: -8, damage: 5 }
        items:
          - { id: a01-a-record, points: -10, axis: record, refs: [jpcert-handling] }
          - { id: a01-a-time, points: -8, axis: time, refs: [jpcert-handling] }
      - id: a01-b-form
        text: { ja: '決まった様式で、時刻、範囲、連絡体制を聞き取る', en: '' }
        explain: { ja: 'いつ、どこまで、誰が窓口かを同じ形で記録している。後の調査でも報告でも、同じ事実を使える。', en: '' }
        minutes: 45
        category: recover
        points: 120
        refs: [jpcert-handling, no11-ppc-entrust-report]
        gauges: { damage: -5, flame: -5, trust: 10, stamina: -8 }
        setFlags: { firstFacts: true }
        items:
          - { id: a01-b-time, points: 8, axis: time, refs: [jpcert-handling] }
          - { id: a01-b-record, points: 10, axis: record, refs: [jpcert-handling] }
          - { id: a01-b-order, points: 8, axis: order, refs: [no11-ppc-entrust-report] }
      - id: a01-c-wait
        text: { ja: '相手の担当者に任せ、向こうから連絡が来るのを待つ', en: '' }
        explain: { ja: '待つ間に、自社が預けたデータの状態は分からないままになる。先方も忙しく、連絡は後回しになる。', en: '' }
        minutes: 30
        category: maintain
        points: 20
        refs: [jpcert-handling]
        gauges: { trust: 0, stamina: 3 }
        coward: true
        items:
          - { id: a01-c-record, points: -5, axis: record, refs: [jpcert-handling] }
          - { id: a01-c-time, points: -5, axis: time, refs: [jpcert-handling] }
    lesson: { ja: '委託先からの第一報は、決まった様式で聞く。いつ、どこまで止まり、誰が窓口かを記録すれば、後の調査と報告で同じ事実を使える。復旧の見込みだけを聞くと、確認をやり直すことになる。', en: '' }

  - id: a02-contract
    at: { day: 0, minutes: 600 }
    phase: contain
    sound: { se: [typing] }
    text: { ja: '午前10時。委託契約書と、預けているデータの台帳を確認する。何を渡しているかが分からないと、報告もできない。', en: '' }
    voices: [v02-law, v02-vendor, v02-ok]
    notable:
      - { id: note-analyst-contract, text: { ja: '委託しているデータは、氏名、住所、電話、注文商品。契約に再委託の条項がある。', en: '' } }
    choices:
      - id: a02-a-join
        text: { ja: '契約書とデータ項目の台帳を突き合わせて確認する', en: '' }
        explain: { ja: '契約の範囲と、実際に渡しているデータを照らし合わせている。報告に必要な項目と、再委託の有無も同時に分かる。', en: '' }
        minutes: 60
        category: recover
        points: 120
        refs: [no11-ppc-entrust-supervision, no11-ppc-entrust-report]
        gauges: { trust: 10, stamina: -8 }
        setFlags: { dataScopeKnown: true }
        items:
          - { id: a02-a-content, points: 8, axis: content, refs: [no11-ppc-entrust-supervision] }
          - { id: a02-a-record, points: 8, axis: record, refs: [no11-ppc-entrust-report] }
          - { id: a02-a-order, points: 5, axis: order, refs: [no11-ppc-entrust-supervision] }
      - id: a02-b-legal
        text: { ja: '契約は法務に任せ、自分はデータを確認しない', en: '' }
        explain: { ja: '契約の解釈は法務に任せられても、実際に渡したデータは担当者しか知らない。報告の材料が揃わない。', en: '' }
        minutes: 30
        category: maintain
        points: 20
        refs: [no11-ppc-entrust-supervision]
        gauges: { trust: 3, stamina: 0 }
        items:
          - { id: a02-b-record, points: 5, axis: record, refs: [no11-ppc-entrust-supervision] }
          - { id: a02-b-content, points: -5, axis: content, refs: [no11-ppc-entrust-report] }
      - id: a02-c-memory
        text: { ja: '記憶でデータ項目を答え、後で台帳を確認する', en: '' }
        explain: { ja: '記憶で答えた項目が違えば、報告の範囲もずれる。後で訂正すると、初報の信頼を落とすことになる。', en: '' }
        minutes: 30
        category: hurt
        points: -100
        refs: [no11-ppc-entrust-report]
        gauges: { flame: 8, trust: -10 }
        items:
          - { id: a02-c-content, points: -10, axis: content, refs: [no11-ppc-entrust-report] }
          - { id: a02-c-record, points: -8, axis: record, refs: [no11-ppc-entrust-supervision] }
    lesson: { ja: '委託先の事故では、契約書とデータの台帳を突き合わせる。何を、いつから渡しているかが分かれば、報告の範囲も再委託の確認も進む。記憶で答えると、あとで報告の訂正が必要になる。', en: '' }

  - id: a03-questions
    at: { day: 0, minutes: 780 }
    phase: contain
    sound: { se: [mail_arrive] }
    text: { ja: '午後1時。委託先に何を聞くか。電話で何度も聞くと、向こうの担当も疲れ、答えが抜けていく。', en: '' }
    voices: [v03-vendor, v03-past, v03-ok]
    choices:
      - id: a03-a-phone
        text: { ja: '電話で何度も聞き、口頭で内容を確かめる', en: '' }
        explain: { ja: '口頭のやり取りは速いが、聞いた内容が残らない。担当が変わると、同じ質問を最初からやり直すことになる。', en: '' }
        minutes: 60
        category: maintain
        points: 20
        refs: [jpcert-handling]
        gauges: { trust: 3, stamina: -8 }
        items:
          - { id: a03-a-record, points: -5, axis: record, refs: [jpcert-handling] }
          - { id: a03-a-order, points: 3, axis: order, refs: [meti-csm-guideline] }
      - id: a03-b-wait
        text: { ja: '先方の発表を待ち、その内容で確認する', en: '' }
        explain: { ja: '発表を待つ間に、こちらが必要な情報が揃わない。発表は世間向けで、自社が預けたデータの話とは限らない。', en: '' }
        minutes: 30
        category: hurt
        points: -100
        refs: [no11-ppc-entrust-report]
        gauges: { flame: 8, trust: -8 }
        coward: true
        items:
          - { id: a03-b-time, points: -10, axis: time, refs: [no11-ppc-entrust-report] }
          - { id: a03-b-content, points: -8, axis: content, refs: [no11-ppc-entrust-report] }
      - id: a03-c-doc
        text: { ja: '質問項目を整理して文書で送り、期限を決める', en: '' }
        explain: { ja: '聞くことを整理し、期限を決めて文書で送っている。回答が残り、社内の共有も報告の材料も同じ形になる。', en: '' }
        minutes: 90
        category: recover
        points: 120
        refs: [jpcert-handling, no11-ppc-entrust-supervision]
        gauges: { trust: 10, stamina: -10 }
        setFlags: { questionsSent: true }
        detail: vendor-questions
        items:
          - { id: a03-c-order, points: 8, axis: order, refs: [jpcert-handling] }
          - { id: a03-c-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: a03-c-content, points: 8, axis: content, refs: [no11-ppc-entrust-supervision] }
          - { id: a03-c-time, points: 5, axis: time, refs: [no11-ppc-entrust-report] }
    lesson: { ja: '委託先への確認は、質問を整理して文書で送り、期限を決める。回答が残れば、社内の共有も報告の材料も同じ形になる。電話と口頭だけでは、担当が変わったときに最初からやり直しになる。', en: '' }

  - id: a04-revendor
    at: { day: 0, minutes: 1020 }
    phase: organize
    sound: { se: [notify_chat] }
    text: { ja: '午後5時。契約には再委託の条項がある。実際に、どこまでデータが渡っているかを確かめる必要がある。', en: '' }
    voices: [v04-vendor, v04-law, v04-ok]
    choices:
      - id: a04-a-direct
        text: { ja: '直接契約している相手の範囲だけを確認する', en: '' }
        explain: { ja: '直接の契約相手だけを見ると、その先に渡ったデータが見えない。事故が起きた場所と、責任の範囲がずれる。', en: '' }
        minutes: 45
        category: maintain
        points: 20
        refs: [no11-ppc-entrust-supervision]
        gauges: { trust: 3, stamina: -3 }
        items:
          - { id: a04-a-content, points: 5, axis: content, refs: [no11-ppc-entrust-supervision] }
          - { id: a04-a-record, points: 3, axis: record, refs: [meti-csm-guideline] }
      - id: a04-b-flow
        text: { ja: '再委託先の一覧と場所、データの流れを確認する', en: '' }
        explain: { ja: 'データがどの会社の、どの場所を通るかを把握している。漏えいの範囲を考える前提が、ここで揃う。', en: '' }
        minutes: 120
        category: recover
        points: 120
        refs: [no11-ppc-entrust-supervision, no11-ppc-entrust-report]
        gauges: { trust: 12, stamina: -10 }
        setFlags: { reVendorChecked: true }
        items:
          - { id: a04-b-content, points: 8, axis: content, refs: [no11-ppc-entrust-supervision] }
          - { id: a04-b-order, points: 8, axis: order, refs: [meti-csm-guideline] }
          - { id: a04-b-record, points: 8, axis: record, refs: [no11-ppc-entrust-report] }
      - id: a04-c-ask
        text: { ja: '再委託は契約に書いていないので、確認しない', en: '' }
        explain: { ja: '条項があるのに確認しないと、データの行き先が分からないままになる。漏えいの範囲も、責任の範囲も説明できない。', en: '' }
        minutes: 30
        category: hurt
        points: -110
        refs: [no11-ppc-entrust-supervision]
        gauges: { flame: 8, trust: -10, damage: 5 }
        coward: true
        items:
          - { id: a04-c-content, points: -12, axis: content, refs: [no11-ppc-entrust-supervision] }
          - { id: a04-c-order, points: -6, axis: order, refs: [meti-csm-guideline] }
    lesson: { ja: '再委託は、一覧と場所、データの流れまで確認する。どこを通って誰が触れるかが分かれば、漏えいの範囲も責任の範囲も説明できる。直接の契約相手だけを見ると、その先が見えない。', en: '' }

  - id: a05-other
    at: { day: 1, minutes: 540 }
    phase: organize
    sound: { se: [notify_chat] }
    text: { ja: '午前9時。社内には、同じ物流会社を使う業務がほかにもある。返品の受け付けと、店舗への補充だ。どう点検するか。', en: '' }
    voices: [v05-past, v05-boss, v05-ok]
    choices:
      - id: a05-a-same
        text: { ja: '同じ物流を使う業務と、同じ型の委託先を洗い出す', en: '' }
        explain: { ja: '同じ委託先を使う業務と、似た契約の委託先をまとめて確認している。同じ穴が他に残っていないか、先に見られる。', en: '' }
        minutes: 120
        category: recover
        points: 110
        refs: [no11-ppc-entrust-supervision, meti-csm-guideline]
        gauges: { trust: 12, stamina: -10 }
        setFlags: { otherBizChecked: true }
        items:
          - { id: a05-a-order, points: 8, axis: order, refs: [no11-ppc-entrust-supervision] }
          - { id: a05-a-content, points: 8, axis: content, refs: [meti-csm-guideline] }
          - { id: a05-a-record, points: 5, axis: record, refs: [jpcert-handling] }
      - id: a05-b-only
        text: { ja: '今回は物流の通販業務だけを見直す', en: '' }
        explain: { ja: '通販だけを直しても、返品や補充の経路は同じまま残る。次は別の業務から同じ事故が起きる。', en: '' }
        minutes: 45
        category: hurt
        points: -90
        refs: [no11-ppc-entrust-supervision]
        gauges: { flame: 8, trust: -8 }
        items:
          - { id: a05-b-content, points: -10, axis: content, refs: [no11-ppc-entrust-supervision] }
          - { id: a05-b-order, points: -6, axis: order, refs: [meti-csm-guideline] }
      - id: a05-c-all
        text: { ja: 'すべての委託先を、同じ深さで一斉に点検する', en: '' }
        explain: { ja: '全部を同じ深さで見ようとすると、手が回らずにどれも終わらない。影響の大きさで順番を決める必要がある。', en: '' }
        minutes: 180
        category: maintain
        points: 20
        refs: [meti-csm-guideline]
        gauges: { trust: 3, stamina: -15 }
        items:
          - { id: a05-c-record, points: 5, axis: record, refs: [meti-csm-guideline] }
          - { id: a05-c-time, points: -5, axis: time, refs: [meti-csm-guideline] }
    lesson: { ja: '同じ委託先を使う業務は、まとめて洗い出す。すべてを同じ深さで見ようとすると終わらないので、渡しているデータの大きさで順番を決める。通販だけを直すと、返品や補充から同じ事故が起きる。', en: '' }

  - id: a06-ppc
    at: { day: 1, minutes: 900 }
