    text: { ja: '午前10時。今回の記録を、次の担当者が使える形にする。委託先の管理を、属人化させない工夫がいる。', en: '' }
    voices: [v15-boss, v15-coward, v15-ok]
    choices:
      - id: a15-a-store
        text: { ja: '今回の記録をファイルにまとめて保管する', en: '' }
        explain: { ja: '記録は残るが、次の点検で何を見るかは決まっていない。担当が変わると、同じ確認を一からやり直す。', en: '' }
        minutes: 60
        category: maintain
        points: 20
        refs: [meti-csm-guideline]
        gauges: { trust: 3, stamina: -3 }
        items:
          - { id: a15-a-record, points: 5, axis: record, refs: [meti-csm-guideline] }
          - { id: a15-a-content, points: 3, axis: content, refs: [no11-ppc-entrust-supervision] }
      - id: a15-b-head
        text: { ja: '担当者だけが分かる形で引き継ぐ', en: '' }
        explain: { ja: '担当者だけが知っていると、異動や退職で管理が止まる。点検の時期も、確かめる項目も分からなくなる。', en: '' }
        minutes: 30
        category: hurt
        points: -90
        refs: [meti-csm-guideline]
        gauges: { flame: 8, trust: -8 }
        items:
          - { id: a15-b-record, points: -8, axis: record, refs: [meti-csm-guideline] }
          - { id: a15-b-content, points: -6, axis: content, refs: [no11-ppc-entrust-supervision] }
      - id: a15-c-ledger
        text: { ja: '委託先台帳を整備し、年次点検の予定を決める', en: '' }
        explain: { ja: '委託先とデータの範囲を台帳にまとめ、点検の時期まで決めている。担当が変わっても、同じ手順で確かめられる。', en: '' }
        minutes: 150
        category: increase
        points: 300
        fatalAlternate: 50
        refs: [meti-csm-guideline, no11-ppc-entrust-supervision]
        gauges: { flame: -12, trust: 18, stamina: -12 }
        setFlags: { ledgerBuilt: true, ppcFinalFiled: true }
        detail: annual-audit
        items:
          - { id: a15-c-content, points: 8, axis: content, refs: [no11-ppc-entrust-supervision] }
          - { id: a15-c-record, points: 8, axis: record, refs: [meti-csm-guideline] }
          - { id: a15-c-order, points: 8, axis: order, refs: [jpcert-handling] }
    lesson: { ja: '委託先の管理は、台帳と点検の予定まで決めて残す。担当が変わっても同じ手順で確かめられる形にすれば、管理が属人化しない。記録を保管するだけ、担当者だけが知る形では、次の事故で間に合わない。', en: '' }

drafts:
  vendor-questions:
    title: { ja: '委託先への質問状', en: '' }
    slots:
      - id: facts
        label: { ja: '起きたこと', en: '' }
        options:
          - { id: vq-f-cause, text: { ja: '原因だけを聞く', en: '' }, points: 2, axis: content, refs: [jpcert-handling], explain: { ja: '原因だけでは、いつから何が起きたか分からない。範囲の特定にも、報告の材料にも足りない。', en: '' } }
          - { id: vq-f-when, text: { ja: '発生と検知の時刻', en: '' }, points: 10, axis: time, refs: [jpcert-handling], explain: { ja: '発生と検知の時刻を聞くと、対応の遅れと範囲が分かる。こちらの記録とも突き合わせられる。', en: '' } }
          - { id: vq-f-none, text: { ja: '起きたことは聞かない', en: '' }, points: -8, axis: content, refs: [jpcert-handling], explain: { ja: '起きたことを聞かないと、質問の前提が揃わない。回答が届いても、何を確かめるのか決まらない。', en: '' } }
      - id: data
        label: { ja: 'データの範囲', en: '' }
        options:
          - { id: vq-d-all, text: { ja: '預けたデータの項目と期間', en: '' }, points: 10, axis: content, refs: [no11-ppc-entrust-report], explain: { ja: '預けた項目と期間を聞くと、漏えいの範囲を自社の台帳と照らせる。報告の対象も決められる。', en: '' } }
          - { id: vq-d-count, text: { ja: '影響した件数だけを聞く', en: '' }, points: 2, axis: content, refs: [no11-ppc-entrust-report], explain: { ja: '件数だけでは、どの項目が漏れたか分からない。本人に何を伝えるかも決まらない。', en: '' } }
          - { id: vq-d-none, text: { ja: 'データの話は一切しない', en: '' }, points: -10, axis: content, refs: [no11-ppc-entrust-report], explain: { ja: 'データの話をしないと、漏えいの有無を確かめられない。委託元としての報告義務も果たせない。', en: '' } }
      - id: containment
        label: { ja: '止めたこと', en: '' }
        options:
          - { id: vq-c-plan, text: { ja: '復旧の予定だけ', en: '' }, points: 2, axis: order, refs: [nist-sp800-61r3], explain: { ja: '復旧の予定だけでは、感染が止まっているか分からない。再開の判断の材料にならない。', en: '' } }
          - { id: vq-c-none, text: { ja: '止めたことは聞かない', en: '' }, points: -8, axis: order, refs: [nist-sp800-61r3], explain: { ja: '止めたことを聞かないと、広がりが続いている可能性を否定できない。再開の前提が揃わない。', en: '' } }
          - { id: vq-c-stop, text: { ja: '遮断した経路と復旧の手順', en: '' }, points: 10, axis: order, refs: [nist-sp800-61r3], explain: { ja: '遮断した経路と復旧の手順を聞くと、感染が広がる余地が残っていないか確かめられる。', en: '' } }
      - id: evidence
        label: { ja: '証拠の保全', en: '' }
        options:
          - { id: vq-e-log, text: { ja: 'ログと機器の保全の状況', en: '' }, points: 10, axis: record, refs: [jpcert-handling], explain: { ja: 'ログと機器の保全を確かめると、後から原因と範囲を検証できる。初期化の前に手を打てる。', en: '' } }
          - { id: vq-e-none, text: { ja: '保全は求めない', en: '' }, points: -10, axis: record, refs: [jpcert-handling], explain: { ja: '保全を求めないと、記録が消えて原因が分からなくなる。同じ手口への備えも作れない。', en: '' } }
          - { id: vq-e-word, text: { ja: '口頭で残すよう頼む', en: '' }, points: 2, axis: record, refs: [jpcert-handling], explain: { ja: '口頭で頼むだけでは、保全の範囲も期限も伝わらない。後で足りない記録に気づく。', en: '' } }
      - id: deadline
        label: { ja: '回答の期限', en: '' }
        options:
          - { id: vq-t-later, text: { ja: '期限は決めない', en: '' }, points: -8, axis: time, refs: [no11-ppc-entrust-report], explain: { ja: '期限がないと、回答は後回しになる。速報の期限に間に合わなくなる。', en: '' } }
          - { id: vq-t-today, text: { ja: '今日中と期限を決める', en: '' }, points: 10, axis: time, refs: [no11-ppc-entrust-report], explain: { ja: '今日中と期限を決めると、回答が揃う時刻が見える。速報の準備も逆算できる。', en: '' } }
          - { id: vq-t-week, text: { ja: '一週間以内とする', en: '' }, points: 2, axis: time, refs: [no11-ppc-entrust-report], explain: { ja: '一週間では、速報の期限に間に合わない。回答を待つ間に、報告の判断が遅れる。', en: '' } }
      - id: contact
        label: { ja: '窓口の一本化', en: '' }
        options:
          - { id: vq-k-one, text: { ja: '窓口を一人に決める', en: '' }, points: 8, axis: order, refs: [meti-csm-guideline], explain: { ja: '窓口を一人に決めると、質問と回答の行き違いが減る。記録も一か所に集まる。', en: '' } }
          - { id: vq-k-many, text: { ja: '担当者ごとに聞く', en: '' }, points: 2, axis: order, refs: [meti-csm-guideline], explain: { ja: '担当者ごとに聞くと、回答がばらつき、同じ質問を何度もすることになる。', en: '' } }
          - { id: vq-k-none, text: { ja: '窓口は決めない', en: '' }, points: -5, axis: order, refs: [meti-csm-guideline], explain: { ja: '窓口を決めないと、連絡の経路が分からない。急ぎの確認ほど、たらい回しになる。', en: '' } }
  annual-audit:
    title: { ja: '年次点検の計画', en: '' }
    slots:
      - id: scope
        label: { ja: '点検の対象', en: '' }
        options:
          - { id: aa-s-all, text: { ja: 'すべての委託先', en: '' }, points: 3, axis: content, refs: [no11-ppc-entrust-supervision], explain: { ja: 'すべてを対象にすると、数が多くて毎年終わらない。データの大きさで順番を決める必要がある。', en: '' } }
          - { id: aa-s-data, text: { ja: '個人データを預ける委託先', en: '' }, points: 10, axis: content, refs: [no11-ppc-entrust-supervision], explain: { ja: '個人データを預ける委託先を対象にすると、点検の数が絞れる。被害の大きいところから確かめられる。', en: '' } }
          - { id: aa-s-contract, text: { ja: '契約の更新がある委託先', en: '' }, points: 2, axis: content, refs: [no11-ppc-entrust-supervision], explain: { ja: '契約の更新に合わせると、間隔がばらつく。長く更新しない委託先が、点検から漏れる。', en: '' } }
      - id: items
        label: { ja: '確かめる項目', en: '' }
        options:
          - { id: aa-i-permission, text: { ja: '権限、ログ、再委託の範囲', en: '' }, points: 10, axis: content, refs: [jpcert-handling], explain: { ja: '権限、ログ、再委託の範囲を毎回同じ形で確かめると、変化に気づける。比較もできる。', en: '' } }
          - { id: aa-i-hearing, text: { ja: '担当者への聞き取りだけ', en: '' }, points: 2, axis: record, refs: [jpcert-handling], explain: { ja: '聞き取りだけでは、記録と食い違ったときに確かめられない。点検の証跡が残らない。', en: '' } }
          - { id: aa-i-none, text: { ja: '項目は決めない', en: '' }, points: -10, axis: content, refs: [no11-ppc-entrust-supervision], explain: { ja: '項目を決めないと、点検のたびに何を見るかが変わる。前回との比較ができず、改善も見えない。', en: '' } }
      - id: frequency
        label: { ja: '頻度', en: '' }
        options:
          - { id: aa-f-event, text: { ja: '事故が起きたときだけ行う', en: '' }, points: 2, axis: time, refs: [no11-ppc-entrust-supervision], explain: { ja: '事故のときだけでは、起きるまで弱点に気づけない。点検が後追いになる。', en: '' } }
          - { id: aa-f-none, text: { ja: '頻度は決めない', en: '' }, points: -8, axis: time, refs: [no11-ppc-entrust-supervision], explain: { ja: '頻度を決めないと、点検は後回しになる。忙しい年は、一度も行われないことになる。', en: '' } }
          - { id: aa-f-year, text: { ja: '年に一度、決まった月に行う', en: '' }, points: 10, axis: time, refs: [no11-ppc-entrust-supervision], explain: { ja: '年に一度、月を決めて行うと、予定として定着する。予算も人の手配も先に決められる。', en: '' } }
      - id: report
        label: { ja: '結果の使い方', en: '' }
        options:
          - { id: aa-r-none, text: { ja: '結果は記録しない', en: '' }, points: -10, axis: record, refs: [meti-csm-guideline], explain: { ja: '結果を記録しないと、翌年に改善したかを比べられない。同じ指摘を毎年繰り返すことになる。', en: '' } }
          - { id: aa-r-fix, text: { ja: '指摘と改善の期限を記録する', en: '' }, points: 10, axis: record, refs: [meti-csm-guideline], explain: { ja: '指摘と改善の期限を記録すると、翌年に確かめられる。点検が改善につながる。', en: '' } }
          - { id: aa-r-file, text: { ja: '結果をファイルにしまう', en: '' }, points: 2, axis: record, refs: [meti-csm-guideline], explain: { ja: 'ファイルにしまうだけでは、指摘が放置される。改善の期限も担当も分からない。', en: '' } }
