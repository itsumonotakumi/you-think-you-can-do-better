    choices:
      - id: a06-a-wait
        text: { ja: '件数が確定するまで待ち、その後に材料を出す', en: '' }
        explain: { ja: '確定を待つ間に速報の期限が過ぎるおそれがある。分かった範囲で出して訂正する方が、報告漏れより信頼を保てる。', en: '' }
        minutes: 120
        category: hurt
        points: -150
        refs: [ppc-report-prelim]
        gauges: { flame: 15, trust: -10, damage: 10 }
        coward: true
        setFlags: { delayedReport: true }
