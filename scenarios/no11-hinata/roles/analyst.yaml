          - { afterPhases: 1, points: -40, gauges: { flame: 10 }, reason: { ja: '報道が先に「報告なし」と報じた。', en: '' } }
        items:
          - { id: a06-a-time, points: -10, axis: time, refs: [ppc-report-prelim] }
          - { id: a06-a-record, points: -8, axis: record, refs: [ppc-report-prelim] }
      - id: a06-b-scope
        text: { ja: '分かった範囲で件数と項目を出し、速報につなぐ', en: '' }
        explain: { ja: '分かった範囲を明示して速報につないでいる。件数の確定を待たずに、報告の期限と範囲を両立させている。', en: '' }
        minutes: 90
        category: recover
        points: 120
        refs: [ppc-report-prelim, no11-ppc-entrust-report]
        gauges: { trust: 12, stamina: -10 }
        setFlags: { ppcPrelimFiled: true }
        items:
          - { id: a06-b-time, points: 8, axis: time, refs: [ppc-report-prelim] }
          - { id: a06-b-content, points: 8, axis: content, refs: [no11-ppc-entrust-report] }
          - { id: a06-b-record, points: 8, axis: record, refs: [no11-ppc-entrust-supervision] }
      - id: a06-c-copy
        text: { ja: '物流の集計をそのまま使って材料を作る', en: '' }
        explain: { ja: '委託先の集計は、自社が預けた範囲と一致するとは限らない。そのまま使うと、報告の範囲がずれる。', en: '' }
        minutes: 45
        category: maintain
        points: 20
        refs: [no11-ppc-entrust-report]
        gauges: { trust: 3, stamina: -5 }
        items:
          - { id: a06-c-content, points: 5, axis: content, refs: [no11-ppc-entrust-report] }
          - { id: a06-c-record, points: -3, axis: record, refs: [no11-ppc-entrust-supervision] }
    lesson: { ja: '速報は、分かった範囲を明示して出す。件数の確定を待つと期限が過ぎ、委託先の集計をそのまま使うと範囲がずれる。自社が何を預けたかは、台帳で説明できる。', en: '' }

