    at: { day: 2, minutes: 600 }
    phase: investigate
    sound: { se: [notify_chat] }
    text: { ja: '午前10時。物流の現場を見に行けることになった。遠いが、書面では分からないことがある。', en: '' }
    voices: [v07-vendor, v07-boss, v07-ok]
    choices:
      - id: a07-a-doc
        text: { ja: '書面の回答で足りるので、訪問はしない', en: '' }
        explain: { ja: '書面では、古い端末が残っているか、誰が触れるかまでは見えない。実際の運用と回答の差に気づけない。', en: '' }
        minutes: 45
        category: maintain
        points: 20
        refs: [no11-ppc-entrust-supervision]
        gauges: { trust: 3, stamina: 3 }
        items:
          - { id: a07-a-record, points: 5, axis: record, refs: [no11-ppc-entrust-supervision] }
