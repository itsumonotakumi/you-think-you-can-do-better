# No.11 ツムギマート（生活雑貨・衣料・食品の小売チェーン）
# 元事件は「構造」だけを参考にしたフィクション。会社名・人物名・数字はすべて架空。
id: no11-hinata
version: '1.0.0'
status: latest
published: '2026-11-13'
sourcePeriod: { ja: '2020年代の物流委託先へのランサム攻撃の構造を参考にしたフィクション', en: '' }
difficulty: 3
languages: [ja]
referencesVersion: '2026-11-13'
legalPack: jp
title: { ja: '店は開いている。荷物が届かない', en: '' }
tagline: { ja: '配送を委託する物流会社がランサムウェアの被害に遭った。自社は無事。それでも通販は止まり、顧客の住所が危ない。', en: '' }
company:
  name: { ja: 'ツムギマート', en: '' }
  industry: { ja: '生活雑貨・衣料・食品の小売チェーン', en: '' }
  size: { ja: '国内120店舗、従業員3,800名（パート・アルバイト含む）', en: '' }
  people:
    - id: ceo
      name: { ja: '柏木 宗一郎', en: '' }
      title: { ja: '代表取締役社長', en: '' }
    - id: ec
      name: { ja: '小柳 真澄', en: '' }
      title: { ja: 'ツムギ通販株式会社 代表取締役社長', en: '' }
    - id: ciso
      name: { ja: '瀬川 理恵', en: '' }
      title: { ja: '情報システム部長', en: '' }
    - id: vendor-mgr
      name: { ja: '森下 千尋', en: '' }
      title: { ja: '情報システム部 委託先管理担当', en: '' }
    - id: logistics
      name: { ja: '勝田 徹', en: '' }
      title: { ja: 'ハコブ物流 管理本部長', en: '' }
    - id: store
      name: { ja: '藤堂 康平', en: '' }
      title: { ja: '店舗運営本部長', en: '' }
    - id: pr
      name: { ja: '朝比奈 遥', en: '' }
      title: { ja: '広報部長', en: '' }
start: { day: 0, minutes: 480 }
initialGauges: { damage: 15, flame: 0, trust: 70, stamina: 100 }
audio:
  bgmDefault: tension_low
  bgmByPhase:
    detect: tension_low
    contain: tension_mid
    organize: tension_mid
    investigate: tension_mid
    notify: tension_high
    recover: calm
    after: calm
press:
  questions:
    - id: q-stop
      seconds: 30
      timeoutPoints: -30
      text: { ja: 'なぜ通販を止めたのですか。止める必要はあったのですか。', en: '' }
      answers:
        - { id: a-stop-vendor, text: { ja: '物流会社のシステム障害です。', en: '' }, points: -80 }
        - { id: a-stop-admit, text: { ja: '委託先がランサムウェアの被害に遭い、出荷の安全を確認できなかったためです。', en: '' }, points: 30 }
        - { id: a-stop-note, text: { ja: '停止した時刻と再開の条件を整理し、顧客への案内と代替の手段を用意して再開を判断します。', en: '' }, points: 80, requiresNote: note-outage }
    - id: q-data
      seconds: 35
      timeoutPoints: -30
      text: { ja: '顧客の配送情報は漏れたのですか。', en: '' }
      answers:
        - { id: a-data-none, text: { ja: '漏れていません。', en: '' }, points: -100 }
        - { id: a-data-maybe, text: { ja: '配送情報が流出した可能性があり、範囲を調査しています。', en: '' }, points: 30 }
        - { id: a-data-note, text: { ja: '対象の可能性がある方に通知し、相談窓口と二次被害の注意を案内しています。', en: '' }, points: 80, requiresNote: note-leak }
    - id: q-vendor
      seconds: 30
      timeoutPoints: -30
      text: { ja: '委託先の監督はどうしていたのですか。', en: '' }
      answers:
        - { id: a-vendor-blame, text: { ja: '委託先の問題です。当社に落ち度はありません。', en: '' }, points: -100 }
        - { id: a-vendor-admit, text: { ja: '権限管理と定期点検の確認が不十分でした。', en: '' }, points: 30 }
        - { id: a-vendor-note, text: { ja: '契約の監督条項を見直し、委託先の権限とログの点検をやり直しています。', en: '' }, points: 80, requiresNote: note-audit }
  extraQuestions:
    - when: { flags: { paidRansom: false } }
      question:
        id: q-ransom
        seconds: 20
        timeoutPoints: -30
        text: { ja: '身代金は支払ったのですか。', en: '' }
        answers:
          - { id: a-ransom-paid, text: { ja: '支払いました。', en: '' }, points: -100 }
          - { id: a-ransom-nocomment, text: { ja: '答えられません。', en: '' }, points: -30 }
          - { id: a-ransom-refuse, text: { ja: '支払っていません。警察に相談し、犯罪組織への資金提供を避けました。', en: '' }, points: 80 }
    - when: { flags: { paidRansom: true } }
      question:
        id: q-ransom-paid
        seconds: 20
        timeoutPoints: -30
        text: { ja: '身代金は支払ったのですか。', en: '' }
        answers:
          - { id: a-ransom-paid-admit, text: { ja: '支払いました。判断の経緯と、警察への相談状況を説明します。', en: '' }, points: 30 }
          - { id: a-ransom-paid-deny, text: { ja: '支払っていません。', en: '' }, points: -200 }
          - { id: a-ransom-paid-nocomment, text: { ja: '答えられません。', en: '' }, points: -30 }
    - when: { flags: { hidAttack: true } }
      question:
        id: q-hidden
        seconds: 25
        timeoutPoints: -30
        text: { ja: '当初「システム障害」と説明したのはなぜですか。', en: '' }
        answers:
          - { id: a-hidden-avoid, text: { ja: '混乱を避けるためです。', en: '' }, points: -100 }
          - { id: a-hidden-late, text: { ja: '攻撃と分かった時点で公表が遅れました。', en: '' }, points: 30 }
          - { id: a-hidden-correct, text: { ja: '最初の説明は不正確でした。経緯を公表します。', en: '' }, points: 80 }
    - when: { flags: { continuedSales: true } }
      question:
        id: q-orders
        seconds: 25
        timeoutPoints: -30
        text: { ja: '止めずに注文を受け続けたのはなぜですか。', en: '' }
        answers:
          - { id: a-orders-demand, text: { ja: '顧客が待っているからです。', en: '' }, points: -100 }
          - { id: a-orders-late, text: { ja: '出荷の見込みを過信していました。', en: '' }, points: 30 }
          - { id: a-orders-fix, text: { ja: '受注を止める判断が遅れました。注文の取り消しと返金を進めます。', en: '' }, points: 80 }
headlines:
  S: { ja: '止めた通販、再開の条件を先に示す　小売チェーンの対応に学ぶ声', en: '' }
  A: { ja: '配送停止から三週間、通販が段階再開　委託先の監督見直しへ', en: '' }
  B: { ja: '通販は戻ったが、定期会員の一部が離れる　委託先管理が課題に', en: '' }
  C: { ja: '初動の説明に批判　小売チェーンの社長が辞任', en: '' }
  D: { ja: '配送情報の管理で行政指導　通販縮小が続く', en: '' }
endings:
  S:
    bgm: ending_s
    text: { ja: '段階再開から三か月。通販の注文は事件前を上回り、店舗の客足も戻った。委託先の監督を見直した契約は業界団体の手本として共有された。朝礼で店舗運営本部長が「お客様に何度も説明したことが、一番役に立った」と言った。被害の責任は攻撃者にある。問われたのは、被害を広げないための対応だった。', en: '' }
  A:
    bgm: ending_a
    text: { ja: '批判は受けたが、顧客と取引先の信頼は戻った。通販の売上は半年で事件前の水準に近づき、委託先との取引も続いている。店は開いたままで、必要な荷物は届くようになった。被害の責任は攻撃者にある。問われたのは、被害を広げないための対応だった。', en: '' }
  B:
    bgm: ending_b
    text: { ja: '通販は立ち直ったが、定期会員の一部は他の店に流れた。店舗の売上は戻っても、通販の利益率は下がったままだ。委託先を増やした分、管理の手間も増えている。被害の責任は攻撃者にある。問われたのは、被害を広げないための対応だった。', en: '' }
  C:
    bgm: ending_c
    text: { ja: '第三者委員会は、停止の判断の遅れと委託先の監督不足を指摘した。社長は辞任し、新しい体制で再建が始まる。店舗では今も、通販の再開時期を尋ねる電話が鳴る。被害の責任は攻撃者にある。問われたのは、被害を広げないための対応だった。', en: '' }
  D:
    bgm: ending_d
    text: { ja: '行政指導と顧客からの損害賠償の請求が重なり、通販の一部を閉じた。それでも店には人が来る。どこで判断を誤ったのか、対応の記録を読み返す日が続く。被害の責任は攻撃者にある。問われたのは、被害を広げないための対応だった。', en: '' }
salesModel: { base: 100, trustWeight: 0.4, fatalPenalty: 10, min: 40, max: 130 }
