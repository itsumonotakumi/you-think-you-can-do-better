# No.4 ゴーライド / セキュリティ部門長（CSIRTリーダー）ロール
# 判断ポイント20、細目は choices[].items と drafts の合計で80以上。
# 視点: 専任のセキュリティ部署がない会社で、兼任チームを束ねる執行役員セキュリティ責任者。
#       技術の事実を経営の言葉に訳し、証拠を守り、外部の専門家と経営の間をつなぐのが仕事。
estimateMinutes: 45
intro: { ja: 'あなたはゴーライドの執行役員セキュリティ責任者、八木慎一。専任のセキュリティ部はなく、情シスと運用の兼任メンバーを束ねている。午前9時の電話から、あなたの四週間が始まる。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-ppc-prelim
    ref: ppc-report-prelim
    label: { ja: '個人情報保護委員会への速報', en: '' }
    points: -150
    doneFlag: ppcPrelimFiled
  - id: dl-ppc-final
    ref: ppc-report-final-malicious
    label: { ja: '個人情報保護委員会への確報', en: '' }
    points: -100
    doneFlag: ppcFinalFiled
events:
  - id: ev-night
    at: { day: 1, minutes: 120 }
    voices: [v-ev-night]
    gauges: { stamina: -5 }
    caption: { ja: '現場から「このまま朝まで起きています」と連絡が入る。', en: '' }
  - id: ev-news
    at: { day: 2, minutes: 420 }
    voices: [v-ev-news]
    gauges: { flame: 5 }
    sound: { se: [notify_news] }
    caption: { ja: '朝のニュースが「カーシェア大手で顧客情報の漏えいか」と報じた。', en: '' }
  - id: ev-vendor
    at: { day: 4, minutes: 720 }
    voices: [v-ev-vendor]
    gauges: { flame: 3 }
    sound: { se: [mail_arrive] }
    caption: { ja: '本人確認の委託先から、調査の進捗を尋ねるメールが届いた。', en: '' }
points:
  - id: p01-alert
    at: { day: 0, minutes: 540 }
    phase: detect
    sound: { se: [phone_ring] }
    text: { ja: '午前9時。役員会議の最中に、運用本部長の国枝から電話が入る。「アプリのデータベースに外部からアクセスされた形跡があります。免許証の画像が持ち出された可能性があります」。監視のアラートは三件。同じ踏み台から本人確認システムへも通信している。', en: '' }
    voices: [v01-boss, v01-field, v01-ok]
    notable:
      - { id: note-first-call, text: { ja: '午前9時、アプリのデータベースへの不正アクセスを検知。免許証画像が対象の可能性。', en: '' } }
    choices:
      - id: p01-wait
        text: { ja: '誤検知の可能性が高いと判断し、役員会議が終わるまで待つ。', en: '' }
        minutes: 120
        category: hurt
        points: -120
        refs: [jpcert-handling]
        gauges: { flame: 10, trust: -5 }
        coward: true
        setFlags: { delayedTriage: true }
        delayed:
          - { afterPhases: 1, points: -40, gauges: { damage: 15 }, reason: { ja: '隔離が遅れたサーバーから、同じ踏み台で画像が抜かれ続けた。', en: '' } }
        items:
          - { id: p01-a-time, points: -10, axis: time, refs: [jpcert-handling] }
          - { id: p01-a-order, points: -8, axis: order, refs: [jpcert-handling] }
      - id: p01-solo
        text: { ja: '自分でデータベースに入り、不審なプロセスの正体を確かめる。', en: '' }
        minutes: 90
        category: hurt
        points: -60
        refs: [nist-sp800-61r3]
        gauges: { stamina: -10, trust: -5 }
        items:
          - { id: p01-b-order, points: -10, axis: order, refs: [nist-sp800-61r3] }
          - { id: p01-b-record, points: -8, axis: record, refs: [nist-sp800-61r3] }
      - id: p01-triage
        text: { ja: '兼任チームを招集し、該当サーバーをネットワークから隔離する。メモリとログを保全し、経営へ第一報を入れる。', en: '' }
        minutes: 45
        category: maintain
        points: 20
        refs: [jpcert-handling, nist-sp800-61r3]
        gauges: { damage: -5, stamina: -10, trust: 5 }
        setFlags: { triageStarted: true }
        items:
          - { id: p01-c-time, points: 5, axis: time, refs: [jpcert-handling] }
          - { id: p01-c-order, points: 8, axis: order, refs: [nist-sp800-61r3] }
          - { id: p01-c-record, points: 8, axis: record, refs: [jpcert-handling] }
      - id: p01-triage-impact
        text: { ja: '招集と隔離、証拠の保全に加え、顧客影響の一次評価を三十分で作り、広報と法務に同時に渡す。', en: '' }
        minutes: 75
        category: recover
        points: 100
        refs: [jpcert-handling, meti-csm-guideline]
        gauges: { damage: -10, stamina: -15, trust: 10 }
        setFlags: { triageStarted: true, impactAssessed: true }
        items:
          - { id: p01-d-order, points: 5, axis: order, refs: [meti-csm-guideline] }
          - { id: p01-d-care, points: 8, axis: care, refs: [meti-csm-guideline] }
          - { id: p01-d-record, points: 8, axis: record, refs: [jpcert-handling] }

  - id: p02-keys
    at: { day: 0, minutes: 630 }
    phase: contain
    sound: { se: [notify_chat] }
    text: { ja: '午前10時30分。免許証画像は、本人確認の委託先が預かるストレージにある。APIの鍵は三本。止めれば新規申込みが止まり、止めなければ画像がさらに抜かれる。', en: '' }
    voices: [v02-vendor, v02-public, v02-ok]
    choices:
      - id: p02-partial
        text: { ja: '画像の参照だけ止める。申込みの流れはそのまま動かす。', en: '' }
        minutes: 60
        category: hurt
        points: -100
        refs: [nist-sp800-61r3]
        gauges: { damage: 15, flame: 5 }
        delayed:
          - { afterPhases: 1, points: -60, gauges: { damage: 15, trust: -10 }, reason: { ja: '止めなかった鍵から、同じ踏み台で画像が抜かれ続けた。', en: '' } }
        items:
          - { id: p02-a-content, points: -10, axis: content, refs: [nist-sp800-61r3] }
          - { id: p02-a-care, points: -8, axis: care, refs: [ppc-notify-person] }
      - id: p02-wait
        text: { ja: '委託先の見解を聞いてから決める。今日は様子を見る。', en: '' }
        minutes: 90
        category: hurt
        points: -150
        refs: [jpcert-handling]
        gauges: { flame: 10, trust: -10 }
        coward: true
        items:
          - { id: p02-b-order, points: -10, axis: order, refs: [jpcert-handling] }
          - { id: p02-b-time, points: -10, axis: time, refs: [jpcert-handling] }
      - id: p02-all
        text: { ja: '三本の鍵をすべて止め、新規申込みを一時停止する。', en: '' }
        minutes: 90
        category: maintain
        points: 20
        refs: [nist-sp800-61r3]
        gauges: { damage: -10, flame: 5 }
        setFlags: { keysRevoked: true }
        items:
          - { id: p02-c-order, points: 8, axis: order, refs: [nist-sp800-61r3] }
          - { id: p02-c-content, points: 5, axis: content, refs: [nist-sp800-61r3] }
      - id: p02-all-rotate
        text: { ja: '三本の鍵を止めて再発行し、使われた時刻と送信先を監査ログから洗い出す。', en: '' }
        minutes: 120
        category: recover
        points: 100
        refs: [nist-sp800-61r3, cissp-cbk-secops]
        gauges: { damage: -15, stamina: -10, trust: 10 }
        setFlags: { keysRevoked: true, keysRotated: true }
        items:
          - { id: p02-d-order, points: 8, axis: order, refs: [nist-sp800-61r3] }
          - { id: p02-d-content, points: 8, axis: content, refs: [cissp-cbk-secops] }
          - { id: p02-d-record, points: 5, axis: record, refs: [cissp-cbk-secops] }

  - id: p03-command
    at: { day: 0, minutes: 750 }
    phase: organize
    sound: { se: [notify_chat] }
    text: { ja: '午後0時30分。対策本部を立ち上げる。専任のセキュリティ部はない。情シス兼任が三人、運用が二人、法務と広報が各一人。誰が指揮し、誰が記録し、誰が外部と連絡するか。', en: '' }
    voices: [v03-flattery, v03-public, v03-ok]
    choices:
      - id: p03-solo
        text: { ja: '自分が指揮も調査も外部連絡も全部持つ。そのほうが速い。', en: '' }
        minutes: 60
        category: hurt
        points: -80
        refs: [cissp-cbk-secops]
        gauges: { stamina: -15, trust: -5 }
        items:
          - { id: p03-a-order, points: -10, axis: order, refs: [cissp-cbk-secops] }
          - { id: p03-a-care, points: -8, axis: care, refs: [cissp-cbk-secops] }
      - id: p03-names
        text: { ja: '役割だけ決めて、記録係は置かない。手が足りない。', en: '' }
        minutes: 45
        category: hurt
        points: -50
        refs: [jpcert-handling]
        gauges: { stamina: -5 }
        items:
          - { id: p03-b-record, points: -10, axis: record, refs: [jpcert-handling] }
          - { id: p03-b-order, points: -8, axis: order, refs: [cissp-cbk-secops] }
      - id: p03-roles
        text: { ja: '指揮、調査、記録、外部連絡、経営窓口を分け、当番表を作る。', en: '' }
        minutes: 60
        category: maintain
        points: 30
        refs: [cissp-cbk-secops, jpcert-handling]
        gauges: { stamina: 5, trust: 5 }
        setFlags: { commandStructure: true }
        items:
          - { id: p03-c-order, points: 10, axis: order, refs: [cissp-cbk-secops] }
          - { id: p03-c-record, points: 8, axis: record, refs: [jpcert-handling] }
      - id: p03-roles-deputy
        text: { ja: '役割分担に加え、指揮の代行を決め、判断の時刻と理由を十五分ごとに記録に残す。', en: '' }
        minutes: 90
        category: recover
        points: 100
        refs: [cissp-cbk-secops, meti-csm-guideline]
        gauges: { stamina: 10, trust: 10 }
        setFlags: { commandStructure: true, decisionLog: true }
        items:
          - { id: p03-d-order, points: 10, axis: order, refs: [cissp-cbk-secops] }
          - { id: p03-d-record, points: 10, axis: record, refs: [jpcert-handling] }
          - { id: p03-d-care, points: 8, axis: care, refs: [ipa-sme-guideline] }

  - id: p04-evidence
    at: { day: 0, minutes: 900 }
    phase: investigate
    sound: { se: [notify_chat] }
    text: { ja: '午後3時。現場から「早く初期化して作り直したい」と声が上がる。サーバーのメモリには実行中の不審なプログラムが残り、ディスクには踏み台に使われた形跡がある。ログの保存は九十日。', en: '' }
    voices: [v04-expert, v04-field, v04-ok]
    choices:
      - id: p04-wipe
        text: { ja: '初期化して作り直す。証拠より復旧を優先する。', en: '' }
        minutes: 120
        category: fatal
        points: -250
        refs: [nist-sp800-61r3]
        gauges: { damage: 20, trust: -20 }
        setFlags: { evidenceLost: true }
        delayed:
          - { afterPhases: 2, points: -80, gauges: { flame: 15 }, reason: { ja: '侵入経路も漏えい範囲も分からないまま、説明だけを求められた。', en: '' } }
        items:
          - { id: p04-a-record, points: -20, axis: record, refs: [nist-sp800-61r3] }
          - { id: p04-a-content, points: -15, axis: content, refs: [nist-sp800-61r3] }
          - { id: p04-a-order, points: -10, axis: order, refs: [cissp-cbk-secops] }
      - id: p04-shutdown
        text: { ja: '全台の電源を落とし、調査は落ち着いてからにする。', en: '' }
        minutes: 60
        category: hurt
        points: -100
        refs: [nist-sp800-61r3]
        gauges: { damage: 10, stamina: 5 }
        items:
          - { id: p04-b-record, points: -10, axis: record, refs: [nist-sp800-61r3] }
          - { id: p04-b-time, points: -8, axis: time, refs: [jpcert-handling] }
      - id: p04-image
        text: { ja: '影響したサーバーのメモリとディスクのイメージを取得し、ハッシュ値と保管場所を記録してから隔離を続ける。', en: '' }
        minutes: 120
        category: maintain
        points: 30
        refs: [nist-sp800-61r3, jpcert-handling]
        gauges: { damage: -10, stamina: -15, trust: 5 }
        setFlags: { evidencePreserved: true }
        items:
          - { id: p04-c-record, points: 10, axis: record, refs: [nist-sp800-61r3] }
          - { id: p04-c-order, points: 8, axis: order, refs: [cissp-cbk-secops] }
          - { id: p04-c-time, points: 5, axis: time, refs: [jpcert-handling] }
      - id: p04-image-chain
        text: { ja: 'イメージの取得に加え、影響が疑われる端末も同じ手順で保全し、取得の担当と時刻を管理の連鎖として残す。', en: '' }
        minutes: 180
        category: recover
        points: 100
        refs: [nist-sp800-61r3, cissp-cbk-secops]
        gauges: { damage: -10, stamina: -20, trust: 5 }
        setFlags: { evidencePreserved: true, evidenceChain: true }
        items:
          - { id: p04-d-record, points: 10, axis: record, refs: [cissp-cbk-secops] }
          - { id: p04-d-content, points: 8, axis: content, refs: [nist-sp800-61r3] }
          - { id: p04-d-order, points: 5, axis: order, refs: [nist-sp800-61r3] }

  - id: p05-stop
    at: { day: 0, minutes: 1080 }
    phase: contain
    sound: { se: [notify_news] }
    text: { ja: '午後6時。予約と解錠は動いている。止めれば全国の車が借りられない。止めなければ、同じ踏み台から画像が抜かれ続ける。決めるのは経営。あなたは材料を出す。', en: '' }
    voices: [v05-public, v05-coward, v05-ok]
    popular: { choiceId: p05-partial, percent: 61 }
    choices:
      - id: p05-partial
        text: { ja: '被害が確認された機能だけ止める。', en: '' }
        minutes: 60
        category: hurt
        points: -100
        refs: [nist-sp800-61r3]
        gauges: { damage: 20, flame: 5 }
        delayed:
          - { afterPhases: 1, points: -60, gauges: { damage: 15, trust: -10 }, reason: { ja: '止めなかった機能からも不正アクセスが続いた。', en: '' } }
        items:
          - { id: p05-a-content, points: -10, axis: content, refs: [nist-sp800-61r3] }
          - { id: p05-a-care, points: -8, axis: care, refs: [ppc-notify-person] }
      - id: p05-wait
        text: { ja: '経営の決裁を待つ。自分からは推薦しない。', en: '' }
        minutes: 90
        category: hurt
        points: -60
        refs: [meti-csm-guideline]
        gauges: { flame: 10 }
        coward: true
        items:
          - { id: p05-b-order, points: -8, axis: order, refs: [meti-csm-guideline] }
          - { id: p05-b-time, points: -8, axis: time, refs: [meti-csm-guideline] }
      - id: p05-recommend
        text: { ja: '全面停止を推薦し、告知の中身は広報に任せる。', en: '' }
        minutes: 60
        category: maintain
        points: 20
        refs: [meti-disclosure-guidance]
        gauges: { damage: -10, flame: 5 }
        setFlags: { stopRecommended: true }
        items:
          - { id: p05-c-order, points: 8, axis: order, refs: [meti-csm-guideline] }
          - { id: p05-c-content, points: 5, axis: content, refs: [meti-csm-guideline] }
      - id: p05-recommend-plan
        text: { ja: '全面停止を推薦し、利用者が今すぐすべきことを同時に告知する案を添える。', en: '' }
        minutes: 90
        category: recover
        points: 100
        refs: [meti-disclosure-guidance, ppc-notify-person]
        gauges: { damage: -20, flame: 10, trust: 10, stamina: -10 }
        setFlags: { stopRecommended: true, customerGuidance: true }
        items:
          - { id: p05-d-content, points: 8, axis: content, refs: [nist-sp800-61r3] }
          - { id: p05-d-care, points: 10, axis: care, refs: [ppc-notify-person] }
          - { id: p05-d-order, points: 8, axis: order, refs: [meti-csm-guideline] }

  - id: p06-retention
    at: { day: 0, minutes: 1140 }
    phase: organize
    sound: { se: [notify_chat] }
    text: { ja: '午後7時。対策本部の夜。過去の会議録が出てきた。「退会した人の免許証画像は、戻ってきたときに本人確認が楽なので残す」。決めたのは経営会議で、あなたも同席していた。保存の根拠は、もう利用目的と説明できない。', en: '' }
    voices: [v06-boss, v06-insider, v06-ok]
    notable:
      - { id: note-retention, text: { ja: '退会者・申込み途中の免許証画像も保存する方針が、過去の経営会議で決まっていた。', en: '' } }
    choices:
      - id: p06-hide
        text: { ja: '議事録の存在は調査の対象から外し、保存方針も「運用の誤り」として説明する。', en: '' }
        minutes: 60
        category: fatal
        points: -250
        refs: [meti-csm-guideline]
        gauges: { flame: 25, trust: -25 }
        setFlags: { hidRetention: true }
        delayed:
          - { afterPhases: 2, points: -100, gauges: { flame: 25, trust: -15 }, reason: { ja: '議事録の存在が報じられ、組織的な隠蔽と批判された。', en: '' } }
        items:
          - { id: p06-a-record, points: -20, axis: record, refs: [meti-csm-guideline] }
          - { id: p06-a-content, points: -15, axis: content, refs: [meti-csm-guideline] }
          - { id: p06-a-care, points: -10, axis: care, refs: [meti-csm-guideline] }
      - id: p06-scope-only
        text: { ja: '調査には含めるが、報告書には保存方針を書かない。', en: '' }
        minutes: 60
        category: hurt
        points: -80
        refs: [meti-csm-guideline]
        gauges: { trust: -10, flame: 5 }
        setFlags: { retentionIncluded: true }
        items:
          - { id: p06-b-content, points: -10, axis: content, refs: [meti-csm-guideline] }
          - { id: p06-b-record, points: -8, axis: record, refs: [meti-csm-guideline] }
      - id: p06-audit
        text: { ja: '保存方針を認め、全保存データを棚卸しして不要な画像を削除し、方針を経営に報告する。', en: '' }
        minutes: 120
        category: maintain
        points: 30
        refs: [no04-ppc-guideline-general, meti-csm-guideline]
        gauges: { flame: -5, trust: 10 }
        setFlags: { retentionAudit: true }
        items:
          - { id: p06-c-content, points: 10, axis: content, refs: [no04-ppc-guideline-general] }
          - { id: p06-c-record, points: 8, axis: record, refs: [meti-csm-guideline] }
          - { id: p06-c-care, points: 5, axis: care, refs: [ppc-notify-person] }
      - id: p06-audit-explain
        text: { ja: '棚卸しと削除に加え、保存の経緯と見直しを公表文に書ける形にまとめ、対象者への説明も準備する。', en: '' }
        minutes: 180
        category: recover
        points: 120
        refs: [no04-ppc-guideline-general, ppc-notify-person]
        gauges: { flame: -10, trust: 15, stamina: -10 }
        setFlags: { retentionAudit: true, retentionExplained: true }
        items:
          - { id: p06-d-content, points: 10, axis: content, refs: [no04-ppc-guideline-general] }
          - { id: p06-d-record, points: 8, axis: record, refs: [meti-csm-guideline] }
          - { id: p06-d-care, points: 8, axis: care, refs: [ppc-notify-person] }
          - { id: p06-d-time, points: 5, axis: time, refs: [meti-csm-guideline] }

  - id: p07-first-report
    at: { day: 0, minutes: 1260 }
    phase: notify
    sound: { se: [typing] }
    text: { ja: '午後9時。第1報の技術ファクトシートを作る時間。法務と広報が待っている。分かったことと、まだ分からないことが混ざっている。', en: '' }
    voices: [v07-law, v07-boss, v07-ok]
    choices:
      - id: p07-wait
        text: { ja: '全容が分かってから出す。今日は技術の確認に集中する。', en: '' }
        minutes: 120
        category: hurt
