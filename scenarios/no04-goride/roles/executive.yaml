      - id: p03-no-leak
        text: { ja: '「免許証画像の漏えいは確認されていません」と断言して出す。', en: '' }
        minutes: 90
        category: fatal
        points: -250
        refs: [ppc-report-scope]
        gauges: { flame: 30, trust: -20 }
        setFlags: { falseStatement: true }
        delayed:
          - { afterPhases: 2, points: -100, gauges: { flame: 20, trust: -20 }, reason: { ja: '画像の流出が確認され、最初の発表が虚偽だったと報道された。', en: '' } }
        items:
          - { id: p03-c-wording, points: -20, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: p03-c-content, points: -15, axis: content, refs: [ppc-report-scope] }
          - { id: p03-c-record, points: -10, axis: record, refs: [jpcert-handling] }

