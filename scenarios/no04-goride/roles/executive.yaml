# No.4 ゴーライド / 経営者ロール
# 判断ポイント17、細目は choices[].items と drafts の合計で80以上。
estimateMinutes: 30
intro: { ja: 'あなたはゴーライドの代表取締役社長。カーシェアの予約も解錠も、このアプリで動いている。午後9時30分の電話から、あなたの判断が始まる。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-ppc-prelim
    ref: ppc-report-prelim
    label: { ja: '個人情報保護委員会への速報', en: '' }
    points: -150
    doneFlag: ppcPrelimFiled
events:
  - id: ev-client-inquiry
    at: { day: 1, minutes: 720 }
    voices: [v-ev-client]
    gauges: { flame: 5 }
    sound: { se: [phone_ring] }
    caption: { ja: '主要取引先から問い合わせが相次いでいる。', en: '' }
  - id: ev-news
    at: { day: 3, minutes: 720 }
    voices: [v-ev-news]
    gauges: { flame: 8 }
    sound: { se: [notify_news] }
    caption: { ja: 'ニュースが「退会者の免許証画像が残っていた」と報じた。', en: '' }
  - id: ev-darkweb
    at: { day: 5, minutes: 555 }
    voices: [v-ev-darkweb]
    gauges: { flame: 10 }
    sound: { se: [notify_news] }
    caption: { ja: 'ダークウェブで免許証画像が売られているという情報が入った。', en: '' }
points:
  - id: p01-call
    at: { day: 0, minutes: 1290 }
    phase: detect
    sound: { se: [phone_ring] }
    text: { ja: '午後9時30分。役員会議の最中に、サービス運用本部長から電話が入る。「アプリのデータベースに外部からアクセスされた形跡があります。免許証の画像は本人確認の委託先のストレージにあり、APIの鍵で参照しています。持ち出された可能性があります」。', en: '' }
    lesson: { ja: '検知の第一報では、自分で調べるより先に体制を整える。指揮と封じ込めの権限を決め、外部の調査会社と弁護士につなぎ、従業員の安全と証拠保全を同時に押さえる。誤検知を理由に待つと、初動の空白そのものが批判の材料になる。', en: '' }
    voices: [v01-boss, v01-public, v01-ok]
    notable:
      - { id: note-first-call, text: { ja: '午後9時30分、アプリのデータベースへの不正アクセスを検知。委託先のストレージにある免許証画像が対象の可能性。', en: '' } }
    choices:
      - id: p01-command
        text: { ja: '対策本部を立ち上げ、封じ込めの権限を運用本部長に委譲し、外部の調査会社と弁護士に連絡する。', en: '' }
        explain: { ja: '権限委譲と外部連携を同時に決め、初動の体制を整えた点が評価できる。情報が揃う前でも動ける形が強い。', en: '' }
        minutes: 30
        category: maintain
        points: 20
        refs: [meti-csm-guideline]
        gauges: { flame: -5, trust: 5, stamina: -5 }
        setFlags: { commandStarted: true }
        items:
          - { id: p01-b-time, points: 5, axis: time, refs: [meti-csm-guideline] }
          - { id: p01-b-order, points: 5, axis: order, refs: [meti-csm-guideline] }
          - { id: p01-b-record, points: 5, axis: record, refs: [jpcert-handling] }
      - id: p01-wait
        text: { ja: '誤検知の可能性もあると考え、役員会議を続けたうえで翌朝に改めて報告を受ける。', en: '' }
        explain: { ja: '初動を翌朝まで遅らせた点が致命的。被害の拡大と初報の遅れを招き、指揮の空白が批判を生む。', en: '' }
        minutes: 120
        category: hurt
        points: -150
        refs: [meti-csm-guideline]
        gauges: { flame: -5, trust: -5, stamina: 5 }
        coward: true
        setFlags: { delayedCommand: true }
        delayed:
          - { afterPhases: 1, points: -40, gauges: { flame: 15, trust: -10 }, reason: { ja: '翌朝までに不正アクセスの続報が社外に漏れ、批判が出始めた。', en: '' } }
        items:
          - { id: p01-a-time, points: -10, axis: time, refs: [meti-csm-guideline] }
          - { id: p01-a-order, points: -8, axis: order, refs: [jpcert-handling] }
      - id: p01-self
        text: { ja: '自分でサーバー室へ行き、担当者に任せずログと端末を直接確かめて原因を探る。', en: '' }
        explain: { ja: '自ら手を動かす姿勢は評価できるが、指揮者が現場に入ると全体の判断が止まる。役割を分けるべき場面。', en: '' }
        minutes: 60
        category: hurt
        points: -50
        refs: [jpcert-handling]
        gauges: { stamina: -10, trust: -5 }
        items:
          - { id: p01-c-order, points: -10, axis: order, refs: [jpcert-handling] }
          - { id: p01-c-care, points: -5, axis: care, refs: [meti-csm-guideline] }

  - id: p02-stop
    at: { day: 1, minutes: 540 }
    phase: contain
    sound: { se: [phone_ring, notify_sns] }
    text: { ja: '午前9時。アプリの予約と解錠が動いている。止めれば全国の車が借りられなくなる。止めなければ、免許証画像がさらに持ち出されるおそれがある。', en: '' }
    lesson: { ja: 'サービスを止める判断は、止める範囲と伝え方を同時に決める。全面停止は利用者への影響が大きい分、理由と今すぐ取るべき行動、相談先をセットで示す。メンテナンスと偽ると、後の説明がすべて疑われる。', en: '' }
    voices: [v02-public, v02-field, v02-ok]
    popular: { choiceId: p02-stop-notice, percent: 44 }
    choices:
      - id: p02-partial
        text: { ja: '被害が確認された予約機能だけを止め、他の機能は動かしたまま様子を見る。', en: '' }
        explain: { ja: '止める範囲を確認済みに限ったため、未確認の経路から持ち出しが続く。封じ込めの判断が甘い。', en: '' }
        minutes: 60
        category: hurt
        points: -100
        refs: [nist-sp800-61r3]
        gauges: { damage: 20, flame: 5 }
        delayed:
          - { afterPhases: 1, points: -60, gauges: { damage: 15, trust: -10 }, reason: { ja: '止めなかった機能からも不正アクセスが続いた。', en: '' } }
        items:
          - { id: p02-a-content, points: -10, axis: content, refs: [nist-sp800-61r3] }
          - { id: p02-a-record, points: 3, axis: record, refs: [nist-sp800-61r3] }
      - id: p02-stop-guide
        text: { ja: '全面停止し、利用者向けにパスワード変更や相談窓口などの具体策を同時に告知する。', en: '' }
        explain: { ja: '止めるだけでなく、利用者の行動と相談先まで示した点が最も評価できる。二次被害を減らす実務的な対応。', en: '' }
        minutes: 120
        category: recover
        points: 100
        refs: [ppc-notify-person]
        gauges: { flame: 10, damage: -30, trust: 10, stamina: -15 }
        setFlags: { contained: true, transparentStop: true, customerGuidance: true }
        items:
          - { id: p02-c-time, points: 5, axis: time, refs: [meti-disclosure-guidance] }
          - { id: p02-c-care, points: 10, axis: care, refs: [ppc-notify-person] }
          - { id: p02-c-content, points: 5, axis: content, refs: [meti-disclosure-guidance] }
          - { id: p02-c-next, points: 3, axis: content, refs: [meti-disclosure-guidance] }
      - id: p02-stop-notice
        text: { ja: '予約と解錠を全面停止し、利用者には停止の理由だけを簡潔に告知する。', en: '' }
        explain: { ja: '全面停止は正しいが、理由を伝えないと利用者は不安と反発を募らせる。次の行動の案内が足りない。', en: '' }
        minutes: 90
        category: maintain
        points: 20
        refs: [meti-disclosure-guidance]
        gauges: { flame: 15, damage: -20, stamina: -10 }
        setFlags: { contained: true, transparentStop: true }
        items:
          - { id: p02-b-content, points: 5, axis: content, refs: [meti-disclosure-guidance] }
          - { id: p02-b-care, points: -5, axis: care, refs: [ppc-notify-person] }
      - id: p02-maintenance
        text: { ja: '全面停止するが、告知は「システムメンテナンス」とだけ書いて理由を伏せる。', en: '' }
        explain: { ja: '理由を伏せた告知は、後から不正アクセスと判明した時に隠蔽と受け取られる。信頼を大きく損なう。', en: '' }
        minutes: 90
        category: fatal
        points: -250
        refs: [ppc-report-scope]
        gauges: { flame: -15, damage: 10, trust: -20 }
        setFlags: { hidFacts: true }
        delayed:
          - { afterPhases: 4, points: -100, gauges: { flame: 40, trust: -20 }, reason: { ja: '不正アクセスだったことが報道で判明し、隠蔽と批判された。', en: '' } }
        items:
          - { id: p02-d-wording, points: -20, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: p02-d-wording2, points: -10, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: p02-d-record, points: -10, axis: record, refs: [jpcert-handling] }

  - id: p03-first-report
    at: { day: 1, minutes: 1020 }
    phase: notify
    sound: { se: [typing] }
    text: { ja: '午後5時。広報が「今夜、第1報を出せます」と言う。影響範囲はまだ確定していない。', en: '' }
    lesson: { ja: '初報は全容が分かるのを待たない。確認できた事実、未確認の点、次に分かる見込みを分けて出せば、後から情報が増えても説明の筋は崩れない。否定を急ぐと、後の訂正が虚偽に見える。', en: '' }
    voices: [v03-coward, v03-law, v03-ok]
    choices:
      - id: p03-wait
        text: { ja: '全容が分かるまで待ち、今夜の第1報は出さずに明日以降へ回す。', en: '' }
        explain: { ja: '情報が揃うのを待つ間に、報道や憶測が先に広がる。初報の遅れは隠している印象を与え、後の説明も届きにくくなる。', en: '' }
        minutes: 480
        category: hurt
        points: -100
        refs: [ppc-report-prelim]
        gauges: { flame: -5, trust: -10 }
        coward: true
        detail: first-report
        delayed:
          - { afterPhases: 1, points: -30, gauges: { flame: 15 }, reason: { ja: '報道が先に「説明なし」と報じた。', en: '' } }
        items:
          - { id: p03-a-time, points: -10, axis: time, refs: [ppc-report-prelim] }
          - { id: p03-a-care, points: -10, axis: care, refs: [ppc-notify-person] }
      - id: p03-no-leak
        text: { ja: '「免許証画像の漏えいは確認されていません」と断言して第1報を出す。', en: '' }
        explain: { ja: '未確認の段階で漏えいなしと断言した点が致命的。後に事実が判明すると虚偽発表となり、信頼の回復が難しくなる。', en: '' }
        minutes: 90
        category: fatal
        points: -250
        refs: [ppc-report-scope]
        gauges: { flame: 30, trust: -20 }
        setFlags: { falseStatement: true }
        delayed:
          - { afterPhases: 2, points: -100, gauges: { flame: 20, trust: -20 }, reason: { ja: '画像の流出が確認され、最初の発表が虚偽だったと報道された。', en: '' } }
        items:
          - { id: p03-c-wording, points: -20, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: p03-c-content, points: -15, axis: content, refs: [ppc-report-scope] }
          - { id: p03-c-record, points: -10, axis: record, refs: [jpcert-handling] }

      - id: p03-tonight
        text: { ja: '今夜中に第1報を出し、分かっている範囲と不明点を分けて書く。', en: '' }
        explain: { ja: '分かった範囲と不明点を分けて出した点が妥当。早さと正確さを両立し、後の訂正も最小限にできる。', en: '' }
        minutes: 120
        category: maintain
        points: 20
        refs: [ppc-report-prelim]
        gauges: { trust: 5, stamina: -10 }
        detail: first-report
        setFlags: { firstPublic: true }
        items:
          - { id: p03-b-record, points: 5, axis: record, refs: [meti-disclosure-guidance] }
          - { id: p03-b-order, points: 5, axis: order, refs: [meti-disclosure-guidance] }
  - id: p04-retention
    at: { day: 1, minutes: 1260 }
    phase: organize
    sound: { se: [notify_chat] }
    text: { ja: '午後9時。対策本部の夜。2023年の経営会議の議事録が見つかった。「再入会キャンペーンの審査を早くするため、退会者の免許証画像も残す」。提案したのはグループ会社の社長で、決裁したのは、あなただった。', en: '' }
    lesson: { ja: '都合の悪い議事録ほど早く出す。保存方針を決めた経緯と自分の関与を認め、新規保存の停止、既存画像の保全と削除の時期、対象者への説明を一つの筋で示す。隠す判断は必ず後から剥がれる。', en: '' }
    voices: [v04-insider, v04-boss, v04-ok]
    notable:
      - { id: note-retention, text: { ja: '退会者・申込み途中の免許証画像も保存する方針が、2023年の経営会議で決まっていた。決裁したのは社長。', en: '' } }
    choices:
      - id: p04-audit
        text: { ja: '保存方針を認めて新規保存を止め、既存画像は保全し、削除は調査後に記録を残して行うと公表する。', en: '' }
        explain: { ja: '認めて止め、保全と削除の手順まで示した点が評価できる。事実を出し切る方が長期的な信頼につながる。', en: '' }
        minutes: 180
        category: recover
        points: 120
        refs: [ppc-notify-person]
        gauges: { flame: -10, trust: 15, stamina: -10 }
        setFlags: { retentionAudit: true }
        items:
          - { id: p04-b-content, points: 10, axis: content, refs: [no04-ppc-guideline-general] }
          - { id: p04-b-record, points: 8, axis: record, refs: [meti-csm-guideline] }
          - { id: p04-b-care, points: 8, axis: care, refs: [ppc-notify-person] }
          - { id: p04-b-time, points: 5, axis: time, refs: [meti-csm-guideline] }
      - id: p04-hide
        text: { ja: '議事録の存在は公表せず、保存方針も「現場の運用の誤り」として説明を続ける。', en: '' }
        explain: { ja: '自分の決裁を伏せた点が最大の誤り。議事録は必ず残っており、判明した時の隠蔽批判で信頼が崩れる。', en: '' }
        minutes: 60
        category: fatal
        points: -250
        refs: [meti-csm-guideline]
        gauges: { flame: -10, trust: -25 }
        setFlags: { hidRetention: true }
        delayed:
          - { afterPhases: 2, points: -100, gauges: { flame: 25, trust: -15 }, reason: { ja: '議事録の存在が報じられ、組織的な隠蔽と批判された。', en: '' } }
        items:
          - { id: p04-a-record, points: -20, axis: record, refs: [meti-csm-guideline] }
          - { id: p04-a-content, points: -15, axis: content, refs: [meti-csm-guideline] }
          - { id: p04-a-care, points: -10, axis: care, refs: [meti-csm-guideline] }
      - id: p04-delete
        text: { ja: '保存方針には触れず、対象データだけを削除して、方針の見直しは後回しにする。', en: '' }
        explain: { ja: 'データを消す方向は分かるが、方針の見直しを先送りしたため再発の芽が残る。説明も不足している。', en: '' }
        minutes: 90
        category: hurt
        points: -80
        refs: [meti-csm-guideline]
        gauges: { trust: 5, stamina: -5 }
        items:
          - { id: p04-c-content, points: 3, axis: content, refs: [no04-ppc-guideline-general] }
          - { id: p04-c-record, points: 3, axis: record, refs: [meti-csm-guideline] }
          - { id: p04-c-care, points: -5, axis: care, refs: [ppc-notify-person] }

  - id: p05-report
    at: { day: 2, minutes: 540 }
    phase: notify
    sound: { se: [phone_ring] }
    text: { ja: '2日目午前9時。法務から「個人情報保護委員会への速報を、いつ出すか」と聞かれた。件数はまだ確定していない。', en: '' }
    lesson: { ja: '速報は件数の確定を待たない。分かっている範囲と不明点を書き分け、提出した時刻と相手を記録する。口頭で相談して終わりにすると、報告の履行も説明も残らない。記録が残る形にする。', en: '' }
    voices: [v05-law, v05-boss, v05-ok]
    popular: { choiceId: p05-wait, percent: 58 }
    choices:
      - id: p05-wait
        text: { ja: '件数が確定するまで待ち、所管庁への速報は先に出さない。', en: '' }
        explain: { ja: '件数を待つ間に報告の時期を逃す。不正アクセスが疑われる時点で速報の対象であり、遅れは指導の対象になる。', en: '' }
        minutes: 120
        category: hurt
        points: -150
        refs: [ppc-report-prelim]
        gauges: { flame: 15, trust: -10, damage: 10 }
        coward: true
        setFlags: { delayedReport: true }
        items:
          - { id: p05-a-time, points: -10, axis: time, refs: [ppc-report-prelim] }
          - { id: p05-a-record, points: -8, axis: record, refs: [ppc-report-prelim] }
      - id: p05-file
        text: { ja: '分かっている範囲で速報を出し、不明点は調査中と明記する。', en: '' }
        explain: { ja: '分かった範囲で出し、不明点を明記した点が妥当。件数の確定を待たずに報告義務を果たしている。', en: '' }
        minutes: 90
        category: maintain
        points: 20
        refs: [ppc-report-prelim]
        gauges: { trust: 5, stamina: -10 }
        setFlags: { ppcPrelimFiled: true }
        items:
          - { id: p05-b-content, points: 8, axis: content, refs: [ppc-report-prelim] }
          - { id: p05-b-time, points: 5, axis: time, refs: [ppc-report-prelim] }
          - { id: p05-b-record, points: 5, axis: record, refs: [ppc-report-prelim] }
      - id: p05-oral
        text: { ja: '所管庁には口頭で相談するが、書面による速報は出さない。', en: '' }
        explain: { ja: '口頭相談だけでは記録が残らず、報告義務を果たしたことにならない。書面の速報が必要な場面。', en: '' }
        minutes: 60
        category: hurt
        points: -100
        refs: [ppc-report-scope]
        gauges: { flame: 10, trust: -10 }
        items:
          - { id: p05-c-record, points: -10, axis: record, refs: [ppc-report-scope] }
          - { id: p05-c-time, points: -8, axis: time, refs: [ppc-report-scope] }

  - id: p06-notify
    at: { day: 2, minutes: 600 }
    phase: notify
    sound: { se: [mail_arrive] }
    text: { ja: '午前10時。対象者への通知メールを送る段階。だが社内から「うちからのメールがフィッシングに見える」という声が出ている。', en: '' }
    lesson: { ja: '本人通知は経路を重ねる。メールだけでなくアプリ内通知や公式サイトにも同じ内容を出し、偽メールへの注意と相談窓口を添える。届かない人を前提に設計する。メールが届かない人への郵送も検討する。', en: '' }
    voices: [v06-expert, v06-popular, v06-ok]
    notable:
      - { id: note-targets, text: { ja: '本人通知の対象は、退会者と申込み途中の人を含む。', en: '' } }
    choices:
      - id: p06-mail-only
        text: { ja: '対象者にメールを一斉送信し、公式サイトへの掲載は特に行わない。', en: '' }
        explain: { ja: 'メール一本では届かない人や偽メールと誤解する人が出る。複数の経路と注意書きが欠けている。', en: '' }
        minutes: 90
        category: maintain
        points: 20
        refs: [ppc-notify-person]
        gauges: { trust: 5, stamina: -10 }
        detail: notify-mail
        items:
          - { id: p06-a-care, points: 3, axis: care, refs: [ppc-notify-person] }
          - { id: p06-a-content, points: 3, axis: content, refs: [ppc-notify-person] }
      - id: p06-none
