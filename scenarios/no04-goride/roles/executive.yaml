  - { id: v04-boss, media: boss, misleading: true, type: boss-pressure, text: { ja: '議事録は出さなくていい。今さら言っても混乱するだけだ。', en: '' }, trigger: { at: point } }
  - { id: v04-ok, media: chat, misleading: false, text: { ja: '総務「当時の議事録は、調査資料として保全しています」。', en: '' }, trigger: { at: point } }
  - { id: v04-after, media: sns, misleading: false, text: { ja: '今さら議事録を出して、責任逃れに見える。', en: '' }, trigger: { at: after, choice: p04-audit } }
  - { id: v05-law, media: board, misleading: true, type: law-ish, text: { ja: '千人未満なら報告はいらないでしょ。', en: '' }, trigger: { at: point } }
  - { id: v05-boss, media: boss, misleading: true, type: boss-pressure, text: { ja: '件数が確定するまで外には出すな。', en: '' }, trigger: { at: point } }
  - { id: v05-ok, media: chat, misleading: false, text: { ja: '法務「不正の目的のおそれがあれば、件数に関係なく速報の対象です」。', en: '' }, trigger: { at: point } }
  - { id: v06-expert, media: vendor, misleading: true, type: fake-expert, text: { ja: 'メールを送ると、フィッシングの練習台になりますよ。送らない方が安全です。', en: '' }, trigger: { at: point } }
  - { id: v06-popular, media: sns, misleading: true, type: popular, text: { ja: '他のプレイヤーの多くは、メールを送らず公表だけで済ませています。', en: '' }, trigger: { at: point } }
  - { id: v06-ok, media: chat, misleading: false, text: { ja: '顧客対応「本物の通知が届く前に、当社を名乗る偽メールの相談が来ています」。', en: '' }, trigger: { at: point } }
  - { id: v06-after, media: sns, misleading: false, text: { ja: '通知メールが来たが、偽物かと思って開かなかった。', en: '' }, trigger: { at: after, choice: p06-multi } }
  - { id: v07-bold, media: sns, misleading: true, type: bold-buzz, text: { ja: '社長、会見で「絶対に許さない」と言ってください。バズりますよ。', en: '' }, trigger: { at: point } }
