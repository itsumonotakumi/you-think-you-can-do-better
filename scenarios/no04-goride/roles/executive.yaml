          - { id: p13-c-content, points: 8, axis: content, refs: [nist-sp800-61r3] }
          - { id: p13-c-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: p13-c-care, points: 8, axis: care, refs: [ppc-notify-person] }

      - id: p13-rush
        text: { ja: '全面再開して監視を通常体制に戻し、再発の兆候は様子を見て判断する。', en: '' }
        explain: { ja: '未確認の端末が残る状態で全面再開すると、再侵入で再度止めることになる。監視の解除も早い。', en: '' }
        minutes: 120
        category: hurt
        points: -150
        refs: [nist-sp800-61r3]
        gauges: { damage: 20, flame: -10, trust: -10 }
        delayed:
          - { afterPhases: 1, points: -60, gauges: { damage: 15, flame: 15, trust: -15 }, reason: { ja: '再開後に別のサーバーで不審な通信が見つかり、再度停止した。', en: '' } }
        items:
          - { id: p13-a-time, points: -10, axis: time, refs: [nist-sp800-61r3] }
          - { id: p13-a-record, points: -10, axis: record, refs: [nist-sp800-61r3] }
          - { id: p13-a-care, points: -10, axis: care, refs: [ppc-notify-person] }
      - id: p13-step
        text: { ja: 'クリーンな環境から段階的に再開し、当面は監視を強化して様子を見る。', en: '' }
        explain: { ja: '段階再開と監視強化は妥当だが、検証結果の公開や再発時の補償の説明が欠けている点が惜しい。', en: '' }
        minutes: 240
        category: maintain
        points: 30
        refs: [nist-sp800-61r3]
        gauges: { damage: -10, stamina: -10, trust: 5 }
        items:
          - { id: p13-b-content, points: 8, axis: content, refs: [nist-sp800-61r3] }
          - { id: p13-b-record, points: 5, axis: record, refs: [nist-sp800-61r3] }
  - id: p14-stamina
    at: { day: 10, minutes: 540 }
    phase: organize
    sound: { se: [notify_chat] }
    text: { ja: '午前9時。対策本部は三日連続の徹夜。現場から「交代を入れないと持たない」という声が出ている。', en: '' }
    lesson: { ja: '長期戦では、休むことを計画に入れる。半日ごとの交代と引き継ぎ書を決め、外部の応援や問い合わせ窓口の増員も同時に手配する。根性論は確認漏れという形で跳ね返る。交代の予定を先に示す。', en: '' }
    voices: [v14-flattery, v14-public, v14-ok]
    choices:
      - id: p14-allnight
        text: { ja: '全員で最後まで走り抜く。ここで休むと対応の流れが切れると考えている。', en: '' }
        explain: { ja: '根性で乗り切る判断は、疲労による確認漏れを招く。交代を入れないと三日目に事故が起きる。', en: '' }
        minutes: 120
        category: hurt
        points: -30
        refs: [ipa-sme-guideline]
        gauges: { stamina: -20, damage: 10, trust: -5 }
        delayed:
          - { afterPhases: 2, points: -40, gauges: { stamina: -15, damage: 10 }, reason: { ja: '疲労から確認漏れが起き、復旧作業がやり直しになった。', en: '' } }
        items:
          - { id: p14-a-care, points: -10, axis: care, refs: [ipa-sme-guideline] }
          - { id: p14-a-care2, points: -8, axis: care, refs: [ipa-sme-guideline] }
      - id: p14-shift-care
        text: { ja: '交代制に加え、外部ヘルプデスクと問い合わせ窓口を増員し、社員のケアも案内する。', en: '' }
        explain: { ja: '交代制に加え、外部の応援と窓口増員、社員のケアまで用意した点が最も評価できる。総合点が高い。', en: '' }
        minutes: 150
        category: recover
        points: 100
        refs: [ipa-sme-guideline]
        gauges: { stamina: 15, trust: 10, flame: -5 }
        items:
          - { id: p14-c-care, points: 8, axis: care, refs: [ipa-sme-guideline] }
          - { id: p14-c-care2, points: 8, axis: care, refs: [ipa-sme-guideline] }
          - { id: p14-c-care3, points: 8, axis: care, refs: [ipa-sme-guideline] }

      - id: p14-shift
        text: { ja: '半日ごとの交代制を敷き、社長自身も休む時間を確保して記録を引き継ぐ。', en: '' }
        explain: { ja: '半日ごとの交代制を敷いた点は妥当。外部の応援や社員のケアまで踏み込めていない点が惜しい。', en: '' }
        minutes: 90
        category: maintain
        points: 20
        refs: [ipa-sme-guideline]
        gauges: { stamina: 10, trust: 5 }
        items:
          - { id: p14-b-care, points: 8, axis: care, refs: [ipa-sme-guideline] }
          - { id: p14-b-care2, points: 5, axis: care, refs: [ipa-sme-guideline] }
  - id: p15-blog
    at: { day: 14, minutes: 600 }
    phase: notify
    sound: { se: [notify_sns] }
    text: { ja: '午前10時。広報から「社長の個人アカウントで、今回の判断を書くか」と聞かれた。公式発表はすでに何度も出している。', en: '' }
    lesson: { ja: '経営者の個人発信は、公式発表と矛盾しないことが最優先。書くなら判断の理由と謝罪、現場への感謝に絞り、広報と法務の確認を取る。強い言葉で支持を集めても、説明が割れると信頼は戻らない。', en: '' }
    voices: [v15-bold, v15-flattery, v15-ok]
    choices:
      - id: p15-strong
        text: { ja: '個人アカウントで「免許証を売る連中を許さない」と強い言葉で発信する。', en: '' }
        explain: { ja: '強い言葉は一時的に支持を集めるが、公式発表と温度差が出て説明が分裂する。個人の感情的な発信は避ける。', en: '' }
        minutes: 30
        category: hurt
        points: -60
        refs: [meti-disclosure-guidance]
        gauges: { flame: -5, trust: -5 }
        delayed:
          - { afterPhases: 1, points: -30, gauges: { flame: 15 }, reason: { ja: '社長の投稿が公式発表より引用され、説明が分裂した。', en: '' } }
        items:
          - { id: p15-a-wording, points: -10, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: p15-a-order, points: -10, axis: order, refs: [meti-disclosure-guidance] }
      - id: p15-silent
        text: { ja: '個人での発信は控え、公式の会見と発表の内容に一本化する。', en: '' }
        explain: { ja: '公式に一本化した点は安全だが、社長自身の言葉で説明する機会を失っている。もったいない。', en: '' }
        minutes: 45
        category: maintain
        points: 20
        refs: [meti-disclosure-guidance]
        gauges: { trust: 5 }
        items:
          - { id: p15-b-order, points: 8, axis: order, refs: [meti-disclosure-guidance] }
          - { id: p15-b-wording, points: 5, axis: wording, refs: [meti-disclosure-guidance] }
      - id: p15-checked
        text: { ja: '個人で判断の理由と謝罪、現場への感謝を書き、広報と法務の確認を取る。', en: '' }
        explain: { ja: '個人の発信を公式と矛盾しない形にし、事前確認まで取った点が最も評価できる。安心して発信できる。', en: '' }
        minutes: 90
        category: recover
        points: 50
        refs: [meti-disclosure-guidance]
        gauges: { flame: -5, trust: 10, stamina: -5 }
        setFlags: { ceoBlog: true }
        items:
          - { id: p15-c-order, points: 8, axis: order, refs: [meti-disclosure-guidance] }
          - { id: p15-c-care, points: 8, axis: care, refs: [meti-disclosure-guidance] }
          - { id: p15-c-wording, points: 5, axis: wording, refs: [meti-disclosure-guidance] }

  - id: p16-report
    at: { day: 30, minutes: 600 }
    phase: after
    sound: { se: [notify_news] }
    text: { ja: '午前10時。第三者委員会の調査報告書が完成した。保存方針を決めた会議の議事録も、資料として添付されている。', en: '' }
    lesson: { ja: '調査報告書は、攻撃に使える詳細だけを伏せて公開する。何が起き、何を直し、いつまでに終えるかを示す。進捗を定期公開し、業界に教訓を共有すると、信頼は事件前以上になり得る。', en: '' }
    voices: [v16-expert, v16-law, v16-ok]
    choices:
      - id: p16-share
        text: { ja: '全文公開に加え、再発防止の進捗を毎月公開し、教訓を業界向けに無償で共有する。', en: '' }
        explain: { ja: '全文公開に加え、進捗の毎月公開と業界への共有まで行った点が最も評価できる。波及効果も大きい。', en: '' }
        minutes: 240
        category: increase
        points: 300
        fatalAlternate: 50
        refs: [meti-disclosure-guidance]
        gauges: { flame: -15, trust: 20, stamina: -15 }
        setFlags: { fullDisclosure: true, industryShare: true }
        items:
          - { id: p16-c-content, points: 8, axis: content, refs: [meti-disclosure-guidance] }
          - { id: p16-c-record, points: 8, axis: record, refs: [meti-disclosure-guidance] }
          - { id: p16-c-content2, points: 8, axis: content, refs: [meti-disclosure-guidance] }

      - id: p16-hide
        text: { ja: '報告書は公開せず、攻撃者に利用されるおそれがあるとして内容も伏せる。', en: '' }
        explain: { ja: '報告書を伏せると、何を直したのかが外から見えない。隠蔽と受け取られ、再発防止の信頼も得られない。', en: '' }
        minutes: 60
        category: hurt
        points: -150
        refs: [meti-disclosure-guidance]
        gauges: { flame: 15, trust: -15 }
        items:
          - { id: p16-a-content, points: -10, axis: content, refs: [meti-disclosure-guidance] }
          - { id: p16-a-wording, points: -10, axis: wording, refs: [meti-disclosure-guidance] }
      - id: p16-publish
        text: { ja: '攻撃に利用される部分だけを伏せて、調査報告書の全文をそのまま公開する。', en: '' }
        explain: { ja: '攻撃に使える部分だけ伏せて全文公開した点は妥当。再発防止の進捗まで見えるとさらに良い。', en: '' }
        minutes: 180
        category: recover
        points: 100
        refs: [meti-disclosure-guidance]
        gauges: { flame: -10, trust: 15, stamina: -10 }
        setFlags: { fullDisclosure: true }
        items:
          - { id: p16-b-content, points: 8, axis: content, refs: [meti-disclosure-guidance] }
          - { id: p16-b-record, points: 5, axis: record, refs: [meti-disclosure-guidance] }
  - id: p17-press
    at: { day: 31, minutes: 540 }
    phase: after
    sound: { se: [shutter] }
    text: { ja: '午前9時。記者会見を翌日に控え、広報が「質問は五問、二十分で終わらせたい」と言う。', en: '' }
    lesson: { ja: '会見の準備は、答える内容と順番を決めること。最初に被害者へ謝罪し、記録に基づく事実だけを答える。不明点は期限を決めて持ち帰る。質問を制限すると、隠していると受け取られる。', en: '' }
    voices: [v17-flattery, v17-coward, v17-ok]
    choices:
      - id: p17-short
        text: { ja: '会見を早めに打ち切り、質問の数と時間を制限して終わらせる。', en: '' }
        explain: { ja: '質問を制限すると、都合の悪いことを隠している印象を与える。会見の目的は説明であり、打ち切りではない。', en: '' }
        minutes: 45
        category: hurt
        points: -60
        refs: [meti-disclosure-guidance]
        gauges: { flame: 15, trust: -10 }
        items:
          - { id: p17-a-care, points: -10, axis: care, refs: [meti-disclosure-guidance] }
          - { id: p17-a-care2, points: -8, axis: care, refs: [meti-disclosure-guidance] }
      - id: p17-ready
        text: { ja: '記録を手元に置き、想定問答を全役員で確認し、最初に被害者への謝罪を述べる。', en: '' }
        explain: { ja: '記録と想定問答を準備し、最初に謝罪を述べた点が最も評価できる。会見の目的を理解している。', en: '' }
        minutes: 150
        category: recover
        points: 100
        refs: [meti-csm-guideline, jpcert-handling]
        gauges: { flame: -10, trust: 10, stamina: -10 }
        setFlags: { pressReady: true }
        detail: press-briefing
        items:
          - { id: p17-c-order, points: 8, axis: order, refs: [meti-csm-guideline] }
          - { id: p17-c-care, points: 8, axis: care, refs: [meti-disclosure-guidance] }
          - { id: p17-c-record, points: 8, axis: record, refs: [jpcert-handling] }

      - id: p17-facts
        text: { ja: '記録を手元に置き、事実だけを答え、不明点は「確認して回答する」と言う。', en: '' }
        explain: { ja: '記録に基づき事実だけを答え、不明点を持ち帰る姿勢は妥当。謝罪の順序が抜けている。', en: '' }
        minutes: 90
        category: maintain
        points: 30
        refs: [jpcert-handling]
        gauges: { trust: 5, stamina: -10 }
        items:
          - { id: p17-b-wording, points: 8, axis: wording, refs: [jpcert-handling] }
          - { id: p17-b-wording2, points: 8, axis: wording, refs: [meti-disclosure-guidance] }
drafts:
  first-report:
    title: { ja: '第1報の文案', en: '' }
    slots:
      - id: timing
        label: { ja: '出す時刻', en: '' }
        auto: true
        items:
          - { id: fd-t-24h, when: { withinHours: 24 }, points: 10, axis: time, refs: [ppc-report-prelim] }
          - { id: fd-t-72h, when: { withinHours: 72 }, points: 3, axis: time, refs: [ppc-report-prelim] }
          - { id: fd-t-late, when: { otherwise: true }, points: -15, axis: time, refs: [ppc-report-prelim] }
      - id: scope
        label: { ja: '対象範囲', en: '' }
        options:
          - { id: fd-s-all, text: { ja: '退会者と申込み途中の人も対象に含める', en: '' }, points: 10, axis: content, refs: [ppc-report-prelim], explain: { ja: '対象を広く取った点が適切。退会者や申込み途中の人を取りこぼすと、後の訂正と通知漏れにつながる。', en: '' } }
          - { id: fd-s-current, text: { ja: '現会員だけを対象として記載する', en: '' }, points: -20, axis: content, refs: [ppc-report-prelim], delayed: { afterPhases: 1, points: -10, reason: { ja: '対象の訂正が必要になった。', en: '' } }, explain: { ja: '現会員に限ると、退会者や申込み途中の人が漏れる。対象の訂正と追加通知が必要になり、信頼を損なう。', en: '' } }
      - id: dates
        label: { ja: '日時の書き方', en: '' }
        options:
          - { id: fd-d-merge, text: { ja: '発生と検知を同じ日時としてまとめて書く', en: '' }, points: -10, axis: wording, refs: [jpcert-handling], explain: { ja: '発生と検知をまとめると、いつ何が起きたかが曖昧になる。後の検証で説明が崩れやすい。', en: '' } }
          - { id: fd-d-split, text: { ja: '発生した日時と検知した日時を分けて書く', en: '' }, points: 5, axis: content, refs: [jpcert-handling], explain: { ja: '発生と検知の日時を分けた点が正確。時系列の誤解を防ぎ、初動の遅れも説明できる。有効だ。', en: '' } }
      - id: document
        label: { ja: '漏れた書類の書き方', en: '' }
        options:
          - { id: fd-doc-specific, text: { ja: '「運転免許証の画像」と具体的に書き示す', en: '' }, points: 8, axis: content, refs: [ppc-report-prelim], explain: { ja: '書類を特定して書いた点が適切。対象者が自分の何が漏れたか分かり、行動につなげられる。', en: '' } }
          - { id: fd-doc-vague, text: { ja: '「本人確認書類等」と種類をぼかして書く', en: '' }, points: -10, axis: content, refs: [ppc-report-prelim], explain: { ja: '書類の種類をぼかすと、対象者は何が漏れたか分からず、不安と問い合わせが増える。不親切だ。', en: '' } }
      - id: certainty
        label: { ja: '断定の強さ', en: '' }
        options:
          - { id: fd-c-split, text: { ja: '「可能性」と「確認」を状況に応じて使い分ける', en: '' }, points: 5, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: '「可能性」と「確認」を状況で使い分けた点が正確。後の情報更新でも説明の筋を保てる。', en: '' } }
          - { id: fd-c-confirm, text: { ja: 'すべて「漏えいを確認した」と断定して書く', en: '' }, points: -10, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: '未確認の段階まで断定すると、後で訂正が必要になり、発表全体への信頼が大きく下がる。', en: '' } }
          - { id: fd-c-none, text: { ja: '「漏えいはない」と否定する形で書く', en: '' }, points: -20, axis: wording, refs: [ppc-report-scope], explain: { ja: '漏えいを否定すると、事実が判明した時に虚偽発表になる。最も避けるべき書き方で、対象者も動けない。', en: '' } }
      - id: leaked
        label: { ja: '漏れた項目', en: '' }
        options:
          - { id: fd-l-specific, text: { ja: '免許証画像、氏名、生年月日、住所、利用履歴を具体的に列挙する', en: '' }, points: 10, axis: content, refs: [ppc-report-prelim], explain: { ja: '漏れた項目を列挙した点が適切。対象者が悪用のリスクを理解し、必要な行動を取りやすい。', en: '' } }
          - { id: fd-l-vague, text: { ja: '「顧客情報の一部が漏れた」とだけ書いて詳細は伏せる', en: '' }, points: -10, axis: content, refs: [ppc-report-prelim], explain: { ja: '項目を伏せると、対象者は何を警戒すべきか分からない。問い合わせが集中し、説明も長引く。', en: '' } }
      - id: action
        label: { ja: '利用者が今すぐすること', en: '' }
        options:
          - { id: fd-a-generic, text: { ja: '「ご注意ください」とだけ書いて、具体的な行動は示さない', en: '' }, points: -10, axis: care, refs: [ppc-notify-person], explain: { ja: '注意を促すだけでは、対象者は何をすればよいか分からない。具体的な手順と相談先が要る。', en: '' } }
          - { id: fd-a-concrete, text: { ja: 'パスワード変更、なりすましへの注意、警察相談を具体的に書く', en: '' }, points: 10, axis: care, refs: [ppc-notify-person], explain: { ja: '対象者が今すぐ取る行動を具体的に示した点が適切。二次被害を減らす最も実務的な部分。', en: '' } }
      - id: phishing
        label: { ja: '偽通知への注意', en: '' }
        options:
          - { id: fd-p-warn, text: { ja: '「当社が電話で免許証番号を聞くことはない」と明記する', en: '' }, points: 8, axis: care, refs: [ppc-notify-person], explain: { ja: '偽通知への注意を明記した点が適切。本物の通知を装う電話やメールから対象者を守れる。', en: '' } }
          - { id: fd-p-none, text: { ja: '偽通知への注意は書かず、本文の案内だけにする', en: '' }, points: -10, axis: care, refs: [ppc-notify-person], explain: { ja: '偽通知への注意がないと、対象者が本物と誤認して番号を伝える事故が起きる。注意書きが要る。', en: '' } }
      - id: contact
        label: { ja: '問い合わせ窓口', en: '' }
        options:
          - { id: fd-w-number, text: { ja: '窓口の電話番号だけを書いて、受付時間は示さない', en: '' }, points: -5, axis: care, refs: [meti-csm-guideline], explain: { ja: '番号だけでは、いつつながるか分からず不安が残る。受付時間と体制、担当の説明が要る。', en: '' } }
          - { id: fd-w-hours, text: { ja: '専用窓口の番号と受付時間、増員の体制を書く', en: '' }, points: 8, axis: care, refs: [meti-csm-guideline], explain: { ja: '番号と受付時間、増員まで書いた点が適切。問い合わせが集中しても対応できる体制を示せる。', en: '' } }
          - { id: fd-w-none, text: { ja: '問い合わせ先も受付時間も書かず、案内を省く', en: '' }, points: -15, axis: care, refs: [meti-csm-guideline], explain: { ja: '問い合わせ先を示さないと、対象者は相談先を失い、不満がSNSや訴訟へと向かう。窓口は必須。', en: '' } }
      - id: next
        label: { ja: '次の報告', en: '' }
        options:
          - { id: fd-n-next, text: { ja: '次の報告の予定日と内容を書く', en: '' }, points: 3, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '次の報告予定を示した点が適切。情報が増える前提を伝え、説明の継続を約束できる。安心につながる。', en: '' } }
          - { id: fd-n-none, text: { ja: '次回の報告予定は書かずに終える', en: '' }, points: -5, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '次回の予定がないと、対象者は情報が止まったと受け取る。継続的な説明と連絡が必要。', en: '' } }
      - id: apology
        label: { ja: '謝罪の主語', en: '' }
        options:
          - { id: fd-ap-vendor, text: { ja: '「委託先」の責任として謝罪し、自社の関与を伏せる', en: '' }, points: -10, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: '委託先の責任として謝罪すると、自社の管理責任が抜け落ちる。共同調査の前から責任を押し付けるのは危うい。', en: '' } }
          - { id: fd-ap-company, text: { ja: '「当社」として責任を持って謝罪し、原因の説明を添える', en: '' }, points: 3, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: '自社の責任として謝罪した点が適切。委託先に押し付けると、説明責任を放棄したと見られる。', en: '' } }
      - id: excuse
        label: { ja: '前置き', en: '' }
        options:
          - { id: fd-e-none, text: { ja: '前置きの言い訳は書かず、事実から始める', en: '' }, points: 5, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: '前置きの言い訳を置かず事実から始めた点が適切。読み手の反発を招かず、説明に集中できる。', en: '' } }
          - { id: fd-e-advanced, text: { ja: '「高度な攻撃により」と前置きして原因をぼかす', en: '' }, points: -10, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: '「高度な攻撃」を前置きにすると、自社の落ち度から目を逸らす印象を与え、反発を招く。', en: '' } }
      - id: approval
        label: { ja: '社内確認', en: '' }
        options:
          - { id: fd-i-solo, text: { ja: '社長の判断だけで文案を確定して公表する', en: '' }, points: -10, axis: order, refs: [meti-csm-guideline], explain: { ja: '社長の一存で出すと、法務の確認や親会社との整合が抜ける。後の訂正と批判を招く。確認の場が要る。', en: '' } }
          - { id: fd-i-share, text: { ja: '公表前に広報、法務、親会社のIRで文案を確認する', en: '' }, points: 5, axis: order, refs: [meti-csm-guideline], explain: { ja: '関係部署と親会社の確認を取った点が適切。説明の食い違いと法的な抜けを防げる。公表の質が上がる。', en: '' } }
      - id: record
        label: { ja: '記録', en: '' }
        options:
          - { id: fd-r-log, text: { ja: '公表した時刻と版、確認した相手を記録する', en: '' }, points: 5, axis: record, refs: [jpcert-handling], explain: { ja: '時刻と版を残した点が適切。後から説明の変遷をたどれ、訂正の範囲も明確になる。検証にも耐える。', en: '' } }
          - { id: fd-r-none, text: { ja: '公表の記録は残さず、口頭の確認だけにする', en: '' }, points: -8, axis: record, refs: [jpcert-handling], explain: { ja: '記録がないと、いつ何を公表したか説明できない。訂正や検証の場面で不利になる。残すべきだ。', en: '' } }
  notify-mail:
    title: { ja: '本人通知メールの文案', en: '' }
    slots:
      - id: sender
        label: { ja: '送信元', en: '' }
        options:
          - { id: nm-sender-vendor, text: { ja: '本人確認の委託先のドメインから送信する', en: '' }, points: -10, axis: order, refs: [ppc-notify-person], explain: { ja: '委託先のドメインから送ると、本物かどうか判断しづらく、偽メールと誤解される。公式を使うべき。', en: '' } }
          - { id: nm-sender-official, text: { ja: '自社の公式ドメインから送信する', en: '' }, points: 8, axis: order, refs: [ppc-notify-person], explain: { ja: '公式ドメインから送った点が適切。なりすましと区別でき、受信者の警戒を減らせる。開封率も上がる。', en: '' } }
      - id: subject
        label: { ja: '件名', en: '' }
        options:
          - { id: nm-subject-calm, text: { ja: '「重要なお知らせ」と落ち着いた件名にする', en: '' }, points: 5, axis: wording, refs: [ppc-notify-person], explain: { ja: '落ち着いた件名にした点が適切。不安をあおらず、本文を読んでもらいやすい。開封につながる。', en: '' } }
          - { id: nm-subject-alarm, text: { ja: '「緊急」とだけ書いて開封を急がせる', en: '' }, points: -5, axis: wording, refs: [ppc-notify-person], explain: { ja: '「緊急」だけの件名は、偽メールと区別がつかず、開封されないおそれがある。内容を示すべき。', en: '' } }
      - id: targets
        label: { ja: '対象', en: '' }
        options:
          - { id: nm-target-current, text: { ja: '現会員だけを対象として送信する', en: '' }, points: -20, axis: content, refs: [ppc-notify-person], delayed: { afterPhases: 1, points: -15, reason: { ja: '退会者から「通知が来ていない」と相談が相次いだ。', en: '' } }, explain: { ja: '現会員だけでは、退会者や申込み途中の人に通知が届かない。二次被害と強い批判を招く。', en: '' } }
          - { id: nm-target-all, text: { ja: '退会者と申込み途中の人も対象に含める', en: '' }, points: 10, axis: content, refs: [ppc-notify-person], explain: { ja: '退会者と申込み途中まで含めた点が適切。保存されていた人全員に届けなければ意味がない。', en: '' } }
      - id: action
        label: { ja: '利用者がすること', en: '' }
        options:
          - { id: nm-action-concrete, text: { ja: 'パスワード変更と警察への相談を具体的に書く', en: '' }, points: 10, axis: care, refs: [ppc-notify-person], explain: { ja: '取るべき行動を具体的に書いた点が適切。対象者が迷わず動け、二次被害を減らせる。手順が要る。', en: '' } }
          - { id: nm-action-generic, text: { ja: '「ご注意ください」とだけ書いて具体策を省く', en: '' }, points: -8, axis: care, refs: [ppc-notify-person], explain: { ja: '注意を促すだけでは行動に結びつかない。変更や相談の具体的な手順まで書く必要がある。', en: '' } }
      - id: phishing
        label: { ja: '偽メールへの注意', en: '' }
        options:
          - { id: nm-phish-none, text: { ja: '偽メールへの注意は書かず、本文だけにする', en: '' }, points: -10, axis: care, refs: [ppc-notify-person], explain: { ja: '注意がないと、対象者が偽メールに免許証番号を伝えてしまうおそれがある。危険が高い。', en: '' } }
          - { id: nm-phish-warn, text: { ja: '「当社が電話で免許証番号を聞くことはない」と明記する', en: '' }, points: 8, axis: care, refs: [ppc-notify-person], explain: { ja: '偽メールへの注意を入れた点が適切。本物を装う連絡から対象者を守れる。必要な一文。', en: '' } }
      - id: contact
        label: { ja: '問い合わせ窓口', en: '' }
        options:
          - { id: nm-contact-hours, text: { ja: '専用窓口の番号と受付時間、担当を書く', en: '' }, points: 8, axis: care, refs: [meti-csm-guideline], explain: { ja: '窓口と受付時間を示した点が適切。問い合わせが集中しても対応の見通しを伝えられる。', en: '' } }
          - { id: nm-contact-none, text: { ja: '問い合わせ先を書かずに送信する', en: '' }, points: -15, axis: care, refs: [meti-csm-guideline], explain: { ja: '問い合わせ窓口がないと、対象者は相談できず、不安がSNSや苦情、訴訟に変わる。窓口は必須。', en: '' } }
      - id: apology
        label: { ja: '謝罪', en: '' }
        options:
          - { id: nm-apology-none, text: { ja: '謝罪の言葉は書かず、事実だけを伝える', en: '' }, points: -5, axis: wording, refs: [ppc-notify-person], explain: { ja: '謝罪がないと、通知が事務的で無責任に見える。事実だけでなく気持ちも伝える。一文が要る。', en: '' } }
          - { id: nm-apology-company, text: { ja: '「当社」として責任を持って謝罪する', en: '' }, points: 3, axis: wording, refs: [ppc-notify-person], explain: { ja: '自社として謝罪した点が適切。通知の目的は事実の伝達だけでなく、関係の維持でもある。', en: '' } }
      - id: next
        label: { ja: '次の連絡', en: '' }
        options:
          - { id: nm-next-plan, text: { ja: '次回の連絡予定と内容を書く', en: '' }, points: 3, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '次の連絡予定を示した点が適切。情報が増える前提を伝え、問い合わせを減らせる。安心も生む。', en: '' } }
          - { id: nm-next-none, text: { ja: '次回の連絡予定は書かない', en: '' }, points: -5, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '次回の予定がないと、対象者は情報が止まったと受け取る。継続的な連絡が必要。予定を示す。', en: '' } }
  press-briefing:
    title: { ja: '記者会見の想定問答', en: '' }
    slots:
      - id: opening
        label: { ja: '最初に述べること', en: '' }
        options:
          - { id: pb-open-company, text: { ja: '会社の事業説明から始めて謝罪は後にする', en: '' }, points: -10, axis: care, refs: [meti-csm-guideline], explain: { ja: '会社の説明から入ると、謝罪が後回しになり、誠意がないと受け取られる。順番が重要。', en: '' } }
          - { id: pb-open-apology, text: { ja: '会見の最初に被害者への謝罪を述べる', en: '' }, points: 8, axis: care, refs: [meti-csm-guideline], explain: { ja: '会見の最初に被害者への謝罪を置いた点が適切。会見の目的が説明だと伝わる。信頼の入口になる。', en: '' } }
      - id: facts
        label: { ja: '事実の示し方', en: '' }
        options:
          - { id: pb-facts-record, text: { ja: '記録に基づく時刻と件数を示す', en: '' }, points: 8, axis: content, refs: [jpcert-handling], explain: { ja: '記録に基づいて答えた点が適切。数字の食い違いを防ぎ、後から検証できる。説得力も上がる。', en: '' } }
          - { id: pb-facts-memory, text: { ja: '記憶を頼りにその場で件数を答える', en: '' }, points: -10, axis: record, refs: [jpcert-handling], explain: { ja: '記憶で答えると、数字が食い違い、発表全体の信用を落とす。記録を見て答えるべき。確認が先。', en: '' } }
      - id: unknown
        label: { ja: '分からないこと', en: '' }
        options:
          - { id: pb-unknown-guess, text: { ja: 'その場の推測で、足りない答えを埋める', en: '' }, points: -10, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: 'その場の推測で答えると、後で事実と違い、訂正が重なる。分からないことは分からないと言う。', en: '' } }
          - { id: pb-unknown-hold, text: { ja: '不明点は「確認して回答する」と伝える', en: '' }, points: 8, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: '不明点を持ち帰ると明言した点が適切。曖昧な推測を避け、後で正確に答えられる。信頼を保てる。', en: '' } }
      - id: apology
        label: { ja: '謝罪の主語', en: '' }
        options:
          - { id: pb-ap-company, text: { ja: '「当社」として責任を持って謝罪し、原因も説明する', en: '' }, points: 3, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: '自社の責任として謝罪した点が適切。委託先に原因を寄せても、管理責任は残る。姿勢を示す。', en: '' } }
          - { id: pb-ap-vendor, text: { ja: '「委託先」の責任として説明し、自社の関与を伏せる', en: '' }, points: -10, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: '委託先の責任として説明すると、自社の管理責任が抜け落ちる。会見では特に印象が悪い。', en: '' } }
      - id: scope
        label: { ja: '対象範囲', en: '' }
        options:
          - { id: pb-scope-current, text: { ja: '現会員だけが対象だと説明して範囲を狭める', en: '' }, points: -10, axis: content, refs: [ppc-report-prelim], explain: { ja: '現会員に限ると説明すると、退会者の存在が後から出て訂正になる。範囲は広く取りたい。', en: '' } }
          - { id: pb-scope-all, text: { ja: '退会者と申込み途中の人も含むと明言する', en: '' }, points: 8, axis: content, refs: [ppc-report-prelim], explain: { ja: '対象を広く明言した点が適切。後から対象が増えた時の説明のずれを防げる。訂正も減る。', en: '' } }
      - id: compensation
        label: { ja: '補償の説明', en: '' }
        options:
          - { id: pb-money-basis, text: { ja: '補償の対象と根拠を説明する', en: '' }, points: 8, axis: care, refs: [ppc-notify-person], explain: { ja: '対象と根拠を示した点が適切。金額の妥当性を理解してもらい、追加の請求にも答えられる。', en: '' } }
          - { id: pb-money-flat, text: { ja: '金額だけを伝えて根拠は説明しない', en: '' }, points: -8, axis: care, refs: [ppc-notify-person], explain: { ja: '金額だけでは根拠が分からず、不満と追加の請求を招く。対象と算定の考え方を示すべき。', en: '' } }
      - id: next
        label: { ja: '次の報告', en: '' }
        options:
          - { id: pb-next-none, text: { ja: '次回の報告予定は約束しない', en: '' }, points: -5, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '次回の予定がないと、説明が途切れた印象を与える。継続的な報告が必要。約束が要る。', en: '' } }
          - { id: pb-next-plan, text: { ja: '次回の報告予定と内容を約束する', en: '' }, points: 3, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '次の報告を約束した点が適切。会見で終わらせず、説明を続ける姿勢を示せる。継続が信頼。', en: '' } }
      - id: record
        label: { ja: '会見の記録', en: '' }
        options:
          - { id: pb-record-log, text: { ja: '会見の時刻と質問、回答を記録する', en: '' }, points: 5, axis: record, refs: [jpcert-handling], explain: { ja: '会見の時刻と質問、回答を記録した点が適切。後から発言の確認ができ、訂正も正確にできる。', en: '' } }
          - { id: pb-record-none, text: { ja: '会見の記録は残さず、口頭のみにする', en: '' }, points: -8, axis: record, refs: [jpcert-handling], explain: { ja: '会見の記録がないと、発言の確認ができず、訂正の範囲も曖昧になる。記録は必須である。', en: '' } }
voices:
  - { id: v01-boss, media: boss, misleading: true, type: boss-pressure, text: { ja: '役員会議が終わるまで、外には出さないでくれ。まだ何も分かっていない。', en: '' }, trigger: { at: point } }
  - { id: v01-public, media: sns, misleading: true, type: public-opinion, text: { ja: 'また大手か。原因が分かるまで黙っていたほうがいい。', en: '' }, trigger: { at: point } }
