# No.4 ゴーライド / 経営者ロール
# 判断ポイント17、細目は choices[].items と drafts の合計で80以上。
estimateMinutes: 30
intro: { ja: 'あなたはゴーライドの代表取締役社長。カーシェアの予約も解錠も、このアプリで動いている。午前9時の電話から、あなたの判断が始まる。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-ppc-prelim
    ref: ppc-report-prelim
    label: { ja: '個人情報保護委員会への速報', en: '' }
    points: -150
    doneFlag: ppcPrelimFiled
events:
  - id: ev-client-inquiry
    at: { day: 1, minutes: 720 }
    voices: [v-ev-client]
    gauges: { flame: 5 }
    sound: { se: [phone_ring] }
    caption: { ja: '主要取引先から問い合わせが相次いでいる。', en: '' }
  - id: ev-news
    at: { day: 3, minutes: 720 }
    voices: [v-ev-news]
    gauges: { flame: 8 }
    sound: { se: [notify_news] }
    caption: { ja: 'ニュースが「退会者の免許証画像が残っていた」と報じた。', en: '' }
  - id: ev-darkweb
    at: { day: 5, minutes: 1320 }
    voices: [v-ev-darkweb]
    gauges: { flame: 10 }
    sound: { se: [notify_news] }
    caption: { ja: 'ダークウェブで免許証画像が売られているという情報が入った。', en: '' }
points:
  - id: p01-call
    at: { day: 0, minutes: 540 }
    phase: detect
    sound: { se: [phone_ring] }
    text: { ja: '午前9時。役員会議の最中に、サービス運用本部長から電話が入る。「アプリのデータベースに外部からアクセスされた形跡があります。免許証の画像が持ち出された可能性があります」。', en: '' }
    voices: [v01-boss, v01-public, v01-ok]
    notable:
      - { id: note-first-call, text: { ja: '午前9時、アプリのデータベースへの不正アクセスを検知。免許証画像が対象の可能性。', en: '' } }
    choices:
      - id: p01-wait
        text: { ja: '詳細が揃うまで役員会議を続け、夕方に改めて報告を受ける。', en: '' }
        minutes: 120
        category: hurt
        points: -150
        refs: [meti-csm-guideline]
        gauges: { flame: -5, trust: -5, stamina: 5 }
        coward: true
        setFlags: { delayedCommand: true }
        delayed:
          - { afterPhases: 1, points: -40, gauges: { flame: 15, trust: -10 }, reason: { ja: 'その日のうちも不正アクセスが続き、翌朝には炎上した。', en: '' } }
        items:
          - { id: p01-a-time, points: -10, axis: time, refs: [meti-csm-guideline] }
          - { id: p01-a-order, points: -8, axis: order, refs: [jpcert-handling] }
      - id: p01-command
        text: { ja: '対策本部を立ち上げ、封じ込めの権限を運用本部長に委譲し、外部の調査会社と弁護士に連絡する。', en: '' }
        minutes: 30
        category: maintain
        points: 20
        refs: [meti-csm-guideline]
        gauges: { flame: -5, trust: 5, stamina: -5 }
        setFlags: { commandStarted: true }
        items:
          - { id: p01-b-time, points: 5, axis: time, refs: [meti-csm-guideline] }
          - { id: p01-b-order, points: 5, axis: order, refs: [meti-csm-guideline] }
          - { id: p01-b-record, points: 5, axis: record, refs: [jpcert-handling] }
      - id: p01-self
        text: { ja: '自分でサーバー室に行き、ログを直接確かめる。', en: '' }
        minutes: 60
        category: hurt
        points: -50
        refs: [jpcert-handling]
        gauges: { stamina: -10, trust: -5 }
        items:
          - { id: p01-c-order, points: -10, axis: order, refs: [jpcert-handling] }
          - { id: p01-c-care, points: -5, axis: care, refs: [meti-csm-guideline] }

  - id: p02-stop
    at: { day: 0, minutes: 660 }
    phase: contain
    sound: { se: [phone_ring, notify_sns] }
    text: { ja: '午前11時。アプリの予約と解錠が動いている。止めれば全国の車が借りられなくなる。止めなければ、免許証画像がさらに持ち出されるおそれがある。', en: '' }
    voices: [v02-public, v02-field, v02-ok]
    popular: { choiceId: p02-stop-notice, percent: 44 }
    choices:
      - id: p02-partial
        text: { ja: '被害が確認された機能だけ止める。', en: '' }
        minutes: 60
        category: hurt
        points: -100
        refs: [nist-sp800-61r3]
        gauges: { damage: 20, flame: 5 }
        delayed:
          - { afterPhases: 1, points: -60, gauges: { damage: 15, trust: -10 }, reason: { ja: '止めなかった機能からも不正アクセスが続いた。', en: '' } }
        items:
          - { id: p02-a-content, points: -10, axis: content, refs: [nist-sp800-61r3] }
          - { id: p02-a-record, points: 3, axis: record, refs: [nist-sp800-61r3] }
      - id: p02-stop-notice
        text: { ja: '予約と解錠を全面停止し、停止の理由だけを告知する。', en: '' }
        minutes: 90
        category: maintain
        points: 20
        refs: [meti-disclosure-guidance]
        gauges: { flame: 15, damage: -20, stamina: -10 }
        setFlags: { contained: true, transparentStop: true }
        items:
          - { id: p02-b-content, points: 5, axis: content, refs: [meti-disclosure-guidance] }
          - { id: p02-b-care, points: -5, axis: care, refs: [ppc-notify-person] }
      - id: p02-stop-guide
        text: { ja: '全面停止し、利用者が今すぐすべきこと（パスワード変更、免許証画像の悪用への注意、警察の相談窓口）を同時に具体的に告知する。', en: '' }
        minutes: 120
        category: recover
        points: 100
        refs: [ppc-notify-person]
        gauges: { flame: 10, damage: -30, trust: 10, stamina: -15 }
        setFlags: { contained: true, transparentStop: true, customerGuidance: true }
        items:
          - { id: p02-c-time, points: 5, axis: time, refs: [meti-disclosure-guidance] }
          - { id: p02-c-care, points: 10, axis: care, refs: [ppc-notify-person] }
          - { id: p02-c-content, points: 5, axis: content, refs: [meti-disclosure-guidance] }
          - { id: p02-c-next, points: 3, axis: content, refs: [meti-disclosure-guidance] }
      - id: p02-maintenance
        text: { ja: '全面停止するが、告知は「システムメンテナンス」と書く。', en: '' }
        minutes: 90
        category: fatal
        points: -250
        refs: [ppc-report-scope]
        gauges: { flame: -15, damage: 10, trust: -20 }
        setFlags: { hidFacts: true }
        delayed:
          - { afterPhases: 2, points: -100, gauges: { flame: 40, trust: -20 }, reason: { ja: '不正アクセスだったことが報道で判明し、隠蔽と批判された。', en: '' } }
        items:
          - { id: p02-d-wording, points: -20, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: p02-d-wording2, points: -10, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: p02-d-record, points: -10, axis: record, refs: [jpcert-handling] }

