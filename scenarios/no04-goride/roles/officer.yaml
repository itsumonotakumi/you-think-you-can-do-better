          - { id: o03-b-order, points: 5, axis: order, refs: [jpcert-handling] }
      - id: o03-preserve
        text: { ja: '外部の調査会社に引き継ぎ、証拠保全の手順を文書化する。削除は調査が終わってからにする。', en: '' }
        minutes: 150
        category: recover
        points: 120
        refs: [nist-sp800-61r3, jpcert-handling]
        gauges: { damage: -10, trust: 10, stamina: -10 }
        setFlags: { evidenceKept: true, forensics: true }
        items:
          - { id: o03-c-record, points: 10, axis: record, refs: [nist-sp800-61r3] }
          - { id: o03-c-order, points: 8, axis: order, refs: [jpcert-handling] }
          - { id: o03-c-content, points: 5, axis: content, refs: [nist-sp800-61r3] }
          - { id: o03-c-care, points: 5, axis: care, refs: [meti-csm-guideline] }

