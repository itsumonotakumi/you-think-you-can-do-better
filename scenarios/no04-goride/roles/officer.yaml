        text: { ja: '共有フォルダごと削除して、被害の範囲を狭める。', en: '' }
        minutes: 60
        category: fatal
        points: -250
        refs: [nist-sp800-61r3]
        gauges: { flame: 20, damage: 10, trust: -20 }
        setFlags: { destroyedEvidence: true }
        delayed:
          - { afterPhases: 2, points: -100, gauges: { damage: 15, trust: -20 }, reason: { ja: '証拠が消え、どの画像が漏れたか分からなくなった。', en: '' } }
        items:
          - { id: o03-a-record, points: -20, axis: record, refs: [nist-sp800-61r3] }
          - { id: o03-a-content, points: -15, axis: content, refs: [nist-sp800-61r3] }
          - { id: o03-a-order, points: -10, axis: order, refs: [jpcert-handling] }
