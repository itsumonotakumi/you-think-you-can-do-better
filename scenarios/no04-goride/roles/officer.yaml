# No.4 ゴーライド / 役員・グループ会社社長ロール
# プレイヤーはゴーライドの執行役員で、グループ会社ゴーライド・モビリティサービスの社長を兼務する。
# 自社には専任のセキュリティ部署がなく、情報システムは経理部の兼任、技術調査は外部に頼る。
# 親会社（上場企業の子会社）への報告、店舗と法人契約の業務継続、部下を守る判断を扱う。
# 判断ポイント16、細目は choices[].items と drafts の合計で80以上。
estimateMinutes: 35
intro: { ja: 'あなたはゴーライドの執行役員で、グループ会社ゴーライド・モビリティサービスの代表取締役社長を兼務している。レンタカー店舗と法人向けの長期貸出を預かり、グループ共通の予約アプリを使っている。専任のセキュリティ部署はない。情報システムは経理部の兼任が二人で、技術の調査は外部に頼るしかない。午前9時15分、店舗から電話が入る。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-group-prelim
    ref: ppc-report-prelim
    label: { ja: '自社分を含む漏えい等報告（速報）', en: '' }
    points: -150
    doneFlag: ppcPrelimFiled
events:
  - id: ev-client-call
    at: { day: 1, minutes: 720 }
    voices: [v-ev-client]
    gauges: { flame: 5 }
    sound: { se: [phone_ring] }
    caption: { ja: '法人契約先から、ドライバーの免許証画像の扱いについて問い合わせが相次いでいる。', en: '' }
  - id: ev-news
    at: { day: 3, minutes: 720 }
    voices: [v-ev-news]
    gauges: { flame: 8 }
    sound: { se: [notify_news] }
    caption: { ja: 'ニュースが「退会者の免許証画像が残っていた」と報じた。', en: '' }
  - id: ev-staff-fatigue
    at: { day: 8, minutes: 1080 }
    voices: [v-ev-staff]
    gauges: { flame: 5 }
    sound: { se: [notify_chat] }
    caption: { ja: '店舗スタッフの疲労が限界に近づいている。', en: '' }
points:
  - id: o01-group-call
    at: { day: 0, minutes: 555 }
    phase: detect
    sound: { se: [phone_ring] }
    text: { ja: '午前9時15分。本社の役員会議に入った直後、店舗運用部長から電話が入る。「グループ共通の予約アプリのデータベースに、外部からアクセスされた形跡があります。店舗で預かった免許証の画像も、同じ場所に保存されていました」。自社に専任のセキュリティ部署はない。', en: '' }
    voices: [v01-parent, v01-public, v01-ok]
    notable:
      - { id: note-first-call, text: { ja: '午前9時15分、グループ共通アプリへの不正アクセスを把握。店舗で預かった免許証画像も同じ保存場所にあった。', en: '' } }
    choices:
      - id: o01-wait
        text: { ja: '本社の指示を待ち、店舗の営業は通常どおり続ける。', en: '' }
        minutes: 120
        category: hurt
        points: -100
        refs: [meti-csm-guideline]
        gauges: { flame: -5, trust: -5, stamina: 5 }
        coward: true
        setFlags: { delayedCommand: true }
        delayed:
          - { afterPhases: 1, points: -40, gauges: { flame: 15, trust: -10 }, reason: { ja: 'その日のうちに店舗の問い合わせが殺到し、翌朝には炎上した。', en: '' } }
        items:
          - { id: o01-a-time, points: -10, axis: time, refs: [meti-csm-guideline] }
          - { id: o01-a-order, points: -8, axis: order, refs: [jpcert-handling] }
      - id: o01-own
        text: { ja: '自社の対策会議を開き、預かり画像の所在を確認する。外部の調査会社と弁護士に連絡し、本社にも同時に第一報を入れる。', en: '' }
        minutes: 60
        category: maintain
        points: 20
        refs: [meti-csm-guideline]
        gauges: { flame: -5, trust: 5, stamina: -5 }
        setFlags: { groupTaskForce: true }
        items:
          - { id: o01-b-time, points: 5, axis: time, refs: [meti-csm-guideline] }
          - { id: o01-b-order, points: 5, axis: order, refs: [meti-csm-guideline] }
          - { id: o01-b-record, points: 5, axis: record, refs: [jpcert-handling] }
      - id: o01-self
        text: { ja: '自分で店舗の端末を確認しに行き、現場の対応を直接見る。', en: '' }
        minutes: 90
        category: hurt
        points: -60
        refs: [jpcert-handling]
        gauges: { stamina: -10, trust: -5 }
        items:
          - { id: o01-c-order, points: -10, axis: order, refs: [jpcert-handling] }
          - { id: o01-c-record, points: -10, axis: record, refs: [nist-sp800-61r3] }
          - { id: o01-c-care, points: -5, axis: care, refs: [ipa-sme-guideline] }

  - id: o02-store-stop
