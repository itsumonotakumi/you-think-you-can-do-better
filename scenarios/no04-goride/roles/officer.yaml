    phase: contain
    sound: { se: [notify_chat] }
    text: { ja: '午後2時。グループの調査担当から「店舗のスキャン画像の原本は、自社のファイルサーバーにも残っています。消しますか」と聞かれた。消せば被害は減るが、何が漏れたか分からなくなる。', en: '' }
