    sound: { se: [notify_chat] }
    text: { ja: '午後1時。本社から「退会者や申込み途中の人の免許証画像を、なぜ残していたのか」と聞かれた。2023年の会議で「再入会のときに本人確認が楽になる」と提案したのは、あなただった。', en: '' }
