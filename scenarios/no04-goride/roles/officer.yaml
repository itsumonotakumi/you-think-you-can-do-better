    voices: [v02-flattery, v02-public, v02-expert, v02-ok]
    popular: { choiceId: o02-partial, percent: 45 }
    choices:
      - id: o02-continue
        text: { ja: '通常営業を続け、グループの復旧を待つ。', en: '' }
        minutes: 90
        category: hurt
        points: -120
        refs: [nist-sp800-61r3]
        gauges: { damage: 15, flame: 5 }
        delayed:
          - { afterPhases: 1, points: -60, gauges: { damage: 15, trust: -10 }, reason: { ja: '止めなかった店舗からも画像の持ち出しが続いた。', en: '' } }
        items:
          - { id: o02-a-content, points: -10, axis: content, refs: [nist-sp800-61r3] }
          - { id: o02-a-care, points: -10, axis: care, refs: [ppc-notify-person] }
          - { id: o02-a-record, points: -5, axis: record, refs: [jpcert-handling] }
      - id: o02-partial
        text: { ja: '新しい免許証画像の取り込みと、アプリ経由の予約だけを止める。対面の貸出は続ける。', en: '' }
        minutes: 60
        category: maintain
        points: 20
        refs: [nist-sp800-61r3]
        gauges: { damage: -10, flame: 5, trust: 5, stamina: -10 }
        setFlags: { containedIngest: true }
        items:
          - { id: o02-b-content, points: 8, axis: content, refs: [nist-sp800-61r3] }
          - { id: o02-b-order, points: 5, axis: order, refs: [jpcert-handling] }
          - { id: o02-b-record, points: 5, axis: record, refs: [jpcert-handling] }
      - id: o02-stop-all
        text: { ja: '自社の全店舗の貸出を止め、代替の車と返却方法を案内する。グループの封じ込めが終わるまで再開しない。', en: '' }
        minutes: 120
        category: recover
        points: 100
        refs: [meti-disclosure-guidance]
        gauges: { flame: 15, damage: -20, trust: 5, stamina: -10 }
        setFlags: { contained: true, alternativeTransport: true }
        items:
          - { id: o02-c-care, points: 10, axis: care, refs: [meti-disclosure-guidance] }
          - { id: o02-c-content, points: 8, axis: content, refs: [meti-disclosure-guidance] }
          - { id: o02-c-order, points: 5, axis: order, refs: [nist-sp800-61r3] }

