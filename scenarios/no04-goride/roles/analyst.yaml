        category: recover
        points: 80
        refs: [nist-sp800-61r3, jpcert-handling]
        gauges: { damage: -5, trust: 5, stamina: -5 }
        setFlags: { isolateStart: true }
        items:
          - { id: a01-c-time, points: 5, axis: time, refs: [jpcert-handling] }
          - { id: a01-c-order, points: 5, axis: order, refs: [nist-sp800-61r3] }
          - { id: a01-c-record, points: 5, axis: record, refs: [jpcert-handling] }
          - { id: a01-c-content, points: 5, axis: content, refs: [nist-sp800-61r3] }
