# No.4 ゴーライド / セキュリティ担当者ロール
# 見えるのは、監視画面のアラート、ログ、端末、現場からのチャット。
# 専任のSOCはなく、情報システム部セキュリティ課の四人で回している。
# 判断ポイント18、細目は choices[].items と drafts の合計で80以上。
estimateMinutes: 35
intro: { ja: 'あなたはゴーライドの情報システム部セキュリティ課の担当者。課は四人で、上は執行役員の八木さん。監視画面のアラート、ログ、現場からのチャットが、あなたの持ち場だ。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-ppc-prelim
    ref: ppc-report-prelim
    label: { ja: '速報の材料提出', en: '' }
    points: -150
    doneFlag: ppcPrelimReady
  - id: dl-ppc-final
    ref: ppc-report-final-malicious
    label: { ja: '確報の材料提出', en: '' }
    points: -120
    doneFlag: finalReportReady
events:
  - id: ev-night
    at: { day: 1, minutes: 120 }
    voices: [v-ev-night]
    gauges: { stamina: -5 }
    sound: { se: [notify_chat] }
    caption: { ja: '深夜。監視画面のアラートが鳴り続けている。', en: '' }
  - id: ev-news
    at: { day: 3, minutes: 720 }
    voices: [v-ev-news]
    gauges: { flame: 8 }
    sound: { se: [notify_news] }
    caption: { ja: 'ニュースが「退会者の免許証画像が残っていた」と報じた。', en: '' }
  - id: ev-client
    at: { day: 5, minutes: 600 }
    voices: [v-ev-client]
    gauges: { flame: 5 }
    sound: { se: [phone_ring] }
    caption: { ja: '主要な取引先から、調査状況の説明を求められている。', en: '' }
points:
  - id: a01-first-alert
    at: { day: 0, minutes: 540 }
    phase: detect
    sound: { se: [notify_chat] }
    text: { ja: '午前9時。会員データベースへの大量の読み出しを検知した。同じ時刻、管理画面へのログイン失敗が三百件を超えている。まだ原因は分からない。', en: '' }
    voices: [v01-field, v01-boss, v01-ok]
    notable:
      - { id: note-first-call, text: { ja: '午前9時、会員データベースへの大量の読み出しと、管理画面へのログイン失敗多発を検知。原因は不明。', en: '' } }
    choices:
      - id: a01-poweroff
        text: { ja: '危険なので、そのサーバーの電源を抜いて止める。', en: '' }
        minutes: 15
        category: hurt
        points: -50
        refs: [nist-sp800-61r3]
        gauges: { damage: 5, trust: -5, stamina: -5 }
        items:
          - { id: a01-a-record, points: -10, axis: record, refs: [nist-sp800-61r3] }
          - { id: a01-a-content, points: -8, axis: content, refs: [jpcert-handling] }
          - { id: a01-a-time, points: 3, axis: time, refs: [nist-sp800-61r3] }
      - id: a01-wait
        text: { ja: '朝会が終わるまで様子を見て、それから動く。', en: '' }
        minutes: 60
        category: hurt
        points: -70
        refs: [jpcert-handling]
        gauges: { damage: 10, flame: 5, trust: -5 }
        coward: true
        delayed:
          - { afterPhases: 2, points: -40, gauges: { damage: 10, flame: 10 }, reason: { ja: '見ている間に、読み出しは別の三台へ広がっていた。', en: '' } }
        items:
          - { id: a01-b-time, points: -10, axis: time, refs: [jpcert-handling] }
          - { id: a01-b-record, points: -8, axis: record, refs: [jpcert-handling] }
          - { id: a01-b-care, points: -5, axis: care, refs: [meti-csm-guideline] }
      - id: a01-isolate
        text: { ja: '該当サーバーをネットワークから切り離し、読み出し元と使用アカウントを特定して、時刻と操作を記録する。', en: '' }
