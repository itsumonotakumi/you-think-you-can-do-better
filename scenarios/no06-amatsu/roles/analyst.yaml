drafts:
  incident-note:
    title: { ja: '一次報告メモ', en: '' }
    slots:
      - id: observed
        label: { ja: '検知の書き方', en: '' }
        options:
          - { id: an-o-split, text: { ja: '検知した時刻と、確認した時刻を分けて書く', en: '' }, points: 4, axis: time, refs: [jpcert-handling], explain: { ja: '検知と確認の時刻を分けると、初動の遅れが正確に伝わる。後の検証にも使える記録になる。', en: '' } }
          - { id: an-o-vague, text: { ja: '「朝に検知した」とだけ書いておく', en: '' }, points: -6, axis: time, refs: [jpcert-handling], explain: { ja: '朝とだけ書くと、いつ何をしたのか分からない。初動の評価も検証もできないからだ。本当に。', en: '' } }
      - id: fact
        label: { ja: '確認できた事実', en: '' }
        options:
          - { id: an-f-guess, text: { ja: '「某国の工作員による攻撃だ」と断定して書く', en: '' }, points: -10, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '工作員と断定する根拠がない。偏見を強め、報告全体の信頼を損なうことになるだけだ。', en: '' } }
          - { id: an-f-list, text: { ja: '不審なプロセス、検体のハッシュ、通信先を具体的に書く', en: '' }, points: 6, axis: content, refs: [nist-sp800-61r3], explain: { ja: '不審なプロセス、ハッシュ、通信先を具体的に書くと、調査の再現ができる。事実の記録として適切。', en: '' } }
      - id: unknown
        label: { ja: '不明点', en: '' }
        options:
          - { id: an-u-explicit, text: { ja: '持ち出しの有無など、未確認の点と確認期限を書く', en: '' }, points: 6, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '未確認の点と期限を書くと、次の行動が明確になる。分からないことを隠さない姿勢が信頼につながる。', en: '' } }
          - { id: an-u-omit, text: { ja: '不明点には一切触れずに報告を終わらせる', en: '' }, points: -6, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '不明点に触れないと、分かっていない範囲が伝わらない。後で追加説明を求められてしまう。', en: '' } }
      - id: action
        label: { ja: '実施したこと', en: '' }
        options:
          - { id: an-a-summary, text: { ja: '「初動対応済み」とだけ書いて報告を終わらせる', en: '' }, points: -7, axis: order, refs: [jpcert-handling], explain: { ja: '初動対応済みとだけ書くと、何をしたのか分からない。検証も引き継ぎもできないからだ。', en: '' } }
          - { id: an-a-list, text: { ja: '端末の切り離し、アカウント停止、保全したログを列挙する', en: '' }, points: 6, axis: order, refs: [nist-sp800-61r3], explain: { ja: '実施したことを列挙すると、何をしたか後から確認できる。初動の記録として適切だと思う。', en: '' } }
