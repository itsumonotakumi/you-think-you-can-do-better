          - { id: an-e-none, text: { ja: '証拠のことは書かないままにしておく', en: '' }, points: -7, axis: record, refs: [cissp-cbk-secops], explain: { ja: '証拠に触れないと、保全したかどうか分からない。後から調査の妥当性を問われることになる。', en: '' } }
