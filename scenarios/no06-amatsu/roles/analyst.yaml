        items:
          - { id: a02-a-content, points: -8, axis: content, refs: [nist-sp800-61r3] }
          - { id: a02-a-record, points: -7, axis: record, refs: [jpcert-handling] }
      - id: a02-disable
        text: { ja: 'アカウントを停止し、端末と認証ログを保全する。担当予定だった図面は別の社員に引き継ぐ。', en: '' }
        minutes: 45
        category: maintain
        points: 30
        refs: [jpcert-handling, nist-sp800-61r3]
        gauges: { damage: -10, trust: 5, stamina: -5 }
        setFlags: { accountDisabled: true }
        items:
          - { id: a02-b-order, points: 6, axis: order, refs: [jpcert-handling] }
          - { id: a02-b-record, points: 6, axis: record, refs: [nist-sp800-61r3] }
          - { id: a02-b-time, points: 4, axis: time, refs: [jpcert-handling] }
      - id: a02-revoke-all
        text: { ja: 'アカウント停止に加え、有効なセッションをすべて失効させる。同じ採用の経路で入った社員の権限も棚卸しする。', en: '' }
        minutes: 90
        category: recover
        points: 120
        refs: [nist-sp800-61r3, cissp-cbk-secops]
        gauges: { damage: -15, trust: 10, stamina: -10 }
        setFlags: { accountDisabled: true, sessionsRevoked: true, accessReviewed: true }
        items:
          - { id: a02-c-content, points: 6, axis: content, refs: [nist-sp800-61r3] }
          - { id: a02-c-record, points: 6, axis: record, refs: [cissp-cbk-secops] }
          - { id: a02-c-order, points: 6, axis: order, refs: [meti-csm-guideline] }
          - { id: a02-c-care, points: 4, axis: care, refs: [meti-csm-guideline] }
      - id: a02-ask
        text: { ja: '人事に頼んで、本人にパスワードを変更してもらう。', en: '' }
        minutes: 45
        category: hurt
        points: -50
        refs: [jpcert-handling]
        gauges: { trust: -5 }
        items:
          - { id: a02-d-order, points: -7, axis: order, refs: [jpcert-handling] }
          - { id: a02-d-care, points: -6, axis: care, refs: [no06-telework-guideline] }
          - { id: a02-d-time, points: -3, axis: time, refs: [jpcert-handling] }

