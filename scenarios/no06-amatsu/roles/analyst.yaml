# No.6 アマツ重工 / セキュリティ担当者ロール
# 見えるのは、EDRの画面、認証ログ、社内チャット、人事からの連絡。
# 専任のSOCはない。あなたは情報システム部でセキュリティを兼任する担当者。
# 判断ポイント20、細目は choices[].items と drafts の合計で80以上。
estimateMinutes: 40
intro: { ja: 'あなたはアマツ重工の情報システム部で、セキュリティを兼任する担当者。専任のSOCはなく、EDRの画面とログ、現場からのチャットが持ち場のすべてだ。遠隔で採用した新人の端末が、届いた朝に不審なプログラムを読み込んだ。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-a-prelim
    ref: ppc-report-prelim
    label: { ja: '個人情報保護委員会への速報の材料提出', en: '' }
    points: -150
    doneFlag: prelimFiled
  - id: dl-a-final
    ref: ppc-report-final-malicious
    label: { ja: '確報の材料提出', en: '' }
    points: -100
    doneFlag: finalMaterialsSent
events:
  - id: ev-a-night
    at: { day: 1, minutes: 120 }
    voices: [v-ev-night]
    gauges: { stamina: -5 }
    sound: { se: [notify_chat] }
    caption: { ja: '深夜2時。隔離した端末の通信記録が、まだ更新され続けている。', en: '' }
  - id: ev-news
    at: { day: 4, minutes: 780 }
    voices: [v-ev-news]
    gauges: { flame: 10 }
    sound: { se: [notify_news] }
    caption: { ja: '週刊誌の速報が出た。「大手重工、偽の新人を採用か」。', en: '' }
  - id: ev-a-board
    at: { day: 8, minutes: 540 }
    voices: [v-ev-board]
    gauges: { flame: 5 }
    caption: { ja: '社内掲示板に「遠隔の採用は全部やめるべきだ」という投稿が並ぶ。', en: '' }
  - id: ev-a-police
    at: { day: 18, minutes: 540 }
    voices: [v-ev-police]
    gauges: { flame: 5 }
    sound: { se: [phone_ring] }
    caption: { ja: '警察から、端末と認証記録の任意提出を求められた。', en: '' }
points:
  - id: a01-edr
    at: { day: 0, minutes: 525 }
    phase: detect
    sound: { se: [notify_chat] }
    text: { ja: '8時45分。先週、遠隔で入社手続きを終えた上級エンジニアの貸与端末が、初期設定の直後に不審なプログラムの読み込みを検知した。端末は本人の自宅にあり、電話はつながらない。', en: '' }
    voices: [v01-field, v01-vendor, v01-ok]
    choices:
      - id: a01-verify
        text: { ja: 'EDRの通信制御で端末を社内から切り離し、不審なプロセスと通信先、実行時刻を記録する。', en: '' }
        explain: { ja: '通信を切り離し、不審なプロセスと通信先、実行時刻を記録している。証拠を保ちながら被害を止める初動。', en: '' }
        minutes: 30
        category: maintain
        points: 30
        refs: [nist-sp800-61r3, jpcert-handling]
        gauges: { damage: -5, trust: 5, stamina: -5 }
        setFlags: { alertTriaged: true }
        items:
          - { id: a01-b-time, points: 6, axis: time, refs: [jpcert-handling] }
          - { id: a01-b-record, points: 6, axis: record, refs: [nist-sp800-61r3] }
          - { id: a01-b-content, points: 4, axis: content, refs: [nist-sp800-61r3] }
          - { id: a01-b-order, points: 4, axis: order, refs: [cissp-cbk-secops] }
      - id: a01-dismiss
        text: { ja: 'EDRの誤検知としてアラートを閉じ、本人への連絡は人事に任せて、自分はそのまま様子を見る。', en: '' }
        explain: { ja: '誤検知と決めつけると、不正プログラムの実行を見逃す。端末は社内に接続したままで、被害が広がる。', en: '' }
        minutes: 30
        category: hurt
        points: -60
        refs: [jpcert-handling]
        gauges: { damage: 5, flame: 5, trust: -5 }
        coward: true
        items:
          - { id: a01-a-content, points: -8, axis: content, refs: [jpcert-handling] }
          - { id: a01-a-time, points: -6, axis: time, refs: [jpcert-handling] }
          - { id: a01-a-record, points: -6, axis: record, refs: [nist-sp800-61r3] }
      - id: a01-reboot
        text: { ja: '人事に頼んで端末を再起動してもらい、初期設定をやり直してもらって様子を見る。', en: '' }
        explain: { ja: '再起動すると実行中の情報が消える。初期設定のやり直しも証拠を失わせ、侵入経路を分からなくする。', en: '' }
        minutes: 60
        category: hurt
        points: -50
        refs: [nist-sp800-61r3]
        gauges: { damage: 10, trust: -5 }
        items:
          - { id: a01-c-record, points: -8, axis: record, refs: [nist-sp800-61r3] }
          - { id: a01-c-content, points: -7, axis: content, refs: [nist-sp800-61r3] }
          - { id: a01-c-time, points: -3, axis: time, refs: [jpcert-handling] }
      - id: a01-wipe
        text: { ja: '遠隔から端末を初期化し、きれいな端末を送り直して、そのまま作業を再開してもらう。', en: '' }
        explain: { ja: '初期化は端末上の痕跡を消し、侵入経路も漏えい範囲も分からなくする。復旧を急ぐほど説明ができなくなる。', en: '' }
        minutes: 45
        category: fatal
        points: -200
        refs: [nist-sp800-61r3]
        gauges: { damage: 10, flame: 10, trust: -15 }
        setFlags: { wipedDevice: true }
        items:
          - { id: a01-d-record, points: -14, axis: record, refs: [nist-sp800-61r3] }
          - { id: a01-d-content, points: -10, axis: content, refs: [nist-sp800-61r3] }
    lesson: { ja: '端末は電源を切らず、通信を切り離して不審なプロセスと通信先、実行時刻を記録する。誤検知と決めつけたり再起動させたりすると、証拠が消える。端末の電源は切らずに残す。', en: '' }

  - id: a02-account
    at: { day: 0, minutes: 555 }
    phase: contain
    sound: { se: [notify_chat] }
    text: { ja: '9時15分。端末は通信を切り離した。しかし本人のアカウントは有効なままで、設計部門の共有フォルダに接続できる。止めれば、配属予定だった図面の仕事が止まる。', en: '' }
    voices: [v02-boss, v02-coward, v02-ok]
    popular: { choiceId: a02-keep, percent: 61 }
    choices:
      - id: a02-keep
        text: { ja: '止めずに監視を強める。入社初日に仕事を止めたら、現場が回らないとしてそのままにする。', en: '' }
        explain: { ja: '監視だけではアカウントの利用を止められない。共有フォルダの閲覧が続き、被害の範囲が広がる。', en: '' }
        minutes: 60
        category: hurt
        points: -100
        refs: [nist-sp800-61r3]
        gauges: { damage: 15, flame: 5 }
        delayed:
          - { afterPhases: 1, points: -15, gauges: { damage: 10, trust: -5 }, reason: { ja: '止めなかったアカウントで、共有フォルダの資料が閲覧された記録が見つかった。', en: '' } }
        items:
          - { id: a02-a-content, points: -8, axis: content, refs: [nist-sp800-61r3] }
          - { id: a02-a-record, points: -7, axis: record, refs: [jpcert-handling] }
      - id: a02-revoke-all
        text: { ja: 'アカウントを停止し、全セッションを失効させる。同じ採用経路で入った社員の権限も棚卸しする。', en: '' }
        explain: { ja: '停止に加えてセッションの失効と権限の棚卸しまで行っており、同じ経路の被害も防げる。', en: '' }
        minutes: 90
        category: recover
        points: 120
        refs: [nist-sp800-61r3, cissp-cbk-secops]
        gauges: { damage: -15, trust: 10, stamina: -10 }
        setFlags: { accountDisabled: true, sessionsRevoked: true, accessReviewed: true }
        items:
          - { id: a02-c-content, points: 6, axis: content, refs: [nist-sp800-61r3] }
          - { id: a02-c-record, points: 6, axis: record, refs: [cissp-cbk-secops] }
          - { id: a02-c-order, points: 6, axis: order, refs: [meti-csm-guideline] }
          - { id: a02-c-care, points: 4, axis: care, refs: [meti-csm-guideline] }
      - id: a02-disable
        text: { ja: 'アカウントを停止し、端末と認証ログを保全する。担当予定だった図面は別の社員に引き継ぐ。', en: '' }
        explain: { ja: '停止と保全、業務の引き継ぎまで決めており妥当。セッションの失効や権限の棚卸しまでは踏み込んでいない。', en: '' }
        minutes: 45
        category: maintain
        points: 30
        refs: [jpcert-handling, nist-sp800-61r3]
        gauges: { damage: -10, trust: 5, stamina: -5 }
        setFlags: { accountDisabled: true }
        items:
          - { id: a02-b-order, points: 6, axis: order, refs: [jpcert-handling] }
          - { id: a02-b-record, points: 6, axis: record, refs: [nist-sp800-61r3] }
          - { id: a02-b-time, points: 4, axis: time, refs: [jpcert-handling] }
      - id: a02-ask
        text: { ja: '人事に頼んで、本人にパスワードを変更してもらい、完了の連絡を待って確認するだけにとどめる。', en: '' }
        explain: { ja: '本人にパスワードを変えてもらうだけでは、有効なセッションや他の権限が残る。停止の判断が遅れる。', en: '' }
        minutes: 45
        category: hurt
        points: -50
        refs: [jpcert-handling]
        gauges: { trust: -5 }
        items:
          - { id: a02-d-order, points: -7, axis: order, refs: [jpcert-handling] }
          - { id: a02-d-care, points: -6, axis: care, refs: [no06-telework-guideline] }
          - { id: a02-d-time, points: -3, axis: time, refs: [jpcert-handling] }
    lesson: { ja: 'アカウントを停止し、端末と認証ログを保全し、セッションも失効させる。同じ採用経路の権限も棚卸しする。止めずに監視だけでは被害が広がる。停止の判断を先に決める。現場も守る。', en: '' }

  - id: a03-evidence
    at: { day: 0, minutes: 615 }
    phase: contain
    sound: { se: [typing] }
    text: { ja: '10時15分。端末は遠隔地にある。電源を切れば実行中の情報が消え、初期化すれば何も残らない。何を、どの順で、誰の立会いで残すか。', en: '' }
    voices: [v03-expert, v03-field, v03-ok]
    choices:
      - id: a03-reset
        text: { ja: '本人に初期化してもらい、きれいになった端末を宅配でそのまま返してもらうのだ。', en: '' }
        explain: { ja: '初期化させると、端末上の痕跡がすべて消える。返送を待つ間に証拠も失われ、調査ができなくなる。', en: '' }
        minutes: 45
        category: fatal
        points: -200
        refs: [nist-sp800-61r3]
        gauges: { damage: 10, flame: 15, trust: -20 }
        setFlags: { destroyedEvidence: true }
        items:
          - { id: a03-a-record, points: -14, axis: record, refs: [nist-sp800-61r3] }
          - { id: a03-a-content, points: -10, axis: content, refs: [nist-sp800-61r3] }
      - id: a03-courier
        text: { ja: '端末を宅配で送り返してもらい、届いてから中身をゆっくり詳しく調べようとする。', en: '' }
        explain: { ja: '宅配で戻すのを待つ間に、端末が操作されたり電源が切られたりする。証拠が散逸する危険が大きい。', en: '' }
        minutes: 60
        category: hurt
        points: -70
        refs: [nist-sp800-61r3]
        gauges: { damage: 5, trust: -5 }
        items:
          - { id: a03-c-order, points: -7, axis: order, refs: [nist-sp800-61r3] }
          - { id: a03-c-record, points: -8, axis: record, refs: [cissp-cbk-secops] }
          - { id: a03-c-time, points: -4, axis: time, refs: [jpcert-handling] }
      - id: a03-remote
        text: { ja: 'EDRのテレメトリ、通信記録、クラウドの認証ログを、取得時刻とハッシュを付けて保全する。', en: '' }
        explain: { ja: 'テレメトリ、通信記録、認証ログを取得時刻とハッシュ付きで保全している。証拠の完全性を保つ妥当な手順。', en: '' }
        minutes: 90
        category: maintain
        points: 30
        refs: [nist-sp800-61r3, cissp-cbk-secops]
        gauges: { damage: -5, trust: 5, stamina: -10 }
        detail: forensic-plan
        setFlags: { evidencePreserved: true }
        items:
          - { id: a03-b-record, points: 6, axis: record, refs: [cissp-cbk-secops] }
          - { id: a03-b-order, points: 6, axis: order, refs: [nist-sp800-61r3] }
          - { id: a03-b-time, points: 4, axis: time, refs: [jpcert-handling] }
          - { id: a03-b-content, points: 4, axis: content, refs: [nist-sp800-61r3] }
      - id: a03-tool
        text: { ja: '本人に指示して、チャットで送った簡易ツールを端末で実行してもらい、結果を回収して終わろうとする。', en: '' }
        explain: { ja: '本人にツールを実行させると、証拠が変わるうえ相手にも動きが伝わる。遠隔取得の手順を自分たちで決めるべき。', en: '' }
        minutes: 45
        category: hurt
        points: -70
        refs: [cissp-cbk-secops]
        gauges: { damage: 5, trust: -5, stamina: -5 }
        items:
          - { id: a03-d-record, points: -6, axis: record, refs: [cissp-cbk-secops] }
          - { id: a03-d-content, points: -7, axis: content, refs: [nist-sp800-61r3] }
          - { id: a03-d-care, points: -3, axis: care, refs: [no06-telework-guideline] }
    lesson: { ja: 'テレメトリ、通信記録、認証ログを取得時刻とハッシュ付きで保全する。端末は初期化せず、本人に操作させない。宅配で戻すだけでは証拠が散逸する。取得の順番も決めておく。', en: '' }

  - id: a04-shared
    at: { day: 0, minutes: 690 }
    phase: contain
    sound: { se: [notify_chat] }
    text: { ja: '11時30分。端末が触れた範囲をたどると、設計部門の共有フォルダだけでなく、取引先担当者の連絡先一覧も同じ場所にあった。件数はまだ数えられない。', en: '' }
    voices: [v04-popular, v04-law, v04-ok]
    notable:
      - { id: note-scope, text: { ja: '端末のアカウントは設計部門の共有フォルダを閲覧し、取引先担当者の連絡先一覧も同じ場所にあった。', en: '' } }
    choices:
      - id: a04-narrow
        text: { ja: '端末の中だけを調べ、共有フォルダの閲覧は操作ミスとして扱って、そのまま終わる。', en: '' }
        explain: { ja: '端末の中だけで閉じると、共有フォルダの被害が視野から落ちる。取引先の連絡先があっても報告しない。', en: '' }
        minutes: 90
        category: hurt
        points: -80
        refs: [nist-sp800-61r3]
        gauges: { damage: 15, trust: -10 }
        items:
          - { id: a04-a-content, points: -8, axis: content, refs: [nist-sp800-61r3] }
          - { id: a04-a-record, points: -6, axis: record, refs: [jpcert-handling] }
      - id: a04-trace
        text: { ja: 'アクセスログから触れたファイルを特定し、件数と項目を記録して、セキュリティ責任者と法務に渡す。', en: '' }
        explain: { ja: '触れたファイルを特定し、件数と項目を記録して渡している。範囲の確定として妥当。報告の準備までは進んでいない。', en: '' }
        minutes: 120
        category: maintain
        points: 30
        refs: [jpcert-handling, nist-sp800-61r3]
        gauges: { damage: -5, trust: 5, stamina: -10 }
        setFlags: { scopeMapped: true }
        items:
          - { id: a04-b-content, points: 6, axis: content, refs: [nist-sp800-61r3] }
          - { id: a04-b-record, points: 6, axis: record, refs: [jpcert-handling] }
          - { id: a04-b-order, points: 4, axis: order, refs: [cissp-cbk-secops] }
          - { id: a04-b-time, points: 4, axis: time, refs: [jpcert-handling] }
      - id: a04-post
        text: { ja: '分かった範囲を社内掲示板に書き、資料の取り扱いに注意するよう呼びかける。', en: '' }
        explain: { ja: '掲示板に書くと、範囲が固まる前に情報が広がる。注意喚起より、影響の確定と当局への相談が先。', en: '' }
        minutes: 30
        category: hurt
        points: -50
        refs: [meti-disclosure-guidance]
        gauges: { flame: 10, trust: -5 }
        items:
          - { id: a04-d-wording, points: -7, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: a04-d-care, points: -6, axis: care, refs: [meti-csm-guideline] }
          - { id: a04-d-record, points: -5, axis: record, refs: [jpcert-handling] }

      - id: a04-full
        text: { ja: '触れた範囲を全システムに広げ、取引先の連絡先も含めて影響を確定し、報告の準備も進言する。', en: '' }
        explain: { ja: '全システムに範囲を広げ、取引先の連絡先も含めて影響を確定し、報告の準備まで進めている。被害の全体像をつかむ対応。', en: '' }
        minutes: 180
        category: recover
        points: 120
        refs: [nist-sp800-61r3, ppc-report-scope]
        gauges: { damage: -10, trust: 10, stamina: -15 }
        setFlags: { scopeExpanded: true }
        items:
          - { id: a04-c-content, points: 6, axis: content, refs: [nist-sp800-61r3] }
          - { id: a04-c-order, points: 6, axis: order, refs: [ppc-report-scope] }
          - { id: a04-c-record, points: 6, axis: record, refs: [jpcert-handling] }
          - { id: a04-c-care, points: 4, axis: care, refs: [ppc-notify-person] }
    lesson: { ja: '触れた範囲を全システムに広げ、取引先の連絡先も含めて影響を確定する。件数と項目を記録し、報告の準備も進言する。端末の中だけでは範囲を見誤る。報告の準備も同時に進める。', en: '' }
  - id: a05-first-report
    at: { day: 0, minutes: 780 }
    phase: organize
    sound: { se: [typing] }
    text: { ja: '13時。セキュリティ責任者への第一報。分かったことと、まだ分かっていないことが、頭の中で混ざっている。', en: '' }
    voices: [v05-boss, v05-flattery, v05-ok]
    choices:
      - id: a05-report
        text: { ja: '30分以内に、確認できた事実、不明点、次にやることを分けて一次報告する。', en: '' }
        explain: { ja: '事実、不明点、次の行動を分けて早く報告しており、初動の共有として適切だと言える。', en: '' }
        minutes: 45
        category: maintain
        points: 30
        refs: [jpcert-handling, cissp-cbk-secops]
        gauges: { trust: 5, stamina: -5 }
        detail: incident-note
        setFlags: { firstReport: true }
        items:
          - { id: a05-b-time, points: 6, axis: time, refs: [jpcert-handling] }
          - { id: a05-b-order, points: 4, axis: order, refs: [cissp-cbk-secops] }
          - { id: a05-b-record, points: 4, axis: record, refs: [jpcert-handling] }
          - { id: a05-b-content, points: 4, axis: content, refs: [cissp-cbk-secops] }
      - id: a05-wait
        text: { ja: '全部が分かってから報告する。中途半端な報告は混乱を招くとして待つ。', en: '' }
        explain: { ja: '全部が分かるのを待つと、初動が遅れる。分かっている範囲と不明点を分けて早く報告するのが基本。', en: '' }
        minutes: 120
        category: hurt
        points: -80
        refs: [jpcert-handling]
        gauges: { flame: 10, trust: -10, damage: 5 }
        coward: true
        items:
