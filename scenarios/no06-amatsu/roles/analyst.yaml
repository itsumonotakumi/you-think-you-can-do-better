        label: { ja: '次の連絡', en: '' }
        options:
          - { id: an-n-none, text: { ja: '次の連絡予定は書かないでおく', en: '' }, points: -3, axis: order, refs: [jpcert-handling], explain: { ja: '次の予定がないと、報告が途切れて関係者は待つしかなくなる。連絡の約束を書くべき。', en: '' } }
          - { id: an-n-time, text: { ja: '次に報告する時刻と相手を書く', en: '' }, points: 4, axis: order, refs: [jpcert-handling], explain: { ja: '次の報告の時刻と相手を書くと、情報が止まらない。関係者が次の行動を決められるからだ。', en: '' } }
      - id: route
        label: { ja: '報告の経路', en: '' }
        options:
          - { id: an-r-ciso, text: { ja: 'セキュリティ責任者を先に通し、事実だけを渡す', en: '' }, points: 4, axis: order, refs: [meti-csm-guideline], explain: { ja: '責任者を先に通すと、報告の経路が保たれ、現場の判断と食い違わないからだ。現場の判断を守れる。', en: '' } }
          - { id: an-r-ceo, text: { ja: 'セキュリティ責任者を飛ばして社長に渡す', en: '' }, points: -7, axis: order, refs: [meti-csm-guideline], explain: { ja: '責任者を飛ばすと経路が乱れ、現場の判断と食い違う。まず責任者に渡すべきだからだ。', en: '' } }
      - id: sns
        label: { ja: '外部への発信', en: '' }
        options:
          - { id: an-s-vague, text: { ja: '個人のSNSに「調査中」と書く', en: '' }, points: -8, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: '個人のSNSに書くと、会社の見解と混同される。調査中の情報は広げないことだと思う。', en: '' } }
          - { id: an-s-none, text: { ja: '個人のSNSには書かない', en: '' }, points: 6, axis: wording, refs: [meti-csm-guideline], explain: { ja: '個人のSNSに書かない判断は妥当。未確認の情報が広がるのを防げるからだ。外部の目を気にしなくてよい。', en: '' } }
      - id: version
        label: { ja: '版の管理', en: '' }
        options:
          - { id: an-v-versioned, text: { ja: '版番号と更新時刻を書く', en: '' }, points: 4, axis: record, refs: [cissp-cbk-secops], explain: { ja: '版と更新時刻を書くと、後から記録の変遷を説明できるようになるからだ。記録の基本だ。', en: '' } }
          - { id: an-v-plain, text: { ja: '版番号を書かないでおく', en: '' }, points: -3, axis: record, refs: [cissp-cbk-secops], explain: { ja: '版がないと、いつ何を更新したか分からない。訂正の根拠も失ってしまうからだ。記録の基本だ。', en: '' } }
  handover:
    title: { ja: '引き継ぎ書', en: '' }
    slots:
      - id: status
        label: { ja: '調査の状態', en: '' }
        options:
          - { id: ho-s-vague, text: { ja: '「調査中」とだけ書いて済ませる', en: '' }, points: -6, axis: record, refs: [jpcert-handling], explain: { ja: '調査中とだけ書くと、どこまで分かっているか伝わらない。引き継ぎにならないからだ。', en: '' } }
          - { id: ho-s-time, text: { ja: '何をいつ確認したかを、時刻つきで書く', en: '' }, points: 6, axis: record, refs: [jpcert-handling], explain: { ja: '何をいつ確認したかを書くと、交代した人も同じ前提で動けるからだ。引き継ぎの基本だ。', en: '' } }
      - id: unknown
        label: { ja: '未確認事項', en: '' }
        options:
          - { id: ho-u-list, text: { ja: '未確認の点と、確認する予定を書く', en: '' }, points: 6, axis: content, refs: [cissp-cbk-secops], explain: { ja: '未確認の点と予定を書くと、次の担当が同じ確認を繰り返さずに済むからだ。時間の節約になる。', en: '' } }
          - { id: ho-u-none, text: { ja: '未確認の点には触れないでおく', en: '' }, points: -6, axis: content, refs: [cissp-cbk-secops], explain: { ja: '未確認の点に触れないと、次の担当が見落とす。引き継ぎの意味がないからだ。必ず書くべきだ。', en: '' } }
      - id: next
        label: { ja: '次の作業', en: '' }
        options:
          - { id: ho-n-any, text: { ja: '「あとは任せる」とだけ書く', en: '' }, points: -5, axis: order, refs: [jpcert-handling], explain: { ja: 'あとは任せるとだけ書くと、次の担当が動けない。作業と担当を示すべきだからだ。現場が止まる。', en: '' } }
          - { id: ho-n-owner, text: { ja: '次にやる作業と担当者を書く', en: '' }, points: 6, axis: order, refs: [cissp-cbk-secops], explain: { ja: '次の作業と担当を書くと、誰が何をするか明確になって進むからだ。迷いがなくなるからだ。', en: '' } }
      - id: access
        label: { ja: '権限の引き継ぎ', en: '' }
        options:
          - { id: ho-a-proc, text: { ja: '必要な権限と、渡す手順を書く', en: '' }, points: 6, axis: order, refs: [cissp-cbk-secops], explain: { ja: '必要な権限と渡す手順を書くと、権限の移転が確実に進められるからだ。権限の管理になる。', en: '' } }
          - { id: ho-a-oral, text: { ja: '口頭で伝えるだけにしておく', en: '' }, points: -7, axis: record, refs: [cissp-cbk-secops], explain: { ja: '口頭だけで権限を渡すと、誰が何を持ったか記録に残らないからだ。後で確認できない。', en: '' } }
      - id: care
        label: { ja: '交代の決め方', en: '' }
        options:
          - { id: ho-c-allnight, text: { ja: '徹夜で続ける前提で書いておく', en: '' }, points: -8, axis: care, refs: [ipa-sme-guideline], explain: { ja: '徹夜前提だと、疲労で確認漏れが起きるからだ。交代を前提にすべきだ。無理は禁物だ。', en: '' } }
          - { id: ho-c-shift, text: { ja: '交代の時刻と、休息の取り方を書く', en: '' }, points: 6, axis: care, refs: [ipa-sme-guideline], explain: { ja: '交代の時刻と休息を書くと、無理なく続けられる。確認漏れも減るからだ。長く戦う基本だ。', en: '' } }
      - id: boundary
        label: { ja: '判断の境界', en: '' }
        options:
          - { id: ho-b-line, text: { ja: '自分で決めてよいことと上に確認することを分ける', en: '' }, points: 4, axis: order, refs: [meti-csm-guideline], explain: { ja: '決めてよいことと確認が必要なことを分けると、現場が止まらないからだ。判断が速くなる。', en: '' } }
          - { id: ho-b-none, text: { ja: '判断の境界を書かないままにして、後で揉める', en: '' }, points: -4, axis: order, refs: [meti-csm-guideline], explain: { ja: '境界がないと、現場が判断をためらう。確認の要否を先に決めるべきだからだ。現場が困る。', en: '' } }
      - id: artifacts
        label: { ja: '保全したもの', en: '' }
        options:
          - { id: ho-ar-none, text: { ja: '保全したデータの置き場所を書かない', en: '' }, points: -7, axis: record, refs: [nist-sp800-61r3], explain: { ja: '置き場所がないと、証拠が見つからない。引き継ぎの前提が崩れてしまうからだ。証拠を守れない。', en: '' } }
          - { id: ho-ar-place, text: { ja: '保全したデータの置き場所とハッシュを書く', en: '' }, points: 6, axis: record, refs: [nist-sp800-61r3], explain: { ja: '置き場所とハッシュを書くと、次の担当が証拠をたどれるようになるからだ。引き継ぎが確実になる。', en: '' } }
      - id: version
        label: { ja: '版の管理', en: '' }
        options:
          - { id: ho-v-versioned, text: { ja: '版番号と更新時刻を書く', en: '' }, points: 4, axis: record, refs: [cissp-cbk-secops], explain: { ja: '版と更新時刻を書くと、後から引き継ぎ書の変遷を説明できるようになるからだ。版は必要だ。', en: '' } }
          - { id: ho-v-plain, text: { ja: '版番号を書かないでおく', en: '' }, points: -3, axis: record, refs: [cissp-cbk-secops], explain: { ja: '版がないと、いつ何を更新したか分からない。訂正の根拠も失ってしまうからだ。記録の基本だ。', en: '' } }
  forensic-plan:
    title: { ja: '保全の手順', en: '' }
    slots:
      - id: order
        label: { ja: '保全の順序', en: '' }
        options:
          - { id: fp-o-disk, text: { ja: '見つかったファイルだけをコピーして済ませる', en: '' }, points: -7, axis: content, refs: [nist-sp800-61r3], explain: { ja: 'ファイルだけをコピーすると、実行中の情報が抜ける。順序を決めて保全すべきだからだ。', en: '' } }
          - { id: fp-o-order, text: { ja: 'テレメトリ、通信記録、認証ログの順に保全する', en: '' }, points: 7, axis: order, refs: [nist-sp800-61r3], explain: { ja: '揮発性の高いものから保全すると、消えやすい証拠を残せるようになるからだ。順番が大切だ。', en: '' } }
      - id: hash
        label: { ja: '完全性の担保', en: '' }
        options:
          - { id: fp-h-hash, text: { ja: '取得時にハッシュ値を計算し、記録と照合する', en: '' }, points: 7, axis: record, refs: [cissp-cbk-secops], explain: { ja: 'ハッシュを取ると、証拠が改変されていないことを示せるからだ。証拠の信頼性が上がる。', en: '' } }
          - { id: fp-h-none, text: { ja: 'ハッシュ値は取らないでそのままにする', en: '' }, points: -10, axis: record, refs: [cissp-cbk-secops], explain: { ja: 'ハッシュがないと、証拠の同一性を説明できない。改変の疑いも晴らせないからだ。危険だ。', en: '' } }
      - id: who
        label: { ja: '実施者と立会い', en: '' }
        options:
          - { id: fp-w-solo, text: { ja: '一人で実施し、記録しない', en: '' }, points: -7, axis: record, refs: [jpcert-handling], explain: { ja: '一人で記録もなく作業すると、証拠の扱いを疑われてしまう。作業の正当性も示せない。', en: '' } }
          - { id: fp-w-two, text: { ja: '実施者と立会人を記録に残す', en: '' }, points: 6, axis: record, refs: [cissp-cbk-secops], explain: { ja: '実施者と立会人を残すと、作業の正当性を後から示せるようになるからだ。証拠の信頼になる。', en: '' } }
      - id: store
        label: { ja: '保管場所', en: '' }
        options:
          - { id: fp-s-locked, text: { ja: '書き込み不可の媒体に保存し、施錠した場所で管理する', en: '' }, points: 6, axis: order, refs: [cissp-cbk-secops], explain: { ja: '書き込み不可の媒体と施錠で管理すると、証拠の改変を防げるからだ。保管の基本になる。', en: '' } }
          - { id: fp-s-share, text: { ja: '作業用の共有フォルダに置いて済ませてしまう', en: '' }, points: -8, axis: order, refs: [cissp-cbk-secops], explain: { ja: '共有フォルダに置くと、誰でも触れて改変できる。証拠の保管場所ではないからだ。危険だ。', en: '' } }
      - id: copy
        label: { ja: '調査用コピー', en: '' }
        options:
          - { id: fp-c-original, text: { ja: '原本を直接開いてそのまま解析してしまう', en: '' }, points: -7, axis: record, refs: [nist-sp800-61r3], explain: { ja: '原本を直接開くと、解析の操作で証拠が変わる。コピーを使うべきだからだ。基本である。', en: '' } }
          - { id: fp-c-copy, text: { ja: '原本と調査用コピーを分け、コピーだけを解析する', en: '' }, points: 6, axis: content, refs: [nist-sp800-61r3], explain: { ja: '原本とコピーを分けると、解析中の変更が原本に及ばないからだ。原本を守れるようになる。', en: '' } }
      - id: device
        label: { ja: '端末の扱い', en: '' }
        options:
          - { id: fp-d-keep, text: { ja: '電源を入れず、切り離したまま本人にも触らせない', en: '' }, points: 6, axis: care, refs: [no06-telework-guideline], explain: { ja: '電源を入れず本人にも触らせないと、実行中の情報と証拠を保てるからだ。証拠の基本だ。', en: '' } }
          - { id: fp-d-restart, text: { ja: '本人に再起動してもらい、そのまま復旧を試す', en: '' }, points: -8, axis: care, refs: [nist-sp800-61r3], explain: { ja: '再起動すると実行中の情報が消える。復旧を急ぐ前に証拠を残すべきだからだ。順番を守る。', en: '' } }
      - id: scope
        label: { ja: '対象の広げ方', en: '' }
        options:
          - { id: fp-s-one, text: { ja: '今回の端末だけを見て終わらせてしまう', en: '' }, points: -8, axis: content, refs: [no06-government-advisory], explain: { ja: '今回の端末だけを見ると、同じ検体の広がりを見落としてしまう。範囲を広げるべきだ。', en: '' } }
          - { id: fp-s-all, text: { ja: '同じ検体と手口を、同じ採用経路の十二名と照合する', en: '' }, points: 6, axis: content, refs: [no06-ipa-10threats], explain: { ja: '同じ経路の端末と照合すると、見えていない被害を見つけられるからだ。範囲を広げる。', en: '' } }
      - id: explain
        label: { ja: '本人への説明', en: '' }
        options:
          - { id: fp-e-explain, text: { ja: '触らない理由と、返送の手続きを文書で伝える', en: '' }, points: 6, axis: care, refs: [ipa-sme-guideline], explain: { ja: '触らない理由と返送の手続きを文書で伝えると、本人の不安と誤解を減らせるからだ。大切だ。', en: '' } }
          - { id: fp-e-silent, text: { ja: '何も説明せずに端末の返送を求めてしまう', en: '' }, points: -7, axis: care, refs: [no06-telework-guideline], explain: { ja: '何も説明せず返送を求めると、本人は不信感を持つ。理由と手続きを伝えるべきだからだ。', en: '' } }
voices:
  - { id: v01-field, media: chat, misleading: true, type: well-meant-field, text: { ja: '人事部長「本人はとても丁寧な人でした。EDRの誤検知だと思います」。', en: '' }, trigger: { at: point } }
  - { id: v01-vendor, media: vendor, misleading: true, type: vendor-interest, text: { ja: '監視ベンダー「この製品は誤検知が多いです。様子を見てください」。', en: '' }, trigger: { at: point } }
  - { id: v01-ok, media: chat, misleading: false, text: { ja: 'セキュリティ責任者「まず通信先と実行時刻。端末は電源を切らないで」。', en: '' }, trigger: { at: point } }
  - { id: v01-after, media: sns, misleading: false, text: { ja: '初日に端末を止めるのか。本人がかわいそうだ。', en: '' }, trigger: { at: after, choice: a01-verify } }
  - { id: v02-boss, media: boss, misleading: true, type: boss-pressure, text: { ja: '設計部門長「入社初日だ。アカウントを止めたら、図面の仕事が止まる」。', en: '' }, trigger: { at: point } }
  - { id: v02-coward, media: sns, misleading: true, type: coward-critique, text: { ja: 'まだ何も起きていないのに、止めるのか。大げさすぎる。', en: '' }, trigger: { at: point } }
  - { id: v02-ok, media: chat, misleading: false, text: { ja: 'セキュリティ責任者「セッションを切って、同じアカウントの接続元を見よう」。', en: '' }, trigger: { at: point } }
  - { id: v02-after, media: news, misleading: false, text: { ja: '全社の権限を棚卸しするのか。現場が止まる。', en: '' }, trigger: { at: after, choice: a02-revoke-all } }
  - { id: v03-expert, media: vendor, misleading: true, type: fake-expert, text: { ja: '初期化して返してもらうのが一番です。テレメトリなんて取っても分かりません。', en: '' }, trigger: { at: point } }
  - { id: v03-field, media: chat, misleading: true, type: well-meant-field, text: { ja: '本人が「初期化しておきました」と言っています。きれいになったそうです。', en: '' }, trigger: { at: point } }
  - { id: v03-ok, media: chat, misleading: false, text: { ja: '調査会社「テレメトリと認証ログから。端末は触らせないでください」。', en: '' }, trigger: { at: point } }
  - { id: v03-after, media: news, misleading: false, text: { ja: '端末を返さないのか。本人は仕事ができない。', en: '' }, trigger: { at: after, choice: a03-remote } }
  - { id: v04-popular, media: sns, misleading: true, type: popular, text: { ja: '他の会社も、連絡先くらいは報告していないそうです。', en: '' }, trigger: { at: point } }
  - { id: v04-law, media: board, misleading: true, type: law-ish, text: { ja: '取引先の連絡先は名刺程度です。個人情報として扱わなくてよいのでは。', en: '' }, trigger: { at: point } }
  - { id: v04-ok, media: chat, misleading: false, text: { ja: '法務「取引先の担当者も個人です。報告の対象になりえます」。', en: '' }, trigger: { at: point } }
  - { id: v04-after, media: news, misleading: false, text: { ja: '全システムに調査を広げるのか。費用は誰が払う。', en: '' }, trigger: { at: after, choice: a04-full } }
  - { id: v05-boss, media: boss, misleading: true, type: boss-pressure, text: { ja: 'セキュリティ責任者「確定したことだけ報告してくれ。中途半端は困る」。', en: '' }, trigger: { at: point } }
  - { id: v05-flattery, media: chat, misleading: true, type: flattery, text: { ja: 'あなたなら一人で片付けられます。報告を待っています。', en: '' }, trigger: { at: point } }
  - { id: v05-ok, media: chat, misleading: false, text: { ja: '30分でいい。分かったことと、分かっていないことを分けて。', en: '' }, trigger: { at: point } }
  - { id: v05-after, media: boss, misleading: false, text: { ja: 'まだ分かっていないのに報告するのか。', en: '' }, trigger: { at: after, choice: a05-report } }
  - { id: v06-vendor, media: vendor, misleading: true, type: vendor-interest, text: { ja: '弊社の監視サービスだけで十分です。外部に出すと費用が増えますよ。', en: '' }, trigger: { at: point } }
  - { id: v06-expert, media: board, misleading: true, type: fake-expert, text: { ja: '警察に言うと、あとで面倒になります。まず社内でまとめましょう。', en: '' }, trigger: { at: point } }
  - { id: v06-ok, media: chat, misleading: false, text: { ja: 'セキュリティ責任者「調査会社と警察の窓口、両方つないでおこう」。', en: '' }, trigger: { at: point } }
  - { id: v06-after, media: news, misleading: false, text: { ja: '外部に出すのか。社内の情報が漏れたらどうする。', en: '' }, trigger: { at: after, choice: a06-both } }
  - { id: v07-attacker, media: attacker, misleading: true, type: attacker-shake, text: { ja: '端末を返せば、すべて終わりにできる。今なら穏便に済む。', en: '' }, trigger: { at: point } }
  - { id: v07-field, media: chat, misleading: true, type: well-meant-field, text: { ja: '本人は丁寧だし、返してあげれば済むと思います。', en: '' }, trigger: { at: point } }
  - { id: v07-ok, media: chat, misleading: false, text: { ja: 'セキュリティ責任者「返信しない。記録を保全して警察に渡そう」。', en: '' }, trigger: { at: point } }
  - { id: v07-after, media: sns, misleading: false, text: { ja: '端末を返させないのか。本人がかわいそうだ。', en: '' }, trigger: { at: after, choice: a07-trace } }
  - { id: v08-hr, media: boss, misleading: true, type: boss-pressure, text: { ja: '人事部長「全員を調べると現場が回りません。対象を絞りましょう」。', en: '' }, trigger: { at: point } }
  - { id: v08-sns, media: sns, misleading: true, type: public-opinion, text: { ja: '遠隔採用者を狙い撃ちするのか。差別だと言われるぞ。', en: '' }, trigger: { at: point } }
  - { id: v08-ok, media: chat, misleading: false, text: { ja: '人事「対面と、端末の送付先の確認なら、全員やり直せます」。', en: '' }, trigger: { at: point } }
  - { id: v08-after, media: sns, misleading: false, text: { ja: '全員を調べるなんて、社員を信用していない証拠だ。', en: '' }, trigger: { at: after, choice: a08-all } }
