# No.6 アマツ重工 / セキュリティ担当者ロール
# 見えるのは、EDRの画面、認証ログ、社内チャット、人事からの連絡。
# 専任のSOCはない。あなたは情報システム部でセキュリティを兼任する担当者。
# 判断ポイント20、細目は choices[].items と drafts の合計で80以上。
estimateMinutes: 40
intro: { ja: 'あなたはアマツ重工の情報システム部で、セキュリティを兼任する担当者。専任のSOCはなく、EDRの画面とログ、現場からのチャットが持ち場のすべてだ。遠隔で採用した新人の端末が、届いた朝に不審なプログラムを読み込んだ。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-a-prelim
    ref: ppc-report-prelim
    label: { ja: '個人情報保護委員会への速報の材料提出', en: '' }
    points: -150
    doneFlag: prelimFiled
  - id: dl-a-final
    ref: ppc-report-final-malicious
    label: { ja: '確報の材料提出', en: '' }
    points: -100
    doneFlag: finalMaterialsSent
events:
  - id: ev-a-night
    at: { day: 1, minutes: 120 }
    voices: [v-ev-night]
    gauges: { stamina: -5 }
    sound: { se: [notify_chat] }
    caption: { ja: '深夜2時。隔離した端末の通信記録が、まだ更新され続けている。', en: '' }
  - id: ev-news
    at: { day: 4, minutes: 780 }
    voices: [v-ev-news]
    gauges: { flame: 10 }
    sound: { se: [notify_news] }
    caption: { ja: '週刊誌の速報が出た。「大手重工、偽の新人を採用か」。', en: '' }
  - id: ev-a-board
    at: { day: 8, minutes: 540 }
    voices: [v-ev-board]
    gauges: { flame: 5 }
    caption: { ja: '社内掲示板に「遠隔の採用は全部やめるべきだ」という投稿が並ぶ。', en: '' }
  - id: ev-a-police
    at: { day: 18, minutes: 540 }
    voices: [v-ev-police]
    gauges: { flame: 5 }
    sound: { se: [phone_ring] }
    caption: { ja: '警察から、端末と認証記録の任意提出を求められた。', en: '' }
points:
  - id: a01-edr
    at: { day: 0, minutes: 525 }
    phase: detect
    sound: { se: [notify_chat] }
    text: { ja: '8時45分。先週、遠隔で入社手続きを終えた上級エンジニアの貸与端末が、初期設定の直後に不審なプログラムの読み込みを検知した。端末は本人の自宅にあり、電話はつながらない。', en: '' }
    voices: [v01-field, v01-vendor, v01-ok]
    choices:
      - id: a01-dismiss
        text: { ja: 'EDRの誤検知としてアラートを閉じ、本人への連絡は人事に任せる。', en: '' }
        minutes: 30
        category: hurt
        points: -60
        refs: [jpcert-handling]
        gauges: { damage: 5, flame: 5, trust: -5 }
        coward: true
        items:
          - { id: a01-a-content, points: -8, axis: content, refs: [jpcert-handling] }
          - { id: a01-a-time, points: -6, axis: time, refs: [jpcert-handling] }
          - { id: a01-a-record, points: -6, axis: record, refs: [nist-sp800-61r3] }
      - id: a01-verify
        text: { ja: 'EDRの通信制御で端末を社内から切り離し、不審なプロセスと通信先、実行時刻を記録する。端末の電源は切らない。', en: '' }
        minutes: 30
        category: maintain
        points: 30
        refs: [nist-sp800-61r3, jpcert-handling]
        gauges: { damage: -5, trust: 5, stamina: -5 }
        setFlags: { alertTriaged: true }
        items:
          - { id: a01-b-time, points: 6, axis: time, refs: [jpcert-handling] }
          - { id: a01-b-record, points: 6, axis: record, refs: [nist-sp800-61r3] }
          - { id: a01-b-content, points: 4, axis: content, refs: [nist-sp800-61r3] }
          - { id: a01-b-order, points: 4, axis: order, refs: [cissp-cbk-secops] }
      - id: a01-reboot
        text: { ja: '人事に頼んで端末を再起動してもらい、初期設定をやり直す。', en: '' }
        minutes: 60
        category: hurt
        points: -50
        refs: [nist-sp800-61r3]
        gauges: { damage: 10, trust: -5 }
        items:
          - { id: a01-c-record, points: -8, axis: record, refs: [nist-sp800-61r3] }
          - { id: a01-c-content, points: -7, axis: content, refs: [nist-sp800-61r3] }
          - { id: a01-c-time, points: -3, axis: time, refs: [jpcert-handling] }
      - id: a01-wipe
        text: { ja: '遠隔から端末を初期化し、きれいな端末を送り直す。', en: '' }
        minutes: 45
        category: fatal
        points: -200
        refs: [nist-sp800-61r3]
        gauges: { damage: 10, flame: 10, trust: -15 }
        setFlags: { wipedDevice: true }
        items:
          - { id: a01-d-record, points: -14, axis: record, refs: [nist-sp800-61r3] }
          - { id: a01-d-content, points: -10, axis: content, refs: [nist-sp800-61r3] }

  - id: a02-account
    at: { day: 0, minutes: 555 }
    phase: contain
    sound: { se: [notify_chat] }
    text: { ja: '9時15分。端末は通信を切り離した。しかし本人のアカウントは有効なままで、設計部門の共有フォルダに接続できる。止めれば、配属予定だった図面の仕事が止まる。', en: '' }
    voices: [v02-boss, v02-coward, v02-ok]
    popular: { choiceId: a02-keep, percent: 61 }
    choices:
      - id: a02-keep
        text: { ja: '止めずに監視を強める。入社初日に仕事を止めたら、現場が回らない。', en: '' }
        minutes: 60
        category: hurt
        points: -100
        refs: [nist-sp800-61r3]
        gauges: { damage: 15, flame: 5 }
        delayed:
