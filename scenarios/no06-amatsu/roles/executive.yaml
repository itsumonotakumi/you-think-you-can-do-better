          - { id: fr-a-share, text: { ja: '同じ住所に端末が届いた他社への連絡を書く', en: '' }, points: 6, axis: order, refs: [no06-ipa-10threats], explain: { ja: '他社への連絡を書くと、同じ住所を使った被害の広がりを止めたことが伝わる。地域全体の対策になる。', en: '' } }
      - id: measures
        label: { ja: '再発防止策', en: '' }
