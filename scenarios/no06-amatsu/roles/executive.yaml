      - id: hiring
        label: { ja: '採用の経緯', en: '' }
        options:
          - { id: fr-h-detail, text: { ja: '本人確認と端末の送付先の確認を具体的に書く', en: '' }, points: 7, axis: content, refs: [no06-government-advisory], explain: { ja: '採用の穴を具体的に書くと、同じ手口の再発を防ぐ材料になる。責任の所在も明確になる。', en: '' } }
          - { id: fr-h-omit, text: { ja: '採用の経緯や本人確認には触れない', en: '' }, points: -10, axis: content, refs: [no06-government-advisory], explain: { ja: '経緯に触れないと、根本の原因が報告書から抜ける。再発防止策の説得力も弱くなってしまう。', en: '' } }
      - id: address
        label: { ja: '他社への連絡', en: '' }
        options:
