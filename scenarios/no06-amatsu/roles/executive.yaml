# No.6 アマツ重工 / 経営者ロール
# 判断ポイント16、細目は choices[].items と drafts の合計で80以上。
estimateMinutes: 35
intro: { ja: 'あなたはアマツ重工の代表取締役社長。防衛と重要インフラの機器を作る会社で、遠隔採用した新人が端末を受け取った朝に消えた。何をどこまで話すかで、会社の信用が決まる。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-ppc-prelim
    ref: ppc-report-prelim
    label: { ja: '個人情報保護委員会への速報', en: '' }
    points: -150
    doneFlag: ppcPrelimFiled
events:
  - id: ev-news
    at: { day: 4, minutes: 780 }
    voices: [v-ev-news]
    gauges: { flame: 10 }
    sound: { se: [notify_news] }
    caption: { ja: '週刊誌の速報が出た。「大手重工、偽の新人を採用か」。', en: '' }
  - id: ev-partner
    at: { day: 5, minutes: 540 }
    voices: [v-ev-partner]
    gauges: { flame: 5 }
    sound: { se: [phone_ring] }
    caption: { ja: '主要取引先の調達部長から電話。説明の場を求められている。', en: '' }
  - id: ev-police
    at: { day: 18, minutes: 540 }
    voices: [v-ev-police]
    gauges: { flame: 5 }
    sound: { se: [phone_ring] }
    caption: { ja: '警察から、端末の取得データと記録の任意提出を求められた。', en: '' }
points:
  - id: p01-alert
    at: { day: 0, minutes: 525 }
    phase: detect
    sound: { se: [notify_chat] }
    text: { ja: '8時45分。人事部長とセキュリティ責任者が同時に部屋に入ってくる。「先週、遠隔で入社手続きを終えた上級エンジニアの端末が今朝届き、初期設定の直後にEDRが不正プログラムの読み込みを検知しました。本人に電話してもつながりません」。', en: '' }
    voices: [v01-hr, v01-legal, v01-ok]
    notable:
      - { id: note-interview, text: { ja: '最終面接の評価シートに、自分の字で「受け答えがスムーズ。即戦力」と書いた。', en: '' } }
    choices:
      - id: p01-command
        text: { ja: '対策本部を立ち上げ、端末の隔離とアカウント停止をセキュリティ責任者に任せ、法務に当局相談を指示する。', en: '' }
        explain: { ja: '本部立ち上げと隔離、停止、当局相談の段取りを同時に決めており、初動として妥当。自分で手を動かさない点も良い。', en: '' }
        minutes: 30
        category: maintain
        points: 25
        refs: [meti-csm-guideline, no06-government-advisory]
        gauges: { flame: -5, trust: 5, stamina: -5 }
        setFlags: { commandStarted: true }
        items:
          - { id: p01-b-time, points: 4, axis: time, refs: [jpcert-handling] }
          - { id: p01-b-order, points: 4, axis: order, refs: [meti-csm-guideline] }
          - { id: p01-b-record, points: 4, axis: record, refs: [jpcert-handling] }
      - id: p01-wait
        text: { ja: '誤検知かもしれないと判断し、人事から連絡が取れるまで待って、対策本部は明日の定例会議で立ち上げる。', en: '' }
        explain: { ja: '様子見は初動を遅らせる。連絡待ちの間に端末が社内へ接続し、証拠も失われやすい。判断を先送りした点が減点。', en: '' }
        minutes: 90
        category: hurt
        points: -80
        refs: [jpcert-handling]
        gauges: { flame: 10, trust: -5, stamina: 5 }
        coward: true
        setFlags: { delayedCommand: true }
        delayed:
          - { afterPhases: 1, points: -12, gauges: { trust: -10 }, reason: { ja: 'その日のうちに、同じアカウントで共有フォルダを開いた記録が見つかった。', en: '' } }
        items:
          - { id: p01-a-time, points: -7, axis: time, refs: [jpcert-handling] }
          - { id: p01-a-record, points: -6, axis: record, refs: [jpcert-handling] }
      - id: p01-personal
        text: { ja: 'EDRの管理画面を自分で操作し、担当者を差し置いて端末の中身と通信先を細かく確かめる。', en: '' }
        explain: { ja: '経営者が管理画面を直接操作すると指揮と調査が混ざる。担当者の権限を越え、記録も乱れる。役割を分けるべき場面。', en: '' }
        minutes: 60
        category: hurt
        points: -70
        refs: [nist-sp800-61r3]
        gauges: { stamina: -10, trust: -5 }
        items:
          - { id: p01-c-order, points: -7, axis: order, refs: [meti-csm-guideline] }
          - { id: p01-c-content, points: -7, axis: content, refs: [nist-sp800-61r3] }
          - { id: p01-c-record, points: -3, axis: record, refs: [nist-sp800-61r3] }
      - id: p01-wipe
        text: { ja: '端末を初期化して同じ型の新しい端末を送り、アカウントも作り直して作業を再開させる。', en: '' }
        explain: { ja: '初期化は端末上の痕跡を消し、侵入経路も漏えい範囲も分からなくする。復旧を急ぐほど説明責任は重くなる。', en: '' }
        minutes: 60
        category: fatal
        points: -200
        refs: [nist-sp800-61r3, meti-trade-secret]
        gauges: { damage: 10, flame: 10, trust: -15 }
        setFlags: { wipedDevice: true }
        items:
          - { id: p01-d-record, points: -14, axis: record, refs: [nist-sp800-61r3] }
          - { id: p01-d-content, points: -10, axis: content, refs: [meti-trade-secret] }
    lesson: { ja: 'まず対策本部を立ち上げ、端末の隔離とアカウント停止、ログ保全を担当者に任せる。経営者は状況と選択肢を受け取り、当局への相談の段取りを決める。誤検知を理由に待つと、その間に被害が広がる。', en: '' }

  - id: p02-isolate
    at: { day: 0, minutes: 600 }
    phase: contain
    sound: { se: [notify_chat] }
    text: { ja: '10時。端末は隔離した。だがアカウントは有効なままで、設計部門の共有フォルダに接続できる。止めれば、配属先が待っている図面の作業も止まる。', en: '' }
    voices: [v02-boss, v02-coward, v02-ok]
    choices:
      - id: p02-keep
        text: { ja: '仕事を止めないよう監視だけを強め、アカウントは有効なままにして現場の作業を続けさせる。', en: '' }
        explain: { ja: '監視だけでは止められない。アカウントが有効なまま共有フォルダに接続し、資料が読まれる。仕事を止めない理由が被害を広げる言い訳になる。', en: '' }
        minutes: 90
        category: hurt
        points: -100
        refs: [nist-sp800-61r3]
        gauges: { damage: 15, flame: 5 }
        delayed:
          - { afterPhases: 1, points: -15, gauges: { damage: 10, trust: -5 }, reason: { ja: '監視の目を抜けて、共有フォルダから資料が持ち出された形跡が見つかった。', en: '' } }
        items:
          - { id: p02-a-content, points: -7, axis: content, refs: [nist-sp800-61r3] }
          - { id: p02-a-time, points: -7, axis: time, refs: [nist-sp800-61r3] }
      - id: p02-stop-wide
        text: { ja: 'アカウントを止め、認証情報を入れ替え、設計部門のリモート接続も止めて理由と再開見通しを伝える。', en: '' }
        explain: { ja: '停止に加えて認証情報の入れ替えとリモート接続の停止まで行い、理由と見通しも伝えている。現場負担は大きいが封じ込めとして適切。', en: '' }
        minutes: 120
        category: recover
        points: 90
        refs: [nist-sp800-61r3, meti-csm-guideline]
        gauges: { flame: 5, damage: -10, trust: 10, stamina: -10 }
        setFlags: { accountStopped: true, credentialRotated: true }
        items:
          - { id: p02-c-content, points: 6, axis: content, refs: [nist-sp800-61r3] }
          - { id: p02-c-record, points: 6, axis: record, refs: [jpcert-handling] }
          - { id: p02-c-care, points: 4, axis: care, refs: [meti-csm-guideline] }
      - id: p02-stop
        text: { ja: 'アカウントを止め、EDRの記録と認証ログを保全して調査会社に渡し、担当していた図面は別の社員に引き継ぐ。', en: '' }
        explain: { ja: '停止と保全、担当業務の引き継ぎまで決めており、初動として妥当。認証情報の入れ替えまでは踏み込んでいないが、拡大は止められる。', en: '' }
        minutes: 60
        category: maintain
        points: 25
        refs: [jpcert-handling]
        gauges: { stamina: -5, trust: 5 }
        setFlags: { accountStopped: true }
        items:
          - { id: p02-b-order, points: 6, axis: order, refs: [jpcert-handling] }
          - { id: p02-b-record, points: 4, axis: record, refs: [jpcert-handling] }
      - id: p02-wipe
        text: { ja: '端末を初期化して同じ型の新しい端末を本人に送り、アカウントはそのまま使い続けてもらう。', en: '' }
        explain: { ja: '初期化は端末の痕跡を消し、侵入経路も漏えい範囲も分からなくする。復旧を急ぐほど、後で説明できない状態になる。', en: '' }
        minutes: 45
        category: fatal
        points: -200
        refs: [nist-sp800-61r3]
        gauges: { damage: 10, trust: -15 }
        setFlags: { wipedDevice: true }
        items:
          - { id: p02-d-record, points: -14, axis: record, refs: [nist-sp800-61r3] }
          - { id: p02-d-content, points: -10, axis: content, refs: [nist-sp800-61r3] }
    lesson: { ja: 'アカウント停止と認証情報の入れ替え、リモート接続の一時停止まで踏み込み、理由と再開見通しを社内に伝える。仕事を止める判断を避けると、その間に共有フォルダが読まれる。', en: '' }

  - id: p03-authority
    at: { day: 0, minutes: 840 }
    phase: organize
    sound: { se: [phone_ring] }
    text: { ja: '14時。対策本部が動き出した。警察と所管官庁に、どこまで話すか。まだ「不正アクセスがあった」と断定はできていない。', en: '' }
    voices: [v03-board, v03-law, v03-ok]
    choices:
      - id: p03-wait
        text: { ja: '断定できるまで外部には何も言わず、社内の整理だけを進め、当局への連絡は時期を見て決めると伝える。', en: '' }
        explain: { ja: '断定を待つ間に当局への連絡が遅れる。事実が固まっていなくても、分かっている範囲で相談するのが初動。待つ理由が説明の先送りになっている。', en: '' }
        minutes: 180
        category: hurt
        points: -100
        refs: [jpcert-handling]
        gauges: { flame: 10, trust: -10 }
        coward: true
        setFlags: { delayedReport: true }
        delayed:
          - { afterPhases: 1, points: -12, gauges: { flame: 10 }, reason: { ja: '所管官庁への連絡が遅れたことが、後から問題にされた。', en: '' } }
        items:
          - { id: p03-a-time, points: -7, axis: time, refs: [jpcert-handling] }
          - { id: p03-a-record, points: -6, axis: record, refs: [jpcert-handling] }
      - id: p03-police-only
        text: { ja: '警察にだけ相談し、所管官庁には契約に影響が出るまで伝えず、様子を見て判断する。', en: '' }
        explain: { ja: '警察への相談は良いが、所管官庁を契約への影響が出るまで避けている。報告の順序を選ぶ理由が会社の都合になっており、後で問われる。', en: '' }
        minutes: 60
        category: hurt
        points: -60
        refs: [npa-consult, no06-defense-report]
        gauges: { flame: 5, trust: -10 }
        setFlags: { policeOnly: true }
        items:
          - { id: p03-c-order, points: -7, axis: order, refs: [no06-defense-report] }
          - { id: p03-c-content, points: -3, axis: content, refs: [npa-consult] }
      - id: p03-report
        text: { ja: '分かっている事実を警察と所管官庁に報告し、証拠を保全して外部の専門家と弁護士の体制も整える。', en: '' }
        explain: { ja: '事実の報告と証拠保全、専門家と弁護士の体制を同時に整えており妥当。断定できない点は不明と分けて伝えるのが前提。', en: '' }
        minutes: 120
        category: recover
        points: 60
        refs: [npa-consult, meti-csm-guideline, no06-defense-report]
        gauges: { flame: -5, trust: 10, stamina: -10 }
        setFlags: { authorityReported: true }
        items:
          - { id: p03-b-order, points: 6, axis: order, refs: [meti-csm-guideline] }
          - { id: p03-b-content, points: 6, axis: content, refs: [npa-consult] }
          - { id: p03-b-record, points: 6, axis: record, refs: [jpcert-handling] }
      - id: p03-organize
        text: { ja: '警察と所管官庁への相談の順番と担当を決め、今日は事実の整理と証拠の確認に充てる。', en: '' }
        explain: { ja: '相談の順番と担当を決めるだけでは、外部への連絡が今日は進まない。整理は必要だが、期限のある報告を後ろに回すと遅れになる。', en: '' }
        minutes: 60
        category: maintain
        points: 25
        refs: [jpcert-handling]
        gauges: { trust: 3 }
        items:
          - { id: p03-d-time, points: 3, axis: time, refs: [jpcert-handling] }
          - { id: p03-d-order, points: 3, axis: order, refs: [meti-csm-guideline] }
    lesson: { ja: '断定できない段階でも、分かっている事実と不明点を分けて警察と所管官庁に相談する。報告を遅らせると、後から説明の順序を問われる。所管官庁を避けて警察だけに相談するのも偏りになる。', en: '' }

  - id: p06-contact
    at: { day: 1, minutes: 450 }
    phase: contain
    sound: { se: [notify_chat] }
    text: { ja: '翌朝7時30分。本人から社内チャットが届く。「回線の不調で端末がつながりません。端末を送り返したいので、住所を教えてください」。文面は丁寧で、焦りだけが見える。', en: '' }
    voices: [v06-attacker, v06-field, v06-ok]
    choices:
      - id: p06-reply
        text: { ja: '返送先の住所を教え、端末を初期化してそのまま送ってもらうよう本人に依頼し、到着を待つ。', en: '' }
        explain: { ja: '相手の指示に従って端末を返送させると、証拠が相手の管理下に戻る。初期化されれば痕跡も消える。親切な対応に見えて調査を放棄している。', en: '' }
        minutes: 60
        category: hurt
        points: -80
        refs: [nist-sp800-61r3]
        gauges: { damage: 10, trust: -5 }
        setFlags: { returnedDevice: true }
        items:
          - { id: p06-a-order, points: -7, axis: order, refs: [jpcert-handling] }
          - { id: p06-a-content, points: -7, axis: content, refs: [nist-sp800-61r3] }
      - id: p06-police
        text: { ja: '返信せず、チャットの記録を保全して警察に渡し、アカウントは閉じたまま、相手からの追加の連絡を待つ。', en: '' }
        explain: { ja: '返信せず記録を保全して警察に渡し、アカウントを閉じたままにしている。相手に情報を与えない判断は妥当。送付先の確認までは踏み込んでいない。', en: '' }
        minutes: 90
        category: maintain
        points: 25
        refs: [jpcert-handling, npa-consult]
        gauges: { trust: 5, stamina: -5 }
        items:
          - { id: p06-b-record, points: 6, axis: record, refs: [jpcert-handling] }
          - { id: p06-b-order, points: 6, axis: order, refs: [npa-consult] }
      - id: p06-delete
        text: { ja: 'チャットを削除し、アカウントを完全に消して、本人とのやり取りの記録を社内に残さない。', en: '' }
        explain: { ja: 'チャットを削除すると、相手の要求も連絡の時刻も残らない。証拠を消す行為で、後から説明も捜査への協力もできなくなる。', en: '' }
        minutes: 30
        category: fatal
        points: -200
        refs: [jpcert-handling]
        gauges: { flame: 15, trust: -15 }
        items:
          - { id: p06-d-record, points: -14, axis: record, refs: [jpcert-handling] }
          - { id: p06-d-content, points: -10, axis: content, refs: [jpcert-handling] }

      - id: p06-trace
        text: { ja: '返信せず記録を保全して警察に渡し、送付先の住所と同じ住所に端末が届いた会社への連絡も進める。', en: '' }
        explain: { ja: '記録保全と警察への相談に加え、送付先の確認と他社への連絡まで進めている。同じ手口の被害を広げない点が評価できる。', en: '' }
        minutes: 150
        category: recover
        points: 90
        refs: [npa-consult, no06-ipa-10threats]
        gauges: { trust: 10, stamina: -10 }
        setFlags: { addressShared: true }
        items:
          - { id: p06-c-record, points: 6, axis: record, refs: [jpcert-handling] }
          - { id: p06-c-order, points: 6, axis: order, refs: [npa-consult] }
          - { id: p06-c-care, points: 6, axis: care, refs: [no06-ipa-10threats] }
    lesson: { ja: '返送を求められても端末は証拠であり、相手の指示に従って初期化させない。記録を保全して警察に渡し、送付先の確認と他社への注意喚起まで進める。応じるかどうかは証拠と捜査を優先して決める。', en: '' }
  - id: p04-scope
    at: { day: 1, minutes: 540 }
    phase: investigate
    sound: { se: [notify_chat] }
    text: { ja: '翌朝9時。調査会社の第一報。端末は社内システムに接続し、設計部門の共有フォルダを閲覧していた。取引先担当者の連絡先一覧も、同じ場所に置かれていた。', en: '' }
    voices: [v04-expert, v04-insider, v04-ok]
    notable:
      - { id: note-scope, text: { ja: '端末は設計部門の共有フォルダを閲覧し、取引先担当者の連絡先一覧も同じ場所にあった。', en: '' } }
    choices:
      - id: p04-full
        text: { ja: '触れた全システムに調査を広げて持ち出しの有無を確認し、取引先の連絡先があるため報告も準備する。', en: '' }
        explain: { ja: '触れた全システムに調査を広げ、持ち出しの有無を確認し、報告の準備まで進めている。範囲を広げる負担は大きいが、必要な判断。', en: '' }
        minutes: 180
        category: recover
        points: 70
        refs: [nist-sp800-61r3, ppc-report-scope]
        gauges: { damage: -10, trust: 10, stamina: -15 }
        setFlags: { scopeExpanded: true }
        items:
          - { id: p04-b-content, points: 6, axis: content, refs: [nist-sp800-61r3] }
          - { id: p04-b-record, points: 6, axis: record, refs: [jpcert-handling] }
          - { id: p04-b-order, points: 4, axis: order, refs: [ppc-report-scope] }
      - id: p04-narrow
        text: { ja: '端末の中だけを調べ、共有フォルダの閲覧は操作ミスとして扱い、被害の届け出は行わず様子を見る。', en: '' }
        explain: { ja: '端末の中だけを見て閲覧を操作ミス扱いにすると、共有フォルダの被害が視野から落ちる。取引先の連絡先があっても報告しないため、後で訂正が必要になる。', en: '' }
        minutes: 120
        category: hurt
        points: -80
        refs: [nist-sp800-61r3]
        gauges: { damage: 15, trust: -10 }
        items:
          - { id: p04-a-content, points: -7, axis: content, refs: [nist-sp800-61r3] }
          - { id: p04-a-record, points: -7, axis: record, refs: [nist-sp800-61r3] }
      - id: p04-public
        text: { ja: '確認できた閲覧の事実を会社のSNSで今すぐ公表し、取引先への説明や当局への相談は後回しにする。', en: '' }
