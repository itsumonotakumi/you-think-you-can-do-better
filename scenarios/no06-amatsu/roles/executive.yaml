          - { id: fr-m-slogan, text: { ja: '「再発防止に努めます」とだけ書く', en: '' }, points: -7, axis: content, refs: [meti-csm-guideline], explain: { ja: '努力目標だけでは、何をいつ誰がやるのか分からない。実行されたかを後から確認できない。', en: '' } }
      - id: thirdparty
        label: { ja: '第三者委員会の意見', en: '' }
