          - { id: fd-r-log, text: { ja: '公表した時刻と版を記録する', en: '' }, points: 4, axis: record, refs: [jpcert-handling], explain: { ja: '版と時刻を残すと、後から公表内容の変遷を説明できる。訂正があった場合の土台になる。', en: '' } }
  final-report:
    title: { ja: '調査報告書の公開範囲', en: '' }
    slots:
      - id: scope
        label: { ja: '公開する範囲', en: '' }
        options:
          - { id: fr-s-full, text: { ja: '攻撃に使える詳細だけ伏せて全文公開する', en: '' }, points: 7, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '安全性と説明責任のバランスが取れている。伏せる範囲を限定すれば、公開する意味は残る。', en: '' } }
          - { id: fr-s-hide, text: { ja: '報告書は公開せず社内の関係者に留める', en: '' }, points: -14, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '公開しないと、説明責任を果たしていないと見られる。攻撃に使える部分だけ伏せる方法がある。', en: '' } }
      - id: cause
        label: { ja: '原因の書き方', en: '' }
        options:
          - { id: fr-c-vague, text: { ja: '「外部からの攻撃」とだけ書く', en: '' }, points: -7, axis: content, refs: [nist-sp800-61r3], explain: { ja: '外部からの攻撃とだけ書くと、自社の判断の誤りが見えない。再発防止の議論が進まない。', en: '' } }
