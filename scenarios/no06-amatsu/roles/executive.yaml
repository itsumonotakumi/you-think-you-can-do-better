drafts:
  public-statement:
    title: { ja: '公表文の文案', en: '' }
    slots:
      - id: timing
        label: { ja: '公表までの時間', en: '' }
        auto: true
        items:
          - { id: fd-t-120, when: { withinHours: 120 }, points: 7, axis: time, refs: [meti-disclosure-guidance] }
          - { id: fd-t-168, when: { withinHours: 168 }, points: 2, axis: time, refs: [meti-disclosure-guidance] }
          - { id: fd-t-late, when: { otherwise: true }, points: -10, axis: time, refs: [meti-disclosure-guidance] }
      - id: scope
        label: { ja: '対象範囲', en: '' }
        options:
          - { id: fd-s-all, text: { ja: '全リモート採用者と取引先の連絡先一覧まで含めて書く', en: '' }, points: 7, axis: content, refs: [ppc-report-scope], explain: { ja: '範囲を広く取るほど後からの訂正は減る。見落としを足すより、対象を先に示した方が信頼される。', en: '' } }
          - { id: fd-s-device, text: { ja: '今回の端末と、その利用者の情報だけに絞って書く', en: '' }, points: -14, axis: content, refs: [ppc-report-scope], delayed: { afterPhases: 1, points: -20, reason: { ja: '対象の訂正が必要になった。', en: '' } }, explain: { ja: '狭く絞ると、同じ経路で入った人の分が抜ける。後で対象の訂正が必要になり、説明の信頼を落とす。', en: '' } }
      - id: facts
        label: { ja: '確認できた事実', en: '' }
        options:
          - { id: fd-f-vague, text: { ja: '「一部の情報に触れた可能性がある」とだけ書く', en: '' }, points: -6, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '可能性とだけ書くと、何が起きたのか伝わらない。確認できた事実を出さない分、説明責任を果たしていない。', en: '' } }
          - { id: fd-f-confirmed, text: { ja: '端末の不正プログラムと共有フォルダの閲覧を確認したと書く', en: '' }, points: 7, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '確認できた事実を具体的に書いており、後から説明を変えにくい。範囲が限定されている点も正確。', en: '' } }
          - { id: fd-f-none, text: { ja: '「被害はなく、情報も漏れていない」と明確に書く', en: '' }, points: -14, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '被害なしと断言すると、端末が不正プログラムを読み込んだ事実と食い違う。後で訂正が必要になる。', en: '' } }
      - id: hiring
        label: { ja: '採用の経緯', en: '' }
        options:
          - { id: fd-h-admit, text: { ja: '遠隔の面接だけで本人確認を終えたと書く', en: '' }, points: 7, axis: content, refs: [no06-government-advisory], explain: { ja: '採用の穴を具体的に書いており、再発防止の出発点になる。批判は受けるが、後で問われにくい。', en: '' } }
          - { id: fd-h-hide, text: { ja: '「採用の経緯は確認中」とだけ書く', en: '' }, points: -14, axis: content, refs: [no06-government-advisory], explain: { ja: '経緯を確認中で止めると、面接がすべて遠隔だった事実が伝わらない。後で追加説明を求められる。', en: '' } }
      - id: wording
        label: { ja: '断定の強さ', en: '' }
        options:
          - { id: fd-w-split, text: { ja: '「確認した事実」と「調査中」を使い分ける', en: '' }, points: 6, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: '事実と調査中を分けると、後で分かったことを足しても説明が崩れない。公表文の基本。', en: '' } }
          - { id: fd-w-all, text: { ja: 'すべて「確認済み」と断定して書く', en: '' }, points: -7, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: '断定しすぎると、後で否定する材料が出たときに訂正が必要になる。不確実な点は残すべき。', en: '' } }
          - { id: fd-w-none, text: { ja: '「問題はありません」とだけ書いて済ませる', en: '' }, points: -10, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: '問題なしとだけ書くと、何を確認したのか分からない。説明の材料にならず、信頼を得られない。', en: '' } }
      - id: authority
        label: { ja: '当局への報告', en: '' }
        options:
          - { id: fd-a-report, text: { ja: '警察と所管官庁に報告済みと書く', en: '' }, points: 6, axis: order, refs: [npa-consult], explain: { ja: '当局への報告を明記すると、会社が事実と向き合っていることが伝わる。隠していない証明にもなる。', en: '' } }
          - { id: fd-a-none, text: { ja: '当局への報告には触れずに書く', en: '' }, points: -7, axis: order, refs: [npa-consult], explain: { ja: '報告に触れないと、当局との関係を隠したように見える。公表文の中で位置づけを説明したい。', en: '' } }
      - id: partners
        label: { ja: '取引先への連絡', en: '' }
        options:
          - { id: fd-p-news, text: { ja: '取引先には報道で伝わると書く', en: '' }, points: -7, axis: order, refs: [meti-csm-guideline], explain: { ja: '報道で伝わると書くと、取引先を後回しにしたことが明らかになる。契約の見直しにつながりやすい。', en: '' } }
          - { id: fd-p-first, text: { ja: '公表前に取引先へ個別に連絡したと書く', en: '' }, points: 6, axis: order, refs: [meti-csm-guideline], explain: { ja: '取引先への先行情報提供は、説明の順序として評価される。取引先も個人情報の取扱事業者。', en: '' } }
      - id: person
        label: { ja: '人物の扱い', en: '' }
        options:
          - { id: fd-per-none, text: { ja: '個人名・写真・国籍を出さない', en: '' }, points: 7, axis: care, refs: [meti-trade-secret], explain: { ja: '特定につながる情報を出さない判断は妥当。実在する人物の権利を守り、捜査にも支障を出さない。', en: '' } }
          - { id: fd-per-name, text: { ja: '人物の特定につながる情報を出す', en: '' }, points: -14, axis: care, refs: [meti-trade-secret], explain: { ja: '名前や写真を出すと、実在する人物の生活を傷つける。注意喚起は特定しない形で行うべき。', en: '' } }
      - id: employee
        label: { ja: '社員への説明', en: '' }
        options:
          - { id: fd-e-none, text: { ja: '社内への説明や相談窓口の設置には触れない', en: '' }, points: -6, axis: care, refs: [no06-telework-guideline], explain: { ja: '社内説明に触れないと、社員は報道で初めて知る。現場の不安と会社への不信が長く残る。', en: '' } }
          - { id: fd-e-care, text: { ja: '社員向けの説明会と相談窓口を書く', en: '' }, points: 6, axis: care, refs: [no06-telework-guideline], explain: { ja: '社員への説明と相談窓口は、不安を差別に変えないための基本。公表文に書くと実行も促される。', en: '' } }
      - id: contact
