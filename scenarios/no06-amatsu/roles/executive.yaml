          - { id: fr-p-monthly, text: { ja: '進捗を毎月公開する', en: '' }, points: 7, axis: record, refs: [meti-disclosure-guidance], explain: { ja: '毎月の公開を約束すると、再発防止策が続いているかを外部から確認できる。説明責任の継続になる。', en: '' } }
      - id: industry
        label: { ja: '業界への共有', en: '' }
        options:
          - { id: fr-i-share, text: { ja: '得た教訓を業界に無償で共有する', en: '' }, points: 7, axis: content, refs: [no06-ipa-10threats], explain: { ja: '教訓の共有は、同じ手口の被害を業界全体で減らす。自社の信用回復にもつながる対応。', en: '' } }
          - { id: fr-i-keep, text: { ja: '教訓は自社の中だけに留めておく', en: '' }, points: -3, axis: content, refs: [no06-ipa-10threats], explain: { ja: '自社だけに留めると、同じ手口の被害が他社で繰り返される。共有しない理由はほとんどない。', en: '' } }
      - id: rights
        label: { ja: '人物の扱い', en: '' }
