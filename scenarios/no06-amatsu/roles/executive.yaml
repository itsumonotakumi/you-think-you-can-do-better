        options:
          - { id: fd-c-number, text: { ja: '問い合わせの番号と受付時間だけを書く', en: '' }, points: 2, axis: care, refs: [ppc-notify-person], explain: { ja: '番号と時間だけでは、問い合わせが集中したときの対応が見えない。増員まで示したい。', en: '' } }
          - { id: fd-c-none, text: { ja: '問い合わせ窓口は設けないと書く', en: '' }, points: -10, axis: care, refs: [ppc-notify-person], explain: { ja: '窓口を設けないと、対象者が説明を求める先を失う。個人情報の漏えい時には特に不利。', en: '' } }
          - { id: fd-c-full, text: { ja: '専用窓口の番号、受付時間、増員を書く', en: '' }, points: 6, axis: care, refs: [ppc-notify-person], explain: { ja: '窓口の体制まで書くと、問い合わせが集中しても対応できる。対象者の不安を減らす具体策。', en: '' } }
      - id: next
        label: { ja: '次の報告', en: '' }
        options:
          - { id: fd-n-none, text: { ja: '次回の予定を書かない', en: '' }, points: -3, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '次回の予定がないと、公表後に関心が途切れたように見える。継続的な説明の約束が弱い。', en: '' } }
          - { id: fd-n-next, text: { ja: '次の報告予定を書く', en: '' }, points: 4, axis: content, refs: [meti-disclosure-guidance], explain: { ja: '次の報告予定を示すと、調査が続いていることが伝わる。公表して終わりにしない姿勢。', en: '' } }
      - id: apology
        label: { ja: '謝罪の主語', en: '' }
        options:
          - { id: fd-ap-company, text: { ja: '「当社」の責任として謝罪する', en: '' }, points: 4, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: '会社として謝罪すると、責任の所在が明確になる。担当者個人に寄せない点が信頼につながる。', en: '' } }
          - { id: fd-ap-person, text: { ja: '「採用担当者」の責任とする', en: '' }, points: -7, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: '担当者個人の責任にすると、会社が判断の誤りから逃げているように見える。再発防止も弱くなる。', en: '' } }
      - id: excuse
