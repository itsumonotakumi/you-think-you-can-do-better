          - { id: fr-t-full, text: { ja: '第三者委員会の意見を全文掲載する', en: '' }, points: 6, axis: content, refs: [cissp-cbk-secops], explain: { ja: '第三者委員会の意見をそのまま載せると、自社に都合のよい編集をしていないことが伝わる。', en: '' } }
      - id: victims
        label: { ja: '被害者への補償', en: '' }
