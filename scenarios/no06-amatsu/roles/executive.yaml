          - { id: fd-ex-country, text: { ja: '「某国の工作員」と前置きして書く', en: '' }, points: -8, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: '国籍や工作員という前置きは、偏見を強め、事実の説明から注意をそらす。根拠も示せない。', en: '' } }
          - { id: fd-ex-none, text: { ja: '言い訳を前置きせず、事実から書き始める', en: '' }, points: 4, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: '言い訳を置かないと、事実と対応が読みやすい。感情的な反発を招きにくい書き出しになる。', en: '' } }
