          - { id: fr-v-none, text: { ja: '被害者への補償に触れない', en: '' }, points: -7, axis: care, refs: [ppc-notify-person], explain: { ja: '補償に触れないと、被害者を置き去りにした印象になる。対応の実績を具体的に示すべき。', en: '' } }
      - id: progress
