# No.6 アマツ重工 / 経営者ロール
# 判断ポイント16、細目は choices[].items と drafts の合計で80以上。
estimateMinutes: 35
intro: { ja: 'あなたはアマツ重工の代表取締役社長。防衛と重要インフラの機器を作る会社で、遠隔採用した新人が端末を受け取った朝に消えた。何をどこまで話すかで、会社の信用が決まる。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-ppc-prelim
    ref: ppc-report-prelim
    label: { ja: '個人情報保護委員会への速報', en: '' }
    points: -150
    doneFlag: ppcPrelimFiled
events:
  - id: ev-news
    at: { day: 4, minutes: 780 }
    voices: [v-ev-news]
    gauges: { flame: 10 }
    sound: { se: [notify_news] }
    caption: { ja: '週刊誌の速報が出た。「大手重工、偽の新人を採用か」。', en: '' }
  - id: ev-partner
    at: { day: 5, minutes: 540 }
    voices: [v-ev-partner]
    gauges: { flame: 5 }
    sound: { se: [phone_ring] }
    caption: { ja: '主要取引先の調達部長から電話。説明の場を求められている。', en: '' }
  - id: ev-police
    at: { day: 18, minutes: 540 }
    voices: [v-ev-police]
    gauges: { flame: 5 }
    sound: { se: [phone_ring] }
    caption: { ja: '警察から、端末と記録の任意提出を求められた。', en: '' }
points:
  - id: p01-alert
    at: { day: 0, minutes: 525 }
    phase: detect
    sound: { se: [notify_chat] }
    text: { ja: '8時45分。人事部長とセキュリティ責任者が同時に部屋に入ってくる。「先週、遠隔で入社手続きを終えた上級エンジニアの端末が今朝届き、初期設定の直後にEDRが不正プログラムの読み込みを検知しました。本人に電話してもつながりません」。', en: '' }
    voices: [v01-hr, v01-legal, v01-ok]
    notable:
      - { id: note-interview, text: { ja: '最終面接の評価シートに、自分の字で「受け答えがスムーズ。即戦力」と書いた。', en: '' } }
    choices:
      - id: p01-wait
        text: { ja: '誤検知かもしれない。人事から連絡が取れるまで待ち、対策本部は明日の定例会議で立ち上げる。', en: '' }
        minutes: 90
        category: hurt
        points: -120
        refs: [jpcert-handling]
        gauges: { flame: 10, trust: -5, stamina: 5 }
        coward: true
        setFlags: { delayedCommand: true }
        delayed:
          - { afterPhases: 1, points: -40, gauges: { trust: -10 }, reason: { ja: 'その日のうちに、同じアカウントで共有フォルダを開いた記録が見つかった。', en: '' } }
        items:
          - { id: p01-a-time, points: -10, axis: time, refs: [jpcert-handling] }
          - { id: p01-a-record, points: -8, axis: record, refs: [jpcert-handling] }
      - id: p01-command
        text: { ja: '対策本部を立ち上げ、端末の隔離とアカウント停止をセキュリティ責任者に一任する。警察と所管官庁への相談は法務に指示する。', en: '' }
        minutes: 30
        category: maintain
        points: 20
        refs: [meti-csm-guideline, no06-government-advisory]
        gauges: { flame: -5, trust: 5, stamina: -5 }
        setFlags: { commandStarted: true }
        items:
          - { id: p01-b-time, points: 5, axis: time, refs: [jpcert-handling] }
          - { id: p01-b-order, points: 5, axis: order, refs: [meti-csm-guideline] }
          - { id: p01-b-record, points: 5, axis: record, refs: [jpcert-handling] }
      - id: p01-personal
        text: { ja: '自分で端末を受け取りに行き、電源を入れて中身を確かめる。', en: '' }
        minutes: 60
        category: hurt
        points: -60
        refs: [nist-sp800-61r3]
        gauges: { stamina: -10, trust: -5 }
        items:
          - { id: p01-c-order, points: -10, axis: order, refs: [meti-csm-guideline] }
          - { id: p01-c-content, points: -10, axis: content, refs: [nist-sp800-61r3] }
          - { id: p01-c-record, points: -5, axis: record, refs: [nist-sp800-61r3] }
      - id: p01-wipe
        text: { ja: '端末を初期化して新しい端末を送り、アカウントは作り直す。', en: '' }
        minutes: 60
        category: fatal
        points: -250
        refs: [nist-sp800-61r3, meti-trade-secret]
        gauges: { damage: 10, flame: 10, trust: -15 }
        setFlags: { wipedDevice: true }
        items:
          - { id: p01-d-record, points: -20, axis: record, refs: [nist-sp800-61r3] }
          - { id: p01-d-content, points: -15, axis: content, refs: [meti-trade-secret] }

  - id: p02-isolate
    at: { day: 0, minutes: 600 }
    phase: contain
    sound: { se: [notify_chat] }
    text: { ja: '10時。端末は隔離した。だがアカウントは有効なままで、設計部門の共有フォルダに接続できる。止めれば、配属先が待っている図面の作業も止まる。', en: '' }
    voices: [v02-boss, v02-coward, v02-ok]
    choices:
      - id: p02-keep
        text: { ja: '止めずに監視を強める。仕事を止めたら、現場が回らない。', en: '' }
        minutes: 90
        category: hurt
        points: -100
        refs: [nist-sp800-61r3]
        gauges: { damage: 15, flame: 5 }
        delayed:
          - { afterPhases: 1, points: -50, gauges: { damage: 10, trust: -5 }, reason: { ja: '監視の目を抜けて、共有フォルダから資料が持ち出された形跡が見つかった。', en: '' } }
        items:
          - { id: p02-a-content, points: -10, axis: content, refs: [nist-sp800-61r3] }
          - { id: p02-a-time, points: -10, axis: time, refs: [nist-sp800-61r3] }
      - id: p02-stop
        text: { ja: 'アカウントを止め、端末とログを保全して調査会社に渡す。担当していた図面は別の社員に引き継ぐ。', en: '' }
        minutes: 60
        category: maintain
        points: 20
        refs: [jpcert-handling]
        gauges: { stamina: -5, trust: 5 }
        setFlags: { accountStopped: true }
        items:
          - { id: p02-b-order, points: 8, axis: order, refs: [jpcert-handling] }
          - { id: p02-b-record, points: 5, axis: record, refs: [jpcert-handling] }
      - id: p02-stop-wide
        text: { ja: 'アカウントを止め、認証情報をすべて入れ替える。設計部門のリモート接続を一時停止し、理由と再開の見通しを社内に伝える。', en: '' }
        minutes: 120
        category: recover
        points: 100
        refs: [nist-sp800-61r3, meti-csm-guideline]
        gauges: { flame: 5, damage: -10, trust: 10, stamina: -10 }
        setFlags: { accountStopped: true, credentialRotated: true }
        items:
          - { id: p02-c-content, points: 8, axis: content, refs: [nist-sp800-61r3] }
          - { id: p02-c-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: p02-c-care, points: 5, axis: care, refs: [meti-csm-guideline] }
      - id: p02-wipe
        text: { ja: '端末を初期化して、同じ型の新しい端末を本人に送る。', en: '' }
        minutes: 45
        category: fatal
        points: -250
        refs: [nist-sp800-61r3]
        gauges: { damage: 10, trust: -15 }
        setFlags: { wipedDevice: true }
        items:
          - { id: p02-d-record, points: -20, axis: record, refs: [nist-sp800-61r3] }
          - { id: p02-d-content, points: -15, axis: content, refs: [nist-sp800-61r3] }

  - id: p03-authority
    at: { day: 0, minutes: 840 }
    phase: organize
    sound: { se: [phone_ring] }
    text: { ja: '14時。対策本部が動き出した。警察と所管官庁に、どこまで話すか。まだ「不正アクセスがあった」と断定はできていない。', en: '' }
    voices: [v03-board, v03-law, v03-ok]
    choices:
      - id: p03-wait
        text: { ja: '断定できるまで、外部には何も言わない。', en: '' }
        minutes: 180
        category: hurt
        points: -120
        refs: [jpcert-handling]
        gauges: { flame: 10, trust: -10 }
        coward: true
        setFlags: { delayedReport: true }
        delayed:
          - { afterPhases: 1, points: -40, gauges: { flame: 10 }, reason: { ja: '所管官庁への連絡が遅れたことが、後から問題にされた。', en: '' } }
        items:
          - { id: p03-a-time, points: -10, axis: time, refs: [jpcert-handling] }
          - { id: p03-a-record, points: -8, axis: record, refs: [jpcert-handling] }
      - id: p03-report
        text: { ja: '分かっている事実を警察と所管官庁に報告し、証拠を保全する。外部の専門家と弁護士の体制も同時に整える。', en: '' }
        minutes: 120
        category: recover
        points: 100
        refs: [npa-consult, meti-csm-guideline, no06-economic-security]
        gauges: { flame: -5, trust: 10, stamina: -10 }
        setFlags: { authorityReported: true }
        items:
          - { id: p03-b-order, points: 8, axis: order, refs: [meti-csm-guideline] }
          - { id: p03-b-content, points: 8, axis: content, refs: [npa-consult] }
          - { id: p03-b-record, points: 8, axis: record, refs: [jpcert-handling] }
      - id: p03-police-only
        text: { ja: '警察にだけ相談し、所管官庁には契約に影響が出るまで伝えない。', en: '' }
        minutes: 60
        category: hurt
        points: -80
        refs: [npa-consult, no06-economic-security]
        gauges: { flame: 5, trust: -10 }
        setFlags: { policeOnly: true }
        items:
          - { id: p03-c-order, points: -10, axis: order, refs: [no06-economic-security] }
          - { id: p03-c-content, points: -5, axis: content, refs: [npa-consult] }

  - id: p04-scope
    at: { day: 1, minutes: 540 }
    phase: investigate
    sound: { se: [notify_chat] }
    text: { ja: '翌朝9時。調査会社の第一報。端末は社内システムに接続し、設計部門の共有フォルダを閲覧していた。取引先担当者の連絡先一覧も、同じ場所に置かれていた。', en: '' }
    voices: [v04-expert, v04-insider, v04-ok]
    notable:
      - { id: note-scope, text: { ja: '端末は設計部門の共有フォルダを閲覧し、取引先担当者の連絡先一覧も同じ場所にあった。', en: '' } }
    choices:
      - id: p04-narrow
        text: { ja: '端末の中だけを調べ、閲覧は「操作ミス」として扱う。', en: '' }
        minutes: 120
        category: hurt
        points: -100
        refs: [nist-sp800-61r3]
        gauges: { damage: 15, trust: -10 }
        items:
          - { id: p04-a-content, points: -10, axis: content, refs: [nist-sp800-61r3] }
          - { id: p04-a-record, points: -10, axis: record, refs: [nist-sp800-61r3] }
      - id: p04-full
        text: { ja: 'そのアカウントが触れた全システムに調査を広げ、持ち出しの有無を確認する。取引先の連絡先が含まれるため、個人情報保護委員会への報告も準備する。', en: '' }
        minutes: 180
        category: recover
        points: 100
        refs: [nist-sp800-61r3, ppc-report-scope]
        gauges: { damage: -10, trust: 10, stamina: -15 }
        setFlags: { scopeExpanded: true }
        items:
          - { id: p04-b-content, points: 8, axis: content, refs: [nist-sp800-61r3] }
          - { id: p04-b-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: p04-b-order, points: 5, axis: order, refs: [ppc-report-scope] }
      - id: p04-public
        text: { ja: '確認できた閲覧の事実を、社のSNSで今すぐ公表する。', en: '' }
        minutes: 60
        category: hurt
        points: -60
        refs: [meti-disclosure-guidance]
        gauges: { flame: 10, trust: -5 }
        items:
          - { id: p04-c-wording, points: -10, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: p04-c-content, points: -8, axis: content, refs: [meti-disclosure-guidance] }

  - id: p05-prelim
    at: { day: 1, minutes: 900 }
    phase: notify
    sound: { se: [phone_ring] }
    text: { ja: '15時。取引先担当者の連絡先一覧が共有フォルダにあった。個人情報保護委員会への速報を出すか。期限は三日。件数はまだ固まっていない。', en: '' }
    voices: [v05-boss, v05-law, v05-popular, v05-ok]
    choices:
      - id: p05-wait
        text: { ja: '件数が固まってから報告する。中途半端な数字は出せない。', en: '' }
        minutes: 120
        category: hurt
        points: -150
        refs: [ppc-report-prelim]
        gauges: { flame: 15, trust: -10, damage: 10 }
        coward: true
        setFlags: { delayedReport: true }
        delayed:
          - { afterPhases: 1, points: -40, gauges: { flame: 10 }, reason: { ja: '期限に間に合わず、法定の報告を怠ったと報道された。', en: '' } }
        items:
          - { id: p05-a-time, points: -10, axis: time, refs: [ppc-report-prelim] }
          - { id: p05-a-record, points: -10, axis: record, refs: [ppc-report-prelim] }
      - id: p05-file
        text: { ja: '分かっている範囲で速報を出し、不明点は調査中と明記する。本人通知の準備も同時に始める。', en: '' }
        minutes: 150
        category: recover
        points: 100
        refs: [ppc-report-prelim, ppc-notify-person]
        gauges: { trust: 10, stamina: -10 }
        setFlags: { ppcPrelimFiled: true }
        items:
          - { id: p05-b-time, points: 8, axis: time, refs: [ppc-report-prelim] }
          - { id: p05-b-content, points: 8, axis: content, refs: [ppc-report-prelim] }
          - { id: p05-b-record, points: 8, axis: record, refs: [ppc-report-prelim] }
      - id: p05-oral
        text: { ja: '所管官庁には口頭で相談するが、書面は出さない。', en: '' }
        minutes: 60
        category: hurt
        points: -120
        refs: [ppc-report-prelim]
        gauges: { flame: 10, trust: -10 }
        items:
          - { id: p05-c-record, points: -10, axis: record, refs: [ppc-report-prelim] }
          - { id: p05-c-time, points: -8, axis: time, refs: [ppc-report-prelim] }
      - id: p05-none
        text: { ja: '連絡先だけなら報告の対象ではないと判断し、報告しない。', en: '' }
        minutes: 30
        category: fatal
        points: -250
        refs: [ppc-report-scope]
        gauges: { flame: 20, trust: -20, damage: 10 }
        setFlags: { hidFacts: true }
        items:
          - { id: p05-d-record, points: -20, axis: record, refs: [ppc-report-scope] }
          - { id: p05-d-content, points: -15, axis: content, refs: [ppc-report-scope] }

  - id: p06-contact
    at: { day: 2, minutes: 600 }
    phase: contain
    sound: { se: [notify_chat] }
    text: { ja: '翌朝10時。本人から社内チャットが届く。「ルーターの不具合で端末がつながりません。端末を送り返したいので、住所を教えてください」。文面は丁寧で、焦りだけが見える。', en: '' }
    voices: [v06-attacker, v06-field, v06-ok]
    choices:
      - id: p06-reply
        text: { ja: '返送先の住所を教え、端末を送ってもらう。', en: '' }
        minutes: 60
        category: hurt
        points: -120
        refs: [nist-sp800-61r3]
        gauges: { damage: 10, trust: -5 }
        setFlags: { returnedDevice: true }
        items:
          - { id: p06-a-order, points: -10, axis: order, refs: [jpcert-handling] }
          - { id: p06-a-content, points: -10, axis: content, refs: [nist-sp800-61r3] }
      - id: p06-police
        text: { ja: '返信せず、チャットの記録を保全して警察に渡す。アカウントは閉じたままにする。', en: '' }
        minutes: 90
        category: maintain
        points: 20
        refs: [jpcert-handling, npa-consult]
        gauges: { trust: 5, stamina: -5 }
        items:
          - { id: p06-b-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: p06-b-order, points: 8, axis: order, refs: [npa-consult] }
      - id: p06-trace
        text: { ja: '返信せず、記録を保全して警察に渡す。送付先の住所の確認と、同じ住所に端末が届いた会社への連絡も警察と進める。', en: '' }
        minutes: 150
        category: recover
        points: 100
        refs: [npa-consult, no06-ipa-10threats]
        gauges: { trust: 10, stamina: -10 }
        setFlags: { addressShared: true }
        items:
          - { id: p06-c-record, points: 8, axis: record, refs: [jpcert-handling] }
          - { id: p06-c-order, points: 8, axis: order, refs: [npa-consult] }
          - { id: p06-c-care, points: 8, axis: care, refs: [no06-ipa-10threats] }
      - id: p06-delete
        text: { ja: 'チャットを削除し、アカウントを完全に消す。', en: '' }
        minutes: 30
        category: fatal
        points: -250
        refs: [jpcert-handling]
        gauges: { flame: 15, trust: -15 }
        items:
          - { id: p06-d-record, points: -20, axis: record, refs: [jpcert-handling] }
          - { id: p06-d-content, points: -15, axis: content, refs: [jpcert-handling] }

  - id: p07-reverify
    at: { day: 2, minutes: 960 }
    phase: organize
    sound: { se: [notify_chat] }
    text: { ja: '16時。人事部長が来る。「同じ採用の経路で入ったリモート社員が十二名います。本人確認をやり直しますか」。対象者からは「なぜ自分たちだけ」という声が出ている。', en: '' }
    voices: [v07-hr, v07-sns, v07-insider, v07-ok]
    notable:
      - { id: note-hiring, text: { ja: '採用は遠隔の面接4回のみ。本人確認は外部の確認会社に委託し、対面では一度もしていない。', en: '' } }
    choices:
      - id: p07-narrow
        text: { ja: '同じ採用担当者が関わった三人だけを、静かに確認する。', en: '' }
        minutes: 120
        category: hurt
        points: -90
        refs: [no06-government-advisory]
        gauges: { trust: -10, stamina: -5 }
        items:
          - { id: p07-a-content, points: -10, axis: content, refs: [no06-government-advisory] }
          - { id: p07-a-care, points: -8, axis: care, refs: [no06-telework-guideline] }
      - id: p07-all
        text: { ja: '十二名全員の本人確認と端末の送付先を、対面を含めてやり直す。目的と範囲を文書で説明し、対象者には不利益を出さないと約束する。', en: '' }
        minutes: 240
        category: recover
        points: 120
        refs: [no06-government-advisory, no06-telework-guideline]
        gauges: { trust: 15, flame: -5, stamina: -15 }
        setFlags: { identityReverified: true }
        items:
          - { id: p07-b-content, points: 8, axis: content, refs: [no06-government-advisory] }
          - { id: p07-b-care, points: 8, axis: care, refs: [no06-telework-guideline] }
          - { id: p07-b-order, points: 8, axis: order, refs: [meti-csm-guideline] }
      - id: p07-stop-remote
        text: { ja: '本人確認が終わるまで、リモート勤務を全面的に止める。', en: '' }
        minutes: 120
        category: hurt
        points: -70
        refs: [no06-telework-guideline]
        gauges: { damage: 10, trust: -5, stamina: -5 }
        items:
          - { id: p07-c-care, points: -10, axis: care, refs: [no06-telework-guideline] }
          - { id: p07-c-content, points: -8, axis: content, refs: [no06-government-advisory] }
      - id: p07-target-foreign
        text: { ja: '外国籍の社員だけに、追加の書類提出と面談を求める。', en: '' }
        minutes: 90
        category: fatal
        points: -250
        refs: [no06-telework-guideline]
        gauges: { flame: 20, trust: -20 }
        items:
          - { id: p07-d-care, points: -20, axis: care, refs: [no06-telework-guideline] }
          - { id: p07-d-content, points: -15, axis: content, refs: [no06-government-advisory] }

  - id: p08-address
    at: { day: 3, minutes: 540 }
    phase: investigate
    sound: { se: [mail_arrive] }
    text: { ja: '3日目。貸与端末の送付先を調べると、同じ住所に別の会社の端末も届いていた。住所は某国内の共同オフィスとみられる。', en: '' }
