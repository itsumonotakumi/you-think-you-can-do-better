          - { id: fd-i-share, text: { ja: '公表前に広報・法務・人事で確認する', en: '' }, points: 4, axis: order, refs: [meti-csm-guideline], explain: { ja: '複数の部署で確認すると、事実誤認や表現の偏りを減らせる。公表後の訂正も少なくなる。', en: '' } }
          - { id: fd-i-solo, text: { ja: '社長の判断だけで公表に踏み切る', en: '' }, points: -7, axis: order, refs: [meti-csm-guideline], explain: { ja: '一人で決めると、法務や広報の確認が抜ける。表現の誤りや法的な問題を見落としやすい。', en: '' } }
      - id: record
