          - { id: fr-r-omit, text: { ja: '人物の国籍や出身、属性には触れない', en: '' }, points: -8, axis: care, refs: [no06-telework-guideline], explain: { ja: '属性に触れないだけでは、現場の疑いを解くメッセージにならない。方針として示す必要がある。', en: '' } }
          - { id: fr-r-rights, text: { ja: '国籍や出身で人を疑わない方針を明記する', en: '' }, points: 7, axis: care, refs: [no06-equal-treatment], explain: { ja: '方針を明記すると、社内の偏見を抑える効果がある。被害の防止と国籍は関係ないことを示せる。', en: '' } }
      - id: ad
        label: { ja: '宣伝との線引き', en: '' }
        options:
          - { id: fr-ad-none, text: { ja: '復旧を宣伝に使わない', en: '' }, points: 4, axis: care, refs: [meti-disclosure-guidance], explain: { ja: '復旧を宣伝に使わないと、被害者への配慮が伝わる。事件を売り込みに使う印象を避けられる。', en: '' } }
          - { id: fr-ad-use, text: { ja: '復旧を宣伝に使う', en: '' }, points: -10, axis: care, refs: [meti-disclosure-guidance], explain: { ja: '復旧を宣伝に使うと、被害や不安を軽く扱った印象になる。信用回復の妨げになるだけ。', en: '' } }
