# No.6 アマツ重工 / セキュリティ部門長（セキュリティ対策室長）ロール
# 判断ポイント21、細目は choices[].items と drafts の合計で80以上。
# 視点: 専任のセキュリティ部署が小さい会社で、技術と経営の間を翻訳する部門長。
#       端末の隔離、証拠の保全、外部専門家の手配、経営への上申、復旧の安全確認が仕事。
estimateMinutes: 45
intro: { ja: 'あなたはアマツ重工のセキュリティ対策室長。専任は自分を含めて3名で、1名は生産技術部との兼任だ。執行役員セキュリティ責任者の芹沢みなみの下で、技術の状況を経営の言葉に訳し、限られた人数で封じ込めと復旧を両立させる。8時45分、人事部長の宮下と芹沢が同時に部屋に入ってくる。遠隔で採用した上級エンジニアの端末が、初期設定の直後に不正プログラムを読み込んだ。本人に電話してもつながらない。あなたの一か月が始まる。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-ppc-prelim
    ref: ppc-report-prelim
    label: { ja: '個人情報保護委員会への速報', en: '' }
    points: -150
    doneFlag: ppcPrelimFiled
  - id: dl-ppc-final
    ref: ppc-report-final-malicious
    label: { ja: '個人情報保護委員会への確報', en: '' }
    points: -100
    doneFlag: ppcFinalFiled
events:
  - id: ev-night
    at: { day: 1, minutes: 120 }
    voices: [v-ev-night]
    gauges: { stamina: -5 }
    caption: { ja: '日付が変わった。兼任の1名は、生産技術部の当番を終えてから戻ってくる。', en: '' }
  - id: ev-news
    at: { day: 4, minutes: 780 }
    voices: [v-ev-news]
    gauges: { flame: 10 }
    sound: { se: [notify_news] }
    caption: { ja: '週刊誌の速報が出た。「大手重工、偽の新人を採用か」。', en: '' }
  - id: ev-partner
    at: { day: 5, minutes: 540 }
    voices: [v-ev-partner]
    gauges: { flame: 5 }
    sound: { se: [phone_ring] }
    caption: { ja: '主要取引先の調達部長から電話。説明の場を求められている。', en: '' }
  - id: ev-other
    at: { day: 3, minutes: 660 }
    voices: [v-ev-other]
    gauges: { flame: 5 }
    caption: { ja: '同じ住所に端末が届いた会社から、問い合わせが入った。', en: '' }
  - id: ev-police
    at: { day: 18, minutes: 540 }
    voices: [v-ev-police]
    gauges: { flame: 5 }
    sound: { se: [phone_ring] }
    caption: { ja: '警察から、端末の取得データと記録の任意提出を求められた。', en: '' }
points:
  - id: p01-alert
    at: { day: 0, minutes: 525 }
    phase: detect
    sound: { se: [notify_chat] }
    text: { ja: '8時45分。人事部長の宮下と芹沢が同時に部屋に入ってくる。「先週、遠隔で入社手続きを終えた上級エンジニアの端末が今朝届き、初期設定の直後にEDRが不正プログラムの読み込みを検知しました。本人に電話してもつながりません」。セキュリティ対策室は自分を含めて3名。1名は生産技術部との兼任だ。', en: '' }
    voices: [v01-field, v01-ciso, v01-ok]
    notable:
      - { id: note-first-alert, text: { ja: '8時45分、EDRが端末の不正プログラムを検知。端末は隔離できたが、アカウントは有効なまま。本人と連絡がつかない。', en: '' } }
    choices:
      - id: p01-impact
        text: { ja: '隔離と保全に加え、影響範囲と停止時間の見積もりを30分で作り、芹沢・広報・法務・生産技術に同時に渡す。', en: '' }
        explain: { ja: '隔離と保全に加え、経営と現場が判断できる材料を短時間でそろえている。初動として最も整った対応。', en: '' }
        minutes: 75
        category: recover
        points: 70
        refs: [jpcert-handling, meti-csm-guideline]
        gauges: { damage: -10, stamina: -15, trust: 10 }
        setFlags: { triageStarted: true, impactAssessed: true }
        items:
          - { id: p01-d-order, points: 5, axis: order, refs: [meti-csm-guideline] }
          - { id: p01-d-care, points: 8, axis: care, refs: [meti-csm-guideline] }
          - { id: p01-d-record, points: 8, axis: record, refs: [jpcert-handling] }

      - id: p01-wait
        text: { ja: '誤検知かもしれないとして、人事から連絡が取れるまで待ち、対策本部は明日の朝に立ち上げる。', en: '' }
        explain: { ja: '連絡を待つ間に端末が社内へ接続し、証拠も失われやすい。初動の判断を先送りした点が大きく減点される。', en: '' }
        minutes: 90
        category: hurt
        points: -120
        refs: [jpcert-handling]
        gauges: { flame: 10, trust: -5 }
        coward: true
        setFlags: { delayedTriage: true }
        delayed:
          - { afterPhases: 1, points: -40, gauges: { damage: 15 }, reason: { ja: '隔離が遅れた端末から、同じアカウントで共有フォルダを開いた記録が見つかった。', en: '' } }
        items:
          - { id: p01-a-time, points: -10, axis: time, refs: [jpcert-handling] }
          - { id: p01-a-record, points: -8, axis: record, refs: [jpcert-handling] }
      - id: p01-self
        text: { ja: 'EDRの管理画面を自分で操作し、担当者を差し置いて端末の中身と通信先を細かく確かめる。', en: '' }
        explain: { ja: '指揮する者が調査の手を動かすと、全体の判断が止まる。担当者の権限を越え、記録の管理も乱れる。', en: '' }
        minutes: 60
        category: hurt
        points: -60
        refs: [nist-sp800-61r3]
        gauges: { stamina: -10, trust: -5 }
        items:
          - { id: p01-b-order, points: -10, axis: order, refs: [nist-sp800-61r3] }
          - { id: p01-b-content, points: -8, axis: content, refs: [nist-sp800-61r3] }
      - id: p01-triage
        text: { ja: '対策本部を立ち上げ、端末を隔離してテレメトリとログを保全し、芹沢と宮下に第一報を入れて状況を共有する。', en: '' }
        explain: { ja: '本部立ち上げ、隔離、ログ保全、第一報を同時に進めており、初動として妥当。影響範囲の見積もりはこれから。', en: '' }
        minutes: 45
        category: maintain
        points: 25
        refs: [jpcert-handling, nist-sp800-61r3]
        gauges: { damage: -5, stamina: -10, trust: 5 }
        setFlags: { triageStarted: true }
        items:
          - { id: p01-c-time, points: 3, axis: time, refs: [jpcert-handling] }
          - { id: p01-c-order, points: 5, axis: order, refs: [nist-sp800-61r3] }
          - { id: p01-c-record, points: 5, axis: record, refs: [jpcert-handling] }
    lesson: { ja: '対策本部を立ち上げ、端末の隔離とログ保全、第一報を同時に進める。影響範囲と停止時間の見積もりを経営に渡し、判断できる材料をそろえる。誤検知を理由に待つと被害が広がる。', en: '' }
  - id: p02-containment
    at: { day: 0, minutes: 570 }
    phase: contain
    sound: { se: [notify_chat] }
    text: { ja: '9時30分。端末は隔離した。だがアカウントは有効なままで、設計部門の共有フォルダに接続できる。止めれば、配属先が待っている図面の作業も止まる。', en: '' }
    voices: [v02-boss, v02-coward, v02-ok]
    choices:
      - id: p02-keep
        text: { ja: '止めずに監視を強め、仕事を止めたら現場が回らないとして、アカウントは有効なままにする。', en: '' }
        explain: { ja: '監視だけではアカウントの利用を止められない。現場を守る理由が、共有フォルダの被害を広げる言い訳になっている。', en: '' }
        minutes: 90
        category: hurt
        points: -100
        refs: [nist-sp800-61r3]
        gauges: { damage: 15, flame: 5 }
        delayed:
          - { afterPhases: 1, points: -50, gauges: { damage: 10, trust: -5 }, reason: { ja: '監視の目を抜けて、共有フォルダから資料が持ち出された形跡が見つかった。', en: '' } }
        items:
          - { id: p02-a-content, points: -10, axis: content, refs: [nist-sp800-61r3] }
          - { id: p02-a-time, points: -8, axis: time, refs: [nist-sp800-61r3] }
      - id: p02-stop-wide
        text: { ja: 'アカウントを止め、認証情報を入れ替え、設計部門のリモート接続も止めて理由と再開見通しを伝える。', en: '' }
        explain: { ja: '停止に加えて認証情報の入れ替えと接続の停止まで行い、理由と見通しも伝えている。現場負担は大きいが封じ込めとして適切。', en: '' }
        minutes: 120
        category: recover
        points: 100
        refs: [nist-sp800-61r3, meti-csm-guideline]
        gauges: { flame: 5, damage: -10, trust: 10, stamina: -10 }
        setFlags: { accountStopped: true, credentialRotated: true }
        items:
          - { id: p02-c-content, points: 6, axis: content, refs: [nist-sp800-61r3] }
          - { id: p02-c-record, points: 6, axis: record, refs: [jpcert-handling] }
          - { id: p02-c-care, points: 6, axis: care, refs: [meti-csm-guideline] }
      - id: p02-stop
        text: { ja: 'アカウントを止め、端末の取得データとログを保全して調査会社に渡し、担当していた図面は別の社員に引き継ぐ。', en: '' }
        explain: { ja: '停止と保全、業務の引き継ぎまで決めており妥当。認証情報の入れ替えやリモート接続の停止までは踏み込んでいない。', en: '' }
        minutes: 60
        category: maintain
        points: 25
        refs: [jpcert-handling]
        gauges: { stamina: -5, trust: 5 }
        setFlags: { accountStopped: true }
        items:
          - { id: p02-b-order, points: 6, axis: order, refs: [jpcert-handling] }
          - { id: p02-b-record, points: 5, axis: record, refs: [jpcert-handling] }
      - id: p02-wipe
        text: { ja: '端末を初期化して、同じ型の新しい端末を本人に送り、そのまま作業を再開してもらう。', en: '' }
        explain: { ja: '初期化は痕跡を消し、侵入経路も範囲も分からなくする。アカウントも有効なままで、被害の拡大を止められない。', en: '' }
        minutes: 45
        category: fatal
        points: -200
        refs: [nist-sp800-61r3]
        gauges: { damage: 10, trust: -15 }
        setFlags: { wipedDevice: true }
        items:
          - { id: p02-d-record, points: -14, axis: record, refs: [nist-sp800-61r3] }
          - { id: p02-d-content, points: -10, axis: content, refs: [nist-sp800-61r3] }
    lesson: { ja: 'アカウントを止め、認証情報を入れ替え、必要ならリモート接続も止める。理由と再開見通しを社内に伝える。監視だけや初期化は、被害の拡大か証拠の喪失につながる。止める範囲と説明の順番を先に決める。', en: '' }

  - id: p03-evidence
    at: { day: 0, minutes: 660 }
    phase: contain
    sound: { se: [mail_arrive] }
    text: { ja: '11時。調査会社から「端末のテレメトリと通信記録を取るなら今です。電源を切ると実行中の情報は消えます」と連絡。現場からは「早く初期化して新しい端末を送ってほしい」という声が上がっている。', en: '' }
    voices: [v03-expert, v03-field, v03-ok]
    choices:
      - id: p03-wipe
        text: { ja: '初期化して新しい端末を送り、証拠より復旧を優先して調査は後回しにすると現場に伝える。', en: '' }
        explain: { ja: '初期化すると侵入経路も漏えい範囲も分からなくなる。復旧を優先した結果、説明の土台を自分で消している。', en: '' }
        minutes: 60
        category: fatal
        points: -200
        refs: [nist-sp800-61r3]
        gauges: { damage: 20, trust: -20 }
        setFlags: { evidenceLost: true }
        delayed:
          - { afterPhases: 2, points: -60, gauges: { flame: 15 }, reason: { ja: '侵入経路も漏えい範囲も分からないまま、説明だけを求められた。', en: '' } }
        items:
          - { id: p03-a-record, points: -20, axis: record, refs: [nist-sp800-61r3] }
          - { id: p03-a-content, points: -15, axis: content, refs: [nist-sp800-61r3] }
          - { id: p03-a-order, points: -10, axis: order, refs: [cissp-cbk-secops] }
      - id: p03-poweroff
        text: { ja: '全台の電源を落とし、調査は落ち着いてからにすると現場に一斉に伝えて回るようにする。', en: '' }
        explain: { ja: '電源を切ると実行中の情報が消える。調査を後回しにしたうえ、証拠の保全もできていない。', en: '' }
        minutes: 45
        category: hurt
        points: -60
        refs: [nist-sp800-61r3]
        gauges: { damage: 5, trust: -5 }
        items:
          - { id: p03-b-record, points: -10, axis: record, refs: [nist-sp800-61r3] }
          - { id: p03-b-time, points: -8, axis: time, refs: [jpcert-handling] }
      - id: p03-image-chain
        text: { ja: 'イメージの取得に加え、同じ採用経路の端末も同じ手順で保全し、取得の時刻と担当を連鎖として記録する。', en: '' }
        explain: { ja: '対象端末だけでなく同じ経路の端末も保全し、取得の時刻と担当を連鎖で記録している。証拠の完全性と範囲を両立した対応。', en: '' }
        minutes: 180
        category: recover
        points: 100
        refs: [nist-sp800-61r3, cissp-cbk-secops]
        gauges: { damage: -10, stamina: -20, trust: 5 }
        setFlags: { evidencePreserved: true, evidenceChain: true }
        items:
          - { id: p03-d-record, points: 10, axis: record, refs: [cissp-cbk-secops] }
          - { id: p03-d-content, points: 8, axis: content, refs: [nist-sp800-61r3] }
          - { id: p03-d-order, points: 5, axis: order, refs: [nist-sp800-61r3] }

      - id: p03-image
        text: { ja: '影響した端末のディスクイメージとテレメトリを遠隔取得で保全し、ハッシュ値と保管場所を記録して管理する。', en: '' }
        explain: { ja: 'イメージとテレメトリを取得し、ハッシュ値と保管場所を記録している。証拠保全として妥当な手順。', en: '' }
        minutes: 120
        category: maintain
        points: 30
        refs: [nist-sp800-61r3, jpcert-handling]
        gauges: { damage: -10, stamina: -15, trust: 5 }
        setFlags: { evidencePreserved: true }
        items:
          - { id: p03-c-record, points: 10, axis: record, refs: [nist-sp800-61r3] }
          - { id: p03-c-order, points: 8, axis: order, refs: [cissp-cbk-secops] }
    lesson: { ja: '端末は電源を切らず、ディスクイメージとテレメトリを取得し、ハッシュ値と保管場所を記録する。同じ採用経路の端末も同じ手順で保全する。初期化や電源断は証拠を消す。保全の手順は作業前に文書で決める。', en: '' }
  - id: p04-escalate
    at: { day: 0, minutes: 840 }
    phase: organize
    sound: { se: [phone_ring] }
    text: { ja: '14時。芹沢に、経営会議の場で第一報を説明する時間。社長の氷室は、影響の大きさと、いま決めてほしいことを知りたがっている。', en: '' }
    voices: [v04-boss, v04-flattery, v04-ok]
    choices:
      - id: p04-hold
        text: { ja: '影響が出てから上申すると決め、今は調査に集中すると経営に短く伝えて、その場を離れる。', en: '' }
        explain: { ja: '経営への上申を遅らせると、全社の接続停止などの決裁が遅れる。調査に集中する理由が判断の先送りになっている。', en: '' }
        minutes: 60
        category: hurt
        points: -120
        refs: [meti-csm-guideline]
        gauges: { flame: 10, trust: -10 }
        coward: true
        setFlags: { lateEscalation: true }
        delayed:
          - { afterPhases: 1, points: -50, gauges: { damage: 10, trust: -10 }, reason: { ja: '経営の決裁が遅れ、全社のリモート接続停止の判断が4時間ずれた。', en: '' } }
        items:
          - { id: p04-a-order, points: -10, axis: order, refs: [meti-csm-guideline] }
          - { id: p04-a-time, points: -10, axis: time, refs: [meti-csm-guideline] }
      - id: p04-jargon
        text: { ja: '調査ログをそのまま貼り付けて送り、技術者なら読めば分かると考えて説明を省いてしまう。', en: '' }
        explain: { ja: 'ログをそのまま渡すと、経営は影響と選択肢を読み取れない。技術の言葉を経営の言葉に訳すのが役割。', en: '' }
        minutes: 45
        category: hurt
        points: -50
        refs: [meti-csm-guideline]
        gauges: { trust: -5 }
        items:
          - { id: p04-b-order, points: -8, axis: order, refs: [meti-csm-guideline] }
          - { id: p04-b-wording, points: -8, axis: wording, refs: [meti-csm-guideline] }
      - id: p04-translate
        text: { ja: '分かっている事実、不明な点、いま決めてほしいことを一枚に分けて上申する。', en: '' }
        explain: { ja: '事実、不明点、決めてほしいことを一枚に分けるのは妥当。選択肢ごとの影響と復旧時間までは添えていない。', en: '' }
        minutes: 45
        category: maintain
        points: 25
        refs: [meti-csm-guideline, jpcert-handling]
        gauges: { trust: 5, stamina: -5 }
        setFlags: { escalated: true }
        items:
          - { id: p04-c-order, points: 8, axis: order, refs: [meti-csm-guideline] }
          - { id: p04-c-wording, points: 8, axis: wording, refs: [meti-csm-guideline] }
          - { id: p04-c-record, points: 5, axis: record, refs: [jpcert-handling] }
      - id: p04-options
        text: { ja: '一枚の上申に加え、止めるかどうかの選択肢ごとに、影響範囲と復旧時間の見積もりを添える。', en: '' }
        explain: { ja: '事実と論点を整理したうえで、選択肢ごとの影響と復旧時間を添えている。経営が判断できる形になっている。', en: '' }
        minutes: 75
        category: recover
        points: 100
        refs: [meti-csm-guideline]
        gauges: { trust: 10, stamina: -10 }
        setFlags: { escalated: true, optionsPrepared: true }
        items:
          - { id: p04-d-order, points: 8, axis: order, refs: [meti-csm-guideline] }
          - { id: p04-d-content, points: 8, axis: content, refs: [nist-sp800-61r3] }
          - { id: p04-d-care, points: 5, axis: care, refs: [meti-csm-guideline] }
    lesson: { ja: '経営には、分かっている事実、不明な点、いま決めてほしいことを一枚に分けて出す。止めるかどうかの選択肢ごとに影響と復旧時間を添える。影響が出てから上申すると決裁が遅れる。', en: '' }

  - id: p05-command
    at: { day: 0, minutes: 1020 }
    phase: organize
    sound: { se: [notify_chat] }
    text: { ja: '17時。対策本部の机が並んだ。誰が指揮を執り、誰が記録し、誰が外部と連絡するか。専任は3名しかいない。', en: '' }
    voices: [v05-flattery, v05-public, v05-ok]
    choices:
      - id: p05-roles-deputy
        text: { ja: '役割分担に加え、指揮の代行を決め、判断の時刻と理由を15分ごとに記録に残す。', en: '' }
        explain: { ja: '役割分担に指揮の代行と判断の記録を加えており、少人数でも回る体制になっているからだ。', en: '' }
        minutes: 90
        category: recover
        points: 100
        refs: [cissp-cbk-secops, meti-csm-guideline]
        gauges: { stamina: 10, trust: 10 }
