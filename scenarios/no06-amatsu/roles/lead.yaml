        explain: { ja: '数字を暗記して断定すると、記録と食い違ったときに訂正が必要になる。不確実な点は残すべき。', en: '' }
        minutes: 60
        category: hurt
        points: -120
        refs: [meti-disclosure-guidance]
        gauges: { flame: 15, trust: -15 }
        items:
          - { id: p21-d-wording, points: -10, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: p21-d-record, points: -10, axis: record, refs: [jpcert-handling] }
    lesson: { ja: '会見では事実と記録を手元に置き、分からないことは確認して答える。回答の期限も約束する。台本の読み上げや断定答复は、後で訂正が必要になる。答えられない質問は期限を決めて持ち帰る。', en: '' }
drafts:
  tech-factsheet:
    title: { ja: '技術ファクトシート', en: '' }
    slots:
      - id: confirmed
        label: { ja: '確認できた事実', en: '' }
        options:
          - { id: tf-c-split, text: { ja: '発生と検知の日時を分けて書く', en: '' }, points: 6, axis: content, refs: [ppc-report-prelim], explain: { ja: '発生と検知を分けると、検知の遅れが正確に伝わる。再発防止の議論の出発点になるからだ。', en: '' } }
          - { id: tf-c-merge, text: { ja: '発生と検知をまとめて書く', en: '' }, points: -6, axis: wording, refs: [jpcert-handling], explain: { ja: 'まとめると検知の遅れが見えなくなる。対策の優先順位を誤らせることにつながるだけだ。', en: '' } }
      - id: exposure
        label: { ja: '確認できた範囲', en: '' }
        options:
          - { id: tf-e-vague, text: { ja: '「一部の情報に触れた可能性がある」とぼかす', en: '' }, points: -8, axis: content, refs: [ppc-report-scope], explain: { ja: 'ぼかすと、何が漏れたのか分からず、対象者への通知もできない。説明責任を果たせない。', en: '' } }
          - { id: tf-e-list, text: { ja: '端末が触れた共有フォルダと取引先連絡先一覧を具体的に書く', en: '' }, points: 8, axis: content, refs: [ppc-report-scope], explain: { ja: '触れた範囲を具体的に書くと、報告や通知の対象が明確になる。後から範囲の訂正も少なくなる。', en: '' } }
      - id: uncertain
        label: { ja: '不確実な点の書き方', en: '' }
        options:
          - { id: tf-u-confirm, text: { ja: 'すべてを「確認」と断定して書く', en: '' }, points: -12, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: '断定しすぎると、後で否定する材料が出たときに訂正が必要になる。不確実な点は残すべき。', en: '' } }
          - { id: tf-u-omit, text: { ja: '不確実な点は書かないままにする', en: '' }, points: -8, axis: wording, refs: [ppc-report-prelim], explain: { ja: '不確実な点を書かないと、分かっていない範囲が伝わらない。後で追加説明を求められる。', en: '' } }
          - { id: tf-u-split, text: { ja: '「確認」「推定」「不明」を分けて書く', en: '' }, points: 8, axis: wording, refs: [meti-disclosure-guidance], explain: { ja: '確実さの度合いを分けると、後で分かったことを足しても説明が崩れない。公表文の基本。', en: '' } }
      - id: hiring
        label: { ja: '採用の経路', en: '' }
        options:
          - { id: tf-h-hide, text: { ja: '採用の経緯や本人確認には触れない', en: '' }, points: -12, axis: content, refs: [no06-government-advisory], explain: { ja: '経緯に触れないと、根本の原因が報告から抜ける。再発防止策の説得力も弱くなってしまう。', en: '' } }
          - { id: tf-h-admit, text: { ja: '遠隔の面接だけで本人確認を終えたと書く', en: '' }, points: 8, axis: content, refs: [no06-government-advisory], explain: { ja: '採用の穴を具体的に書いており、再発防止の出発点になる。批判は受けるが、後で問われにくい。', en: '' } }
      - id: address
        label: { ja: '端末の送付先', en: '' }
        options:
          - { id: tf-a-share, text: { ja: '同じ住所に他社の端末も届いていたと書く', en: '' }, points: 6, axis: content, refs: [no06-ipa-10threats], explain: { ja: '同じ住所の他社の存在を書くと、被害の広がりを止めたことが伝わる。地域全体の注意喚起になる。', en: '' } }
          - { id: tf-a-omit, text: { ja: '端末の送付先の確認には触れない', en: '' }, points: -6, axis: content, refs: [no06-ipa-10threats], explain: { ja: '送付先に触れないと、端末がどこに届いたかの説明が抜ける。同じ手口の防止に結びつかない。', en: '' } }
      - id: evidence
        label: { ja: '証拠保全の記載', en: '' }
        options:
          - { id: tf-v-none, text: { ja: '証拠の保全や保管場所には触れない', en: '' }, points: -8, axis: record, refs: [jpcert-handling], explain: { ja: '保全に触れないと、証拠が残っているか分からない。後から調査の妥当性を問われることになる。', en: '' } }
          - { id: tf-v-hash, text: { ja: 'イメージのハッシュ値と保管場所を書く', en: '' }, points: 8, axis: record, refs: [cissp-cbk-secops], explain: { ja: 'ハッシュ値と保管場所を書くと、証拠が改変されていないことを示せる。調査の信頼性につながる。', en: '' } }
      - id: authority
        label: { ja: '当局への報告', en: '' }
        options:
          - { id: tf-a-report, text: { ja: '警察と所管官庁に相談済みと書く', en: '' }, points: 6, axis: order, refs: [npa-consult], explain: { ja: '当局への相談を明記すると、会社が事実と向き合っていることが伝わる。隠していない証明にもなる。', en: '' } }
          - { id: tf-a-none, text: { ja: '当局への報告には触れない', en: '' }, points: -6, axis: order, refs: [npa-consult], explain: { ja: '報告に触れないと、当局との関係を隠したように見える。公表文の中で位置づけを説明したい。', en: '' } }
      - id: contact
        label: { ja: '技術窓口', en: '' }
        options:
          - { id: tf-w-main, text: { ja: '代表番号だけを書いて済ませる', en: '' }, points: -5, axis: care, refs: [meti-csm-guideline], explain: { ja: '代表番号だけでは、技術的な問い合わせがたらい回しになる。窓口の体制まで示したい。', en: '' } }
          - { id: tf-w-24h, text: { ja: '対策室の直通番号と24時間の受付を書く', en: '' }, points: 6, axis: care, refs: [ppc-notify-person], explain: { ja: '直通番号と24時間の受付を書くと、技術的な問い合わせにも対応できる。対象者の不安を減らす。', en: '' } }
      - id: record
        label: { ja: '版の管理', en: '' }
        options:
          - { id: tf-x-version, text: { ja: '版番号と確定時刻を書き、以後の変更も記録する', en: '' }, points: 6, axis: record, refs: [jpcert-handling], explain: { ja: '版と確定時刻を残すと、後から公表内容の変遷を説明できる。訂正があった場合の土台になる。', en: '' } }
          - { id: tf-x-none, text: { ja: '版番号も確定時刻も記録に残さないでおく', en: '' }, points: -6, axis: record, refs: [jpcert-handling], explain: { ja: '版を管理しないと、いつ何を公表したか説明できない。訂正や更新の根拠も失ってしまう。', en: '' } }
      - id: decision
        label: { ja: '経営への決裁依頼', en: '' }
        options:
          - { id: tf-d-none, text: { ja: '経営への決裁の依頼は書かないままにしておく', en: '' }, points: -6, axis: order, refs: [meti-csm-guideline], explain: { ja: '決裁依頼がないと、止めるかどうかの判断が止まる。技術側だけで決められない論点を残している。', en: '' } }
          - { id: tf-d-ask, text: { ja: '全社のリモート接続停止と公表の時刻を決めてほしいと書く', en: '' }, points: 6, axis: order, refs: [meti-csm-guideline], explain: { ja: '決裁してほしい事項を具体的に書くと、経営の判断が早くなる。技術の論点を経営の論点に訳している。', en: '' } }
  recovery-plan:
    title: { ja: '復旧計画', en: '' }
    slots:
      - id: clean
        label: { ja: 'クリーンな環境', en: '' }
        options:
          - { id: rp-c-new, text: { ja: '新規に構築し、イメージを検証する', en: '' }, points: 8, axis: content, refs: [nist-sp800-61r3], explain: { ja: '新規に構築してイメージを検証すると、侵入した環境を持ち越さない。復旧の前提として妥当。', en: '' } }
          - { id: rp-c-reuse, text: { ja: '既存の環境をそのまま使い続ける', en: '' }, points: -12, axis: content, refs: [nist-sp800-61r3], explain: { ja: '既存の環境をそのまま使うと、残った侵入経路や設定を持ち越す。再発の危険が大きい。', en: '' } }
      - id: backup
        label: { ja: 'バックアップの検証', en: '' }
        options:
          - { id: rp-b-use, text: { ja: '検証せずにバックアップを戻す', en: '' }, points: -8, axis: content, refs: [nist-sp800-61r3], explain: { ja: '検証せずに戻すと、壊れたデータや古い設定を復元する。復旧後の障害につながってしまう。', en: '' } }
          - { id: rp-b-test, text: { ja: '復元テストと整合性の確認をする', en: '' }, points: 8, axis: content, refs: [cissp-cbk-secops], explain: { ja: '復元テストと整合性の確認をすると、バックアップが壊れていないことを確かめられる。復旧の信頼性が上がる。', en: '' } }
      - id: creds
        label: { ja: '認証情報', en: '' }
        options:
          - { id: rp-k-all, text: { ja: 'パスワード、トークン、鍵をすべて失効して再発行する', en: '' }, points: 10, axis: order, refs: [cissp-cbk-secops], explain: { ja: 'すべて失効して再発行すると、盗まれた認証情報を使い回されない。侵害後の基本だからだ。', en: '' } }
          - { id: rp-k-some, text: { ja: '分かっている範囲の認証情報だけを変更する', en: '' }, points: -10, axis: order, refs: [cissp-cbk-secops], explain: { ja: '分かっている範囲だけ変えると、見えていない認証情報が残る。侵害の全容が分かるまで広げたい。', en: '' } }
      - id: devices
        label: { ja: '端末の再確認', en: '' }
        options:
          - { id: rp-d-new, text: { ja: '新しい端末だけを確認して終わらせる', en: '' }, points: -8, axis: content, refs: [no06-telework-guideline], explain: { ja: '新しい端末だけを見ると、既存の端末に残った検体を見落とす。再発の温床になってしまう。', en: '' } }
          - { id: rp-d-all, text: { ja: '全リモート端末を再スキャンし、結果を記録する', en: '' }, points: 8, axis: record, refs: [nist-sp800-61r3], explain: { ja: '全端末を再スキャンして記録すると、同じ検体が残っていないか確認できる。範囲の証明にもなる。', en: '' } }
      - id: monitor
        label: { ja: '監視', en: '' }
        options:
          - { id: rp-m-24h, text: { ja: '強化監視の期間と基準を決める', en: '' }, points: 8, axis: order, refs: [nist-sp800-61r3], explain: { ja: '強化監視の期間と基準を決めると、再発を早く見つけられる。通常に戻す判断も説明できる。', en: '' } }
          - { id: rp-m-normal, text: { ja: '通常の監視体制に戻していく', en: '' }, points: -8, axis: content, refs: [nist-sp800-61r3], explain: { ja: '通常の監視に戻すと、再発時の検知が遅れる。復旧直後こそ監視を強めるべきだからだ。', en: '' } }
      - id: sequence
        label: { ja: '再開の順番', en: '' }
        options:
          - { id: rp-s-all, text: { ja: '確認せずに全社へ一斉に戻す', en: '' }, points: -10, axis: order, refs: [nist-sp800-61r3], explain: { ja: '一斉に戻すと、問題が出たときに全社へ影響する。検証と切り戻しの余裕がないからだ。', en: '' } }
          - { id: rp-s-step, text: { ja: '社内、限定取引先、全体の順に戻す', en: '' }, points: 8, axis: order, refs: [nist-sp800-61r3], explain: { ja: '段階的に戻すと、問題が出たときの影響を限定できる。再開の順番を決めておくことが重要。', en: '' } }
      - id: rollback
        label: { ja: '切り戻しの条件', en: '' }
        options:
          - { id: rp-r-rule, text: { ja: '異常を検知したら自動で止める条件を書く', en: '' }, points: 8, axis: content, refs: [cissp-cbk-secops], explain: { ja: '自動で止める条件を決めると、再発時に素早く切り戻せる。復旧の安全弁になるからだ。', en: '' } }
          - { id: rp-r-none, text: { ja: '切り戻しの条件を決めないでおく', en: '' }, points: -8, axis: content, refs: [cissp-cbk-secops], explain: { ja: '条件を決めないと、異常が出ても止める判断が遅れる。復旧が被害を広げてしまうだけだ。', en: '' } }
      - id: comms
        label: { ja: '社内と取引先への説明', en: '' }
        options:
          - { id: rp-m-safe, text: { ja: '「安全です」とだけ書く', en: '' }, points: -10, axis: care, refs: [meti-disclosure-guidance], explain: { ja: '安全だとだけ書いても、何を確認したのか分からない。根拠のない断言は信用されない。', en: '' } }
          - { id: rp-m-explain, text: { ja: '何を確認したかを具体的に書く', en: '' }, points: 8, axis: care, refs: [ppc-notify-person], explain: { ja: '何を確認したかを具体的に書くと、安全だと言う根拠が伝わる。取引先の不安を減らせる。', en: '' } }
      - id: verify
        label: { ja: '外部の検証', en: '' }
        options:
          - { id: rp-v-third, text: { ja: '第三者の検証を経てから戻す', en: '' }, points: 8, axis: record, refs: [cissp-cbk-secops], explain: { ja: '第三者の検証を経ると、自社の見落としを補える。復旧の判断に外部の目が入るからだ。', en: '' } }
          - { id: rp-v-self, text: { ja: '自社だけで判断して戻す', en: '' }, points: -8, axis: record, refs: [cissp-cbk-secops], explain: { ja: '自社だけで判断すると、見落としに気づけない。被害が大きい場面では第三者を入れるべき。', en: '' } }
voices:
  - { id: v01-field, media: chat, misleading: true, type: well-meant-field, text: { ja: '怪しかったので、本人に「端末の電源を切って待つように」と伝えました。', en: '' }, trigger: { at: point } }
  - { id: v01-ciso, media: boss, misleading: true, type: boss-pressure, text: { ja: '誤検知だろう。今日の設計会議を止めるな。', en: '' }, trigger: { at: point } }
  - { id: v01-ok, media: chat, misleading: false, text: { ja: 'EDRの隔離は効いています。テレメトリを取るなら今です。', en: '' }, trigger: { at: point } }
  - { id: v01-after, media: sns, misleading: false, text: { ja: '経営が動くと現場が二重に走る。まず現場に任せろ。', en: '' }, trigger: { at: after, choice: p01-impact } }
  - { id: v02-boss, media: boss, misleading: true, type: boss-pressure, text: { ja: '図面が止まる。アカウントは止めるな。', en: '' }, trigger: { at: point } }
  - { id: v02-coward, media: sns, misleading: true, type: coward-critique, text: { ja: 'まだ何も起きていないのに止めるのか。大げさすぎる。', en: '' }, trigger: { at: point } }
  - { id: v02-ok, media: chat, misleading: false, text: { ja: 'ログを見ると、昨夜、共有フォルダに接続した記録があります。', en: '' }, trigger: { at: point } }
  - { id: v02-after, media: news, misleading: false, text: { ja: '設計部門まで止めたのか。納期に間に合うのか。', en: '' }, trigger: { at: after, choice: p02-stop-wide } }
  - { id: v03-expert, media: vendor, misleading: true, type: fake-expert, text: { ja: '初期化してしまえば痕跡は消えます。まず端末をきれいにしましょう。', en: '' }, trigger: { at: point } }
  - { id: v03-field, media: chat, misleading: true, type: well-meant-field, text: { ja: '本人に「端末の電源を切って保管するように」と伝えました。', en: '' }, trigger: { at: point } }
  - { id: v03-ok, media: chat, misleading: false, text: { ja: '調査会社「テレメトリには実行中の情報が残っています。電源を切ると消えます」。', en: '' }, trigger: { at: point } }
  - { id: v03-after, media: sns, misleading: false, text: { ja: '証拠ばかり集めて、いつ復旧するんだ。', en: '' }, trigger: { at: after, choice: p03-image-chain } }
  - { id: v04-boss, media: boss, misleading: true, type: boss-pressure, text: { ja: '経営には、影響が出てから言えばいい。今言っても決められない。', en: '' }, trigger: { at: point } }
  - { id: v04-flattery, media: chat, misleading: true, type: flattery, text: { ja: 'さすが室長。技術のことは全部任せますよ。', en: '' }, trigger: { at: point } }
  - { id: v04-ok, media: chat, misleading: false, text: { ja: '広報「社長は数字と、決めることを待っています」。', en: '' }, trigger: { at: point } }
  - { id: v04-after, media: board, misleading: false, text: { ja: '選択肢を出すのはいいが、決めるのは経営だ。責任の所在が曖昧になる。', en: '' }, trigger: { at: after, choice: p04-options } }
  - { id: v05-flattery, media: chat, misleading: true, type: flattery, text: { ja: '室長が全部見れば早いですよ。任せておけば間違いない。', en: '' }, trigger: { at: point } }
  - { id: v05-public, media: sns, misleading: true, type: public-opinion, text: { ja: '体制の話をしている場合か。早く原因を調べろ。', en: '' }, trigger: { at: point } }
  - { id: v05-ok, media: chat, misleading: false, text: { ja: '人事「交代制にしないと、三日目に人が倒れます」。', en: '' }, trigger: { at: point } }
  - { id: v05-after, media: sns, misleading: false, text: { ja: '記録ばかり増やして、調査は進んでいるのか。', en: '' }, trigger: { at: after, choice: p05-roles-deputy } }
  - { id: v06-boss, media: boss, misleading: true, type: boss-pressure, text: { ja: '所管官庁に言えば、取引先に伝わる。契約が飛ぶぞ。', en: '' }, trigger: { at: point } }
  - { id: v06-law, media: news, misleading: true, type: law-ish, text: { ja: '被害が出ていないなら、報告は必要ないでしょう。', en: '' }, trigger: { at: point } }
  - { id: v06-past, media: boss, misleading: true, type: past-success, text: { ja: '前の件は、警察に言わずに収まった。今回も同じでいい。', en: '' }, trigger: { at: point } }
  - { id: v06-ok, media: chat, misleading: false, text: { ja: '法務「外部と通信した形跡があります。断定はできませんが、事実として報告できます」。', en: '' }, trigger: { at: point } }
  - { id: v06-after, media: sns, misleading: false, text: { ja: '警察に言ったら、社内のまずい情報まで調べられるぞ。', en: '' }, trigger: { at: after, choice: p06-facts-pack } }
  - { id: v07-expert, media: vendor, misleading: true, type: fake-expert, text: { ja: '端末の中だけ見れば十分です。共有フォルダは関係ありません。', en: '' }, trigger: { at: point } }
  - { id: v07-insider, media: board, misleading: true, type: fake-insider, text: { ja: '中の人です。設計資料は全部持ち出されています。今すぐ全部公表しないと大変です。', en: '' }, trigger: { at: point } }
