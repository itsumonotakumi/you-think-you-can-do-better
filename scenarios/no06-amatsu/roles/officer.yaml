          - { id: p06-c-content, points: 6, axis: content, refs: [ppc-report-prelim] }
          - { id: p06-c-record, points: 6, axis: record, refs: [ppc-report-prelim] }
      - id: p06-none
        text: { ja: '採用の情報は報告の対象ではないと判断し、報告しない。', en: '' }
        minutes: 30
        category: fatal
        points: -200
        refs: [ppc-report-scope]
        gauges: { flame: 20, trust: -20 }
        setFlags: { hidFacts: true }
        items:
          - { id: p06-d-record, points: -14, axis: record, refs: [ppc-report-scope] }
          - { id: p06-d-content, points: -10, axis: content, refs: [ppc-report-scope] }

