# No.6 アマツ重工 / 役員・人事担当ロール
# プレイヤーは常務取締役（人事・総務担当）。採用の穴と、社員・応募者をどう扱うかを判断する。
# 判断ポイント17、細目は choices[].items と drafts の合計で80以上。
estimateMinutes: 40
intro: { ja: 'あなたはアマツ重工の常務取締役で、人事と総務を預かっている。遠隔の面接を三回通った新人が、端末が届いた朝に消えた。採用したのはあなたの部門で、最終面接で採用を推薦したのもあなた自身だ。何を認め、誰を守り、どこまで話すか。9時の報告から、あなたの判断が始まる。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-ppc-prelim
    ref: ppc-report-prelim
    label: { ja: '応募者情報の漏えい等報告（速報）', en: '' }
    points: -150
    doneFlag: ppcPrelimFiled
events:
  - id: ev-news
    at: { day: 4, minutes: 780 }
    voices: [v-ev-news]
    gauges: { flame: 10 }
    sound: { se: [notify_news] }
    caption: { ja: '週刊誌の速報が出た。「大手重工、偽の新人を採用か」。', en: '' }
  - id: ev-union
    at: { day: 6, minutes: 540 }
    voices: [v-ev-union]
    gauges: { flame: 5 }
    sound: { se: [notify_chat] }
    caption: { ja: '社員代表が、対象者の処遇と採用の基準の説明を求めてきた。', en: '' }
  - id: ev-police
    at: { day: 18, minutes: 540 }
    voices: [v-ev-police]
    gauges: { flame: 5 }
    sound: { se: [phone_ring] }
    caption: { ja: '警察から、端末の取得データと記録の任意提出を求められた。', en: '' }
points:
  - id: p01-hiring-file
    at: { day: 0, minutes: 540 }
    phase: detect
    sound: { se: [notify_chat] }
    text: { ja: '9時。人事部長の宮下が、採用の綴りを抱えて入ってくる。「この人の採用は私が担当しました。面接は三回、すべてオンライン。経歴の確認は人材紹介会社に任せました」。社長からは「どこを抜かれたんだ」と電話が来ている。', en: '' }
    voices: [v01-ceo, v01-own, v01-hr]
    notable:
      - { id: note-interview, text: { ja: '最終面接の評価シートに、自分の字で「人物に問題なし。採用を推薦」と書いた。', en: '' } }
    choices:
      - id: p01-open
        text: { ja: '記録を保全して共有し、同じ採用の経路で進む応募者と内定者の名簿を止めて、本人確認のやり直しを指揮する。', en: '' }
        explain: { ja: '記録の保全と共有に加え、同じ経路の応募者と内定者の確認まで進めている。採用の穴を広げない判断として評価できる。', en: '' }
        minutes: 90
        category: recover
        points: 100
        refs: [no06-government-advisory, meti-csm-guideline]
        gauges: { flame: -5, trust: 10, stamina: -10 }
        setFlags: { hiringFileKept: true, recheckStarted: true }
        items:
          - { id: p01-c-content, points: 6, axis: content, refs: [no06-government-advisory] }
          - { id: p01-c-order, points: 6, axis: order, refs: [meti-csm-guideline] }
          - { id: p01-c-record, points: 4, axis: record, refs: [jpcert-handling] }
      - id: p01-quiet
        text: { ja: 'まず自分の評価コメントを確かめ、社長への報告は事実が固まってからにすると決めて、時間をかけて調べる。', en: '' }
        explain: { ja: '報告を待つ間に、社長は現場から先に事情を聞く。評価コメントを確かめること自体は必要だが、共有を遅らせた点が減点。', en: '' }
        minutes: 60
        category: hurt
        points: -70
        refs: [jpcert-handling]
        gauges: { flame: 5, trust: -10, stamina: 5 }
        coward: true
        delayed:
          - { afterPhases: 1, points: -12, gauges: { trust: -10 }, reason: { ja: '報告が遅れたぶん、社長は現場から先に事情を聞いていた。', en: '' } }
        items:
          - { id: p01-a-time, points: -7, axis: time, refs: [jpcert-handling] }
          - { id: p01-a-record, points: -6, axis: record, refs: [jpcert-handling] }
      - id: p01-share
        text: { ja: '採用の記録をそのまま保全し、面接三回の評価、経歴確認の委託先、端末の送付先を社長と共有する。', en: '' }
        explain: { ja: '記録を保全して事実を共有しており、初動として妥当。同じ経路の応募者の確認までは踏み込んでいない。', en: '' }
        minutes: 45
        category: maintain
        points: 25
        refs: [jpcert-handling, no06-government-advisory]
        gauges: { flame: -5, trust: 5, stamina: -5 }
        setFlags: { hiringFileKept: true }
        items:
          - { id: p01-b-record, points: 6, axis: record, refs: [jpcert-handling] }
          - { id: p01-b-order, points: 5, axis: order, refs: [meti-csm-guideline] }
          - { id: p01-b-content, points: 4, axis: content, refs: [no06-government-advisory] }
      - id: p01-rewrite
        text: { ja: '評価シートの自分のコメントを「慎重に審査した」と書き換え、記録を整えて社内に提出する。', en: '' }
        explain: { ja: '評価を書き換えると、採用の判断の誤りを隠すことになる。後から必ず整合が取れなくなり、信用を大きく失う。', en: '' }
        minutes: 30
        category: fatal
        points: -200
        refs: [jpcert-handling]
        gauges: { flame: 15, trust: -20 }
        setFlags: { doctoredRecord: true }
        items:
          - { id: p01-d-record, points: -14, axis: record, refs: [jpcert-handling] }
          - { id: p01-d-content, points: -10, axis: content, refs: [nist-sp800-61r3] }
    lesson: { ja: '採用の記録を止めずに保全し、面接の評価、委託先、端末の送付先を事実として共有する。同じ経路の応募者と内定者の確認も並行させる。自分の評価を書き換えるのは論外で、採用の判断そのものを消す行為になる。', en: '' }

  - id: p02-onboarding
    at: { day: 0, minutes: 660 }
    phase: contain
    sound: { se: [notify_chat] }
    text: { ja: '11時。今月入社した遠隔採用の十二名に、端末とアカウントが渡っている。同じやり方で入った人が、他にもいるかもしれない。', en: '' }
    voices: [v02-vendor, v02-field, v02-ok]
    notable:
      - { id: note-hiring, text: { ja: '採用は遠隔の面接3回のみ。本人確認は人材紹介会社に委託し、対面では一度もしていない。', en: '' } }
    choices:
      - id: p02-keep
        text: { ja: '止めずに様子を見て、仕事を止めれば新入社員が辞めてしまうとして、監視だけを強めてしのぐ。', en: '' }
        explain: { ja: '監視だけでは同じ手口の端末が動き続ける。辞めさせない配慮に見えるが、被害の拡大を止める判断がない。', en: '' }
        minutes: 90
        category: hurt
        points: -90
        refs: [nist-sp800-61r3]
        gauges: { damage: 15, flame: 5, trust: -5 }
        coward: true
        delayed:
          - { afterPhases: 1, points: -12, gauges: { damage: 10 }, reason: { ja: '止めなかった区画から、別の端末で不審な通信が出た。', en: '' } }
        items:
          - { id: p02-a-content, points: -7, axis: content, refs: [nist-sp800-61r3] }
          - { id: p02-a-time, points: -7, axis: time, refs: [nist-sp800-61r3] }
      - id: p02-stop-care
        text: { ja: '送付と手続きを止め、対象の十二名に理由と見通しを書面で伝え、不安の相談窓口を設ける。', en: '' }
        explain: { ja: '停止と説明、相談窓口を同時に整えており、対象者への配慮がある。被害を止めながら不安も減らす対応。', en: '' }
        minutes: 120
        category: recover
        points: 100
        refs: [jpcert-handling, no06-telework-guideline]
        gauges: { flame: -5, trust: 10, stamina: -10 }
        setFlags: { onboardingStopped: true, newcomerCare: true }
        items:
          - { id: p02-c-order, points: 6, axis: order, refs: [jpcert-handling] }
          - { id: p02-c-care, points: 6, axis: care, refs: [no06-telework-guideline] }
          - { id: p02-c-record, points: 4, axis: record, refs: [jpcert-handling] }
      - id: p02-stop
        text: { ja: '新しい端末の送付と入社手続きを止め、対象者には理由を伝えずに待ってもらう。', en: '' }
        explain: { ja: '送付と手続きを止める判断は妥当。ただし理由を伝えず、相談窓口もないため、対象者の不安を残す。', en: '' }
        minutes: 60
        category: maintain
        points: 25
        refs: [jpcert-handling]
        gauges: { flame: 5, trust: 5, stamina: -5 }
        setFlags: { onboardingStopped: true }
        items:
          - { id: p02-b-order, points: 6, axis: order, refs: [jpcert-handling] }
          - { id: p02-b-record, points: 5, axis: record, refs: [jpcert-handling] }
      - id: p02-fire
        text: { ja: '遠隔採用の十二名全員の内定と雇用を取り消し、他の社員にも同じ扱いを徹底する。', en: '' }
        explain: { ja: '全員の内定を取り消すと、被害と無関係な人まで不利益を受ける。採用の穴を埋める代わりに、人を切り捨てている。', en: '' }
        minutes: 45
        category: hurt
        points: -150
        refs: [no06-telework-guideline]
        gauges: { flame: 20, trust: -20 }
        items:
          - { id: p02-d-care, points: -14, axis: care, refs: [no06-telework-guideline] }
          - { id: p02-d-content, points: -10, axis: content, refs: [no06-telework-guideline] }
    lesson: { ja: '新しい端末の送付と手続きを止め、対象者には理由と見通しを書面で伝え、相談窓口を設ける。全員の内定を取り消すと、被害と無関係な人まで傷つける。止める範囲と説明の仕方を対象者ごとに決める。', en: '' }

  - id: p03-agency
    at: { day: 0, minutes: 900 }
    phase: organize
    sound: { se: [mail_arrive] }
    text: { ja: '15時。人材紹介会社の担当者が訪ねてくる。「弊社の確認は書類も面接も通しています。採るかどうかは御社の判断です」。', en: '' }
    voices: [v03-agency, v03-sns, v03-legal]
    choices:
      - id: p03-trust
        text: { ja: '先方の確認を信じ、こちらの調査は採用の話が落ち着いてからにすると伝えて、そのまま待つ方針にする。', en: '' }
        explain: { ja: '先方の確認をそのまま信じると、同じ経路の応募者の確認が遅れる。契約上の確認権を行使しない点が弱い。', en: '' }
        minutes: 60
        category: hurt
        points: -80
        refs: [no06-government-advisory]
        gauges: { damage: 10, trust: -5 }
        items:
          - { id: p03-a-content, points: -7, axis: content, refs: [no06-government-advisory] }
          - { id: p03-a-record, points: -6, axis: record, refs: [jpcert-handling] }
      - id: p03-request
        text: { ja: '契約に基づき、この人物の確認記録と、同じ紹介案件の記録の提出を求めて精査する。', en: '' }
        explain: { ja: '契約に基づいて記録の提出を求めている。事実の確認として妥当だが、同じ経路の全員の確認までは決めていない。', en: '' }
        minutes: 90
        category: maintain
        points: 25
        refs: [meti-csm-guideline, no06-ipa-10threats]
        gauges: { trust: 5, stamina: -5 }
        items:
          - { id: p03-b-order, points: 6, axis: order, refs: [meti-csm-guideline] }
          - { id: p03-b-content, points: 5, axis: content, refs: [no06-ipa-10threats] }
      - id: p03-recheck
        text: { ja: '記録の提出を求め、同じ紹介経路で入った全員の本人確認をやり直し、費用はこちらが持って説明する。', en: '' }
        explain: { ja: '記録の提出に加え、同じ経路で入った全員の確認をやり直し、費用と説明の責任も会社が持つ。採用の穴を広く塞ぐ対応。', en: '' }
        minutes: 150
        category: recover
        points: 90
        refs: [no06-government-advisory, meti-csm-guideline]
        gauges: { flame: -5, trust: 10, stamina: -15 }
        setFlags: { agencyAudited: true }
        items:
          - { id: p03-c-content, points: 6, axis: content, refs: [no06-government-advisory] }
          - { id: p03-c-order, points: 6, axis: order, refs: [meti-csm-guideline] }
          - { id: p03-c-care, points: 6, axis: care, refs: [no06-telework-guideline] }
      - id: p03-blame
        text: { ja: '会見で紹介会社の名前を出し、確認漏れは先方の責任だと説明して自社の関与を薄める。', en: '' }
        explain: { ja: '先方の名前を出して責任を寄せると、自社の確認不足が見えなくなる。契約と記録で責任を整理すべき場面。', en: '' }
        minutes: 60
        category: hurt
        points: -120
        refs: [meti-disclosure-guidance]
        gauges: { flame: 20, trust: -20 }
        setFlags: { blamedAgency: true }
        items:
          - { id: p03-d-wording, points: -14, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: p03-d-content, points: -10, axis: content, refs: [meti-csm-guideline] }
    lesson: { ja: '紹介会社の確認を信じ切らず、契約に基づいて記録の提出を求める。同じ紹介経路で入った人の確認もやり直し、費用と説明の責任は会社が持つ。会見で先方に責任を寄せると信頼を失う。', en: '' }

  - id: p04-board-report
    at: { day: 1, minutes: 540 }
    phase: organize
    sound: { se: [typing] }
    text: { ja: '翌朝9時。社長と法務・広報が揃う。「人事として、どこまで責任を取るんだ」。報告の書き方で、あなたの立場が決まる。', en: '' }
    voices: [v04-ceo, v04-flatter, v04-legal]
    choices:
      - id: p04-delegate
        text: { ja: 'セキュリティの話なので、報告はセキュリティ責任者に任せ、自分は席を外して状況の説明を待つことにする。', en: '' }
        explain: { ja: '採用の判断をした本人が報告から降りると、責任の所在が見えない。セキュリティだけの問題ではない。', en: '' }
        minutes: 45
        category: hurt
        points: -70
        refs: [meti-csm-guideline]
        gauges: { trust: -10, stamina: 5 }
        coward: true
        items:
          - { id: p04-a-order, points: -7, axis: order, refs: [meti-csm-guideline] }
          - { id: p04-a-record, points: -6, axis: record, refs: [jpcert-handling] }
      - id: p04-written
        text: { ja: '書面で、確認できた事実と自分の判断の誤りを分けて社長に提出し、説明を求める。', en: '' }
        explain: { ja: '事実と判断の誤りを分けて書面で出すのは妥当。取締役会への諮問や全工程の点検までは踏み込んでいない。', en: '' }
        minutes: 90
        category: maintain
        points: 25
        refs: [meti-csm-guideline, jpcert-handling]
        gauges: { trust: 5, stamina: -5 }
        detail: board-report
        items:
          - { id: p04-b-record, points: 6, axis: record, refs: [jpcert-handling] }
          - { id: p04-b-order, points: 5, axis: order, refs: [meti-csm-guideline] }
      - id: p04-blame-field
        text: { ja: '「現場の運用ミス」として報告し、自分の関与を書かずに人事の責任としてまとめる。', en: '' }
        explain: { ja: '現場のミスにすると、自分の判断の誤りが報告から消える。後で整合が取れず、隠蔽と見られる。', en: '' }
        minutes: 45
        category: fatal
        points: -200
        refs: [meti-disclosure-guidance]
        gauges: { flame: 15, trust: -20 }
        setFlags: { hidFacts: true }
        items:
          - { id: p04-d-wording, points: -14, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: p04-d-record, points: -10, axis: record, refs: [jpcert-handling] }

      - id: p04-own
        text: { ja: '書面で事実と自分の判断の誤りを出し、取締役会に諮って採用の全工程の点検を自分の責任で行う。', en: '' }
        explain: { ja: '事実と判断の誤りを分け、取締役会に諮って全工程の点検を自分の責任で行うと宣言している。責任の取り方として明確。', en: '' }
        minutes: 120
        category: recover
        points: 90
        refs: [meti-csm-guideline, no06-government-advisory]
        gauges: { flame: -5, trust: 15, stamina: -10 }
        detail: board-report
        setFlags: { ownResponsibility: true }
        items:
          - { id: p04-c-order, points: 6, axis: order, refs: [meti-csm-guideline] }
          - { id: p04-c-record, points: 6, axis: record, refs: [jpcert-handling] }
          - { id: p04-c-content, points: 6, axis: content, refs: [no06-government-advisory] }
    lesson: { ja: '書面で事実と自分の判断の誤りを分け、取締役会に諮って全工程の点検を自分の責任で行うと宣言する。セキュリティに任せたり現場のミスにしたりすると、責任の所在がぼやける。', en: '' }
  - id: p05-reverify
    at: { day: 1, minutes: 900 }
    phase: investigate
    sound: { se: [notify_chat] }
    text: { ja: '15時。同じやり方で入った遠隔採用者は、今月入社が十二名、累計で四十名いる。まず今月入社した十二名の本人確認をやり直す範囲を決める。対象者からは「なぜ自分たちだけ」という声が上がっている。', en: '' }
    voices: [v05-sns, v05-hr, v05-ok]
    choices:
      - id: p05-all-care
        text: { ja: '十二名全員を対面で確認し、目的と範囲を文書で説明し、不利益は出さないと約束して相談窓口を設ける。', en: '' }
        explain: { ja: '全員の確認と文書での説明、不利益を出さない約束、相談窓口をそろえている。範囲と配慮の両方を満たす。', en: '' }
        minutes: 240
        category: recover
        points: 100
        refs: [no06-government-advisory, no06-telework-guideline]
        gauges: { flame: -5, trust: 15, stamina: -15 }
        setFlags: { identityReverified: true, reverifyCare: true }
        items:
          - { id: p05-c-content, points: 6, axis: content, refs: [no06-government-advisory] }
          - { id: p05-c-care, points: 6, axis: care, refs: [no06-telework-guideline] }
          - { id: p05-c-order, points: 6, axis: order, refs: [meti-csm-guideline] }
      - id: p05-three
        text: { ja: '同じ担当者が関わった三人だけを静かに確認し、他の社員には一切声をかけずにそのまま済ませようとする。', en: '' }
        explain: { ja: '三人に絞ると、同じ経路で入った他の社員の確認が抜ける。静かに行うことで対象者への説明もない。', en: '' }
        minutes: 90
        category: hurt
        points: -70
        refs: [no06-government-advisory]
        gauges: { trust: -10, stamina: -5 }
        items:
          - { id: p05-a-content, points: -7, axis: content, refs: [no06-government-advisory] }
          - { id: p05-a-record, points: -6, axis: record, refs: [jpcert-handling] }
      - id: p05-all
        text: { ja: '十二名全員の本人確認を、対面を含めてやり直すと決め、対象者にその旨を書面で伝える。', en: '' }
        explain: { ja: '全員の確認をやり直す判断は妥当。ただし目的と範囲の文書説明や相談窓口までは整っていない。', en: '' }
        minutes: 180
        category: maintain
        points: 25
        refs: [no06-government-advisory]
        gauges: { trust: 5, stamina: -10 }
        setFlags: { identityReverified: true }
        items:
          - { id: p05-b-content, points: 6, axis: content, refs: [no06-government-advisory] }
          - { id: p05-b-order, points: 5, axis: order, refs: [meti-csm-guideline] }
      - id: p05-foreign
