      - id: p03-recheck
        text: { ja: '記録の提出を求め、同じ紹介経路で入った全員の本人確認をやり直す。費用はこちらが持ち、対象者に説明する。', en: '' }
        minutes: 150
        category: recover
        points: 90
        refs: [no06-government-advisory, meti-csm-guideline]
        gauges: { flame: -5, trust: 10, stamina: -15 }
        setFlags: { agencyAudited: true }
        items:
          - { id: p03-c-content, points: 6, axis: content, refs: [no06-government-advisory] }
          - { id: p03-c-order, points: 6, axis: order, refs: [meti-csm-guideline] }
          - { id: p03-c-care, points: 6, axis: care, refs: [no06-telework-guideline] }
      - id: p03-blame
        text: { ja: '会見で紹介会社の名前を出し、確認漏れは先方の責任だと説明する。', en: '' }
        minutes: 60
        category: hurt
        points: -120
        refs: [meti-disclosure-guidance]
        gauges: { flame: 20, trust: -20 }
        setFlags: { blamedAgency: true }
        items:
          - { id: p03-d-wording, points: -14, axis: wording, refs: [meti-disclosure-guidance] }
          - { id: p03-d-content, points: -10, axis: content, refs: [meti-csm-guideline] }

