        minutes: 90
        category: fatal
        points: -200
        refs: [no06-equal-treatment, no06-government-advisory]
        gauges: { flame: 20, trust: -20 }
        items:
          - { id: p05-d-care, points: -14, axis: care, refs: [no06-equal-treatment] }
          - { id: p05-d-content, points: -10, axis: content, refs: [no06-equal-treatment, no06-government-advisory] }

