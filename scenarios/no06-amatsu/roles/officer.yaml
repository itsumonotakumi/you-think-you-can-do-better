        text: { ja: '対面か複数の手段による本人確認を入れて、採用を再開すると社内と応募者の両方に伝える。', en: '' }
        explain: { ja: '対面か複数の手段で確認する基準を入れて再開するのは妥当。応募者と紹介会社への事前説明までは決めていない。', en: '' }
        minutes: 180
        category: maintain
        points: 25
        refs: [no06-government-advisory]
        gauges: { trust: 5, stamina: -10 }
        setFlags: { hiringResumed: true }
