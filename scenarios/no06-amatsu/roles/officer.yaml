# No.6 アマツ重工 / 役員・人事担当ロール
# プレイヤーは常務取締役（人事・総務担当）。採用の穴と、社員・応募者をどう扱うかを判断する。
# 判断ポイント17、細目は choices[].items と drafts の合計で80以上。
estimateMinutes: 40
intro: { ja: 'あなたはアマツ重工の常務取締役で、人事と総務を預かっている。遠隔の面接を三回通った新人が、端末が届いた朝に消えた。採用したのはあなたの部門で、最終面接で採用を推薦したのもあなた自身だ。何を認め、誰を守り、どこまで話すか。9時の報告から、あなたの判断が始まる。', en: '' }
pressEnabled: true
cowardVoices:
  '2': v-coward-2
  '3': v-coward-3
  '4': v-coward-4
deadlines:
  - id: dl-ppc-prelim
    ref: ppc-report-prelim
    label: { ja: '応募者情報の漏えい等報告（速報）', en: '' }
    points: -150
    doneFlag: ppcPrelimFiled
events:
  - id: ev-news
    at: { day: 4, minutes: 780 }
    voices: [v-ev-news]
    gauges: { flame: 10 }
    sound: { se: [notify_news] }
    caption: { ja: '週刊誌の速報が出た。「大手重工、偽の新人を採用か」。', en: '' }
  - id: ev-union
    at: { day: 6, minutes: 540 }
    voices: [v-ev-union]
    gauges: { flame: 5 }
    sound: { se: [notify_chat] }
    caption: { ja: '社員代表が、対象者の処遇と採用の基準の説明を求めてきた。', en: '' }
  - id: ev-police
    at: { day: 18, minutes: 540 }
    voices: [v-ev-police]
    gauges: { flame: 5 }
    sound: { se: [phone_ring] }
    caption: { ja: '警察から、端末の取得データと記録の任意提出を求められた。', en: '' }
points:
  - id: p01-hiring-file
    at: { day: 0, minutes: 540 }
    phase: detect
    sound: { se: [notify_chat] }
    text: { ja: '9時。人事部長の宮下が、採用の綴りを抱えて入ってくる。「この人の採用は私が担当しました。面接は三回、すべてオンライン。経歴の確認は人材紹介会社に任せました」。社長からは「どこを抜かれたんだ」と電話が来ている。', en: '' }
    voices: [v01-ceo, v01-own, v01-hr]
    notable:
      - { id: note-interview, text: { ja: '最終面接の評価シートに、自分の字で「人物に問題なし。採用を推薦」と書いた。', en: '' } }
    choices:
      - id: p01-quiet
        text: { ja: 'まず自分の評価コメントを確かめ、社長への報告は事実が固まってからにする。', en: '' }
        minutes: 60
        category: hurt
        points: -70
        refs: [jpcert-handling]
        gauges: { flame: 5, trust: -10, stamina: 5 }
        coward: true
        delayed:
          - { afterPhases: 1, points: -12, gauges: { trust: -10 }, reason: { ja: '報告が遅れたぶん、社長は現場から先に事情を聞いていた。', en: '' } }
        items:
          - { id: p01-a-time, points: -7, axis: time, refs: [jpcert-handling] }
          - { id: p01-a-record, points: -6, axis: record, refs: [jpcert-handling] }
      - id: p01-share
        text: { ja: '採用の記録をそのまま保全し、面接三回の評価、経歴確認の委託先、端末の送付先を、社長とセキュリティ責任者に事実として共有する。', en: '' }
        minutes: 45
        category: maintain
        points: 25
        refs: [jpcert-handling, no06-government-advisory]
        gauges: { flame: -5, trust: 5, stamina: -5 }
        setFlags: { hiringFileKept: true }
        items:
          - { id: p01-b-record, points: 6, axis: record, refs: [jpcert-handling] }
          - { id: p01-b-order, points: 5, axis: order, refs: [meti-csm-guideline] }
          - { id: p01-b-content, points: 4, axis: content, refs: [no06-government-advisory] }
      - id: p01-open
        text: { ja: '記録を保全して共有し、同じ採用の経路で進んでいる応募者と内定者の名簿を止めて、本人確認のやり直しを自分が指揮する。', en: '' }
        minutes: 90
        category: recover
        points: 100
        refs: [no06-government-advisory, meti-csm-guideline]
        gauges: { flame: -5, trust: 10, stamina: -10 }
        setFlags: { hiringFileKept: true, recheckStarted: true }
        items:
          - { id: p01-c-content, points: 6, axis: content, refs: [no06-government-advisory] }
          - { id: p01-c-order, points: 6, axis: order, refs: [meti-csm-guideline] }
          - { id: p01-c-record, points: 4, axis: record, refs: [jpcert-handling] }
      - id: p01-rewrite
        text: { ja: '評価シートの自分のコメントを「慎重に審査した」と書き換え、記録を整える。', en: '' }
        minutes: 30
        category: fatal
        points: -200
        refs: [jpcert-handling]
        gauges: { flame: 15, trust: -20 }
        setFlags: { doctoredRecord: true }
        items:
          - { id: p01-d-record, points: -14, axis: record, refs: [jpcert-handling] }
          - { id: p01-d-content, points: -10, axis: content, refs: [nist-sp800-61r3] }

  - id: p02-onboarding
    at: { day: 0, minutes: 660 }
    phase: contain
    sound: { se: [notify_chat] }
    text: { ja: '11時。今月入社した遠隔採用の十二名に、端末とアカウントが渡っている。同じやり方で入った人が、他にもいるかもしれない。', en: '' }
    voices: [v02-vendor, v02-field, v02-ok]
    notable:
      - { id: note-hiring, text: { ja: '採用は遠隔の面接3回のみ。本人確認は人材紹介会社に委託し、対面では一度もしていない。', en: '' } }
    choices:
      - id: p02-keep
        text: { ja: '止めずに様子を見る。仕事を止めれば、新入社員が辞めてしまう。', en: '' }
        minutes: 90
        category: hurt
        points: -90
        refs: [nist-sp800-61r3]
        gauges: { damage: 15, flame: 5, trust: -5 }
        coward: true
        delayed:
          - { afterPhases: 1, points: -12, gauges: { damage: 10 }, reason: { ja: '止めなかった区画から、別の端末で不審な通信が出た。', en: '' } }
        items:
          - { id: p02-a-content, points: -7, axis: content, refs: [nist-sp800-61r3] }
          - { id: p02-a-time, points: -7, axis: time, refs: [nist-sp800-61r3] }
      - id: p02-stop
        text: { ja: '新しい端末の送付と、入社手続きを止める。', en: '' }
        minutes: 60
        category: maintain
        points: 25
        refs: [jpcert-handling]
        gauges: { flame: 5, trust: 5, stamina: -5 }
        setFlags: { onboardingStopped: true }
        items:
          - { id: p02-b-order, points: 6, axis: order, refs: [jpcert-handling] }
          - { id: p02-b-record, points: 5, axis: record, refs: [jpcert-handling] }
      - id: p02-stop-care
        text: { ja: '送付と手続きを止め、対象の十二名に理由と見通しを書面で伝え、不安の相談窓口を設ける。', en: '' }
        minutes: 120
        category: recover
        points: 100
        refs: [jpcert-handling, no06-telework-guideline]
        gauges: { flame: -5, trust: 10, stamina: -10 }
        setFlags: { onboardingStopped: true, newcomerCare: true }
        items:
          - { id: p02-c-order, points: 6, axis: order, refs: [jpcert-handling] }
          - { id: p02-c-care, points: 6, axis: care, refs: [no06-telework-guideline] }
          - { id: p02-c-record, points: 4, axis: record, refs: [jpcert-handling] }
      - id: p02-fire
        text: { ja: '遠隔採用の十二名全員の内定と雇用を取り消す。', en: '' }
        minutes: 45
        category: hurt
        points: -150
        refs: [no06-telework-guideline]
        gauges: { flame: 20, trust: -20 }
        items:
          - { id: p02-d-care, points: -14, axis: care, refs: [no06-telework-guideline] }
          - { id: p02-d-content, points: -10, axis: content, refs: [no06-telework-guideline] }

  - id: p03-agency
    at: { day: 0, minutes: 900 }
    phase: organize
    sound: { se: [mail_arrive] }
    text: { ja: '15時。人材紹介会社の担当者が訪ねてくる。「弊社の確認は書類も面接も通しています。採るかどうかは御社の判断です」。', en: '' }
    voices: [v03-agency, v03-sns, v03-legal]
    choices:
      - id: p03-trust
        text: { ja: '先方の確認を信じ、こちらの調査は採用の話が落ち着いてからにする。', en: '' }
        minutes: 60
        category: hurt
        points: -80
        refs: [no06-government-advisory]
        gauges: { damage: 10, trust: -5 }
