# No.6 アマツ重工（防衛・重要インフラ）
# 元事件は「構造」だけを参考にしたフィクション。会社名・人物名・数字はすべて架空。
id: no06-amatsu
version: '1.0.0'
status: latest
published: '2026-11-08'
sourcePeriod: { ja: '2024年に公表された、遠隔採用を悪用した事例の構造を参考にしたフィクション', en: '' }
difficulty: 5
languages: [ja]
referencesVersion: '2026-11-08'
legalPack: jp
title: { ja: '今年いちばん優秀な新人は、存在しなかった', en: '' }
tagline: { ja: '遠隔の面接を四回通った新人は、端末が届いた朝に消えた。何をどこまで話すかで、会社の信用が決まる。', en: '' }
company:
