name: Deploy to GitHub Pages
# リリースまでは手動起動のみ（本番配信）
on:
  workflow_dispatch:
# ワークフロー全体は読み取りだけ。書き込み権限は deploy ジョブにだけ与える
permissions:
  contents: read
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    # 手動起動でも main 以外のブランチを配信しない
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: npm }
      # 音声素材は非公開リポジトリから取得し、配信物（dist/audio）にだけ含める
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: itsumonotakumi/ytcdb-audio
          token: ${{ secrets.AUDIO_REPO_TOKEN }}
          path: .audio-src
          persist-credentials: false
      - run: |
          cp .audio-src/se/*.mp3 audio/se/
          if ls .audio-src/bgm/*.mp3 >/dev/null 2>&1; then cp .audio-src/bgm/*.mp3 audio/bgm/; fi
          rm -rf .audio-src
      - run: npm ci
      - run: npm run build
        env:
          # シェアの投稿文に載せる URL。ランキング（VITE_API_BASE）はこの版では無効のまま
          VITE_SITE_URL: https://itsumonotakumi.github.io/you-think-you-can-do-better
      - run: npm test
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with: { path: dist }
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
